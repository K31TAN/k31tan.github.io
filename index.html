dforms: rock conditions for a waterfall"}, {"id": "g9-river-landforms:r-g9-2", "level": "easy", "type": "text", "q": "Under a waterfall, the falling water and the loose rocks it swirls around dig out a deep hollow, deeper than the river anywhere else. What is that hollow called? Two words.", "answer": "plunge pool", "accept": ["plunge pool", "a plunge pool", "the plunge pool", "plunge-pool", "Plunge pool"], "hint": "It is named after what the water does when it arrives at the bottom.", "explain": "The answer is a plunge pool. Two processes dig it out: hydraulic action, which is the sheer force of the falling water, and abrasion, which is the swirling rocks grinding at the bed. It matters for what comes next, because the pool undercuts the soft rock further and further back until the hard overhang above collapses into it, and the waterfall shifts a few metres upstream.", "topic": "river landforms: plunge pool"}, {"id": "g9-river-landforms:r-g9-3", "level": "easy", "type": "mc", "q": "On a meander, where is the water slowest and shallowest?", "options": ["On the inside of the bend.", "On the outside of the bend.", "Exactly in the middle of the channel.", "It is the same speed everywhere on a bend."], "answer": "On the inside of the bend.", "hint": "The water on the outside has further to travel round the curve. What does that do to its speed?", "explain": "The answer is on the inside of the bend. Water on the outside has further to travel round the longer curve, so it moves faster, stays deeper and erodes the bank. Water on the inside has less distance to cover, so it slows, loses energy and drops its load. That one difference explains the whole meander: a steep river cliff cut on the outside, and a gently sloping bank of clean pebbles and sand built up on the inside.", "topic": "river landforms: fast and slow water on a bend"}, {"id": "g9-river-landforms:r-g9-4", "level": "medium", "type": "mc", "q": "Blackthorn Force is a waterfall that has moved about 300 m upstream over the last few thousand years. What has it left behind it, and why?", "options": ["A gorge, because the narrow steep sided valley downstream is the track the waterfall has cut as it retreated.", "A flood plain, because the waterfall floods the valley every year.", "An ox bow lake, because the old channel has been cut off.", "A levee, because material has been deposited along the banks."], "answer": "A gorge, because the narrow steep sided valley downstream is the track the waterfall has cut as it retreated.", "hint": "The waterfall used to be 300 m further downstream. What is now standing where it used to be?", "explain": "The answer is a gorge. Every time the overhang collapses, the waterfall moves a little further upstream, and the steep sided slot it leaves behind is simply the path it has walked. So a gorge is not a separate landform that appears from nowhere, it is the record of a retreating waterfall. Flood plains are built by deposition on flat land, ox bow lakes are cut off meanders, and levees are raised banks of sediment at the channel edge.", "topic": "river landforms: gorge formation"}, {"id": "g9-river-landforms:r-g9-5", "level": "medium", "type": "text", "q": "On the inside of a meander the bank slopes gently down to the water and is covered with clean rounded pebbles and sand. What is that feature called? Three words.", "answer": "slip off slope", "accept": ["slip off slope", "slip-off slope", "a slip off slope", "the slip off slope", "slip off slope."], "hint": "It is the opposite side of the bend from the river cliff.", "explain": "The answer is a slip off slope. The water on the inside of a bend is slow and shallow, so it has too little energy to carry its load and drops it, building up a gentle beach of sand and rounded pebbles. Directly opposite, on the outside, the fast water cuts a steep river cliff. One bend, two opposite processes, and the reason is simply that the water is fast on one side and slow on the other.", "topic": "river landforms: slip off slope"}, {"id": "g9-river-landforms:r-g9-6", "level": "medium", "type": "mc", "q": "An ox bow lake forms in stages. Which option lists those stages in the right order?", "options": ["Erosion on the outside and deposition on the inside make the bend into a tight loop, the neck of the loop gets narrower, a flood gives the river enough energy to cut straight across the neck, deposition seals off the old loop, and a horseshoe lake is left behind.", "A horseshoe lake forms first, then the river flows into it, then the neck narrows, then a flood cuts through.", "The river deposits material in a straight line, which forces it to bend, and the bend then fills with water to make a lake.", "A flood cuts a new lake in the flood plain, and the river later joins up with it."], "answer": "Erosion on the outside and deposition on the inside make the bend into a tight loop, the neck of the loop gets narrower, a flood gives the river enough energy to cut straight across the neck, deposition seals off the old loop, and a horseshoe lake is left behind.", "hint": "Start with the bend getting more curved and finish with the lake. The lake is the last thing to exist, not the first.", "explain": "The answer is the first option. The order matters: the bend tightens because the outside is eroded and the inside is built up, the neck between the two sides of the loop gets thinner, a flood provides the energy to cut straight across, and then deposition seals the ends of the old loop off from the channel. The lake exists only at the end. Any answer that starts with the lake has the process backwards, because the lake is the leftover, not the cause.", "topic": "river landforms: order of ox bow lake formation"}, {"id": "g9-river-landforms:r-g9-7", "level": "medium", "type": "mc", "q": "Beside a river, the raised banks right at the channel edge are made of coarse sand and gravel, but 200 m away from the channel the ground is fine mud. Why?", "options": ["Flood water slows the instant it leaves the channel, so it drops the heaviest material first, right at the edge, and only the fine mud is carried further out.", "Flood water speeds up as it leaves the channel, so it carries the gravel furthest.", "Somebody has built the banks up out of gravel on purpose.", "The gravel grows there because the ground is wetter at the edge."], "answer": "Flood water slows the instant it leaves the channel, so it drops the heaviest material first, right at the edge, and only the fine mud is carried further out.", "hint": "Sort by weight. Which material needs the most energy to be carried, and where does the water lose its energy?", "explain": "The answer is the first option. When a river bursts its banks the water suddenly spreads out and slows, so it loses energy immediately and dumps the heaviest material first, right at the channel edge. Repeat that over many floods and those coarse deposits build up into raised natural banks called levees. Only the light fine mud stays suspended long enough to travel out across the flood plain, which is why the ground further away is so fine.", "topic": "river landforms: how levees form"}, {"id": "g9-river-landforms:r-g9-8", "level": "stretch", "type": "mc", "q": "A town builds concrete walls on top of its natural levees to stop flooding. The river carries on depositing sediment on its own bed, so the bed slowly rises as well. Why is this a growing risk over time?", "options": ["The river ends up flowing higher than the town beside it, so if the walls are ever breached the flood is deeper and faster than it would have been.", "The river will eventually run out of water, leaving the town with no supply.", "The concrete walls make the river flow backwards.", "The rising bed makes the river erode the walls from the outside."], "answer": "The river ends up flowing higher than the town beside it, so if the walls are ever breached the flood is deeper and faster than it would have been.", "hint": "Follow two things rising at once: the bed and the walls. Then ask where the town is compared with the water.", "explain": "The answer is the first option. Every year the river deposits more on its bed, so the bed rises, so the walls have to be raised again to hold the same amount of water. Do that for long enough and the river is running along above roof level, held in only by the walls. The defence works right up until the day it does not, and then the flood arrives from above with far more force. That is the honest problem with hard defences, and naming it is what a top answer does.", "topic": "river landforms: risk of raising levees"}], "g10-scale-again": [{"id": "g10-scale-again:r-g10-1", "level": "easy", "type": "mc", "q": "Map C has a scale of 2 cm to 1 km. A footpath measures 11 cm on the map. Which sum gives the real distance in km?", "options": ["11 divided by 2", "2 divided by 11", "11 times 2", "2 times 11"], "answer": "11 divided by 2", "hint": "Measurement on top, scale underneath, every single time.", "explain": "The answer is 11 divided by 2, which gives 5.5 km. The rule never changes: what you measured goes on top, and the number of centimetres that stands for 1 km goes underneath. Doing 2 divided by 11 gives 0.18, which would mean an 11 cm line on the paper is less than a fifth of a kilometre on the ground, and that is the sum done upside down. Multiplying by 2 gives 22, which is the answer for a map at the other scale entirely.", "topic": "map scale: which way round the division goes"}, {"id": "g10-scale-again:r-g10-2", "level": "easy", "type": "text", "q": "Map C, scale 2 cm to 1 km. The car park to the footbridge measures 6 cm. How far is that in km? Write just the number.", "answer": "3", "accept": ["3", "3.0", "3 km", "3km"], "hint": "Divide the centimetres by 2.", "explain": "The answer is 3. Divide the measurement by the scale: 6 divided by 2 is 3. Another way to see it is that three lots of 2 cm fit into 6 cm, and each lot stands for 1 km. At this scale the number of kilometres is always half the number of centimetres, so the answer can never be bigger than the measurement.", "topic": "map scale: converting a measurement on a 2 cm to 1 km map"}, {"id": "g10-scale-again:r-g10-3", "level": "easy", "type": "text", "q": "Map C, scale 2 cm to 1 km. The footbridge to the boathouse measures 4.5 cm. How far is that in km? Write just the number.", "answer": "2.25", "accept": ["2.25", "2.25 km", "2.25km", "2 1/4"], "hint": "Halve the 4 first, then halve the 0.5, then add the two answers together.", "explain": "The answer is 2.25. Split the division in two. Half of 4 is 2, and half of 0.5 is 0.25, so 2 plus 0.25 is 2.25 km. Check it makes sense: 4 cm would be 2 km and 6 cm would be 3 km, so an answer between 2 and 3 is right. Writing 22.5 would be ten times too big, which is the slip to watch for whenever a decimal point is involved.", "topic": "map scale: converting a measurement on a 2 cm to 1 km map"}, {"id": "g10-scale-again:r-g10-4", "level": "medium", "type": "text", "q": "Write 2.25 km in metres. Write just the number.", "answer": "2250", "accept": ["2250", "2250 m", "2250m", "2,250"], "hint": "There are 1000 metres in 1 km, so multiply by 1000, which moves every digit three places.", "explain": "The answer is 2250. There are 1000 m in 1 km, so 2.25 km is 2.25 times 1000, which is 2250 m. Do it in parts if that helps: 2 km is 2000 m and 0.25 km is a quarter of 1000, which is 250, and 2000 plus 250 is 2250. The classic error is to move the decimal point one place and write 225, which would be less than a quarter of a kilometre. Always ask whether the answer is bigger than 2000, because 2.25 km has to be.", "topic": "map scale: converting km to metres"}, {"id": "g10-scale-again:r-g10-5", "level": "medium", "type": "mc", "q": "On Map C, a measurement of 6 cm works out at 3 km. A longer line on the same map measures 11 cm. Without dividing anything, which of these could its real distance be?", "options": ["5.5 km", "2.2 km", "0.55 km", "22 km"], "answer": "5.5 km", "hint": "On the same map, a longer measurement must always give a longer real distance. Which options are smaller than 3 km?", "explain": "The answer is 5.5 km. The sense check does the work here: 11 cm is longer on the paper than 6 cm, so the real distance has to be more than 3 km. That rules out 2.2 km and 0.55 km immediately, because both are smaller. 22 km is far too big, since it is more than seven times the 3 km you already know, while 11 cm is not even twice 6 cm. Doing this check first means a flipped division or a lost decimal point can never get past you.", "topic": "map scale: sense checking against another reading"}, {"id": "g10-scale-again:r-g10-6", "level": "medium", "type": "text", "q": "Map D now, and the scale is different: 4 cm stands for 1 km. The station to the leisure centre measures 14 cm. How far is that in km? Write just the number.", "answer": "3.5", "accept": ["3.5", "3.5 km", "3.5km", "3 1/2"], "hint": "Same rule, different scale. Divide the measurement by 4 this time, not by 2.", "explain": "The answer is 3.5. Divide the measurement by the scale: 14 divided by 4. Twelve divided by 4 is 3, and the remaining 2 divided by 4 is 0.5, so the answer is 3.5 km. The trap on this map is habit. Halving 14 gives 7, which would be right on a 2 cm map and is exactly double the true answer here. Read the scale before the ruler touches the paper.", "topic": "map scale: applying a different scale of 4 cm to 1 km"}, {"id": "g10-scale-again:r-g10-7", "level": "medium", "type": "text", "q": "Map D, scale 4 cm to 1 km. Working backwards. A new cycle path will be 2.25 km long on the ground. How many cm will it measure on the map? Write just the number.", "answer": "9", "accept": ["9", "9 cm", "9cm", "9.0"], "hint": "You are going the other way this time, from real distance back to paper, so the divide becomes a multiply.", "explain": "The answer is 9. Going forwards you divide by 4, so going backwards you multiply by 4: 2.25 times 4. Two times 4 is 8, and 0.25 times 4 is 1, so 8 plus 1 is 9 cm. Check it forwards to be sure: 9 divided by 4 is 2.25, which is what you started with. Dividing here instead of multiplying would give 0.5625 cm, and half a centimetre of paper cannot possibly hold over two kilometres on a map at this scale.", "topic": "map scale: working backwards from km to cm"}, {"id": "g10-scale-again:r-g10-8", "level": "stretch", "type": "text", "q": "Map C, scale 2 cm to 1 km. A ranger walks from the car park to the trig point, which measures 7 cm, and then from the trig point to the bothy, which measures 4.5 cm. What is the TOTAL distance in km? Write just the number.", "answer": "5.75", "accept": ["5.75", "5.75 km", "5.75km", "5 3/4"], "hint": "Add the two centimetre readings together first, then halve the total once.", "explain": "The answer is 5.75. Add the paper measurements first: 7 plus 4.5 is 11.5 cm. Then divide once by the scale: half of 11 is 5.5 and half of 0.5 is 0.25, so 5.5 plus 0.25 is 5.75 km. You could convert each leg separately, 3.5 plus 2.25, and you would get the same answer. Adding first is safer because you only divide once, so there is only one chance to slip. Sense check it: 11.5 cm is nearly twice 6 cm, and 6 cm is 3 km, so an answer just under 6 km is exactly the right size.", "topic": "map scale: multi step total distance with a sense check"}], "g11-population": [{"id": "g11-population:r-g11-1", "level": "easy", "type": "mc", "q": "A district has a population density of 500 people per km2. What does that number mean?", "options": ["On average, 500 people live in each square kilometre of the district.", "There are 500 people living in the district altogether.", "The district covers an area of 500 km2.", "About 500 people move into the district every year."], "answer": "On average, 500 people live in each square kilometre of the district.", "hint": "Read the units out loud: people per square kilometre. Per means for each one.", "explain": "The answer is that on average 500 people live in each square kilometre. Density is a crowding number, not a total. The units tell you exactly what it means, because per square kilometre means for each single square kilometre. Note the word average as well: the real people may be packed into one corner and absent from the rest, which is why distribution, meaning where people live, is a separate idea from density, meaning how crowded it is.", "topic": "population: what density means"}, {"id": "g11-population:r-g11-2", "level": "easy", "type": "mc", "q": "A village has 600 people and covers 4 km2. Which sum gives its population density?", "options": ["600 divided by 4", "4 divided by 600", "600 times 4", "600 plus 4"], "answer": "600 divided by 4", "hint": "People per square kilometre. Whatever comes before the word per goes on top.", "explain": "The answer is 600 divided by 4, which is 150 people per km2. Population goes on top and area underneath, every time. Doing 4 divided by 600 gives 0.0067, which would mean less than one person in each square kilometre of a village with 600 people in it, and that is the sum upside down. Multiplying gives 2400, which is far bigger than the number of people who actually exist there.", "topic": "population: the density formula"}, {"id": "g11-population:r-g11-3", "level": "easy", "type": "text", "q": "Ravensbeck village has 840 people and an area of 7 km2. What is its population density in people per km2? Write just the number.", "answer": "120", "accept": ["120", "120 people per km2", "120 people", "120/km2"], "hint": "Population divided by area. People on top.", "explain": "The answer is 120. Divide the population by the area: 840 divided by 7 is 120 people per km2. If it helps, break it up: 700 divided by 7 is 100, and 140 divided by 7 is 20, so 100 plus 20 is 120. Check the size of the answer before you move on. There are 840 people spread over only 7 square kilometres, so the answer has to be in the hundreds.", "topic": "population: calculating density"}, {"id": "g11-population:r-g11-4", "level": "medium", "type": "text", "q": "The Ashmoor region has 2,400,000 people and an area of 30,000 km2. What is its population density in people per km2? Write just the number.", "answer": "80", "accept": ["80", "80 people per km2", "80 people"], "hint": "Knock the same number of zeros off both numbers first, then divide the small numbers that are left.", "explain": "The answer is 80. Big numbers are easier if you cancel zeros first. Take three zeros off each: 2,400,000 becomes 2400 and 30,000 becomes 30. Then 2400 divided by 30 is 80 people per km2. Cancelling the same number of zeros from both sides does not change the answer, and it turns a frightening sum into one you can do in your head.", "topic": "population: calculating density with large numbers"}, {"id": "g11-population:r-g11-5", "level": "medium", "type": "mc", "q": "A family is deciding whether to leave their village. Which one of these is a PUSH factor?", "options": ["The land you farm has flooded three years running and the harvest has failed each time.", "The city has colleges you could go to.", "There is better health care available in the city.", "Wages in the city are higher than in your village."], "answer": "The land you farm has flooded three years running and the harvest has failed each time.", "hint": "A push factor is something bad about where you already are. A pull factor is something good about where you might go.", "explain": "The answer is the failed harvests. A push factor is something wrong with the place you are living that pushes you to leave, such as no work, poor soil, flooding, drought or war. The other three are all attractive things about somewhere else, so they are pull factors. The quickest test is to ask where the thing is happening: at home means push, at the destination means pull.", "topic": "population: identifying a push factor"}, {"id": "g11-population:r-g11-6", "level": "medium", "type": "mc", "q": "The same family is looking at a city 200 km away. Which one of these is a PULL factor?", "options": ["The city has far more jobs available, and they pay better.", "There is no work at all in your village.", "The soil where you live has stopped producing a decent crop.", "Fighting has broken out near your home."], "answer": "The city has far more jobs available, and they pay better.", "hint": "Ask which option describes the place somebody is moving TO.", "explain": "The answer is that the city has more jobs and better pay. A pull factor is something good about the destination that draws people towards it: work, wages, schools, hospitals, safety. The other three are all problems at home, so they are push factors. Most real migration involves both at once, which is why a strong answer names a push and a pull and links them, rather than listing four things at random.", "topic": "population: identifying a pull factor"}, {"id": "g11-population:r-g11-7", "level": "medium", "type": "text", "q": "Working backwards. A district has a population density of 350 people per km2 and an area of 20 km2. How many people live there? Write just the number.", "answer": "7000", "accept": ["7000", "7,000", "7000 people", "seven thousand"], "hint": "Density is people divided by area, so going the other way, people is density times area.", "explain": "The answer is 7000. Density means people for each square kilometre, so if each square kilometre holds 350 people and there are 20 of them, you multiply: 350 times 20 is 7000. Do it as 350 times 2 is 700, then add the zero back for the 20. The trap here is dividing out of habit, because the forward version of the question is a divide. Ask yourself which number you are missing first, then decide the operation.", "topic": "population: working backwards to find population"}, {"id": "g11-population:r-g11-8", "level": "stretch", "type": "text", "q": "Working backwards again. A city has 1,440,000 people and a population density of 4,800 people per km2. What is its area in km2? Write just the number.", "answer": "300", "accept": ["300", "300 km2", "300 square kilometres"], "hint": "Each square kilometre holds 4800 people. How many of those does it take to hold 1,440,000?", "explain": "The answer is 300. Ask how many lots of 4800 fit into 1,440,000, which means dividing: 1,440,000 divided by 4800 is 300 km2. Cancel two zeros from each side first and it becomes 14,400 divided by 48, which is 300. Check it forwards: 300 times 4800 is 1,440,000, which matches the population you were given. That check takes ten seconds and catches an upside down division every time.", "topic": "population: working backwards to find area"}], "de6-wordorder-rebuild": [{"id": "de6-wordorder-rebuild:r-de6-1", "level": "easy", "type": "mc", "q": "Which word is the verb in this sentence? Ich spiele Fussball am Samstag.", "options": ["spiele", "Ich", "Fussball", "Samstag"], "answer": "spiele", "hint": "The verb is the doing word, and it is the one that changes its ending depending on who is doing it.", "explain": "The answer is spiele. It comes from spielen, to play, and it has changed its ending to match ich, so it is the conjugated verb. Ich is the person, Fussball is the thing being played and am Samstag is the time. Finding the verb first is always step one, because the whole rule for German word order is about where that one word sits.", "topic": "word order: finding the verb"}, {"id": "de6-wordorder-rebuild:r-de6-2", "level": "easy", "type": "mc", "q": "How many ideas is Um halb acht?", "options": ["One idea", "Two ideas", "Three ideas", "Four ideas"], "answer": "One idea", "hint": "Try splitting it. Does either half still mean anything on its own?", "explain": "The answer is one idea. Um halb acht is three words, but you cannot break it up, because um belongs to halb acht and neither half makes sense alone. That is the whole point of boxing: you count ideas and not words. Counting words here would make you think the verb belongs in position two of the words, which pushes it into the wrong place completely.", "topic": "word order: counting ideas not words"}, {"id": "de6-wordorder-rebuild:r-de6-3", "level": "easy", "type": "mc", "q": "In a German statement, box one can hold anything you like. What must box two always hold?", "options": ["The conjugated verb", "The person doing the action", "The time phrase", "The place"], "answer": "The conjugated verb", "hint": "There is only one thing in a German statement whose position never changes.", "explain": "The answer is the conjugated verb, the one carrying the ending. Box one is free: it can hold the person, a time phrase or a place. Box two is fixed. When something other than the person goes in box one, the person is pushed out and lands in box three, just behind the verb. That is why Am Montag gehe ich is right and Am Montag ich gehe is wrong.", "topic": "word order: the verb second rule"}, {"id": "de6-wordorder-rebuild:r-de6-4", "level": "easy", "type": "text", "q": "Put these words into a correct German sentence: spielt / mein Bruder / Fussball", "answer": "Mein Bruder spielt Fussball.", "accept": ["Mein Bruder spielt Fussball.", "Mein Bruder spielt Fussball", "Mein Bruder spielt Fußball.", "Mein Bruder spielt Fußball", "mein Bruder spielt Fussball"], "hint": "Box the ideas first. Mein Bruder is one idea. Then put the verb in box two.", "explain": "The answer is Mein Bruder spielt Fussball. Box one holds mein Bruder, which is one idea because all three words name one person. Box two holds spielt, the verb. Box three holds Fussball. Spielt is the correct ending, because mein Bruder is he, and er spielt takes a t.", "topic": "word order: normal statement order"}, {"id": "de6-wordorder-rebuild:r-de6-5", "level": "medium", "type": "mc", "q": "Which sentence is correct German?", "options": ["Am Dienstag gehe ich ins Kino.", "Am Dienstag ich gehe ins Kino.", "Ich am Dienstag gehe ins Kino.", "Am Dienstag ich ins Kino gehe."], "answer": "Am Dienstag gehe ich ins Kino.", "hint": "Box the ideas in each one and count. The verb has to be sitting in box two.", "explain": "The answer is Am Dienstag gehe ich ins Kino. Box it up and you get [Am Dienstag] [gehe] [ich] [ins Kino], so the verb is in box two and ich has been pushed into box three, which is exactly what should happen. In the second option the verb is in box three, which is the most common mistake in the whole language. The third has two ideas before the verb. The fourth sends the verb to the end, which is not what a normal statement does.", "topic": "word order: fronted time phrase"}, {"id": "de6-wordorder-rebuild:r-de6-6", "level": "medium", "type": "text", "q": "Rewrite this sentence so that it starts with Um sieben Uhr: Ich esse Fruehstueck.", "answer": "Um sieben Uhr esse ich Fruehstueck.", "accept": ["Um sieben Uhr esse ich Fruehstueck.", "Um sieben Uhr esse ich Fruehstueck", "Um sieben Uhr esse ich Frühstück.", "Um sieben Uhr esse ich Frühstück"], "hint": "Um sieben Uhr is one idea and it takes box one. Something has to move out of the way.", "explain": "The answer is Um sieben Uhr esse ich Fruehstueck. Um sieben Uhr is a single idea, so it fills box one on its own. The verb esse must stay in box two, so ich is pushed out to box three. Writing Um sieben Uhr ich esse Fruehstueck puts the verb in box three, which is the error to watch for. The verb ending does not change when you do this, because the person is still ich.", "topic": "word order: fronted time phrase of three words"}, {"id": "de6-wordorder-rebuild:r-de6-7", "level": "medium", "type": "text", "q": "Correct this sentence: Am Sonntag ich lerne Deutsch.", "answer": "Am Sonntag lerne ich Deutsch.", "accept": ["Am Sonntag lerne ich Deutsch.", "Am Sonntag lerne ich Deutsch", "am Sonntag lerne ich Deutsch"], "hint": "Box the ideas. Which box is the verb sitting in at the moment, and which box does it need to be in?", "explain": "The answer is Am Sonntag lerne ich Deutsch. Boxing the original gives [Am Sonntag] [ich] [lerne] [Deutsch], so the verb is in box three. Swap ich and lerne and the verb moves into box two, where it belongs. Nothing else changes, and lerne keeps its ending because ich is still the person doing it. This is the same swap every time: the verb and the person trade places.", "topic": "word order: correcting verb third"}, {"id": "de6-wordorder-rebuild:r-de6-8", "level": "stretch", "type": "text", "q": "Put these into one sentence, starting with the time phrase: Pizza / essen / wir / am Abend", "answer": "Am Abend essen wir Pizza.", "accept": ["Am Abend essen wir Pizza.", "Am Abend essen wir Pizza", "am Abend essen wir Pizza"], "hint": "Am Abend goes in box one. Then the verb, then the people, then the thing.", "explain": "The answer is Am Abend essen wir Pizza. Box one holds am Abend, the time phrase you were told to start with. Box two holds essen, and the ending is right because wir essen is the we form. Wir is pushed to box three and Pizza follows. Writing Am Abend wir essen Pizza is the trap, because it leaves the verb in box three.", "topic": "word order: building a sentence from scrambled ideas"}], "de7-cases": [{"id": "de7-cases:r-de7-1", "level": "easy", "type": "mc", "q": "In the sentence Der Mann trinkt den Kaffee, who or what is doing the action?", "options": ["Der Mann", "den Kaffee", "trinkt", "Nobody, there is no subject"], "answer": "Der Mann", "hint": "Ask the first question: who is doing it?", "explain": "The answer is Der Mann. Ask the two questions in order. Who is doing the drinking? The man, so he is the subject and keeps der. Who or what is having it done to them? The coffee, so den Kaffee is the direct object, and that is why der Kaffee has become den Kaffee. Trinkt is the verb, not a person or a thing.", "topic": "cases: finding the subject"}, {"id": "de7-cases:r-de7-2", "level": "easy", "type": "mc", "q": "Zug is a masculine noun, so on its own it is der Zug. Which word for the goes in the gap? Ich sehe ___ Zug.", "options": ["den", "der", "das", "die"], "answer": "den", "hint": "Is the train doing the seeing, or having the seeing done to it?", "explain": "The answer is den. The train is the thing being seen, so it is the direct object, and in the object slot a der word changes to den. Ich is the one doing the seeing, so ich is the subject. Leaving it as der Zug is the classic slip, and it is the whole point of this topic: der is the only word that changes, so there is only one change to remember.", "topic": "cases: accusative den"}, {"id": "de7-cases:r-de7-3", "level": "easy", "type": "mc", "q": "Which words for the actually change when the noun becomes the direct object?", "options": ["Only der words", "der and die words", "das and die words", "All of them"], "answer": "Only der words", "hint": "Think about how many changes you actually have to learn.", "explain": "The answer is only der words. Der becomes den in the object slot, and that is the whole change. Die stays die, das stays das, and plural die stays die. The same pattern follows through to ein, which becomes einen, and mein, which becomes meinen, again only on der words. Knowing that only one word changes stops you hunting for changes that do not exist.", "topic": "cases: which genders change"}, {"id": "de7-cases:r-de7-4", "level": "easy", "type": "text", "q": "Fill the gap with der or den: ___ Bus faehrt um acht Uhr.", "answer": "Der", "accept": ["Der", "der", "Der Bus", "der Bus"], "hint": "Who or what is doing the action of driving off here? Is there anything having it done to it?", "explain": "The answer is Der. The bus is the one doing the action, so it is the subject, and a der word in the subject slot keeps der. There is no direct object in this sentence at all, because nothing is having anything done to it. Den is only for the object slot, so it cannot be right here.", "topic": "cases: nominative der"}, {"id": "de7-cases:r-de7-5", "level": "medium", "type": "text", "q": "Fill the gap with der or den: Ich esse ___ Kuchen.", "answer": "den", "accept": ["den", "den Kuchen"], "hint": "Ich is doing the eating. So what job is the cake doing in this sentence?", "explain": "The answer is den. Kuchen is a der word, and here the cake is having the action done to it, so it is the direct object and der becomes den. Ich is the subject. Test yourself by turning it round: if the cake were doing something, for example Der Kuchen ist gut, it would keep der.", "topic": "cases: der to den after essen"}, {"id": "de7-cases:r-de7-6", "level": "medium", "type": "text", "q": "Fill the gap with ein or einen: Ich sehe ___ Film.", "answer": "einen", "accept": ["einen", "einen Film"], "hint": "Film is a der word. Ein follows exactly the same rule that der does.", "explain": "The answer is einen. Film is a der word, and the film is the thing being seen, so it is the direct object. In the object slot der becomes den, and ein becomes einen in exactly the same way. If the film were the subject, for example Ein Film beginnt um acht Uhr, it would stay as ein.", "topic": "cases: ein to einen"}, {"id": "de7-cases:r-de7-7", "level": "medium", "type": "text", "q": "Write this in German: The boy eats the apple. The word for boy is Junge and it is a der word. The word for apple is Apfel and it is also a der word.", "answer": "Der Junge isst den Apfel.", "accept": ["Der Junge isst den Apfel.", "Der Junge isst den Apfel", "der Junge isst den Apfel"], "hint": "Two der words in one sentence. Work out which one is doing the eating before you write anything.", "explain": "The answer is Der Junge isst den Apfel. The boy is doing the eating, so he is the subject and keeps der. The apple is having it done to it, so it is the direct object and der becomes den. The verb is isst, because essen changes in the er form. Getting the two words the wrong way round would say that the apple was eating the boy, which is exactly how much work den is doing here.", "topic": "cases: subject and object in one sentence"}, {"id": "de7-cases:r-de7-8", "level": "stretch", "type": "text", "q": "Write this in German: On Friday my sister buys the cake. Start with Am Freitag. The word for cake is Kuchen and it is a der word.", "answer": "Am Freitag kauft meine Schwester den Kuchen.", "accept": ["Am Freitag kauft meine Schwester den Kuchen.", "Am Freitag kauft meine Schwester den Kuchen", "am Freitag kauft meine Schwester den Kuchen"], "hint": "Two rules at once. The time phrase takes box one, so the verb comes next, and then work out der or den for the cake.", "explain": "The answer is Am Freitag kauft meine Schwester den Kuchen. Box one is am Freitag, so the verb kauft must be in box two, which pushes meine Schwester into box three. Schwester is a die word, so it stays meine and does not change. Kuchen is a der word and it is the thing being bought, so it becomes den Kuchen. Writing Am Freitag meine Schwester kauft would put the verb in box three, which is the error from day one showing up again.", "topic": "cases: accusative combined with verb second"}], "de8-vocab-daily": [{"id": "de8-vocab-daily:r-de8-1", "level": "easy", "type": "mc", "q": "You are writing the noun Schule in your vocabulary book. Which form should you learn it in?", "options": ["die Schule", "der Schule", "das Schule", "Schule on its own"], "answer": "die Schule", "hint": "The gender is part of the word, like a surname. And Schule is feminine.", "explain": "The answer is die Schule. Learning Schule on its own is learning half a word, because you will need the gender every time you use it in a sentence. Schule is feminine, so it takes die. Doing this from the start saves you guessing later, and it is why the gender is written next to every noun in this course.", "topic": "vocabulary: gender of Schule"}, {"id": "de8-vocab-daily:r-de8-2", "level": "easy", "type": "mc", "q": "Which day of the week is Donnerstag?", "options": ["Thursday", "Tuesday", "Wednesday", "Sunday"], "answer": "Thursday", "hint": "Say the German and the English out loud next to each other. The first sounds are close.", "explain": "The answer is Thursday. Donnerstag and Thursday both come from the old name of the same god of thunder, and Donner is still the German word for thunder, which makes it easier to hold. Dienstag is Tuesday and Mittwoch is Wednesday, and those two are the ones people mix up with it because the order in the week is Dienstag, Mittwoch, Donnerstag.", "topic": "vocabulary: days of the week"}, {"id": "de8-vocab-daily:r-de8-3", "level": "easy", "type": "text", "q": "Write on Sunday in German.", "answer": "am Sonntag", "accept": ["am Sonntag", "Am Sonntag", "am sonntag"], "hint": "All seven days are der words, and on a day always uses the same small word in front.", "explain": "The answer is am Sonntag. On a day is always am plus the day, for all seven days, so am Montag, am Dienstag, am Mittwoch and so on. There is no exception to learn here. Writing auf Sonntag or in Sonntag is a direct translation from English, and German does not do it that way.", "topic": "vocabulary: saying on a day"}, {"id": "de8-vocab-daily:r-de8-4", "level": "easy", "type": "mc", "q": "What does halb sieben mean?", "options": ["Half past six", "Half past seven", "Seven o'clock", "Six o'clock"], "answer": "Half past six", "hint": "German counts towards the next hour, not away from the last one.", "explain": "The answer is half past six. German halb counts forwards to the hour that is coming, so halb sieben means halfway to seven, which is 6.30. English counts backwards from the hour just gone, which is why half past six sounds like it should be halb sechs. It is not. Take one off the German number and you get the English hour: halb sieben is 6.30, halb neun is 8.30.", "topic": "time: the halb trap"}, {"id": "de8-vocab-daily:r-de8-5", "level": "medium", "type": "text", "q": "Write the German for the teacher, when the teacher is female.", "answer": "die Lehrerin", "accept": ["die Lehrerin", "Die Lehrerin", "Lehrerin", "die lehrerin"], "hint": "Start from der Lehrer and add the ending that German uses for a female job title.", "explain": "The answer is die Lehrerin. A male teacher is der Lehrer. Adding the ending in makes the female version, and every noun ending in in is a die word, so it becomes die Lehrerin. The same pattern gives der Schueler and die Schuelerin for a school pupil. Writing die Lehrer would mix a female article with a male noun.", "topic": "vocabulary: gender of Lehrer"}, {"id": "de8-vocab-daily:r-de8-6", "level": "medium", "type": "text", "q": "Write this in German: On Thursday I play football. Start with Am Donnerstag.", "answer": "Am Donnerstag spiele ich Fussball.", "accept": ["Am Donnerstag spiele ich Fussball.", "Am Donnerstag spiele ich Fussball", "Am Donnerstag spiele ich Fußball.", "Am Donnerstag spiele ich Fußball", "am Donnerstag spiele ich Fussball"], "hint": "The day goes in box one, so the verb has to come straight after it.", "explain": "The answer is Am Donnerstag spiele ich Fussball. Am Donnerstag is one idea in box one, spiele is the verb in box two, and ich is pushed out to box three. The ending on spiele is right because ich is still the person doing it, and moving the time phrase to the front never changes the verb ending. Am Donnerstag ich spiele Fussball is the version to avoid.", "topic": "vocabulary: days combined with verb second"}, {"id": "de8-vocab-daily:r-de8-7", "level": "medium", "type": "mc", "q": "Three of these nouns take the same word for the. Which one is the odd one out?", "options": ["das Buch", "die Schule", "die Tuer", "die Lehrerin"], "answer": "das Buch", "hint": "Look at the small word in front of each noun, not at what the nouns mean.", "explain": "The answer is das Buch. Schule, Tuer and Lehrerin are all die words, and Buch is the only das word in the list. The meanings have nothing to do with it, which is exactly why gender has to be learned attached to each noun rather than worked out. Nouns ending in in, like Lehrerin, are reliably die words, which is one of the few patterns worth trusting.", "topic": "vocabulary: sorting nouns by gender"}, {"id": "de8-vocab-daily:r-de8-8", "level": "stretch", "type": "text", "q": "Write this in German: On Sunday my sister plays football in the park. Start with Am Sonntag. Use im Park for in the park.", "answer": "Am Sonntag spielt meine Schwester Fussball im Park.", "accept": ["Am Sonntag spielt meine Schwester Fussball im Park.", "Am Sonntag spielt meine Schwester Fussball im Park", "Am Sonntag spielt meine Schwester Fußball im Park.", "Am Sonntag spielt meine Schwester Fußball im Park"], "hint": "Time phrase in box one, verb in box two, then the person. Check the verb ending against who is playing.", "explain": "The answer is Am Sonntag spielt meine Schwester Fussball im Park. Am Sonntag fills box one, so spielt takes box two and meine Schwester is pushed to box three. The ending is spielt and not spiele, because my sister is she, not I, and that is the ending people forget once they are concentrating on the word order. Schwester is a die word, so my sister is meine Schwester.", "topic": "vocabulary: full sentence with day, subject and place"}], "de9-perfect-tense": [{"id": "de9-perfect-tense:r-de9-1", "level": "easy", "type": "mc", "q": "A perfect tense sentence has two pieces of verb. Which piece waits until the very end of the sentence?", "options": ["The past participle", "The form of haben", "The subject", "The time phrase"], "answer": "The past participle", "hint": "One piece sits in the normal verb slot and one piece goes to the end.", "explain": "The answer is the past participle. The form of haben does the normal job in box two, and the participle waits at the very end, after everything else in the sentence. So Gestern habe ich Pizza gegessen has habe in box two and gegessen right at the end. Putting the participle straight after haben is the most common mistake, and it makes the sentence sound wrong to any German ear.", "topic": "perfect tense: position of the participle"}, {"id": "de9-perfect-tense:r-de9-2", "level": "easy", "type": "mc", "q": "What is the past participle of kaufen, to buy?", "options": ["gekauft", "gekaufen", "kaufte", "gekaufte"], "answer": "gekauft", "hint": "Regular participles are built the same way every time: ge on the front, the stem, then one letter on the end.", "explain": "The answer is gekauft. Take kaufen, cut off the en to leave the stem kauf, then put ge on the front and t on the end. That gives gekauft. The same recipe gives gespielt from spielen, gemacht from machen and gelernt from lernen. The ending en belongs to the group of irregular participles like gegessen and getrunken, which have to be learned one by one.", "topic": "perfect tense: regular participle"}, {"id": "de9-perfect-tense:r-de9-3", "level": "easy", "type": "text", "q": "Fill the gap with the right form of haben: Ich ___ Tennis gespielt.", "answer": "habe", "accept": ["habe", "ich habe", "Habe"], "hint": "Run through haben with each person: ich, du, er. Which one goes with ich?", "explain": "The answer is habe. Haben goes ich habe, du hast, er hat, wir haben, ihr habt, sie haben. Ich takes habe. The participle gespielt is already sitting at the end where it belongs, so the only thing to decide is which form of haben matches the person, exactly as you would in the present tense.", "topic": "perfect tense: haben with ich"}, {"id": "de9-perfect-tense:r-de9-4", "level": "easy", "type": "text", "q": "Fill the gap with the right form of haben: Mein Bruder ___ Wasser getrunken.", "answer": "hat", "accept": ["hat", "Hat"], "hint": "Mein Bruder is one person, and he is an er. Which form of haben goes with er?", "explain": "The answer is hat. Mein Bruder is he, so it takes the er form, and er hat is the form you need. Watch this one, because it is easy to write haben when the subject is two words long. The test is to swap the subject for er in your head: er hat Wasser getrunken sounds right, er haben does not.", "topic": "perfect tense: haben with er"}, {"id": "de9-perfect-tense:r-de9-5", "level": "medium", "type": "text", "q": "Write the past participle of essen, to eat.", "answer": "gegessen", "accept": ["gegessen", "Gegessen", "gegessen."], "hint": "This one is in the irregular group, so it ends in en and it changes inside as well.", "explain": "The answer is gegessen. Essen is one of the common verbs that do not follow the ge plus stem plus t recipe. It takes ge on the front, ends in en, and gains an extra letter in the middle, giving gegessen rather than geessen. Learn it alongside the others in that group: trinken becomes getrunken, sehen becomes gesehen, lesen becomes gelesen.", "topic": "perfect tense: irregular participle"}, {"id": "de9-perfect-tense:r-de9-6", "level": "medium", "type": "text", "q": "Put this into the perfect tense: Ich mache meine Hausaufgaben.", "answer": "Ich habe meine Hausaufgaben gemacht.", "accept": ["Ich habe meine Hausaufgaben gemacht.", "Ich habe meine Hausaufgaben gemacht", "ich habe meine Hausaufgaben gemacht"], "hint": "Two moves. Put the right form of haben where the old verb was, and send the participle to the end.", "explain": "The answer is Ich habe meine Hausaufgaben gemacht. Habe goes into box two where mache used to be, and machen becomes the participle gemacht, which is sent to the very end after meine Hausaufgaben. Writing Ich habe gemacht meine Hausaufgaben keeps the English word order and leaves the participle stranded in the middle, which is the error to check for every time.", "topic": "perfect tense: converting a present tense sentence"}, {"id": "de9-perfect-tense:r-de9-7", "level": "medium", "type": "text", "q": "Correct this sentence: Gestern ich habe Pizza gegessen.", "answer": "Gestern habe ich Pizza gegessen.", "accept": ["Gestern habe ich Pizza gegessen.", "Gestern habe ich Pizza gegessen", "gestern habe ich Pizza gegessen"], "hint": "Gestern is one idea and it is in box one. So which word has to come next?", "explain": "The answer is Gestern habe ich Pizza gegessen. Box the ideas and the original reads [Gestern] [ich] [habe] [Pizza] [gegessen], so habe is sitting in box three. Habe is the piece that has to be in box two, so it swaps with ich. The participle gegessen was already correct at the end and does not move. The verb second rule still applies in the past, and habe is the word it applies to.", "topic": "perfect tense: fixing verb third in the past"}, {"id": "de9-perfect-tense:r-de9-8", "level": "stretch", "type": "text", "q": "Write this in German: Yesterday my brother read a book. Start with Gestern. The word for book is Buch and it is a das word.", "answer": "Gestern hat mein Bruder ein Buch gelesen.", "accept": ["Gestern hat mein Bruder ein Buch gelesen.", "Gestern hat mein Bruder ein Buch gelesen", "gestern hat mein Bruder ein Buch gelesen"], "hint": "Three things to get right: the form of haben for a he, the word for a in front of a das word, and where the participle goes.", "explain": "The answer is Gestern hat mein Bruder ein Buch gelesen. Gestern fills box one, so the form of haben has to be in box two, and mein Bruder is he, so it is hat and not habe. Buch is a das word, and das words never change in the object slot, so a book stays ein Buch. Lesen is irregular and its participle is gelesen, which goes right at the end, after ein Buch.", "topic": "perfect tense: full sentence with a noun subject"}], "de10-speaking": [{"id": "de10-speaking:r-de10-1", "level": "easy", "type": "mc", "q": "How do you say the letters ei, as in the word drei?", "options": ["Like the English word eye", "Like ee in see", "Like ay in day", "Like oy in boy"], "answer": "Like the English word eye", "hint": "For these vowel pairs, say the name of the second letter.", "explain": "The answer is like the English word eye, so drei sounds like dry. The rule for vowel pairs is to say the second letter's name: in ei the second letter is i, which is said eye. That is why mein sounds like mine and Bleistift starts like blyshtift. The pair ei and ie is the one people swap, so say them out loud together until the difference sticks.", "topic": "pronunciation: the ei sound"}, {"id": "de10-speaking:r-de10-2", "level": "easy", "type": "mc", "q": "How do you say the letters ie, as in the word vier?", "options": ["Like ee in see", "Like the English word eye", "Like ay in day", "Like oo in food"], "answer": "Like ee in see", "hint": "Same rule as before: say the second letter of the pair.", "explain": "The answer is like ee in see, so vier sounds like feer, with the v said as an f. The second letter of ie is e, and the German e is said ay or ee depending on the word, which is why sieben is ZEE-ben. Hold ei and ie side by side: drei is dry, vier is feer. Getting them the wrong way round is the single most common reading mistake in German.", "topic": "pronunciation: the ie sound"}, {"id": "de10-speaking:r-de10-3", "level": "easy", "type": "mc", "q": "How do you say the letters eu, as in the word neun?", "options": ["Like oy in boy", "Like ee in see", "Like the English word eye", "Like oo in food"], "answer": "Like oy in boy", "hint": "It is the sound in the word Deutsch.", "explain": "The answer is like oy in boy, so neun sounds like noyn and Deutsch sounds like doytch. The eu pair does not follow the say the second letter rule, so it has to be learned on its own. Once you have it, you can read heute, Freund and Europa correctly without ever having seen them before.", "topic": "pronunciation: the eu sound"}, {"id": "de10-speaking:r-de10-4", "level": "easy", "type": "text", "q": "Say the word Woche out loud, then write which English letter the German w sounds like.", "answer": "v", "accept": ["v", "V", "the letter v", "a v", "like a v"], "hint": "It is not the English w sound. Your top teeth touch your bottom lip.", "explain": "The answer is v. German w is always said like an English v, so Woche starts like vocker and Wasser starts like vasser. It goes with the other consonant swaps in the same set: v is said like an f, so vier is feer, and z is said ts. If you say Woche with an English w, a German listener will still understand you, but the sound is wrong and it is a quick fix.", "topic": "pronunciation: the letter w"}, {"id": "de10-speaking:r-de10-5", "level": "medium", "type": "mc", "q": "Which English sound does the z in Zug make?", "options": ["ts as in cats", "z as in zoo", "s as in sun", "sh as in ship"], "answer": "ts as in cats", "hint": "It is two sounds squashed together, and it is not the English z.", "explain": "The answer is ts as in cats, so Zug sounds like tsook. German z is never the buzzing English z. The same sound turns up in zehn, said tsayn, and in zwei, said tsvy, where you also get the w said as a v. Reading Zug as zoog is an English habit rather than a German sound.", "topic": "pronunciation: the letter z"}, {"id": "de10-speaking:r-de10-6", "level": "medium", "type": "mc", "q": "Which of these words starts with a sh sound when you say it out loud?", "options": ["Stadt", "Wasser", "Buch", "Tag"], "answer": "Stadt", "hint": "There is a rule about st and sp when they come at the start of a word.", "explain": "The answer is Stadt, which is said shtat. At the start of a word, st is said sht and sp is said shp, so Stuhl is shtool and spielen is SHPEE-len. In the middle of a word the rule does not apply, which is why Wasser keeps its normal s sound. Buch starts with a b and Tag starts with a t, so neither has anything to do with this rule.", "topic": "pronunciation: st at the start of a word"}, {"id": "de10-speaking:r-de10-7", "level": "medium", "type": "text", "q": "Read this out loud, then answer in English. Am Montag fahre ich um sieben Uhr mit dem Bus zur Schule. Um halb neun beginnt die Schule. Um vier Uhr bin ich zu Hause. What time does school start?", "answer": "half past eight", "accept": ["half past eight", "8.30", "8:30", "half past 8", "eight thirty", "half eight"], "hint": "Find the line about die Schule beginning, then think carefully about what halb does to the number.", "explain": "The answer is half past eight. The line is Um halb neun beginnt die Schule, and halb neun means halfway to nine, which is 8.30, not 9.30. German counts towards the next hour. The other two times are there to be read past: seven o'clock is when the bus journey starts and four o'clock is when he is home. Reading halb neun as half past nine is the trap, and it is worth saying the German out loud and then saying the English time straight after it.", "topic": "reading aloud: retrieving a time from the text"}, {"id": "de10-speaking:r-de10-8", "level": "stretch", "type": "text", "q": "Say it out loud first, then write it. Yesterday I ate pizza. Start with Gestern.", "answer": "Gestern habe ich Pizza gegessen.", "accept": ["Gestern habe ich Pizza gegessen.", "Gestern habe ich Pizza gegessen", "gestern habe ich Pizza gegessen"], "hint": "Past tense needs two pieces. One goes in box two and one goes right at the end.", "explain": "The answer is Gestern habe ich Pizza gegessen. Gestern takes box one, so habe must be in box two and ich is pushed to box three. The participle of essen is gegessen, and it waits at the very end after Pizza. Saying it out loud helps you hear the shape of the sentence: the two verb pieces sit at opposite ends with everything else packed in between.", "topic": "speaking: saying a perfect tense sentence aloud"}]}, "hand": {"passage": "The train was already twenty minutes late when the announcement came. Nobody on the platform moved at first, because everybody was waiting to see whether anyone else believed it. An old man with a canvas bag folded his newspaper and started walking towards the stairs, and after that the rest of them followed, slowly, the way people do when they are pretending not to hurry. Outside, the taxi rank was empty. Rain had been falling since the middle of the afternoon and the road shone under the street lights like something spilled. A woman near the front of the queue said she had a connection to make in Crewe, and the man beside her said that everyone had somewhere to be.", "steps": ["Set a timer for exactly 3 minutes.", "Copy the passage into your book in your normal handwriting. Not your best, not your fastest. Normal.", "Stop dead when the timer goes. Do not finish the word.", "Count the words you wrote and type the number in."]}, "week": 4, "weekLabel": "Week 4", "version": "w4-2026-08-24"};

function poolFor(id){
  const pool=POOLS[id]||[]; if(!pool.length)return [];
  const qs=qsOf(id).filter(q=>q.type!=='long');
  const wrong=new Set(qs.filter(q=>S.ans[q.id]!==undefined&&isRight(q,S.ans[q.id])===false).map(q=>q.topic));
  const hit=pool.filter(q=>wrong.has(q.topic));
  const rest=pool.filter(q=>!wrong.has(q.topic));
  return (hit.length>=4?hit:hit.concat(rest)).slice(0,8);
}
function retryScore(id){
  const qs=poolFor(id);
  const a=qs.filter(q=>S.rans[q.id]!==undefined);
  return {right:a.filter(q=>isRight(q,S.rans[q.id])===true).length,answered:a.length,total:qs.length};
}

/* ---------- marking ---------- */
function norm(s){
  var t=String(s==null?'':s).toLowerCase().trim().replace(/[‘’]/g,"'").replace(/[“”]/g,'"')
    .replace(/[£$€]/g,'').replace(/\s+/g,' ').replace(/[.!;]+$/,'').trim();
  /* A wrapping pair of brackets is not a wrong answer. (2a + 2b) is 2a + 2b. */
  var m=t.match(/^\((.*)\)$/);
  if(m&&m[1].indexOf('(')===-1&&m[1].indexOf(')')===-1)t=m[1].trim();
  return t;
}
function squash(s){return norm(s).replace(/\s+/g,'').replace(/[−–—]/g,'-')}
function isRight(q,g){
  if(q.type==='mc')return g===q.answer;
  if(q.type==='text'){
    const acc=(q.accept||[q.answer]).map(norm), gg=norm(g);
    if(acc.includes(gg))return true;
    if(acc.map(a=>a.replace(/\s+/g,'').replace(/[−–—]/g,'-')).includes(squash(g)))return true;
    var an=parseNum(q.answer),gn=parseNum(g);
    if(an!==null&&gn!==null&&Math.abs(an-gn)<1e-9)return true;
    return false;
  }
  return null;
}
function numeric(q){return q.type==='text'&&/^-?[\d.,\/\s]+$/.test(String(q.answer||''))}
function parseNum(s){
  if(s==null)return null;
  var t=String(s).toLowerCase().trim().replace(/[\u2212\u2013\u2014]/g,'-').replace(/,/g,'').replace(/[£$€]/g,'')
    .replace(/\s*(kilometres|kilometers|metres|meters|degrees|degree|km|cm|mm|m|c)\b\.?/g,'').trim();
  if(!t)return null;
  var m=t.match(/^(-?\d+)\s+(\d+)\s*\/\s*(\d+)$/);
  if(m){var w=+m[1],nn=+m[2],d=+m[3];if(!d)return null;return w<0?w-nn/d:w+nn/d}
  m=t.match(/^(-?\d+)\s*\/\s*(-?\d+)$/);
  if(m){if(+m[2]===0)return null;return +m[1]/+m[2]}
  if(/^-?\d*\.?\d+$/.test(t))return parseFloat(t);
  return null;
}
function simplifyNote(q,g){
  if(!/simplest form/i.test(q.q||''))return '';
  var m=String(g||'').trim().match(/^(-?\d+)\s*\/\s*(\d+)$/);if(!m)return '';
  var a=Math.abs(+m[1]),b=Math.abs(+m[2]);if(!b)return '';
  var gcd=function(x,y){return y?gcd(y,x%y):x};
  if(gcd(a,b)<=1)return '';
  return '\n\nThat is the right value. The question asked for simplest form though, and '+m[1]+'/'+m[2]+' divides down to '+q.answer+'.';
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function isTest(id){return !!TESTS[id]}
function qsOf(id){
  if(isTest(id)){let o=[];TESTS[id].bands.forEach(b=>o=o.concat(b.questions.map(q=>({...q,_ex:b.extract||null,_bl:b.label}))));return o}
  const s=SESS[id];return s?s.questions.map(q=>({...q,_ex:s.extract||null})):[];
}
function titleOf(id){return isTest(id)?TESTS[id].title:(SESS[id]?SESS[id].subject+': '+SESS[id].title:id)}
function subjOf(id){return isTest(id)?(id==='s1-retest'?'Science':'Test'):(SESS[id]?SESS[id].subject:'')}
function scoreOf(id){
  const qs=qsOf(id).filter(q=>q.type!=='long');
  const a=qs.filter(q=>S.ans[q.id]!==undefined);
  return {right:a.filter(q=>isRight(q,S.ans[q.id])===true).length,answered:a.length,total:qs.length};
}
function dayDone(d){return d.blocks.every(b=>S.done[b.id])}
function overallPct(){
  let t=0,dn=0;DAYS.forEach(d=>d.blocks.forEach(b=>{t++;if(S.done[b.id])dn++}));
  return t?Math.round(dn/t*100):0;
}

/* ---------- sync ---------- */
function setDot(c){const e=document.getElementById('sdot');if(e)e.className='syncdot '+(c||'')}
async function push(kind,body){
  const url=(S.cfg.sync||'').trim(); if(!url)return false;
  setDot('busy');
  try{
    await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({kind:kind,week:P.week,at:new Date().toISOString(),...body})});
    setDot('on');S.cfg.lastSync=new Date().toISOString();save();return true;
  }catch(e){setDot('err');return false}
}
function pushRetry(id){
  const first=scoreOf(id), again=retryScore(id);
  const qs=poolFor(id).filter(q=>S.rans[q.id]!==undefined&&isRight(q,S.rans[q.id])===false);
  push('retry',{session:id,title:titleOf(id),subject:subjOf(id),
    firstRight:first.right,firstTotal:first.total,
    retryRight:again.right,retryTotal:again.total,
    stillWrong:[...new Set(qs.map(q=>q.topic))].join('; ')});
}
let dailyT=null;
function pushDaily(){
  clearTimeout(dailyT);
  dailyT=setTimeout(()=>{
    const H=S.hand||{};
    push('daily',{
      book:S.reading.book||'', notes:S.reading.notes||'',
      pages:DAYS.map(d=>d.label+' '+((S.reading[d.key]||{}).pages||'0')).join(', '),
      pagesTotal:DAYS.reduce((a,d)=>a+(parseInt((S.reading[d.key]||{}).pages,10)||0),0),
      handDays:DAYS.filter(d=>H[d.key]).length,
      words:H.words||'', legible:H.legible||'', ache:H.ache||''
    });
  },2500);
}
function pushSession(id){
  const sc=scoreOf(id), qs=qsOf(id).filter(q=>q.type!=='long');
  const wrong=qs.filter(q=>S.ans[q.id]!==undefined&&isRight(q,S.ans[q.id])===false);
  const t=TRACK[id]||{};
  const mins=t.t0?Math.round((Date.now()-t.t0)/600)/100:'';
  const longs=qsOf(id).filter(q=>q.type==='long'&&(S.long[q.id]||'').trim());
  push('session',{session:id,title:titleOf(id),subject:subjOf(id),
    right:sc.right,total:sc.total,
    gaps:[...new Set(wrong.map(q=>q.topic))].join('; '),
    detail:wrong.map(q=>({q:q.q,gave:S.ans[q.id],correct:q.answer,topic:q.topic})),
    minutes:mins, pastes:t.paste||0, pasteChars:t.pasteChars||0,
    modelOpens:t.model||0, modelEarly:t.modelEarly||0, keystrokes:t.keys||0, awaySeconds:t.away||0,
    writing:longs.map(q=>({task:q.q,text:S.long[q.id],marks:q.marks||0,
      words:(S.long[q.id]||'').trim().split(/\s+/).length,checklist:q.explain||''}))});
}
function shrink(file){
  return new Promise(res=>{
    const r=new FileReader();
    r.onload=()=>{const img=new Image();img.onload=()=>{
      const m=1200,sc=Math.min(1,m/Math.max(img.width,img.height));
      const c=document.createElement('canvas');c.width=img.width*sc;c.height=img.height*sc;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      res(c.toDataURL('image/jpeg',0.7));
    };img.src=r.result};
    r.readAsDataURL(file);
  });
}

}

  if(view.hint&&!marked&&q.hint)h+=`<div class="hint"><b>Hint.</b> ${esc(q.hint)}</div>`;
  if(marked){
    h+=`<div class="fb ${right?'ok':'no'}"><b>${right?'Correct':'Not quite. The answer is '+esc(q.answer)}</b>${esc(q.explain)}${right?esc(simplifyNote(q,given)):''}</div>`;
    h+=`<button class="btn" id="next">${view.i+1<qs.length?'Next question':'Finish'}</button>`;
  }else if(q.type==='long'){
    h+=`<button class="btn" id="showmodel">Show the model answer</button>`;
    if(view.model)h+=`<div class="fb ok"><b>Model answer</b>${esc(q.answer)}

${esc(q.explain)}</div>`;
    h+=`<button class="btn ghost" id="next">${view.i+1<qs.length?'Next question':'Finish'}</button>`;
  }else{
    if(q.type!=='mc')h+=`<button class="btn" id="check">Check</button>`;
    if(!test&&q.hint&&!view.hint)h+=`<button class="btn ghost" id="hintbtn">Stuck? Get a hint</button>`;
    if(test)h+=`<button class="btn ${q.type==='mc'?'ghost':''}" id="next">${view.i+1<qs.length?'Next':'Finish'}</button>`;
  }
  return h;
}

function vRQ(){
  const qs=poolFor(view.id), q=qs[view.i];
  document.getElementById('htitle').textContent='More practice';
  const given=S.rans[q.id], marked=given!==undefined;
  const right=marked?isRight(q,given):null;
  let h=`<div class="qmeta"><span>Extra practice</span><span>Question ${view.i+1} of ${qs.length}</span></div>
    <div class="bar" style="margin:10px 0 4px"><i style="width:${view.i/qs.length*100}%"></i></div>
    <div class="q">${esc(q.q)}</div>`;
  if(q.type==='mc'){
    h+=`<div class="opts">`;
    q.options.forEach((o,i)=>{
      let cls=''; if(marked){if(o===q.answer)cls='ok'; else if(o===given)cls='no'} else if(given===o)cls='sel';
      h+=`<button class="opt ${cls}" data-rpick="${esc(o)}" ${marked?'disabled':''}><span class="k">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`;
    });
    h+=`</div>`;
  }else{
    h+=`<input type="text" id="ta" value="${esc(given||'')}" class="${marked?(right?'ok':'no'):''}" ${marked?'disabled':''} autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="${numeric(q)?'decimal':'text'}" placeholder="Your answer">`;
  }
  if(view.hint&&!marked&&q.hint)h+=`<div class="hint"><b>Hint.</b> ${esc(q.hint)}</div>`;
  if(marked){
    h+=`<div class="fb ${right?'ok':'no'}"><b>${right?'Correct':'Not quite. The answer is '+esc(q.answer)}</b>${esc(q.explain)}${right?esc(simplifyNote(q,given)):''}</div>
      <button class="btn" id="rnext">${view.i+1<qs.length?'Next question':'Finish'}</button>`;
  }else{
    if(q.type!=='mc')h+=`<button class="btn" id="rcheck">Check</button>`;
    if(q.hint&&!view.hint)h+=`<button class="btn ghost" id="hintbtn">Stuck? Get a hint</button>`;
  }
  return h;
}

function vRRes(){
  const id=view.id, first=scoreOf(id), again=retryScore(id);
  const fp=first.total?Math.round(first.right/first.total*100):0;
  const rp=again.total?Math.round(again.right/again.total*100):0;
  document.getElementById('htitle').textContent='More practice';
  const up=rp>=fp;
  let h=`<div class="card band"><div class="big ${up?'ok':''}">${again.right}<span style="color:var(--faint);font-size:26px">/${again.total}</span></div>
    <div class="lbl">Extra practice on what you got wrong</div>
    <div class="lbl" style="margin-top:14px">First time: ${fp}% &middot; This time: <b>${rp}%</b></div></div>`;
  h+=`<div class="card tight"><div class="small muted">${up
    ? 'That is the whole point. You got those wrong less than an hour ago and you have just got them right, which means it went in rather than passing through.'
    : 'Still not landing, and that is worth knowing rather than hiding. Tell Keitan which ones. This is the sort of thing that needs saying out loud, not another go on your own.'}</div></div>`;
  const qs=poolFor(id).filter(q=>S.rans[q.id]!==undefined&&isRight(q,S.rans[q.id])===false);
  if(qs.length){
    h+=`<div class="card"><h3>Still wrong</h3>`;
    qs.forEach(q=>{h+=`<div class="rev"><div class="qt">${esc(q.q)}</div>
      <div class="ans">You put: <b class="no">${esc(S.rans[q.id]||'(blank)')}</b></div>
      <div class="ans">Answer: <b class="ok">${esc(q.answer)}</b></div>
      <div class="exp">${esc(q.explain)}</div></div>`});
    h+=`</div>`;
  }
  h+=`<button class="btn" data-go='${JSON.stringify({name:'day',day:view.day})}'>Back to ${DAYS.find(d=>d.key===view.day).label}</button>`;
  return h;
}

function vRes(){
  const id=view.id,qs=qsOf(id).filter(q=>q.type!=='long'),sc=scoreOf(id);
  document.getElementById('htitle').textContent=subjOf(id);
  const pct=sc.total?Math.round(sc.right/sc.total*100):0;
  let h=`<div class="card band"><div class="big ${pct>=70?'ok':''}">${sc.right}<span style="color:var(--faint);font-size:26px">/${sc.total}</span></div>
    <div class="lbl">${esc(titleOf(id))}</div></div>`;
  if(id==='s1-retest'){
    let ceil=null;
    for(const b of TESTS[id].bands){
      const a=b.questions.filter(q=>S.ans[q.id]!==undefined);
      if(!a.length)break;
      if(a.filter(q=>isRight(q,S.ans[q.id])===true).length>=3)ceil=b.label; else break;
    }
    h+=`<div class="card tight"><div class="small muted">Highest band cleared: <b>${ceil?esc(ceil):'none'}</b>. This is the number that settles whether your 82% at school was real.</div></div>`;
  }
  const ok=new Set(),no=new Set();
  qs.forEach(q=>{if(S.ans[q.id]!==undefined)(isRight(q,S.ans[q.id])===true?ok:no).add(q.topic)});
  no.forEach(t=>ok.delete(t));
  if(no.size)h+=`<div class="card"><h3>Still to fix</h3><div class="topics">${[...no].map(t=>`<span class="tp no">${esc(t)}</span>`).join('')}</div></div>`;
  if(ok.size)h+=`<div class="card"><h3>Got it</h3><div class="topics">${[...ok].map(t=>`<span class="tp ok">${esc(t)}</span>`).join('')}</div></div>`;
  const wrong=qs.filter(q=>S.ans[q.id]!==undefined&&isRight(q,S.ans[q.id])===false);
  if(wrong.length){
    h+=`<div class="card"><h3>Go through these</h3>`;
    wrong.forEach(q=>{h+=`<div class="rev"><div class="qt">${esc(q.q)}</div>
      <div class="ans">You put: <b class="no">${esc(S.ans[q.id]||'(blank)')}</b></div>
      <div class="ans">Answer: <b class="ok">${esc(q.answer)}</b></div>
      <div class="exp">${esc(q.explain)}</div></div>`});
    h+=`</div>`;
  }
  const extra=poolFor(id);
  if(extra.length&&wrong.length){
    const doneR=S.rdone[id], rs=retryScore(id);
    h+=`<div class="card"><h3>${doneR?'You have already done the extra practice':'Want to prove you have got it?'}</h3>
      <p class="muted small" style="margin:8px 0 0">${doneR
        ? 'You scored '+rs.right+' out of '+rs.total+' on those.'
        : extra.length+' more questions, aimed at exactly the topics you just got wrong. Different questions, same ideas. This is the bit that tells you whether it went in.'}</p>
      <button class="btn ${doneR?'ghost':''}" data-go='${JSON.stringify({name:'rq',day:view.day,id:id,i:0})}'>${doneR?'Look again':'Give me more questions'}</button></div>`;
  }
  h+=`<button class="btn ghost" data-go='${JSON.stringify({name:'day',day:view.day})}'>Back to ${DAYS.find(d=>d.key===view.day).label}</button>`;
  return h;
}

function vReview(){
  document.getElementById('htitle').textContent='End of week review';
  let all=[];
  DAYS.forEach(d=>d.blocks.forEach(b=>{if(b.kind==='review')return;
    qsOf(b.id).forEach(q=>{if(q.type!=='long'&&S.ans[q.id]!==undefined&&isRight(q,S.ans[q.id])===false)all.push({q:q,s:subjOf(b.id)})})}));
  let h=`<h1>End of week review</h1>
  <div class="nb"><b>Out loud, with Keitan.</b> For each one: say what you did, then say what you should have done. If you cannot explain it, you have not got it yet.</div>`;
  if(!all.length)h+=`<div class="card"><p>Nothing wrong to review. Either a very good week or the sessions have not been done yet.</p></div>`;
  else{
    const by={};all.forEach(x=>{(by[x.s]=by[x.s]||[]).push(x.q)});
    Object.keys(by).forEach(s=>{
      h+=`<div class="card"><h3>${esc(s)} <span class="faint">${by[s].length}</span></h3>`;
      by[s].forEach(q=>{h+=`<div class="rev"><div class="qt">${esc(q.q)}</div>
        <div class="ans">You put: <b class="no">${esc(S.ans[q.id]||'(blank)')}</b></div>
        <div class="ans">Answer: <b class="ok">${esc(q.answer)}</b></div>
        <div class="exp">${esc(q.explain)}</div>
        <div class="faint" style="margin-top:8px">${esc(q.topic||'')}</div></div>`});
      h+=`</div>`;
    });
  }
  h+=`<button class="btn" id="revdone">Done, we have been through them</button>`;
  return h;
}

function summary(){
  let o='SURAJ OS - WEEK 2\n\n';
  DAYS.forEach(d=>{
    o+=d.label.toUpperCase()+'\n';
    d.blocks.forEach(b=>{
      if(b.kind==='review'){o+='  Review: '+(S.done[b.id]?'done':'not done')+'\n';return}
      const sc=scoreOf(b.id);
      if(!sc.answered){o+='  '+titleOf(b.id)+': not started\n';return}
      const qs=qsOf(b.id).filter(q=>q.type!=='long');
      const wrong=qs.filter(q=>S.ans[q.id]!==undefined&&isRight(q,S.ans[q.id])===false);
      o+='  '+titleOf(b.id)+': '+sc.right+'/'+sc.total;
      if(wrong.length)o+='  | still wrong: '+[...new Set(wrong.map(q=>q.topic))].join('; ');
      o+='\n';
    });
    o+='\n';
  });
  const H=S.hand||{};
  o+='HANDWRITING\n  Speed Up! done: '+DAYS.filter(d=>H[d.key]).length+'/5\n';
  o+='  3 min copy: '+(H.words||'-')+' words'+(H.words?' ('+Math.round(H.words/3)+' wpm)':'')+'\n';
  o+='  Readable: '+(H.legible||'-')+' | Ache: '+(H.ache||'-')+'\n\n';
  o+='READING\n  Book: '+(S.reading.book||'-')+'\n  Pages: '+DAYS.map(d=>d.label.slice(0,3)+' '+((S.reading[d.key]||{}).pages||'0')).join(', ')+'\n';
  if(S.reading.notes)o+='  His summary: '+S.reading.notes+'\n';
  o+='\nEXTENDED WRITING\n';
  Object.keys(S.long).forEach(k=>{const t=(S.long[k]||'').trim();if(t)o+='  ['+k+'] '+t.split(/\s+/).length+' words\n  ---\n'+t+'\n  ---\n'});
  return o;
}

/* ---------- events ---------- */
function wire(){
  document.querySelectorAll('[data-go]').forEach(el=>{el.onclick=()=>go(JSON.parse(el.getAttribute('data-go')))});
  document.querySelectorAll('[data-pick]').forEach(el=>{el.onclick=()=>{
    const q=qsOf(view.id)[view.i];S.ans[q.id]=el.getAttribute('data-pick');save();
    if(isTest(view.id))setTimeout(advance,130);else{view.hint=false;render()}
  }});
  const ck=document.getElementById('check');
  if(ck)ck.onclick=()=>{const q=qsOf(view.id)[view.i],ta=document.getElementById('ta');
    if(!ta.value.trim()){ta.focus();return}S.ans[q.id]=ta.value;save();view.hint=false;render()};
  bindHonesty();
  document.querySelectorAll('[data-rpick]').forEach(el=>{el.onclick=()=>{
    const q=poolFor(view.id)[view.i];S.rans[q.id]=el.getAttribute('data-rpick');save();view.hint=false;render()}});
  const rc=document.getElementById('rcheck');
  if(rc)rc.onclick=()=>{const q=poolFor(view.id)[view.i],ta=document.getElementById('ta');
    if(!ta.value.trim()){ta.focus();return}S.rans[q.id]=ta.value;save();view.hint=false;render()};
  const rn=document.getElementById('rnext');
  if(rn)rn.onclick=()=>{
    const qs=poolFor(view.id);
    if(view.i+1<qs.length)go({name:'rq',day:view.day,id:view.id,i:view.i+1,hint:false});
    else{S.rdone[view.id]=true;save();pushRetry(view.id);go({name:'rres',day:view.day,id:view.id})}
  };
  const hb=document.getElementById('hintbtn');
  if(hb)hb.onclick=()=>{view.hint=true;render()};
  const sm=document.getElementById('showmodel');
  if(sm)sm.onclick=()=>{const q=qsOf(view.id)[view.i],ta=document.getElementById('ta');
    const t=TRACK[view.id]; if(t){t.model++; if(!ta||ta.value.trim().length<40)t.modelEarly++}
    if(ta)S.long[q.id]=ta.value;save();view.model=true;render()};
  const nx=document.getElementById('next');
  if(nx)nx.onclick=()=>{
    const q=qsOf(view.id)[view.i],ta=document.getElementById('ta');
    if(ta){if(q.type==='long')S.long[q.id]=ta.value;else if(isTest(view.id))S.ans[q.id]=ta.value;save()}
    advance();
  };
  const rd=document.getElementById('revdone');
  if(rd)rd.onclick=()=>{const d=DAYS.find(x=>x.key===view.day);const b=d.blocks.find(x=>x.kind==='review');
    if(b){S.done[b.id]=true;save();push('review',{done:true})}go({name:'day',day:view.day})};
  document.querySelectorAll('[data-read]').forEach(el=>{el.onchange=el.oninput=()=>{
    const k=el.getAttribute('data-read'),f=el.getAttribute('data-f');
    if(f==='book')S.reading.book=el.value;else if(f==='notes')S.reading.notes=el.value;
    else{S.reading[k]=S.reading[k]||{};S.reading[k].pages=el.value}save();pushDaily()}});
  document.querySelectorAll('[data-hand]').forEach(el=>{el.onclick=()=>{
    const k=el.getAttribute('data-hand');S.hand[k]=!S.hand[k];save();pushDaily();render()}});
  document.querySelectorAll('[data-hand2]').forEach(el=>{el.onchange=el.oninput=()=>{
    S.hand[el.getAttribute('data-hand2')]=el.value;save();pushDaily()}});
  document.querySelectorAll('[data-cfg]').forEach(el=>{el.onchange=el.oninput=()=>{
    CFG[el.getAttribute('data-cfg')]=el.value;S.cfg=CFG;saveCfg();save()}});
  const cc=document.getElementById('checkc');
  if(cc)cc.onclick=()=>checkContent(true);
  const ts=document.getElementById('testsync');
  if(ts)ts.onclick=async()=>{ts.textContent='Sending...';
    const ok=await push('test',{message:'Hello from the Study OS'});
    ts.textContent=ok?'Sent, check the sheet':'Failed, check the URL'};
  const cp=document.getElementById('copy');
  if(cp)cp.onclick=()=>{const t=summary();
    if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>{cp.textContent='Copied';setTimeout(()=>cp.textContent='Copy summary',1500)})};
  document.querySelectorAll('[data-shotadd]').forEach(el=>{el.onchange=async()=>{
    const k=el.getAttribute('data-shotadd'),f=el.files&&el.files[0];if(!f)return;
    const b64=await shrink(f);
    PHOTOS[k]=PHOTOS[k]||[];PHOTOS[k].push(b64);render();
    const ok=await push('photo',{day:k,image:b64});
    if(ok){S.shots[k]=(S.shots[k]||0)+1;save()}
    else alert('That photo did not send. Check the sync setting, then try again.');
    render()}});
}
function advance(){
  const qs=qsOf(view.id);
  if(view.i+1<qs.length)go({name:'q',day:view.day,id:view.id,i:view.i+1,hint:false,model:false});
  else{S.done[view.id]=true;save();pushSession(view.id);go({name:'res',day:view.day,id:view.id})}
}
function bindContent(){SESS=P.sessions;TESTS=P.tests;DAYS=P.days;BOOKS=P.books;HAND=P.hand;
  VER=P.version||'w0';S=store.get()||{};
  S.ans=S.ans||{};S.done=S.done||{};S.reading=S.reading||{};S.hand=S.hand||{};
  S.shots=S.shots||{};S.long=S.long||{};S.rans=S.rans||{};S.rdone=S.rdone||{};S.cfg=CFG;}
let CFG={};
try{CFG=JSON.parse(localStorage.getItem('surajOS_cfg')||'{}')}catch(e){}
if(!CFG.sync&&S.cfg&&S.cfg.sync)CFG.sync=S.cfg.sync;           /* carry over the old location */
S.cfg=CFG;
function saveCfg(){try{localStorage.setItem('surajOS_cfg',JSON.stringify(CFG))}catch(e){}}

let CHECKING=false;
function checkContent(loud){
  const url=(CFG.sync||'').trim(); if(!url){if(loud)alert('Add the sync link in Settings first.');return}
  CHECKING=true;render();
  jsonp(url,'want=version&',8000,v=>{
    if(!v||!v.version){finish(loud?'Nothing released yet.':null);return}
    if(v.version===VER){finish(loud?'Already on the latest.':null);return}
    jsonp(url,'want=content&',45000,r=>{
      const c=r&&r.content;
      if(!c||c.error){finish(loud?('Could not read the new work. '+(c&&c.error?c.error:'')):null);return}
      P=c;try{localStorage.setItem('surajOS_content',JSON.stringify(c))}catch(e){}
      bindContent();view={name:'home'};
      finish(loud?('Updated to '+(c.weekLabel||c.version)+'.'):null);
    });
  });
  function finish(msg){CHECKING=false;if(loud&&msg)alert(msg);render()}
}
function jsonp(url,qs,ms,fn){
  const cb='__c'+Math.floor(Math.random()*1e9);
  const sc=document.createElement('script');
  let done=false;
  const end=(d)=>{if(done)return;done=true;try{delete window[cb]}catch(_){}sc.remove();clearTimeout(t);fn(d)};
  window[cb]=end;
  const t=setTimeout(()=>end(null),ms);
  sc.onerror=()=>end(null);
  sc.src=url+(url.indexOf('?')>-1?'&':'?')+qs+'callback='+cb+'&t='+Date.now();
  document.body.appendChild(sc);
}
bindContent();
if(S.cfg.sync)setDot('on');
render();
checkContent(false);
</script></body></html>
