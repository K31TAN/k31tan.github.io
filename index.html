the audience, not at people in general. RULE OF THREE: a list of three items that builds, such as three places you might end up near water, or three things swimming is not. RHETORICAL CONTROL: the piece should not simply assert, it should take the reader somewhere. COUNTER ARGUMENT AND REBUTTAL: name the strongest point the other side has, admit it honestly, then turn it with a word like but or and yet. Conceding first is what makes the rebuttal land, because a reader who feels heard will keep listening. Check also that at least one deliberately short sentence is used for emphasis, and that the ending of the extract is a line with weight rather than a sentence that trails off.", "topic": "english: deploying persuasive devices with a counter argument and rebuttal"}, {"id": "w4-test:t33", "type": "text", "q": "A new oxygen cylinder is 15% lighter than last year's model. The new cylinder has a mass of 3.4 kg. What was the mass of last year's model, in kg?", "answer": "4", "accept": ["4", "4.0", "4 kg", "4kg", "four"], "hint": "", "explain": "The answer is 4 kg. You are given the mass AFTER the change and asked for the mass before, so this runs backwards. Last year's model is 100%, and 15% has come off, so the new cylinder is 100 - 15 = 85% of it. Go down to 1% first: 3.4 divided by 85 = 0.04 kg. Then up to 100%: 100 x 0.04 = 4 kg. Check it forwards: 10% of 4 is 0.4, so 15% is 0.4 + 0.2 = 0.6 kg, and 4 - 0.6 = 3.4 kg, which matches. Taking 15% off the 3.4 would give 2.89, and that is the forward step done a second time on a number that was already the answer.", "topic": "maths: reverse percentage in an unfamiliar context"}, {"id": "w4-test:t34", "type": "text", "q": "A husky team pulls a sled 8.4 km across the ice in 20 minutes. What is their average speed in metres per second?", "answer": "7", "accept": ["7", "7.0", "7 m/s", "7m/s", "7 metres per second", "seven"], "hint": "", "explain": "The answer is 7 m/s. Convert both quantities before you calculate, not after. Distance: 8.4 km is 8.4 x 1000 = 8400 m, digits moving three places. Time: 20 minutes is 20 x 60 = 1200 s. Now speed = distance / time = 8400 divided by 1200. Cancel two zeros from each: 84 divided by 12 = 7 m/s. Sense check it. A fast human sprinter is about 10 m/s and a jogger is about 3 m/s, so 7 m/s for a dog team over 20 minutes is believable. Dividing 8.4 by 20 without converting gives 0.42, which would be slower than walking pace.", "topic": "science: calculating speed after converting both units"}, {"id": "w4-test:t35", "type": "long", "q": "The Normans held England after 1066 using four tools: force, land, law and information. Which one mattered MOST in the years straight after the conquest? Explain your choice, support it with two specific pieces of evidence, and then give the strongest argument against your own answer.", "marks": 6, "answer": "Force mattered most in the years straight after 1066, because nothing else could have worked while the country was still in open revolt. Two pieces of evidence support this. First, motte and bailey castles were thrown up out of earth and timber within weeks of the Normans arriving, so a garrison could sit inside a stronghold in the middle of a hostile town almost immediately. Second, the Harrying of the North in the winter of 1069 to 1070 destroyed villages, crops, livestock and seed grain across the north, and the Domesday survey still recorded large areas of Yorkshire as waste seventeen years later. That is not a punishment, it is a demonstration. The strongest argument against my answer is that force alone could never have held England for twenty years. William had perhaps a few thousand knights in a country of around two million people, and terror wears off. Redistributing land so that almost every large landholder by 1086 was Norman gave those men a personal reason to defend the conquest, and the Domesday survey told William exactly what he could tax and demand. Force bought the time. Land and information turned the conquest into a settlement.", "hint": "", "explain": "A full mark answer contains six things. A CLEAR CHOICE stated in the first sentence, not left until the end. Any of the four tools can earn full marks, because the marks are for the argument and not for the option chosen. TWO SPECIFIC PIECES OF EVIDENCE, each with a detail attached, such as a date, a place or a number: motte and bailey castles built in weeks, the Harrying of the North in 1069 to 1070, Domesday in 1086, almost every large landholder Norman by 1086, forest law, or the murdrum fine. Vague evidence like the Normans were violent scores nothing. AN EXPLANATION of WHY that tool mattered most, which must link the evidence to control rather than just describing it. A GENUINE COUNTER ARGUMENT, meaning the best case against the answer given, not a weak one set up to be knocked down. A JUDGEMENT that survives the counter argument, usually by separating the short term from the long term. And accurate chronology throughout: 1066 for Hastings, 1069 to 1070 for the Harrying, 1085 for the order and 1086 for the survey.", "topic": "history: judgement on how the Normans controlled England"}, {"id": "w4-test:t36", "type": "text", "q": "A national park has a population density of 12 people per km2. There are 3,600 people living inside the park. What is the area of the park in km2?", "answer": "300", "accept": ["300", "300.0", "300 km2", "300km2", "300 square kilometres", "three hundred"], "hint": "", "explain": "The answer is 300 km2. You have been given the density, which is normally what the calculation produces, so this one runs backwards. Forwards the rule is population divided by area = density. You know the population and the density and you want the area, so area = population divided by density = 3600 divided by 12 = 300 km2. Check it forwards: 3600 divided by 300 = 12 people per km2, which is the density you were given. Multiplying 3600 by 12 would give 43,200, which is bigger than Wales and obviously wrong for a park holding 3,600 people.", "topic": "geography: population density, working backwards to find the area"}, {"id": "w4-test:t37", "type": "text", "q": "A triangular sail has an area of 4.5 m^2 and a base of 3 m. A new sail is made with the SAME height but double the base. What is the area of the new sail in m^2?", "answer": "9", "accept": ["9", "9.0", "9 m2", "9m2", "9 m^2", "nine"], "hint": "", "explain": "The answer is 9 m^2. Two moves, backwards then forwards. Backwards first, to find the height you were not given. Area = 1/2 x base x height, so 4.5 = 1/2 x 3 x height, which is 4.5 = 1.5 x height, so height = 4.5 divided by 1.5 = 3 m. Now forwards with the new sail. The base doubles from 3 m to 6 m and the height stays at 3 m, so the area is 1/2 x 6 x 3 = 9 m^2. Check it against common sense: doubling the base while keeping the height the same doubles the area, and 9 is double 4.5, which confirms both steps at once.", "topic": "maths: area of a triangle, backwards to find the height then forwards"}, {"id": "w4-test:t38", "type": "text", "q": "Write this in German, starting with Gestern.\n\nYesterday I played football.", "answer": "Gestern habe ich Fussball gespielt.", "accept": ["Gestern habe ich Fussball gespielt.", "Gestern habe ich Fussball gespielt", "Gestern habe ich Fußball gespielt.", "Gestern habe ich Fußball gespielt", "gestern habe ich Fussball gespielt", "gestern habe ich Fußball gespielt"], "hint": "", "explain": "The answer is Gestern habe ich Fussball gespielt. The perfect tense needs two pieces. The helper verb is haben, and with ich that is habe. The main verb spielen becomes the past participle gespielt, built as ge plus the stem spiel plus t. Now the word order. Gestern fills box one, so habe must sit in box two, which pushes ich into box three. The participle is not in a box at all: gespielt waits right at the very end, after Fussball. Writing Gestern ich habe gespielt Fussball breaks both rules at once.", "topic": "german: perfect tense with a fronted time phrase"}, {"id": "w4-test:t39", "type": "mc", "q": "Which lasted longer, the period from 500 BC to 200 BC, or the period from AD 100 to AD 450?", "options": ["AD 100 to AD 450, because it is 350 years and the other is 300 years", "500 BC to 200 BC, because the numbers are bigger", "They lasted exactly the same length of time", "You cannot compare a BC period with an AD period"], "answer": "AD 100 to AD 450, because it is 350 years and the other is 300 years", "hint": "", "explain": "AD 100 to AD 450 is longer. For two BC dates, subtract the smaller number from the bigger one, because BC counts backwards: 500 - 200 = 300 years. For two AD dates, subtract the earlier from the later: 450 - 100 = 350 years. So 350 beats 300. A bigger BC number means longer ago, not a longer period of time, and a BC year lasts exactly as long as an AD year.", "topic": "history: comparing time spans across BC and AD"}, {"id": "w4-test:t40", "type": "text", "q": "The nth term of a sequence is 5n - 2. Is 100 a term in this sequence? Answer yes or no.", "answer": "no", "accept": ["no", "No", "no it is not", "not a term", "no, not a term", "no it isnt", "no it isn't"], "hint": "", "explain": "No, 100 is not a term. Set the nth term equal to it: 5n - 2 = 100. Work backwards. Undo the subtract 2: 100 + 2 = 102. Undo the multiply by 5: 102 divided by 5 = 20.4. A position has to be a whole counting number, and 20.4 is not, so 100 is not in the sequence. Check what is either side: the 20th term is 5 x 20 - 2 = 98 and the 21st is 5 x 21 - 2 = 103, so the sequence steps straight over 100. Never leave this kind of question blank. Even writing 5n - 2 = 100 on the page is worth something, and a blank is worth nothing.", "topic": "maths: deciding whether a number is a term in a sequence"}]}], "title": "Weekly test", "note": "Everything from this week, getting harder as it goes. No hints, no notes, no phone in the room. One rule: never leave one blank. A wrong answer scores the same as a blank, and it tells us more."}}, "days": [{"key": "d1", "label": "Day 1", "date": "", "blocks": [{"id": "de6-wordorder-rebuild", "kind": "lesson", "mins": 20}, {"id": "m14-working-backwards", "kind": "lesson", "mins": 30}, {"id": "e9-sentence-control", "kind": "lesson", "mins": 25}, {"id": "s6-forces", "kind": "lesson", "mins": 25}, {"id": "h6-norman-conquest", "kind": "lesson", "mins": 25}, {"id": "g8-rivers", "kind": "lesson", "mins": 25}, {"id": "r1-recall-a", "kind": "lesson", "mins": 15}]}, {"key": "d2", "label": "Day 2", "date": "", "blocks": [{"id": "de7-cases", "kind": "lesson", "mins": 20}, {"id": "m15-inverse-ratio-area", "kind": "lesson", "mins": 25}, {"id": "e10-inference", "kind": "lesson", "mins": 25}, {"id": "s7-forces-calc", "kind": "lesson", "mins": 25}, {"id": "h7-norman-control", "kind": "lesson", "mins": 25}, {"id": "g9-river-landforms", "kind": "lesson", "mins": 25}, {"id": "m16-place-value-measure", "kind": "lesson", "mins": 20}]}, {"key": "d3", "label": "Day 3", "date": "", "blocks": [{"id": "de8-vocab-daily", "kind": "lesson", "mins": 20}, {"id": "m17-negatives-algebra", "kind": "lesson", "mins": 25}, {"id": "e11-persuasive", "kind": "lesson", "mins": 30}, {"id": "s8-energy", "kind": "lesson", "mins": 25}, {"id": "h8-medieval-life", "kind": "lesson", "mins": 25}, {"id": "g10-scale-again", "kind": "lesson", "mins": 25}, {"id": "r2-recall-b", "kind": "lesson", "mins": 15}]}, {"key": "d4", "label": "Day 4", "date": "", "blocks": [{"id": "de9-perfect-tense", "kind": "lesson", "mins": 20}, {"id": "m18-percentages", "kind": "lesson", "mins": 25}, {"id": "m19-sequences", "kind": "lesson", "mins": 25}, {"id": "e12-write-full", "kind": "lesson", "mins": 30}, {"id": "s9-practical-skills", "kind": "lesson", "mins": 25}, {"id": "h9-sources", "kind": "lesson", "mins": 25}, {"id": "g11-population", "kind": "lesson", "mins": 25}]}, {"key": "d5", "label": "Day 5", "date": "", "blocks": [{"id": "de10-speaking", "kind": "lesson", "mins": 20}, {"id": "w4-test", "kind": "test", "mins": 50}, {"id": "m20-mixed-stretch", "kind": "lesson", "mins": 25}, {"id": "review", "kind": "review", "mins": 25}]}], "books": ["Stormbreaker (Alex Rider) - Anthony Horowitz", "Percy Jackson: The Lightning Thief - Rick Riordan", "Holes - Louis Sachar", "Skulduggery Pleasant - Derek Landy", "Other"], "pools": {"m14-working-backwards": [{"id": "m14-working-backwards:r-m14-1", "level": "easy", "type": "mc", "q": "A number is halved and the answer is 14. Someone says the number that went in was 7, because 14 divided by 2 = 7. What have they done wrong?", "options": ["They halved again, which is the forward move done twice, instead of doubling to go back", "They should have added 2 instead", "They should have subtracted 14", "Nothing is wrong, 7 is correct"], "answer": "They halved again, which is the forward move done twice, instead of doubling to go back", "hint": "The machine already halved once. To get back you need the opposite move, not the same one again.", "explain": "The answer is that they halved again instead of doubling. This is the most common slip in backwards questions, and it is worth knowing it by name. Going forwards the move was halve, so going backwards the move is double. 14 x 2 = 28, so 28 went in. Check it forwards: half of 28 is 14, which matches.", "topic": "working backwards: forward move done twice"}, {"id": "m14-working-backwards:r-m14-2", "level": "easy", "type": "text", "q": "A machine multiplies any number you put in by 6. It puts out 42. What number went in?", "answer": "7", "accept": ["7", "7.0", "42/6"], "hint": "Multiplying got you to 42. Which move undoes multiplying?", "explain": "The answer is 7. The machine multiplied by 6, so to go back you divide by 6. 42 divided by 6 = 7. Check it forwards: 7 x 6 = 42, which is what the machine put out. That forward check is the part worth doing every time, because it tells you yourself whether you are right.", "topic": "working backwards: undoing a multiply"}, {"id": "m14-working-backwards:r-m14-3", "level": "easy", "type": "text", "q": "A machine divides any number you put in by 5. It puts out 9. What number went in?", "answer": "45", "accept": ["45", "45.0"], "hint": "The machine made the number smaller. So going back must make it bigger.", "explain": "The answer is 45. The machine divided by 5, so to go back you multiply by 5. 9 x 5 = 45. Check it forwards: 45 divided by 5 = 9, which matches. Notice the answer is bigger than 9. When the forward move shrinks a number, the backwards move has to grow it.", "topic": "working backwards: multiply undoes divide"}, {"id": "m14-working-backwards:r-m14-4", "level": "medium", "type": "text", "q": "A machine multiplies a number by 4 and then subtracts 5. It puts out 23. What number went in?", "answer": "7", "accept": ["7", "7.0"], "hint": "Undo the last step first. The last thing it did was subtract 5.", "explain": "The answer is 7. Undo the steps in reverse order. The last forward step was subtract 5, so the first backwards step is add 5: 23 + 5 = 28. The first forward step was multiply by 4, so the last backwards step is divide by 4: 28 divided by 4 = 7. Check it forwards: 7 x 4 = 28, and 28 - 5 = 23, which matches. Undoing in the wrong order is what usually costs the mark here.", "topic": "working backwards: two step machine with a subtraction"}, {"id": "m14-working-backwards:r-m14-5", "level": "medium", "type": "text", "q": "A triangle has an area of 36 cm^2 and a base of 9 cm. What is its perpendicular height, in cm?", "answer": "8", "accept": ["8", "8.0", "8cm", "8 cm"], "hint": "Forwards you multiply then halve. So backwards you double then divide.", "explain": "The answer is 8 cm. Forwards the rule is base x height divided by 2. Backwards you do the opposite moves in the opposite order: double the area first, 36 x 2 = 72, then divide by the base, 72 divided by 9 = 8 cm. The wrong move to watch for is multiplying 36 by 9, which gives 324 and is the forward move done in the wrong place. Check forwards: 9 x 8 = 72, and 72 divided by 2 = 36 cm^2, which matches.", "topic": "area: working backwards to find a height"}, {"id": "m14-working-backwards:r-m14-6", "level": "medium", "type": "text", "q": "Two workers share a bonus in the ratio 3:5. The smaller share is 21 pounds. What is the total bonus, in pounds?", "answer": "56", "accept": ["56", "56.0", "56 pounds", "£56"], "hint": "The 21 pounds is 3 parts, not the whole thing. Find what one part is worth first.", "explain": "The answer is 56 pounds. The smaller share is 3 parts and it is worth 21 pounds, so one part is 21 divided by 3 = 7 pounds. The whole bonus is 3 + 5 = 8 parts, so 8 x 7 = 56 pounds. The trap is answering 21, which treats the smaller share as if it were the total. It is only part of it. Check: the shares are 21 and 35, and 21 + 35 = 56.", "topic": "ratio: working back to the total from the smaller share"}, {"id": "m14-working-backwards:r-m14-7", "level": "medium", "type": "mc", "q": "A rule says: divide by 2, then add 6. Which of these is the correct way to run that rule backwards?", "options": ["Subtract 6, then multiply by 2", "Multiply by 2, then subtract 6", "Add 6, then divide by 2", "Divide by 2, then subtract 6"], "answer": "Subtract 6, then multiply by 2", "hint": "Two things change going backwards. Each move flips to its opposite, and the order flips too.", "explain": "The answer is subtract 6, then multiply by 2. Going backwards you change every move to its opposite and you also reverse the order. The last forward move was add 6, so it is undone first by subtracting 6. The first forward move was divide by 2, so it is undone last by multiplying by 2. Test it with a number: put 10 in, and 10 divided by 2 = 5, then 5 + 6 = 11. Run 11 back: 11 - 6 = 5, then 5 x 2 = 10. Multiply by 2 then subtract 6 gives 22 - 6 = 16, which is not 10, so that order is wrong.", "topic": "working backwards: reversing the order of steps"}, {"id": "m14-working-backwards:r-m14-8", "level": "stretch", "type": "text", "q": "Two climbers share a bag of pegs in the ratio 2:5. The larger share has 27 more pegs than the smaller share. How many pegs are in the bag altogether?", "answer": "63", "accept": ["63", "63.0", "63 pegs"], "hint": "The 27 is not a share and it is not the total. Work out how many parts the difference is worth.", "explain": "The answer is 63 pegs. The shares are 2 parts and 5 parts, so the difference between them is 5 - 2 = 3 parts. Those 3 parts are worth 27 pegs, so one part is 27 divided by 3 = 9 pegs. The whole bag is 2 + 5 = 7 parts, so 7 x 9 = 63 pegs. The mistake to avoid is treating 27 as one of the shares. Check: the shares are 18 and 45, the difference is 45 - 18 = 27, and 18 + 45 = 63.", "topic": "ratio: working back to the total from the difference"}], "m15-inverse-ratio-area": [{"id": "m15-inverse-ratio-area:r-m15-1", "level": "easy", "type": "mc", "q": "An amount is shared in the ratio 4:5. How many equal parts is it split into altogether?", "options": ["9", "20", "5", "1"], "answer": "9", "hint": "Add the two numbers in the ratio.", "explain": "The answer is 9. The ratio 4:5 means one share is 4 parts and the other is 5 parts, so there are 4 + 5 = 9 equal parts in total. Totalling the parts is the first move in almost every ratio question, forwards or backwards. 20 comes from multiplying 4 x 5, which does not tell you how many parts there are.", "topic": "ratio: total number of parts"}, {"id": "m15-inverse-ratio-area:r-m15-2", "level": "easy", "type": "text", "q": "A triangle has a base of 12 cm and a perpendicular height of 5 cm. What is its area, in cm^2?", "answer": "30", "accept": ["30", "30.0", "30cm2", "30 cm2", "30 cm^2"], "hint": "Base times height, then halve it.", "explain": "The answer is 30 cm^2. This one runs forwards, because you are given the base and the height and asked for the area. Base x height = 12 x 5 = 60, then divide by 2 to get 30 cm^2. Halving is what turns the rectangle around the triangle into the triangle itself.", "topic": "area: forwards, area from base and height"}, {"id": "m15-inverse-ratio-area:r-m15-3", "level": "easy", "type": "text", "q": "Share 45 sweets in the ratio 2:7. How many sweets are in the LARGER share?", "answer": "35", "accept": ["35", "35.0", "35 sweets"], "hint": "Total the parts, work out one part, then take 7 of them.", "explain": "The answer is 35 sweets. This one runs forwards, because you are given the total. Total the parts: 2 + 7 = 9. One part is 45 divided by 9 = 5 sweets. The larger share is 7 parts, so 7 x 5 = 35. Check: the smaller share is 2 x 5 = 10, and 35 + 10 = 45, which is the amount you started with.", "topic": "ratio: forwards, sharing a total"}, {"id": "m15-inverse-ratio-area:r-m15-4", "level": "medium", "type": "mc", "q": "A question gives you the base and the perpendicular height of a triangle and asks for the area. Are you working forwards or backwards, and why?", "options": ["Forwards, because the base and height are what the rule starts with and the area is what it produces", "Backwards, because you have to divide by 2 at the end", "Backwards, because the area is missing", "You cannot tell without knowing the numbers"], "answer": "Forwards, because the base and height are what the rule starts with and the area is what it produces", "hint": "The forward rule is base and height in, area out. Which end of that is missing here?", "explain": "The answer is forwards. The rule takes a base and a height in and puts an area out. Here you have both of the things it starts with, so you just run the rule: multiply them and halve. It is only backwards when the area is given to you and one of the lengths is missing, because then you are starting at the finish. Deciding this before you touch the numbers is what stops you doubling when you should be halving.", "topic": "area: spotting which direction a question runs"}, {"id": "m15-inverse-ratio-area:r-m15-5", "level": "medium", "type": "text", "q": "A triangle has an area of 54 cm^2 and a base of 12 cm. What is its perpendicular height, in cm?", "answer": "9", "accept": ["9", "9.0", "9cm", "9 cm"], "hint": "This one runs backwards. Undo the halving first, then undo the multiplying.", "explain": "The answer is 9 cm. You are given the area, so this runs backwards. Undo the halving: 54 x 2 = 108. Undo the multiplying by the base: 108 divided by 12 = 9 cm. Check it forwards: 12 x 9 = 108, and 108 divided by 2 = 54 cm^2, which matches. If you had halved 54 instead of doubling it you would get 27, then 27 divided by 12, which is not a sensible height at all.", "topic": "area: backwards, height from area and base"}, {"id": "m15-inverse-ratio-area:r-m15-6", "level": "medium", "type": "text", "q": "Two hikers share the weight of a tent in the ratio 3:4. The lighter load is 24 kg. What is the total weight of the tent, in kg?", "answer": "56", "accept": ["56", "56.0", "56kg", "56 kg"], "hint": "You have been given a share, not the total. Find one part first.", "explain": "The answer is 56 kg. This runs backwards, because 24 kg is one share rather than the whole tent. The lighter load is 3 parts, so one part is 24 divided by 3 = 8 kg. The total is 3 + 4 = 7 parts, so 7 x 8 = 56 kg. Check: the loads are 24 kg and 32 kg, and 24 + 32 = 56 kg.", "topic": "ratio: backwards, total from a share"}, {"id": "m15-inverse-ratio-area:r-m15-7", "level": "medium", "type": "text", "q": "A triangle has a base of 14 cm, a perpendicular height of 6 cm and a slanted side of 10 cm. What is its area, in cm^2?", "answer": "42", "accept": ["42", "42.0", "42cm2", "42 cm2", "42 cm^2"], "hint": "Only two of those three numbers belong in the formula. The height must meet the base at a right angle.", "explain": "The answer is 42 cm^2. The formula uses the base and the perpendicular height only, so that is 14 x 6 = 84, halved to give 42 cm^2. The 10 cm slanted side is put there on purpose to see if you grab the wrong number. Using it would give 14 x 10 divided by 2 = 70 cm^2, which is too big, because the slanted side is always longer than the true height.", "topic": "area: forwards, ignoring the slanted side"}, {"id": "m15-inverse-ratio-area:r-m15-8", "level": "stretch", "type": "text", "q": "A triangle has an area of 40 cm^2 and a base of 10 cm. A second triangle has the SAME perpendicular height but a base of 15 cm. What is the area of the second triangle, in cm^2?", "answer": "60", "accept": ["60", "60.0", "60cm2", "60 cm2", "60 cm^2"], "hint": "Two directions in one question. Go backwards to find the shared height, then forwards with the new base.", "explain": "The answer is 60 cm^2. Step 1 runs backwards: double the area, 40 x 2 = 80, then divide by the base, 80 divided by 10 = 8 cm. That is the height both triangles share. Step 2 runs forwards with the new base: 15 x 8 = 120, halved is 60 cm^2. The reason this one is worth slowing down for is that the direction changes halfway through, so you have to decide twice.", "topic": "area: backwards then forwards in one question"}], "m16-place-value-measure": [{"id": "m16-place-value-measure:r-m16-1", "level": "easy", "type": "mc", "q": "A sign says a tunnel is 1 km long. Which of these is exactly the same distance?", "options": ["1000 m", "100 m", "10000 m", "10 m"], "answer": "1000 m", "hint": "The k in km stands for kilo, which means a thousand.", "explain": "The answer is 1000 m. The k in kilometre means a thousand, so 1 km is 1000 m. That thousand is why the digits move three places when you swap between km and m, not two. Knowing this one fact stops most of the mistakes in this topic before they happen.", "topic": "measurement: metres in a kilometre"}, {"id": "m16-place-value-measure:r-m16-2", "level": "easy", "type": "text", "q": "Change 7 km into metres.", "answer": "7000", "accept": ["7000", "7000m", "7000 m", "7,000", "7000 metres"], "hint": "Every kilometre is 1000 metres. You have 7 of them.", "explain": "The answer is 7000 m. Each km is 1000 m, so 7 km is 7 x 1000 = 7000 m. You are changing to a smaller unit, so you need more of them, which is why the number gets bigger.", "topic": "measurement: km to m"}, {"id": "m16-place-value-measure:r-m16-3", "level": "easy", "type": "mc", "q": "Someone writes 6.25 km = 625 m. What has gone wrong?", "options": ["The digits moved two places instead of three, because 1 km is 1000 m", "They should have divided by 1000 instead", "They should have added 1000", "Nothing is wrong, 625 m is correct"], "answer": "The digits moved two places instead of three, because 1 km is 1000 m", "hint": "Count the zeros in 1000. That is how many places the digits move.", "explain": "The answer is that the digits moved two places instead of three. 1000 has three zeros, so going from km to m the digits shift three places, giving 6.25 km = 6250 m. Moving two places is the shift you use between metres and centimetres, where the number is 100. This is exactly the slip that turned 3.75 km into 375 m, so the check is always the same: say to yourself how many metres are in a kilometre, then count the zeros.", "topic": "measurement: spotting a two place shift instead of three"}, {"id": "m16-place-value-measure:r-m16-4", "level": "medium", "type": "text", "q": "Change 2.08 km into metres.", "answer": "2080", "accept": ["2080", "2080m", "2080 m", "2,080", "2080 metres"], "hint": "Multiply by 1000, which shifts every digit three places. Watch the zero in the middle.", "explain": "The answer is 2080 m. Multiplying by 1000 shifts the digits three places, so 2.08 becomes 2080. Say it as a sentence to check: 2 km is 2000 m, and 0.08 km is 80 m, and 2000 + 80 = 2080 m. The zero between the 2 and the 8 has to be kept, because it is holding the hundreds column empty.", "topic": "measurement: km to m with a decimal"}, {"id": "m16-place-value-measure:r-m16-5", "level": "medium", "type": "text", "q": "Change 750 m into kilometres.", "answer": "0.75", "accept": ["0.75", ".75", "0.75km", "0.75 km", "0.750", "3/4"], "hint": "You are going to a bigger unit, so the number must get smaller. Divide by 1000.", "explain": "The answer is 0.75 km. Going from m to km you divide by 1000, so the digits move three places the other way: 750 becomes 0.75. Sense check it: 750 m is not even a full kilometre, so the answer has to be less than 1. It is three quarters of a kilometre, which fits, since 750 is three quarters of 1000.", "topic": "measurement: m to km giving a decimal"}, {"id": "m16-place-value-measure:r-m16-6", "level": "medium", "type": "text", "q": "Change 1.7 m into centimetres.", "answer": "170", "accept": ["170", "170cm", "170 cm", "170 centimetres"], "hint": "There are 100 cm in a metre, so this shift is two places, not three.", "explain": "The answer is 170 cm. There are 100 cm in 1 m, and 100 has two zeros, so the digits move two places: 1.7 becomes 170. Check it in words: 1 m is 100 cm and 0.7 m is 70 cm, and 100 + 70 = 170 cm. The number of places changes with the unit, so it is worth naming the conversion out loud before you move anything.", "topic": "measurement: m to cm"}, {"id": "m16-place-value-measure:r-m16-7", "level": "medium", "type": "text", "q": "Change 62 mm into centimetres.", "answer": "6.2", "accept": ["6.2", "6.2cm", "6.2 cm", "6.20", "6.2 centimetres"], "hint": "There are 10 mm in 1 cm, so this shift is only one place.", "explain": "The answer is 6.2 cm. There are 10 mm in 1 cm, and 10 has one zero, so the digits move one place: 62 becomes 6.2. Centimetres are bigger than millimetres, so the number has to get smaller. A 62 mm bolt is about the width of two fingers, and 6.2 cm matches that, while 620 cm would be over six metres.", "topic": "measurement: mm to cm"}, {"id": "m16-place-value-measure:r-m16-8", "level": "stretch", "type": "text", "q": "On a map, 5 cm represents 1 km in real life. A footpath measures 3.4 cm on the map. How long is the footpath in METRES?", "answer": "680", "accept": ["680", "680m", "680 m", "680 metres"], "hint": "Two jobs here. Use the scale to get kilometres first, then convert that to metres last.", "explain": "The answer is 680 m. Step 1, use the scale: every 5 cm on the map is 1 km, so 3.4 divided by 5 = 0.68 km. Step 2, convert: 0.68 x 1000 = 680 m. Doing them in that order keeps it simple. The usual place to slip is stopping at 0.68 and writing 0.68 m, or moving two places to get 68 m. Sense check: the path is less than 5 cm on the map so it is under 1 km, and 680 m is under 1000 m, which fits.", "topic": "scale: map distance converted into metres"}], "m20-mixed-stretch": [{"id": "m20-mixed-stretch:r-m20-1", "level": "easy", "type": "text", "q": "A sequence starts 5, 9, 13, 17 and carries on in the same way. What is the 10th term?", "answer": "41", "accept": ["41", "41.0"], "hint": "Find the step first, then build the nth term rule before you jump to the 10th.", "explain": "The answer is 41. The step is 9 - 5 = 4, so the rule starts with 4n. 4n on its own gives 4, 8, 12, 16, which is 1 short of the sequence every time, so the nth term is 4n + 1. For the 10th term put n = 10: 4 x 10 + 1 = 41. Counting on ten times works too, but the rule is faster and does not drift.", "topic": "sequences: finding a term from its position"}, {"id": "m20-mixed-stretch:r-m20-2", "level": "medium", "type": "text", "q": "A survival stove burns 3/4 of a litre of fuel per hour. A can holds 7 litres. How many complete hours can it burn for?", "answer": "9", "accept": ["9", "9.0", "9 hours"], "hint": "Work out 7 divided by 3/4 first, then think about what a part of an hour is worth here.", "explain": "The answer is 9 complete hours. 7 divided by 3/4 means flip and multiply: 7 x 4/3 = 28/3, which is 9 and 1/3. The question asks for complete hours, so you round DOWN to 9. Check it: 9 hours use 9 x 3/4 = 27/4 litres, which is 6 and 3/4 litres, leaving 1/4 of a litre. That is not enough for another full hour. Notice the answer is bigger than 7 even though you divided, because you are counting how many three quarter litre lots fit into 7.", "topic": "fractions: dividing by a fraction then rounding down in context"}, {"id": "m20-mixed-stretch:r-m20-3", "level": "medium", "type": "text", "q": "A pair of boots costs 150 pounds. The price is cut by 20% in a sale. Two weeks later the sale price is cut by a further 25%. What is the final price, in pounds?", "answer": "90", "accept": ["90", "90.0", "90 pounds", "£90"], "hint": "The second cut is taken off the sale price, not off the original 150.", "explain": "The answer is 90 pounds. First cut: 10% of 150 is 15, so 20% is 30, and 150 - 30 = 120 pounds. Second cut: 25% of 120 is a quarter, which is 30, and 120 - 30 = 90 pounds. The trap is adding the percentages to make 45% and taking that off 150, which gives 82.50 and is wrong. Each cut is measured against the price at that moment, and after the first sale that price is 120, not 150.", "topic": "percentages: two successive reductions"}, {"id": "m20-mixed-stretch:r-m20-4", "level": "medium", "type": "text", "q": "Work out -4^2 + (-3) x (-6)", "answer": "2", "accept": ["2", "2.0", "+2"], "hint": "Do the index and the multiplying before the adding. Two negatives multiplied give a positive.", "explain": "The answer is 2. BIDMAS says indices first: -4^2 means the square of 4 with the minus in front, so that is -16. Then multiplying: (-3) x (-6) = +18, because a negative times a negative gives a positive. Finally add: -16 + 18 = 2. Starting at -16 and going up 18 takes you past zero to 2. The two places this goes wrong are reading -4^2 as +16, and leaving the answer negative after multiplying two negatives.", "topic": "negatives: index and sign rules together with BIDMAS"}, {"id": "m20-mixed-stretch:r-m20-5", "level": "stretch", "type": "text", "q": "After a 25% discount, a rucksack costs 45 pounds. What was the price before the discount, in pounds?", "answer": "60", "accept": ["60", "60.0", "60 pounds", "£60"], "hint": "The 45 pounds is what is LEFT after the discount. What percentage of the old price is that?", "explain": "The answer is 60 pounds. Taking 25% off leaves 75%, so 45 pounds is 75% of the old price. That means 25% of the old price is 45 divided by 3 = 15 pounds, and 100% is 4 x 15 = 60 pounds. Check it forwards: 25% of 60 is 15, and 60 - 15 = 45, which matches. The wrong move is adding 25% onto 45, giving 56.25. That takes the percentage of the new price rather than the old one, and the two are not the same size.", "topic": "percentages: working backwards to the original amount"}, {"id": "m20-mixed-stretch:r-m20-6", "level": "stretch", "type": "text", "q": "A field is a triangle with a base of 0.3 km and a perpendicular height of 120 m. What is its area, in m^2?", "answer": "18000", "accept": ["18000", "18000m2", "18000 m2", "18000 m^2", "18,000"], "hint": "The two lengths are in different units. Fix that before you do any multiplying.", "explain": "The answer is 18000 m^2. The answer is asked for in m^2, so change the base into metres first: 0.3 km x 1000 = 300 m. Now the area: 300 x 120 = 36000, and halved gives 18000 m^2. Mixing units is the killer here. Doing 0.3 x 120 divided by 2 gives 18, which is far too small for a field, and it is neither km^2 nor m^2. Convert first, then calculate.", "topic": "area: converting units before finding an area"}, {"id": "m20-mixed-stretch:r-m20-7", "level": "stretch", "type": "text", "q": "On a map, 4 cm represents 3 km. A trail measures 6 cm on the map. How long is the trail in metres?", "answer": "4500", "accept": ["4500", "4500m", "4500 m", "4,500", "4500 metres"], "hint": "The scale is not a neat 1 km, so find what 1 cm stands for first, or scale up 4 cm to 6 cm.", "explain": "The answer is 4500 m. Find what 1 cm is worth: 3 divided by 4 = 0.75 km per cm. Then 6 x 0.75 = 4.5 km. Convert last: 4.5 x 1000 = 4500 m. Check it another way: 6 cm is one and a half lots of 4 cm, and one and a half lots of 3 km is 4.5 km, which agrees. The two things to hold on to are that the scale is not 1 km here, and that the answer was asked for in metres, not km.", "topic": "scale: unequal map scale converted into metres"}, {"id": "m20-mixed-stretch:r-m20-8", "level": "stretch", "type": "text", "q": "Animal feed is mixed with oats, bran and seed in the ratio 2:3:5. A farmer has 8 kg of oats, 9 kg of bran and as much seed as he wants. What is the greatest mass of feed he can make, in kg?", "answer": "30", "accept": ["30", "30.0", "30kg", "30 kg"], "hint": "Work out what one part could be worth using the oats, then using the bran. The smaller of those two is the one that limits you.", "explain": "The answer is 30 kg. Test each ingredient he is short of. Oats are 2 parts and he has 8 kg, so one part could be 8 divided by 2 = 4 kg. Bran is 3 parts and he has 9 kg, so one part could be 9 divided by 3 = 3 kg. He has to use the smaller of these, 3 kg, because the bran runs out first. The whole mix is 2 + 3 + 5 = 10 parts, so 10 x 3 = 30 kg. Check: that uses 6 kg of oats, which he has, all 9 kg of bran, and 15 kg of seed. The mistake is using the bigger figure, which would need 12 kg of bran when only 9 kg exists.", "topic": "ratio: which ingredient limits the mix"}], "m17-negatives-algebra": [{"id": "m17-negatives-algebra:r-m17-1", "level": "easy", "type": "mc", "q": "In the expression 7b - 3b + 2, which sign belongs to the term 3b?", "options": ["Negative, because the minus written in front of it is part of that term", "Positive, because 3b is written with positive numbers", "Negative, but only if b is a negative number", "It has no sign, because signs only belong to plain numbers"], "answer": "Negative, because the minus written in front of it is part of that term", "hint": "Read left to right. The sign sitting in front of a term travels with it.", "explain": "The answer is negative. The sign in front of a term is part of that term, so the three terms here are +7b, -3b and +2. Reading it that way is the whole defence against dropped signs, because once the minus is attached to the 3b it cannot get left behind when you collect. Signs are about how the term is written, not about whether b turns out to be positive or negative.", "topic": "algebra: which term a sign belongs to"}, {"id": "m17-negatives-algebra:r-m17-2", "level": "easy", "type": "text", "q": "Simplify 12w - 5w", "answer": "7w", "accept": ["7w", "7 w", "7*w"], "hint": "Both terms are w terms. The minus tells you to take one count away from the other.", "explain": "The answer is 7w. Both are w terms, so they collect. The signs make it +12w and -5w, and 12 - 5 = 7, so you get 7w. The letter does not change, only the number in front of it. If you had added by mistake you would get 17w, which is why it pays to mark the sign on each term before you touch the numbers.", "topic": "algebra: collecting two like terms with a subtraction"}, {"id": "m17-negatives-algebra:r-m17-3", "level": "easy", "type": "text", "q": "Simplify 4h - 9h", "answer": "-5h", "accept": ["-5h", "-5 h", "- 5h", "-5*h"], "hint": "Taking 9 lots away from 4 lots goes below zero. That is allowed in algebra.", "explain": "The answer is -5h. The terms are +4h and -9h, and 4 - 9 = -5, so the answer is -5h. A negative coefficient is a perfectly good answer, it just means you are 5 lots of h short. Writing 5h and quietly dropping the minus is the error to watch, and you can catch it by asking which term is bigger before you subtract.", "topic": "algebra: like terms collecting to a negative coefficient"}, {"id": "m17-negatives-algebra:r-m17-4", "level": "easy", "type": "mc", "q": "Someone simplifies 7c + 4 - 3c + 6 and writes 10c + 10. What went wrong?", "options": ["They added the 3c instead of subtracting it, because they left the minus sign behind", "They should not have added the 4 and the 6", "They collected the c terms and the numbers the wrong way round", "Nothing is wrong, 10c + 10 is correct"], "answer": "They added the 3c instead of subtracting it, because they left the minus sign behind", "hint": "Where did the 10 in 10c come from? Work out 7 + 3 and then 7 - 3.", "explain": "The answer is that they added the 3c instead of subtracting it. 7 + 3 = 10, which is exactly what they wrote, so the minus sign was dropped. The terms are +7c, +4, -3c and +6. Collect the c terms: 7c - 3c = 4c. Collect the numbers: 4 + 6 = 10. The correct answer is 4c + 10. They got the number part right, so this is one sign, not a broken method.", "topic": "algebra: diagnosing a dropped minus sign"}, {"id": "m17-negatives-algebra:r-m17-5", "level": "medium", "type": "text", "q": "Simplify 9k + 5 - 4k + 2", "answer": "5k + 7", "accept": ["5k + 7", "5k+7", "7 + 5k", "7+5k"], "hint": "Mark all four terms with their signs first, then collect the k terms and the numbers separately.", "explain": "The answer is 5k + 7. Mark the terms: +9k, +5, -4k and +2. The k terms: 9k - 4k = 5k. The plain numbers: 5 + 2 = 7. That gives 5k + 7. The k terms and the numbers stay apart, because you do not know what k is worth, so they cannot be joined into one thing.", "topic": "algebra: collecting terms and numbers with a negative term"}, {"id": "m17-negatives-algebra:r-m17-6", "level": "medium", "type": "text", "q": "Simplify 6x + 3y - 4x - 7y", "answer": "2x - 4y", "accept": ["2x - 4y", "2x-4y", "-4y + 2x", "-4y+2x"], "hint": "There are two minus signs here. Attach each one to the term it sits in front of before you collect.", "explain": "The answer is 2x - 4y. Mark the terms: +6x, +3y, -4x and -7y. The x terms: 6x - 4x = 2x. The y terms: 3y - 7y = -4y, because taking 7 from 3 goes below zero. So the answer is 2x - 4y. Check it by substituting: put x = 1 and y = 1 into the original and you get 6 + 3 - 4 - 7 = -2, and 2x - 4y gives 2 - 4 = -2 as well, so it holds.", "topic": "algebra: collecting like terms with two negative terms"}, {"id": "m17-negatives-algebra:r-m17-7", "level": "medium", "type": "text", "q": "Simplify 8d - 3 - d - 7", "answer": "7d - 10", "accept": ["7d - 10", "7d-10", "-10 + 7d", "-10+7d"], "hint": "A letter on its own means 1 of it. Both number terms are negative here, so they build up rather than cancel.", "explain": "The answer is 7d - 10. Mark the terms: +8d, -3, -d and -7. A lone d means 1d, so the d terms give 8d - 1d = 7d. Both number terms are negative, so -3 - 7 = -10. That gives 7d - 10. Two negatives added together go further down, not back up, so -10 is right and -4 would come from subtracting them instead.", "topic": "algebra: collecting when both number terms are negative"}, {"id": "m17-negatives-algebra:r-m17-8", "level": "stretch", "type": "text", "q": "Simplify 5g - 8 - 9g + 3, then use your simplified expression to work out its value when g = 2. Give the value.", "answer": "-13", "accept": ["-13", "-13.0", "- 13"], "hint": "Simplify first and keep every sign. Then put 2 in place of g and be careful with the negative coefficient.", "explain": "The value is -13. Simplify first: the terms are +5g, -8, -9g and +3. The g terms give 5g - 9g = -4g. The numbers give -8 + 3 = -5. So the expression is -4g - 5. Now substitute g = 2: -4 x 2 = -8, and -8 - 5 = -13. Check it against the original: 5 x 2 - 8 - 9 x 2 + 3 = 10 - 8 - 18 + 3 = -13, which matches. Doing that check on the original line is how you prove the simplifying was right without asking anyone.", "topic": "algebra: simplify then substitute a value"}], "m18-percentages": [{"id": "m18-percentages:r-m18-1", "level": "easy", "type": "text", "q": "Find 10% of 240.", "answer": "24", "accept": ["24", "24.0"], "hint": "10% is one tenth. Divide by 10.", "explain": "The answer is 24. 10% means 10 out of every 100, which is one tenth, so you divide by 10: 240 divided by 10 = 24. Finding 10% first is the move that everything else in this topic is built from, so it is worth being fast at it.", "topic": "percentages: finding 10% of an amount"}, {"id": "m18-percentages:r-m18-2", "level": "easy", "type": "text", "q": "Find 20% of 45.", "answer": "9", "accept": ["9", "9.0"], "hint": "Get 10% first, then double it.", "explain": "The answer is 9. Start with 10% of 45, which is 45 divided by 10 = 4.5. Then 20% is double that: 4.5 x 2 = 9. Building up from 10% keeps it in your head with no written method. Sense check: 20% is a fifth, and a fifth of 45 is 9.", "topic": "percentages: building 20% from 10%"}, {"id": "m18-percentages:r-m18-3", "level": "easy", "type": "text", "q": "Find 1% of 700.", "answer": "7", "accept": ["7", "7.0"], "hint": "1% is one hundredth. Divide by 100.", "explain": "The answer is 7. 1% means 1 out of every 100, so you divide by 100: 700 divided by 100 = 7. This one matters because 1% lets you build awkward percentages, for example 17% is 10% plus 5% plus two lots of 1%.", "topic": "percentages: finding 1% of an amount"}, {"id": "m18-percentages:r-m18-4", "level": "medium", "type": "text", "q": "Find 15% of 80.", "answer": "12", "accept": ["12", "12.0"], "hint": "15% is 10% plus 5%, and 5% is half of 10%.", "explain": "The answer is 12. 10% of 80 is 8. 5% is half of that, which is 4. Add them: 8 + 4 = 12. Splitting a percentage into 10% and 5% chunks is what makes this doable without a calculator. Check the size: 15% is under a fifth, and 12 is comfortably under a fifth of 80, which is 16.", "topic": "percentages: building 15% from 10% and 5%"}, {"id": "m18-percentages:r-m18-5", "level": "medium", "type": "text", "q": "A head torch costs 48 pounds. In a sale it is reduced by 25%. What is the sale price, in pounds?", "answer": "36", "accept": ["36", "36.0", "36 pounds", "£36"], "hint": "25% is a quarter. Work out the discount, then take it off the price.", "explain": "The answer is 36 pounds. 25% is a quarter, so the discount is 48 divided by 4 = 12 pounds. The sale price is 48 - 12 = 36 pounds. There are two steps here and the second one is the one people forget. 12 pounds is only the money you save, not what you hand over.", "topic": "percentages: percentage decrease on a price"}, {"id": "m18-percentages:r-m18-6", "level": "medium", "type": "mc", "q": "A bike costs 260 pounds and a shop takes 15% off. Someone answers 39 pounds. What have they done wrong?", "options": ["39 pounds is the size of the discount, not the new price. The new price is 260 - 39 = 221 pounds", "They should have found 15% of 39 instead", "They worked out 15% wrongly, it should be 26 pounds", "Nothing is wrong, 39 pounds is correct"], "answer": "39 pounds is the size of the discount, not the new price. The new price is 260 - 39 = 221 pounds", "hint": "Check their 15% first. Then ask what the question actually asked for.", "explain": "The answer is that 39 pounds is the discount, not the new price. Their percentage work is fine: 10% of 260 is 26, 5% is 13, and 26 + 13 = 39. The missing step is the subtraction, so the price you pay is 260 - 39 = 221 pounds. This is a reading slip rather than a maths slip, and the fix is to underline what the question asks for before you write the answer down.", "topic": "percentages: giving the discount instead of the new price"}, {"id": "m18-percentages:r-m18-7", "level": "medium", "type": "text", "q": "A season ticket costs 60 pounds. The price goes up by 20%. What is the new price, in pounds?", "answer": "72", "accept": ["72", "72.0", "72 pounds", "£72"], "hint": "Find 20% of 60, then add it on because the price is rising.", "explain": "The answer is 72 pounds. 10% of 60 is 6, so 20% is 12. The price is going up, so you add: 60 + 12 = 72 pounds. Increase means add and decrease means subtract, and that one word decides the last step. Sense check: 72 is bigger than 60, which is what a rise should look like.", "topic": "percentages: percentage increase on a price"}, {"id": "m18-percentages:r-m18-8", "level": "stretch", "type": "text", "q": "A pair of gloves is reduced by 25% in a sale. They now cost 54 pounds. What was the price before the sale, in pounds?", "answer": "72", "accept": ["72", "72.0", "72 pounds", "£72"], "hint": "The 54 pounds is what is left after a quarter was taken off. What fraction of the old price is that?", "explain": "The answer is 72 pounds. Taking 25% off leaves 75% of the old price, so 54 pounds is 75%, which is three quarters. One quarter is 54 divided by 3 = 18 pounds, so the whole price is 4 x 18 = 72 pounds. Check it forwards: 25% of 72 is 18, and 72 - 18 = 54, which matches. The wrong move is adding 25% to 54, giving 67.50, because that takes a quarter of the sale price instead of a quarter of the original.", "topic": "percentages: reverse percentage after a decrease"}], "m19-sequences": [{"id": "m19-sequences:r-m19-1", "level": "easy", "type": "mc", "q": "A sequence starts 5, 11, 17, 23. What is the term to term rule?", "options": ["Add 6", "Add 5", "Multiply by 2", "Add 11"], "answer": "Add 6", "hint": "Work out the gap between the first two terms, then check the same gap works for the next pair.", "explain": "The answer is add 6. The gap from 5 to 11 is 6, from 11 to 17 is 6, and from 17 to 23 is 6, so the rule is add 6 every time. Always check the gap on more than one pair, because a rule that only fits the first jump is not the rule of the sequence.", "topic": "sequences: finding the term to term rule"}, {"id": "m19-sequences:r-m19-2", "level": "easy", "type": "text", "q": "A sequence starts 30, 26, 22, 18. What is the next term?", "answer": "14", "accept": ["14", "14.0"], "hint": "The terms are going down. Work out by how much each time.", "explain": "The answer is 14. Each term is 4 less than the one before, since 30 - 26 = 4 and 26 - 22 = 4. So the next term is 18 - 4 = 14. A descending sequence works exactly like an ascending one, the step is just negative.", "topic": "sequences: continuing a descending sequence"}, {"id": "m19-sequences:r-m19-3", "level": "easy", "type": "text", "q": "The nth term of a sequence is 7n - 2. What is the 6th term?", "answer": "40", "accept": ["40", "40.0"], "hint": "n stands for the position, so put 6 in place of n.", "explain": "The answer is 40. The n in the rule stands for the position of the term, so for the 6th term you substitute n = 6: 7 x 6 = 42, then 42 - 2 = 40. The rule lets you jump straight to any term without listing the ones before it, which is the whole point of having it.", "topic": "sequences: using the nth term to find a term"}, {"id": "m19-sequences:r-m19-4", "level": "medium", "type": "text", "q": "A sequence starts 3, 9, 15, 21. Write down the nth term.", "answer": "6n - 3", "accept": ["6n - 3", "6n-3", "6n -3", "6 n - 3"], "hint": "The step gives you the number in front of n. Then compare your times table with the real sequence.", "explain": "The answer is 6n - 3. The step is 6, so the rule starts with 6n. Write out 6n: 6, 12, 18, 24. Compare with the sequence: 3, 9, 15, 21. Every term is 3 less than the 6 times table, so the rule is 6n - 3. Check it at n = 4: 6 x 4 - 3 = 21, which matches the fourth term.", "topic": "sequences: finding the nth term of an ascending sequence"}, {"id": "m19-sequences:r-m19-5", "level": "medium", "type": "text", "q": "The nth term of a sequence is 8n + 5. What is the 50th term?", "answer": "405", "accept": ["405", "405.0"], "hint": "Substitute n = 50. Do the multiplying before the adding.", "explain": "The answer is 405. Put n = 50 into the rule: 8 x 50 = 400, then 400 + 5 = 405. BIDMAS puts the multiplying before the adding, so it is not 8 x 55. This is where the nth term earns its keep, because listing 50 terms by hand would take a page and one slip would ruin it.", "topic": "sequences: finding a distant term from the nth term"}, {"id": "m19-sequences:r-m19-6", "level": "medium", "type": "mc", "q": "A sequence starts 9, 14, 19, 24. Someone says the nth term is 5n. What is wrong with that?", "options": ["5n gives 5, 10, 15, 20, which is 4 short every time, so the rule is 5n + 4", "5n gives 5, 10, 15, 20, which is 4 too big every time, so the rule is 5n - 4", "The step is 4, not 5, so the rule should be 4n", "Nothing is wrong, 5n is correct"], "answer": "5n gives 5, 10, 15, 20, which is 4 short every time, so the rule is 5n + 4", "hint": "Write out 5n for the first four positions and line it up underneath the real sequence.", "explain": "The answer is that 5n is 4 short every time, so the rule is 5n + 4. They got the step right, which is the hard half. 5n gives 5, 10, 15, 20 while the sequence is 9, 14, 19, 24, and each real term is 4 bigger, so you add 4. Check it at n = 3: 5 x 3 + 4 = 19, which matches. Writing the times table underneath the sequence is the habit that makes this adjustment obvious.", "topic": "sequences: correcting an nth term that misses the adjustment"}, {"id": "m19-sequences:r-m19-7", "level": "medium", "type": "text", "q": "A sequence starts 6, 13, 20, 27. The number 62 is one of its terms. Which position is it in?", "answer": "9", "accept": ["9", "9.0", "9th", "position 9"], "hint": "Find the nth term first, then work backwards from 62 to n.", "explain": "The answer is position 9. The step is 7, so the rule starts with 7n. 7n gives 7, 14, 21, 28, which is 1 more than the sequence every time, so the nth term is 7n - 1. Now work backwards from 62: 7n - 1 = 62, so 7n = 63, so n = 9. Check it forwards: 7 x 9 - 1 = 62, which matches. The answer here is a position, not a term, so 9 is what goes down rather than 62.", "topic": "sequences: working backwards from a term to its position"}, {"id": "m19-sequences:r-m19-8", "level": "stretch", "type": "text", "q": "A sequence starts 80, 74, 68, 62 and carries on in the same way. What is the 12th term?", "answer": "14", "accept": ["14", "14.0"], "hint": "The sequence goes down, so the number in front of n is negative. Find the rule, then substitute 12.", "explain": "The answer is 14. The step is -6, so the rule contains -6n. Write out -6n: -6, -12, -18, -24. The sequence is 80, 74, 68, 62, which is 86 more than that every time, so the nth term is 86 - 6n. Check it at n = 1: 86 - 6 = 80, correct. Now the 12th term: 86 - 6 x 12 = 86 - 72 = 14. A descending rule follows exactly the same method, the only change is that the step is negative.", "topic": "sequences: nth term of a descending sequence"}], "s6-forces": [{"id": "s6-forces:r-s6-1", "level": "easy", "type": "mc", "q": "A crane has a label showing how hard it can pull. Which unit will that pulling force be given in?", "options": ["Newtons", "Kilograms", "Joules", "Pascals"], "answer": "Newtons", "hint": "Force has its own unit, named after the scientist who worked out the laws of motion.", "explain": "The answer is newtons, written N. Every force is measured in newtons, whether it is a pull, a push, friction or weight. Kilograms measure mass, which is a different thing, joules measure energy and pascals measure pressure. Getting the unit right is free marks, so it is worth being strict about it.", "topic": "forces: units of force"}, {"id": "s6-forces:r-s6-2", "level": "easy", "type": "text", "q": "A toolbox has a mass of 8 kg. Gravitational field strength is 10 N/kg. Work out the weight of the toolbox, in newtons.", "answer": "80", "accept": ["80", "80.0", "80N", "80 N", "80 newtons"], "hint": "Weight = mass x gravitational field strength.", "explain": "The answer is 80 N. Weight = mass x gravitational field strength, so 8 x 10 = 80 N. Every kilogram of mass is pulled with 10 N on Earth, so 8 kg is pulled with 80 N. Notice the answer is in newtons, not kilograms, because weight is a force.", "topic": "forces: calculating weight from mass"}, {"id": "s6-forces:r-s6-3", "level": "easy", "type": "mc", "q": "A lift is moving upwards and the forces on it are balanced. What is the lift doing?", "options": ["Moving upwards at a steady speed", "Slowing down and stopping", "Speeding up", "Standing still, since balanced forces always mean no movement"], "answer": "Moving upwards at a steady speed", "hint": "Balanced forces do not change motion. They keep whatever is already happening going.", "explain": "The answer is moving upwards at a steady speed. Balanced forces mean the resultant is zero, and a zero resultant changes nothing about the motion. If the lift was already moving it keeps moving at the same speed in the same direction. The common wrong idea is that balanced forces must mean stopped. Stopped is only one of the two options, and the other is steady speed.", "topic": "forces: what balanced forces do to motion"}, {"id": "s6-forces:r-s6-4", "level": "medium", "type": "text", "q": "A speedboat engine pushes it forwards with 450 N. Water drag pushes back with 170 N. What is the resultant force on the boat, in newtons?", "answer": "280", "accept": ["280", "280.0", "280N", "280 N", "280 newtons"], "hint": "The forces are in opposite directions, so one takes away from the other.", "explain": "The answer is 280 N. Opposite forces are subtracted: 450 - 170 = 280 N, acting forwards, because the bigger force is the forwards one. Adding them to get 620 N would only be right if both forces pushed the same way. Since the resultant is not zero the forces are unbalanced, so the boat speeds up.", "topic": "forces: resultant of two unequal opposite forces"}, {"id": "s6-forces:r-s6-5", "level": "medium", "type": "mc", "q": "A crate of mass 25 kg hangs completely still from a rope. Gravitational field strength is 10 N/kg. What is the size and direction of the force the rope pulls on the crate with?", "options": ["250 N upwards", "250 N downwards", "25 N upwards", "0 N, because it is not moving"], "answer": "250 N upwards", "hint": "Still means balanced. Work out the weight first, then say what has to cancel it.", "explain": "The answer is 250 N upwards. First the weight: 25 x 10 = 250 N pulling down. The crate is completely still, so the forces on it are balanced, which means the rope must pull with exactly the same size force in the opposite direction. That is 250 N upwards. The answer 25 N comes from giving the mass instead of the weight, and 0 N mixes up the resultant force, which is zero, with the rope's own force, which is not.", "topic": "forces: using balanced forces to find a missing force"}, {"id": "s6-forces:r-s6-6", "level": "medium", "type": "mc", "q": "A suitcase is taken from Earth to the Moon, where gravity is weaker. Which sentence is correct?", "options": ["Its mass stays the same and its weight gets smaller", "Its mass gets smaller and its weight stays the same", "Both its mass and its weight get smaller", "Both its mass and its weight stay the same"], "answer": "Its mass stays the same and its weight gets smaller", "hint": "Mass counts how much stuff is in it. Weight is the pull of gravity on that stuff.", "explain": "The answer is that the mass stays the same and the weight gets smaller. Mass is the amount of matter in the suitcase, measured in kilograms, and moving it somewhere else does not add or remove any matter. Weight is the force of gravity pulling on that mass, measured in newtons, so a weaker gravitational field means a smaller weight. Same suitcase, same mass, lighter pull.", "topic": "forces: mass against weight"}, {"id": "s6-forces:r-s6-7", "level": "stretch", "type": "text", "q": "A trailer has a weight of 4500 N on Earth, where the gravitational field strength is 10 N/kg. Work out the mass of the trailer, in kilograms.", "answer": "450", "accept": ["450", "450.0", "450kg", "450 kg"], "hint": "Forwards you multiply the mass by 10. So going backwards you divide.", "explain": "The answer is 450 kg. Forwards the rule is weight = mass x gravitational field strength. Here you are given the weight and asked for the mass, so you run it backwards and divide: 4500 divided by 10 = 450 kg. Check it forwards: 450 x 10 = 4500 N, which matches. Multiplying by 10 here would give 45000, which is the forward move used when the question asked for the backwards one.", "topic": "forces: working backwards from weight to mass"}, {"id": "s6-forces:r-s6-8", "level": "stretch", "type": "text", "q": "An astronaut has a mass of 45 kg. On Mars the gravitational field strength is 3.7 N/kg. Work out her weight on Mars, in newtons.", "answer": "166.5", "accept": ["166.5", "166.50", "166.5N", "166.5 N", "166.5 newtons"], "hint": "Same formula as on Earth, just with a different field strength. Her mass does not change.", "explain": "The answer is 166.5 N. Weight = mass x gravitational field strength, so 45 x 3.7 = 166.5 N. Break it down if that multiplication is awkward: 45 x 3 = 135 and 45 x 0.7 = 31.5, and 135 + 31.5 = 166.5. Her mass is still 45 kg on Mars, because mass never changes with location. Sense check: 3.7 is a bit over a third of Earth's 10, and 166.5 N is a bit over a third of her Earth weight of 450 N.", "topic": "forces: weight in a different gravitational field"}], "s7-forces-calc": [{"id": "s7-forces-calc:r-s7-1", "level": "easy", "type": "text", "q": "A runner covers 180 m in 30 s. Work out the speed in m/s.", "answer": "6", "accept": ["6", "6.0", "6m/s", "6 m/s"], "hint": "Speed = distance divided by time.", "explain": "The answer is 6 m/s. Speed = distance divided by time, so 180 divided by 30 = 6 m/s. The unit tells you the sum: metres per second means metres divided by seconds. Multiplying instead would give 5400, which would mean he covered over five kilometres in half a minute.", "topic": "speed: calculating speed from distance and time"}, {"id": "s7-forces-calc:r-s7-2", "level": "easy", "type": "mc", "q": "A student writes down a pressure of 400 with no unit. Which unit should be written after it?", "options": ["Pa, the pascal, which is the same as N/m^2", "N, the newton", "m^2, square metres", "m/s, metres per second"], "answer": "Pa, the pascal, which is the same as N/m^2", "hint": "Pressure is force divided by area. The unit is built from those two units.", "explain": "The answer is Pa, the pascal, which is the same as N/m^2. Pressure is force divided by area, so its unit is newtons divided by square metres, and that combination is given the name pascal. Newtons on their own are for force, and square metres on their own are for area. Writing the unit after every answer is a habit worth keeping, because a number with no unit does not say what it is.", "topic": "pressure: units of pressure"}, {"id": "s7-forces-calc:r-s7-3", "level": "easy", "type": "text", "q": "A crate pushes down with a force of 240 N onto an area of 4 m^2. Work out the pressure in Pa.", "answer": "60", "accept": ["60", "60.0", "60Pa", "60 Pa", "60 pascals"], "hint": "Pressure = force divided by area.", "explain": "The answer is 60 Pa. Pressure = force divided by area, so 240 divided by 4 = 60 Pa. That means every square metre under the crate is being pushed on with 60 N. Check it backwards: 60 Pa x 4 m^2 = 240 N, which is the force you started with.", "topic": "pressure: calculating pressure from force and area"}, {"id": "s7-forces-calc:r-s7-4", "level": "medium", "type": "text", "q": "A cyclist covers 240 m at a steady speed of 16 m/s. How long does it take, in seconds?", "answer": "15", "accept": ["15", "15.0", "15s", "15 s", "15 seconds"], "hint": "You have the distance and the speed. Time = distance divided by speed.", "explain": "The answer is 15 s. Speed = distance divided by time, so to find the time you rearrange to time = distance divided by speed: 240 divided by 16 = 15 s. Check it forwards: 16 m/s for 15 s covers 16 x 15 = 240 m, which matches. Multiplying 240 by 16 would give 3840 seconds, which is over an hour to cycle 240 m, so the size alone would tell you it was wrong.", "topic": "speed: rearranging to find time"}, {"id": "s7-forces-calc:r-s7-5", "level": "medium", "type": "text", "q": "A kayak keeps a steady speed of 12 m/s for 25 s. How far does it travel, in metres?", "answer": "300", "accept": ["300", "300.0", "300m", "300 m", "300 metres"], "hint": "Speed tells you the metres covered each second. You have 25 of those seconds.", "explain": "The answer is 300 m. Distance = speed x time, so 12 x 25 = 300 m. Think about what the speed means: 12 metres go by every second, so in 25 seconds you get 25 lots of 12. This is the one rearrangement that multiplies rather than divides, because the quantity you want is on its own on the top of the formula.", "topic": "speed: rearranging to find distance"}, {"id": "s7-forces-calc:r-s7-6", "level": "medium", "type": "text", "q": "A phone lies flat on a table, pushing down with a force of 36 N onto an area of 0.04 m^2. Work out the pressure in Pa.", "answer": "900", "accept": ["900", "900.0", "900Pa", "900 Pa", "900 pascals"], "hint": "Dividing by a number below 1 makes the answer bigger. Estimate before you start.", "explain": "The answer is 900 Pa. Pressure = force divided by area, so 36 divided by 0.04. Dividing by 0.04 asks how many lots of 0.04 fit into 36, and small pieces means a lot of them fit, so the answer is much bigger than 36. It is 900 Pa. If it helps, multiply both numbers by 100 first: 3600 divided by 4 = 900, and scaling both the same way does not change the answer. Check backwards: 900 x 0.04 = 36 N.", "topic": "pressure: dividing by a decimal area"}, {"id": "s7-forces-calc:r-s7-7", "level": "stretch", "type": "text", "q": "A generator pushes down with a force of 750 N and produces a pressure of 2500 Pa on the floor. Work out the area of its base, in m^2.", "answer": "0.3", "accept": ["0.3", ".3", "0.30", "0.3m2", "0.3 m2", "0.3 m^2"], "hint": "Pressure = force divided by area, so area = force divided by pressure.", "explain": "The answer is 0.3 m^2. Start from pressure = force divided by area and rearrange to area = force divided by pressure: 750 divided by 2500 = 0.3 m^2. Check it forwards: 750 divided by 0.3 = 2500 Pa, which matches. Dividing 2500 by 750 the wrong way round would give about 3.3, and a base of over three square metres under a generator would be enormous, so the size check catches it.", "topic": "pressure: rearranging to find area"}, {"id": "s7-forces-calc:r-s7-8", "level": "stretch", "type": "text", "q": "A walker covers 5.4 km in 45 minutes. Work out the speed in m/s. Convert the units first.", "answer": "2", "accept": ["2", "2.0", "2m/s", "2 m/s"], "hint": "m/s means metres on top and seconds underneath. Change both before you divide anything.", "explain": "The answer is 2 m/s. The unit asked for is m/s, so both quantities have to match it before you divide. Distance: 5.4 km x 1000 = 5400 m. Time: 45 minutes x 60 = 2700 s. Now divide: 5400 divided by 2700 = 2 m/s. Doing 5.4 divided by 45 first gives 0.12, which is in km per minute, not m/s. Convert first, then calculate, and the unit is right automatically.", "topic": "speed: converting units before calculating"}], "s8-energy": [{"id": "s8-energy:r-s8-1", "level": "easy", "type": "mc", "q": "An arrow is flying through the air. Which energy store does it have because it is moving?", "options": ["The kinetic store", "The chemical store", "The elastic potential store", "The thermal store"], "answer": "The kinetic store", "hint": "Kinetic is the word for movement.", "explain": "The answer is the kinetic store. Anything that is moving has energy in its kinetic store, and the faster and heavier it is, the more it holds. The elastic potential store was the one that was full while the bow was drawn back, and it emptied into the kinetic store when the arrow was released.", "topic": "energy: naming the kinetic store"}, {"id": "s8-energy:r-s8-2", "level": "easy", "type": "mc", "q": "A battery and a plate of pasta both hold energy in the same type of store. Which store is it?", "options": ["The chemical store", "The kinetic store", "The gravitational potential store", "The elastic potential store"], "answer": "The chemical store", "hint": "Both release their energy through a reaction rather than by moving or falling.", "explain": "The answer is the chemical store. Food, fuel and batteries all hold energy in chemical bonds, and it is released when those bonds react. Neither one needs to be moving or lifted up to hold that energy, which is what rules out the kinetic and gravitational potential stores.", "topic": "energy: naming the chemical store"}, {"id": "s8-energy:r-s8-3", "level": "easy", "type": "mc", "q": "Which statement is the law of conservation of energy?", "options": ["Energy cannot be created or destroyed, only transferred from one store to another", "Energy is used up whenever a machine runs", "Energy can be created by a battery and destroyed by a lamp", "Energy always stays in the same store forever"], "answer": "Energy cannot be created or destroyed, only transferred from one store to another", "hint": "Think about whether the total amount of energy ever changes, or just where it is sitting.", "explain": "The answer is that energy cannot be created or destroyed, only transferred. The total never changes, it just moves between stores, and some of it usually spreads out into the surroundings where it is no longer useful. This is the rule that lets you work out wasted energy by subtraction, because whatever went in has to still be accounted for at the end.", "topic": "energy: conservation of energy"}, {"id": "s8-energy:r-s8-4", "level": "medium", "type": "text", "q": "A drill is supplied with 5000 J of energy and 3500 J ends up usefully in the kinetic store of the drill bit. How much energy is wasted, in joules?", "answer": "1500", "accept": ["1500", "1500.0", "1500J", "1500 J", "1500 joules", "1,500"], "hint": "The energy in has to equal the useful energy plus the wasted energy.", "explain": "The answer is 1500 J. Conservation of energy says nothing disappears, so energy in = useful energy + wasted energy. That gives 5000 - 3500 = 1500 J wasted, mostly as heat and sound in the motor and the bit. The wasted energy is still real energy, it has just spread out into the surroundings where you cannot get it back.", "topic": "energy: finding wasted energy using conservation"}, {"id": "s8-energy:r-s8-5", "level": "medium", "type": "text", "q": "That same drill is supplied with 5000 J and transfers 3500 J usefully. Work out its efficiency as a percentage.", "answer": "70", "accept": ["70", "70.0", "70%", "70 %", "70 percent"], "hint": "Efficiency is the useful energy divided by the total energy supplied, then turned into a percentage.", "explain": "The answer is 70%. Efficiency = useful energy divided by total energy supplied, so 3500 divided by 5000 = 0.7, and 0.7 x 100 = 70%. Sense check: 3500 is a bit over two thirds of 5000, and 70% is a bit over two thirds. Efficiency can never go above 100%, so if you get a number bigger than that you have divided the wrong way round.", "topic": "energy: calculating efficiency as a percentage"}, {"id": "s8-energy:r-s8-6", "level": "medium", "type": "text", "q": "A haul bag of mass 25 kg is pulled 6 m straight up a cliff. Gravitational field strength is 10 N/kg. Use energy in the gravitational potential store = mass x gravitational field strength x height to work out how much energy is transferred to that store, in joules.", "answer": "1500", "accept": ["1500", "1500.0", "1500J", "1500 J", "1500 joules", "1,500"], "hint": "Three numbers, all multiplied. Do two of them first, then the third.", "explain": "The answer is 1500 J. Multiply all three: 25 x 10 = 250, then 250 x 6 = 1500 J. Taking it in two steps like that keeps the numbers manageable. The answer is in joules, because it is energy, even though newtons appeared halfway through the working.", "topic": "energy: calculating gravitational potential energy"}, {"id": "s8-energy:r-s8-7", "level": "medium", "type": "mc", "q": "Someone says the energy in a phone battery is used up when the phone goes flat. Why is that wrong?", "options": ["The energy is still there, it has just been transferred out of the chemical store into light, sound and heat that have spread into the surroundings", "The energy was never in the battery in the first place", "The energy is destroyed, but only slowly", "Nothing is wrong, energy really is used up"], "answer": "The energy is still there, it has just been transferred out of the chemical store into light, sound and heat that have spread into the surroundings", "hint": "Conservation of energy says the total never changes. So where did it go?", "explain": "The answer is that the energy is still there but has been transferred out. It left the chemical store of the battery and ended up as light from the screen, sound from the speaker and heat in the components and the air. None of it was destroyed, it just spread out so thinly that you cannot use it again. Used up is the everyday phrase, and in science the accurate word is dissipated.", "topic": "energy: why energy is not used up"}, {"id": "s8-energy:r-s8-8", "level": "stretch", "type": "text", "q": "A motor is 40% efficient. A job needs 1200 J of useful energy from it. How much energy must be supplied to the motor? Give your answer in joules.", "answer": "3000", "accept": ["3000", "3000.0", "3000J", "3000 J", "3000 joules", "3,000"], "hint": "1200 J is the useful 40%, not the total. Work out what 10% would be first.", "explain": "The answer is 3000 J. The 1200 J is the useful part, which is 40% of what goes in. If 40% is 1200 J, then 10% is 1200 divided by 4 = 300 J, so 100% is 10 x 300 = 3000 J. Check it forwards: 40% of 3000 is 1200 J, which matches. The wrong move is taking 40% of 1200, which gives 480 and is smaller than the useful energy, and no motor can put out more than it takes in.", "topic": "energy: working backwards from efficiency"}], "s9-practical-skills": [{"id": "s9-practical-skills:r-s9-1", "level": "easy", "type": "mc", "q": "Amina hangs different masses on a spring and measures how far the spring stretches each time. What is the independent variable?", "options": ["The mass hung on the spring", "How far the spring stretches", "The spring she uses", "The ruler she measures with"], "answer": "The mass hung on the spring", "hint": "The independent variable is the one she chooses and changes on purpose.", "explain": "The answer is the mass hung on the spring. The independent variable is the one you deliberately change, and Amina decides which masses to hang on. How far it stretches is what she measures as a result, so that is the dependent variable, and the spring itself is kept the same, which makes it a control variable.", "topic": "working scientifically: identifying the independent variable"}, {"id": "s9-practical-skills:r-s9-2", "level": "easy", "type": "mc", "q": "In that same spring experiment, what is the dependent variable?", "options": ["How far the spring stretches", "The mass hung on the spring", "The number of readings she takes", "The room temperature"], "answer": "How far the spring stretches", "hint": "The dependent variable is the one you measure, and it depends on what you changed.", "explain": "The answer is how far the spring stretches. The dependent variable is the thing you measure to see what effect your change had, and the stretch depends on the mass she chose to hang on. A quick way to keep the two apart is the sentence: I change the mass, so I measure the stretch.", "topic": "working scientifically: identifying the dependent variable"}, {"id": "s9-practical-skills:r-s9-3", "level": "easy", "type": "text", "q": "The time for 10 swings of the same pendulum was measured four times as 18, 19, 17 and 52 seconds. Ignore the anomaly and work out the mean. Give your answer in seconds.", "answer": "18", "accept": ["18", "18.0", "18s", "18 s", "18 seconds"], "hint": "One reading is nothing like the other three. Leave that one out completely, including out of the count.", "explain": "The answer is 18 s. The 52 is the anomaly, because the other three readings sit close together around 18 and 52 is nowhere near them. Leave it out of the calculation entirely: 18 + 19 + 17 = 54, and there are 3 readings left, so 54 divided by 3 = 18 s. The step people forget is dividing by 3 rather than 4. If you drop a reading you must drop it from the count as well.", "topic": "working scientifically: mean with an anomaly removed"}, {"id": "s9-practical-skills:r-s9-4", "level": "medium", "type": "text", "q": "A pupil times how long a trolley takes to roll down a ramp and records 63, 61, 6 and 62 centiseconds. Which reading is the anomaly? Write just the number.", "answer": "6", "accept": ["6", "6.0", "6 centiseconds"], "hint": "Three of the readings are clustered together. Which one does not belong with them?", "explain": "The answer is 6. The readings 63, 61 and 62 are all within two of each other, and 6 is nowhere near that group, so it is the anomaly. It looks like a digit was missed when writing 63 or 62 down. An anomaly is not simply the biggest or smallest reading, it is the one that does not fit the pattern of the others, and here the gap is enormous.", "topic": "working scientifically: spotting an anomaly"}, {"id": "s9-practical-skills:r-s9-5", "level": "medium", "type": "text", "q": "Using those same four readings, 63, 61, 6 and 62 centiseconds, work out the mean with the anomaly left out. Give your answer in centiseconds.", "answer": "62", "accept": ["62", "62.0", "62 centiseconds"], "hint": "Add only the three readings you are keeping, then divide by 3.", "explain": "The answer is 62 centiseconds. Leave the 6 out. Add the rest: 63 + 61 + 62 = 186. There are 3 readings left, so 186 divided by 3 = 62 centiseconds. Sense check: the answer should sit in the middle of the readings you kept, and 62 sits neatly between 61 and 63. Dividing by 4 would give 46.5, which is below every reading you kept and is a sign the count was wrong.", "topic": "working scientifically: mean with an anomaly removed"}, {"id": "s9-practical-skills:r-s9-6", "level": "medium", "type": "text", "q": "The mass of the same steel bolt was measured four times as 4.2, 4.4, 4.3 and 9.1 grams. Ignore the anomaly and work out the mean. Give your answer in grams.", "answer": "4.3", "accept": ["4.3", "4.30", "4.3g", "4.3 g", "4.3 grams"], "hint": "Decimals work exactly the same way. Drop the odd one out, add the rest, divide by how many are left.", "explain": "The answer is 4.3 g. The 9.1 is the anomaly, since the other three are all close to 4.3 and 9.1 is roughly double that. Add the three you keep: 4.2 + 4.4 + 4.3 = 12.9. Divide by 3: 12.9 divided by 3 = 4.3 g. Decimals do not change the method at all. Check the size: the answer must land between 4.2 and 4.4, and it does.", "topic": "working scientifically: mean of decimal readings with an anomaly"}, {"id": "s9-practical-skills:r-s9-7", "level": "medium", "type": "mc", "q": "There are three minutes left in a test and you reach a question giving four readings with one anomaly and asking for the mean. You are not certain you can do it. What is the best thing to do?", "options": ["Write down your best attempt, because a blank always scores zero and an attempt costs nothing", "Leave it blank, because a wrong answer loses marks", "Leave it blank and go back to check earlier questions instead", "Write down all four readings added together and leave it there"], "answer": "Write down your best attempt, because a blank always scores zero and an attempt costs nothing", "hint": "What is the worst that can happen if you write something and it is wrong?", "explain": "The answer is to write down your best attempt. Marks are never taken away for a wrong answer in these tests, so a blank scores zero for certain while an attempt can only be worth zero or more. Method marks exist too, so even crossing out the anomaly and writing the addition can score. The last few questions of a paper are usually the cheapest marks left on the table, precisely because people run out of time and stop.", "topic": "working scientifically: never leaving a question blank"}, {"id": "s9-practical-skills:r-s9-8", "level": "stretch", "type": "text", "q": "A pupil measures the same bounce height three times and records 30, 32 and 31 cm. Read the readings carefully before you decide what to do. Work out the mean, in cm.", "answer": "31", "accept": ["31", "31.0", "31cm", "31 cm"], "hint": "Check whether any reading is actually far off the others before you remove anything.", "explain": "The answer is 31 cm. There
