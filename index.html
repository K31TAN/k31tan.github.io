", "am montag faehrt mein bruder nach berlin", "Am Montag faehrt mein Bruder nach Berlin.", "am montag faehrt mein bruder nach berlin.", "am montag fährt mein bruder nach berlin.", "Am Montag fährt mein Bruder nach Berlin", "am montag fährt mein bruder nach berlin"], "hint": "My brother counts as he, so the verb changes its vowel.", "explain": "The answer is Am Montag faehrt mein Bruder nach Berlin. Bruder is a der word, so my brother is mein Bruder, and it counts as er. That makes fahren change to faehrt. Am Montag is idea one, so faehrt is idea two and mein Bruder follows in third place.", "topic": "dialogue: fronting with a noun subject and an irregular verb"}]}}, "tests": {"w3-test": {"bands": [{"level": 1, "label": "Warm up", "descriptor": "One step each. Nothing hidden. Settle in and get these banked.", "extract": null, "questions": [{"id": "w3-test:t1", "type": "text", "q": "Work out 2/3 x 1/5. Give your answer as a fraction.", "answer": "2/15", "accept": ["2/15", "2 / 15", "2 over 15", "two fifteenths"], "hint": "", "explain": "The answer is 2/15. To multiply fractions, multiply the top numbers together and multiply the bottom numbers together. 2 x 1 = 2 on the top, and 3 x 5 = 15 on the bottom, giving 2/15. Check the size: you are taking two thirds OF one fifth, so the answer must be smaller than 1/5, and 2/15 is smaller than 3/15 which is 1/5. An answer of 13/15 comes from adding instead of multiplying.", "topic": "maths: multiplying two fractions"}, {"id": "w3-test:t2", "type": "text", "q": "Work out 1/3 x 12.", "answer": "4", "accept": ["4", "4.0", "12/3", "four"], "hint": "", "explain": "The answer is 4. Read the multiply sign as the word of, so this is a third of 12. Split 12 into 3 equal groups and each group holds 4. You want one group, so the answer is 4. It has to be smaller than 12, because you are taking a part of it.", "topic": "maths: fraction of a whole number"}, {"id": "w3-test:t3", "type": "text", "q": "How many halves are there in 6? In other words, work out 6 divided by 1/2.", "answer": "12", "accept": ["12", "12.0", "twelve"], "hint": "", "explain": "The answer is 12. Picture 6 pizzas cut in half. Each pizza gives 2 halves, so 6 pizzas give 6 x 2 = 12 halves. Dividing by a fraction smaller than 1 always makes the answer BIGGER, because you are counting how many small pieces fit inside.", "topic": "maths: dividing by a fraction"}, {"id": "w3-test:t4", "type": "mc", "q": "Which of these years came FIRST in time?", "options": ["200 BC", "50 BC", "AD 50", "AD 200"], "answer": "200 BC", "hint": "", "explain": "200 BC came first. BC years count backwards towards zero, so a bigger BC number means longer ago. 200 BC is earlier than 50 BC, and every BC year is earlier than every AD year. The full order here is 200 BC, then 50 BC, then AD 50, then AD 200.", "topic": "history: BC and AD ordering"}, {"id": "w3-test:t5", "type": "mc", "q": "In a six figure grid reference such as 315 524, which part comes first?", "options": ["The eastings, read along the bottom", "The northings, read up the side", "The larger of the two numbers", "The tenths"], "answer": "The eastings, read along the bottom", "hint": "", "explain": "The eastings always come first. Along the corridor, then up the stairs. In 315 524 the first three figures, 315, are the easting line 31 plus 5 tenths east. The last three, 524, are the northing line 52 plus 4 tenths north.", "topic": "geography: six figure grid references, order"}, {"id": "w3-test:t6", "type": "text", "q": "The sun heats a lake and liquid water turns into water vapour and rises. What is this stage of the water cycle called?", "answer": "evaporation", "accept": ["evaporation", "Evaporation", "evaporating", "evaporates", "evaporate"], "hint": "", "explain": "This is evaporation. Heat energy from the sun gives the water particles enough energy to escape the liquid and become a gas. If it had happened from the leaves of a plant instead it would be called transpiration, and the reverse process, gas back to liquid, is condensation.", "topic": "geography: water cycle, evaporation"}, {"id": "w3-test:t7", "type": "mc", "q": "Two lamps are in a SERIES circuit, on one single loop. One lamp is taken out. What happens to the other lamp?", "options": ["It goes out", "It stays lit at the same brightness", "It stays lit but dimmer", "It gets brighter"], "answer": "It goes out", "hint": "", "explain": "It goes out. A series circuit has only one path, so removing a lamp leaves a gap in that path. Current cannot flow across a gap, so nothing in the circuit works. In a parallel circuit the answer would be the opposite, because each branch is its own complete loop.", "topic": "science: series circuit, removing a lamp"}, {"id": "w3-test:t8", "type": "text", "q": "What is the name of the change of state from a solid to a liquid?", "answer": "melting", "accept": ["melting", "Melting", "melt", "melts", "fusion"], "hint": "", "explain": "Solid to liquid is melting. The energy going in breaks the forces holding the particles in a fixed pattern, so they can slide past each other. The opposite change, liquid to solid, is freezing.", "topic": "science: changes of state, melting"}, {"id": "w3-test:t9", "type": "mc", "q": "In an experiment, what is the independent variable?", "options": ["The one thing you deliberately change", "The thing you measure", "Everything you keep the same", "The result you expected to get"], "answer": "The one thing you deliberately change", "hint": "", "explain": "The independent variable is the one thing you deliberately change. What you measure is the dependent variable, and everything you keep the same is a control variable. Say it as a sentence to check: I change the ..., and I measure the ...", "topic": "science: working scientifically, variables"}, {"id": "w3-test:t10", "type": "text", "q": "How many years are there in one century?", "answer": "100", "accept": ["100", "one hundred", "a hundred", "hundred", "100 years"], "hint": "", "explain": "There are 100 years in a century. Cent means hundred, the same root as in centimetre, which is a hundredth of a metre, and centipede. A decade is 10 years and a millennium is 1000 years.", "topic": "history: length of a century"}]}, {"level": 2, "label": "Building", "descriptor": "Two steps, or one step plus a decision about what to do.", "extract": "THE PASSAGE. Each sentence is numbered. There are mistakes in it.\n\n(1) last saturday the school football team travelled to Cardiff.\n(2) The coach told them the players kit was already loaded on the bus.\n(3) They arrived quickly, but nobody could find there boots.\n(4) The childrens changing room was locked, so the team waited outside in the rain.\n(5) Sam scored in the final minute and the coach shouted himself hoarse.", "questions": [{"id": "w3-test:t11", "type": "text", "q": "Work out 9 divided by 2.", "answer": "4.5", "accept": ["4.5", "4.50", "4 1/2", "four and a half", "9/2"], "hint": "", "explain": "The answer is 4.5. Half of 8 is 4, and half of the 1 left over is 0.5, so 4 + 0.5 = 4.5. Halving an odd number always leaves a half on the end. The answer is not 45. That is the same digits with the decimal point in the wrong place, and it is ten times too big.", "topic": "maths: division giving a decimal answer"}, {"id": "w3-test:t12", "type": "text", "q": "Work out 3/4 x 20.", "answer": "15", "accept": ["15", "15.0", "fifteen"], "hint": "", "explain": "The answer is 15. Read it as three quarters of 20. Find one quarter first: 20 divided by 4 = 5. Then take three of them: 3 x 5 = 15. The answer must be smaller than 20, because three quarters is less than a whole.", "topic": "maths: fraction times a whole number"}, {"id": "w3-test:t13", "type": "mc", "q": "Share 40 in the ratio 3:5. What are the two shares?", "options": ["15 and 25", "20 and 20", "12 and 28", "3 and 5"], "answer": "15 and 25", "hint": "", "explain": "The shares are 15 and 25. Add the ratio numbers to find the total number of parts: 3 + 5 = 8. Divide the amount by the parts: 40 divided by 8 = 5, so one part is worth 5. Then 3 parts is 3 x 5 = 15 and 5 parts is 5 x 5 = 25. Check: 15 + 25 = 40, which is the amount you started with.", "topic": "maths: sharing in a ratio"}, {"id": "w3-test:t14", "type": "text", "q": "A triangle has a base of 10 cm and a height of 6 cm. What is its area in square centimetres?", "answer": "30", "accept": ["30", "30.0", "30 cm2", "30cm2", "30 cm^2", "thirty"], "hint": "", "explain": "The area is 30 square centimetres. The rule is area = 1/2 x base x height. So 10 x 6 = 60, and half of 60 is 30. The halving is the step people forget. Forgetting it gives 60, which is the area of the rectangle around the triangle, and a triangle is exactly half of that.", "topic": "maths: area of a triangle"}, {"id": "w3-test:t15", "type": "text", "q": "Simplify 3a + 4a + 2.", "answer": "7a + 2", "accept": ["7a + 2", "7a+2", "2 + 7a", "2+7a", "7a plus 2"], "hint": "", "explain": "The answer is 7a + 2. Collect like terms. 3a and 4a are both lots of a, so they add together to make 7a. The 2 is a plain number with no a attached, so it cannot be joined to the a terms and has to be left on its own. Writing 9a would be wrong, because you cannot add a number to a lot of a.", "topic": "maths: simplifying expressions"}, {"id": "w3-test:t16", "type": "mc", "q": "In sentence 3 of the passage, which word is an adverb?", "options": ["quickly", "arrived", "nobody", "boots"], "answer": "quickly", "hint": "", "explain": "The adverb is quickly. An adverb tells you more about a verb, usually how, when or where something is done. Here it tells you HOW they arrived. Arrived is the verb itself, nobody is a pronoun, and boots is a noun. Not every adverb ends in ly, but a word ending in ly that describes an action almost always is one.", "topic": "english: identifying an adverb"}, {"id": "w3-test:t17", "type": "mc", "q": "In sentence 1 of the passage, what word class is the word travelled?", "options": ["Verb", "Noun", "Adjective", "Adverb"], "answer": "Verb", "hint": "", "explain": "Travelled is a verb. A verb is a doing or being word, and travelled is the action the team performed. Team and Cardiff are nouns, school is being used to describe which team so it acts like an adjective, and there is no adverb in that sentence.", "topic": "english: word classes"}, {"id": "w3-test:t18", "type": "mc", "q": "Sentence 4 says The childrens changing room was locked. How should childrens be written?", "options": ["children's", "childrens'", "childrens", "childrens's"], "answer": "children's", "hint": "", "explain": "It should be children's. Children is already a plural, and it does not end in s. For a plural that does not end in s, you add an apostrophe and then an s, exactly as you would for a singular word. So it is children's, women's, men's and people's. You only put the apostrophe after the s when the plural already ends in s, such as the players' kit.", "topic": "english: apostrophes with irregular plurals"}, {"id": "w3-test:t19", "type": "mc", "q": "In sentence 3, one word is the wrong spelling of a word that sounds the same. Which correction is needed?", "options": ["there should be their", "their should be there", "quickly should be quick", "nobody should be no body"], "answer": "there should be their", "hint": "", "explain": "There should be their. Their means belonging to them, and the boots belong to the players, so it needs their. There means in that place, as in over there. The third spelling, they're, is short for they are. Test it by trying they are in the sentence: nobody could find they are boots makes no sense, so it is not that one.", "topic": "english: homophones, there and their"}, {"id": "w3-test:t20", "type": "mc", "q": "Sentence 1 begins: last saturday the school football team travelled to Cardiff. Which words need capital letters?", "options": ["last and saturday", "school and team", "team and travelled", "football and team"], "answer": "last and saturday", "hint": "", "explain": "Last and saturday both need capitals. Last needs one because it is the first word of the sentence, and every sentence starts with a capital. Saturday needs one because days of the week are proper nouns, like months and people's names. School, football, team and travelled are all ordinary words in the middle of a sentence, so they stay lower case.", "topic": "english: capital letters and proper nouns"}]}, {"level": 3, "label": "Harder", "descriptor": "Read the map or the information carefully before you answer. The trap is usually in the detail.", "extract": "THE MAP: Hollow Brook.\n\nEach grid square is 1 km by 1 km.\nEastings run up the map and are numbered 20, 21, 22, 23, 24, 25 from left to right.\nNorthings run across the map and are numbered 70, 71, 72, 73, 74, 75 from bottom to top.\n\nSCALE: 2 cm on the map stands for 1 km on the ground.\n\nPLACES, given as six figure grid references.\nThe mill: 214 726\nThe ford: 237 703\nThe mast: 245 741\nThe car park: 226 715\n\nRULER READINGS taken on this map.\nCar park to mill: 7 cm\nMill to mast: 4 cm\nMast to ford: 3.5 cm", "questions": [{"id": "w3-test:t21", "type": "mc", "q": "In which century was the year 1850?", "options": ["The 19th century", "The 18th century", "The 20th century", "The 85th century"], "answer": "The 19th century", "hint": "", "explain": "1850 was in the 19th century. Take the first two digits, 18, and add 1 to get 19. That works because the 19th century runs from 1801 to 1900. It feels one out, and that is because the first century ran from year 1 to year 100, so every century since has been numbered one ahead of its hundreds digits.", "topic": "history: converting a year to a century"}, {"id": "w3-test:t22", "type": "mc", "q": "In which century was the year 1700?", "options": ["The 17th century", "The 18th century", "The 16th century", "The 70th century"], "answer": "The 17th century", "hint": "", "explain": "1700 was in the 17th century, not the 18th. This is the boundary trap. The 17th century runs from 1601 all the way to 1700, so a year ending in exactly 00 is the LAST year of its century, not the first year of the next one. The 18th century starts the following year, in 1701. The add one rule only works for years that do not end in 00.", "topic": "history: century boundary trap"}, {"id": "w3-test:t23", "type": "mc", "q": "Put these periods of British history in order, earliest first.", "options": ["Romans, Anglo-Saxons, Normans, Tudors", "Anglo-Saxons, Romans, Normans, Tudors", "Romans, Normans, Anglo-Saxons, Tudors", "Normans, Romans, Tudors, Anglo-Saxons"], "answer": "Romans, Anglo-Saxons, Normans, Tudors", "hint": "", "explain": "The order is Romans, Anglo-Saxons, Normans, Tudors. The Romans invaded in AD 43 and left around AD 410. The Anglo-Saxons then ruled until 1066. The Normans arrived in 1066 when William won at Hastings. The Tudors came much later, starting in 1485 with Henry VII. Anchor the whole sequence on 1066, because everything before it is Anglo-Saxon and everything just after it is Norman.", "topic": "history: ordering British periods"}, {"id": "w3-test:t24", "type": "mc", "q": "Which place on the map is at 245 741?", "options": ["The mast", "The mill", "The ford", "The car park"], "answer": "The mast", "hint": "", "explain": "245 741 is the mast. Match the digits exactly against the list. The mill is 214 726, the ford is 237 703 and the car park is 226 715, so none of those begin with 245. Reading the eastings group first is what makes this quick.", "topic": "geography: reading a six figure grid reference"}, {"id": "w3-test:t25", "type": "text", "q": "The ford is at 237 703. Which four figure grid square is the ford in?", "answer": "2370", "accept": ["2370", "23 70"], "hint": "", "explain": "The answer is 2370. Cross off the tenths, which are the third figure and the sixth figure. That leaves 23 from the eastings and 70 from the northings, giving square 2370. The zero has to be written. The northing line is 70, not 7, so an answer of 237 would be wrong.", "topic": "geography: six figure to four figure"}, {"id": "w3-test:t26", "type": "text", "q": "The scale is 2 cm to 1 km. Car park to mill measures 7 cm on the map. How far is that in km? Write just the number.", "answer": "3.5", "accept": ["3.5", "3.50", "3.5 km", "3 1/2", "three and a half"], "hint": "", "explain": "The answer is 3.5 km. Every 2 cm is 1 km, so divide the centimetres by 2. Half of 6 is 3, and half of the remaining 1 is 0.5, so 3 + 0.5 = 3.5. Estimate to check: 8 cm would be 4 km, so an answer just under 4 km is right. An answer of 35 would be ten times too big.", "topic": "geography: map scale with a decimal answer"}, {"id": "w3-test:t27", "type": "text", "q": "Mill to mast measures 4 cm and mast to ford measures 3.5 cm. The scale is 2 cm to 1 km. What is the TOTAL distance in km? Write just the number.", "answer": "3.75", "accept": ["3.75", "3.75 km", "3 3/4"], "hint": "", "explain": "The answer is 3.75 km. Add the centimetres first: 4 + 3.5 = 7.5 cm. Then halve it once: half of 7 is 3.5 and half of 0.5 is 0.25, so 3.5 + 0.25 = 3.75 km. Adding first means you only divide once, so there is only one chance to slip. Estimate to check: 7.5 cm sits between 6 cm and 8 cm, so the answer must sit between 3 km and 4 km.", "topic": "geography: map scale, total of two distances"}, {"id": "w3-test:t28", "type": "mc", "q": "A grass field beside a river is dug up and covered with concrete for a car park. Heavy rain then falls. What happens?", "options": ["Less infiltration and more surface run-off, so the river fills faster and flood risk rises", "More infiltration and less surface run-off, so the river fills more slowly", "Less evaporation, so less rain falls over the town in future", "Nothing changes, because the same amount of rain falls either way"], "answer": "Less infiltration and more surface run-off, so the river fills faster and flood risk rises", "hint": "", "explain": "Concrete is impermeable, so rain cannot soak into it. Infiltration almost stops, and the water that would have soaked in becomes surface run-off instead. Run-off travels far faster than water moving through soil and rock, so the river fills quickly and flood risk goes up. This is why built up areas flood more readily than fields.", "topic": "geography: water cycle, human impact on run-off"}, {"id": "w3-test:t29", "type": "mc", "q": "Two lamps are on separate branches of a PARALLEL circuit. One lamp is removed. What happens to the other lamp, and why?", "options": ["It stays lit at the same brightness, because its own branch is still a complete path", "It goes out, because the circuit is now broken", "It gets dimmer, because it now has to share less current", "It gets brighter, because it now receives double the voltage"], "answer": "It stays lit at the same brightness, because its own branch is still a complete path", "hint": "", "explain": "It stays lit at the same brightness. In parallel, each branch is its own complete loop from the battery and back, so breaking one branch leaves the other untouched. The remaining lamp still has the full battery voltage across it, exactly as before, so its brightness does not change. It does not get brighter either, because it already had the full voltage.", "topic": "science: parallel circuit, removing a lamp"}, {"id": "w3-test:t30", "type": "mc", "q": "A substance has a melting point of -7 degrees C and a boiling point of 59 degrees C. What state is it in at 20 degrees C?", "options": ["Liquid", "Solid", "Gas", "It is boiling"], "answer": "Liquid", "hint": "", "explain": "It is a liquid. A substance is liquid when the temperature sits between its melting point and its boiling point. 20 is above -7, so it has already melted, and 20 is below 59, so it has not boiled yet. Below -7 it would be solid, and above 59 it would be a gas.", "topic": "science: using melting and boiling points to decide a state"}]}, {"level": 4, "label": "Stretch", "descriptor": "Work backwards, combine two topics, or explain the reasoning. Show your method.", "extract": null, "questions": [{"id": "w3-test:t31", "type": "text", "q": "Work out 2/5 x 3/4. Give your answer as a fraction in its simplest form.", "answer": "3/10", "accept": ["3/10", "3 / 10", "6/20", "0.3", "three tenths"], "hint": "", "explain": "The answer is 3/10. Multiply the tops: 2 x 3 = 6. Multiply the bottoms: 5 x 4 = 20. That gives 6/20. Now simplify by dividing both numbers by 2, which gives 3/10. Check the size: you are taking part of 3/4, so the answer must be smaller than 3/4, and 3/10 is.", "topic": "maths: multiplying fractions and simplifying"}, {"id": "w3-test:t32", "type": "text", "q": "A jug holds 3.5 litres of water. How many quarter litre glasses can be filled from it? In other words, work out 3.5 divided by 1/4.", "answer": "14", "accept": ["14", "14.0", "fourteen", "14 glasses"], "hint": "", "explain": "The answer is 14. Each litre gives 4 quarter litre glasses. 3 litres gives 3 x 4 = 12 glasses, and the extra 0.5 of a litre gives 2 more, because half a litre holds two quarters. 12 + 2 = 14. The quick method is that dividing by 1/4 is the same as multiplying by 4, so 3.5 x 4 = 14. Dividing by a fraction below 1 always gives a bigger answer.", "topic": "maths: dividing by a fraction in context"}, {"id": "w3-test:t33", "type": "mc", "q": "Ali tests how the length of a string changes how fast a pendulum swings. In test 1 he uses a 20 cm string with a heavy metal weight. In test 2 he uses a 40 cm string with a light plastic weight. Why can he not draw a conclusion about string length?", "options": ["He changed two variables at once, so he cannot tell which one caused the difference", "He did not use a long enough string in test 1", "He should have used a stopwatch instead of a clock", "He needed to run the test at least ten times"], "answer": "He changed two variables at once, so he cannot tell which one caused the difference", "hint": "", "explain": "He changed two things: the string length and the weight. If test 2 swings differently, the string length might be responsible, but so might the change of weight. There is no way to separate them, so the experiment cannot answer the question. To fix it, keep the weight identical in both tests and change only the string length. More repeats would make the results more reliable but would not fix an unfair test, because you would just be repeating the same flaw.", "topic": "science: working scientifically, spotting a flawed method"}, {"id": "w3-test:t34", "type": "text", "q": "Some money is shared between two people in the ratio 2:3. The smaller share is 18 pounds. How much money was shared altogether?", "answer": "45", "accept": ["45", "45.0", "£45", "45 pounds", "forty five"], "hint": "", "explain": "The answer is 45 pounds. The smaller share is the 2 parts, and it is worth 18 pounds, so one part is 18 divided by 2 = 9 pounds. The total is 2 + 3 = 5 parts, so 5 x 9 = 45 pounds. Check it: the shares are 2 x 9 = 18 and 3 x 9 = 27, and 18 + 27 = 45. The trap here is assuming 18 is the total instead of one share.", "topic": "maths: ratio, working backwards from one share"}, {"id": "w3-test:t35", "type": "text", "q": "A triangle has an area of 24 square centimetres and a base of 8 cm. What is its height in cm?", "answer": "6", "accept": ["6", "6.0", "6 cm", "6cm", "six"], "hint": "", "explain": "The height is 6 cm. Start from area = 1/2 x base x height. Put in what you know: 24 = 1/2 x 8 x height, which is 24 = 4 x height. So height = 24 divided by 4 = 6 cm. Check it forwards: 1/2 x 8 x 6 = 24, which matches. The common slip is dividing 24 by 8 and answering 3, which forgets the half.", "topic": "maths: area of a triangle, working backwards"}, {"id": "w3-test:t36", "type": "text", "q": "Simplify 5a + 3b - 2a + b.", "answer": "3a + 4b", "accept": ["3a + 4b", "3a+4b", "4b + 3a", "4b+3a", "3a plus 4b"], "hint": "", "explain": "The answer is 3a + 4b. Collect the a terms and the b terms separately. For the a terms: 5a - 2a = 3a. For the b terms: 3b + b = 4b, because a lone b means 1b. The a terms and b terms cannot be joined together, so the answer stays as two terms. Watch the minus sign, it belongs to the 2a and travels with it.", "topic": "maths: simplifying with two variables"}, {"id": "w3-test:t37", "type": "mc", "q": "Which of these gaps of time is longer: from 200 BC to 100 BC, or from AD 100 to AD 250?", "options": ["AD 100 to AD 250, because it is 150 years and the other is 100 years", "200 BC to 100 BC, because the numbers are bigger", "They are the same length", "200 BC to 100 BC, because BC years are longer"], "answer": "AD 100 to AD 250, because it is 150 years and the other is 100 years", "hint": "", "explain": "AD 100 to AD 250 is longer. For two BC years, subtract the smaller number from the bigger one: 200 - 100 = 100 years. For two AD years, subtract the earlier from the later: 250 - 100 = 150 years. So 150 years beats 100 years. Bigger BC numbers mean longer ago, not longer periods of time, and BC years are exactly the same length as AD years.", "topic": "history: calculating time spans in BC and AD"}, {"id": "w3-test:t38", "type": "text", "q": "On a map where each grid square is 1 km by 1 km, point A is at 215 730 and point B is at 240 730. How far apart are they in a straight line, in km? Write just the number.", "answer": "2.5", "accept": ["2.5", "2.50", "2.5 km", "2 1/2", "two and a half"], "hint": "", "explain": "The answer is 2.5 km. Both points have the same northing part, 730, so they sit on the same level and the distance is purely east to west. Point A is at easting 21 and 5 tenths, which is 21.5. Point B is at easting 24 and 0 tenths, which is 24.0. The difference is 24.0 - 21.5 = 2.5 squares, and each square is 1 km, so they are 2.5 km apart.", "topic": "geography: distance from grid references"}, {"id": "w3-test:t39", "type": "text", "q": "A 6 V battery is connected to two identical lamps in a single loop. An ammeter in the loop reads 0.20 A. What is the resistance of ONE lamp, in ohms?", "answer": "15", "accept": ["15", "15.0", "15 ohms", "15ohms", "15 ohm"], "hint": "", "explain": "The answer is 15 ohms. One loop means series. In series the battery voltage is shared, and the lamps are identical, so each lamp has 6 divided by 2 = 3 V across it. In series the current is the same everywhere, so 0.20 A flows through each lamp. Resistance = voltage divided by current, so 3 divided by 0.20 = 15 ohms. Using the full 6 V by mistake would give 30 ohms, which is the resistance of both lamps together, not one.", "topic": "science: calculating resistance in a series circuit"}, {"id": "w3-test:t40", "type": "text", "q": "A student measures the same thing four times and records 12, 14, 13 and 40. One reading is an anomaly. Work out the mean of the other three readings.", "answer": "13", "accept": ["13", "13.0", "thirteen"], "hint": "", "explain": "The mean is 13. The anomaly is 40, because the other three readings cluster closely together around 12 to 14 and 40 is nowhere near them. Leave it out and use the remaining three: 12 + 14 + 13 = 39, and 39 divided by 3 = 13. Divide by 3 and not by 4, because you are only using three readings now. Including the 40 would give a mean of 19.75, which does not represent any of the sensible readings. Cross the anomaly out of your working but leave it written in the table.", "topic": "science: working scientifically, anomalies and means"}]}], "title": "Weekly test", "note": "Everything from this week, getting harder as it goes. No hints, no notes, no phone in the room. This is the number that should climb each week."}}, "days": [{"key": "d1", "label": "Day 1", "date": "", "blocks": [{"id": "m7-frac-rebuild", "kind": "lesson", "mins": 30}, {"id": "e5-fixit", "kind": "lesson", "mins": 30}, {"id": "h3-century-again", "kind": "lesson", "mins": 25}, {"id": "g5-sixfig", "kind": "lesson", "mins": 25}, {"id": "s3-circuits", "kind": "lesson", "mins": 25}, {"id": "de1-verb2", "kind": "lesson", "mins": 20}]}, {"key": "d2", "label": "Day 2", "date": "", "blocks": [{"id": "m8-frac-whole", "kind": "lesson", "mins": 25}, {"id": "e6-apostrophes2", "kind": "lesson", "mins": 25}, {"id": "h4-bcad", "kind": "lesson", "mins": 25}, {"id": "g6-scale", "kind": "lesson", "mins": 25}, {"id": "s4-particles", "kind": "lesson", "mins": 25}, {"id": "de2-pronouns", "kind": "lesson", "mins": 20}]}, {"key": "d3", "label": "Day 3", "date": "", "blocks": [{"id": "m9-frac-divide", "kind": "lesson", "mins": 25}, {"id": "e7-wordclasses", "kind": "lesson", "mins": 25}, {"id": "h5-timeline", "kind": "lesson", "mins": 25}, {"id": "g7-watercycle", "kind": "lesson", "mins": 25}, {"id": "s5-working-sci", "kind": "lesson", "mins": 25}, {"id": "de3-irregular", "kind": "lesson", "mins": 20}]}, {"key": "d4", "label": "Day 4", "date": "", "blocks": [{"id": "m10-divide-decimals", "kind": "lesson", "mins": 25}, {"id": "m11-ratio", "kind": "lesson", "mins": 25}, {"id": "m12-algebra-simplify", "kind": "lesson", "mins": 25}, {"id": "m13-area-triangle", "kind": "lesson", "mins": 25}, {"id": "e8-write-plan", "kind": "lesson", "mins": 30}, {"id": "de4-together", "kind": "lesson", "mins": 20}]}, {"key": "d5", "label": "Day 5", "date": "", "blocks": [{"id": "w3-test", "kind": "test", "mins": 50}, {"id": "review", "kind": "review", "mins": 25}, {"id": "de5-speaking", "kind": "lesson", "mins": 20}]}], "books": ["Stormbreaker (Alex Rider) - Anthony Horowitz", "Percy Jackson: The Lightning Thief - Rick Riordan", "Holes - Louis Sachar", "Skulduggery Pleasant - Derek Landy", "Other"], "pools": {"m7-frac-rebuild": [{"id": "r-m7-1", "level": "easy", "type": "mc", "q": "Read this out loud: 1/5 of 30. Which sign should the word \"of\" be swapped for?", "options": ["x (multiply)", "+ (add)", "- (subtract)", "= (equals)"], "answer": "x (multiply)", "hint": "A fifth of 30 is 6. Which sign between 1/5 and 30 gives you 6?", "explain": "The answer is x (multiply). In maths the word \"of\" is a multiply sign in disguise. So 1/5 of 30 is written 1/5 x 30, and that is 30 split into 5 equal groups, which gives 6. If you added instead you would get something bigger than 30, and a fifth of 30 has to be smaller than 30.", "topic": "fractions: of means multiply"}, {"id": "r-m7-2", "level": "easy", "type": "text", "q": "Work out 1/4 x 8", "answer": "2", "accept": ["2", "2.0", "8/4", "2/1"], "hint": "Read it as a quarter of 8. Split 8 into 4 equal groups.", "explain": "The answer is 2. A quarter of 8 means split 8 into 4 equal groups. 8 divided by 4 is 2, so each group holds 2. You take 1 group, so the answer is 2. Check the size: 2 is smaller than 8, which is what taking a quarter should do.", "topic": "fractions: unit fraction of a whole number"}, {"id": "r-m7-3", "level": "easy", "type": "mc", "q": "A rope is 30 m long. You are asked for 1/3 x 30. Before you calculate anything, what do you already know about the answer?", "options": ["It must be smaller than 30", "It must be bigger than 30", "It must be exactly 30", "It must be 3 lots of 30"], "answer": "It must be smaller than 30", "hint": "A third of a rope is one piece of it. Is one piece longer or shorter than the whole rope?", "explain": "The answer is that it must be smaller than 30. 1/3 x 30 means a third of the rope, and a third of something is only part of it. The real answer is 10 m. Multiplying by any fraction below 1 shrinks the amount. Only multiplying by a number bigger than 1 grows it.", "topic": "fractions: multiplying by less than 1 makes it smaller"}, {"id": "r-m7-4", "level": "easy", "type": "mc", "q": "Here is someone's work. 1/4 x 1/3 = 7/12. What have they actually done?", "options": ["They added the two fractions instead of multiplying them", "They multiplied the tops and added the bottoms", "They flipped both fractions over", "They multiplied correctly but wrote it upside down"], "answer": "They added the two fractions instead of multiplying them", "hint": "Work out 1/4 + 1/3 and compare it with what they wrote.", "explain": "The answer is that they added instead of multiplying. 1/4 + 1/3 = 3/12 + 4/12 = 7/12, which is exactly what they wrote. Multiplying is a different job: top times top gives 1 x 1 = 1, bottom times bottom gives 4 x 3 = 12, so the real answer is 1/12. There is a quick check too. A quarter of 1/3 must be smaller than 1/3, and 7/12 is much bigger than 1/3, so it was never going to be right.", "topic": "fractions: spotting adding instead of multiplying"}, {"id": "r-m7-5", "level": "medium", "type": "text", "q": "Work out 3/7 x 1/2", "answer": "3/14", "accept": ["3/14", "6/28"], "hint": "Top times top on the top. Bottom times bottom on the bottom.", "explain": "The answer is 3/14. Multiply the tops: 3 x 1 = 3. Multiply the bottoms: 7 x 2 = 14. That gives 3/14. Nothing except 1 divides into both 3 and 14, so it stays as it is. Sense check: you took half of 3/7, so the answer must be smaller than 3/7, and 3/14 is exactly half of it.", "topic": "fractions: multiplying two fractions"}, {"id": "r-m7-6", "level": "medium", "type": "text", "q": "A skate park track is 18 m long. A rider covers 2/3 of it before he falls off. How many metres did he cover?", "answer": "12", "accept": ["12", "12m", "12 m", "12 metres", "12.0", "36/3"], "hint": "2/3 of 18 means 2/3 x 18. Split 18 into 3 equal parts first.", "explain": "The answer is 12 m. \"2/3 of 18\" is 2/3 x 18. Split 18 into 3 equal parts: 18 divided by 3 is 6, so one third is 6 m. You want two of those parts, so 2 x 6 = 12 m. Check it: he covered 12 m and had 6 m left, and 12 + 6 = 18.", "topic": "fractions: fraction of an amount in context"}, {"id": "r-m7-7", "level": "medium", "type": "mc", "q": "Without working it out exactly, roughly how big is 4/5 x 20?", "options": ["A bit less than 20", "A bit more than 20", "About 100", "About 4"], "answer": "A bit less than 20", "hint": "4/5 is nearly a whole. Nearly all of 20 is close to 20 but does not reach it.", "explain": "The answer is a bit less than 20. 4/5 is close to 1 but not quite there, so four fifths of 20 is close to 20 but under it. The exact answer is 16, because 20 divided by 5 is 4 and 4 x 4 = 16. About 100 would be 5 x 20, which is multiplying by the bottom number instead of dividing by it. About 4 is only one fifth, not four fifths.", "topic": "fractions: reasoning about size of answer"}, {"id": "r-m7-8", "level": "stretch", "type": "text", "q": "A phone battery is full in the morning. Ali uses 1/5 of the battery before lunch. After lunch he uses 1/2 of what is LEFT. What fraction of the whole battery has he used in total? Give your answer in its simplest form.", "answer": "3/5", "accept": ["3/5"], "hint": "After the morning, what fraction of the battery is still there? Take half of that, then add the two amounts together.", "explain": "The answer is 3/5. Morning: he uses 1/5, so 4/5 is left. Afternoon: he uses half of that 4/5, which is 1/2 x 4/5 = 4/10 = 2/5 of the whole battery. Total used is 1/5 + 2/5 = 3/5. Watch the two different jobs. Taking half of what is left is multiplying. Putting the two parts of the day together is adding.", "topic": "fractions: fraction of a remainder"}], "m8-frac-whole": [{"id": "r-m8-1", "level": "easy", "type": "mc", "q": "Which of these means the same as the whole number 9?", "options": ["9/1", "1/9", "9/9", "0.9"], "answer": "9/1", "hint": "A fraction means top divided by bottom. What do you divide 9 by to leave it as 9?", "explain": "The answer is 9/1. A fraction line means divide, and 9 divided by 1 is 9. Writing a whole number over 1 is useful, because it lets you use the top times top, bottom times bottom rule. The others are all much smaller: 1/9 is one part out of nine, 9/9 is 1, and 0.9 is just under 1.", "topic": "fractions: whole numbers as fractions"}, {"id": "r-m8-2", "level": "easy", "type": "mc", "q": "In the calculation 1/6 x 18, what job does the 6 do?", "options": ["It tells you how many equal parts to split 18 into", "It tells you to multiply 18 by 6", "It tells you to add 6 to 18", "It tells you how many of the parts to take"], "answer": "It tells you how many equal parts to split 18 into", "hint": "The bottom number is about cutting up. The top number is about how many pieces you keep.", "explain": "The answer is that it tells you how many equal parts to split 18 into. The bottom number, 6, does the cutting: 18 divided by 6 is 3. The top number, 1, says how many of those parts to take, so the answer is 3. Multiplying 18 by 6 gives 108, which is far bigger than 18, and a sixth of something can never be bigger than the thing itself.", "topic": "fractions: meaning of the denominator"}, {"id": "r-m8-3", "level": "easy", "type": "text", "q": "Work out 1/6 x 18", "answer": "3", "accept": ["3", "3.0", "18/6", "3/1"], "hint": "A sixth of 18. Divide 18 by 6.", "explain": "The answer is 3. Divide by the bottom number: 18 divided by 6 = 3. Multiply by the top number: 1 x 3 = 3. Check it backwards: 6 lots of 3 make 18, so 3 really is one sixth of 18.", "topic": "fractions: unit fraction times whole number"}, {"id": "r-m8-4", "level": "easy", "type": "mc", "q": "Here is someone's work. 1/3 x 15 = 45. What have they done wrong?", "options": ["They multiplied by 3 instead of dividing by 3", "They added 3 and 15 together", "They divided 15 by 15", "They flipped the fraction over first"], "answer": "They multiplied by 3 instead of dividing by 3", "hint": "What is 3 x 15? Compare that with the answer they wrote.", "explain": "The answer is that they multiplied by 3 instead of dividing by 3, because 3 x 15 = 45. The bottom number is never a multiplier. It tells you how many equal parts to split into, so you divide by it. 15 divided by 3 is 5, so 1/3 x 15 = 5. Quick check that kills 45 instantly: a third of 15 must be smaller than 15.", "topic": "fractions: spotting denominator used as multiplier"}, {"id": "r-m8-5", "level": "medium", "type": "text", "q": "Work out 3/5 x 40", "answer": "24", "accept": ["24", "24.0", "120/5", "24/1"], "hint": "Find one fifth of 40 first, then take three of them.", "explain": "The answer is 24. Divide by the bottom: 40 divided by 5 = 8, so one fifth is 8. Multiply by the top: 3 x 8 = 24. Sense check: three fifths is a bit more than half, and 24 is a bit more than half of 40.", "topic": "fractions: fraction times whole number"}, {"id": "r-m8-6", "level": "medium", "type": "mc", "q": "Here is someone's work. 3/4 x 16 = 12/16. The 12 came from correct working. What should the final answer be?", "options": ["12", "12/16", "3/16", "64"], "answer": "12", "hint": "The 16 was already used when you divided it into 4 parts. Should it still be sitting on the bottom?", "explain": "The answer is 12. The working is: 16 divided by 4 = 4, then 3 x 4 = 12. At that point the 16 has done its job and should not appear again. Leaving it on the bottom gives 12/16, which is less than one whole, and three quarters of 16 is clearly a lot more than one. 64 comes from doing 4 x 16, which is multiplying by the bottom number instead of dividing.", "topic": "fractions: spotting a leftover denominator"}, {"id": "r-m8-7", "level": "medium", "type": "text", "q": "A skip holds 72 bricks. A builder takes 5/8 of them. How many bricks does he take?", "answer": "45", "accept": ["45", "45.0", "45 bricks", "360/8"], "hint": "Find one eighth of 72 first, then take five of them.", "explain": "The answer is 45 bricks. Divide by the bottom: 72 divided by 8 = 9, so one eighth is 9 bricks. Multiply by the top: 5 x 9 = 45. Check it: 27 bricks are left, and 45 + 27 = 72.", "topic": "fractions: fraction of an amount in context"}, {"id": "r-m8-8", "level": "stretch", "type": "text", "q": "A car park has 80 spaces. 3/4 of the spaces are full. Of the vehicles parked there, 1/5 are vans. How many vans are in the car park?", "answer": "12", "accept": ["12", "12.0", "12 vans"], "hint": "Two steps. Work out how many vehicles are actually parked first, then take a fifth of just that number.", "explain": "The answer is 12 vans. Step 1: vehicles parked is 3/4 x 80. 80 divided by 4 = 20, and 3 x 20 = 60 vehicles. Step 2: vans are 1/5 x 60. 60 divided by 5 = 12. The trap is taking 1/5 of 80, which gives 16 and is wrong. The fifth only applies to the 60 vehicles that are there, not to all 80 spaces.", "topic": "fractions: two-step fraction of an amount"}], "m9-frac-divide": [{"id": "r-m9-1", "level": "easy", "type": "mc", "q": "How many quarters fit into 2 whole cakes?", "options": ["8", "4", "2", "0.5"], "answer": "8", "hint": "Cut each cake into quarters. Count all the pieces.", "explain": "The answer is 8. One cake cut into quarters gives 4 pieces, so 2 cakes give 2 x 4 = 8 pieces. In maths that is 2 divided by 1/4 = 8. The answer is bigger than 2, which is normal, because quarters are small and lots of them fit in.", "topic": "division by fractions: how many fit in"}, {"id": "r-m9-2", "level": "easy", "type": "text", "q": "Work out 3 divided by 1/4", "answer": "12", "accept": ["12", "12.0", "12/1"], "hint": "How many quarters are in one whole? Now do that 3 times.", "explain": "The answer is 12. One whole holds 4 quarters, so 3 wholes hold 3 x 4 = 12 quarters. Using the shortcut: flip 1/4 to get 4/1, then 3 x 4 = 12.", "topic": "division by fractions: whole divided by unit fraction"}, {"id": "r-m9-3", "level": "easy", "type": "mc", "q": "What do you get when you flip the fraction 5/8 upside down?", "options": ["8/5", "5/8", "1/40", "13/8"], "answer": "8/5", "hint": "Swap the top number with the bottom number. Nothing else changes.", "explain": "The answer is 8/5. Flipping means the top and the bottom swap places, so 5/8 becomes 8/5. This flipped fraction is called the reciprocal, and it is what you multiply by when you are dividing by a fraction.", "topic": "division by fractions: reciprocal"}, {"id": "r-m9-4", "level": "easy", "type": "mc", "q": "You divide 10 by 1/3. Without working it out, what do you know about the answer?", "options": ["It is bigger than 10", "It is smaller than 10", "It is exactly 10", "It is smaller than 1"], "answer": "It is bigger than 10", "hint": "You are counting how many thirds fit into 10. Thirds are small pieces.", "explain": "The answer is that it is bigger than 10. Dividing asks how many of these fit into that, and thirds are small, so a lot of them fit. Each whole holds 3 thirds, so 10 wholes hold 30. Dividing by any number below 1 always makes the answer bigger.", "topic": "division by fractions: dividing by less than 1 makes it bigger"}, {"id": "r-m9-5", "level": "medium", "type": "text", "q": "Work out 2/3 divided by 4/5", "answer": "5/6", "accept": ["5/6", "10/12"], "hint": "Keep the first fraction, flip the second, change divide to multiply.", "explain": "The answer is 5/6. Keep 2/3. Flip 4/5 to get 5/4. Multiply: 2/3 x 5/4. Tops: 2 x 5 = 10. Bottoms: 3 x 4 = 12. That gives 10/12, and both numbers divide by 2, so it tidies up to 5/6. Sense check: you divided by 4/5, which is just under 1, so the answer should be just a bit bigger than 2/3. 5/6 is a bit bigger than 2/3, so that fits.", "topic": "division by fractions: fraction divided by fraction"}, {"id": "r-m9-6", "level": "medium", "type": "mc", "q": "Here is someone's work. 4/7 divided by 2 = 4/7 x 2/1 = 8/7. Where did it go wrong?", "options": ["The 2 should have been flipped to 1/2, not left as 2/1", "The 4/7 should have been flipped instead", "They should have subtracted the 2", "Nothing is wrong, 8/7 is correct"], "answer": "The 2 should have been flipped to 1/2, not left as 2/1", "hint": "It is always the second number, the one you are dividing by, that gets flipped.", "explain": "The answer is that the 2 should have been flipped. The number 2 is the same as 2/1, and flipping it gives 1/2. So 4/7 divided by 2 = 4/7 x 1/2 = 4/14 = 2/7. Sense check: you are splitting 4/7 into 2 equal bits, so the answer must be smaller than 4/7. 2/7 is smaller. 8/7 is bigger than a whole one, which is impossible here.", "topic": "division by fractions: spotting the wrong number flipped"}, {"id": "r-m9-7", "level": "medium", "type": "text", "q": "A rope is 8 m long. It is cut into pieces that are each 2/5 m long. How many pieces are there?", "answer": "20", "accept": ["20", "20.0", "20 pieces"], "hint": "This asks how many lots of 2/5 fit into 8, so it is a division. Flip and multiply.", "explain": "The answer is 20 pieces. The calculation is 8 divided by 2/5. Flip 2/5 to get 5/2, then 8 x 5/2 = 40/2 = 20. Check it: 20 pieces x 2/5 m = 40/5 = 8 m, which uses up the whole rope exactly.", "topic": "division by fractions: in context"}, {"id": "r-m9-8", "level": "stretch", "type": "text", "q": "A go kart uses 2/3 of a litre of fuel in one race. The tank holds 7 litres. How many complete races can it run?", "answer": "10", "accept": ["10", "10.0", "10 races"], "hint": "Divide 7 by 2/3 first. Then think hard about whether half a race counts.", "explain": "The answer is 10 races. 7 divided by 2/3 means flip and multiply: 7 x 3/2 = 21/2 = 10.5. That is ten and a half races. You cannot run half a race, so you round DOWN to 10 complete races. Check: 10 races use 10 x 2/3 = 20/3 litres, which is 6 and 2/3 litres, leaving 1/3 of a litre. That is not enough for another race, which needs 2/3.", "topic": "division by fractions: rounding down in context"}], "m10-divide-decimals": [{"id": "r-m10-1", "level": "easy", "type": "text", "q": "Work out 11 divided by 2", "answer": "5.5", "accept": ["5.5", "5.50", "11/2", "5 1/2"], "hint": "2 goes into 11 five times with 1 left over. Turn that 1 into a decimal.", "explain": "The answer is 5.5. 2 into 11 goes 5 times, because 5 x 2 = 10, leaving 1. Put a decimal point after the 5, treat the 11 as 11.0 and carry the 1 across to make 10. 2 into 10 goes 5 exactly. So the answer is 5.5. Check: 5.5 x 2 = 11.", "topic": "decimals: dividing with a remainder"}, {"id": "r-m10-2", "level": "easy", "type": "mc", "q": "Before you work it out, 13 divided by 2 must land between which two numbers?", "options": ["6 and 7", "5 and 6", "12 and 14", "0 and 1"], "answer": "6 and 7", "hint": "2 x 6 = 12 and 2 x 7 = 14. Where does 13 sit between those?", "explain": "The answer is between 6 and 7. 2 x 6 = 12, which is under 13, and 2 x 7 = 14, which is over 13. So the answer sits between 6 and 7, and it is 6.5. Doing this fence first stops you writing 65 by mistake.", "topic": "decimals: estimating before dividing"}, {"id": "r-m10-3", "level": "easy", "type": "mc", "q": "Here is someone's work. 15 divided by 2 = 75. How can you tell it is wrong without doing the division?", "options": ["Sharing 15 between 2 must give about 7, not 75", "Because 75 is an odd number", "Because 2 does not go into 15 at all", "Because the answer should be 30"], "answer": "Sharing 15 between 2 must give about 7, not 75", "hint": "Can splitting 15 into 2 shares ever give you more than 15 in each share?", "explain": "The answer is that sharing 15 between 2 must give about 7. Dividing by 2 roughly halves a number, so the answer has to be smaller than 15, near 7 or 8. The digits 7 and 5 are right but the decimal point is missing. Written properly it is 7.5. An answer of 30 would be 15 x 2, which is multiplying instead of dividing.", "topic": "decimals: spotting a misplaced decimal point"}, {"id": "r-m10-4", "level": "easy", "type": "text", "q": "Work out 7 divided by 4", "answer": "1.75", "accept": ["1.75", "1.750", "7/4", "1 3/4"], "hint": "4 goes into 7 once with 3 left over. Carry that 3 into the decimals.", "explain": "The answer is 1.75. 4 into 7 goes 1 time, leaving 3. Add a decimal point and carry the 3 across to make 30. 4 into 30 goes 7 times, because 7 x 4 = 28, leaving 2. Carry the 2 to make 20, and 4 into 20 goes 5 exactly. So 1.75. Check: 1.75 x 4 = 7.", "topic": "decimals: dividing to two decimal places"}, {"id": "r-m10-5", "level": "medium", "type": "text", "q": "Five mates split a taxi fare of 23 pounds equally. How much does each one pay, in pounds?", "answer": "4.6", "accept": ["4.6", "4.60", "4.6 pounds", "4.60 pounds", "23/5"], "hint": "23 divided by 5. Estimate first: 5 x 4 = 20 and 5 x 5 = 25.", "explain": "The answer is 4.6 pounds, which is 4 pounds 60. 5 into 23 goes 4 times, because 4 x 5 = 20, leaving 3. Add a decimal point and carry the 3 to make 30. 5 into 30 goes 6 exactly. So 4.6. Check: 4.6 x 5 = 23. The estimate said between 4 and 5, and it is.", "topic": "decimals: dividing money in context"}, {"id": "r-m10-6", "level": "medium", "type": "text", "q": "On a map, 4 cm represents 1 km in real life. A cycle path measures 14 cm on the map. How far is it in real life, in km?", "answer": "3.5", "accept": ["3.5", "3.50", "3.5km", "3.5 km", "14/4", "7/2"], "hint": "Every 4 cm on the map is 1 km, so divide the map length by 4. Estimate the size first.", "explain": "The answer is 3.5 km. Since 4 cm stands for 1 km, you divide the map distance by 4: 14 divided by 4. Estimate first: 12 cm would be 3 km and 16 cm would be 4 km, so the answer is between 3 and 4. Working it out, 4 into 14 goes 3, leaving 2. Carry the 2 to make 20, and 4 into 20 goes 5. So 3.5 km.", "topic": "scale: map distance to real distance"}, {"id": "r-m10-7", "level": "medium", "type": "mc", "q": "On a map 4 cm represents 1 km. Someone measures a road as 14 cm and writes 56 km. Why is that impossible?", "options": ["12 cm would be 3 km, so 14 cm must be just over 3 km, nowhere near 56", "Because 56 is an even number", "Because you should add 4 to the map distance", "Because a road cannot be measured on a map"], "answer": "12 cm would be 3 km, so 14 cm must be just over 3 km, nowhere near 56", "hint": "Work out what 12 cm and 16 cm would be, then see where 14 cm has to land.", "explain": "The answer is the first option. Estimating puts a fence around the answer. On this map 12 cm is 3 km and 16 cm is 4 km, so 14 cm must be between 3 and 4 km. The real answer is 3.5 km. The 56 came from doing 14 x 4 instead of 14 divided by 4. On this scale the real distance in km is always smaller than the map distance in cm, so multiplying can never be right.", "topic": "scale: estimating to check a scale answer"}, {"id": "r-m10-8", "level": "stretch", "type": "text", "q": "A machine makes 30 bolts every 8 minutes, at a steady rate the whole time. How many bolts does it make in 1 minute?", "answer": "3.75", "accept": ["3.75", "3.750", "30/8", "15/4", "3 3/4"], "hint": "Divide 30 by 8. Estimate first: 8 x 4 = 32, so the answer is a bit under 4.", "explain": "The answer is 3.75 bolts per minute. Steady rate means you divide the total by the time: 30 divided by 8. Estimate: 8 x 3 = 24 and 8 x 4 = 32, so the answer is between 3 and 4. Working it out: 8 into 30 goes 3, because 3 x 8 = 24, leaving 6. Carry the 6 to make 60. 8 into 60 goes 7, because 7 x 8 = 56, leaving 4. Carry the 4 to make 40, and 8 into 40 goes 5 exactly. So 3.75. Check: 3.75 x 8 = 30.", "topic": "decimals: dividing in a rate context"}], "m11-ratio": [{"id": "r-m11-1", "level": "easy", "type": "mc", "q": "An amount is shared in the ratio 2:5. How many equal parts is it split into altogether?", "options": ["7", "10", "5", "3"], "answer": "7", "hint": "Add the numbers in the ratio together.", "explain": "The answer is 7. The ratio 2:5 means one person gets 2 parts and the other gets 5 parts, so there are 2 + 5 = 7 equal parts in total. Always total the parts first. 10 comes from multiplying 2 x 5, and 3 comes from subtracting, and neither of those tells you how many parts there are.", "topic": "ratio: total number of parts"}, {"id": "r-m11-2", "level": "easy", "type": "mc", "q": "Squash and water are mixed in the ratio 1:6. Which statement is true?", "options": ["There is 6 times as much water as squash", "There is 6 times as much squash as water", "There is the same amount of squash and water", "There are exactly 6 litres of water"], "answer": "There is 6 times as much water as squash", "hint": "The order matters. Squash comes first in the sentence, so it matches the first number.", "explain": "The answer is that there is 6 times as much water as squash. The words and the numbers line up in order: squash is 1 part and water is 6 parts. So for every 1 cup of squash you use 6 cups of water. You cannot say there are exactly 6 litres of water, because a ratio only tells you the relative amounts, not the actual size of the mix.", "topic": "ratio: reading a ratio"}, {"id": "r-m11-3", "level": "easy", "type": "text", "q": "Share 24 in the ratio 1:2. How much is the LARGER share?", "answer": "16", "accept": ["16", "16.0"], "hint": "Total the parts first, then work out what one part is worth.", "explain": "The answer is 16. Total the parts: 1 + 2 = 3 parts. One part is worth 24 divided by 3 = 8. The larger share is 2 parts, so 2 x 8 = 16. The smaller share is 1 part, which is 8. Check: 16 + 8 = 24. The quick wrong answer here is 12, from just halving 24, but the shares are not equal.", "topic": "ratio: sharing an amount"}, {"id": "r-m11-4", "level": "easy", "type": "text", "q": "Share 40 in the ratio 3:5. How many MORE does the larger share get than the smaller share?", "answer": "10", "accept": ["10", "10.0"], "hint": "Work out both shares first, then take one away from the other.", "explain": "The answer is 10. Total the parts: 3 + 5 = 8 parts. One part is 40 divided by 8 = 5. The shares are 3 x 5 = 15 and 5 x 5 = 25. The difference is 25 - 15 = 10. There is a shortcut: the shares differ by 2 parts, and 2 x 5 = 10. Check: 15 + 25 = 40.", "topic": "ratio: difference between shares"}, {"id": "r-m11-5", "level": "medium", "type": "text", "q": "Share 72 in the ratio 1:2:3. Write the three amounts, smallest first, in this style: 5, 10 and 15", "answer": "12, 24 and 36", "accept": ["12, 24 and 36", "12,24 and 36", "12, 24, 36", "12,24,36", "12 24 36"], "hint": "Add all three numbers to get the total parts, then find what one part is worth.", "explain": "The answer is 12, 24 and 36. Total the parts: 1 + 2 + 3 = 6 parts. One part is 72 divided by 6 = 12. Now multiply back: 1 x 12 = 12, 2 x 12 = 24, 3 x 12 = 36. Check: 12 + 24 + 36 = 72, which matches the amount you started with.", "topic": "ratio: three part ratio"}, {"id": "r-m11-6", "level": "medium", "type": "text", "q": "Paint is mixed with blue and white in the ratio 3:5. A decorator uses 12 litres of blue. How many litres of white does he need?", "answer": "20", "accept": ["20", "20.0", "20 litres", "20l", "20 l"], "hint": "You are not given the total. Use the blue to work out what one part is worth first.", "explain": "The answer is 20 litres. Blue is 3 parts and that is 12 litres, so one part is 12 divided by 3 = 4 litres. White is 5 parts, so 5 x 4 = 20 litres. The trap is thinking the 12 is the total. It is not. It is only the blue share, so the whole mix is 12 + 20 = 32 litres.", "topic": "ratio: given one share not the total"}, {"id": "r-m11-7", "level": "medium", "type": "mc", "q": "Two workers share some money in the ratio 2:7. The larger share is 42 pounds. What was the total amount of money?", "options": ["54 pounds", "49 pounds", "63 pounds", "84 pounds"], "answer": "54 pounds", "hint": "The 42 is 7 parts, not the total. Find one part first.", "explain": "The answer is 54 pounds. The larger share is 7 parts and it is worth 42 pounds, so one part is 42 divided by 7 = 6 pounds. The total is 2 + 7 = 9 parts, so 9 x 6 = 54 pounds. Check: the shares are 12 and 42, and 12 + 42 = 54. The quick wrong answer is 49, from adding 42 and 7, which mixes up pounds with parts.", "topic": "ratio: working back to the total"}, {"id": "r-m11-8", "level": "stretch", "type": "text", "q": "Mortar is mixed with cement, lime and sand in the ratio 1:1:6. A builder has exactly 24 kg of sand, and plenty of cement and lime. How many kg of mortar can he make in total?", "answer": "32", "accept": ["32", "32.0", "32kg", "32 kg"], "hint": "The sand is 6 parts. Work out what 1 part weighs, then find how many parts the whole mix has.", "explain": "The answer is 32 kg. Sand is 6 parts and it weighs 24 kg, so one part is 24 divided by 6 = 4 kg. The whole mix is 1 + 1 + 6 = 8 parts. So the mortar is 8 x 4 = 32 kg. Check it: cement is 4 kg, lime is 4 kg, sand is 24 kg, and 4 + 4 + 24 = 32 kg.", "topic": "ratio: scaling up from one share"}], "m12-algebra-simplify": [{"id": "r-m12-1", "level": "easy", "type": "mc", "q": "How do you write 8 x k in algebra?", "options": ["8k", "k8", "8 + k", "k^8"], "answer": "8k", "hint": "The number goes first and the multiply sign disappears.", "explain": "The answer is 8k. In algebra you drop the multiply sign and write the number in front of the letter, so 8 x k becomes 8k. Writing k8 is not used, 8 + k means adding rather than multiplying, and k^8 means k multiplied by itself 8 times, which is something completely different.", "topic": "algebra: notation for multiplying"}, {"id": "r-m12-2", "level": "easy", "type": "text", "q": "Simplify 6y + 3y", "answer": "9y", "accept": ["9y", "9 y", "9*y"], "hint": "Both terms have the same letter, so count how many y you have in total.", "explain": "The answer is 9y. Both terms are y terms, so they are like terms and can be joined. 6 lots of y plus 3 lots of y makes 9 lots of y. Only the numbers in front get added. The letter stays as a single y.", "topic": "algebra: collecting like terms"}, {"id": "r-m12-3", "level": "easy", "type": "mc", "q": "Why can 5m + 4n not be simplified any further?", "options": ["m and n stand for different unknown numbers, so they cannot be joined", "Because 5 and 4 are different numbers", "Because there is no equals sign in it", "Because you can only add letters that are next to each other in the alphabet"], "answer": "m and n stand for different unknown numbers, so they cannot be joined", "hint": "Think of m as bricks and n as bags of sand. Can you count them as one total?", "explain": "The answer is that m and n stand for different unknown numbers. You can only collect terms that use the same letter. 5m and 4n are unlike terms, so 5m + 4n is already as short as it goes. If m were 2 and n were 10, then 5m + 4n would be 10 + 40 = 50, and writing 9mn would give 9 x 2 x 10 = 180, which is nothing like it.", "topic": "algebra: why unlike terms stay apart"}, {"id": "r-m12-4", "level": "easy", "type": "mc", "q": "Here is someone's work. 6x + 2y = 8xy. What is wrong with it?", "options": ["x and y are different unknowns, so those terms cannot be added at all", "The answer should be 8x", "The answer should be 8y", "Nothing is wrong, 8xy is correct"], "answer": "x and y are different unknowns, so those terms cannot be added at all", "hint": "Try it with numbers. Let x be 1 and y be 1, then check both sides.", "explain": "The answer is that x and y are different unknowns, so the terms cannot be added. 6x + 2y is already in its simplest form. Test it with numbers: if x is 1 and y is 1, then 6x + 2y = 6 + 2 = 8, but 8xy = 8 x 1 x 1 = 8 as well, so that test is not enough. Try x = 2 and y = 3. Then 6x + 2y = 12 + 6 = 18, but 8xy = 8 x 2 x 3 = 48. They do not match, which proves the working is wrong.", "topic": "algebra: spotting wrongly combined unlike terms"}, {"id": "r-m12-5", "level": "medium", "type": "text", "q": "Simplify 5a + 3b + 4a", "answer": "9a + 3b", "accept": ["9a + 3b", "9a+3b", "3b + 9a", "3b+9a"], "hint": "Collect the a terms together. The b term has nothing to join with, so it stays as it is.", "explain": "The answer is 9a + 3b. Deal with the a terms first: 5a + 4a = 9a. There is only one b term, 3b, and nothing to join it to, so it stays exactly as it is. That gives 9a + 3b. Do not turn it into 12ab. a and b are different unknowns and cannot be mixed.", "topic": "algebra: collecting like terms with two letters"}, {"id": "r-m12-6", "level": "medium", "type": "text", "q": "Simplify 7n + 4 - 3n + 2", "answer": "4n + 6", "accept": ["4n + 6", "4n+6", "6 + 4n", "6+4n"], "hint": "Collect the n terms in one group and the plain numbers in another.", "explain": "The answer is 4n + 6. Take the n terms: 7n - 3n = 4n. Take the plain numbers: 4 + 2 = 6. Put them together and you get 4n + 6. Keep the sign that sits in front of each term as you move it. The plain numbers cannot be joined onto the n terms, because you do not know what n is worth.", "topic": "algebra: collecting terms and numbers"}, {"id": "r-m12-7", "level": "medium", "type": "text", "q": "Simplify 6p + 3q - 2p - 5q", "answer": "4p - 2q", "accept": ["4p - 2q", "4p-2q", "-2q + 4p", "-2q+4p"], "hint": "Collect the p terms and the q terms separately. Watch the minus signs.", "explain": "The answer is 4p - 2q. The p terms: 6p - 2p = 4p. The q terms: 3q - 5q = -2q, because taking 5 away from 3 goes below zero. Put them together: 4p - 2q. A negative term in an answer is fine. It just means you are 2 lots of q short.", "topic": "algebra: collecting like terms with negatives"}, {"id": "r-m12-8", "level": "stretch", "type": "text", "q": "A rectangle has sides of length 3x, 2x + 1, 3x and 2x + 1. Write a simplified expression for its perimeter.", "answer": "10x + 2", "accept": ["10x + 2", "10x+2", "2 + 10x", "2+10x"], "hint": "Perimeter means add all four sides. Then collect the x terms and the numbers separately.", "explain": "The answer is 10x + 2. Add all four sides: 3x + 2x + 1 + 3x + 2x + 1. Collect the x terms: 3x + 2x + 3x + 2x = 10x. Collect the plain numbers: 1 + 1 = 2. So the perimeter is 10x + 2. Test it: if x were 2, the sides would be 6, 5, 6 and 5, which total 22, and 10 x 2 + 2 = 22 as well.", "topic": "algebra: perimeter as an expression"}], "m13-area-triangle": [{"id": "r-m13-1", "level": "easy", "type": "mc", "q": "A triangle is drawn inside a rectangle. The triangle has the same base and the same height as the rectangle. How much of the rectangle does the triangle cover?", "options": ["Half of it", "All of it", "A quarter of it", "Twice as much as it"], "answer": "Half of it", "hint": "Think about why the triangle formula has a divide by 2 in it.", "explain": "The answer is half of it. Any triangle fits exactly twice into a rectangle with the same base and height, so the triangle is half the rectangle. That is why the formula is base x height divided by 2. Work out the rectangle first, then halve it.", "topic": "area: why the triangle formula halves"}, {"id": "r-m13-2", "level": "easy", "type": "text", "q": "A triangle has a base of 6 cm and a perpendicular height of 4 cm. What is its area, in cm^2?", "answer": "12", "accept": ["12", "12.0", "12cm2", "12 cm2", "12 cm^2"], "hint": "Multiply base by height, then halve it.", "explain": "The answer is 12 cm^2. Base x height = 6 x 4 = 24. That is the area of the rectangle around it. Divide by 2 to get the triangle: 24 divided by 2 = 12 cm^2.", "topic": "area: triangle from base and height"}, {"id": "r-m13-3", "level": "easy", "type": "mc", "q": "A triangle has a base of 10 cm, a perpendicular height of 4 cm and a slanted side of 6 cm. Which two lengths do you multiply to start the area calculation?", "options": ["10 and 4", "10 and 6", "6 and 4", "10, 6 and 4"], "answer": "10 and 4", "hint": "The height must be the one that goes straight up from the base at a right angle.", "explain": "The answer is 10 and 4. The formula uses the base and the perpendicular height, which is the one measured at a right angle to the base. That is 10 x 4 = 40, then divide by 2 to get 20 cm^2. The slanted side is longer than the true height, so using it would make the area too big. The extra number is put in the question on purpose.", "topic": "area: identifying the perpendicular height"}, {"id": "r-m13-4", "level": "easy", "type": "text", "q": "A triangular flag has a base of 20 cm and a perpendicular height of 9 cm. What is its area, in cm^2?", "answer": "90", "accept": ["90", "90.0", "90cm2", "90 cm2", "90 cm^2"], "hint": "Base times height, then divide by 2.", "explain": "The answer is 90 cm^2. Base x height = 20 x 9 = 180. Divide by 2: 180 divided by 2 = 90 cm^2. Doing the halving first also works: half of 20 is 10, and 10 x 9 = 90. Same answer, sometimes easier numbers.", "topic": "area: triangle in context"}, {"id": "r-m13-5", "level": "medium", "type": "text", "q": "A triangle has a base of 7 cm and a perpendicular height of 5 cm. What is its area, in cm^2?", "answer": "17.5", "accept": ["17.5", "17.50", "17.5cm2", "17.5 cm2", "17.5 cm^2", "35/2"], "hint": "7 x 5 is an odd number, so halving it will not give a whole number. That is allowed.", "explain": "The answer is 17.5 cm^2. Base x height = 7 x 5 = 35. Divide by 2: 35 divided by 2 = 17.5 cm^2. An area does not have to be a whole number. Do not round it to 17 or 18, just write the decimal.", "topic": "area: triangle with a decimal answer"}, {"id": "r-m13-6", "level": "medium", "type": "text", "q": "A triangle has an area of 30 cm^2 and a base of 12 cm. What is its perpendicular height, in cm?", "answer": "5", "accept": ["5", "5.0", "5cm", "5 cm"], "hint": "Work backwards. Double the area first to get back to the rectangle, then divide by the base.", "explain": "The answer is 5 cm. Going forwards you multiply base by height then halve. So going backwards you double then divide. Double the area: 30 x 2 = 60. Divide by the base: 60 divided by 12 = 5 cm. Check it: 12 x 5 = 60, and 60 divided by 2 = 30, which matches the area given.", "topic": "area: working backwards to find a height"}, {"id": "r-m13-7", "level": "medium", "type": "mc", "q": "Triangle P has a base of 8 cm and a perpendicular height of 3 cm. Triangle Q has a base of 4 cm and a perpendicular height of 5 cm. Which one has the bigger area?", "options": ["Triangle P", "Triangle Q", "They are equal", "You cannot tell without the slanted sides"], "answer": "Triangle P", "hint": "Work out both areas properly. Do not judge it on the tallest height.", "explain": "The answer is triangle P. Triangle P: 8 x 3 = 24, halved is 12 cm^2. Triangle Q: 4 x 5 = 20, halved is 10 cm^2. So P is bigger by 2 cm^2. The quick guess is Q, because 5 is the biggest single number on the page, but area depends on base and height together, not on one of them.", "topic": "area: comparing triangle areas"}, {"id": "r-m13-8", "level": "stretch", "type": "text", "q": "The end wall of a shed is a rectangle with a triangle sitting on top of it. The rectangle is 6 m wide and 3 m tall. The triangle has a base of 6 m and a perpendicular height of 2 m. What is the total area of the end wall, in m^2?", "answer": "24", "accept": ["24", "24.0", "24m2", "24 m2", "24 m^2"], "hint": "Split it into two shapes. Do the rectangle, do the triangle, then add.", "explain": "The answer is 24 m^2. Rectangle: 6 x 3 = 18 m^2. Triangle: 6 x 2 = 12, divided by 2 = 6 m^2. Total: 18 + 6 = 24 m^2. The common mistake is halving the whole thing at the end. Only the triangle gets halved, never the rectangle.", "topic": "area: compound shape with a triangle"}], "s3-circuits": [{"id": "r-s3-1", "level": "easy", "type": "text", "q": "An ammeter is used to measure current. What unit is current measured in? Write the name of the unit.", "answer": "amps", "accept": ["amps", "amp", "ampere", "amperes", "A", "a", "Amps", "Amp", "Amperes"], "hint": "The short way to write it is a capital A.", "explain": "The answer is amps, also called amperes, written with a capital A. Current is the flow of charge, measured in amps with an ammeter, and the ammeter goes IN the circuit so the current flows through it. Volts are for voltage and ohms are for resistance, so do not mix them up.", "topic": "circuits: units of current"}, {"id": "r-s3-2", "level": "easy", "type": "mc", "q": "A circuit is one single loop with a battery, a switch and two lamps on it. An ammeter placed before the first lamp reads 0.30 A. What would an ammeter placed after the second lamp read?", "options": ["0.30 A", "0.15 A", "0.60 A", "0 A"], "answer": "0.30 A", "hint": "In one single loop, is there anywhere else for the current to go?", "explain": "The answer is 0.30 A. This is a series circuit, which is one single loop, so the current is the same at every point in it. Current is not used up by the lamps. It has nowhere else to go, so whatever flows in flows out. The tempting wrong answer is 0.15 A, which is what happens to the VOLTAGE in series, because voltage is shared between the lamps. Current is shared out only in parallel branches.", "topic": "circuits: current is the same everywhere in series"}, {"id": "r-s3-3", "level": "easy", "type": "text", "q": "A single loop circuit has a battery and three identical lamps, one after the other. The current through the first lamp is 0.10 A. What is the current through the third lamp? Give your answer in amps, as a number.", "answer": "0.1", "accept": ["0.1", "0.10", ".1", "0.1 A", "0.10 A", "0.1A"], "hint": "Same single loop, so same current everywhere. No dividing needed.", "explain": "The answer is 0.1 A. In a series circuit the current is identical at every point in the loop, so all three lamps have 0.10 A flowing through them. Do not divide by 3. The three lamps do share the battery voltage, but they do not share the current.", "topic": "circuits: current is the same everywhere in series"}, {"id": "r-s3-4", "level": "easy", "type": "text", "q": "A circuit splits into two branches. Lamp X is alone on one branch and lamp Y is alone on the other. The ammeter next to the battery reads 0.50 A. The ammeter in the X branch reads 0.20 A. What is the current in the Y branch? Give your answer in amps, as a number.", "answer": "0.3", "accept": ["0.3", "0.30", ".3", "0.3 A", "0.30 A", "0.3A"], "hint": "The two branch currents must add up to the current leaving the battery.", "explain": "The answer is 0.3 A. In parallel the current splits at the junction and the branches add back up to the total. So branch X plus branch Y equals 0.50 A. That gives 0.20 + Y = 0.50, so Y = 0.50 - 0.20 = 0.30 A. Check it by adding forwards: 0.20 + 0.30 = 0.50, which matches the ammeter by the battery.", "topic": "circuits: current splits in parallel"}, {"id": "r-s3-5", "level": "medium", "type": "text", "q": "A circuit splits into three branches with one identical lamp on each. Each branch carries 0.25 A. What does the ammeter in the wire right next to the battery read? Give your answer in amps, as a number.", "answer": "0.75", "accept": ["0.75", ".75", "0.75 A", "0.75A"], "hint": "All the branch currents join back together before they return to the battery.", "explain": "The answer is 0.75 A. In parallel the branch currents add up to the current in the main wire. Here that is 0.25 + 0.25 + 0.25 = 0.75 A. Another way to see it is 3 x 0.25 = 0.75. The wrong answer to watch for is 0.25 A, from thinking the current is the same everywhere. That rule is for series, where there is only one path.", "topic": "circuits: total current in parallel"}, {"id": "r-s3-6", "level": "medium", "type": "mc", "q": "A circuit splits into two branches, with lamp M alone on one branch and lamp N alone on the other. Lamp M is unscrewed and taken out. What happens to lamp N?", "options": ["N stays lit at the same brightness", "N goes out as well", "N gets dimmer", "N gets brighter and then blows"], "answer": "N stays lit at the same brightness", "hint": "Is N's own branch still a complete loop from the battery and back?", "explain": "The answer is that N stays lit at the same brightness. In parallel each branch is its own complete path from the battery and back. Taking M out only breaks M's branch. N still has a full path and still gets the full battery voltage, so nothing about N changes. The total current from the battery does drop, because there are fewer branches drawing current, but the current in N's own branch is the same as before.", "topic": "circuits: removing a lamp from parallel"}, {"id": "r-s3-7", "level": "medium", "type": "text", "q": "A 12 V battery is in one single loop with three identical lamps. What is the voltage across one lamp? Give your answer in volts, as a number.", "answer": "4", "accept": ["4", "4.0", "4V", "4 V", "4 volts"], "hint": "In series the battery voltage is shared out. The lamps are identical, so they share it equally.", "explain": "The answer is 4 V. In a series circuit the battery voltage is shared between the components. The three lamps are identical, so they get an equal share each: 12 divided by 3 = 4 V. Check it: 4 + 4 + 4 = 12 V, which is the whole battery. Note the difference from current. Voltage is shared in series, but current is not.", "topic": "circuits: sharing voltage in series"}, {"id": "r-s3-8", "level": "stretch", "type": "text", "q": "A lamp has 6 V across it and a current of 0.50 A flowing through it. Work out the resistance of the lamp. Give your answer in ohms, as a number.", "answer": "12", "accept": ["12", "12.0", "12 ohms", "12ohms"], "hint": "Resistance = voltage divided by current. Estimate first: dividing by 0.5 doubles a number.", "explain": "The answer is 12 ohms. Resistance = voltage divided by current, so that is 6 divided by 0.50. Dividing by 0.5 is the same as asking how many halves fit into 6, and the answer is 12. So the resistance is 12 ohms. The rushed mistake is doing 6 x 0.5 = 3, which is multiplying instead of dividing. Check backwards: 12 ohms x 0.50 A = 6 V.", "topic": "circuits: calculating resistance"}], "s4-particles": [{"id": "r-s4-1", "level": "easy", "type": "mc", "q": "A chocolate bar is left on a hot radiator and turns runny. What is this change of state called?", "options": ["Melting", "Freezing", "Condensing", "Boiling"], "answer": "Melting", "hint": "It started solid and ended up liquid. Which word means solid to liquid?", "explain": "The answer is melting. Melting is solid to liquid, which is exactly what happened to the chocolate. Freezing is the opposite, liquid to solid. Condensing is gas to liquid, and boiling is liquid to gas, and neither of those started from a solid.", "topic": "changes of state: melting"}, {"id": "r-s4-2", "level": "easy", "type": "mc", "q": "A cold can of drink is taken outside on a warm day. Drops of water appear on the outside of the can. What change of state made those drops?", "options": ["Condensing, gas to liquid", "Melting, solid to liquid", "Freezing, liquid to solid", "Evaporating, liquid to gas"], "answer": "Condensing, gas to liquid", "hint": "The water did not leak out of the can. It came out of the air.", "explain": "The answer is condensing, gas to liquid. There is invisible water vapour in the air. When it touches the cold can it loses energy, the particles slow down and pull together, and it turns into liquid drops on the outside. Nothing melted, because there was no solid to start with.", "topic": "changes of state: condensing"}, {"id": "r-s4-3", "level": "easy", "type": "text", "q": "Solid iodine is warmed gently and purple gas rises off it. No liquid is ever seen. What is the name of this change of state? Write one word.", "answer": "sublimation", "accept": ["sublimation", "sublimating", "sublimation.", "subliming", "sublime", "Sublimation"], "hint": "It skipped the liquid stage completely.", "explain": "The answer is sublimation. Sublimation is when a solid turns straight into a gas with no liquid stage in between. The clue in any question is that a solid disappears and leaves no puddle. The reverse change, gas straight to solid, is called deposition.", "topic": "changes of state: sublimation"}, {"id": "r-s4-4", "level": "easy", "type": "mc", "q": "Substance W melts at 660 degrees C and boils at 2470 degrees C. What state is W in at room temperature, 20 degrees C?", "options": ["Solid", "Liquid", "Gas", "You cannot tell from this information"], "answer": "Solid", "hint": "Below the melting point it has not melted yet.", "explain": "The answer is solid. Room temperature, 20 degrees C, is far below the melting point of 660 degrees C. A substance is a solid at any temperature below its melting point, because it has not been given enough energy to melt yet. It would need heating to 660 to become a liquid, and to 2470 to become a gas.", "topic": "states: using melting point to decide a state"}, {"id": "r-s4-5", "level": "medium", "type": "text", "q": "Substance X melts at -95 degrees C and boils at 56 degrees C. What state is X in at 20 degrees C? Write solid, liquid or gas.", "answer": "liquid", "accept": ["liquid", "Liquid", "a liquid", "liquid."], "hint": "Put the three numbers in order on a line: -95, then 20, then 56. Where does 20 sit?", "explain": "The answer is liquid. The rule is that a substance is liquid between its melting point and its boiling point. Here 20 degrees C is above the melting point of -95 and below the boiling point of 56, so it sits in the middle, and the middle is liquid. It has already melted but it has not boiled yet.", "topic": "states: using melting and boiling points together"}, {"id": "r-s4-6", "level": "medium", "type": "mc", "q": "A beaker of crushed ice at 0 degrees C is heated. For several minutes the thermometer stays at exactly 0, even though the heater is still on. Why does the temperature not rise?", "options": ["The energy is being used to break the forces between the particles instead of speeding them up", "The heater has stopped working", "Ice cannot ever get any hotter than 0 degrees C", "The thermometer is broken"], "answer": "The energy is being used to break the forces between the particles instead of speeding them up", "hint": "Temperature measures how fast the particles are moving. Where is the energy going instead?", "explain": "The answer is that the energy is being used to break the forces between the particles. The energy has not stopped going in, it is just doing a different job. It is pulling the particles out of their fixed pattern so they can slide past each other. Temperature is a measure of how fast the particles move, so if the energy is not speeding them up, the reading does not rise. Once all the ice has melted, the temperature starts climbing again.", "topic": "states: why temperature is flat during a change of state"}, {"id": "r-s4-7", "level": "medium", "type": "mc", "q": "A puddle on the playground dries up over an afternoon, even though the air is only about 15 degrees C. Which statement describes what is happening?", "options": ["Evaporating, which happens at the surface at any temperature below the boiling point", "Boiling, which happens all through the liquid at the boiling point", "Condensing, which turns a gas into a liquid", "Melting, which turns a solid into a liquid"], "answer": "Evaporating, which happens at the surface at any temperature below the boiling point", "hint": "There are no bubbles in a puddle, and 15 degrees C is nowhere near 100.", "explain": "The answer is evaporating. Evaporation and boiling both turn liquid into gas, but they are not the same thing. Evaporation happens only at the surface, is slow, and can happen at any temperature below the boiling point. Boiling happens all the way through the liquid, only at the boiling point, and you see bubbles forming inside it. A puddle at 15 degrees C is nowhere near 100, so it must be evaporating.", "topic": "states: evaporation versus boiling"}, {"id": "r-s4-8", "level": "stretch", "type": "mc", "q": "Substance Y melts at -210 degrees C and boils at -196 degrees C. What state is Y in at -200 degrees C?", "options": ["Liquid", "Solid", "Gas", "You cannot tell from this information"], "answer": "Liquid", "hint": "With negative numbers, the one closest to zero is the biggest. Is -200 above or below -210?", "explain": "The answer is liquid. Take the negative numbers carefully. -200 is above -210, so the substance has already melted. -200 is below -196, so it has not boiled yet. That puts it between the melting point and the boiling point, which means liquid. The rushed mistake is seeing 200 as a bigger number than 196 and calling it a gas, but with negatives -200 is the colder one.", "topic": "states: negative temperatures and states"}], "s5-working-sci": [{"id": "r-s5-1", "level": "easy", "type": "mc", "q": "Rob says: I change the height I drop the ball from, and I measure ho
