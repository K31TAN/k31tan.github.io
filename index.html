<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Study OS">
<title>Study OS</title>
<style>
:root{--bg:#0f1215;--panel:#171b20;--panel2:#1e242b;--line:#2a323b;--ink:#e8edf2;--dim:#93a1b0;--faint:#5e6b78;
--accent:#4a9eff;--good:#3ecf8e;--bad:#ff6b6b;--warn:#f0b429;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:17px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:780px;margin:0 auto;padding:16px 16px 90px}
h1,h2,h3{line-height:1.25;margin:0}h1{font-size:23px;font-weight:650;letter-spacing:-.2px}
h2{font-size:19px;font-weight:620}h3{font-size:16px;font-weight:600}
.muted{color:var(--dim)}.faint{color:var(--faint);font-size:14px}.small{font-size:14px}
header{position:sticky;top:0;z-index:20;background:rgba(15,18,21,.94);backdrop-filter:saturate(160%) blur(12px);
border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.hd{max-width:780px;margin:0 auto;display:flex;align-items:center;gap:12px}
.hd .t{flex:1;min-width:0}.hd .t div:first-child{font-weight:650;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:5px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-top:9px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .35s ease}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
.card.tight{padding:13px 15px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.btn{display:block;width:100%;min-height:52px;padding:14px 16px;background:var(--accent);color:#06121f;
border-radius:12px;font-weight:650;font-size:17px;text-align:center;margin-top:12px}
.btn:disabled{opacity:.35}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:550}
.btn.warn{background:var(--warn);color:#1a1200}
.daylist{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.day{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);
border-radius:var(--r);padding:15px 16px;width:100%;text-align:left}
.day .n{width:44px;height:44px;flex:0 0 44px;border-radius:11px;background:var(--panel2);display:flex;
align-items:center;justify-content:center;font-weight:650;font-size:15px;color:var(--dim)}
.day.done .n{background:rgba(62,207,142,.14);color:var(--good)}
.day .g{flex:1;min-width:0}.chev{color:var(--faint);font-size:20px}
.blk{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
.blk .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.pill{display:inline-block;padding:4px 10px;border-radius:99px;font-size:12.5px;font-weight:620;
background:var(--panel2);color:var(--dim);white-space:nowrap}
.pill.good{background:rgba(62,207,142,.14);color:var(--good)}
.pill.bad{background:rgba(255,107,107,.14);color:var(--bad)}
.pill.warn{background:rgba(240,180,41,.14);color:var(--warn)}
.pill.acc{background:rgba(74,158,255,.14);color:var(--accent)}
.extract{background:var(--panel2);border-left:3px solid var(--accent);border-radius:8px;padding:14px 15px;margin:14px 0;font-size:16px;line-height:1.6}
details.extract{white-space:normal}
details.extract>summary{list-style:none;cursor:pointer;font-size:13px;letter-spacing:.6px;text-transform:uppercase;
color:var(--dim);font-weight:650;min-height:26px;display:flex;align-items:center;flex-wrap:wrap;gap:2px}
details.extract>summary::-webkit-details-marker{display:none}
details.extract>summary::after{content:'  show';margin-left:auto;color:var(--accent);text-transform:none;letter-spacing:0;font-size:14px}
details.extract[open]>summary::after{content:'  hide'}
details.extract>div{white-space:pre-wrap;margin-top:10px}
.teach{background:linear-gradient(180deg,rgba(74,158,255,.07),transparent);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:12px 0}
.teach p{margin:0 0 10px}
.eg{background:var(--panel2);border-radius:10px;padding:14px;margin-top:12px}
.eg .lb{font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--dim);font-weight:650;margin-bottom:8px}
.eg ol{margin:8px 0 0;padding-left:20px}.eg li{margin:5px 0}
.kf{border-left:3px solid var(--warn);background:rgba(240,180,41,.07);border-radius:8px;padding:12px 14px;margin-top:14px;font-size:15.5px}
.q{font-size:18.5px;line-height:1.5;margin:14px 0 4px;white-space:pre-wrap}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;min-height:52px;padding:13px 15px;
background:var(--panel2);border:1.5px solid transparent;border-radius:12px;line-height:1.45}
.opt .k{width:26px;height:26px;flex:0 0 26px;border-radius:7px;background:rgba(255,255,255,.06);display:flex;
align-items:center;justify-content:center;font-size:13px;font-weight:650;color:var(--dim);margin-top:1px}
.opt.sel{border-color:var(--accent);background:rgba(74,158,255,.1)}
.opt.sel .k{background:var(--accent);color:#06121f}
.opt.ok{border-color:var(--good);background:rgba(62,207,142,.12)}
.opt.ok .k{background:var(--good);color:#06121f}
.opt.no{border-color:var(--bad);background:rgba(255,107,107,.1)}
.opt.no .k{background:var(--bad);color:#1a0505}
.opt[disabled]{opacity:.85}
input[type=text]{width:100%;min-height:54px;padding:14px 15px;font-size:17px;background:var(--panel2);
border:1.5px solid var(--line);border-radius:12px;color:var(--ink);margin-top:14px;-webkit-appearance:none}
input[type=text]:focus{outline:0;border-color:var(--accent)}
input.ok{border-color:var(--good)}input.no{border-color:var(--bad)}
textarea{width:100%;min-height:200px;padding:14px 15px;font-size:17px;line-height:1.6;background:var(--panel2);
border:1.5px solid var(--line);border-radius:12px;color:var(--ink);margin-top:12px;resize:vertical;-webkit-appearance:none;font-family:inherit}
textarea:focus{outline:0;border-color:var(--accent)}
select{width:100%;min-height:50px;padding:12px 14px;font-size:16px;background:var(--panel2);border:1.5px solid var(--line);
border-radius:12px;color:var(--ink);margin-top:10px;-webkit-appearance:none}
.qmeta{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13.5px;color:var(--faint)}
.fb{border-radius:11px;padding:14px 15px;margin-top:14px;font-size:15.5px;line-height:1.55;white-space:pre-wrap}
.fb.ok{background:rgba(62,207,142,.1);border:1px solid rgba(62,207,142,.3)}
.fb.no{background:rgba(255,107,107,.09);border:1px solid rgba(255,107,107,.3)}
.fb b{display:block;margin-bottom:6px;font-size:15px}
.hint{background:rgba(240,180,41,.08);border:1px solid rgba(240,180,41,.28);border-radius:11px;padding:13px 15px;margin-top:12px;font-size:15.5px;line-height:1.5}
.band{text-align:center;padding:26px 18px}
.band .big{font-size:46px;font-weight:700;letter-spacing:-1.5px;line-height:1}
.band .lbl{color:var(--dim);margin-top:8px;font-size:15px}
.rev{border-top:1px solid var(--line);padding:15px 0}.rev:first-of-type{border-top:0}
.rev .qt{font-size:16px;margin-bottom:9px;white-space:pre-wrap}
.rev .ans{font-size:15px;margin:5px 0}.ok{color:var(--good)}.no{color:var(--bad)}
.exp{background:var(--panel2);border-radius:9px;padding:12px 13px;margin-top:9px;font-size:15px;line-height:1.55;color:var(--dim);white-space:pre-wrap}
.topics{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.tp{padding:5px 11px;border-radius:99px;font-size:13px;background:var(--panel2);color:var(--dim)}
.tp.ok{background:rgba(62,207,142,.12);color:var(--good)}
.tp.no{background:rgba(255,107,107,.12);color:var(--bad)}
pre.sum{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px;
font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;max-height:320px;overflow:auto;color:var(--dim);margin-top:12px}
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:15px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}
th{color:var(--dim);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.5px}
ul,ol{padding-left:20px;margin:10px 0}li{margin:6px 0}
.hr{height:1px;background:var(--line);margin:18px 0;border:0}
.nb{background:rgba(240,180,41,.08);border:1px solid rgba(240,180,41,.25);border-radius:11px;padding:13px 15px;margin:12px 0;font-size:15px;line-height:1.55}
.nb b{color:var(--warn)}
.shots{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.shots img{width:76px;height:76px;object-fit:cover;border-radius:9px;border:1px solid var(--line)}
.syncdot{width:9px;height:9px;border-radius:99px;background:var(--faint);flex:0 0 9px}
.syncdot.on{background:var(--good)}.syncdot.err{background:var(--bad)}.syncdot.busy{background:var(--warn)}
label.file{display:block;width:100%;min-height:52px;padding:14px 16px;background:transparent;border:1px dashed var(--line);
border-radius:12px;font-weight:550;text-align:center;margin-top:12px;color:var(--dim)}
input[type=file]{display:none}
</style></head>
<body>
<header><div class="hd">
  <button id="back" class="pill" style="display:none">Back</button>
  <div class="t"><div id="htitle">Week 2</div><div class="bar"><i id="hbar" style="width:0%"></i></div></div>

</div></header>

<script>
let P = {"sessions": {"m21-backwards-context": {"id": "m21-backwards-context", "day": "Day 1", "subject": "Maths", "title": "Working backwards, in context", "minutes": 20, "objective": "Undo a forward calculation in area, ratio, division by a fraction and percentage questions, and check every answer by putting it back into the forward rule.", "extract": null, "teach": {"intro": ["Working backwards means the question has given you the finished number and asked for one of the numbers that made it. The method is always the same three moves: write the forward rule, put in what you know, then undo the rule one step at a time until the missing number is on its own.", "Then the self check, every time. Put your answer back into the forward rule and see if you land on the number the question gave you. If you do not land on it, the answer is wrong, and you have caught it yourself before anyone marks it."], "example": {"problem": "A triangle has an area of 24 cm^2 and a base of 8 cm. Work out the perpendicular height.", "steps": ["Forward rule: area = base x height / 2.", "Put in what you know: 24 = 8 x height / 2.", "Undo the divide by 2 by doubling both sides: 48 = 8 x height.", "Undo the times 8 by dividing both sides by 8: height = 48 / 8 = 6 cm.", "Self check: 8 x 6 / 2 = 24, which is the area you were given, so 6 cm is right.", "The trap is stopping at 48 and calling it the height. If the height were 48, the area would be 8 x 48 / 2 = 192, not 24. The 48 is real, it is just base x height, not height."], "answer": "6 cm"}, "example2": {"problem": "A survival drink mixes water to powder in the ratio 5:2. There are 14 g of powder. What does the whole mix weigh?", "steps": ["Forward rule: every part is the same size, so total = number of parts x one part.", "The powder is 2 parts and weighs 14 g, so one part = 14 / 2 = 7 g.", "The whole mix is 5 + 2 = 7 parts, so total = 7 x 7 = 49 g.", "Self check: split 49 g into 7 parts of 7 g. Water is 5 x 7 = 35 g and powder is 2 x 7 = 14 g, and 14 g is the powder you were given, so 49 g is right."], "answer": "49 g"}, "keyfact": "Undo the forward rule one step at a time, then put your answer back into the forward rule and check you land on the number the question gave you."}, "questions": [{"id": "m21-backwards-context:q1", "level": "easy", "type": "text", "q": "A triangle has an area of 20 cm^2 and a base of 5 cm. Work out the perpendicular height in cm.", "answer": "8", "accept": ["8", "8 cm", "8cm", "8.0", "eight"], "hint": "Forward rule is area = base x height / 2. Double the area first, then divide by the base.", "explain": "The answer is 8 cm. Forward rule: area = base x height / 2, so 20 = 5 x height / 2. Double both sides: 40 = 5 x height. Divide by 5: height = 8 cm. Check it. If the height were 40, the area would be 5 x 40 / 2 = 100, not 20. That is how you catch this one yourself.", "topic": "working backwards: triangle area to find a height"}, {"id": "m21-backwards-context:q2", "level": "easy", "type": "text", "q": "Concrete mixes sand to cement in the ratio 2:3. A builder uses 8 kg of sand. What is the total weight of the mix in kg?", "answer": "20", "accept": ["20", "20 kg", "20kg", "20.0", "twenty"], "hint": "Sand is 2 parts and weighs 8 kg, so work out one part first.", "explain": "The answer is 20 kg. Sand is 2 parts and weighs 8 kg, so one part is 8 / 2 = 4 kg. The mix is 2 + 3 = 5 parts, so the total is 5 x 4 = 20 kg. Check it. Split 20 kg into 5 parts of 4 kg and the sand is 2 x 4 = 8 kg, which is the sand you were given. If the total were 40 kg, the sand would be 16 kg, not 8 kg. That is how you catch this one yourself.", "topic": "working backwards: ratio to find a total from one share"}, {"id": "m21-backwards-context:q3", "level": "easy", "type": "mc", "q": "A camping cup holds 1/4 of a litre. You pour a full 3 litre bottle into these cups, filling each one. How many cups do you fill?", "options": ["12", "7", "3/4", "0.75"], "answer": "12", "hint": "You are undoing cups x 1/4 = 3, so divide 3 by 1/4.", "explain": "The answer is 12. The forward version is cups x 1/4 = 3 litres, so undo the multiply by dividing: 3 / (1/4) = 3 x 4 = 12. Check it. 12 cups of 1/4 litre is 12 x 1/4 = 3 litres, which is the bottle you started with. If the answer were 7, that would be 7 x 1/4 = 1.75 litres, not 3. That is how you catch this one yourself.", "topic": "working backwards: division by a fraction to find how many pieces"}, {"id": "m21-backwards-context:q4", "level": "easy", "type": "text", "q": "A bike helmet is reduced by 20% in a sale. It now costs 32 pounds. What was the price before the sale, in pounds?", "answer": "40", "accept": ["40", "40 pounds", "40.00", "£40", "forty"], "hint": "The 32 pounds is 80% of the old price, because 20% came off. Find 1% first, then 100%.", "explain": "The answer is 40 pounds. 20% came off, so 32 pounds is 100 - 20 = 80% of the old price. 1% is 32 / 80 = 0.4 pounds, so 100% is 100 x 0.4 = 40 pounds. Check it. 10% of 40 is 4, so 20% is 8, and 40 - 8 = 32 pounds, which is the sale price you were given. If the answer were 38.40 (that is 20% added onto the 32), then taking 20% off 38.40 would give 30.72, not 32. That is how you catch this one yourself.", "topic": "working backwards: reverse percentage after a discount"}, {"id": "m21-backwards-context:q5", "level": "medium", "type": "mc", "q": "Here is a student answer to mark. Question: a triangle has an area of 24 cm^2 and a base of 8 cm, work out the perpendicular height. Student: to work out the height you do 24 x 2 = 48, so the height is 48 cm. What went wrong?", "options": ["Doubling the area was a fair first step, but they stopped there. The 48 is base x height, so the height is 48 / 8 = 6 cm.", "They should never double the area. The height is 24 / 8 = 3 cm.", "Nothing went wrong, 48 cm is the height.", "They should have halved instead, so the height is 24 / 2 = 12 cm."], "answer": "Doubling the area was a fair first step, but they stopped there. The 48 is base x height, so the height is 48 / 8 = 6 cm.", "hint": "Write the forward rule first: 24 = 8 x height / 2. Doubling both sides is allowed, so what is 48 equal to?", "explain": "The first move, 24 x 2 = 48, is allowed. Area = base x height / 2, so doubling both sides gives 48 = 8 x height. The mistake is stopping there and calling 48 the height, when 48 is base x height. Divide by the base: height = 48 / 8 = 6 cm. Check it. If the height were 48, the area would be 8 x 48 / 2 = 192, not 24. That is how you catch this one yourself.", "topic": "working backwards: spotting the error of stopping after doubling the area"}, {"id": "m21-backwards-context:q6", "level": "medium", "type": "text", "q": "On a mountain trek the ratio of walkers to guides is 7:2. There are 6 guides. How many people are in the group altogether?", "answer": "27", "accept": ["27", "27 people", "twenty seven", "twenty-seven"], "hint": "Guides are 2 parts and there are 6 of them, so one part is 3 people.", "explain": "The answer is 27 people. Guides are 2 parts and there are 6 guides, so one part is 6 / 2 = 3 people. The group is 7 + 2 = 9 parts, so the total is 9 x 3 = 27. Check it. Split 27 into 9 parts of 3 and the guides are 2 x 3 = 6, which is the number you were given. If the total were 54, the guides would be 12, not 6. That is how you catch this one yourself.", "topic": "working backwards: ratio to find a total from one share"}, {"id": "m21-backwards-context:q7", "level": "medium", "type": "text", "q": "A climbing rope is 6 metres long. It is cut into pieces that are each 2/3 of a metre. How many pieces are there?", "answer": "9", "accept": ["9", "9 pieces", "nine"], "hint": "You are undoing pieces x 2/3 = 6. Dividing by 2/3 is the same as multiplying by 3/2.", "explain": "The answer is 9 pieces. The forward version is pieces x 2/3 = 6, so undo the multiply by dividing: 6 / (2/3) = 6 x 3/2 = 18/2 = 9. Check it. 9 pieces of 2/3 of a metre is 9 x 2/3 = 18/3 = 6 metres, which is the rope you were given. If the answer were 4, that would be 4 x 2/3 = 8/3, about 2.7 metres, not 6. That is how you catch this one yourself.", "topic": "working backwards: division by a fraction to find how many pieces"}, {"id": "m21-backwards-context:q8", "level": "medium", "type": "text", "q": "15% of the seats in a stadium stand are empty. That is 45 empty seats. How many seats are in the stand?", "answer": "300", "accept": ["300", "300 seats", "three hundred"], "hint": "45 is 15%, so find 1% by dividing by 15, then go up to 100%.", "explain": "The answer is 300 seats. 45 seats is 15%, so 1% is 45 / 15 = 3 seats, and 100% is 100 x 3 = 300 seats. Check it. 10% of 300 is 30 and 5% is 15, so 15% is 30 + 15 = 45, which is the number of empty seats you were given. If the answer were 675 (that is 45 x 15), then 15% of 675 would be 101.25, not 45. That is how you catch this one yourself.", "topic": "working backwards: reverse percentage to find the whole"}, {"id": "m21-backwards-context:q9", "level": "medium", "type": "text", "q": "A triangular sail has an area of 54 m^2 and a perpendicular height of 12 m. Work out the length of the base in m.", "answer": "9", "accept": ["9", "9 m", "9m", "9.0", "nine"], "hint": "Area = base x height / 2. Double the area, then divide by the height this time.", "explain": "The answer is 9 m. Area = base x height / 2, so 54 = base x 12 / 2. Double both sides: 108 = base x 12. Divide by 12: base = 9 m. Check it. If the base were 108, the area would be 108 x 12 / 2 = 648, not 54. That is how you catch this one yourself.", "topic": "working backwards: triangle area to find a base"}, {"id": "m21-backwards-context:q10", "level": "stretch", "type": "text", "q": "Mortar is mixed cement to sand to gravel in the ratio 1:2:4. One load uses 20 kg of gravel. What does the whole load weigh in kg?", "answer": "35", "accept": ["35", "35 kg", "35kg", "thirty five", "thirty-five"], "hint": "Gravel is 4 parts and weighs 20 kg, so one part is 5 kg. Count all the parts.", "explain": "The answer is 35 kg. Gravel is 4 parts and weighs 20 kg, so one part is 20 / 4 = 5 kg. The load is 1 + 2 + 4 = 7 parts, so the total is 7 x 5 = 35 kg. Check it. Split 35 kg into 7 parts of 5 kg and the gravel is 4 x 5 = 20 kg, which is what you were given. If the total were 140 kg, the gravel would be 80 kg, not 20 kg. That is how you catch this one yourself.", "topic": "working backwards: three part ratio to find a total"}, {"id": "m21-backwards-context:q11", "level": "stretch", "type": "text", "q": "A water tank is 3/4 full. At that level it holds 18 litres. How many litres does the tank hold when it is completely full?", "answer": "24", "accept": ["24", "24 litres", "24l", "twenty four", "twenty-four"], "hint": "The forward version is 3/4 x full tank = 18, so divide 18 by 3/4.", "explain": "The answer is 24 litres. The forward version is 3/4 x full tank = 18, so undo the multiply: 18 / (3/4) = 18 x 4/3 = 72/3 = 24 litres. Check it. 3/4 of 24 is 24 / 4 = 6, and 3 x 6 = 18 litres, which is the amount you were given. If the answer were 13.5 (that is 3/4 of 18), then 3/4 of 13.5 would be 10.125, not 18. That is how you catch this one yourself.", "topic": "working backwards: reversing a fraction of an amount"}, {"id": "m21-backwards-context:q12", "level": "stretch", "type": "mc", "q": "Here is another student answer to mark. Question: a triangle has an area of 30 cm^2 and a base of 12 cm, work out the perpendicular height. Student, line 1: 30 x 2 = 60. Student, line 2: so the height is 60 cm. Which is the first line that is wrong, and why?", "options": ["Line 2. Doubling to get 60 is allowed, but 60 is base x height, so the height is 60 / 12 = 5 cm.", "Line 1. You must never double the area, so the height is 30 / 12 = 2.5 cm.", "Neither line is wrong, the height really is 60 cm.", "Line 1. You should have halved the area, so the height is 15 / 12 = 1.25 cm."], "answer": "Line 2. Doubling to get 60 is allowed, but 60 is base x height, so the height is 60 / 12 = 5 cm.", "hint": "Write 30 = 12 x height / 2 and double both sides. What exactly does the 60 equal?", "explain": "Line 1 is fine. Area = base x height / 2 means 30 = 12 x height / 2, and doubling both sides gives 60 = 12 x height. Line 2 is the wrong line, because it treats 60 as the height when 60 is base x height. Divide by the base: height = 60 / 12 = 5 cm. Check it. If the height were 60, the area would be 12 x 60 / 2 = 360, not 30. That is how you catch this one yourself.", "topic": "working backwards: spotting the error of stopping after doubling the area"}]}, "m22-backwards-mixed": {"id": "m22-backwards-mixed", "day": "Day 3", "subject": "Maths", "title": "Forwards and backwards, mixed", "minutes": 20, "objective": "Decide whether a question is going forwards or backwards before you calculate, then do it and check the answer against the number you were given.", "extract": null, "teach": {"intro": ["A real question does not tell you which way it goes. So the first job is not arithmetic, it is a decision: has the question given you the ingredients and asked for the result (forwards), or given you the result and asked for a missing ingredient (backwards)?", "One test settles it. Write the forward rule, then find the missing number. If the missing number is the result, go forwards. If the missing number sits inside the rule, go backwards and undo. Either way, finish by putting your answer into the forward rule and checking you land on the number you were given."], "example": {"problem": "A triangle has a base of 10 cm and a perpendicular height of 6 cm. Work out the area.", "steps": ["Forward rule: area = base x height / 2.", "The missing number is the area, and the area is the result, so this one goes forwards.", "10 x 6 = 60, then 60 / 2 = 30 cm^2."], "answer": "30 cm^2"}, "example2": {"problem": "A triangle has an area of 30 cm^2 and a base of 10 cm. Work out the perpendicular height.", "steps": ["Same forward rule: area = base x height / 2.", "This time the area is given and the height is missing. The height sits inside the rule, so this one goes backwards.", "Put in what you know: 30 = 10 x height / 2. Double both sides: 60 = 10 x height. Divide by 10: height = 6 cm.", "Check forwards: 10 x 6 / 2 = 30, the area you were given. If you stopped at 60 and called that the height, the area would be 10 x 60 / 2 = 300, not 30."], "answer": "6 cm"}, "keyfact": "Decide the direction first. If the missing number is the result, go forwards. If the missing number is inside the rule, undo it and then check by going forwards."}, "questions": [{"id": "m22-backwards-mixed:q1", "level": "easy", "type": "mc", "q": "Do not work anything out for this one. Which direction does this question go? A triangle has a base of 6 cm and a perpendicular height of 9 cm. Work out the area.", "options": ["Forwards, because the area is the missing number and the area is the result of the rule.", "Backwards, because a perpendicular height is mentioned.", "Backwards, because you are given two numbers and want a third.", "Neither, there is not enough information."], "answer": "Forwards, because the area is the missing number and the area is the result of the rule.", "hint": "Rule is area = base x height / 2. Which number in that rule is missing?", "explain": "This goes forwards. The rule is area = base x height / 2, you have been handed the base and the height, and the missing number is the area, which is the result. Being given two numbers does not make a question backwards. What makes it backwards is the missing number sitting inside the rule instead of being the result.", "topic": "direction check: classifying a forwards area question"}, {"id": "m22-backwards-mixed:q2", "level": "easy", "type": "text", "q": "A triangle has a base of 6 cm and a perpendicular height of 9 cm. Work out the area in cm^2.", "answer": "27", "accept": ["27", "27 cm2", "27 cm^2", "twenty seven", "twenty-seven"], "hint": "Multiply the base by the height, then halve it.", "explain": "The answer is 27 cm^2. Area = base x height / 2, so 6 x 9 = 54 and 54 / 2 = 27. Check it. Halving is the last move, so the answer should be smaller than 6 x 9 = 54, and 27 is exactly half of 54.", "topic": "forwards: triangle area from base and height"}, {"id": "m22-backwards-mixed:q3", "level": "easy", "type": "text", "q": "A drink is mixed squash to water in the ratio 3:5. There are 9 ml of squash. How many ml is the whole drink?", "answer": "24", "accept": ["24", "24 ml", "24ml", "twenty four", "twenty-four"], "hint": "Squash is 3 parts and measures 9 ml, so one part is 3 ml.", "explain": "The answer is 24 ml. Squash is 3 parts and measures 9 ml, so one part is 9 / 3 = 3 ml. The drink is 3 + 5 = 8 parts, so the total is 8 x 3 = 24 ml. This one went backwards, because you were given a share and asked for the total. Check it. Split 24 ml into 8 parts of 3 ml and the squash is 3 x 3 = 9 ml, which is what you were given.", "topic": "backwards: ratio to find a total from one share"}, {"id": "m22-backwards-mixed:q4", "level": "easy", "type": "text", "q": "Work out 30% of 60.", "answer": "18", "accept": ["18", "18.0", "eighteen"], "hint": "10% of 60 is 6, so build 30% from that.", "explain": "The answer is 18. 10% of 60 is 60 / 10 = 6, so 30% is 3 x 6 = 18. This one went forwards, because you were given the whole amount and asked for the part. Check it. 18 is a bit less than a third of 60, which is 20, and that is what just under a third should look like.", "topic": "forwards: percentage of an amount"}, {"id": "m22-backwards-mixed:q5", "level": "medium", "type": "text", "q": "A triangle has an area of 36 cm^2 and a base of 9 cm. Work out the perpendicular height in cm.", "answer": "8", "accept": ["8", "8 cm", "8cm", "8.0", "eight"], "hint": "The area is given and the height is missing, so this one goes backwards. Double, then divide by the base.", "explain": "The answer is 8 cm. The area is given and the height is missing, so go backwards. 36 = 9 x height / 2. Double both sides: 72 = 9 x height. Divide by 9: height = 8 cm. Check it. If the height were 72, the area would be 9 x 72 / 2 = 324, not 36.", "topic": "backwards: triangle area to find a height"}, {"id": "m22-backwards-mixed:q6", "level": "medium", "type": "text", "q": "A 10 litre water carrier is emptied into bottles that each hold 1/2 a litre. How many bottles does it fill?", "answer": "20", "accept": ["20", "20 bottles", "twenty"], "hint": "Dividing by 1/2 is the same as multiplying by 2.", "explain": "The answer is 20 bottles. You have the total and you want the number of pieces, so divide: 10 / (1/2) = 10 x 2 = 20. Check it. 20 bottles of 1/2 a litre is 20 x 1/2 = 10 litres, which is the carrier you started with. Dividing by a number smaller than 1 makes the answer bigger, so 20 being larger than 10 is correct, not a mistake.", "topic": "mixed direction: division by a fraction to find how many pieces"}, {"id": "m22-backwards-mixed:q7", "level": "medium", "type": "mc", "q": "Do not work anything out for this one. Which direction does this question go? A jacket costs 48 pounds after 20% was taken off. What was the price before?", "options": ["Backwards, because the finished price is given and the starting price is the missing number.", "Forwards, because you take 20% off the 48 pounds.", "Forwards, because there is a percentage in it.", "Backwards, because the answer has to be smaller than 48 pounds."], "answer": "Backwards, because the finished price is given and the starting price is the missing number.", "hint": "The 48 pounds is the answer to the forward question, not the start of it.", "explain": "This goes backwards. The forward rule is old price minus 20% of it = new price, and here the new price is handed to you while the old price is missing. Taking 20% off the 48 is the forward move done a second time on a number that is already the finished answer, and it gives 38.40, which is wrong. A reverse percentage answer is always bigger than the sale price, not smaller, because money was taken off to get to the sale price.", "topic": "direction check: classifying a reverse percentage question"}, {"id": "m22-backwards-mixed:q8", "level": "medium", "type": "text", "q": "40% of the pupils in a year group play a sport. That is 36 pupils. How many pupils are in the year group?", "answer": "90", "accept": ["90", "90 pupils", "ninety"], "hint": "36 is 40%, so find 10% by dividing by 4, then times by 10.", "explain": "The answer is 90 pupils. 36 is 40%, so 10% is 36 / 4 = 9, and 100% is 10 x 9 = 90. This one went backwards, because you were given the part and asked for the whole. Check it. 10% of 90 is 9, so 40% is 4 x 9 = 36, which is the number you were given. If the answer were 14.4 (that is 40% of 36), then 40% of 14.4 would be 5.76, not 36.", "topic": "backwards: reverse percentage to find the whole"}, {"id": "m22-backwards-mixed:q9", "level": "medium", "type": "text", "q": "A porridge recipe uses oats to water in the ratio 2:5. You use 4 cups of oats. How many cups of water do you need?", "answer": "10", "accept": ["10", "10 cups", "ten"], "hint": "Oats are 2 parts and you used 4 cups, so one part is 2 cups.", "explain": "The answer is 10 cups of water. Oats are 2 parts and you used 4 cups, so one part is 4 / 2 = 2 cups. Water is 5 parts, so water is 5 x 2 = 10 cups. Check it. The finished mix is 4 cups of oats to 10 cups of water, and 4:10 cancels down to 2:5, which is the ratio you were given.", "topic": "forwards: scaling a ratio to find the other share"}, {"id": "m22-backwards-mixed:q10", "level": "medium", "type": "mc", "q": "A sequence starts 4, 7, 10, 13 and keeps going up in 3s. Is 61 a term in this sequence?", "options": ["Yes, it is the 20th term.", "No, because all the terms are even numbers.", "Yes, it is the 61st term.", "No, because 61 is not in the 3 times table."], "answer": "Yes, it is the 20th term.", "hint": "The rule is term = 3n + 1. Undo it: take away the 1, then divide by 3, and see if you get a whole number.", "explain": "The answer is yes, 61 is the 20th term. The terms go up in 3s starting from 4, so the rule is term = 3n + 1. This is a backwards question: you are given the term and asked for its position. Undo the rule. 61 - 1 = 60, and 60 / 3 = 20, which is a whole number, so 61 is the 20th term. Check forwards: 3 x 20 + 1 = 61, the number you were given. If the division had not given a whole number, 61 would not be in the sequence at all.", "topic": "backwards: testing whether a number is a term in a sequence"}, {"id": "m22-backwards-mixed:q11", "level": "stretch", "type": "text", "q": "A plank is cut into pieces that are each 2/5 of a metre long. It makes exactly 15 pieces with nothing left over. How long was the plank in metres?", "answer": "6", "accept": ["6", "6 m", "6m", "6.0", "six"], "hint": "15 pieces of 2/5 of a metre. Multiply this time, do not divide.", "explain": "The answer is 6 metres. Here you are given the number of pieces and asked for the total, which is the division run backwards, so you multiply: 15 x 2/5 = 30/5 = 6 metres. Check it forwards. 6 / (2/5) = 6 x 5/2 = 30/2 = 15 pieces, which is the number of pieces you were given. If you had divided 15 by 2/5 you would get 37.5 metres, and 37.5 metres of plank would make far more than 15 pieces.", "topic": "backwards: undoing a division by a fraction to find the total"}, {"id": "m22-backwards-mixed:q12", "level": "stretch", "type": "text", "q": "A triangular flag has an area of 84 cm^2 and a base of 14 cm. Work out the perpendicular height in cm.", "answer": "12", "accept": ["12", "12 cm", "12cm", "12.0", "twelve"], "hint": "Area is given, height is missing, so go backwards. Double the area, then divide by 14.", "explain": "The answer is 12 cm. 84 = 14 x height / 2. Double both sides: 168 = 14 x height. Divide by 14: height = 12 cm. Check it. 14 x 12 / 2 = 168 / 2 = 84, the area you were given. If the height were 168, the area would be 14 x 168 / 2 = 1176, not 84.", "topic": "backwards: triangle area to find a height"}]}, "wu1-warmup": {"id": "wu1-warmup", "day": "Day 1", "subject": "Warm up", "title": "Five to start", "minutes": 5, "objective": "Get one working backwards question done, pull one old topic back out, and reload three things from earlier weeks.", "extract": null, "teach": {"intro": ["This is a warm up. Five questions, five minutes, and it counts for nothing. Getting one wrong here is useful information, because it tells you what to look at before the main block starts."], "keyfact": "Question 1 is a working backwards question. Put your answer back into the forward rule and check you land on the number you were given."}, "questions": [{"id": "wu1-warmup:q1", "level": "easy", "type": "text", "q": "A triangle has an area of 12 cm^2 and a base of 4 cm. What is its perpendicular height in cm?", "answer": "6", "accept": ["6", "6 cm", "6cm", "6.0", "six"], "hint": "Area = base x height / 2. Double the area, then divide by the base.", "explain": "The answer is 6 cm. 12 = 4 x height / 2. Double both sides: 24 = 4 x height. Divide by 4: height = 6 cm. Check it. If the height were 24, the area would be 4 x 24 / 2 = 48, not 12.", "topic": "working backwards: triangle area to find a height"}, {"id": "wu1-warmup:q2", "level": "easy", "type": "mc", "q": "The sun heats a lake and some of the water turns into water vapour and rises. What is that step of the water cycle called?", "options": ["Evaporation", "Condensation", "Precipitation", "Transpiration"], "answer": "Evaporation", "hint": "Liquid turning into gas as it is heated. The word starts with the same sound as escape.", "explain": "The answer is evaporation. Heat turns liquid water into water vapour, a gas, and the vapour rises. Condensation is the opposite direction: vapour cooling high up and turning back into tiny liquid droplets to make cloud. Heating up is evaporation, cooling down is condensation.", "topic": "water cycle: naming evaporation rather than condensation"}, {"id": "wu1-warmup:q3", "level": "easy", "type": "mc", "q": "In the sentence The fox sprinted across the frozen road, what word class is sprinted?", "options": ["Verb", "Noun", "Adjective", "Adverb"], "answer": "Verb", "hint": "It is the word that says what the fox did.", "explain": "The answer is verb. Sprinted is the action the fox carried out. Fox and road are nouns, frozen is an adjective describing the road.", "topic": "English word classes: identifying a verb"}, {"id": "wu1-warmup:q4", "level": "easy", "type": "mc", "q": "In which year was the Battle of Hastings?", "options": ["1066", "1215", "1485", "1666"], "answer": "1066", "hint": "William of Normandy invaded England.", "explain": "The answer is 1066, when William of Normandy beat King Harold at Hastings. 1215 is Magna Carta, 1485 is Bosworth, 1666 is the Great Fire of London.", "topic": "history: dating the Norman conquest"}, {"id": "wu1-warmup:q5", "level": "medium", "type": "text", "q": "A parachute opens and the falling skydiver slows down. Name the force pushing up against them.", "answer": "air resistance", "accept": ["air resistance", "drag", "air resistance (drag)", "friction from the air", "air friction"], "hint": "It is the push of the air on a moving object.", "explain": "The answer is air resistance, also called drag. The parachute has a large surface, so it pushes against much more air, and that upward force grows until it balances the weight pulling down. Once the forces balance, the speed stops changing.", "topic": "science: naming air resistance as the opposing force"}]}, "wu2-warmup": {"id": "wu2-warmup", "day": "Day 2", "subject": "Warm up", "title": "Five to start", "minutes": 5, "objective": "Get one working backwards question done, pull one old topic back out, and reload three things from earlier weeks.", "extract": null, "teach": {"intro": ["Warm up again. Five questions, no marks, no stakes. Question 1 is always a working backwards one, so that is the one to slow down on."], "keyfact": "Question 1 is a working backwards question. Put your answer back into the forward rule and check you land on the number you were given."}, "questions": [{"id": "wu2-warmup:q1", "level": "easy", "type": "text", "q": "Trail mix is nuts to raisins in the ratio 2:5. There are 6 g of nuts. What does the whole mix weigh in g?", "answer": "21", "accept": ["21", "21 g", "21g", "twenty one", "twenty-one"], "hint": "Nuts are 2 parts and weigh 6 g, so one part is 3 g. Count all the parts.", "explain": "The answer is 21 g. Nuts are 2 parts and weigh 6 g, so one part is 6 / 2 = 3 g. The mix is 2 + 5 = 7 parts, so the total is 7 x 3 = 21 g. Check it. Split 21 g into 7 parts of 3 g and the nuts are 2 x 3 = 6 g, which is what you were given.", "topic": "working backwards: ratio to find a total from one share"}, {"id": "wu2-warmup:q2", "level": "easy", "type": "mc", "q": "Which of these years came first?", "options": ["200 BC", "50 BC", "AD 50", "AD 200"], "answer": "200 BC", "hint": "BC years count down towards the year 0, so a bigger BC number is further back.", "explain": "The answer is 200 BC. BC years run backwards, so 200 BC is earlier than 50 BC, and both are earlier than any AD year. The full order from earliest to latest is 200 BC, 50 BC, AD 50, AD 200.", "topic": "history: ordering BC and AD years"}, {"id": "wu2-warmup:q3", "level": "medium", "type": "text", "q": "On a 1:50 000 map two points are 4 cm apart. How far apart are they in real life, in km?", "answer": "2", "accept": ["2", "2 km", "2km", "2.0", "two"], "hint": "1 cm on the map is 50 000 cm in real life. There are 100 000 cm in a km.", "explain": "The answer is 2 km. 4 x 50 000 = 200 000 cm in real life. There are 100 000 cm in a kilometre, so 200 000 / 100 000 = 2 km. A useful shortcut for this scale: 1 cm is half a kilometre, so 4 cm is 2 km.", "topic": "geography: converting map distance to real distance at 1:50 000"}, {"id": "wu2-warmup:q4", "level": "easy", "type": "mc", "q": "Which gas do plants take in from the air to carry out photosynthesis?", "options": ["Carbon dioxide", "Oxygen", "Nitrogen", "Hydrogen"], "answer": "Carbon dioxide", "hint": "It is the gas that goes in, not the one that comes out.", "explain": "The answer is carbon dioxide. Plants take in carbon dioxide and water and use light energy to make glucose, and oxygen is the waste gas they give out. Oxygen going out is the easy one to mix up with the gas coming in.", "topic": "science: the gas taken in during photosynthesis"}, {"id": "wu2-warmup:q5", "level": "medium", "type": "mc", "q": "More than one climber left bags at the camp. Which version is punctuated correctly?", "options": ["The climbers' bags were left at the camp.", "The climber's bags were left at the camp.", "The climbers bags were left at the camp.", "The climbers's bags were left at the camp."], "answer": "The climbers' bags were left at the camp.", "hint": "Write the owners first. If the word already ends in s, the apostrophe goes after it.", "explain": "The answer is climbers' bags. The owners are climbers, plural, and that word already ends in s, so the apostrophe goes straight after the s with nothing added. Climber's would mean one climber, and climbers with no apostrophe shows no ownership at all.", "topic": "English apostrophes: plural possession"}]}, "wu3-warmup": {"id": "wu3-warmup", "day": "Day 3", "subject": "Warm up", "title": "Five to start", "minutes": 5, "objective": "Get one working backwards question done, pull one old topic back out, and reload three things from earlier weeks.", "extract": null, "teach": {"intro": ["Five to start. None of this counts. If something has gone rusty, this is exactly where you want to find that out."], "keyfact": "Question 1 is a working backwards question. Put your answer back into the forward rule and check you land on the number you were given."}, "questions": [{"id": "wu3-warmup:q1", "level": "easy", "type": "text", "q": "How many 1/3 metre pieces can you cut from a rope 2 metres long?", "answer": "6", "accept": ["6", "6 pieces", "six"], "hint": "You are undoing pieces x 1/3 = 2, so divide 2 by 1/3.", "explain": "The answer is 6 pieces. 2 / (1/3) = 2 x 3 = 6. Check it. 6 pieces of 1/3 of a metre is 6 x 1/3 = 6/3 = 2 metres, which is the rope you started with.", "topic": "working backwards: division by a fraction to find how many pieces"}, {"id": "wu3-warmup:q2", "level": "medium", "type": "text", "q": "A six figure grid reference is 384 726. Write the four figure grid reference for the same square.", "answer": "3872", "accept": ["3872", "38 72", "38,72"], "hint": "Drop the third digit of each half.", "explain": "The answer is 3872. A six figure reference is the four figure reference with one extra digit added to each half to say where you are inside the square. Take the third digit off each half: 384 becomes 38, and 726 becomes 72, giving 3872. Easting always comes before northing, so along the bottom first, then up the side.", "topic": "geography: six figure to four figure grid references"}, {"id": "wu3-warmup:q3", "level": "easy", "type": "mc", "q": "In 1215 King John agreed to Magna Carta. What did it mainly do?", "options": ["It limited the power of the king", "It gave every man the vote", "It ended slavery in England", "It made England a republic"], "answer": "It limited the power of the king", "hint": "The barons forced it on him, so think about whose power was being reined in.", "explain": "The answer is that it limited the power of the king. Barons made King John accept written rules, including that free men could not be jailed without proper judgement and that he could not raise certain taxes on his own. It did not give ordinary people the vote, and England stayed a monarchy.", "topic": "history: what Magna Carta did"}, {"id": "wu3-warmup:q4", "level": "easy", "type": "mc", "q": "In the sentence The frozen lake cracked loudly, what word class is frozen?", "options": ["Adjective", "Verb", "Noun", "Preposition"], "answer": "Adjective", "hint": "It tells you what the lake was like.", "explain": "The answer is adjective, because frozen describes the lake. Cracked is the verb, lake is the noun, and loudly is an adverb describing how it cracked.", "topic": "English word classes: identifying an adjective"}, {"id": "wu3-warmup:q5", "level": "easy", "type": "text", "q": "What is the name for the place where a river starts?", "answer": "source", "accept": ["source", "the source", "its source"], "hint": "The opposite end from the mouth.", "explain": "The answer is the source, usually high ground where rainwater or a spring starts the flow. The river ends at the mouth, where it meets the sea or a lake. Source at the top, mouth at the bottom.", "topic": "geography: naming the source of a river"}]}, "wu4-warmup": {"id": "wu4-warmup", "day": "Day 4", "subject": "Warm up", "title": "Five to start", "minutes": 5, "objective": "Get one working backwards question done, pull one old topic back out, and reload three things from earlier weeks.", "extract": null, "teach": {"intro": ["Warm up. Five questions, five minutes, nothing riding on it. Do question 1 on paper rather than in your head."], "keyfact": "Question 1 is a working backwards question. Put your answer back into the forward rule and check you land on the number you were given."}, "questions": [{"id": "wu4-warmup:q1", "level": "easy", "type": "text", "q": "10% of a number is 7. What is the number?", "answer": "70", "accept": ["70", "70.0", "seventy"], "hint": "10% is the number divided by 10, so undo the divide.", "explain": "The answer is 70. 10% means divide by 10, so undo it by multiplying by 10: 7 x 10 = 70. Check it. 10% of 70 is 70 / 10 = 7, which is the number you were given. If the answer were 0.7, then 10% of that would be 0.07, not 7.", "topic": "working backwards: reverse percentage to find the whole"}, {"id": "wu4-warmup:q2", "level": "easy", "type": "text", "q": "Work out 3/4 x 20.", "answer": "15", "accept": ["15", "15.0", "fifteen"], "hint": "Find a quarter of 20 first, then take three of them.", "explain": "The answer is 15. A quarter of 20 is 20 / 4 = 5, and three quarters is 3 x 5 = 15. You can also do 3 x 20 = 60 then 60 / 4 = 15, which gives the same thing. Multiplying by a fraction smaller than 1 makes the answer smaller, so 15 being less than 20 is right.", "topic": "fractions: a fraction times a whole number"}, {"id": "wu4-warmup:q3", "level": "medium", "type": "text", "q": "Five readings of a plant height in cm are 4, 5, 6, 5 and 40. The 40 is an anomaly and should be left out. What is the mean of the readings that are left?", "answer": "5", "accept": ["5", "5 cm", "5.0", "five"], "hint": "Add the four sensible readings, then divide by 4, not by 5.", "explain": "The answer is 5 cm. Throw out the 40. The readings left are 4, 5, 6 and 5, which add to 20, and there are four of them, so the mean is 20 / 4 = 5. The usual slip is dividing by 5 when you only added four numbers. Divide by how many readings you actually used.", "topic": "data: mean with an anomaly removed"}, {"id": "wu4-warmup:q4", "level": "easy", "type": "mc", "q": "Which of these is a physical feature rather than a human feature?", "options": ["A waterfall", "A motorway", "A factory", "A housing estate"], "answer": "A waterfall", "hint": "Physical means it would be there with no people involved.", "explain": "The answer is a waterfall, because it is made by nature and would exist without people. Motorways, factories and housing estates are all built by people, so they are human features.", "topic": "geography: physical and human features"}, {"id": "wu4-warmup:q5", "level": "easy", "type": "mc", "q": "Which sentence uses the apostrophe correctly?", "options": ["It's going to rain later.", "Its going to rain later.", "Its' going to rain later.", "It is' going to rain later."], "answer": "It's going to rain later.", "hint": "Try reading it as it is. If that makes sense, you need the apostrophe.", "explain": "The answer is It's going to rain later. It's is short for it is, and the apostrophe stands in for the missing i. Its with no apostrophe means belonging to it, as in the dog chased its tail. Test it by reading it as it is: if the sentence still works, use it's.", "topic": "English apostrophes: it's and its"}]}, "wu5-warmup": {"id": "wu5-warmup", "day": "Day 5", "subject": "Warm up", "title": "Five to start", "minutes": 5, "objective": "Get one working backwards question done, pull one old topic back out, and reload three things from earlier weeks.", "extract": null, "teach": {"intro": ["Last warm up of the week. Five questions, no marks. Anything you miss here is a free warning before the test."], "keyfact": "Question 1 is a working backwards question. Put your answer back into the forward rule and check you land on the number you were given."}, "questions": [{"id": "wu5-warmup:q1", "level": "medium", "type": "mc", "q": "A sequence goes 5, 9, 13, 17 and keeps rising in 4s. Is 30 a term in this sequence?", "options": ["No, every term is odd and 30 is even", "Yes, it is the 8th term", "Yes, because 30 is bigger than 17", "No, because the sequence stops at 17"], "answer": "No, every term is odd and 30 is even", "hint": "The rule is term = 4n + 1. Take away 1 and divide by 4, and see if you get a whole number.", "explain": "The answer is no. The rule is term = 4n + 1. Undo it: 30 - 1 = 29, and 29 / 4 = 7.25, which is not a whole number, so 30 has no position in the sequence. You can see it faster too: adding 4 to an odd number keeps it odd, so every term is odd and 30 is even. A sequence does not stop just because the question only printed four terms.", "topic": "working backwards: testing whether a number is a term in a sequence"}, {"id": "wu5-warmup:q2", "level": "medium", "type": "text", "q": "Simplify 7b - 4 - 3b + 9.", "answer": "4b + 5", "accept": ["4b + 5", "4b+5", "5 + 4b", "5+4b", "4b plus 5"], "hint": "Each term keeps the sign in front of it. Collect the b terms, then the plain numbers.", "explain": "The answer is 4b + 5. Take the signs with the terms: the b terms are +7b and -3b, which give 7b - 3b = 4b. The plain numbers are -4 and +9, which give -4 + 9 = 5. So the answer is 4b + 5. The usual slip is reading it as 7b - 3b and -4 - 9, which would wrongly give 4b - 13.", "topic": "algebra: signs when collecting like terms"}, {"id": "wu5-warmup:q3", "level": "easy", "type": "mc", "q": "In the sentence She wrote the note carefully, what word class is carefully?", "options": ["Adverb", "Adjective", "Verb", "Noun"], "answer": "Adverb", "hint": "It tells you how the action was done.", "explain": "The answer is adverb, because carefully describes how she wrote. Wrote is the verb and note is a noun. Adjectives describe nouns, adverbs describe verbs, and the ly ending is a strong clue but not a guarantee.", "topic": "English word classes: identifying an adverb"}, {"id": "wu5-warmup:q4", "level": "easy", "type": "mc", "q": "Henry VIII broke away from the Pope in the 1530s. What was the church he then led called?", "options": ["The Church of England", "The Roman Catholic Church", "The Presbyterian Church", "The Orthodox Church"], "answer": "The Church of England", "hint": "It is named after the country he ruled.", "explain": "The answer is the Church of England, with Henry VIII as its head instead of the Pope. He broke with Rome after the Pope refused to end his first marriage, and it also let him take the monasteries' wealth. The Roman Catholic Church is the one he broke away from.", "topic": "history: the break with Rome under Henry VIII"}, {"id": "wu5-warmup:q5", "level": "easy", "type": "text", "q": "A gas cools down and turns into a liquid. Name that change of state.", "answer": "condensation", "accept": ["condensation", "condensing", "condense", "condenses"], "hint": "It is the opposite of evaporation.", "explain": "The answer is condensation. Cooling takes energy out of the particles, they slow down and pull together, and the gas becomes a liquid. Evaporation is the other direction, liquid to gas when heat goes in. Cooling gives condensation, heating gives evaporation.", "topic": "science: naming condensation as gas to liquid"}]}, "e13-analytical-para": {"id": "e13-analytical-para", "day": "Day 2", "subject": "English", "title": "One paragraph, properly built", "minutes": 20, "objective": "Build one analytical paragraph that makes a point, proves it with a short quotation, and explains how the writer's word choice creates the effect rather than retelling what happened.", "extract": "The bus had gone. Daniel knew it had gone because the timetable said 17:42 and his watch said 17:55, and because the shelter was empty except for a crushed can rolling itself back and forth in the wind.\n\nHe counted the coins in his pocket again. One pound twenty. He counted them a third time, as if the counting might breed them.\n\nHeadlights swung across the wet road. His father's van pulled in, wipers scraping, and the window came down halfway.\n\n\"You said six,\" Daniel said.\n\n\"I said about six.\"\n\nInside, the heater was on too high. Daniel climbed in and held his bag on his knees like a passenger in someone else's car. On the dashboard there was a form, folded twice, with his name printed at the top and a box that was still empty.\n\n\"Trials went alright, then,\" his father said.\n\n\"Yeah.\"\n\n\"Good lad.\"\n\nDaniel looked out of the window. The streetlights came past one after another, one after another, and each one lit his face for half a second and then let it go. He had known at four o'clock, standing on the grass with his shirt sticking to his back. He had not said it out loud yet, and now he was not going to.", "teach": {"intro": ["Marks in English are not given for knowing what happened. They are given for showing how the writer made it happen. So \"Daniel is upset because he was not picked\" earns almost nothing, because anyone who read the extract knows that.", "A paragraph has three parts. Point, then evidence, then explanation. The point is your idea in one sentence, the evidence is a short quotation that proves it, and the explanation is where the marks live.", "Here is the jump you need. A grade 6 explanation says what the quote shows about the character: \"'like a passenger in someone else's car' shows Daniel feels uncomfortable.\" A grade 9 explanation says how the writer built that feeling: \"the writer chooses 'someone else's', so the van becomes a stranger's vehicle, and Daniel is made a guest in his own family without anyone in the scene saying a word about it.\"", "Same quote, same idea. The difference is that the second one has its hand on the writer's choice. Ask yourself one question every time: which exact word did the writer pick, and what does picking that word do to the reader?", "Keep quotations short. Three to six words is plenty, because a long quotation gives you too much to talk about and you end up retelling it. Land on one word inside the quotation and squeeze that."], "example": {"problem": "Write an analytical paragraph on this point: the writer shows that Daniel has nothing left to do but wait.", "steps": ["Point first, one sentence, no quotation yet. The writer shows that Daniel has run out of things he can control.", "Now pick evidence. Scan the extract for the smallest bit of text that proves it. The coin counting does, so quote just 'a third time', not the whole sentence.", "Write the evidence into the sentence so it reads smoothly. He counts his one pound twenty 'a third time'.", "Now the explanation, and this is the part that pays. Name the writer's choice. The writer chose to have him count a total he already knows, three times over.", "Then say what that choice does to the reader. Counting money that cannot grow is a pointless action, so the repetition makes the waiting feel like something Daniel is doing to fill time rather than to fix anything.", "Squeeze one word. 'Breed' is the strongest word there, because breeding is what living things do, and the writer lends the coins a power they obviously do not have, which makes Daniel's hope look childish even to himself.", "Read it back as one paragraph and check there is no sentence in it that only says what happened."], "answer": "The writer shows that Daniel has run out of things he can control. He counts his one pound twenty 'a third time', as if the counting 'might breed them'. Counting a total he already knows is a pointless action, so the repeated counting makes the waiting feel like something Daniel is doing to fill time rather than to fix anything. The verb 'breed' is doing the real work, because breeding is what living things do, and by lending the coins a power they obviously do not have the writer lets the reader see how thin Daniel's hope has become."}, "example2": {"problem": "Upgrade this weak explanation. Point: the writer shows Daniel's father is not really listening. Evidence: 'Good lad'. Explanation: this shows that his father does not care about him.", "steps": ["Find what is wrong. The explanation is a statement about the character, and it does not mention the writer once. That is the grade 6 ceiling.", "Put the writer back in. Ask what the writer chose, and what the writer chose instead.", "The writer gave the father two words where praise should be, and the praise arrives before he has heard a single detail about the trials.", "Now say what that does to the reader. Praise given without any information is not praise, it is a way of closing the subject, so the reader sees the door shut on Daniel at the exact moment he could have spoken.", "Notice that the upgraded version is not longer because it uses bigger words. It is stronger because every clause is about a decision the writer made."], "answer": "The writer gives the father the two words 'Good lad' before he has heard one detail about the trials. Praise handed over with no information behind it is not really praise, it is a way of closing the subject, so the writer makes the reader watch the door shut on Daniel at the exact moment he might have spoken."}, "keyfact": "Point, then a quotation of three to six words, then explain the writer's choice and its effect on the reader. If a sentence in your explanation could be written by someone who had only heard the plot, it is retelling and it earns nothing."}, "questions": [{"id": "e13-analytical-para:q1", "level": "easy", "type": "mc", "q": "An analytical paragraph has three parts. Which order do they go in?", "options": ["Point, then evidence, then explanation", "Evidence, then point, then explanation", "Explanation, then point, then evidence", "Point, then explanation, then evidence"], "answer": "Point, then evidence, then explanation", "hint": "Say your idea, prove it, then explain how the writer built it.", "explain": "The answer is point, then evidence, then explanation. You cannot prove an idea you have not stated yet, so the point comes first. You cannot explain a quotation you have not given yet, so the evidence comes second. The explanation is last and it is worth the most marks.", "topic": "analytical paragraph: the order of point, evidence and explanation"}, {"id": "e13-analytical-para:q2", "level": "easy", "type": "mc", "q": "Which one of these four sentences is analysis rather than retelling?", "options": ["Daniel's father arrives in his van and puts the window down halfway.", "Daniel counts his coins, then gets into the van and says very little.", "The writer has Daniel count his coins 'a third time', and that useless repeated action shows a boy with nothing left to do but check a total he already knows.", "After the trials Daniel does not tell his father that he was not picked."], "answer": "The writer has Daniel count his coins 'a third time', and that useless repeated action shows a boy with nothing left to do but check a total he already knows.", "hint": "Three of them could be written by someone who had only been told the plot. One of them names a choice the writer made.", "explain": "The third sentence is the analysis. It is the only one that says 'the writer has Daniel...', so it treats the action as a decision somebody made rather than an event that simply happened. The other three are all retelling: they report what Daniel and his father do, in order, and they would score nothing even though every word of them is true.", "topic": "analysis versus retelling: identifying the analytical sentence"}, {"id": "e13-analytical-para:q3", "level": "easy", "type": "text", "q": "Name the technique the writer uses in 'like a passenger in someone else's car'. One word.", "answer": "simile", "accept": ["simile", "a simile", "similie", "simile.", "it is a simile", "Simile"], "hint": "The word 'like' is comparing one thing to another.", "explain": "It is a simile. A simile compares two things using 'like' or 'as', and here Daniel sitting in his own father's van is compared to a passenger in a stranger's car. The technique name is only the first mark. The mark that matters comes from saying what the comparison does, which is to make Daniel a guest in his own family.", "topic": "technique naming: simile in a line of the extract"}, {"id": "e13-analytical-para:q4", "level": "medium", "type": "mc", "q": "Point: the writer shows that Daniel feels like a guest in his own family. Which quotation is the best evidence for that exact point?", "options": ["'like a passenger in someone else's car'", "'The bus had gone.'", "'the heater was on too high'", "'One pound twenty.'"], "answer": "'like a passenger in someone else's car'", "hint": "Read the point again, then find the quotation that proves that point and not some other point.", "explain": "The simile is the right evidence, because 'someone else's' is the phrase that turns his father's van into a stranger's car, which is exactly what the point claims. The other three are real details but they prove different points. 'The bus had gone' proves he is stranded, 'the heater was on too high' proves the van is uncomfortable, and 'One pound twenty' proves he has no money. Choosing evidence that nearly fits is one of the quickest ways to lose marks.", "topic": "choosing evidence: matching the best quotation to a given point"}, {"id": "e13-analytical-para:q5", "level": "medium", "type": "mc", "q": "Three pupils wrote about the same point. Which one has evidence but no explanation?\n\nA: The writer shows Daniel is let down. His father says 'I said about six'. The word 'about' quietly lets his father off, so the writer makes the broken promise into something Daniel is not even allowed to be angry about.\n\nB: The writer shows Daniel is let down. His father says 'I said about six'. Then Daniel gets into the van and they drive home through the rain.\n\nC: The writer shows Daniel is let down. He is left standing in an empty bus shelter long after his bus has gone.", "options": ["A", "B", "C"], "answer": "B", "hint": "One of them has a quotation and then stops analysing. One of them never quotes at all.", "explain": "B is the one with evidence but no explanation. It makes a point and it quotes correctly, and then the third sentence retells what happens next instead of explaining the quotation. That is the most common way a paragraph collapses: the quote goes in, and then the writing drifts back into the story. A is the complete version, because its third sentence works on the word 'about'. C is missing the evidence, not the explanation, since it has no quotation marks anywhere in it.", "topic": "paragraph structure: spotting evidence with no explanation"}, {"id": "e13-analytical-para:q6", "level": "medium", "type": "mc", "q": "Point: the writer shows that Daniel has stopped expecting anything from his father. Evidence: 'the window came down halfway'.\n\nExplanation A: The window only coming down halfway shows that his father is not really interested in him.\n\nExplanation B: The writer chooses 'halfway' rather than 'down', so even the opening between them is unfinished, and the conversation is half shut before it has started.\n\nWhich explanation is stronger, and why?", "options": ["Explanation B, because it names the writer's word choice and says what that choice does", "Explanation A, because it says clearly what the character is like", "Explanation B, because it is longer than Explanation A", "Explanation A, because it does not waste words on the writer"], "answer": "Explanation B, because it names the writer's word choice and says what that choice does", "hint": "One of them could have been written without the extract in front of you. Length is never the reason.", "explain": "Explanation B is stronger because it points at one word, 'halfway', shows the alternative the writer rejected, which was simply 'down', and then says what the choice does to the scene. Explanation A only reports a feeling about the character, which is the grade 6 ceiling. Length is not the reason for anything, so the third option is wrong even though it picks the right explanation, and that is the trap in this question.", "topic": "explanation quality: writer's word choice rather than a statement about character"}, {"id": "e13-analytical-para:q7", "level": "medium", "type": "text", "q": "In 'as if the counting might breed them', copy out the single verb that makes the coins sound like living things.", "answer": "breed", "accept": ["breed", "'breed'", "breed.", "the verb breed", "breed them", "Breed"], "hint": "Which one word in that phrase belongs to animals rather than money?", "explain": "The verb is 'breed'. Breeding is something living things do, so the writer hands the coins a power that money obviously does not have. That is why the word is worth writing about: it is not describing the coins, it is showing the reader how badly Daniel needs there to be more of them.", "topic": "word level analysis: identifying the verb that carries the effect"}, {"id": "e13-analytical-para:q8", "level": "medium", "type": "mc", "q": "Both sentences use the same quotation, 'Yeah'. Which one explains the writer's method rather than just describing the character?\n\nSentence 1: This quotation shows that Daniel is tired and does not want to talk to his father.\n\nSentence 2: The writer gives Daniel one word where a full answer belongs, so the gap between the question and the reply does the talking instead of Daniel.", "options": ["Sentence 2", "Sentence 1", "Both of them", "Neither of them"], "answer": "Sentence 2", "hint": "Look for the sentence that mentions a decision, not a mood.", "explain": "Sentence 2 explains the method. It names what the writer did, which was to put one word where a sentence should be, and then says what that does, which is to make the silence carry the meaning. Sentence 1 is not wrong, it is just a statement about Daniel's mood, and a mood is not a method. This exact difference is the jump from a grade 6 to a grade 9, and it costs you nothing extra in writing time once you are in the habit.", "topic": "analysis versus retelling: writer's method rather than character mood"}, {"id": "e13-analytical-para:q9", "level": "medium", "type": "text", "q": "Name the technique in 'one after another, one after another'. One word.", "answer": "repetition", "accept": ["repetition", "repeated", "repeating", "repetition.", "a repetition", "Repetition", "repitition"], "hint": "The writer says the same three words twice in a row on purpose.", "explain": "It is repetition. The writer repeats the phrase so the streetlights feel endless and identical, which makes the journey feel like something happening to Daniel rather than something he is part of. Naming it gets you started. Saying what the repetition does to the reader is what earns the mark.", "topic": "technique naming: repetition in a line of the extract"}, {"id": "e13-analytical-para:q10", "level": "stretch", "type": "mc", "q": "You are about to write the explanation part of your paragraph. Which opening forces you into analysing the writer's method?", "options": ["The writer's choice of the verb 'scraping' makes the van sound worn out and grudging, so...", "This shows that Daniel is sad because...", "In the extract it says that...", "This quote means that..."], "answer": "The writer's choice of the verb 'scraping' makes the van sound worn out and grudging, so...", "hint": "Three of these openings can only be finished with plot or feelings. One of them cannot be finished without talking about a word.", "explain": "The first opening is the one that works, because 'the writer's choice of' cannot be finished without naming a word and its effect. The other three lead you somewhere useless. 'This shows that Daniel is sad' goes to mood, 'In the extract it says' goes to copying, and 'This quote means' goes to translating the quotation into ordinary words, which is retelling in disguise. Change your opening and the rest of the sentence improves on its own.", "topic": "explanation quality: sentence openings that force method analysis"}, {"id": "e13-analytical-para:q11", "level": "stretch", "type": "mc", "q": "A pupil writes: The writer shows Daniel is trapped. The streetlights 'lit his face for half a second and then let it go'. This is personification. What is missing?", "options": ["It names the technique but never says what effect the personification has on the reader", "Nothing is missing, because naming the technique is the analysis", "It needs a second quotation to back up the first one", "It needs a sentence saying what happens next in the story"], "answer": "It names the technique but never says what effect the personification has on the reader", "hint": "Naming a technique is a label. A label is not an explanation.", "explain": "The paragraph stops one sentence too early. It has a point, a well chosen short quotation and the correct technique name, and then it stops, so the reader is never told what the personification does. The missing sentence is something like: giving the lights the power to hold his face and then 'let it go' makes even the light seem to lose interest in him, so Daniel is dropped over and over on the way home. Adding what happens next in the story would make it worse, not better, because that is retelling.", "topic": "explanation quality: naming a technique without explaining its effect"}, {"id": "e13-analytical-para:q12", "level": "stretch", "type": "long", "q": "Write ONE analytical paragraph answering this question: how does the writer show that Daniel is hiding the truth? Use point, then a short quotation of three to six words, then an explanation of the writer's method. One paragraph only, about six to eight sentences. Do not retell the story.", "marks": 6, "answer": "The writer shows that Daniel is hiding the truth by giving him the smallest possible words to say it in. When his father asks about the trials, Daniel answers 'Yeah', and that single word is doing the opposite of what a word usually does, because it fills the space in the conversation without letting anything through. The writer could have given him a sentence there and chose not to, so the reader is left listening to the size of the gap rather than to Daniel. The truth is then put inside his head instead of in his mouth, in 'he had not said it out loud yet', and the flat, ordinary rhythm of that phrase makes a serious decision sound like a small everyday one. Even the repetition of 'one after another, one after another' works on the silence, because the van keeps moving forwards while nothing gets said, so the writer makes the moment for telling the truth slide past rather than arrive. By the last line Daniel has not lied once, and the writer has still shown the reader exactly how a boy hides something from the person sitting next to him.", "explain": "Six marks, and here is what each one is for. 1. A point in one sentence that answers the question about hiding the truth, with no quotation in it. 2. A quotation of three to six words, copied exactly and punctuated inside quotation marks. 3. One sentence that names what the writer chose to do, beginning with words like 'the writer gives' or 'the writer chooses', not with 'this shows'. 4. One sentence saying what that choice does to the reader, not what it says about Daniel's mood. 5. A second short quotation, with the same treatment, so the paragraph develops instead of repeating itself. 6. No retelling anywhere, and it stays as one paragraph. Mark yourself honestly: read each sentence and ask whether someone who had only heard the plot could have written it. Every sentence where the answer is yes is a sentence that scores nothing.", "topic": "analytical paragraph: writing one full point, evidence and explanation paragraph"}]}, "s10-forces-energy-recap": {"id": "s10-forces-energy-recap", "day": "Day 4", "subject": "Science", "title": "Forces and energy, put together", "minutes": 20, "objective": "Use resultant force, weight, speed, pressure and efficiency in both directions, rearranging a rule when the number you need is not on its own, and find a mean after ignoring an anomaly.", "extract": "Ramp investigation results.\n\nA toy car was released from the same mark on a ramp five times. Each time, the distance the car rolled across the floor after leaving the ramp was measured with a metre rule. The ramp height, the car and the floor were kept the same for every run.\n\nRun 1: 62 cm. Run 2: 65 cm. Run 3: 30 cm. Run 4: 63 cm. Run 5: 66 cm.\n\nDuring run 3 the car clipped the edge of the ramp on the way down.", "teach": {"intro": ["Four rules do nearly all of this. Weight = mass x 10. Speed = distance / time. Pressure = force / area. Efficiency = useful energy / total energy x 100.", "Resultant force needs no rule at all, just adding and subtracting. Two forces in opposite directions subtract, so 20 N forwards against 8 N of friction gives a resultant of 12 N forwards, and two forces pulling the same way add.", "Half the marks here come from questions where the number you want is not on its own in the rule. That is the same move as the Day 1 maths session on working backwards. Speed = distance / time with the time missing is the commonest one, and you get it by writing the rule, putting in what you know, then undoing the rule one step at a time.", "Then the self check, every single time. Put your answer back into the forward version of the rule and see if you land on the number you were given. If a speed of 6 m/s over 30 s gives you a distance, check that distance divided by 30 comes back to 6.", "Energy is not made or used up, it moves. It sits in stores, which are chemical, kinetic, gravitational potential, elastic potential and thermal, and it is transferred between them, for example when a dropped ball empties its gravitational potential store into its kinetic store.", "Efficiency says how much of that transfer was the bit you actually wanted. A machine given 150 J that transfers 45 J usefully is 45 / 150 x 100 = 30% efficient, and the other 70% has gone to stores you did not want, usually thermal.", "Working scientifically. An anomaly is a result that does not fit the pattern, so readings of 22, 24, 23 and 9 have one obvious anomaly, the 9. You leave the anomaly out before you calculate the mean, because a mean that includes it describes something that went wrong rather than what normally happens."], "example": {"problem": "A train travels 1500 m at a steady speed of 25 m/s. How long does the journey take?", "steps": ["Write the forward rule: speed = distance / time.", "Put in what you know: 25 = 1500 / time. The number you want, time, is underneath, so this is a working backwards question, the same move as the Day 1 maths session on working backwards.", "Undo it one step at a time. Multiply both sides by time: 25 x time = 1500.", "Now divide both sides by 25: time = 1500 / 25 = 60 s.", "Self check. Put 60 back into the forward rule: 1500 / 60 = 25 m/s, which is the speed you were given, so 60 s is right.", "The wrong move to watch for is multiplying, giving 1500 x 25 = 37500. The self check kills it instantly, because 1500 / 37500 is nowhere near 25."], "answer": "60 s"}, "example2": {"problem": "A spring was stretched by the same force five times and its length measured each time: 48 mm, 51 mm, 49 mm, 20 mm, 52 mm. Work out the mean length.", "steps": ["Look at the numbers before touching them. Four of them sit between 48 and 52, and one of them, 20 mm, is nowhere near the others.", "That 20 mm is the anomaly. Something went wrong on that reading, so it is left out.", "Add the four you are keeping: 48 + 51 + 49 + 52 = 200 mm.", "Divide by how many you added, which is four, not five: 200 / 4 = 50 mm.", "Self check. The answer should sit inside the range of the readings you kept, and 50 is between 48 and 52, so it is sensible. If you had divided by five you would have got 40, which is below every reading you kept, and that is the sign you included the anomaly.", "Read the numbers in front of you every time you meet one of these. The numbers change from question to question, so an answer you remember from last time will be wrong."], "answer": "50 mm"}, "keyfact": "Write the rule, put in what you know, undo it one step at a time, then put your answer back into the forward rule and check you land on the number the question gave you. With a mean, drop the anomaly first and divide by how many readings you kept."}, "questions": [{"id": "s10-forces-energy-recap:q1", "level": "easy", "type": "mc", "q": "A rucksack has a mass of 6 kg. Using weight = mass x 10, what is its weight?", "options": ["60 N", "6 N", "0.6 N", "600 N"], "answer": "60 N", "hint": "Multiply the mass by 10.", "explain": "The answer is 60 N. Weight = mass x 10, so 6 x 10 = 60 N. Mass is in kg and weight is a force, so it is in N. Check it backwards: 60 / 10 = 6 kg, which is the mass you were given.", "topic": "forces: weight from mass using weight = mass x 10"}, {"id": "s10-forces-energy-recap:q2", "level": "easy", "type": "text", "q": "A sledge is pulled forwards with a force of 12 N. Friction pushes back on it with 5 N. What is the size of the resultant force in N?", "answer": "7", "accept": ["7", "7 N", "7N", "7.0", "seven", "7 newtons", "7 N forwards"], "hint": "The forces are in opposite directions, so take one away from the other.", "explain": "The answer is 7 N. The two forces act in opposite directions, so you subtract: 12 - 5 = 7 N, and it acts forwards because the bigger force is forwards. Adding them to get 17 N is the usual wrong move, and it only works when both forces pull the same way.", "topic": "forces: resultant of two forces in opposite directions"}, {"id": "s10-forces-energy-recap:q3", "level": "easy", "type": "text", "q": "A runner covers 100 m in 20 s. Work out the speed in m/s.", "answer": "5", "accept": ["5", "5 m/s", "5m/s", "5.0", "five", "5 metres per second"], "hint": "Speed = distance / time. Both numbers are already where you need them.", "explain": "The answer is 5 m/s. Speed = distance / time, so 100 / 20 = 5 m/s. This one is forwards, which means the number you want is already on its own, so there is nothing to undo. Check it: 5 x 20 = 100 m.", "topic": "speed: speed from distance and time, forwards"}, {"id": "s10-forces-energy-recap:q4", "level": "easy", "type": "mc", "q": "A bungee cord is stretched tight just before a jump. Which energy store is filling up as it stretches?", "options": ["Elastic potential store", "Thermal store", "Chemical store", "Nuclear store"], "answer": "Elastic potential store", "hint": "Which store belongs to things that are stretched or squashed?", "explain": "It is the elastic potential store. Stretching or squashing something springy fills its elastic potential store, and that store empties again when the cord pulls the jumper back up, transferring energy to the jumper's kinetic store. Chemical is for fuel and food, thermal is about how hot something is, and nuclear is not involved anywhere near a bungee cord.", "topic": "energy: identifying the store filled by stretching"}, {"id": "s10-forces-energy-recap:q5",
