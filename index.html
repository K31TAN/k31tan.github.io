<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Study OS">
<title>Study OS</title>
<style>
:root{--bg:#0f1215;--panel:#171b20;--panel2:#1e242b;--line:#2a323b;--ink:#e8edf2;--dim:#93a1b0;--faint:#5e6b78;
--accent:#4a9eff;--good:#3ecf8e;--bad:#ff6b6b;--warn:#f0b429;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:17px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:780px;margin:0 auto;padding:16px 16px 90px}
h1,h2,h3{line-height:1.25;margin:0}h1{font-size:23px;font-weight:650;letter-spacing:-.2px}
h2{font-size:19px;font-weight:620}h3{font-size:16px;font-weight:600}
.muted{color:var(--dim)}.faint{color:var(--faint);font-size:14px}.small{font-size:14px}
header{position:sticky;top:0;z-index:20;background:rgba(15,18,21,.94);backdrop-filter:saturate(160%) blur(12px);
border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.hd{max-width:780px;margin:0 auto;display:flex;align-items:center;gap:12px}
.hd .t{flex:1;min-width:0}.hd .t div:first-child{font-weight:650;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:5px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-top:9px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .35s ease}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
.card.tight{padding:13px 15px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.btn{display:block;width:100%;min-height:52px;padding:14px 16px;background:var(--accent);color:#06121f;
border-radius:12px;font-weight:650;font-size:17px;text-align:center;margin-top:12px}
.btn:disabled{opacity:.35}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:550}
.btn.warn{background:var(--warn);color:#1a1200}
.daylist{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.day{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);
border-radius:var(--r);padding:15px 16px;width:100%;text-align:left}
.day .n{width:44px;height:44px;flex:0 0 44px;border-radius:11px;background:var(--panel2);display:flex;
align-items:center;justify-content:center;font-weight:650;font-size:15px;color:var(--dim)}
.day.done .n{background:rgba(62,207,142,.14);color:var(--good)}
.day .g{flex:1;min-width:0}.chev{color:var(--faint);font-size:20px}
.blk{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
.blk .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.pill{display:inline-block;padding:4px 10px;border-radius:99px;font-size:12.5px;font-weight:620;
background:var(--panel2);color:var(--dim);white-space:nowrap}
.pill.good{background:rgba(62,207,142,.14);color:var(--good)}
.pill.bad{background:rgba(255,107,107,.14);color:var(--bad)}
.pill.warn{background:rgba(240,180,41,.14);color:var(--warn)}
.pill.acc{background:rgba(74,158,255,.14);color:var(--accent)}
.extract{background:var(--panel2);border-left:3px solid var(--accent);border-radius:8px;padding:14px 15px;margin:14px 0;font-size:16px;line-height:1.6}
details.extract{white-space:normal}
details.extract>summary{list-style:none;cursor:pointer;font-size:13px;letter-spacing:.6px;text-transform:uppercase;
color:var(--dim);font-weight:650;min-height:26px;display:flex;align-items:center;flex-wrap:wrap;gap:2px}
details.extract>summary::-webkit-details-marker{display:none}
details.extract>summary::after{content:'  show';margin-left:auto;color:var(--accent);text-transform:none;letter-spacing:0;font-size:14px}
details.extract[open]>summary::after{content:'  hide'}
details.extract>div{white-space:pre-wrap;margin-top:10px}
.teach{background:linear-gradient(180deg,rgba(74,158,255,.07),transparent);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:12px 0}
.teach p{margin:0 0 10px}
.eg{background:var(--panel2);border-radius:10px;padding:14px;margin-top:12px}
.eg .lb{font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--dim);font-weight:650;margin-bottom:8px}
.eg ol{margin:8px 0 0;padding-left:20px}.eg li{margin:5px 0}
.kf{border-left:3px solid var(--warn);background:rgba(240,180,41,.07);border-radius:8px;padding:12px 14px;margin-top:14px;font-size:15.5px}
.q{font-size:18.5px;line-height:1.5;margin:14px 0 4px;white-space:pre-wrap}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;min-height:52px;padding:13px 15px;
background:var(--panel2);border:1.5px solid transparent;border-radius:12px;line-height:1.45}
.opt .k{width:26px;height:26px;flex:0 0 26px;border-radius:7px;background:rgba(255,255,255,.06);display:flex;
align-items:center;justify-content:center;font-size:13px;font-weight:650;color:var(--dim);margin-top:1px}
.opt.sel{border-color:var(--accent);background:rgba(74,158,255,.1)}
.opt.sel .k{background:var(--accent);color:#06121f}
.opt.ok{border-color:var(--good);background:rgba(62,207,142,.12)}
.opt.ok .k{background:var(--good);color:#06121f}
.opt.no{border-color:var(--bad);background:rgba(255,107,107,.1)}
.opt.no .k{background:var(--bad);color:#1a0505}
.opt[disabled]{opacity:.85}
input[type=text]{width:100%;min-height:54px;padding:14px 15px;font-size:17px;background:var(--panel2);
border:1.5px solid var(--line);border-radius:12px;color:var(--ink);margin-top:14px;-webkit-appearance:none}
input[type=text]:focus{outline:0;border-color:var(--accent)}
input.ok{border-color:var(--good)}input.no{border-color:var(--bad)}
textarea{width:100%;min-height:200px;padding:14px 15px;font-size:17px;line-height:1.6;background:var(--panel2);
border:1.5px solid var(--line);border-radius:12px;color:var(--ink);margin-top:12px;resize:vertical;-webkit-appearance:none;font-family:inherit}
textarea:focus{outline:0;border-color:var(--accent)}
select{width:100%;min-height:50px;padding:12px 14px;font-size:16px;background:var(--panel2);border:1.5px solid var(--line);
border-radius:12px;color:var(--ink);margin-top:10px;-webkit-appearance:none}
.qmeta{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13.5px;color:var(--faint)}
.fb{border-radius:11px;padding:14px 15px;margin-top:14px;font-size:15.5px;line-height:1.55;white-space:pre-wrap}
.fb.ok{background:rgba(62,207,142,.1);border:1px solid rgba(62,207,142,.3)}
.fb.no{background:rgba(255,107,107,.09);border:1px solid rgba(255,107,107,.3)}
.fb b{display:block;margin-bottom:6px;font-size:15px}
.hint{background:rgba(240,180,41,.08);border:1px solid rgba(240,180,41,.28);border-radius:11px;padding:13px 15px;margin-top:12px;font-size:15.5px;line-height:1.5}
.band{text-align:center;padding:26px 18px}
.band .big{font-size:46px;font-weight:700;letter-spacing:-1.5px;line-height:1}
.band .lbl{color:var(--dim);margin-top:8px;font-size:15px}
.rev{border-top:1px solid var(--line);padding:15px 0}.rev:first-of-type{border-top:0}
.rev .qt{font-size:16px;margin-bottom:9px;white-space:pre-wrap}
.rev .ans{font-size:15px;margin:5px 0}.ok{color:var(--good)}.no{color:var(--bad)}
.exp{background:var(--panel2);border-radius:9px;padding:12px 13px;margin-top:9px;font-size:15px;line-height:1.55;color:var(--dim);white-space:pre-wrap}
.topics{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.tp{padding:5px 11px;border-radius:99px;font-size:13px;background:var(--panel2);color:var(--dim)}
.tp.ok{background:rgba(62,207,142,.12);color:var(--good)}
.tp.no{background:rgba(255,107,107,.12);color:var(--bad)}
pre.sum{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px;
font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;max-height:320px;overflow:auto;color:var(--dim);margin-top:12px}
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:15px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}
th{color:var(--dim);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.5px}
ul,ol{padding-left:20px;margin:10px 0}li{margin:6px 0}
.hr{height:1px;background:var(--line);margin:18px 0;border:0}
.nb{background:rgba(240,180,41,.08);border:1px solid rgba(240,180,41,.25);border-radius:11px;padding:13px 15px;margin:12px 0;font-size:15px;line-height:1.55}
.nb b{color:var(--warn)}
.shots{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.shots img{width:76px;height:76px;object-fit:cover;border-radius:9px;border:1px solid var(--line)}
.syncdot{width:9px;height:9px;border-radius:99px;background:var(--faint);flex:0 0 9px}
.syncdot.on{background:var(--good)}.syncdot.err{background:var(--bad)}.syncdot.busy{background:var(--warn)}
label.file{display:block;width:100%;min-height:52px;padding:14px 16px;background:transparent;border:1px dashed var(--line);
border-radius:12px;font-weight:550;text-align:center;margin-top:12px;color:var(--dim)}
input[type=file]{display:none}
</style></head>
<body>
<header><div class="hd">
  <button id="back" class="pill" style="display:none">Back</button>
  <div class="t"><div id="htitle">Week 2</div><div class="bar"><i id="hbar" style="width:0%"></i></div></div>
  <span class="syncdot" id="sdot" title="sync"></span>
</div></header>
<div class="wrap" id="app"></div>
<script>
let P = {"sessions": {"m14-working-backwards": {"id": "m14-working-backwards", "day": "Day 1", "subject": "Maths", "title": "Working backwards", "minutes": 30, "objective": "Get from an answer back to the number you started with by undoing each step in the opposite order, then check it by running the rule forwards.", "extract": null, "teach": {"intro": ["A rule takes you from a starting number to an answer. Here is one. Take a number, double it, then add 3. Put 5 in and you get 5 x 2 = 10, then 10 + 3 = 13.", "Working backwards means running that same rule in reverse. Start at the answer and undo each step in the opposite order. 13 - 3 = 10, then 10 divided by 2 = 5, which is exactly what went in. Subtract undoes add, and divide undoes multiply.", "Almost every question you lost last week was this one move wearing a different coat. A triangle with the height missing, a ratio with the total missing, a division with the answer bigger than you expected. They are not four topics. They are one move.", "The usual mistake is doing the forward step AGAIN instead of undoing it. That is what turns an area of 24 into 96 instead of 6. One check catches it every time. Put your answer back into the forward rule and see if you land on the number you were given."], "example": {"problem": "A machine doubles a number and then adds 3. It puts out 13. What number went in?", "steps": ["Write the forward rule as two steps in order. Step 1, multiply by 2. Step 2, add 3.", "Going backwards, you undo them in the opposite order, so start with the LAST step. The last step was add 3, and the undo of add 3 is subtract 3. That gives 13 - 3 = 10.", "Now undo the first step. It was multiply by 2, and the undo of multiply by 2 is divide by 2. That gives 10 divided by 2 = 5.", "The number that went in was 5.", "Check it forwards. 5 x 2 = 10, then 10 + 3 = 13. That is what the machine put out, so 5 is right."], "answer": "5"}, "example2": {"problem": "Two questions that look nothing alike. First, a triangle has an area of 24 cm^2 and a base of 8 cm, find its perpendicular height. Second, two people share money in the ratio 2:3 and the smaller share is 18 pounds, find the total.", "steps": ["Start with the triangle. The forward rule is area = base x height, then divide by 2. With a base of 8 that means: take the height, multiply by 8, then halve it. Multiplying by 8 and halving is the same as multiplying by 4.", "So forwards it is height x 4 = area. You have been given the area, 24, and you want the height, so you run it backwards. The undo of multiply by 4 is divide by 4. That gives 24 divided by 4 = 6, so the height is 6 cm.", "This is exactly where 96 comes from. 24 x 4 = 96 is the FORWARD move done a second time, on a number that was already the answer. Going forwards twice walks you further away from the start, not back to it. The reverse of multiply by 4 is divide by 4.", "Check both forwards. Height 6: 8 x 6 = 48, and 48 divided by 2 = 24 cm^2, which matches. Height 96: 8 x 96 = 768, and 768 divided by 2 = 384 cm^2, which is nowhere near 24.", "Now the ratio. 2:3 means 5 equal parts in total, 2 parts for one person and 3 for the other. Forwards, starting from the total, you would divide by 5 to find one part, then multiply by 2 to get the smaller share.", "You have been given the smaller share, 18, so run those two steps in reverse and in the opposite order. Undo the multiply by 2: 18 divided by 2 = 9, so one part is 9 pounds. Undo the divide by 5: 9 x 5 = 45. The total is 45 pounds.", "Check it forwards. 45 divided by 5 = 9, and 2 x 9 = 18 pounds, which is the share you were given. The two shares are 18 and 27, and 18 + 27 = 45.", "Same move both times. Undo each step, in the opposite order, then check forwards. The triangle and the ratio only looked different."], "answer": "The height is 6 cm, and the total is 45 pounds"}, "keyfact": "To work backwards, undo each step in the opposite order. Divide undoes multiply, multiply undoes divide. Then put your answer into the forward rule and check you get back to the number you were given."}, "questions": [{"id": "m14-working-backwards:q1", "level": "easy", "type": "mc", "q": "A machine adds 5 to any number you put in. It puts out 12. Which move takes you back to the number that went in?", "options": ["Subtract 5", "Add 5", "Multiply by 5", "Divide by 5"], "answer": "Subtract 5", "hint": "The machine added. What is the opposite of adding?", "explain": "The answer is subtract 5. Adding and subtracting are opposites, so to undo an add 5 you take 5 away. 12 - 5 = 7, and checking forwards, 7 + 5 = 12. Adding 5 again would give 17, which is going forwards a second time instead of back.", "topic": "working backwards: undoing an add"}, {"id": "m14-working-backwards:q2", "level": "easy", "type": "mc", "q": "Which move undoes multiplying by 3?", "options": ["Dividing by 3", "Multiplying by 3 again", "Adding 3", "Subtracting 3"], "answer": "Dividing by 3", "hint": "4 x 3 = 12. What do you do to 12 to get back to 4?", "explain": "The answer is dividing by 3. Multiply and divide are opposites. 4 x 3 = 12, and 12 divided by 3 takes you straight back to 4. Multiplying by 3 again would give 36, which is further away, not back.", "topic": "working backwards: divide undoes multiply"}, {"id": "m14-working-backwards:q3", "level": "easy", "type": "text", "q": "A machine multiplies any number you put in by 4. It puts out 20. What number went in?", "answer": "5", "accept": ["5", "5.0", "20/4"], "hint": "Undo the multiply. Divide the answer by 4.", "explain": "The answer is 5. The machine multiplied by 4, so to go back you divide by 4. 20 divided by 4 = 5. Check it forwards: 5 x 4 = 20, which is what came out.", "topic": "working backwards: undoing a multiply"}, {"id": "m14-working-backwards:q4", "level": "easy", "type": "text", "q": "A machine divides any number you put in by 3. It puts out 7. What number went in?", "answer": "21", "accept": ["21", "21.0"], "hint": "The machine divided, so you multiply to get back.", "explain": "The answer is 21. The machine divided by 3, and the undo of divide is multiply, so 7 x 3 = 21. Check it forwards: 21 divided by 3 = 7. Notice the number that went in is BIGGER than the number that came out, which is what happens when the machine divides.", "topic": "working backwards: multiply undoes divide"}, {"id": "m14-working-backwards:q5", "level": "easy", "type": "mc", "q": "A number is doubled and the answer is 18. Someone says the number that went in was 36, because 18 x 2 = 36. What have they done wrong?", "options": ["They doubled again, which is the forward move done twice, instead of halving to go back", "They should have added 2 instead", "They should have doubled 36 as well", "Nothing, 36 is correct"], "answer": "They doubled again, which is the forward move done twice, instead of halving to go back", "hint": "Doubling is what the rule already did. What is the opposite of doubling?", "explain": "The answer is that they did the forward move twice. The rule doubled, so going back means halving: 18 divided by 2 = 9. Check it forwards: 9 x 2 = 18, correct. Their 36 fails the same check, because 36 x 2 = 72, not 18. This is the single most common backwards mistake, so run the forward check every time.", "topic": "working backwards: forward move done twice"}, {"id": "m14-working-backwards:q6", "level": "easy", "type": "text", "q": "A machine doubles a number and then adds 3. It puts out 13. What number went in?", "answer": "5", "accept": ["5", "5.0"], "hint": "Undo the last step first. Take away the 3, then halve what is left.", "explain": "The answer is 5. Undo the last step first: 13 - 3 = 10. Then undo the first step: 10 divided by 2 = 5. Check it forwards: 5 x 2 = 10, and 10 + 3 = 13. The order matters. Halving 13 first would give 6.5, which is not what went in.", "topic": "working backwards: two step machine"}, {"id": "m14-working-backwards:q7", "level": "medium", "type": "text", "q": "A machine multiplies a number by 3 and then subtracts 4. It puts out 17. What number went in?", "answer": "7", "accept": ["7", "7.0", "21/3"], "hint": "The last thing it did was subtract 4, so the first thing you undo is that.", "explain": "The answer is 7. Undo the last step first. It subtracted 4, so you add 4: 17 + 4 = 21. Then undo the multiply by 3: 21 divided by 3 = 7. Check it forwards: 7 x 3 = 21, and 21 - 4 = 17, which is what came out.", "topic": "working backwards: two step machine with a subtraction"}, {"id": "m14-working-backwards:q8", "level": "medium", "type": "text", "q": "A triangle has an area of 24 cm^2 and a base of 8 cm. What is its perpendicular height, in cm?", "answer": "6", "accept": ["6", "6.0", "6cm", "6 cm"], "hint": "Forwards the rule is base x height divided by 2. Undo the divide by 2 first, then undo the multiply by the base.", "explain": "The answer is 6 cm. Forwards the rule is base x height divided by 2. Undo the halving first: 24 x 2 = 48, which is base x height. Then undo the multiply by the base: 48 divided by 8 = 6 cm. Check it forwards: 8 x 6 = 48, and 48 divided by 2 = 24 cm^2, which matches the area you were given. Writing 24 x 4 = 96 is the forward move done again, and 96 fails the check because it would give an area of 384 cm^2.", "topic": "area: working backwards to find a height"}, {"id": "m14-working-backwards:q9", "level": "medium", "type": "mc", "q": "For that same triangle, area 24 cm^2 and base 8 cm, someone answers that the height is 96 cm. Which check shows fastest that it is wrong?", "options": ["Put 96 back in forwards: 8 x 96 divided by 2 = 384 cm^2, not 24 cm^2", "96 is an even number, and heights are always odd", "You cannot find a height when you are only given an area", "The height always has to be exactly half of the base"], "answer": "Put 96 back in forwards: 8 x 96 divided by 2 = 384 cm^2, not 24 cm^2", "hint": "Run the answer through the forward rule and see whether you land back on 24.", "explain": "The answer is the first option. The forward check is the one thing that never lies. A height of 96 with a base of 8 gives 8 x 96 = 768, then 768 divided by 2 = 384 cm^2. That is not the 24 cm^2 you were given, so 96 is wrong. The true height is 6, because 8 x 6 divided by 2 = 24. The other options are not maths, they are guesses about what looks right.", "topic": "area: checking a backwards answer forwards"}, {"id": "m14-working-backwards:q10", "level": "medium", "type": "text", "q": "Two people share money in the ratio 2:3. The smaller share is 18 pounds. What is the total amount of money, in pounds?", "answer": "45", "accept": ["45", "45.0", "45 pounds", "£45"], "hint": "The smaller share is 2 parts. Find what one part is worth first.", "explain": "The answer is 45 pounds. The smaller share is 2 parts and it is worth 18 pounds, so one part is 18 divided by 2 = 9 pounds. There are 2 + 3 = 5 parts altogether, so the total is 5 x 9 = 45 pounds. Check it forwards: 45 divided by 5 = 9, and 2 x 9 = 18, which is the share you were given. The shares are 18 and 27, and they add to 45.", "topic": "ratio: working back to the total from the smaller share"}, {"id": "m14-working-backwards:q11", "level": "medium", "type": "text", "q": "Two farmers share a crop in the ratio 3:5. The larger share is 40 tonnes. What is the total crop, in tonnes?", "answer": "64", "accept": ["64", "64.0", "64 tonnes"], "hint": "The larger share is 5 parts. Divide to find one part, then multiply by the total number of parts.", "explain": "The answer is 64 tonnes. The larger share is 5 parts and it is 40 tonnes, so one part is 40 divided by 5 = 8 tonnes. There are 3 + 5 = 8 parts in total, so the crop is 8 x 8 = 64 tonnes. Check it forwards: 64 divided by 8 = 8 per part, so the shares are 24 and 40, and 24 + 40 = 64.", "topic": "ratio: working back to the total from the larger share"}, {"id": "m14-working-backwards:q12", "level": "medium", "type": "text", "q": "A number is divided by 4 and then 6 is added. The answer is 15. What was the number?", "answer": "36", "accept": ["36", "36.0"], "hint": "Undo the add first, then undo the divide. Divide is undone by multiply.", "explain": "The answer is 36. Undo the last step first: 15 - 6 = 9. Then undo the divide by 4 by multiplying: 9 x 4 = 36. Check it forwards: 36 divided by 4 = 9, and 9 + 6 = 15, which matches.", "topic": "working backwards: undoing a divide then an add"}, {"id": "m14-working-backwards:q13", "level": "stretch", "type": "text", "q": "A triangular sail has an area of 30 cm^2 and a perpendicular height of 5 cm. What is the length of its base, in cm?", "answer": "12", "accept": ["12", "12.0", "12cm", "12 cm"], "hint": "Double the area to undo the halving, then divide by the height.", "explain": "The answer is 12 cm. Undo the halving first: 30 x 2 = 60, which is base x height. Then undo the multiply by the height: 60 divided by 5 = 12 cm. Check it forwards: 12 x 5 = 60, and 60 divided by 2 = 30 cm^2. Same move as finding a height, just with the other length missing.", "topic": "area: working backwards to find a base"}, {"id": "m14-working-backwards:q14", "level": "stretch", "type": "text", "q": "Two brothers share a bag of coins in the ratio 4:7. The larger share has 18 more coins than the smaller share. How many coins are in the bag altogether?", "answer": "66", "accept": ["66", "66.0", "66 coins"], "hint": "The difference between the shares is 7 parts minus 4 parts. What is that worth?", "explain": "The answer is 66 coins. The difference between the shares is 7 - 4 = 3 parts, and that difference is 18 coins, so one part is 18 divided by 3 = 6 coins. The bag is 4 + 7 = 11 parts, so 11 x 6 = 66 coins. Check it forwards: the shares are 4 x 6 = 24 and 7 x 6 = 42. The difference is 42 - 24 = 18, and the total is 24 + 42 = 66.", "topic": "ratio: working back to the total from the difference"}, {"id": "m14-working-backwards:q15", "level": "stretch", "type": "mc", "q": "A rule says: multiply by 5, then subtract 2. Which of these is the correct way to run that rule backwards?", "options": ["Add 2, then divide by 5", "Divide by 5, then add 2", "Multiply by 5, then add 2", "Subtract 2, then divide by 5"], "answer": "Add 2, then divide by 5", "hint": "Undo the LAST forward step first. The last forward step was subtract 2.", "explain": "The answer is add 2, then divide by 5. Going backwards you reverse each step and you also reverse the order, so the last thing done forwards is the first thing undone. Test it. Put 4 in: 4 x 5 = 20, then 20 - 2 = 18. Now run 18 backwards the right way: 18 + 2 = 20, then 20 divided by 5 = 4, which is what went in. Doing it in the wrong order, 18 divided by 5 = 3.6, then 3.6 + 2 = 5.6, which is not 4.", "topic": "working backwards: reversing the order of steps"}, {"id": "m14-working-backwards:q16", "level": "stretch", "type": "long", "marks": 4, "q": "A machine multiplies a number by 3 and then adds 7. It puts out 31. Explain how to find the number that went in, and explain how you can prove your answer is right without asking anyone.", "answer": "The machine does two steps forwards: multiply by 3, then add 7. To go backwards I undo both steps, and I undo them in the opposite order, so the last step forwards is the first one I undo. The last step was add 7, so I subtract 7: 31 - 7 = 24. The first step was multiply by 3, so I divide by 3: 24 divided by 3 = 8. The number that went in was 8. I can prove it without asking anyone by running my answer through the forward rule. 8 x 3 = 24, and 24 + 7 = 31, which is exactly what the machine put out, so 8 must be right.", "hint": "Say what the forward steps are, undo them in the opposite order, then run your answer forwards to test it.", "explain": "A full answer has four parts, one mark each. One, you name the two forward steps, multiply by 3 and add 7. Two, you say that going backwards means undoing them in the OPPOSITE order, so the add 7 is undone first. Three, you show the working: 31 - 7 = 24, then 24 divided by 3 = 8. Four, you check forwards: 8 x 3 = 24, and 24 + 7 = 31, which matches what came out. If you only wrote 8 with no working, that is one mark. The forward check is the part most people leave out, and it is the part that catches the mistake of going forwards twice.", "topic": "working backwards: explaining the method and the check"}]}, "m15-inverse-ratio-area": {"id": "m15-inverse-ratio-area", "day": "Day 2", "subject": "Maths", "title": "Ratio and area, both directions", "minutes": 25, "objective": "Spot whether a ratio or triangle question is asking you to go forwards or backwards, and do either one.", "extract": null, "teach": {"intro": ["Ratio and triangle area questions come in two directions, and they look almost the same on the page. Forwards, you are given the total and asked for a share. Backwards, you are given a share and asked for the total.", "Triangles work the same way. Forwards you are given the base and the height and asked for the area. Backwards you are given the area and one length, and asked for the other length.", "Here is how to tell them apart in five seconds. Underline what you are GIVEN and circle what you are ASKED for. If the thing you are given is the thing the forward rule normally produces, which is the area, or a share, then you are going backwards.", "Backwards means undo, in the opposite order, and then check by running your answer forwards."], "example": {"problem": "Two questions on the same ratio. First, share 40 pounds in the ratio 3:5. Second, two people share money in the ratio 3:5 and the person with 3 parts gets 15 pounds, find the total.", "steps": ["First question, forwards. Add the parts: 3 + 5 = 8 equal parts.", "Divide the total by the number of parts: 40 divided by 8 = 5 pounds for one part.", "Multiply back: 3 x 5 = 15 pounds and 5 x 5 = 25 pounds. Check: 15 + 25 = 40, correct.", "Second question, backwards. You are given a share, 15 pounds, not the total, so the forward route is blocked.", "The 15 pounds is 3 parts, so undo the multiply by 3: 15 divided by 3 = 5 pounds for one part.", "Now undo the divide: there are 8 parts, so the total is 8 x 5 = 40 pounds.", "Check it forwards: 40 divided by 8 = 5, and 3 x 5 = 15, which is the share you were given."], "answer": "The shares are 15 pounds and 25 pounds, and the total is 40 pounds"}, "example2": {"problem": "Two questions on the same triangle. First, a triangle has a base of 12 cm and a perpendicular height of 5 cm, find its area. Second, a triangle has an area of 30 cm^2 and a base of 12 cm, find its perpendicular height.", "steps": ["First question, forwards. Multiply base by height: 12 x 5 = 60.", "Halve it: 60 divided by 2 = 30. The area is 30 cm^2.", "Second question, backwards. You are given the area, which is what the forward rule produces, so you undo it.", "Undo the halving first: 30 x 2 = 60. That number, 60, is base x height.", "Undo the multiply by the base: 60 divided by 12 = 5. The height is 5 cm.", "Check it forwards: 12 x 5 = 60, and 60 divided by 2 = 30 cm^2, which matches. Doing 30 x 6 = 180 instead would be going forwards again, and 180 as a height would give an area of 1080 cm^2."], "answer": "The area is 30 cm^2, and the height is 5 cm"}, "keyfact": "If you are given the area or a share, you are going backwards. Undo the steps in the opposite order, then check by running your answer forwards."}, "questions": [{"id": "m15-inverse-ratio-area:q1", "level": "easy", "type": "mc", "q": "You share an amount in the ratio 1:3. How many equal parts is that altogether?", "options": ["4", "3", "2", "20"], "answer": "4", "hint": "Add the two numbers in the ratio.", "explain": "The answer is 4. The ratio 1:3 means one person gets 1 part and the other gets 3 parts, so there are 1 + 3 = 4 equal parts in total. Finding the number of parts is always the first step, in both directions.", "topic": "ratio: total number of parts"}, {"id": "m15-inverse-ratio-area:q2", "level": "easy", "type": "text", "q": "Share 20 sweets in the ratio 1:3. How many sweets are in the LARGER share?", "answer": "15", "accept": ["15", "15.0", "15 sweets"], "hint": "There are 4 parts. Find one part first, then take 3 of them.", "explain": "The answer is 15 sweets. There are 1 + 3 = 4 parts. One part is 20 divided by 4 = 5 sweets. The larger share is 3 parts, so 3 x 5 = 15. Check: the shares are 5 and 15, and 5 + 15 = 20.", "topic": "ratio: forwards, sharing a total"}, {"id": "m15-inverse-ratio-area:q3", "level": "easy", "type": "text", "q": "Two brothers share money in the ratio 1:3. The smaller share is 5 pounds. What is the TOTAL amount of money, in pounds?", "answer": "20", "accept": ["20", "20.0", "20 pounds", "£20"], "hint": "The smaller share is 1 part, so you already know what one part is worth. How many parts is the total?", "explain": "The answer is 20 pounds. The smaller share is 1 part, so one part is 5 pounds. The total is 1 + 3 = 4 parts, so 4 x 5 = 20 pounds. Check it forwards: 20 divided by 4 = 5, which is the smaller share you were given. Notice this is the same ratio as the last question, run in the other direction.", "topic": "ratio: backwards, total from a share"}, {"id": "m15-inverse-ratio-area:q4", "level": "easy", "type": "text", "q": "A triangle has a base of 10 cm and a perpendicular height of 6 cm. What is its area, in cm^2?", "answer": "30", "accept": ["30", "30.0", "30cm^2", "30 cm^2", "30cm2", "30 cm2"], "hint": "Multiply base by height, then halve it.", "explain": "The answer is 30 cm^2. Multiply base by height: 10 x 6 = 60. Halve it: 60 divided by 2 = 30 cm^2. Area is measured in square units, so write cm^2 and not cm.", "topic": "area: forwards, area from base and height"}, {"id": "m15-inverse-ratio-area:q5", "level": "easy", "type": "text", "q": "A triangle has an area of 30 cm^2 and a base of 10 cm. What is its perpendicular height, in cm?", "answer": "6", "accept": ["6", "6.0", "6cm", "6 cm"], "hint": "Undo the halving first: double the area. Then divide by the base.", "explain": "The answer is 6 cm. Undo the halving: 30 x 2 = 60, which is base x height. Then divide by the base: 60 divided by 10 = 6 cm. Check it forwards: 10 x 6 = 60, and 60 divided by 2 = 30 cm^2. This is the last question run in reverse, with the same three numbers.", "topic": "area: backwards, height from area and base"}, {"id": "m15-inverse-ratio-area:q6", "level": "easy", "type": "mc", "q": "A question gives you the area of a triangle and its base, and asks for the height. Are you working forwards or backwards, and why?", "options": ["Backwards, because the area is what the forward rule produces, so you have been given the finished answer", "Forwards, because area questions are always forwards", "Backwards, because the height is always smaller than the base", "Forwards, because you were given two numbers"], "answer": "Backwards, because the area is what the forward rule produces, so you have been given the finished answer", "hint": "Which of the three numbers does the rule normally give you at the end?", "explain": "The answer is backwards. The forward rule takes a base and a height and produces an area. Here the area is handed to you and a length is missing, so you are starting at the finish line and walking back. That means undoing: double the area, then divide by the base. Being given two numbers tells you nothing on its own, since both directions give you two numbers.", "topic": "area: spotting which direction a question runs"}, {"id": "m15-inverse-ratio-area:q7", "level": "medium", "type": "text", "q": "Share 56 sweets in the ratio 3:4. How many sweets does the person with the larger share get?", "answer": "32", "accept": ["32", "32.0", "32 sweets"], "hint": "Add the parts, divide 56 by that, then multiply by 4.", "explain": "The answer is 32 sweets. There are 3 + 4 = 7 parts. One part is 56 divided by 7 = 8 sweets. The larger share is 4 parts, so 4 x 8 = 32. Check: the shares are 24 and 32, and 24 + 32 = 56.", "topic": "ratio: forwards, sharing a total"}, {"id": "m15-inverse-ratio-area:q8", "level": "medium", "type": "text", "q": "Two climbers share the weight of their kit in the ratio 2:5. The lighter load is 14 kg. What is the total weight of the kit, in kg?", "answer": "49", "accept": ["49", "49.0", "49kg", "49 kg"], "hint": "14 kg is 2 parts. Find one part, then multiply by the total number of parts.", "explain": "The answer is 49 kg. The lighter load is 2 parts and weighs 14 kg, so one part is 14 divided by 2 = 7 kg. The total is 2 + 5 = 7 parts, so 7 x 7 = 49 kg. Check it forwards: 49 divided by 7 = 7 per part, giving loads of 14 kg and 35 kg, and 14 + 35 = 49.", "topic": "ratio: backwards, total from a share"}, {"id": "m15-inverse-ratio-area:q9", "level": "medium", "type": "text", "q": "A triangular field has an area of 45 m^2 and a base of 15 m. What is its perpendicular height, in m?", "answer": "6", "accept": ["6", "6.0", "6m", "6 m"], "hint": "Double the area first, then divide by the base.", "explain": "The answer is 6 m. Undo the halving: 45 x 2 = 90, which is base x height. Divide by the base: 90 divided by 15 = 6 m. Check it forwards: 15 x 6 = 90, and 90 divided by 2 = 45 m^2.", "topic": "area: backwards, height from area and base"}, {"id": "m15-inverse-ratio-area:q10", "level": "medium", "type": "text", "q": "A triangle has a base of 9 cm, a perpendicular height of 4 cm and a slanted side of 5 cm. What is its area, in cm^2?", "answer": "18", "accept": ["18", "18.0", "18cm^2", "18 cm^2", "18cm2", "18 cm2"], "hint": "Only two of those three numbers belong in the rule. The height is the one that meets the base at 90 degrees.", "explain": "The answer is 18 cm^2. Use the base and the PERPENDICULAR height only: 9 x 4 = 36, and 36 divided by 2 = 18 cm^2. The 5 cm slanted side is not used at all. Using it by mistake would give 9 x 5 divided by 2 = 22.5 cm^2, which is too big, because a slanted side is always longer than the true height.", "topic": "area: forwards, ignoring the slanted side"}, {"id": "m15-inverse-ratio-area:q11", "level": "medium", "type": "text", "q": "Two people share a bag of nuts in the ratio 3:4. The person with the larger share gets 8 more nuts than the other. How many nuts were in the bag?", "answer": "56", "accept": ["56", "56.0", "56 nuts"], "hint": "The difference between the shares is 4 parts minus 3 parts. What is one part worth?", "explain": "The answer is 56 nuts. The difference between the shares is 4 - 3 = 1 part, and that difference is 8 nuts, so one part is 8 nuts. The bag is 3 + 4 = 7 parts, so 7 x 8 = 56 nuts. Check it forwards: the shares are 24 and 32, the difference is 32 - 24 = 8, and 24 + 32 = 56. The trap is answering 7, which is just the number of parts, not an amount of nuts.", "topic": "ratio: backwards, total from the difference"}, {"id": "m15-inverse-ratio-area:q12", "level": "stretch", "type": "text", "q": "A triangle has an area of 36 cm^2 and a base of 8 cm. A second triangle has the SAME perpendicular height but a base of 12 cm. What is the area of the second triangle, in cm^2?", "answer": "54", "accept": ["54", "54.0", "54cm^2", "54 cm^2", "54cm2", "54 cm2"], "hint": "Work backwards to find the height of the first triangle, then go forwards with the new base.", "explain": "The answer is 54 cm^2. Step 1, backwards: 36 x 2 = 72, and 72 divided by 8 = 9, so the height is 9 cm. Step 2, forwards with the new base: 12 x 9 = 108, and 108 divided by 2 = 54 cm^2. One question, both directions. You can also see it as a check: the base grew from 8 to 12, which is 1.5 times bigger, and 36 x 1.5 = 54.", "topic": "area: backwards then forwards in one question"}, {"id": "m15-inverse-ratio-area:q13", "level": "stretch", "type": "text", "q": "A triangular flag has an area of 84 cm^2 and a base of 24 cm. A second flag is a triangle with the same perpendicular height and an area of 42 cm^2. What is the base of the second flag, in cm?", "answer": "12", "accept": ["12", "12.0", "12cm", "12 cm"], "hint": "Find the shared height from the first flag, then work backwards again on the second.", "explain": "The answer is 12 cm. Step 1: 84 x 2 = 168, and 168 divided by 24 = 7, so the height is 7 cm. Step 2: for the second flag, 42 x 2 = 84, and 84 divided by 7 = 12 cm. Check it forwards: 12 x 7 = 84, and 84 divided by 2 = 42 cm^2. There is a faster route too. The second area is half the first, and the height is the same, so the base must be half of 24.", "topic": "area: two backwards steps with a shared height"}, {"id": "m15-inverse-ratio-area:q14", "level": "stretch", "type": "long", "marks": 5, "q": "Here are two questions. A: share 60 pounds in the ratio 2:3. B: two people share money in the ratio 2:3, and the smaller share is 60 pounds. Work out the total in each case, and explain why the same number, 60, gives two different totals.", "answer": "In question A the 60 pounds is the total, so I go forwards. There are 2 + 3 = 5 parts, so one part is 60 divided by 5 = 12 pounds. The shares are 2 x 12 = 24 pounds and 3 x 12 = 36 pounds, and the total is 60 pounds, which is what I started with. In question B the 60 pounds is not the total, it is the smaller share, which is 2 parts. So I go backwards. One part is 60 divided by 2 = 30 pounds, and the total is 5 x 30 = 150 pounds. The answers are different because the 60 is doing a different job in each question. In A it is the whole amount being split up, and in B it is only 2 of the 5 parts, so the whole amount has to be much bigger. I can check B forwards: 150 divided by 5 = 30, and 2 x 30 = 60, which is the share I was given.", "hint": "In each question, ask what the 60 actually is. Is it the whole amount, or is it one of the shares?", "explain": "A full answer has five parts, one mark each. One, in A the 60 is the total, so you divide it by 5 parts to get 12 per part. Two, in A you give the shares 24 and 36, adding to 60. Three, in B you say the 60 is 2 parts, not the total. Four, in B you show 60 divided by 2 = 30 per part and 5 x 30 = 150. Five, you explain the difference: the same number is playing a different role, a whole in A and a piece in B, so working backwards has to give a bigger total. An answer that only works out A, or that gives 60 as the answer to B, misses the point of the question.", "topic": "ratio: comparing a forwards and a backwards question"}]}, "m16-place-value-measure": {"id": "m16-place-value-measure", "day": "Day 2", "subject": "Maths", "title": "Metres, kilometres and the decimal point", "minutes": 20, "objective": "Convert between km, m, cm and mm in both directions, moving the digits the right number of places every time.", "extract": null, "teach": {"intro": ["Three facts do all the work here. 1 km = 1000 m. 1 m = 100 cm. 1 cm = 10 mm. Learn those and the rest is just deciding which way to go.", "Going from a big unit to a small one, you multiply, so the NUMBER gets bigger. 3 km is 3 x 1000 = 3000 m, because metres are small so it takes a lot of them. Going the other way, from small to big, you divide.", "Now the trap. 1000 has three zeros, so between km and m the digits move THREE places, not two. 3.75 km becomes 3750 m. Writing 375 m only moves the digits two places, which makes the distance ten times too short.", "Use a real world check. One kilometre is about a twelve minute walk. 375 m is barely three minutes, so it could never be the same as 3.75 km, which is nearly three quarters of an hour of walking."], "example": {"problem": "Change 3.75 km into metres.", "steps": ["Decide the direction. You are going from km, a big unit, to m, a small unit, so you multiply and the number must get bigger.", "Use the fact: 1 km = 1000 m, so multiply by 1000.", "Multiplying by 1000 moves every digit three places to the left. 3.75 becomes 37.5 after one place, 375 after two places, and 3750 after three places.", "The answer is 3750 m.", "Check it backwards. 3750 divided by 1000 = 3.75 km, which is what you started with.", "See where 375 m comes from. That is only two places, and it is 375 divided by 1000 = 0.375 km, which is ten times too short."], "answer": "3750 m"}, "example2": {"problem": "On a map, 2 cm represents 1 km in real life. A path measures 7.5 cm on the map. How long is the path in metres?", "steps": ["This is two jobs, so do them one at a time. First get the real distance in km, then change the units.", "Every 2 cm on the map is 1 km, so divide the map distance by 2: 7.5 divided by 2 = 3.75 km.", "Estimate to check that. 8 cm would be 4 km, and 7.5 cm is a bit less than 8 cm, so a bit under 4 km is right.", "Now change km into m. Multiply by 1000: 3.75 x 1000 = 3750 m.", "The answer is 3750 m.", "Check backwards. 3750 m is 3.75 km, and 3.75 x 2 = 7.5 cm on the map, which is what was measured."], "answer": "3750 m"}, "keyfact": "1 km = 1000 m, so the digits move three places, not two. Big unit to small unit, multiply and the number gets bigger."}, "questions": [{"id": "m16-place-value-measure:q1", "level": "easy", "type": "mc", "q": "How many metres are there in 1 kilometre?", "options": ["1000", "100", "10", "10000"], "answer": "1000", "hint": "The word kilo means a thousand.", "explain": "The answer is 1000. Kilo means a thousand, so a kilometre is a thousand metres. This is the fact behind every km to m conversion, and because 1000 has three zeros, the digits always move three places.", "topic": "measurement: metres in a kilometre"}, {"id": "m16-place-value-measure:q2", "level": "easy", "type": "mc", "q": "How many centimetres are there in 1 metre?", "options": ["100", "10", "1000", "12"], "answer": "100", "hint": "Think of a metre ruler. How many centimetre marks are on it?", "explain": "The answer is 100. A metre ruler has 100 centimetre marks along it. 100 has two zeros, so between m and cm the digits move two places, not three.", "topic": "measurement: centimetres in a metre"}, {"id": "m16-place-value-measure:q3", "level": "easy", "type": "text", "q": "Change 2 km into metres.", "answer": "2000", "accept": ["2000", "2000m", "2000 m", "2000.0", "2,000"], "hint": "Multiply by 1000, because you are going from a big unit to a small one.", "explain": "The answer is 2000 m. 1 km = 1000 m, so 2 km = 2 x 1000 = 2000 m. The number got bigger, which is correct, because metres are smaller than kilometres so it takes more of them.", "topic": "measurement: km to m"}, {"id": "m16-place-value-measure:q4", "level": "easy", "type": "text", "q": "Change 5000 m into kilometres.", "answer": "5", "accept": ["5", "5.0", "5km", "5 km"], "hint": "You are going from a small unit to a big one, so divide by 1000.", "explain": "The answer is 5 km. Going from metres to kilometres you divide by 1000, so 5000 divided by 1000 = 5 km. The number got smaller, which is correct, because kilometres are big units so you need fewer of them.", "topic": "measurement: m to km"}, {"id": "m16-place-value-measure:q5", "level": "easy", "type": "text", "q": "Change 4.5 km into metres.", "answer": "4500", "accept": ["4500", "4500m", "4500 m", "4500.0", "4,500"], "hint": "Multiply by 1000. The digits move three places.", "explain": "The answer is 4500 m. 4.5 x 1000 = 4500. Moving the digits three places: 4.5 becomes 45, then 450, then 4500. Check backwards: 4500 divided by 1000 = 4.5 km.", "topic": "measurement: km to m with a decimal"}, {"id": "m16-place-value-measure:q6", "level": "easy", "type": "mc", "q": "Someone writes 3.75 km = 375 m. What has gone wrong?", "options": ["The digits moved two places instead of three, because 1 km is 1000 m", "The digits moved three places instead of two", "They multiplied when they should have divided", "Nothing, 3.75 km really is 375 m"], "answer": "The digits moved two places instead of three, because 1 km is 1000 m", "hint": "How many zeros are in 1000, and how many places should the digits move?", "explain": "The answer is that the digits only moved two places. 1 km = 1000 m, and 1000 has three zeros, so 3.75 becomes 37.5, then 375, then 3750. The correct answer is 3750 m. What they actually wrote, 375 m, is 0.375 km, which is ten times too short. Multiplying was the right choice, since km to m always makes the number bigger.", "topic": "measurement: spotting a two place shift instead of three"}, {"id": "m16-place-value-measure:q7", "level": "medium", "type": "text", "q": "Change 3.75 km into metres.", "answer": "3750", "accept": ["3750", "3750m", "3750 m", "3750.0", "3,750"], "hint": "Multiply by 1000, and move the digits three places, not two.", "explain": "The answer is 3750 m. 3.75 x 1000 = 3750. Step through the places: 3.75, then 37.5, then 375, then 3750. Check backwards: 3750 divided by 1000 = 3.75 km. Stopping at 375 is the two place mistake, and 375 m is only 0.375 km.", "topic": "measurement: km to m with a decimal"}, {"id": "m16-place-value-measure:q8", "level": "medium", "type": "text", "q": "Change 250 m into kilometres.", "answer": "0.25", "accept": ["0.25", "0.25km", "0.25 km", ".25", "1/4", "0.250"], "hint": "Divide by 1000. The answer will be less than 1 km.", "explain": "The answer is 0.25 km. Going from m to km you divide by 1000: 250 divided by 1000 = 0.25. It has to be less than 1, because 250 m is only a quarter of a kilometre. Check backwards: 0.25 x 1000 = 250 m.", "topic": "measurement: m to km giving a decimal"}, {"id": "m16-place-value-measure:q9", "level": "medium", "type": "text", "q": "Change 3.2 m into centimetres.", "answer": "320", "accept": ["320", "320cm", "320 cm", "320.0"], "hint": "1 m = 100 cm, so multiply by 100 and move the digits two places.", "explain": "The answer is 320 cm. 1 m = 100 cm, so 3.2 x 100 = 320 cm. 100 has two zeros, so the digits move two places: 3.2 becomes 32, then 320. Notice this one is two places while km to m is three. The number of zeros tells you.", "topic": "measurement: m to cm"}, {"id": "m16-place-value-measure:q10", "level": "medium", "type": "text", "q": "Change 45 mm into centimetres.", "answer": "4.5", "accept": ["4.5", "4.5cm", "4.5 cm", "4.50", "9/2"], "hint": "1 cm = 10 mm, and you are going from the small unit to the bigger one.", "explain": "The answer is 4.5 cm. There are 10 mm in 1 cm, so divide by 10: 45 divided by 10 = 4.5 cm. The number got smaller because centimetres are the bigger unit. Check backwards: 4.5 x 10 = 45 mm.", "topic": "measurement: mm to cm"}, {"id": "m16-place-value-measure:q11", "level": "medium", "type": "text", "q": "On a map, 2 cm represents 1 km in real life. A track measures 6.5 cm on the map. How long is the track in METRES?", "answer": "3250", "accept": ["3250", "3250m", "3250 m", "3250.0", "3,250"], "hint": "Two jobs. Get the real distance in km first, then turn km into m.", "explain": "The answer is 3250 m. Step 1: every 2 cm is 1 km, so 6.5 divided by 2 = 3.25 km. Step 2: 3.25 x 1000 = 3250 m. Check backwards: 3250 m is 3.25 km, and 3.25 x 2 = 6.5 cm on the map. Writing 325 m would be the two place mistake again.", "topic": "scale: map distance converted into metres"}, {"id": "m16-place-value-measure:q12", "level": "stretch", "type": "text", "q": "A different map uses a scale where 4 cm represents 1 km. A road measures 9 cm on this map. How long is the road in METRES?", "answer": "2250", "accept": ["2250", "2250m", "2250 m", "2250.0", "2,250"], "hint": "Divide the map distance by 4 to get km, then multiply by 1000.", "explain": "The answer is 2250 m. Step 1: every 4 cm is 1 km, so 9 divided by 4 = 2.25 km. Estimate check: 8 cm would be 2 km, and 9 cm is a bit more, so just over 2 km is right. Step 2: 2.25 x 1000 = 2250 m. Check backwards: 2250 m is 2.25 km, and 2.25 x 4 = 9 cm on the map.", "topic": "scale: map distance converted into metres"}, {"id": "m16-place-value-measure:q13", "level": "stretch", "type": "long", "marks": 4, "q": "On a map, 2 cm represents 1 km. A walker measures a route as 7.5 cm on the map and writes down 375 m. Explain what he got right, explain exactly what he got wrong, and give the correct answer in metres.", "answer": "He got the scale step right. Every 2 cm on the map is 1 km, so 7.5 divided by 2 = 3.75 km, and his digits 3, 7 and 5 come from that, so his working up to there was correct. He also chose to multiply rather than divide when changing km into metres, which is the right choice, because metres are smaller units so the number has to get bigger. What he got wrong is how far the digits moved. 1 km = 1000 m, and 1000 has three zeros, so the digits move three places: 3.75 becomes 37.5, then 375, then 3750. He stopped one place early. His answer of 375 m is actually 0.375 km, which is ten times too short. The correct answer is 3750 m. A quick real world check spots it, because 1 km is about a twelve minute walk, so 375 m would be a three minute stroll and the real route is nearly 4 km.", "hint": "Deal with the two steps separately. Was the scale step right? Was the unit change right? Count the zeros in 1000.", "explain": "A full answer has four parts, one mark each. One, the scale step was right: 7.5 divided by 2 = 3.75 km. Two, multiplying to change km into m was the right choice, because the number must get bigger. Three, the mistake was moving the digits two places instead of three, since 1000 has three zeros, so 375 m is really 0.375 km, ten times too small. Four, the correct answer is 3750 m. Saying only that he is wrong, with no explanation of where or why, is one mark. Naming which step was correct matters, because most of his method was fine.", "topic": "measurement: diagnosing a place value error in a scale question"}]}, "m20-mixed-stretch": {"id": "m20-mixed-stretch", "day": "Day 5", "subject": "Maths", "title": "Mixed stretch", "minutes": 25, "objective": "Hold several ideas at once by solving multi step problems where nothing tells you which topic you are in.", "extract": null, "teach": {"intro": ["Every question here needs at least two steps, and none of them tells you the topic. That is the whole point. In a real exam nobody writes RATIO at the top of the page.", "Two of the topics below, percentages and sequences, you met on Day 4. Here is the short version again before you use them under pressure. Percentages first. To find 20% of 200, find 10% by dividing by 10, which gives 20, then double it to get 40. Any percentage can be built from 10%, 5% and 1% this way.", "Sequences second. In the list 5, 8, 11, 14 each term is 3 more than the one before, so the rule is add 3. To jump straight to the 10th term without listing them all, notice that the term number multiplied by 3 always lands 2 below the term, so the rule is 3 x position + 2, and the 10th term is 3 x 10 + 2 = 32.", "One rule for this session. Never leave a question blank. Write the first step even when you cannot see the last one, because a first step is worth marks and a blank is worth nothing."], "example": {"problem": "A bike costs 200 pounds. In a sale the price is cut by 20%. Two weeks later the sale price is cut by a further 10%. What is the final price?", "steps": ["Step 1, the first cut. 10% of 200 is 200 divided by 10 = 20, so 20% is 2 x 20 = 40 pounds off.", "New price after the first cut: 200 - 40 = 160 pounds.", "Step 2, the second cut. This one is taken off the NEW price, not the original. 10% of 160 is 16 pounds.", "Final price: 160 - 16 = 144 pounds.", "Check the trap. 20% then 10% is not the same as 30% off. 30% of 200 would be 60, giving 140 pounds, which is 4 pounds cheaper than the real answer. The second cut is smaller because it is taken from a smaller amount."], "answer": "144 pounds"}, "example2": {"problem": "A sequence starts 7, 11, 15, 19. What is the 20th term?", "steps": ["Find the step between terms: 11 - 7 = 4, and 15 - 11 = 4. The rule is add 4 each time.", "Listing 20 terms would work but it is slow and one slip ruins it, so find a rule based on position instead.", "Multiply each position by 4: position 1 gives 4, position 2 gives 8, position 3 gives 12. Compare with the real terms, 7, 11 and 15. Each real term is 3 more.", "So the rule is 4 x position + 3.", "Test it on a term you already know. Position 4: 4 x 4 + 3 = 19, which matches the fourth term.", "Now use it: position 20 gives 4 x 20 + 3 = 83."], "answer": "83"}, "keyfact": "Nothing here tells you the topic. Read what you are given, name what you are looking for, and always write down the first step."}, "questions": [{"id": "m20-mixed-stretch:q1", "level": "stretch", "type": "text", "q": "A survival ration weighs 2/5 of a kg. A crate holds 11 kg of rations. How many complete rations fit in the crate?", "answer": "27", "accept": ["27", "27.0", "27 rations"], "hint": "How many lots of 2/5 fit into 11? Flip and multiply, then think about whether part of a ration counts.", "explain": "The answer is 27 rations. The calculation is 11 divided by 2/5. Flip the 2/5 to get 5/2, then 11 x 5/2 = 55/2 = 27.5. You cannot have half a ration in a crate of complete ones, so round DOWN to 27. Check it: 27 rations weigh 27 x 0.4 = 10.8 kg, leaving 0.2 kg spare, which is not enough for another 0.4 kg ration. Note that dividing by 2/5 made the answer much bigger than 11, which is correct, because you are counting small pieces.", "topic": "fractions: dividing by a fraction then rounding down in context"}, {"id": "m20-mixed-stretch:q2", "level": "stretch", "type": "text", "q": "Work out -3^2 + (-4) x (-5)", "answer": "11", "accept": ["11", "11.0", "+11"], "hint": "Two jobs. Indices come before everything, and the minus in front of the 3 is not inside the squaring. Then a negative times a negative.", "explain": "The answer is 11. Take the index first: -3^2 means the square of 3 with a minus in front, so it is -9. Brackets would change that, since (-3)^2 = 9. Next the multiply: (-4) x (-5) = 20, because two negatives multiplied give a positive. Last, add: -9 + 20 = 11. Doing it left to right without BIDMAS gives a completely different answer, so the order is what carries the marks here.", "topic": "negatives: index and sign rules together with BIDMAS"}, {"id": "m20-mixed-stretch:q3", "level": "stretch", "type": "text", "q": "At 6 am the temperature on a mountain is -7 degrees C. It rises by 3 degrees each hour for 4 hours. Overnight it then falls by 12 degrees. What is the temperature after the fall, in degrees C?", "answer": "-7", "accept": ["-7", "-7.0", "-7C", "-7 C", "minus 7"], "hint": "Work out the total rise first, then take the fall off that. Do not do it one hour at a time.", "explain": "The answer is -7 degrees C. Step 1: the rise is 3 x 4 = 12 degrees, so the temperature reaches -7 + 12 = 5 degrees C. Step 2: it falls 12, so 5 - 12 = -7 degrees C. It ends exactly where it started, because the total rise and the fall are both 12. Spotting that is a quicker route than adding hour by hour, and it is a good check on the arithmetic.", "topic": "negatives: multi step temperature change"}, {"id": "m20-mixed-stretch:q4", "level": "stretch", "type": "text", "q": "A jacket costs 200 pounds. Its price is cut by 20% in a sale. A week later the sale price is cut by a further 10%. What is the final price, in pounds?", "answer": "144", "accept": ["144", "144.0", "£144", "144 pounds"], "hint": "Do the cuts one at a time. The second cut comes off the new price, not the original one.", "explain": "The answer is 144 pounds. First cut: 10% of 200 is 20, so 20% is 40 pounds off, leaving 200 - 40 = 160 pounds. Second cut: 10% of 160 is 16 pounds off, leaving 160 - 16 = 144 pounds. The trap is treating this as 30% off, which would give 200 - 60 = 140 pounds. It is not 30%, because the second cut is taken from 160, not from 200.", "topic": "percentages: two successive reductions"}, {"id": "m20-mixed-stretch:q5", "level": "stretch", "type": "text", "q": "After a 20% discount, a coat costs 60 pounds. What was the price before the discount, in pounds?", "answer": "75", "accept": ["75", "75.0", "£75", "75 pounds"], "hint": "The 60 pounds is not 100% of the original price. What percentage of the original is it?", "explain": "The answer is 75 pounds. Taking 20% off leaves 80%, so 60 pounds is 80% of the original price. Divide to find 1%: 60 divided by 80 = 0.75 pounds. Multiply to find 100%: 0.75 x 100 = 75 pounds. Check it forwards: 20% of 75 is 15, and 75 - 15 = 60, which matches. The common wrong move is taking 20% off the 60, which gives 48 and is going forwards again instead of backwards.", "topic": "percentages: working backwards to the original amount"}, {"id": "m20-mixed-stretch:q6", "level": "stretch", "type": "text", "q": "Concrete is mixed with cement, sand and gravel in the ratio 1:3:5. A builder has 12 kg of cement, 30 kg of sand and as much gravel as he wants. What is the greatest mass of concrete he can mix, in kg?", "answer": "90", "accept": ["90", "90.0", "90kg", "90 kg"], "hint": "Work out how much one part could be from the cement, then from the sand. One of them runs out first.", "explain": "The answer is 90 kg. From the cement: cement is 1 part and he has 12 kg, so one part could be up to 12 kg. From the sand: sand is 3 parts and he has 30 kg, so one part could be at most 30 divided by 3 = 10 kg. The sand runs out first, so one part is 10 kg. The whole mix is 1 + 3 + 5 = 9 parts, so 9 x 10 = 90 kg. Check: that uses 10 kg of cement, 30 kg of sand and 50 kg of gravel, which is 90 kg in total, and he has enough cement with 2 kg spare.", "topic": "ratio: which ingredient limits the mix"}, {"id": "m20-mixed-stretch:q7", "level": "stretch", "type": "text", "q": "In a class the ratio of boys to girls is 4:5. There are 6 more girls than boys. What fraction of the class are boys? Give your answer in its simplest form.", "answer": "4/9", "accept": ["4/9", "8/18", "24/54"], "hint": "There are two routes. You can find the real numbers first, or you can read the fraction straight off the ratio.", "explain": "The answer is 4/9. Route 1, with real numbers: the difference is 5 - 4 = 1 part, and that is 6 people, so one part is 6. There are 4 x 6 = 24 boys and 5 x 6 = 30 girls, giving a class of 54. The fraction of boys is 24/54, and dividing top and bottom by 6 gives 4/9. Route 2, straight from the ratio: the class is 4 + 5 = 9 parts and boys are 4 of them, so boys are 4/9 whatever the class size. The second route is faster, and the first route proves it works.", "topic": "ratio: turning a ratio into a fraction of the whole"}, {"id": "m20-mixed-stretch:q8", "level": "stretch", "type": "text", "q": "A triangular sail has an area of 7.5 m^2 and a base of 3 m. A second sail is a triangle with the same perpendicular height but twice the base. What is the area of the second sail, in m^2?", "answer": "15", "accept": ["15", "15.0", "15m^2", "15 m^2", "15m2", "15 m2"], "hint": "Find the height of the first sail by working backwards, then go forwards with the new base.", "explain": "The answer is 15 m^2. Step 1, backwards: 7.5 x 2 = 15, and 15 divided by 3 = 5, so the height is 5 m. Step 2, forwards: the new base is 2 x 3 = 6 m, so the area is 6 x 5 divided by 2 = 15 m^2. There is a shortcut worth seeing. The height is unchanged and the base has doubled, so the area doubles, and 7.5 x 2 = 15.", "topic": "area: backwards then forwards with a doubled base"}, {"id": "m20-mixed-stretch:q9", "level": "stretch", "type": "text", "q": "A field is a triangle with a base of 0.4 km and a perpendicular height of 250 m. What is its area, in m^2?", "answer": "50000", "accept": ["50000", "50000.0", "50,000", "50000m^2", "50000 m^2", "50000m2", "50000 m2"], "hint": "The two lengths are in different units. Change one of them before you use the rule.", "explain": "The answer is 50000 m^2. Step 1, get both lengths into the same unit. 0.4 km x 1000 = 400 m. Step 2, use the rule: 400 x 250 = 100000, and 100000 divided by 2 = 50000 m^2. Multiplying 0.4 by 250 without converting gives 100, then 50, which is out by a factor of a thousand. Units first, rule second.", "topic": "area: converting units before finding an area"}, {"id": "m20-mixed-stretch:q10", "level": "stretch", "type": "text", "q": "On a map, 5 cm represents 2 km. A path measures 8 cm on the map. How long is the path in metres?", "answer": "3200", "accept": ["3200", "3200.0", "3200m", "3200 m", "3,200"], "hint": "Work out what 1 cm represents first, then convert km into m.", "explain": "The answer is 3200 m. Step 1: 5 cm is 2 km, so 1 cm is 2 divided by 5 = 0.4 km. Step 2: 8 cm is 8 x 0.4 = 3.2 km. Step 3: 3.2 x 1000 = 3200 m. Check backwards: 3200 m is 3.2 km, and 3.2 divided by 0.4 = 8 cm on the map. Answering 320 m would be the two place slip, since 1 km is 1000 m and not 100 m.", "topic": "scale: unequal map scale converted into metres"}, {"id": "m20-mixed-stretch:q11", "level": "stretch", "type": "text", "q": "A sequence starts 7, 11, 15, 19 and carries on in the same way. What is the 20th term?", "answer": "83", "accept": ["83", "83.0"], "hint": "Find the step first, then build a rule based on the position number instead of listing every term.", "explain": "The answer is 83. The step is 4, since 11 - 7 = 4. Multiplying each position by 4 gives 4, 8, 12, and the real terms are 7, 11, 15, which are each 3 more, so the rule is 4 x position + 3. Test it on a known term: position 4 gives 4 x 4 + 3 = 19, correct. Position 20 gives 4 x 20 + 3 = 83. Listing all 20 terms gives the same answer but takes twenty chances to slip.", "topic": "sequences: finding a term from its position"}, {"id": "m20-mixed-stretch:q12", "level": "stretch", "type": "mc", "q": "For that same sequence, 7, 11, 15, 19 and so on, is 100 ever a term? Pick the statement that is both true and gives the right reason.", "options": ["No, because every term is 3 more than a multiple of 4, and 100 is exactly a multiple of 4", "Yes, because 100 divided by 4 is 25, which is a whole number", "Yes, because 100 is bigger than 19, so the sequence must reach it sooner or later", "No, because the sequence stops at 19"], "answer": "No, because every term is 3 more than a multiple of 4, and 100 is exactly a multiple of 4", "hint": "The rule is 4 x position + 3. Could 4 x something + 3 ever land exactly on 100?", "explain": "The answer is the first option. Every term is 4 x position + 3, so every term sits 3 above a multiple of 4. 100 is itself a multiple of 4, so it is 3 short of being a term. The nearest terms are 99, which is 4 x 24 + 3, and 103, which is 4 x 25 + 3. Option 2 gets the arithmetic right but draws the wrong conclusion from it. Option 3 assumes a sequence hits every large number, which it does not. There is a second correct route as well: every term is odd, and 100 is even.", "topic": "sequences: deciding whether a number is a term"}, {"id": "m20-mixed-stretch:q13", "level": "stretch", "type": "text", "q": "A phone battery is at 3/4 of a full charge. It then loses 40% of the charge that is in it. What percentage of a FULL battery is left?", "answer": "45", "accept": ["45", "45.0", "45%", "45 percent"], "hint": "Turn 3/4 into a percentage first. The 40% is taken from that amount, not from a full battery.", "explain": "The answer is 45%. Step 1: 3/4 of a full battery is 75%. Step 2: it loses 40% of the 75 that is there. 10% of 75 is 7.5, so 40% is 4 x 7.5 = 30. Step 3: 75 - 30 = 45% of a full battery is left. The trap is taking 40% of the whole battery, which would give 75 - 40 = 35 and is wrong, because the question says 40% of the charge that is IN it.", "topic": "percentages: a percentage of a part, not of the whole"}, {"id": "m20-mixed-stretch:q14", "level": "stretch", "type": "long", "marks": 5, "q": "A rectangle and a triangle have exactly the same area. The rectangle is 6 cm wide and 4 cm tall. The triangle has a base of 8 cm. Work out the perpendicular height of the triangle, then explain why that height is not the same as the height of the rectangle even though the two areas are equal.", "answer": "First I find the area they share. The rectangle is 6 x 4 = 24 cm^2, so the triangle must also have an area of 24 cm^2. Now I work backwards through the triangle rule, which is base x height divided by 2. I undo the halving first: 24 x 2 = 48, which is base x height. Then I divide by the base: 48 divided by 8 = 6, so the perpendicular height of the triangle is 6 cm. I check it forwards: 8 x 6 = 48, and 48 divided by 2 = 24 cm^2, which matches the rectangle. The triangle is 6 cm tall while the rectangle is only 4 cm tall, and that is not a mistake. A triangle only fills half of the rectangle you could draw around it, so for the same base and height a triangle covers half as much. To catch up with the rectangle it has to be taller, or have a longer base. Here the base is 8 cm rather than 6 cm and the height is 6 cm rather than 4 cm, and those two increases together make up for the halving.", "hint": "Work out the rectangle area first, since that is the number the triangle has to match. Then think about what the divide by 2 in the triangle rule is doing.", "explain": "A full answer has five parts, one mark each. One, the rectangle area is 6 x 4 = 24 cm^2, and you state that the triangle has the same area. Two, you work backwards correctly: 24 x 2 = 48, then 48 divided by 8. Three, you give the height as 6 cm. Four, you check it forwards: 8 x 6 divided by 2 = 24 cm^2. Five, the explanation: a triangle covers only half of the rectangle around it, so with the same base and height it would have half the area, which means it needs a bigger base or a bigger height to match. An answer that gives 6 cm with no explanation gets the first four marks but not the last one, and the last one is the reason this question exists.", "topic": "area: equal areas across two shapes with an explanation"}]}, "m17-negatives-algebra": {"id": "m17-negatives-algebra", "day": "Day 3", "subject": "Maths", "title": "The sign belongs to the term", "minutes": 25, "objective": "Simplify expressions by marking every term with its own sign before collecting anything, so no minus sign gets left behind, including when the answer has a negative coefficient.", "extract": null, "teach": {"intro": ["An expression is built out of terms. In 9a - 4a there are two terms, and the sign written in front of a term belongs to that term. The minus in front of the 4a is part of it, so the terms are +9a and -4a.", "A term with nothing in front of it is positive. The first term of an expression almost never shows its plus sign, but it is there. In 6y + 2 - 5y the three terms are +6y, +2 and -5y.", "The number in front of a letter is called the coefficient. In -3q the coefficient is -3, minus included. A coefficient is allowed to be negative, and plenty of correct answers have one.", "Here is the method, and it is one habit. Before you collect anything, go along the expression and mark each term with its own sign. Then collect the marked terms, signs and all. Last week you collected the like terms correctly every time and then dropped the signs, so this one habit is the whole fix."], "example": {"problem": "Simplify 8m + 3 - 2m + 5", "steps": ["Mark every term with its sign first, before collecting anything. Reading along: +8m, then +3, then -2m, then +5. The minus in front of the 2m belongs to the 2m and travels with it everywhere it goes.", "Collect the m terms, keeping their signs. They are +8m and -2m, so the coefficients give 8 - 2 = 6, which is 6m.", "Collect the plain numbers, keeping their signs. They are +3 and +5, so 3 + 5 = 8.", "Put them together. The answer is 6m + 8.", "Now look at the answer you gave last week, 10m + 8. The 8 is right. The 10m came from working out 8 + 2, which means the minus was left behind on the page. Once the term is marked -2m there is nothing to add.", "Prove it with a number. Put m = 1 into the original: 8 + 3 - 2 + 5 = 14. A correct simplified answer must give 14 as well. 6m + 8 gives 6 + 8 = 14, correct. 10m + 8 gives 10 + 8 = 18, so it is a different expression."], "answer": "6m + 8"}, "example2": {"problem": "Simplify 5p + 2q - 3p - 5q", "steps": ["Mark the signs first: +5p, +2q, -3p, -5q. Two of the four terms are negative, and both minus signs stay attached.", "Collect the p terms with their signs. They are +5p and -3p, so 5 - 3 = 2, which is 2p.", "Collect the q terms with their signs. They are +2q and -5q, so 2 - 5 = -3, which is -3q. Going below zero is allowed, and here it is the right answer.", "Put them together. The answer is 2p - 3q.", "Last week you wrote 2p + 3q. The p part was completely right. The q part used the digits 2 and 5 but ignored their signs, and 2 - 5 is -3, not +3.", "Prove it with numbers. Put p = 1 and q = 1 into the original: 5 + 2 - 3 - 5 = -1. Now 2p - 3q gives 2 - 3 = -1, correct. 2p + 3q gives 2 + 3 = 5, which is not -1, so it cannot be the same expression."], "answer": "2p - 3q"}, "keyfact": "The sign in front of a term is part of the term and travels with it. Mark every term with its sign before you collect anything, and remember that a term with no sign in front of it is positive."}, "questions": [{"id": "m17-negatives-algebra:q1", "level": "easy", "type": "mc", "q": "In the expression 9a - 4a, which sign belongs to the term 4a?", "options": ["Negative, because the minus written in front of it is part of that term", "Positive, because every term in an expression is positive", "Negative, but only if a stands for a negative number", "It has no sign at all"], "answer": "Negative, because the minus written in front of it is part of that term", "hint": "Look at what is written immediately in front of the 4a.", "explain": "The answer is negative. The minus sits directly in front of the 4a, so the term is -4a. That is why 9a - 4a = 5a and not 13a. A sign always belongs to the term straight after it, whatever the letter stands for.", "topic": "algebra: which term a sign belongs to"}, {"id": "m17-negatives-algebra:q2", "level": "easy", "type": "mc", "q": "Which line lists the terms of 6y + 2 - 5y correctly, with the sign of each one?", "options": ["+6y, +2, -5y", "+6y, +2, +5y", "+6y, -2, -5y", "-6y, +2, -5y"], "answer": "+6y, +2, -5y", "hint": "There are three terms. A term with nothing written in front of it is positive.", "explain": "The answer is +6y, +2, -5y. The 6y comes first and has nothing in front of it, so it is positive. The plus before the 2 makes it +2. The minus before the 5y makes it -5y. Marking the terms like this before you collect is what stops a sign going missing.", "topic": "algebra: marking every term with its sign"}, {"id": "m17-negatives-algebra:q3", "level": "easy", "type": "text", "q": "Simplify 9k - 4k", "answer": "5k", "accept": ["5k", "5 k", "5*k", "5 x k", "+5k"], "hint": "Both terms use k, so collect them. Watch the sign in front of the 4k.", "explain": "The answer is 5k. Marked with their signs the terms are +9k and -4k, so the coefficients give 9 - 4 = 5, which is 5k. Test it with k = 2: the original is 18 - 8 = 10, and 5k gives 10.", "topic": "algebra: collecting two like terms with a subtraction"}, {"id": "m17-negatives-algebra:q4", "level": "easy", "type": "text", "q": "Simplify 3t - 8t", "answer": "-5t", "accept": ["-5t", "-5 t", "- 5t", "-5*t", "-5 x t"], "hint": "3 - 8 goes below zero, and that is allowed.", "explain": "The answer is -5t. The terms are +3t and -8t, so the coefficients give 3 - 8 = -5, which is -5t. Writing 5t would be dropping the minus. Test it with t = 1: the original is 3 - 8 = -5, and -5t gives -5.", "topic": "algebra: like terms collecting to a negative coefficient"}, {"id": "m17-negatives-algebra:q5", "level": "easy", "type": "mc", "q": "Someone simplifies 8m + 3 - 2m + 5 and writes 10m + 8. What went wrong?", "options": ["They added the 2m instead of subtracting it, because they left the minus sign behind", "They added the 3 and the 5 when they should have subtracted them", "They should not have collected the m terms at all", "Nothing, 10m + 8 is correct"], "answer": "They added the 2m instead of subtracting it, because they left the minus sign behind", "hint": "Mark each of the four terms with its sign. What sign is in front of the 2m?", "explain": "The answer is that they added the 2m instead of subtracting it. The term is -2m, minus included, so the m terms give 8 - 2 = 6, which is 6m. The number part was fine, since 3 + 5 = 8. The correct answer is 6m + 8. Test it with m = 1: the original gives 8 + 3 - 2 + 5 = 14, and 6m + 8 gives 14, while 10m + 8 gives 18.", "topic": "algebra: diagnosing a dropped minus sign"}, {"id": "m17-negatives-algebra:q6", "level": "medium", "type": "text", "q": "Simplify 8m + 3 - 2m + 5", "answer": "6m + 8", "accept": ["6m + 8", "6m+8", "8 + 6m", "8+6m"], "hint": "Mark the four terms with their signs first: +8m, +3, -2m, +5.", "explain": "The answer is 6m + 8. The m terms are +8m and -2m, so 8 - 2 = 6, which is 6m. The plain numbers are +3 and +5, so 3 + 5 = 8. Together that is 6m + 8. Check it with m = 2: the original is 16 + 3 - 4 + 5 = 20, and 6 x 2 + 8 = 20.", "topic": "algebra: collecting terms and numbers with a negative term"}, {"id": "m17-negatives-algebra:q7", "level": "medium", "type": "text", "q": "Simplify 5p + 2q - 3p - 5q", "answer": "2p - 3q", "accept": ["2p - 3q", "2p-3q", "-3q + 2p", "-3q+2p"], "hint": "Mark all four signs first. Two of the terms are negative, and the q terms will go below zero.", "explain": "The answer is 2p - 3q. The p terms are +5p and -3p, so 5 - 3 = 2, which is 2p. The q terms are +2q and -5q, so 2 - 5 = -3, which is -3q. Together that is 2p - 3q. Check it with p = 1 and q = 1: the original is 5 + 2 - 3 - 5 = -1, and 2 - 3 = -1. Writing 2p + 3q gives 5, so that is a different expression.", "topic": "algebra: collecting like terms with two negative terms"}, {"id": "m17-negatives-algebra:q8", "level": "medium", "type": "text", "q": "Simplify 4a - 9a + 2", "answer": "-5a + 2", "accept": ["-5a + 2", "-5a+2", "2 - 5a", "2-5a"], "hint": "Collect the a terms first. 4 - 9 lands below zero.", "explain": "The answer is -5a + 2. The a terms are +4a and -9a, so 4 - 9 = -5, which is -5a. The 2 has no other plain number to join with, so it stays as +2. You can write it as -5a + 2 or as 2 - 5a, and both mean the same thing. Check with a = 1: the original is 4 - 9 + 2 = -3, and -5 + 2 = -3.", "topic": "algebra: negative coefficient alongside a number term"}, {"id": "m17-negatives-algebra:q9", "level": "medium", "type": "mc", "q": "Someone simplifies 5p + 2q - 3p - 5q and writes 2p + 3q. Which check shows fastest that it is wrong?", "options": ["Put p = 1 and q = 1 into both lines. The original gives -1 and 2p + 3q gives 5, so they are not the same expression", "Count the terms. There are four at the start and two at the end, so something must be missing", "2p + 3q has no negative sign in it, and every simplified answer needs one", "The letters p and q are not allowed to appear in the same answer"], "answer": "Put p = 1 and q = 1 into both lines. The original gives -1 and 2p + 3q gives 5, so they are not the same expression", "hint": "The fastest test of any simplifying is to put a number in and see whether both lines agree.", "explain": "The answer is the substitution check. Put p = 1 and q = 1 into the original: 5 + 2 - 3 - 5 = -1. The correct answer, 2p - 3q, gives 2 - 3 = -1, which matches. Their 2p + 3q gives 2 + 3 = 5, which does not, so it is wrong. Counting terms proves nothing, because collecting like terms is supposed to reduce how many terms there are.", "topic": "algebra: checking a simplification by substituting a number"}, {"id": "m17-negatives-algebra:q10", "level": "medium", "type": "text", "q": "Simplify 7x - 2y - 9x + 6y", "answer": "-2x + 4y", "accept": ["-2x + 4y", "-2x+4y", "4y - 2x", "4y-2x"], "hint": "Mark the signs, then do the x terms and the y terms separately.", "explain": "The answer is -2x + 4y. The x terms are +7x and -9x, so 7 - 9 = -2, which is -2x. The y terms are -2y and +6y, so -2 + 6 = 4, which is 4y. Together that is -2x + 4y, which can also be written 4y - 2x. Check with x = 1 and y = 1: the original is 7 - 2 - 9 + 6 = 2, and -2 + 4 = 2.", "topic": "algebra: two letters with a negative coefficient in the answer"}, {"id": "m17-negatives-algebra:q11", "level": "medium", "type": "text", "q": "Simplify 6c - 4 - c - 9", "answer": "5c - 13", "accept": ["5c - 13", "5c-13", "-13 + 5c", "-13+5c"], "hint": "A letter on its own means 1 of it, so -c means -1c. Both plain numbers are negative.", "explain": "The answer is 5c - 13. The c terms are +6c and -c, and -c means -1c, so 6 - 1 = 5, which is 5c. The plain numbers are -4 and -9, both negative, so -4 - 9 = -13. Together that is 5c - 13. Working out 4 + 9 = 13 and writing 5c + 13 is the dropped sign mistake twice over. Check with c = 2: the original is 12 - 4 - 2 - 9 = -3, and 5 x 2 - 13 = -3.", "topic": "algebra: collecting when both number terms are negative"}, {"id": "m17-negatives-algebra:q12", "level": "stretch", "type": "text", "q": "Simplify 3m - 7n + m - 2n - 5m", "answer": "-m - 9n", "accept": ["-m - 9n", "-m-9n", "-1m - 9n", "-1m-9n", "-9n - m", "-9n-m"], "hint": "There are three m terms and two n terms. An m on its own means +1m.", "explain": "The answer is -m - 9n. The m terms are +3m, +m and -5m, so 3 + 1 - 5 = -1, which is -1m, written as -m. The n terms are -7n and -2n, both negative, so -7 - 2 = -9, which is -9n. Together that is -m - 9n. Check with m = 1 and n = 1: the original is 3 - 7 + 1 - 2 - 5 = -10, and -1 - 9 = -10.", "topic": "algebra: three like terms giving a coefficient of -1"}, {"id": "m17-negatives-algebra:q13", "level": "stretch", "type": "text", "q": "Simplify 2a - 5b - 6a + 5b", "answer": "-4a", "accept": ["-4a", "-4 a", "-4*a", "-4a + 0b", "-4a+0b"], "hint": "Do the b terms as well as the a terms. What is -5 + 5?", "explain": "The answer is -4a. The a terms are +2a and -6a, so 2 - 6 = -4, which is -4a. The b terms are -5b and +5b, and -5 + 5 = 0, so the b terms cancel each other out and vanish from the answer. You do not write 0b. Check with a = 1 and b = 3: the original is 2 - 15 - 6 + 15 = -4, and -4a gives -4.", "topic": "algebra: like terms that cancel to zero"}, {"id": "m17-negatives-algebra:q14", "level": "stretch", "type": "text", "q": "Simplify 4f - 9
