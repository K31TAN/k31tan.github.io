w high it bounces. What is the drop height called?", "options": ["The independent variable", "The dependent variable", "A control variable", "An anomaly"], "answer": "The independent variable", "hint": "Use his sentence. The thing after \"I change\" is one type, the thing after \"I measure\" is the other.", "explain": "The answer is the independent variable. The independent variable is the one thing you deliberately change, and Rob says he changes the drop height. The bounce height is the dependent variable, because that is what he measures. Control variables are everything he keeps the same, like the ball and the floor.", "topic": "working scientifically: independent variable"}, {"id": "r-s5-2", "level": "easy", "type": "mc", "q": "Rob drops the same ball onto the same floor from different heights and records how high it bounces each time. What is the dependent variable?", "options": ["The height the ball bounces to", "The height the ball is dropped from", "The type of ball used", "The floor it lands on"], "answer": "The height the ball bounces to", "hint": "The dependent variable is the thing you measure. What is Rob actually recording?", "explain": "The answer is the height the ball bounces to. That is the thing Rob measures, and it depends on what he changed. The drop height is the independent variable, because he chooses it. The ball and the floor are control variables, because he keeps them the same every time.", "topic": "working scientifically: identifying the dependent variable"}, {"id": "r-s5-3", "level": "easy", "type": "mc", "q": "In the same bounce test, which of these is a CONTROL variable?", "options": ["Using the same ball for every drop", "The height the ball is dropped from", "The height the ball bounces to", "Whether the results support his prediction"], "answer": "Using the same ball for every drop", "hint": "A control variable is something kept exactly the same so it cannot affect the result.", "explain": "The answer is using the same ball for every drop. Control variables are the things you keep identical so that only one thing is changing. If Rob swapped to a different ball halfway through, he would not know whether the bounce changed because of the drop height or because of the new ball. The drop height is what he changes and the bounce height is what he measures, so neither of those is a control variable.", "topic": "working scientifically: control variables"}, {"id": "r-s5-4", "level": "easy", "type": "text", "q": "Rob drops the ball from 100 cm three times. The bounce heights are 54 cm, 57 cm and 57 cm. Work out the mean bounce height, in cm.", "answer": "56", "accept": ["56", "56.0", "56cm", "56 cm"], "hint": "Add the three readings, then divide by 3.", "explain": "The answer is 56 cm. Add the readings: 54 + 57 + 57 = 168. Divide by how many readings there are: 168 divided by 3 = 56 cm. Sense check: the mean should sit somewhere inside the range of the readings, between 54 and 57, and 56 does.", "topic": "working scientifically: calculating a mean"}, {"id": "r-s5-5", "level": "medium", "type": "text", "q": "From a 60 cm drop, Rob records bounce heights of 33 cm, 34 cm and 90 cm. Which reading is the anomaly? Write just the number.", "answer": "90", "accept": ["90", "90cm", "90 cm", "90.0"], "hint": "An anomaly is the one result that clearly does not fit with the others.", "explain": "The answer is 90. Two of the readings, 33 and 34, are close together, and 90 is nowhere near them. A ball dropped from 60 cm cannot bounce higher than 60 cm anyway, so 90 must be a measuring mistake. Leave it out when you work out the mean, but do not rub it out of the table. You get credit for spotting it and saying why you ignored it.", "topic": "working scientifically: spotting an anomaly"}, {"id": "r-s5-6", "level": "medium", "type": "text", "q": "Using those same readings from the 60 cm drop, 33 cm, 34 cm and 90 cm, work out the mean bounce height IGNORING the anomaly.", "answer": "33.5", "accept": ["33.5", "33.50", "33.5cm", "33.5 cm"], "hint": "Throw the odd reading out first. Then you only have two readings left, so divide by 2, not by 3.", "explain": "The answer is 33.5 cm. Drop the anomaly of 90 and you are left with 33 and 34. Add them: 33 + 34 = 67. Divide by the number of readings you actually used, which is 2, not 3: 67 divided by 2 = 33.5 cm. The most common slip is still dividing by 3, which would give 22.3 and is lower than both readings, so it cannot be right.", "topic": "working scientifically: mean with an anomaly removed"}, {"id": "r-s5-7", "level": "medium", "type": "mc", "q": "In an early attempt, Rob dropped a tennis ball from 50 cm onto carpet, then dropped a golf ball from 120 cm onto tiles. Why can this attempt not answer his question?", "options": ["Three things changed at once, so you cannot tell which one changed the bounce", "He did not repeat each test three times", "He should have measured in metres instead of centimetres", "Nothing is wrong, because both balls bounce"], "answer": "Three things changed at once, so you cannot tell which one changed the bounce", "hint": "List everything that is different between the two drops.", "explain": "The answer is that three things changed at once. The ball changed, the drop height changed and the surface changed. If the second bounce is higher, he cannot say the drop height did it, because the golf ball or the hard tiles could just as easily be the reason. To fix it he must keep the ball and the surface the same and change only the drop height. Repeating the test more times would not help, because repeating an unfair test just gives you unfair results again.", "topic": "working scientifically: spotting a flawed method"}, {"id": "r-s5-8", "level": "stretch", "type": "mc", "q": "Rob's mean bounce heights are 22 cm from a 40 cm drop, 33 cm from a 60 cm drop and 44 cm from an 80 cm drop. What is the most sensible prediction for a 100 cm drop?", "options": ["About 55 cm", "About 48 cm", "About 88 cm", "About 100 cm"], "answer": "About 55 cm", "hint": "Look at the size of the jump each time the drop height goes up by 20 cm.", "explain": "The answer is about 55 cm. Every time the drop height goes up by 20 cm, the bounce goes up by 11 cm: 22 to 33 to 44. The next drop height is 100 cm, which is another 20 cm up, so the bounce should be 44 + 11 = 55 cm. About 88 cm would be doubling the last result, which does not match the steady pattern, and 100 cm would mean the ball bounces back to the height it was dropped from, which never happens.", "topic": "working scientifically: predicting from a pattern"}], "e5-fixit": [{"id": "r-e5-1", "level": "easy", "type": "text", "q": "Read this. \"The bus pulled up outside the gym. Two runners got on and shook the rain off their coats. The driver waits for nobody.\" One verb is in the wrong tense. Write that single word exactly as it appears.", "answer": "waits", "accept": ["waits", "\"waits\"", "the driver waits", "driver waits"], "hint": "The rest of it happened in the past. Find the one verb that is not in the past.", "explain": "The answer is waits. The passage uses pulled, got and shook, which are all past tense. Then the last sentence says \"The driver waits for nobody\", and waits is present tense. It should be waited. Read the passage out loud and the odd one jumps out, because your ear notices the change before your eye does.", "topic": "proofreading: spotting a tense slip"}, {"id": "r-e5-2", "level": "easy", "type": "mc", "q": "Read this. \"The lights went out at nine. My mum found a torch in the drawer. We sat in the kitchen until the power comes back.\" Which version fixes the last sentence and changes nothing else?", "options": ["We sat in the kitchen until the power came back.", "We sat in the kitchen until the power comes back.", "We sat in the cold kitchen until the power finally came back.", "We sit in the kitchen until the power came back."], "answer": "We sat in the kitchen until the power came back.", "hint": "The passage is written in the past. Put that last verb into the past too, and stop there.", "explain": "The answer is \"We sat in the kitchen until the power came back.\" The passage uses went, found and sat, which are all past tense, so comes does not match. Came fixes it with a one word change. The second option leaves the slip in place. The third option fixes it but also adds cold and finally, which is material you were not asked to add. The fourth option puts sat into the present, which creates a new error.", "topic": "proofreading: fixing a tense slip"}, {"id": "r-e5-3", "level": "easy", "type": "mc", "q": "Read this. \"Van stopped at the gate. The driver got out and looked at the mud.\" A small word is missing before Van. Which version fixes that and changes nothing else?", "options": ["The van stopped at the gate.", "Van stopped at the gate.", "The old van stopped at the rusty gate.", "The van stops at the gate."], "answer": "The van stopped at the gate.", "hint": "English needs a or the in front of a noun like van. Then check nothing else has moved.", "explain": "The answer is \"The van stopped at the gate.\" The noun van needs an article in front of it. The second option is the original with the error still in it. The third option adds old and rusty, which you were not asked to add. The fourth option adds the article but changes stopped to stops, so it fixes one error and creates another.", "topic": "proofreading: missing article"}, {"id": "r-e5-4", "level": "easy", "type": "text", "q": "This sentence is missing one small word: \"It was worst run I have ever done.\" Write that single missing word.", "answer": "the", "accept": ["the", "The", "\"the\""], "hint": "Say it out loud. Something is missing just before worst.", "explain": "The answer is the. The correct sentence is \"It was the worst run I have ever done.\" Words like best, worst, first and last in front of a noun almost always need the in front of them, because there is only one of them. This is the same missing word you get in \"It was best day I have ever had\".", "topic": "proofreading: article before a superlative"}, {"id": "r-e5-5", "level": "medium", "type": "text", "q": "Read this. \"We got to the beach at six. The tide was out and the sand was hard. We walked to the rocks and back before anyone else arrives.\" The phrase \"before anyone else arrives\" has a tense slip. Write the corrected phrase.", "answer": "before anyone else arrived", "accept": ["before anyone else arrived", "before anyone else arrived.", "anyone else arrived", "arrived"], "hint": "Everything else in the passage happened in the past. Match it.", "explain": "The answer is \"before anyone else arrived\". The passage uses got, was and walked, which are all past tense. Arrives is present tense, so it does not match. Arrived fixes it. Notice that only one word changes. The words before, anyone and else all stay exactly as they were.", "topic": "proofreading: tense agreement across a passage"}, {"id": "r-e5-6", "level": "medium", "type": "mc", "q": "Which of these sentences keeps the same tense all the way through?", "options": ["He locked the door and put the key in his pocket.", "He locked the door and puts the key in his pocket.", "He locks the door and put the key in his pocket.", "He locked the door and is putting the key in his pocket."], "answer": "He locked the door and put the key in his pocket.", "hint": "Check the two verbs in each sentence. Are they both in the past, or is one of them in the present?", "explain": "The answer is \"He locked the door and put the key in his pocket.\" Locked and put are both past tense, so the sentence is consistent. In the second option locked is past but puts is present. In the third option locks is present but put is past. In the fourth option locked is past but is putting is present. A sentence has to stay in one time unless there is a good reason to change.", "topic": "proofreading: spotting a tense slip"}, {"id": "r-e5-7", "level": "medium", "type": "mc", "q": "Read this. \"Alarm went off at six. I made toast and ate it standing up. Bus was already at the stop when I got outside.\" There are two errors, both missing words. Which version fixes both and changes nothing else?", "options": ["The alarm went off at six. I made toast and ate it standing up. The bus was already at the stop when I got outside.", "Alarm went off at six. I made toast and ate it standing up. The bus was already at the stop when I got outside.", "The alarm went off at six. I made hot toast and ate it standing up. The red bus was already at the stop when I got outside.", "The alarm went off at six, I made toast and ate it standing up. The bus was already at the stop when I got outside."], "answer": "The alarm went off at six. I made toast and ate it standing up. The bus was already at the stop when I got outside.", "hint": "Both errors are nouns sitting at the start of a sentence with no a or the in front of them.", "explain": "The answer is the first option. Alarm needs The in front of it, and Bus needs The in front of it. That is two changes for two errors. The second option only fixes one of them. The third fixes both but also adds hot and red, so it changes material it was not asked to touch. The fourth fixes both but joins the first two sentences with a comma, which creates a comma splice that was not there before.", "topic": "proofreading: missing articles across a passage"}, {"id": "r-e5-8", "level": "stretch", "type": "mc", "q": "Read this. \"i left the house at five. The road was empty and the sky was still dark. By the time I reach the bridge my legs were warm. It was longest walk of the week.\" It has three errors: one lower case i, one tense slip, one missing word. Which version fixes all three and changes nothing else?", "options": ["I left the house at five. The road was empty and the sky was still dark. By the time I reached the bridge my legs were warm. It was the longest walk of the week.", "I left the house at five. The road was empty and the sky was still dark. By the time I reach the bridge my legs were warm. It was the longest walk of the week.", "I left the quiet house at five. The road was empty and the black sky was still dark. By the time I reached the old bridge my legs were warm and heavy. It was the longest walk of the week.", "i left the house at five. The road was empty and the sky was still dark. By the time I reached the bridge my legs were warm. It was the longest walk of the week."], "answer": "I left the house at five. The road was empty and the sky was still dark. By the time I reached the bridge my legs were warm. It was the longest walk of the week.", "hint": "Make three passes. Capital letters. Tense. Missing words. Then check nothing else has moved.", "explain": "The answer is the first option. The three fixes are: i becomes I, reach becomes reached, and the is added before longest walk. The second option leaves the tense slip reach in place, which is the easiest one to walk straight past. The third option fixes all three but also adds quiet, black, old and heavy, so it changes material it was not asked to touch. The fourth option leaves the lower case i.", "topic": "proofreading: multi-error correction with an over-correction trap"}], "e6-apostrophes2": [{"id": "r-e6-1", "level": "easy", "type": "mc", "q": "In which of these is the apostrophe standing in for missing letters, rather than showing ownership?", "options": ["can't", "the girl's coat", "the teacher's desk", "the cat's bowl"], "answer": "can't", "hint": "In one of these, the apostrophe is standing in for letters that have been taken out.", "explain": "The answer is can't. It is cannot squashed together, and the apostrophe marks the missing letters. The other three all show ownership: the coat belongs to the girl, the desk belongs to the teacher, the bowl belongs to the cat.", "topic": "apostrophes: contraction versus possession"}, {"id": "r-e6-2", "level": "easy", "type": "text", "q": "A scarf belongs to one girl. Write the phrase using an apostrophe. Start with the word the.", "answer": "the girl's scarf", "accept": ["the girl's scarf", "girl's scarf", "the girl’s scarf", "girl’s scarf"], "hint": "Owner word is girl. Does girl end in s? No. So add apostrophe then s.", "explain": "The answer is the girl's scarf. Step one, the owner word is girl. Step two, girl does not end in s. Step three, so add apostrophe then s, giving girl's. The word scarf never gets an apostrophe, because it is the thing being owned, not the owner.", "topic": "apostrophes: singular possession"}, {"id": "r-e6-3", "level": "easy", "type": "mc", "q": "Several bowls belong to several dogs. Which version is correct?", "options": ["the dogs' bowls", "the dog's bowls", "the bowls' dogs", "the dogs bowls"], "answer": "the dogs' bowls", "hint": "The owner word is dogs, plural. It already ends in s, so where does the apostrophe go?", "explain": "The answer is the dogs' bowls. The owner word is dogs, because more than one dog owns them, and dogs already ends in s, so you add the apostrophe only, after the s. Dog's bowls would mean one dog with several bowls. Bowls' puts the apostrophe on the thing being owned, and the last option has no apostrophe at all, so it shows no ownership.", "topic": "apostrophes: plural possession, plural ends in s"}, {"id": "r-e6-4", "level": "easy", "type": "mc", "q": "The coats belong to all the men. Which version is correct?", "options": ["the men's coats", "the mens' coats", "the mens coats", "the man's coats"], "answer": "the men's coats", "hint": "Men is already the plural of man. Check whether it ends in s.", "explain": "The answer is the men's coats. The owner word is men, which is already plural but does not end in s, so it follows the same rule as a single owner: add apostrophe then s. Mens is not a word, so mens' and mens are both wrong. The man's coats would mean one man, which is not what was described.", "topic": "apostrophes: irregular plural, men"}, {"id": "r-e6-5", "level": "medium", "type": "text", "q": "One club owns one badge. Complete this with an apostrophe: the ___ badge. Write only the missing word.", "answer": "club's", "accept": ["club's", "the club's", "club’s", "the club’s"], "hint": "Owner word is club. Does club end in s? No.", "explain": "The answer is club's. The owner word is club, which does not end in s, so you add apostrophe then s. Be careful here. Clubs with no apostrophe means more than one club, and clubs' would mean several clubs sharing one badge. There is only one club, so it is club's.", "topic": "apostrophes: singular collective noun"}, {"id": "r-e6-6", "level": "medium", "type": "mc", "q": "A depot has several buses. The windows belong to all of them. Which version is correct?", "options": ["the buses' windows", "the buse's windows", "the buses windows", "the bus's windows"], "answer": "the buses' windows", "hint": "The plural of bus is buses. That word already ends in s.", "explain": "The answer is the buses' windows. The owner word is buses, the plural of bus, and it already ends in s, so the apostrophe goes after the s and no extra s is added. Buse's is not a word. Buses windows has no apostrophe at all. Bus's windows would be right for one single bus, but there are several.", "topic": "apostrophes: plural possession with an es plural"}, {"id": "r-e6-7", "level": "medium", "type": "mc", "q": "Your family has one cat. Which sentence uses every apostrophe correctly?", "options": ["It's late, and the cat's bowl is still full.", "Its late, and the cats bowl is still full.", "It's late, and the cats' bowl is still full.", "Its' late, and the cat's bowl is still full."], "answer": "It's late, and the cat's bowl is still full.", "hint": "One apostrophe here is doing the contraction job and one is doing the ownership job. Check both.", "explain": "The answer is the first option. It's is a contraction of it is, so the apostrophe marks the missing letter. Cat's shows the bowl belongs to one cat, and cat does not end in s, so it takes apostrophe then s. The second option has no apostrophes at all. The third uses cats', which would mean more than one cat. The fourth writes Its', which is never a word.", "topic": "apostrophes: contraction and possession in one sentence"}, {"id": "r-e6-8", "level": "stretch", "type": "mc", "q": "There is one school, several teachers and several women. Which sentence uses every apostrophe correctly?", "options": ["The school's gates were locked, so the teachers' cars stayed outside and the women's meeting started late.", "The schools gates were locked, so the teacher's cars stayed outside and the womens meeting started late.", "The school's gates were locked, so the teachers cars stayed outside and the women's meeting started late.", "The schools' gates were locked, so the teachers' cars stayed outside and the womens' meeting started late."], "answer": "The school's gates were locked, so the teachers' cars stayed outside and the women's meeting started late.", "hint": "Do the three owners one at a time. School, singular. Teachers, plural ending in s. Women, plural not ending in s.", "explain": "The answer is the first option. School is one owner not ending in s, so school's. Teachers is a plural ending in s, so teachers'. Women is a plural that does not end in s, so women's. The second option drops apostrophes and treats several teachers as one. The third leaves teachers with no apostrophe at all. The fourth uses schools' for a single school and womens', which is not a word.", "topic": "apostrophes: three owner types in one sentence"}], "e7-wordclasses": [{"id": "r-e7-1", "level": "easy", "type": "text", "q": "Write the noun in this sentence: The kettle boiled.", "answer": "kettle", "accept": ["kettle", "the kettle", "\"kettle\""], "hint": "Which word names a thing you could pick up?", "explain": "The answer is kettle. It names an object, so it is a noun. A quick check is whether you can put the or a in front of it, and the kettle works fine. Boiled is the verb, because it is what happened and it can change tense to boils.", "topic": "word classes: identifying the noun"}, {"id": "r-e7-2", "level": "easy", "type": "mc", "q": "In the sentence \"The gate swung shut in the wind\", which word is a verb?", "options": ["swung", "gate", "shut", "wind"], "answer": "swung", "hint": "Which word can you put into a different tense?", "explain": "The answer is swung. Put it into a different time and it changes: the gate swings, the gate will swing. That test only works on verbs. Gate and wind are nouns, because they name things. Shut here tells you how far the gate swung, so it is not carrying the action.", "topic": "word classes: identifying the verb"}, {"id": "r-e7-3", "level": "easy", "type": "mc", "q": "In the sentence \"The kettle boiled quickly and then clicked off\", which word is the adverb?", "options": ["quickly", "boiled", "kettle", "clicked"], "answer": "quickly", "hint": "Which word tells you how the boiling happened, and could be removed without breaking the sentence?", "explain": "The answer is quickly. It tells you how the kettle boiled, so it is changing a verb, and that is what an adverb does. Boiled and clicked are both verbs, because both can change tense to boils and clicks. Kettle is a noun. Remove quickly and the sentence still stands, which proves it is an add-on and not the verb.", "topic": "word classes: identifying the adverb"}, {"id": "r-e7-4", "level": "easy", "type": "mc", "q": "You think a word might be a verb. Which check settles it?", "options": ["You can change it to show a different time, so jumped becomes jumps.", "It ends in the letters ly.", "It is the longest word in the sentence.", "It comes straight after the word the."], "answer": "You can change it to show a different time, so jumped becomes jumps.", "hint": "Only one class of word has tenses.", "explain": "The answer is the tense test. Only verbs change to show past, present and future. Ending in ly is a clue for adverbs, not verbs. Length proves nothing. A word straight after the is usually a noun or an adjective, so that is a different test altogether.", "topic": "word classes: the tense test"}, {"id": "r-e7-5", "level": "medium", "type": "mc", "q": "In the sentence \"The narrow lane flooded badly\", which word is the adjective?", "options": ["narrow", "lane", "flooded", "badly"], "answer": "narrow", "hint": "Which word is describing a noun, rather than describing an action?", "explain": "The answer is narrow. It sits next to the noun lane and tells you what the lane is like, so it changes a noun, which is the adjective's job. Lane is that noun. Flooded is the verb, because it is the action and it can change tense to floods. Badly tells you how the flooding happened, so it changes a verb and is an adverb.", "topic": "word classes: identifying the adjective"}, {"id": "r-e7-6", "level": "medium", "type": "text", "q": "In the sentence \"The team trained hard every night\", write the adverb.", "answer": "hard", "accept": ["hard", "\"hard\""], "hint": "It has no ly on the end. Ask which word tells you how they trained.", "explain": "The answer is hard. It tells you how they trained, and trained is the verb, so hard is changing a verb and is therefore an adverb. Remove it and \"The team trained every night\" still works, which proves it is an add-on. This one catches people out because there is no ly, but ly is only a clue, never a rule.", "topic": "word classes: adverb with no ly in context"}, {"id": "r-e7-7", "level": "medium", "type": "mc", "q": "Take the sentence \"The engine started easily\" and delete the word easily. What happens, and what does it prove?", "options": ["The sentence still works as The engine started, which shows easily was an add-on and not the verb.", "The sentence collapses, which shows easily was the verb.", "The sentence turns into a question.", "The sentence loses its noun."], "answer": "The sentence still works as The engine started, which shows easily was an add-on and not the verb.", "hint": "Try deleting started instead and compare what happens.", "explain": "The answer is the first option. The engine started is a complete sentence, so easily was not carrying it. Now try deleting started instead: The engine easily is not a sentence at all, because the action has gone. That is the remove test. Whatever you cannot delete is doing the verb's job, and whatever you can delete is usually an adverb or an adjective.", "topic": "word classes: the remove test"}, {"id": "r-e7-8", "level": "stretch", "type": "mc", "q": "In the sentence \"The early bus left early\", the word early appears twice. Which statement is correct?", "options": ["The first early is an adjective describing bus, and the second early is an adverb describing when it left.", "Both are adjectives, because early is always an adjective.", "Both are adverbs, because early is always an adverb.", "The first is an adverb and the second is an adjective."], "answer": "The first early is an adjective describing bus, and the second early is an adverb describing when it left.", "hint": "Ask what each one is attached to. One sits next to a noun. One sits next to a verb.", "explain": "The answer is the first option. The first early sits in front of the noun bus and tells you which bus it is, so it is doing an adjective's job. The second early sits after the verb left and tells you when the leaving happened, so it is doing an adverb's job. This is why you work out what a word is doing rather than memorising a list. The same word can belong to different classes in different sentences.", "topic": "word classes: same word, different class"}], "e8-write-plan": [{"id": "r-e8-1", "level": "easy", "type": "mc", "q": "You have written down your opening image and your decided ending. Which two lines are still missing from a complete two minute plan?", "options": ["The two middles", "A title and a date", "Two more endings", "A list of characters"], "answer": "The two middles", "hint": "The plan has four lines in total, and you have written two of them.", "explain": "The answer is the two middles. The four lines are opening image, middle 1, middle 2 and decided ending, with the proofread list written underneath. The middles are the two single moments you will actually develop into paragraphs, so a plan without them tells you where you start and where you finish but nothing about the journey.", "topic": "timed writing: the four part plan"}, {"id": "r-e8-2", "level": "easy", "type": "text", "q": "You are given a 30 minute writing task and you plan it in two minutes. How many minutes should you keep back at the end to check your work? Write the number.", "answer": "3", "accept": ["3", "three", "3 minutes", "three minutes", "3 mins"], "hint": "It is a small number, but you protect it no matter how much you still want to write.", "explain": "The answer is 3. Three minutes is enough to catch capital letters, full stops, tense slips and comma splices, which are the errors that cost the most and take the least time to fix. You protect that time even if the piece feels unfinished, because a finished piece full of errors scores lower than a slightly shorter piece that is clean.", "topic": "timed writing: protecting proofreading time"}, {"id": "r-e8-3", "level": "easy", "type": "mc", "q": "You have 20 minutes to write a story. About how long should the plan take?", "options": ["About 2 minutes", "No time at all", "About 8 minutes", "About 12 minutes"], "answer": "About 2 minutes", "hint": "Long enough to decide where you are going, short enough to leave real writing time.", "explain": "The answer is about 2 minutes. That is enough to fix an opening image, two middles and an ending, which is all you actually need. No planning at all leaves you with no ending. Eight or twelve minutes eats the writing time, and a plan that long is really the piece written twice.", "topic": "timed writing: how long to plan"}, {"id": "r-e8-4", "level": "easy", "type": "mc", "q": "Why do you decide the ending before you write the first sentence?", "options": ["So every sentence is heading somewhere and you never run out of road.", "So the ending can be the longest part of the piece.", "So you can surprise yourself when you get there.", "So you can write the ending twice and pick the better one."], "answer": "So every sentence is heading somewhere and you never run out of road.", "hint": "Think about why you would want to know the destination before you set off.", "explain": "The answer is the first option. If you know where you are going, every sentence can point at it, and you never hit the last two minutes with no idea how to stop. The ending is usually short, not long. Surprising yourself sounds good but usually means running out of road. Writing two endings wastes time you do not have.", "topic": "timed writing: why the ending is decided first"}, {"id": "r-e8-5", "level": "medium", "type": "mc", "q": "Which of these is a strong opening image for a description called The empty swimming pool?", "options": ["A single armband lying on the bottom of the deep end, in about an inch of green water.", "Swimming pools are found in most towns and are used by lots of people.", "I am going to describe an empty swimming pool and what it was like.", "It was an ordinary afternoon and nothing much was happening."], "answer": "A single armband lying on the bottom of the deep end, in about an inch of green water.", "hint": "An image is something the reader can actually see. Which one could you photograph?", "explain": "The answer is the first option. It is one specific thing the reader can see, and it puts them at the edge of the pool straight away. The second option is general information and shows the reader nothing. The third announces what you are about to do instead of doing it. The fourth opens with nothing happening, which gives the reader no reason to carry on.", "topic": "timed writing: choosing an opening image"}, {"id": "r-e8-6", "level": "medium", "type": "mc", "q": "Which of these middles can actually be developed into a full paragraph?", "options": ["The lift doors open on the wrong floor and the corridor lights are already off.", "Lots of scary things happened in the building.", "The whole day was strange from start to finish.", "It was frightening and I did not like it."], "answer": "The lift doors open on the wrong floor and the corridor lights are already off.", "hint": "Ask whether you could write six sentences about just that one thing.", "explain": "The answer is the first option. One small concrete moment gives you somewhere to go: what you can see down the corridor, what you can hear, whether you step out. The other three are summaries. A summary tells the reader that something happened without showing any of it, and there is nothing left to add, so it dies after one sentence.", "topic": "timed writing: what makes a developed middle"}, {"id": "r-e8-7", "level": "medium", "type": "mc", "q": "In the two minute plan, what is written underneath the four lines?", "options": ["The proofread list, naming the errors you will hunt for at the end.", "A word count target.", "A list of adjectives you want to use.", "The title written out again neatly."], "answer": "The proofread list, naming the errors you will hunt for at the end.", "hint": "It is the list you will use in the last three minutes.", "explain": "The answer is the proofread list. Writing it during the plan matters, because at the end you will be tired and short of time, and a written list stops you drifting. A good list names the errors you personally make, such as capital letters, full stops, tense staying in the past and no comma splices. A word count target, an adjective list and a neat title do nothing for your marks.", "topic": "timed writing: the proofread list"}, {"id": "r-e8-8", "level": "stretch", "type": "mc", "q": "You have 25 minutes. You planned for 2 minutes and you have been writing for 20. You are halfway through a paragraph and there are 3 minutes left. What is the best move?", "options": ["Finish the sentence you are on, then stop and spend the rest of the time checking for errors.", "Keep writing until the time runs out, because more writing means more marks.", "Start a new paragraph quickly so the piece feels longer.", "Cross out your ending and write a better one."], "answer": "Finish the sentence you are on, then stop and spend the rest of the time checking for errors.", "hint": "The last three minutes are for fixing what is broken, not for adding more or improving what is not broken.", "explain": "The answer is the first option. Finishing the sentence you are on stops the piece ending mid air, and then the pen goes down. Writing until the clock stops throws away free marks, because a comma splice takes four seconds to fix and costs more than one extra sentence gains. A rushed new paragraph adds errors. Replacing the ending in the last three minutes is how a decent piece turns into a mess.", "topic": "timed writing: what to do in the proofread window"}], "h3-century-again": [{"id": "r-h3-1", "level": "easy", "type": "mc", "q": "Which century is the year 1500 in?", "options": ["The 14th century", "The 15th century", "The 16th century", "The 17th century"], "answer": "The 15th century", "hint": "It ends in 00, so it is the last year of a century, not the first year of one.", "explain": "The answer is the 15th century. The 15th century runs from 1401 to 1500, so 1500 is its final year. Do not use the add one rule here, because that rule is only for years that do not end in 00. The 16th century then starts with 1501. It is the same rule as 1800 and 1900, just with smaller numbers.", "topic": "chronology: years ending in 00"}, {"id": "r-h3-2", "level": "easy", "type": "mc", "q": "Which years does the 19th century cover?", "options": ["1800 to 1899", "1801 to 1900", "1900 to 1999", "1801 to 1899"], "answer": "1801 to 1900", "hint": "Every century starts on a year ending in 01 and finishes on a year ending in 00.", "explain": "The answer is 1801 to 1900. Because the 1st century was years 1 to 100, every century since then starts on a 01 and finishes on a 00. So the 19th century opens with 1801 and closes with 1900. The option 1800 to 1899 is the trap most people fall into, but 1800 belongs to the 18th century and 1900 belongs to the 19th.", "topic": "chronology: the span of a named century"}, {"id": "r-h3-3", "level": "easy", "type": "text", "q": "Which year is the FIRST year of the 19th century? Write the year.", "answer": "1801", "accept": ["1801", "1801.", "in 1801", "the year 1801"], "hint": "A century always starts on a year ending in 01, never on a year ending in 00.", "explain": "The answer is 1801. Every century starts on a 01. The 18th century finished with 1800, so the very next year, 1801, is the first year of the 19th century. Write the pair down together and it stops being confusing: 1800 is 18th century, 1801 is 19th century.", "topic": "chronology: the year after a 00 boundary"}, {"id": "r-h3-4", "level": "easy", "type": "text", "q": "Which year is the LAST year of the 18th century? Write the year.", "answer": "1800", "accept": ["1800", "1800.", "in 1800", "the year 1800"], "hint": "Write out the span of the 18th century first, then take the second number.", "explain": "The answer is 1800. The 18th century runs from 1701 to 1800, so 1800 is its last year. It is easy to assume 1800 must be 19th century because it starts with 18, but it does not. A year ending in 00 is always the final year of the century, not the first year of the next one.", "topic": "chronology: reading a century span backwards"}, {"id": "r-h3-5", "level": "medium", "type": "mc", "q": "Which of these years is NOT in the 19th century?", "options": ["1801", "1850", "1900", "1901"], "answer": "1901", "hint": "Write out the span of the 19th century first, from its first year to its last year. Then check each option against it.", "explain": "The answer is 1901. The 19th century runs from 1801 to 1900, so 1801 is its first year, 1850 sits in the middle, and 1900 is its last year. 1901 falls just outside, and it is the first year of the 20th century. The mistake is to pick 1900, because it starts with 19 and looks like it belongs to the next one. It does not. A year ending in 00 stays in the century it is finishing.", "topic": "chronology: the 00 boundary trap"}, {"id": "r-h3-6", "level": "medium", "type": "mc", "q": "Which of these years is NOT in the 17th century?", "options": ["1601", "1650", "1700", "1701"], "answer": "1701", "hint": "Same job as before. Write the span of the 17th century down first, then test each option.", "explain": "The answer is 1701. The 17th century runs from 1601 to 1700, so 1601 is its first year, 1650 sits in the middle and 1700 is its last year. 1701 is outside it, and it is the first year of the 18th century. This is exactly the same shape of question as the 19th century one, just with different numbers, and the same rule cracks it: a year ending in 00 is the last year of its century.", "topic": "chronology: the 00 boundary trap"}, {"id": "r-h3-7", "level": "medium", "type": "text", "q": "Which century is the year 1601 in? Write it like this: 5th", "answer": "17th", "accept": ["17th", "17", "seventeenth", "17th century", "the 17th century", "seventeenth century"], "hint": "The last two digits are 01, not 00, so use the cover and add one method.", "explain": "The answer is 17th. Cover the 01 and you are left with 16. The last two digits are not 00, so add one, giving 17. The 17th century runs from 1601 to 1700, and 1601 is its very first year. Compare it with 1600, which ends in 00 and is therefore the last year of the 16th century.", "topic": "chronology: year to century"}, {"id": "r-h3-8", "level": "stretch", "type": "mc", "q": "Two students argue. Ali says the year 1600 is in the 16th century. Ben says it is in the 17th century. Who is right, and why?", "options": ["Ali, because a year ending in 00 is the last year of the century that matches its own hundreds digit.", "Ben, because 1600 starts with 16, so you add one and get 17.", "Ali, because you always add one to the first two digits of any year.", "Ben, because the 17th century runs from 1600 to 1699."], "answer": "Ali, because a year ending in 00 is the last year of the century that matches its own hundreds digit.", "hint": "Write out the span of the 16th century. Where does it stop?", "explain": "The answer is Ali. The 16th century runs from 1501 to 1600, so 1600 is its last year. The add one rule is for years that do not end in 00, so applying it here gives the wrong century, which is Ben's mistake. The fourth option gets the span wrong as well, because the 17th century runs from 1601 to 1700. Same rule, one century earlier than the 1800 case.", "topic": "chronology: years ending in 00"}], "h4-bcad": [{"id": "r-h4-1", "level": "easy", "type": "mc", "q": "Which is earlier in time, 800 BC or 300 BC?", "options": ["800 BC", "300 BC", "They are the same year", "You cannot tell without more information"], "answer": "800 BC", "hint": "BC is a countdown towards year 1. Which number comes earlier in a countdown?", "explain": "The answer is 800 BC. BC years count backwards towards year 1, so the bigger the number, the further back you are. 800 BC is 500 years before 300 BC. It feels wrong at first because 300 looks smaller than 800, but in BC the order flips.", "topic": "BC and AD: ordering two BC dates"}, {"id": "r-h4-2", "level": "easy", "type": "mc", "q": "Which is earlier in time, AD 150 or AD 900?", "options": ["AD 150", "AD 900", "They are the same year", "You cannot tell without more information"], "answer": "AD 150", "hint": "AD counts forwards, the normal way round.", "explain": "The answer is AD 150. AD years count forwards from year 1, so a smaller number is earlier, exactly as you would expect. Hold the two rules side by side: in BC the bigger number is earlier, and in AD the smaller number is earlier.", "topic": "BC and AD: ordering two AD dates"}, {"id": "r-h4-3", "level": "easy", "type": "mc", "q": "In BC dates, what does a smaller number mean?", "options": ["Closer to year 1", "Further back in time", "Nothing, the size of the number does not matter", "That the date is only a guess"], "answer": "Closer to year 1", "hint": "Picture a countdown running down to year 1.", "explain": "The answer is closer to year 1. BC is a countdown, so 3000 BC is much older than 300 BC, which is older than 30 BC. Every step towards a smaller BC number brings you closer to year 1 and to the start of the AD count.", "topic": "BC and AD: the direction of BC counting"}, {"id": "r-h4-4", "level": "easy", "type": "text", "q": "Which came first, 20 BC or AD 5? Write BC or AD.", "answer": "BC", "accept": ["BC", "bc", "B.C.", "20 BC", "20BC", "20 bc"], "hint": "Everything BC happened before everything AD.", "explain": "The answer is BC. Every BC year comes before every AD year, no matter how the numbers look. 20 BC is before AD 5 even though 20 is a bigger number than 5, because the two dates sit on opposite sides of year 1.", "topic": "BC and AD: comparing across the boundary"}, {"id": "r-h4-5", "level": "medium", "type": "text", "q": "How many years are there between 400 BC and 150 BC? Write the number only.", "answer": "250", "accept": ["250", "250 years", "two hundred and fifty"], "hint": "Both dates are BC, so you are not crossing year 1. Just find the difference.", "explain": "The answer is 250. Both dates are on the same side of year 1, so you subtract: 400 minus 150 is 250. There is no year zero problem here, because you never cross the boundary. Remember the direction as well: 400 BC is the earlier date, so 150 BC is 250 years later.", "topic": "BC and AD: gap between two BC dates"}, {"id": "r-h4-6", "level": "medium", "type": "text", "q": "A town wall was built in AD 120 and knocked down in AD 495. How many years stood between the two? Write the number only.", "answer": "375", "accept": ["375", "375 years"], "hint": "Both dates are AD, so subtract the smaller from the larger.", "explain": "The answer is 375. Both dates are AD, so you subtract: 495 minus 120 is 375. No boundary is crossed, so there is no complication about year zero. Take off 100 to get 395, then take off the last 20 to get 375.", "topic": "BC and AD: gap between two AD dates"}, {"id": "r-h4-7", "level": "medium", "type": "mc", "q": "A temple was built in 40 BC and burnt down in AD 60. Roughly how many years passed between the two?", "options": ["20 years", "40 years", "60 years", "100 years"], "answer": "100 years", "hint": "Measure from 40 BC to year 1, then from year 1 to AD 60, then add the two parts.", "explain": "The answer is 100 years. The gap crosses year 1, so split it in two. From 40 BC to year 1 is 40 years. From year 1 to AD 60 is 60 years. 40 plus 60 is 100. Subtracting to get 20 is the classic mistake, and it happens when people forget the two dates are on opposite sides of the boundary. Because there is no year zero, an exact count gives 99, but 100 is the standard answer.", "topic": "BC and AD: gap across the boundary"}, {"id": "r-h4-8", "level": "stretch", "type": "mc", "q": "Which century is the year 250 BC in?", "options": ["The 2nd century BC", "The 3rd century BC", "The 25th century BC", "The 3rd century AD"], "answer": "The 3rd century BC", "hint": "Counting backwards from year 1, the first hundred years are 100 BC to 1 BC, the next hundred are 200 BC to 101 BC, and so on.", "explain": "The answer is the 3rd century BC. Counting backwards from year 1, the 1st century BC runs from 100 BC to 1 BC, the 2nd century BC runs from 200 BC to 101 BC, and the 3rd century BC runs from 300 BC to 201 BC. 250 BC sits inside that third block. It is not AD at all, because it is before year 1.", "topic": "BC and AD: centuries in BC"}], "h5-timeline": [{"id": "r-h5-1", "level": "easy", "type": "mc", "q": "Which came first in Britain, the Normans or the Victorians?", "options": ["The Normans", "The Victorians", "They overlapped", "Neither, they are the same period"], "answer": "The Normans", "hint": "Put a date on each one first. One starts in 1066 and one starts in 1837.", "explain": "The answer is the Normans. The Norman period begins in 1066, when William won the Battle of Hastings. The Victorian period does not begin until 1837, which is more than 750 years later. In between come the medieval period, the Tudors, the Stuarts and the Georgians.", "topic": "British timeline: basic ordering"}, {"id": "r-h5-2", "level": "easy", "type": "mc", "q": "Who ruled in England immediately after the Anglo-Saxons?", "options": ["The Normans", "The Romans", "The Tudors", "The Georgians"], "answer": "The Normans", "hint": "Think about who won in 1066 and who lost.", "explain": "The answer is the Normans. The Anglo-Saxon period ran from roughly AD 410 to 1066, and it ended when William of Normandy beat the Anglo-Saxon king Harold at the Battle of Hastings. The Romans came before the Anglo-Saxons, not after. The Tudors start in 1485 and the Georgians in 1714, both hundreds of years later.", "topic": "British timeline: what came before the Normans"}, {"id": "r-h5-3", "level": "easy", "type": "text", "q": "In which year did William of Normandy win the Battle of Hastings? Write the year.", "answer": "1066", "accept": ["1066", "in 1066", "1066."], "hint": "It is probably the single most repeated date in British history.", "explain": "The answer is 1066. William of Normandy defeated King Harold and became king of England. That date is the dividing line between the Anglo-Saxon period and the Norman period, so it is worth knowing without having to think. The Domesday Book came twenty years later, in 1086.", "topic": "British timeline: the Norman conquest"}, {"id": "r-h5-4", "level": "easy", "type": "mc", "q": "In which year did Queen Victoria's reign end?", "options": ["1901", "1837", "1914", "1603"], "answer": "1901", "hint": "Her reign ran for 64 years, and it started in 1837.", "explain": "The answer is 1901. Victoria became queen in 1837 and reigned until 1901, which is 64 years. 1914 is the start of the First World War, and 1603 is the end of the Tudor period and the start of the Stuarts.", "topic": "British timeline: the Victorian period"}, {"id": "r-h5-5", "level": "medium", "type": "text", "q": "Which century is the year 1837 in? Write it like this: 5th", "answer": "19th", "accept": ["19th", "19", "nineteenth", "19th century", "the 19th century", "nineteenth century"], "hint": "Cover the last two digits and add one.", "explain": "The answer is 19th. Cover the 37 and you are left with 18, and 18 plus 1 is 19. The 19th century runs from 1801 to 1900, so 1837 sits inside it. That means Queen Victoria came to the throne in the 19th century.", "topic": "British timeline: date to century"}, {"id": "r-h5-6", "level": "medium", "type": "mc", "q": "The Tudor period began in 1485 and ended in 1603. How many years did it last?", "options": ["118", "108", "128", "218"], "answer": "118", "hint": "Both dates are AD, so subtract the earlier from the later.", "explain": "The answer is 118. Both dates are AD, so you subtract: 1603 minus 1485. Take 1400 off 1603 to get 203, then take off the remaining 85 to get 118. So the whole Tudor period, from Henry VII to the death of Elizabeth I, lasted a little over a century.", "topic": "British timeline: calculating a gap"}, {"id": "r-h5-7", "level": "medium", "type": "mc", "q": "The Great Fire of London happened in 1666. Which royal family was on the throne?", "options": ["The Stuarts", "The Tudors", "The Normans", "The Victorians"], "answer": "The Stuarts", "hint": "Check which period contains the year 1666. The Stuarts ran from 1603 to 1714.", "explain": "The answer is the Stuarts. The Stuart period ran from 1603 to 1714, so 1666 falls inside it. The king at the time was Charles II. The Tudors had ended in 1603, the Normans were six hundred years earlier, and the Victorians did not begin until 1837.", "topic": "British timeline: placing an event in a period"}, {"id": "r-h5-8", "level": "stretch", "type": "mc", "q": "Put these four periods in order, earliest first: Stuarts, Anglo-Saxons, Georgians, Tudors.", "options": ["Anglo-Saxons, Tudors, Stuarts, Georgians", "Anglo-Saxons, Stuarts, Tudors, Georgians", "Tudors, Anglo-Saxons, Stuarts, Georgians", "Anglo-Saxons, Tudors, Georgians, Stuarts"], "answer": "Anglo-Saxons, Tudors, Stuarts, Georgians", "hint": "Write a start date next to each one before you sort anything: about AD 410, 1485, 1603, 1714.", "explain": "The answer is Anglo-Saxons, Tudors, Stuarts, Georgians. Put a date on each before you sort them. Anglo-Saxons from about AD 410, Tudors from 1485, Stuarts from 1603, Georgians from 1714. Once the dates are written down the order is obvious. Sorting by name alone is how people end up swapping the Tudors and the Stuarts.", "topic": "British timeline: ordering periods by anchor date"}], "g5-sixfig": [{"id": "r-g5-1", "level": "easy", "type": "text", "q": "A car park is in the square directly NORTH of square 4218. Which four figure grid square is the car park in?", "answer": "4219", "accept": ["4219", "42 19"], "hint": "North means up the map, so the northing goes up by one. The easting does not change.", "explain": "The answer is 4219. The starting square is 4218, so the easting is 42 and the northing is 18. Moving north means moving up the map, so the northing goes up by one, from 18 to 19. The easting stays at 42, because you have not moved left or right. That gives 4219.", "topic": "grid references: finding a square from a description"}, {"id": "r-g5-2", "level": "easy", "type": "text", "q": "A barn is in the square directly EAST of square 3651. Which four figure grid square is the barn in?", "answer": "3751", "accept": ["3751", "37 51"], "hint": "East means to the right, so the easting goes up by one. The northing does not change.", "explain": "The answer is 3751. The starting square is 3651, so the easting is 36 and the northing is 51. Moving east means moving right across the map, so the easting goes up by one, from 36 to 37. The northing stays at 51, because you have not moved up or down. That gives 3751.", "topic": "grid references: finding a square from a description"}, {"id": "r-g5-3", "level": "easy", "type": "mc", "q": "A mast stands in the square directly WEST of square 2874. Which four figure grid square is the mast in?", "options": ["2774", "2974", "2873", "2875"], "answer": "2774", "hint": "West means to the left, so the easting goes DOWN by one. The northing does not change.", "explain": "The answer is 2774. The starting square is 2874, so the easting is 28 and the northing is 74. West means left, so the easting drops by one, from 28 to 27, and the northing stays at 74. The option 2974 is one square east instead of west. 2873 is one square south and 2875 is one square north, so both of those changed the wrong half of the reference.", "topic": "grid references: finding a square from a description"}, {"id": "r-g5-4", "level": "easy", "type": "mc", "q": "In a six figure grid reference, what do the first three figures tell you?", "options": ["How far east you are, using the easting line and then the tenths", "How far north you are, using the northing line and then the tenths", "How high the land is above sea level", "How big the grid square is"], "answer": "How far east you are, using the easting line and then the tenths", "hint": "Along the corridor, then up the stairs. Which one comes first?", "explain": "The answer is that the first three figures are the eastings. The first two are the easting line and the third is the number of tenths east inside the square. The last three figures are the northings in the same way. Eastings always come first, and swapping the two halves round points at a completely different place.", "topic": "grid references: eastings before northings"}, {"id": "r-g5-5", "level": "medium", "type": "text", "q": "A shop is at 486 235. Which four figure grid square is the shop in?", "answer": "4823", "accept": ["4823", "48 23"], "hint": "Cross off the third figure and the sixth figure. What is left?", "explain": "The answer is 4823. In a six figure reference the third and sixth figures are the tenths. Cross them off and 486 235 becomes 48 and 23. So the square is 4823. The 6 and the 5 only tell you where the shop sits inside that square.", "topic": "grid references: six figure to four figure"}, {"id": "r-g5-6", "level": "medium", "type": "mc", "q": "A bench is in the square directly SOUTH of square 5140. Which four figure grid square is the bench in?", "options": ["5139", "5141", "5040", "5240"], "answer": "5139", "hint": "South means down the map, so the northing goes down by one. Careful, 40 minus 1 is 39.", "explain": "The answer is 5139. The starting square is 5140, so the easting is 51 and the northing is 40. South means down, so the northing drops by one, from 40 to 39, and the easting stays at 51. The option 5141 goes north instead of south. 5040 and 5240 both change the easting, which is what you do for west and east, not for south.", "topic": "grid references: finding a square from a description"}, {"id": "r-g5-7", "level": "medium", "type": "mc", "q": "A farm is at 204 618. Amy writes it down as 618 204. What has she done wrong?", "options": ["She has written the northings before the eastings", "She has used tenths when she should not have", "She has picked the wrong grid square from the map", "She has written too many figures"], "answer": "She has written the northings before the eastings", "hint": "Compare her answer with the real one. Every digit is there. Look at the order.", "explain": "The answer is that she has swapped the two halves round. The farm is 204 618, so 204 is the easting part and 618 is the northing part. Amy has put the northing part first. Every digit is correct, but the reference now points somewhere completely different. Always go along the corridor before you go up the stairs.", "topic": "grid references: common error, order swapped"}, {"id": "r-g5-8", "level": "stretch", "type": "text", "q": "A hut is in the square that is one square EAST and one square NORTH of square 3355. Which four figure grid square is the hut in?", "answer": "3456", "accept": ["3456", "34 56"], "hint": "Do the two moves one at a time. East changes the easting. North changes the northing.", "explain": "The answer is 3456. Start with 3355, so the easting is 33 and the northing is 55. One square east adds one to the easting, so 33 becomes 34. One square north adds one to the northing, so 55 becomes 56. Put them back together, eastings first, and you get 3456. Doing the two moves separately stops you changing the wrong half.", "topic": "grid references: finding a square from a description"}], "g6-scale": [{"id": "r-g6-1", "level": "easy", "type": "mc", "q": "On a map, 2 cm stands for 1 km. A path measures 6 cm. How long is it on the ground?", "options": ["3 km", "6 km", "12 km", "1.5 km"], "answer": "3 km", "hint": "How many lots of 2 cm fit into 6 cm? Each lot is worth 1 km.", "explain": "The answer is 3 km. Three lots of 2 cm fit into 6 cm, and each lot stands for 1 km, so the path is 3 km long. Another way to say it is that the kilometres are always half the centimetres at this scale, and half of 6 is 3.", "topic": "map scale: whole number conversion"}, {"id": "r-g6-2", "level": "easy", "type": "text", "q": "The scale is 2 cm to 1 km. A wall measures 8 cm on the map. How many km is that? Write just the number.", "answer": "4", "accept": ["4", "4 km", "4km", "4.0"], "hint": "Halve the number of centimetres.", "explain": "The answer is 4 km. Divide the centimetres by 2, so 8 divided by 2 is 4. Four lots of 2 cm fit into 8 cm, and each lot is 1 km. The answer can never be bigger than the number of centimetres at this scale.", "topic": "map scale: whole number conversion"}, {"id": "r-g6-3", "level": "easy", "type": "text", "q": "The scale is 2 cm to 1 km. A lane measures 7 cm on the map. How many km is that? Write just the number.", "answer": "3.5", "accept": ["3.5", "3.5 km", "3.5km", "3 1/2", "three and a half"], "hint": "Half of 6 is 3, and half of the 1 left over is 0.5. Add them.", "explain": "The answer is 3.5 km. Divide 7 by 2. Half of 6 is 3, and half of the remaining 1 is 0.5, so 3 plus 0.5 is 3.5. Any odd number of centimetres always gives an answer ending in point 5. Writing 35 would be ten times too big.", "topic": "map scale: distance with a decimal answer"}, {"id": "r-g6-4", "level": "easy", "type": "mc", "q": "A track measures 11 cm on a map where 2 cm stands for 1 km. Before you divide anything, which of these is the only sensible size for the answer?", "options": ["About 5 or 6 km", "About 55 km", "About 22 km", "About 0.55 km"], "answer": "About 5 or 6 km", "hint": "10 cm would be 5 km. The track is a bit longer than 10 cm.", "explain": "It has to be about 5 or 6 km. 10 cm on this map is 5 km, and 11 cm is a little more than 10 cm, so the answer is a little more than 5 km. 55 km is ten times too big. 22 km comes from multiplying by 2 instead of dividing. 0.55 km is ten times too small. Doing this check first means a wrong decimal point can never get past you.", "topic": "map scale: estimating to check the decimal point"}, {"id": "r-g6-5", "level": "medium", "type": "text", "q": "The scale is 2 cm to 1 km. A river bend measures 5.5 cm on the map. How many km is that? Write just the number.", "answer": "2.75", "accept": ["2.75", "2.75 km", "2.75km", "2 3/4"], "hint": "Halve the 5 first, then halve the 0.5, then add the two answers together.", "explain": "The answer is 2.75 km. Divide 5.5 by 2 in two parts. Half of 5 is 2.5. Half of 0.5 is 0.25. Add them: 2.5 plus 0.25 is 2.75. Check it against an estimate: 4 cm would be 2 km and 6 cm would be 3 km, so an answer between 2 and 3 is right.", "topic": "map scale: distance with a decimal answer"}, {"id": "r-g6-6", "level": "medium", "type": "text", "q": "The scale is 2 cm to 1 km. A walker measures one leg as 3 cm and the next leg as 4.5 cm. What is the TOTAL distance in km? Write just the number.", "answer": "3.75", "accept": ["3.75", "3.75 km", "3.75km", "3 3/4"], "hint": "Add the two centimetre readings together first, then halve the total once.", "explain": "The answer is 3.75 km. Add the centimetres first: 3 plus 4.5 is 7.5 cm. Then halve it once. Half of 7 is 3.5 and half of 0.5 is 0.25, so 3.5 plus 0.25 is 3.75 km. You could also do the legs separately, 1.5 plus 2.25, which gives the same answer. Adding first means you only divide once, so there is only one chance to slip.", "topic": "map scale: total distance over two legs"}, {"id": "r-g6-7", "level": "medium", "type": "mc", "q": "How is 2.5 km written in metres?", "options": ["2500 m", "250 m", "25000 m", "2.5 m"], "answer": "2500 m", "hint": "There are 1000 metres in 1 km, so multiply by 1000.", "explain": "2.5 km is 2500 m. There are 1000 m in a kilometre, so 2.5 times 1000 is 2500. Break it down if that helps: 2 km is 2000 m and 0.5 km is 500 m, and 2000 plus 500 is 2500 m.", "topic": "map scale: converting km to metres"}, {"id": "r-g6-8", "level": "stretch", "type": "text", "q": "A different map has a different scale: 4 cm stands for 1 km. On that map a road measures 14 cm. How far is it in km? Write just the number.", "answer": "3.5", "accept": ["3.5", "3.5 km", "3.5km", "3 1/2", "three and a half"], "hint": "The scale has changed. Now you divide the centimetres by 4, not by 2.", "explain": "The answer is 3.5 km. On this map every 4 cm is 1 km, so divide by 4. Three lots of 4 cm make 12 cm, which is 3 km, and the 2 cm left over is half of another 4 cm, so it is 0.5 km. That gives 3.5 km. Read the scale on every new map before you touch the ruler, because 14 cm would have been 7 km on a 2 cm to 1 km map.", "topic": "map scale: applying a different scale"}], "g7-watercycle": [{"id": "r-g7-1", "level": "easy", "type": "mc", "q": "What is condensation?", "options": ["Water vapour cooling and turning back into tiny liquid droplets", "Liquid water heating up and turning into vapour", "Water soaking down into the soil", "Water moving sideways through rock"], "answer": "Water vapour cooling and turning back into tiny liquid droplets", "hint": "Think about the water that appears on a cold window on a cold morning.", "explain": "Condensation is water vapour cooling and turning back into tiny liquid droplets. Millions of those droplets together make a cloud. Heating up and turning into vapour is evaporation, soaking into soil is infiltration, and moving sideways through rock is groundwater flow.", "topic": "water cycle: condensation"}, {"id": "r-g7-2", "level": "easy", "type": "text", "q": "Rain lands on a grass field and soaks down into the soil. What is that stage of the water cycle called?", "answer": "infiltration", "accept": ["infiltration", "Infiltration", "infiltrate", "infilltration"], "hint": "It starts with the letter i. It means soaking in.", "explain": "The answer is infiltration. It means water soaking down from the surface into the soil. Do not mix it up with groundwater flow, which is water that has already soaked in moving slowly sideways through the rock.", "topic": "water cycle: infiltration"}, {"id": "r-g7-3", "level": "easy", "type": "mc", "q": "Which word covers rain, snow, sleet and hail all at once?", "options": ["Precipitation", "Condensation", "Evaporation", "Transpiration"], "answer": "Precipitation", "hint": "It is the stage where water falls out of a cloud, in any form.", "explain": "The answer is precipitation. It is the general word for any water falling out of the sky, whether it is rain, snow, sleet or hail. Condensation is the stage just before, where vapour becomes droplets and forms the cloud in the first place.", "topic": "water cycle: precipitation"}, {"id": "r-g7-4", "level": "easy", "type": "mc", "q": "What pulls rain down out of a cloud and then moves it downhill?", "options": ["Gravity", "Heat from the sun", "The wind alone", "Plant roots"], "answer": "Gravity", "hint": "Two forces drive the whole cycle. One lifts water up, and this one brings it back down.", "explain": "The answer is gravity. Gravity pulls the heavy droplets out of the cloud as precipitation, and then keeps pulling the water downhill as run-off and groundwater flow. Heat from the sun is the other force, and it works the opposite way, lifting water up through evaporation and transpiration.", "topic": "water cycle: what drives each stage"}, {"id": "r-g7-5", "level": "medium", "type": "text", "q": "Trees pull water up through their roots and let it out as vapour through their leaves. What is that stage called?", "answer": "transpiration", "accept": ["transpiration", "Transpiration", "transpire"], "hint": "It starts with the letters tran and it only happens from plants.", "explain": "The answer is transpiration. It is water leaving plants as vapour through tiny holes in their leaves, and it is powered by the sun, just like evaporation. The difference is simply where the water comes from. Evaporation comes from open water such as the sea, and transpiration comes from plants.", "topic": "water cycle: transpiration"}, {"id": "r-g7-6", "level": "medium", "type": "mc", "q": "A drop of water leaves a lake and later soaks into a field. Which order of stages is correct?", "options": ["Evaporation, condensation, precipitation, infiltration", "Condensation, evaporation, precipitation, infiltration", "Evaporation, precipitation, condensation, infiltration", "Precipitation, condensation, evaporation, infiltration"], "answer": "Evaporation, condensation, precipitation, infiltration", "hint": "The water has to get up into the air before a cloud can form, and a cloud has to form before rain can fall.", "explain": "The correct order is evaporation, condensation, precipitation, infiltration. The drop rises from the lake as vapour, cools and condenses into a cloud droplet, falls as precipitation, then soaks into the field. Condensation always comes after evaporation and before precipitation, because you need a cloud before you can have rain.", "topic": "water cycle: order of stages"}, {"id": "r-g7-7", "level": "medium", "type": "mc", "q": "Heavy rain falls on ground that is already completely soaked. What happens to most of the water?", "options": ["It flows over the top of the ground as surface run-off", "It soaks straight down as infiltration", "It evaporates back into the cloud immediately", "It condenses into droplets on the grass"], "answer": "It flows over the top of the ground as surface run-off", "hint": "The word surface is a big clue. If the water cannot go down, where else can it go?", "explain": "The answer is that it flows over the top as surface run-off. Ground that is already soaked cannot take any more water, so infiltration almost stops and the rain has nowhere to go but sideways over the surface. That is why fields flood after several days of rain rather than after the first shower.", "topic": "water cycle: infiltration versus surface run-off"}, {"id": "r-g7-8", "level": "stretch", "type": "mc", "q": "A farmer covers a large grass field with tarmac to make a lorry yard. What happens the next time it rains hard?", "options": ["Less infiltration and more surface run-off, so the nearby river fills up faster", "More infiltration and less surface run-off, so the nearby river fills up slower", "Less evaporation, so it stops raining over the farm", "Nothing changes, because the same amount of rain still falls"], "answer": "Less infiltration and more surface run-off, so the nearby river fills up faster", "hint": "Rain cannot soak through tarmac. If it cannot go down, where is the only place it can go?", "explain": "The answer is less infiltration and more surface run-off. Tarmac is impermeable, so rain cannot soak into it and infiltration drops to almost nothing. Nearly all the water becomes run-off instead, and run-off moves far faster than water travelling through soil and rock, so the river fills quickly and flood risk goes up. The same amount of rain falls, but it arrives at the river much sooner.", "topic": "water cycle: human impact on run-off"}], "de1-verb2": [{"id": "r-de1-1", "level": "easy", "type": "mc", "q": "Which word is the verb in Ich lerne Deutsch in der Schule?", "options": ["lerne", "Ich", "Deutsch", "Schule"], "answer": "lerne", "hint": "The verb is the doing word. It is the one that changes its ending to match ich.", "explain": "The answer is lerne. Lernen means to learn, and with ich the ending changes to -e, giving lerne. Ich is the subject, Deutsch is the subject being learnt and Schule means school. The sentence means I learn German at school.", "topic": "word order: finding the verb"}, {"id": "r-de1-2", "level": "easy", "type": "mc", "q": "Which word is the verb in Wir kaufen Brot im Supermarkt?", "options": ["kaufen", "Wir", "Brot", "Supermarkt"], "answer": "kaufen", "hint": "Which word is the action? Ask what the people are doing.", "explain": "The answer is kaufen. Kaufen means to buy, and with wir the ending is -en, so it stays as kaufen. Wir is the subject, Brot means bread and Supermarkt means supermarket. The sentence means we buy bread in the supermarket.", "topic": "word order: finding the verb"}, {"id": "r-de1-3", "level": "easy", "type": "mc", "q": "In a German statement, which idea is the conjugated verb?", "options": ["The second idea", "The first idea", "The third idea", "The last idea"], "answer": "The second idea", "hint": "It is the same position every time, no matter what comes first.", "explain": "The answer is the second idea. The conjugated verb is always idea two in a German statement. That never changes, which is why everything else has to move around it. If a time phrase goes first, the subject slides in behind the verb.", "topic": "word order: the verb second rule"}, {"id": "r-de1-4", "level": "easy", "type": "text", "q": "In the sentence Am Montag spiele ich Tennis, how many ideas come before the verb spiele? Write the number.", "answer": "1", "accept": ["1", "one", "1 idea", "one idea"], "hint": "Am Montag is two words, but count ideas and not words.", "explain": "The answer is 1. Am Montag is two words but only one idea, because am belongs with Montag. So there is exactly one idea in front of the verb, which is what verb second means. There is always exactly one idea before the conjugated verb in a German statement.", "topic": "word order: counting ideas not words"}, {"id": "r-de1-5", "level": "medium", "type": "mc", "q": "Which of these sentences has the verb in the right place?", "options": ["Morgen lerne ich Deutsch.", "Morgen ich lerne Deutsch.", "Lerne morgen ich Deutsch.", "Ich morgen lerne Deutsch."], "answer": "Morgen lerne ich Deutsch.", "hint": "Count the ideas. The verb has to be the second one.", "explain": "The answer is Morgen lerne ich Deutsch. Morgen is idea one, so the verb lerne must be idea two, and ich is pushed to third place. The second option puts the verb third, which German does not allow. The third option starts with the verb, which makes it a question. The fourth also leaves the verb in third place.", "topic": "word order: fronted time phrase"}, {"id": "r-de1-6", "level": "medium", "type": "text", "q": "Put these words into a correct sentence: trinke / ich / Wasser", "answer": "Ich trinke Wasser.", "accept": ["Ich trinke Wasser.", "Ich trinke Wasser", "ich trinke wasser.", "ich trinke wasser"], "hint": "Start with the person, then the verb.", "explain": "The answer is Ich trinke Wasser. The subject ich is idea one and the verb trinke is idea two, which is the normal order. Wasser is the thing being drunk and goes at the end. The sentence means I drink water.", "topic": "word order: normal statement order"}, {"id": "r-de1-7", "level": "medium", "type": "mc", "q": "Why is Am Abend wir essen Pizza wrong?", "options": ["The verb is in third place and it must be second", "The verb essen should be esst", "A time phrase cannot start a German sentence", "wir must always be the first word"], "answer": "The verb is in third place and it must be second", "hint": "Count the ideas in front of the verb.", "explain": "The answer is that the verb is in third place and it must be second. Am Abend is idea one, wir is idea two and essen has ended up third. The correct sentence is Am Abend essen wir Pizza. The verb form essen is right for wir, so that is not the problem.", "topic": "word order: diagnosing a verb third error"}, {"id": "r-de1-8", "level": "stretch", "type": "text", "q": "Correct this sentence: Heute ich lerne Deutsch.", "answer": "Heute lerne ich Deutsch.", "accept": ["Heute lerne ich Deutsch.", "Heute lerne ich Deutsch", "heute lerne ich deutsch.", "heute lerne ich deutsch"], "hint": "Only two words need to swap.", "explain": "The answer is Heute lerne ich Deutsch. Heute means today and is idea one, so the verb lerne must come second and ich moves behind it. The verb form lerne is already correct for ich, so only the order needed fixing.", "topic": "word order: correcting verb third"}], "de2-pronouns": [{"id": "r-de2-1", "level": "easy", "type": "mc", "q": "What does ihr mean?", "options": ["you, when you are talking to more than one friend", "we", "they", "she"], "answer": "you, when you are talking to more than one friend", "hint": "There are three words for you. This is the one for a group of friends.", "explain": "The answer is you, when you are talking to more than one friend. Ihr takes the ending -t, so ihr wohnt means you all live. We is wir, they is sie and she is also sie.", "topic": "pronouns: meaning"}, {"id": "r-de2-2", "level": "easy", "type": "text", "q": "Fill the gap with the right form of spielen: Ich ___ Fussball.", "answer": "spiele", "accept": ["spiele", "spiele.", "Spiele"], "hint": "With ich the ending is -e.", "explain": "The answer is spiele. The stem of spielen is spiel and ich takes the ending -e, so it becomes spiele. The full sentence is Ich spiele Fussball, meaning I play football.", "topic": "pronouns: ich form of a regular verb"}, {"id": "r-de2-3", "level": "easy", "type": "text", "q": "Fill the gap with the right form of kommen: Er ___ aus Spanien.", "answer": "kommt", "accept": ["kommt", "kommt.", "Kommt"], "hint": "With er, sie and es the ending is -t.", "explain": "The answer is kommt. The stem of kommen is komm and er takes the ending -t, giving kommt. The sentence means he comes from Spain. The same ending works for sie meaning she and for es meaning it.", "topic": "pronouns: er form of a regular verb"}, {"id": "r-de2-4", "level": "easy", "type": "mc", "q": "You are speaking to a shopkeeper you have never met before. Which word for you do you use?", "options": ["Sie", "du", "ihr", "wir"], "answer": "Sie", "hint": "There is a friendly one and a polite one. This is the polite situation.", "explain": "The answer is Sie, written with a capital S. Sie is the polite word for you when you are speaking to an adult you do not know. Du is the friendly form for a friend or a family member, ihr is for more than one friend, and wir means we.", "topic": "pronouns: du versus Sie"}, {"id": "r-de2-5", "level": "medium", "type": "text", "q": "Fill the gap with the right form of spielen: Wir ___ Tennis.", "answer": "spielen", "accept": ["spielen", "spielen.", "Spielen"], "hint": "With wir the ending is the same as the whole verb.", "explain": "The answer is spielen. With wir the ending is -en, which happens to look exactly like the plain verb. The sentence means we play tennis. The sie form meaning they and the polite Sie form use the same ending.", "topic": "pronouns: wir form of a regular verb"}, {"id": "r-de2-6", "level": "medium", "type": "text", "q": "Fill the gap with the right form of kommen: Ihr ___ aus Italien.", "answer": "kommt", "accept": ["kommt", "kommt.", "Kommt"], "hint": "The ihr ending is the same as the er ending.", "explain": "The answer is kommt. Ihr means you when you are speaking to more than one friend, and it takes the ending -t, just like er does. So Ihr kommt aus Italien means you all come from Italy. Aus means from when you are naming a country.", "topic": "pronouns: ihr form"}, {"id": "r-de2-7", "level": "medium", "type": "mc", "q": "You want to ask your new teacher where she comes from. Which question is correct?", "options": ["Woher kommen Sie?", "Woher kommst du?", "Woher kommt ihr?", "Woher komme ich?"], "answer": "Woher kommen Sie?", "hint": "A teacher you have just met is an adult you do not know, so use the polite form.", "explain": "The answer is Woher kommen Sie. Sie with a capital S is the polite you and takes the ending -en. Woher kommst du would be too familiar for a teacher you have just met. Woher kommt ihr is for more than one friend, and Woher komme ich means where do I come from.", "topic": "pronouns: polite Sie"}, {"id": "r-de2-8", "level": "stretch", "type": "text", "q": "Write in German: They come from Austria. Austria is Oesterreich.", "answer": "Sie kommen aus Oesterreich.", "accept": ["Sie kommen aus Oesterreich.", "Sie kommen aus Oesterreich", "Sie kommen aus Österreich.", "Sie kommen aus Österreich", "sie kommen aus oesterreich.", "sie kommen aus oesterreich", "sie kommen aus österreich.", "sie kommen aus österreich"], "hint": "They is sie, and it takes the same ending as wir.", "explain": "The answer is Sie kommen aus Oesterreich, written properly as Sie kommen aus Österreich. Sie meaning they takes the ending -en, so kommen stays as kommen. Aus means from. This looks the same as the polite Sie, and only the meaning of the sentence tells you which one it is.", "topic": "pronouns: sie meaning they"}], "de3-irregular": [{"id": "r-de3-1", "level": "easy", "type": "text", "q": "Fill the gap with the right form of lesen: Ich ___ eine Zeitung.", "answer": "lese", "accept": ["lese", "lese.", "Lese"], "hint": "The ich form never changes its vowel.", "explain": "The answer is lese. With ich the vowel stays as a normal e and the ending is -e, so it is lese. Only du and er, sie, es change the vowel in this verb. The sentence means I read a newspaper.", "topic": "irregular verbs: ich form stays regular"}, {"id": "r-de3-2", "level": "easy", "type": "mc", "q": "In the verb fahren, which forms put the two dots on the a?", "options": ["du and er, sie, es", "ich and du", "wir and sie", "ihr and wir"], "answer": "du and er, sie, es", "hint": "It is only two of the six forms, and it is the same two for every irregular verb.", "explain": "The answer is du and er, sie, es. Those are the only forms that change the vowel, so you get du faehrst and er faehrt. Ich fahre, wir fahren, ihr fahrt and sie fahren all keep the plain a. The same two forms change in essen, lesen, sehen and sprechen as well.", "topic": "irregular verbs: which forms change"}, {"id": "r-de3-3", "level": "easy", "type": "text", "q": "Fill the gap with the right form of fahren, where sie means she: Sie ___ nach Wien.", "answer": "faehrt", "accept": ["faehrt", "faehrt.", "fährt", "fährt."], "hint": "The a gains two dots and the ending is -t.", "explain": "The answer is faehrt, written properly as fährt. The vowel a changes to ä in the sie form, exactly as it does in the er form, and the ending is -t. So Sie faehrt nach Wien means she travels to Vienna.", "topic": "irregular verbs: fahren er form"}, {"id": "r-de3-4", "level": "easy", "type": "text", "q": "Fill the gap with the right form of sehen: Wir ___ einen Film.", "answer": "sehen", "accept": ["sehen", "sehen.", "Sehen"], "hint": "wir takes the same ending as the plain verb, and the vowel does not change.", "explain": "The answer is sehen. The wir form never changes its vowel, and the ending -en makes it look exactly like the plain verb. So Wir sehen einen Film means we watch a film. Writing siehen would be wrong, because only du and er change the vowel.", "topic": "irregular verbs: wir form stays regular"}, {"id": "r-de3-5", "level": "m
