"The inside of a car window goes misty on a cold morning. Water vapour that the people breathed out has touched the cold glass and turned into liquid water. A pupil called this evaporation. Write the one word it should be.","answer":"condensation","accept":["condensation","condensed","condenses","condensing","Condensation","Condensed"],"hint":"Ask the test question. Is the substance becoming a gas, or stopping being one?","explain":"The water started as vapour, which is a gas, and ended as liquid water on the glass. Ask the test question: is the substance becoming a gas, or stopping being one? It is stopping being one, so this is condensation. Evaporation is the other direction, liquid going up and away as a gas. The water on the glass did not come in through the window, it came back out of the air and settled on the cold surface.","topic":"science: marking the evaporation and condensation swap"},{"id":"s11-particles-state-changes:p8","level":"medium","type":"mc","q":"A pupil's work using the table. Line 1: mercury has a boiling point of 357 degrees C. Line 2: 400 degrees C is hotter than that. Line 3: so at 400 degrees C mercury is liquid. What is wrong?","options":["Line 3 is wrong. 400 is above the boiling point, so mercury is a gas","Line 3 is wrong. 400 is below the melting point, so mercury is solid","Line 1 is wrong. 357 degrees C is the melting point of mercury","Nothing is wrong. Mercury is liquid at 400 degrees C"],"answer":"Line 3 is wrong. 400 is above the boiling point, so mercury is a gas","hint":"Above the boiling point a substance has already boiled.","explain":"Lines 1 and 2 are both correct, 400 really is hotter than 357. Line 3 gets the direction backwards. Above the boiling point the substance has already boiled, so it is a gas. Mercury is liquid between minus 39 and 357 degrees C, and 400 sits past the top of that range, so mercury is a gas at 400 degrees C. The answer saying 357 is the melting point mixes the two columns up, because 357 is in the boiling point column and the melting point of mercury is minus 39.","topic":"science: marking a state read off the table with the direction backwards"},{"id":"s11-particles-state-changes:p9","level":"stretch","type":"text","q":"Using the table, ethanol is heated from minus 200 degrees C up to 200 degrees C. How many times does it change state? Write the number.","answer":"2","accept":["2","two","2 times","twice","Two"],"hint":"Ethanol has two numbers in the table. How many of them does the heating pass?","explain":"Ethanol melts at minus 114 degrees C and boils at 78 degrees C. Heating from minus 200 up to 200 passes both of those numbers. At minus 200 ethanol is below its melting point, so it starts as a solid. It melts at minus 114 and becomes a liquid. It boils at 78 and becomes a gas. That is two changes of state.","topic":"science: using the table to count changes of state over a heating range"},{"id":"s11-particles-state-changes:p10","level":"stretch","type":"mc","q":"A substance that is not in the table is a gas at 150 degrees C and a liquid at 120 degrees C. What can you say for certain about its boiling point?","options":["It is somewhere between 120 and 150 degrees C","It is exactly 100 degrees C","It is above 150 degrees C","It is below 120 degrees C"],"answer":"It is somewhere between 120 and 150 degrees C","hint":"Work backwards from the two states. The boiling point has to sit between a temperature where it is liquid and a temperature where it is a gas.","explain":"Work backwards from what you are told. It is liquid at 120, so it has not boiled by 120, which means the boiling point is higher than 120. It is a gas at 150, so it has already boiled by 150, which means the boiling point is lower than 150. So the boiling point sits somewhere between 120 and 150 degrees C. It cannot be exactly 100, because 100 is the boiling point of water and this substance is not water. A boiling point above 150 would make it a liquid at 150, and one below 120 would make it a gas at 120, and both of those contradict what you were given.","topic":"science: working backwards from two states to pin down a changeover temperature"}],"de16-genders-again":[{"id":"de16-genders-again:p1","level":"easy","type":"text","q":"Write the gender word that goes in front of Park.","answer":"der","accept":["der","Der"],"hint":"Park is one of this week's new nouns.","explain":"Park is a der noun, so the pair is der Park.","topic":"german: the gender word for a der noun"},{"id":"de16-genders-again:p2","level":"easy","type":"text","q":"Write the gender word that goes in front of Zimmer.","answer":"das","accept":["das","Das"],"hint":"You had this one last week.","explain":"Zimmer is a das noun, so the pair is das Zimmer.","topic":"german: the gender word for a das noun"},{"id":"de16-genders-again:p3","level":"medium","type":"mc","q":"A pupil wrote: Der Pizza ist gut. What is wrong with it?","options":["The gender word is wrong, Pizza takes die","The verb ist is wrong, it should be bist","gut has to go in front of Pizza","Nothing is wrong"],"answer":"The gender word is wrong, Pizza takes die","hint":"Find the noun, then ask which gender word belongs to it.","explain":"Pizza is a die noun, so the sentence should read Die Pizza ist gut. ist is the correct verb for one thing, and gut sits after ist, which is right.","topic":"german: marking a wrong gender in a pupil sentence"},{"id":"de16-genders-again:p4","level":"medium","type":"text","q":"A pupil wrote: Die Haus ist alt. Write the whole sentence out correctly.","answer":"Das Haus ist alt.","accept":["Das Haus ist alt.","Das Haus ist alt","das Haus ist alt","das Haus ist alt.","das haus ist alt","das haus ist alt."],"hint":"Only the gender word changes.","explain":"Haus is a das noun, so die is wrong. The correct sentence is Das Haus ist alt.","topic":"german: correcting a wrong gender and rewriting the sentence"},{"id":"de16-genders-again:p5","level":"stretch","type":"text","q":"A pupil wrote: Morgen ist der Schule langweilig. One word is wrong. Write the whole sentence out correctly.","answer":"Morgen ist die Schule langweilig.","accept":["Morgen ist die Schule langweilig.","Morgen ist die Schule langweilig","morgen ist die Schule langweilig","morgen ist die Schule langweilig.","morgen ist die schule langweilig","morgen ist die schule langweilig."],"hint":"The boxes are already in the right order, so look at the gender word.","explain":"Morgen is box one and ist is box two, so the order is fine. Schule is a die noun, so der is the wrong gender word. The sentence should read Morgen ist die Schule langweilig.","topic":"german: correcting a wrong gender inside a time phrase sentence"},{"id":"de16-genders-again:p6","level":"medium","type":"mc","q":"A pupil wrote: Die Zimmer ist klein. Which word has to change, and what to?","options":["Die has to change to das","Die has to change to der","ist has to change to bin","klein has to change to gross"],"answer":"Die has to change to das","hint":"Find the noun, then find its gender word.","explain":"Zimmer is a das noun, so the sentence should read Das Zimmer ist klein. ist is the right verb and klein is the right word for small.","topic":"german: naming which word must change in a wrong gender sentence"}],"de17-verb-second-pressure":[{"id":"de17-verb-second-pressure:p1","level":"easy","type":"mc","q":"In Morgen trinke ich Wasser, which box is the verb trinke in?","options":["Box one","Box two","Box three"],"answer":"Box two","hint":"Morgen is one box all on its own.","explain":"Morgen is box one, trinke is box two, ich is box three and Wasser is box four. The verb is in box two.","topic":"german: finding which box the verb is in"},{"id":"de17-verb-second-pressure:p2","level":"easy","type":"text","q":"Put these boxes into the right order and write the sentence. Start with Am Montag. Boxes: Wasser, Am Montag, ich, trinke.","answer":"Am Montag trinke ich Wasser.","accept":["Am Montag trinke ich Wasser.","Am Montag trinke ich Wasser","am Montag trinke ich Wasser","am Montag trinke ich Wasser.","am montag trinke ich wasser","am montag trinke ich wasser."],"hint":"Time phrase first, then the verb, then ich.","explain":"Am Montag takes box one, the verb trinke takes box two, ich is pushed behind the verb and Wasser goes last. Am Montag trinke ich Wasser.","topic":"german: ordering boxes into a sentence starting with a time phrase"},{"id":"de17-verb-second-pressure:p3","level":"medium","type":"mc","q":"A pupil wrote: Heute ich lerne Deutsch. What is wrong with it?","options":["Two boxes sit in front of the verb, so lerne has to come straight after Heute","Heute should go at the end of the sentence","lerne should be lernst","Deutsch needs a gender word in front of it"],"answer":"Two boxes sit in front of the verb, so lerne has to come straight after Heute","hint":"Count the boxes in front of the verb.","explain":"Heute is box one and ich has taken box two, so lerne has been pushed to box three. Only one box goes in front of the verb. Heute lerne ich Deutsch. The ending on lerne is correct for ich.","topic":"german: marking a verb pushed to box three"},{"id":"de17-verb-second-pressure:p4","level":"medium","type":"text","q":"A pupil wrote: Am Samstag ich hoere Musik. Write the whole sentence out correctly, starting with Am Samstag.","answer":"Am Samstag hoere ich Musik.","accept":["Am Samstag hoere ich Musik.","Am Samstag hoere ich Musik","Am Samstag höre ich Musik","Am Samstag höre ich Musik.","am Samstag hoere ich Musik","am Samstag hoere ich Musik.","am Samstag höre ich Musik","am Samstag höre ich Musik.","am samstag hoere ich musik","am samstag hoere ich musik.","am samstag höre ich musik","am samstag höre ich musik."],"hint":"The time phrase keeps box one. The verb has to take box two.","explain":"Am Samstag is one box and holds box one. ich has pushed the verb hoere into box three. Move hoere into box two and put ich behind it. Am Samstag hoere ich Musik.","topic":"german: correcting a verb pushed to box three"},{"id":"de17-verb-second-pressure:p5","level":"medium","type":"mc","q":"A pupil wrote: Morgen lernst ich Deutsch. One word is wrong. Which one, and what should it be?","options":["lernst, it should be lerne","Morgen, it should go at the end","ich, it should be er","Deutsch, it should have a gender word in front"],"answer":"lernst, it should be lerne","hint":"The boxes are in the right order, so check the ending on the verb.","explain":"Morgen is box one and the verb is in box two, so the order is right. The ending is wrong. With ich the ending is e, so it is lerne. lernst goes with du. Morgen lerne ich Deutsch.","topic":"german: marking a wrong verb ending after a time phrase"},{"id":"de17-verb-second-pressure:p6","level":"stretch","type":"mc","q":"A pupil says the box rule only matters when a sentence starts with ich. Why is that wrong?","options":["The verb sits in box two whatever is in box one, so a time phrase at the front still pushes ich behind the verb","The rule only applies to questions","The rule only applies to sentences with haben in them","He is right, the rule only matters when a sentence starts with ich"],"answer":"The verb sits in box two whatever is in box one, so a time phrase at the front still pushes ich behind the verb","hint":"Ask what the rule is actually about, box one or the verb.","explain":"The rule fixes the verb in box two. It says nothing about what has to be in box one, so anything can go there. Put Heute in box one and ich no longer fits in front of the verb, so it goes behind it. Heute hoere ich Musik.","topic":"german: why only one box can go in front of the verb"}],"de18-asking-questions":[{"id":"de18-asking-questions:p1","level":"easy","type":"mc","q":"Which one of these three is a question?","options":["Hoerst du Musik?","Du hoerst Musik.","Musik du hoerst?"],"answer":"Hoerst du Musik?","hint":"Look at which word is at the front.","explain":"Hoerst du Musik? has the verb in box one, which is what makes it a yes or no question. Du hoerst Musik. is a statement, and Musik du hoerst? has the verb third, which is not a German question.","topic":"german: telling a question from a statement"},{"id":"de18-asking-questions:p2","level":"easy","type":"text","q":"Turn Du hoerst Musik into a yes or no question. Write the question.","answer":"Hoerst du Musik?","accept":["Hoerst du Musik?","Hoerst du Musik","Hoerst du Musik.","Hörst du Musik","Hörst du Musik.","Hörst du Musik?","hoerst du Musik","hoerst du Musik.","hoerst du Musik?","hoerst du musik","hoerst du musik.","hoerst du musik?","hörst du Musik","hörst du Musik.","hörst du Musik?","hörst du musik","hörst du musik.","hörst du musik?"],"hint":"Swap the first two words.","explain":"The verb hoerst moves in front of du and keeps its st ending. Hoerst du Musik?","topic":"german: turning a du statement into a yes or no question"},{"id":"de18-asking-questions:p3","level":"medium","type":"mc","q":"A pupil wrote: Du kaufst Pizza? What is wrong with it?","options":["The verb has to go first, so it should be Kaufst du Pizza?","kaufst should be kaufe","Pizza needs a gender word in front of it","Nothing is wrong"],"answer":"The verb has to go first, so it should be Kaufst du Pizza?","hint":"A question mark does not move any words.","explain":"The pupil kept statement order and only added a question mark. The verb has to fill box one in a yes or no question, so kaufst goes in front of du. Kaufst du Pizza? The ending kaufst is right for du.","topic":"german: marking a question with the verb still in box two"},{"id":"de18-asking-questions:p4","level":"medium","type":"text","q":"A pupil wrote: Du spielst Fussball? Write the question out correctly.","answer":"Spielst du Fussball?","accept":["Spielst du Fussball?","Spielst du Fussball","Spielst du Fussball.","Spielst du Fußball","Spielst du Fußball.","Spielst du Fußball?","spielst du Fussball","spielst du Fussball.","spielst du Fussball?","spielst du Fußball","spielst du Fußball.","spielst du Fußball?","spielst du fussball","spielst du fussball.","spielst du fussball?","spielst du fußball","spielst du fußball.","spielst du fußball?"],"hint":"Only the first two words move.","explain":"In a yes or no question the verb comes first, so spielst goes in front of du and keeps its st ending. Spielst du Fussball?","topic":"german: correcting a question with the verb in box two"},{"id":"de18-asking-questions:p5","level":"medium","type":"mc","q":"A pupil wrote: Wohne du in Wolverhampton? One word is wrong. Which one, and what should it be?","options":["Wohne, it should be Wohnst","du, it should go at the end of the question","in, it should go at the end","Nothing is wrong"],"answer":"Wohne, it should be Wohnst","hint":"The verb is in the right box. Check the ending that goes with du.","explain":"The order is correct, with the verb in box one and du after it. The ending is wrong, because du takes st. Wohnst du in Wolverhampton? The e ending belongs with ich.","topic":"german: marking a wrong verb ending in a question"},{"id":"de18-asking-questions:p6","level":"stretch","type":"text","q":"A pupil wrote: Du hast Musik? Write the question out correctly.","answer":"Hast du Musik?","accept":["Hast du Musik?","Hast du Musik","Hast du Musik.","hast du Musik","hast du Musik.","hast du Musik?","hast du musik","hast du musik.","hast du musik?"],"hint":"haben is an odd one, but the verb still goes first.","explain":"The form hast is already right for du, so only the order is wrong. The verb moves into box one and du follows it. Hast du Musik?","topic":"german: correcting a question with haben"}],"de19-w-questions":[{"id":"de19-w-questions:p1","level":"easy","type":"mc","q":"Which of these three question words asks about a place?","options":["Wo","Was","Wann"],"answer":"Wo","hint":"Think about Wo wohnst du?","explain":"Wo asks about a place, so Wo wohnst du? means where do you live. Was asks about a thing and wann asks about time.","topic":"german: the meaning of the question word wo"},{"id":"de19-w-questions:p2","level":"easy","type":"text","q":"Write the German for what are you saying, using was and sagen.","answer":"Was sagst du?","accept":["Was sagst du?","Was sagst du","Was sagst du.","was sagst du","was sagst du.","was sagst du?"],"hint":"Question word, then the verb, then du.","explain":"Was takes box one. The du form of sagen is sagst and it goes in box two. du comes third. Was sagst du?","topic":"german: writing a was question with the verb next"},{"id":"de19-w-questions:p3","level":"medium","type":"mc","q":"A pupil wrote: Was du kaufst? What is wrong with it?","options":["Two boxes sit in front of the verb, so kaufst has to come straight after Was","kaufst should be kaufe","Was should be Wann","The question mark should be a full stop"],"answer":"Two boxes sit in front of the verb, so kaufst has to come straight after Was","hint":"Count the boxes in front of the verb.","explain":"Was is box one and du has taken box two, pushing kaufst into box three. Nothing goes between the question word and the verb. Was kaufst du? The ending kaufst is right for du.","topic":"german: marking a w question with the verb in box three"},{"id":"de19-w-questions:p4","level":"medium","type":"text","q":"A pupil wrote: Wann du lernst Deutsch? Write the question out correctly.","answer":"Wann lernst du Deutsch?","accept":["Wann lernst du Deutsch?","Wann lernst du Deutsch","Wann lernst du Deutsch.","wann lernst du Deutsch","wann lernst du Deutsch.","wann lernst du Deutsch?","wann lernst du deutsch","wann lernst du deutsch.","wann lernst du deutsch?"],"hint":"The verb has to come straight after wann.","explain":"Wann is box one and du has pushed the verb lernst into box three. Move lernst into box two and put du behind it. Wann lernst du Deutsch?","topic":"german: correcting a wann question with the verb in box three"},{"id":"de19-w-questions:p5","level":"medium","type":"mc","q":"A pupil wrote: Was mache du? One word is wrong. Which one, and what should it be?","options":["mache, it should be machst","Was, it should be Wo","du, it should go in front of Was","Nothing is wrong"],"answer":"mache, it should be machst","hint":"The boxes are in the right order, so check the ending that goes with du.","explain":"The verb is straight after was, so the order is right. du takes the st ending, so it is Was machst du? The e ending belongs with ich.","topic":"german: marking a wrong verb ending in a w question"},{"id":"de19-w-questions:p6","level":"stretch","type":"text","q":"A pupil wrote: Wo die Katze ist? Write the question out correctly.","answer":"Wo ist die Katze?","accept":["Wo ist die Katze?","Wo ist die Katze","Wo ist die Katze.","wo ist die Katze","wo ist die Katze.","wo ist die Katze?","wo ist die katze","wo ist die katze.","wo ist die katze?"],"hint":"The verb comes straight after wo, even when a noun is doing the being.","explain":"Wo is box one, so the verb has to be in box two. Here die Katze has got in between and pushed ist to the end. Move ist straight after wo and the noun follows it. Wo ist die Katze?","topic":"german: correcting a wo question with a noun subject"}],"de20-five-new-sentences":[{"id":"de20-five-new-sentences:p1","level":"easy","type":"text","q":"Write sentence one from memory. It starts with Am Freitag and ends with Fussball.","answer":"Am Freitag spiele ich Fussball.","accept":["Am Freitag spiele ich Fussball.","Am Freitag spiele ich Fussball","Am Freitag spiele ich Fußball","Am Freitag spiele ich Fußball.","am Freitag spiele ich Fussball","am Freitag spiele ich Fussball.","am Freitag spiele ich Fußball","am Freitag spiele ich Fußball.","am freitag spiele ich fussball","am freitag spiele ich fussball.","am freitag spiele ich fußball","am freitag spiele ich fußball."],"hint":"The verb goes in box two and ich goes behind it.","explain":"Am Freitag is box one, spiele is box two, ich is box three and Fussball is last. Am Freitag spiele ich Fussball.","topic":"german: writing sentence one from memory"},{"id":"de20-five-new-sentences:p2","level":"easy","type":"mc","q":"In Am Freitag spiele ich Fussball, which box is spiele in?","options":["Box one","Box two","Box three","Box four"],"answer":"Box two","hint":"Am Freitag is one box, both words of it.","explain":"Am Freitag is box one, spiele is box two, ich is box three and Fussball is box four. The verb is in box two, which is the rule for a statement.","topic":"german: finding which box a word is in"},{"id":"de20-five-new-sentences:p3","level":"medium","type":"mc","q":"A pupil wrote sentence three as: Die Handy ist neu. What is wrong with it?","options":["The gender word is wrong, Handy takes das","ist is wrong, it should be bist","neu has to go in front of Handy","Nothing is wrong"],"answer":"The gender word is wrong, Handy takes das","hint":"Find the noun, then ask which gender word it came with.","explain":"Handy is a das noun, so the sentence is Das Handy ist neu. The pupil used die, which belongs to nouns like Schule and Katze.","topic":"german: marking a wrong gender in sentence three"},{"id":"de20-five-new-sentences:p4","level":"medium","type":"text","q":"A pupil wrote sentence two as: Ich heute trinke Wasser. Write it out correctly, starting with Heute.","answer":"Heute trinke ich Wasser.","accept":["Heute trinke ich Wasser.","Heute trinke ich Wasser","heute trinke ich Wasser","heute trinke ich Wasser.","heute trinke ich wasser","heute trinke ich wasser."],"hint":"Start with Heute, then the verb, then ich.","explain":"The pupil had two boxes, Ich and heute, in front of the verb, and only one is allowed. This question asked you to start with Heute, so Heute is box one, trinke is box two, and that pushes ich behind the verb. Heute trinke ich Wasser. Ich trinke heute Wasser is also correct German, it just does not start with Heute.","topic":"german: correcting the word order in sentence two"},{"id":"de20-five-new-sentences:p5","level":"medium","type":"text","q":"A pupil wrote sentence five as: Wann lerne du Deutsch? Write it out correctly.","answer":"Wann lernst du Deutsch?","accept":["Wann lernst du Deutsch?","Wann lernst du Deutsch","Wann lernst du Deutsch.","wann lernst du Deutsch","wann lernst du Deutsch.","wann lernst du Deutsch?","wann lernst du deutsch","wann lernst du deutsch.","wann lernst du deutsch?"],"hint":"The order is right. Check the ending that goes with du.","explain":"Wann is box one and the verb is straight after it, so the order is correct. du takes the st ending, so it is Wann lernst du Deutsch? The e ending belongs with ich.","topic":"german: correcting a wrong verb ending in sentence five"},{"id":"de20-five-new-sentences:p6","level":"stretch","type":"mc","q":"You have just written Wo wohnst du? Why does wohnst come straight after Wo?","options":["Because wo takes box one, so the verb has to be in box two","Because wo is always followed by a verb ending in st","Because du cannot start a question","Because wo and wohnst both start with the same letter"],"answer":"Because wo takes box one, so the verb has to be in box two","hint":"It is the box rule again, not a rule about spelling.","explain":"Wo is one box and it fills box one, so the verb has to come next in box two. That is why Wo du wohnst is wrong. The st ending is there because the verb goes with du, not because of wo, and du can start a statement perfectly well.","topic":"german: explaining why the verb follows a w word"}],"m23-backwards-marking":[{"id":"m23-backwards-marking:p1","level":"easy","type":"mc","q":"A pupil is told: start with a number, divide it by 9, then take away 1.5. How many steps does the forward journey have, and how many undos does that mean?","options":["One step, one undo","Two steps, two undos","Two steps, one undo","Three steps, three undos"],"answer":"Two steps, two undos","hint":"Count the instructions, then match the undos to them one for one.","explain":"Divide by 9 is one step. Take away 1.5 is the second step. Two steps forward always means two undos coming back, so stopping after one undo leaves the job half done.","topic":"working backwards: counting the steps in the forward journey"},{"id":"m23-backwards-marking:p2","level":"easy","type":"mc","q":"A pupil's work. Line 1: a number is multiplied by 8, then 12 is added, giving 92. Line 2: 92 - 12 = 80. Line 3: so the number is 80. Which line is the first wrong one?","options":["Line 1","Line 2","Line 3","No line is wrong"],"answer":"Line 3","hint":"Two steps forward means two undos. How many has the pupil done?","explain":"Line 2 is right, 92 - 12 = 80. The forward journey had two steps, times 8 and add 12, so there are two undos. The pupil did one and stopped. 80 still has to be divided by 8, giving 10. Check: 10 x 8 = 80, then 80 + 12 = 92.","topic":"working backwards: marking a solution that stops after one undo"},{"id":"m23-backwards-marking:p3","level":"easy","type":"text","q":"A pupil's work. Line 1: a triangle has area 36 cm^2 and base 9 cm. Line 2: 36 x 2 = 72. Line 3: so the height is 72 cm. Line 3 is the first wrong one. Write the number the height should be, in cm.","answer":"8","accept":["8","8.0","8 cm","8cm","eight"],"hint":"After the doubling, one forward step is still left to undo.","explain":"Forward journey from the height: times the base 9, then divide by 2. Two steps. Line 2 correctly undoes the divide by 2, 36 x 2 = 72. The times 9 was never undone. 72 / 9 = 8, so the height is 8 cm. Check: 8 x 9 = 72, then 72 / 2 = 36.","topic":"working backwards: area to find a height"},{"id":"m23-backwards-marking:p4","level":"easy","type":"mc","q":"A pupil's work. Line 1: a feed is mixed in the ratio 4:7. Line 2: there is 2.8 kg of the 4 part. Line 3: one part is 2.8 / 4 = 0.7 kg. Line 4: so the whole mix is 0.7 x 7 = 4.9 kg. Which line is the first wrong one?","options":["Line 1","Line 2","Line 3","Line 4"],"answer":"Line 4","hint":"How many parts are in the whole mix, not just the 7 part?","explain":"Line 3 is right, one part is 0.7 kg. Line 4 multiplies by 7, which is only the second share. The whole mix is 4 + 7 = 11 parts, so 0.7 x 11 = 7.7 kg. The pupil treated one share as the total. Check: 7.7 split 4:7 gives 2.8 kg and 4.9 kg.","topic":"working backwards: marking a ratio where one share is treated as the total"},{"id":"m23-backwards-marking:p5","level":"medium","type":"mc","q":"A pupil's work on this: a number is divided by 5, then 6.2 is taken away, giving 1.8. Line 1: undo the take away, 1.8 + 6.2 = 8. Line 2: so the number is 8. What went wrong?","options":["The pupil undid one step and stopped, and still needs to multiply 8 by 5","Line 1 should have taken 6.2 away instead of adding it","8 should be 4.4","Nothing went wrong, 8 is correct"],"answer":"The pupil undid one step and stopped, and still needs to multiply 8 by 5","hint":"Write the forward journey out and count the steps in it.","explain":"The forward journey is divide by 5, then take away 6.2. Two steps. Line 1 correctly undoes the take away, 1.8 + 6.2 = 8. The divide by 5 has not been undone, so 8 x 5 = 40. Check: 40 / 5 = 8, then 8 - 6.2 = 1.8.","topic":"working backwards: naming the error in a solution that stops after one undo"},{"id":"m23-backwards-marking:p6","level":"medium","type":"text","q":"A pupil's work. Line 1: 4/5 of a number is 2.8. Line 2: one fifth is 2.8 / 4 = 0.7. Line 3: so the number is 0.7. Line 3 is the first wrong one. Write the number it should give.","answer":"3.5","accept":["3.5","3.50","3 1/2","7/2"],"hint":"One fifth is 0.7. How many fifths make a whole?","explain":"Line 2 is right, one fifth is 0.7. A whole is five fifths, so the number is 0.7 x 5 = 3.5. The pupil found one part and called it the total. Check: 3.5 / 5 = 0.7, then 0.7 x 4 = 2.8.","topic":"working backwards: fraction of an amount to find the whole"},{"id":"m23-backwards-marking:p7","level":"medium","type":"mc","q":"A pupil's work. Line 1: eight depth readings have a mean of 4.25 m. Line 2: total = 4.25 x 7 = 29.75. Line 3: seven of the readings add to 30. Line 4: the missing reading is 29.75 - 30 = minus 0.25. Which line is the first wrong one?","options":["Line 1","Line 2","Line 3","Line 4"],"answer":"Line 2","hint":"The mean was made by dividing by how many readings?","explain":"The mean came from dividing the total by 8, so undoing it means multiplying by 8, not 7. Total = 4.25 x 8 = 34. The missing reading is 34 - 30 = 4. A depth coming out below zero was the clue that the undo used the wrong count. Check: 30 + 4 = 34, and 34 / 8 = 4.25.","topic":"working backwards: marking a mean reversed with the wrong number of values"},{"id":"m23-backwards-marking:p8","level":"stretch","type":"text","q":"A pupil's work. Line 1: a rectangle has area 46.8 cm^2 and width 7.2 cm. Line 2: length = 46.8 / 7.2 = 6.5 cm. Line 3: so the perimeter is 6.5 x 2 = 13 cm. Line 3 is the first wrong one. Write the correct perimeter, in cm.","answer":"27.4","accept":["27.4","27.40","27.4 cm","27.4cm"],"hint":"A perimeter needs all four sides, not two.","explain":"Line 2 is right, the length is 6.5 cm. Line 3 doubles the length and forgets the width completely. The perimeter is 2 x (6.5 + 7.2) = 2 x 13.7 = 27.4 cm. Check: 6.5 x 7.2 = 46.8, and the four sides are 6.5, 7.2, 6.5 and 7.2.","topic":"working backwards: area to a side then on to perimeter"},{"id":"m23-backwards-marking:p9","level":"stretch","type":"mc","q":"The journey was: add 2.5, then multiply by 4, giving 26. Pupil A says divide 26 by 4 then take away 2.5. Pupil B says take 2.5 off 26 then divide by 4. Who has the right order, and why?","options":["Pupil A, because you undo the last forward step first","Pupil B, because you undo the first forward step first","Both work, the order of the undos does not matter","Neither, you should divide 26 by 2.5"],"answer":"Pupil A, because you undo the last forward step first","hint":"Which step happened last on the way forward?","explain":"The last forward step was multiply by 4, so the first undo is divide by 4. 26 / 4 = 6.5, then 6.5 - 2.5 = 4. Pupil A is right. Pupil B's order gives 26 - 2.5 = 23.5, then 23.5 / 4 = 5.875, which fails the check: 5.875 + 2.5 = 8.375, and 8.375 x 4 = 33.5, not 26.","topic":"working backwards: why the undos must run in reverse order"},{"id":"m23-backwards-marking:p10","level":"stretch","type":"text","q":"A pupil's work. Line 1: a triangle has area 30.6 cm^2 and perpendicular height 7.2 cm. Line 2: 30.6 x 2 = 61.2. Line 3: so the base is 61.2 cm. Line 3 is the first wrong one. Write the correct base, in cm.","answer":"8.5","accept":["8.5","8.50","8.5 cm","8.5cm"],"hint":"Two forward steps, so two undos. Only one has been done.","explain":"Forward journey from the base: times the height 7.2, then divide by 2. Line 2 correctly undoes the divide by 2, 30.6 x 2 = 61.2. The times 7.2 is still to undo. 61.2 / 7.2 = 8.5, so the base is 8.5 cm. Check: 8.5 x 7.2 = 61.2, then 61.2 / 2 = 30.6.","topic":"working backwards: area to find a base"}],"m24-backwards-apply":[{"id":"m24-backwards-apply:p1","level":"easy","type":"mc","q":"What is 5/6 of 54?","options":["44","45","48","60"],"answer":"45","hint":"Find one sixth of 54 first.","explain":"54 / 6 = 9, so one sixth is 9. Five sixths is 9 x 5 = 45.","topic":"fractions: finding a fraction of an amount forwards"},{"id":"m24-backwards-apply:p2","level":"easy","type":"mc","q":"Read this but do not work it out: a cable is cut into 24 equal lengths and each one is 0.65 m long. The question asks how long the cable was before it was cut. What is it asking for?","options":["A backward journey, you are given the finished pieces and need the whole","A forward journey, you know the whole and need the length of one piece","A forward journey, add 24 and 0.65","Neither, it is a ratio question"],"answer":"A backward journey, you are given the finished pieces and need the whole","hint":"Which do you know, the cable or the pieces?","explain":"You are handed the pieces, which is where the cutting ended up. The length you started with is missing, so this is backwards. Rebuilding it means 0.65 x 24.","topic":"working backwards: deciding the direction of a question without solving it"},{"id":"m24-backwards-apply:p3","level":"easy","type":"text","q":"A 132 kg load is split between three sledges in the ratio 2:5:4. How heavy is the 5 share, in kg?","answer":"60","accept":["60","60.0","60 kg","60kg","sixty"],"hint":"Add the parts of the ratio first.","explain":"2 + 5 + 4 = 11 parts. One part is 132 / 11 = 12 kg. The 5 share is 5 x 12 = 60 kg. Check: the three shares are 24, 60 and 48, which add to 132.","topic":"ratio: sharing a known total forwards"},{"id":"m24-backwards-apply:p4","level":"easy","type":"mc","q":"A mix is made in the ratio 2:5:4. The 4 share is 48 kg. What is the very first step?","options":["Divide 48 by 4 to find one part","Divide 48 by 11 to find one part","Multiply 48 by 11 to find the total","Add 2, 5 and 4 then divide by 48"],"answer":"Divide 48 by 4 to find one part","hint":"The 48 kg is made of how many parts?","explain":"The 48 kg is the 4 share, so it is 4 parts. One part is 48 / 4 = 12 kg. Nothing else can be built until you have one part. Dividing 48 by 11 would be treating 48 as the whole mix.","topic":"working backwards: choosing the first step from one ratio share"},{"id":"m24-backwards-apply:p5","level":"medium","type":"text","q":"A mix is made in the ratio 2:5:4. The 4 share is 48 kg. How heavy is the whole mix, in kg?","answer":"132","accept":["132","132.0","132 kg","132kg"],"hint":"Find one part, then count how many parts the whole mix has.","explain":"48 / 4 = 12 kg for one part. The whole mix is 2 + 5 + 4 = 11 parts, so 12 x 11 = 132 kg. Stopping at 12, or multiplying by 4 again, both leave you short. Check: 132 / 11 = 12, and 12 x 4 = 48.","topic":"working backwards: one ratio share to the total"},{"id":"m24-backwards-apply:p6","level":"medium","type":"text","q":"A cable is cut into 24 equal lengths, each 0.65 m long, with nothing left over. How long was the cable, in m?","answer":"15.6","accept":["15.6","15.60","15.6 m","15.6m"],"hint":"You know the size of one piece and how many pieces there are.","explain":"You are given the pieces and need the original, so rebuild it: 0.65 x 24 = 15.6 m. Check: 15.6 / 24 = 0.65.","topic":"working backwards: rebuilding a whole length from equal pieces"},{"id":"m24-backwards-apply:p7","level":"medium","type":"mc","q":"A full fuel can weighs 9.4 kg. Empty, the can weighs 1.6 kg. Eight equal bottles of fuel make up the rest. A pupil divides 9.4 by 8 and gets 1.175 kg a bottle. Why does that fail?","options":["The empty can's 1.6 kg has to come off first, so it should be 7.8 divided by 8","9.4 should be divided by 1.6 before anything else","You cannot divide a decimal by a whole number","It does not fail, 1.175 kg is correct"],"answer":"The empty can's 1.6 kg has to come off first, so it should be 7.8 divided by 8","hint":"Write the forward journey. What happened after the bottles went in?","explain":"The forward journey is: eight bottles, then add the empty can. Two steps. Undoing the last step first means 9.4 - 1.6 = 7.8, then 7.8 / 8 = 0.975 kg a bottle. The pupil skipped an undo, so the answer came out too big. Check: 8 x 0.975 = 7.8, then 7.8 + 1.6 = 9.4.","topic":"working backwards: why skipping an undo gives too large an answer"},{"id":"m24-backwards-apply:p8","level":"medium","type":"text","q":"Nine lap times have a mean of 46.5 seconds. Eight of them add up to 374 seconds. What is the ninth lap time, in seconds?","answer":"44.5","accept":["44.5","44.50","44.5 seconds","44.5s"],"hint":"Undo the mean to get the total of all nine first.","explain":"The mean was the total divided by 9, so undo it with a times 9. 46.5 x 9 = 418.5. The ninth lap is 418.5 - 374 = 44.5 seconds. Check: 374 + 44.5 = 418.5, and 418.5 / 9 = 46.5.","topic":"working backwards: mean to a missing value"},{"id":"m24-backwards-apply:p9","level":"stretch","type":"text","q":"A triangle has area 20.16 cm^2 and base 6.4 cm. What is its perpendicular height, in cm?","answer":"6.3","accept":["6.3","6.30","6.3 cm","6.3cm"],"hint":"Two forward steps, so two undos, last one first.","explain":"Forward journey from the height: times 6.4, then divide by 2. Undo the divide by 2 first, 20.16 x 2 = 40.32. Then undo the times 6.4, 40.32 / 6.4 = 6.3 cm. Stopping at 40.32 is the usual error. Check: 6.4 x 6.3 = 40.32, then 40.32 / 2 = 20.16.","topic":"working backwards: area to find a perpendicular height"},{"id":"m24-backwards-apply:p10","level":"stretch","type":"mc","q":"A water butt holds 16.2 litres when it is 3/4 full. Which method gives the full capacity?","options":["Divide 16.2 by 3, then multiply by 4","Multiply 16.2 by 3, then divide by 4","Divide 16.2 by 4, then multiply by 3","Multiply 16.2 by 3/4"],"answer":"Divide 16.2 by 3, then multiply by 4","hint":"What does 16.2 divided by 3 give you one of?","explain":"16.2 is three quarters, so dividing by 3 gives one quarter, 5.4 litres. A full butt is four quarters, so 5.4 x 4 = 21.6 litres. Multiplying by 3/4 makes it smaller, which is the forward move, not the backward one. Check: 21.6 x 3 / 4 = 16.2.","topic":"working backwards: choosing the method to find a whole from a fraction"}],"w6u1-warmup":[{"id":"w6u1-warmup:p1","level":"easy","type":"mc","q":"A pupil's work. Line 1: a number is multiplied by 3, then 8 is taken away, giving 19. Line 2: 19 + 8 = 27. Line 3: so the number is 27. Which line is the first wrong one?","options":["Line 1","Line 2","Line 3","No line is wrong"],"answer":"Line 3","hint":"Two steps forward means two undos.","explain":"Line 2 is right, 19 + 8 = 27. The times 3 has not been undone yet. 27 / 3 = 9. Check: 9 x 3 = 27, then 27 - 8 = 19.","topic":"working backwards: marking a solution that stops after one undo"},{"id":"w6u1-warmup:p2","level":"easy","type":"text","q":"A wet football shirt is hung outside in the sun and an hour later it is dry. The water has gone into the air as water vapour. What is this stage of the water cycle called?","answer":"evaporation","accept":["evaporation","evaporating","evaporate","evaporates","evaporated"],"hint":"Liquid going up into the air as a gas.","explain":"Evaporation is liquid water turning into water vapour and going up into the air. Condensation is the opposite, vapour turning back into liquid.","topic":"water cycle: naming evaporation"},{"id":"w6u1-warmup:p3","level":"medium","type":"mc","q":"Two versions: A says 'The engine stopped, the lights went out.' B says 'The engine stopped and the lights went out.' Which is joined correctly, and what is wrong with the other?","options":["B is correct, A needs a joining word or a semicolon instead of the comma","A is correct, B needs a comma before and","Both are correct as they stand","Neither, both have to be split with full stops"],"answer":"B is correct, A needs a joining word or a semicolon instead of the comma","hint":"A comma on its own cannot hold two complete sentences together.","explain":"A glues two complete sentences together with only a comma. B fixes it with the joining word 'and'. A semicolon in place of the comma would fix it too.","topic":"English: joining two clauses correctly"},{"id":"w6u1-warmup:p4","level":"medium","type":"text","q":"A river drops 2.75 km from its source to the sea. A pupil wrote that as 275 m. Write the correct number of metres.","answer":"2750","accept":["2750","2750 m","2750m","2,750","2750.0"],"hint":"There are 1000 m in 1 km, not 100.","explain":"2.75 x 1000 = 2750 m. The pupil multiplied by 100 instead of 1000, which is the usual slip. Check: 2750 / 1000 = 2.75.","topic":"geography and measures: converting km to m"},{"id":"w6u1-warmup:p5","level":"medium","type":"mc","q":"A barge is towed along a canal at a steady speed. Pupil A says the forward pull has to be bigger than the backwards force, because the barge is moving. Pupil B says the two are the same size. Who is right, and why?","options":["Pupil B, because at a steady speed the forces balance exactly","Pupil A, because moving forwards needs the bigger pull","Pupil A, because the water pushes back less than the rope pulls","Neither, you cannot tell without being given the numbers"],"answer":"Pupil B, because at a steady speed the forces balance exactly","hint":"A bigger forward force would not give a steady speed.","explain":"Steady speed means balanced forces, so the two are the same size. A bigger forward pull would make the barge speed up, not hold a steady speed. Movement does not need an extra force, only a change of speed does.","topic":"forces: balanced forces at steady speed"}],"w6u2-warmup":[{"id":"w6u2-warmup:p1","level":"easy","type":"mc","q":"A pupil's work. Line 1: a rectangle has area 5.4 m^2 and width 1.2 m. Line 2: length = 5.4 x 1.2 = 6.48 m. Line 3: so the length is 6.48 m. Which line is the first wrong one?","options":["Line 1","Line 2","Line 3","No line is wrong"],"answer":"Line 2","hint":"The area was made by multiplying. What undoes a multiply?","explain":"The area came from length times width, so getting back to the length means dividing, not multiplying. 5.4 / 1.2 = 4.5 m. Check: 4.5 x 1.2 = 5.4.","topic":"working backwards: marking a reverse step done as a multiply"},{"id":"w6u2-warmup:p2","level":"easy","type":"mc","q":"Simplify 6y - 4 - 9y - 3.","options":["-3y - 7","-3y - 1","3y - 7","-3y + 7"],"answer":"-3y - 7","hint":"Collect the y terms, then the plain numbers, keeping every sign with its own term.","explain":"6y - 9y = -3y. For the numbers, you take away 4 and then take away 3 more, so -4 - 3 = -7. The answer is -3y - 7.","topic":"algebra: signs when collecting like terms"},{"id":"w6u2-warmup:p3","level":"medium","type":"text","q":"A monastery was founded in 612 AD and burned down in 870 AD. For how many years did it stand?","answer":"258","accept":["258","258 years","two hundred and fifty eight"],"hint":"Both dates are AD, so take one from the other.","explain":"870 - 612 = 258 years. Check: 612 + 258 = 870.","topic":"history: calculating a span of AD years"},{"id":"w6u2-warmup:p4","level":"medium","type":"text","q":"In this sentence, write the one word that is the adverb: 'The pilot read the dial quickly and pulled the lever.'","answer":"quickly","accept":["quickly","Quickly"],"hint":"Which word tells you how the reading was done?","explain":"Quickly tells you how he read the dial, so it is the adverb. Pilot, dial and lever are nouns, and read and pulled are verbs.","topic":"English: identifying an adverb in a given sentence"},{"id":"w6u2-warmup:p5","level":"medium","type":"text","q":"A gauge records rainfall of 4 mm, 9 mm, 0 mm, 2 mm and 0 mm over five days. What is the mean daily rainfall, in mm?","answer":"3","accept":["3","3 mm","3mm","3.0","three"],"hint":"Add all five, including both zeros, then divide by how many days.","explain":"4 + 9 + 0 + 2 + 0 = 15, and 15 / 5 = 3 mm. A zero day is still a day, so you divide by 5, not by 3.","topic":"statistics: mean of a small data set including a zero"}],"w6u3-warmup":[{"id":"w6u3-warmup:p1","level":"easy","type":"mc","q":"A pupil's work. Line 1: grit and salt are mixed in the ratio 6:5. Line 2: there is 1.8 kg of salt. Line 3: one part is 1.8 / 5 = 0.36 kg. Line 4: so the whole mix is 0.36 x 6 = 2.16 kg. Which line is the first wrong one?","options":["Line 1","Line 2","Line 3","Line 4"],"answer":"Line 4","hint":"How many parts are in the whole mix, not just the grit?","explain":"Line 3 is right, one part is 0.36 kg. Line 4 uses 6 parts, which is only the grit. The whole mix is 6 + 5 = 11 parts, so 0.36 x 11 = 3.96 kg. Check: 3.96 split 6:5 gives 2.16 kg of grit and 1.8 kg of salt.","topic":"working backwards: marking a ratio where one share is treated as the total"},{"id":"w6u3-warmup:p2","level":"easy","type":"text","q":"A shepherd's hut is at the six figure grid reference 619 048. Which four figure grid square is it in?","answer":"6104","accept":["6104","61 04","61,04"],"hint":"A four figure reference uses the first two digits of each half.","explain":"Drop the third digit of each half. The easting 619 becomes 61 and the northing 048 becomes 04, giving the square 6104. The zero has to stay in, so 614 is wrong.","topic":"geography: six figure to four figure grid references"},{"id":"w6u3-warmup:p3","level":"easy","type":"text","q":"The inside of a car windscreen goes misty on a cold morning, because water vapour in the air turns into tiny drops of liquid on the cold glass. What is this stage of the water cycle called?","answer":"condensation","accept":["condensation","condensing","condense","condenses","condensed"],"hint":"Gas turning back into liquid.","explain":"Condensation is water vapour turning back into liquid water, which is what settles on the cold glass. Evaporation is the other way round, liquid turning into vapour.","topic":"water cycle: naming condensation"},{"id":"w6u3-warmup:p4","level":"medium","type":"text","q":"A stone bridge was finished in 1347. A flood destroyed it 46 years later. In which year was it destroyed?","answer":"1393","accept":["1393","1393 AD","AD 1393"],"hint":"Add the gap to the earlier year.","explain":"1347 + 46 = 1393. Check: 1393 - 1347 = 46.","topic":"history: adding a gap of years to a date"},{"id":"w6u3-warmup:p5","level":"medium","type":"mc","q":"Which word completes this sentence correctly: 'The crew left ___ tools on the deck.'","options":["their","there","they're","theirs"],"answer":"their","hint":"The missing word shows the tools belong to the crew.","explain":"Their shows belonging, so the tools are the crew's own. There is about place, they're is short for they are, and theirs is never followed by a noun.","topic":"English: homophones their, there and they're"}],"w6u4-warmup":[{"id":"w6u4-warmup:p1","level":"easy","type":"text","q":"A number is divided by 8, then 1.75 is added, giving 4.25. What was the number?","answer":"20","accept":["20","20.0","twenty"],"hint":"Two steps forward means two undos, last one first.","explain":"Forward journey: divide by 8, then add 1.75. Undo the add first, 4.25 - 1.75 = 2.5. Then undo the divide by 8, so 2.5 x 8 = 20. Stopping at 2.5 is the usual error. Check: 20 / 8 = 2.5, then 2.5 + 1.75 = 4.25.","topic":"working backwards: two step number journey with decimals"},{"id":"w6u4-warmup:p2","level":"easy","type":"text","q":"Six wind readings are 18, 22, 19, 21, 20 and 240 mph. The 240 is a fault and is thrown out. What is the mean of the five readings that are left?","answer":"20","accept":["20","20.0","20 mph","20mph","twenty"],"hint":"Add the five you are keeping, then divide by 5.","explain":"18 + 22 + 19 + 21 + 20 = 100, and 100 / 5 = 20 mph. Once the anomaly is thrown out you divide by 5, not 6.","topic":"statistics: mean with an anomaly removed"},{"id":"w6u4-warmup:p3","level":"medium","type":"mc","q":"Which one of these is a complete sentence?","options":["The rope held.","Although the rope held.","Holding onto the rope.","When the rope held."],"answer":"The rope held.","hint":"A complete sentence makes sense on its own and has a subject and a verb.","explain":"The rope held has a subject and a verb and stands on its own. The other three are fragments, and each one leaves you waiting for the rest of the idea.","topic":"English: complete sentences and fragments"},{"id":"w6u4-warmup:p4","level":"medium","type":"mc","q":"A ship's log reads: 'Day nineteen. No wind since Tuesday. Water down to one cup each.' What does this tell you about their situation?","options":["They had been becalmed for days and were running short of water","They were sailing fast and expected to reach port soon","They had plenty of water but had run out of food","A storm had damaged the ship"],"answer":"They had been becalmed for days and were running short of water","hint":"Put the two facts in the entry together.","explain":"No wind since Tuesday means they had been stuck for days, and rationing water to one cup each means supplies were nearly gone. Nothing in the entry mentions food or a storm, so neither can be concluded from it.","topic":"history: drawing a conclusion from a written source"},{"id":"w6u4-warmup:p5","level":"medium","type":"text","q":"A crate is lowered on a cable at a steady speed. The upward force from the cable is 850 N. What is the size of the crate's weight, in N?","answer":"850","accept":["850","850 N","850N","eight hundred and fifty"],"hint":"Steady speed means the two forces are the same size.","explain":"At a steady speed the forces balance, so the weight is also 850 N. If the weight were larger the crate would speed up as it went down.","topic":"forces: balanced forces during steady descent"}],"w6u5-warmup":[{"id":"w6u5-warmup:p1","level":"easy","type":"mc","q":"A pupil's work. Line 1: 3/7 of a number is 12. Line 2: one seventh is 12 / 3 = 4. Line 3: so the number is 4 x 3 = 12. Which line is the first wrong one?","options":["Line 1","Line 2","Line 3","No line is wrong"],"answer":"Line 3","hint":"How many sevenths make a whole?","explain":"Line 2 is right, one seventh is 4. A whole is seven sevenths, so the number is 4 x 7 = 28, not 4 x 3. Multiplying by 3 again just rebuilds the part you started with. Check: 28 / 7 = 4, and 4 x 3 = 12.","topic":"working backwards: marking a fraction of an amount rebuilt with the wrong number of parts"},{"id":"w6u5-warmup:p2","level":"easy","type":"mc","q":"Put these three dates in order, earliest first: 80 AD, 240 BC, 15 BC.","options":["240 BC, 15 BC, 80 AD","15 BC, 240 BC, 80 AD","80 AD, 15 BC, 240 BC","240 BC, 80 AD, 15 BC"],"answer":"240 BC, 15 BC, 80 AD","hint":"BC years count down towards zero, AD years count up.","explain":"Every BC date comes before every AD date, and inside BC a bigger number is earlier, so 240 BC comes before 15 BC. Then 80 AD is last.","topic":"history: ordering BC and AD dates"},{"id":"w6u5-warmup:p3","level":"medium","type":"text","q":"A track climbs from a spot height of 86 m to a spot height of 431 m. How much height is gained, in m?","answer":"345","accept":["345","345 m","345m","three hundred and forty five"],"hint":"Take the lower height from the higher one.","explain":"431 - 86 = 345 m. Check: 86 + 345 = 431.","topic":"geography: height gain from spot heights"},{"id":"w6u5-warmup:p4","level":"medium","type":"mc","q":"A cold bottle of water is carried outside on a warm day and goes wet all over the outside. On the same day a puddle on the path slowly disappears. Which is which?","options":["The bottle is condensation, the puddle is evaporation","The bottle is evaporation, the puddle is condensation","Both are condensation","Both are evaporation"],"answer":"The bottle is condensation, the puddle is evaporation","hint":"One of them is water arriving from the air, the other is water leaving into the air.","explain":"The water on the bottle came out of the air and settled on cold glass, which is condensation, gas to liquid. The puddle went up into the air, which is evaporation, liquid to gas. The bottle did not leak, so nothing evaporated there.","topic":"water cycle: telling evaporation and condensation apart"},{"id":"w6u5-warmup:p5","level":"medium","type":"mc","q":"Which sentence uses the apostrophe correctly?","options":["The driver's door jammed.","The drivers door jammed.","The driver's door jammed's.","The drivers' door's jammed's."],"answer":"The driver's door jammed.","hint":"The apostrophe goes on the owner, not on the verb.","explain":"One driver owns the door, so the apostrophe goes after driver and before the s: driver's. The others either leave it out altogether or stick one onto a verb, which never happens.","topic":"English: apostrophes for single possession"}]},"week":6,"weekLabel":"Week 6","version":"w6-2026-10-14"};
let SESS=P.sessions, TESTS=P.tests, DAYS=P.days, BOOKS=P.books, HAND=P.hand;

let BUILTIN=P;                       /* shipped copy, used until Drive answers */
/* Use the cached week only if it is not older than the one shipped in this file.
   Version strings sort correctly (w3-2026-08-13 < w4-2026-08-24), so a newer
   build shipped to the page wins on its own, without waiting for Drive. */
try{const c=localStorage.getItem('surajOS_content');
  if(c){const j=JSON.parse(c);
    if(j&&j.version&&j.version>=(BUILTIN.version||''))P=j;
    else if(j&&j.version)try{localStorage.removeItem('surajOS_content')}catch(_){}
  }}catch(e){}
let VER=P.version||'w0';
let MEM={}, STORE_FAIL=false;
function skey(){return 'surajOS_p_'+VER}
const store={
  get(){try{const v=localStorage.getItem(skey());return v?JSON.parse(v):(MEM[VER]||null)}catch(e){return MEM[VER]||null}},
  set(o){MEM[VER]=o;try{localStorage.setItem(skey(),JSON.stringify(o));STORE_FAIL=false;return true}
         catch(e){STORE_FAIL=true;return false}}
};
let S=store.get()||{};
S.ans=S.ans||{}; S.done=S.done||{}; S.reading=S.reading||{}; S.hand=S.hand||{};
S.shots=S.shots||{}; S.cfg=S.cfg||{}; S.long=S.long||{};
S.rans=S.rans||{}; S.rdone=S.rdone||{};
S.swap=S.swap||{}; S.swapHist=S.swapHist||[]; S.shuf=S.shuf||{}; S.qsec=S.qsec||{};
function save(){store.set(S)}
let PHOTOS={};  /* kept in memory only, never persisted */
const POOLS=P.pools||{};

/* Extra practice, filtered to the topics he actually got wrong. His own idea. */
function poolFor(id){
  /* A pool question already used to replace a question he walked away from is
     spent. It must not come back round as extra practice. */
  const spent=new Set(S.swapHist||[]);
  const pool=(POOLS[id]||[]).filter(q=>!spent.has(q.id)); if(!pool.length)return [];
  const qs=qsOf(id).filter(q=>q.type!=='long');
  const wrong=new Set(qs.filter(q=>S.ans[q.id]!==undefined&&isRight(q,S.ans[q.id])===false).map(q=>q.topic));
  const hit=pool.filter(q=>wrong.has(q.topic));
  const rest=pool.filter(q=>!wrong.has(q.topic));
  return (hit.length>=4?hit:hit.concat(rest)).slice(0,8);
}
function retryScore(id){
  const qs=poolFor(id);
  const a=qs.filter(q=>S.rans[q.id]!==undefined);
  return {right:a.filter(q=>isRight(q,S.rans[q.id])===true).length,answered:a.length,total:qs.length};
}

/* ---------- work from an earlier week, still on this iPad ----------
   Each week is stored under its own key. When a new week arrives the old week's
   answers are still on the device but nothing looks at them again, so work that
   never reached the sheet would quietly disappear from view. It happened with
   week 5: he did it, it showed as done on his side, and none of it arrived.
   This finds any earlier week that has finished sessions in it and refuses to
   let go of it until it has been sent. */
function oldWeeks(){
  const out=[];
  try{
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(!k||k.indexOf('surajOS_p_')!==0||k==='surajOS_p_'+VER)continue;
      let d=null; try{d=JSON.parse(localStorage.getItem(k)||'null')}catch(_){continue}
      if(!d)continue;
      const done=Object.keys(d.done||{}).filter(x=>d.done[x]).length;
      const ans=Object.keys(d.ans||{}).length;
      if(!done&&!ans)continue;
      out.push({key:k,version:k.slice(10),done:done,answers:ans,data:d});
    }
  }catch(e){}
  return out.sort((a,b)=>a.version<b.version?-1:1);
}
function recoverText(w){
  return JSON.stringify({recovered:w.version,done:w.data.done||{},ans:w.data.ans||{},
    rans:w.data.rans||{},long:w.data.long||{},reading:w.data.reading||{},hand:w.data.hand||{}});
}
function recoverSend(){
  oldWeeks().forEach(w=>{
    const body=recoverText(w);
    push('recover',{fromVersion:w.version,sessionsDone:w.done,answers:w.answers,payload:body});
    /* Belt and braces. The sheet has had a row type for 'test' since the start, so
       the same thing goes out a second way. If one of the two is dropped at the far
       end the work is still there, and a duplicate costs nothing. */
    push('test',{message:'RECOVERED '+w.version+' '+body.slice(0,40000)});
  });
  return oldWeeks().length;
}

/* ---------- leaving the app changes the question ----------
   If he goes to another tab or another app while a question is open and not yet
   answered, that question is swapped for a different one on the same topic before
   he gets back to it. A question copied into a search box is worth nothing by the
   time he returns. Where there is no spare question on that topic, the options are
   put in a different order and the typing box is cleared instead.
   He is told it happened, and told why. Nothing is hidden from him. */
let SWAPMSG='';
function freeSwap(sid,q){
  const spent=new Set(S.swapHist||[]);
  const free=(POOLS[sid]||[]).filter(p=>p.type!=='long'&&p.id!==q.id&&!spent.has(p.id));
  /* First choice is a different question on exactly the same topic. Where the pool
     has run out of that topic, take one of the same difficulty from the same session
     rather than let the question stand: he still gets a question he has not seen. */
  let c=free.filter(p=>p.topic===q.topic);
  if(!c.length)c=free.filter(p=>p.level===q.level);
  if(!c.length)c=free;
  return c.length?c[Math.floor(Math.random()*c.length)].id:null;
}
function onReturn(awayMs){
  if(awayMs<2000)return;                                  /* a flicker of focus is not leaving */
  if(!view||view.name!=='q'||!view.id)return;
  const qs=qsOf(view.id),q=qs[view.i];
  if(!q||q.type==='long')return;                          /* the long write is his own words anyway */
  if(S.ans[q.id]!==undefined)return;                      /* already answered and marked */
  const base=q._from||q.id;
  const t=freeSwap(view.id,q);
  if(t){S.swapHist.push(t);S.swap[base]=t;S.shuf[t]=(S.shuf[t]||0)+1}
  else{S.shuf[q.id]=(S.shuf[q.id]||0)+1}
  const tk=TRACK[view.id]; if(tk)tk.swaps=(tk.swaps||0)+1;
  QTID=null;
  SWAPMSG=t
    ? 'You went off the app, so this is a different question now. Same skill, different numbers. It does not count against you, and you have lost nothing.'
    : 'You went off the app, so this question has been reset and the answers put in a different order. It does not count against you.';
  save();render();
}

/* Options are put in a fixed but scrambled order once a question has been reset,
   so a letter written down somewhere else points at nothing. */
function optOrder(q){
  const n=(S.shuf||{})[q.id]||0, o=(q.options||[]).slice();
  if(!n)return o;
  let seed=0; const k=String(q.id)+':'+n;
  for(let i=0;i<k.length;i++)seed=(seed*31+k.charCodeAt(i))>>>0;
  for(let i=o.length-1;i>0;i--){seed=(seed*1664525+1013904223)>>>0;const j=seed%(i+1);const t=o[i];o[i]=o[j];o[j]=t}
  return o;
}

/* Time on each question on its own, not just the session total. A hard question
   answered right in four seconds is worth a second look. */
let QT0=null,QTID=null;
function qClock(qid){if(QTID!==qid){QTID=qid;QT0=Date.now()}}
function stampQ(q){if(QT0&&q)S.qsec[q.id]=Math.round((Date.now()-QT0)/1000)}
function fastRight(id){
  return qsOf(id).filter(q=>q.type!=='long'&&S.ans[q.id]!==undefined&&isRight(q,S.ans[q.id])===true
    &&(q.level==='medium'||q.level==='stretch')&&(S.qsec[q.id]===undefined?99:S.qsec[q.id])<8).length;

  const t=TRACK[id]; if(t&&t.swaps)return t.swaps;
  return qsOf(id).filter(q=>q._from).length;
}

/* Honesty signals. Declared openly to him in the app, never hidden. */

function trackStart(id){
  CUR=id;

  const ms=Date.now()-AWAY0;
  if(CUR&&TRACK[CUR])TRACK[CUR].away+=Math.round(ms/1000);

function bindHonesty(){

  ta.addEventListener('paste',e=>{

    let txt=''; try{txt=(e.clipboardData||window.clipboardData).getData('text')||''}catch(_){}

/* ---------- marking ---------- */
function norm(s){
  var t=String(s==null?'':s).toLowerCase().trim().replace(/[‘’]/g,"'").replace(/[“”]/g,'"')
    .replace(/[£$€]/g,'').replace(/\s+/g,' ').replace(/[.!;]+$/,'').trim();
  /* A wrapping pair of brackets is not a wrong answer. (2a + 2b) is 2a + 2b. */
  var m=t.match(/^\((.*)\)$/);
  if(m&&m[1].indexOf('(')===-1&&m[1].indexOf(')')===-1)t=m[1].trim();
  return t;
}
function squash(s){return norm(s).replace(/\s+/g,'').replace(/[−–—]/g,'-')}
function isRight(q,g){
  if(q.type==='mc')return g===q.answer;
  if(q.type==='text'){
    const acc=(q.accept||[q.answer]).map(norm), gg=norm(g);
    if(acc.includes(gg))return true;
    if(acc.map(a=>a.replace(/\s+/g,'').replace(/[−–—]/g,'-')).includes(squash(g)))return true;
    var an=parseNum(q.answer),gn=parseNum(g);
    if(an!==null&&gn!==null&&Math.abs(an-gn)<1e-9)return true;
    return false;
  }
  return null;
}
function numeric(q){return q.type==='text'&&/^-?[\d.,\/\s]+$/.test(String(q.answer||''))}
function parseNum(s){
  if(s==null)return null;
  var t=String(s).toLowerCase().trim().replace(/[\u2212\u2013\u2014]/g,'-').replace(/,/g,'').replace(/[£$€]/g,'')
    .replace(/\s*(kilometres|kilometers|metres|meters|degrees|degree|km|cm|mm|m|c)\b\.?/g,'').trim();
  /* A unit written after a number is not a wrong answer. He put "7 mps" for 7 and lost
     the mark. Strip any trailing unit word or symbol once the number is already there. */
  var um=t.match(/^(-?\d+\s+\d+\s*\/\s*\d+|-?\d*\.?\d+(?:\s*\/\s*-?\d+)?)(?:\s*(?:[a-z][a-z\/%^0-9\u00b2\u00b3]*|[\^\u00b2\u00b3][0-9]*))?\.?$/);
  if(um)t=um[1].trim();
  if(!t)return null;
  var m=t.match(/^(-?\d+)\s+(\d+)\s*\/\s*(\d+)$/);
  if(m){var w=+m[1],nn=+m[2],d=+m[3];if(!d)return null;return w<0?w-nn/d:w+nn/d}
  m=t.match(/^(-?\d+)\s*\/\s*(-?\d+)$/);
  if(m){if(+m[2]===0)return null;return +m[1]/+m[2]}
  if(/^-?\d*\.?\d+$/.test(t))return parseFloat(t);
  return null;
}
function simplifyNote(q,g){
  if(!/simplest form/i.test(q.q||''))return '';
  var m=String(g||'').trim().match(/^(-?\d+)\s*\/\s*(\d+)$/);if(!m)return '';
  var a=Math.abs(+m[1]),b=Math.abs(+m[2]);if(!b)return '';
  var gcd=function(x,y){return y?gcd(y,x%y):x};
  if(gcd(a,b)<=1)return '';
  return '\n\nThat is the right value. The question asked for simplest form though, and '+m[1]+'/'+m[2]+' divides down to '+q.answer+'.';
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function isTest(id){return !!TESTS[id]}
function qsOf(id){
  let o=[];
  if(isTest(id)){TESTS[id].bands.forEach(b=>o=o.concat(b.questions.map(q=>({...q,_ex:b.extract||null,_bl:b.label}))))}
  else{const s=SESS[id]; o=s?s.questions.map(q=>({...q,_ex:s.extract||null})):[]}
  return o.map(q=>applySwap(id,q));
}
/* If a question was replaced while he was off the app, it stays replaced, in every
   view: the question screen, the marking, the score, the summary that reaches Keitan. */
function applySwap(id,q){
  const t=(S.swap||{})[q.id]; if(!t)return q;
  const r=(POOLS[id]||[]).find(p=>p.id===t); if(!r)return q;
  return {...r,_ex:q._ex,_bl:q._bl,_from:q.id,level:r.level||q.level};
}
function titleOf(id){return isTest(id)?TESTS[id].title:(SESS[id]?SESS[id].subject+': '+SESS[id].title:id)}
function subjOf(id){return isTest(id)?(id==='s1-retest'?'Science':'Test'):(SESS[id]?SESS[id].subject:'')}
function scoreOf(id){
  const qs=qsOf(id).filter(q=>q.type!=='long');
  const a=qs.filter(q=>S.ans[q.id]!==undefined);
  return {right:a.filter(q=>isRight(q,S.ans[q.id])===true).length,answered:a.length,total:qs.length};
}
function dayDone(d){return d.blocks.every(b=>S.done[b.id])}
function overallPct(){
  let t=0,dn=0;DAYS.forEach(d=>d.blocks.forEach(b=>{t++;if(S.done[b.id])dn++}));
  return t?Math.round(dn/t*100):0;
}

/* ---------- sync ---------- */
function setDot(c){const e=document.getElementById('sdot');if(e)e.className='syncdot '+(c||'')}
/* ---------- outbox ----------
   Nothing is ever sent straight out. It goes in a queue on the device first, and
   only leaves the queue once the send has actually worked. A failed send used to
   vanish with nothing but a grey dot, which meant a week of real work could be
   done and never arrive. The queue survives the app closing. */
const OUTBOX_KEY='surajOS_outbox';
let OUT=[];
try{OUT=JSON.parse(localStorage.getItem(OUTBOX_KEY)||'[]')||[]}catch(e){OUT=[]}
function outSave(){try{localStorage.setItem(OUTBOX_KEY,JSON.stringify(OUT))}catch(e){}}
function outCount(){return OUT.length}

let FLUSHING=false;
async function flush(){
  const url=(S.cfg.sync||'').trim();
  if(FLUSHING||!OUT.length||!url)return false;
  FLUSHING=true;setDot('busy');
  let sent=0;
  while(OUT.length){
    const item=OUT[0];
    try{
      await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
        body:JSON.stringify(item)});
    }catch(e){
      FLUSHING=false;setDot('err');outSave();render();return false;   /* keep it, try again later */
    }
    OUT.shift();sent++;outSave();
  }
  FLUSHING=false;setDot('on');
  if(sent){S.cfg.lastSync=new Date().toISOString();save()}
  render();
  return true;
}

function push(kind,body){
  OUT.push({kind:kind,week:P.week,at:new Date().toISOString(),
            uid:kind+'-'+Math.random().toString(36).slice(2,10),...body});
  outSave();
  flush();
  return true;
}

/* Try again whenever there is a reason to think the connection is back. */
window.addEventListener('online',()=>flush());
document.addEventListener('visibilitychange',()=>{if(!document.hidden)flush()});

/* Re-queue every finished session on this device. The recovery button. */
function resendEverything(){
  const ids=Object.keys(S.done||{}).filter(id=>S.done[id]&&(SESS[id]||TESTS[id]));
  ids.forEach(id=>pushSession(id));
  Object.keys(S.rdone||{}).forEach(id=>{if(S.rdone[id]&&SESS[id])pushRetry(id)});
  pushDailyNow();
  return ids.length;
}
function pushRetry(id){
  const first=scoreOf(id), again=retryScore(id);
  const qs=poolFor(id).filter(q=>S.rans[q.id]!==undefined&&isRight(q,S.rans[q.id])===false);
  push('retry',{session:id,title:titleOf(id),subject:subjOf(id),
    firstRight:first.right,firstTotal:first.total,
    retryRight:again.right,retryTotal:again.total,
    stillWrong:[...new Set(qs.map(q=>q.topic))].join('; ')});
}
/* He types page ranges, "61-90", not counts. parseInt read that as 61, so three
   sittings of real reading were reported as 285 pages when he had read 143. */
function pagesOf(v){
  const s=String(v==null?'':v).trim(); if(!s)return 0;
  const m=s.match(/^(\d+)\s*(?:-|to|\u2013)\s*(\d+)$/i);
  if(m){const a=+m[1],b=+m[2];return b>a?b-a:0}
  const n=parseInt(s,10);
  return isFinite(n)&&n>=0?n:0;
}
function pushDailyNow(){
  const H=S.hand||{};
  push('daily',{
    book:S.reading.book||'', notes:S.reading.notes||'',
    pages:DAYS.map(d=>d.label+' '+((S.reading[d.key]||{}).pages||'0')).join(', '),
    pagesTotal:DAYS.reduce((a,d)=>a+(pagesOf((S.reading[d.key]||{}).pages)||0),0),
    handDays:DAYS.filter(d=>H[d.key]).length,
    words:H.words||'', legible:H.legible||'', ache:H.ache||''
  });
}
let dailyT=null;
function pushDaily(){
  clearTimeout(dailyT);
  dailyT=setTimeout(()=>{
    const H=S.hand||{};
    push('daily',{
      book:S.reading.book||'', notes:S.reading.notes||'',
      pages:DAYS.map(d=>d.label+' '+((S.reading[d.key]||{}).pages||'0')).join(', '),
      pagesTotal:DAYS.reduce((a,d)=>a+(pagesOf((S.reading[d.key]||{}).pages)||0),0),
      handDays:DAYS.filter(d=>H[d.key]).length,
      words:H.words||'', legible:H.legible||'', ache:H.ache||''
    });
  },2500);
}
function pushSession(id){
  const sc=scoreOf(id), qs=qsOf(id).filter(q=>q.type!=='long');
  const wrong=qs.filter(q=>S.ans[q.id]!==undefined&&isRight(q,S.ans[q.id])===false);
  const t=TRACK[id]||{};
  const mins=t.t0?Math.round((Date.now()-t.t0)/600)/100:'';
  const longs=qsOf(id).filter(q=>q.type==='long'&&(S.long[q.id]||'').trim());
  push('session',{session:id,title:titleOf(id),subject:subjOf(id),
    right:sc.right,total:sc.total,
    gaps:[...new Set(wrong.map(q=>q.topic))].join('; '),
    detail:wrong.map(q=>({q:q.q,gave:S.ans[q.id],correct:q.answer,topic:q.topic})),
    minutes:mins, pastes:t.paste||0, pasteChars:t.pasteChars||0,
    modelOpens:t.model||0, modelEarly:t.modelEarly||0, keystrokes:t.keys||0, awaySeconds:t.away||0,
    swaps:swapCount(id), fastRight:fastRight(id),
    qSeconds:qs.map(q=>q.id+'='+(S.qsec[q.id]===undefined?'?':S.qsec[q.id])).join(' '),
    writing:longs.map(q=>({task:q.q,text:S.long[q.id],marks:q.marks||0,
      words:(S.long[q.id]||'').trim().split(/\s+/).length,checklist:q.explain||''}))});
}
function shrink(file){
  return new Promise(res=>{
    const r=new FileReader();
    r.onload=()=>{const img=new Image();img.onload=()=>{
      const m=1200,sc=Math.min(1,m/Math.max(img.width,img.height));
      const c=document.createElement('canvas');c.width=img.width*sc;c.height=img.height*sc;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      res(c.toDataURL('image/jpeg',0.7));
    };img.src=r.result};
    r.readAsDataURL(file);
  });
}
