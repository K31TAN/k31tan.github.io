 "answer": "Um sieben Uhr esse ich Fruehstueck."}, "example2": {"problem": "What time is halb sieben?", "steps": ["Find the number. Sieben is seven.", "Halb points forwards to that hour, not backwards from it.", "So halb sieben means half way to seven.", "Half way to seven is thirty minutes before seven."], "answer": "Half past six, or 6:30."}, "keyfact": "Learn der, die or das with every noun. All seven days are der words and take am. Halb neun means half past eight, not half past nine."}, "questions": [{"id": "de8-vocab-daily:q1", "level": "easy", "type": "mc", "q": "Which is correct for the school?", "options": ["der Schule", "die Schule", "das Schule", "den Schule"], "answer": "die Schule", "hint": "Most words ending in -e that name a place or a thing are die words.", "explain": "The answer is die Schule. Schule is a die word, so it is die Schule in the subject slot and die Schule in the object slot too, because die never changes. Learn it as die Schule and not just Schule.", "topic": "vocabulary: gender of Schule"}, {"id": "de8-vocab-daily:q2", "level": "easy", "type": "mc", "q": "Which day is Mittwoch?", "options": ["Monday", "Tuesday", "Wednesday", "Thursday"], "answer": "Wednesday", "hint": "It sits in the middle of the working week, and the name says so.", "explain": "The answer is Wednesday. Mittwoch literally means mid week, because it is the middle day of Monday to Friday. Monday is Montag, Tuesday is Dienstag and Thursday is Donnerstag.", "topic": "vocabulary: days of the week"}, {"id": "de8-vocab-daily:q3", "level": "easy", "type": "text", "q": "Write on Friday in German.", "answer": "am Freitag", "accept": ["am Freitag", "am Freitag.", "am freitag", "am freitag.", "Am Freitag", "Am Freitag."], "hint": "Days take a small word in front that means on.", "explain": "The answer is am Freitag. All seven days are der words, and on a day is am plus the day, so it is am Montag, am Dienstag and so on. Freitag has a capital F because every German noun has a capital letter.", "topic": "vocabulary: saying on a day"}, {"id": "de8-vocab-daily:q4", "level": "easy", "type": "mc", "q": "Which is correct for the book?", "options": ["der Buch", "die Buch", "das Buch", "den Buch"], "answer": "das Buch", "hint": "This is the one you have already used in sentences about reading.", "explain": "The answer is das Buch. Buch is a das word, so it is das Buch whether it is doing the action or having the action done to it, because das never changes.", "topic": "vocabulary: gender of Buch"}, {"id": "de8-vocab-daily:q5", "level": "easy", "type": "text", "q": "Fill the gap with the German word for eight: Es ist ___ Uhr.", "answer": "acht", "accept": ["acht", "acht.", "Acht", "Acht.", "acht Uhr", "Acht Uhr"], "hint": "It sounds a bit like the English word but with a throaty ch at the end.", "explain": "The answer is acht. Es ist acht Uhr means it is eight o'clock. Uhr is the word for o'clock here, and it stays the same whatever the number in front of it.", "topic": "vocabulary: numbers in telling the time"}, {"id": "de8-vocab-daily:q6", "level": "medium", "type": "mc", "q": "What does halb neun mean?", "options": ["Half past nine", "Half past eight", "Nine o'clock", "Quarter past nine"], "answer": "Half past eight", "hint": "German counts forwards to the next hour, not back from the last one.", "explain": "The answer is half past eight. Halb neun means half way to nine, so it is 8:30 and not 9:30. This is the single most common time mistake for English speakers, because English counts back from the hour that has just gone.", "topic": "time: the halb trap"}, {"id": "de8-vocab-daily:q7", "level": "medium", "type": "text", "q": "Write the German for the teacher, when the teacher is male.", "answer": "der Lehrer", "accept": ["der Lehrer", "der Lehrer.", "der lehrer", "der lehrer.", "Der Lehrer", "Der Lehrer."], "hint": "The gender is part of the answer, so write the word for the as well.", "explain": "The answer is der Lehrer. A male teacher is der Lehrer and a female teacher is die Lehrerin, with -in added on the end. In the object slot der Lehrer becomes den Lehrer, because der is the only word for the that changes.", "topic": "vocabulary: gender of Lehrer"}, {"id": "de8-vocab-daily:q8", "level": "medium", "type": "text", "q": "Fill the gap with the German word for homework: Ich mache meine ___ am Abend.", "answer": "Hausaufgaben", "accept": ["Hausaufgaben", "Hausaufgaben.", "hausaufgaben", "hausaufgaben.", "die Hausaufgaben", "meine Hausaufgaben"], "hint": "It is built from the word for house and the word for tasks, and it is always plural.", "explain": "The answer is Hausaufgaben. The full sentence is Ich mache meine Hausaufgaben am Abend, meaning I do my homework in the evening. Hausaufgaben is always plural in German, so it takes die when it needs a word for the, and here it takes meine.", "topic": "vocabulary: homework and school routine"}, {"id": "de8-vocab-daily:q9", "level": "medium", "type": "text", "q": "Rewrite this sentence so it starts with Um acht Uhr: Ich fahre mit dem Bus zur Schule.", "answer": "Um acht Uhr fahre ich mit dem Bus zur Schule.", "accept": ["Um acht Uhr fahre ich mit dem Bus zur Schule", "Um acht Uhr fahre ich mit dem Bus zur Schule.", "um acht uhr fahre ich mit dem bus zur schule", "um acht uhr fahre ich mit dem bus zur schule."], "hint": "Um acht Uhr is three words but only one box.", "explain": "The answer is Um acht Uhr fahre ich mit dem Bus zur Schule. Um acht Uhr fills box one, so the verb fahre takes box two and ich moves to box three. Mit dem Bus means by bus and zur Schule means to school, and both of those stay together as they are.", "topic": "vocabulary: school journey with fronted time phrase"}, {"id": "de8-vocab-daily:q10", "level": "medium", "type": "text", "q": "Write in German: On Wednesday I go to school. Start with Am Mittwoch.", "answer": "Am Mittwoch gehe ich in die Schule.", "accept": ["Am Mittwoch gehe ich in die Schule", "Am Mittwoch gehe ich in die Schule.", "am mittwoch gehe ich in die schule", "am mittwoch gehe ich in die schule."], "hint": "Going into school is in die Schule.", "explain": "The answer is Am Mittwoch gehe ich in die Schule. Am Mittwoch is box one, so gehe takes box two and ich lands in box three. Schule is a die word, and going into a place uses in die Schule.", "topic": "vocabulary: days combined with verb second"}, {"id": "de8-vocab-daily:q11", "level": "medium", "type": "mc", "q": "Three of these have the same word for the. Which one is the odd one out?", "options": ["das Fenster", "das Heft", "das Zimmer", "die Tuer"], "answer": "die Tuer", "hint": "Look only at the little word in front, not at the meaning.", "explain": "The answer is die Tuer, written properly as die Tür, meaning the door. The other three are all das words: das Fenster is the window, das Heft is the exercise book and das Zimmer is the room. Tuer is the only die word in the list.", "topic": "vocabulary: sorting nouns by gender"}, {"id": "de8-vocab-daily:q12", "level": "stretch", "type": "text", "q": "Write in German: At half past seven I eat breakfast. Start with the time phrase.", "answer": "Um halb acht esse ich Fruehstueck.", "accept": ["Um halb acht esse ich Fruehstueck", "Um halb acht esse ich Fruehstueck.", "um halb acht esse ich fruehstueck", "um halb acht esse ich fruehstueck.", "Um halb acht esse ich Frühstück", "Um halb acht esse ich Frühstück.", "um halb acht esse ich frühstück", "um halb acht esse ich frühstück."], "hint": "Half past seven counts forwards to eight, so the number you write is not seven.", "explain": "The answer is Um halb acht esse ich Fruehstueck, written properly as Frühstück. Half past seven is half way to eight, so German says halb acht and not halb sieben. That time phrase fills box one, so the verb esse takes box two and ich moves to box three.", "topic": "time: halb combined with verb second"}, {"id": "de8-vocab-daily:q13", "level": "stretch", "type": "text", "q": "Write in German: On Saturday my brother plays football in the garden. Start with Am Samstag.", "answer": "Am Samstag spielt mein Bruder Fussball im Garten.", "accept": ["Am Samstag spielt mein Bruder Fussball im Garten", "Am Samstag spielt mein Bruder Fussball im Garten.", "am samstag spielt mein bruder fussball im garten", "am samstag spielt mein bruder fussball im garten.", "Am Samstag spielt mein Bruder Fußball im Garten", "Am Samstag spielt mein Bruder Fußball im Garten.", "am samstag spielt mein bruder fußball im garten", "am samstag spielt mein bruder fußball im garten."], "hint": "My brother counts as he, so check the verb ending before you check anything else.", "explain": "The answer is Am Samstag spielt mein Bruder Fussball im Garten, with Fussball written properly as Fußball. Am Samstag is box one, so the verb takes box two and mein Bruder follows in box three. Mein Bruder counts as er, so spielen takes the ending -t and becomes spielt. Garten is a der word, and in the garden is im Garten.", "topic": "vocabulary: full sentence with day, subject and place"}, {"id": "de8-vocab-daily:q14", "level": "stretch", "type": "long", "q": "Write four sentences in German about a normal school day. Say what time you eat breakfast, how you travel to school, what you do at school, and what you do in the evening. At least two of your sentences must start with a time phrase.", "marks": 4, "answer": "Um sieben Uhr esse ich Fruehstueck. Ich fahre mit dem Bus zur Schule. Am Morgen lerne ich Deutsch und Mathe. Am Abend mache ich meine Hausaufgaben. In the first sentence Um sieben Uhr is box one, so the verb esse is box two and ich follows. The second sentence starts with the person, so ich is box one and fahre is box two, which is the normal order. In the third and fourth sentences Am Morgen and Am Abend are box one, so lerne and mache sit in box two and ich moves in behind them each time.", "hint": "Write the time phrase first, then leave a gap for the verb, then fill in the person. Check every noun has the right der, die or das.", "explain": "A full answer has four parts, one mark each. One, four sentences that each make sense and cover the four things asked for. Two, at least two of them start with a time phrase, such as Um sieben Uhr or Am Abend. Three, in every single sentence the conjugated verb is in box two, including the ones that start with a time phrase. Four, the verb endings match the person, so ich forms end in -e. A common slip is writing Am Abend ich mache meine Hausaufgaben, which puts the verb in box three. If the German is right but no sentence starts with a time phrase, that is two marks.", "topic": "vocabulary: writing about a daily routine"}]}, "de9-perfect-tense": {"id": "de9-perfect-tense", "day": "Day 4", "subject": "German", "title": "Talking about yesterday", "minutes": 20, "objective": "Talk about the past using haben plus a past participle, with haben in box two and the participle at the very end.", "extract": null, "teach": {"intro": ["To talk about yesterday you need two pieces, not one. A form of haben does the work in the normal verb slot, and the main verb goes to the very end in a special form called the past participle.", "Haben goes ich habe, du hast, er hat, wir haben, ihr habt, sie haben. Most participles are built the same way: ge on the front, the stem, then t on the end. Spielen becomes gespielt, machen becomes gemacht, lernen becomes gelernt.", "A group of common verbs ends in -en instead of -t, and several of them change inside as well. Essen becomes gegessen, trinken becomes getrunken, sehen becomes gesehen, lesen becomes gelesen. These have to be learned one by one.", "Now the part that revises Day 1. Haben is the verb carrying the ending, so haben is what sits in box two. The participle is not in a box at all, it waits at the very end of the sentence. Gestern habe ich Fussball gespielt: Gestern is box one, habe is box two, ich is box three, and gespielt is last."], "example": {"problem": "Write I played football yesterday in German, starting with Gestern.", "steps": ["The helper verb is haben. The person is ich, so it is habe.", "The main verb is spielen. Take ge, then the stem spiel, then t, which gives gespielt.", "Gestern fills box one, so habe must be in box two.", "ich goes in box three, then Fussball, and gespielt goes right at the end."], "answer": "Gestern habe ich Fussball gespielt."}, "example2": {"problem": "Write My brother ate an apple in German.", "steps": ["Mein Bruder counts as er, so the form of haben is hat.", "Essen has an irregular participle, gegessen, so that is what goes at the end.", "Mein Bruder fills box one, so hat is in box two.", "Apfel is a der word and it is the thing being eaten, so ein becomes einen.", "The participle gegessen goes after einen Apfel, right at the end."], "answer": "Mein Bruder hat einen Apfel gegessen."}, "keyfact": "Perfect tense has two pieces. Haben sits in box two, and the participle waits at the very end. Most participles are ge plus the stem plus t."}, "questions": [{"id": "de9-perfect-tense:q1", "level": "easy", "type": "mc", "q": "In a perfect tense sentence, where does the past participle go?", "options": ["First", "Second", "Third", "At the very end"], "answer": "At the very end", "hint": "It is the last thing you say, after everything else.", "explain": "The answer is at the very end. The participle waits at the end of the sentence while haben does the work in box two. Gestern habe ich Fussball gespielt puts gespielt last, and nothing is allowed after it.", "topic": "perfect tense: position of the participle"}, {"id": "de9-perfect-tense:q2", "level": "easy", "type": "mc", "q": "What is the past participle of spielen?", "options": ["spielt", "gespielt", "gespielen", "spielte"], "answer": "gespielt", "hint": "ge on the front, then the stem, then t on the end.", "explain": "The answer is gespielt. The stem of spielen is spiel, so it becomes ge plus spiel plus t. Spielt on its own is the er form of the present tense, meaning he plays, and that is a different job.", "topic": "perfect tense: regular participle"}, {"id": "de9-perfect-tense:q3", "level": "easy", "type": "text", "q": "Fill the gap with the right form of haben: Ich ___ Fussball gespielt.", "answer": "habe", "accept": ["habe", "habe.", "Habe", "Habe."], "hint": "The ich form of haben ends the same way as most ich forms.", "explain": "The answer is habe. With ich the form of haben is habe, so the sentence is Ich habe Fussball gespielt, meaning I played football. Habe sits in box two and gespielt waits at the end.", "topic": "perfect tense: haben with ich"}, {"id": "de9-perfect-tense:q4", "level": "easy", "type": "mc", "q": "What is the past participle of machen?", "options": ["gemacht", "gemachen", "machte", "gemach"], "answer": "gemacht", "hint": "It follows the ge plus stem plus t pattern, but the ch changes what you hear.", "explain": "The answer is gemacht. The stem of machen is mach, so it is ge plus mach plus t. Ich habe meine Hausaufgaben gemacht means I did my homework.", "topic": "perfect tense: regular participle"}, {"id": "de9-perfect-tense:q5", "level": "easy", "type": "text", "q": "Fill the gap with the right form of haben: Er ___ Pizza gegessen.", "answer": "hat", "accept": ["hat", "hat.", "Hat", "Hat."], "hint": "The er form of haben is short, just three letters.", "explain": "The answer is hat. With er, sie and es the form of haben is hat, so the sentence is Er hat Pizza gegessen, meaning he ate pizza. Note that haben is irregular here, so it is hat and not habt.", "topic": "perfect tense: haben with er"}, {"id": "de9-perfect-tense:q6", "level": "medium", "type": "text", "q": "Write the past participle of lernen.", "answer": "gelernt", "accept": ["gelernt", "gelernt.", "Gelernt", "Gelernt."], "hint": "Regular pattern. Take the -en off first to find the stem.", "explain": "The answer is gelernt. The stem of lernen is lern, so it is ge plus lern plus t. Ich habe Deutsch gelernt means I learned German.", "topic": "perfect tense: regular participle"}, {"id": "de9-perfect-tense:q7", "level": "medium", "type": "text", "q": "Write the past participle of trinken.", "answer": "getrunken", "accept": ["getrunken", "getrunken.", "Getrunken", "Getrunken."], "hint": "This one is irregular. It ends in -en and the vowel changes.", "explain": "The answer is getrunken. Trinken is irregular, so it does not take a t on the end. The i changes to u and the ending is -en, which gives getrunken. Ich habe Wasser getrunken means I drank water.", "topic": "perfect tense: irregular participle"}, {"id": "de9-perfect-tense:q8", "level": "medium", "type": "mc", "q": "Which sentence is correct?", "options": ["Gestern ich habe Tennis gespielt.", "Gestern habe ich Tennis gespielt.", "Gestern habe gespielt ich Tennis.", "Gestern ich gespielt habe Tennis."], "answer": "Gestern habe ich Tennis gespielt.", "hint": "Two checks. Is haben in box two, and is the participle last?", "explain": "The answer is Gestern habe ich Tennis gespielt. Gestern is box one, so habe must be box two, and ich follows in box three. The participle gespielt then waits at the very end. The first option pushes habe into box three, and the other two move the participle away from the end.", "topic": "perfect tense: word order with a fronted time phrase"}, {"id": "de9-perfect-tense:q9", "level": "medium", "type": "text", "q": "Put this into the perfect tense: Ich lese ein Buch.", "answer": "Ich habe ein Buch gelesen.", "accept": ["Ich habe ein Buch gelesen", "Ich habe ein Buch gelesen.", "ich habe ein buch gelesen", "ich habe ein buch gelesen."], "hint": "Swap the verb for habe, then send the main verb to the end in its participle form.", "explain": "The answer is Ich habe ein Buch gelesen. Habe takes over box two, and lesen becomes the participle gelesen, which goes right at the end after ein Buch. Lesen is irregular, so the participle ends in -en and not in t.", "topic": "perfect tense: converting a present tense sentence"}, {"id": "de9-perfect-tense:q10", "level": "medium", "type": "text", "q": "Put this into the perfect tense: Wir sehen einen Film.", "answer": "Wir haben einen Film gesehen.", "accept": ["Wir haben einen Film gesehen", "Wir haben einen Film gesehen.", "wir haben einen film gesehen", "wir haben einen film gesehen."], "hint": "The wir form of haben looks exactly like the plain verb.", "explain": "The answer is Wir haben einen Film gesehen. With wir the form of haben is haben, and it takes box two. Sehen becomes gesehen and waits at the end. Einen Film keeps its accusative einen, because Film is a der word and it is the thing being watched.", "topic": "perfect tense: converting with wir"}, {"id": "de9-perfect-tense:q11", "level": "medium", "type": "mc", "q": "Why is Gestern habe ich gegessen einen Apfel wrong?", "options": ["gegessen is the wrong participle", "The participle must go at the very end, after einen Apfel", "habe should be hat", "Gestern cannot start a German sentence"], "answer": "The participle must go at the very end, after einen Apfel", "hint": "Find the participle and ask what is sitting behind it.", "explain": "The answer is that the participle must go at the very end, after einen Apfel. Nothing is allowed to come after the participle, so the correct sentence is Gestern habe ich einen Apfel gegessen. Gegessen really is the right participle of essen, and habe really is the right form for ich, so those parts were fine.", "topic": "perfect tense: diagnosing a participle position error"}, {"id": "de9-perfect-tense:q12", "level": "stretch", "type": "text", "q": "Correct this sentence: Gestern ich habe meine Hausaufgaben gemacht.", "answer": "Gestern habe ich meine Hausaufgaben gemacht.", "accept": ["Gestern habe ich meine Hausaufgaben gemacht", "Gestern habe ich meine Hausaufgaben gemacht.", "gestern habe ich meine hausaufgaben gemacht", "gestern habe ich meine hausaufgaben gemacht."], "hint": "The participle is already in the right place. Look at box two.", "explain": "The answer is Gestern habe ich meine Hausaufgaben gemacht. Gestern is box one, so habe has to be box two and ich moves behind it into box three. The participle gemacht was already at the end and did not need touching. This is the Day 1 rule, just with haben as the verb doing the work.", "topic": "perfect tense: fixing verb third in the past"}, {"id": "de9-perfect-tense:q13", "level": "stretch", "type": "text", "q": "Write in German: Yesterday my sister drank water. Start with Gestern.", "answer": "Gestern hat meine Schwester Wasser getrunken.", "accept": ["Gestern hat meine Schwester Wasser getrunken", "Gestern hat meine Schwester Wasser getrunken.", "gestern hat meine schwester wasser getrunken", "gestern hat meine schwester wasser getrunken."], "hint": "My sister counts as she, so pick the right form of haben, and remember trinken is irregular.", "explain": "The answer is Gestern hat meine Schwester Wasser getrunken. Gestern is box one, so the form of haben goes in box two. Meine Schwester counts as sie meaning she, so haben becomes hat. Trinken is irregular and its participle is getrunken, which waits at the very end. Wasser is a das word but needs no word for the here.", "topic": "perfect tense: full sentence with a noun subject"}, {"id": "de9-perfect-tense:q14", "level": "stretch", "type": "long", "q": "Write three sentences in German about what you did yesterday. Then explain, in English, where the form of haben goes and where the participle goes, and why that does not break the Day 1 rule.", "marks": 4, "answer": "Gestern habe ich Fussball gespielt. Ich habe Pizza gegessen. Am Abend habe ich ein Buch gelesen. The form of haben always goes in box two, exactly where a normal verb would go, because haben is the verb that carries the ending for the person. In the first sentence Gestern is box one, so habe is box two and ich is box three. The participle is different: it does not take a box at all, it waits at the very end of the sentence, so gespielt, gegessen and gelesen are all the last word. This does not break the Day 1 rule, it uses it. The rule was always about the verb that carries the ending, and in the perfect tense that verb is haben and not the main verb. So box two still holds the verb with the ending, and the main verb simply sits out at the end in its participle form.", "hint": "Write the three sentences first, then say what is in box two, then say where the participle sits.", "explain": "A full answer has four parts, one mark each. One, three correct sentences using haben plus a participle, with the participle last every time. Two, the point that the form of haben sits in box two because it is the verb carrying the ending. Three, the point that the participle is at the very end and nothing comes after it. Four, the explanation that this does not break verb second, because the rule was always about the verb with the ending, which here is haben. A common slip is writing Gestern ich habe Fussball gespielt, which puts haben in box three. If the three sentences are right but the explanation is missing, that is one mark.", "topic": "perfect tense: explaining how it fits the verb second rule"}]}, "de10-speaking": {"id": "de10-speaking", "day": "Day 5", "subject": "German", "title": "Out loud", "minutes": 20, "objective": "Say German words and whole sentences out loud using the sound rules, and check what you said against a model.", "extract": "Zum Vorlesen. A short text to read out loud, twice. The first time go slowly and get every sound right. The second time read it at normal speed without stopping. If you can, record yourself on a phone and listen back.\n\nIch heisse Suraj und ich wohne in Wolverhampton.\nUm sieben Uhr esse ich Fruehstueck.\nDann fahre ich mit dem Bus zur Schule.\nDie Schule ist gross und der Lehrer ist streng.\nIn der Pause spiele ich Fussball mit meinem Bruder.\nAm Nachmittag lese ich ein Buch auf Deutsch.\nGestern habe ich meine Hausaufgaben gemacht.\nUm sechs Uhr esse ich Pizza mit meiner Familie.\nDann sehe ich einen Film.\nDeutsch ist nicht leicht, aber ich lerne jeden Tag.", "teach": {"intro": ["German is spelled the way it sounds, once you know the sounds. Learn a handful of rules and you can read a word you have never seen before and still say it right.", "For the pairs of vowels, say the second letter. ei says eye, so mein sounds like mine. ie says ee, so sieben sounds like ZEE-ben. eu says oy, so Deutsch sounds like doytch.", "For the consonants: w says v, so Wasser starts like vasser. v says f. z says ts, so Zug starts like tsoog. j says y. sch says sh. At the start of a word st says sht and sp says shp, so Stuhl sounds like shtool and spielen sounds like SHPEE-len.", "This session is for your mouth, not your hand. Say every answer out loud before you write it, and say it again after you read the explanation."], "example": {"problem": "Say the word Schwester out loud. Work out the sounds before you try it.", "steps": ["sch at the start says sh.", "w says v, so the first chunk is shv.", "The e is short, like the e in bed.", "Put it together and stress the first part."], "answer": "SHVES-ter"}, "example2": {"problem": "Say the sentence Ich spiele Fussball out loud.", "steps": ["ich: the ch after an i is soft, like a hissed h, so it sounds like ish and not ick.", "spiele: sp at the start says shp, and ie says ee, so it is SHPEE-luh.", "Fussball: the u is short and the ss is a sharp s, so it is FOOSS-bal.", "Say the three parts slowly, then run them together."], "answer": "ish SHPEE-luh FOOSS-bal"}, "keyfact": "ei says eye, ie says ee, eu says oy. w says v, v says f, z says ts, j says y, sch says sh, and at the start of a word st says sht and sp says shp."}, "questions": [{"id": "de10-speaking:q1", "level": "easy", "type": "mc", "q": "How do you say the letters ei, as in mein?", "options": ["Like the English word eye", "Like ee in see", "Like ay in day", "Like a in cat"], "answer": "Like the English word eye", "hint": "Say the second of the two letters.", "explain": "The answer is like the English word eye. In ei you say the second letter, so mein sounds like mine and drei sounds like dry. Say it out loud twice before you move on.", "topic": "pronunciation: the ei sound"}, {"id": "de10-speaking:q2", "level": "easy", "type": "mc", "q": "How do you say the letters ie, as in sieben?", "options": ["Like the English word eye", "Like ee in see", "Like ee-uh in two parts", "Like i in bit"], "answer": "Like ee in see", "hint": "Same trick as ei. Say the second of the two letters.", "explain": "The answer is like ee in see. In ie you say the second letter, so sieben sounds like ZEE-ben and liest sounds like leest. The pair ei and the pair ie look similar on the page and sound nothing alike, so check which order the letters are in.", "topic": "pronunciation: the ie sound"}, {"id": "de10-speaking:q3", "level": "easy", "type": "mc", "q": "The German letter w sounds like which English letter?", "options": ["v", "w", "f", "b"], "answer": "v", "hint": "Say Wasser out loud and listen to the first sound.", "explain": "The answer is v. A German w is always said like an English v, so wohne starts like vone-uh and Wasser starts like vasser. There is no English w sound in German at all.", "topic": "pronunciation: the letter w"}, {"id": "de10-speaking:q4", "level": "easy", "type": "mc", "q": "The German letter z sounds like which sound?", "options": ["z as in zoo", "ts as in cats", "s as in sun", "sh as in ship"], "answer": "ts as in cats", "hint": "It is two sounds squashed into one letter.", "explain": "The answer is ts as in cats. A German z is always ts, so Zug sounds like tsoog and zehn sounds like tsayn. It is never a buzzing English z.", "topic": "pronunciation: the letter z"}, {"id": "de10-speaking:q5", "level": "easy", "type": "text", "q": "Say the word Wasser out loud, then write which English letter the German w sounds like.", "answer": "v", "accept": ["v", "V", "v.", "V.", "a v", "an English v"], "hint": "You just met this rule. Say the word first, then write the letter.", "explain": "The answer is v. Wasser is said VASS-er. Saying it out loud first is the point of the question, because the rule sticks in your mouth faster than it sticks in your eyes.", "topic": "pronunciation: saying a word aloud before writing"}, {"id": "de10-speaking:q6", "level": "medium", "type": "mc", "q": "Which of these words starts with a sh sound?", "options": ["Stuhl", "Tisch", "Katze", "Wasser"], "answer": "Stuhl", "hint": "Two rules could apply here. Check which one is about the start of a word.", "explain": "The answer is Stuhl, meaning chair. At the start of a word st says sht, so Stuhl sounds like shtool. Tisch does have a sh sound, but it is at the end and not the start. Katze starts with a k sound and Wasser starts with a v sound.", "topic": "pronunciation: st at the start of a word"}, {"id": "de10-speaking:q7", "level": "medium", "type": "text", "q": "Read the text out loud. What time does Suraj eat breakfast? Answer in English.", "answer": "seven o'clock", "accept": ["seven o'clock", "Seven o'clock", "7 o'clock", "seven", "Seven", "7", "at seven o'clock", "At seven o'clock", "7:00", "seven oclock", "Seven oclock"], "hint": "Look for the line that starts with Um and has Fruehstueck in it.", "explain": "The answer is seven o'clock. The line is Um sieben Uhr esse ich Fruehstueck, which means at seven o'clock I eat breakfast. Um means at when you are giving a time, and sieben is seven.", "topic": "reading aloud: retrieving a time from the text"}, {"id": "de10-speaking:q8", "level": "medium", "type": "mc", "q": "Which line from the text is in the perfect tense, talking about the past?", "options": ["Ich heisse Suraj und ich wohne in Wolverhampton.", "Gestern habe ich meine Hausaufgaben gemacht.", "Um sieben Uhr esse ich Fruehstueck.", "Deutsch ist nicht leicht, aber ich lerne jeden Tag."], "answer": "Gestern habe ich meine Hausaufgaben gemacht.", "hint": "Look for two pieces: a form of haben early on, and a participle at the very end.", "explain": "The answer is Gestern habe ich meine Hausaufgaben gemacht. It has habe in box two and the participle gemacht right at the end, which is the perfect tense pattern from Day 4. The other three lines all describe what happens now, so they use a single present tense verb.", "topic": "reading aloud: spotting the perfect tense in a text"}, {"id": "de10-speaking:q9", "level": "medium", "type": "text", "q": "Say it out loud first, then write it. Answer the question Wie heisst du? using the name Suraj.", "answer": "Ich heisse Suraj.", "accept": ["Ich heisse Suraj", "Ich heisse Suraj.", "ich heisse suraj", "ich heisse suraj.", "Ich heiße Suraj", "Ich heiße Suraj.", "ich heiße suraj", "ich heiße suraj."], "hint": "The question uses the du form. Your answer is about you, so the ending has to change.", "explain": "The answer is Ich heisse Suraj, written properly as Ich heiße Suraj. The question uses heisst because it is asking du, but you are answering about yourself, so the ending becomes -e and it is heisse. Say it out loud and check the ei sounds like eye, so it comes out as HYE-suh.", "topic": "speaking: answering a question about your name"}, {"id": "de10-speaking:q10", "level": "medium", "type": "text", "q": "Say it out loud first, then write it. How do you say I live in Wolverhampton in German?", "answer": "Ich wohne in Wolverhampton.", "accept": ["Ich wohne in Wolverhampton", "Ich wohne in Wolverhampton.", "ich wohne in wolverhampton", "ich wohne in wolverhampton."], "hint": "Start with the person, then the verb, and remember the w sounds like a v when you say it.", "explain": "The answer is Ich wohne in Wolverhampton. Ich is box one and wohne is box two, which is the normal order. With ich the ending of wohnen is -e. When you say it, wohne starts with a v sound, so it comes out as VOH-nuh.", "topic": "speaking: saying where you live"}, {"id": "de10-speaking:q11", "level": "stretch", "type": "text", "q": "Say it out loud first, then write it. Yesterday I played football. Start with Gestern.", "answer": "Gestern habe ich Fussball gespielt.", "accept": ["Gestern habe ich Fussball gespielt", "Gestern habe ich Fussball gespielt.", "gestern habe ich fussball gespielt", "gestern habe ich fussball gespielt.", "Gestern habe ich Fußball gespielt", "Gestern habe ich Fußball gespielt.", "gestern habe ich fußball gespielt", "gestern habe ich fußball gespielt."], "hint": "Two pieces for the past. One of them waits until the very end.", "explain": "The answer is Gestern habe ich Fussball gespielt, with Fussball written properly as Fußball. Gestern is box one, so habe is box two and ich is box three, and the participle gespielt waits at the very end. When you say it, Gestern has a hard g and Fussball comes out as FOOSS-bal.", "topic": "speaking: saying a perfect tense sentence aloud"}, {"id": "de10-speaking:q12", "level": "stretch", "type": "mc", "q": "How do you say the word Deutsch out loud?", "options": ["DOYTCH", "DEE-utch", "DAY-utsh", "DUTCH"], "answer": "DOYTCH", "hint": "Find the vowel pair first and use its rule.", "explain": "The answer is DOYTCH. The letters eu say oy, so the middle of the word is an oy sound, and the sch on the end says sh, which blends with the t to give a tch sound. It is not said like the English word Dutch, which has a different vowel.", "topic": "pronunciation: the eu sound"}, {"id": "de10-speaking:q13", "level": "stretch", "type": "long", "q": "Read the whole text out loud twice. Then close it and say four sentences out loud about your own day, and write down what you said. One sentence must start with a time phrase and one must be in the perfect tense. Then say which two sounds you had to slow down for, and why.", "marks": 4, "answer": "Um sieben Uhr esse ich Fruehstueck. Ich fahre mit dem Bus zur Schule. Am Abend mache ich meine Hausaufgaben. Gestern habe ich einen Film gesehen. The two sounds I had to slow down for were the ie in sieben and the w in wohne. The ie one caught me because ei and ie look almost the same on the page, and I wanted to say sieben as SY-ben instead of ZEE-ben, so I had to stop and check which letter came second. The w one caught me because my mouth wants to make an English w sound, and German has no such sound, so wohne has to start like vone-uh. Saying each of those words three times on its own fixed it before I read the whole text again.", "hint": "Read it aloud twice before you write anything. Then check your four sentences: is the verb in box two every time, and does one of them end in a participle?", "explain": "A full answer has four parts, one mark each. One, four sentences in German that make sense and describe a real day. Two, at least one sentence that starts with a time phrase, with the verb still in box two straight after it. Three, at least one perfect tense sentence, with a form of haben in box two and the participle at the very end. Four, two named sounds with a real reason for each, such as ie against ei, or the w that must be said as v. Saying you found it hard is not enough on its own, you have to name the sound and say what your mouth wanted to do instead. If the four sentences are correct but no sounds are named, that is two marks.", "topic": "speaking: producing and self checking spoken sentences"}]}, "r1-recall-a": {"id": "r1-recall-a", "day": "Day 1", "subject": "Recall", "title": "Last week, quick check", "minutes": 15, "objective": "Pull last week's work back out of memory across five subjects, and find out which bits have started to fade.", "extract": null, "teach": {"intro": ["Nothing in this block is new. Every question is something you already covered last week, just with different numbers, different names or a different situation. It is short, it is quick, and it does not count towards anything.", "Getting one wrong here is useful information, not a failure. It tells you exactly which bit has faded, while there is still plenty of time to go back to it. Everyone forgets things after a few days. Dragging something back out of your head is the thing that makes it stay."], "example": {"problem": "Work out 3/5 x 20", "steps": ["Read it as \"three fifths of 20\".", "Divide by the bottom number to find one fifth: 20 divided by 5 = 4.", "Multiply by the top number to get three of them: 3 x 4 = 12.", "Sense check. Three fifths is a bit more than half, and 12 is a bit more than half of 20, so it fits."], "answer": "12"}, "keyfact": "Divide by the bottom number, then multiply by the top. If the fraction is below 1, the answer must come out smaller than the number you started with."}, "questions": [{"id": "r1-recall-a:q1", "level": "easy", "type": "mc", "q": "A puddle on a hot playground slowly disappears. The liquid water turns into water vapour and rises into the air. Which stage of the water cycle is that?", "options": ["Evaporation", "Condensation", "Precipitation", "Infiltration"], "answer": "Evaporation", "hint": "This is the stage the sun powers, where liquid turns into a gas and goes up.", "explain": "The answer is evaporation. Evaporation is liquid water turning into water vapour and rising, and heat from the sun is what drives it. Condensation is the opposite direction, water vapour cooling back into tiny droplets to form a cloud. If you mix those two up, check which way the water is going: up and turning into gas is evaporation, cooling and turning back into liquid is condensation.", "topic": "water cycle: naming evaporation"}, {"id": "r1-recall-a:q2", "level": "easy", "type": "mc", "q": "Which of these two dates is EARLIER in time, 800 BC or 300 BC?", "options": ["800 BC", "300 BC", "They are the same year", "You cannot compare two BC dates"], "answer": "800 BC", "hint": "BC years count backwards towards year 1. So does a bigger BC number mean further back or nearer to us?", "explain": "The answer is 800 BC. BC years count backwards, so the bigger the BC number, the further back in time it is. 800 BC is 500 years earlier than 300 BC. The usual mistake is treating BC numbers like ordinary numbers and saying the smaller one came first, which is the right way round for AD but backwards for BC.", "topic": "BC and AD: ordering two BC dates"}, {"id": "r1-recall-a:q3", "level": "easy", "type": "text", "q": "Work out 2/5 x 30", "answer": "12", "accept": ["12", "12.0", "60/5", "12/1"], "hint": "Divide 30 by the bottom number first, then multiply that by the top number.", "explain": "The answer is 12. Divide by the bottom number: 30 divided by 5 = 6, so one fifth is 6. Multiply by the top number: 2 x 6 = 12. Sense check: two fifths is less than half, and 12 is less than half of 30.", "topic": "fractions: fraction times whole number"}, {"id": "r1-recall-a:q4", "level": "easy", "type": "text", "q": "A mountain bothy is at the six figure grid reference 472 618. Which four figure grid square is the bothy in? Write four digits with no spaces.", "answer": "4761", "accept": ["4761", "47 61", "47, 61"], "hint": "A six figure reference is the four figure square with one extra digit added onto each half. Drop the extra digit off each half.", "explain": "The answer is 4761. Split the reference into its two halves: the eastings are 472 and the northings are 618. The last digit of each half is the tenths part, so drop it. That leaves 47 for the eastings and 61 for the northings, giving the square 4761. Eastings always come first.", "topic": "grid references: six figure to four figure"}, {"id": "r1-recall-a:q5", "level": "easy", "type": "mc", "q": "On a cold morning, water droplets appear on the inside of a bedroom window. Which change of state has happened?", "options": ["Condensing, gas to liquid", "Evaporating, liquid to gas", "Melting, solid to liquid", "Freezing, liquid to solid"], "answer": "Condensing, gas to liquid", "hint": "The water was in the air as an invisible gas before it appeared on the glass. What did it turn into?", "explain": "The answer is condensing, gas to liquid. Water vapour in the warm room touches the cold glass, cools down, and turns back into liquid droplets. That is condensing. Evaporating is the other direction, liquid turning into gas, which is what happens to a puddle in the sun.", "topic": "changes of state: condensing"}, {"id": "r1-recall-a:q6", "level": "medium", "type": "text", "q": "Work out 8 divided by 1/2", "answer": "16", "accept": ["16", "16.0", "16/1"], "hint": "Ask how many halves fit into 8 wholes. Each whole holds 2 of them.", "explain": "The answer is 16. Dividing asks how many halves fit into 8. Each whole contains 2 halves, so 8 wholes contain 8 x 2 = 16. Using the shortcut, flip 1/2 to get 2/1 and multiply: 8 x 2 = 16. The answer is bigger than 8, and that is correct. Halves are small pieces, so lots of them fit in. Answering 4 means you halved it instead of dividing by a half.", "topic": "division by fractions: whole divided by unit fraction"}, {"id": "r1-recall-a:q7", "level": "medium", "type": "mc", "q": "In the sentence \"The rope snapped suddenly\", which word is the adverb?", "options": ["suddenly", "snapped", "rope", "The"], "answer": "suddenly", "hint": "An adverb tells you how, when or where something happened, and the sentence still works if you take it out.", "explain": "The answer is suddenly. It tells you HOW the rope snapped, and you can delete it and still have a working sentence, The rope snapped. Snapped is the verb, because it is the action and you can change its tense to snaps. Rope is the noun, the thing itself.", "topic": "word classes: identifying the adverb"}, {"id": "r1-recall-a:q8", "level": "medium", "type": "text", "q": "Which century is the year 1345 in? Write it like this: 5th", "answer": "14th", "accept": ["14th", "14", "fourteenth", "the 14th", "14th century", "the fourteenth"], "hint": "Cover the last two digits, then add one to what is left.", "explain": "The answer is 14th. Cover the last two digits of 1345 and you are left with 13. Add one to get the 14th century. This works because the counting started at year 1, not year 0, so the 1st century covers the years 1 to 100. The 14th century covers 1301 to 1400, and 1345 sits inside that.", "topic": "chronology: year to century"}, {"id": "r1-recall-a:q9", "level": "medium", "type": "text", "q": "A climbing team sets off with 28 litres of water. They drink 3/4 of it on the first day. How many litres do they drink?", "answer": "21", "accept": ["21", "21.0", "21 litres", "21l", "21 l", "84/4"], "hint": "Find one quarter of 28 first, then take three of those quarters.", "explain": "The answer is 21 litres. Divide by the bottom number: 28 divided by 4 = 7, so one quarter is 7 litres. Multiply by the top number: 3 x 7 = 21 litres. Check it: they have 7 litres left, and 21 + 7 = 28. A common slip is dividing by the bottom and then stopping, which gives 7 and only answers a quarter of the question.", "topic": "fractions: fraction of an amount in context"}, {"id": "r1-recall-a:q10", "level": "medium", "type": "mc", "q": "A drop of water starts in a lake and later falls as rain on a hillside. Which order of stages is correct?", "options": ["Evaporation, condensation, precipitation", "Condensation, evaporation, precipitation", "Precipitation, evaporation, condensation", "Evaporation, precipitation, condensation"], "answer": "Evaporation, condensation, precipitation", "hint": "Work out the order by what the water is doing: leaving the lake, forming a cloud, then falling.", "explain": "The answer is evaporation, condensation, precipitation. The sun heats the lake and the drop evaporates and rises as vapour. Higher up the air is colder, so the vapour condenses into tiny droplets and forms a cloud. When the droplets get heavy enough they fall as precipitation. Putting condensation first is the usual mix up, but nothing can condense before it has evaporated and gone up.", "topic": "water cycle: order of stages"}, {"id": "r1-recall-a:q11", "level": "medium", "type": "mc", "q": "A battery and two lamps are wired in one single loop. One of the lamps is unscrewed and taken out. What happens to the other lamp?", "options": ["It goes out as well", "It stays lit at the same brightness", "It gets brighter", "It flickers on and off"], "answer": "It goes out as well", "hint": "In a single loop there is only one path for the current. What does taking a lamp out do to that path?", "explain": "The answer is that it goes out as well. This is a series circuit, one single loop with one path. Removing a lamp leaves a gap in that path, so no current can flow anywhere in the circuit and everything stops. In a parallel circuit each lamp has its own branch, so the others would carry on as normal.", "topic": "circuits: removing a lamp from series"}, {"id": "r1-recall-a:q12", "level": "stretch", "type": "mc", "q": "Put these four dates in order, earliest first: AD 79, 264 BC, AD 410, 44 BC.", "options": ["264 BC, 44 BC, AD 79, AD 410", "44 BC, 264 BC, AD 79, AD 410", "AD 79, AD 410, 44 BC, 264 BC", "264 BC, 44 BC, AD 410, AD 79"], "answer": "264 BC, 44 BC, AD 79, AD 410", "hint": "Deal with all the BC dates first, biggest number first. Then the AD dates, smallest number first.", "explain": "The answer is 264 BC, 44 BC, AD 79, AD 410. Every BC date comes before every AD date. Inside the BC dates the bigger number is older, so 264 BC comes before 44 BC. Inside the AD dates the smaller number is older, so AD 79 comes before AD 410. The trap is sorting all four as if they were plain numbers, which puts 44 BC before 264 BC and gets the BC half backwards.", "topic": "BC and AD: ordering a mixed list"}]}, "r2-recall-b": {"id": "r2-recall-b", "day": "Day 3", "subject": "Recall", "title": "Last week, second pass", "minutes": 15, "objective": "Go back over last week's work a second time, in a different order and with different numbers, to make the parts that faded stick.", "extract": null, "teach": {"intro": ["Second look at last week, same idea as the first one. Different numbers, different situations, same skills underneath. It takes about fifteen minutes and it is not marked against you.", "The point of doing this twice is that the second go is where things start to hold. If something you got right on Day 1 slips here, that is worth knowing now rather than in a test. A wrong answer in this block is just a signpost to what to look at again."], "example": {"problem": "Put these three dates in order, earliest first: 90 BC, 300 BC, AD 15", "steps": ["Split them into BC dates and AD dates. The BC dates are 90 BC and 300 BC. The AD date is AD 15.", "Every BC date comes before every AD date, so AD 15 goes last.", "Inside the BC dates, the bigger number is further back in time. 300 is bigger than 90, so 300 BC comes first.", "That gives 300 BC, then 90 BC, then AD 15."], "answer": "300 BC, 90 BC, AD 15"}, "keyfact": "BC counts backwards, so the bigger BC number is the older date. Every BC date comes before every AD date."}, "questions": [{"id": "r2-recall-b:q1", "level": "easy", "type": "text", "q": "Work out 1/3 x 18", "answer": "6", "accept": ["6", "6.0", "18/3", "6/1"], "hint": "Read it as a third of 18. Split 18 into 3 equal groups.", "explain": "The answer is 6. Divide by the bottom number: 18 divided by 3 = 6. Multiply by the top number: 1 x 6 = 6. Check it backwards: 3 lots of 6 make 18, so 6 really is a third of 18.", "topic": "fractions: unit fraction times whole number"}, {"id": "r2-recall-b:q2", "level": "easy", "type": "mc", "q": "Air carrying water vapour rises up a mountain and cools down. The vapour turns back into tiny water droplets and a cloud forms. Which stage of the water cycle is that?", "options": ["Condensation", "Evaporation", "Transpiration", "Surface run-off"], "answer": "Condensation", "hint": "The water is going from a gas back to a liquid. Which word names that direction?", "explain": "The answer is condensation. Cold air cannot hold as much water vapour as warm air, so when rising air cools the vapour condenses into tiny droplets, and billions of those droplets are what a cloud is. Evaporation is the opposite, liquid turning into vapour and rising. Transpiration is water vapour coming out of plant leaves.", "topic": "water cycle: condensation"}, {"id": "r2-recall-b:q3", "level": "easy", "type": "mc", "q": "Which of these three dates is the OLDEST: 120 BC, 60 BC, or AD 20?", "options": ["120 BC", "60 BC", "AD 20", "They are all the same age"], "answer": "120 BC", "hint": "BC dates all come before AD dates. Then, among the BC dates, bigger means further back.", "explain": "The answer is 120 BC. Both BC dates are older than AD 20, because BC comes before AD. Between the two BC dates, the bigger number is further back in time, so 120 BC is older than 60 BC. Reading BC numbers as if they got bigger going forwards is the mistake to watch for.", "topic": "BC and AD: finding the oldest date"}, {"id": "r2-recall-b:q4", "level": "easy", "type": "text", "q": "Work out 5 divided by 1/4", "answer": "20", "accept": ["20", "20.0", "20/1"], "hint": "How many quarters fit into one whole? Now do that 5 times.", "explain": "The answer is 20. Dividing asks how many quarters fit into 5. One whole holds 4 quarters, so 5 wholes hold 5 x 4 = 20. Using the shortcut, flip 1/4 to get 4/1 and multiply: 5 x 4 = 20. Getting an answer bigger than 5 is correct here, because quarters are small and many of them fit in. Answering 1.25 means you divided BY 4 instead of by a quarter.", "topic": "division by fractions: whole divided by unit fraction"}, {"id": "r2-recall-b:q5", "level": "easy", "type": "text", "q": "A ranger hut is at the six figure grid reference 508 342. Which four figure grid square is the hut in? Write four digits with no spaces.", "answer": "5034", "accept": ["5034", "50 34", "50, 34"], "hint": "Take the first two digits of the eastings and the first two digits of the northings.", "explain": "The answer is 5034. The eastings are 508 and the northings are 342. The third digit in each half is the tenths part inside the square, so drop it. Eastings 50 and northings 34 give the square 5034. Writing 3450 would mean you put the northings first, and eastings always come first.", "topic": "grid references: six figure to four figure"}, {"id": "r2-recall-b:q6", "level": "medium", "type": "mc", "q": "A set of boots belongs to all eleven players in a squad. Which version is written correctly?", "options": ["the players' boots", "the player's boots", "the players boots", "the players's boots"], "answer": "the players' boots", "hint": "Find the owner word first. There is more than one owner, and the owner word already ends in s.", "explain": "The answer is the players' boots. The owners are the players, which is more than one and already ends in s, so you add an apostrophe only, with nothing after it. The player's boots would mean just one player owns them. Leaving the apostrophe out completely shows no ownership at all.", "topic": "apostrophes: plural possession, plural ends in s"}, {"id": "r2-recall-b:q7", "level": "medium", "type": "text", "q": "A climbing rope is 45 m long. A climber cuts off 2/3 of it. How long is the piece he cuts off, in metres?", "answer": "30", "accept": ["30", "30.0", "30m", "30 m", "30 metres", "90/3"], "hint": "Find one third of 45 first, then take two of those thirds.", "explain": "The answer is 30 m. Divide by the bottom number: 45 divided by 3 = 15, so one third is 15 m. Multiply by the top number: 2 x 15 = 30 m. Check it: the piece left is 15 m, and 30 + 15 = 45.", "topic": "fractions: fraction of an amount in context"}, {"id": "r2-recall-b:q8", "level": "medium", "type": "text", "q": "A class records four readings: 14, 16, 15 and 55. One of them is an anomaly. Ignore the anomaly and work out the mean of the rest.", "answer": "15", "accept": ["15", "15.0", "45/3"], "hint": "Pick out the reading that is nowhere near the others, then add up the three that are left and divide by 3.", "explain": "The answer is 15. The anomaly is 55, because the other three readings sit close together around 15 and 55 is nowhere near them. Ignore it, then add the three that are left: 14 + 16 + 15 = 45. Divide by how many readings you used, which is 3, not 4. 45 divided by 3 = 15. Dividing by 4 instead of 3 is the usual slip once a reading has been removed.", "topic": "working scientifically: mean with an anomaly removed"}, {"id": "r2-recall-b:q9", "level": "medium", "type": "text", "q": "How many years are there between 400 BC and 150 BC? Write the number only.", "answer": "250", "accept": ["250", "250 years"], "hint": "Both dates are BC, so you can just subtract the smaller number from the bigger one.", "explain": "The answer is 250. Both dates are on the BC side, so the gap is 400 - 150 = 250 years. You only have to do anything different when the two dates are on opposite sides of year 1, because then you add them together instead.", "topic": "BC and AD: gap between two BC dates"}, {"id": "r2-recall-b:q10", "level": "medium", "type": "text", "q": "Heavy rain lands on a grassy hillside and soaks downwards from the surface into the soil. What is that stage of the water cycle called?", "answer": "infiltration", "accept": ["infiltration", "infiltrating", "infiltrate"], "hint": "It is the stage where water goes down into the ground rather than flowing across the top of it.", "explain": "The answer is infiltration. Infiltration is water soaking down from the surface into the soil and rock. The stage it is often confused with is surface run-off, which is water flowing over the top of the ground instead of sinking in. Concrete and hard baked soil cut infiltration down and push more water into surface run-off, which is why towns flood faster than fields.", "topic": "water cycle: infiltration"}, {"id": "r2-recall-b:q11", "level": "medium", "type": "mc", "q": "A wet coat left on a radiator dries out completely, even though it never gets anywhere near 100 degrees C. Which statement explains that?", "options": ["Evaporation happens at the surface at any temperature, while boiling happens throughout the liquid at the boiling point", "Water can only turn into a gas at exactly 100 degrees C, so the coat must have reached it", "The water melted into the air rather than evaporating", "Drying is condensation happening in reverse inside the fabric"], "answer": "Evaporation happens at the surface at any temperature, while boiling happens throughout the liquid at the boiling point", "hint": "Think about what is different between a puddle drying up and a kettle boiling.", "explain": "The answer is the first option. Evaporation only needs particles at the surface to have enough energy to escape, and that happens at any temperature, just faster when it is warmer. Boiling is different: it happens all the way through the liquid and only once the boiling point is reached, which is 100 degrees C for water. Melting is solid to liquid, so it is the wrong word here entirely.", "topic": "states: evaporation versus boiling"}, {"id": "r2-recall-b:q12", "level": "stretch", "type": "text", "q": "A water bottle holds 3/4 of a litre. A team has 9 litres of water. How many bottles can they fill completely?", "answer": "12", "accept": ["12", "12.0", "12 bottles"], "hint": "This asks how many lots of 3/4 fit into 9, so it is a division. Flip the second fraction and multiply.", "explain": "The answer is 12 bottles. The calculation is 9 divided by 3/4. Flip 3/4 to get 4/3, then 9 x 4/3 = 36/3 = 12. Check it: 12 bottles x 3/4 litre = 36/4 = 9 litres exactly, so nothing is left over. The answer being bigger than 9 is right, because each bottle holds less than a litre, so you get more bottles than litres.", "topic": "division by fractions: in context"}]}}, "tests": {"w4-test": {"bands": [{"level": 1, "label": "Warm up", "descriptor": "Ten short ones. Read the line, answer it, move on. Nothing is hidden in this band, so bank all ten.", "extract": null, "questions": [{"id": "w4-test:t1", "type": "text", "q": "Work out 1/2 x 10.", "answer": "5", "accept": ["5", "5.0", "five", "10/2"], "hint": "", "explain": "The answer is 5. Read the multiply sign as the word of, so this is a half of 10. Half of 10 is 5. It has to be smaller than 10, because you are taking a part of it.", "topic": "maths: fraction times a whole number"}, {"id": "w4-test:t2", "type": "text", "q": "Simplify 7x - 3x.", "answer": "4x", "accept": ["4x", "4 x", "+4x", "4x "], "hint": "", "explain": "The answer is 4x. Both terms are lots of x, so they are like terms and can be collected. Mark the signs first: +7x and -3x. Then 7 - 3 = 4, so the answer is 4x. The letter stays as it is, so writing 4 on its own would be wrong.", "topic": "maths: collecting like terms with a subtraction"}, {"id": "w4-test:t3", "type": "mc", "q": "Which year is earlier, 300 BC or 100 BC?", "options": ["300 BC", "100 BC", "They are the same year", "You cannot tell"], "answer": "300 BC", "hint": "", "explain": "300 BC is earlier. BC years count backwards towards zero, so the bigger the BC number, the longer ago it was. 300 BC came 200 years before 100 BC. Every BC year comes before every AD year.", "topic": "history: BC and AD ordering"}, {"id": "w4-test:t4", "type": "text", "q": "How many halves are there in 4?", "answer": "8", "accept": ["8", "8.0", "eight"], "hint": "", "explain": "The answer is 8. Picture 4 pizzas cut in half. Each one gives 2 halves, so 4 x 2 = 8 halves. This is 4 divided by 1/2. Dividing by a fraction below 1 always makes the answer BIGGER, because you are counting how many small pieces fit inside. An answer of 2 comes from halving instead of dividing by a half.", "topic": "maths: dividing by a fraction"}, {"id": "w4-test:t5", "type": "text", "q": "Water vapour cools and turns back into liquid water. Name this stage of the water cycle.", "answer": "condensation", "accept": ["condensation", "Condensation", "condensing", "condenses", "condense"], "hint": "", "explain": "This is condensation. The vapour loses energy as it cools, so the particles slow down and join back together as liquid. The opposite stage, liquid turning into vapour, is evaporation. Water vapour condensing high in the air is what forms clouds.", "topic": "geography: water cycle, condensation"}, {"id": "w4-test:t6", "type": "text", "q": "A box has a mass of 3 kg. What is its weight in newtons?", "answer": "30", "accept": ["30", "30.0", "30 N", "30N", "30 newtons", "thirty"], "hint": "", "explain": "The weight is 30 N. Weight = mass x gravitational field strength, and on Earth that strength is 10 N/kg. So 3 x 10 = 30 N. Mass is measured in kilograms and never changes. Weight is a force, measured in newtons, and it would be different on the Moon.", "topic": "science: calculating weight from mass"}, {"id": "w4-test:t7", "type": "text", "q": "Change 5 km into metres.", "answer": "5000", "accept": ["5000", "5,000", "5000 m", "5000m", "5 000", "five thousand"], "hint": "", "explain": "The answer is 5000 m. There are 1000 m in 1 km, so multiply by 1000. That moves the digits three places, not two, so 5 becomes 5000. Going from a big unit to a small unit always makes the number bigger, because it takes a lot of metres to make a kilometre. An answer of 500 has only moved two places.", "topic": "maths: converting km to m"}, {"id": "w4-test:t8", "type": "mc", "q": "What does am Montag mean?", "options": ["On Monday", "On Sunday", "In the morning", "Next month"], "answer": "On Monday", "hint": "", "explain": "Am Montag means on Monday. All seven days in German are der words, and to say on a day you use am in front of it: am Montag, am Dienstag, am Samstag. The word am is doing the job of on here, not of in the morning.", "topic": "german: days of the week and am"}, {"id": "w4-test:t9", "type": "mc", "q": "How many clauses are in a simple sentence?", "options": ["One", "Two", "Three", "None"], "answer": "One", "hint": "", "explain": "A simple sentence has one clause. A clause is a group of words built round one verb. Two main clauses joined by and, but, so or or makes a compound sentence. A main clause plus a subordinate clause that cannot stand alone makes a complex sentence. Simple does not mean short, it means one clause.", "topic": "english: identifying a simple sentence"}, {"id": "w4-test:t10", "type": "mc", "q": "Speed = distance divided by what?", "options": ["Time", "Mass", "Force", "Area"], "answer": "Time", "hint": "", "explain": "Speed = distance divided by time. Speed tells you how much distance is covered in each second, so you share the distance out over the time taken. Force divided by area is pressure, which is the other formula from that lesson.", "topic": "science: the speed formula"}]}, {"level": 2, "label": "Building", "descriptor": "Two steps each, or one step plus a decision about which way round the question runs. Underline what you are given before you start.", "extract": "THE PASSAGE. Each sentence is numbered.\n\n(1) The river rose overnight.\n(2) Tom carried the sandbags to the door, and his father stacked them two high.\n(3) Although the water was still climbing, nobody on the street said a word.\n(4) By morning the road had gone.", "questions": [{"id": "w4-test:t11", "type": "text", "q": "Two brothers share some money in the ratio 3:4. The smaller share is 12 pounds. How much money was shared altogether?", "answer": "28", "accept": ["28", "28.0", "28 pounds", "£28", "twenty eight", "twenty-eight"], "hint": "", "explain": "The answer is 28 pounds. The smaller share is the 3 parts, and it is worth 12 pounds, so one part is 12 divided by 3 = 4 pounds. The total is 3 + 4 = 7 parts, so 7 x 4 = 28 pounds. Check it forwards: the shares are 3 x 4 = 12 and 4 x 4 = 16, and 12 + 16 = 28. The trap is treating the 12 as the total instead of as one share.", "topic": "maths: ratio, working backwards from one share to the total"}, {"id": "w4-test:t12", "type": "text", "q": "A triangle has an area of 20 cm^2 and a base of 5 cm. What is its perpendicular height in cm?", "answer": "8", "accept": ["8", "8.0", "8 cm", "8cm", "eight"], "hint": "", "explain": "The height is 8 cm. Start from area = 1/2 x base x height. Put in what you know: 20 = 1/2 x 5 x height, which is 20 = 2.5 x height. Undo the multiply by dividing: 20 divided by 2.5 = 8 cm. Check it forwards: 1/2 x 5 x 8 = 20 cm^2, which matches. The common slip is multiplying instead, which is the forward move done a second time on a number that was already the answer.", "topic": "maths: area of a triangle, working backwards to the height"}, {"id": "w4-test:t13", "type": "text", "q": "Simplify 4c + 2d - 6c - 5d.", "answer": "-2c - 3d", "accept": ["-2c - 3d", "-2c-3d", "-3d - 2c", "-3d-2c", "- 2c - 3d", "-2c -3d"], "hint": "", "explain": "The answer is -2c - 3d. Mark every term with its own sign first: +4c, +2d, -6c, -5d. Collect the c terms with their signs: 4 - 6 = -2, so that is -2c. Collect the d terms with their signs: 2 - 5 = -3, so that is -3d. Both coefficients come out negative, and that is allowed. Writing 2c + 3d would mean the two minus signs had been left behind on the page. Check it with numbers: put c = 1 and d = 1 into the original and you get 4 + 2 - 6 - 5 = -5, and -2c - 3d gives -2 - 3 = -5, which matches.", "topic": "maths: simplifying with two negative coefficients"}, {"id": "w4-test:t14", "type": "text", "q": "A runner keeps a steady speed of 4 m/s for 30 seconds. How far does she travel in metres?", "answer": "120", "accept": ["120", "120.0", "120 m", "120m", "120 metres", "one hundred and twenty"], "hint": "", "explain": "The answer is 120 m. Write the formula in words: speed = distance / time. Distance is what you want, so cover it up. What is left is speed next to time, side by side, so you multiply: distance = speed x time = 4 x 30 = 120 m. Check it forwards: 120 divided by 30 = 4 m/s, which is the speed given. Always write the unit on the answer.", "topic": "science: rearranging the speed formula to find distance"}, {"id": "w4-test:t15", "type": "text", "q": "A town has a population of 60,000 and an area of 15 km2. What is its population density in people per km2?", "answer": "4000", "accept": ["4000", "4,000", "4000 people per km2", "4000 per km2", "four thousand", "4000 people/km2"], "hint": "", "explain": "The density is 4000 people per km2. Density is population divided by area, people on top, every time. That is 60,000 divided by 15. Do the easy version first: 60 divided by 15 = 4, and 60,000 is 60 with three zeros after it, so the answer is 4 with those three zeros, 4000. Check it forwards: 4000 people in each of 15 km2 gives 4000 x 15 = 60,000 people, which matches.", "topic": "geography: calculating population density"}, {"id": "w4-test:t16", "type": "mc", "q": "Near its source, high up in the hills, which way does a river mainly wear away the land?", "options": ["Mainly downwards, cutting a deep narrow channel", "Mainly sideways, cutting a wide flat valley", "Equally in both directions", "It does not erode at all near the source"], "answer": "Mainly downwards, cutting a deep narrow channel", "hint": "", "explain": "Near the source the river cuts DOWNWARDS. This is called vertical erosion, and it is why the top of a river valley is steep and narrow with a V shape. Near the mouth the river has much more water and much less slope, so it swings SIDEWAYS instead, which is lateral erosion, and that is what makes the valley wide and flat down there.", "topic": "geography: vertical erosion near the source of a river"}, {"id": "w4-test:t17", "type": "mc", "q": "Which battle did Harold Godwinson fight FIRST in 1066?", "options": ["Stamford Bridge", "Hastings", "Fulford", "Bosworth"], "answer": "Stamford Bridge", "hint": "", "explain": "Harold fought Stamford Bridge first, on 25 September 1066, where he destroyed the Norwegian army and killed Harald Hardrada and his own brother Tostig. Hastings came later, on 14 October. Fulford was five days before Stamford Bridge but Harold was not there, because it was fought by the northern earls Edwin and Morcar. Bosworth is the wrong period altogether, in 1485. The order matters because it explains why Harold's army was exhausted at Hastings.", "topic": "history: the order of the battles of 1066"}, {"id": "w4-test:t18", "type": "mc", "q": "Which numbered sentence in the passage is a COMPOUND sentence?", "options": ["Sentence 2", "Sentence 1", "Sentence 3", "Sentence 4"], "answer": "Sentence 2", "hint": "", "explain": "Sentence 2 is compound. It has two clauses that could each stand alone as a sentence, Tom carried the sandbags to the door and his father stacked them two high, joined by the word and. Sentence 3 is complex, because Although the water was still climbing cannot stand alone. Sentences 1 and 4 are simple, one clause each, even though sentence 4 starts with a phrase about time.", "topic": "english: identifying a compound sentence"}, {"id": "w4-test:t19", "type": "mc", "q": "In sentence 3, which group of words is the subordinate clause?", "options": ["Although the water was still climbing", "nobody on the street said a word", "the water was still climbing", "said a word"], "answer": "Although the water was still climbing", "hint": "", "explain": "The subordinate clause is Although the water was still climbing. Test it by reading it on its own: it leaves you waiting for the rest, so it cannot stand as a sentence. The other half, nobody on the street said a word, works perfectly on its own, so that is the main clause. The word Although has to be included, because it is the word that makes the clause subordinate in the first place.", "topic": "english: identifying a subordinate clause"}, {"id": "w4-test:t20", "type": "text", "q": "Complete this German sentence with der or den. Hund is a der word.\n\nIch sehe ___ Hund.", "answer": "den", "accept": ["den", "Den", "den Hund", "Ich sehe den Hund", "Ich sehe den Hund."], "hint": "", "explain": "The answer is den. Ask who is doing the action: ich is doing the seeing, so ich is the subject. Then ask who is having it done to them: the dog is being seen, so Hund is the direct object. In the object slot a der word changes to den, so it is den Hund. Only der words change like this. Die words, das words and plural die all stay exactly the same.", "topic": "german: accusative, der changing to den"}]}, {"level": 3, "label": "Harder", "descriptor": "Read the maps and the numbers before you touch anything. The two maps do not have the same scale, and the trap is usually in the detail.", "extract": "TWO MAPS, described in words. There are no pictures, so work from the descriptions.\n\nMAP P: THE ELDON VALLEY.\nSCALE: 2 cm on the map stands for 1 km on the ground.\n\nThe river runs in a straight line down the valley. The bridge is at the top, the mill is further down, and the weir is further down still. The gauging station is the furthest point downstream.\n\nSTRAIGHT LINE RULER READINGS TAKEN ON MAP P.\nBridge to mill: 9 cm\nMill to weir: 5 cm\nBridge to gauging station: 12 cm\n\nMAP Q: KESTON MOOR.\nSCALE: 4 cm on the map stands for 1 km on the ground. This is a DIFFERENT scale from Map P, so read it before you start.\n\nA single straight path crosses the moor. The car park is at one end, the summit is along the path, and the trig point is further along past the summit.\n\nSTRAIGHT LINE RULER READINGS TAKEN ON MAP Q.\nCar park to summit: 10 cm\nSummit to trig point: 3 cm\nCar park to bothy: 14 cm", "questions": [{"id": "w4-test:t21", "type": "text", "q": "On MAP P, the bridge to the mill measures 9 cm. How far is that on the ground, in km? Write just the number.", "answer": "4.5", "accept": ["4.5", "4.50", "4.5 km", "4 1/2", "four and a half"], "hint": "", "explain": "The answer is 4.5 km. Map P is 2 cm to 1 km, so the rule is measurement divided by scale: 9 divided by 2. Half of 8 is 4 and half of the 1 left over is 0.5, so 9 divided by 2 = 4.5 km. Never do it the other way round, because 2 divided by 9 gives 0.22, which would mean a 9 cm line on the paper was only about 200 m on the ground. Sense check it against another reading on the same map: the mill to the weir is 5 cm, which gives 2.5 km, and 9 cm is longer on the paper so it must give more than 2.5 km. It does.", "topic": "geography: map scale at 2 cm to 1 km"}, {"id": "w4-test:t22", "type": "text", "q": "On MAP Q, the car park to the summit measures 10 cm. How far is that on the ground, in METRES? Write just the number.", "answer": "2500", "accept": ["2500", "2,500", "2500 m", "2500m", "2 500", "two thousand five hundred"], "hint": "", "explain": "The answer is 2500 m. Two jobs, done one at a time. First the scale. Map Q is 4 cm to 1 km, not 2 cm to 1 km, so divide by 4: 10 divided by 4 = 2.5 km. Then the units. There are 1000 m in 1 km, so multiply by 1000 and the digits move THREE places: 2.5 becomes 25, then 250, then 2500 m. An answer of 250 m has moved only two places and is ten times too short. Using Map P's scale of 2 by mistake would have given 5 km, which is double the real answer.", "topic": "geography: map scale at 4 cm to 1 km, then km to m"}, {"id": "w4-test:t23", "type": "text", "q": "A coat is reduced by 20% in a sale. It now costs 48 pounds. What was the price before the sale, in pounds?", "answer": "60", "accept": ["60", "60.0", "60 pounds", "£60", "sixty"], "hint": "", "explain": "The answer is 60 pounds. You have been given the price AFTER the change and asked for the price before, so this runs backwards. First say what the 48 pounds actually is: the old price was 100%, 20% came off, so 48 pounds is 80% of the old price. Go down to 1%: 48 divided by 80 = 0.6 pounds. Then up to 100%: 100 x 0.6 = 60 pounds. Check it forwards: 10% of 60 is 6, so 20% is 12, and 60 - 12 = 48 pounds, which matches. The wrong move is taking 20% off the 48, which gives 38.40, and that is the forward step done a second time on a number that was already the answer.", "topic": "maths: reverse percentage after a decrease"}, {"id": "w4-test:t24", "type": "text", "q": "The nth term of a sequence is 4n + 3. Is 51 a term in this sequence? Answer yes or no.", "answer": "yes", "accept": ["yes", "Yes", "yes it is", "yes, 12th term", "yes 12th term", "yes, it is the 12th term"], "hint": "", "explain": "Yes, 51 is a term. Set the nth term equal to it: 4n + 3 = 51. Now work backwards. Undo the add 3: 51 - 3 = 48. Undo the multiply by 4: 48 divided by 4 = 12. That is a whole number, so 51 sits at position 12 in the sequence. Check it forwards: 4 x 12 + 3 = 51. A position has to be a whole counting number, because there is no such thing as the 12 and a half th term.", "topic": "maths: deciding whether a number is a term in a sequence"}, {"id": "w4-test:t25", "type": "text", "q": "A plank 6 m long is cut into pieces that are each 3/4 m long. How many pieces are there?", "answer": "8", "accept": ["8", "8.0", "eight", "8 pieces"], "hint": "", "explain": "The answer is 8 pieces. This is 6 divided by 3/4, which asks how many three quarter metre pieces fit inside 6 m. Each metre holds one whole piece plus a bit, so the answer must be more than 6, not less. The quick method is that dividing by 3/4 is the same as multiplying by 4/3, so 6 x 4 = 24, then 24 divided by 3 = 8. Check it forwards: 8 x 3/4 = 24/4 = 6 m, which is the whole plank. Dividing by a fraction below 1 always makes the answer bigger.", "topic": "maths: dividing by a fraction in context"}, {"id": "w4-test:t26", "type": "text", "q": "A train travels 3.6 km at a steady speed of 20 m/s. How long does the journey take, in seconds?", "answer": "180", "accept": ["180", "180.0", "180 s", "180s", "180 seconds", "3 minutes"], "hint": "", "explain": "The answer is 180 s. Convert before you calculate, not after. 3.6 km is 3.6 x 1000 = 3600 m, because the digits move three places. Now write the formula in words: speed = distance / time. Time is what you want, so cover it up. What is left reads distance over speed, so time = distance / speed = 3600 divided by 20 = 180 s. Check it forwards: 20 m every second for 180 s is 20 x 180 = 3600 m, which is 3.6 km. Using 3.6 instead of 3600 would have given 0.18 s, which is absurd for a train journey.", "topic": "science: rearranging speed to find time, with a unit conversion"}, {"id": "w4-test:t27", "type": "text", "q": "A student measures the same length four times and records 21, 22, 58 and 20 cm. Ignore the anomaly and work out the mean of the rest.", "answer": "21", "accept": ["21", "21.0", "21 cm", "21cm", "twenty one", "twenty-one"], "hint": "", "explain": "The mean is 21 cm. The anomaly is 58, because the other three readings sit close together between 20 and 22 and 58 is nowhere near them. Cross the 58 out but leave it written down, because there are marks for showing you spotted it. Add what is LEFT: 21 + 22 + 20 = 63. Divide by how many are LEFT, which is 3 and not 4: 63 divided by 3 = 21. Check it sits inside 20 to 22, and it does. Dividing by 4 out of habit gives 15.75, which is below every reading you used, and that alone tells you it is wrong.", "topic": "science: mean with an anomaly removed"}, {"id": "w4-test:t28", "type": "text", "q": "The Battle of Hastings was in 1066. The Domesday survey was carried out in 1086. How many years apart were they?", "answer": "20", "accept": ["20", "20.0", "20 years", "twenty"], "hint": "", "explain": "The answer is 20 years. Subtract the earlier date from the later one: 1086 - 1066 = 20. Twenty years is roughly a generation, which is the point of the question. William was still counting up exactly what he owned two decades after winning it, because knowing what you hold is a tool of control in its own right, alongside force, land and law.", "topic": "history: calculating the gap between two dates"}, {"id": "w4-test:t29", "type": "mc", "q": "Why did the daily pay of an ordinary labourer roughly double in the years after the Black Death of 1348?", "options": ["So many workers had died that lords had to compete for the few who were left", "Parliament passed a law ordering lords to pay more", "The harvests were much better after 1348, so there was more money about", "Labourers were given the right to own their own land"], "answer": "So many workers had died that lords had to compete for the few who were left", "hint": "", "explain": "Wages rose because the plague killed so many people that labour became scarce. When there are far fewer workers and the same fields still need harvesting, workers can demand more, and a lord who refuses simply loses them to the manor down the road. Parliament did the opposite of ordering higher pay: the Statute of Labourers in 1351 tried to force wages back down to their 1346 levels, which is proof that wages really had risen. Note what did NOT change. The fields, the church and the lord were all still there, so this is a change in bargaining power, not a change in the whole system.", "topic": "history: why wages rose after the Black Death"}, {"id": "w4-test:t30", "type": "text", "q": "Rewrite this German sentence so that it starts with Am Dienstag.\n\nIch spiele Fussball am Dienstag.", "answer": "Am Dienstag spiele ich Fussball.", "accept": ["Am Dienstag spiele ich Fussball.", "Am Dienstag spiele ich Fussball", "Am Dienstag spiele ich Fußball.", "Am Dienstag spiele ich Fußball", "am Dienstag spiele ich Fussball", "am Dienstag spiele ich Fußball"], "hint": "", "explain": "The answer is Am Dienstag spiele ich Fussball. Box up the ideas rather than the words. Am Dienstag is two words but one idea, so it fills box one. The conjugated verb must sit in box two, so spiele comes next. That pushes ich out of box one and it lands in box three, just behind the verb. Fussball goes last. Writing Am Dienstag ich spiele Fussball is the verb third error, and it is the most common mistake in German word order.", "topic": "german: verb second with a fronted time phrase"}]}, {"level": 4, "label": "Stretch", "descriptor": "Multi step, and nothing tells you which topic you are in. Read what you are given, name what you are looking for, and write down the first step even when you cannot see the last one. The last three are short on purpose, so nothing gets left blank.", "extract": null, "questions": [{"id": "w4-test:t31", "type": "text", "q": "In a survey of a bee colony, the drones and the workers were counted in the ratio 2:9. There were 350 more workers than drones. How many bees were counted altogether?", "answer": "550", "accept": ["550", "550.0", "550 bees", "five hundred and fifty"], "hint": "", "explain": "The answer is 550 bees. The ratio 2:9 means 11 equal parts in total. The workers get 9 parts and the drones get 2, so the DIFFERENCE between them is 9 - 2 = 7 parts. You are told that difference is 350, so one part is 350 divided by 7 = 50 bees. The total is 11 parts, so 11 x 50 = 550. Check it forwards: drones are 2 x 50 = 100, workers are 9 x 50 = 450, the difference is 350 and the total is 550. The trap is dividing 350 by 11, which answers a question nobody asked.", "topic": "maths: ratio, working backwards from the difference between two shares"}, {"id": "w4-test:t32", "type": "long", "q": "Write the opening of a speech persuading your year group that every pupil should learn to swim before they leave school. Use direct address, a rule of three, and one counter argument that you then answer. About 120 words.", "marks": 5, "answer": "You are all going to stand at the edge of water at some point in your life. A river on a hot day, a hotel pool abroad, a canal path on the way home. The only question is whether you can get yourself out of it. Learning to swim is not a hobby, it is not a badge, it is not a sport for other people. It is the one lesson that can hand your life back to you. Now, some of you will say the pool is freezing, the lessons eat a whole afternoon, and you will never swim again once you leave. Every word of that is fair. But nobody drowns because they were bored in a lesson.", "hint": "", "explain": "A full mark answer contains all four things. DIRECT ADDRESS: the words you or your aimed straight at
