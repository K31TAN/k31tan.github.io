s name a whole square. The easting line is two digits, such as 31, and the northing line is two digits, such as 52. Put them together and you get 3152. Six figures name an exact point inside that square instead.", "topic": "grid references: four figure basics"}, {"id": "g5-sixfig:q3", "level": "easy", "type": "text", "q": "The church is at 315 524. Which four figure grid square is the church in?", "answer": "3152", "accept": ["3152", "31 52"], "hint": "Take the first two figures, then the first two figures of the second group. Drop the tenths.", "explain": "The answer is 3152. In a six figure reference, the third figure and the sixth figure are the tenths. Cross them off: 315 524 becomes 31 and 52. That gives the square 3152.", "topic": "grid references: six figure to four figure"}, {"id": "g5-sixfig:q4", "level": "easy", "type": "mc", "q": "To get a six figure reference, how do you imagine each grid square being split?", "options": ["Into 10 strips across and 10 strips up", "Into 6 strips across and 6 strips up", "Into 4 equal quarters", "Into 100 strips across and 100 strips up"], "answer": "Into 10 strips across and 10 strips up", "hint": "The extra figure you add is a single digit, so it can only run from 0 to 9.", "explain": "Each square is split into tenths, so 10 strips across and 10 strips up. That is why you only ever add one extra digit to each half of the reference. The digit tells you which tenth you are in, from 0 to 9.", "topic": "grid references: tenths inside a square"}, {"id": "g5-sixfig:q5", "level": "easy", "type": "text", "q": "The camp site is at 345 536. Which four figure grid square is the camp site in?", "answer": "3453", "accept": ["3453", "34 53"], "hint": "Cross off the third figure and the sixth figure. What is left?", "explain": "The answer is 3453. Crossing off the tenths from 345 536 leaves 34 and 53. So the camp site sits in square 3453.", "topic": "grid references: six figure to four figure"}, {"id": "g5-sixfig:q6", "level": "medium", "type": "text", "q": "Write down the full six figure grid reference of the youth hostel. Write it as six digits with no spaces.", "answer": "302517", "accept": ["302517", "302 517", "302,517"], "hint": "It is listed in the map description. Copy it carefully, eastings group first.", "explain": "The answer is 302517. The map gives the youth hostel as 302 517. The first three figures, 302, are the eastings: easting line 30, then 2 tenths east. The last three figures, 517, are the northings: northing line 51, then 7 tenths north.", "topic": "grid references: reading a six figure reference"}, {"id": "g5-sixfig:q7", "level": "medium", "type": "mc", "q": "Which place on the map is at 334 553?", "options": ["The car park", "The viewpoint", "The railway station", "The stone bridge"], "answer": "The car park", "hint": "Check the list of places in the map description and match the digits exactly.", "explain": "334 553 is the car park. Be careful with the others. The viewpoint is 318 545, the railway station is 356 512, and the stone bridge is 307 508. None of those start with 334, so only the car park fits.", "topic": "grid references: matching a reference to a place"}, {"id": "g5-sixfig:q8", "level": "medium", "type": "text", "q": "The stone bridge is at 307 508. Which four figure grid square is the stone bridge in?", "answer": "3050", "accept": ["3050", "30 50"], "hint": "Watch the zeros here. The easting line is 30 and the northing line is 50.", "explain": "The answer is 3050. Crossing off the tenths from 307 508 leaves 30 and 50. Both zeros have to be written. The easting line is 30, not 3, and the northing line is 50, not 5, so the square is 3050 and not 35.", "topic": "grid references: six figure to four figure"}, {"id": "g5-sixfig:q9", "level": "medium", "type": "mc", "q": "Sam writes the church down as 524 315. What has he done wrong?", "options": ["He has written the northings before the eastings", "He has used tenths when he should not have", "He has used the wrong grid square", "He has written too many figures"], "answer": "He has written the northings before the eastings", "hint": "Compare his answer with the real one, 315 524. The digits are all there. Look at the order.", "explain": "He has swapped the two halves round. The church is 315 524, so 315 is the easting part and 524 is the northing part. Sam has put the northings first. Every digit is correct, but the reference now points to the wrong place. Always go along the corridor before you go up the stairs.", "topic": "grid references: common error, order swapped"}, {"id": "g5-sixfig:q10", "level": "medium", "type": "text", "q": "The camp site is in the square directly SOUTH of the square that holds the fishing lake. The fishing lake fills square 3454. Which four figure square is the camp site in?", "answer": "3453", "accept": ["3453", "34 53"], "hint": "South means down the map, so the northing goes down by one. The easting does not change.", "explain": "The answer is 3453. The lake is in square 3454. Moving south means moving down the map, so the northing drops by one, from 54 to 53. The easting stays at 34 because you have not moved left or right. That gives 3453, which matches the camp site at 345 536.", "topic": "grid references: finding a square from a description"}, {"id": "g5-sixfig:q11", "level": "medium", "type": "mc", "q": "The main forest road runs straight up the map along easting 33. Which place on the map is closest to that road?", "options": ["The car park", "The church", "The camp site", "The railway station"], "answer": "The car park", "hint": "Look only at the easting part of each reference. Which one is nearest to 33 point 0?", "explain": "The car park is closest. Its easting part is 334, which means 33 and 4 tenths, so it is only 0.4 km east of the road. The church is at 315, which is 1.5 km west of the road. The camp site is at 345, which is 1.5 km east. The railway station is at 356, which is 2.6 km east and the furthest away of the four. Only the easting part of a reference matters here, because the road runs straight up the map.", "topic": "grid references: comparing eastings"}, {"id": "g5-sixfig:q12", "level": "stretch", "type": "text", "q": "A bench stands exactly halfway along the BOTTOM edge of square 3152. Give its six figure grid reference as six digits with no spaces.", "answer": "315520", "accept": ["315520", "315 520", "315,520"], "hint": "Halfway across is 5 tenths east. Sitting on the bottom edge means 0 tenths north.", "explain": "The answer is 315520. The square is 3152. Halfway along means 5 tenths east, so the easting part is 31 then 5, giving 315. Sitting exactly on the bottom edge means it has not gone up at all, so it is 0 tenths north. The northing part is 52 then 0, giving 520. Put them together and you get 315520. The zero has to be written, because a six figure reference always has six figures.", "topic": "grid references: giving a six figure reference"}, {"id": "g5-sixfig:q13", "level": "stretch", "type": "mc", "q": "The fishing lake fills most of square 3454. Which one of these six figure references is a point inside that square?", "options": ["345 545", "344 535", "355 545", "345 553"], "answer": "345 545", "hint": "Strip the tenths off each option and see which one leaves 34 and 54.", "explain": "The answer is 345 545. Strip the tenths off it and you get 34 and 54, which is square 3454. Check the others. 344 535 strips down to 3453, one square too far south. 355 545 strips down to 3554, one square too far east. 345 553 strips down to 3455, one square too far north.", "topic": "grid references: testing whether a point is in a square"}, {"id": "g5-sixfig:q14", "level": "stretch", "type": "long", "q": "A mountain rescue team is told that a lost walker is somewhere in square 3453. Explain why a six figure grid reference would help the team far more than a four figure one. Use the size of a grid square in your answer.", "answer": "A four figure reference names a whole square, and each square is 1 km by 1 km, so the team would have to search a full square kilometre. A six figure reference splits that square into tenths. One tenth of a kilometre is 100 metres, so a six figure reference narrows the search down to a box roughly 100 metres by 100 metres. That is a much smaller area, so the team finds the walker faster.", "marks": 3, "hint": "Work out how big the area is in each case. A square is 1 km across, so how far is one tenth of it?", "explain": "A full answer has three parts. One, a four figure reference gives a whole square, and each square is 1 km by 1 km, so that is a square kilometre to search. Two, a six figure reference splits the square into tenths, and a tenth of 1 km is 100 metres, so it gives a box about 100 metres by 100 metres. Three, the smaller the area, the faster the walker is found, which matters in a rescue. Give yourself a mark for each of those three points. If you only said six figures is more accurate, that is one mark, because you have not used the sizes.", "topic": "grid references: why precision matters"}]}, "g6-scale": {"id": "g6-scale", "day": "Day 3", "subject": "Geography", "title": "Measuring real distances", "minutes": 25, "objective": "Turn a map measurement in centimetres into a real distance in kilometres, estimating first so the decimal point is always in the right place.", "extract": "THE MAP AND THE RULER: Ridgeway Forest again.\n\nSCALE: 2 cm on the map stands for 1 km on the ground.\n\nA walker measures the straight line distance between places using a ruler laid flat on the map. These are the ruler readings.\n\nCar park to church: 9 cm\nChurch to waterfall: 7.5 cm\nWaterfall to stone bridge: 3 cm\nStone bridge to camp site: 5 cm\nCamp site to summit: 6.5 cm\nSummit to car park: 11 cm\n\nEvery reading above is a straight line distance measured on the map, not the real distance walked along a winding path.", "teach": {"intro": ["A map scale tells you what a distance on the map stands for on the ground. On this map, 2 cm on the map stands for 1 km on the ground.", "Estimate before you calculate. This one habit kills the most common mistake in map work, which is an answer that is ten times too big. If 2 cm is 1 km, then 10 cm is 5 km. So 9 cm has to be a bit under 5 km. You know that before you do any working at all.", "Now the sum. Each 2 cm is worth 1 km, so the distance in km is the number of centimetres divided by 2. Dividing by 2 is just halving.", "Halving an odd number always leaves a half on the end. Half of 9 is 4.5, not 45. Those are not the same number. 45 is ten times bigger. The decimal point is not a detail, it is the answer."], "example": {"problem": "The scale is 2 cm to 1 km. A path measures 9 cm on the map. How long is it on the ground?", "steps": ["Estimate first. 2 cm is 1 km, so 10 cm is 5 km. The path is 9 cm, just under 10 cm, so the answer must be just under 5 km.", "Now the sum. Every 2 cm is 1 km, so divide the centimetres by 2. That is 9 divided by 2.", "Split it up. Half of 8 is 4. That leaves 1 over. Half of 1 is 0.5.", "Add the two parts: 4 + 0.5 = 4.5.", "Check it against the estimate. 4.5 km is just under 5 km, so it fits. If you had written 45 km, the estimate would have caught it straight away."], "answer": "4.5 km"}, "example2": {"problem": "The scale is still 2 cm to 1 km. A track measures 7.5 cm on the map. How long is it on the ground?", "steps": ["Estimate first. 6 cm would be 3 km and 8 cm would be 4 km. The track is 7.5 cm, which sits between 6 and 8, so the answer is between 3 km and 4 km.", "Now the sum. Divide 7.5 by 2.", "Split it up. Half of 7 is 3.5. Half of 0.5 is 0.25.", "Add the two parts: 3.5 + 0.25 = 3.75.", "Check it against the estimate. 3.75 km sits between 3 and 4, so it fits. An answer of 36.5 km would have been caught instantly, because it is nowhere near 3 to 4 km."], "answer": "3.75 km"}, "keyfact": "At 2 cm to 1 km, the answer in km is always HALF the number of centimetres, so it can never be bigger than the number you measured."}, "questions": [{"id": "g6-scale:q1", "level": "easy", "type": "mc", "q": "The scale is 2 cm to 1 km. A road measures 10 cm on the map. How long is it on the ground?", "options": ["5 km", "10 km", "20 km", "0.5 km"], "answer": "5 km", "hint": "How many lots of 2 cm fit into 10 cm? Each lot is worth 1 km.", "explain": "The answer is 5 km. There are five lots of 2 cm inside 10 cm, and each lot stands for 1 km, so the road is 5 km long. This is the estimate you should keep in your head all session: 10 cm on this map is 5 km.", "topic": "map scale: whole number conversion"}, {"id": "g6-scale:q2", "level": "easy", "type": "text", "q": "The scale is 2 cm to 1 km. A fence measures 4 cm on the map. How many km is that? Write just the number.", "answer": "2", "accept": ["2", "2 km", "2km", "2.0"], "hint": "Halve the number of centimetres.", "explain": "The answer is 2 km. Divide the centimetres by 2, so 4 divided by 2 is 2. Two lots of 2 cm fit into 4 cm, and each lot is 1 km.", "topic": "map scale: whole number conversion"}, {"id": "g6-scale:q3", "level": "easy", "type": "mc", "q": "A path measures 9 cm on a map where 2 cm stands for 1 km. Before you divide anything, which of these is the only sensible size for the answer?", "options": ["About 4 or 5 km", "About 45 km", "About 18 km", "About 0.45 km"], "answer": "About 4 or 5 km", "hint": "10 cm would be 5 km. The path is slightly shorter than 10 cm, so the answer is slightly less than 5 km.", "explain": "It has to be about 4 or 5 km. 10 cm on this map is 5 km, and 9 cm is a little less than 10 cm, so the answer is a little less than 5 km. 45 km is ten times too big. 18 km comes from multiplying by 2 instead of dividing. 0.45 km is ten times too small. Doing this check first means a wrong decimal point can never get past you.", "topic": "map scale: estimating to check the decimal point"}, {"id": "g6-scale:q4", "level": "easy", "type": "text", "q": "Use the ruler readings. Car park to church measures 9 cm. How far is that in km? Write just the number.", "answer": "4.5", "accept": ["4.5", "4.5 km", "4.5km", "4 1/2", "four and a half"], "hint": "Half of 8 is 4, and half of the 1 left over is 0.5. Add them.", "explain": "The answer is 4.5 km. Divide 9 by 2. Half of 8 is 4, and half of the remaining 1 is 0.5, so 4 + 0.5 = 4.5. Check it against the estimate: 10 cm would be 5 km, so just under 5 km is right. 45 is the same digits with the decimal point in the wrong place, and it is ten times too big.", "topic": "map scale: distance with a decimal answer"}, {"id": "g6-scale:q5", "level": "easy", "type": "text", "q": "Waterfall to stone bridge measures 3 cm. How far is that in km? Write just the number.", "answer": "1.5", "accept": ["1.5", "1.5 km", "1.5km", "1 1/2", "one and a half"], "hint": "Halve 3. Half of 2 is 1, and half of the 1 left over is 0.5.", "explain": "The answer is 1.5 km. Divide 3 by 2. Half of 2 is 1, half of the remaining 1 is 0.5, so 1 + 0.5 = 1.5. Any odd number of centimetres will always give an answer ending in point 5.", "topic": "map scale: distance with a decimal answer"}, {"id": "g6-scale:q6", "level": "medium", "type": "text", "q": "Church to waterfall measures 7.5 cm. How far is that in km? Write just the number.", "answer": "3.75", "accept": ["3.75", "3.75 km", "3.75km", "3 3/4"], "hint": "Halve the 7 first, then halve the 0.5, then add the two answers together.", "explain": "The answer is 3.75 km. Divide 7.5 by 2 in two parts. Half of 7 is 3.5. Half of 0.5 is 0.25. Add them: 3.5 + 0.25 = 3.75. Check it against the estimate: 6 cm would be 3 km and 8 cm would be 4 km, so an answer between 3 and 4 is right. 36.5 is nowhere near that range.", "topic": "map scale: distance with a decimal answer"}, {"id": "g6-scale:q7", "level": "medium", "type": "text", "q": "Stone bridge to camp site measures 5 cm. How far is that in km? Write just the number.", "answer": "2.5", "accept": ["2.5", "2.5 km", "2.5km", "2 1/2", "two and a half"], "hint": "Halve 5.", "explain": "The answer is 2.5 km. Divide 5 by 2. Half of 4 is 2, and half of the remaining 1 is 0.5, so the answer is 2.5. It has to be smaller than 5, because at this scale the kilometres are always half the centimetres.", "topic": "map scale: distance with a decimal answer"}, {"id": "g6-scale:q8", "level": "medium", "type": "text", "q": "Camp site to summit measures 6.5 cm. How far is that in km? Write just the number.", "answer": "3.25", "accept": ["3.25", "3.25 km", "3.25km", "3 1/4"], "hint": "Half of 6 is 3. Half of 0.5 is 0.25. Add them.", "explain": "The answer is 3.25 km. Split it up. Half of 6 is 3, and half of 0.5 is 0.25. Add them to get 3.25. A quarter of a kilometre is 250 metres, so 3.25 km is 3 km and 250 m.", "topic": "map scale: distance with a decimal answer"}, {"id": "g6-scale:q9", "level": "medium", "type": "text", "q": "Summit to car park measures 11 cm. How far is that in km? Write just the number.", "answer": "5.5", "accept": ["5.5", "5.5 km", "5.5km", "5 1/2", "five and a half"], "hint": "Half of 10 is 5. Half of the extra 1 is 0.5.", "explain": "The answer is 5.5 km. Half of 10 is 5, and half of the extra 1 cm is 0.5, so 5 + 0.5 = 5.5. This is the longest of the six legs, and it is still only 5.5 km, because at this scale nothing on a normal page can come out in the tens.", "topic": "map scale: distance with a decimal answer"}, {"id": "g6-scale:q10", "level": "medium", "type": "text", "q": "A walker goes church to waterfall (7.5 cm) and then waterfall to stone bridge (3 cm). What is the TOTAL distance in km? Write just the number.", "answer": "5.25", "accept": ["5.25", "5.25 km", "5.25km", "5 1/4"], "hint": "Add the two centimetre readings together first, then halve the total once.", "explain": "The answer is 5.25 km. Add the centimetres first: 7.5 + 3 = 10.5 cm. Then halve it once: half of 10 is 5, half of 0.5 is 0.25, so 5 + 0.25 = 5.25 km. You can also do the two legs separately, 3.75 + 1.5, which also gives 5.25. Adding the centimetres first means you only have to divide once, so there is only one chance to slip.", "topic": "map scale: total distance over two legs"}, {"id": "g6-scale:q11", "level": "medium", "type": "mc", "q": "How is 3.75 km written in metres?", "options": ["3750 m", "375 m", "37500 m", "3.75 m"], "answer": "3750 m", "hint": "There are 1000 metres in 1 km, so multiply by 1000.", "explain": "3.75 km is 3750 m. There are 1000 m in a kilometre, so 3.75 x 1000 = 3750. Break it down if that helps: 3 km is 3000 m, 0.5 km is 500 m, and 0.25 km is 250 m. Add them, 3000 + 500 + 250 = 3750 m.", "topic": "map scale: converting km to metres"}, {"id": "g6-scale:q12", "level": "stretch", "type": "text", "q": "Working backwards. The scale is 2 cm to 1 km. A walker wants to plan a route that is 4 km long. How many cm will that route be on the map? Write just the number.", "answer": "8", "accept": ["8", "8 cm", "8cm", "8.0"], "hint": "This one goes the other way. Each 1 km takes up 2 cm on the map, so multiply instead of divide.", "explain": "The answer is 8 cm. Going from map to ground you divide by 2. Going from ground to map you multiply by 2, because each kilometre takes up 2 cm on the paper. So 4 x 2 = 8 cm. Check it by going back the other way: 8 divided by 2 is 4 km, which is what was asked for.", "topic": "map scale: working backwards from km to cm"}, {"id": "g6-scale:q13", "level": "stretch", "type": "text", "q": "A different map has a different scale: 4 cm stands for 1 km. On that map a road measures 10 cm. How far is it in km? Write just the number.", "answer": "2.5", "accept": ["2.5", "2.5 km", "2.5km", "2 1/2", "two and a half"], "hint": "The scale has changed. Now you divide the centimetres by 4, not by 2.", "explain": "The answer is 2.5 km. On this map every 4 cm is 1 km, so divide by 4. 10 divided by 4 is 2 remainder 2, and 2 out of 4 is a half, so the answer is 2.5 km. Read the scale on every new map before you touch the ruler, because 10 cm was 5 km on the last map and it is only 2.5 km on this one.", "topic": "map scale: applying a different scale"}, {"id": "g6-scale:q14", "level": "stretch", "type": "long", "q": "The walker does the whole loop: 9 cm, then 7.5 cm, then 3 cm, then 5 cm, then 6.5 cm, then 11 cm. The scale is 2 cm to 1 km. Work out the total distance in km. Write down your estimate first, then your working, then your final answer.", "answer": "The total is 21 km. Add the centimetres first: 9 + 7.5 + 3 + 5 + 6.5 + 11 = 42 cm. Estimate: 40 cm would be 20 km, so the answer should be a bit over 20 km. Then divide: 42 divided by 2 = 21 km. That matches the estimate.", "marks": 3, "hint": "Add all six centimetre readings first. Then estimate what half of that total should be roughly. Then halve it properly.", "explain": "The total is 21 km. One mark for adding the centimetres correctly: 9 + 7.5 = 16.5, plus 3 = 19.5, plus 5 = 24.5, plus 6.5 = 31, plus 11 = 42 cm. One mark for the estimate: 40 cm would be 20 km, so the answer should be just over 20 km. One mark for the final division: 42 divided by 2 = 21 km, which matches the estimate. If your answer came out in the hundreds, the estimate step would have caught it.", "topic": "map scale: multi step total distance"}]}, "g7-watercycle": {"id": "g7-watercycle", "day": "Day 4", "subject": "Geography", "title": "The water cycle", "minutes": 25, "objective": "Name the seven stages of the water cycle in order and explain what drives each one.", "extract": "THE DIAGRAM, described in words.\n\nPicture a slice through the land, seen from the side, from left to right.\n\nOn the far left is the sea.\nIn the middle is a hill with a thick forest growing on its slope.\nOn the right, past the top of the hill, is a town with a large concrete car park.\nA river starts high on the hill and runs left, down the slope, into the sea.\nA cloud sits in the air above the hill.\n\nSeven arrows are drawn on the diagram. Each one is labelled with a letter.\n\nA: an arrow pointing straight up from the surface of the sea.\nB: an arrow pointing up from the tops of the forest trees.\nC: an arrow pointing from rising air into the cloud above the hill.\nD: several small arrows pointing down out of the cloud onto the hill.\nE: an arrow pointing down from the ground surface into the soil on the hill slope.\nF: an arrow running along the top of the ground, from the concrete car park towards the river.\nG: an arrow moving slowly sideways through the rock deep under the hill, towards the river.", "teach": {"intro": ["The water cycle is the journey water makes between the sea, the sky and the land. The same water goes round and round for ever. No new water is made and none is lost.", "Two forces drive the whole thing. The sun gives the energy that lifts water up into the air. Gravity pulls it back down and then moves it downhill. Every stage is powered by one of those two.", "Going up. EVAPORATION is the sun heating water in the sea, in lakes and in rivers, so liquid water turns into water vapour, a gas, and rises. TRANSPIRATION is plants pulling water up through their roots and letting it out as vapour through tiny holes in their leaves. Both are powered by the sun.", "Coming down. CONDENSATION happens as air rises and cools, because cold air cannot hold as much vapour, so the vapour turns back into tiny liquid droplets. Millions of droplets make a cloud. PRECIPITATION is those droplets joining, getting heavy and being pulled down by gravity as rain, snow, sleet or hail.", "Once it lands. INFILTRATION is water soaking down into the soil. SURFACE RUN-OFF is water that cannot soak in flowing over the top of the ground into rivers. GROUNDWATER FLOW is water that did soak in moving slowly sideways through the rock, back towards the river and the sea."], "example": {"problem": "Put these four stages into the right order, starting at the sea: condensation, evaporation, precipitation, surface run-off.", "steps": ["Start where the water is. It is in the sea. The sun heats it and it turns to vapour and rises. That is evaporation.", "The vapour rises. Higher up the air is colder, so the vapour cools and turns back into droplets, making a cloud. That is condensation.", "The droplets join up until they are too heavy for the air to hold. Gravity pulls them down as rain. That is precipitation.", "The rain lands on ground that cannot soak it all up, so it flows over the surface into a river and heads back to the sea. That is surface run-off.", "The water is back in the sea, ready to start again. That is why it is called a cycle."], "answer": "evaporation, condensation, precipitation, surface run-off"}, "keyfact": "The sun lifts water up. Gravity brings it down and moves it downhill. Every other word is just the name of one step in between."}, "questions": [{"id": "g7-watercycle:q1", "level": "easy", "type": "mc", "q": "What is evaporation?", "options": ["Liquid water turning into water vapour and rising", "Water vapour turning back into liquid droplets", "Water soaking into the soil", "Water falling out of a cloud"], "answer": "Liquid water turning into water vapour and rising", "hint": "Think about a puddle on a hot day. Where does the water go?", "explain": "Evaporation is liquid water turning into water vapour, which is a gas, and rising into the air. The sun supplies the energy. Turning back into droplets is condensation, soaking into soil is infiltration, and falling out of a cloud is precipitation.", "topic": "water cycle: evaporation"}, {"id": "g7-watercycle:q2", "level": "easy", "type": "text", "q": "Look at the diagram description. Which letter shows transpiration? Write just the letter.", "answer": "B", "accept": ["B", "b", "arrow B", "Arrow b"], "hint": "Transpiration only happens from plants. Which arrow starts at the trees?", "explain": "The answer is B. Transpiration is water leaving plants as vapour through their leaves, and B is the arrow pointing up from the tops of the forest trees. Arrow A also points up, but it starts at the sea, so A is evaporation.", "topic": "water cycle: transpiration"}, {"id": "g7-watercycle:q3", "level": "easy", "type": "mc", "q": "What supplies the energy that drives evaporation?", "options": ["Heat from the sun", "Gravity", "The wind alone", "The weight of the clouds"], "answer": "Heat from the sun", "hint": "Puddles dry faster on a hot day than on a cold one.", "explain": "Heat energy from the sun drives evaporation. The heat gives the water particles enough energy to escape from the liquid and become a gas. Gravity is the opposite force, pulling water back down in precipitation and run-off.", "topic": "water cycle: what drives each stage"}, {"id": "g7-watercycle:q4", "level": "easy", "type": "mc", "q": "On the diagram, arrows D point down out of the cloud onto the hill. What is that stage called?", "options": ["Precipitation", "Condensation", "Infiltration", "Evaporation"], "answer": "Precipitation", "hint": "It is the word that covers rain, snow, sleet and hail all at once.", "explain": "That is precipitation, which is the general word for any water falling out of the sky: rain, snow, sleet or hail. Condensation is the stage just before, where vapour becomes droplets and forms the cloud in the first place.", "topic": "water cycle: precipitation"}, {"id": "g7-watercycle:q5", "level": "medium", "type": "text", "q": "Arrow E points down from the ground surface into the soil on the hill slope. What is that stage called?", "answer": "infiltration", "accept": ["infiltration", "Infiltration", "infiltrate", "infilltration"], "hint": "It starts with the letter i. It means soaking in.", "explain": "The answer is infiltration. It means water soaking down from the surface into the soil. Do not mix it up with groundwater flow, which is arrow G, where water that has already soaked in moves sideways through the rock.", "topic": "water cycle: infiltration"}, {"id": "g7-watercycle:q6", "level": "medium", "type": "mc", "q": "Why does water vapour condense when air rises?", "options": ["Because air gets colder the higher it goes, and cold air cannot hold as much vapour", "Because air gets hotter the higher it goes", "Because gravity squashes the vapour together", "Because the sun is stronger higher up"], "answer": "Because air gets colder the higher it goes, and cold air cannot hold as much vapour", "hint": "Think about the top of a mountain compared with the bottom. Which is colder?", "explain": "Air cools as it rises, and cold air cannot hold as much water vapour as warm air. The extra vapour has to turn back into tiny liquid droplets, and millions of those droplets together are what you see as a cloud. That is condensation, arrow C on the diagram.", "topic": "water cycle: condensation"}, {"id": "g7-watercycle:q7", "level": "medium", "type": "mc", "q": "A drop of water starts in the sea and ends up flowing over a field. Which order of stages is correct?", "options": ["Evaporation, condensation, precipitation, surface run-off", "Condensation, evaporation, surface run-off, precipitation", "Precipitation, evaporation, condensation, surface run-off", "Evaporation, precipitation, condensation, surface run-off"], "answer": "Evaporation, condensation, precipitation, surface run-off", "hint": "The water has to get up into the air before a cloud can form, and a cloud has to form before rain can fall.", "explain": "The correct order is evaporation, condensation, precipitation, surface run-off. Water rises from the sea as vapour, cools and condenses into cloud droplets, falls as precipitation, then flows over the ground as run-off. Condensation always comes after evaporation and before precipitation, because you need a cloud before you can have rain.", "topic": "water cycle: order of stages"}, {"id": "g7-watercycle:q8", "level": "medium", "type": "text", "q": "Arrow G moves slowly sideways through the rock deep under the hill, heading towards the river. What is that stage called?", "answer": "groundwater flow", "accept": ["groundwater flow", "ground water flow", "groundwater", "ground water"], "hint": "Two words. The first word tells you where it is, under the ground.", "explain": "The answer is groundwater flow. It is water that has already soaked into the ground moving slowly sideways through the rock towards a river or the sea. It is the slowest stage in the whole cycle, which is why a river can keep flowing for weeks after the rain has stopped.", "topic": "water cycle: groundwater flow"}, {"id": "g7-watercycle:q9", "level": "medium", "type": "mc", "q": "What is the difference between infiltration and surface run-off?", "options": ["Infiltration soaks down into the ground, surface run-off flows over the top of it", "Infiltration flows over the top of the ground, surface run-off soaks in", "They are two words for the same thing", "Infiltration only happens at night"], "answer": "Infiltration soaks down into the ground, surface run-off flows over the top of it", "hint": "The word surface is a big clue in one of them.", "explain": "Infiltration is water soaking downwards into the soil. Surface run-off stays on top of the surface and flows over it. Which one happens depends on the ground. Dry soil soaks water up, so you get infiltration. Concrete or already soaked ground cannot, so you get run-off.", "topic": "water cycle: infiltration versus surface run-off"}, {"id": "g7-watercycle:q10", "level": "stretch", "type": "mc", "q": "The town on the diagram replaces a grass field with the large concrete car park. It then rains heavily. What happens?", "options": ["Less infiltration and more surface run-off, so the river fills up faster", "More infiltration and less surface run-off, so the river fills up slower", "Less evaporation, so it stops raining over the town", "Nothing changes, because the same amount of rain still falls"], "answer": "Less infiltration and more surface run-off, so the river fills up faster", "hint": "Rain cannot soak through concrete. If it cannot go down, where is the only place it can go?", "explain": "Concrete is impermeable, so rain cannot soak into it. Infiltration drops almost to nothing, so nearly all of the water becomes surface run-off instead. Run-off moves far faster than water travelling through soil and rock, so the river fills quickly and flood risk goes up. This is exactly why towns flood more than fields do.", "topic": "water cycle: human impact on run-off"}, {"id": "g7-watercycle:q11", "level": "stretch", "type": "mc", "q": "The whole forest on the hill is cut down. Which stage of the water cycle falls the most as a direct result?", "options": ["Transpiration", "Condensation", "Precipitation", "Groundwater flow"], "answer": "Transpiration", "hint": "Which stage can only happen if plants are there?", "explain": "Transpiration falls the most, because transpiration is water released by plants through their leaves. No trees means almost no transpiration from that slope. Run-off would also go up, because tree roots and leaf litter normally slow the water down, but the stage that is directly removed is transpiration.", "topic": "water cycle: human impact on transpiration"}, {"id": "g7-watercycle:q12", "level": "stretch", "type": "mc", "q": "Is water used up by the water cycle?", "options": ["No, the same water is recycled round and round, so the total amount stays the same", "Yes, a little is destroyed each time it rains", "Yes, plants use it up permanently during transpiration", "No, because new water is made in the clouds each time"], "answer": "No, the same water is recycled round and round, so the total amount stays the same", "hint": "It is called a cycle for a reason. A cycle has no start and no end.", "explain": "The water cycle is a closed system. Water changes state and changes place, but the total amount on Earth stays the same. No new water is made in clouds, and none is destroyed by rain. The water in your glass has been round the cycle countless times before.", "topic": "water cycle: closed system"}, {"id": "g7-watercycle:q13", "level": "stretch", "type": "mc", "q": "Recall from last week. A ship sails from Southampton to New York. Which ocean does it cross?", "options": ["The Atlantic Ocean", "The Pacific Ocean", "The Indian Ocean", "The Southern Ocean"], "answer": "The Atlantic Ocean", "hint": "Picture a world map. The UK is on the right of that ocean and North America is on the left of it.", "explain": "The answer is the Atlantic Ocean. It is the ocean that sits between Europe and Africa on one side and the Americas on the other. The Pacific is on the far side of the Americas, between them and Asia, so a ship from the UK to New York never touches it.", "topic": "oceans: Atlantic position (recall)"}, {"id": "g7-watercycle:q14", "level": "stretch", "type": "long", "q": "Describe the full journey of one drop of water, starting in the sea and ending back in a river. Name at least four stages and say what makes each one happen.", "answer": "The sun heats the sea, so the drop evaporates and rises as water vapour. As the air rises it gets colder, so the vapour condenses into a tiny droplet and joins millions of others to form a cloud. The droplets join together until they are heavy enough for gravity to pull them down, which is precipitation. The drop lands on the hill. If the ground can take it, it soaks in, which is infiltration, then moves slowly through the rock as groundwater flow into the river. If the ground cannot take it, it flows over the top as surface run-off straight into the river.", "marks": 4, "hint": "Go in order, up first and then down. For each stage, say the name and then say what is causing it, either the sun or gravity.", "explain": "Give yourself one mark for each stage that is correctly named AND explained. Evaporation, caused by heat from the sun. Condensation, caused by the air cooling as it rises. Precipitation, caused by gravity pulling the heavy droplets down. Then either infiltration followed by groundwater flow, or surface run-off, both caused by gravity moving the water downhill. Naming a stage with no cause is worth half a mark, so add the reason every time.", "topic": "water cycle: full sequence with causes"}]}, "h3-century-again": {"id": "h3-century-again", "day": "Day 5", "subject": "History", "title": "Centuries, from the beginning", "minutes": 25, "objective": "Know how long a decade, century and millennium are, turn any year into its century, and handle years ending in 00 correctly.", "extract": null, "teach": {"intro": ["Start with the three lengths, because everything else is built on them. A decade is 10 years. A century is 100 years. A millennium is 1000 years. So a century is ten decades, and a millennium is ten centuries.", "Now the counting. There is no year zero. The count of years starts at year 1. So the first block of one hundred years is year 1 to year 100, and that block is called the 1st century. The next block is 101 to 200, and that is the 2nd century. Because that first block swallowed every year below 100, every century number after it sits one ahead of the hundreds digit in the year.", "That gives the quick method. Cover the last two digits of the year and add one. For 1750, cover the 50, you are left with 17, add one, so 1750 is in the 18th century. The one exception is a year ending in 00. A year like 1800 is the very last year of its block, not the first year of the next one, so 1800 keeps the century number that matches its own hundreds digit. 1800 is in the 18th century. 1801 is the first year of the 19th."], "example": {"problem": "Which century are the years 1750, 1800 and 1801 in?", "steps": ["Take 1750 first. Cover the last two digits, which are 50. That leaves 17.", "The last two digits are not 00, so use the add one rule. 17 plus 1 is 18. So 1750 is in the 18th century.", "Now take 1800. Its last two digits are 00, so the add one rule does not apply. A year ending in 00 is the final year of its century.", "The 18th century runs from 1701 to 1800. So 1800 is the last year of the 18th century, not the first year of the 19th.", "Now take 1801. Cover the 01, which leaves 18. The last two digits are not 00, so add one. 18 plus 1 is 19. So 1801 is the first year of the 19th century."], "answer": "1750 is in the 18th century, 1800 is in the 18th century, and 1801 is in the 19th century."}, "keyfact": "Decade 10, century 100, millennium 1000. Cover the last two digits and add one, unless the year ends in 00, in which case it is the last year of the century matching its own hundreds digit."}, "questions": [{"id": "h3-century-again:q1", "level": "easy", "type": "mc", "q": "How many years are there in a century?", "options": ["10 years", "50 years", "100 years", "1000 years"], "answer": "100 years", "hint": "Think about the word cent, as in 100 pence in a pound, or 100 centimetres in a metre.", "explain": "The answer is 100 years. Cent means hundred, which is why there are 100 pence in a pound and 100 centimetres in a metre. A century is a block of 100 years. The 10 year block is a decade, and the 1000 year block is a millennium. Getting this one right is the foundation for everything else in this session, so lock it in now.", "topic": "chronology: length of a century"}, {"id": "h3-century-again:q2", "level": "easy", "type": "mc", "q": "How many years are there in a decade?", "options": ["5 years", "10 years", "100 years", "1000 years"], "answer": "10 years", "hint": "Dec means ten, as in a decimal system.", "explain": "The answer is 10 years. A decade is ten years. Dec means ten, which is where decimal comes from. People say things like the 1980s were a decade, and that block runs from 1980 to 1989, which is ten years.", "topic": "chronology: length of a decade"}, {"id": "h3-century-again:q3", "level": "easy", "type": "mc", "q": "How many years are there in a millennium?", "options": ["100 years", "500 years", "1000 years", "10000 years"], "answer": "1000 years", "hint": "People talked about the millennium at the end of 1999, when a thousand year block was ending.", "explain": "The answer is 1000 years. Mille means thousand, which is where millimetre and million come from. A millennium is ten centuries. That is why the year 2000 got so much attention, because a thousand year block was ending.", "topic": "chronology: length of a millennium"}, {"id": "h3-century-again:q4", "level": "easy", "type": "text", "q": "How many decades are there in one century? Write the number.", "answer": "10", "accept": ["10", "ten", "10 decades", "ten decades"], "hint": "A decade is 10 years and a century is 100 years. How many tens fit into a hundred?", "explain": "The answer is 10. A century is 100 years and a decade is 10 years, and 100 divided by 10 is 10. So one century is ten decades. In the same way, one millennium is ten centuries, because 1000 divided by 100 is 10.", "topic": "chronology: relating decades to centuries"}, {"id": "h3-century-again:q5", "level": "easy", "type": "mc", "q": "Which years does the 1st century AD cover?", "options": ["Years 1 to 100", "Years 0 to 99", "Years 0 to 100", "Years 1 to 99"], "answer": "Years 1 to 100", "hint": "There is no year zero, so the count has to start at 1.", "explain": "The answer is years 1 to 100. There is no year zero in this system, so counting starts at year 1. Count a hundred years from there and you land on year 100. That is the whole reason later century numbers are one ahead of the hundreds digit: the first block used up every year below 100.", "topic": "chronology: why centuries are offset by one"}, {"id": "h3-century-again:q6", "level": "medium", "type": "text", "q": "Which century is the year 1250 in? Write it like this: 5th", "answer": "13th", "accept": ["13th", "13", "thirteenth", "13th century", "the 13th century", "thirteenth century"], "hint": "Cover the last two digits, then add one.", "explain": "The answer is 13th. Cover the 50 and you are left with 12. The last two digits are not 00, so add one, giving 13. The 13th century runs from 1201 to 1300, and 1250 sits inside that. A useful check: 1250 starts with 12, so the century number must be 13, one ahead.", "topic": "chronology: year to century"}, {"id": "h3-century-again:q7", "level": "medium", "type": "text", "q": "Which century is the year 1066 in? Write it like this: 5th", "answer": "11th", "accept": ["11th", "11", "eleventh", "11th century", "the 11th century", "eleventh century"], "hint": "Cover the 66, then add one to what is left.", "explain": "The answer is 11th. Cover the 66 and you are left with 10. Add one and you get 11. The 11th century runs from 1001 to 1100, and 1066 sits inside it. That is the year of the Battle of Hastings, so remembering that 1066 is 11th century is worth doing.", "topic": "chronology: year to century with a key date"}, {"id": "h3-century-again:q8", "level": "medium", "type": "mc", "q": "Which years does the 18th century cover?", "options": ["1700 to 1799", "1701 to 1800", "1800 to 1899", "1801 to 1900"], "answer": "1701 to 1800", "hint": "Every century starts on a year ending in 01 and finishes on a year ending in 00.", "explain": "The answer is 1701 to 1800. Because the 1st century was years 1 to 100, every century since then starts on a 01 and finishes on a 00. So the 18th century opens with 1701 and closes with 1800. The option 1700 to 1799 is the trap that most people fall into, but 1700 actually belongs to the 17th century and 1800 belongs to the 18th.", "topic": "chronology: the span of a named century"}, {"id": "h3-century-again:q9", "level": "medium", "type": "mc", "q": "Which of these years is NOT in the 18th century?", "options": ["1701", "1750", "1800", "1801"], "answer": "1801", "hint": "Write out the span of the 18th century first, from its first year to its last year. Then check each option against it.", "explain": "The answer is 1801. The 18th century runs from 1701 to 1800, so 1701 is its first year, 1750 sits in the middle, and 1800 is its last year. 1801 falls just outside, and it is in fact the first year of the 19th century. The mistake people make is assuming 1800 must be 19th century because it starts with 18. It does not. A year ending in 00 is always the final year of the century before.", "topic": "chronology: the 00 boundary trap"}, {"id": "h3-century-again:q10", "level": "medium", "type": "mc", "q": "Which century is the year 1800 in?", "options": ["The 17th century", "The 18th century", "The 19th century", "The 20th century"], "answer": "The 18th century", "hint": "The add one rule does not apply to years ending in 00. Check which block 1800 sits at the end of.", "explain": "The answer is the 18th century. The 18th century runs from 1701 to 1800, so 1800 is its very last year. It does not get the add one treatment, because it is finishing a block rather than starting one. Think of it like a countdown reaching zero: the count is not over until you say the last number, and 1800 is that last number.", "topic": "chronology: years ending in 00"}, {"id": "h3-century-again:q11", "level": "stretch", "type": "mc", "q": "Which century is the year 1801 in?", "options": ["The 17th century", "The 18th century", "The 19th century", "The 20th century"], "answer": "The 19th century", "hint": "1800 finished a block. So what does 1801 start?", "explain": "The answer is the 19th century. 1800 was the last year of the 18th century, so 1801 is the first year of the next one, the 19th. The quick method works here too: cover the 01, you are left with 18, the last two digits are not 00, so add one and you get 19. Compare it with question 10 and you can see the whole boundary in one place. 1800 is 18th, 1801 is 19th.", "topic": "chronology: the year after a 00 boundary"}, {"id": "h3-century-again:q12", "level": "stretch", "type": "text", "q": "Which century is the year 1900 in? Write it like this: 5th", "answer": "19th", "accept": ["19th", "19", "nineteenth", "19th century", "the 19th century", "nineteenth century"], "hint": "It ends in 00, so it is the last year of a century, not the first year of one.", "explain": "The answer is 19th. The 19th century runs from 1801 to 1900, so 1900 is its final year. Do not add one here, because that rule is only for years that do not end in 00. The 20th century then starts with 1901. This is the same trap as 1800, one century further along.", "topic": "chronology: 00 boundary applied again"}, {"id": "h3-century-again:q13", "level": "stretch", "type": "mc", "q": "A book says an event happened in the last year of the 19th century. Which year was it?", "options": ["1899", "1900", "1901", "1999"], "answer": "1900", "hint": "Write out the span of the 19th century, then take the second number.", "explain": "The answer is 1900. The 19th century runs from 1801 to 1900, so its last year is 1900. 1899 is the second to last year. 1901 is the first year of the 20th century, not the last of the 19th. 1999 is in the 20th century altogether, because the 20th runs from 1901 to 2000.", "topic": "chronology: reading a century span backwards"}, {"id": "h3-century-again:q14", "level": "stretch", "type": "long", "q": "Explain the rule for turning a year into its century, and explain what happens with years that end in 00. Use 1750 and 1800 as your two examples.", "answer": "The count of years starts at 1, not 0, so the 1st century is years 1 to 100. That first block used up every year below 100, so every century number after it is one ahead of the hundreds digit. To turn a year into its century, cover the last two digits and add one. For 1750, covering the 50 leaves 17, and 17 plus 1 is 18, so 1750 is in the 18th century. Years ending in 00 are the exception, because they are the last year of a block rather than the first year of the next one. The 18th century runs from 1701 to 1800, so 1800 is its final year and stays in the 18th century. 1801 is the year that starts the 19th.", "marks": 5, "hint": "Start with why the 1st century is years 1 to 100. Everything else follows from that.", "explain": "A strong answer contains all five of these. One, there is no year zero, so counting starts at year 1 and the 1st century is years 1 to 100. Two, because that first block used up all the years below 100, every century number sits one ahead of the hundreds digit. Three, the method stated clearly: cover the last two digits and add one. Four, 1750 worked through: cover 50, left with 17, add one, so 18th century. Five, 1800 worked through as the exception: it ends in 00, so it is the last year of the 18th century, which runs 1701 to 1800, and the 19th century begins with 1801. Give yourself one mark for each. If you wrote that 1800 is in the 19th century, that point scores nothing, because that is exactly the trap the question is testing.", "topic": "chronology: explaining the century rule and the 00 exception"}]}, "h4-bcad": {"id": "h4-bcad", "day": "Day 6", "subject": "History", "title": "BC and AD", "minutes": 25, "objective": "Read BC and AD dates the right way round, put them in order, and work out the gap between two dates including across the BC to AD boundary.", "extract": "A SHORT LIST OF DATES\n\n753 BC   Rome is founded, according to Roman legend.\n55 BC    Julius Caesar lands in Britain with an army. He does not stay.\n44 BC    Julius Caesar is killed in Rome.\nAD 43    The emperor Claudius sends an army, and the Roman conquest of Britain begins.\nAD 60    Boudica leads a revolt against Roman rule in Britain.\nAD 410   Roman rule in Britain ends.\n\nNote on how the dates are written: BC goes after the number, as in 55 BC. AD goes in front of the number, as in AD 43. You will also see BCE and CE used instead. They mean the same years, counted the same way, just with different letters.", "teach": {"intro": ["The whole system hangs off one starting point, year 1. AD years count forwards from there, so AD 43 comes before AD 410. BC years count backwards from there, so they run in the opposite direction to the way you normally read numbers.", "That is the bit that catches people out. In BC, a bigger number means further back in time. 753 BC is a long way before 55 BC. Think of a countdown before a rocket launch: 753, then later 55, then later 10, then liftoff at year 1. The numbers get smaller as you get closer to the start of the AD count.", "There is no year zero. AD 1 comes straight after 1 BC, with nothing in between. That matters when you measure a gap that crosses the boundary. From 50 BC to AD 50 you can add the two numbers and say 100 years, which is what most books do, or you can subtract one for the missing year zero and say 99. Both are accepted, as long as you can say why."], "example": {"problem": "Roughly how many years passed between 55 BC, when Caesar landed in Britain, and AD 43, when Claudius began the conquest?", "steps": ["Check whether the two dates are on the same side of year 1. 55 BC is before year 1 and AD 43 is after it, so this gap crosses the boundary.", "Work out the distance from 55 BC to year 1. That is 55 years.", "Work out the distance from year 1 to AD 43. That is 43 years.", "Add the two parts together. 55 plus 43 is 98.", "So the answer is about 98 years. If you want to be exact about there being no year zero, you can give 97 instead and explain why. Both are defensible."], "answer": "About 98 years"}, "keyfact": "BC counts backwards, so a bigger BC number is further back. To cross the boundary, add the BC number to the AD number. There is no year zero, so a crossing gap can be given as the sum or as one less."}, "questions": [{"id": "h4-bcad:q1", "level": "easy", "type": "mc", "q": "What does BC mean when it comes after a year?", "options": ["Before Christ, meaning the year is counted backwards from year 1", "Before Christmas", "British Calendar", "Between Centuries"], "answer": "Before Christ, meaning the year is counted backwards from year 1", "hint": "It marks everything that happened before the AD count started.", "explain": "The answer is Before Christ. BC years are the years before the count begins, and they are numbered backwards from year 1. AD stands for Anno Domini, which is Latin for in the year of the Lord, and those years count forwards. You will also see BCE, meaning Before Common Era, and CE, meaning Common Era. They label exactly the same years.", "topic": "BC and AD: what the letters mean"}, {"id": "h4-bcad:q2", "level": "easy", "type": "mc", "q": "Which is earlier in time, 500 BC or 200 BC?", "options": ["500 BC", "200 BC", "They are the same year", "You cannot tell without more information"], "answer": "500 BC", "hint": "BC is a countdown towards year 1. Which number comes earlier in a countdown?", "explain": "The answer is 500 BC. BC years count backwards towards year 1, so the bigger the number, the further back you are. 500 BC is 300 years before 200 BC. This feels wrong at first because 200 looks smaller than 500, but in BC the order flips.", "topic": "BC and AD: ordering two BC dates"}, {"id": "h4-bcad:q3", "level": "easy", "type": "mc", "q": "Which is earlier in time, AD 200 or AD 500?", "options": ["AD 200", "AD 500", "They are the same year", "You cannot tell without more information"], "answer": "AD 200", "hint": "AD counts forwards, the normal way round.", "explain": "The answer is AD 200. AD years count forwards from year 1, so a smaller number is earlier, exactly the way you would expect. Compare this with the previous question. In BC the bigger number is earlier, and in AD the smaller number is earlier. That is the single most important difference to hold onto.", "topic": "BC and AD: ordering two AD dates"}, {"id": "h4-bcad:q4", "level": "easy", "type": "text", "q": "Look at the list of dates. Which came first, 55 BC or AD 43? Write BC or AD.", "answer": "BC", "accept": ["BC", "bc", "B.C.", "55 BC", "55BC", "55 bc"], "hint": "Everything BC happened before everything AD.", "explain": "The answer is BC. Every BC year comes before every AD year, no matter how big or small the numbers look. So 55 BC, when Caesar landed, comes before AD 43, when Claudius began the conquest. The number 55 being larger than 43 makes no difference at all, because they are on opposite sides of year 1.", "topic": "BC and AD: comparing across the boundary"}, {"id": "h4-bcad:q5", "level": "easy", "type": "mc", "q": "In BC dates, what does a bigger number mean?", "options": ["Further back in time", "Closer to today", "Nothing, the size of the number does not matter", "That the date is an estimate"], "answer": "Further back in time", "hint": "Picture a countdown running down to year 1.", "explain": "The answer is further back in time. BC is a countdown, so 3000 BC is much older than 300 BC, which is older than 30 BC. Every step towards a smaller BC number brings you closer to year 1 and to the start of the AD count.", "topic": "BC and AD: the direction of BC counting"}, {"id": "h4-bcad:q6", "level": "medium", "type": "mc", "q": "Put these four dates from the list in order, earliest first: AD 43, 55 BC, AD 410, 753 BC.", "options": ["753 BC, 55 BC, AD 43, AD 410", "55 BC, 753 BC, AD 43, AD 410", "AD 43, AD 410, 55 BC, 753 BC", "753 BC, 55 BC, AD 410, AD 43"], "answer": "753 BC, 55 BC, AD 43, AD 410", "hint": "Split them into two piles first. Sort the BC pile biggest number first, then the AD pile smallest number first.", "explain": "The answer is 753 BC, 55 BC, AD 43, AD 410. Deal with the BC pile first, and because BC counts backwards, the biggest number goes first, so 753 BC comes before 55 BC. Then the AD pile, which counts forwards, so AD 43 comes before AD 410. All BC dates come before all AD dates. The second option sorts the BC pile the wrong way round. The third puts the AD dates first. The fourth sorts the AD pile the wrong way round.", "topic": "BC and AD: ordering a mixed list"}, {"id": "h4-bcad:q7", "level": "medium", "type": "text", "q": "How many years are there between 100 BC and 50 BC? Write the number only.", "answer": "50", "accept": ["50", "50 years", "fifty", "fifty years"], "hint": "Both dates are BC, so you are not crossing year 1. Just find the difference.", "explain": "The answer is 50. Both dates are on the same side of year 1, so you simply subtract: 100 minus 50 is 50. There is no year zero problem here, because you never cross the boundary. Remember which way round it goes, though: 100 BC is the earlier date, so 50 BC is 50 years later, not 50 years earlier.", "topic": "BC and AD: gap between two BC dates"}, {"id": "h4-bcad:q8", "level": "medium", "type": "text", "q": "Roman rule in Britain began in AD 43 and ended in AD 410. How many years is that? Write the number only.", "answer": "367", "accept": ["367", "367 years"], "hint": "Both dates are AD, so subtract the smaller from the larger.", "explain": "The answer is 367. Both dates are AD, so you subtract: 410 minus 43 is 367. That means the Romans ruled in Britain for well over three centuries, which is longer than the gap between today and the reign of Elizabeth I. No boundary is crossed, so there is no complication about year zero.", "topic": "BC and AD: gap between two AD dates"}, {"id": "h4-bcad:q9", "level": "medium", "type": "mc", "q": "Caesar landed in Britain in 55 BC. Claudius began the conquest in AD 43. Roughly how many years passed between the two?", "options": ["12 years", "43 years", "55 years", "98 years"], "answer": "98 years", "hint": "Measure from 55 BC to year 1, then from year 1 to AD 43, then add the two parts.", "explain": "The answer is 98 years. The gap crosses year 1, so you split it into two parts. From 55 BC to year 1 is 55 years. From year 1 to AD 43 is 43 years. 55 plus 43 is 98. Subtracting to get 12 is the classic mistake, and it happens when people forget the two dates are on opposite sides of the boundary. Because there is no year zero, some books would count this as 97 rather than 98, but 98 is the standard answer and the only option offered here.", "topic": "BC and AD: gap across the boundary"}, {"id": "h4-bcad:q10", "level": "medium", "type": "mc", "q": "Why is there no year zero in this system?", "options": ["The count was set up starting at year 1, so AD 1 comes straight after 1 BC", "Records for that year were lost", "That year was skipped because of a war", "Year zero was later renamed AD 1000"], "answer": "The count was set up starting at year 1, so AD 1 comes straight after 1 BC", "hint": "Think about how you count objects. You start at one, not at zero.", "explain": "The answer is that the count simply starts at year 1. When the system was built, the first year was numbered 1, in the same way you count one, two, three when counting things rather than starting at zero. So the year before AD 1 is 1 BC, with nothing in between. This is also why the 1st century is years 1 to 100 rather than 0 to 99.", "topic": "BC and AD: why there is no year zero"}, {"id": "h4-bcad:q11", "level": "stretch", "type": "text", "q": "How many years are there between 30 BC and AD 70? Write the number only.", "answer": "100", "accept": ["100", "100 years", "99", "99 years", "one hundred", "ninety nine"], "hint": "Split the gap at year 1 and add the two parts.", "explain": "The answer is 100. From 30 BC to year 1 is 30 years, and from year 1 to AD 70 is 70 years, and 30 plus 70 is 100. Because there is no year zero, an exact count gives 99, and 99 is also accepted here if you can explain why. What is not accepted is 40, which comes from subtracting instead of adding, and that only works when both dates are on the same side of the boundary.", "topic": "BC and AD: crossing gap with the year zero point"}, {"id": "h4-bcad:q12", "level": "stretch", "type": "mc", "q": "One object is dated to 2500 BC. Another is dated to 1500 BC. Which is older, and by how much?", "options": ["The 2500 BC object, by 1000 years", "The 1500 BC object, by 1000 years", "The 2500 BC object, by 4000 years", "They are the same age"], "answer": "The 2500 BC object, by 1000 years", "hint": "Bigger BC number means further back. Both are BC, so subtract rather than add.", "explain": "The answer is the 2500 BC object, by 1000 years. In BC, the bigger number is further back, so 2500 BC is older than 1500 BC. Both dates are on the same side of year 1, so you subtract: 2500 minus 1500 is 1000. Adding them to get 4000 is the mistake people make when they apply the crossing rule to two dates that never cross the boundary.", "topic": "BC and AD: comparing and measuring two BC dates"}, {"id": "h4-bcad:q13", "level": "stretch", "type": "mc", "q": "Which century is the year 55 BC in?", "options": ["The 1st century BC", "The 5th century BC", "The 55th century BC", "The 1st century AD"], "answer": "The 1st century BC", "hint": "Centuries work the same way in BC, but counting backwards. The first hundred years before year 1 are 100 BC to 1 BC.", "explain": "The answer is the 1st century BC. Counting backwards from year 1, the first block of a hundred years runs from 100 BC to 1 BC, and that block is the 1st century BC. 55 BC sits inside it. The 2nd century BC would be 200 BC to 101 BC. It is not the 1st century AD, because 55 BC is before year 1, and the 1st century AD is years 1 to 100.", "topic": "BC and AD: centuries in BC"}, {"id": "h4-bcad:q14", "level": "stretch", "type": "long", "q": "Caesar first landed in Britain in 55 BC. Roman rule in Britain ended in AD 410. Explain step by step how you work out the length of that period, and explain why the answer can be given as either 465 or 464.", "answer": "The two dates are on opposite sides of year 1, so the gap has to be split into two parts. From 55 BC forward to year 1 is 55 years. From year 1 forward to AD 410 is 410 years. Adding the two parts gives 55 plus 410, which is 465 years. That is the usual answer. However, there is no year zero in this system, because AD 1 comes straight after 1 BC. Adding the two numbers effectively counts across a year that does not exist, so an exact count gives one less, which is 464. Both answers are defensible as long as you say which method you used.", "marks": 4, "hint": "Deal with the BC part and the AD part separately, then explain what the missing year zero does to the total.", "explain": "A strong answer contains these four points. One, it notices that the two dates sit on opposite sides of year 1, so the gap crosses the boundary and the two numbers must be added rather than subtracted. Two, it splits the working out clearly: 55 years from 55 BC to year 1, and 410 years from year 1 to AD 410. Three, it gives 55 plus 410 equals 465. Four, it explains the alternative: because there is no year zero, an exact count gives 464, and that is why you see both figures in books. Give yourself a mark for each. Subtracting to get 355 scores nothing, because subtraction only works when both dates are on the same side of year 1.", "topic": "BC and AD: explaining a crossing calculation"}]}, "h5-timeline": {"id": "h5-timeline", "day": "Day 7", "subject": "History", "title": "The order of British history", "minutes": 25, "objective": "Put the main periods of British history in order, give the century each one falls in, and work out how many years lie between two events.", "extract": "THE ORDER OF BRITISH HISTORY\n\nRoman Britain, AD 43 to AD 410. The conquest begins under the emperor Claudius and Roman rule ends when the army is withdrawn.\n\nAnglo-Saxons, about AD 410 to 1066. Kingdoms such as Wessex, Mercia and Northumbria, with Viking raids and settlement from the late 700s onwards.\n\nNormans, from 1066, when William of Normandy won the Battle of Hastings and took the throne of England.\n\nMedieval, also called the Middle Ages, about 1066 to 1485. Castles, the Church, the Black Death in 1348 and 1349, and long wars with France.\n\nTudors, 1485 to 1603. Henry VII, Henry VIII, Edward VI, Mary I and Elizabeth I.\n\nStuarts, 1603 to 1714. The Civil War ran from 1642 to 1651. Charles I was executed in 1649.\n\nGeorgians, 1714 to 1837. The Industrial Revolution built up across this period and carried on into the 1800s.\n\nVictorians, 1837 to 1901, the reign of Queen Victoria.\n\nThe First World War, 1914 to 1918. The Second World War, 1939 to 1945.", "teach": {"intro": ["Year 8 history jumps around. One term you are on the Normans, the next you are on the Industrial Revolution. If you do not know the running order, every new topic floats loose and nothing connects to anything else. Learn the order once and every lesson afterwards has somewhere to sit.", "The running order is Romans, Anglo-Saxons, Normans, medieval, Tudors, Stuarts, Georgians, Victorians, then the World Wars. Four dates hold the whole thing together. AD 43 for the Roman conquest. 1066 for the Battle of Hastings. 1485 for the start of the Tudors. 1914 for the First World War. If you know those four, you can place almost anything else roughly.", "Two skills sit on top of that. Turning a date into a century, which you already know: cover the last two digits and add one, unless the year ends in 00. And working out a gap, which is just subtraction when both dates are AD. From 1066 to 1485 is 1485 minus 1066, which is 419 years."], "example": {"problem": "Which century did the Tudor period begin in, and how long was it from the Battle of Hastings to the start of the Tudors?", "steps": ["The Tudor period began in 1485, when Henry VII won the Battle of Bosworth.", "Turn 1485 into a century. Cover the 85, which leaves 14. The last two digits are not 00, so add one, giving 15. So the Tudor period began in the 15th century.", "The Battle of Hastings was in 1066. Both dates are AD, so subtract.", "1485 minus 1066. Take 1000 from 1485 to get 485, then take another 66 to get 419.", "So there were 419 years between the Battle of Hastings and the start of the Tudor period."], "answer": "The Tudor period began in the 15th century, 419 years after the Battle of Hastings."}, "keyfact": "Romans, Anglo-Saxons, Normans, medieval, Tudors, Stuarts, Georgians, Victorians, World Wars. Anchor dates: AD 43, 1066, 1485, 1914."}, "questions": [{"id": "h5-timeline:q1", "level": "easy", "type": "mc", "q": "Which came first in Britain, the Romans or the Tudors?", "options": ["The Romans", "The Tudors", "They overlapped", "Neither, they are the same period"], "answer": "The Romans", "hint": "One period is measured in AD dates below 500. The other starts in 1485.", "explain": "The answer is the Romans. Roman Britain ran from AD 43 to AD 410. The Tudor period did not begin until 1485, which is more than a thousand years later. In between came the Anglo-Saxons, the Normans and the whole medieval period.", "topic": "British timeline: basic ordering"}, {"id": "h5-timeline:q2", "level": "easy", "type": "mc", "q": "In which year did the Normans win the Battle of Hastings?", "options": ["1016", "1066", "1086", "1166"], "answer": "1066", "hint": "It is probably the single most repeated date in British history.", "explain": "The answer is 1066. William of Normandy defeated King Harold at the Battle of Hastings and became king of England. That date is the dividing line between the Anglo-Saxon period and the Norman period, so it is worth knowing without having to think about it. 1086 is close but that is the Domesday Book, twenty years later.", "topic": "British timeline: the Norman conquest"}, {"id": "h5-timeline:q3", "level": "easy", "type": "mc", "q": "Who ruled in England immediately before the Normans?", "options": ["The Anglo-Saxons", "The Tudors", "The Victorians", "The Romans"], "answer": "The Anglo-Saxons", "hint": "Harold, the king William defeated in 1066, belonged to this group.", "explain": "The answer is the Anglo-Saxons. Their period ran from roughly AD 410, when Roman rule ended, to 1066, when William won at Hastings. King Harold was an Anglo-Saxon king. The Romans came before the Anglo-Saxons, not after, and the Tudors and Victorians are both hundreds of years later.", "topic": "British timeline: what came before the Normans"}, {"id": "h5-timeline:q4", "level": "easy", "type": "text", "q": "In which year did Queen Victoria's reign begin? Write the year.", "answer": "1837", "accept": ["1837", "in 1837"], "hint": "It is in the list of periods. Look for the Victorians.", "explain": "The answer is 1837. Victoria became queen in 1837 and reigned until 1901, which is 64 years. That whole stretch is called the Victorian period, and it covers most of the second half of the 1800s, including the later part of the Industrial Revolution and the growth of the British Empire.", "topic": "British timeline: the Victorian period"}, {"id": "h5-timeline:q5", "level": "easy", "type": "mc", "q": "Put these four periods in order, earliest first: Tudors, Romans, Victorians, Normans.", "options": ["Romans, Normans, Tudors, Victorians", "Romans, Tudors, Normans, Victorians", "Normans, Romans, Tudors, Victorians", "Romans, Normans, Victorians, Tudors"], "answer": "Romans, Normans, Tudors, Victorians", "hint": "Attach a date to each one first: AD 43, 1066, 1485, 1837. Then sort the dates.", "explain": "The answer is Romans, Normans, Tudors, Victorians. Put a date on each before you sort them. Romans AD 43, Normans 1066, Tudors 1485, Victorians 1837. Once the dates are written down the order is obvious. This is the safest way to do any ordering question, because the names on their own are easy to muddle.", "topic": "British timeline: ordering periods by anchor date"}, {"id": "h5-timeline:q6", "level": "medium", "type": "text", "q": "Which century is the year 1066 in? Write it like this: 5th", "answer": "11th", "accept": ["11th", "11", "eleventh", "11th century", "the 11th century", "eleventh century"], "hint": "Cover the last two digits and add one.", "explain": "The answer is 11th. Cover the 66 and you are left with 10, and 10 plus 1 is 11. The 11th century runs from 1001 to 1100. So the Norman conquest happened in the 11th century, which is a useful pairing to remember: 1066, 11th century.", "topic": "British timeline: date to century"}, {"id": "h5-timeline:q7", "level": "medium", "type": "mc", "q": "The Tudor period began in 1485. Which century did it begin in?", "options": ["The 14th century", "The 15th century", "The 16th century", "The 17th century"], "answer": "The 15th century", "hint": "Cover the 85 and add one to what is left.", "explain": "The answer is the 15th century. Cover the 85 and you have 14, and 14 plus 1 is 15. The 15th century runs from 1401 to 1500, so 1485 falls near the end of it. Most of the Tudor period then takes place in the 16th century, which is why people often say the Tudors are a 16th century family, but the period itself begins in the 15th.", "topic": "British timeline: century of the Tudor start"}, {"id": "h5-timeline:q8", "level": "medium", "type": "text", "q": "How many years were there between the Battle of Hastings in 1066 and the start of the Tudor period in 1485? Write the number only.", "answer": "419", "accept": ["419", "419 years"], "hint": "Both dates are AD, so subtract the earlier from the later.", "explain": "The answer is 419. Both dates are AD, so you subtract: 1485 minus 1066. Take 1000 off 1485 to get 485, then take off the remaining 66 to get 419. That whole stretch is the medieval period, which shows how long it actually was. It is more than four centuries, longer than the gap between the Tudors and today.", "topic": "British timeline: calculating a gap"}, {"id": "h5-timeline:q9", "level": "medium", "type": "mc", "q": "The English Civil War ran from 1642 to 1651. Which royal family was on the throne when it started?", "options": ["The Stuarts", "The Tudors", "The Normans", "The Georgians"], "answer": "The Stuarts", "hint": "Check which period contains the year 1642 in the list.", "explain": "The answer is the Stuarts. The Stuart period ran from 1603 to 1714, so 1642 falls inside it. The king at the time was Charles I, a Stuart, and he was executed in 1649. The Tudors had ended in 1603, when Elizabeth I died. The Georgians did not begin until 1714, and the Normans were nearly six hundred years earlier.", "topic": "British timeline: placing an event in a period"}, {"id": "h5-timeline:q10", "level": "medium", "type": "mc", "q": "In which period did the Industrial Revolution first get going in Britain?", "options": ["The Georgian period", "The Tudor period", "The Norman period", "Roman Britain"], "answer": "The Georgian period", "hint": "It built up through the 1700s and early 1800s. Which period covers those years?", "explain": "The answer is the Georgian period, which ran from 1714 to 1837. Factories, steam engines, canals and the growth of industrial towns all built up across the 1700s and early 1800s, and then carried on into the Victorian period. The Tudors ended in 1603, well before any of that, and the Normans and Romans are centuries earlier still.", "topic": "British timeline: the Industrial Revolution in period"}, {"id": "h5-timeline:q11", "level": "stretch", "type": "text", "q": "The First World War started in 1914 and the Second World War started in 1939. How many years were there between the two starts? Write the number only.", "answer": "25", "accept": ["25", "25 years", "twenty five", "twenty-five"], "hint": "Both dates are AD, so subtract.", "explain": "The answer is 25. 1939 minus 1914 is 25. That is a short gap in historical terms, which is one of the reasons historians study the two wars together rather than as separate stories. The First World War ended in 1918 and the Second ended in 1945, and both years are in the 20th century.", "topic": "British timeline: gap between the World Wars"}, {"id": "h5-timeline:q12", "level": "stretch", "type": "long", "q": "Put these five events in order, earliest first, and give the century each one falls in: the Battle of Hastings, the execution of Charles I, the start of Roman rule in Britain, the start of the First World War, the start of the Tudor period.", "answer": "1. The start of Roman rule in Britain, AD 43, in the 1st century. 2. The Battle of Hastings, 1066, in the 11th century. 3. The start of the Tudor period, 1485, in the 15th century. 4. The execution of Charles I, 1649, in the 17th century. 5. The start of the First World War, 1914, in the 20th century.", "marks": 5, "hint": "Write the year next to each event before you try to order anything. Then turn each year into its century with the cover and add one method.", "explain": "A strong answer gets both the order and the centuries right. The order is Roman rule AD 43, then Hastings 1066, then the Tudors 1485, then the execution of Charles I 1649, then the First World War 1914. The centuries are, in the same order: 1st, because the 1st century is years 1 to 100. 11th, because covering the 66 in 1066 leaves 10, and 10 plus 1 is 11. 15th, because covering the 85 in 1485 leaves 14, and 14 plus 1 is 15. 17th, because covering the 49 in 1649 leaves 16, and 16 plus 1 is 17. 20th, because covering the 14 in 1914 leaves 19, and 19 plus 1 is 20. Give yourself one mark per event that has both the right position in the order and the right century. Getting the order right but the centuries wrong is half marks, because the century conversion is the part being tested.", "topic": "British timeline: ordering events and converting to centuries"}]}, "s3-circuits": {"id": "s3-circuits", "day": "Day 5", "subject": "Science", "title": "Electricity: series and parallel", "minutes": 25, "objective": "Explain current, voltage and resistance, and predict what happens in series and parallel circuits when a lamp is removed.", "extract": "FOUR CIRCUITS, described in words.\n\nEvery lamp in every circuit is identical. Every battery is 6 V.\n\nCIRCUIT A: one single loop. The battery, a switch, lamp L1 and lamp L2 are all on that one loop, one after the other. An ammeter placed in the loop reads 0.20 A.\n\nCIRCUIT B: the wire leaves the battery and splits at a junction into two separate branches. Lamp L3 sits alone on one branch. Lamp L4 sits alone on the other branch. The two branches join back together before the wire returns to the battery. An ammeter placed in the wire right next to the battery reads 0.80 A. A second ammeter placed in the branch with L3 reads 0.40 A.\n\nCIRCUIT C: one single loop, exactly like circuit A, but with THREE identical lamps on the loop instead of two.\n\nCIRCUIT D: like circuit B, but the wire splits into THREE separate branches, each with one identical lamp on it.", "teach": {"intro": ["Current is the flow of electric charge around a circuit. It is measured in amps, written A, using an ammeter. An ammeter goes IN the circuit, in line with the components, so that the current flows through it.", "Voltage, also called potential difference, is the push the battery gives the charge. It is measured in volts, written V, using a voltmeter. A voltmeter goes ACROSS a component, not in line with it, because it compares the push on each side.", "Resistance is how strongly a component slows the current down. It is measured in ohms. More resistance means less current for the same voltage. The rule is resistance = voltage divided by current.", "A SERIES circuit is one single loop. Everything sits on the same path. The current is the same at every point in that loop, because there is nowhere else for it to go. The battery voltage is SHARED between the components. Break the loop anywhere and everything stops, because there is only one path and it is now broken.", "A PARALLEL circuit splits into separate branches, so there is more than one path. Each branch gets the FULL battery voltage. The current splits between the branches at the junction and adds back together when they rejoin. Remove a lamp from one branch and the other branch is still a complete loop, so it stays lit at exactly the same brightness."], "example": {"problem": "Circuit A has a 6 V battery and two identical lamps in one single loop. An ammeter in the loop reads 0.20 A. Work out the voltage across one lamp, and the resistance of one lamp.", "steps": ["One single loop means this is a series circuit.", "In series the battery voltage is shared between the components. The two lamps are identical, so they share it equally.", "6 divided by 2 = 3. So each lamp has 3 V across it.", "In series the current is the same everywhere in the loop, so 0.20 A flows through each lamp. It is not shared or split.", "Resistance = voltage divided by current. For one lamp that is 3 divided by 0.20.", "3 divided by 0.20 = 15. So each lamp has a resistance of 15 ohms."], "answer": "3 V across each lamp, and a resistance of 15 ohms for each lamp."}, "keyfact": "Series is ONE path, so breaking it anywhere stops everything. Parallel gives every branch its own path and the full battery voltage, so the others carry on."}, "questions": [{"id": "s3-circuits:q1", "level": "easy", "type": "mc", "q": "Circuit A is one single loop with the battery, a switch and two lamps on it. What type of circuit is it?", "options": ["Series", "Parallel", "Both series and parallel", "Neither"], "answer": "Series", "hint": "Count the paths the current could take. How many are there?", "explain": "Circuit A is a series circuit. Everything is on one single loop, so there is only one path for the current. A parallel circuit would split into separate branches at a junction, and circuit A never splits.", "topic": "circuits: identifying series"}, {"id": "s3-circuits:q2", "level": "easy", "type": "mc", "q": "In circuit A, lamp L1 is unscrewed and taken out. What happens to lamp L2?", "options": ["L2 goes out as well", "L2 stays lit at the same brightness", "L2 stays lit but gets dimmer", "L2 gets brighter"], "answer": "L2 goes out as well", "hint": "There is only one path. What have you just done to that path?", "explain": "L2 goes out as well. A series circuit is one single loop, so taking out L1 leaves a gap in the only path there is. Current cannot flow through a gap, so nothing in the circuit works. This is the single most tested idea about series circuits, and it is the opposite of what happens in parallel.", "topic": "circuits: removing a lamp from series"}, {"id": "s3-circuits:q3", "level": "easy
