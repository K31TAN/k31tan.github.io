", "type": "mc", "q": "In circuit B, lamp L3 is taken out of its branch. What happens to lamp L4 on the other branch?", "options": ["L4 stays lit at the same brightness", "L4 goes out as well", "L4 gets dimmer", "L4 gets brighter"], "answer": "L4 stays lit at the same brightness", "hint": "L4 has its own separate branch. Has anything broken that branch?", "explain": "L4 stays lit at the same brightness. In a parallel circuit each branch is its own complete loop from the battery and back. Removing L3 breaks the L3 branch only. The L4 branch is untouched and still gets the full 6 V, so L4 carries on exactly as before.", "topic": "circuits: removing a lamp from parallel"}, {"id": "s3-circuits:q4", "level": "easy", "type": "text", "q": "What is the unit of electric current? Write the name of the unit.", "answer": "amps", "accept": ["amps", "amp", "ampere", "amperes", "a", "A", "ampères"], "hint": "The symbol for it is a capital A.", "explain": "The unit of current is the amp, sometimes written in full as the ampere. Its symbol is A. Volts measure voltage, and ohms measure resistance, so do not mix the three up.", "topic": "circuits: units of current"}, {"id": "s3-circuits:q5", "level": "easy", "type": "mc", "q": "How should a voltmeter be connected?", "options": ["Across a component, in parallel with it", "In line with the component, in the loop", "Directly across the battery terminals only", "It does not matter how it is connected"], "answer": "Across a component, in parallel with it", "hint": "One meter goes in the flow, the other one sits alongside and compares the two sides.", "explain": "A voltmeter goes across a component, in parallel with it, because voltage is the difference in push between one side and the other, so the meter has to touch both sides. An ammeter is the other way round: it goes in line with the component so the current flows through it.", "topic": "circuits: connecting meters"}, {"id": "s3-circuits:q6", "level": "medium", "type": "text", "q": "Circuit A has a 6 V battery and two identical lamps in one loop. What is the voltage across lamp L1? Give your answer in volts, as a number.", "answer": "3", "accept": ["3", "3 V", "3v", "3 volts", "3.0"], "hint": "In series, the battery voltage is shared out between the components. The lamps are identical, so they share it equally.", "explain": "The answer is 3 V. In a series circuit the battery voltage is shared between the components. The two lamps are identical, so they take an equal share: 6 divided by 2 = 3 V each. Check it by adding back up, 3 + 3 = 6, which is the battery voltage.", "topic": "circuits: sharing voltage in series"}, {"id": "s3-circuits:q7", "level": "medium", "type": "text", "q": "The ammeter in circuit A reads 0.20 A. What is the current flowing through lamp L2? Give your answer in amps.", "answer": "0.2", "accept": ["0.2", "0.20", ".2", "0.2 A", "0.2A", "0.20 A"], "hint": "Current is not shared in series. There is only one path, so there is nowhere for any of it to go.", "explain": "The answer is 0.20 A. In a series circuit the current is exactly the same at every point in the loop, so the reading anywhere in the loop is the reading through L2. Current is not used up by lamps and it is not shared. Voltage gets shared in series, current does not.", "topic": "circuits: current is the same everywhere in series"}, {"id": "s3-circuits:q8", "level": "medium", "type": "text", "q": "In circuit B the ammeter next to the battery reads 0.80 A, and the ammeter in the L3 branch reads 0.40 A. What is the current in the L4 branch? Give your answer in amps.", "answer": "0.4", "accept": ["0.4", "0.40", ".4", "0.4 A", "0.4A", "0.40 A"], "hint": "The two branch currents have to add up to the current coming out of the battery.", "explain": "The answer is 0.40 A. In a parallel circuit the current splits at the junction and the branch currents add back up to the total. The total is 0.80 A and L3 takes 0.40 A, so L4 must take 0.80 - 0.40 = 0.40 A. That fits, because the lamps are identical, so they split the current equally.", "topic": "circuits: current splits in parallel"}, {"id": "s3-circuits:q9", "level": "medium", "type": "mc", "q": "The battery in circuit B is 6 V. What is the voltage across lamp L3?", "options": ["6 V", "3 V", "2 V", "12 V"], "answer": "6 V", "hint": "Voltage is only shared between components that are on the SAME path. Are L3 and L4 on the same path?", "explain": "The answer is 6 V. In parallel, each branch is its own complete loop straight from the battery, so each branch gets the full 6 V. Voltage is only shared between components sitting on the same path, and L3 and L4 are on different paths. This is exactly why lamps in parallel are brighter than the same lamps in series.", "topic": "circuits: full voltage across each parallel branch"}, {"id": "s3-circuits:q10", "level": "medium", "type": "mc", "q": "Circuit C is the same as circuit A but with THREE lamps in the single loop instead of two. Why are the lamps in circuit C dimmer than the lamps in circuit A?", "options": ["Three lamps in series give more resistance, so the current is smaller and each lamp gets a smaller share of the voltage", "The battery runs out faster with three lamps", "The current has further to travel so it gets tired", "Three lamps in series give less resistance, so less current flows"], "answer": "Three lamps in series give more resistance, so the current is smaller and each lamp gets a smaller share of the voltage", "hint": "Adding components in series adds their resistance together. What does more resistance do to the current?", "explain": "Adding a third lamp in series increases the total resistance of the loop. For the same 6 V battery, more resistance means less current, so the current drops below 0.20 A. The 6 V is now shared three ways instead of two, so each lamp gets 2 V instead of 3 V. Less current and less voltage per lamp both make them dimmer. Current does not get tired and it is not used up.", "topic": "circuits: adding resistance in series"}, {"id": "s3-circuits:q11", "level": "stretch", "type": "text", "q": "Circuit D has three identical lamps, each on its own branch, with the same 6 V battery. Each branch behaves exactly like a branch in circuit B. What will the ammeter next to the battery read in circuit D? Give your answer in amps.", "answer": "1.2", "accept": ["1.2", "1.20", "1.2 A", "1.2A", "1.20 A"], "hint": "One branch takes 0.40 A. Adding another identical branch does not change the first one, it just adds more current.", "explain": "The answer is 1.2 A. Each branch has the full 6 V across an identical lamp, so each branch draws 0.40 A, exactly as in circuit B. The total current from the battery is the sum of the branches: 0.40 + 0.40 + 0.40 = 1.20 A. Adding branches in parallel LOWERS the total resistance and RAISES the total current, which is the opposite of adding lamps in series.", "topic": "circuits: total current in parallel"}, {"id": "s3-circuits:q12", "level": "stretch", "type": "text", "q": "In circuit B, lamp L3 has 6 V across it and 0.40 A flowing through it. Work out the resistance of lamp L3. Give your answer in ohms, as a number.", "answer": "15", "accept": ["15", "15 ohms", "15ohms", "15.0", "15 ohm"], "hint": "Resistance = voltage divided by current. Dividing by 0.4 is the same as dividing by 4 and then multiplying by 10.", "explain": "The answer is 15 ohms. Resistance = voltage divided by current, so 6 divided by 0.40. To handle the decimal, note that 6 divided by 0.4 is the same as 60 divided by 4, which is 15. Now check it against circuit A: there each lamp had 3 V and 0.20 A, and 3 divided by 0.20 = 15 ohms as well. Same lamp, same resistance, which is exactly what should happen since the lamps are identical.", "topic": "circuits: calculating resistance"}, {"id": "s3-circuits:q13", "level": "stretch", "type": "mc", "q": "What is the real reason a broken lamp stops a series circuit but not a parallel one?", "options": ["In series the break leaves the only path incomplete, while in parallel the other branches are still complete paths", "In series the electricity is weaker, so it cannot jump the gap", "In parallel the battery pushes harder to make up for the missing lamp", "In series the lamps share the current, so losing one uses it all up"], "answer": "In series the break leaves the only path incomplete, while in parallel the other branches are still complete paths", "hint": "Current needs an unbroken path from one end of the battery all the way round to the other. Count how many unbroken paths are left in each case.", "explain": "Current can only flow round a complete, unbroken path. A series circuit has exactly one path, so any break anywhere makes it incomplete and everything stops. A parallel circuit has a separate path for each branch, so breaking one branch leaves the others complete and they carry on. Electricity does not jump gaps, batteries do not push harder to compensate, and current is not shared in series at all.", "topic": "circuits: why the two types behave differently"}, {"id": "s3-circuits:q14", "level": "stretch", "type": "long", "q": "The lights in a house are wired in parallel, not in series. Give two reasons why, and explain each one using what you know about voltage and about complete paths.", "answer": "Reason one is that each light gets the full mains voltage, because in parallel every branch has the full supply voltage across it. If the lights were in series the voltage would be shared between all of them, so every light in the house would be dim, and adding another light would make them all dimmer still. Reason two is that each light is on its own branch, so if one bulb blows it only breaks its own path. Every other branch is still a complete circuit, so the rest of the house stays lit. In series, one blown bulb would break the only path and every light in the house would go out at once. Parallel wiring also means each light can have its own switch, because the switch only breaks that one branch.", "marks": 4, "hint": "One reason should be about brightness and voltage. The other should be about what happens when a bulb blows.", "explain": "A full answer needs two reasons, each properly explained. Reason one, voltage: in parallel every branch gets the full supply voltage, so every light runs at full brightness, and adding more lights does not dim the existing ones. In series the voltage would be shared, so every light would be dim and would get dimmer with each one added. Reason two, complete paths: each light has its own branch, so a blown bulb breaks only its own path and the rest stay lit, whereas in series one blown bulb would break the only path and the whole house would go dark. One mark for each reason named, one mark for each proper explanation. A third reason worth knowing is that individual switches only work sensibly in parallel, because a switch on a series loop would control everything at once.", "topic": "circuits: real world application of parallel"}]}, "s4-particles": {"id": "s4-particles", "day": "Day 6", "subject": "Science", "title": "Particles, states and changes", "minutes": 25, "objective": "Name every change of state and its direction, use melting and boiling points to work out a state, and explain why temperature stays flat during a change of state.", "extract": "TABLE: melting points and boiling points, in degrees C.\n\nSubstance P: melting point -219, boiling point -183\nSubstance Q: melting point -39, boiling point 357\nSubstance R: melting point 801, boiling point 1465\nSubstance S: melting point -114, boiling point 78\nSubstance T: melting point 0, boiling point 100\n\nRoom temperature is 20 degrees C.\n\nHEATING CURVE, described in words.\n\nA sample of substance T is taken out of a freezer at -20 degrees C and heated steadily with a heater that is never switched off. A thermometer is read every minute. This is what happens.\n\nFrom 0 to 2 minutes: the temperature rises from -20 up to 0.\nFrom 2 to 7 minutes: the temperature stays at 0 and does not move.\nFrom 7 to 15 minutes: the temperature rises from 0 up to 100.\nFrom 15 to 25 minutes: the temperature stays at 100 and does not move.\nAfter 25 minutes: the temperature rises above 100.", "teach": {"intro": ["Everything is made of particles. In a SOLID they are packed close together in a fixed pattern and can only vibrate on the spot. In a LIQUID they are still close together but can slide past each other. In a GAS they are far apart and move fast in every direction.", "Changing state does not change the particles themselves. A water particle is the same particle whether it is ice, water or steam. What changes is how much energy the particles have and how strongly they are held to each other.", "The names and the directions. MELTING is solid to liquid. FREEZING is liquid to solid. BOILING and EVAPORATING are both liquid to gas. CONDENSING is gas to liquid. SUBLIMATION is solid straight to gas with no liquid stage at all. DEPOSITION is gas straight to solid.", "Melting point and boiling point tell you the state at any temperature. Below the melting point it is a solid. Between the melting point and the boiling point it is a liquid. Above the boiling point it is a gas. That works for every substance, including ones you have never heard of.", "Evaporation and boiling both turn liquid into gas, but they are not the same. Evaporation happens only at the surface, at any temperature below the boiling point, and it is slow. Boiling happens all the way through the liquid, only at the boiling point, and you see bubbles forming inside the liquid itself."], "example": {"problem": "A block of ice at -20 degrees C is heated steadily with a heater that is never switched off. Describe what the temperature does, and explain why it stops rising at 0 degrees C.", "steps": ["From -20 up to 0 the temperature rises. The energy going in makes the particles vibrate faster, and faster particles mean a higher temperature.", "At 0 degrees C the ice starts to melt. The temperature now stays at 0 and does not move, even though the heater is still on.", "The energy has not stopped going in. It is being used to break the forces holding the particles in their fixed pattern so they can slide past each other.", "Energy used to break those forces is not being used to speed the particles up. Temperature is a measure of how fast the particles are moving, so if they are not speeding up, the temperature does not rise.", "Once every bit of ice has melted, there are no more forces left to break, so the energy goes back into speeding the particles up and the temperature starts rising again."], "answer": "It rises steadily to 0 degrees C, stays flat at 0 the whole time the ice is melting, then rises again once it is all liquid."}, "keyfact": "During a change of state the temperature stays FLAT, because the energy going in is breaking forces between particles instead of speeding them up."}, "questions": [{"id": "s4-particles:q1", "level": "easy", "type": "mc", "q": "What is the name of the change from a solid to a liquid?", "options": ["Melting", "Freezing", "Condensing", "Evaporating"], "answer": "Melting", "hint": "Think about an ice cube left out on a warm table.", "explain": "Solid to liquid is melting. Freezing is the opposite, liquid to solid. Condensing is gas to liquid, and evaporating is liquid to gas. Learn each name with its direction, because half the marks lost here come from getting the direction backwards.", "topic": "changes of state: melting"}, {"id": "s4-particles:q2", "level": "easy", "type": "mc", "q": "Water droplets appear on the inside of a cold window on a winter morning. What change of state has happened?", "options": ["Condensing, gas to liquid", "Evaporating, liquid to gas", "Melting, solid to liquid", "Freezing, liquid to solid"], "answer": "Condensing, gas to liquid", "hint": "The water was invisible water vapour in the warm air of the room before it touched the cold glass.", "explain": "This is condensing, gas to liquid. Invisible water vapour in the warm room air touches the cold glass, loses energy, slows down and turns back into liquid droplets. Nothing has melted, because there was no solid to start with.", "topic": "changes of state: condensing"}, {"id": "s4-particles:q3", "level": "easy", "type": "text", "q": "What is the name for a solid turning straight into a gas, with no liquid stage in between?", "answer": "sublimation", "accept": ["sublimation", "Sublimation", "subliming", "sublime", "sublimating"], "hint": "It starts with the letters sub. It is what solid carbon dioxide does.", "explain": "The answer is sublimation. The solid turns straight into a gas and never becomes a liquid. Solid carbon dioxide, known as dry ice, does this at normal air pressure, which is why stage smoke pours off it and leaves no puddle. The reverse, gas straight to solid, is called deposition.", "topic": "changes of state: sublimation"}, {"id": "s4-particles:q4", "level": "easy", "type": "mc", "q": "Use the table. What state is substance R in at room temperature, 20 degrees C?", "options": ["Solid", "Liquid", "Gas", "It is changing from liquid to gas"], "answer": "Solid", "hint": "R melts at 801 degrees C. Is 20 above or below that?", "explain": "Substance R is a solid at 20 degrees C. Its melting point is 801, and 20 is far below that, so it has not melted yet. Anything below its melting point is a solid.", "topic": "states: using melting point to decide a state"}, {"id": "s4-particles:q5", "level": "easy", "type": "mc", "q": "Use the table. What state is substance P in at room temperature, 20 degrees C?", "options": ["Gas", "Solid", "Liquid", "Half liquid and half solid"], "answer": "Gas", "hint": "P boils at -183 degrees C. Room temperature is way above that.", "explain": "Substance P is a gas at 20 degrees C. Its boiling point is -183, and 20 degrees is far above that, so it boiled off long ago. Do not be thrown by the minus signs. -183 is a very cold temperature, so anything at normal room temperature is well above it.", "topic": "states: using boiling point to decide a state"}, {"id": "s4-particles:q6", "level": "medium", "type": "text", "q": "Use the table. What state is substance Q in at 20 degrees C? Write solid, liquid or gas.", "answer": "liquid", "accept": ["liquid", "Liquid", "a liquid", "liquid state"], "hint": "Q melts at -39 and boils at 357. Where does 20 sit compared with those two numbers?", "explain": "Substance Q is a liquid at 20 degrees C. The rule is that a substance is liquid between its melting point and its boiling point. Q melts at -39, and 20 is above that, so it has melted. Q boils at 357, and 20 is below that, so it has not boiled. Between the two means liquid. Q behaves like mercury, a metal that is liquid at room temperature.", "topic": "states: using melting and boiling points together"}, {"id": "s4-particles:q7", "level": "medium", "type": "mc", "q": "Look at the heating curve. What is happening to substance T between 2 and 7 minutes?", "options": ["It is melting, turning from solid to liquid", "It is boiling, turning from liquid to gas", "It is cooling down", "The heater has been switched off"], "answer": "It is melting, turning from solid to liquid", "hint": "The temperature is flat at 0. Look up substance T in the table. What temperature is its melting point?", "explain": "It is melting. The flat part sits at 0 degrees C, and the table says the melting point of T is 0. A flat section on a heating curve always means a change of state, and a flat section at the melting point means melting. The heater is definitely still on, because the question says it is never switched off.", "topic": "states: reading a heating curve"}, {"id": "s4-particles:q8", "level": "medium", "type": "mc", "q": "Between 15 and 25 minutes the temperature stays at 100 even though the heater is still on. Why does it not rise?", "options": ["The energy is being used to break the forces between the particles instead of speeding them up", "The heater is not powerful enough to go above 100", "The substance has stopped absorbing energy", "100 degrees is the hottest that anything can get"], "answer": "The energy is being used to break the forces between the particles instead of speeding them up", "hint": "Temperature measures how fast the particles are moving. If the temperature is not rising, the particles are not speeding up. So where is all the energy going?", "explain": "The energy is still going in, but it is being used to break the forces holding the liquid particles together so they can escape as a gas. Temperature is a measure of how fast the particles move, and energy spent breaking forces is not spent on speeding particles up, so the reading stays flat. Once every particle has escaped, the energy goes back into speeding them up and the temperature climbs above 100.", "topic": "states: why temperature is flat during a change of state"}, {"id": "s4-particles:q9", "level": "medium", "type": "mc", "q": "What is the difference between evaporation and boiling?", "options": ["Evaporation happens only at the surface at any temperature below the boiling point, while boiling happens throughout the liquid at the boiling point", "Evaporation happens throughout the liquid, while boiling happens only at the surface", "Evaporation only happens to water, while boiling happens to every liquid", "There is no real difference, they are two words for the same process"], "answer": "Evaporation happens only at the surface at any temperature below the boiling point, while boiling happens throughout the liquid at the boiling point", "hint": "A puddle dries up on a cold day without ever bubbling. What is that telling you?", "explain": "Both turn liquid into gas, but not in the same way. Evaporation happens only at the surface, where the fastest particles escape, and it happens at any temperature, which is why a puddle dries up on a cold day. Boiling happens all the way through the liquid and only at the boiling point, which is why you see bubbles forming deep inside the liquid and not just at the top.", "topic": "states: evaporation versus boiling"}, {"id": "s4-particles:q10", "level": "medium", "type": "mc", "q": "Solid carbon dioxide, called dry ice, is left out in a warm room. It shrinks away completely and leaves no puddle behind. Which change of state is this?", "options": ["Sublimation", "Melting", "Evaporation", "Condensation"], "answer": "Sublimation", "hint": "No puddle means there was never a liquid stage.", "explain": "This is sublimation, solid straight to gas with no liquid stage. The clue is the missing puddle. If it had melted first there would be liquid left behind, and evaporation can only happen to a liquid in the first place. Iodine does the same thing when it is gently warmed.", "topic": "changes of state: identifying sublimation"}, {"id": "s4-particles:q11", "level": "stretch", "type": "mc", "q": "Use the table. Which substance is a LIQUID at -50 degrees C?", "options": ["Substance S", "Substance P", "Substance Q", "Substance T"], "answer": "Substance S", "hint": "A substance is liquid when the temperature sits between its melting point and its boiling point. Test -50 against each pair, and watch the minus signs.", "explain": "The answer is substance S. S melts at -114 and boils at 78, and -50 sits between those two, so it is a liquid. Check the others. P boils at -183, and -50 is above that, so P is a gas. Q melts at -39, and -50 is below that, so Q has not melted yet and is a solid. T melts at 0, so at -50 it is solid ice. With minus numbers, remember that -50 is warmer than -114 but colder than -39.", "topic": "states: negative temperatures and states"}, {"id": "s4-particles:q12", "level": "stretch", "type": "mc", "q": "Which substance in the table stays a liquid over the WIDEST range of temperatures?", "options": ["Substance R", "Substance Q", "Substance S", "Substance T"], "answer": "Substance R", "hint": "For each one, work out the boiling point take away the melting point. That gap is how many degrees it spends as a liquid.", "explain": "The answer is substance R. Subtract the melting point from the boiling point for each. R gives 1465 - 801 = 664 degrees. Q gives 357 - (-39) = 396 degrees. S gives 78 - (-114) = 192 degrees. T gives 100 - 0 = 100 degrees. R has the biggest gap by a long way, so it stays liquid over the widest range, even though it needs a furnace to melt it in the first place.", "topic": "states: comparing liquid ranges"}, {"id": "s4-particles:q13", "level": "stretch", "type": "mc", "q": "A mystery substance is a liquid at 20 degrees C and a gas at 90 degrees C. Which substance in the table is it?", "options": ["Substance S", "Substance Q", "Substance T", "Substance P"], "answer": "Substance S", "hint": "You need two conditions to be true at once. Its boiling point has to be somewhere between 20 and 90.", "explain": "The answer is substance S. For it to be liquid at 20 and gas at 90, its boiling point must sit between 20 and 90. S boils at 78, which fits, and it melts at -114, so it is definitely liquid at 20. Q boils at 357, so it is still liquid at 90. T boils at 100, so it is still liquid at 90 too. P is already a gas at 20. Only S changes over in that window. S behaves like ethanol.", "topic": "states: identifying a substance from its behaviour"}, {"id": "s4-particles:q14", "level": "stretch", "type": "long", "q": "Explain, in terms of particles and energy, why the temperature of substance T stays at exactly 0 degrees C between 2 and 7 minutes, even though the heater is on the whole time.", "answer": "Between 2 and 7 minutes the substance is melting. Energy from the heater is still going in, but it is not being used to make the particles move faster. It is being used to break the forces holding the particles in the fixed pattern of a solid, so that they can break free and slide past each other as a liquid. Temperature is a measure of how fast the particles are moving, so while the energy is going into breaking forces rather than into speed, the temperature cannot rise. Once all of the solid has melted there are no more of those forces left to break, so the energy goes back into speeding the particles up and the temperature starts to rise again after 7 minutes.", "marks": 4, "hint": "Say what is happening, say where the energy is going, say what temperature actually measures, and then say why the temperature moves again afterwards.", "explain": "Give yourself a mark for each of these four points. One, the substance is melting between 2 and 7 minutes, and 0 degrees C is its melting point. Two, the energy from the heater is still going in and is being used to break the forces between the particles in the solid. Three, temperature measures how fast the particles are moving, so energy spent breaking forces rather than on speed means no temperature rise. Four, once it has all melted there are no more forces to break, so the energy goes back into speed and the temperature rises again. Saying only that the energy is used to melt it is worth one mark, because it repeats the question rather than explaining it.", "topic": "states: explaining a flat heating curve"}]}, "s5-working-sci": {"id": "s5-working-sci", "day": "Day 7", "subject": "Science", "title": "Working scientifically", "minutes": 25, "objective": "Identify independent, dependent and control variables, spot a flawed method, calculate means with anomalies removed, and judge reliability.", "extract": "SAM'S FIRST ATTEMPT, which has a problem in it.\n\nSam wants to find out whether more layers of foam keep hot water warmer for longer.\n\nBeaker 1: 1 layer of foam, 200 ml of water starting at 80 degrees C, a lid on top.\nBeaker 2: 3 layers of foam, 300 ml of water starting at 90 degrees C, no lid.\n\nBoth beakers are left for 10 minutes and the temperature drop is measured.\n\nSAM'S SECOND ATTEMPT, done properly.\n\nEvery beaker holds 200 ml of water starting at 80 degrees C. No beaker has a lid. Every beaker is the same size and stands on the same bench in the same room. The only thing Sam changes is the number of layers of foam wrapped around the beaker. He measures how many degrees the temperature drops in 10 minutes. He repeats every test three times.\n\nRESULTS: temperature drop in degrees C over 10 minutes.\n\n0 layers: 22, 24, 23\n1 layer: 16, 15, 17\n2 layers: 11, 12, 10\n3 layers: 8, 7, 42", "teach": {"intro": ["An experiment only proves something if ONE thing is changed at a time. Change two, and when the result comes out you cannot tell which of the two caused it. The whole experiment is wasted, no matter how neat the table looks.", "The INDEPENDENT variable is the one thing you deliberately change. The DEPENDENT variable is the thing you measure, and it depends on what you changed. CONTROL variables are everything else, and you keep every one of them exactly the same.", "There is a quick way to name them. Write the sentence: I change the ..., and I measure the ... The first blank is the independent variable, the second is the dependent variable.", "RELIABLE and VALID are not the same word and examiners test the difference. Reliable means you would get the same results if you did it again, which is why you repeat readings and take a mean. Valid means you actually tested the thing you said you were testing, which needs proper control variables. A test can be repeatable and still be worthless if it was not a fair test.", "An ANOMALY is a result that clearly does not fit the pattern, usually caused by a mistake in the measuring. Leave it OUT of the mean, but do not rub it out of the table. Marks are given for spotting it and for saying why you ignored it."], "example": {"problem": "Look at Sam's first attempt. Explain why that method cannot answer the question he is asking.", "steps": ["Find what he wants to test. He wants to know whether more layers of foam keep water warmer, so the layers of foam should be the only thing that changes.", "Now list everything that actually changed between the two beakers. The layers of foam changed, 1 to 3. The volume of water changed, 200 ml to 300 ml. The starting temperature changed, 80 to 90 degrees. The lid changed, on to off.", "That is four things changing at once, not one.", "Think about the result. Suppose beaker 2 cools more slowly. You cannot say the foam did it. The bigger volume of water would cool more slowly anyway, and the beaker with no lid should lose heat faster, so the effects are all tangled together.", "Fix it. Keep the volume, the starting temperature and the lid identical in both beakers. Change only the number of layers of foam."], "answer": "It is not a fair test. Four variables changed at once, so any difference in cooling cannot be linked to the foam rather than to the volume, the starting temperature or the lid."}, "keyfact": "One variable changes, everything else stays the same. If two things change at once, the experiment cannot tell you which one mattered, and no amount of repeating will fix it."}, "questions": [{"id": "s5-working-sci:q1", "level": "easy", "type": "mc", "q": "What is the independent variable in an experiment?", "options": ["The one thing you deliberately change", "The thing you measure", "Everything you keep the same", "The result you were hoping for"], "answer": "The one thing you deliberately change", "hint": "Fill in the sentence: I change the ...", "explain": "The independent variable is the one thing you deliberately change. The thing you measure is the dependent variable, because its value depends on what you changed. Everything you keep the same is a control variable.", "topic": "working scientifically: independent variable"}, {"id": "s5-working-sci:q2", "level": "easy", "type": "text", "q": "In Sam's second attempt, what is the independent variable?", "answer": "the number of layers of foam", "accept": ["the number of layers of foam", "number of layers of foam", "layers of foam", "the layers of foam", "number of layers", "foam layers", "amount of foam", "thickness of foam", "the foam"], "hint": "It is the only thing Sam changes from one beaker to the next.", "explain": "The independent variable is the number of layers of foam. Sam says himself that it is the only thing he changes. Everything else, the volume, the starting temperature, the lid, the beaker and the room, stays the same, which is exactly what makes it a fair test this time.", "topic": "working scientifically: identifying the independent variable"}, {"id": "s5-working-sci:q3", "level": "easy", "type": "mc", "q": "In Sam's second attempt, what is the dependent variable?", "options": ["The temperature drop over 10 minutes", "The number of layers of foam", "The volume of water", "The size of the beaker"], "answer": "The temperature drop over 10 minutes", "hint": "Fill in the sentence: I measure the ...", "explain": "The dependent variable is the temperature drop over 10 minutes. That is the thing Sam measures, and how big it is depends on the number of layers of foam. The layers of foam are the independent variable, and the volume and beaker size are control variables.", "topic": "working scientifically: identifying the dependent variable"}, {"id": "s5-working-sci:q4", "level": "easy", "type": "mc", "q": "Which of these is a CONTROL variable in Sam's second attempt?", "options": ["The volume of water, kept at 200 ml every time", "The number of layers of foam", "The temperature drop in 10 minutes", "The number of repeats"], "answer": "The volume of water, kept at 200 ml every time", "hint": "A control variable is something that could have affected the result, so it is deliberately kept the same.", "explain": "The volume of water is a control variable. It could easily affect how fast the water cools, so Sam keeps it at 200 ml every single time. The layers of foam are what he changes, and the temperature drop is what he measures, so neither of those is a control variable.", "topic": "working scientifically: control variables"}, {"id": "s5-working-sci:q5", "level": "medium", "type": "mc", "q": "What is the main problem with Sam's FIRST attempt?", "options": ["More than one variable was changed at the same time, so it is not a fair test", "He did not leave the beakers for long enough", "He used the wrong type of thermometer", "He should have used cold water instead of hot"], "answer": "More than one variable was changed at the same time, so it is not a fair test", "hint": "Line the two beakers up and count every single difference between them, not just the one he meant to change.", "explain": "Four things changed at once between the two beakers: the layers of foam, the volume of water, the starting temperature and whether there was a lid. That means it is not a fair test. If beaker 2 cools more slowly, the foam might be responsible, but so might the extra 100 ml of water or the missing lid. There is no way to tell them apart, so the experiment cannot answer the question. Leaving it longer or changing the thermometer would not fix that.", "topic": "working scientifically: spotting a flawed method"}, {"id": "s5-working-sci:q6", "level": "medium", "type": "text", "q": "Work out the mean temperature drop for 0 layers of foam. The readings are 22, 24 and 23.", "answer": "23", "accept": ["23", "23.0", "23 degrees", "23 C"], "hint": "Add the three readings together, then divide by 3.", "explain": "The mean is 23. Add them up: 22 + 24 + 23 = 69. Then divide by how many readings there are: 69 divided by 3 = 23. The mean should always land somewhere inside the range of your readings, and 23 sits neatly between 22 and 24, so it looks right.", "topic": "working scientifically: calculating a mean"}, {"id": "s5-working-sci:q7", "level": "medium", "type": "text", "q": "Work out the mean temperature drop for 1 layer of foam. The readings are 16, 15 and 17.", "answer": "16", "accept": ["16", "16.0", "16 degrees", "16 C"], "hint": "Add the three readings, then divide by 3.", "explain": "The mean is 16. Add them up: 16 + 15 + 17 = 48. Then 48 divided by 3 = 16. Notice this is already lower than the 23 for no foam, which is the first sign that the foam is doing something.", "topic": "working scientifically: calculating a mean"}, {"id": "s5-working-sci:q8", "level": "medium", "type": "text", "q": "Work out the mean temperature drop for 2 layers of foam. The readings are 11, 12 and 10.", "answer": "11", "accept": ["11", "11.0", "11 degrees", "11 C"], "hint": "Add the three readings, then divide by 3.", "explain": "The mean is 11. Add them up: 11 + 12 + 10 = 33. Then 33 divided by 3 = 11. The three means so far are 23, then 16, then 11, so the drop is getting smaller each time a layer is added.", "topic": "working scientifically: calculating a mean"}, {"id": "s5-working-sci:q9", "level": "medium", "type": "text", "q": "Look at the results for 3 layers of foam: 8, 7 and 42. Which reading is the anomaly? Write just the number.", "answer": "42", "accept": ["42", "42 degrees", "the 42", "42 C"], "hint": "Two of the readings agree closely with each other. The third does not fit the pattern at all.", "explain": "The anomaly is 42. The other two readings for 3 layers are 8 and 7, which agree closely, and the pattern across the whole table has the drop getting smaller as layers are added. A drop of 42 is bigger than the drop with no foam at all, which makes no sense, so it must be a mistake, perhaps the thermometer being misread or the foam falling off. Leave it out of the mean, but keep it written in the table.", "topic": "working scientifically: spotting an anomaly"}, {"id": "s5-working-sci:q10", "level": "medium", "type": "text", "q": "Work out the mean temperature drop for 3 layers of foam, IGNORING the anomaly.", "answer": "7.5", "accept": ["7.5", "7.5 degrees", "7.5 C", "7 1/2"], "hint": "You are only using two readings now, so divide by 2, not by 3.", "explain": "The mean is 7.5. Ignore the anomaly of 42 and use only 8 and 7. Add them: 8 + 7 = 15. Now divide by 2, because there are only two readings left: 15 divided by 2 = 7.5. Dividing by 3 out of habit would give 5, which is wrong. If you had left the 42 in, the mean would have been 19, which would have wrecked the whole conclusion.", "topic": "working scientifically: mean with an anomaly removed"}, {"id": "s5-working-sci:q11", "level": "medium", "type": "mc", "q": "Why did Sam repeat every test three times?", "options": ["To spot anomalies and make the results more reliable", "To use up the rest of the hot water", "To change the independent variable three times", "Because one reading is never allowed in science"], "answer": "To spot anomalies and make the results more reliable", "hint": "How would he have known that the 42 was a mistake if he had only measured once?", "explain": "Repeats make results more reliable and let you spot anomalies. With only one reading for 3 layers, Sam might have recorded 42 and believed it. With three readings he can see that 42 does not fit and ignore it. Repeating also lets him take a mean, which reduces the effect of small measuring errors.", "topic": "working scientifically: why we repeat readings"}, {"id": "s5-working-sci:q12", "level": "stretch", "type": "mc", "q": "The means are 23, 16, 11 and 7.5 degrees for 0, 1, 2 and 3 layers. What conclusion do these results support?", "options": ["As the number of layers of foam increases, the temperature drop gets smaller, so more foam insulates better", "As the number of layers of foam increases, the temperature drop gets bigger", "The number of layers of foam makes no difference to the temperature drop", "Doubling the layers of foam exactly halves the temperature drop"], "answer": "As the number of layers of foam increases, the temperature drop gets smaller, so more foam insulates better", "hint": "Read the four means in order. Are they going up or down, and what does a smaller temperature drop actually mean?", "explain": "The means fall steadily: 23, 16, 11, 7.5. A smaller temperature drop means the water stayed warmer, so more layers of foam insulate better. The last option is a trap. Going from 1 layer to 2 layers took the drop from 16 to 11, and half of 16 is 8, not 11, so doubling the layers does not halve the drop. Always test a claim like that against the actual numbers before you agree with it.", "topic": "working scientifically: drawing a conclusion from data"}, {"id": "s5-working-sci:q13", "level": "stretch", "type": "mc", "q": "Sam now tests 4 layers of foam. Using the pattern in the means (23, 16, 11, 7.5), what is the most sensible prediction for the temperature drop?", "options": ["About 5 degrees", "About 0 degrees", "About 7.5 degrees", "About 12 degrees"], "answer": "About 5 degrees", "hint": "Look at the size of the gap between each mean and the next. The gaps are getting smaller. What is the next gap likely to be?", "explain": "About 5 degrees is the sensible prediction. The gaps between the means are 7, then 5, then 3.5, so each extra layer helps a bit less than the one before. The next gap should be smaller again, around 2 or 3, which takes 7.5 down to roughly 5. About 0 is wrong because foam slows heat loss down, it never stops it completely. About 12 would mean the drop went back up, which breaks the pattern.", "topic": "working scientifically: predicting from a pattern"}, {"id": "s5-working-sci:q14", "level": "stretch", "type": "long", "q": "Sam writes: My results prove that foam is the best insulator you can buy. Explain why his experiment does not prove that, and describe one change that would make his investigation stronger.", "answer": "His experiment only tested one material, foam. To say foam is the best insulator you would have to test other materials such as wool, bubble wrap, newspaper and cotton wool under exactly the same conditions and compare them. All Sam has shown is that more layers of foam work better than fewer layers of foam, which is a different claim. One change that would make the investigation stronger is to test several different materials, using the same thickness, the same volume of water, the same starting temperature and the same time, so the comparison is fair. Other good improvements are doing more than three repeats, using a data logger so the temperature is recorded at set times without human error, and testing more values of the independent variable such as 4 and 5 layers.", "marks": 4, "hint": "Look hard at the word best. How many different materials did he actually test? You can only compare things you have measured.", "explain": "Two marks for the criticism and two for the improvement. The criticism: Sam only tested one material, so he has no evidence about any other material. His data supports the claim that more layers of foam insulate better than fewer, and nothing wider than that. Comparing materials would need each material tested under identical conditions. The improvement: any sensible one earns the marks, as long as you say why it helps. Testing several materials at the same thickness allows a fair comparison. More repeats give a more reliable mean. A data logger removes human timing and reading errors. Testing more layer values gives a clearer pattern. An answer that just says he should do it more times without saying why is worth one mark.", "topic": "working scientifically: evaluating a conclusion"}]}, "de1-verb2": {"id": "de1-verb2", "day": "Monday", "subject": "German", "title": "The rule that runs German: verb second", "minutes": 20, "objective": "Keep the conjugated verb in second position, including when a time phrase is moved to the front.", "extract": null, "teach": {"intro": ["In a German statement the verb that carries the ending must be the second idea. An idea can be one word or a small group of words that belong together, so you count ideas and not words.", "Ich spiele Fussball means I play football. Idea one is ich, idea two is the verb spiele, and so far this matches English.", "If you put something else first, the verb still has to be second, so the subject slides behind it. Heute spiele ich Fussball is correct, and Heute ich spiele Fussball is wrong because the verb has been pushed into third place."], "example": {"problem": "Rewrite Ich gehe am Montag in die Schule so that it starts with Am Montag.", "steps": ["Find the conjugated verb. It is gehe, from gehen, to go.", "Am Montag is now idea one. It is two words but one idea, because am belongs with Montag.", "The verb must be idea two, so gehe comes next.", "The subject ich now goes third, then the rest of the sentence follows."], "answer": "Am Montag gehe ich in die Schule."}, "keyfact": "Verb second, always. Count ideas, not words. If anything other than the subject goes first, the subject moves to just after the verb."}, "questions": [{"id": "de1-verb2:q1", "level": "easy", "type": "mc", "q": "Which word is the verb in Ich wohne in London?", "options": ["Ich", "wohne", "in", "London"], "answer": "wohne", "hint": "The verb is the doing word. It is the one that changes its ending to match ich.", "explain": "The answer is wohne. Wohnen means to live somewhere, and with ich the ending changes to -e, giving wohne. Ich is the subject, in is a small linking word and London is a place name.", "topic": "word order: finding the verb"}, {"id": "de1-verb2:q2", "level": "easy", "type": "mc", "q": "Which sentence is correct?", "options": ["Heute ich spiele Fussball.", "Heute spiele ich Fussball.", "Spiele heute ich Fussball.", "Ich heute spiele Fussball."], "answer": "Heute spiele ich Fussball.", "hint": "Count the ideas. The verb has to be the second one.", "explain": "The answer is Heute spiele ich Fussball. Heute is idea one, so the verb spiele must be idea two and ich is pushed to third. Heute ich spiele Fussball puts the verb third, which German does not allow. The third option is a question, and the fourth also leaves the verb in third place.", "topic": "word order: fronted time phrase"}, {"id": "de1-verb2:q3", "level": "easy", "type": "text", "q": "Put these words into a correct sentence: spiele / ich / Tennis", "answer": "Ich spiele Tennis.", "accept": ["ich spiele tennis.", "Ich spiele Tennis", "ich spiele tennis", "Ich spiele Tennis."], "hint": "Start with the person, then the verb.", "explain": "The answer is Ich spiele Tennis. The subject ich is idea one and the verb spiele is idea two, which is the normal order. Tennis is the thing being played and goes at the end.", "topic": "word order: normal statement order"}, {"id": "de1-verb2:q4", "level": "easy", "type": "mc", "q": "In a normal German statement, which position does the conjugated verb take?", "options": ["First", "Second", "Third", "Last"], "answer": "Second", "hint": "It is the same position every time, no matter what comes first.", "explain": "The answer is second. The conjugated verb is always the second idea in a German statement. This does not change, which is why everything else has to move around it.", "topic": "word order: the verb second rule"}, {"id": "de1-verb2:q5", "level": "medium", "type": "text", "q": "Rewrite this sentence so it starts with Morgen: Ich fahre nach Berlin.", "answer": "Morgen fahre ich nach Berlin.", "accept": ["morgen fahre ich nach berlin.", "morgen fahre ich nach berlin", "Morgen fahre ich nach Berlin.", "Morgen fahre ich nach Berlin"], "hint": "Morgen becomes idea one, so the verb must come straight after it.", "explain": "The answer is Morgen fahre ich nach Berlin. Morgen means tomorrow and is now idea one. The verb fahre must be idea two, so ich moves to third place. Morgen ich fahre nach Berlin would be wrong.", "topic": "word order: fronted time phrase"}, {"id": "de1-verb2:q6", "level": "medium", "type": "text", "q": "Rewrite this sentence so it starts with Am Freitag: Wir gehen ins Kino.", "answer": "Am Freitag gehen wir ins Kino.", "accept": ["am freitag gehen wir ins kino.", "Am Freitag gehen wir ins Kino.", "am freitag gehen wir ins kino", "Am Freitag gehen wir ins Kino"], "hint": "Am Freitag is two words but only one idea.", "explain": "The answer is Am Freitag gehen wir ins Kino. Am Freitag means on Friday and counts as a single idea, so it fills position one. The verb gehen goes second and the subject wir goes third.", "topic": "word order: fronted time phrase"}, {"id": "de1-verb2:q7", "level": "medium", "type": "mc", "q": "Why is Um acht Uhr ich esse Fruehstueck wrong?", "options": ["The verb esse should be isst", "The verb is in third place and it must be second", "A time phrase cannot start a German sentence", "ich must always be the first word"], "answer": "The verb is in third place and it must be second", "hint": "Count the ideas in front of the verb.", "explain": "The answer is that the verb is in third place and it must be second. Um acht Uhr is idea one, ich is idea two and esse has ended up third. The correct sentence is Um acht Uhr esse ich Fruehstueck. The verb form esse is right for ich, so that is not the problem.", "topic": "word order: diagnosing a verb third error"}, {"id": "de1-verb2:q8", "level": "medium", "type": "text", "q": "Put these into one correct sentence, starting with the time phrase: in die Stadt / gehe / am Samstag / ich", "answer": "Am Samstag gehe ich in die Stadt.", "accept": ["Am Samstag gehe ich in die Stadt", "am samstag gehe ich in die stadt.", "am samstag gehe ich in die stadt", "Am Samstag gehe ich in die Stadt."], "hint": "Time phrase first, then the verb, then the person.", "explain": "The answer is Am Samstag gehe ich in die Stadt. Am Samstag is idea one, so the verb gehe takes position two and ich follows in third place. In die Stadt means into town and goes at the end.", "topic": "word order: fronted time phrase"}, {"id": "de1-verb2:q9", "level": "stretch", "type": "text", "q": "Correct this sentence: Jeden Tag ich lese ein Buch.", "answer": "Jeden Tag lese ich ein Buch.", "accept": ["jeden tag lese ich ein buch.", "Jeden Tag lese ich ein Buch", "jeden tag lese ich ein buch", "Jeden Tag lese ich ein Buch."], "hint": "Only two words need to swap.", "explain": "The answer is Jeden Tag lese ich ein Buch. Jeden Tag means every day and is idea one, so the verb lese must come second and ich moves behind it. The verb form lese is correct for ich, so only the order needed fixing.", "topic": "word order: correcting verb third"}, {"id": "de1-verb2:q10", "level": "stretch", "type": "mc", "q": "Which sentence is correct German, with the verb as the second idea?", "options": ["Meine Schwester wohnen und ich in Manchester.", "Meine Schwester und wohnen ich in Manchester.", "Meine Schwester und ich wohnen in Manchester.", "Wohnen meine Schwester und ich in Manchester."], "answer": "Meine Schwester und ich wohnen in Manchester.", "hint": "The whole subject can be several words and still count as one idea.", "explain": "The answer is Meine Schwester und ich wohnen in Manchester. Meine Schwester und ich is a long subject but it is still one idea, so the verb wohnen is idea two even though it is the fourth word. That subject means we, so the verb takes the wir ending -en. The other options break the sentence apart or turn it into a question.", "topic": "word order: counting ideas not words"}]}, "de2-pronouns": {"id": "de2-pronouns", "day": "Tuesday", "subject": "German", "title": "Pronouns and where you live", "minutes": 20, "objective": "Use all the personal pronouns with the right verb ending, and say where you live and where you come from.", "extract": null, "teach": {"intro": ["The personal pronouns are ich for I, du for you, er for he, sie for she, es for it, wir for we, ihr for you when you mean more than one friend, and sie for they. Sie with a capital S is the polite word for you.", "Each pronoun takes its own verb ending. With wohnen, to live, you get ich wohne, du wohnst, er wohnt, sie wohnt, es wohnt, wir wohnen, ihr wohnt, sie wohnen and Sie wohnen.", "Use du for a friend, someone your own age or a family member. Use Sie for an adult you do not know, such as a shopkeeper or a stranger, and always write it with a capital S."], "example": {"problem": "Say He lives in Manchester in German.", "steps": ["He is er.", "The verb is wohnen. Take off the -en to get the stem wohn.", "er takes the ending -t, so wohn plus t gives wohnt.", "The place goes at the end, after in."], "answer": "Er wohnt in Manchester."}, "keyfact": "Endings: ich -e, du -st, er, sie and es -t, wir -en, ihr -t, sie and Sie -en."}, "questions": [{"id": "de2-pronouns:q1", "level": "easy", "type": "mc", "q": "What does wir mean?", "options": ["I", "we", "they", "he"], "answer": "we", "hint": "It is the pronoun you use when you are talking about yourself and other people.", "explain": "The answer is we. Wir means we and takes the verb ending -en, so wir wohnen means we live. I is ich, they is sie and he is er.", "topic": "pronouns: meaning"}, {"id": "de2-pronouns:q2", "level": "easy", "type": "text", "q": "Fill the gap with the right form of wohnen: Ich ___ in Birmingham.", "answer": "wohne", "accept": ["wohne", "wohne."], "hint": "With ich the ending is -e.", "explain": "The answer is wohne. The stem of wohnen is wohn and ich takes the ending -e, so it becomes wohne. The full sentence is Ich wohne in Birmingham, meaning I live in Birmingham.", "topic": "pronouns: ich form of a regular verb"}, {"id": "de2-pronouns:q3", "level": "easy", "type": "mc", "q": "You are talking to a friend your own age. Which word for you do you use?", "options": ["du", "Sie", "ihr", "er"], "answer": "du", "hint": "There is a friendly one and a polite one. This is the friendly situation.", "explain": "The answer is du. Du is the friendly word for you when you are speaking to one person you know well. Sie is the polite form for adults you do not know, and ihr is for more than one friend.", "topic": "pronouns: du versus Sie"}, {"id": "de2-pronouns:q4", "level": "easy", "type": "text", "q": "Fill the gap with the right form of wohnen: Er ___ in Leeds.", "answer": "wohnt", "accept": ["wohnt", "wohnt."], "hint": "With er, sie and es the ending is -t.", "explain": "The answer is wohnt. The stem is wohn and er takes the ending -t, giving wohnt. The same ending works for sie meaning she and for es meaning it.", "topic": "pronouns: er form of a regular verb"}, {"id": "de2-pronouns:q5", "level": "medium", "type": "text", "q": "How do you ask a friend where he lives? Write the full question in German.", "answer": "Wo wohnst du?", "accept": ["wo wohnst du?", "wo wohnst du", "Wo wohnst du", "Wo wohnst du?"], "hint": "Start with the question word wo, then the verb, then du.", "explain": "The answer is Wo wohnst du. Wo means where, and in a question the verb comes straight after the question word. With du the ending is -st, so wohnen becomes wohnst.", "topic": "pronouns: question with du"}, {"id": "de2-pronouns:q6", "level": "medium", "type": "text", "q": "Fill the gap with the right form of kommen: Wir ___ aus Deutschland.", "answer": "kommen", "accept": ["kommen", "kommen."], "hint": "With wir the ending is the same as the whole verb.", "explain": "The answer is kommen. With wir the ending is -en, which happens to look exactly like the plain verb. The sentence means we come from Germany. Aus means from when you are talking about a country or town.", "topic": "pronouns: wir form of a regular verb"}, {"id": "de2-pronouns:q7", "level": "medium", "type": "mc", "q": "You are speaking to your friend's mother for the first time. Which question is correct?", "options": ["Wo wohnst du?", "Wo wohnen Sie?", "Wo wohnt ihr?", "Wo wohne ich?"], "answer": "Wo wohnen Sie?", "hint": "You do not know this adult, so use the polite form.", "explain": "The answer is Wo wohnen Sie. Sie with a capital S is the polite you and takes the ending -en. Wo wohnst du would be too familiar for an adult you have just met. Wo wohnt ihr is for more than one friend.", "topic": "pronouns: polite Sie"}, {"id": "de2-pronouns:q8", "level": "medium", "type": "text", "q": "Fill the gap with the right form of wohnen: Ihr ___ in Koeln.", "answer": "wohnt", "accept": ["wohnt", "wohnt."], "hint": "The ihr ending is the same as the er ending.", "explain": "The answer is wohnt. Ihr means you when you are speaking to more than one friend, and it takes the ending -t. So the sentence Ihr wohnt in Koeln means you all live in Cologne.", "topic": "pronouns: ihr form"}, {"id": "de2-pronouns:q9", "level": "stretch", "type": "text", "q": "Write in German: They live in Hamburg.", "answer": "Sie wohnen in Hamburg.", "accept": ["sie wohnen in hamburg.", "Sie wohnen in Hamburg", "sie wohnen in hamburg", "Sie wohnen in Hamburg."], "hint": "They is sie, and it takes the same ending as wir.", "explain": "The answer is Sie wohnen in Hamburg. Sie meaning they takes the ending -en, so wohnen stays as wohnen. This looks the same as the polite Sie, and only the meaning of the sentence tells you which one it is.", "topic": "pronouns: sie meaning they"}, {"id": "de2-pronouns:q10", "level": "stretch", "type": "text", "q": "Write in German: I come from England and I live in London.", "answer": "Ich komme aus England und ich wohne in London.", "accept": ["ich komme aus england und ich wohne in london", "ich komme aus england und ich wohne in london.", "Ich komme aus England und ich wohne in London.", "Ich komme aus England und ich wohne in London", "ich komme aus england und wohne in london", "Ich komme aus England und wohne in London", "ich komme aus england und wohne in london.", "Ich komme aus England und wohne in London."], "hint": "Use aus for the country you come from and in for the town you live in.", "explain": "The answer is Ich komme aus England und ich wohne in London. Kommen with ich gives komme, and wohnen with ich gives wohne. Aus means from and in means in. You may also drop the second ich and write Ich komme aus England und wohne in London, which is also correct.", "topic": "pronouns: kommen aus and wohnen in together"}]}, "de3-irregular": {"id": "de3-irregular", "day": "Wednesday", "subject": "German", "title": "Verbs that change in the middle", "minutes": 20, "objective": "Use the du and er forms of fahren, essen, lesen, sehen and sprechen, where the vowel changes.", "extract": null, "teach": {"intro": ["Most German verbs keep the same stem and only change the ending. A small group of very common verbs also change the vowel in the middle, and this happens only in the du form and the er, sie, es form.", "Fahren means to travel or to go by vehicle. You say ich fahre, but du faehrst and er faehrt, because the a picks up two dots.", "The five to learn now are fahren, essen, lesen, sehen and sprechen. In ich, wir, ihr and sie the vowel stays normal, so only two forms are ever affected."], "example": {"problem": "Put lesen, to read, into the du form.", "steps": ["The stem of lesen is les.", "du and er change the vowel. In lesen the e becomes ie, so the stem becomes lies.", "The du ending is -st, but the stem already ends in s, so you do not add a second s.", "That leaves lies plus t, which gives liest."], "answer": "du liest"}, "keyfact": "Only du and er, sie, es change the vowel. fahren gives faehrst and faehrt. essen gives isst and isst. lesen gives liest and liest. sehen gives siehst and sieht. sprechen gives sprichst and spricht."}, "questions": [{"id": "de3-irregular:q1", "level": "easy", "type": "text", "q": "Fill the gap with the right form of fahren: Ich ___ nach Berlin.", "answer": "fahre", "accept": ["fahre", "fahre."], "hint": "The ich form never changes its vowel.", "explain": "The answer is fahre. With ich the vowel stays as a normal a and the ending is -e, so it is fahre. Only du and er change the vowel in this verb.", "topic": "irregular verbs: ich form stays regular"}, {"id": "de3-irregular:q2", "level": "easy", "type": "mc", "q": "Which forms of an irregular verb change their vowel?", "options": ["ich and wir", "du and er, sie, es", "wir and ihr", "all six forms"], "answer": "du and er, sie, es", "hint": "It is only two of the six forms.", "explain": "The answer is du and er, sie, es. Those two forms change the vowel in the middle of the stem. The ich, wir, ihr and sie forms keep the normal vowel and only take their usual endings.", "topic": "irregular verbs: which forms change"}, {"id": "de3-irregular:q3", "level": "easy", "type": "text", "q": "Fill the gap with the right form of fahren: Er ___ nach Hamburg.", "answer": "faehrt", "accept": ["fährt.", "faehrt.", "fährt", "faehrt"], "hint": "The a gains two dots and the ending is -t.", "explain": "The answer is faehrt, written properly as fährt. The vowel a changes to ä in the er form, and the ending is -t. So Er faehrt nach Hamburg means he travels to Hamburg.", "topic": "irregular verbs: fahren er form"}, {"id": "de3-irregular:q4", "level": "easy", "type": "text", "q": "Fill the gap with the right form of essen: Wir ___ Pizza.", "answer": "essen", "accept": ["essen", "essen."], "hint": "wir takes the same ending as the plain verb.", "explain": "The answer is essen. The wir form never changes its vowel, and the ending -en makes it look exactly like the plain verb. So Wir essen Pizza means we eat pizza.", "topic": "irregular verbs: wir form stays regular"}, {"id": "de3-irregular:q5", "level": "medium", "type": "text", "q": "Fill the gap with the right form of fahren: Du ___ zu schnell.", "answer": "faehrst", "accept": ["faehrst", "fährst", "fährst.", "faehrst."], "hint": "Change the vowel first, then add the du ending.", "explain": "The answer is faehrst, written properly as fährst. The a becomes ä and the du ending -st is added to the stem. The sentence means you are driving too fast.", "topic": "irregular verbs: fahren du form"}, {"id": "de3-irregular:q6", "level": "medium", "type": "text", "q": "Fill the gap with the right form of lesen, where sie means she: Sie ___ ein Buch.", "answer": "liest", "accept": ["liest.", "liest"], "hint": "The e becomes ie. Watch out for the s that is already there.", "explain": "The answer is liest. In lesen the e changes to ie, giving the stem lies, and the ending -t is added to make liest. Because the stem already ends in s, the du form is also liest, so those two forms look identical.", "topic": "irregular verbs: lesen er and sie form"}, {"id": "de3-irregular:q7", "level": "medium", "type": "text", "q": "Fill the gap with the right form of sehen: Du ___ einen Film.", "answer": "siehst", "accept": ["siehst.", "siehst"], "hint": "The e becomes ie, then add -st.", "explain": "The answer is siehst. In sehen the e changes to ie, giving the stem sieh, and the du ending -st is added. The er form is sieht, with just a -t.", "topic": "irregular verbs: sehen du form"}, {"id": "de3-irregular:q8", "level": "medium", "type": "text", "q": "Fill the gap with the right form of sprechen: Er ___ Deutsch.", "answer": "spricht", "accept": ["spricht", "spricht."], "hint": "The e becomes i, not ie.", "explain": "The answer is spricht. In sprechen the e changes to a short i, giving the stem sprich, and the er ending -t is added. Take care not to write spriecht, because this verb takes a plain i and not ie.", "topic": "irregular verbs: sprechen er form"}, {"id": "de3-irregular:q9", "level": "stretch", "type": "text", "q": "Fill the gap with the right form of essen: Du ___ einen Apfel.", "answer": "isst", "accept": ["isst", "Isst"], "hint": "The e becomes i, and the stem already ends in a double s.", "explain": "The answer is isst. In essen the e changes to i, which gives the stem iss, and because that already ends in s you only add -t. So the du form and the er form are both isst. Be careful, because ist without the second s is a different word and means is.", "topic": "irregular verbs: essen du form"}, {"id": "de3-irregular:q10", "level": "stretch", "type": "mc", "q": "Which sentence is correct?", "options": ["Du sprechst Deutsch.", "Du sprichst Deutsch.", "Du spricht Deutsch.", "Du spreche Deutsch."], "answer": "Du sprichst Deutsch.", "hint": "Change the vowel first, then add the du ending.", "explain": "The answer is Du sprichst Deutsch. The du form of sprechen changes the e to i and then adds -st, giving sprichst. Du sprechst forgets the vowel change, Du spricht uses the er ending, and Du spreche uses the ich ending.", "topic": "irregular verbs: sprechen du form"}]}, "de4-together": {"id": "de4-together", "day": "Thursday", "subject": "German", "title": "Putting it together", "minutes": 20, "objective": "Build sentences that use a pronoun, an irregular verb and correct verb second order at the same time.", "extract": null, "teach": {"intro": ["Now the three pieces go together. Pick the person, change the verb to match that person, then check the verb is the second idea.", "Do them in that order every time. If you choose the word order first you often forget that the verb also has to change its vowel.", "Jeden Tag liest mein Bruder ein Buch means every day my brother reads a book. Jeden Tag is idea one, liest is idea two, and mein Bruder counts as er so lesen became liest.", "One new thing you need for the last few questions. When a masculine word is the thing being acted on, ein changes to einen. Der Apfel is masculine, so 'she eats an apple' is sie isst einen Apfel. Die and das words do not change: sie liest ein Buch, sie sieht eine Katze."], "example": {"problem": "Write Today my sister travels to Berlin in German, starting with Heute.", "steps": ["The subject is meine Schwester, my sister, which counts as sie meaning she.", "The verb is fahren. With sie the vowel changes, so it becomes faehrt.", "Heute is idea one, so the verb faehrt must be idea two.", "The subject meine Schwester goes third, then nach Berlin at the end."], "answer": "Heute faehrt meine Schwester nach Berlin."}, "keyfact": "Person, then verb, then order. Check the vowel changed if the verb is irregular, then check the verb is the second idea."}, "questions": [{"id": "de4-together:q1", "level": "easy", "type": "text", "q": "Fill the gap with the right form of fahren: Heute ___ ich nach London.", "answer": "fahre", "accept": ["fahre", "fahre."], "hint": "The ich form does not change its vowel, even when the time phrase comes first.", "explain": "The answer is fahre. Heute is idea one, so the verb must be idea two and ich follows it. The ich form of fahren does not change the vowel, so it is simply fahre.", "topic": "combining: fronted time phrase with ich form"}, {"id": "de4-together:q2", "level": "easy", "type": "mc", "q": "Which sentence is correct?", "options": ["Am Montag er faehrt nach Berlin.", "Am Montag faehrt er nach Berlin.", "Am Montag fahren er nach Berlin.", "Er am Montag faehrt nach Berlin."], "answer": "Am Montag faehrt er nach Berlin.", "hint": "Check two things. Is the verb second, and does it have the right form for er?", "explain": "The answer is Am Montag faehrt er nach Berlin. Am Montag is idea one, so the verb comes second and er goes third. The er form of fahren is faehrt, with the changed vowel and a -t ending. The first option puts the verb third, the third option uses a plural ending and the last one also leaves the verb third.", "topic": "combining: fronted time phrase with an irregular verb"}, {"id": "de4-together:q3", "level": "easy", "type": "text", "q": "Fill the gap with the right form of essen: Morgen ___ du Pizza.", "answer": "isst", "accept": ["isst", "Isst"], "hint": "The du form of essen changes the vowel and already ends in s.", "explain": "The answer is isst. Morgen is idea one, the verb is idea two and du follows it. The du form of essen changes the e to i, giving iss, and then only a -t is added because the stem already ends in s.", "topic": "combining: fronted time phrase with du form"}, {"id": "de4-together:q4", "level": "easy", "type": "mc", "q": "In the sentence Jeden Tag liest sie ein Buch, which word is the second idea?", "options": ["Jeden", "Tag", "liest", "sie"], "answer": "liest", "hint": "Jeden Tag is two words but only one idea.", "explain": "The answer is liest. Jeden Tag is a single idea made of two words, so it fills position one. The verb liest is therefore the second idea, even though it is the third word. Sie then follows in third place.", "topic": "word order: counting ideas not words"}, {"id": "de4-together:q5", "level": "medium", "type": "text", "q": "Rewrite this sentence so it starts with Heute: Er spricht mit dem Lehrer.", "answer": "Heute spricht er mit dem Lehrer.", "accept": ["heute spricht er mit dem lehrer", "Heute spricht er mit dem Lehrer", "Heute spricht er mit dem Lehrer.", "heute spricht er mit dem lehrer."], "hint": "Only the order changes. The verb form stays the same.", "explain": "The answer is Heute spricht er mit dem Lehrer. Heute becomes idea one, so the verb spricht stays in second place and er moves behind it. The verb form does not change, because the person is still er.", "topic": "combining: fronting with an irregular verb"}, {"id": "de4-together:q6", "level": "medium", "type": "text", "q": "Rewrite this sentence so it starts with Am Wochenende: Wir fahren nach Hamburg.", "answer": "Am Wochenende fahren wir nach Hamburg.", "accept": ["Am Wochenende fahren wir nach Hamburg", "am wochenende fahren wir nach hamburg.", "am wochenende fahren wir nach hamburg", "Am Wochenende fahren wir nach Hamburg."], "hint": "Am Wochenende is one idea, so the verb goes straight after it.", "explain": "The answer is Am Wochenende fahren wir nach Hamburg. Am Wochenende means at the weekend and counts as one idea, so the verb fahren takes position two and wir moves to third. The wir form does not change its vowel, so it stays as fahren.", "topic": "combining: fronting with the wir form"}, {"id": "de4-together:q7", "level": "medium", "type": "text", "q": "Correct this sentence: Jeden Tag du liest ein Buch.", "answer": "Jeden Tag liest du ein Buch.", "accept": ["jeden tag liest du ein buch.", "Jeden Tag liest du ein Buch", "Jeden Tag liest du ein Buch.", "jeden tag liest du ein buch"], "hint": "The verb form is already right. Only two words are in the wrong place.", "explain": "The answer is Jeden Tag liest du ein Buch. Jeden Tag is idea one, so the verb liest must be idea two and du moves behind it. Liest is the correct du form of lesen, so nothing else needed changing.", "topic": "combining: correcting verb third"}, {"id": "de4-together:q8", "level": "medium", "type": "text", "q": "Write in German: On Monday she eats an apple. Start with Am Montag.", "answer": "Am Montag isst sie einen Apfel.", "accept": ["am montag isst sie einen apfel", "Am Montag isst sie einen Apfel", "Am Montag isst sie einen Apfel.", "am montag isst sie einen apfel."], "hint": "An apple is einen Apfel. The verb form for sie is the same as the du form here.", "explain": "The answer is Am Montag isst sie einen Apfel. Am Montag is idea one, so the verb comes second and sie goes third. The sie form of essen changes the e to i and becomes isst. Apfel is a der word, and after a verb like essen it becomes einen Apfel.", "topic": "combining: fronting with the sie form of essen"}, {"id": "de4-together:q9", "level": "stretch", "type": "text", "q": "Write in German: On Friday my sister speaks German. Start with Am Freitag.", "answer": "Am Freitag spricht meine Schwester Deutsch.", "accept": ["Am Freitag spricht meine Schwester Deutsch.", "Am Freitag spricht meine Schwester Deutsch", "am freitag spricht meine schwester deutsch.", "am freitag spricht meine schwester deutsch"], "hint": "My sister counts as she, so the verb changes its vowel from e to i.", "explain": "The answer is Am Freitag spricht meine Schwester Deutsch. Schwester is a die word, so my sister is meine Schwester, and it counts as sie meaning she. That makes sprechen change to spricht, with a short i and a -t ending. Am Freitag is idea one, so spricht is idea two and meine Schwester follows.", "topic": "combining: fronting with a noun subject and sprechen"}, {"id": "de4-together:q10", "level": "stretch", "type": "text", "q": "Write in German: In the evening we watch a film. Start with Am Abend.", "answer": "Am Abend sehen wir einen Film.", "accept": ["am abend sehen wir einen film", "Am Abend sehen wir einen Film", "am abend sehen wir einen film.", "Am Abend sehen wir einen Film."], "hint": "A film is einen Film. The wir form does not change its vowel.", "explain": "The answer is Am Abend sehen wir einen Film. Am Abend means in the evening and is idea one, so the verb sehen takes position two and wir goes third. The wir form keeps the normal vowel, so it is sehen and not siehen. Film is a der word, so a film after the verb becomes einen Film.", "topic": "combining: fronting with the wir form of sehen"}]}, "de5-speaking": {"id": "de5-speaking", "day": "Friday", "subject": "German", "title": "Out loud", "minutes": 20, "objective": "Say the week's German out loud in a real exchange, then answer questions on the dialogue.", "extract": "Ein Gespraech. A dialogue for two people. Suraj reads A and Keitan reads B, then swap roles and read it again.\n\nA: Hallo. Wie heisst du?\nB: Ich heisse Keitan. Und du?\nA: Ich heisse Suraj. Wo wohnst du?\nB: Ich wohne in London. Woher kommst du?\nA: Ich komme aus England. Sprichst du Deutsch?\nB: Ja, ein bisschen. Ich lese jeden Tag ein Buch auf Deutsch.\nA: Heute fahre ich nach Manchester.\nB: Was isst du im Zug?\nA: Im Zug esse ich einen Apfel.\nB: Siehst du deine Familie dort?\nA: Ja, am Samstag sehe ich meinen Bruder.\nB: Gut. Bis spaeter.", "teach": {"intro": ["This session is for saying it, not just writing it. Read every answer out loud before you type it.", "Four sounds do most of the work. The letters ei sound like the English word eye, so heisse sounds like hyse-uh, and the letters ie sound like ee, so liest sounds like leest.", "A German w sounds like an English v, so wohne starts like vone. A German z sounds like ts, so Zug starts like tsoog, and sch sounds like sh."], "example": {"problem": "Say where you live and where you come from in one turn.", "steps": ["Start with ich, because you are talking about yourself.", "Wohnen with ich takes the ending -e, so it is ich wohne.", "Add in and the town you live in.", "Join on und, then ich komme aus and the country."], "answer": "Ich wohne in London und ich komme aus England."}, "keyfact": "ei says eye. ie says ee. w says v. z says ts. Say it out loud before you write it."}, "questions": [{"id": "de5-speaking:q1", "level": "easy", "type": "mc", "q": "In the dialogue, where does Keitan say he lives?", "options": ["London", "Berlin", "Manchester", "Hamburg"], "answer": "London", "hint": "Look at the line that begins Ich wohne.", "explain": "The answer is London. Keitan says Ich wohne in London, which means I live in London. Manchester is where A travels to later, and Berlin and Hamburg are not in this dialogue.", "topic": "dialogue: retrieval"}, {"id": "de5-speaking:q2", "level": "easy", "type": "text", "q": "Copy from the dialogue: how does A ask What is your name?", "answer": "Wie heisst du?", "accept": ["Wie heißt du", "Wie heißt du?", "wie heisst du", "wie heisst du?", "Wie heisst du?", "wie heißt du?", "wie heißt du", "Wie heisst du"], "hint": "It is the second line of A's first turn.", "explain": "The answer is Wie heisst du. Wie means how and heisst is the du form of heissen, to be called. German asks how are you called rather than what is your name.", "topic": "dialogue: greetings and questions"}, {"id": "de5-speaking:q3", "level": "easy", "type": "mc", "q": "What does Woher kommst du mean?", "options": ["Where do you live?", "Where do you come from?", "How are you?", "What is your name?"], "answer": "Where do you come from?", "hint": "Wo means where. The extra part her adds the idea of movement away from a place.", "explain": "The answer is where do you come from. Woher asks about the place someone comes from, and the reply uses aus, as in Ich komme aus England. Wo wohnst du is where do you live, which is a different question.", "topic": "dialogue: understanding a question"}, {"id": "de5-speaking:q4", "level": "easy", "type": "text", "q": "Fill the gap from the dialogue: Heute ___ ich nach Manchester.", "answer": "fahre", "accept": ["fahre", "fahre."], "hint": "It is the ich form of the verb for travelling.", "explain": "The answer is fahre. Heute is idea one, so the verb must be idea two and ich follows it. The ich form of fahren keeps the plain a, so it is fahre.", "topic": "dialogue: fronted time phrase with fahren"}, {"id": "de5-speaking:q5", "level": "medium", "type": "mc", "q": "In the line Im Zug esse ich einen Apfel, why does ich come after the verb?", "options": ["Because Im Zug is idea one, so the verb has to be idea two", "Because ich is not important in this sentence", "Because the sentence is a question", "Because esse is an irregular verb"], "answer": "Because Im Zug is idea one, so the verb has to be idea two", "hint": "Count which idea comes first in that sentence.", "explain": "The answer is that Im Zug is idea one, so the verb has to be idea two. Once something other than the subject fills position one, the subject slides in behind the verb. Im Zug esse ich einen Apfel means on the train I eat an apple.", "topic": "word order: fronted phrase in a dialogue"}, {"id": "de5-speaking:q6", "level": "medium", "type": "text", "q": "Answer this question in German: Wo wohnst du? Say that you live in Birmingham.", "answer": "Ich wohne in Birmingham.", "accept": ["Ich wohne in Birmingham", "ich wohne in birmingham", "ich wohne in birmingham.", "Ich wohne in Birmingham."], "hint": "Answer with ich, not du. The ending has to change.", "explain": "The answer is Ich wohne in Birmingham. The question uses du wohnst, but your answer is about yourself, so the pronoun becomes ich and the ending becomes -e. A common mistake is to copy wohnst straight back.", "topic": "dialogue: answering with wohnen"}, {"id": "de5-speaking:q7", "level": "medium", "type": "text", "q": "Answer this question the way B does in the dialogue: Sprichst du Deutsch? Say yes, a little.", "answer": "Ja, ein bisschen.", "accept": ["Ja, ein bisschen.", "ja, ein bisschen.", "Ja, ein bisschen", "ja, ein bisschen", "ja ein bisschen.", "Ja ein bisschen", "ja ein bisschen", "Ja ein bisschen."], "hint": "It is two words after ja.", "explain": "The answer is Ja, ein bisschen. Ein bisschen means a little and is a useful reply when you do not want a full sentence. B then adds more detail in the next sentence.", "topic": "dialogue: short answers"}, {"id": "de5-speaking:q8", "level": "medium", "type": "text", "q": "Find the du form of sehen in the dialogue and write it.", "answer": "siehst", "accept": ["siehst.", "siehst"], "hint": "Look at the line where B asks about the family.", "explain": "The answer is siehst. B asks Siehst du deine Familie dort, meaning do you see your family there. In a question the verb moves to the front, but the form is still the du form, with the e changed to ie and the ending -st.", "topic": "dialogue: irregular verb spotting"}, {"id": "de5-speaking:q9", "level": "stretch", "type": "text", "q": "Rewrite this line so that it starts with Am Samstag: Ich sehe meinen Bruder.", "answer": "Am Samstag sehe ich meinen Bruder.", "accept": ["Am Samstag sehe ich meinen Bruder.", "Am Samstag sehe ich meinen Bruder", "am samstag sehe ich meinen bruder.", "am samstag sehe ich meinen bruder"], "hint": "The verb form does not change. Only the order does.", "explain": "The answer is Am Samstag sehe ich meinen Bruder. Am Samstag is idea one, so the verb sehe stays in second place and ich moves behind it. The ich form of sehen keeps the plain e, so it stays as sehe. Bruder is a der word, so my brother after the verb becomes meinen Bruder.", "topic": "dialogue: fronting a time phrase"}, {"id": "de5-speaking:q10", "level": "stretch", "type": "text", "q": "Write in German: On Monday my brother travels to Berlin. Start with Am Montag.", "answer": "Am Montag faehrt mein Bruder nach Berlin.", "accept": ["Am Montag fährt mein Bruder nach Berlin.", "Am Montag faehrt mein Bruder nach Berlin
