<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="Study OS">
<title>Study OS - Week 1</title>
<style>
:root{
  --bg:#0f1215; --panel:#171b20; --panel2:#1e242b; --line:#2a323b;
  --ink:#e8edf2; --dim:#93a1b0; --faint:#5e6b78;
  --accent:#4a9eff; --good:#3ecf8e; --bad:#ff6b6b; --warn:#f0b429;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:17px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding:0 0 env(safe-area-inset-bottom);
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:780px;margin:0 auto;padding:16px 16px 80px}
h1,h2,h3{line-height:1.25;margin:0}
h1{font-size:23px;font-weight:650;letter-spacing:-.2px}
h2{font-size:19px;font-weight:620}
h3{font-size:16px;font-weight:600}
.muted{color:var(--dim)}
.faint{color:var(--faint);font-size:14px}
.small{font-size:14px}

header{
  position:sticky;top:0;z-index:20;background:rgba(15,18,21,.94);
  backdrop-filter:saturate(160%) blur(12px);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
}
.hd{max-width:780px;margin:0 auto;display:flex;align-items:center;gap:12px}
.hd .t{flex:1;min-width:0}
.hd .t div:first-child{font-weight:650;font-size:17px}
.bar{height:5px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-top:9px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .35s ease}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
.card.tight{padding:13px 15px}

button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.btn{
  display:block;width:100%;min-height:52px;padding:14px 16px;
  background:var(--accent);color:#06121f;border-radius:12px;
  font-weight:650;font-size:17px;text-align:center;margin-top:12px;
}
.btn:disabled{opacity:.35}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:550}
.btn.sm{min-height:44px;padding:10px 14px;font-size:15px;width:auto;display:inline-block;margin:6px 8px 0 0}

.daylist{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.day{
  display:flex;align-items:center;gap:14px;background:var(--panel);
  border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;width:100%;text-align:left;
}
.day .n{
  width:44px;height:44px;flex:0 0 44px;border-radius:11px;background:var(--panel2);
  display:flex;align-items:center;justify-content:center;font-weight:650;font-size:15px;color:var(--dim)
}
.day.done .n{background:rgba(62,207,142,.14);color:var(--good)}
.day .g{flex:1;min-width:0}
.day .g b{font-weight:620}
.chev{color:var(--faint);font-size:20px}

.blk{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
.blk .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.pill{
  display:inline-block;padding:4px 10px;border-radius:99px;font-size:12.5px;font-weight:620;
  background:var(--panel2);color:var(--dim);white-space:nowrap
}
.pill.good{background:rgba(62,207,142,.14);color:var(--good)}
.pill.bad{background:rgba(255,107,107,.14);color:var(--bad)}
.pill.warn{background:rgba(240,180,41,.14);color:var(--warn)}
.pill.acc{background:rgba(74,158,255,.14);color:var(--accent)}

.extract{
  background:var(--panel2);border-left:3px solid var(--accent);border-radius:8px;
  padding:14px 15px;margin:14px 0;font-size:16px;white-space:pre-wrap;line-height:1.6
}
.extract h4{margin:0 0 8px;font-size:13px;letter-spacing:.6px;text-transform:uppercase;color:var(--dim);font-weight:650}
details.extract{white-space:normal}
details.extract>summary{
  list-style:none;cursor:pointer;font-size:13px;letter-spacing:.6px;text-transform:uppercase;
  color:var(--dim);font-weight:650;min-height:26px;display:flex;align-items:center;flex-wrap:wrap;gap:2px
}
details.extract>summary::-webkit-details-marker{display:none}
details.extract>summary::after{content:'  show';margin-left:auto;color:var(--accent);text-transform:none;letter-spacing:0;font-size:14px}
details.extract[open]>summary::after{content:'  hide'}
details.extract>div{white-space:pre-wrap}

.q{font-size:18.5px;line-height:1.5;margin:14px 0 4px;white-space:pre-wrap}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.opt{
  display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;
  min-height:52px;padding:13px 15px;background:var(--panel2);
  border:1.5px solid transparent;border-radius:12px;line-height:1.45
}
.opt .k{
  width:26px;height:26px;flex:0 0 26px;border-radius:7px;background:rgba(255,255,255,.06);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:650;color:var(--dim);margin-top:1px
}
.opt.sel{border-color:var(--accent);background:rgba(74,158,255,.1)}
.opt.sel .k{background:var(--accent);color:#06121f}

input[type=text]{
  width:100%;min-height:54px;padding:14px 15px;font-size:17px;
  background:var(--panel2);border:1.5px solid var(--line);border-radius:12px;color:var(--ink);
  margin-top:14px;-webkit-appearance:none
}
input[type=text]:focus{outline:0;border-color:var(--accent)}
textarea{
  width:100%;min-height:220px;padding:14px 15px;font-size:17px;line-height:1.6;
  background:var(--panel2);border:1.5px solid var(--line);border-radius:12px;color:var(--ink);
  margin-top:12px;resize:vertical;-webkit-appearance:none;font-family:inherit
}
textarea:focus{outline:0;border-color:var(--accent)}
select{
  width:100%;min-height:50px;padding:12px 14px;font-size:16px;background:var(--panel2);
  border:1.5px solid var(--line);border-radius:12px;color:var(--ink);margin-top:10px;-webkit-appearance:none
}

.qmeta{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13.5px;color:var(--faint)}
.dots{display:flex;gap:6px}
.dots i{width:8px;height:8px;border-radius:99px;background:var(--panel2);display:block}
.dots i.on{background:var(--accent)}

.band{
  text-align:center;padding:26px 18px
}
.band .big{font-size:46px;font-weight:700;letter-spacing:-1.5px;line-height:1}
.band .lbl{color:var(--dim);margin-top:8px;font-size:15px}

.rev{border-top:1px solid var(--line);padding:15px 0}
.rev:first-of-type{border-top:0}
.rev .qt{font-size:16px;margin-bottom:9px;white-space:pre-wrap}
.rev .ans{font-size:15px;margin:5px 0}
.rev .ans b{font-weight:620}
.ok{color:var(--good)}.no{color:var(--bad)}
.exp{background:var(--panel2);border-radius:9px;padding:12px 13px;margin-top:9px;font-size:15px;line-height:1.55;color:var(--dim);white-space:pre-wrap}

.topics{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.tp{padding:5px 11px;border-radius:99px;font-size:13px;background:var(--panel2);color:var(--dim)}
.tp.ok{background:rgba(62,207,142,.12);color:var(--good)}
.tp.no{background:rgba(255,107,107,.12);color:var(--bad)}

pre.sum{
  background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px;
  font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;
  max-height:340px;overflow:auto;color:var(--dim);margin-top:12px
}
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:15px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}
th{color:var(--dim);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.5px}
td.r,th.r{text-align:right}
ul{padding-left:20px;margin:10px 0}
li{margin:6px 0}
.hr{height:1px;background:var(--line);margin:18px 0;border:0}
.nb{background:rgba(240,180,41,.08);border:1px solid rgba(240,180,41,.25);border-radius:11px;padding:13px 15px;margin:12px 0;font-size:15px;line-height:1.55}
.nb b{color:var(--warn)}
</style>
</head>
<body>
<header><div class="hd">
  <button id="back" class="pill" style="display:none">Back</button>
  <div class="t"><div id="htitle">Week 1: Placement</div><div class="bar"><i id="hbar" style="width:0%"></i></div></div>
</div></header>
<div class="wrap" id="app"></div>

<script>
const PAYLOAD = {"data": {"maths": {"subject": "Maths", "bands": [{"level": 1, "label": "Year 5", "descriptor": "Place value, adding and subtracting, times tables, fractions of amounts and reading scales.", "questions": [{"id": "ma1", "type": "mc", "q": "Look at this number: 546,182. What is the value of the digit 4?", "options": ["4", "400", "4,000", "40,000"], "answer": "40,000", "topic": "place value: value of a digit", "explain": "Read the columns from the right. 2 is units, 8 is tens, 1 is hundreds, 6 is thousands, 4 is ten thousands, 5 is hundred thousands. The 4 sits in the ten thousands column. So its value is 4 x 10,000 = 40,000."}, {"id": "ma2", "type": "text", "q": "Work out 4,682 + 3,759.", "answer": "8441", "accept": ["8441", "8,441"], "topic": "addition: column addition", "explain": "Line the numbers up in columns. Units: 2 + 9 = 11, so write 1 and carry 1. Tens: 8 + 5 + 1 carried = 14, so write 4 and carry 1. Hundreds: 6 + 7 + 1 carried = 14, so write 4 and carry 1. Thousands: 4 + 3 + 1 carried = 8. The answer is 8,441."}, {"id": "ma3", "type": "text", "q": "Work out 9 x 12.", "answer": "108", "accept": ["108"], "topic": "times tables: up to 12 x 12", "explain": "9 x 12 means 12 lots of 9. Split it up: 9 x 10 = 90 and 9 x 2 = 18. Now add them: 90 + 18 = 108."}, {"id": "ma4", "type": "text", "q": "Work out 3/4 of 48.", "answer": "36", "accept": ["36"], "topic": "fractions: fraction of an amount", "explain": "The bottom number tells you how many equal parts. Divide by 4 first: 48 divided by 4 = 12. That is 1/4. The top number tells you how many parts you want. You want 3 parts, so 3 x 12 = 36."}, {"id": "ma5", "type": "mc", "q": "A measuring jug is marked from 0 ml to 1000 ml. There is a mark every 100 ml. The water reaches 3 marks above the 500 ml line. How much water is in the jug?", "options": ["530 ml", "700 ml", "800 ml", "850 ml"], "answer": "800 ml", "topic": "measures: reading scales", "explain": "Each mark is worth 100 ml. Going up 3 marks means going up 3 x 100 = 300 ml. Start at 500 ml and add 300 ml. 500 + 300 = 800 ml."}]}, {"level": 2, "label": "Year 6", "descriptor": "Long multiplication, short division, decimals, percentages of amounts and order of operations.", "questions": [{"id": "ma6", "type": "text", "q": "Work out 34 x 27.", "answer": "918", "accept": ["918"], "topic": "multiplication: long multiplication", "explain": "Split 27 into 20 and 7. First do 34 x 20 = 680. Then do 34 x 7 = 238. Now add the two parts: 680 + 238 = 918."}, {"id": "ma7", "type": "text", "q": "Work out 4,368 divided by 7.", "answer": "624", "accept": ["624"], "topic": "division: short division", "explain": "Work from the left. 4 divided by 7 is 0, carry the 4. 43 divided by 7 is 6 remainder 1, so write 6 and carry the 1. 16 divided by 7 is 2 remainder 2, so write 2 and carry the 2. 28 divided by 7 is 4 exactly. The answer is 624. Check: 624 x 7 = 4,368."}, {"id": "ma8", "type": "mc", "q": "Which of these decimal numbers is the largest?", "options": ["0.7", "0.65", "0.709", "0.68"], "answer": "0.709", "topic": "decimals: comparing and ordering", "explain": "Give every number the same number of decimal places by adding zeros: 0.700, 0.650, 0.709, 0.680. Now compare them like whole numbers: 700, 650, 709, 680. The biggest is 709, so 0.709 is the largest. A common mistake is thinking 0.7 is bigger because it looks shorter, but 0.7 is the same as 0.700."}, {"id": "ma9", "type": "text", "q": "Work out 15% of 60.", "answer": "9", "accept": ["9", "9.0"], "topic": "percentages: percentage of an amount", "explain": "Find 10% first by dividing by 10: 60 divided by 10 = 6. Then find 5%, which is half of 10%: half of 6 = 3. Now add them: 6 + 3 = 9."}, {"id": "ma10", "type": "mc", "q": "Work out 4 + 3 x (10 - 6).", "options": ["16", "28", "22", "13"], "answer": "16", "topic": "order of operations: BIDMAS", "explain": "Do the brackets first: 10 - 6 = 4. The sum is now 4 + 3 x 4. Multiplication comes before addition, so do 3 x 4 = 12. Finally add: 4 + 12 = 16. If you worked left to right you would get 28, which is wrong."}]}, {"level": 3, "label": "Year 7 early", "descriptor": "Negative numbers, fractions with the same denominator, ratio and angles on a straight line.", "questions": [{"id": "ma11", "type": "text", "q": "Work out -7 - 6.", "answer": "-13", "accept": ["-13", "- 13", "minus 13", "negative 13"], "topic": "negative numbers: subtraction", "explain": "Start at -7 on a number line. Subtracting 6 means moving 6 places further to the left. From -7 you move to -8, -9, -10, -11, -12, -13. The answer is -13. You are going further below zero, so the answer gets more negative."}, {"id": "ma12", "type": "mc", "q": "Work out -4 x -7.", "options": ["-28", "28", "-11", "11"], "answer": "28", "topic": "negative numbers: multiplication", "explain": "First multiply the numbers as if they were positive: 4 x 7 = 28. Now look at the signs. Two negative signs multiplied together give a positive answer. So the answer is +28. The rule is: same signs give a positive, different signs give a negative."}, {"id": "ma13", "type": "text", "q": "Work out 5/9 + 2/9. Give your answer as a fraction.", "answer": "7/9", "accept": ["7/9", "7 / 9", "7over9", "7 over 9"], "topic": "fractions: adding with the same denominator", "explain": "The bottom numbers are already the same, so you only add the top numbers. 5 + 2 = 7. The bottom number stays as 9. The answer is 7/9. Do not add the bottom numbers together."}, {"id": "ma14", "type": "text", "q": "Kai and Mia share 45 pounds in the ratio 2:3. Kai gets the smaller share and Mia gets the bigger share. How many pounds does Mia get?", "answer": "27", "accept": ["27", "27 pounds", "£27", "27.00", "£27.00"], "topic": "ratio: sharing an amount", "explain": "Add the ratio numbers to find the total number of parts: 2 + 3 = 5 parts. Divide the money by the number of parts: 45 divided by 5 = 9 pounds for one part. Mia has 3 parts, so she gets 3 x 9 = 27 pounds. Check: Kai gets 2 x 9 = 18 pounds, and 18 + 27 = 45."}, {"id": "ma15", "type": "mc", "q": "Two angles sit next to each other on a straight line. One angle is 115 degrees. What is the size of the other angle?", "options": ["65 degrees", "75 degrees", "85 degrees", "245 degrees"], "answer": "65 degrees", "topic": "angles: angles on a straight line", "explain": "Angles on a straight line always add up to 180 degrees. So subtract the angle you know from 180. 180 - 115 = 65. The other angle is 65 degrees. Check: 115 + 65 = 180."}]}, {"level": 4, "label": "Year 7 late", "descriptor": "Fractions with unlike denominators, multiplying fractions, percentage decrease, simplifying expressions and area of a triangle.", "questions": [{"id": "ma16", "type": "text", "q": "Work out 2/3 + 1/4. Give your answer as a fraction.", "answer": "11/12", "accept": ["11/12", "11 / 12", "11over12", "11 over 12"], "topic": "fractions: adding with unlike denominators", "explain": "The bottom numbers are different, so make them the same first. The lowest number that both 3 and 4 divide into is 12. Change 2/3 into twelfths: multiply top and bottom by 4 to get 8/12. Change 1/4 into twelfths: multiply top and bottom by 3 to get 3/12. Now add the top numbers: 8 + 3 = 11. The answer is 11/12."}, {"id": "ma17", "type": "text", "q": "Work out 2/5 x 3/7. Give your answer as a fraction.", "answer": "6/35", "accept": ["6/35", "6 / 35", "6over35", "6 over 35"], "topic": "fractions: multiplying", "explain": "To multiply fractions you multiply straight across. Top numbers: 2 x 3 = 6. Bottom numbers: 5 x 7 = 35. The answer is 6/35. It will not simplify because 6 and 35 have no common factor. You do not need a common denominator when multiplying."}, {"id": "ma18", "type": "text", "q": "A coat costs 80 pounds. In a sale the price is reduced by 15%. What is the new price in pounds?", "answer": "68", "accept": ["68", "68 pounds", "£68", "68.00", "£68.00"], "topic": "percentages: percentage decrease", "explain": "First find 15% of 80. 10% of 80 = 8. 5% of 80 = 4, because 5% is half of 10%. So 15% = 8 + 4 = 12 pounds off. Now subtract that from the original price: 80 - 12 = 68 pounds."}, {"id": "ma19", "type": "mc", "q": "Simplify 5a + 3b - 2a + 4b.", "options": ["3a + 7b", "7a + 7b", "3a - 7b", "10ab"], "answer": "3a + 7b", "topic": "algebra: simplifying expressions", "explain": "Collect the like terms. The a terms are 5a and -2a: 5a - 2a = 3a. The b terms are 3b and 4b: 3b + 4b = 7b. You cannot add a terms to b terms because they are different letters. The answer is 3a + 7b."}, {"id": "ma20", "type": "mc", "q": "A triangle has a base of 10 cm. Its height is 6 cm. What is the area of the triangle?", "options": ["30 cm^2", "60 cm^2", "16 cm^2", "32 cm^2"], "answer": "30 cm^2", "topic": "area: triangles", "explain": "The area of a triangle is base x height divided by 2. First multiply: 10 x 6 = 60. Then halve it: 60 divided by 2 = 30. The area is 30 cm^2. The most common mistake is forgetting to halve, which gives 60."}]}, {"level": 5, "label": "Year 8", "descriptor": "Equations with unknowns on both sides, expanding and factorising, Pythagoras and the area of a circle.", "questions": [{"id": "ma21", "type": "text", "q": "Solve 5x - 3 = 2x + 12. What is the value of x?", "answer": "5", "accept": ["5", "x=5", "x = 5"], "topic": "algebra: equations with unknowns on both sides", "explain": "Get all the x terms on one side. Subtract 2x from both sides: 5x - 2x - 3 = 12, which gives 3x - 3 = 12. Now add 3 to both sides: 3x = 15. Finally divide both sides by 3: x = 5. Check: 5 x 5 - 3 = 22 and 2 x 5 + 12 = 22. Both sides match."}, {"id": "ma22", "type": "text", "q": "Expand and simplify (x + 3)(x + 5). Write squared as ^2, for example x^2.", "answer": "x^2 + 8x + 15", "accept": ["x^2+8x+15", "x^2 + 8x + 15", "x2+8x+15", "x^2+8x+15.", "15+8x+x^2", "x**2+8x+15", "x^2 +8x +15"], "topic": "algebra: expanding double brackets", "explain": "Multiply every term in the first bracket by every term in the second bracket. x times x = x^2. x times 5 = 5x. 3 times x = 3x. 3 times 5 = 15. That gives x^2 + 5x + 3x + 15. Now collect the like terms: 5x + 3x = 8x. The answer is x^2 + 8x + 15."}, {"id": "ma23", "type": "mc", "q": "Factorise 6x + 9 fully.", "options": ["3(2x + 3)", "3(2x + 9)", "6(x + 3)", "3x(2 + 3)"], "answer": "3(2x + 3)", "topic": "algebra: factorising", "explain": "Find the highest number that divides into both 6 and 9. That number is 3. Take the 3 outside the bracket. Now ask what is left: 6x divided by 3 = 2x, and 9 divided by 3 = 3. So the answer is 3(2x + 3). Check by expanding: 3 x 2x = 6x and 3 x 3 = 9."}, {"id": "ma24", "type": "text", "q": "A right angled triangle has two short sides of 5 cm and 12 cm. What is the length of the longest side in cm?", "answer": "13", "accept": ["13", "13 cm", "13cm"], "topic": "Pythagoras: finding the hypotenuse", "explain": "Use Pythagoras. Square both short sides: 5^2 = 25 and 12^2 = 144. Add them: 25 + 144 = 169. The longest side is the square root of 169. 13 x 13 = 169, so the longest side is 13 cm."}, {"id": "ma25", "type": "text", "q": "A circle has a radius of 5 cm. Work out the area of the circle. Use pi = 3.14.", "answer": "78.5", "accept": ["78.5", "78.5 cm^2", "78.5cm^2", "78.50", "78.5 cm2"], "topic": "circles: area", "explain": "The area of a circle is pi x radius^2. First square the radius: 5 x 5 = 25. Then multiply by pi: 3.14 x 25 = 78.5. The area is 78.5 cm^2. Remember to square the radius before multiplying, not after."}]}, {"level": 6, "label": "Year 8 stretch", "descriptor": "Negative indices, simultaneous equations, compound interest, forming equations and reasoning with a counter example.", "questions": [{"id": "ma26", "type": "mc", "q": "Work out the value of 2^-3.", "options": ["1/8", "-8", "-6", "8"], "answer": "1/8", "topic": "indices: negative indices", "explain": "A negative power means one over the positive power. So 2^-3 is the same as 1 divided by 2^3. Work out 2^3 = 2 x 2 x 2 = 8. So the answer is 1/8, which is 0.125. A negative power does not make the answer negative."}, {"id": "ma27", "type": "text", "q": "Solve these two equations together: 3x + y = 11 and x + y = 5. Write your answer in the form x = ?, y = ?", "answer": "x = 3, y = 2", "accept": ["x=3,y=2", "x = 3, y = 2", "x=3 y=2", "x = 3 y = 2", "x=3, y=2", "3,2", "3, 2", "x=3,y=2.", "3 and 2"], "topic": "simultaneous equations", "explain": "Both equations have one y, so subtract the second equation from the first. 3x - x = 2x. y - y = 0. 11 - 5 = 6. That leaves 2x = 6, so x = 3. Now put x = 3 back into x + y = 5: 3 + y = 5, so y = 2. Check in the first equation: 3 x 3 + 2 = 11. Correct."}, {"id": "ma28", "type": "text", "q": "Ade puts 2,000 pounds into a savings account. The account pays 5% compound interest each year. How much money is in the account after 3 years? Give your answer in pounds.", "answer": "2315.25", "accept": ["2315.25", "2,315.25", "£2315.25", "£2,315.25", "2315.25 pounds"], "topic": "percentages: compound interest", "explain": "Compound interest means each year the interest is worked out on the new total. Adding 5% means multiplying by 1.05 each year. Year 1: 2000 x 1.05 = 2100. Year 2: 2100 x 1.05 = 2205. Year 3: 2205 x 1.05 = 2315.25. So there is 2,315.25 pounds after 3 years. You can also do 2000 x 1.05^3 in one step."}, {"id": "ma29", "type": "text", "q": "The perimeter of a rectangle is 46 cm. The length is 5 cm more than the width. Work out the area of the rectangle in cm^2.", "answer": "126", "accept": ["126", "126 cm^2", "126cm^2", "126 cm2"], "topic": "algebra: forming and solving equations", "explain": "Call the width w. Then the length is w + 5. A rectangle has two widths and two lengths, so the perimeter is w + w + (w + 5) + (w + 5), which simplifies to 4w + 10. Set that equal to 46: 4w + 10 = 46. Subtract 10 from both sides: 4w = 36. Divide by 4: w = 9. So the width is 9 cm and the length is 9 + 5 = 14 cm. Check the perimeter: 9 + 9 + 14 + 14 = 46. Now find the area: 9 x 14 = 126 cm^2."}, {"id": "ma30", "type": "mc", "q": "Rosie says: 'When you square a number, the answer is always bigger than the number you started with.' Which number proves that Rosie is wrong?", "options": ["1/2", "3", "4", "10"], "answer": "1/2", "topic": "reasoning: finding a counter example", "explain": "To prove a statement wrong you only need one example that breaks it. Square each option. 3^2 = 9, which is bigger than 3. 4^2 = 16, which is bigger than 4. 10^2 = 100, which is bigger than 10. But 1/2 squared is 1/2 x 1/2 = 1/4, and 1/4 is smaller than 1/2. So 1/2 proves Rosie wrong. Squaring a number between 0 and 1 always makes it smaller."}]}]}, "english": {"subject": "English", "bands": [{"level": 1, "label": "Year 5 to 6", "descriptor": "Basic accuracy: capital letters, sentence endings, apostrophes for contraction, common homophones and plurals.", "extract": null, "questions": [{"id": "en1", "type": "mc", "q": "Which sentence is punctuated correctly?", "options": ["where are you going after school", "Where are you going after school.", "where are you going after school?", "Where are you going after school?"], "answer": "Where are you going after school?", "topic": "capital letters and question marks", "explain": "The answer is 'Where are you going after school?'. Every sentence must start with a capital letter, so 'where' has to be 'Where'. This sentence is asking something, so it must end with a question mark, not a full stop and not nothing at all. The other three options each get one of those two rules wrong."}, {"id": "en2", "type": "text", "q": "Write the plural of the word 'city'.", "answer": "cities", "accept": ["cities"], "topic": "plural rules: words ending in y", "explain": "The answer is 'cities'. When a word ends in a consonant followed by 'y', you take off the 'y' and add 'ies'. So city becomes cities, party becomes parties, and baby becomes babies. Just adding an 's' to give 'citys' is wrong. Note that this rule only applies when there is a consonant before the y. If there is a vowel before the y, like in 'day', you simply add s to get 'days'."}, {"id": "en3", "type": "text", "q": "Write these two words as one word with an apostrophe: do not", "answer": "don't", "accept": ["don't", "don’t"], "topic": "apostrophes: contraction", "explain": "The answer is don't. When you squash two words together you take out some letters and put an apostrophe exactly where the missing letters were. Here the 'o' of 'not' is removed, so the apostrophe goes between the n and the t. Writing 'dont' with no apostrophe is wrong, and putting the apostrophe anywhere else, like 'do'nt', is also wrong."}, {"id": "en4", "type": "mc", "q": "Choose the correct word to fill the gap: '___ going to miss the bus if they do not run.'", "options": ["Their", "There", "They're", "Theyre"], "answer": "They're", "topic": "homophones: their/there/they're", "explain": "The answer is They're. It is short for 'they are', and 'They are going to miss the bus' makes sense. 'Their' means belonging to them, as in 'their bus'. 'There' means a place, as in 'over there'. 'Theyre' is not a word at all because the apostrophe is missing. The quick test is to say 'they are' in the gap and see if the sentence still works."}, {"id": "en5", "type": "mc", "q": "Which sentence is correct?", "options": ["Your going to love this film, its brilliant.", "You're going to love this film, its brilliant.", "Your going to love this film, it's brilliant.", "You're going to love this film, it's brilliant."], "answer": "You're going to love this film, it's brilliant.", "topic": "homophones: your/you're and its/it's", "explain": "The answer is 'You're going to love this film, it's brilliant.' You're is short for 'you are', and 'you are going to love this film' makes sense. 'Your' means belonging to you, as in 'your coat'. It's is short for 'it is', and 'it is brilliant' makes sense. 'Its' means belonging to it, as in 'the dog wagged its tail'. The trick is to try saying the full two words out loud. If 'you are' and 'it is' fit, you need the apostrophe."}]}, {"level": 2, "label": "Year 6 to 7", "descriptor": "Sentence control: what counts as a complete sentence, run-ons and comma splices, possessive apostrophes and speech punctuation.", "extract": null, "questions": [{"id": "en6", "type": "mc", "q": "Which one of these is a complete sentence?", "options": ["Running down the hill towards the river.", "The old dog barked.", "Because the engine had stopped.", "A very cold and windy morning in December."], "answer": "The old dog barked.", "topic": "complete sentences", "explain": "The answer is 'The old dog barked.' A complete sentence needs someone or something doing something (a subject and a verb) and it must make sense on its own. Here the subject is 'the old dog' and the verb is 'barked'. 'Running down the hill towards the river' has no subject, so we do not know who is running. 'A very cold and windy morning in December' has no verb, so nothing happens. 'Because the engine had stopped' has a subject and a verb but it does not make sense on its own, because 'because' leaves you waiting for the rest."}, {"id": "en7", "type": "text", "q": "How many separate sentences should this be? Write a number. 'The rain stopped we walked home my shoes were soaked'", "answer": "3", "accept": ["3", "three"], "topic": "run-on sentences", "explain": "The answer is 3. It should be written as: The rain stopped. We walked home. My shoes were soaked. Each of those three parts has its own subject and verb and makes sense on its own, so each one needs its own full stop. When several sentences are jammed together with no punctuation it is called a run-on sentence, and it makes writing very hard to follow."}, {"id": "en8", "type": "mc", "q": "Which sentence contains a comma splice?", "options": ["It was late, so we went home.", "It was late. We went home.", "It was late, we went home.", "Because it was late, we went home."], "answer": "It was late, we went home.", "topic": "comma splice", "explain": "The answer is 'It was late, we went home.' A comma splice is when a comma is used to glue together two parts that could each be a sentence on their own. 'It was late' is a sentence and 'we went home' is a sentence, so a comma is too weak to join them. You need a full stop, a semicolon, or a joining word like 'so' or 'and'. That is why the other three are all fine: one uses 'so', one uses a full stop, and one starts with 'Because', which makes the first part unable to stand alone."}, {"id": "en9", "type": "text", "q": "Rewrite this using an apostrophe: the coats belonging to the girls", "answer": "the girls' coats", "accept": ["the girls' coats", "girls' coats", "the girls’ coats", "girls’ coats"], "topic": "apostrophes: plural possession", "explain": "The answer is 'the girls' coats'. There is more than one girl, so the plural is 'girls', which already ends in s. When a plural already ends in s, you add the apostrophe after the s and add nothing else. Writing 'the girl's coats' would mean only one girl, and writing 'the girls's coats' is wrong. If the plural does not end in s, like 'children', you add an apostrophe and an s, giving 'the children's coats'."}, {"id": "en10", "type": "mc", "q": "Which line is punctuated correctly?", "options": ["\"Get in the van\" shouted Dad.", "\"Get in the van,\" shouted Dad.", "\"Get in the van,\" Shouted Dad.", "\"Get in the van, shouted Dad.\""], "answer": "\"Get in the van,\" shouted Dad.", "topic": "direct speech punctuation", "explain": "The answer is \"Get in the van,\" shouted Dad. There are three rules working together. First, the exact words spoken go inside the speech marks. Second, you need a punctuation mark before you close the speech marks, and here it is a comma because the sentence carries on afterwards. Third, the word after the speech marks is not a new sentence, so 'shouted' keeps a small letter. The last option is wrong because 'shouted Dad' has been trapped inside the speech marks, and Dad did not say those words."}]}, {"level": 3, "label": "Year 7", "descriptor": "Grammar knowledge and basic reading: word classes, sentence types, subordinating conjunctions, paragraphing and finding information in a text.", "extract": "The ship was called the Endurance, and the name turned out to be a warning. In January 1915, Ernest Shackleton and his crew of twenty-seven men were sailing south towards Antarctica when the sea began to freeze around them. Within days the ship was stuck fast. The men waited for ten months while the ice squeezed the wooden hull like a fist. In October the timbers finally cracked. Shackleton ordered everyone off the ship, and they dragged three small lifeboats behind them onto the ice. They camped on a floating sheet of ice for five months, eating seal meat and melting snow for water. When the ice broke apart, they rowed for seven days to a bare rock called Elephant Island. Shackleton then took five men and sailed eight hundred miles across the roughest ocean on earth to fetch help. Every single member of the crew survived.", "questions": [{"id": "en11", "type": "mc", "q": "Which word in this sentence is an adverb? 'The ship slowly sank beneath the ice.'", "options": ["ship", "slowly", "sank", "beneath"], "answer": "slowly", "topic": "word classes: adverb", "explain": "The answer is 'slowly'. An adverb tells you how, when or where something is done, and 'slowly' tells you how the ship sank. 'Ship' is a noun because it is a thing. 'Sank' is a verb because it is the action. 'Beneath' is a preposition because it tells you the position of one thing compared to another. A useful clue is that many adverbs end in 'ly', but not all of them do, so always check whether the word is describing the action."}, {"id": "en12", "type": "mc", "q": "Which of these is a compound sentence?", "options": ["The ice cracked loudly.", "The ice cracked loudly, and the crew ran for the boats.", "When the ice cracked, the crew ran for the boats.", "The loud cracking of the ice."], "answer": "The ice cracked loudly, and the crew ran for the boats.", "topic": "sentence types: simple, compound, complex", "explain": "The answer is 'The ice cracked loudly, and the crew ran for the boats.' A compound sentence is two complete sentences joined by a word like and, but, or, so. Here both halves could stand alone, and they are joined by 'and'. 'The ice cracked loudly' on its own is a simple sentence because it has just one idea. 'When the ice cracked, the crew ran for the boats' is a complex sentence, because the first part starts with 'When' and cannot stand alone. 'The loud cracking of the ice' is not a sentence at all because there is no verb doing anything."}, {"id": "en13", "type": "text", "q": "Write down the subordinating conjunction in this sentence: 'The crew stayed on the ice because the ship had sunk.'", "answer": "because", "accept": ["because"], "topic": "subordinating conjunctions", "explain": "The answer is 'because'. A subordinating conjunction starts a part of the sentence that cannot stand on its own. 'The ship had sunk' would be fine by itself, but once you put 'because' in front of it you are left waiting for more. Other common subordinating conjunctions are although, while, if, when, since, until and unless. They are different from and, but and so, which join two parts that could each stand alone."}, {"id": "en14", "type": "mc", "q": "You are writing a story. Which is the best reason to start a new paragraph?", "options": ["The paragraph is getting long and looks untidy on the page.", "The time, the place, the topic or the person speaking has changed.", "You have used the same word twice.", "You want the reader to read faster."], "answer": "The time, the place, the topic or the person speaking has changed.", "topic": "paragraphing", "explain": "The answer is 'The time, the place, the topic or the person speaking has changed.' Some people remember this as TiPToP: Time, Place, Topic, Person. A new paragraph is a signal to the reader that something has moved on. Length is not the real rule, although a paragraph that runs for a whole page usually means you missed a change. Repeating a word is a vocabulary issue, not a paragraph issue."}, {"id": "en15", "type": "text", "q": "Read the extract. How many men did Shackleton take with him when he sailed away to fetch help? Write a number or a word.", "answer": "five", "accept": ["five", "5", "five men", "5 men"], "topic": "reading: retrieval", "explain": "The answer is five. The extract says: 'Shackleton then took five men and sailed eight hundred miles across the roughest ocean on earth to fetch help.' Retrieval questions like this are the easiest marks in any reading paper because the answer is sitting in the text. The skill is spotting which part of the text the question points at. The number twenty-seven is also in the extract, but that is the size of the whole crew, not the group who sailed for help."}]}, {"level": 4, "label": "Year 8", "descriptor": "Reading analysis: naming language devices and explaining their effect, drawing inferences, separating fact from opinion and working out the writer's purpose.", "extract": "The cave mouth swallowed us whole. I had been underground twice before, so I told myself I knew what I was doing, which was the first mistake of the day. Twenty minutes in, the passage narrowed until I had to turn my head sideways to breathe. My helmet lamp threw a thin yellow coin of light onto wet rock. Behind me, Dan kept up a steady stream of jokes, and I noticed he had stopped laughing at his own punchlines. Then my lamp flickered. It flickered again, and the dark leaned in close, patient as a dog waiting for food. I remember thinking, quite calmly, that nobody above ground knew exactly which passage we had taken. Caving is the most stupid hobby a person can choose. I have not been back.", "questions": [{"id": "en16", "type": "mc", "q": "Look at this line from the extract: 'the dark leaned in close, patient as a dog waiting for food'. Which two devices does the writer use?", "options": ["metaphor and alliteration", "simile and personification", "alliteration and rhyme", "personification and rhyme"], "answer": "simile and personification", "topic": "language device: identification", "explain": "The answer is simile and personification. It is a simile because it compares the dark to something else using the word 'as', in the phrase 'patient as a dog'. It is personification because the dark is given a human action and a human quality: it 'leaned in' and it is 'patient', and only a living thing can really do either. There is no alliteration here, because alliteration needs several nearby words starting with the same sound, and there is no rhyme."}, {"id": "en17", "type": "long", "q": "Explain the effect of the phrase 'the dark leaned in close, patient as a dog waiting for food'. Use the writer's own words in your answer.", "answer": "The writer says the dark 'leaned in close', which makes the darkness sound alive, like a person or an animal moving towards him rather than just the absence of light. Comparing it to 'a dog waiting for food' makes it sound calm and certain, as if it knows it will get him in the end and does not need to rush. This is frightening because it turns the writer into the food, so he sounds like prey with no way of stopping what is coming.", "marks": 3, "topic": "language device: effect", "explain": "A strong answer contains: 1) the correct name of at least one device, simile or personification. 2) A short quotation from the phrase, not the whole line copied out. 3) An explanation of what the comparison makes the reader picture, for example the dark moving on its own like a living thing. 4) A comment on how it makes the reader feel, for example tense, trapped or frightened. 5) A link to the writer's position, for example that being compared to food makes him sound like prey. One mark for naming the device with a quotation, one mark for explaining the picture it creates, and one mark for explaining the effect on the reader. Simply saying 'it makes it more interesting' or 'it helps you imagine it' earns nothing, because it does not say what is imagined."}, {"id": "en18", "type": "long", "q": "The writer says that Dan 'had stopped laughing at his own punchlines'. What does this tell you about Dan? Explain how you know.", "answer": "It tells me that Dan had become frightened. He had been telling jokes the whole way in, which suggests he was trying to keep everyone calm or hide his own nerves. The fact that he keeps telling them but no longer laughs shows the jokes have stopped working for him, so something has changed in his head. The writer does not say the word 'scared' anywhere, so the reader has to pick it up from this small detail.", "marks": 3, "topic": "inference", "explain": "A strong answer contains: 1) A clear statement of what Dan is feeling, such as scared, worried or nervous. 2) The evidence, which is that he keeps joking but no longer laughs at his own jokes. 3) An explanation of the gap between those two things, that carrying on with the jokes is habit or cover, while the missing laugh is the true feeling leaking out. 4) A note that the writer never states this directly, so it is inferred. One mark for a sensible feeling, one mark for using the evidence, one mark for explaining the reasoning that links them. Saying only 'he was not finding it funny' repeats the text without inferring anything and earns very little."}, {"id": "en19", "type": "mc", "q": "Which sentence from the extract is an opinion rather than a fact?", "options": ["I had been underground twice before.", "Twenty minutes in, the passage narrowed.", "Caving is the most stupid hobby a person can choose.", "I have not been back."], "answer": "Caving is the most stupid hobby a person can choose.", "topic": "fact and opinion", "explain": "The answer is 'Caving is the most stupid hobby a person can choose.' A fact is something that can be checked and proved. An opinion is what somebody thinks, and other people can reasonably disagree. Plenty of people love caving, so 'most stupid' is a judgement, not a provable truth. The words 'most stupid' are the giveaway, because judgement words like best, worst, greatest and stupidest almost always signal an opinion. The other three sentences all describe things that happened and could in principle be checked."}, {"id": "en20", "type": "mc", "q": "What is the writer's main purpose in this extract?", "options": ["To teach the reader how to go caving safely", "To entertain the reader with the story of a frightening experience", "To advertise a caving centre and get people to visit", "To give scientific information about how caves are formed"], "answer": "To entertain the reader with the story of a frightening experience", "topic": "writer's purpose and audience", "explain": "The answer is 'To entertain the reader with the story of a frightening experience.' You can tell from how it is written, not just what it is about. The writer uses 'I', tells the events in the order they happened, and builds tension with description like 'the dark leaned in close'. There are no instructions, so it is not teaching. Nothing is being sold and the writer says he has not been back, so it is not an advert. There are no facts about rock or geology, so it is not information. Writers often have more than one purpose, but here the main one is to grip the reader."}]}, {"level": 5, "label": "Year 8 stretch", "descriptor": "Top end analysis: tone and how it is built, comparing two viewpoints, explaining a writer's deliberate structural choice and judging how convincing an argument is.", "extract": "VIEWPOINT A: Sam Whitcombe, boxing coach\nGive me the kid nobody else wants. In three months he will look you in the eye when he speaks. Boxing does not create violence; it drains it. Every young person who walks into my gym learns the same lesson on day one, which is that hitting someone is expensive. You get hit back. That single fact teaches more self control than a hundred school assemblies.\n\nVIEWPOINT B: Dr Ruth Okafor, brain injury researcher\nI have scanned the brains of former boxers. I have seen what repeated blows do to tissue that is still growing. A twelve year old brain is not a small adult brain; it is a building site. We would never let a child take a job that involved being struck in the head, and yet we call it a sport and hand out medals.", "questions": [{"id": "en21", "type": "mc", "q": "Which word best describes the tone of Viewpoint B?", "options": ["cheerful", "joking", "serious and warning", "uncertain"], "answer": "serious and warning", "topic": "tone: identifying tone", "explain": "The answer is 'serious and warning'. Tone means the attitude you can hear in the writer's voice. Dr Okafor writes about scanned brains, repeated blows and damaged tissue, and she ends by pointing out something she thinks is wrong, that we hand out medals for it. There are no jokes and no light moments. She is not uncertain either, because she states everything firmly, using 'I have seen' rather than 'I think' or 'perhaps'."}, {"id": "en22", "type": "mc", "q": "Dr Okafor writes: 'A twelve year old brain is not a small adult brain; it is a building site.' Which answer best explains how this sentence builds her tone?", "options": ["She uses a metaphor that makes the brain sound unfinished and easy to damage.", "She uses rhyme to make the sentence stick in the reader's head.", "She uses humour so that the reader does not get upset.", "She uses a question to make the reader stop and think."], "answer": "She uses a metaphor that makes the brain sound unfinished and easy to damage.", "topic": "tone: how it is created", "explain": "The answer is 'She uses a metaphor that makes the brain sound unfinished and easy to damage.' She does not say the brain is like a building site, she says it is one, which makes it a metaphor rather than a simile. A building site is half built, full of exposed parts and obviously not safe for anyone to walk into, so the image makes the reader feel the risk instead of just being told about it. There is no rhyme, no humour and no question in the sentence."}, {"id": "en23", "type": "mc", "q": "Both writers talk about young people. What do they mainly disagree about?", "options": ["Whether boxing is a popular sport", "Whether boxing costs too much money to take part in", "Whether boxing does more good than harm to a young person", "Which boxers are the best in the world"], "answer": "Whether boxing does more good than harm to a young person", "topic": "comparing viewpoints", "explain": "The answer is 'Whether boxing does more good than harm to a young person.' Whitcombe argues for the good it does, saying it builds self control and gives difficult young people confidence. Okafor argues for the harm it does, focusing on damage to a growing brain. Neither of them discusses how popular boxing is, what it costs, or who the best boxers are. When you compare two viewpoints, first find the one question they are both answering, then show how their answers differ."}, {"id": "en24", "type": "long", "q": "Viewpoint A begins with the short sentence 'Give me the kid nobody else wants.' Explain why the writer chose to open in this way.", "answer": "The sentence is short and blunt, so it lands like a challenge and grabs the reader straight away. It is also a command, which makes Whitcombe sound confident and in charge from his very first word. By mentioning 'the kid nobody else wants' before he explains anything, he makes the reader curious about who that kid is and what he does with them, which pulls them into the rest of the paragraph. It also sets up his whole argument early, because it hints that boxing works for young people who have already been given up on.", "marks": 3, "topic": "structure: why a writer opens this way", "explain": "A strong answer contains: 1) A comment on the length or bluntness of the sentence, not just what it means. 2) A comment on its form, that it is a command or an instruction spoken directly to the reader. 3) A comment on the effect on the reader, such as grabbing attention, creating curiosity, or making the coach sound confident and experienced. 4) A link to his wider argument, that he works with difficult young people others have rejected. 5) Ideally, a note that it is placed first on purpose, so the reader meets his voice before his reasons. One mark for identifying the feature, one for explaining the effect, one for linking it to the argument as a whole. Retelling the sentence in different words earns nothing."}, {"id": "en25", "type": "long", "q": "Which viewpoint do you find more convincing, A or B? Give two reasons, and refer to the kind of evidence each writer uses.", "answer": "I find Viewpoint B more convincing. My first reason is the evidence. Dr Okafor says 'I have scanned the brains of former boxers', so she is speaking from research she has carried out herself, and physical evidence about brain damage is hard to argue against. Whitcombe only offers what he has seen in his own gym, which could be true of his gym and not of anywhere else. My second reason is that his strongest claim, that boxing 'drains' violence, is stated but never proved, while Okafor's point about a child never being allowed a job that involved blows to the head is a comparison the reader can test for themselves. Whitcombe is convincing when he says getting hit back teaches self control, because that reasoning makes sense, but a lesson in self control is not worth a permanent injury.", "marks": 4, "topic": "evaluating how convincing an argument is", "explain": "Either side can score full marks, because this question is about the quality of the reasoning, not about picking a particular answer. A strong answer contains: 1) A clear choice stated at the start. 2) Two separate reasons, not the same reason twice. 3) At least one short quotation or close reference from each viewpoint, since the question asks about both. 4) A comment on the type of evidence used, for example that Okafor uses research and professional experience while Whitcombe uses personal experience from his own gym. 5) Some acknowledgement of a strength in the side not chosen, which shows balance. 6) A final judgement that says why one still outweighs the other. Roughly one mark per developed reason, one mark for using evidence from both writers, and one mark for balance and a clear final judgement. An answer that only says which one he likes, with no evidence, earns at most one mark."}]}], "writing": [{"id": "w1", "title": "Lost on the Hill", "prompt": "The fog came down faster than you expected, and now you cannot see the path. Write the next part of the story. Describe what you can see, what you can hear and what you can feel. Do not end with a rescue. Take the reader up to the moment you realise you are on your own. Write about 150 words.", "minutes": 20, "checklist": ["Events are told in a clear order, with at least two paragraphs and a new paragraph when the time, place or focus changes", "Capital letters and full stops are correct in almost every sentence, with no run-on sentences", "Describes at least two different senses, for example what can be seen and what can be heard", "Uses at least one simile or metaphor that genuinely fits a cold, foggy hillside", "Sentence lengths vary, including at least one deliberately short sentence to build tension", "Uses precise vocabulary instead of repeating vague words like big, nice, scary or good", "Stays in one tense the whole way through, either past or present, without swapping"]}, {"id": "w2", "title": "Ban the Phones", "prompt": "Your school wants to ban mobile phones from the building completely, including at break and at lunch. Write a letter to the head teacher giving your opinion. Write about 150 words.", "minutes": 20, "checklist": ["States his opinion clearly within the first two sentences, so the reader knows which side he is on", "Gives at least three different reasons, not the same reason repeated in different words", "Uses a separate paragraph for each main reason", "Includes one point from the other side and answers it, for example 'Some people say... but...'", "Uses at least one persuasive technique on purpose, such as a rhetorical question, a group of three, or direct address to the reader", "Uses formal language suitable for a head teacher, with no slang, no text speak and no contractions like 'don't'", "Ends with a clear final sentence that restates the main point rather than trailing off"]}]}, "science": {"subject": "Science", "bands": [{"level": 1, "label": "Year 6 foundations", "descriptor": "Basic facts from primary school: plant parts, the body, states of matter, simple circuits, forces and space.", "extract": null, "questions": [{"id": "sc1", "type": "mc", "q": "Which part of a plant takes in water and minerals from the soil?", "options": ["The leaf", "The root", "The flower", "The stem"], "answer": "The root", "topic": "plants: parts and functions", "explain": "The root is the answer. Roots grow down into the soil and soak up water and minerals. They also hold the plant firmly in the ground. The leaf makes food using light. The stem holds the plant up and carries water to the leaves. The flower is the part that makes seeds."}, {"id": "sc2", "type": "mc", "q": "Which one of these statements about the human body is correct?", "options": ["The ribs protect the heart and the lungs", "The lungs pump blood around the body", "The heart takes oxygen out of the air", "The skull protects the stomach"], "answer": "The ribs protect the heart and the lungs", "topic": "human body: skeleton and organs", "explain": "The ribs are the answer. The ribs form a cage around the chest. This cage protects the soft organs inside it, which are the heart and the lungs. The other three are mixed up. The heart pumps blood, not the lungs. The lungs take oxygen out of the air, not the heart. The skull protects the brain, not the stomach."}, {"id": "sc3", "type": "text", "q": "Solids, liquids and gases are the three states of matter. Which state can be squashed into a much smaller space?", "answer": "gas", "accept": ["gas", "a gas", "gases", "gaseous", "the gas", "gas state", "gasses"], "topic": "states of matter", "explain": "A gas is the answer. In a gas the particles are spread far apart with big gaps between them. Squashing a gas pushes the particles closer together into those gaps. In a solid and in a liquid the particles are already touching each other, so there are almost no gaps left to squash into."}, {"id": "sc4", "type": "mc", "q": "A circuit has a cell, a lamp and a switch. The lamp is lit. The switch is then opened, which means turned off. The lamp goes out. Why?", "options": ["There is now a gap in the circuit, so no current can flow", "The cell has run out of energy", "The lamp has broken", "The current leaks out through the gap"], "answer": "There is now a gap in the circuit, so no current can flow", "topic": "simple circuits", "explain": "The gap is the answer. Current only flows if there is a complete loop of conducting material from one end of the cell all the way back to the other end. Opening the switch breaks that loop. No current flows, so the lamp cannot light. The cell is fine and the lamp is fine. Closing the switch again will light it."}, {"id": "sc5", "type": "text", "q": "Name the force that keeps the planets moving in orbit around the Sun.", "answer": "gravity", "accept": ["gravity", "gravitational force", "the force of gravity", "gravitational pull", "gravitational attraction", "gravity of the sun", "the sun's gravity", "suns gravity", "gravitational"], "topic": "forces: gravity and the solar system", "explain": "Gravity is the answer. Every object with mass pulls on every other object. The Sun is extremely massive, so its pull is very strong. That pull keeps the planets curving round the Sun instead of flying off in a straight line. The same force is what pulls you down towards the Earth."}]}, {"level": 2, "label": "Year 7", "descriptor": "Cells, changes of state, acids and alkalis, energy stores and specialised cells in reproduction.", "extract": null, "questions": [{"id": "sc6", "type": "mc", "q": "Which of these is found in a plant cell but is NOT found in an animal cell?", "options": ["Cell wall", "Cell membrane", "Nucleus", "Cytoplasm"], "answer": "Cell wall", "topic": "cells: organelles", "explain": "The cell wall is the answer. A cell wall is a stiff outer layer made of cellulose. It sits outside the cell membrane and gives the plant cell its shape and support. Animal cells do not have one. The other three are in both types of cell. The membrane controls what goes in and out. The nucleus holds the DNA and controls the cell. The cytoplasm is the jelly where reactions happen."}, {"id": "sc7", "type": "mc", "q": "A sperm cell has a long tail. What is the tail for?", "options": ["To swim towards the egg cell", "To carry oxygen around the body", "To store food for the growing baby", "To stick the cell to the lining of the womb"], "answer": "To swim towards the egg cell", "topic": "reproduction: specialised cells", "explain": "Swimming to the egg is the answer. A sperm cell is a specialised cell, which means its shape is suited to its job. Its job is to reach the egg cell so fertilisation can happen. The tail whips from side to side and pushes the sperm forward. The egg cell is the one that carries the food store, and it does not have a tail."}, {"id": "sc8", "type": "text", "q": "What is the name of the change of state when a gas turns into a liquid?", "answer": "condensation", "accept": ["condensation", "condensing", "condense", "condenses", "it condenses", "condensation (condensing)"], "topic": "changes of state", "explain": "Condensation is the answer. When a gas is cooled its particles lose energy and slow down. They move close together and start to stick to each other, forming a liquid. You see this when water vapour in the air touches a cold window and turns into drops. The opposite change, liquid to gas, is evaporation or boiling."}, {"id": "sc9", "type": "mc", "q": "The pH scale runs from 1 to 14 and tells you how acidic or alkaline a liquid is. A liquid has a pH of 2. Which statement is correct?", "options": ["It is a strong acid", "It is a weak acid", "It is neutral", "It is a strong alkali"], "answer": "It is a strong acid", "topic": "acids and alkalis: pH scale", "explain": "A strong acid is the answer. On the pH scale, 7 is neutral, like pure water. Anything below 7 is an acid, and the lower the number the stronger the acid. A pH of 2 is very low, so it is a strong acid. Numbers just below 7, such as 5 or 6, are weak acids. Anything above 7 is an alkali, and 13 or 14 would be a strong alkali."}, {"id": "sc10", "type": "text", "q": "An energy store is a way of holding energy ready to be used. A rubber band is stretched and held. Which energy store has been filled?", "answer": "elastic potential store", "accept": ["elastic potential", "elastic potential store", "elastic", "elastic store", "elastic energy", "elastic potential energy", "elastic potential energy store", "strain", "strain energy", "the elastic store"], "topic": "energy stores and transfers", "explain": "The elastic potential store is the answer. Stretching or squashing something springy fills its elastic potential store. The energy came from your muscles, which use the chemical store in your food. When you let go, the energy transfers out of the elastic store, and the band moves, filling a kinetic store, which is the movement store."}]}, {"level": 3, "label": "Year 8", "descriptor": "Elements and mixtures, the periodic table, enzymes and digestion, light and sound, and electric current.", "extract": null, "questions": [{"id": "sc11", "type": "mc", "q": "A mixture contains two or more substances that are not chemically joined together. Which of these is a mixture?", "options": ["Water", "Carbon dioxide", "Air", "Magnesium oxide"], "answer": "Air", "topic": "elements, compounds and mixtures", "explain": "Air is the answer. Air is mostly nitrogen and oxygen, plus small amounts of other gases. Those gases are simply mixed together and are not chemically joined, so air is a mixture. You can separate a mixture without a chemical reaction. The other three are compounds, which means different elements are chemically joined. Water is hydrogen joined to oxygen. Carbon dioxide is carbon joined to oxygen. Magnesium oxide is magnesium joined to oxygen."}, {"id": "sc12", "type": "text", "q": "What is the name given to a vertical column of elements in the periodic table?", "answer": "group", "accept": ["group", "a group", "groups", "group number", "the group", "chemical group"], "topic": "periodic table: structure", "explain": "A group is the answer. The periodic table is arranged so that vertical columns are called groups and horizontal rows are called periods. Elements in the same group behave in similar ways in chemical reactions, because they have the same number of electrons in their outer shell. Group 1 is the alkali metals and group 0 is the noble gases."}, {"id": "sc13", "type": "mc", "q": "What is the job of enzymes in digestion?", "options": ["They break large food molecules into small ones so they can be absorbed into the blood", "They kill the bacteria in the stomach", "They squeeze food along the gut", "They add water to food to make it softer"], "answer": "They break large food molecules into small ones so they can be absorbed into the blood", "topic": "digestion: enzymes", "explain": "Breaking large molecules into small ones is the answer. Enzymes are biological catalysts, which means they speed up reactions in the body. Big food molecules like starch and protein are too large to pass through the wall of the small intestine. Enzymes cut them into small molecules such as glucose and amino acids, which are small enough to be absorbed into the blood. Stomach acid is what kills most bacteria, and muscles squeezing the gut is a separate process."}, {"id": "sc14", "type": "mc", "q": "In a thunderstorm you always see the lightning before you hear the thunder, even though they happen at the same moment. Why?", "options": ["Light travels much faster than sound", "Sound travels much faster than light", "The lightning happens first and the thunder happens later", "Your eyes react faster than your ears"], "answer": "Light travels much faster than sound", "topic": "waves: speed of light and sound", "explain": "Light being faster is the answer. Light travels at about 300000000 metres per second. Sound travels through air at only about 330 metres per second, which is roughly a million times slower. The flash and the bang are made at the same instant, but the light reaches you almost immediately while the sound takes several seconds to cover the same distance. Sound needs particles to travel through, and light does not."}, {"id": "sc15", "type": "text", "q": "One quantity in an electric circuit is measured in amps, symbol A. What is the name of that quantity?", "answer": "current", "accept": ["current", "electric current", "the current", "electrical current", "flow of charge", "charge flow", "amps of current"], "topic": "electricity: current", "explain": "Current is the answer. Current is the flow of electric charge around a circuit. It is measured in amps, symbol A, using an ammeter connected in series. Do not confuse it with voltage, also called potential difference, which is measured in volts and tells you how much energy each unit of charge carries. Resistance is measured in ohms and tells you how hard it is for current to flow."}]}, {"level": 4, "label": "Year 8 to 9", "descriptor": "Balancing equations, conservation of mass, rearranged speed and density calculations, and respiration.", "extract": null, "questions": [{"id": "sc16", "type": "mc", "q": "Hydrogen burns in oxygen to make water. In a balanced equation there must be the same number of each type of atom on both sides. Which equation is correctly balanced?", "options": ["2H2 + O2 -> 2H2O", "H2 + O2 -> H2O", "2H2 + 2O2 -> 2H2O", "H2 + 2O2 -> 2H2O"], "answer": "2H2 + O2 -> 2H2O", "topic": "balancing symbol equations", "explain": "2H2 + O2 -> 2H2O is the answer. Count the atoms on each side. On the left, 2H2 gives 4 hydrogen atoms and O2 gives 2 oxygen atoms. On the right, 2H2O gives 4 hydrogen atoms and 2 oxygen atoms. Both sides match, so it is balanced. H2 + O2 -> H2O has 2 oxygen on the left but only 1 on the right. 2H2 + 2O2 -> 2H2O has 4 oxygen on the left but only 2 on the right. H2 + 2O2 -> 2H2O has 2 hydrogen on the left but 4 on the right."}, {"id": "sc17", "type": "text", "q": "4.8 g of magnesium is burned in oxygen. It reacts completely with 3.2 g of oxygen to make magnesium oxide. Calculate the mass of magnesium oxide made. Give the unit.", "answer": "8 g", "accept": ["8", "8 g", "8g", "8.0", "8.0 g", "8.0g", "8 grams", "8 g of magnesium oxide", "eight grams"], "topic": "conservation of mass", "explain": "8 g is the answer. Mass is always conserved in a chemical reaction. That means atoms are never created or destroyed, they are only rearranged, so the total mass of the products equals the total mass of the reactants. Add the two reactant masses: 4.8 + 3.2 = 8.0 g. So 8 g of magnesium oxide is made. A common trap is thinking the solid gets lighter when it burns. It gets heavier, because the oxygen from the air has joined on."}, {"id": "sc18", "type": "text", "q": "Density = mass / volume. Cooking oil has a density of 0.8 g/cm^3. Calculate the mass of 250 cm^3 of this oil. Give the unit.", "answer": "200 g", "accept": ["200", "200 g", "200g", "200.0", "200.0 g", "200 grams", "200g of oil", "200 g of oil"], "topic": "density calculation: rearranged formula", "explain": "200 g is the answer. You are given density and volume and asked for mass, so rearrange the formula. Starting from density = mass / volume, multiply both sides by volume to get mass = density x volume. Then substitute the numbers: mass = 0.8 x 250 = 200 g. Check the units make sense: g/cm^3 multiplied by cm^3 leaves g, which is a mass, so the answer is in the right form."}, {"id": "sc19", "type": "text", "q": "Speed = distance / time. A car travels at a steady speed of 12 m/s for 30 seconds. Calculate the distance it travels. Give the unit.", "answer": "360 m", "accept": ["360", "360 m", "360m", "360.0", "360.0 m", "360 metres", "360 meters", "360 metres m"], "topic": "speed calculation: rearranged formula", "explain": "360 m is the answer. You are given speed and time and asked for distance, so rearrange the formula. Starting from speed = distance / time, multiply both sides by time to get distance = speed x time. Then substitute: distance = 12 x 30 = 360 m. Check the units: m/s multiplied by s leaves m, which is a distance, so the answer is in the right form."}, {"id": "sc20", "type": "long", "q": "Human cells can respire aerobically or anaerobically. Describe two differences between the two types. Then name the substance that builds up in the muscles during anaerobic respiration.", "answer": "Aerobic respiration uses oxygen but anaerobic respiration does not. Aerobic respiration releases much more energy from each glucose molecule than anaerobic respiration does. Aerobic respiration produces carbon dioxide and water, while anaerobic respiration in muscle produces lactic acid, which builds up and causes muscle fatigue.", "marks": 3, "topic": "respiration: aerobic vs anaerobic", "explain": "A strong answer contains three things, one mark each. First, that aerobic respiration needs oxygen and anaerobic respiration happens without oxygen. Second, that aerobic respiration transfers much more energy per glucose molecule, which is why anaerobic respiration can only keep muscles going for a short burst. Third, that lactic acid is the substance that builds up in the muscles. Extra credit ideas: the aerobic word equation is glucose + oxygen -> carbon dioxide + water. Anaerobic respiration is used during hard exercise when the lungs and blood cannot deliver oxygen fast enough. The lactic acid is later broken down using the extra oxygen you take in while panting after exercise."}]}, {"level": 5, "label": "Grade 9 calibre", "descriptor": "Applying knowledge to new situations, reading experimental data, identifying variables, explaining at cell level and multi step calculation.", "extract": "EXPERIMENT (use this for questions sc21, sc22 and sc23). A student puts a piece of pondweed in a test tube of water. Pondweed is a plant that lives underwater. When it photosynthesises it gives off bubbles of oxygen gas. The student counts the bubbles given off in one minute. She then moves a lamp to different distances from the tube and counts again each time. The water is kept at 20 degrees C throughout. A lamp that is closer gives the pondweed more light.\n\nDistance of lamp from tube (cm) | Bubbles per minute\n50 | 6\n40 | 9\n30 | 14\n20 | 22\n10 | 30\n5 | 31", "questions": [{"id": "sc21", "type": "text", "q": "Look at the experiment above. The independent variable is the thing the student deliberately changes. What is the independent variable in this experiment?", "answer": "the distance of the lamp from the tube", "accept": ["distance of the lamp", "distance of lamp", "the distance of the lamp", "the distance of the lamp from the tube", "distance of the lamp from the tube", "distance of the lamp from the pondweed", "distance", "the distance", "light intensity", "the light intensity", "amount of light", "how much light", "how close the lamp is", "lamp distance", "distance of light source", "brightness of the light"], "topic": "variables: identifying the independent variable", "explain": "The distance of the lamp, which changes the light intensity, is the answer. The independent variable is the one thing the student chooses to change on purpose. Here she changes only where the lamp is. The dependent variable is what she measures as a result, which is the number of bubbles per minute. The control variables are the things she keeps the same so the test is fair, such as the temperature of the water at 20 degrees C, the same piece of pondweed and the same length of time counting."}, {"id": "sc22", "type": "mc", "q": "Look at the results above. The lamp was moved from 10 cm to 5 cm. The pondweed got much more light, but the bubble count barely changed. What is the best explanation?", "options": ["At this point light is no longer the factor holding the rate back, so something else, such as the carbon dioxide level or the temperature, is now limiting it", "The pondweed has run out of oxygen to release", "The pondweed has died because the lamp was too bright", "The student made a mistake, because more light must always give more bubbles"], "answer": "At this point light is no longer the factor holding the rate back, so something else, such as the carbon dioxide level or the temperature, is now limiting it", "topic": "photosynthesis: limiting factors", "explain": "Another factor becoming limiting is the answer. A limiting factor is whatever is in shortest supply and therefore sets the maximum rate. At long distances there is very little light, so light is the limiting factor and the rate drops sharply as you move the lamp away. Once the lamp is very close, there is plenty of light, so adding more light cannot speed anything up. Now the rate is capped by how fast the plant can get carbon dioxide out of the water, or by the temperature at 20 degrees C, so the graph levels off. The pondweed cannot run out of oxygen because it makes oxygen, and there is no evidence it has died since it is still producing 31 bubbles per minute."}, {"id": "sc23", "type": "long", "q": "Look at the experiment above. Explain why the pondweed gives off more bubbles per minute when the lamp is moved closer to it. Explain what is happening inside the plant cells, not just what the results show.", "answer": "Moving the lamp closer increases the light intensity, so more light energy reaches the pondweed each second. The light is absorbed by chlorophyll inside the chloroplasts of the plant cells. That energy is used to carry out photosynthesis: carbon dioxide + water -> glucose + oxygen. Because more energy is available, the reaction happens faster, so more oxygen is made each minute and more bubbles are seen.", "marks": 3, "topic": "photosynthesis: explaining rate at cell level", "explain": "A strong answer contains three things, one mark each. First, that a closer lamp means greater light intensity, so more light energy arrives per second. Second, that the light is absorbed by chlorophyll in the chloroplasts inside the plant cells, and that light energy is what drives the reaction. Third, that faster photosynthesis produces oxygen faster, and the bubbles are that oxygen, so the count goes up. The word equation carbon dioxide + water -> glucose + oxygen earns extra credit. The key skill being tested is explaining the cause inside the cell, not just repeating that closer means more bubbles, which only describes the pattern."}, {"id": "sc24", "type": "mc", "q": "A student has a beaker containing sand mixed into salty water. Sand does not dissolve in water. Salt does dissolve in water. She wants to end up with pure, dry salt. Which method should she use?", "options": ["Filter the mixture, then evaporate the water from the liquid that passes through the filter paper", "Evaporate all of the water first, then filter what is left behind", "Filter the mixture, then dry the solid left in the filter paper and keep that", "Use a magnet to pull out the sand, then filter the liquid that is left"], "answer": "Filter the mixture, then evaporate the water from the liquid that passes through the filter paper", "topic": "separating techniques: choosing the right method", "explain": "Filter first, then evaporate, is the answer. Filtering separates an insoluble solid from a liquid. Sand does not dissolve, so the sand stays in the filter paper. The salt is dissolved, so it passes straight through with the water in the liquid called the filtrate. Evaporating that filtrate drives off the water and leaves pure dry salt crystals. Evaporating first would leave the salt and the sand mixed together as solids, so nothing is separated. Drying the solid in the filter paper gives you the sand, not the salt. A magnet does not work because neither sand nor salt is magnetic."}, {"id": "sc25", "type": "text", "q": "A lift and the people inside it have a total mass of 800 kg. Use g = 10 N/kg. The cable pulls the lift straight upwards with a force of 8200 N. Use resultant force = mass x acceleration. Calculate the acceleration of the lift. Give the unit.", "answer": "0.25 m/s^2", "accept": ["0.25", "0.25 m/s^2", "0.25m/s^2", "0.25 m/s2", "0.25m/s2", "0.25 ms^-2", "0.25 m per s^2", "0.25 metres per second squared", "0.25 m/s^2 upwards", "0.25 m/s^2 up", "0.25 m/s/s", "0.25 m/s squared"], "topic": "multi step calculation: weight and Newton's second law", "explain": "0.25 m/s^2 is the answer. This takes three steps. Step 1, find the weight, which is the downward pull of gravity: weight = mass x g = 800 x 10 = 8000 N. Step 2, find the resultant force. Two forces act, the cable pulling up with 8200 N and the weight pulling down with 8000 N. They act in opposite directions, so subtract: 8200 - 8000 = 200 N, acting upwards. Step 3, use resultant force = mass x acceleration, rearranged to acceleration = resultant force / mass = 200 / 800 = 0.25 m/s^2. Because the resultant force points upwards, the lift accelerates upwards. Note that mass in kg and weight in N are different things, and the trap here is putting 8200 into the formula instead of the resultant 200 N."}]}]}, "german": {"subject": "German", "bands": [{"level": 1, "label": "Absolute basics", "descriptor": "Greetings, introductions, numbers to 20, days of the week, colours and classroom objects", "extract": null, "questions": [{"id": "de1", "type": "mc", "q": "Someone says: \"Guten Morgen! Wie heisst du?\" Which reply is correct German?", "options": ["Ich heisse Suraj.", "Ich bin heisse Suraj.", "Mein heisse Suraj.", "Ich heisst Suraj."], "answer": "Ich heisse Suraj.", "topic": "greetings and introductions: wie heisst du", "explain": "The answer is \"Ich heisse Suraj.\" The verb heissen (to be called) goes ich heisse, du heisst, er/sie heisst. With ich you must use heisse, so \"Ich heisst\" is wrong, and you never add bin as well because heisse is already the verb."}, {"id": "de2", "type": "text", "q": "Write the German word for the number 12.", "answer": "zwoelf", "accept": ["zwoelf", "zwölf", "Zwoelf", "Zwölf"], "topic": "numbers 1 to 20", "explain": "12 is zwoelf (zwölf). The run is elf (11), zwoelf (12), dreizehn (13), vierzehn (14). From 13 up you build the number by adding zehn to the unit, but 11 and 12 are one off words you just learn."}, {"id": "de3", "type": "mc", "q": "Welcher Tag kommt nach Mittwoch? (Which day comes after Wednesday?)", "options": ["Dienstag", "Donnerstag", "Samstag", "Montag"], "answer": "Donnerstag", "topic": "days of the week", "explain": "Donnerstag. The order is Montag, Dienstag, Mittwoch, Donnerstag, Freitag, Samstag, Sonntag. Dienstag is Tuesday, which comes before Mittwoch, not after. All days are masculine (der Montag) and are always capitalised."}, {"id": "de4", "type": "text", "q": "Complete in German: \"Der Bleistift ist ____.\" (The pencil is green.)", "answer": "gruen", "accept": ["gruen", "grün", "Gruen", "Grün"], "topic": "colours and classroom objects", "explain": "gruen (grün) means green. When a colour comes after the verb ist it is just the plain word with no ending added, so \"Der Bleistift ist gruen.\" Colours are adjectives and stay lowercase, unlike nouns such as Bleistift."}]}, {"level": 2, "label": "Year 7 core", "descriptor": "Articles, sein and haben, personal pronouns, family, age and where you live", "extract": null, "questions": [{"id": "de5", "type": "mc", "q": "Which is the correct article for the noun Schwester (sister)?", "options": ["der", "die", "das", "den"], "answer": "die", "topic": "articles: der die das", "explain": "die Schwester. Every German noun has a gender: masculine (der Bruder, der Vater), feminine (die Schwester, die Mutter) or neuter (das Kind, das Buch). Schwester is feminine, so it takes die. Den is not a gender, it is the accusative form of der."}, {"id": "de6", "type": "text", "q": "Fill both gaps with the correct forms of sein (to be): \"Meine Eltern ____ aus Indien und ich ____ zwoelf Jahre alt.\" Write your two answers separated by a comma.", "answer": "sind, bin", "accept": ["sind, bin", "sind bin", "Sind, bin", "sind,bin", "sind / bin", "Sind, Bin"], "topic": "present tense: sein, and giving your age", "explain": "sind, bin. Sein is irregular: ich bin, du bist, er/sie/es ist, wir sind, ihr seid, sie/Sie sind. Eltern is plural so it needs sind, and ich always takes bin. Note that German uses sein for age, not haben: ich bin zwoelf Jahre alt, never ich habe zwoelf Jahre."}, {"id": "de7", "type": "text", "q": "Fill the gap with the correct form of haben (to have): \"Ich ____ eine Schwester und einen Bruder.\"", "answer": "habe", "accept": ["habe", "Habe"], "topic": "present tense: haben, and family vocabulary", "explain": "habe. Haben goes ich habe, du hast, er/sie/es hat, wir haben, ihr habt, sie/Sie haben. With ich you drop the n and use habe. Eine Schwester is feminine and einen Bruder is masculine, which is why the two words for a look different."}, {"id": "de8", "type": "mc", "q": "Which sentence correctly says \"We live in Wolverhampton\"?", "options": ["Wir wohnen in Wolverhampton.", "Wir wohnt in Wolverhampton.", "Wir wohne in Wolverhampton.", "Wir sind in Wolverhampton wohnen."], "answer": "Wir wohnen in Wolverhampton.", "topic": "personal pronouns and saying where you live
