, "type": "mc", "q": "What does der Bus mean?", "options": ["the bus", "the brother", "the town", "the water"], "answer": "the bus", "hint": "The German word looks almost the same as the English one.", "explain": "der Bus means the bus. der Bruder is the brother, die Stadt is the town and das Wasser is the water. Bus is a der word, so the pair you learn is der Bus.", "topic": "core vocabulary: recognising der Bus"}], "de12-verb-second": [{"id": "de12-verb-second:r-de12-1", "level": "easy", "type": "mc", "q": "Which of these three is written correctly?", "options": ["Ich trinke Wasser.", "Ich trinkst Wasser.", "Ich trinkt Wasser."], "answer": "Ich trinke Wasser.", "hint": "With ich the verb ends in e.", "explain": "The answer is Ich trinke Wasser. Take trinken, drop the en, and add the ich ending e. trinkst is the du ending and trinkt is the er ending, so both of those put someone else's ending on ich.", "topic": "verb second: ich ending with trinken"}, {"id": "de12-verb-second:r-de12-2", "level": "medium", "type": "mc", "q": "Which ending does lernen take when the person is du?", "options": ["e", "st", "t"], "answer": "st", "hint": "The three endings are e for ich, st for du, t for er and sie.", "explain": "The ending is st, giving Du lernst Deutsch. Using e there is the commonest slip, because e is the ich ending and it does not move to du.", "topic": "verb second: du ending with lernen"}, {"id": "de12-verb-second:r-de12-3", "level": "easy", "type": "text", "q": "Fill the gap with one word. Er ___ das Spiel. The verb is spielen.", "answer": "spielt", "accept": ["spielt", "Spielt"], "hint": "With er the ending is t.", "explain": "The answer is spielt. Take spielen, drop the en to get spiel, then add the er ending t. That gives Er spielt das Spiel, with the verb as the second idea. spiele would be the ich ending on er.", "topic": "verb second: er ending with spielen"}, {"id": "de12-verb-second:r-de12-4", "level": "medium", "type": "text", "q": "Fill the gap with one word. Der Bruder ___ Deutsch. The verb is lernen.", "answer": "lernt", "accept": ["lernt", "Lernt"], "hint": "der Bruder is one single person, so use the same ending as er.", "explain": "The answer is lernt. der Bruder is one single person, so it takes the same ending as er, which is t. Take lernen, drop the en, add t. That gives Der Bruder lernt Deutsch. Writing lerne puts the ich ending on somebody else.", "topic": "verb second: t ending with a single noun subject"}, {"id": "de12-verb-second:r-de12-5", "level": "medium", "type": "mc", "q": "In which of these four sentences is the verb the second idea?", "options": ["Ich trinke Wasser.", "Ich Wasser trinke.", "Wasser ich trinke.", "Trinke Wasser ich."], "answer": "Ich trinke Wasser.", "hint": "Count the ideas from the left and see where the verb lands.", "explain": "The answer is Ich trinke Wasser. Ich is idea one and trinke is idea two. In Ich Wasser trinke the verb has been pushed to third, and in Wasser ich trinke it is third again. Pushing the verb to the end is the single most common German word order mistake in English schools.", "topic": "verb second: choosing the correct word order"}, {"id": "de12-verb-second:r-de12-6", "level": "medium", "type": "mc", "q": "A pupil wrote: Ich habent Deutsch. Which word should replace habent?", "options": ["habe", "hast", "hat", "haben"], "answer": "habe", "hint": "haben is one of the two verbs you learn by heart.", "explain": "The word is habe, giving Ich habe Deutsch. There is no such word as habent in German. The three forms are ich habe, du hast, er hat, and haben on its own is the form you look up in a dictionary, not the form you put after ich.", "topic": "verb second: correcting habent to ich habe"}], "de13-my-day": [{"id": "de13-my-day:r-de13-1", "level": "easy", "type": "mc", "q": "Fill the gap. Der Film ___ gut.", "options": ["bin", "bist", "ist"], "answer": "ist", "hint": "It is one single thing, not you and not me.", "explain": "The answer is ist. For one single thing like der Film you use ist, giving Der Film ist gut. bin belongs with ich and bist belongs with du.", "topic": "simple statements: ist with a single noun"}, {"id": "de13-my-day:r-de13-2", "level": "easy", "type": "mc", "q": "Fill the gap. Du ___ alt.", "options": ["bin", "bist", "ist"], "answer": "bist", "hint": "The three forms are ich bin, du bist, er ist.", "explain": "The answer is bist. With du the form of sein is bist, giving Du bist alt. Using ist there is the slip, because ist belongs with one single other thing or person, not with du.", "topic": "simple statements: du bist"}, {"id": "de13-my-day:r-de13-3", "level": "easy", "type": "text", "q": "Fill the gap with one word. Ich ___ in Birmingham. The verb is wohnen.", "answer": "wohne", "accept": ["wohne", "Wohne"], "hint": "With ich the ending is e.", "explain": "The answer is wohne. Take wohnen, drop the en, add the ich ending e. That gives Ich wohne in Birmingham, with the verb as the second idea. wohnst would be the du ending on ich.", "topic": "simple statements: ich wohne in a place"}, {"id": "de13-my-day:r-de13-4", "level": "medium", "type": "mc", "q": "Which one means the house is new?", "options": ["Das Haus ist neu.", "Der Haus ist neu.", "Die Haus ist neu.", "Das Haus bist neu."], "answer": "Das Haus ist neu.", "hint": "Check the small word in front of Haus, then check the form of sein.", "explain": "The answer is Das Haus ist neu. Haus is a das word, so Der Haus and Die Haus are both wrong before you even reach the verb. bist belongs with du and never with das Haus, so the last option gets the noun right and the verb wrong.", "topic": "simple statements: gender of das Haus plus ist"}, {"id": "de13-my-day:r-de13-5", "level": "medium", "type": "text", "q": "Fill the gap with one word. Der Vater ___ Pizza. The verb is machen.", "answer": "macht", "accept": ["macht", "Macht"], "hint": "der Vater is one single person, so use the same ending as er.", "explain": "The answer is macht. der Vater is one single person, so the ending is t, the same as er. Take machen, drop the en, add t. That gives Der Vater macht Pizza. machst would be the du ending on somebody who is not du.", "topic": "simple statements: t ending with a single noun subject"}, {"id": "de13-my-day:r-de13-6", "level": "stretch", "type": "mc", "q": "Which of these four is written correctly?", "options": ["Die Schwester lernt Deutsch.", "Die Schwester lernst Deutsch.", "Die Schwester Deutsch lernt.", "Die Schwester ist lernt Deutsch."], "answer": "Die Schwester lernt Deutsch.", "hint": "Check the ending on the verb, then check that the verb is second.", "explain": "The answer is Die Schwester lernt Deutsch. lernst is the du ending on somebody who is not du. Die Schwester Deutsch lernt pushes the verb to third. The last option stacks ist and lernt together, and German does not put two verbs there.", "topic": "simple statements: choosing a correct sentence with lernen"}], "de14-time-phrases": [{"id": "de14-time-phrases:r-de14-1", "level": "easy", "type": "mc", "q": "Fill the gap. Heute ___ ich Deutsch.", "options": ["lerne", "lernst", "lernt"], "answer": "lerne", "hint": "The person is still ich, so the ending is still e.", "explain": "The answer is lerne. Heute fills box one, the verb fills box two, and ich moves along to box three. Starting with a time phrase does not change the person, so the ich ending e stays, giving Heute lerne ich Deutsch.", "topic": "time phrases: verb second after Heute"}, {"id": "de14-time-phrases:r-de14-2", "level": "easy", "type": "mc", "q": "A German sentence starts with Am Samstag. What must come next?", "options": ["the verb", "the person", "the rest of the sentence"], "answer": "the verb", "hint": "Am Samstag is one box, and the verb is always box two.", "explain": "The verb comes next. Am Samstag is two words but one single box, so box two has to be the verb and only then does the person appear. Putting the person second is the mistake that keeps costing you marks.", "topic": "time phrases: what follows a fronted time phrase"}, {"id": "de14-time-phrases:r-de14-3", "level": "easy", "type": "mc", "q": "Fill the gap. Am Freitag ___ ich Deutsch.", "options": ["habe", "hast", "hat"], "answer": "habe", "hint": "The person is ich, and the three forms are ich habe, du hast, er hat.", "explain": "The answer is habe. The person is ich, so the form of haben is habe, giving Am Freitag habe ich Deutsch. Note that habe sits in box two, straight after Am Freitag, and ich is pushed to box three.", "topic": "time phrases: haben with ich after a fronted time phrase"}, {"id": "de14-time-phrases:r-de14-4", "level": "medium", "type": "mc", "q": "Which one of these four is right?", "options": ["Morgen spiele ich Fussball.", "Morgen ich spiele Fussball.", "Morgen ich Fussball spiele.", "Spiele morgen ich Fussball."], "answer": "Morgen spiele ich Fussball.", "hint": "Morgen is box one, so the verb must be box two.", "explain": "The answer is Morgen spiele ich Fussball. Morgen fills box one, spiele fills box two and ich moves to box three. Morgen ich spiele Fussball puts the person in box two and shoves the verb into box three, which is the error you keep making.", "topic": "time phrases: choosing correct order after Morgen"}, {"id": "de14-time-phrases:r-de14-5", "level": "stretch", "type": "mc", "q": "Put these into a correct sentence: ich, Am Montag, Musik, hoere.", "options": ["Am Montag hoere ich Musik.", "Am Montag ich hoere Musik.", "Am Montag Musik hoere ich.", "Hoere am Montag ich Musik."], "answer": "Am Montag hoere ich Musik.", "hint": "Am Montag is one box, so the verb has to come straight after it.", "explain": "The answer is Am Montag hoere ich Musik. Am Montag is box one, hoere is box two, ich is box three and Musik is the rest. Am Montag ich hoere Musik is the version that puts the verb third, and counting Am and Montag as two separate boxes is what makes that look right when it is not.", "topic": "time phrases: building a sentence from Am Montag"}, {"id": "de14-time-phrases:r-de14-6", "level": "stretch", "type": "mc", "q": "Am Samstag ich mache Pizza. What is wrong with it?", "options": ["The verb is third and it has to be second.", "The verb is second and it has to be third.", "Pizza needs die in front of it.", "Am Samstag has to go at the end."], "answer": "The verb is third and it has to be second.", "hint": "Count the boxes: Am Samstag, ich, mache.", "explain": "The verb is third and it has to be second. Am Samstag is box one and ich is box two, so mache has ended up in box three. The fix is to swap the verb and the person, giving Am Samstag mache ich Pizza.", "topic": "time phrases: spotting the verb third error"}], "de15-putting-together": [{"id": "de15-putting-together:r-de15-1", "level": "easy", "type": "mc", "q": "Which one is sentence one written correctly?", "options": ["Ich spiele Fussball.", "Ich spielst Fussball.", "Ich Fussball spiele.", "Ich bin Fussball."], "answer": "Ich spiele Fussball.", "hint": "Check the ending on the verb, then check that the verb is second.", "explain": "The answer is Ich spiele Fussball. Ich spielst puts the du ending on ich. Ich Fussball spiele pushes the verb to third. Ich bin Fussball says I am football, which is not what the sentence means.", "topic": "five sentences: ich spiele Fussball"}, {"id": "de15-putting-together:r-de15-2", "level": "medium", "type": "text", "q": "Fill the gap in sentence three with one word. Die Schule ___ langweilig.", "answer": "ist", "accept": ["ist", "Ist"], "hint": "One single thing takes ist.", "explain": "The answer is ist. die Schule is one single thing, so the form of sein is ist, giving Die Schule ist langweilig. bin belongs with ich and bist belongs with du. Check the small word too, because it is die Schule and never der Schule.", "topic": "five sentences: Die Schule ist langweilig"}, {"id": "de15-putting-together:r-de15-3", "level": "medium", "type": "text", "q": "In Am Montag habe ich Deutsch, write the one word that sits in box three.", "answer": "ich", "accept": ["ich", "Ich"], "hint": "Am Montag is box one all on its own, and the verb is box two.", "explain": "The answer is ich. Am Montag is box one, habe is box two, so ich is box three. If you answered habe you counted Am and Montag as two separate boxes, and Am Montag is one single idea.", "topic": "five sentences: Am Montag habe ich Deutsch"}, {"id": "de15-putting-together:r-de15-4", "level": "medium", "type": "mc", "q": "Fill the gap in sentence five. Heute ___ ich Musik.", "options": ["hoere", "hoerst", "hoert"], "answer": "hoere", "hint": "The person is ich, so the ending is e.", "explain": "The answer is hoere. Heute is box one, the verb is box two and ich moves to box three, giving Heute hoere ich Musik. The person is still ich even though ich is not first, so the ending stays e. You may also see hoere written with two dots over the o.", "topic": "five sentences: Heute hoere ich Musik"}, {"id": "de15-putting-together:r-de15-5", "level": "medium", "type": "mc", "q": "Which two words go together for the brother?", "options": ["der Bruder", "die Bruder", "das Bruder"], "answer": "der Bruder", "hint": "Bruder is on the der list with Bus, Hund, Film, Freund, Vater and Tag.", "explain": "The answer is der Bruder. Bruder is a der word, so der Bruder is the pair you learn. Getting the noun right and the small word wrong scores nothing, which is why you learn the two words as one word.", "topic": "five sentences: producing der Bruder with its gender"}, {"id": "de15-putting-together:r-de15-6", "level": "stretch", "type": "text", "q": "In Heute hoere ich Musik, write the one word that is the second idea.", "answer": "hoere", "accept": ["hoere", "höre", "Hoere", "Höre"], "hint": "Heute is the first idea all on its own.", "explain": "The answer is hoere. Heute is the first idea, so hoere is the second, and that is exactly why the verb sits there instead of after ich. If you answered ich you have counted the person as the second idea, which is the error that produces Heute ich hoere Musik.", "topic": "five sentences: identifying the second idea"}]}, "hand": {"passage": "The train was already twenty minutes late when the announcement came. Nobody on the platform moved at first, because everybody was waiting to see whether anyone else believed it. An old man with a canvas bag folded his newspaper and started walking towards the stairs, and after that the rest of them followed, slowly, the way people do when they are pretending not to hurry. Outside, the taxi rank was empty. Rain had been falling since the middle of the afternoon and the road shone under the street lights like something spilled. A woman near the front of the queue said she had a connection to make in Crewe, and the man beside her said that everyone had somewhere to be.", "steps": ["Set a timer for exactly 3 minutes.", "Copy the passage into your book in your normal handwriting. Not your best, not your fastest. Normal.", "Stop dead when the timer goes. Do not finish the word.", "Count the words you wrote and type the number in."]}, "week": 5, "weekLabel": "Week 5", "version": "w5-2026-09-25"};

function poolFor(id){
  const pool=POOLS[id]||[]; if(!pool.length)return [];
  const qs=qsOf(id).filter(q=>q.type!=='long');
  const wrong=new Set(qs.filter(q=>S.ans[q.id]!==undefined&&isRight(q,S.ans[q.id])===false).map(q=>q.topic));
  const hit=pool.filter(q=>wrong.has(q.topic));
  const rest=pool.filter(q=>!wrong.has(q.topic));
  return (hit.length>=4?hit:hit.concat(rest)).slice(0,8);
}

  const qs=poolFor(id);
  const a=qs.filter(q=>S.rans[q.id]!==undefined);

/* ---------- marking ---------- */
function norm(s){
  var t=String(s==null?'':s).toLowerCase().trim().replace(/[‘’]/g,"'").replace(/[“”]/g,'"')
    .replace(/[£$€]/g,'').replace(/\s+/g,' ').replace(/[.!;]+$/,'').trim();
  /* A wrapping pair of brackets is not a wrong answer. (2a + 2b) is 2a + 2b. */
  var m=t.match(/^\((.*)\)$/);
  if(m&&m[1].indexOf('(')===-1&&m[1].indexOf(')')===-1)t=m[1].trim();
  return t;
}
function squash(s){return norm(s).replace(/\s+/g,'').replace(/[−–—]/g,'-')}
function isRight(q,g){
  if(q.type==='mc')return g===q.answer;
  if(q.type==='text'){
    const acc=(q.accept||[q.answer]).map(norm), gg=norm(g);
    if(acc.includes(gg))return true;
    if(acc.map(a=>a.replace(/\s+/g,'').replace(/[−–—]/g,'-')).includes(squash(g)))return true;
    var an=parseNum(q.answer),gn=parseNum(g);
    if(an!==null&&gn!==null&&Math.abs(an-gn)<1e-9)return true;
    return false;
  }
  return null;
}
function numeric(q){return q.type==='text'&&/^-?[\d.,\/\s]+$/.test(String(q.answer||''))}
function parseNum(s){
  if(s==null)return null;
  var t=String(s).toLowerCase().trim().replace(/[\u2212\u2013\u2014]/g,'-').replace(/,/g,'').replace(/[£$€]/g,'')
    .replace(/\s*(kilometres|kilometers|metres|meters|degrees|degree|km|cm|mm|m|c)\b\.?/g,'').trim();
  /* A unit written after a number is not a wrong answer. He put "7 mps" for 7 and lost
     the mark. Strip any trailing unit word or symbol once the number is already there. */
  var um=t.match(/^(-?\d+\s+\d+\s*\/\s*\d+|-?\d*\.?\d+(?:\s*\/\s*-?\d+)?)(?:\s*(?:[a-z][a-z\/%^0-9\u00b2\u00b3]*|[\^\u00b2\u00b3][0-9]*))?\.?$/);
  if(um)t=um[1].trim();
  if(!t)return null;
  var m=t.match(/^(-?\d+)\s+(\d+)\s*\/\s*(\d+)$/);
  if(m){var w=+m[1],nn=+m[2],d=+m[3];if(!d)return null;return w<0?w-nn/d:w+nn/d}
  m=t.match(/^(-?\d+)\s*\/\s*(-?\d+)$/);
  if(m){if(+m[2]===0)return null;return +m[1]/+m[2]}
  if(/^-?\d*\.?\d+$/.test(t))return parseFloat(t);
  return null;
}
function simplifyNote(q,g){
  if(!/simplest form/i.test(q.q||''))return '';
  var m=String(g||'').trim().match(/^(-?\d+)\s*\/\s*(\d+)$/);if(!m)return '';
  var a=Math.abs(+m[1]),b=Math.abs(+m[2]);if(!b)return '';
  var gcd=function(x,y){return y?gcd(y,x%y):x};
  if(gcd(a,b)<=1)return '';
  return '\n\nThat is the right value. The question asked for simplest form though, and '+m[1]+'/'+m[2]+' divides down to '+q.answer+'.';
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function isTest(id){return !!TESTS[id]}
function qsOf(id){

  const s=SESS[id];return s?s.questions.map(q=>({...q,_ex:s.extract||null})):[];
}
function titleOf(id){return isTest(id)?TESTS[id].title:(SESS[id]?SESS[id].subject+': '+SESS[id].title:id)}
function subjOf(id){return isTest(id)?(id==='s1-retest'?'Science':'Test'):(SESS[id]?SESS[id].subject:'')}
function scoreOf(id){
  const qs=qsOf(id).filter(q=>q.type!=='long');

function shrink(file){
  return new Promise(res=>{
    const r=new FileReader();
    r.onload=()=>{const img=new Image();img.onload=()=>{
      const m=1200,sc=Math.min(1,m/Math.max(img.width,img.height));
      const c=document.createElement('canvas');c.width=img.width*sc;c.height=img.height*sc;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      res(c.toDataURL('image/jpeg',0.7));
    };img.src=r.result};
    r.readAsDataURL(file);
  });
}

/* ---------- question ---------- */
function vQ(){
  const qs=qsOf(view.id),q=qs[view.i],test=isTest(view.id);
  document.getElementById('htitle').textContent=subjOf(view.id);
  const given=S.ans[q.id], marked=given!==undefined&&!test&&!view.retry;
  const right=marked?isRight(q,given):null;
  let h=`<div class="qmeta"><span>${test?esc(q._bl||'Test'):esc(q.level||'')}</span><span>Question ${view.i+1} of ${qs.length}</span></div>
    <div class="bar" style="margin:10px 0 4px"><i style="width:${view.i/qs.length*100}%"></i></div>`;
  if(q._ex)h+=`<details class="extract" ${view.i===0?'open':''}><summary><span>Reference</span><span class="faint" style="font-weight:400;text-transform:none;letter-spacing:0"> &middot; used by some questions here</span></summary><div>${esc(q._ex)}</div></details>`;
  h+=`<div class="q">${esc(q.q)}</div>`;
  if(q.type==='mc'){
    h+=`<div class="opts">`;
    q.options.forEach((o,i)=>{
      let cls='';
      if(marked){if(o===q.answer)cls='ok';else if(o===given)cls='no'}
      else if(given===o)cls='sel';
      h+=`<button class="opt ${cls}" data-pick="${esc(o)}" ${marked?'disabled':''}><span class="k">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`;
    });
    h+=`</div>`;
  }else if(q.type==='text'){
    h+=`<input type="text" id="ta" value="${esc(given||'')}" class="${marked?(right?'ok':'no'):''}" ${marked?'disabled':''} autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="${numeric(q)?'decimal':'text'}" placeholder="Your answer">`;
  }else{
    h+=`<textarea id="ta" placeholder="Write your answer...">${esc(S.long[q.id]||'')}</textarea>`;
    if(q.marks)h+=`<div class="faint" style="margin-top:8px">${q.marks} marks</div>`;
    h+=`<div class="faint" style="margin-top:6px">Keitan reads this one in full, and sees how long you took. Your own words, in your own head. Getting it wrong here is worth more than getting it right from somewhere else.</div>`;
  }
  if(view.hint&&!marked&&q.hint)h+=`<div class="hint"><b>Hint.</b> ${esc(q.hint)}</div>`;
  if(marked){
    h+=`<div class="fb ${right?'ok':'no'}"><b>${right?'Correct':'Not quite. The answer is '+esc(q.answer)}</b>${esc(q.explain)}${right?esc(simplifyNote(q,given)):''}</div>`;
    h+=`<button class="btn" id="next">${view.i+1<qs.length?'Next question':'Finish'}</button>`;
  }else if(q.type==='long'){
    h+=`<button class="btn" id="showmodel">Show the model answer</button>`;
    if(view.model)h+=`<div class="fb ok"><b>Model answer</b>${esc(q.answer)}

${esc(q.explain)}</div>`;
    h+=`<button class="btn ghost" id="next">${view.i+1<qs.length?'Next question':'Finish'}</button>`;
  }else{
    if(q.type!=='mc')h+=`<button class="btn" id="check">Check</button>`;
    if(!test&&q.hint&&!view.hint)h+=`<button class="btn ghost" id="hintbtn">Stuck? Get a hint</button>`;
    if(test)h+=`<button class="btn ${q.type==='mc'?'ghost':''}" id="next">${view.i+1<qs.length?'Next':'Finish'}</button>`;
  }
  return h;
}

function vRQ(){

    q.options.forEach((o,i)=>{

    h+=`</div>`;
  }else{
    h+=`<input type="text" id="ta" value="${esc(given||'')}" class="${marked?(right?'ok':'no'):''}" ${marked?'disabled':''} autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="${numeric(q)?'decimal':'text'}" placeholder="Your answer">`;
  }

function vRRes(){
  const id=view.id, first=scoreOf(id), again=retryScore(id);
  const fp=first.total?Math.round(first.right/first.total*100):0;
  const rp=again.total?Math.round(again.right/again.total*100):0;
  document.getElementById('htitle').textContent='More practice';
  const up=rp>=fp;
  let h=`<div class="card band"><div class="big ${up?'ok':''}">${again.right}<span style="color:var(--faint);font-size:26px">/${again.total}</span></div>
    <div class="lbl">Extra practice on what you got wrong</div>
    <div class="lbl" style="margin-top:14px">First time: ${fp}% &middot; This time: <b>${rp}%</b></div></div>`;
  h+=`<div class="card tight"><div class="small muted">${up
    ? 'That is the whole point. You got those wrong less than an hour ago and you have just got them right, which means it went in rather than passing through.'

  if(qs.length){
    h+=`<div class="card"><h3>Still wrong</h3>`;
    qs.forEach(q=>{h+=`<div class="rev"><div class="qt">${esc(q.q)}</div>
      <div class="ans">You put: <b class="no">${esc(S.rans[q.id]||'(blank)')}</b></div>
      <div class="ans">Answer: <b class="ok">${esc(q.answer)}</b></div>
      <div class="exp">${esc(q.explain)}</div></div>`});
    h+=`</div>`;
  }
  h+=`<button class="btn" data-go='${JSON.stringify({name:'day',day:view.day})}'>Back to ${DAYS.find(d=>d.key===view.day).label}</button>`;

function vRes(){
  const id=view.id,qs=qsOf(id).filter(q=>q.type!=='long'),sc=scoreOf(id);
  document.getElementById('htitle').textContent=subjOf(id);
  const pct=sc.total?Math.round(sc.right/sc.total*100):0;
  let h=`<div class="card band"><div class="big ${pct>=70?'ok':''}">${sc.right}<span style="color:var(--faint);font-size:26px">/${sc.total}</span></div>
    <div class="lbl">${esc(titleOf(id))}</div></div>`;
  if(id==='s1-retest'){
    let ceil=null;
    for(const b of TESTS[id].bands){
      const a=b.questions.filter(q=>S.ans[q.id]!==undefined);
      if(!a.length)break;
      if(a.filter(q=>isRight(q,S.ans[q.id])===true).length>=3)ceil=b.label; else break;
    }
    h+=`<div class="card tight"><div class="small muted">Highest band cleared: <b>${ceil?esc(ceil):'none'}</b>. This is the number that settles whether your 82% at school was real.</div></div>`;
  }
  const ok=new Set(),no=new Set();
  qs.forEach(q=>{if(S.ans[q.id]!==undefined)(isRight(q,S.ans[q.id])===true?ok:no).add(q.topic)});
  no.forEach(t=>ok.delete(t));
  if(no.size)h+=`<div class="card"><h3>Still to fix</h3><div class="topics">${[...no].map(t=>`<span class="tp no">${esc(t)}</span>`).join('')}</div></div>`;
  if(ok.size)h+=`<div class="card"><h3>Got it</h3><div class="topics">${[...ok].map(t=>`<span class="tp ok">${esc(t)}</span>`).join('')}</div></div>`;
  const wrong=qs.filter(q=>S.ans[q.id]!==undefined&&isRight(q,S.ans[q.id])===false);
  if(wrong.length){
    h+=`<div class="card"><h3>Go through these</h3>`;
    wrong.forEach(q=>{h+=`<div class="rev"><div class="qt">${esc(q.q)}</div>
      <div class="ans">You put: <b class="no">${esc(S.ans[q.id]||'(blank)')}</b></div>
      <div class="ans">Answer: <b class="ok">${esc(q.answer)}</b></div>
      <div class="exp">${esc(q.explain)}</div></div>`});
    h+=`</div>`;
  }
  const extra=poolFor(id);
  if(extra.length&&wrong.length){
    const doneR=S.rdone[id], rs=retryScore(id);
    h+=`<div class="card"><h3>${doneR?'You have already done the extra practice':'Want to prove you have got it?'}</h3>
      <p class="muted small" style="margin:8px 0 0">${doneR
        ? 'You scored '+rs.right+' out of '+rs.total+' on those.'
        : extra.length+' more questions, aimed at exactly the topics you just got wrong. Different questions, same ideas. This is the bit that tells you whether it went in.'}</p>
      <button class="btn ${doneR?'ghost':''}" data-go='${JSON.stringify({name:'rq',day:view.day,id:id,i:0})}'>${doneR?'Look again':'Give me more questions'}</button></div>`;
  }
  h+=`<button class="btn ghost" data-go='${JSON.stringify({name:'day',day:view.day})}'>Back to ${DAYS.find(d=>d.key===view.day).label}</button>`;
  return h;
}

function vReview(){
  document.getElementById('htitle').textContent='End of week review';
  let all=[];
  DAYS.forEach(d=>d.blocks.forEach(b=>{if(b.kind==='review')return;
    qsOf(b.id).forEach(q=>{if(q.type!=='long'&&S.ans[q.id]!==undefined&&isRight(q,S.ans[q.id])===false)all.push({q:q,s:subjOf(b.id)})})}));
  let h=`<h1>End of week review</h1>
  <div class="nb"><b>Out loud, with Keitan.</b> For each one: say what you did, then say what you should have done. If you cannot explain it, you have not got it yet.</div>`;
  if(!all.length)h+=`<div class="card"><p>Nothing wrong to review. Either a very good week or the sessions have not been done yet.</p></div>`;
  else{
    const by={};all.forEach(x=>{(by[x.s]=by[x.s]||[]).push(x.q)});
    Object.keys(by).forEach(s=>{
      h+=`<div class="card"><h3>${esc(s)} <span class="faint">${by[s].length}</span></h3>`;
      by[s].forEach(q=>{h+=`<div class="rev"><div class="qt">${esc(q.q)}</div>
        <div class="ans">You put: <b class="no">${esc(S.ans[q.id]||'(blank)')}</b></div>
        <div class="ans">Answer: <b class="ok">${esc(q.answer)}</b></div>

function summary(){
  let o='SURAJ OS - WEEK 2\n\n';
  DAYS.forEach(d=>{
    o+=d.label.toUpperCase()+'\n';
    d.blocks.forEach(b=>{
      if(b.kind==='review'){o+='  Review: '+(S.done[b.id]?'done':'not done')+'\n';return}
      const sc=scoreOf(b.id);
      if(!sc.answered){o+='  '+titleOf(b.id)+': not started\n';return}
      const qs=qsOf(b.id).filter(q=>q.type!=='long');
      const wrong=qs.filter(q=>S.ans[q.id]!==undefined&&isRight(q,S.ans[q.id])===false);
      o+='  '+titleOf(b.id)+': '+sc.right+'/'+sc.total;
      if(wrong.length)o+='  | still wrong: '+[...new Set(wrong.map(q=>q.topic))].join('; ');
      o+='\n';
    });
    o+='\n';
  });
  const H=S.hand||{};
  o+='HANDWRITING\n  Speed Up! done: '+DAYS.filter(d=>H[d.key]).length+'/5\n';
  o+='  3 min copy: '+(H.words||'-')+' words'+(H.words?' ('+Math.round(H.words/3)+' wpm)':'')+'\n';
  o+='  Readable: '+(H.legible||'-')+' | Ache: '+(H.ache||'-')+'\n\n';
  o+='READING\n  Book: '+(S.reading.book||'-')+'\n  Pages: '+DAYS.map(d=>d.label.slice(0,3)+' '+((S.reading[d.key]||{}).pages||'0')).join(', ')+'\n';
  if(S.reading.notes)o+='  His summary: '+S.reading.notes+'\n';
  o+='\nEXTENDED WRITING\n';
  Object.keys(S.long).forEach(k=>{const t=(S.long[k]||'').trim();if(t)o+='  ['+k+'] '+t.split(/\s+/).length+' words\n  ---\n'+t+'\n  ---\n'});
  return o;
}

/* ---------- events ---------- */
function wire(){
  document.querySelectorAll('[data-go]').forEach(el=>{el.onclick=()=>go(JSON.parse(el.getAttribute('data-go')))});
  document.querySelectorAll('[data-pick]').forEach(el=>{el.onclick=()=>{
    const q=qsOf(view.id)[view.i];S.ans[q.id]=el.getAttribute('data-pick');save();
    if(isTest(view.id))setTimeout(advance,130);else{view.hint=false;render()}
  }});
  const ck=document.getElementById('check');
  if(ck)ck.onclick=()=>{const q=qsOf(view.id)[view.i],ta=document.getElementById('ta');
    if(!ta.value.trim()){ta.focus();return}S.ans[q.id]=ta.value;save();view.hint=false;render()};
  bindHonesty();
  document.querySelectorAll('[data-rpick]').forEach(el=>{el.onclick=()=>{
    const q=poolFor(view.id)[view.i];S.rans[q.id]=el.getAttribute('data-rpick');save();view.hint=false;render()}});
  const rc=document.getElementById('rcheck');
  if(rc)rc.onclick=()=>{const q=poolFor(view.id)[view.i],ta=document.getElementById('ta');
    if(!ta.value.trim()){ta.focus();return}S.rans[q.id]=ta.value;save();view.hint=false;render()};
  const rn=document.getElementById('rnext');
  if(rn)rn.onclick=()=>{
    const qs=poolFor(view.id);
    if(view.i+1<qs.length)go({name:'rq',day:view.day,id:view.id,i:view.i+1,hint:false});
    else{S.rdone[view.id]=true;save();pushRetry(view.id);go({name:'rres',day:view.day,id:view.id})}
  };
  const hb=document.getElementById('hintbtn');
  if(hb)hb.onclick=()=>{view.hint=true;render()};
  const sm=document.getElementById('showmodel');
  if(sm)sm.onclick=()=>{const q=qsOf(view.id)[view.i],ta=document.getElementById('ta');
    const t=TRACK[view.id]; if(t){t.model++; if(!ta||ta.value.trim().length<40)t.modelEarly++}
    if(ta)S.long[q.id]=ta.value;save();view.model=true;render()};
  const nx=document.getElementById('next');
  if(nx)nx.onclick=()=>{
    const q=qsOf(view.id)[view.i],ta=document.getElementById('ta');
    if(ta){if(q.type==='long')S.long[q.id]=ta.value;else if(isTest(view.id))S.ans[q.id]=ta.value;save()}
    advance();
  };
  const rd=document.getElementById('revdone');
  if(rd)rd.onclick=()=>{const d=DAYS.find(x=>x.key===view.day);const b=d.blocks.find(x=>x.kind==='review');
    if(b){S.done[b.id]=true;save();push('review',{done:true})}go({name:'day',day:view.day})};
  document.querySelectorAll('[data-read]').forEach(el=>{el.onchange=el.oninput=()=>{
    const k=el.getAttribute('data-read'),f=el.getAttribute('data-f');
    if(f==='book')S.reading.book=el.value;else if(f==='notes')S.reading.notes=el.value;
    else{S.reading[k]=S.reading[k]||{};S.reading[k].pages=el.value}save();pushDaily()}});
  document.querySelectorAll('[data-hand]').forEach(el=>{el.onclick=()=>{
    const k=el.getAttribute('data-hand');S.hand[k]=!S.hand[k];save();pushDaily();render()}});
  document.querySelectorAll('[data-hand2]').forEach(el=>{el.onchange=el.oninput=()=>{
    S.hand[el.getAttribute('data-hand2')]=el.value;save();pushDaily()}});
  document.querySelectorAll('[data-cfg]').forEach(el=>{el.onchange=el.oninput=()=>{
    CFG[el.getAttribute('data-cfg')]=el.value;S.cfg=CFG;saveCfg();save()}});
  const cc=document.getElementById('checkc');
  if(cc)cc.onclick=()=>checkContent(true);
  const ts=document.getElementById('testsync');
  if(ts)ts.onclick=async()=>{ts.textContent='Sending...';
    const ok=await push('test',{message:'Hello from the Study OS'});
    ts.textContent=ok?'Sent, check the sheet':'Failed, check the URL'};
  const cp=document.getElementById('copy');
  if(cp)cp.onclick=()=>{const t=summary();
    if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>{cp.textContent='Copied';setTimeout(()=>cp.textContent='Copy summary',1500)})};
  document.querySelectorAll('[data-shotadd]').forEach(el=>{el.onchange=async()=>{
    const k=el.getAttribute('data-shotadd'),f=el.files&&el.files[0];if(!f)return;
    const b64=await shrink(f);
    PHOTOS[k]=PHOTOS[k]||[];PHOTOS[k].push(b64);render();
    const ok=await push('photo',{day:k,image:b64});
    if(ok){S.shots[k]=(S.shots[k]||0)+1;save()}
    else alert('That photo did not send. Check the sync setting, then try again.');
    render()}});
}
function advance(){
  const qs=qsOf(view.id);
  if(view.i+1<qs.length)go({name:'q',day:view.day,id:view.id,i:view.i+1,hint:false,model:false});
  else{S.done[view.id]=true;save();pushSession(view.id);go({name:'res',day:view.day,id:view.id})}
}
function bindContent(){SESS=P.sessions;TESTS=P.tests;DAYS=P.days;BOOKS=P.books;HAND=P.hand;
  VER=P.version||'w0';S=store.get()||{};
  S.ans=S.ans||{};S.done=S.done||{};S.reading=S.reading||{};S.hand=S.hand||{};
  S.shots=S.shots||{};S.long=S.long||{};S.rans=S.rans||{};S.rdone=S.rdone||{};S.cfg=CFG;}
let CFG={};
try{CFG=JSON.parse(localStorage.getItem('surajOS_cfg')||'{}')}catch(e){}
if(!CFG.sync&&S.cfg&&S.cfg.sync)CFG.sync=S.cfg.sync;           /* carry over the old location */
S.cfg=CFG;
function saveCfg(){try{localStorage.setItem('surajOS_cfg',JSON.stringify(CFG))}catch(e){}}

let CHECKING=false;
function checkContent(loud){
  const url=(CFG.sync||'').trim(); if(!url){if(loud)alert('Add the sync link in Settings first.');return}
  CHECKING=true;render();
  jsonp(url,'want=version&',8000,v=>{
    if(!v||!v.version){finish(loud?'Nothing released yet.':null);return}
    /* Only ever move FORWARD. Version strings sort correctly (w3-2026-08-13 <
       w4-2026-08-24), so a release that is the same age or older than the week
       already loaded is ignored. Without this, a page shipped with a newer week
       built in gets dragged back to whatever the release file still holds. */
    if(v.version<=VER){finish(loud?'Already on the latest.':null);return}
    jsonp(url,'want=content&',45000,r=>{
      const c=r&&r.content;
      if(!c||c.error){finish(loud?('Could not read the new work. '+(c&&c.error?c.error:'')):null);return}
      if(!c.version||c.version<=VER){finish(loud?'Already on the latest.':null);return}
      P=c;try{localStorage.setItem('surajOS_content',JSON.stringify(c))}catch(e){}
      bindContent();view={name:'home'};
      finish(loud?('Updated to '+(c.weekLabel||c.version)+'.'):null);
    });
  });
  function finish(msg){CHECKING=false;if(loud&&msg)alert(msg);render()}
}
function jsonp(url,qs,ms,fn){
  const cb='__c'+Math.floor(Math.random()*1e9);
  const sc=document.createElement('script');
  let done=false;
  const end=(d)=>{if(done)return;done=true;try{delete window[cb]}catch(_){}sc.remove();clearTimeout(t);fn(d)};
  window[cb]=end;
  const t=setTimeout(()=>end(null),ms);
  sc.onerror=()=>end(null);
  sc.src=url+(url.indexOf('?')>-1?'&':'?')+qs+'callback='+cb+'&t='+Date.now();
  document.body.appendChild(sc);
}
bindContent();
if(S.cfg.sync)setDot('on');
render();
checkContent(false);
</script></body></html>
