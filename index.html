 so it changes once. Sulfur passes its melting point of 115 but never reaches 445, so it changes once. Water is the only one that changes twice.","topic":"science: using the table to count changes of state over a heating range"},{"id":"s11-particles-state-changes:q11","level":"stretch","type":"mc","q":"A substance that is not in the table is liquid at 25 degrees C and solid at minus 5 degrees C. What can you say for certain about its melting point?","options":["It is somewhere between minus 5 and 25 degrees C","It is exactly 0 degrees C","It is above 25 degrees C","It is below minus 5 degrees C"],"answer":"It is somewhere between minus 5 and 25 degrees C","hint":"Work backwards from the two states. The melting point has to sit between a temperature where it is solid and a temperature where it is liquid.","explain":"Work backwards from what you are told. It is solid at minus 5, so it has not melted by minus 5, which means the melting point is higher than minus 5. It is liquid at 25, so it has already melted by 25, which means the melting point is lower than 25. Put those two together and the melting point sits somewhere between minus 5 and 25 degrees C. You cannot pin it to exactly 0, because 0 is the melting point of water and this substance is not water. A melting point above 25 would make it solid at 25, and one below minus 5 would make it liquid at minus 5, so both of those contradict what you were given.","topic":"science: working backwards from two states to pin down a changeover temperature"},{"id":"s11-particles-state-changes:q12","level":"stretch","type":"text","q":"Using the table, one substance is a liquid at 20 degrees C and a gas at 90 degrees C. Write its name.","answer":"ethanol","accept":["ethanol","Ethanol","ethanol."],"hint":"You need a boiling point that sits between 20 and 90, and a melting point below 20.","explain":"You are looking for a substance whose boiling point sits between 20 and 90 degrees C, with a melting point below 20. Ethanol melts at minus 114 and boils at 78. At 20 degrees C it is between those two numbers, so it is liquid. At 90 degrees C it is above 78, so it is a gas. Oxygen boils at minus 183, so it is already a gas at both temperatures. Water boils at 100, so it is still liquid at 90. Mercury boils at 357, so it is liquid at both. Sulfur melts at 115, so it is solid at both. Ethanol is the only one that changes between those two temperatures.","topic":"science: reading a state off a melting and boiling point table"}]},"de16-genders-again":{"id":"de16-genders-again","day":"Day 1","subject":"German","title":"Genders, the two word habit","minutes":10,"objective":"Store and write every noun with its gender word attached, and fix a wrong gender in somebody else's sentence.","extract":null,"teach":{"intro":["A German noun is never one word. It is two. Not Hund, der Hund. Not Schule, die Schule. If you store the noun on its own you end up guessing later, and guessing is how die Buch and der Schule happen.","There is no trick that tells you which gender word to use. You store the pair. Say the two words together every time and the pair sticks instead of the single word.","Five new nouns this week: der Lehrer, die Katze, das Handy, die Woche, der Park. Two new verbs as well, sagen and kaufen, and they take the same endings as spielen, so ich sage, du sagst, er sagt."],"example":{"problem":"A pupil wrote: Die Buch ist langweilig. Write the sentence out correctly.","steps":["Find the noun. It is Buch.","Buch is a das noun, so the gender word has to be das, not die.","Swap die for das and change nothing else. The verb ist stays where it is.","Das Buch ist langweilig."],"answer":"Das Buch ist langweilig."},"example2":{"problem":"A pupil wrote: Der Schule ist gross. Write the sentence out correctly.","steps":["The noun is Schule.","Schule is a die noun, so der is wrong.","Swap der for die and leave ist gross alone.","Die Schule ist gross."],"answer":"Die Schule ist gross."},"keyfact":"Store der Hund, die Schule and das Buch as pairs, because the noun on its own tells you nothing about its gender word."},"questions":[{"id":"de16-genders-again:q1","level":"easy","type":"mc","q":"Which one of these is written correctly?","options":["der Hund","die Hund","das Hund"],"answer":"der Hund","hint":"You had this one last week. Dogs go with der.","explain":"Hund is a der noun, so the pair is der Hund. The other two use the wrong gender word.","topic":"german: the gender word for a der noun"},{"id":"de16-genders-again:q2","level":"easy","type":"mc","q":"Which one of these four has the right gender word in front of it?","options":["die Hund","der Schule","die Woche","der Pizza"],"answer":"die Woche","hint":"Three of these use a gender word that belongs to a different noun.","explain":"Woche is a die noun, so die Woche is right. The others should be der Hund, die Schule and die Pizza.","topic":"german: picking the correct noun and gender pair from four"},{"id":"de16-genders-again:q3","level":"easy","type":"text","q":"Write the gender word that goes in front of Handy.","answer":"das","accept":["das","Das"],"hint":"Handy is one of this week's new nouns. It is not a der noun and it is not a die noun.","explain":"Handy is a das noun, so the pair is das Handy. Store the two words together, not Handy on its own.","topic":"german: the gender word for a das noun"},{"id":"de16-genders-again:q4","level":"medium","type":"mc","q":"A pupil wrote: Die Buch ist neu. What is wrong with it?","options":["The gender word is wrong, Buch takes das","The verb ist is wrong, it should be bin","neu has to go in front of Buch","Nothing is wrong"],"answer":"The gender word is wrong, Buch takes das","hint":"Look at the noun first, then ask which gender word belongs to it.","explain":"Buch is a das noun, so the sentence should read Das Buch ist neu. The verb ist is correct for one thing, and neu sits after ist, which is where it belongs. The only wrong move is die in front of Buch.","topic":"german: marking a wrong gender in a pupil sentence"},{"id":"de16-genders-again:q5","level":"medium","type":"text","q":"A pupil wrote: Der Schule ist langweilig. Write the whole sentence out correctly.","answer":"Die Schule ist langweilig.","accept":["Die Schule ist langweilig.","Die Schule ist langweilig","die Schule ist langweilig","die Schule ist langweilig.","die schule ist langweilig","die schule ist langweilig."],"hint":"Only the gender word changes. Leave the rest as it is.","explain":"Schule is a die noun, so der is the wrong gender word. The correct sentence is Die Schule ist langweilig. Nothing else moves, because the verb ist is already in box two.","topic":"german: correcting a wrong gender and rewriting the sentence"},{"id":"de16-genders-again:q6","level":"medium","type":"mc","q":"A pupil has a list of twenty German nouns with no gender words written next to them. What will go wrong when he writes a sentence?","options":["He will have to guess the gender word, so he will sometimes write die Buch or der Schule","Nothing, because gender words are optional in German","He will put the verb in the wrong box","He will spell the nouns wrongly"],"answer":"He will have to guess the gender word, so he will sometimes write die Buch or der Schule","hint":"He knows what the nouns mean. What does he not know?","explain":"The meaning is only half of a German noun. Without the gender word stored next to it he has to guess between der, die and das every time he writes, and a guess is right about one time in three. That is exactly how die Buch and der Schule get written.","topic":"german: why a noun learned without its gender word fails"},{"id":"de16-genders-again:q7","level":"medium","type":"text","q":"A pupil wrote: Das Katze ist klein. Write the whole sentence out correctly.","answer":"Die Katze ist klein.","accept":["Die Katze ist klein.","Die Katze ist klein","die Katze ist klein","die Katze ist klein.","die katze ist klein","die katze ist klein."],"hint":"Katze is one of this week's new nouns. Which gender word did it come with?","explain":"Katze is a die noun, so the pair is die Katze. The correct sentence is Die Katze ist klein. The pupil used das, which belongs to nouns like Buch and Handy.","topic":"german: correcting a wrong gender and rewriting the sentence"},{"id":"de16-genders-again:q8","level":"medium","type":"mc","q":"A pupil wrote: Der Handy ist neu. Which word has to change, and what to?","options":["Der has to change to das","Der has to change to die","ist has to change to bin","neu has to change to gross"],"answer":"Der has to change to das","hint":"Find the noun, then find its gender word.","explain":"Handy is a das noun, so the sentence should read Das Handy ist neu. ist is the right verb for one thing, and neu is the right word for new, so neither of those is the problem.","topic":"german: naming which word must change in a wrong gender sentence"},{"id":"de16-genders-again:q9","level":"stretch","type":"text","q":"A pupil wrote: Heute ist die Buch langweilig. One word is wrong. Write the whole sentence out correctly.","answer":"Heute ist das Buch langweilig.","accept":["Heute ist das Buch langweilig.","Heute ist das Buch langweilig","heute ist das Buch langweilig","heute ist das Buch langweilig.","heute ist das buch langweilig","heute ist das buch langweilig."],"hint":"Check the boxes first. Heute is box one and ist is box two, so the order is already right.","explain":"The word order is correct, because Heute is one box and the verb ist comes straight after it. The only wrong word is die, because Buch is a das noun. The sentence should read Heute ist das Buch langweilig.","topic":"german: correcting a wrong gender inside a time phrase sentence"},{"id":"de16-genders-again:q10","level":"stretch","type":"mc","q":"Two pupils are storing the word Katze. Pupil A writes Katze equals cat in his book. Pupil B writes die Katze equals the cat. Both can say what Katze means. Who will write a correct German sentence later, and why?","options":["Pupil B, because the gender word is stored with the noun","Pupil A, because a shorter note is easier to learn","Both, because the gender word can be worked out from the meaning","Neither, because the gender word changes once the noun is in a sentence"],"answer":"Pupil B, because the gender word is stored with the noun","hint":"Ask what each pupil has in front of him when he has to write Die Katze ist klein.","explain":"Pupil A only stored the meaning, so when he writes a sentence he has to guess between der, die and das. Pupil B stored the pair, so he already has die. The gender word cannot be worked out from the meaning, and it does not change when the noun is the thing doing something in a sentence.","topic":"german: choosing how to record a new noun"}]},"de17-verb-second-pressure":{"id":"de17-verb-second-pressure","day":"Day 2","subject":"German","title":"The verb is still second","minutes":10,"objective":"Keep the verb in box two in every sentence, including ones that start with a time phrase, and fix a pupil sentence where the verb has slipped to box three.","extract":null,"teach":{"intro":["Box up each idea. A German sentence is a row of boxes and the verb lives in box two. Not the second word, the second box. Am Montag is one box, both words of it.","Ich spiele Fussball has ich in box one and spiele in box two. Put a time phrase at the front and the time phrase takes box one, so ich gets pushed behind the verb. The boxes then run Am Montag / habe / ich / Deutsch, and written out as a sentence that is Am Montag habe ich Deutsch.","The error to watch for is Am Montag ich habe Deutsch. That has two boxes in front of the verb, Am Montag and ich, and only one box is allowed in front. If a time phrase is at the front, the verb comes next and ich follows the verb."],"example":{"problem":"Put these boxes into the right order and write the sentence: ich, Fussball, Am Freitag, spiele.","steps":["Am Freitag is the time phrase, so it takes box one.","The verb is spiele, so it goes in box two.","ich comes straight after the verb, in box three.","Fussball goes last.","Am Freitag spiele ich Fussball."],"answer":"Am Freitag spiele ich Fussball."},"example2":{"problem":"A pupil wrote: Heute ich hoere Musik. Write the sentence out correctly, starting with Heute.","steps":["Heute is a time phrase, so it is box one.","Count what sits in front of the verb hoere. Heute and ich, which is two boxes. Only one is allowed.","Push ich behind the verb, so hoere takes box two and ich takes box three.","Heute hoere ich Musik."],"answer":"Heute hoere ich Musik."},"keyfact":"Only one box goes in front of the verb, so a time phrase at the front pushes ich behind the verb."},"questions":[{"id":"de17-verb-second-pressure:q1","level":"easy","type":"mc","q":"In Ich spiele Fussball, which box is the verb spiele in?","options":["Box one","Box two","Box three"],"answer":"Box two","hint":"Count the boxes from the left. Ich is box one.","explain":"Ich is box one, spiele is box two, Fussball is box three. The verb is in box two, which is where it belongs.","topic":"german: finding which box the verb is in"},{"id":"de17-verb-second-pressure:q2","level":"easy","type":"mc","q":"Which one of these is written correctly?","options":["Am Montag habe ich Deutsch.","Am Montag ich habe Deutsch.","Ich am Montag habe Deutsch.","Habe am Montag ich Deutsch."],"answer":"Am Montag habe ich Deutsch.","hint":"Count how many boxes sit in front of the verb habe in each one.","explain":"Only Am Montag habe ich Deutsch. has one box in front of the verb. Am Montag ich habe Deutsch. and Ich am Montag habe Deutsch. both have two boxes in front of habe. Habe am Montag ich Deutsch. puts the verb in box one, which is what you do in a question, not a statement.","topic":"german: picking the correct order after a time phrase"},{"id":"de17-verb-second-pressure:q3","level":"easy","type":"text","q":"Put these boxes into the right order and write the sentence. Start with Heute. Boxes: ich, Musik, Heute, hoere.","answer":"Heute hoere ich Musik.","accept":["Heute hoere ich Musik.","Heute hoere ich Musik","Heute höre ich Musik","Heute höre ich Musik.","heute hoere ich Musik","heute hoere ich Musik.","heute hoere ich musik","heute hoere ich musik.","heute höre ich Musik","heute höre ich Musik.","heute höre ich musik","heute höre ich musik."],"hint":"Time phrase first, then the verb, then ich.","explain":"Heute takes box one. The verb hoere takes box two. ich is pushed behind the verb into box three, and Musik goes last. Heute hoere ich Musik.","topic":"german: ordering boxes into a sentence starting with a time phrase"},{"id":"de17-verb-second-pressure:q4","level":"medium","type":"mc","q":"A pupil wrote: Am Freitag ich spiele Fussball. What is wrong with it?","options":["Two boxes sit in front of the verb, so spiele has to come straight after Am Freitag","The time phrase should go at the end of the sentence","spiele should be spielst","Fussball needs a gender word in front of it"],"answer":"Two boxes sit in front of the verb, so spiele has to come straight after Am Freitag","hint":"Count the boxes in front of the verb.","explain":"Am Freitag is box one and ich is box two, so the verb has been pushed into box three. Only one box is allowed in front of the verb. The correct sentence is Am Freitag spiele ich Fussball. The ending on spiele is right for ich, and a bare noun like Fussball needs no gender word here.","topic":"german: marking a verb pushed to box three"},{"id":"de17-verb-second-pressure:q5","level":"medium","type":"text","q":"A pupil wrote: Morgen ich lerne Deutsch. Write the whole sentence out correctly, starting with Morgen.","answer":"Morgen lerne ich Deutsch.","accept":["Morgen lerne ich Deutsch.","Morgen lerne ich Deutsch","morgen lerne ich Deutsch","morgen lerne ich Deutsch.","morgen lerne ich deutsch","morgen lerne ich deutsch."],"hint":"Morgen keeps box one. Something has to move out of box two.","explain":"Morgen is a time phrase, so it holds box one. The verb lerne has been pushed to box three by ich. Move the verb into box two and ich goes behind it. Morgen lerne ich Deutsch.","topic":"german: correcting a verb pushed to box three"},{"id":"de17-verb-second-pressure:q6","level":"medium","type":"mc","q":"You want to start a sentence with Am Samstag. What has to come straight after it?","options":["The verb","ich","The noun","Nothing changes, the order stays the same"],"answer":"The verb","hint":"Am Samstag is one box, and it has taken box one.","explain":"Am Samstag fills box one, so the verb has to be next, in box two. ich then comes after the verb. Am Samstag spiele ich Fussball.","topic":"german: what comes straight after a time phrase"},{"id":"de17-verb-second-pressure:q7","level":"medium","type":"text","q":"Write this in German, starting with Am Samstag: on Saturday I play football.","answer":"Am Samstag spiele ich Fussball.","accept":["Am Samstag spiele ich Fussball.","Am Samstag spiele ich Fussball","Am Samstag spiele ich Fußball","Am Samstag spiele ich Fußball.","am Samstag spiele ich Fussball","am Samstag spiele ich Fussball.","am Samstag spiele ich Fußball","am Samstag spiele ich Fußball.","am samstag spiele ich fussball","am samstag spiele ich fussball.","am samstag spiele ich fußball","am samstag spiele ich fußball."],"hint":"Time phrase, verb, ich, then the noun.","explain":"Am Samstag is box one. The ich form of spielen is spiele, and it goes in box two. ich follows the verb in box three, and Fussball goes last. Am Samstag spiele ich Fussball.","topic":"german: writing a sentence that starts with a time phrase"},{"id":"de17-verb-second-pressure:q8","level":"medium","type":"mc","q":"A pupil wrote: Heute spielt ich Fussball. One word is wrong. Which one, and what should it be?","options":["spielt, it should be spiele","Heute, it should go at the end","ich, it should be du","Fussball, it should have a gender word in front"],"answer":"spielt, it should be spiele","hint":"The boxes are in the right order this time, so check the ending on the verb.","explain":"Heute is box one and the verb is in box two, so the order is correct. The ending is the wrong move. With ich the ending is e, so it is spiele, not spielt. spielt goes with er or sie. Heute spiele ich Fussball.","topic":"german: marking a wrong verb ending after a time phrase"},{"id":"de17-verb-second-pressure:q9","level":"stretch","type":"text","q":"A pupil wrote: Am Montag ich habe Deutsch. Write the whole sentence out correctly, starting with Am Montag.","answer":"Am Montag habe ich Deutsch.","accept":["Am Montag habe ich Deutsch.","Am Montag habe ich Deutsch","am Montag habe ich Deutsch","am Montag habe ich Deutsch.","am montag habe ich deutsch","am montag habe ich deutsch."],"hint":"Am Montag is one box, not two. Count what is in front of habe.","explain":"Am Montag is box one and ich has taken box two, which pushes the verb habe into box three. Only one box is allowed in front of the verb, so habe moves to box two and ich goes behind it. Am Montag habe ich Deutsch.","topic":"german: correcting a verb pushed to box three"},{"id":"de17-verb-second-pressure:q10","level":"stretch","type":"mc","q":"You wrote Heute hoere ich Musik. A friend says Heute ich hoere Musik is also fine because the words mean the same thing. Who is right, and why?","options":["You are, because only one box is allowed in front of the verb","Your friend is, because German word order is free","Both are fine, because the meaning is the same either way","Neither, because the time phrase has to go at the end"],"answer":"You are, because only one box is allowed in front of the verb","hint":"The rule is about boxes, not about meaning.","explain":"German puts the verb in box two in a statement, and that is a rule about position, not about meaning. Heute ich hoere Musik has two boxes in front of hoere, so it breaks the rule. Heute hoere ich Musik is the correct version, and a time phrase at the front is normal, not something to be moved to the end.","topic":"german: why only one box can go in front of the verb"}]},"de18-asking-questions":{"id":"de18-asking-questions","day":"Day 3","subject":"German","title":"Asking, verb first","minutes":10,"objective":"Turn a du statement into a yes or no question by putting the verb first, and fix a pupil question where the verb is still in box two.","extract":null,"teach":{"intro":["To ask a yes or no question in German, the verb moves to the front. Du spielst Fussball is a statement. Spielst du Fussball? is a question. The same two words, swapped round.","The ending stays with du when the verb moves. Spielst, wohnst, trinkst, lernst, hoerst, machst, kaufst, sagst. The st does not fall off just because the verb has gone to the front.","haben and sein are the two odd ones and you have to know them. Hast du heute Deutsch? Bist du gross? Everything else follows the st pattern."],"example":{"problem":"Turn Du wohnst in Wolverhampton into a yes or no question.","steps":["Find the verb. It is wohnst.","Move it in front of du, so it takes box one.","Keep the st ending on it, because it still goes with du.","Put a question mark at the end.","Wohnst du in Wolverhampton?"],"answer":"Wohnst du in Wolverhampton?"},"example2":{"problem":"A pupil wrote: Du trinkst Wasser? Write the question out correctly.","steps":["The words are right but the order is statement order, with du in box one.","In a yes or no question the verb comes first, in front of du.","Swap trinkst and du. The ending stays st.","Trinkst du Wasser?"],"answer":"Trinkst du Wasser?"},"keyfact":"For a yes or no question the verb goes first and du comes straight after it, with the st ending still on the verb."},"questions":[{"id":"de18-asking-questions:q1","level":"easy","type":"mc","q":"Which one of these is a question?","options":["Spielst du Fussball?","Du spielst Fussball.","Fussball du spielst?"],"answer":"Spielst du Fussball?","hint":"Look at which word is at the front.","explain":"Spielst du Fussball? has the verb at the front, which is what makes it a yes or no question. Du spielst Fussball. is a statement. Fussball du spielst? puts the noun at the front and the verb third, which is not a German question.","topic":"german: telling a question from a statement"},{"id":"de18-asking-questions:q2","level":"easy","type":"mc","q":"In a German yes or no question, where does the verb go?","options":["First","Second","Third","Last"],"answer":"First","hint":"Think about Spielst du Fussball?","explain":"In a yes or no question the verb takes box one and du comes straight after it. In a statement the verb would be in box two instead.","topic":"german: where the verb goes in a yes or no question"},{"id":"de18-asking-questions:q3","level":"easy","type":"text","q":"Turn Du spielst Fussball into a yes or no question. Write the question.","answer":"Spielst du Fussball?","accept":["Spielst du Fussball?","Spielst du Fussball","Spielst du Fussball.","Spielst du Fußball","Spielst du Fußball.","Spielst du Fußball?","spielst du Fussball","spielst du Fussball.","spielst du Fussball?","spielst du Fußball","spielst du Fußball.","spielst du Fußball?","spielst du fussball","spielst du fussball.","spielst du fussball?","spielst du fußball","spielst du fußball.","spielst du fußball?"],"hint":"Swap the first two words and change the full stop to a question mark.","explain":"The verb spielst moves in front of du and keeps its st ending. Spielst du Fussball?","topic":"german: turning a du statement into a yes or no question"},{"id":"de18-asking-questions:q4","level":"medium","type":"mc","q":"A pupil wrote: Du wohnst in Wolverhampton? What is wrong with it?","options":["The verb has to go first, so it should be Wohnst du in Wolverhampton?","wohnst should be wohne","in Wolverhampton should go at the front","Nothing is wrong"],"answer":"The verb has to go first, so it should be Wohnst du in Wolverhampton?","hint":"A question mark on the end does not change the word order.","explain":"The pupil left the words in statement order and only added a question mark. A German yes or no question needs the verb in box one, so wohnst moves in front of du. Wohnst du in Wolverhampton? The ending wohnst is correct for du.","topic":"german: marking a question with the verb still in box two"},{"id":"de18-asking-questions:q5","level":"medium","type":"text","q":"A pupil wrote: Du trinkst Wasser? Write the question out correctly.","answer":"Trinkst du Wasser?","accept":["Trinkst du Wasser?","Trinkst du Wasser","Trinkst du Wasser.","trinkst du Wasser","trinkst du Wasser.","trinkst du Wasser?","trinkst du wasser","trinkst du wasser.","trinkst du wasser?"],"hint":"Only the first two words move.","explain":"The verb has to come first in a yes or no question, so trinkst goes in front of du and keeps its st ending. Trinkst du Wasser?","topic":"german: correcting a question with the verb in box two"},{"id":"de18-asking-questions:q6","level":"medium","type":"mc","q":"A pupil wrote: Spiele du Fussball? One word is wrong. Which one, and what should it be?","options":["Spiele, it should be Spielst","du, it should go at the end of the question","Fussball, it should have a gender word in front","Nothing is wrong"],"answer":"Spiele, it should be Spielst","hint":"The verb is in the right place. Check the ending that goes with du.","explain":"The order is right, because the verb is in box one and du follows it. The ending is the wrong move. du takes st, so it is Spielst du Fussball? The e ending belongs with ich.","topic":"german: marking a wrong verb ending in a question"},{"id":"de18-asking-questions:q7","level":"medium","type":"text","q":"A pupil wrote: Lernt du Deutsch? Write the question out correctly.","answer":"Lernst du Deutsch?","accept":["Lernst du Deutsch?","Lernst du Deutsch","Lernst du Deutsch.","lernst du Deutsch","lernst du Deutsch.","lernst du Deutsch?","lernst du deutsch","lernst du deutsch.","lernst du deutsch?"],"hint":"The word order is already right. Fix the ending that goes with du.","explain":"The verb is first and du follows it, so the order is correct. du takes the st ending, so it is Lernst du Deutsch? The t ending belongs with er or sie.","topic":"german: correcting a wrong verb ending in a question"},{"id":"de18-asking-questions:q8","level":"medium","type":"mc","q":"You want to ask somebody whether he drinks water. You have the verb trinken. What is the first thing you write down?","options":["Trinkst, the du form of the verb, at the front","Du, and then the verb after it","Wasser, and then the verb after it","Trinken, with the ending left as it is"],"answer":"Trinkst, the du form of the verb, at the front","hint":"In a yes or no question, what fills box one?","explain":"The verb goes first in a yes or no question, and it has to carry the du ending, so you start with Trinkst. Then du, then Wasser. Trinkst du Wasser? Starting with Du would give you statement order, and trinken with no ending change does not go with du.","topic":"german: the first step in building a yes or no question"},{"id":"de18-asking-questions:q9","level":"stretch","type":"text","q":"A pupil wrote: Du hast heute Deutsch? Write the question out correctly.","answer":"Hast du heute Deutsch?","accept":["Hast du heute Deutsch?","Hast du heute Deutsch","Hast du heute Deutsch.","hast du heute Deutsch","hast du heute Deutsch.","hast du heute Deutsch?","hast du heute deutsch","hast du heute deutsch.","hast du heute deutsch?"],"hint":"haben is one of the odd ones, but the move is the same. The verb goes first.","explain":"The words are right but they are in statement order. The verb hast moves into box one and du follows it. Hast du heute Deutsch? hast is already the correct form for du, so only the order changes.","topic":"german: correcting a question with haben"},{"id":"de18-asking-questions:q10","level":"stretch","type":"mc","q":"You have just written Kaufst du Pizza? Which word did you move to turn the statement Du kaufst Pizza into that question?","options":["Kaufst, the verb, moved to the front","Pizza moved to the front","du moved to the end","Nothing moved, only the question mark was added"],"answer":"Kaufst, the verb, moved to the front","hint":"Put the two versions next to each other and see which word changed position.","explain":"In Du kaufst Pizza the verb is in box two. In Kaufst du Pizza? it is in box one, so the verb is the word that moved. Pizza stayed last, du stayed next to the verb, and a question mark on its own would not have changed the order.","topic":"german: explaining which word you moved to make a question"}]},"de19-w-questions":{"id":"de19-w-questions","day":"Day 4","subject":"German","title":"Wo, was, wann","minutes":10,"objective":"Ask wo, was and wann questions with the verb straight after the question word, and fix a pupil question where something has got in between.","extract":null,"teach":{"intro":["Three question words. Wo means where. Was means what. Wann means when. Each one takes box one, and the verb comes straight after it in box two.","Wo wohnst du? Was machst du? Wann spielst du Fussball? Question word, verb, du. Nothing is allowed to squeeze in between the question word and the verb.","This is the same box rule as yesterday. Wo is one box, so the verb has to be next. Wo du wohnst is the error, and it is the same error as Am Montag ich habe."],"example":{"problem":"Ask where somebody lives, using wo.","steps":["Wo takes box one.","The verb comes straight after it in box two. The du form of wohnen is wohnst.","du comes third, behind the verb.","Question mark at the end.","Wo wohnst du?"],"answer":"Wo wohnst du?"},"example2":{"problem":"A pupil wrote: Wann du spielst Fussball? Write the question out correctly.","steps":["Wann is box one.","Count what sits in front of the verb spielst. Wann and du, which is two boxes. Only one is allowed.","The verb comes straight after wann, and du goes behind the verb.","Wann spielst du Fussball?"],"answer":"Wann spielst du Fussball?"},"keyfact":"After wo, was or wann the verb comes straight away, with nothing allowed in between."},"questions":[{"id":"de19-w-questions:q1","level":"easy","type":"mc","q":"What does wo mean?","options":["Where","What","When","Who"],"answer":"Where","hint":"One of this week's three question words.","explain":"Wo means where. Was means what and wann means when.","topic":"german: the meaning of the question word wo"},{"id":"de19-w-questions:q2","level":"easy","type":"mc","q":"Which one of these is written correctly?","options":["Wo wohnst du?","Wo du wohnst?","Du wo wohnst?","Wohnst wo du?"],"answer":"Wo wohnst du?","hint":"Count what sits between the question word and the verb.","explain":"Wo wohnst du? has the verb straight after wo, which is the rule. Wo du wohnst? has du in between. Du wo wohnst? puts du in box one. Wohnst wo du? puts the verb in front of wo.","topic":"german: picking the correct word order after a question word"},{"id":"de19-w-questions:q3","level":"easy","type":"text","q":"Write the German for what are you doing, using was and machen.","answer":"Was machst du?","accept":["Was machst du?","Was machst du","Was machst du.","was machst du","was machst du.","was machst du?"],"hint":"Question word, then the verb, then du.","explain":"Was takes box one. The du form of machen is machst and it goes in box two. du comes third. Was machst du?","topic":"german: writing a was question with the verb next"},{"id":"de19-w-questions:q4","level":"medium","type":"mc","q":"What has to come straight after wo?","options":["The verb","du","A noun","A gender word"],"answer":"The verb","hint":"Wo is one box, and it has taken box one.","explain":"Wo fills box one, so the verb has to be next, in box two. du comes after the verb. Wo wohnst du?","topic":"german: what comes straight after a question word"},{"id":"de19-w-questions:q5","level":"medium","type":"mc","q":"A pupil wrote: Wo du wohnst? What is wrong with it?","options":["Two boxes sit in front of the verb, so wohnst has to come straight after Wo","wohnst should be wohne","Wo should be Was","The question mark should be a full stop"],"answer":"Two boxes sit in front of the verb, so wohnst has to come straight after Wo","hint":"Count the boxes in front of the verb.","explain":"Wo is box one and du has taken box two, so the verb has been pushed into box three. Nothing is allowed between the question word and the verb. Wo wohnst du? The ending wohnst is correct for du, and wo is the right question word for where.","topic":"german: marking a w question with the verb in box three"},{"id":"de19-w-questions:q6","level":"medium","type":"text","q":"A pupil wrote: Wann du spielst Fussball? Write the question out correctly.","answer":"Wann spielst du Fussball?","accept":["Wann spielst du Fussball?","Wann spielst du Fussball","Wann spielst du Fussball.","Wann spielst du Fußball","Wann spielst du Fußball.","Wann spielst du Fußball?","wann spielst du Fussball","wann spielst du Fussball.","wann spielst du Fussball?","wann spielst du Fußball","wann spielst du Fußball.","wann spielst du Fußball?","wann spielst du fussball","wann spielst du fussball.","wann spielst du fussball?","wann spielst du fußball","wann spielst du fußball.","wann spielst du fußball?"],"hint":"Wann keeps box one. The verb has to take box two.","explain":"Wann is box one and du has pushed the verb spielst into box three. The verb comes straight after the question word and du goes behind it. Wann spielst du Fussball?","topic":"german: correcting a wann question with the verb in box three"},{"id":"de19-w-questions:q7","level":"medium","type":"text","q":"A pupil wrote: Was du machst? Write the question out correctly.","answer":"Was machst du?","accept":["Was machst du?","Was machst du","Was machst du.","was machst du","was machst du.","was machst du?"],"hint":"Nothing goes between the question word and the verb.","explain":"Was is box one and du has got in between, pushing machst into box three. Move the verb straight after was and put du behind it. Was machst du?","topic":"german: correcting a was question with the verb in box three"},{"id":"de19-w-questions:q8","level":"medium","type":"mc","q":"A pupil wrote: Wo wohne du? One word is wrong. Which one, and what should it be?","options":["wohne, it should be wohnst","Wo, it should be Wann","du, it should go in front of Wo","Nothing is wrong"],"answer":"wohne, it should be wohnst","hint":"The boxes are in the right order, so check the ending that goes with du.","explain":"The verb is straight after wo, so the order is right. The ending is wrong, because du takes st. Wo wohnst du? The e ending belongs with ich.","topic":"german: marking a wrong verb ending in a w question"},{"id":"de19-w-questions:q9","level":"stretch","type":"mc","q":"You want to ask somebody when he plays football. Which of wo, was and wann do you use, and why?","options":["Wann, because it asks about when something happens","Wo, because it asks about a place","Was, because it asks about a thing","Any of the three would work"],"answer":"Wann, because it asks about when something happens","hint":"Match the question word to the kind of answer you want back.","explain":"Wann asks about time, so it is the one that gets you a day or a time back. Wo would ask where he plays and was would ask what he plays. The three are not interchangeable. Wann spielst du Fussball?","topic":"german: choosing between wo, was and wann"},{"id":"de19-w-questions:q10","level":"stretch","type":"text","q":"A pupil wrote: Wo der Lehrer wohnt? Write the question out correctly.","answer":"Wo wohnt der Lehrer?","accept":["Wo wohnt der Lehrer?","Wo wohnt der Lehrer","Wo wohnt der Lehrer.","wo wohnt der Lehrer","wo wohnt der Lehrer.","wo wohnt der Lehrer?","wo wohnt der lehrer","wo wohnt der lehrer.","wo wohnt der lehrer?"],"hint":"The verb still has to come straight after wo, even when the person asked about is a noun.","explain":"Wo is box one, so the verb has to be in box two. Here der Lehrer has got in between and pushed wohnt to the end. Move the verb straight after wo and the noun goes behind it. The ending stays t, because der Lehrer is one person, like er. Wo wohnt der Lehrer?","topic":"german: correcting a wo question with a noun subject"}]},"de20-five-new-sentences":{"id":"de20-five-new-sentences","day":"Day 5","subject":"German","title":"Five sentences you own","minutes":10,"objective":"Write the week's five sentences from memory with the verb in the right box, the right ending and the right gender word.","extract":null,"teach":{"intro":["No new rules today. Five sentences, and by the end of this you can write all five without looking at them.","Here they are. Am Freitag spiele ich Fussball. Heute trinke ich Wasser. Das Handy ist neu. Spielst du heute Fussball? Wann lernst du Deutsch?","Two of them start with a time phrase, so the verb is in box two and ich sits behind it. One is a plain gender sentence. One is a yes or no question, so the verb is first. One is a wann question, so the verb comes straight after wann.","Every word in all five came out of the last two weeks. Nothing in them is new."],"example":{"problem":"Write sentence one from memory: on Friday I play football.","steps":["Am Freitag is the time phrase, so it takes box one.","The verb goes in box two. The ich form of spielen is spiele.","ich comes third, behind the verb.","Fussball goes last.","Am Freitag spiele ich Fussball."],"answer":"Am Freitag spiele ich Fussball."},"example2":{"problem":"Write sentence four from memory: do you play football today?","steps":["It is a yes or no question, so the verb takes box one.","The du form of spielen is spielst.","du comes straight after the verb, then heute, then Fussball.","Spielst du heute Fussball?"],"answer":"Spielst du heute Fussball?"},"keyfact":"Five sentences and three rules: the verb is in box two in a statement, first in a yes or no question, and straight after a w word."},"questions":[{"id":"de20-five-new-sentences:q1","level":"easy","type":"mc","q":"Which one of these is sentence one written correctly?","options":["Am Freitag spiele ich Fussball.","Am Freitag ich spiele Fussball.","Spiele am Freitag ich Fussball."],"answer":"Am Freitag spiele ich Fussball.","hint":"Count the boxes in front of the verb in each one.","explain":"Am Freitag spiele ich Fussball. has one box in front of the verb, which is the rule for a statement. Am Freitag ich spiele Fussball. has two, Am Freitag and ich. Spiele am Freitag ich Fussball. puts the verb in box one, which is what a yes or no question does.","topic":"german: picking sentence one written correctly"},{"id":"de20-five-new-sentences:q2","level":"easy","type":"text","q":"Write sentence one from memory: on Friday I play football.","answer":"Am Freitag spiele ich Fussball.","accept":["Am Freitag spiele ich Fussball.","Am Freitag spiele ich Fussball","Am Freitag spiele ich Fußball","Am Freitag spiele ich Fußball.","am Freitag spiele ich Fussball","am Freitag spiele ich Fussball.","am Freitag spiele ich Fußball","am Freitag spiele ich Fußball.","am freitag spiele ich fussball","am freitag spiele ich fussball.","am freitag spiele ich fußball","am freitag spiele ich fußball."],"hint":"Time phrase, verb, ich, noun.","explain":"Am Freitag takes box one, spiele takes box two, ich is pushed behind the verb and Fussball goes last. Am Freitag spiele ich Fussball.","topic":"german: writing sentence one from memory"},{"id":"de20-five-new-sentences:q3","level":"easy","type":"mc","q":"In Heute trinke ich Wasser, which box is ich in?","options":["Box one","Box two","Box three","Box four"],"answer":"Box three","hint":"Count the boxes from the left. Heute is one box.","explain":"Heute is box one, trinke is box two, ich is box three and Wasser is box four. The time phrase at the front pushed ich behind the verb.","topic":"german: finding which box a word is in"},{"id":"de20-five-new-sentences:q4","level":"medium","type":"mc","q":"A pupil wrote sentence three as: Der Handy ist neu. What is wrong with it?","options":["The gender word is wrong, Handy takes das","ist is wrong, it should be bin","neu has to go in front of Handy","Nothing is wrong"],"answer":"The gender word is wrong, Handy takes das","hint":"Find the noun, then ask which gender word it came with.","explain":"Handy is a das noun, so the sentence is Das Handy ist neu. ist is correct for one thing, and neu belongs after ist, so neither of those is the problem.","topic":"german: marking a wrong gender in sentence three"},{"id":"de20-five-new-sentences:q5","level":"medium","type":"text","q":"A pupil wrote sentence two as: Heute ich trinke Wasser. Write it out correctly, starting with Heute.","answer":"Heute trinke ich Wasser.","accept":["Heute trinke ich Wasser.","Heute trinke ich Wasser","heute trinke ich Wasser","heute trinke ich Wasser.","heute trinke ich wasser","heute trinke ich wasser."],"hint":"Heute keeps box one. Something has to move out of box two.","explain":"Heute is box one and ich has taken box two, so the verb trinke has been pushed into box three. Only one box goes in front of the verb, so trinke moves to box two and ich goes behind it. Heute trinke ich Wasser.","topic":"german: correcting the word order in sentence two"},{"id":"de20-five-new-sentences:q6","level":"medium","type":"text","q":"Write sentence three from memory: the mobile is new.","answer":"Das Handy ist neu.","accept":["Das Handy ist neu.","Das Handy ist neu","das Handy ist neu","das Handy ist neu.","das handy ist neu","das handy ist neu."],"hint":"Four words, and the first is the gender word.","explain":"Handy is a das noun, so the pair is das Handy. Then the verb ist, then neu. Das Handy ist neu.","topic":"german: writing sentence three from memory"},{"id":"de20-five-new-sentences:q7","level":"medium","type":"text","q":"A pupil wrote sentence four as: Du spielst heute Fussball? Write it out correctly as a question.","answer":"Spielst du heute Fussball?","accept":["Spielst du heute Fussball?","Spielst du heute Fussball","Spielst du heute Fussball.","Spielst du heute Fußball","Spielst du heute Fußball.","Spielst du heute Fußball?","spielst du heute Fussball","spielst du heute Fussball.","spielst du heute Fussball?","spielst du heute Fußball","spielst du heute Fußball.","spielst du heute Fußball?","spielst du heute fussball","spielst du heute fussball.","spielst du heute fussball?","spielst du heute fußball","spielst du heute fußball.","spielst du heute fußball?"],"hint":"A question mark on the end does not move any words.","explain":"The pupil kept statement order. In a yes or no question the verb takes box one, so spielst moves in front of du and keeps its st ending. Spielst du heute Fussball?","topic":"german: correcting sentence four into a question"},{"id":"de20-five-new-sentences:q8","level":"medium","type":"text","q":"A pupil wrote sentence five as: Wann lernt du Deutsch? Write it out correctly.","answer":"Wann lernst du Deutsch?","accept":["Wann lernst du Deutsch?","Wann lernst du Deutsch","Wann lernst du Deutsch.","wann lernst du Deutsch","wann lernst du Deutsch.","wann lernst du Deutsch?","wann lernst du deutsch","wann lernst du deutsch.","wann lernst du deutsch?"],"hint":"The order is already right. Check the ending that goes with du.","explain":"Wann is box one and the verb is straight after it, so the order is correct. The ending is wrong, because du takes st. Wann lernst du Deutsch? The t ending belongs with er or sie.","topic":"german: correcting a wrong verb ending in sentence five"},{"id":"de20-five-new-sentences:q9","level":"stretch","type":"mc","q":"You have just written Wann lernst du Deutsch? Why does lernst come straight after Wann?","options":["Because wann takes box one, so the verb has to be in box two","Because questions in German have no word order rules","Because du always comes last in a question","Because lernst is the longest word in the sentence"],"answer":"Because wann takes box one, so the verb has to be in box two","hint":"It is the same box rule you used on Am Montag habe ich Deutsch.","explain":"Wann is one box and it fills box one, so the verb has to come next. Nothing is allowed in between, which is why Wann du lernst Deutsch is wrong. The length of the word has nothing to do with it, and du sits behind the verb, not at the end.","topic":"german: explaining why the verb follows a w word"},{"id":"de20-five-new-sentences:q10","level":"stretch","type":"text","q":"A pupil was asked for sentence one and wrote: Am Freitag spielt ich Fussball. One word is wrong. Write the whole sentence out correctly.","answer":"Am Freitag spiele ich Fussball.","accept":["Am Freitag spiele ich Fussball.","Am Freitag spiele ich Fussball","Am Freitag spiele ich Fußball","Am Freitag spiele ich Fußball.","am Freitag spiele ich Fussball","am Freitag spiele ich Fussball.","am Freitag spiele ich Fußball","am Freitag spiele ich Fußball.","am freitag spiele ich fussball","am freitag spiele ich fussball.","am freitag spiele ich fußball","am freitag spiele ich fußball."],"hint":"The boxes are in the right order, so check the ending that goes with ich.","explain":"Am Freitag is box one and the verb is in box two, so the order is right. The ending is the wrong move. ich takes e, so it is spiele. spielt goes with er or sie. Am Freitag spiele ich Fussball.","topic":"german: correcting a wrong verb ending in sentence one"}]}},"tests":{"w6-test":{"id":"w6-test","title":"Weekly test","note":"Twenty questions in twenty minutes, so about one a minute. There are no hints, and the explanations are there to read once the whole thing is finished.","bands":[{"label":"Warm up","extract":null,"questions":[{"id":"w6-test:t1","level":"easy","type":"mc","q":"A number is multiplied by 5, then 4 is taken away. How many steps does the forward journey have?","options":["One","Two","Three","Four"],"answer":"Two","hint":"","explain":"Multiply by 5 is one step. Take away 4 is the second step. That is two steps forward, which means two undos on the way back.","topic":"working backwards: counting the steps in the forward journey"},{"id":"w6-test:t2","level":"easy","type":"mc","q":"In which one of these are the particles touching, locked in a fixed pattern, and vibrating on the spot?","options":["A solid","A liquid","A gas","None of them, particles never move"],"answer":"A solid","hint":"","explain":"In a solid the particles are touching and held in a fixed pattern, so they vibrate on the spot instead of moving around. In a liquid they are still touching but slide past each other, and in a gas they are far apart and move fast in all directions. Particles are never completely still.","topic":"science: solids, liquids and gases as particle arrangement"},{"id":"w6-test:t3","level":"easy","type":"mc","q":"Which one of these four has the right gender word in front of it?","options":["die Katze","der Woche","das Park","die Handy"],"answer":"die Katze","hint":"","explain":"Katze is a die noun, so die Katze is right. The other three are the wrong pairs: it is die Woche, der Park and das Handy. The gender word is stored with the noun, because the noun on its own tells you nothing.","topic":"german: picking the correct noun and gender pair from four"},{"id":"w6-test:t4","level":"easy","type":"mc","q":"A pupil's work. Line 1: a number is halved, then 3.5 is added, giving 11. Line 2: 11 - 3.5 = 7.5. Line 3: so the number is 7.5. Which line is the first wrong one?","options":["Line 1","Line 2","Line 3","No line is wrong"],"answer":"Line 3","hint":"","explain":"Line 2 is right, 11 - 3.5 = 7.5. The wrong move is in Line 3, where the pupil stops after one undo. The forward journey had two steps, halve and add 3.5, so there are two undos. The halving still has to be undone: 7.5 x 2 = 15. Check: 15 / 2 = 7.5, then 7.5 + 3.5 = 11.","topic":"working backwards: marking a solution that stops after one undo"},{"id":"w6-test:t5","level":"medium","type":"text","q":"A triangle has area 25.2 cm^2 and base 5.6 cm. What is its perpendicular height, in cm?","answer":"9","accept":["9","9.0","9 cm","9cm","nine"],"hint":"","explain":"Forward journey from the height: times the base 5.6, then divide by 2. Two steps, so two undos. Undo the divide by 2 first, 25.2 x 2 = 50.4. Then undo the times 5.6, 50.4 / 5.6 = 9 cm. The usual wrong move is to stop at 50.4 and call that the height. Check: 9 x 5.6 = 50.4, then 50.4 / 2 = 25.2.","topic":"working backwards: area to find a height"},{"id":"w6-test:t6","level":"medium","type":"mc","q":"Point: the driver did not want to be asked anything else. Evidence: he \"turned the radio up and kept his eyes on the road\". Which sentence is explaining, rather than restating?","options":["The quote says the driver turned the radio up and looked at the road.","Turning the radio up makes the reader think he was shutting the conversation down without having to say so.","The writer has used a quote about a radio here.","The radio in the car was quite loud."],"answer":"Turning the radio up makes the reader think he was shutting the conversation down without having to say so.","hint":"","explain":"Saying the quote again in different words is restating, and it earns nothing. Saying the writer has used a quote names a feature without saying what it does. Saying the radio was loud just repeats a detail. The right answer starts from the choice to turn the radio up and says what that makes the reader think, which is explaining.","topic":"english: telling a restating sentence from an explaining sentence"},{"id":"w6-test:t7","level":"medium","type":"text","q":"A pupil wrote this about a bus on a cold morning: the mist on the inside of the window has evaporated out of the air onto the cold glass. One word is wrong. Write the word it should be.","answer":"condensed","accept":["condensed","condensation","condenses","condensing","condense"],"hint":"","explain":"The water arrived on the glass out of the air, so it stopped being a gas and became a liquid. That is condensation, so the word evaporated should be condensed. Evaporation is the opposite direction, liquid going up and away as a gas, and nothing here went up and away.","topic":"science: marking the evaporation and condensation swap"},{"id":"w6-test:t8","level":"medium","type":"text","q":"A number is multiplied by 6, then 7.4 is taken away, giving 94.6. What was the number?","answer":"17","accept":["17","17.0","seventeen"],"hint":"","explain":"Forward journey: times 6, then take away 7.4. Two steps, so two undos, last one first. Undo the take away, 94.6 + 7.4 = 102. Then undo the times 6, 102 / 6 = 17. The wrong move here is to stop at 102, which is what you get if you only undo the last step. Check: 17 x 6 = 102, then 102 - 7.4 = 94.6.","topic":"working backwards: two step number journey with decimals"},{"id":"w6-test:t9","level":"medium","type":"mc","q":"Three things are marked on a map. A shelter is at the six figure grid reference 507 342, a gate is at 503 349, and a mast is at 512 341. Which two of them are in the same four figure grid square?","options":["The shelter and the gate","The shelter and the mast","The gate and the mast","All three are in the same square"],"answer":"The shelter and the gate","hint":"","explain":"A four figure square uses the first two digits of each half. The shelter 507 342 is in square 5034 and the gate 503 349 is also in 5034, so those two share a square. The mast 512 341 is in 5134, because its easting starts 51. Looking at the last digits instead is the usual slip, and those are the digits you drop.","topic":"geography: six figure to four figure grid references"},{"id":"w6-test:t10","level":"medium","type":"mc","q":"Four objects come out of one dig: a coin from 120 BC, a lamp from 15 BC, a buckle from 60 AD and a blade from 5 AD. Which object is the second earliest?","options":["The coin","The lamp","The buckle","The blade"],"answer":"The lamp","hint":"","explain":"Every BC date comes before every AD date, and inside BC a bigger number is earlier. So the order is the coin at 120 BC, then the lamp at 15 BC, then the blade at 5 AD, then the buckle at 60 AD. The second earliest is the lamp. Treating 15 BC as later than 5 AD is the usual slip, because 15 is the bigger number.","topic":"history: ordering BC and AD dates"}]},{"label":"Harder","extract":"The fog came up the valley while they were still on the ridge. Ravi stopped and took the map out of his pocket for the third time in ten minutes. He said nothing about it. Tom walked on ahead, swinging his stick at the heather, and asked twice how long until the car. Ravi folded the map along its creases, put it away, and counted the cairns he could still see. There were two. Behind them, the path had already gone.","questions":[{"id":"w6-test:t11","level":"medium","type":"mc","q":"A pupil's work. Line 1: cement and sand are mixed in the ratio 3:8. Line 2: there is 4.8 kg of cement. Line 3: one part is 4.8 / 3 = 1.6 kg. Line 4: so the whole mix is 1.6 x 8 = 12.8 kg. Which line is the first wrong one?","options":["Line 1","Line 2","Line 3","Line 4"],"answer":"Line 4","hint":"","explain":"Line 3 is right, one part is 1.6 kg. The wrong move is in Line 4, which multiplies by 8, and 8 parts is only the sand. The whole mix is 3 + 8 = 11 parts, so 1.6 x 11 = 17.6 kg. The pupil treated one share as the total. Check: 17.6 split 3:8 gives 4.8 kg of cement and 12.8 kg of sand.","topic":"working backwards: marking a ratio where one share is treated as the total"},{"id":"w6-test:t12","level":"medium","type":"text","q":"7/9 of a number is 63. What is the number?","answer":"81","accept":["81","81.0","eighty one","eighty-one"],"hint":"","explain":"63 is seven ninths, so divide by 7 to get one ninth: 63 / 7 = 9. A whole is nine ninths, so the number is 9 x 9 = 81. Stopping at 9 is the usual wrong move, because 9 is one part, not the whole. Check: 81 / 9 = 9, then 9 x 7 = 63.","topic":"working backwards: fraction of an amount to find the whole"},{"id":"w6-test:t13","level":"medium","type":"text","q":"Six soil readings are 15, 13, 16, 14, 14 and 180 degrees C. The 180 is a fault and is thrown out. The five left add up to 72. A pupil writes 72 / 6 = 12 and calls that the mean. Write the correct mean, in degrees C.","answer":"14.4","accept":["14.4","14.40","14.4 degrees C","14.4 degrees","72/5"],"hint":"","explain":"The total of 72 is right. The pupil then divided by 6, but only five readings are being used now, so it has to be 72 / 5 = 14.4 degrees C. Throwing a reading out changes how many you divide by. Check: 14.4 x 5 = 72.","topic":"statistics: mean with an anomaly removed"},{"id":"w6-test:t14","level":"medium","type":"mc","q":"A pupil claims Ravi was worried about finding the way back. Which quote from the extract contains that worry?","options":["\"took the map out of his pocket for the third time in ten minutes\"","\"The fog came up the valley while they were still on the ridge\"","\"swinging his stick at the heather\"","\"asked twice how long until the car\""],"answer":"\"took the map out of his pocket for the third time in ten minutes\"","hint":"","explain":"Does the quote contain the thing you claimed? The claim is Ravi worrying about the way back, and going to the map three times in ten minutes is exactly that. The fog quote is weather, so it proves the conditions were bad and nothing about Ravi. The stick and the question about the car are both Tom, so they cannot prove anything about Ravi at all.","topic":"english: choosing evidence that contains the claim"},{"id":"w6-test:t15","level":"medium","type":"mc","q":"Point: Ravi was more worried than he was letting on. Evidence: he took the map out \"for the third time in ten minutes\". A pupil's explanation: this shows that Ravi looked at the map three times. What is wrong with the explanation?","options":["It only says the quote again, it does not say what checking three times in ten minutes makes the reader think","The quote does not contain any worry, so the evidence is the wrong choice","The point is about Tom, so the evidence should be about Tom","Nothing is wrong, the explanation is complete"],"answer":"It only says the quote again, it does not say what checking three times in ten minutes makes the reader think","hint":"","explain":"The explanation repeats the quote in slightly different words, which is restating. An explanation has to start from the detail and say what it makes the reader think, for example that checking three times in ten minutes shows Ravi did not trust his own reading of the route. The evidence itself is a good choice, because three checks in ten minutes does contain the worry.","topic":"english: marking an explanation that only restates the quote"},{"id":"w6-test:t16","level":"medium","type":"text","q":"A pupil claims Ravi kept his worry to himself. Copy the single word from the extract that shows he kept quiet about it.","answer":"nothing","accept":["nothing","Nothing","\"nothing\"","said nothing","nothing.","nothing,"],"hint":"","explain":"The extract says he \"said nothing about it\". The word nothing contains the claim, because it says he told Tom nothing about it while he was still going back to the map. A quote about folding the map would only prove he used the map, not that he kept quiet about why.","topic":"english: finding the word in the extract that contains the claim"},{"id":"w6-test:t17","level":"stretch","type":"mc","q":"A substance is liquid at 20 degrees C and a gas at 150 degrees C. What can you say for certain about its boiling point?","options":["It is above 20 degrees C and below 150 degrees C","It is exactly 100 degrees C","It is below 20 degrees C","It is above 150 degrees C"],"answer":"It is above 20 degrees C and below 150 degrees C","hint":"","explain":"The boiling point is where liquid and gas swap over. At 20 degrees C it has not swapped yet, so the boiling point is higher than 20. By 150 degrees C it has swapped, so the boiling point is lower than 150. That pins it between the two, and nothing here pins it any tighter. 100 degrees C is the boiling point of water, and this substance is not said to be water.","topic":"science: working backwards from two states to pin down a boiling point"},{"id":"w6-test:t18","level":"medium","type":"text","q":"A pupil wrote: Morgen ich hoere Musik. The verb is in the wrong box. Write the one word that has to come straight after Morgen.","answer":"hoere","accept":["hoere","Hoere","hoere.","höre","Höre","höre."],"hint":"","explain":"Morgen is a time phrase, so it takes box one. Only one box is allowed in front of the verb, and the pupil has put two there, Morgen and ich. The verb hoere has to come straight after Morgen, with ich behind it: Morgen hoere ich Musik.","topic":"german: correcting a verb pushed to box three"},{"id":"w6-test:t19","level":"stretch","type":"mc","q":"Two pupils were asked to write the German for do you drink water. Pupil A wrote Trinkst du Wasser? Pupil B wrote Du trinkst Wasser? Which one did what was asked, and why?","options":["Pupil A, because in a yes or no question the verb goes first","Pupil B, because du always comes first","Both, because the question mark makes either one a question","Neither, because trinkst should be trinke"],"answer":"Pupil A, because in a yes or no question the verb goes first","hint":"","explain":"For a yes or no question the verb moves to the front and du follows it, so Trinkst du Wasser? is the question. Pupil B has statement order with du in box one, and a question mark on the end does not change the word order. The st ending stays on the verb when it moves, so trinkst is right in both.","topic":"german: where the verb goes in a yes or no question"},{"id":"w6-test:t20","level":"stretch","type":"text","q":"A pupil's work. Line 1: a full drum of cable weighs 23.6 kg. Line 2: the empty drum weighs 4.4 kg. Line 3: sixteen equal coils of cable make up the rest. Line 4: 23.6 / 16 = 1.475. Line 5: so one coil weighs 1.475 kg. Line 4 is the first wrong one. Write the correct weight of one coil, in kg.","answer":"1.2","accept":["1.2","1.20","1.2 kg","1.2kg","6/5"],"hint":"","explain":"The forward journey is: sixteen coils, then add the empty drum. Two steps, so two undos. Line 4 divides straight away and skips an undo, so the answer comes out too big. Take the drum off first, 23.6 - 4.4 = 19.2, then 19.2 / 16 = 1.2 kg a coil. Check: 16 x 1.2 = 19.2, then 19.2 + 4.4 = 23.6.","topic":"working backwards: why skipping an undo gives too large an answer"}]}]}},"days":[{"key":"d1","label":"Day 1","date":"","blocks":[{"id":"w6u1-warmup","kind":"lesson","mins":5},{"id":"m23-backwards-marking","kind":"lesson","mins":20},{"id":"de16-genders-again","kind":"lesson","mins":10}]},{"key":"d2","label":"Day 2","date":"","blocks":[{"id":"w6u2-warmup","kind":"lesson","mins":5},{"id":"e14-evidence-proves-point","kind":"lesson","mins":20},{"id":"de17-verb-second-pressure","kind":"lesson","mins":10}]},{"key":"d3","label":"Day 3","date":"","blocks":[{"id":"w6u3-warmup","kind":"lesson","mins":5},{"id":"m24-backwards-apply","kind":"lesson","mins":20},{"id":"de18-asking-questions","kind":"lesson","mins":10}]},{"key":"d4","label":"Day 4","date":"","blocks":[{"id":"w6u4-warmup","kind":"lesson","mins":5},{"id":"s11-particles-state-changes","kind":"lesson","mins":20},{"id":"de19-w-questions","kind":"lesson","mins":10}]},{"key":"d5","label":"Day 5","date":"","blocks":[{"id":"w6u5-warmup","kind":"lesson","mins":5},{"id":"w6-test","kind":"test","mins":20},{"id":"de20-five-new-sentences","kind":"lesson","mins":10},{"id":"review","kind":"review","mins":15}]}],"books":["Stormbreaker (Alex Rider) - Anthony Horowitz","Percy Jackson: The Lightning Thief - Rick Riordan","Holes - Louis Sachar","Skulduggery Pleasant - Derek Landy","Other"],"hand":{"passage":"Nobody had told the crew that the ice would move at night. They woke to a noise like a goods train somewhere underneath the hull, and by the time the first man reached the deck the open water they had sailed in the day before had closed up behind them. The captain said very little. He walked the length of the ship twice, looked at the pressure ridges building along the port side, and then went below and wrote the date in the log as if it were any other morning. For nine months after that the ship went wherever the ice went, and the men measured the drift in miles a day rather than in anything they could steer.","steps":["Set a timer for exactly 3 minutes.","Copy the passage into your book in your normal handwriting. Not your best, not your fastest. Normal.","Stop dead when the timer goes. Do not finish the word.","Count the words you wrote and type the number in."]},"pools":{"e14-evidence-proves-point":[{"id":"e14-evidence-proves-point:p1","level":"easy","type":"mc","q":"A pupil claims Marcus was already thinking about escape while he was out on the ice. Which quote contains that claim?","options":["\"working out how many steps it would take\"","\"The reservoir had been frozen for nine days\"","\"Hold that,\" he said","\"it travelled under them both and away towards the dam\""],"answer":"\"working out how many steps it would take\"","hint":"Escape means getting back to the bank. Which quote is about the distance back?","explain":"Does the quote contain the thing you claimed? The claim is thinking about escape. Counting the steps back to the bank is exactly that, so that quote contains it. The frost is weather, the order to hold the rope is about Dev, and the noise travelling to the dam is the ice. None of those three contain any thinking about escape.","topic":"english: choosing evidence that contains the claim"},{"id":"e14-evidence-proves-point:p2","level":"medium","type":"mc","q":"Point: the silence makes the ice feel more dangerous, not less. Evidence: \"The ice took his weight without a sound, which was somehow worse\". Which sentence is explaining rather than restating?","options":["The quote says that the ice made no sound at all when Marcus first stepped out onto the white.","Calling the silence worse makes the reader expect the danger to arrive with no warning at all.","Marcus stepped onto the ice and the ice held him up without making a sound.","The writer has used a short sentence about the ice here to tell us what happened."],"answer":"Calling the silence worse makes the reader expect the danger to arrive with no warning at all.","hint":"The word worse is doing the work. Worse than what?","explain":"The answer about the ice making no sound and the answer about the ice holding him up both say the quote again, which is restating and earns nothing. The answer about a short sentence names a feature without saying what it does. The answer about calling the silence worse starts from the word worse. A crack would at least be a warning, and silence gives him nothing, so the reader is made to expect the ice to go without any sign first. That is showing, not saying.","topic":"english: telling a restating sentence from an explaining sentence"},{"id":"e14-evidence-proves-point:p3","level":"easy","type":"text","q":"A pupil claims Marcus got himself ready to take Dev's weight. After he pushes one end of the rope across the ice to Dev, he winds his own end twice around something. Copy the one word from the extract that names it.","answer":"fist","accept":["fist","his fist","fist.","\"fist\""],"hint":"Look at the very last thing he does before he speaks.","explain":"He \"kept the other end wound twice around his fist\". The word fist contains the claim, because a fist is a grip you make when you are expecting a pull. A quote about him pushing the rope across the ice would only prove he shared it, not that he was braced for the weight.","topic":"english: finding the word in the extract that contains the claim"},{"id":"e14-evidence-proves-point:p4","level":"medium","type":"mc","q":"A pupil wrote. Point: Dev does not believe the ice is dangerous. Evidence: the noise \"travelled under them both and away towards the dam\". What is the problem?","options":["The evidence is about the noise itself and contains nothing about what Dev believes","The point should have been about Marcus instead of being about Dev","The quote has been made up and those words are not in the extract","There is nothing wrong, because the quote comes from exactly the right part of the extract"],"answer":"The evidence is about the noise itself and contains nothing about what Dev believes","hint":"Read the quote on its own. Does Dev appear in it at all?","explain":"The point is fine, because the extract does show Dev dismissing the danger, and the quote is real. The failure is that the quote describes the noise and never touches Dev's head. Being in the right part of the extract is not enough. For a claim about what Dev believes you need Dev laughing, or Dev calling it settling, because the claim has to be inside the words.","topic":"english: marking evidence that does not contain the claim"},{"id":"e14-evidence-proves-point:p5","level":"medium","type":"mc","q":"Point: Marcus takes charge once he knows the ice is moving. Quote A: \"Hold that,\" he said. \"Don't argue.\" Quote B: \"Then he crouched\". Which quote better proves the point, and why?","options":["Quote A, because telling Dev not to argue contains the taking charge","Quote A, because it shows that the two boys are good friends with each other","Quote B, because crouching down is a strong and steady position to hold","Quote B, because he crouches down only after he has given Dev the order"],"answer":"Quote A, because telling Dev not to argue contains the taking charge","hint":"Which quote has Marcus giving an order in it?","explain":"Taking charge means telling somebody else what to do. Quote A has two orders in it, and shutting down the argument before it starts contains the claim completely. Quote B only describes a body position, and you could crouch for any number of reasons, so it does not prove who is in charge. In the extract he crouches first and speaks afterwards, so the answer that puts the crouch after the order has the order of events wrong. Choosing the right quote for a weak reason still loses the mark, so the reason matters as much as the choice.","topic":"english: choosing which of two quotes better proves the point"},{"id":"e14-evidence-proves-point:p6","level":"medium","type":"mc","q":"Evidence: the noise was \"a long low note, like a door opening in an empty house\". Which sentence says what the comparison makes the reader think, rather than restating it?","options":["A door opening in an empty house means somebody is there who should not be, so the boys are not safe.","This says that the ice sounded just like a door opening in a house that nobody was living in any more.","The writer compares the noise to a door opening by using the word like in this sentence.","This shows that doors in empty houses make a long low noise when somebody opens them slowly."],"answer":"A door opening in an empty house means somebody is there who should not be, so the boys are not safe.","hint":"Think about what it means to hear a door in a house you thought was empty.","explain":"The answer about the ice sounding like a door says the quote again, which is restating. The answer about the word like names the technique and stops, which is not explaining. The answer about doors making a long low noise explains the door rather than the ice, so it proves nothing about the boys. The answer about somebody being there who should not be starts from the reader. An empty house with a door opening in it is frightening because you are alone and something has arrived anyway, and that is the feeling the writer moves onto the ice.","topic":"english: explaining what a comparison makes the reader think"},{"id":"e14-evidence-proves-point:p7","level":"medium","type":"mc","q":"A pupil wrote. Point: Dev is not taking the ice seriously. Evidence: \"Dev laughed\". Explanation: this shows that Dev laughed at the noise. Which part is weak, and why?","options":["The explanation, because it repeats the quote instead of saying what the laughing tells us about Dev","The point, because Dev does take the ice seriously all the way through this extract","The evidence, because laughing has nothing at all to do with the ice or the noise","Nothing is weak, the paragraph has a point, some evidence and an explanation, all in the right order"],"answer":"The explanation, because it repeats the quote instead of saying what the laughing tells us about Dev","hint":"Would the last sentence still be true if you deleted everything else? Then it is not adding anything.","explain":"The point answers the question and the evidence contains the claim, because laughing at a warning is not taking it seriously. The last sentence is the failure. It says the quote again, which is saying, not showing. A working version is: laughing at a noise that comes from under his own feet shows the reader that Dev has not understood what it means.","topic":"english: marking an explanation that only restates the quote"},{"id":"e14-evidence-proves-point:p8","level":"medium","type":"mc","q":"Question: how does the writer show Dev is careless? A pupil wrote. Point: Marcus is careful. Evidence: he was \"placing each foot flat\". Explanation: it shows he is testing the ice. What is wrong?","options":["The point is about Marcus, so it does not answer a question about Dev","The evidence does not contain any care at all, so it proves nothing","The explanation only repeats the quote instead of adding anything new","Nothing is wrong, it has a point, some evidence and an explanation of it"],"answer":"The point is about Marcus, so it does not answer a question about Dev","hint":"Compare the question with the pupil's first sentence.","explain":"The evidence does contain care, and the explanation does say what the words make the reader think, so those two parts are built correctly. The point is the wrong one. The question asked about Dev and the pupil proved something about Marcus. Everything after a point that does not answer the question is wasted, so check the point against the question before you pick a quote.","topic":"english: marking a point that does not answer the question asked"},{"id":"e14-evidence-proves-point:p9","level":"stretch","type":"mc","q":"Evidence: Marcus \"had counted them off on the kitchen calendar\". Which explanation sentence says what this detail makes the reader think, rather than restating it?","options":["Counting the days off at home shows the reader that Marcus plans ahead, not on impulse.","This shows that Marcus used a calendar that was kept on a wall in his kitchen.","This shows that the reservoir had been frozen for nine whole days before he went.","The writer tells the reader about a kitchen calendar at the start of the extract."],"answer":"Counting the days off at home shows the reader that Marcus plans ahead, not on impulse.","hint":"Why would anybody count the frozen days instead of just going out?","explain":"The answer about using a calendar in his kitchen is the quote again in different words. The answer about nine days of frost is a fact from the sentence before, not an explanation of this detail. The answer about the writer telling the reader at the start only points at where the words are. The answer about planning ahead starts from the reader, because somebody who marks off nine days on a calendar before going out is somebody who prepares, which is also why the rope is in his bag.","topic":"english: writing an explanation that says what the detail implies"},{"id":"e14-evidence-proves-point:p10","level":"stretch","type":"mc","q":"A pupil wrote. Point: Marcus is a planner. Evidence: \"Dev got there first and was already out on the white\". Which part fails, and why?","options":["The evidence, because it is about Dev and contains nothing about Marcus","The point, because Marcus is not a planner anywhere in this extract","The evidence, because those exact words do not appear in the extract","The point, because it is far too short to count as a proper point"],"answer":"The evidence, because it is about Dev and contains nothing about Marcus","hint":"Whose name is in the quote, and whose name is in the point?","explain":"The quote is real and the point is true, because the rope and the calendar both show Marcus planning. The failure is that the quote is about Dev arriving first, and a quote about one character cannot prove a claim about another. A short point is allowed. The rule stays the same, which is that the quote has to contain the thing you claimed.","topic":"english: marking evidence that does not contain the claim"}],"s11-particles-state-changes":[{"id":"s11-particles-state-changes:p1","level":"easy","type":"mc","q":"In which one of these are the particles far apart and moving fast in all directions, so it spreads out to fill its whole container?","options":["A gas","A liquid","A solid","A liquid and a solid"],"answer":"A gas","hint":"Only one of them has no fixed volume at all.","explain":"In a gas the particles are far apart with a lot of space between them, and they move fast in every direction, so a gas spreads out until it fills whatever it is in. A liquid takes the shape of its container but keeps the same volume, because its particles are still touching. A solid holds its own shape, because its particles are locked in a fixed pattern.","topic":"science: solids, liquids and gases as particle arrangement"},{"id":"s11-particles-state-changes:p2","level":"easy","type":"mc","q":"A lump of solid sulfur is heated until it melts into liquid sulfur. Which statement is true?","options":["It is still sulfur, and the same particles are now sliding past each other","It has turned into a different substance made of new particles","Some of the sulfur particles have been used up","The particles have shrunk to half their size"],"answer":"It is still sulfur, and the same particles are now sliding past each other","hint":"A change of state never changes what the substance is.","explain":"Melting is a change of state, and a change of state never changes what the substance is. Liquid sulfur is still sulfur, made of exactly the same particles as the solid was. Heating gave those particles enough energy to break out of their fixed pattern, so they now slide past each other instead of vibrating on the spot. Nothing is used up and nothing shrinks.","topic":"science: a change of state does not change the substance"},{"id":"s11-particles-state-changes:p3","level":"medium","type":"text","q":"Using the table, what state is sulfur at 300 degrees C? Answer in one word.","answer":"liquid","accept":["liquid","a liquid","liquid.","it is liquid","Liquid"],"hint":"Find the sulfur row and check where 300 sits compared to its two numbers.","explain":"Sulfur melts at 115 degrees C and boils at 445 degrees C. 300 sits between those two numbers, and between the melting point and the boiling point a substance is liquid. So sulfur is liquid at 300 degrees C. It has melted, because 300 is past 115, but it has not boiled, because 300 has not reached 445.","topic":"science: reading a state off a melting and boiling point table"},{"id":"s11-particles-state-changes:p4","level":"medium","type":"mc","q":"Dry ice is solid carbon dioxide. Left on a table it turns straight into a gas without ever becoming a liquid. What is that change called?","options":["Sublimation","Evaporation","Melting","Condensation"],"answer":"Sublimation","hint":"One of the six named changes skips the liquid stage completely.","explain":"Going straight from solid to gas, with no liquid in between, is sublimation. Melting would mean solid to liquid, and the dry ice never becomes a liquid. Evaporation is liquid to gas, so that needs a liquid stage as well. Condensation is the wrong direction completely, gas coming back to liquid.","topic":"science: naming a change of state from its direction"},{"id":"s11-particles-state-changes:p5","level":"medium","type":"text","q":"Using the table, which substance stays liquid over the smallest range of temperatures? Write its name.","answer":"oxygen","accept":["oxygen","Oxygen","oxygen.","o2","O2"],"hint":"Take the melting point away from the boiling point for each one. This time you want the smallest gap.","explain":"The liquid range is the boiling point take away the melting point. Oxygen, minus 183 take away minus 219, is 36 degrees. Ethanol is 192 degrees. Water is 100 degrees. Mercury is 396 degrees. Sulfur is 330 degrees. Oxygen has by far the smallest gap at 36 degrees, so oxygen is only liquid over a very narrow band of very cold temperatures.","topic":"science: using the table to compare liquid ranges"},{"id":"s11-particles-state-changes:p6","level":"medium","type":"mc","q":"Wet clothes on a washing line in a warm breeze slowly dry out. The air is at 22 degrees C, well below the boiling point of water. A pupil wrote: this is condensation, because the water is leaving the clothes. What should the pupil have written?","options":["Evaporation, because the liquid water is becoming a gas","Condensation is correct, because the water is moving","Boiling, because the water is turning into a gas","Melting, because the water comes off the cloth"],"answer":"Evaporation, because the liquid water is becoming a gas","hint":"Ask the test question. Is the substance becoming a gas, or stopping being one?","explain":"Ask the test question: is the substance becoming a gas, or stopping being one? The water in the clothes is liquid and it is becoming a gas in the air, so it is becoming one. That is evaporation, which goes up and away. Condensation is the opposite direction, gas coming back to liquid and settling. It is not boiling, because the air is at 22 degrees C, nowhere near the boiling point of water, and the water is only leaving the surface. Melting needs a solid turning into a liquid, and there is no solid here.","topic":"science: marking the evaporation and condensation swap"},{"id":"s11-particles-state-changes:p7","level":"medium","type":"text","q":
