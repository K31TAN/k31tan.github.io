istance and time"}, {"id": "s7-forces-calc:q3", "level": "easy", "type": "mc", "q": "What is the unit of pressure?", "options": ["The pascal, Pa, which is the same as N/m^2", "The newton, N", "The metre squared, m^2", "The kilogram, kg"], "answer": "The pascal, Pa, which is the same as N/m^2", "hint": "Pressure is force divided by area, so its unit is the force unit divided by the area unit.", "explain": "Pressure is measured in pascals, Pa. Because pressure = force divided by area, the unit is newtons divided by metres squared, N/m^2, and 1 Pa is defined as exactly 1 N/m^2. The newton on its own is the unit of force, not pressure, and m^2 on its own is the unit of area.", "topic": "pressure: units of pressure"}, {"id": "s7-forces-calc:q4", "level": "easy", "type": "text", "q": "Case A. A wooden box pushes down with a force of 100 N onto an area of 2 m^2. Work out the pressure in Pa.", "answer": "50", "accept": ["50", "50 Pa", "50Pa", "50 pascals", "50 N/m^2", "50.0"], "hint": "Pressure = force divided by area. Put the 100 on top.", "explain": "The pressure is 50 Pa. Pressure = force divided by area = 100 divided by 2 = 50 Pa. Check it forwards: 50 Pa over 2 m^2 is 50 x 2 = 100 N of force, which matches. Multiplying to get 200 would be the wrong way round, because pressure spreads a force out over an area, so a bigger area must give a smaller pressure.", "topic": "pressure: calculating pressure from force and area"}, {"id": "s7-forces-calc:q5", "level": "medium", "type": "mc", "q": "Journey 2. A train covers 240 km in 3 hours. What is its speed?", "options": ["80 km/h", "720 km/h", "0.0125 km/h", "243 km/h"], "answer": "80 km/h", "hint": "Speed = distance divided by time, and the units follow the same pattern: kilometres divided by hours gives km/h.", "explain": "The speed is 80 km/h. Speed = distance divided by time = 240 divided by 3 = 80. The unit is km/h because the distance was in kilometres and the time was in hours. 720 comes from multiplying instead of dividing, and 0.0125 comes from doing 3 divided by 240, which is upside down. Check it forwards: 80 km every hour for 3 hours is 240 km.", "topic": "speed: speed in km per hour"}, {"id": "s7-forces-calc:q6", "level": "medium", "type": "text", "q": "Journey 3. A runner keeps a steady speed of 5 m/s for 40 s. How far does he run, in metres?", "answer": "200", "accept": ["200", "200 m", "200m", "200 metres", "200.0"], "hint": "You want distance, so cover distance up in speed = distance / time. What is left is speed next to time.", "explain": "The distance is 200 m. Cover up distance in speed = distance / time and what is left is speed and time side by side, so distance = speed x time = 5 x 40 = 200 m. Think about what it means: he covers 5 m in every single second, and there are 40 of those seconds, so 5 x 40. Dividing to get 8 is the trap, because dividing would give a distance smaller than the speed, which makes no sense over 40 seconds.", "topic": "speed: rearranging to find distance"}, {"id": "s7-forces-calc:q7", "level": "medium", "type": "text", "q": "Journey 4. A car covers 150 m at a steady speed of 25 m/s. How long does it take, in seconds?", "answer": "6", "accept": ["6", "6 s", "6s", "6 seconds", "6.0"], "hint": "You want time, so cover time up in speed = distance / time. What is left is distance over speed.", "explain": "The time is 6 s. Cover up time in speed = distance / time and what is left reads distance over speed, so time = distance / speed = 150 divided by 25 = 6 s. Check it forwards: 25 m each second for 6 s is 25 x 6 = 150 m, which matches. Multiplying to get 3750 would be doing a forward step again instead of undoing it.", "topic": "speed: rearranging to find time"}, {"id": "s7-forces-calc:q8", "level": "medium", "type": "text", "q": "Case B. A brick pushes down with a force of 24 N, resting on its large face of area 0.02 m^2. Work out the pressure in Pa.", "answer": "1200", "accept": ["1200", "1200 Pa", "1200Pa", "1200 pascals", "1200 N/m^2", "1,200", "1200.0"], "hint": "Pressure = force divided by area. Dividing by 0.02 is the same as dividing by 2 and then multiplying by 100.", "explain": "The pressure is 1200 Pa. Pressure = force divided by area = 24 divided by 0.02. Dividing by a number smaller than 1 makes the answer BIGGER, which feels wrong but is correct. Handle it like this: 24 divided by 0.02 is the same as 2400 divided by 2, because multiplying both numbers by 100 does not change the answer. 2400 divided by 2 = 1200 Pa. Check it forwards: 1200 x 0.02 = 24 N, which matches.", "topic": "pressure: dividing by a decimal area"}, {"id": "s7-forces-calc:q9", "level": "medium", "type": "mc", "q": "Case C is the same brick with the same 24 N, but stood on its small end, area 0.008 m^2 instead of 0.02 m^2. The pressure is now 3000 Pa instead of 1200 Pa. Why is the pressure higher?", "options": ["The same force is now pressed into a smaller area, and a smaller area always gives a bigger pressure for the same force", "The brick becomes heavier when it is stood on its end", "A smaller area means a bigger force pushing down", "Pressure and area always get bigger together"], "answer": "The same force is now pressed into a smaller area, and a smaller area always gives a bigger pressure for the same force", "hint": "The brick has not changed, so the force has not changed. Only one thing in the formula is different.", "explain": "The force is identical, 24 N in both cases, because it is the same brick and gravity has not changed. Only the area is different. Pressure = force divided by area, so dividing the same 24 N by a smaller number gives a bigger answer: 24 divided by 0.008 = 3000 Pa against 24 divided by 0.02 = 1200 Pa. This is why a drawing pin has a sharp point and a knife has a thin blade: tiny area, huge pressure, from an ordinary force.", "topic": "pressure: why smaller area gives greater pressure"}, {"id": "s7-forces-calc:q10", "level": "medium", "type": "text", "q": "Case D. A person with a weight of 600 N stands in boots, and the two soles together cover 0.03 m^2. Work out the pressure on the ground in Pa.", "answer": "20000", "accept": ["20000", "20000 Pa", "20000Pa", "20,000", "20000 pascals", "20000 N/m^2", "20 000", "20000.0"], "hint": "600 divided by 0.03 is the same as 60000 divided by 3.", "explain": "The pressure is 20000 Pa. Pressure = force divided by area = 600 divided by 0.03. Multiply both numbers by 100 to clear the decimal, which does not change the answer: 60000 divided by 3 = 20000 Pa. Check it forwards: 20000 x 0.03 = 600 N, which matches. If you got 20, you divided by 3 and forgot that the area was 0.03 and not 30.", "topic": "pressure: pressure under a person"}, {"id": "s7-forces-calc:q11", "level": "stretch", "type": "text", "q": "Journey 5. A walker covers 3.6 km in 30 minutes. Work out the speed in m/s. Convert the units first.", "answer": "2", "accept": ["2", "2 m/s", "2m/s", "2.0", "2 metres per second"], "hint": "There are 1000 m in a kilometre and 60 s in a minute. Do both conversions before you divide anything.", "explain": "The speed is 2 m/s. Convert first. 3.6 km = 3.6 x 1000 = 3600 m, because there are 1000 m in every kilometre. 30 minutes = 30 x 60 = 1800 s. Now divide: speed = 3600 divided by 1800 = 2 m/s. The common wreck here is writing 3.6 km as 360 m or 36 m. Move the digits three places for a km to m conversion, so 3.6 becomes 3600, and sanity check it: a walker doing about 2 m/s is right, while 0.2 m/s would be slower than a toddler and 20 m/s would be Olympic sprint pace held for half an hour.", "topic": "speed: converting units before calculating"}, {"id": "s7-forces-calc:q12", "level": "stretch", "type": "text", "q": "Case F. A crate pushes down with a force of 900 N and produces a pressure of 3000 Pa on the floor. Work out the area of the base of the crate, in m^2.", "answer": "0.3", "accept": ["0.3", "0.3 m^2", "0.3m^2", ".3", "0.30", "0.3 m2", "0.3 square metres"], "hint": "Area is the awkward one because it started underneath. Cover it up in pressure = force / area and see what is left.", "explain": "The area is 0.3 m^2. Cover up area in pressure = force / area and what is left reads force over pressure, so area = force / pressure = 900 divided by 3000. Cancel a zero from each to get 90 divided by 300, cancel again to get 9 divided by 30 = 0.3 m^2. Check it forwards: 900 divided by 0.3 = 3000 Pa, which matches. Multiplying to get 2700000 is the classic wrong move, and the size of that number should stop you dead, because no crate has an area of 2.7 million square metres.", "topic": "pressure: rearranging to find area"}, {"id": "s7-forces-calc:q13", "level": "stretch", "type": "text", "q": "Case G. A flat hydraulic pad has an area of 0.4 m^2 and the pressure under it is 5000 Pa. Work out the force pushing down, in newtons.", "answer": "2000", "accept": ["2000", "2000 N", "2000N", "2,000", "2000 newtons", "2000.0"], "hint": "You want force, so cover force up in pressure = force / area. What is left is pressure next to area.", "explain": "The force is 2000 N. Cover up force in pressure = force / area and what is left is pressure and area side by side, so force = pressure x area = 5000 x 0.4 = 2000 N. Multiplying by 0.4 makes a number smaller, which is correct here, because the pad only covers 0.4 of a square metre and each square metre carries 5000 N. Dividing to get 12500 is the wrong move: force was already on top in the original formula, so it never needed undoing.", "topic": "pressure: rearranging to find force"}, {"id": "s7-forces-calc:q14", "level": "stretch", "type": "long", "q": "Compare case D, a person in boots with a total sole area of 0.03 m^2, with case E, the same person in snowshoes with a total area of 0.6 m^2. Their weight is 600 N in both cases. Work out both pressures, then explain why snowshoes stop someone sinking into deep snow. Finish by explaining why a drawing pin has the opposite design.", "marks": 5, "answer": "In boots the pressure is force divided by area, so 600 divided by 0.03 = 20000 Pa. In snowshoes it is 600 divided by 0.6 = 1000 Pa. The person's weight is exactly the same in both cases, 600 N, because it is the same person and gravity has not changed. What changes is the area that weight is spread over. The snowshoes spread the same 600 N over twenty times more area, so the pressure on the snow is twenty times smaller. Snow gives way when the pressure on it is too high, so at 1000 Pa the surface holds and at 20000 Pa it collapses and the person sinks. A drawing pin is designed the other way round on purpose. The head is wide so the pressure on your thumb is low and it does not hurt, and the point has a tiny area so the same modest force becomes an enormous pressure, which is what pushes it into the wood. Same force, opposite area, opposite result.", "hint": "Do the two calculations first and write both answers with units. Then say what stayed the same and what changed, and only then explain the snow.", "explain": "Five marks are available. One, the boot pressure calculated correctly as 600 divided by 0.03 = 20000 Pa with the unit. Two, the snowshoe pressure as 600 divided by 0.6 = 1000 Pa with the unit. Three, stating that the weight is unchanged at 600 N and only the area changed. Four, linking a bigger area to a smaller pressure, so the snow can take the load without giving way. Five, the drawing pin reversed: a tiny area concentrates a normal force into a very high pressure, while the wide head keeps the pressure on the thumb low. An answer saying the snowshoes make the person lighter scores zero on that point, because the weight is identical. Nothing has been made lighter, the load has been spread out.", "topic": "pressure: comparing pressures in a real situation"}]}, "s8-energy": {"id": "s8-energy", "day": "Day 3", "subject": "Science", "title": "Energy stores and transfers", "minutes": 25, "objective": "Name energy stores correctly, describe transfers between them, use conservation of energy, calculate efficiency as a percentage, and explain why saying energy is used up is wrong.", "extract": "THREE SITUATIONS AND ONE TABLE, described in words. There are no pictures.\n\nSITUATION 1, THE BIKE. A cyclist sits still at the top of a hill, then freewheels down without pedalling once. At the top, she and the bike together have 15000 J in their gravitational potential store. By the bottom, 12000 J has ended up in the kinetic store and 3000 J has ended up in thermal stores in the brakes, the tyres and the air she pushed through.\n\nSITUATION 2, THE KETTLE. A kettle is supplied with 200000 J of energy electrically. Of that, 180000 J ends up in the thermal store of the water. The rest ends up warming the metal body of the kettle and the air in the kitchen.\n\nSITUATION 3, THE CLIMBER. A climber with a mass of 70 kg slips and falls 5 m before the rope catches her. Gravitational field strength is 10 N/kg. Use this formula: energy in the gravitational potential store = mass x gravitational field strength x height.\n\nTABLE OF THREE LAMPS. Each lamp is supplied with 100 J of energy electrically. The table gives how much of that 100 J is transferred usefully as light.\n\nLamp F, an old filament lamp: 5 J as light.\nLamp H, a halogen lamp: 10 J as light.\nLamp L, an LED lamp: 80 J as light.", "teach": {"intro": ["Energy is not a thing you can hold. It is a number that keeps track of what a system can do. We say energy sits in STORES, and we say it is TRANSFERRED from one store to another.", "Learn these five store names exactly. The KINETIC store belongs to anything moving. The GRAVITATIONAL POTENTIAL store belongs to anything lifted up high. The CHEMICAL store is in food, fuel and batteries. The THERMAL store is in anything warm, and it gets bigger when something gets hotter. The ELASTIC POTENTIAL store is in anything stretched or squashed, like a drawn bow or a compressed spring.", "Use the full names. Writing heat energy or movement energy instead of thermal store and kinetic store loses marks in exams that are strict about it, and the full names are no harder to learn.", "Energy moves between stores in four ways: mechanically, when a force moves something; electrically, when a current flows; by heating, when something hot warms something colder; and by radiation, meaning light or sound carrying it away.", "CONSERVATION OF ENERGY is the big rule. Energy cannot be created and it cannot be destroyed. It can only be transferred from one store to another. The total before a transfer always equals the total after it, every time, with no exceptions.", "So energy is never USED UP. When people say a battery has run out of energy, what has actually happened is that the chemical store has emptied into other stores, mostly thermal stores spread thinly through the surroundings. The energy is all still there, it is just spread out so thinly that nothing useful can be done with it. The proper word for that is DISSIPATED, and dissipated energy is called wasted energy, not lost energy.", "EFFICIENCY tells you what fraction of the energy went where you wanted. Efficiency = useful energy transferred divided by total energy supplied, then multiplied by 100 to make it a percentage. A device that is 90% efficient wastes the other 10%, and no ordinary device can ever be more than 100% efficient, because that would mean creating energy out of nothing."], "example": {"problem": "Situation 2, the kettle. It is supplied with 200000 J electrically and 180000 J ends up in the thermal store of the water. Work out how much energy is wasted, and then work out the efficiency of the kettle as a percentage.", "steps": ["Start with conservation of energy. Everything that goes in has to come out somewhere, so total in = useful out + wasted out.", "Wasted = total in - useful out = 200000 - 180000 = 20000 J.", "That 20000 J has not vanished. It is in the thermal store of the metal body and the thermal store of the kitchen air, spread out and no use for making tea.", "Now efficiency. Efficiency = useful divided by total, then x 100.", "Useful divided by total = 180000 divided by 200000. Cancel the four zeros off each: 18 divided by 20 = 0.9.", "Multiply by 100 to turn it into a percentage: 0.9 x 100 = 90%.", "Check it makes sense. Wasted is 20000 out of 200000, which is 10%, and 90% + 10% = 100%. The two must always add to 100."], "answer": "20000 J is wasted, and the kettle is 90% efficient."}, "example2": {"problem": "Situation 1, the bike. Describe the energy transfer as the cyclist freewheels from the top of the hill to the bottom, and show that energy has been conserved.", "steps": ["At the top she is high up and not moving, so 15000 J sits in the gravitational potential store and there is nothing in the kinetic store.", "As she rolls down, she loses height and gains speed. Energy is transferred mechanically from the gravitational potential store into the kinetic store.", "She is not pedalling, so nothing is coming out of any chemical store in her muscles. All of the energy at the bottom came from the store she filled by climbing the hill in the first place.", "Some of it does not reach the kinetic store. Friction in the brakes and the wheel bearings, and drag from the air, transfer 3000 J into thermal stores in the brakes, the tyres and the air.", "Add up the finish: 12000 J kinetic + 3000 J thermal = 15000 J. That is exactly what she started with, so energy has been conserved.", "The 3000 J is wasted, not destroyed. It is warming the brake blocks and the air, spread out too thinly to be any use, which is why the brakes feel hot at the bottom of a long descent."], "answer": "Gravitational potential store to kinetic store, transferred mechanically, with 3000 J dissipated to thermal stores. 12000 + 3000 = 15000 J, so the total is unchanged."}, "keyfact": "Energy is never created, destroyed or used up. It is only transferred between stores, and wasted energy has simply been dissipated into thermal stores in the surroundings where nothing useful can be done with it."}, "questions": [{"id": "s8-energy:q1", "level": "easy", "type": "mc", "q": "Which energy store does a moving football have?", "options": ["The kinetic store", "The chemical store", "The elastic potential store", "The gravitational potential store"], "answer": "The kinetic store", "hint": "Kinetic is the word scientists use for moving.", "explain": "Anything that is moving has energy in its kinetic store. The chemical store is in fuel, food and batteries. The elastic potential store belongs to things stretched or squashed. The gravitational potential store belongs to things lifted up high.", "topic": "energy: naming the kinetic store"}, {"id": "s8-energy:q2", "level": "easy", "type": "mc", "q": "A chocolate bar and a litre of petrol both hold energy in the same type of store. Which store is it?", "options": ["The chemical store", "The thermal store", "The kinetic store", "The elastic potential store"], "answer": "The chemical store", "hint": "Both of them release their energy through a reaction, one in your body and one in an engine.", "explain": "Food, fuel and batteries all hold energy in the chemical store, and it is released by a chemical reaction. The thermal store is about how hot something is, and a cold chocolate bar still holds all its chemical energy, which shows the two are different.", "topic": "energy: naming the chemical store"}, {"id": "s8-energy:q3", "level": "easy", "type": "text", "q": "You pull back a catapult and hold it stretched. Which energy store have you filled? Give the full name.", "answer": "elastic potential", "accept": ["elastic potential", "elastic potential store", "elastic", "the elastic potential store", "elastic store", "elastic potential energy", "strain"], "hint": "It is the store that anything stretched or squashed has.", "explain": "You have filled the elastic potential store. Anything stretched or squashed and able to spring back has energy in this store, including a drawn bow, a compressed spring and a wound up rubber band. Let it go and that energy transfers mechanically into the kinetic store of whatever is fired.", "topic": "energy: naming the elastic potential store"}, {"id": "s8-energy:q4", "level": "easy", "type": "mc", "q": "Situation 1. The cyclist is sitting still at the top of the hill. Which store holds the 15000 J at that moment?", "options": ["The gravitational potential store", "The kinetic store", "The thermal store", "The elastic potential store"], "answer": "The gravitational potential store", "hint": "She is not moving yet, so it cannot be the moving store. What has she got that someone at the bottom has not?", "explain": "It is in the gravitational potential store. She is high up, which is exactly what that store measures, and she is not moving, so the kinetic store is empty. She filled the gravitational potential store when she climbed the hill in the first place, and now she is about to get it back on the way down.", "topic": "energy: identifying the gravitational potential store"}, {"id": "s8-energy:q5", "level": "easy", "type": "mc", "q": "What does conservation of energy say?", "options": ["Energy cannot be created or destroyed, only transferred from one store to another", "Energy slowly runs out and disappears", "Energy can be created by a battery and destroyed by a lamp", "Energy is only conserved if a device is 100% efficient"], "answer": "Energy cannot be created or destroyed, only transferred from one store to another", "hint": "Count the energy before and count it after. The rule says something about those two totals.", "explain": "Energy cannot be created or destroyed, only transferred between stores. The total before always equals the total after. Batteries do not create energy, they transfer it out of a chemical store, and lamps do not destroy it, they transfer it away as light and thermal energy. Conservation holds even for a hopelessly inefficient device, because the wasted energy still exists, it is just in an unhelpful store.", "topic": "energy: conservation of energy"}, {"id": "s8-energy:q6", "level": "medium", "type": "text", "q": "Situation 2. The kettle is supplied with 200000 J and 180000 J ends up usefully in the thermal store of the water. How much energy is wasted, in joules?", "answer": "20000", "accept": ["20000", "20000 J", "20000J", "20,000", "20 000", "20000 joules", "20000.0"], "hint": "Everything supplied has to end up somewhere. Take the useful amount away from the total supplied.", "explain": "20000 J is wasted. By conservation of energy, total supplied = useful + wasted, so wasted = 200000 - 180000 = 20000 J. That energy is not gone. It is in the thermal store of the metal body and the kitchen air, dissipated too thinly to boil anything.", "topic": "energy: finding wasted energy using conservation"}, {"id": "s8-energy:q7", "level": "medium", "type": "text", "q": "Situation 2. Work out the efficiency of the kettle as a percentage. It is supplied with 200000 J and transfers 180000 J usefully.", "answer": "90", "accept": ["90", "90%", "90 %", "90 percent", "90.0"], "hint": "Efficiency = useful divided by total, then multiply by 100. Cancel the zeros before you divide.", "explain": "The efficiency is 90%. Efficiency = useful divided by total, x 100. That is 180000 divided by 200000, and cancelling four zeros off each gives 18 divided by 20 = 0.9. Then 0.9 x 100 = 90%. Check it: the wasted 20000 J is 10% of 200000, and 90% + 10% = 100%, so it fits.", "topic": "energy: calculating efficiency as a percentage"}, {"id": "s8-energy:q8", "level": "medium", "type": "mc", "q": "Situation 1. Which sentence best describes what happens as the cyclist freewheels down the hill?", "options": ["Energy is transferred mechanically from the gravitational potential store to the kinetic store, with some dissipated to thermal stores", "Energy is created in the kinetic store as she picks up speed", "Energy is transferred from the chemical store in her legs to the kinetic store", "The gravitational potential store is destroyed and replaced by a new kinetic store"], "answer": "Energy is transferred mechanically from the gravitational potential store to the kinetic store, with some dissipated to thermal stores", "hint": "She is freewheeling, so she is not pedalling at all. Where can the energy possibly be coming from?", "explain": "She loses height and gains speed, so energy moves from the gravitational potential store to the kinetic store, and a force is doing it, which makes the transfer mechanical. Friction and drag dissipate 3000 J of it into thermal stores. Nothing is created, because 12000 + 3000 = 15000 J, exactly what she started with. Her chemical store is not involved, because freewheeling means she is not pedalling.", "topic": "energy: describing a transfer between stores"}, {"id": "s8-energy:q9", "level": "medium", "type": "text", "q": "Use the table. Lamp F is supplied with 100 J and transfers 5 J as light. Work out its efficiency as a percentage.", "answer": "5", "accept": ["5", "5%", "5 %", "5 percent", "5.0"], "hint": "Efficiency = useful divided by total, x 100. Dividing by 100 and then multiplying by 100 leaves the number unchanged.", "explain": "Lamp F is 5% efficient. Efficiency = useful divided by total, x 100 = 5 divided by 100 = 0.05, then 0.05 x 100 = 5%. When the total supplied happens to be exactly 100 J, the useful joules and the percentage are the same number, which is a handy shortcut. The other 95 J is dissipated as thermal energy, which is why old filament bulbs got too hot to touch.", "topic": "energy: efficiency of a lamp"}, {"id": "s8-energy:q10", "level": "medium", "type": "mc", "q": "Someone says the energy in a torch battery gets used up. Why is that wrong?", "options": ["The energy is still there, it has just been transferred out of the chemical store into light and into thermal stores spread through the surroundings", "The energy is destroyed by the bulb, so the sentence should say destroyed", "The energy stays in the battery forever, so the torch never really goes out", "Nothing is wrong with it, because energy really does get used up"], "answer": "The energy is still there, it has just been transferred out of the chemical store into light and into thermal stores spread through the surroundings", "hint": "Conservation of energy says the total never changes. So if it is not in the battery any more, where is it?", "explain": "Energy cannot be used up, because it cannot be destroyed. What has happened is that the chemical store in the battery has emptied, transferring electrically to the bulb, which sends some out as light and dissipates the rest into thermal stores in the bulb and the air. The total amount of energy is exactly the same as before, but it is now spread out so thinly that nothing useful can be done with it. That is what wasted energy means: dissipated, not destroyed.", "topic": "energy: why energy is not used up"}, {"id": "s8-energy:q11", "level": "medium", "type": "text", "q": "Situation 3. A climber of mass 70 kg falls 5 m. Gravitational field strength is 10 N/kg. Use energy in the gravitational potential store = mass x gravitational field strength x height to work out how much energy leaves her gravitational potential store during the fall. Give your answer in joules.", "answer": "3500", "accept": ["3500", "3500 J", "3500J", "3,500", "3500 joules", "3500.0"], "hint": "Multiply the three numbers together, in any order. Doing 70 x 10 first makes the second step easy.", "explain": "3500 J leaves the gravitational potential store. Energy = mass x gravitational field strength x height = 70 x 10 x 5. Take it in two steps: 70 x 10 = 700, then 700 x 5 = 3500 J. Notice that 70 x 10 = 700 is her weight in newtons, so the formula is really weight x height. While she falls, that 3500 J transfers into her kinetic store, and when the rope catches her it transfers again, mostly into the elastic potential store of the stretching rope and then into thermal stores.", "topic": "energy: calculating gravitational potential energy"}, {"id": "s8-energy:q12", "level": "stretch", "type": "text", "q": "Lamp F is 5% efficient. A room needs 240 J of light. How much electrical energy must be supplied to Lamp F to produce 240 J of light? Give your answer in joules.", "answer": "4800", "accept": ["4800", "4800 J", "4800J", "4,800", "4800 joules", "4800.0"], "hint": "5% efficient means the useful light is 5/100 of what goes in. You have been given the useful light and asked for what goes in, so run the formula backwards.", "explain": "4800 J must be supplied. Forwards, useful = total x 5/100, which is total divided by 20. You have been given the useful energy and asked for the total, so undo it: the undo of divide by 20 is multiply by 20, giving 240 x 20 = 4800 J. Check it forwards: 5% of 4800 is 4800 divided by 20 = 240 J of light, which matches. The wrong move is taking 5% of 240 to get 12, which is running the rule forwards on a number that was already the answer.", "topic": "energy: working backwards from efficiency"}, {"id": "s8-energy:q13", "level": "stretch", "type": "mc", "q": "Situation 1. At the bottom of the hill the cyclist has 12000 J in her kinetic store. She then brakes gently until she is completely stopped. Where has the 12000 J gone?", "options": ["Into thermal stores in the brakes, the tyres and the air, dissipated to the surroundings", "It has been destroyed by the brakes", "It has gone back into the gravitational potential store", "It stays in the kinetic store, because energy is conserved"], "answer": "Into thermal stores in the brakes, the tyres and the air, dissipated to the surroundings", "hint": "Put your hand near a bike brake block after a long descent. What has changed about it?", "explain": "It is transferred into thermal stores in the brake blocks, the wheel rims, the tyres and the air, which is why brakes get hot. It cannot be destroyed, because energy is conserved. It cannot go back to the gravitational potential store, because she is at the bottom and has not climbed anything. The last option misreads conservation: conservation says the TOTAL is unchanged, not that the energy has to stay in the same store.", "topic": "energy: dissipation when braking"}, {"id": "s8-energy:q14", "level": "stretch", "type": "long", "q": "Lamp L, an LED, is 80% efficient. Lamp F, an old filament lamp, is 5% efficient. Both are supplied with 100 J. Explain what happens to the energy in each lamp, why the filament lamp gets much hotter, and why it is wrong to say the filament lamp destroys 95 J of energy.", "marks": 5, "answer": "Both lamps are supplied with 100 J electrically. Lamp L is 80% efficient, so 80 J is transferred usefully as light by radiation and the other 20 J is dissipated into thermal stores in the lamp and the surrounding air. Lamp F is 5% efficient, so only 5 J is transferred as light and 95 J is dissipated into thermal stores. That is why the filament lamp gets far hotter to touch: nineteen times more of the supplied energy ends up warming the bulb and the air around it instead of leaving as light. It is wrong to say the 95 J is destroyed, because energy cannot be created or destroyed, only transferred between stores. All 100 J still exists after the transfer, 5 J of it as light and 95 J of it in thermal stores spread through the room. That energy is called wasted or dissipated, not lost, because it is spread out so thinly that nothing useful can be done with it. In both lamps the totals add back to 100 J, which is conservation of energy working exactly as it should.", "hint": "Do the numbers for both lamps first, in joules, then explain the heat, then deal with the word destroyed using conservation of energy.", "explain": "Five marks. One, Lamp L transfers 80 J usefully as light and dissipates 20 J to thermal stores. Two, Lamp F transfers 5 J as light and dissipates 95 J to thermal stores. Three, linking that to the temperature: far more of the supplied energy ends up in thermal stores in the filament lamp, so it heats itself and the surrounding air much more. Four, stating conservation of energy properly, that energy cannot be created or destroyed, only transferred. Five, saying that the 95 J still exists and is dissipated into the surroundings, which is what wasted energy means, so wasted and destroyed are not the same thing. Answers that say the energy is lost or used up lose the last mark even if the numbers are right, because the whole point of the question is that nothing is lost.", "topic": "energy: efficiency, dissipation and conservation together"}]}, "s9-practical-skills": {"id": "s9-practical-skills", "day": "Day 4", "subject": "Science", "title": "Getting the numbers right", "minutes": 25, "objective": "Name the independent, dependent and control variables, spot an anomaly and leave it out of the mean, tell accuracy from precision, judge what a conclusion is allowed to say, and never leave a question blank.", "extract": "ONE EXPERIMENT AND THREE EXTRA SETS OF READINGS, described in words. There are no pictures or graphs.\n\nBEN'S BOUNCE EXPERIMENT.\n\nBen drops the same rubber ball onto the same wooden floor from different heights and measures how high it bounces back. He measures every height with the same metre rule, held vertically against the wall, and the same person reads it every time. He repeats each drop height three times.\n\nRESULTS, bounce height in cm.\n\nDropped from 20 cm: 12, 13, 11\nDropped from 40 cm: 25, 24, 26\nDropped from 60 cm: 37, 4, 38\nDropped from 80 cm: 49, 51, 86\nDropped from 100 cm: 62, 61, 63\n\nTHREE EXTRA SETS OF READINGS, each taken from a different experiment. Each set has exactly one anomaly in it.\n\nSET W, the time for 10 swings of the same pendulum, in seconds: 12, 14, 13, 40\nSET X, the temperature of the same beaker of water, in degrees C: 21, 22, 20, 45\nSET Y, the mass of the same lump of clay, in grams: 5.0, 5.2, 5.1, 9.8", "teach": {"intro": ["An experiment only proves something if ONE thing is changed at a time. The INDEPENDENT variable is the one thing you deliberately change. The DEPENDENT variable is the thing you measure, and its value depends on what you changed. CONTROL variables are everything else, and you keep every single one of them the same.", "There is a quick test. Say the sentence: I change the ..., and I measure the ... For Ben, I change the drop height, and I measure the bounce height. First blank is the independent variable, second blank is the dependent variable, and everything else on the bench is a control variable.", "An ANOMALY is a reading that clearly does not fit with the others, almost always caused by a mistake in the measuring rather than by real science. Bounce heights of 37, 4 and 38 tell you straight away that the 4 is the odd one out.", "Here is the exact method for a mean with an anomaly, and this is the one that appeared last in the test and was left blank. Step 1, look at the readings and cross out the anomaly, but do not rub it off the table, because there are marks for showing you spotted it. Step 2, add up the readings that are LEFT. Step 3, divide by how many readings are left, not by how many you started with. For 37, 4 and 38 that is 37 + 38 = 75, then 75 divided by 2 = 37.5. Dividing by 3 out of habit is the single biggest trap in this whole topic.", "REPEATS exist for two reasons. They let you spot an anomaly, because you cannot tell that a reading is odd if you only took one. They also let you take a mean, which cancels out small measuring errors and makes the result more reliable.", "ACCURATE and PRECISE are different words and examiners love the difference. Accurate means close to the true value. Precise means the repeat readings are close to each other. A balance that has not been zeroed can give 5.0, 5.0 and 5.0 grams for an object that is really 4.0 grams. Those readings are very precise and completely inaccurate.", "A CONCLUSION must not say more than the data proves. If Ben tested one ball on one floor, he can conclude something about that ball on that floor, and nothing about every ball or every floor. Adding the words this ball to a conclusion is often the difference between a mark and no mark.", "Last thing, and it matters more than anything else on this page. NEVER leave a question blank. A blank scores zero, guaranteed, every time. A wrong attempt also scores zero, but it costs nothing, and a half right attempt scores something. In the last weekly test the final question was ignore the anomaly and find the mean of 12, 14, 13 and 40, and it was left blank, two days after scoring 11 out of 13 on that exact skill. Write the numbers down, write anything, and give the marker something to award."], "example": {"problem": "Ben's readings for a drop height of 60 cm are 37, 4 and 38. Identify the anomaly and work out the mean bounce height without it.", "steps": ["Look at the three readings side by side: 37, 4 and 38. Two of them agree closely with each other and one does not come near them.", "The anomaly is 4. Sense check it against the rest of the table too. Dropping from 60 cm should bounce higher than dropping from 40 cm, which gave about 25 cm, so a bounce of 4 cm is impossible. Something was misread or the ball hit the edge of the rule.", "Cross the 4 out but leave it written in the table, because there are marks for showing you found it.", "Add the readings that are LEFT: 37 + 38 = 75.", "Count how many readings are left. Two, not three.", "Divide by 2, not by 3: 75 divided by 2 = 37.5.", "Check it sits inside the readings you used. 37.5 is between 37 and 38, so it looks right. If you had divided by 3 you would have got 25, which is outside the range of 37 and 38, and that alone tells you it is wrong."], "answer": "The anomaly is 4, and the mean of the rest is 37.5 cm."}, "example2": {"problem": "Set W. The time for 10 swings of the same pendulum was measured four times, giving 12, 14, 13 and 40 seconds. Ignore the anomaly and find the mean.", "steps": ["Line the readings up: 12, 14, 13, 40. Three of them cluster around 12 to 14 and one is nowhere near.", "The anomaly is 40. The same pendulum cannot take three times as long on one go, so that reading is a timing mistake, probably the stopwatch being stopped late.", "Add the readings that are left: 12 + 14 + 13 = 39.", "Count what is left. Three readings, so divide by 3, not by 4.", "39 divided by 3 = 13.", "The mean is 13 seconds. Check it sits inside 12 to 14. It does.", "For comparison, leaving the 40 in would give 12 + 14 + 13 + 40 = 79, then 79 divided by 4 = 19.75, which is higher than three of the four actual readings. That is how badly one anomaly wrecks a mean."], "answer": "13 seconds"}, "keyfact": "Cross out the anomaly, add what is left, and divide by how many readings are LEFT. And never leave a question blank, because a blank scores zero every single time while an attempt costs you nothing."}, "questions": [{"id": "s9-practical-skills:q1", "level": "easy", "type": "mc", "q": "In Ben's bounce experiment, what is the independent variable?", "options": ["The height the ball is dropped from", "The height the ball bounces to", "The type of ball", "The floor it is dropped onto"], "answer": "The height the ball is dropped from", "hint": "Fill in the sentence: I change the ...", "explain": "The independent variable is the drop height, because that is the one thing Ben deliberately changes, from 20 cm up to 100 cm. The bounce height is what he measures, so that is the dependent variable. The ball and the floor stay the same every time, which makes them control variables.", "topic": "working scientifically: identifying the independent variable"}, {"id": "s9-practical-skills:q2", "level": "easy", "type": "mc", "q": "In Ben's bounce experiment, what is the dependent variable?", "options": ["The height the ball bounces to", "The height the ball is dropped from", "The metre rule", "The number of repeats"], "answer": "The height the ball bounces to", "hint": "Fill in the sentence: I measure the ...", "explain": "The dependent variable is the bounce height. It is the thing Ben measures, and how big it is depends on the drop height he chose, which is what dependent means. The metre rule is a piece of equipment, not a variable, and the number of repeats is part of the method.", "topic": "working scientifically: identifying the dependent variable"}, {"id": "s9-practical-skills:q3", "level": "easy", "type": "mc", "q": "Which of these is a CONTROL variable in Ben's experiment?", "options": ["Using the same rubber ball every single time", "The height the ball is dropped from", "The height the ball bounces to", "The fact that he repeated each drop three times"], "answer": "Using the same rubber ball every single time", "hint": "A control variable is something that could change the result, so it is deliberately kept the same.", "explain": "Using the same ball is a control variable. A different ball could easily bounce differently, so keeping it the same means any change in bounce height must come from the drop height. The drop height is what he changes and the bounce height is what he measures, so neither is a control variable, and repeating three times is part of the method rather than a variable.", "topic": "working scientifically: control variables"}, {"id": "s9-practical-skills:q4", "level": "easy", "type": "text", "q": "Set W. The time for 10 swings of the same pendulum was measured as 12, 14, 13 and 40 seconds. Ignore the anomaly and work out the mean. Give your answer in seconds.", "answer": "13", "accept": ["13", "13 s", "13s", "13 seconds", "13.0"], "hint": "Cross out the reading that does not fit. Then add the three that are left and divide by 3, not by 4.", "explain": "The mean is 13 seconds. The anomaly is 40, because the other three all sit between 12 and 14 and the same pendulum cannot suddenly take three times as long. Add the readings that are left: 12 + 14 + 13 = 39. There are three of them, so divide by 3: 39 divided by 3 = 13. Two errors to avoid. Dividing by 4 instead of 3 gives 9.75, which is below every reading you used. Leaving the 40 in gives 79 divided by 4 = 19.75, which is higher than three of the four readings.", "topic": "working scientifically: mean with an anomaly removed"}, {"id": "s9-practical-skills:q5", "level": "easy", "type": "mc", "q": "What should you do with an anomalous result?", "options": ["Leave it out of the mean but keep it written in the table", "Rub it out completely so nobody sees it", "Include it in the mean like every other reading", "Change the number so it fits the pattern"], "answer": "Leave it out of the mean but keep it written in the table", "hint": "There are marks for showing that you noticed it. You cannot show that if it is not on the page.", "explain": "Leave it out of the mean, but keep it in the table. Marks are given for spotting an anomaly and saying why you ignored it, and you cannot show either of those if you have rubbed it out. Including it drags the mean away from the true value, and changing a number to fit is making data up, which is the one thing you must never do in science.", "topic": "working scientifically: what to do with an anomaly"}, {"id": "s9-practical-skills:q6", "level": "medium", "type": "text", "q": "Set X. The temperature of the same beaker of water was measured as 21, 22, 20 and 45 degrees C. Ignore the anomaly and work out the mean. Give your answer in degrees C.", "answer": "21", "accept": ["21", "21 C", "21 degrees", "21 degrees C", "21.0", "21C"], "hint": "Spot the odd one out first, then add the three that are left and divide by 3.", "explain": "The mean is 21 degrees C. The anomaly is 45, because the other three readings sit tightly between 20 and 22 and the water cannot have jumped over 20 degrees hotter in one reading. Add what is left: 21 + 22 + 20 = 63. Three readings are left, so divide by 3: 63 divided by 3 = 21. The mean should always land inside the readings you used, and 21 sits neatly between 20 and 22.", "topic": "working scientifically: mean with an anomaly removed"}, {"id": "s9-practical-skills:q7", "level": "medium", "type": "text", "q": "Ben's readings for a drop height of 60 cm are 37, 4 and 38. Which one is the anomaly? Write just the number.", "answer": "4", "accept": ["4", "4 cm", "4cm", "the 4", "4 centimetres"], "hint": "Two of the three readings agree closely. Also check it against the row above, for a 40 cm drop.", "explain": "The anomaly is 4. The other two readings for 60 cm are 37 and 38, which agree closely with each other, so the 4 is nowhere near them. The rest of the table backs it up: a 40 cm drop bounced to about 25 cm, so a 60 cm drop bouncing only 4 cm is impossible. Something went wrong with the measuring, such as the ball catching the edge of the rule or the reading being taken too late.", "topic": "working scientifically: spotting an anomaly"}, {"id": "s9-practical-skills:q8", "level": "medium", "type": "text", "q": "Work out the mean bounce height for a drop height of 60 cm, ignoring the anomaly. The readings are 37, 4 and 38. Give your answer in cm.", "answer": "37.5", "accept": ["37.5", "37.5 cm", "37.5cm", "37 1/2", "37.50"], "hint": "You are only using two readings now, so divide by 2, not by 3.", "explain": "The mean is 37.5 cm. Ignore the anomaly of 4 and use only 37 and 38. Add them: 37 + 38 = 75. Two readings are left, so divide by 2: 75 divided by 2 = 37.5 cm. Dividing by 3 out of habit gives 25, which is below both of the readings you used, and that is impossible for a mean. If your mean falls outside the readings you used, you have divided by the wrong number.", "topic": "working scientifically: mean with an anomaly removed"}, {"id": "s9-practical-skills:q9", "level": "medium", "type": "text", "q": "Work out the mean bounce height for a drop height of 80 cm, ignoring the anomaly. The readings are 49, 51 and 86. Give your answer in cm.", "answer": "50", "accept": ["50", "50 cm", "50cm", "50.0", "50 centimetres"], "hint": "Find the reading that does not fit, then add the other two and divide by 2.", "explain": "The mean is 50 cm. The anomaly is 86, because 49 and 51 agree closely with each other and a ball cannot bounce back to 86 cm when it was only dropped from 80 cm. Add the two that are left: 49 + 51 = 100. Divide by 2, because only two readings are left: 100 divided by 2 = 50 cm. Including the 86 would give 186 divided by 3 = 62, which would wrongly suggest the ball bounced higher from 80 cm than the pattern allows.", "topic": "working scientifically: mean with an anomaly removed"}, {"id": "s9-practical-skills:q10", "level": "medium", "type": "mc", "q": "A balance has not been zeroed properly. Weighing the same lump of clay three times gives 5.0 g, 5.0 g and 5.0 g, but the true mass is 4.0 g. Which sentence describes those readings?", "options": ["They are precise but not accurate", "They are accurate but not precise", "They are both accurate and precise", "They are neither accurate nor precise"], "answer": "They are precise but not accurate", "hint": "One of the two words is about how close the readings are to each other. The other is about how close they are to the truth.", "explain": "They are precise but not accurate. Precise means the repeat readings are close to each other, and 5.0, 5.0 and 5.0 could hardly be closer. Accurate means close to the true value, and the true mass is 4.0 g, so every reading is 1.0 g out. This is the reason repeating a measurement is not enough on its own: a faulty instrument gives you the same wrong answer over and over, and no amount of repeating will reveal it.", "topic": "working scientifically: accuracy against precision"}, {"id": "s9-practical-skills:q11", "level": "medium", "type": "text", "q": "Set Y. The mass of the same lump of clay was measured as 5.0, 5.2, 5.1 and 9.8 grams. Ignore the anomaly and work out the mean. Give your answer in grams.", "answer": "5.1", "accept": ["5.1", "5.1 g", "5.1g", "5.10", "5.1 grams"], "hint": "Add the three sensible readings first. Line the decimal points up before you add.", "explain": "The mean is 5.1 g. The anomaly is 9.8, because the other three sit between 5.0 and 5.2 and the same lump of clay cannot nearly double in mass. Add what is left: 5.0 + 5.2 + 5.1 = 15.3. Three readings are left, so divide by 3: 15.3 divided by 3 = 5.1 g. Check it: 5.1 sits between 5.0 and 5.2, so it is in range. Decimals do not change the method at all, they just need the decimal points lined up when you add.", "topic": "working scientifically: mean of decimal readings with an anomaly"}, {"id": "s9-practical-skills:q12", "level": "medium", "type": "mc", "q": "You have two minutes left in a test and you reach a question giving four readings with one anomaly, asking for the mean. You are not certain you can do it. What is the best thing to do?", "options": ["Write down your best attempt, because a blank always scores zero and an attempt costs nothing", "Leave it blank, because a wrong answer loses you marks", "Cross the question out so the marker skips it", "Copy the four numbers out and stop there"], "answer": "Write down your best attempt, because a blank always scores zero and an attempt costs nothing", "hint": "Compare what a blank is worth with what a wrong answer is worth. Then ask which one could possibly be worth more.", "explain": "Always write an attempt. A blank scores zero with total certainty. A wrong answer also scores zero, but it takes nothing away, because wrong answers are never penalised in these papers, and a partly right attempt picks up method marks. Crossing the question out is just a blank with extra steps. Copying the numbers out is better than nothing, but going one step further and crossing out the anomaly and adding the rest would earn method marks even if the final division went wrong. The last three questions of the last test were blank, and that is worth about 8 percentage points on its own.", "topic": "working scientifically: never leaving a question blank"}, {"id": "s9-practical-skills:q13", "level": "stretch", "type": "text", "q": "Work out the mean bounce height for a drop height of 100 cm. The readings are 62, 61 and 63. Read them carefully before you decide what to do. Give your answer in cm.", "answer": "62", "accept": ["62", "62 cm", "62cm", "62.0", "62 centimetres"], "hint": "Check whether any reading is actually an anomaly before you throw one away. Do all three agree closely?", "explain": "The mean is 62 cm. This row has no anomaly in it: 62, 61 and 63 all agree closely and they all fit the pattern of the table, so nothing gets crossed out. Add all three: 62 + 61 + 63 = 186. Divide by 3, because all three are being used: 186 divided by 3 = 62 cm. The trap here is the opposite of the earlier questions. Once you have removed a few anomalies you start hunting for one in every row, and throwing away a perfectly good reading is just as wrong as keeping a bad one. Only remove a reading that clearly does not fit.", "topic": "working scientifically: mean when there is no anomaly"}, {"id": "s9-practical-skills:q14", "level": "stretch", "type": "long", "q": "The mean bounce heights are 12 cm from 20 cm, 25 cm from 40 cm, 37.5 cm from 60 cm, 50 cm from 80 cm and 62 cm from 100 cm. Ben writes: These results prove that every ball bounces back to about 62% of the height it is dropped from. Explain what his data does support, explain why his conclusion says too much, and describe two changes that would make his investigation stronger.", "marks": 5, "answer": "The data does support a clear conclusion: for this rubber ball on this wooden floor, the bounce height goes up as the drop height goes up, and it is close to a fixed fraction of the drop height each time. Checking the means against the drop heights gives 12 out of 20, 25 out of 40, 37.5 out of 60, 50 out of 80 and 62 out of 100, which are all between 60% and 63%, so the pattern is genuinely there. His conclusion says too much because of the word every. He only tested one ball on one floor. A tennis ball, a cricket ball or a ball of dough would all behave differently, and the same rubber ball would bounce differently on carpet or on concrete, so he has no evidence at all about any of those. To make the claim he wants, he would need to test several different balls on the same floor under identical conditions. Two changes that would make the investigation stronger. First, test several different balls and several different floor surfaces, keeping everything else the same, so the conclusion can be about balls in general rather than about one ball. Second, do more than three repeats at each height, and use a phone camera to film the bounce against the metre rule, because judging the top of a fast bounce by eye is where the anomalies of 4 cm and 86 cm almost certainly came from. Both changes make the results more reliable and let the conclusion be trusted further.", "hint": "Three separate jobs here. Say what the numbers really do show, then attack the word every, then give two improvements and say why each one helps.", "explain": "Five marks are available. One, saying what the data does support: as drop height increases, bounce height increases, and the bounce is close to a constant fraction of the drop height for this ball on this floor. Two, checking that fraction against the actual numbers, for example 50 out of 80 is 62.5% and 62 out of 100 is 62%, rather than just repeating Ben's figure. Three, attacking the word every: only one ball on one surface was tested, so the results say nothing about other balls or other floors. Four, one improvement with a reason, such as testing several balls and surfaces under identical conditions so a general conclusion becomes possible. Five, a second improvement with a reason, such as more repeats or filming the bounce to remove the human judgement that produced the anomalies. An answer that only says he should do it more times, without saying why that helps, earns one mark rather than two.", "topic": "working scientifically: judging what a conclusion is allowed to say"}]}, "de6-wordorder-rebuild": {"id": "de6-wordorder-rebuild", "day": "Day 1", "subject": "German", "title": "Verb second, properly this time", "minutes": 20, "objective": "Box up the ideas in a German sentence and put the conjugated verb in box two every time.", "extract": null, "teach": {"intro": ["German has one rule that decides where the words go. The verb that carries the ending must sit in second position. Position here means second idea, not second word.", "An idea is a chunk you cannot split. Am Montag is one idea, because am belongs to Montag and neither half makes sense alone. Mein kleiner Bruder is also one idea, because all three words name one person.", "So here is the method, and use it every time. Draw a box round each idea before you decide anything. Then count the boxes. Box one can hold anything you like, but box two always holds the verb.", "That is the whole rule. When something other than the person goes in box one, the person is pushed out and lands in box three, just behind the verb."], "example": {"problem": "Box up the ideas in Am Montag gehe ich in die Schule, and check the verb is in box two.", "steps": ["Box one is Am Montag. Two words, one idea, because am and Montag cannot be split.", "Box two is gehe. That is the verb, from gehen, to go.", "Box three is ich, the person doing it.", "Box four is in die Schule. Three words, one idea, because they all name the same place.", "Four boxes in total, and the verb sits in box two, so the sentence is correct."], "answer": "[Am Montag] [gehe] [ich] [in die Schule]. The verb is in box two, so it is right."}, "example2": {"problem": "Rewrite Ich spiele am Dienstag Tennis so that it starts with Am Dienstag.", "steps": ["Find the conjugated verb first. It is spiele, from spielen, to play.", "Am Dienstag goes into box one. It is one idea even though it is two words.", "The verb has to be in box two, so spiele is written next.", "The person ich has been pushed out of box one, so it lands in box three.", "Tennis is the last idea and goes at the end."], "answer": "Am Dienstag spiele ich Tennis."}, "keyfact": "Box the ideas first, then count boxes and not words. Box one can be anything, but box two is always the verb."}, "questions": [{"id": "de6-wordorder-rebuild:q1", "level": "easy", "type": "mc", "q": "Which word is the verb in Ich trinke Wasser in der Pause?", "options": ["Ich", "trinke", "Wasser", "Pause"], "answer": "trinke", "hint": "The verb is the doing word. It is the one whose ending changes to match ich.", "explain": "The answer is trinke. Trinken means to drink, and with ich the ending becomes -e, so it is trinke. Ich is the person doing it, Wasser is the thing being drunk, and Pause is part of the time phrase in der Pause, meaning in the break.", "topic": "word order: finding the verb"}, {"id": "de6-wordorder-rebuild:q2", "level": "easy", "type": "mc", "q": "How many ideas is Am Montag?", "options": ["One idea", "Two ideas", "Three ideas", "No ideas at all"], "answer": "One idea", "hint": "Try splitting it up. If the halves make no sense on their own, it is one idea.", "explain": "The answer is one idea. Am Montag is two words but only one idea, because am on its own means nothing here and it has to stay glued to Montag. This is the exact place where counting words instead of ideas goes wrong.", "topic": "word order: counting ideas not words"}, {"id": "de6-wordorder-rebuild:q3", "level": "easy", "type": "mc", "q": "In a German statement, which box does the conjugated verb always sit in?", "options": ["Box one", "Box two", "Box three", "The last box"], "answer": "Box two", "hint": "It is the same box every time, whatever is in box one.", "explain": "The answer is box two. The conjugated verb is always the second idea in a German statement. It never moves, which is why everything else has to shuffle around it.", "topic": "word order: the verb second rule"}, {"id": "de6-wordorder-rebuild:q4", "level": "easy", "type": "mc", "q": "Which of these is one single idea?", "options": ["mein kleiner Bruder", "spiele ich Fussball", "und ich gehe", "Bruder spielt"], "answer": "mein kleiner Bruder", "hint": "One idea names one thing, one person or one time. It does not contain a verb.", "explain": "The answer is mein kleiner Bruder, meaning my little brother. It is three words but it names one person, so it fills one box. The other three all bolt separate ideas together, and two of them contain a verb, which always gets its own box.", "topic": "word order: spotting one idea"}, {"id": "de6-wordorder-rebuild:q5", "level": "easy", "type": "text", "q": "Put these words into a correct sentence: trinke / ich / Wasser", "answer": "Ich trinke Wasser.", "accept": ["Ich trinke Wasser", "Ich trinke Wasser.", "ich trinke wasser", "ich trinke wasser."], "hint": "Start with the person, then the verb.", "explain": "The answer is Ich trinke Wasser. Ich is box one and the verb trinke is box two, which is the normal order. Wasser is the thing being drunk and goes at the end.", "topic": "word order: normal statement order"}, {"id": "de6-wordorder-rebuild:q6", "level": "easy", "type": "mc", "q": "Which sentence is correct?", "options": ["Morgen ich lerne Deutsch.", "Morgen lerne ich Deutsch.", "Lerne morgen ich Deutsch.", "Ich morgen lerne Deutsch."], "answer": "Morgen lerne ich Deutsch.", "hint": "Box up each option and count to two.", "explain": "The answer is Morgen lerne ich Deutsch. Morgen means tomorrow and fills box one, so the verb lerne must be box two and ich is pushed into box three. Morgen ich lerne Deutsch puts the verb in box three, which German does not allow. Lerne morgen ich Deutsch starts with the verb, which makes it a question. Ich morgen lerne Deutsch also leaves the verb in box three.", "topic": "word order: fronted time phrase"}, {"id": "de6-wordorder-rebuild:q7", "level": "medium", "type": "text", "q": "Rewrite this sentence so it starts with Am Mittwoch: Ich spiele Basketball.", "answer": "Am Mittwoch spiele ich Basketball.", "accept": ["Am Mittwoch spiele ich Basketball", "Am Mittwoch spiele ich Basketball.", "am mittwoch spiele ich basketball", "am mittwoch spiele ich basketball."], "hint": "Am Mittwoch takes box one, so the verb has to come straight after it.", "explain": "The answer is Am Mittwoch spiele ich Basketball. Am Mittwoch means on Wednesday and fills box one, so the verb spiele takes box two and ich moves to box three. Am Mittwoch ich spiele Basketball would push the verb into box three, which is wrong.", "topic": "word order: fronted time phrase"}, {"id": "de6-wordorder-rebuild:q8", "level": "medium", "type": "text", "q": "Rewrite this sentence so it starts with Um sechs Uhr: Wir essen Pizza.", "answer": "Um sechs Uhr essen wir Pizza.", "accept": ["Um sechs Uhr essen wir Pizza", "Um sechs Uhr essen wir Pizza.", "um sechs uhr essen wir pizza", "um sechs uhr essen wir pizza."], "hint": "Um sechs Uhr is three words, but ask yourself how many ideas it is.", "explain": "The answer is Um sechs Uhr essen wir Pizza. Um sechs Uhr means at six o'clock and is three words but only one idea, so it all fits in box one. The verb essen takes box two and wir moves to box three. If you had counted words you would have put the verb after Um, which is why you count boxes.", "topic": "word order: fronted time phrase of three words"}, {"id": "de6-wordorder-rebuild:q9", "level": "medium", "type": "mc", "q": "Why is Um acht Uhr ich lerne Deutsch wrong?", "options": ["The verb lerne should be lernst", "The verb is in box three, and it must be in box two", "A time phrase cannot come first in German", "ich must always be the first word"], "answer": "The verb is in box three, and it must be in box two", "hint": "Box it up and count. Where has the verb ended up?", "explain": "The answer is that the verb is in box three and it must be in box two. Um acht Uhr is box one, ich is box two and lerne has been pushed into box three. The correct sentence is Um acht Uhr lerne ich Deutsch. The verb form lerne is right for ich, so the form was never the problem.", "topic": "word order: diagnosing a verb third error"}, {"id": "de6-wordorder-rebuild:q10", "level": "medium", "type": "text", "q": "In a correct German statement, how many ideas come before the conjugated verb? Write the number.", "answer": "1", "accept": ["1", "one", "One", "1.", "one idea", "One idea", "1 idea"], "hint": "The verb is in box two, so count how many boxes are in front of it.", "explain": "The answer is 1. Exactly one idea comes before the verb, because the verb is in box two. That one idea can be a single word like Morgen, or a whole chunk like Mein kleiner Bruder, and it still counts as one.", "topic": "word order: one idea before the verb"}, {"id": "de6-wordorder-rebuild:q11", "level": "medium", "type": "text", "q": "Correct this sentence: Am Samstag ich fahre nach Birmingham.", "answer": "Am Samstag fahre ich nach Birmingham.", "accept": ["Am Samstag fahre ich nach Birmingham", "Am Samstag fahre ich nach Birmingham.", "am samstag fahre ich nach birmingham", "am samstag fahre ich nach birmingham."], "hint": "Only two words need to swap places.", "explain": "The answer is Am Samstag fahre ich nach Birmingham. Am Samstag is box one, so the verb fahre must be box two and ich moves behind it into box three. The verb form fahre is already correct for ich, so only the order needed fixing.", "topic": "word order: correcting verb third"}, {"id": "de6-wordorder-rebuild:q12", "level": "stretch", "type": "mc", "q": "Which sentence is correct German, with the verb in box two?", "options": ["Mein Bruder und ich gehen ins Kino.", "Mein Bruder gehen und ich ins Kino.", "Mein Bruder und gehen ich ins Kino.", "Ins Kino mein Bruder und ich gehen."], "answer": "Mein Bruder und ich gehen ins Kino.", "hint": "A person can be named in four words and still fill only one box.", "explain": "The answer is Mein Bruder und ich gehen ins Kino. Mein Bruder und ich is four words, but it names one group of people, so it is one idea and fills box one. That makes gehen the second idea even though it is the fifth word. The group means we, so the verb takes the wir ending -en. The other three options break the subject apart or leave the verb stranded at the end.", "topic": "word order: counting ideas not words"}, {"id": "de6-wordorder-rebuild:q13", "level": "stretch", "type": "text", "q": "Put these into one sentence, starting with the time phrase: Deutsch / lerne / am Freitag / ich", "answer": "Am Freitag lerne ich Deutsch.", "accept": ["Am Freitag lerne ich Deutsch", "Am Freitag lerne ich Deutsch.", "am freitag lerne ich deutsch", "am freitag lerne ich deutsch."], "hint": "Time phrase in box one, verb in box two, person in box three.", "explain": "The answer is Am Freitag lerne ich Deutsch. Am Freitag is one idea and fills box one, so the verb lerne takes box two and ich follows in box three. Deutsch is the thing being learned and goes at the end. Notice that am Freitag needs a capital A once it starts the sentence.", "topic": "word order: building a sentence from scrambled ideas"}, {"id": "de6-wordorder-rebuild:q14", "level": "stretch", "type": "long", "q": "Your friend writes Am Montag ich gehe in die Schule. Explain what is wrong with it, show how the boxing method finds the mistake, and write out the corrected sentence.", "marks": 4, "answer": "The sentence is wrong because the verb is not in box two. If I box up the ideas I get [Am Montag] [ich] [gehe] [in die Schule]. Am Montag is one idea even though it is two words, so it fills box one on its own. That means ich has landed in box two and the verb gehe has been pushed into box three, which German does not allow. To fix it, I keep Am Montag in box one, move the verb gehe into box two, and put ich into box three, because the person always slides in just behind the verb when something else starts the sentence. The corrected sentence is Am Montag gehe ich in die Schule. The verb form gehe was right all along, so only the order needed changing.", "hint": "Box the ideas, say which box the verb ended up in, then say which two words swap.", "explain": "A full answer has four parts, one mark each. One, you say the verb is not in box two. Two, you box the ideas up and point out that Am Montag is two words but one idea, so it fills box one by itself. Three, you say ich and gehe need to swap, because the person goes just behind the verb. Four, you write the corrected sentence in full: Am Montag gehe ich in die Schule. If you only wrote the corrected sentence with no explanation, that is one mark. The part most people leave out is saying why Am Montag counts as a single box, and that is the part that stops this mistake happening again.", "topic": "word order: explaining and correcting a verb third error"}]}, "de7-cases": {"id": "de7-cases", "day": "Day 2", "subject": "German", "title": "Nominative and accusative", "minutes": 20, "objective": "Pick der or den correctly by working out who is doing the action and who is having it done to them.", "extract": null, "teach": {"intro": ["Most sentences with an action have two people or things in them. One does the action. The other has the action done to it.", "Ask two questions in this order. Who is doing it? That one is the subject. Who or what is having it done to them? That one is the direct object.", "German marks the difference on the word for the. In the subject slot a masculine word keeps der. In the object slot der changes to den. That is the whole change.", "Nothing else moves. Die words stay die, das words stay das, and plural die stays die. Only der changes, so there is only one thing to remember. The same happens to ein, which becomes einen, and to mein, which becomes meinen, again only on der words."], "example": {"problem": "Fill both gaps with der or den: ___ Hund beisst ___ Mann. It means the dog bites the man.", "steps": ["Ask who is doing it. The dog does the biting, so Hund is the subject.", "Hund is a der word, and subjects keep der, so it is Der Hund.", "Ask who is having it done to them. The man is being bitten, so Mann is the direct object.", "Mann is a der word too, and in the object slot der changes to den, so it is den Mann."], "answer": "Der Hund beisst den Mann."}, "example2": {"problem": "Fill both gaps: Ich sehe ___ Film und ich lese ___ Buch.", "steps": ["In both halves ich is doing it, so ich is the subject and nothing changes there.", "Film is having it done to it, so it is the direct object. Film is a der word, so der becomes den.", "Buch is also the direct object, but Buch is a das word.", "Das words never change in the object slot, so it stays das Buch."], "answer": "Ich sehe den Film und ich lese das Buch."}, "keyfact": "Only der changes. Der becomes den when the word is the one having the action done to it. Die, das and plural die stay exactly the same."}, "questions": [{"id": "de7-cases:q1", "level": "easy", "type": "mc", "q": "In the sentence Der Junge wirft den Ball, who or what is doing the action?", "options": ["Der Junge", "den Ball", "wirft", "Nobody is doing it"], "answer": "Der Junge", "hint": "Ask who is doing it. The thrower, not the thing thrown.", "explain": "The answer is Der Junge, meaning the boy. He is doing the throwing, so he is the subject and keeps der. Den Ball is the thing having it done to it, and wirft is the action itself.", "topic": "cases: finding the subject"}, {"id": "de7-cases:q2", "level": "easy", "type": "mc", "q": "Which word for the goes with a masculine word in the subject slot?", "options": ["der", "den", "die", "das"], "answer": "der", "hint": "The subject slot is the one that does not change.", "explain": "The answer is der. A masculine word that is doing the action keeps der, which is the form you learn it with in the first place. Den is the form it takes when it is the one having the action done to it.", "topic": "cases: nominative der"}, {"id": "de7-cases:q3", "level": "easy", "type": "mc", "q": "When a der word is the thing having the action done to it, der changes to which word?", "options": ["die", "das", "den", "dem"], "answer": "den", "hint": "It gains one letter on the end.", "explain": "The answer is den. Der becomes den in the object slot, so the dog bites the man is Der Hund beisst den Mann. Dem is a different form used after certain small words like mit, and that comes later.", "topic": "cases: accusative den"}, {"id": "de7-cases:q4", "level": "easy", "type": "mc", "q": "Which genders stay exactly the same in the object slot?", "options": ["die and das", "der and das", "der and die", "all of them change"], "answer": "die and das", "hint": "Only one gender changes at all.", "explain": "The answer is die and das. Die words and das words look identical whether they are doing the action or having it done to them, and plural die does not change either. Der is the only one that changes, and it becomes den.", "topic": "cases: which genders change"}, {"id": "de7-cases:q5", "level": "easy", "type": "text", "q": "Fill the gap with der or den: Ich esse ___ Apfel.", "answer": "den", "accept": ["den", "den.", "Den", "Den.", "den Apfel", "Den Apfel"], "hint": "Ask who is having it done to them. The apple is not doing the eating.", "explain": "The answer is den. Apfel is a der word, and here the apple is the thing being eaten, so it is the direct object and der changes to den. The full sentence is Ich esse den Apfel, meaning I eat the apple.", "topic": "cases: der to den after essen"}, {"id": "de7-cases:q6", "level": "easy", "type": "text", "q": "Fill the gap with der or den: ___ Hund schlaeft.", "answer": "Der", "accept": ["Der", "der", "Der.", "der.", "Der Hund", "der Hund"], "hint": "There is nothing having anything done to it in this sentence.", "explain": "The answer is Der. The dog is doing the sleeping, so Hund is the subject and keeps der. Nothing is having the action done to it here, so there is no object slot to worry about. The sentence Der Hund schlaeft, written properly as schläft, means the dog is sleeping.", "topic": "cases: subject with no object"}, {"id": "de7-cases:q7", "level": "medium", "type": "text", "q": "Fill the gap with the right word for the: Ich lese ___ Buch.", "answer": "das", "accept": ["das", "das.", "Das", "Das.", "das Buch", "Das Buch"], "hint": "Check the gender first. Only one gender changes.", "explain": "The answer is das. Buch is a das word, and das words never change in the object slot, so it stays das Buch even though the book is the thing being read. If Buch had been a der word you would have needed den.", "topic": "cases: das words do not change"}, {"id": "de7-cases:q8", "level": "medium", "type": "mc", "q": "Why is Ich sehe der Film wrong?", "options": ["Film is feminine, so it should be die Film", "Film is a der word and it is the thing being seen, so it must be den Film", "sehen can never have an object", "der should be das here"], "answer": "Film is a der word and it is the thing being seen, so it must be den Film", "hint": "Who is doing the seeing, and who is being seen?", "explain": "The answer is that Film is a der word and it is the thing being seen, so it must be den Film. Ich is doing the seeing, which makes Film the direct object, and der changes to den in that slot. The correct sentence is Ich sehe den Film. Film really is a der word, so the gender was never the problem.", "topic": "cases: diagnosing a der and den error"}, {"id": "de7-cases:q9", "level": "medium", "type": "text", "q": "Fill the gap with ein or einen: Ich habe ___ Bruder.", "answer": "einen", "accept": ["einen", "einen.", "Einen", "Einen.", "einen Bruder", "Einen Bruder"], "hint": "Ein changes in the same slot and for the same gender as der.", "explain": "The answer is einen. Bruder is a der word, and here the brother is the one being had, so it is the direct object. Ein follows the same rule as der and becomes einen. The sentence Ich habe einen Bruder means I have a brother.", "topic": "cases: ein to einen"}, {"id": "de7-cases:q10", "level": "medium", "type": "text", "q": "Fill the gap with ein or eine: Ich sehe ___ Katze.", "answer": "eine", "accept": ["eine", "eine.", "Eine", "Eine.", "eine Katze", "Eine Katze"], "hint": "Check the gender before you change anything.", "explain": "The answer is eine. Katze is a die word, and die words do not change in the object slot, so it stays eine Katze. Only der words change, so einen would be wrong here.", "topic": "cases: die words keep eine"}, {"id": "de7-cases:q11", "level": "medium", "type": "mc", "q": "In Meine Schwester kauft den Kuchen, which part is the direct object?", "options": ["Meine Schwester", "kauft", "den Kuchen", "Meine"], "answer": "den Kuchen", "hint": "The direct object is the one having the action done to it.", "explain": "The answer is den Kuchen, meaning the cake. My sister is doing the buying, so she is the subject, and the cake is what is being bought. Kuchen is a der word, which is why it shows up here as den Kuchen.", "topic": "cases: finding the direct object"}, {"id": "de7-cases:q12", "level": "stretch", "type": "text", "q": "Write in German: The teacher reads the book. The teacher is male.", "answer": "Der Lehrer liest das Buch.", "accept": ["Der Lehrer liest das Buch", "Der Lehrer liest das Buch.", "der lehrer liest das buch", "der lehrer liest das buch."], "hint": "One of these two nouns changes its word for the, and one does not.", "explain": "The answer is Der Lehrer liest das Buch. Lehrer is a der word and he is doing the reading, so he keeps der. Buch is a das word and it is the thing being read, but das never changes, so it stays das Buch. The er form of lesen changes the e to ie, which gives liest.", "topic": "cases: subject and object in one sentence"}, {"id": "de7-cases:q13", "level": "stretch", "type": "text", "q": "Write in German: On Monday my brother eats the apple. Start with Am Montag.", "answer": "Am Montag isst mein Bruder den Apfel.", "accept": ["Am Montag isst mein Bruder den Apfel", "Am Montag isst mein Bruder den Apfel.", "am montag isst mein bruder den apfel", "am montag isst mein bruder den apfel."], "hint": "Two rules at once. Verb in box two, and the apple is having it done to it.", "explain": "The answer is Am Montag isst mein Bruder den Apfel. Am Montag is box one, so the verb goes in box two and mein Bruder follows in box three. My brother counts as er, and the er form of essen changes the e to i and gives isst. Apfel is a der word and it is being eaten, so der becomes den. Mein Bruder is doing the eating, so mein stays as mein and does not become meinen.", "topic": "cases: accusative combined with verb second"}, {"id": "de7-cases:q14", "level": "stretch", "type": "long", "q": "A dog bites a man in the street. Write that in German, then explain how you chose the word for the in front of each noun. Then write what The man bites the dog would be, and say exactly what changed.", "marks": 4, "answer": "The dog bites the man is Der Hund beisst den Mann. I chose the words like this. First I asked who is doing it, and the dog is doing the biting, so Hund is the subject and keeps der. Then I asked who is having it done to them, and the man is being bitten, so Mann is the direct object, and because Mann is a der word it changes to den. The man bites the dog is Der Mann beisst den Hund. What changed is not the order of ideas but the word for the on each noun. Mann has moved into the subject slot so it takes der, and Hund has moved into the object slot so it takes den. That is the point of the case system: the little word in front tells you who did it, so the meaning is carried by der and den and not just by which noun comes first.", "hint": "Do the two questions in order, who is doing it and who is having it done to them, then swap the roles round.", "explain": "A full answer has four parts, one mark each. One, Der Hund beisst den Mann, spelled with den in front of Mann. Two, an explanation that uses both questions: the dog is doing it so it keeps der, the man is having it done to him so der becomes den. Three, Der Mann beisst den Hund written correctly. Four, the point that the der and den swapped over because the roles swapped, so the meaning is carried by those little words. The strongest answers say that this is why German can be understood even when the word order is unusual. If you only wrote the two sentences with no explanation, that is two marks.", "topic": "cases: explaining how der and den carry the meaning"}]}, "de8-vocab-daily": {"id": "de8-vocab-daily", "day": "Day 3", "subject": "German", "title": "School, home and the day", "minutes": 20, "objective": "Use everyday school and home words with the right gender, tell the time, name the days, and build sentences that keep the verb in box two.", "extract": null, "teach": {"intro": ["Learn every noun with its der, die or das attached. The gender is part of the word, like a surname. Learning Schule on its own is learning half a word.", "The days are Montag, Dienstag, Mittwoch, Donnerstag, Freitag, Samstag and Sonntag. All seven are der words, and on Monday is am Montag.", "For the time, Es ist acht Uhr means it is eight o'clock and Um acht Uhr means at eight o'clock. Watch halb very carefully. Halb neun does not mean half past nine. It means half past eight, because German counts towards the next hour and not away from the last one.", "Every sentence you build here still follows Day 1. Time phrase in box one if you want it there, and then the verb in box two."], "example": {"problem": "Write At seven o'clock I eat breakfast in German, starting with the time.", "steps": ["Um sieben Uhr is the time phrase. It is three words but one idea, so it fills box one.", "The verb is essen. With ich it is esse, so esse goes in box two.", "ich has been pushed out of box one, so it goes in box three.", "Fruehstueck is a das word, but German says Fruehstueck essen with no word for the, so it just goes at the end."],
