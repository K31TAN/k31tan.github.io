eans she: Sie ___ ein Buch.", "answer": "liest", "accept": ["liest.", "liest"], "hint": "The e becomes ie. Watch out for the s that is already there.", "explain": "The answer is liest. In lesen the e changes to ie, giving the stem lies, and the ending -t is added to make liest. Because the stem already ends in s, the du form is also liest, so those two forms look identical.", "topic": "irregular verbs: lesen er and sie form"}, {"id": "de3-irregular:q7", "level": "medium", "type": "text", "q": "Fill the gap with the right form of sehen: Du ___ einen Film.", "answer": "siehst", "accept": ["siehst.", "siehst"], "hint": "The e becomes ie, then add -st.", "explain": "The answer is siehst. In sehen the e changes to ie, giving the stem sieh, and the du ending -st is added. The er form is sieht, with just a -t.", "topic": "irregular verbs: sehen du form"}, {"id": "de3-irregular:q8", "level": "medium", "type": "text", "q": "Fill the gap with the right form of sprechen: Er ___ Deutsch.", "answer": "spricht", "accept": ["spricht", "spricht."], "hint": "The e becomes i, not ie.", "explain": "The answer is spricht. In sprechen the e changes to a short i, giving the stem sprich, and the er ending -t is added. Take care not to write spriecht, because this verb takes a plain i and not ie.", "topic": "irregular verbs: sprechen er form"}, {"id": "de3-irregular:q9", "level": "stretch", "type": "text", "q": "Fill the gap with the right form of essen: Du ___ einen Apfel.", "answer": "isst", "accept": ["isst", "Isst"], "hint": "The e becomes i, and the stem already ends in a double s.", "explain": "The answer is isst. In essen the e changes to i, which gives the stem iss, and because that already ends in s you only add -t. So the du form and the er form are both isst. Be careful, because ist without the second s is a different word and means is.", "topic": "irregular verbs: essen du form"}, {"id": "de3-irregular:q10", "level": "stretch", "type": "mc", "q": "Which sentence is correct?", "options": ["Du sprechst Deutsch.", "Du sprichst Deutsch.", "Du spricht Deutsch.", "Du spreche Deutsch."], "answer": "Du sprichst Deutsch.", "hint": "Change the vowel first, then add the du ending.", "explain": "The answer is Du sprichst Deutsch. The du form of sprechen changes the e to i and then adds -st, giving sprichst. Du sprechst forgets the vowel change, Du spricht uses the er ending, and Du spreche uses the ich ending.", "topic": "irregular verbs: sprechen du form"}]}, "de4-together": {"id": "de4-together", "day": "Thursday", "subject": "German", "title": "Putting it together", "minutes": 20, "objective": "Build sentences that use a pronoun, an irregular verb and correct verb second order at the same time.", "extract": null, "teach": {"intro": ["Now the three pieces go together. Pick the person, change the verb to match that person, then check the verb is the second idea.", "Do them in that order every time. If you choose the word order first you often forget that the verb also has to change its vowel.", "Jeden Tag liest mein Bruder ein Buch means every day my brother reads a book. Jeden Tag is idea one, liest is idea two, and mein Bruder counts as er so lesen became liest.", "One new thing you need for the last few questions. When a masculine word is the thing being acted on, ein changes to einen. Der Apfel is masculine, so 'she eats an apple' is sie isst einen Apfel. Die and das words do not change: sie liest ein Buch, sie sieht eine Katze."], "example": {"problem": "Write Today my sister travels to Berlin in German, starting with Heute.", "steps": ["The subject is meine Schwester, my sister, which counts as sie meaning she.", "The verb is fahren. With sie the vowel changes, so it becomes faehrt.", "Heute is idea one, so the verb faehrt must be idea two.", "The subject meine Schwester goes third, then nach Berlin at the end."], "answer": "Heute faehrt meine Schwester nach Berlin."}, "keyfact": "Person, then verb, then order. Check the vowel changed if the verb is irregular, then check the verb is the second idea."}, "questions": [{"id": "de4-together:q1", "level": "easy", "type": "text", "q": "Fill the gap with the right form of fahren: Heute ___ ich nach London.", "answer": "fahre", "accept": ["fahre", "fahre."], "hint": "The ich form does not change its vowel, even when the time phrase comes first.", "explain": "The answer is fahre. Heute is idea one, so the verb must be idea two and ich follows it. The ich form of fahren does not change the vowel, so it is simply fahre.", "topic": "combining: fronted time phrase with ich form"}, {"id": "de4-together:q2", "level": "easy", "type": "mc", "q": "Which sentence is correct?", "options": ["Am Montag er faehrt nach Berlin.", "Am Montag faehrt er nach Berlin.", "Am Montag fahren er nach Berlin.", "Er am Montag faehrt nach Berlin."], "answer": "Am Montag faehrt er nach Berlin.", "hint": "Check two things. Is the verb second, and does it have the right form for er?", "explain": "The answer is Am Montag faehrt er nach Berlin. Am Montag is idea one, so the verb comes second and er goes third. The er form of fahren is faehrt, with the changed vowel and a -t ending. The first option puts the verb third, the third option uses a plural ending and the last one also leaves the verb third.", "topic": "combining: fronted time phrase with an irregular verb"}, {"id": "de4-together:q3", "level": "easy", "type": "text", "q": "Fill the gap with the right form of essen: Morgen ___ du Pizza.", "answer": "isst", "accept": ["isst", "Isst"], "hint": "The du form of essen changes the vowel and already ends in s.", "explain": "The answer is isst. Morgen is idea one, the verb is idea two and du follows it. The du form of essen changes the e to i, giving iss, and then only a -t is added because the stem already ends in s.", "topic": "combining: fronted time phrase with du form"}, {"id": "de4-together:q4", "level": "easy", "type": "mc", "q": "In the sentence Jeden Tag liest sie ein Buch, which word is the second idea?", "options": ["Jeden", "Tag", "liest", "sie"], "answer": "liest", "hint": "Jeden Tag is two words but only one idea.", "explain": "The answer is liest. Jeden Tag is a single idea made of two words, so it fills position one. The verb liest is therefore the second idea, even though it is the third word. Sie then follows in third place.", "topic": "word order: counting ideas not words"}, {"id": "de4-together:q5", "level": "medium", "type": "text", "q": "Rewrite this sentence so it starts with Heute: Er spricht mit dem Lehrer.", "answer": "Heute spricht er mit dem Lehrer.", "accept": ["heute spricht er mit dem lehrer", "Heute spricht er mit dem Lehrer", "Heute spricht er mit dem Lehrer.", "heute spricht er mit dem lehrer."], "hint": "Only the order changes. The verb form stays the same.", "explain": "The answer is Heute spricht er mit dem Lehrer. Heute becomes idea one, so the verb spricht stays in second place and er moves behind it. The verb form does not change, because the person is still er.", "topic": "combining: fronting with an irregular verb"}, {"id": "de4-together:q6", "level": "medium", "type": "text", "q": "Rewrite this sentence so it starts with Am Wochenende: Wir fahren nach Hamburg.", "answer": "Am Wochenende fahren wir nach Hamburg.", "accept": ["Am Wochenende fahren wir nach Hamburg", "am wochenende fahren wir nach hamburg.", "am wochenende fahren wir nach hamburg", "Am Wochenende fahren wir nach Hamburg."], "hint": "Am Wochenende is one idea, so the verb goes straight after it.", "explain": "The answer is Am Wochenende fahren wir nach Hamburg. Am Wochenende means at the weekend and counts as one idea, so the verb fahren takes position two and wir moves to third. The wir form does not change its vowel, so it stays as fahren.", "topic": "combining: fronting with the wir form"}, {"id": "de4-together:q7", "level": "medium", "type": "text", "q": "Correct this sentence: Jeden Tag du liest ein Buch.", "answer": "Jeden Tag liest du ein Buch.", "accept": ["jeden tag liest du ein buch.", "Jeden Tag liest du ein Buch", "Jeden Tag liest du ein Buch.", "jeden tag liest du ein buch"], "hint": "The verb form is already right. Only two words are in the wrong place.", "explain": "The answer is Jeden Tag liest du ein Buch. Jeden Tag is idea one, so the verb liest must be idea two and du moves behind it. Liest is the correct du form of lesen, so nothing else needed changing.", "topic": "combining: correcting verb third"}, {"id": "de4-together:q8", "level": "medium", "type": "text", "q": "Write in German: On Monday she eats an apple. Start with Am Montag.", "answer": "Am Montag isst sie einen Apfel.", "accept": ["am montag isst sie einen apfel", "Am Montag isst sie einen Apfel", "Am Montag isst sie einen Apfel.", "am montag isst sie einen apfel."], "hint": "An apple is einen Apfel. The verb form for sie is the same as the du form here.", "explain": "The answer is Am Montag isst sie einen Apfel. Am Montag is idea one, so the verb comes second and sie goes third. The sie form of essen changes the e to i and becomes isst. Apfel is a der word, and after a verb like essen it becomes einen Apfel.", "topic": "combining: fronting with the sie form of essen"}, {"id": "de4-together:q9", "level": "stretch", "type": "text", "q": "Write in German: On Friday my sister speaks German. Start with Am Freitag.", "answer": "Am Freitag spricht meine Schwester Deutsch.", "accept": ["Am Freitag spricht meine Schwester Deutsch.", "Am Freitag spricht meine Schwester Deutsch", "am freitag spricht meine schwester deutsch.", "am freitag spricht meine schwester deutsch"], "hint": "My sister counts as she, so the verb changes its vowel from e to i.", "explain": "The answer is Am Freitag spricht meine Schwester Deutsch. Schwester is a die word, so my sister is meine Schwester, and it counts as sie meaning she. That makes sprechen change to spricht, with a short i and a -t ending. Am Freitag is idea one, so spricht is idea two and meine Schwester follows.", "topic": "combining: fronting with a noun subject and sprechen"}, {"id": "de4-together:q10", "level": "stretch", "type": "text", "q": "Write in German: In the evening we watch a film. Start with Am Abend.", "answer": "Am Abend sehen wir einen Film.", "accept": ["am abend sehen wir einen film", "Am Abend sehen wir einen Film", "am abend sehen wir einen film.", "Am Abend sehen wir einen Film."], "hint": "A film is einen Film. The wir form does not change its vowel.", "explain": "The answer is Am Abend sehen wir einen Film. Am Abend means in the evening and is idea one, so the verb sehen takes position two and wir goes third. The wir form keeps the normal vowel, so it is sehen and not siehen. Film is a der word, so a film after the verb becomes einen Film.", "topic": "combining: fronting with the wir form of sehen"}]}, "de5-speaking": {"id": "de5-speaking", "day": "Friday", "subject": "German", "title": "Out loud", "minutes": 20, "objective": "Say the week's German out loud in a real exchange, then answer questions on the dialogue.", "extract": "Ein Gespraech. A dialogue for two people. Suraj reads A and Keitan reads B, then swap roles and read it again.\n\nA: Hallo. Wie heisst du?\nB: Ich heisse Keitan. Und du?\nA: Ich heisse Suraj. Wo wohnst du?\nB: Ich wohne in London. Woher kommst du?\nA: Ich komme aus England. Sprichst du Deutsch?\nB: Ja, ein bisschen. Ich lese jeden Tag ein Buch auf Deutsch.\nA: Heute fahre ich nach Manchester.\nB: Was isst du im Zug?\nA: Im Zug esse ich einen Apfel.\nB: Siehst du deine Familie dort?\nA: Ja, am Samstag sehe ich meinen Bruder.\nB: Gut. Bis spaeter.", "teach": {"intro": ["This session is for saying it, not just writing it. Read every answer out loud before you type it.", "Four sounds do most of the work. The letters ei sound like the English word eye, so heisse sounds like hyse-uh, and the letters ie sound like ee, so liest sounds like leest.", "A German w sounds like an English v, so wohne starts like vone. A German z sounds like ts, so Zug starts like tsoog, and sch sounds like sh."], "example": {"problem": "Say where you live and where you come from in one turn.", "steps": ["Start with ich, because you are talking about yourself.", "Wohnen with ich takes the ending -e, so it is ich wohne.", "Add in and the town you live in.", "Join on und, then ich komme aus and the country."], "answer": "Ich wohne in London und ich komme aus England."}, "keyfact": "ei says eye. ie says ee. w says v. z says ts. Say it out loud before you write it."}, "questions": [{"id": "de5-speaking:q1", "level": "easy", "type": "mc", "q": "In the dialogue, where does Keitan say he lives?", "options": ["London", "Berlin", "Manchester", "Hamburg"], "answer": "London", "hint": "Look at the line that begins Ich wohne.", "explain": "The answer is London. Keitan says Ich wohne in London, which means I live in London. Manchester is where A travels to later, and Berlin and Hamburg are not in this dialogue.", "topic": "dialogue: retrieval"}, {"id": "de5-speaking:q2", "level": "easy", "type": "text", "q": "Copy from the dialogue: how does A ask What is your name?", "answer": "Wie heisst du?", "accept": ["Wie heißt du", "Wie heißt du?", "wie heisst du", "wie heisst du?", "Wie heisst du?", "wie heißt du?", "wie heißt du", "Wie heisst du"], "hint": "It is the second line of A's first turn.", "explain": "The answer is Wie heisst du. Wie means how and heisst is the du form of heissen, to be called. German asks how are you called rather than what is your name.", "topic": "dialogue: greetings and questions"}, {"id": "de5-speaking:q3", "level": "easy", "type": "mc", "q": "What does Woher kommst du mean?", "options": ["Where do you live?", "Where do you come from?", "How are you?", "What is your name?"], "answer": "Where do you come from?", "hint": "Wo means where. The extra part her adds the idea of movement away from a place.", "explain": "The answer is where do you come from. Woher asks about the place someone comes from, and the reply uses aus, as in Ich komme aus England. Wo wohnst du is where do you live, which is a different question.", "topic": "dialogue: understanding a question"}, {"id": "de5-speaking:q4", "level": "easy", "type": "text", "q": "Fill the gap from the dialogue: Heute ___ ich nach Manchester.", "answer": "fahre", "accept": ["fahre", "fahre."], "hint": "It is the ich form of the verb for travelling.", "explain": "The answer is fahre. Heute is idea one, so the verb must be idea two and ich follows it. The ich form of fahren keeps the plain a, so it is fahre.", "topic": "dialogue: fronted time phrase with fahren"}, {"id": "de5-speaking:q5", "level": "medium", "type": "mc", "q": "In the line Im Zug esse ich einen Apfel, why does ich come after the verb?", "options": ["Because Im Zug is idea one, so the verb has to be idea two", "Because ich is not important in this sentence", "Because the sentence is a question", "Because esse is an irregular verb"], "answer": "Because Im Zug is idea one, so the verb has to be idea two", "hint": "Count which idea comes first in that sentence.", "explain": "The answer is that Im Zug is idea one, so the verb has to be idea two. Once something other than the subject fills position one, the subject slides in behind the verb. Im Zug esse ich einen Apfel means on the train I eat an apple.", "topic": "word order: fronted phrase in a dialogue"}, {"id": "de5-speaking:q6", "level": "medium", "type": "text", "q": "Answer this question in German: Wo wohnst du? Say that you live in Birmingham.", "answer": "Ich wohne in Birmingham.", "accept": ["Ich wohne in Birmingham", "ich wohne in birmingham", "ich wohne in birmingham.", "Ich wohne in Birmingham."], "hint": "Answer with ich, not du. The ending has to change.", "explain": "The answer is Ich wohne in Birmingham. The question uses du wohnst, but your answer is about yourself, so the pronoun becomes ich and the ending becomes -e. A common mistake is to copy wohnst straight back.", "topic": "dialogue: answering with wohnen"}, {"id": "de5-speaking:q7", "level": "medium", "type": "text", "q": "Answer this question the way B does in the dialogue: Sprichst du Deutsch? Say yes, a little.", "answer": "Ja, ein bisschen.", "accept": ["Ja, ein bisschen.", "ja, ein bisschen.", "Ja, ein bisschen", "ja, ein bisschen", "ja ein bisschen.", "Ja ein bisschen", "ja ein bisschen", "Ja ein bisschen."], "hint": "It is two words after ja.", "explain": "The answer is Ja, ein bisschen. Ein bisschen means a little and is a useful reply when you do not want a full sentence. B then adds more detail in the next sentence.", "topic": "dialogue: short answers"}, {"id": "de5-speaking:q8", "level": "medium", "type": "text", "q": "Find the du form of sehen in the dialogue and write it.", "answer": "siehst", "accept": ["siehst.", "siehst"], "hint": "Look at the line where B asks about the family.", "explain": "The answer is siehst. B asks Siehst du deine Familie dort, meaning do you see your family there. In a question the verb moves to the front, but the form is still the du form, with the e changed to ie and the ending -st.", "topic": "dialogue: irregular verb spotting"}, {"id": "de5-speaking:q9", "level": "stretch", "type": "text", "q": "Rewrite this line so that it starts with Am Samstag: Ich sehe meinen Bruder.", "answer": "Am Samstag sehe ich meinen Bruder.", "accept": ["Am Samstag sehe ich meinen Bruder.", "Am Samstag sehe ich meinen Bruder", "am samstag sehe ich meinen bruder.", "am samstag sehe ich meinen bruder"], "hint": "The verb form does not change. Only the order does.", "explain": "The answer is Am Samstag sehe ich meinen Bruder. Am Samstag is idea one, so the verb sehe stays in second place and ich moves behind it. The ich form of sehen keeps the plain e, so it stays as sehe. Bruder is a der word, so my brother after the verb becomes meinen Bruder.", "topic": "dialogue: fronting a time phrase"}, {"id": "de5-speaking:q10", "level": "stretch", "type": "text", "q": "Write in German: On Monday my brother travels to Berlin. Start with Am Montag.", "answer": "Am Montag faehrt mein Bruder nach Berlin.", "accept": ["Am Montag fährt mein Bruder nach Berlin.", "Am Montag faehrt mein Bruder nach Berlin", "am montag faehrt mein bruder nach berlin", "Am Montag faehrt mein Bruder nach Berlin.", "am montag faehrt mein bruder nach berlin.", "am montag fährt mein bruder nach berlin.", "Am Montag fährt mein Bruder nach Berlin", "am montag fährt mein bruder nach berlin"], "hint": "My brother counts as he, so the verb changes its vowel.", "explain": "The answer is Am Montag faehrt mein Bruder nach Berlin. Bruder is a der word, so my brother is mein Bruder, and it counts as er. That makes fahren change to faehrt. Am Montag is idea one, so faehrt is idea two and mein Bruder follows in third place.", "topic": "dialogue: fronting with a noun subject and an irregular verb"}]}, "h1-chronology": {"id": "h1-chronology", "day": "Tuesday", "subject": "History", "title": "Putting things in order", "minutes": 25, "objective": "Turn any year into its century, read BC and AD dates the right way round, and put events in order.", "extract": null, "teach": {"intro": ["A century is one hundred years. The first hundred years of the AD count are the 1st century, so the 1st century is year 1 to year 100.", "That first block used up every year below 100, so the century number is always one ahead of the hundreds. The years 1801 to 1900 are the 19th century, because 18 plus 1 is 19.", "BC means before this count started, and BC years run backwards. 500 BC is earlier than 200 BC, in the same way that a bigger countdown number means further from zero."], "example": {"problem": "Which century is the year 1666 in?", "steps": ["Cover the last two digits. 1666 leaves 16.", "Check the last two digits are not 00. Here they are 66, so the add one rule applies.", "Add one. 16 plus 1 is 17.", "So 1666 is in the 17th century, which runs from 1601 to 1700."], "answer": "The 17th century"}, "keyfact": "Cover the last two digits, add one. The only exception is a year ending in 00, which belongs to the century of its own hundreds number, so 1900 is in the 19th century."}, "questions": [{"id": "h1-chronology:q1", "level": "easy", "type": "mc", "q": "How many years are there in a century?", "options": ["10 years", "50 years", "100 years", "1000 years"], "answer": "100 years", "hint": "Think about the word cent, as in 100 pence in a pound.", "explain": "The answer is 100. A century is a block of one hundred years. A decade is ten years and a millennium is one thousand years.", "topic": "chronology: what a century is"}, {"id": "h1-chronology:q2", "level": "easy", "type": "mc", "q": "Which years does the 1st century cover?", "options": ["Years 0 to 99", "Years 1 to 100", "Years 100 to 199", "Years 1 to 1000"], "answer": "Years 1 to 100", "hint": "The count starts at year 1, not year 0.", "explain": "The answer is years 1 to 100. There is no year zero, so counting starts at 1 and the first hundred years end at 100. This is the reason every later century number sits one ahead of the hundreds digit.", "topic": "chronology: why centuries are offset by one"}, {"id": "h1-chronology:q3", "level": "easy", "type": "text", "q": "Which century is the year 1250 in? Write it like this: 5th", "answer": "13th", "accept": ["13th", "13", "thirteenth", "13th century", "the 13th century"], "hint": "Cover the last two digits, then add one.", "explain": "The answer is 13th. Cover the 50 and you are left with 12. Add one to get 13. The 13th century runs from 1201 to 1300, and 1250 sits inside that.", "topic": "chronology: year to century"}, {"id": "h1-chronology:q4", "level": "easy", "type": "mc", "q": "Which of these years came first, 500 BC or 200 BC?", "options": ["500 BC", "200 BC", "They are the same year", "You cannot tell from the dates"], "answer": "500 BC", "hint": "BC years count down towards zero, like a countdown.", "explain": "The answer is 500 BC. BC years run backwards, so the larger the BC number the further back in time it is. 500 BC is three hundred years earlier than 200 BC.", "topic": "chronology: BC counts backwards"}, {"id": "h1-chronology:q5", "level": "medium", "type": "text", "q": "Which century is the year 1805 in? Write it like this: 5th", "answer": "19th", "accept": ["19th", "19", "nineteenth", "19th century", "the 19th century"], "hint": "Take the 18 and do the usual step.", "explain": "The answer is 19th. Cover the 05 and you have 18. Add one to get 19. This is the one that catches most people out, because the year starts with 18 but the century is the 19th. The 19th century runs from 1801 to 1900.", "topic": "chronology: year to century"}, {"id": "h1-chronology:q6", "level": "medium", "type": "text", "q": "Which century is the year 1900 in? Write it like this: 5th", "answer": "19th", "accept": ["19th", "19", "nineteenth", "19th century", "the 19th century"], "hint": "Work out which years the 19th century covers, then see if 1900 is inside it.", "explain": "The answer is 19th. The 19th century runs from 1801 to 1900, so 1900 is the very last year of it. The 20th century starts the next year, in 1901. A year ending in 00 is the exception to the add one rule.", "topic": "chronology: the round hundred exception"}, {"id": "h1-chronology:q7", "level": "medium", "type": "mc", "q": "Which century is the year AD 45 in?", "options": ["The 1st century", "The 4th century", "The 5th century", "The 45th century"], "answer": "The 1st century", "hint": "The 1st century covers years 1 to 100.", "explain": "The answer is the 1st century. The 1st century runs from year 1 to year 100, and 45 sits inside that. Cover the last two digits of 45 and you are left with nothing, which counts as 0, then add one to get 1.", "topic": "chronology: year to century in small numbers"}, {"id": "h1-chronology:q8", "level": "medium", "type": "text", "q": "Which decade does the year 1974 belong to? Write it like this: the 1920s", "answer": "the 1970s", "accept": ["the 1970s", "1970s", "70s", "the 70s", "1970's", "the 1970's"], "hint": "A decade is ten years and is named after the year it starts in.", "explain": "The answer is the 1970s. A decade is a block of ten years named after its first year, so the 1970s runs from 1970 to 1979. 1974 sits inside that block.", "topic": "chronology: decades"}, {"id": "h1-chronology:q9", "level": "medium", "type": "mc", "q": "Put these years in order, earliest first: 1066, 44 BC, 1945, 1509", "options": ["44 BC, 1066, 1509, 1945", "1066, 44 BC, 1509, 1945", "44 BC, 1945, 1509, 1066", "1066, 1509, 1945, 44 BC"], "answer": "44 BC, 1066, 1509, 1945", "hint": "Every BC year is earlier than every AD year.", "explain": "The answer is 44 BC, 1066, 1509, 1945. All BC years come before all AD years, so 44 BC goes first even though 44 is the smallest looking number. After that the AD years go in normal counting order.", "topic": "chronology: ordering events across BC and AD"}, {"id": "h1-chronology:q10", "level": "stretch", "type": "text", "q": "How many years passed between 50 BC and AD 50?", "answer": "100", "accept": ["100", "100 years", "99", "99 years"], "hint": "You cannot subtract here. The dates sit on opposite sides of the count, so think about adding.", "explain": "The answer is 100. When a gap crosses from BC to AD you add the two numbers instead of subtracting them, because both are counted away from the same starting point. So 50 plus 50 is 100. Some people answer 99, because there is no year zero, and that reasoning is sound too. At school the expected answer is 100.", "topic": "chronology: BC to AD year gaps"}, {"id": "h1-chronology:q11", "level": "stretch", "type": "mc", "q": "Which of these years is NOT in the 18th century?", "options": ["1701", "1750", "1800", "1801"], "answer": "1801", "hint": "Work out the first and last year of the 18th century before you look at the options.", "explain": "The answer is 1801. The 18th century runs from 1701 to 1800, so 1701, 1750 and 1800 are all inside it. 1801 is the first year of the 19th century.", "topic": "chronology: century boundaries"}, {"id": "h1-chronology:q12", "level": "stretch", "type": "long", "q": "Explain why the years 1801 to 1900 are called the 19th century and not the 18th century. Use the 1st century in your answer.", "answer": "Because the count begins at year 1, the 1st century is years 1 to 100. Each century after that is one ahead of the hundreds digit. The block 1801 to 1900 is the nineteenth block of one hundred years, so it is the 19th century.", "hint": "Start by saying which years the 1st century covers, then count the blocks forward.", "explain": "A good answer says this. The count of years starts at 1, not 0, so the 1st century is years 1 to 100. The 2nd century is 101 to 200, the 3rd is 201 to 300, and so on. Each century number is one ahead of the hundreds in the year, because the first block used up all the years below 100. By the time you reach the block 1801 to 1900 you have counted nineteen blocks of one hundred years, so it is the 19th century even though the years mostly start with 18.", "topic": "chronology: explaining the offset"}]}, "h2-timeline": {"id": "h2-timeline", "day": "Wednesday", "subject": "History", "title": "Building a timeline that sticks", "minutes": 25, "objective": "Place the main periods of British history in order, give each one a century, and work out gaps between dates.", "extract": "A timeline of the periods you will meet in Year 8. Where historians disagree the dates are rough.\n\nRomans in Britain: AD 43 to about AD 410\nAnglo-Saxons: about AD 450 to 1066\nNormans arrive: 1066, the Battle of Hastings\nMedieval England, also called the Middle Ages: 1066 to 1485\nTudors: 1485 to 1603\nStuarts: 1603 to 1714\nEnglish Civil War: 1642 to 1651\nKing Charles I executed: 1649\nGeorgians: 1714 to 1837\nIndustrial Revolution: about 1760 to 1840\nVictorians: 1837 to 1901\nFirst World War: 1914 to 1918\nSecond World War: 1939 to 1945", "teach": {"intro": ["A timeline is a ruler for time. You do not need to memorise every date, you need the order first, then roughly which century each period sits in.", "Use the extract above as your ruler. Romans, Anglo-Saxons, Normans, medieval, Tudors, Stuarts, Georgians, Victorians, then the 20th century.", "To find a gap between two AD dates you subtract. The Civil War ran from 1642 to 1651, and 1651 minus 1642 is 9 years."], "example": {"problem": "The Tudor period runs from 1485 to 1603. Which centuries does it cover?", "steps": ["Take the start date, 1485. Cover the 85 to get 14, add one, so it is the 15th century.", "Take the end date, 1603. Cover the 03 to get 16, add one, so it is the 17th century.", "So the Tudors begin late in the 15th century and end early in the 17th century.", "That means they cover most of the 16th century in between."], "answer": "From the 15th century to the 17th century, covering all of the 16th"}, "keyfact": "Four anchor dates: 1066 Normans, 1485 Tudors, 1642 Civil War, 1837 Victorians."}, "questions": [{"id": "h2-timeline:q1", "level": "easy", "type": "mc", "q": "In which year did the Normans win the Battle of Hastings and take over England?", "options": ["1066", "1485", "1642", "1837"], "answer": "1066", "hint": "It is the most famous date in English history and it is on the timeline.", "explain": "The answer is 1066. William of Normandy defeated King Harold at the Battle of Hastings in 1066. That date is the usual dividing line between the Anglo-Saxon period and medieval England.", "topic": "periods: Norman conquest"}, {"id": "h2-timeline:q2", "level": "easy", "type": "mc", "q": "Which of these groups was in Britain first?", "options": ["The Romans", "The Tudors", "The Victorians", "The Normans"], "answer": "The Romans", "hint": "Look at the top of the timeline.", "explain": "The answer is the Romans. The Romans were in Britain from AD 43 to about AD 410. The Normans arrived in 1066, the Tudors began in 1485 and the Victorians began in 1837.", "topic": "periods: ordering"}, {"id": "h2-timeline:q3", "level": "easy", "type": "text", "q": "Which century is the year 1066 in? Write it like this: 5th", "answer": "11th", "accept": ["11th", "11", "eleventh", "11th century", "the 11th century"], "hint": "Cover the last two digits and add one.", "explain": "The answer is 11th. Cover the 66 to leave 10, then add one to get 11. The 11th century runs from 1001 to 1100, and 1066 sits inside it.", "topic": "chronology: year to century"}, {"id": "h2-timeline:q4", "level": "easy", "type": "mc", "q": "Which period came straight after the Tudors?", "options": ["The Normans", "The Anglo-Saxons", "The Stuarts", "The Victorians"], "answer": "The Stuarts", "hint": "The Tudors end in 1603. Find what starts in that year.", "explain": "The answer is the Stuarts. The Tudor period ended in 1603 when Elizabeth I died, and the Stuarts ruled from 1603 to 1714. The Normans and Anglo-Saxons came long before, and the Victorians came much later.", "topic": "periods: ordering"}, {"id": "h2-timeline:q5", "level": "medium", "type": "text", "q": "The English Civil War ran from 1642 to 1651. How many years did it last?", "answer": "9", "accept": ["9", "9 years", "nine", "nine years"], "hint": "Both dates are AD, so subtract the smaller from the larger.", "explain": "The answer is 9. Both dates are AD, so you subtract: 1651 minus 1642 is 9 years. The war was fought in separate phases across those nine years and ended with Parliament in control.", "topic": "chronology: year gaps within AD"}, {"id": "h2-timeline:q6", "level": "medium", "type": "mc", "q": "Put these periods in order, earliest first: Tudors, Romans, Victorians, Normans", "options": ["Romans, Normans, Tudors, Victorians", "Romans, Tudors, Normans, Victorians", "Normans, Romans, Tudors, Victorians", "Romans, Normans, Victorians, Tudors"], "answer": "Romans, Normans, Tudors, Victorians", "hint": "Give each one its start date first, then sort the dates.", "explain": "The answer is Romans, Normans, Tudors, Victorians. The Romans arrived in AD 43, the Normans in 1066, the Tudors began in 1485 and the Victorians in 1837. Ordering periods is easier if you attach a start date to each name before you sort them.", "topic": "periods: ordering"}, {"id": "h2-timeline:q7", "level": "medium", "type": "text", "q": "Queen Victoria became queen in 1837. Which century is that? Write it like this: 5th", "answer": "19th", "accept": ["19th", "19", "nineteenth", "19th century", "the 19th century"], "hint": "Cover the 37 and add one.", "explain": "The answer is 19th. Cover the 37 to leave 18, then add one to get 19. Victoria reigned from 1837 to 1901, so nearly all of her reign sits in the 19th century.", "topic": "chronology: year to century"}, {"id": "h2-timeline:q8", "level": "medium", "type": "text", "q": "The Romans left Britain in about AD 410. Which century is that? Write it like this: 5th", "answer": "5th", "accept": ["5th", "5", "fifth", "5th century", "the 5th century"], "hint": "Cover the last two digits of 410. That leaves 4.", "explain": "The answer is 5th. Cover the 10 to leave 4, then add one to get 5. The 5th century runs from 401 to 500, so AD 410 is early in the 5th century.", "topic": "chronology: year to century in small numbers"}, {"id": "h2-timeline:q9", "level": "medium", "type": "mc", "q": "The Industrial Revolution is usually dated from about 1760 to 1840. Which two centuries does it cover?", "options": ["The 17th and 18th", "The 18th and 19th", "The 19th and 20th", "The 16th and 17th"], "answer": "The 18th and 19th", "hint": "Convert 1760 first, then convert 1840.", "explain": "The answer is the 18th and 19th. 1760 sits in the 18th century, which runs from 1701 to 1800. 1840 sits in the 19th century, which runs from 1801 to 1900. So the Industrial Revolution starts in the 18th century and continues into the 19th.", "topic": "chronology: a period across two centuries"}, {"id": "h2-timeline:q10", "level": "stretch", "type": "text", "q": "How many years were there between the Battle of Hastings in 1066 and the start of the Tudor period in 1485?", "answer": "419", "accept": ["419", "419 years"], "hint": "Both dates are AD, so it is one subtraction. Take care with the borrowing.", "explain": "The answer is 419. Both dates are AD, so subtract: 1485 minus 1066 is 419 years. That whole gap is the medieval period, which is why the Middle Ages feel so long compared with the Tudors.", "topic": "chronology: year gaps within AD"}, {"id": "h2-timeline:q11", "level": "stretch", "type": "text", "q": "Julius Caesar first landed in Britain in 55 BC. The Romans invaded properly in AD 43. How many years apart were these two events?", "answer": "98", "accept": ["98", "98 years", "97", "97 years"], "hint": "The dates sit on opposite sides of the count, so subtracting will not work.", "explain": "The answer is 98. When a gap crosses from BC to AD you add the two numbers, because both are measured away from the same starting point. So 55 plus 43 is 98 years. Some people answer 97, because there is no year zero, and that reasoning is sound too. At school the expected answer is 98.", "topic": "chronology: BC to AD year gaps"}, {"id": "h2-timeline:q12", "level": "stretch", "type": "long", "q": "Using the timeline, put these four periods in order and give the century each one started in: Normans, Tudors, Stuarts, Victorians.", "answer": "Normans 1066, the 11th century. Tudors 1485, the 15th century. Stuarts 1603, the 17th century. Victorians 1837, the 19th century.", "hint": "Write the start year for each period first, then convert each year to a century.", "explain": "A good answer says this. The Normans came first, starting in 1066, which is the 11th century. Next the Tudors, starting in 1485, which is the 15th century. Then the Stuarts, starting in 1603, which is the 17th century. Last the Victorians, starting in 1837, which is the 19th century. Notice that each century number is one ahead of the hundreds in the year.", "topic": "periods: ordering with centuries"}]}, "s2-cells": {"id": "s2-cells", "day": "Thursday", "subject": "Science", "title": "Cells and changes of state", "minutes": 25, "objective": "Name the parts of animal and plant cells and say what each one does, and describe every change of state including why the temperature stays flat.", "extract": null, "teach": {"intro": ["Every living thing is built from cells. A cell is tiny, but it is not simple. Inside it there are separate parts called organelles, and each one has a job, like rooms in a building. Animal cells and plant cells share most of these parts. Plant cells then have three extra ones that animal cells never have: a cell wall for strength, a large permanent vacuole full of sap, and chloroplasts to trap light.", "The second idea is about the particles inside a substance. Heating a substance gives its particles more energy. Usually that makes the temperature rise. But at a melting point or a boiling point the temperature stops rising and holds flat, even though heating carries on. The energy is not being wasted. It is going into breaking the forces that hold the particles to each other. Once those forces are broken and the change of state is finished, the temperature climbs again.", "Changes of state have names and directions. Solid to liquid is melting, liquid to solid is freezing. Liquid to gas is evaporating or boiling, gas to liquid is condensing. Solid straight to gas, skipping the liquid, is subliming. Boiling happens at one fixed temperature all through the liquid. Evaporating happens only at the surface and at any temperature, which is why a puddle dries up without ever boiling.", "Some cells are specialised, which means their shape is built for one job. A root hair cell has a long thin hair to give a huge surface area for soaking up water, and no chloroplasts, because underground there is no light to use. A red blood cell has no nucleus, leaving more room for carrying oxygen. A muscle cell is packed with mitochondria, because contracting takes a lot of energy."], "example": {"problem": "A student looks down a microscope at a cell. He can see a nucleus, cytoplasm, a cell membrane, mitochondria, a stiff outer wall, one large space filling the middle, and small green discs. Is it a plant cell or an animal cell, and how does he know?", "steps": ["List the parts that both types of cell have: nucleus, cytoplasm, cell membrane, mitochondria. These do not help, because both plant and animal cells have all four.", "Look for the three plant only parts. A stiff outer wall is the cell wall, made of cellulose, which holds the cell in shape.", "One large space filling the middle is the large permanent vacuole, which is full of cell sap and helps keep the cell firm.", "Small green discs are chloroplasts. They hold the green chemical chlorophyll and trap light energy for photosynthesis.", "All three plant only parts are present, so it cannot be an animal cell."], "answer": "It is a plant cell, because it has a cell wall, a large permanent vacuole and chloroplasts."}, "keyfact": "Plant cells have everything an animal cell has, plus a cell wall, a large permanent vacuole, and, in the parts of the plant that get light, chloroplasts. While something is melting or boiling the temperature stays flat, because the energy is breaking the forces between particles. While it freezes or condenses the temperature also stays flat, because that same energy is being given back out as the forces re-form."}, "questions": [{"id": "s2-cells:q1", "level": "easy", "type": "mc", "q": "Which part of a cell contains the genetic instructions and controls the cell?", "options": ["The nucleus", "The cytoplasm", "The cell wall", "The chloroplast"], "answer": "The nucleus", "hint": "It is the control centre, and both plant and animal cells have one.", "explain": "The nucleus is the answer. It holds the genetic instructions and controls everything the cell does. The cytoplasm is the jelly where chemical reactions happen. The cell wall and the chloroplast are found only in plant cells, and neither of them is the control centre.", "topic": "cells: nucleus"}, {"id": "s2-cells:q2", "level": "easy", "type": "mc", "q": "Which part controls what goes into and out of an animal cell?", "options": ["The cell membrane", "The nucleus", "The mitochondria", "The vacuole"], "answer": "The cell membrane", "hint": "Think about the part right at the edge of the cell.", "explain": "The cell membrane is the answer. It is a thin skin around the outside of the cell, and it lets some substances in and out while keeping others where they are. The nucleus controls the cell's activity. Mitochondria release energy. A vacuole stores liquid.", "topic": "cells: cell membrane"}, {"id": "s2-cells:q3", "level": "easy", "type": "text", "q": "An ice cube is left on a warm plate and turns into liquid water. Name this change of state.", "answer": "melting", "accept": ["melting", "melt", "melts", "melted", "it is melting", "fusion"], "hint": "Solid going to liquid. It has a one word name you already use every day.", "explain": "This is melting. A solid turns into a liquid when its particles gain enough energy to break out of their fixed positions and start sliding past each other. The temperature at which this happens is called the melting point, and for pure water it is 0 degrees C.", "topic": "changes of state: melting"}, {"id": "s2-cells:q4", "level": "easy", "type": "mc", "q": "Which set of three parts is found in plant cells but never in animal cells?", "options": ["Cell wall, large permanent vacuole, chloroplasts", "Nucleus, cytoplasm, cell membrane", "Mitochondria, nucleus, chloroplasts", "Cell wall, cell membrane, cytoplasm"], "answer": "Cell wall, large permanent vacuole, chloroplasts", "hint": "Strength, storage, and the green part that catches light.", "explain": "Cell wall, large permanent vacuole and chloroplasts is correct. All three are plant only. The cell wall is made of cellulose and gives strength. The large permanent vacuole is full of cell sap and keeps the cell firm. Chloroplasts trap light for photosynthesis. The nucleus, cytoplasm, cell membrane and mitochondria are in both types of cell.", "topic": "cells: plant and animal organelles"}, {"id": "s2-cells:q5", "level": "medium", "type": "mc", "q": "What is the job of the mitochondria?", "options": ["To release energy from glucose during respiration", "To trap light energy for photosynthesis", "To hold the genetic instructions", "To store cell sap and keep the cell firm"], "answer": "To release energy from glucose during respiration", "hint": "They are often called the powerhouse of the cell. Which process releases energy rather than trapping it?", "explain": "Mitochondria release energy from glucose during respiration. That released energy powers everything the cell does. Trapping light is the job of chloroplasts, which are a different organelle and only in plant cells. Holding the instructions is the nucleus. Storing cell sap is the vacuole.", "topic": "cells: mitochondria and respiration"}, {"id": "s2-cells:q6", "level": "medium", "type": "mc", "q": "A root hair cell has a long, thin extension that pushes out into the soil. Why is that shape useful?", "options": ["It gives a much larger surface area, so the cell can absorb more water and minerals", "It lets the cell trap more light for photosynthesis", "It makes the cell strong enough to push through stones", "It lets the cell swim through the soil towards water"], "answer": "It gives a much larger surface area, so the cell can absorb more water and minerals", "hint": "Absorbing happens across the outside surface. What does a long thin shape do to the amount of surface?", "explain": "The long thin shape gives a much larger surface area, so more water and minerals can be absorbed from the soil. This is what specialised means: the shape of the cell matches its job. Root hair cells are underground, so they get no light and have no chloroplasts. They cannot move, and they are not strong enough to shift stones.", "topic": "specialised cells: root hair cell"}, {"id": "s2-cells:q7", "level": "medium", "type": "text", "q": "Solid carbon dioxide, called dry ice, turns straight into a gas without ever becoming a liquid. Name this change of state.", "answer": "sublimation", "accept": ["sublimation", "sublimating", "subliming", "sublime", "sublimes", "sublimed", "it sublimes"], "hint": "It skips the liquid step completely. The name starts with sub.", "explain": "This is sublimation. The particles at the surface of the solid gain enough energy to escape straight into the gas state, missing out the liquid state altogether. Dry ice does this at normal air pressure, which is why it makes clouds of gas at stage shows instead of a puddle.", "topic": "changes of state: sublimation"}, {"id": "s2-cells:q8", "level": "medium", "type": "mc", "q": "A gas is cooled until it turns into a liquid. What happens to the particles?", "options": ["They lose energy, slow down and move closer together", "They gain energy, speed up and spread further apart", "They stay exactly the same, only the container changes", "They break apart into smaller particles"], "answer": "They lose energy, slow down and move closer together", "hint": "Cooling takes energy away. Slower particles cannot escape from each other as easily.", "explain": "They lose energy, slow down and move closer together. That is condensing. Once the particles are slow enough, the forces between them pull them together into a liquid. Cooling never gains energy for the particles, and a change of state never breaks the particles themselves apart. The particles are still the same substance, just arranged differently.", "topic": "changes of state: condensing and particles"}, {"id": "s2-cells:q9", "level": "medium", "type": "mc", "q": "A red blood cell has no nucleus. Why is that an advantage?", "options": ["It leaves more space inside the cell to carry oxygen", "It stops the cell from getting infected", "It makes the cell lighter so it floats in the blood", "It lets the cell photosynthesise as it travels"], "answer": "It leaves more space inside the cell to carry oxygen", "hint": "The cell's whole job is carrying as much oxygen as possible. What does removing a large part free up?", "explain": "Losing the nucleus leaves more space inside for haemoglobin, the red chemical that carries oxygen. The cell is also shaped like a disc squashed in the middle, which gives it a bigger surface area for oxygen to move across. It is another example of a specialised cell built for one job. Red blood cells cannot photosynthesise, and they have no way of fighting infection, that is the job of white blood cells.", "topic": "specialised cells: red blood cell"}, {"id": "s2-cells:q10", "level": "stretch", "type": "mc", "q": "Water in a pan is heated steadily. It reaches 100 degrees C and starts to boil. The heat is left on, but a thermometer shows the temperature holding at 100 degrees C for several minutes. Why does the temperature not keep rising?", "options": ["The energy going in is being used to break the forces between the particles, not to make them move faster", "The thermometer stops working properly at 100 degrees C", "The pan stops taking in energy once the water boils", "Water cannot get hotter than 100 degrees C under any conditions ever"], "answer": "The energy going in is being used to break the forces between the particles, not to make them move faster", "hint": "Temperature is a measure of how fast the particles are moving. If the energy is being spent on something else, the speed does not change.", "explain": "The energy is being used to break the forces holding the particles to each other, so they can escape as a gas. Temperature measures how fast particles move, and while that energy is going into breaking forces the particles are not speeding up, so the reading holds flat. The pan is still taking in energy the whole time. Once all the water has turned to steam, the steam can then be heated well above 100 degrees C.", "topic": "changes of state: flat temperature during a change"}, {"id": "s2-cells:q11", "level": "stretch", "type": "text", "q": "A pure substance melts at 55 degrees C and boils at 130 degrees C. A sample of it is sitting at 90 degrees C. Is it a solid, a liquid or a gas?", "answer": "liquid", "accept": ["liquid", "a liquid", "it is a liquid", "its a liquid", "it's a liquid", "liquid state"], "hint": "Above the melting point it is no longer solid. Below the boiling point it has not yet become a gas.", "explain": "It is a liquid. 90 degrees C is above the melting point of 55 degrees C, so it has already melted and is no longer solid. It is also below the boiling point of 130 degrees C, so it has not boiled into a gas yet. Anything between the melting point and the boiling point is a liquid.", "topic": "changes of state: melting and boiling points"}, {"id": "s2-cells:q12", "level": "stretch", "type": "mc", "q": "A muscle cell contains far more mitochondria than a skin cell does. What is the best reason for this?", "options": ["Muscle cells need to release a lot of energy to contract, and mitochondria are where respiration releases energy", "Muscle cells are larger, so any part of them is simply bigger too", "Mitochondria make the muscle stretchy so it can pull bones", "Muscle cells store food, and mitochondria are storage spaces"], "answer": "Muscle cells need to release a lot of energy to contract, and mitochondria are where respiration releases energy", "hint": "Link the job of the cell to the job of the organelle. What does a muscle do all day, and what does that need?", "explain": "Muscle cells contract over and over, and contracting takes a lot of energy. Mitochondria are where respiration releases energy from glucose, so a cell that needs more energy is packed with more of them. This is the general rule for specialised cells: the number and type of organelles match the job. Mitochondria do not store food and they do not make anything stretchy.", "topic": "cells: linking organelles to function"}]}}, "dayorder": [["Day 1", ["s1-retest", "m1-bidmas", "g1-oceans", "e1-proofread", "de1-verb2"]], ["Day 2", ["m2-negatives", "h1-chronology", "g2-fourfig", "e2-apostrophes", "de2-pronouns"]], ["Day 3", ["m3-unlike", "g3-sixfig", "e3-production", "h2-timeline", "de3-irregular"]], ["Day 4", ["m4-multfrac", "g4-contours", "e4-stamina", "s2-cells", "de4-together"]], ["Day 5", ["friday-test", "review", "de5-speaking"]]], "gaps": {"Maths": ["order of operations, BIDMAS", "multiplying negative numbers", "adding fractions with unlike denominators", "multiplying fractions", "sharing in a ratio", "simplifying algebraic expressions", "area of a triangle"], "English": ["plural possessive apostrophes", "identifying adverbs", "applying rules while composing", "stamina over a long piece"], "History": ["centuries", "ordering periods", "BC and AD"], "Geography": ["naming the oceans", "UK countries and capitals", "four figure grid references", "six figure grid references", "contours and relief", "measuring distance with scale", "the water cycle"], "German": ["personal pronouns and where you live", "irregular verbs", "word order, verb second"], "Science": ["cells and organelles", "changes of state", "the pH scale", "energy stores and transfers"]}, "covered": {"m1-bidmas": "order of operations, BIDMAS", "m2-negatives": "multiplying negative numbers", "m3-unlike": "adding fractions with unlike denominators", "m4-multfrac": "multiplying fractions", "e2-apostrophes": "plural possessive apostrophes", "e1-proofread": "applying rules while composing", "e4-stamina": "stamina over a long piece", "h1-chronology": "centuries", "h2-timeline": "ordering periods", "g1-oceans": "naming the oceans", "g2-fourfig": "four figure grid references", "g3-sixfig": "six figure grid references", "g4-contours": "contours and relief", "de1-verb2": "word order, verb second", "de2-pronouns": "personal let SESS=P.sessions, DAYORDER=P.dayorder, GAPS=P.gaps, COVERED=P.covered;
let WEEKLABEL=P.weekLabel||'Week 2';
try{const c=localStorage.getItem('surajDashContent');
  if(c){const j=JSON.parse(c);if(j&&j.sessions){applyContent(j)}}}catch(e){}
function applyContent(c){
  SESS=c.sessions;WEEKLABEL=c.weekLabel||('Week '+(c.week||''));
  if(c.days){DAYORDER=c.days.map(dd=>[dd.label,dd.blocks.map(b=>b.id)])}
  P=Object.assign({},P,{sessions:SESS});
}

let CFG={}; try{CFG=JSON.parse(localStorage.getItem('surajDash')||'{}')}catch(e){}
function saveCfg(){try{localStorage.setItem('surajDash',JSON.stringify(CFG))}catch(e){}}
let DATA=null, LOADING=false, ERR=null, TAB='progress';

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

/* JSONP: Apps Script serves a callback, which sidesteps CORS entirely */
function fetchContent(){
  const url=(CFG.sync||'').trim(); if(!url)return;
  const cb='__c'+Date.now();
  const s=document.createElement('script');
  const done=()=>{try{delete window[cb]}catch(_){}s.remove();clearTimeout(t)};
  window[cb]=r=>{const c=r&&r.content;
    if(c&&c.sessions){applyContent(c);
      try{localStorage.setItem('surajDashContent',JSON.stringify(c))}catch(e){}
      render()}
    done()};
  const t=setTimeout(done,15000); s.onerror=done;
  s.src=url+(url.indexOf('?')>-1?'&':'?')+'want=content&callback='+cb+'&t='+Date.now();
  document.body.appendChild(s);
}
function fetchData(){
  fetchContent();
  const url=(CFG.sync||'').trim(); if(!url){render();return}
  LOADING=true;ERR=null;render();
  const cb='__d'+Date.now();
  const s=document.createElement('script');
  const done=(ok,e)=>{LOADING=false;ERR=e||null;try{delete window[cb]}catch(_){}
    s.remove();clearTimeout(t);render()};
  window[cb]=d=>{DATA=d;CFG.last=new Date().toISOString();saveCfg();done(true)};
  const t=setTimeout(()=>done(false,'Timed out. Check the URL is the /exec one and that access is set to Anyone.'),15000);
  s.onerror=()=>done(false,'Could not reach the script. Check the URL.');
  s.src=url+(url.indexOf('?')>-1?'&':'?')+'callback='+cb+'&t='+Date.now();
  document.body.appendChild(s);
}

/* ---------- derived ---------- */
function sessions(){return (DATA&&DATA.sessions)||[]}
function wrongs(){return (DATA&&DATA.wrong)||[]}
function daily(){const d=(DATA&&DATA.daily)||[];return d.length?d[d.length-1]:null}
function photos(){return (DATA&&DATA.photos)||[]}
function num(x){const n=Number(x);return isFinite(n)?n:0}

function bySubject(){
  const m={};
  sessions().forEach(r=>{const s=r.Subject||'Other';
    m[s]=m[s]||{right:0,total:0,n:0};
    m[s].right+=num(r.Score);m[s].total+=num(r['Out of']);m[s].n++});
  return Object.keys(m).sort().map(k=>({subject:k,...m[k],
    pct:m[k].total?Math.round(m[k].right/m[k].total*100):0}));
}
function topicCounts(){
  const m={};
  wrongs().forEach(r=>{const t=r.Topic||'(untagged)';
    m[t]=m[t]||{n:0,subject:r.Subject||''};m[t].n++});
  return Object.keys(m).map(k=>({topic:k,...m[k]})).sort((a,b)=>b.n-a.n);
}
function doneIds(){const s=new Set();sessions().forEach(r=>s.add(r.Session));return s}

/* ---------- render ---------- */
function render(){
  const wk=document.getElementById('wk'); if(wk)wk.textContent=WEEKLABEL;
  document.getElementById('stamp').textContent = CFG.last? 'updated '+new Date(CFG.last).toLocaleString('en-GB',{hour:'2-digit',minute:'2-digit',day:'numeric',month:'short'}) : '';
  const app=document.getElementById('app');
  if(!(CFG.sync||'').trim()){app.innerHTML=vConnect();wire();return}
  let h=`<div class="tabs">
    ${['progress','What to teach','Answers','Writing','Working','Curriculum'].map((t,i)=>{
      const k=['progress','teach','answers','writing','working','curriculum'][i];
      return `<button class="tab ${TAB===k?'on':''}" data-tab="${k}">${t==='progress'?'Progress':t}</button>`}).join('')}
  </div>`;
  if(LOADING&&!DATA)h+=`<div class="card"><div class="empty">Loading...</div></div>`;
  else if(ERR)h+=`<div class="nb"><b>Could not load.</b> ${esc(ERR)}</div>`;
  h+=({progress:vProgress,teach:vTeach,answers:vAnswers,writing:vWriting,working:vWorking,curriculum:vCurriculum}[TAB])();
  app.innerHTML=h;wire();
}

function vConnect(){
  return `<div class="card"><h2>Connect to the sheet</h2>
  <p class="sec small" style="margin:10px 0 0">Paste the same web app URL you put in Suraj's app. It is stored only on this device, so it never goes into the public repo.</p>
  <input type="text" id="u" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off" spellcheck="false">
  <button class="btn wide" id="connect">Connect</button>
  <p class="muted" style="margin-top:14px">You will do this once per device you want to check from.</p></div>`;
}

function vProgress(){
  const S=sessions(), subs=bySubject(), d=daily();
  const totR=S.reduce((a,r)=>a+num(r.Score),0), totT=S.reduce((a,r)=>a+num(r['Out of']),0);
  const avg=totT?Math.round(totR/totT*100):0;
  const gapsLeft=topicCounts().length;
  let pageSum=0;
  if(d){
    if(d['Pages total']!==undefined&&d['Pages total']!=='')pageSum=num(d['Pages total']);
    else pageSum=(String(d['Pages this week']||'').match(/(?:^|[^\d])(\d+)(?=\s*(?:,|$))/g)||[])
      .reduce((a,b)=>a+(parseInt(b.replace(/\D/g,''),10)||0),0);
  }
  const wpm=d?num(d.WPM):0;
  const planned=DAYORDER.reduce((a,[,ids])=>a+ids.filter(i=>i!=='review').length,0);

  let h=`<div class="tiles">
    ${tile(S.length+'<span style="font-size:19px;color:var(--muted)">/'+planned+'</span>','Sessions done',
      S.length?statusDot(S.length/planned>=0.8?'good':S.length?'warning':'critical', S.length+' of '+planned+' this week'):'')}
    ${tile(avg?avg+'%':'-','Average score',avg?statusDot(avg>=70?'good':avg>=50?'warning':'critical',avg>=70?'on track':avg>=50?'shaky':'struggling'):'')}
    ${tile(gapsLeft||'-','Topics still wrong',gapsLeft?statusDot(gapsLeft<=5?'good':gapsLeft<=12?'warning':'critical',gapsLeft+' to re-teach'):'')}
    ${tile(pageSum||'0','Pages read',statusDot(pageSum>=100?'good':pageSum>0?'warning':'critical',pageSum?'reading':'not started'))}
    ${tile(wpm||'-','Handwriting wpm',wpm?statusDot(wpm>=13?'good':wpm>=10?'warning':'critical',wpm>=13?'normal for Y8':wpm>=10?'slow':'a real handicap'):'')}
  </div>`;

  h+=`<div class="card"><h2>Score by subject</h2>
    <p class="muted">One bar per subject, share of questions correct. Red is under 50%, amber under 70%.</p>`;
  if(!subs.length)h+=`<div class="empty">Nothing synced yet.</div>`;
  else{
    h+=`<div class="chart">`;
    subs.forEach(s=>{
      const cls=s.pct<50?'low':s.pct<70?'mid':'';
      h+=`<div class="row"><div class="nm">${esc(s.subject)}</div>
        <div class="track" data-tip="${esc(s.subject)}: ${s.right} of ${s.total} correct across ${s.n} session${s.n===1?'':'s'}">
        <div class="fill ${cls}" style="width:${s.pct}%"></div></div>
        <div class="vl">${s.pct}%</div></div>`;
    });
    h+=`</div><div class="axis"><div></div><div class="ticks"><span>0</span><span>50</span><span>100%</span></div><div></div></div>
    <button class="btn ghost wide" data-toggle="tbl">Show as a table</button>
    <div id="tbl" style="display:none"><table><thead><tr><th>Subject</th><th class="n">Correct</th><th class="n">Out of</th><th class="n">%</th></tr></thead><tbody>
      ${subs.map(s=>`<tr><td>${esc(s.subject)}</td><td class="n">${s.right}</td><td class="n">${s.total}</td><td class="n">${s.pct}%</td></tr>`).join('')}
    </tbody></table></div>`;
  }
  h+=`</div>`;

  h+=`<div class="card"><h2>Sessions</h2>`;
  const done=doneIds();
  DAYORDER.forEach(([label,ids])=>{
    h+=`<h3 style="margin-top:14px;color:var(--text-secondary)">${label}</h3>`;
    ids.forEach(id=>{
      if(id==='review'){h+=`<div class="row" style="grid-template-columns:1fr 90px"><div class="small">End of week review</div>
        <div style="text-align:right"><span class="pill">${done.has('Review')?'done':'to do'}</span></div></div>`;return}
      const rec=sessions().find(r=>r.Session===titleOf(id));
      const t=titleOf(id);
      const pct=rec?Math.round(num(rec.Score)/Math.max(1,num(rec['Out of']))*100):null;
      h+=`<div class="row" style="grid-template-columns:1fr 90px"><div class="small">${esc(t)}</div>
        <div style="text-align:right">${rec?`<span class="pill ${pct>=70?'good':pct>=50?'warn':'bad'}">${rec.Score}/${rec['Out of']}</span>`:`<span class="pill">to do</span>`}</div></div>`;
    });
  });
  h+=`</div>`;

  if(d){
    h+=`<div class="card"><h2>Reading and handwriting</h2><table><tbody>
      <tr><td>Book</td><td>${esc(d.Book||'-')}</td></tr>
      <tr><td>Pages</td><td>${esc(d['Pages this week']||'-')}</td></tr>
      <tr><td>Speed Up! days</td><td>${esc(d['Speed Up! days']||'0')}/5</td></tr>
      <tr><td>3 minute copy</td><td>${esc(d['Words in 3 min']||'-')} words ${d.WPM?'('+d.WPM+' wpm)':''}</td></tr>
      <tr><td>Readable</td><td>${esc(d.Readable||'-')}</td></tr>
      <tr><td>Hand ache</td><td>${esc(d['Hand ache']||'-')}</td></tr>
      ${d['His summary']?`<tr><td>His summary</td><td>${esc(d['His summary'])}</td></tr>`:''}
    </tbody></table></div>`;
  }
  return h;
}

function titleOf(id){
  if(id==='s1-retest')return 'Science: clean retest';
  if(id==='friday-test')return 'Weekly test';
  const s=SESS[id];return s?s.subject+': '+s.title:id;
}
function tile(v,l,s){return `<div class="tile"><div class="v">${v}</div><div class="l">${l}</div>${s||''}</div>`}
function statusDot(kind,label){
  const c={good:'var(--good)',warning:'var(--warning)',critical:'var(--critical)'}[kind];
  return `<div class="s"><span class="dot" style="background:${c}"></span><span class="sec">${esc(label)}</span></div>`;
}

function vTeach(){
  const tc=topicCounts();
  let h=`<div class="card"><h2>What to teach him</h2>
  <p class="sec small" style="margin:10px 0 0">Every topic he got wrong, most frequent first. This is the list, in order. Anything appearing twice or more has not landed and needs you, not another worksheet.</p>`;
  if(!tc.length)h+=`<div class="empty">Nothing wrong yet, or nothing synced.</div>`;
  else h+=`<table><thead><tr><th>Topic</th><th>Subject</th><th class="n">Times wrong</th></tr></thead><tbody>
    ${tc.map(t=>`<tr><td>${esc(t.topic)}</td><td class="sec">${esc(t.subject)}</td>
      <td class="n">${t.n>1?`<span class="pill bad">${t.n}</span>`:t.n}</td></tr>`).join('')}
  </tbody></table>`;
  h+=`</div>`;

  h+=`<div class="card"><h2>The placement gap list</h2>
  <p class="sec small" style="margin:10px 0 0">The fifteen things placement week found. Blue means this week has a session on it.</p>`;
  Object.keys(GAPS).forEach(sub=>{
    h+=`<h3 style="margin-top:14px">${esc(sub)}</h3><div>`;
    GAPS[sub].forEach(g=>{
      const covered=Object.values(COVERED).indexOf(g)>-1;
      h+=`<span class="tag ${covered?'ok':''}">${esc(g)}${covered?' &#10003;':''}</span>`;
    });
    h+=`</div>`;
  });
  h+=`</div>`;
  return h;
}

function writings(){return (DATA&&DATA.writing)||[]}
function vWriting(){
  const w=writings();
  let h=`<div class="card"><h2>His writing</h2>
  <p class="sec small" style="margin:10px 0 0">Everything he has written at length, in full. Nothing here is auto-marked, so this is what gets marked properly.</p>`;
  if(!w.length){h+=`<div class="empty">Nothing written yet.</div></div>`;return h}
  w.forEach(r=>{
    h+=`<details><summary><h3>${esc(r.Task||'').slice(0,70)}</h3><span class="pill">${esc(r.Words||'?')} words</span></summary>
      <p class="sec small">${esc(r.Session||'')} &middot; ${esc(r['Marks available']||'')} marks available</p>
      <div class="qa" style="white-space:pre-wrap">${esc(r['What he wrote']||'')}</div>
      <div class="qa"><b>Mark scheme.</b> ${esc(r['Mark scheme']||'')}</div></details>`;
  });
  return h+`</div>`;
}
function vAnswers(){
  const w=wrongs();
  let h=`<div class="card"><h2>Every wrong answer</h2>
  <p class="sec small" style="margin:10px 0 0">What he put, what the answer was. Read this before you sit down with him.</p>`;
  if(!w.length){h+=`<div class="empty">Nothing synced yet.</div></div>`;return h}
  const by={};
  w.forEach(r=>{const k=r.Session||'Other';(by[k]=by[k]||[]).push(r)});
  Object.keys(by).forEach(k=>{
    h+=`<details><summary><h3>${esc(k)}</h3><span class="pill bad">${by[k].length}</span></summary>`;
    by[k].forEach(r=>{
      h+=`<div class="qa"><div class="q">${esc(r.Question)}</div>
        <div class="a">He put: <span class="wrongv">${esc(r['He put'])}</span></div>
        <div class="a">Answer: <span class="rightv">${esc(r.Correct)}</span></div>
        <div class="muted" style="margin-top:7px">${esc(r.Topic||'')}</div></div>`;
    });
    h+=`</details>`;
  });
  return h+`</div>`;
}

function vWorking(){
  const p=photos();
  let h=`<div class="card"><h2>His working</h2>
  <p class="sec small" style="margin:10px 0 0">Photos of his book. Method matters more than the answer, especially in maths.</p>`;
  if(!p.length)h+=`<div class="empty">No photos yet. He adds them from the day screen in his app.</div>`;
  else{
    const by={};p.forEach(r=>{(by[r.Day||'?']=by[r.Day||'?']||[]).push(r)});
    Object.keys(by).forEach(d=>{
      h+=`<h3 style="margin-top:16px">${esc(d)}</h3><div class="shots">`;
      by[d].forEach(r=>{h+=`<a href="${esc(r.url)}" target="_blank" rel="noopener"><img src="${esc(r.thumb)}" alt="page of working" loading="lazy"></a>`});
      h+=`</div>`;
    });
  }
  return h+`</div>`;
}

function vCurriculum(){
  let h=`<div class="card"><h2>What he is being taught</h2>
  <p class="sec small" style="margin:10px 0 0">All ${Object.keys(SESS).length} sessions in ${esc(WEEKLABEL)}, with every question and answer. Useful for pre-reading before you teach him something.</p></div>`;
  DAYORDER.forEach(([label,ids])=>{
    h+=`<div class="card"><h2>${label}</h2>`;
    ids.forEach(id=>{
      const s=SESS[id];
      if(!s){h+=`<details><summary><h3>${esc(titleOf(id))}</h3><span class="pill">test</span></summary>
        <div class="empty">Test questions are hidden here so he cannot read them over your shoulder.</div></details>`;return}
      h+=`<details><summary><h3>${esc(s.subject)}: ${esc(s.title)}</h3><span class="pill">${s.questions.length} q</span></summary>
        <p class="sec small">${esc(s.objective)}</p>
        <div class="qa"><b>Key fact.</b> ${esc(s.teach.keyfact)}</div>`;
      s.questions.forEach(q=>{
        h+=`<div class="qa"><div class="q">${esc(q.q)}</div>
          <div class="a">Answer: <span class="rightv">${esc(q.answer)}</span></div>
          <div class="muted" style="margin-top:7px">${esc(q.topic||'')} &middot; ${esc(q.level||'')}</div></div>`;
      });
      h+=`</details>`;
    });
    h+=`</div>`;
  });
  return h;
}

/* ---------- events ---------- */
function wire(){
  const c=document.getElementById('connect');
  if(c)c.onclick=()=>{const v=document.getElementById('u').value.trim();
    if(!v)return;CFG.sync=v;saveCfg();fetchData()};
  document.querySelectorAll('[data-tab]').forEach(el=>{
    el.onclick=()=>{TAB=el.getAttribute('data-tab');window.scrollTo(0,0);render()}});
  document.querySelectorAll('[data-toggle]').forEach(el=>{
    el.onclick=()=>{const t=document.getElementById(el.getAttribute('data-toggle'));
      const on=t.style.display==='none';t.style.display=on?'block':'none';
      el.textContent=on?'Hide the table':'Show as a table'}});
  const tip=document.getElementById('tip');
  document.querySelectorAll('[data-tip]').forEach(el=>{
    const show=e=>{tip.textContent=el.getAttribute('data-tip');tip.style.opacity='1';
      const r=el.getBoundingClientRect();
      tip.style.left=Math.min(window.innerWidth-270,Math.max(8,(e.clientX||r.left)-40))+'px';
      tip.style.top=Math.max(8,r.top-42)+'px'};
    el.onmouseenter=show;el.onmousemove=show;
    el.onmouseleave=()=>{tip.style.opacity='0'};
  });
}
document.getElementById('refresh').onclick=()=>fetchData();
if((CFG.sync||'').trim())fetchData(); else render();
</script></body></html>
