 is no signal at all.", "The orange light held. Somewhere above him a door opened and closed, and then nothing.", "He was absolutely terrified and started screaming for help as loudly as he possibly could.", "I put my hand on the door and pushed."], "answer": "The orange light held. Somewhere above him a door opened and closed, and then nothing.", "hint": "Three of these break something: the tense, the person telling the story, or the level of calm. Find what each one breaks.", "explain": "The answer is 'The orange light held. Somewhere above him a door opened and closed, and then nothing.' It stays in the past tense, stays with Ravi rather than switching to 'I', and keeps the same held-back tone, where small details do the work and nothing is shouted. The first option switches to present tense. The third stays past but breaks the tone by telling you the feeling outright instead of showing it. The fourth switches from third person to first person, so the reader loses track of who is in the lift.", "topic": "tense and tone: consistency"}, {"id": "e3-production:q7", "level": "medium", "type": "text", "q": "This description is in the past tense, but one verb is not: 'The wind rips at the tent all night.' Write the corrected verb.", "answer": "ripped", "accept": ["ripped", "Ripped", "ripped.", "'ripped'"], "hint": "Say the verb on its own and put it into the same time as 'was' or 'had'.", "explain": "The answer is 'ripped'. The sentence becomes 'The wind ripped at the tent all night.' Present tense verbs slide into past tense descriptions most often when the writing gets vivid, because in your head you are watching it happen now. That is a sign the writing is going well, so do not fight the feeling. Just run a verbs-only pass afterwards and change every present tense verb you find.", "topic": "tense: holding one tense"}, {"id": "e3-production:q8", "level": "stretch", "type": "mc", "q": "Read Paragraph B. Which sentence would NOT fit its tone?", "options": ["A woman weighed onions into a bowl without looking at them.", "The heat sat in the street long after the sun had gone off it.", "It was literally the craziest market ever and everyone was going mad.", "Two boys argued over a crate and gave up halfway through."], "answer": "It was literally the craziest market ever and everyone was going mad.", "hint": "Paragraph B watches and reports. Which option stops watching and starts reacting?", "explain": "The answer is 'It was literally the craziest market ever and everyone was going mad.' Paragraph B has a calm, watching tone. It gives you exact details, such as the smoke hanging under the awnings, and it lets you draw your own conclusion. The odd option out swaps observation for reaction, uses spoken slang, and tells the reader what to think. The other three all keep the same steady eye on a small, specific thing, which is what the paragraph has been doing from the first line.", "topic": "tone: matching register"}, {"id": "e3-production:q9", "level": "stretch", "type": "long", "q": "Rewrite these three sentences so that no two of them start the same way. Keep the past tense and keep the events exactly as they are. 'I opened the door. I saw the yard was empty. I went back inside and locked it.'", "answer": "I opened the door. The yard beyond it was empty. Back inside, I turned the lock and left the key in it.", "marks": 4, "hint": "You do not have to keep 'I' as the subject of every sentence. Try making one sentence start with the thing being looked at, and one with a place or time phrase.", "explain": "A strong answer does four things. One, it gives three different openers, for example a pronoun, then a noun, then a phrase such as 'Back inside' or 'Once inside'. Two, it keeps every verb in the past tense: opened, was, turned, left. Three, it keeps the three events in the same order, with nothing added and nothing lost. Four, it does not force the change by using strange word order. Varying openers should make the writing sound more natural, not less. A common trap is starting a sentence with an -ing word, as in 'Seeing the yard was empty', which is fine once but sounds mechanical if used more than that.", "topic": "sentence openers: variety"}, {"id": "e3-production:q10", "level": "stretch", "type": "long", "q": "Continue Paragraph B for four more sentences. Keep it in the past tense and keep the same calm, watching tone. Do not introduce a narrator saying 'I'.", "answer": "A butcher pushed a trolley through the middle of it all and nobody moved out of his way. The smoke thickened where the awnings met and stayed there, with nowhere to go. Somewhere behind the fruit stalls a radio played the same song it had been playing all afternoon. By four o'clock the light had turned amber and the shouting had dropped to talk.", "marks": 8, "hint": "Pick four separate small things to look at rather than one big one. Check every verb is past before you stop, and let the last sentence move time forward slightly.", "explain": "A strong answer contains all of these. One, four sentences, every verb in the past tense, with no slip into the present. Two, no 'I' and no sudden narrator, because the paragraph observes from outside. Three, specific detail rather than general comment: a named object, a sound, a smell, a piece of movement. Four, the same unhurried register, with no slang and no telling the reader how to feel. Five, varied sentence openers, so not all four begin with 'The'. Six, at least one sentence that moves time on slightly, such as a time phrase, so the paragraph goes somewhere instead of listing. Seven, full accuracy on the things you already know: no comma splices, no missing articles, capital letters where they belong.", "topic": "sustained writing: tense and tone control"}]}, "e4-stamina": {"id": "e4-stamina", "day": "Thursday", "subject": "English", "title": "Going the distance", "minutes": 25, "objective": "Structure a longer piece so the quality holds to the last line, and spend the final three minutes checking instead of writing.", "extract": "ENDING ONE\nThe rain had stopped. I stood at the edge of the quarry and looked at the water twenty feet below, flat and brown and holding the whole sky in it. Behind me the dog was already walking home. I stayed a minute longer, then turned and followed him down the track.\n\nENDING TWO\nThen we went home and it was fine and we had tea and I was tired so I went to bed and that was the end of the day it was quite a good day really and I would do it again.", "teach": {"intro": ["Long pieces do not fail in the middle. They fail in the last five minutes, when you are tired and still trying to add. The sentences run together, the detail thins out, and the ending turns into a list of what happened.", "So build the piece to end well. Decide the last paragraph before you start and keep it short. Then stop writing three minutes before time and use those minutes to check. Three minutes of checking is worth more marks than three minutes of tired new writing, every time."], "example": {"problem": "You have twenty minutes to describe a place. How do you spend them?", "steps": ["Two minutes, plan. Opening image, two middle paragraphs with different focuses, closing image that echoes the opening.", "Seven minutes, opening and first middle paragraph. Your best detail goes here while you are fresh.", "Six minutes, second middle paragraph. Change what you are looking at, not the tense.", "Two minutes, closing paragraph. Short. Three or four sentences and no new information.", "Three minutes, check. Capitals, joins, tense, small words. Start with the last paragraph, because it is the one written when you were most tired."], "answer": "Two to plan, fifteen to write, three to check. The plan and the check are not extras. They are the two things that stop the ending collapsing."}, "keyfact": "Stop writing three minutes early and check the final paragraph first, because that is where your mistakes live."}, "questions": [{"id": "e4-stamina:q1", "level": "easy", "type": "mc", "q": "You have twenty minutes to describe a place. Which plan gives you the best chance of a strong ending?", "options": ["No plan. Start writing and see where it goes.", "A wide opening image, two paragraphs of close detail, then a short closing paragraph you decided on before you started.", "One long paragraph covering everything you can think of.", "Write the middle first and add an opening at the end if there is time."], "answer": "A wide opening image, two paragraphs of close detail, then a short closing paragraph you decided on before you started.", "hint": "Think about which part of the piece is written when you are most tired, and what would protect it.", "explain": "The answer is the four-part plan with the ending decided in advance. If you know your last paragraph before you start, you never arrive at the end with nothing left, which is exactly when writing collapses. Having no plan works for about five minutes. One long paragraph loses the reader and loses you organisation marks. Writing the middle first leaves the opening, which is the part read most closely, to be done in a rush.", "topic": "stamina: structuring a longer piece"}, {"id": "e4-stamina:q2", "level": "easy", "type": "mc", "q": "Read the two endings in the extract. Which is the stronger piece of writing?", "options": ["Ending One", "Ending Two", "They are equally strong", "Ending Two, because it covers more of what happened"], "answer": "Ending One", "hint": "Look at where the full stops are in each one, and count how many things each ending actually shows you.", "explain": "The answer is Ending One. It is four controlled sentences of different lengths, it gives you one clear image of the water holding the sky, and it closes on a small action instead of a summary. Ending Two runs everything together with 'and', so the sentences lose shape, and it reports events rather than showing anything. Covering more of what happened is not a strength in a description. It is usually the sign of a writer who has run out of time and is emptying the plan onto the page.", "topic": "stamina: quality at the end"}, {"id": "e4-stamina:q3", "level": "easy", "type": "text", "q": "You have twenty minutes for a piece of writing. How many of those minutes should you spend proofreading rather than writing? Give the number.", "answer": "3", "accept": ["3", "three", "3 minutes", "three minutes", "Three", "Three minutes"], "hint": "It is the number in the key fact from today's teaching.", "explain": "The answer is 3. Stop writing with three minutes left, no matter where you are, and spend that time checking. It feels like giving up marks and it is the opposite. Three minutes of proofreading will usually catch two or three errors of the exact type you already know how to fix, and an extra three minutes of tired writing will usually add one weak sentence and one new error.", "topic": "stamina: time management"}, {"id": "e4-stamina:q4", "level": "medium", "type": "mc", "q": "It is the last three minutes. What is the best use of them?", "options": ["Add one more paragraph so the piece is longer.", "Read it back in your head, one pass per error type, starting with the last paragraph.", "Cross out anything you are not sure about.", "Count the words so you know how much you wrote."], "answer": "Read it back in your head, one pass per error type, starting with the last paragraph.", "hint": "You already built this routine on Monday. The only new decision is where to start reading.", "explain": "The answer is to read it back, one pass per error type, starting at the end. Starting at the end matters, because the last paragraph was written when you were most tired and holds the most errors, and because reading your own opening always feels satisfying and slows you down. Adding a paragraph adds risk. Crossing things out loses content you were given credit for. Counting words changes nothing at all.", "topic": "stamina: the last three minutes"}, {"id": "e4-stamina:q5", "level": "medium", "type": "mc", "q": "What is the main fault in Ending Two?", "options": ["It is too short to say anything.", "It runs on without full stops, so the sentences lose shape and the detail disappears.", "It is written in the wrong tense the whole way through.", "It has no capital letters."], "answer": "It runs on without full stops, so the sentences lose shape and the detail disappears.", "hint": "Try reading it out loud in one breath. Notice which word keeps appearing.", "explain": "The answer is that it runs on. Ending Two is one enormous sentence stitched together with 'and' and 'so', which is what happens when a writer keeps going past the point where they have stopped making decisions. Because there are no full stops, there is no rhythm, and because there is no rhythm, every detail flattens out to the same weight. It is not too short, it is in the past tense throughout, and it does have a capital letter at the start, so the other three options are simply not true.", "topic": "stamina: quality at the end"}, {"id": "e4-stamina:q6", "level": "stretch", "type": "mc", "q": "You are fifteen minutes into a twenty minute piece and you are only halfway through your plan. What is the best move?", "options": ["Write faster and try to fit everything in.", "Cut the plan down, write your closing paragraph now, and keep the last three minutes for checking.", "Drop the closing paragraph so you have time to finish the middle.", "Keep writing until time is called and check nothing."], "answer": "Cut the plan down, write your closing paragraph now, and keep the last three minutes for checking.", "hint": "A plan is a tool, not a contract. Ask which part of the piece a reader remembers most.", "explain": "The answer is to cut the plan and write the ending. Nobody marking the work has seen your plan, so leaving parts of it out costs nothing, while an unfinished piece is obvious and costs a lot. Writing faster is the worst option, because speed is what produces the run-ons and tense slips in the first place. Dropping the closing paragraph leaves the piece stopping dead in the middle of a description. Protect two things when time runs short: a real ending, and the three minutes of checking.", "topic": "stamina: pacing under time pressure"}, {"id": "e4-stamina:q7", "level": "stretch", "type": "mc", "q": "Which is the strongest closing sentence for a description of a quarry as the light goes?", "options": ["It was a really amazing place and I will never forget it.", "The water held the last of the light, and then it did not.", "In conclusion, the quarry was a very peaceful and beautiful place to be.", "I went home and had my tea and thought about the quarry a lot."], "answer": "The water held the last of the light, and then it did not.", "hint": "A strong ending shows one last thing and stops. Which option tells you what to think instead of showing you something?", "explain": "The answer is 'The water held the last of the light, and then it did not.' It ends on an image rather than a verdict, it uses a small turn in the sentence to make the light going feel sudden, and it stops rather than explaining itself. The first and third options tell the reader what to think, and 'in conclusion' belongs in an essay and not in a description. The fourth drifts off into events that have nothing to do with the place being described, which is the classic way a tired ending loses its grip.", "topic": "stamina: writing a controlled ending"}, {"id": "e4-stamina:q8", "level": "stretch", "type": "long", "q": "Twenty minutes. Describe a place at the moment it empties. Choose one: a stadium ten minutes after the final whistle, a quarry as the light goes, or a station platform after the last train. Two minutes to plan, fifteen to write, three to check. Past tense throughout. Do not tell a story, describe the place.", "answer": "The last of them went out through the north gate and the noise went with them. Ten minutes earlier the stand had been one solid wall of sound. Now the seats sat in rows, tipped up and empty, and the only thing moving was a plastic bag turning over itself along row H.\n\nDown on the pitch the grass was still cut into stripes that nobody was looking at any more. Two men in green coats walked the touchline with black sacks, bending, straightening, bending again. Their voices carried all the way up to the back row, which said more about the silence than it did about them.\n\nThe floodlights stayed on. Under them the goalmouth was worn down to bare soil, dark and churned, with the shape of the afternoon still printed into it. A steward stood at the top of the tunnel with his hands behind his back, waiting for something that had already happened.\n\nThen the lights went off in banks, one side at a time, and the stadium became a shape instead of a place. The bag was still moving along row H. It had nowhere to be either.", "marks": 24, "hint": "Write your last line in the plan before you write your first. Give each middle paragraph one thing to look at, and change what you look at rather than how you sound.", "explain": "Mark it against this checklist, one tick per item. STRUCTURE: 1. Four paragraphs, or close to it. 2. A wide opening image that sets the whole place. 3. Two middle paragraphs, each with a different focus, not the same idea twice. 4. A short closing paragraph that echoes something from the opening. DETAIL: 5. Specific things, not general ones: a named object, a sound, a texture, a colour. 6. At least one detail nobody else would think of. 7. Shows rather than tells, so no lines that state the feeling outright. CONTROL: 8. Past tense from first word to last, with no slips. 9. Sentence lengths vary, including at least one short sentence used for weight. 10. No two sentences in a row start the same way. 11. The last paragraph is as controlled as the first, with no run-ons and no list of events. ACCURACY: 12. No comma splices. 13. Capital I every time. 14. No missing articles or prepositions. 15. Apostrophes correct, including any plural possessives. PROCESS: 16. The plan is on the page. 17. He stopped writing with three minutes left and checked, starting from the last paragraph. Score out of 24: 12 for structure and detail, 8 for control, 4 for accuracy. A mark of 18 or more is strong work for Year 8.", "topic": "sustained writing: extended description"}]}, "g1-oceans": {"id": "g1-oceans", "day": "Monday", "subject": "Geography", "title": "Where things actually are", "minutes": 25, "objective": "Name the five oceans, the seven continents and the four UK countries with their capitals, and place Wolverhampton on a world map.", "extract": null, "teach": {"intro": ["Every place sits inside something bigger. Wolverhampton sits in England, England sits in the United Kingdom, and the United Kingdom sits in Europe.", "There are five oceans. Take the first letter of each and you get PAISA: Pacific, Atlantic, Indian, Southern, Arctic. For the seven continents use the sentence Eat An Aspirin After A Nasty Sandwich, which gives Europe, Antarctica, Asia, Africa, Australia, North America, South America."], "example": {"problem": "Where is Wolverhampton? Start with the biggest thing and work down to the smallest.", "steps": ["Start with the continent. Wolverhampton is in Europe.", "Now the group of countries. Europe contains the United Kingdom.", "Now the country. The United Kingdom is made of England, Scotland, Wales and Northern Ireland. Wolverhampton is in England.", "Now the region. Wolverhampton is in the West Midlands, in the middle of England.", "Now the city itself. Wolverhampton, about 20 km north west of Birmingham."], "answer": "Europe, then the United Kingdom, then England, then the West Midlands, then Wolverhampton."}, "keyfact": "Five oceans spell PAISA. Four UK capitals: London for England, Edinburgh for Scotland, Cardiff for Wales, Belfast for Northern Ireland."}, "questions": [{"id": "g1-oceans:q1", "level": "easy", "type": "mc", "q": "Which one of these is an ocean?", "options": ["The Pacific Ocean", "Mount Everest", "France", "The M6 motorway"], "answer": "The Pacific Ocean", "hint": "Three of these are not water at all.", "explain": "The Pacific Ocean is one of the five oceans. Mount Everest is a mountain, France is a country, and the M6 is a motorway. The five oceans are the Pacific, Atlantic, Indian, Southern and Arctic.", "topic": "oceans: naming the five oceans"}, {"id": "g1-oceans:q2", "level": "easy", "type": "mc", "q": "What is the capital city of England?", "options": ["London", "Manchester", "Wolverhampton", "Birmingham"], "answer": "London", "hint": "It is where Parliament and Big Ben are.", "explain": "London is the capital city of England. Birmingham and Manchester are big cities but they are not capitals. Wolverhampton is a city in the West Midlands, about 20 km north west of Birmingham.", "topic": "UK geography: countries and capitals"}, {"id": "g1-oceans:q3", "level": "easy", "type": "text", "q": "How many continents are there in the world? Write the number.", "answer": "7", "accept": ["7", "seven"], "hint": "Count them off: Europe, Antarctica, Asia, Africa, Australia, North America, South America.", "explain": "There are 7 continents. The memory sentence is Eat An Aspirin After A Nasty Sandwich, which gives Europe, Antarctica, Asia, Africa, Australia, North America and South America.", "topic": "continents: naming the seven continents"}, {"id": "g1-oceans:q4", "level": "easy", "type": "mc", "q": "Which continent is the United Kingdom part of?", "options": ["Europe", "Africa", "Asia", "North America"], "answer": "Europe", "hint": "Think about which continent France and Germany are in. The UK is in the same one.", "explain": "The United Kingdom is part of Europe. It sits off the north west coast of the rest of Europe, with the North Sea on one side and the Atlantic Ocean on the other.", "topic": "continents: placing the UK"}, {"id": "g1-oceans:q5", "level": "medium", "type": "mc", "q": "Which is the largest ocean in the world?", "options": ["The Pacific Ocean", "The Atlantic Ocean", "The Arctic Ocean", "The Indian Ocean"], "answer": "The Pacific Ocean", "hint": "It is the one between Asia and the Americas. It is so wide that a plane takes over 10 hours to cross it.", "explain": "The Pacific is the largest ocean. It sits between Asia and Australia on one side and North and South America on the other. The Arctic is the smallest of the five.", "topic": "oceans: size and position"}, {"id": "g1-oceans:q6", "level": "medium", "type": "text", "q": "What is the capital city of Scotland?", "answer": "Edinburgh", "accept": ["edinburgh", "edinbrough", "edinburg"], "hint": "It starts with E and it is not Glasgow.", "explain": "Edinburgh is the capital of Scotland. Glasgow is bigger but it is not the capital. Scotland is the country at the north of the island of Great Britain.", "topic": "UK geography: countries and capitals"}, {"id": "g1-oceans:q7", "level": "medium", "type": "mc", "q": "Which ocean goes all the way round Antarctica at the bottom of the world?", "options": ["The Southern Ocean", "The Arctic Ocean", "The Indian Ocean", "The Atlantic Ocean"], "answer": "The Southern Ocean", "hint": "The clue is in the name. South means the bottom of the map.", "explain": "The Southern Ocean circles Antarctica at the bottom of the world. The Arctic Ocean is the icy one at the top of the world, around the North Pole. People mix these two up, so use the names: Southern is south, Arctic is north.", "topic": "oceans: naming the five oceans"}, {"id": "g1-oceans:q8", "level": "medium", "type": "text", "q": "What is the capital city of Northern Ireland?", "answer": "Belfast", "accept": ["belfast"], "hint": "It starts with B. It is not Dublin, because Dublin is the capital of the Republic of Ireland, which is a separate country.", "explain": "Belfast is the capital of Northern Ireland. Northern Ireland is one of the four countries of the United Kingdom. Dublin is the capital of the Republic of Ireland, which is not part of the UK.", "topic": "UK geography: countries and capitals"}, {"id": "g1-oceans:q9", "level": "medium", "type": "mc", "q": "Cardiff is the capital city of which UK country?", "options": ["Wales", "Scotland", "England", "Northern Ireland"], "answer": "Wales", "hint": "This country is directly west of Wolverhampton. Its rugby team plays in red.", "explain": "Cardiff is the capital of Wales. Wales sits on the west side of Great Britain, and its border with England is about 65 km west of Wolverhampton. The four UK capitals are London, Edinburgh, Cardiff and Belfast.", "topic": "UK geography: countries and capitals"}, {"id": "g1-oceans:q10", "level": "stretch", "type": "mc", "q": "A container ship leaves Southampton on the south coast of England and sails to New York on the east coast of the USA. Which ocean does it cross?", "options": ["The Atlantic Ocean", "The Pacific Ocean", "The Indian Ocean", "The Arctic Ocean"], "answer": "The Atlantic Ocean", "hint": "Picture the world map. Which water sits between Europe and North America?", "explain": "The Atlantic Ocean sits between Europe and Africa on one side and North and South America on the other, so a ship going from England to New York crosses it. The Pacific is on the far side of America. The Indian Ocean is south of Asia. The Arctic is frozen for much of the year and is far to the north.", "topic": "oceans: applying ocean positions"}, {"id": "g1-oceans:q11", "level": "stretch", "type": "text", "q": "A rescue team is searching for a yacht that lost power. The yacht is roughly halfway between the east coast of Africa and the west coast of Australia. Which ocean are they searching?", "answer": "The Indian Ocean", "accept": ["indian", "indian ocean", "the indian ocean"], "hint": "Africa on one side, Australia on the other. Which ocean fills the gap?", "explain": "That gap is filled by the Indian Ocean. It sits south of Asia, east of Africa and west of Australia. The Atlantic is on the other side of Africa, so a search there would be in completely the wrong place.", "topic": "oceans: applying ocean positions"}, {"id": "g1-oceans:q12", "level": "stretch", "type": "long", "q": "A pen pal in Brazil asks you where Wolverhampton is. Write an answer that starts with the biggest thing and works down to the smallest. Name the continent, the group of countries, the country, the region and the city.", "answer": "Wolverhampton is in Europe. In Europe it is in the United Kingdom. The United Kingdom is made of four countries, and Wolverhampton is in England. Inside England it is in a region called the West Midlands, in the middle of the country, about 20 km north west of Birmingham.", "hint": "Go in this order: continent, then country group, then country, then region, then city. Five steps.", "explain": "Check your answer contains all five of these: Europe, the United Kingdom, England, the West Midlands, Wolverhampton. A strong answer also adds a landmark to fix it, such as being about 20 km north west of Birmingham, or being roughly in the middle of England rather than near the coast. Give yourself one mark per correct level named.", "topic": "location: placing yourself on a world map"}]}, "g2-fourfig": {"id": "g2-fourfig", "day": "Tuesday", "subject": "Geography", "title": "Four figure grid references", "minutes": 25, "objective": "Give and read four figure grid references correctly, always taking the easting before the northing.", "extract": "THE MAP: the village of Ashwood.\n\nThe map is a grid. The lines going up and down are eastings. They are numbered 20, 21, 22, 23, 24, 25, 26, 27 from left to right. The lines going across are northings. They are numbered 40, 41, 42, 43, 44, 45, 46, 47 from bottom to top. Each square is 1 km by 1 km.\n\nA square is named by the easting line on its left side and the northing line on its bottom side.\n\nWHAT IS ON THE MAP\nHill Farm is in square 2046.\nA church with a tower is in square 2145.\nA car park is in square 2043.\nThe railway station is in square 2344.\nA football pitch is in square 2443.\nA campsite is in square 2441.\nThe Fox pub is in square 2542.\nA spot height of 210 m, the top of Beacon Hill, is in square 2545.\nA youth hostel is in square 2646.\nBell Wood is in square 2340.\nA quarry is in square 2640.\n\nLINES ON THE MAP\nA river flows from north to south down the map. It stays between easting lines 22 and 23 the whole way. It passes through squares 2246, 2245, 2244, 2243, 2242, 2241 and 2240.\nThe main road runs east to west across the map. It stays between northing lines 42 and 43 the whole way. It passes through squares 2042, 2142, 2242, 2342, 2442, 2542 and 2642.\nThe railway runs east to west across the map. It stays between northing lines 44 and 45 the whole way. It passes through squares 2044, 2144, 2244, 2344, 2444, 2544 and 2644.\nA stone bridge carries the main road over the river.\n\nThere is no picture. Everything you need is written above.", "teach": {"intro": ["A four figure grid reference tells someone exactly which square you are in. The numbers along the bottom of the map are eastings. The numbers up the side are northings.", "Always read the easting first, then the northing. The way to remember it is along the corridor, then up the stairs. You walk along before you go up."], "example": {"problem": "A pub sits in the square between easting lines 25 and 26, and between northing lines 42 and 43. Give the four figure grid reference.", "steps": ["Go along the corridor first. Find the easting line on the left hand side of the square. That is 25.", "Now go up the stairs. Find the northing line along the bottom of the square. That is 42.", "Write the easting first, then the northing, with no gap and no comma.", "25 and 42 becomes 2542."], "answer": "2542"}, "keyfact": "Take the line on the left of the square, then the line under the square. Along the corridor, then up the stairs."}, "questions": [{"id": "g2-fourfig:q1", "level": "easy", "type": "mc", "q": "In a four figure grid reference, which number do you write first?", "options": ["The easting, the number along the bottom", "The northing, the number up the side", "The bigger of the two numbers", "It does not matter which order"], "answer": "The easting, the number along the bottom", "hint": "Along the corridor, then up the stairs.", "explain": "The easting always comes first. Eastings are the numbers along the bottom of the map. Northings are the numbers up the side. Along the corridor, then up the stairs.", "topic": "grid references: four figure"}, {"id": "g2-fourfig:q2", "level": "easy", "type": "text", "q": "Give the four figure grid reference for the square with the church with a tower.", "answer": "2145", "accept": ["2145", "21 45"], "hint": "The map description tells you the square directly. Just copy the four figures.", "explain": "The church with a tower is in square 2145. The easting line on the left of that square is 21 and the northing line under it is 45, so the reference is 2145.", "topic": "grid references: four figure"}, {"id": "g2-fourfig:q3", "level": "easy", "type": "mc", "q": "Which square is the campsite in?", "options": ["2441", "4124", "2414", "4421"], "answer": "2441", "hint": "Easting first. The other three are the same digits jumbled up.", "explain": "The campsite is in square 2441. Easting 24 comes first, then northing 41. The other options use the same digits but in the wrong order, which would point to a completely different place.", "topic": "grid references: four figure"}, {"id": "g2-fourfig:q4", "level": "easy", "type": "text", "q": "Give the four figure grid reference for the square with the youth hostel.", "answer": "2646", "accept": ["2646", "26 46"], "hint": "Find the youth hostel in the list of features on the map.", "explain": "The youth hostel is in square 2646. That is easting 26, then northing 46. It sits in the top right area of the map.", "topic": "grid references: four figure"}, {"id": "g2-fourfig:q5", "level": "medium", "type": "text", "q": "Give the four figure grid reference for the square with the car park.", "answer": "2043", "accept": ["2043", "20 43"], "hint": "The car park is on the left hand edge of the map, about halfway up.", "explain": "The car park is in square 2043. Easting 20 is the far left line on this map, and northing 43 is a bit below the middle.", "topic": "grid references: four figure"}, {"id": "g2-fourfig:q6", "level": "medium", "type": "text", "q": "Give the four figure grid reference for the square with the railway station.", "answer": "2344", "accept": ["2344", "23 44"], "hint": "The station sits on the railway line, which runs across the row of squares between northings 44 and 45.", "explain": "The railway station is in square 2344. The railway runs east to west along the row of squares 2044 to 2644, and the station is the one in easting column 23.", "topic": "grid references: four figure"}, {"id": "g2-fourfig:q7", "level": "medium", "type": "mc", "q": "What is in square 2542?", "options": ["The Fox pub", "The campsite", "The quarry", "The church with a tower"], "answer": "The Fox pub", "hint": "Split the reference. Easting 25, northing 42. Now look for that square in the list.", "explain": "Square 2542 contains The Fox pub. The campsite is 2441, the quarry is 2640 and the church is 2145. Reading a reference backwards is the same skill as writing one: chop the four figures into two pairs, easting then northing.", "topic": "grid references: reading a reference"}, {"id": "g2-fourfig:q8", "level": "medium", "type": "text", "q": "What is in square 2340?", "answer": "Bell Wood", "accept": ["bell wood", "bell woods", "the wood", "wood", "a wood", "woods", "trees", "forest", "bellwood"], "hint": "Easting 23, northing 40. Northing 40 is the very bottom row of the map.", "explain": "Square 2340 contains Bell Wood. Northing 40 is the bottom row of squares on this map, so anything with a northing of 40 is along the bottom edge.", "topic": "grid references: reading a reference"}, {"id": "g2-fourfig:q9", "level": "medium", "type": "text", "q": "What is in square 2046?", "answer": "Hill Farm", "accept": ["hill farm", "the farm", "a farm", "farm", "hillfarm"], "hint": "Easting 20 is the far left of the map. Northing 46 is the top row.", "explain": "Square 2046 contains Hill Farm. Easting 20 puts it on the far left edge and northing 46 puts it in the top row, so it is the top left corner of the map.", "topic": "grid references: reading a reference"}, {"id": "g2-fourfig:q10", "level": "stretch", "type": "text", "q": "A stone bridge carries the main road over the river. Give the four figure grid reference for the square with the bridge.", "answer": "2242", "accept": ["2242", "22 42"], "hint": "The bridge must be where the road and the river cross. Find the easting column the river is in, and the northing row the road is in.", "explain": "The river runs down the column of squares 2240 to 2246, so its easting is always 22. The road runs across the row of squares 2042 to 2642, so its northing is always 42. The only square that is both is 2242, so the bridge is in 2242.", "topic": "grid references: working out a location"}, {"id": "g2-fourfig:q11", "level": "stretch", "type": "text", "q": "A walker phones for help. He says he is in the square directly north of The Fox pub. Give the four figure grid reference for the square he is in.", "answer": "2543", "accept": ["2543", "25 43"], "hint": "North means up the map. Going up one square adds 1 to the northing and leaves the easting alone.", "explain": "The Fox pub is in square 2542. Going north means going up the map, so the northing goes up by 1 and the easting stays the same. 25 stays as 25, and 42 becomes 43, giving 2543. A common mistake is to change the easting instead, which would move you east or west, not north.", "topic": "grid references: direction and grid squares"}, {"id": "g2-fourfig:q12", "level": "stretch", "type": "long", "q": "A friend tells you the football pitch is at grid reference 4324. That is wrong. Explain what mistake he has made, and give the correct four figure grid reference.", "answer": "He has written the northing before the easting. The football pitch is in square 2443, so the easting is 24 and the northing is 43. Written the right way round, easting first, the reference is 2443. He wrote 43 first and 24 second, which is up the stairs before along the corridor.", "hint": "Look closely at 4324 and at the pitch's real square. The same digits are there, just swapped.", "explain": "Check your answer says three things. One, the football pitch is in square 2443. Two, the mistake is giving the northing first and the easting second, so the pairs are swapped. Three, the correct reference is 2443. Full marks also for saying the rule that fixes it, along the corridor then up the stairs. Reference 4324 would point somewhere off this map entirely, which is why a rescue team would never find him.", "topic": "grid references: common errors"}]}, "g3-sixfig": {"id": "g3-sixfig", "day": "Wednesday", "subject": "Geography", "title": "Six figure grid references", "minutes": 25, "objective": "Give and read six figure grid references by splitting each grid square into tenths.", "extract": "THE MAP: the town of Bilston Moor.\n\nEastings are the lines going up and down. They are numbered 30, 31, 32, 33, 34, 35, 36 from left to right. Northings are the lines going across. They are numbered 70, 71, 72, 73, 74, 75, 76 from bottom to top. Each square is 1 km by 1 km. Each square is split into 10 tenths across and 10 tenths up.\n\nWHAT IS ON THE MAP\nFor each place you are told the square, then how many tenths east and how many tenths north it sits inside that square.\n\nA church with a spire: square 3172, 4 tenths east, 7 tenths north.\nA car park: square 3374, 2 tenths east, 5 tenths north.\nThe bus station: square 3070, 8 tenths east, 3 tenths north.\nThe football stadium: square 3573, 5 tenths east, 5 tenths north.\nA campsite: square 3271, 1 tenth east, 9 tenths north.\nA youth hostel: square 3475, 6 tenths east, 2 tenths north.\nThe Anchor pub: square 3272, 9 tenths east, 4 tenths north.\nThe summit of Ash Hill, 287 m: square 3471, 3 tenths east, 6 tenths north.\nThe post office: square 3073, 2 tenths east, 2 tenths north.\nA quarry: square 3575, 2 tenths east, 8 tenths north.\nThe railway station: square 3273, 6 tenths east, 3 tenths north.\nA stone bridge over the river is at grid reference 317701.\n\nThere is no picture. Everything you need is written above.", "teach": {"intro": ["A four figure reference gives a square 1 km across. That is a big area to search. A six figure reference points to a spot about 100 m across, which is about the length of a football pitch.", "To get it, imagine each square split into 10 strips across and 10 strips up. Count how many tenths east and how many tenths north your point is, then slot each of those numbers into the reference."], "example": {"problem": "A church sits in square 3172. Inside that square it is 4 tenths of the way east and 7 tenths of the way north. Give the six figure grid reference.", "steps": ["Take the easting first. The square starts at easting 31.", "The church is 4 tenths east, so add that digit on the end. The easting becomes 314.", "Now the northing. The square starts at northing 72.", "The church is 7 tenths north, so add that digit on the end. The northing becomes 727.", "Put them together, easting first, no gaps. 314 and 727 becomes 314727."], "answer": "314727"}, "keyfact": "Three digits for the easting, then three for the northing. The third digit of each pair is the number of tenths."}, "questions": [{"id": "g3-sixfig:q1", "level": "easy", "type": "mc", "q": "To give a six figure reference, how many parts do you split each side of a grid square into, going across and going up?", "options": ["10", "4", "6", "100"], "answer": "10", "hint": "The word tenths is the clue.", "explain": "You split each square into 10 across and 10 up. That is why the extra digit can only ever be 0 to 9. It creates 100 small boxes inside the square, but you count in tenths along each edge.", "topic": "grid references: six figure"}, {"id": "g3-sixfig:q2", "level": "easy", "type": "text", "q": "Give the six figure grid reference for the church with a spire.", "answer": "314727", "accept": ["314727", "314 727"], "hint": "Square 3172, 4 tenths east, 7 tenths north. Slot the tenths on the end of each pair.", "explain": "The square is 3172. The easting 31 gains the 4 tenths and becomes 314. The northing 72 gains the 7 tenths and becomes 727. Together that is 314727.", "topic": "grid references: six figure"}, {"id": "g3-sixfig:q3", "level": "easy", "type": "mc", "q": "Which of these is the six figure grid reference for the bus station?", "options": ["308703", "380370", "703308", "3087"], "answer": "308703", "hint": "The bus station is in square 3070, 8 tenths east and 3 tenths north. Build the easting first.", "explain": "The square is 3070. Easting 30 plus 8 tenths gives 308. Northing 70 plus 3 tenths gives 703. That makes 308703. The option 703308 is the two halves swapped, and 3087 is only four figures.", "topic": "grid references: six figure"}, {"id": "g3-sixfig:q4", "level": "easy", "type": "text", "q": "Give the six figure grid reference for the campsite.", "answer": "321719", "accept": ["321719", "321 719"], "hint": "Square 3271, 1 tenth east, 9 tenths north.", "explain": "The square is 3271. Easting 32 plus 1 tenth gives 321. Northing 71 plus 9 tenths gives 719. That makes 321719. Being 9 tenths north means the campsite is right at the top of its square.", "topic": "grid references: six figure"}, {"id": "g3-sixfig:q5", "level": "medium", "type": "text", "q": "Give the six figure grid reference for the car park.", "answer": "332745", "accept": ["332745", "332 745"], "hint": "Square 3374, 2 tenths east, 5 tenths north.", "explain": "The square is 3374. Easting 33 plus 2 tenths gives 332. Northing 74 plus 5 tenths gives 745. That makes 332745.", "topic": "grid references: six figure"}, {"id": "g3-sixfig:q6", "level": "medium", "type": "text", "q": "Give the six figure grid reference for the youth hostel.", "answer": "346752", "accept": ["346752", "346 752"], "hint": "Square 3475, 6 tenths east, 2 tenths north. Watch the order of the tenths.", "explain": "The square is 3475. Easting 34 plus 6 tenths gives 346. Northing 75 plus 2 tenths gives 752. That makes 346752. A common slip is to write 342756, which uses the tenths the wrong way round.", "topic": "grid references: six figure"}, {"id": "g3-sixfig:q7", "level": "medium", "type": "text", "q": "What is at grid reference 355735?", "answer": "The football stadium", "accept": ["football stadium", "the football stadium", "stadium", "the stadium", "football ground", "the football ground"], "hint": "Chop it into two halves of three. The first three are the easting, the last three the northing. Then strip off the tenths to find the square.", "explain": "Split 355735 into 355 and 735. Drop the last digit of each to get square 3573, then the tenths are 5 east and 5 north. That is the football stadium, sitting right in the middle of its square.", "topic": "grid references: reading a six figure reference"}, {"id": "g3-sixfig:q8", "level": "medium", "type": "text", "q": "What is at grid reference 329724?", "answer": "The Anchor pub", "accept": ["anchor pub", "the anchor pub", "pub", "the pub", "anchor"], "hint": "Split it into 329 and 724. The square is 3272 and the tenths are 9 east, 4 north.", "explain": "Split 329724 into 329 and 724. Strip the tenths to get square 3272, with 9 tenths east and 4 tenths north. That is The Anchor pub, sitting near the right hand edge of its square.", "topic": "grid references: reading a six figure reference"}, {"id": "g3-sixfig:q9", "level": "medium", "type": "mc", "q": "What is at grid reference 343716?", "options": ["The summit of Ash Hill, 287 m", "The quarry", "The post office", "The railway station"], "answer": "The summit of Ash Hill, 287 m", "hint": "Split it into 343 and 716. That gives square 3471 with 3 tenths east and 6 tenths north.", "explain": "Split 343716 into 343 and 716. The square is 3471, with 3 tenths east and 6 tenths north. That is the summit of Ash Hill at 287 m. The quarry is 352758, the post office is 302732 and the railway station is 326733.", "topic": "grid references: reading a six figure reference"}, {"id": "g3-sixfig:q10", "level": "stretch", "type": "text", "q": "A stone bridge is at grid reference 317701. Which grid square is the bridge in? Give a four figure grid reference.", "answer": "3170", "accept": ["3170", "31 70"], "hint": "A six figure reference is just a four figure one with a tenths digit pushed into each half. Take those two extra digits back out.", "explain": "Split 317701 into 317 and 701. The last digit of each half is the tenths, so remove them. That leaves easting 31 and northing 70, giving square 3170. The bridge is 7 tenths east and 1 tenth north inside that square. This works every time: keep the first two digits of each half.", "topic": "grid references: converting six figure to four figure"}, {"id": "g3-sixfig:q11", "level": "stretch", "type": "text", "q": "Start at The Anchor pub at 329724. Move 3 tenths east and 1 tenth north. Give the six figure grid reference of the point you end up at.", "answer": "332725", "accept": ["332725", "332 725"], "hint": "9 tenths plus 3 tenths is 12 tenths. That is more than one whole square, so you cross into the next easting column.", "explain": "The easting is 329, which means 32 and 9 tenths. Adding 3 tenths gives 12 tenths, which is one whole square plus 2 tenths, so the easting becomes 33 and 2 tenths, written 332. The northing is 724, which means 72 and 4 tenths. Adding 1 tenth gives 725. The answer is 332725. The point has moved out of square 3272 and into square 3372.", "topic": "grid references: moving across grid squares"}, {"id": "g3-sixfig:q12", "level": "stretch", "type": "long", "q": "A walker is lost on Ash Hill. His friend gives mountain rescue the four figure reference 3471. Explain why a six figure reference such as 343716 would be far more useful to the rescue team. Use numbers in your answer.", "answer": "A four figure reference like 3471 only names a whole grid square. Each square is 1 km by 1 km, so the team would have to search 1 square kilometre of hillside. A six figure reference splits that square into tenths, so it points to a box about 100 m by 100 m. That is roughly the size of a football pitch. The search area drops from 1 km by 1 km to about 100 m by 100 m, which is 100 times smaller, so the team finds him far faster.", "hint": "Work out the size of the area each reference points to. One grid square is 1 km by 1 km. Now split that into tenths.", "explain": "Check your answer contains these points. One, a four figure reference gives a square 1 km by 1 km. Two, a six figure reference narrows it to about 100 m by 100 m, because a tenth of 1 km is 100 m. Three, that is a much smaller area to search, so rescue is faster. Full marks also for saying the six figure box is 100 times smaller in area, or for comparing 100 m to something real such as the length of a football pitch.", "topic": "grid references: why precision matters"}]}, "g4-contours": {"id": "g4-contours", "day": "Thursday", "subject": "Geography", "title": "Contours, relief and distance", "minutes": 25, "objective": "Read contour lines to judge height and steepness, measure straight line distance using a scale bar, and name the stages of the water cycle.", "extract": "THE MAP: Brown Hill and the River Dane.\n\nEastings are numbered 50 to 56 from left to right. Northings are numbered 20 to 26 from bottom to top. Each square is 1 km by 1 km. The scale bar under the map shows that 2 cm on the map stands for 1 km on the ground.\n\nCONTOURS\nContour lines are drawn every 10 m.\nBrown Hill is in the east of the map. It is a set of contour rings, one inside the next, labelled 100, 110, 120, 130 and 140. The smallest ring is at the top. A spot height marked 148 m sits inside the smallest ring, in square 5423.\nOn the west side of Brown Hill the contour lines are spread widely apart.\nOn the east side of Brown Hill the contour lines are bunched close together, almost touching.\nThe River Dane flows from north to south down the column of squares 5125, 5124, 5123, 5122, 5121 and 5120. Where the contour lines cross the river they bend into a V shape. The point of every V points north, upstream, towards higher ground.\nIn the south west corner, in squares 5020 and 5021, there are no contour lines at all. That land is flat and lower than 50 m.\n\nFOUR PLACES ARE MARKED WITH LETTERS\nA is a car park in square 5021.\nB is the summit of Brown Hill in square 5423.\nC is a bridge over the River Dane in square 5122.\nD is a youth hostel in square 5525.\n\nSTRAIGHT LINE MEASUREMENTS TAKEN WITH A RULER ON THE MAP\nA to B measures 9 cm.\nC to D measures 7.5 cm.\nA to C measures 3 cm.\nB to D measures 5 cm.\n\nTHE WATER CYCLE, for the last few questions\nevaporation: the sun heats water and turns it from a liquid into a gas called water vapour.\ntranspiration: plants and trees release water vapour out of their leaves.\ncondensation: water vapour rises, gets cold, and turns back into tiny droplets that make clouds.\nprecipitation: water falls out of the clouds as rain, snow, sleet or hail.\nsurface runoff: water flows over the top of the ground into a river.\ninfiltration: water soaks down into the soil instead of running over the top.\ngroundwater flow: water that has soaked in moves slowly downhill through the rock until it reaches a river or the sea.\n\nThere is no picture. Everything you need is written above.", "teach": {"intro": ["A contour line joins places that are the same height above sea level. Every single point on the line marked 100 is exactly 100 m high.", "The gap between the lines tells you how steep the ground is. Lines squashed close together mean steep ground, like the side of a football stand. Lines spread far apart mean gentle ground you could jog up.", "The water cycle, because it turns up in the last few questions. Water evaporates from the sea and turns into vapour. Plants lose water from their leaves too, which is transpiration. The vapour rises, cools and condenses into cloud. It falls as precipitation, meaning rain, hail, sleet or snow. Once it lands it either soaks into the ground, which is infiltration, or runs across the top into rivers, which is surface run-off. Water moving slowly through the rock underground is groundwater flow."], "example": {"problem": "A car park and a summit are 6 cm apart in a straight line on the map. The scale bar says 2 cm on the map stands for 1 km on the ground. How far apart are they in real life?", "steps": ["Work out what 1 cm on the map is worth. 2 cm is 1 km, so 1 cm is 0.5 km.", "Multiply that by the number of centimetres you measured.", "6 x 0.5 = 3.", "So the real distance is 3 km."], "answer": "3 km"}, "keyfact": "Contours close together means steep. Contours far apart means gentle. Rings inside rings means a hill, with the smallest ring at the top."}, "questions": [{"id": "g4-contours:q1", "level": "easy", "type": "mc", "q": "Contour lines on a map join together places that are all the same what?", "options": ["Height above sea level", "Temperature", "Distance from the sea", "Depth of water"], "answer": "Height above sea level", "hint": "The number printed on the line is measured in metres.", "explain": "A contour line joins places of equal height above sea level. If you walked exactly along the 100 m contour line you would stay at 100 m the whole way and never go up or down.", "topic": "contours: what a contour line shows"}, {"id": "g4-contours:q2", "level": "easy", "type": "mc", "q": "On a map, contour lines that are very close together tell you the slope is:", "options": ["Steep", "Gentle", "Flat", "Under water"], "answer": "Steep", "hint": "Close together means you gain a lot of height over a short distance.", "explain": "Close contour lines mean steep ground. You are climbing 10 m of height in a very short distance across the map. Lines far apart mean gentle ground, because the same 10 m of climb is spread over a long distance.", "topic": "contours: spacing and steepness"}, {"id": "g4-contours:q3", "level": "easy", "type": "mc", "q": "Rain, snow, sleet and hail all fall out of clouds. What is the one water cycle word for all of them?", "options": ["Precipitation", "Evaporation", "Infiltration", "Transpiration"], "answer": "Precipitation", "hint": "It is the word that covers every kind of water falling from the sky.", "explain": "Precipitation is the water cycle word for water falling out of clouds, in any form. Rain, snow, sleet and hail are all precipitation. Evaporation is water turning into gas, infiltration is water soaking into the ground, and transpiration is water coming out of plant leaves.", "topic": "water cycle: precipitation"}, {"id": "g4-contours:q4", "level": "easy", "type": "text", "q": "How high is the summit of Brown Hill? Give the number of metres.", "answer": "148", "accept": ["148", "148m", "148 m", "148 metres", "148 meters"], "hint": "Look for the spot height inside the smallest contour ring.", "explain": "The summit of Brown Hill is 148 m. The contour rings around it are labelled 100, 110, 120, 130 and 140, and the spot height of 148 m sits inside the smallest ring, in square 5423. The spot height is always more exact than the contour lines.", "topic": "contours: reading height and spot heights"}, {"id": "g4-contours:q5", "level": "medium", "type": "mc", "q": "Which side of Brown Hill is steeper, and how do you know?", "options": ["The east side, because the contour lines are bunched close together", "The west side, because the contour lines are bunched close together", "The east side, because the contour lines are spread far apart", "Both sides are the same, because the contour lines are always 10 m apart"], "answer": "The east side, because the contour lines are bunched close together", "hint": "Read the map description again. One side says spread widely apart, the other says almost touching.", "explain": "The east side is steeper. On the east side the contour lines are bunched close together, so you climb the same height in a much shorter distance. On the west side the lines are spread widely apart, so the slope is gentle. The lines really are always 10 m apart in height, but it is the horizontal gap between them that tells you the steepness.", "topic": "contours: spacing and steepness"}, {"id": "g4-contours:q6", "level": "medium", "type": "mc", "q": "Where the contour lines cross the River Dane they bend into a V shape, and the point of every V points north, upstream, towards higher ground. What landform is this?", "options": ["A valley", "A hill", "A cliff", "A flat plain"], "answer": "A valley", "hint": "The river is running downhill in a groove. What is the name for a groove in the land with a river in it?", "explain": "This is a valley. Contour lines bend into a V where they cross a river, and the point of the V always points upstream, towards the higher ground the river is flowing down from. A hill shows as rings inside rings instead, and flat land shows as no contour lines at all.", "topic": "contours: identifying valleys"}, {"id": "g4-contours:q7", "level": "medium", "type": "text", "q": "The straight line from the car park A to the summit B measures 9 cm on the map. The scale bar says 2 cm on the map is 1 km on the ground. How far is it in real life? Give your answer in km.", "answer": "4.5", "accept": ["4.5", "4.5km", "4.5 km", "4,5", "4 1/2", "four and a half", "4.5 kilometres", "4.5 kilometers"], "hint": "First work out what 1 cm is worth, then multiply by 9.", "explain": "2 cm on the map is 1 km, so 1 cm is 0.5 km. Then 9 x 0.5 = 4.5. The real distance from A to B is 4.5 km.", "topic": "maps: measuring distance with a scale bar"}, {"id": "g4-contours:q8", "level": "medium", "type": "text", "q": "The straight line from the bridge C to the youth hostel D measures 7.5 cm on the map. Using the same scale, 2 cm on the map is 1 km on the ground. How far is it in real life? Give your answer in km.", "answer": "3.75", "accept": ["3.75", "3.75km", "3.75 km", "3,75", "3 3/4", "3.75 kilometres", "3.75 kilometers"], "hint": "Same method as before. 1 cm is 0.5 km, so multiply 7.5 by 0.5.", "explain": "1 cm on the map is 0.5 km on the ground. Then 7.5 x 0.5 = 3.75. The real distance from C to D is 3.75 km. Half of 7.5 is 3.75, so halving is a quick check.", "topic": "maps: measuring distance with a scale bar"}, {"id": "g4-contours:q9", "level": "medium", "type": "mc", "q": "A puddle on a football pitch dries up in the sun. At the same time, water is being released into the air from the leaves of the trees around the pitch. What are these two processes called?", "options": ["Evaporation and transpiration", "Condensation and precipitation", "Infiltration and surface runoff", "Precipitation and groundwater flow"], "answer": "Evaporation and transpiration", "hint": "One word is about water heated by the sun. The other word is about plants.", "explain": "The puddle drying is evaporation, where the sun turns liquid water into water vapour. Water leaving plant leaves is transpiration. Both send water vapour up into the air, which is why geographers often write them together as evapotranspiration.", "topic": "water cycle: evaporation and transpiration"}, {"id": "g4-contours:q10", "level": "stretch", "type": "text", "q": "A walker goes in a straight line from the car park A to the bridge C, then in a straight line from C to the youth hostel D. On the map A to C measures 3 cm and C to D measures 7.5 cm. Using 2 cm to 1 km, what total distance does he walk in real life? Give your answer in km.", "answer": "5.25", "accept": ["5.25", "5.25km", "5.25 km", "5,25", "5 1/4", "5.25 kilometres", "5.25 kilometers"], "hint": "Convert each leg into km separately, then add them. Do not add the centimetres first unless you convert afterwards.", "explain": "1 cm on the map is 0.5 km. Leg one: 3 x 0.5 = 1.5 km. Leg two: 7.5 x 0.5 = 3.75 km. Total 1.5 + 3.75 = 5.25 km. You could also add the map measurements first, 3 + 7.5 = 10.5 cm, then 10.5 x 0.5 = 5.25 km. Both give the same answer.", "topic": "maps: measuring distance with a scale bar"}, {"id": "g4-contours:q11", "level": "stretch", "type": "mc", "q": "Heavy rain falls on Brown Hill. On the steep east side the ground is hard bare rock, and the water pours straight down the surface into the river. On the gentle west side the soil is deep and soft, so the water sinks in and then creeps slowly through the rock towards the river. Which set of words describes the east side and then the west side?", "options": ["Surface runoff, then infiltration followed by groundwater flow", "Infiltration, then surface runoff", "Condensation, then precipitation", "Transpiration, then evaporation"], "answer": "Surface runoff, then infiltration followed by groundwater flow", "hint": "One side has water travelling on top of the ground. The other has it going down into the ground and then sideways through the rock.", "explain": "On the east side the water travels over the top of the ground, which is surface runoff. Steep slopes and hard rock both make runoff more likely, so rivers there rise fast after rain. On the west side the water soaks down into the soil, which is infiltration, and then moves slowly downhill through the rock, which is groundwater flow. Groundwater flow is much slower than surface runoff, so that water reaches the river hours or days later.", "topic": "water cycle: runoff, infiltration and groundwater flow"}, {"id": "g4-contours:q12", "level": "stretch", "type": "long", "q": "Mountain rescue must carry an injured walker on a stretcher from the summit of Brown Hill down to the car park A. They can go down the east side or the west side. Use the contour lines to say which route they should take and explain why.", "answer": "They should go down the west side. On the west side the contour lines are spread widely apart, which means the slope is gentle, so the drop in height is spread over a long distance. On the east side the contour lines are bunched close together and almost touching, which means the slope is very steep. Carrying a stretcher down a steep slope is slow and dangerous, because the team could slip and the walker could be tipped. The west route is longer in distance but far safer and probably faster in the end. It also leads towards the flat, low ground in squares 5020 and 5021 where the car park is.", "hint": "Look at what the map says about the contour spacing on each side of the hill. Then think about what that spacing means for someone carrying a heavy stretcher.", "explain": "Check your answer contains these points. One, choose the west side. Two, give the map evidence, that the contour lines on the west side are spread far apart while those on the east side are bunched close together. Three, translate that into slope, far apart means gentle, close together means steep. Four, explain the consequence for a stretcher team, a gentle slope is safer and easier to carry on while a steep slope risks slips and falls. Full marks also for noticing that the longer gentle route may still be quicker overall, or that the car park sits on flat land in the south west.", "topic": "contours: applying relief to a real decision"}]}, "de1-verb2": {"id": "de1-verb2", "day": "Monday", "subject": "German", "title": "The rule that runs German: verb second", "minutes": 20, "objective": "Keep the conjugated verb in second position, including when a time phrase is moved to the front.", "extract": null, "teach": {"intro": ["In a German statement the verb that carries the ending must be the second idea. An idea can be one word or a small group of words that belong together, so you count ideas and not words.", "Ich spiele Fussball means I play football. Idea one is ich, idea two is the verb spiele, and so far this matches English.", "If you put something else first, the verb still has to be second, so the subject slides behind it. Heute spiele ich Fussball is correct, and Heute ich spiele Fussball is wrong because the verb has been pushed into third place."], "example": {"problem": "Rewrite Ich gehe am Montag in die Schule so that it starts with Am Montag.", "steps": ["Find the conjugated verb. It is gehe, from gehen, to go.", "Am Montag is now idea one. It is two words but one idea, because am belongs with Montag.", "The verb must be idea two, so gehe comes next.", "The subject ich now goes third, then the rest of the sentence follows."], "answer": "Am Montag gehe ich in die Schule."}, "keyfact": "Verb second, always. Count ideas, not words. If anything other than the subject goes first, the subject moves to just after the verb."}, "questions": [{"id": "de1-verb2:q1", "level": "easy", "type": "mc", "q": "Which word is the verb in Ich wohne in London?", "options": ["Ich", "wohne", "in", "London"], "answer": "wohne", "hint": "The verb is the doing word. It is the one that changes its ending to match ich.", "explain": "The answer is wohne. Wohnen means to live somewhere, and with ich the ending changes to -e, giving wohne. Ich is the subject, in is a small linking word and London is a place name.", "topic": "word order: finding the verb"}, {"id": "de1-verb2:q2", "level": "easy", "type": "mc", "q": "Which sentence is correct?", "options": ["Heute ich spiele Fussball.", "Heute spiele ich Fussball.", "Spiele heute ich Fussball.", "Ich heute spiele Fussball."], "answer": "Heute spiele ich Fussball.", "hint": "Count the ideas. The verb has to be the second one.", "explain": "The answer is Heute spiele ich Fussball. Heute is idea one, so the verb spiele must be idea two and ich is pushed to third. Heute ich spiele Fussball puts the verb third, which German does not allow. The third option is a question, and the fourth also leaves the verb in third place.", "topic": "word order: fronted time phrase"}, {"id": "de1-verb2:q3", "level": "easy", "type": "text", "q": "Put these words into a correct sentence: spiele / ich / Tennis", "answer": "Ich spiele Tennis.", "accept": ["ich spiele tennis.", "Ich spiele Tennis", "ich spiele tennis", "Ich spiele Tennis."], "hint": "Start with the person, then the verb.", "explain": "The answer is Ich spiele Tennis. The subject ich is idea one and the verb spiele is idea two, which is the normal order. Tennis is the thing being played and goes at the end.", "topic": "word order: normal statement order"}, {"id": "de1-verb2:q4", "level": "easy", "type": "mc", "q": "In a normal German statement, which position does the conjugated verb take?", "options": ["First", "Second", "Third", "Last"], "answer": "Second", "hint": "It is the same position every time, no matter what comes first.", "explain": "The answer is second. The conjugated verb is always the second idea in a German statement. This does not change, which is why everything else has to move around it.", "topic": "word order: the verb second rule"}, {"id": "de1-verb2:q5", "level": "medium", "type": "text", "q": "Rewrite this sentence so it starts with Morgen: Ich fahre nach Berlin.", "answer": "Morgen fahre ich nach Berlin.", "accept": ["morgen fahre ich nach berlin.", "morgen fahre ich nach berlin", "Morgen fahre ich nach Berlin.", "Morgen fahre ich nach Berlin"], "hint": "Morgen becomes idea one, so the verb must come straight after it.", "explain": "The answer is Morgen fahre ich nach Berlin. Morgen means tomorrow and is now idea one. The verb fahre must be idea two, so ich moves to third place. Morgen ich fahre nach Berlin would be wrong.", "topic": "word order: fronted time phrase"}, {"id": "de1-verb2:q6", "level": "medium", "type": "text", "q": "Rewrite this sentence so it starts with Am Freitag: Wir gehen ins Kino.", "answer": "Am Freitag gehen wir ins Kino.", "accept": ["am freitag gehen wir ins kino.", "Am Freitag gehen wir ins Kino.", "am freitag gehen wir ins kino", "Am Freitag gehen wir ins Kino"], "hint": "Am Freitag is two words but only one idea.", "explain": "The answer is Am Freitag gehen wir ins Kino. Am Freitag means on Friday and counts as a single idea, so it fills position one. The verb gehen goes second and the subject wir goes third.", "topic": "word order: fronted time phrase"}, {"id": "de1-verb2:q7", "level": "medium", "type": "mc", "q": "Why is Um acht Uhr ich esse Fruehstueck wrong?", "options": ["The verb esse should be isst", "The verb is in third place and it must be second", "A time phrase cannot start a German sentence", "ich must always be the first word"], "answer": "The verb is in third place and it must be second", "hint": "Count the ideas in front of the verb.", "explain": "The answer is that the verb is in third place and it must be second. Um acht Uhr is idea one, ich is idea two and esse has ended up third. The correct sentence is Um acht Uhr esse ich Fruehstueck. The verb form esse is right for ich, so that is not the problem.", "topic": "word order: diagnosing a verb third error"}, {"id": "de1-verb2:q8", "level": "medium", "type": "text", "q": "Put these into one correct sentence, starting with the time phrase: in die Stadt / gehe / am Samstag / ich", "answer": "Am Samstag gehe ich in die Stadt.", "accept": ["Am Samstag gehe ich in die Stadt", "am samstag gehe ich in die stadt.", "am samstag gehe ich in die stadt", "Am Samstag gehe ich in die Stadt."], "hint": "Time phrase first, then the verb, then the person.", "explain": "The answer is Am Samstag gehe ich in die Stadt. Am Samstag is idea one, so the verb gehe takes position two and ich follows in third place. In die Stadt means into town and goes at the end.", "topic": "word order: fronted time phrase"}, {"id": "de1-verb2:q9", "level": "stretch", "type": "text", "q": "Correct this sentence: Jeden Tag ich lese ein Buch.", "answer": "Jeden Tag lese ich ein Buch.", "accept": ["jeden tag lese ich ein buch.", "Jeden Tag lese ich ein Buch", "jeden tag lese ich ein buch", "Jeden Tag lese ich ein Buch."], "hint": "Only two words need to swap.", "explain": "The answer is Jeden Tag lese ich ein Buch. Jeden Tag means every day and is idea one, so the verb lese must come second and ich moves behind it. The verb form lese is correct for ich, so only the order needed fixing.", "topic": "word order: correcting verb third"}, {"id": "de1-verb2:q10", "level": "stretch", "type": "mc", "q": "Which sentence is correct German, with the verb as the second idea?", "options": ["Meine Schwester wohnen und ich in Manchester.", "Meine Schwester und wohnen ich in Manchester.", "Meine Schwester und ich wohnen in Manchester.", "Wohnen meine Schwester und ich in Manchester."], "answer": "Meine Schwester und ich wohnen in Manchester.", "hint": "The whole subject can be several words and still count as one idea.", "explain": "The answer is Meine Schwester und ich wohnen in Manchester. Meine Schwester und ich is a long subject but it is still one idea, so the verb wohnen is idea two even though it is the fourth word. That subject means we, so the verb takes the wir ending -en. The other options break the sentence apart or turn it into a question.", "topic": "word order: counting ideas not words"}]}, "de2-pronouns": {"id": "de2-pronouns", "day": "Tuesday", "subject": "German", "title": "Pronouns and where you live", "minutes": 20, "objective": "Use all the personal pronouns with the right verb ending, and say where you live and where you come from.", "extract": null, "teach": {"intro": ["The personal pronouns are ich for I, du for you, er for he, sie for she, es for it, wir for we, ihr for you when you mean more than one friend, and sie for they. Sie with a capital S is the polite word for you.", "Each pronoun takes its own verb ending. With wohnen, to live, you get ich wohne, du wohnst, er wohnt, sie wohnt, es wohnt, wir wohnen, ihr wohnt, sie wohnen and Sie wohnen.", "Use du for a friend, someone your own age or a family member. Use Sie for an adult you do not know, such as a shopkeeper or a stranger, and always write it with a capital S."], "example": {"problem": "Say He lives in Manchester in German.", "steps": ["He is er.", "The verb is wohnen. Take off the -en to get the stem wohn.", "er takes the ending -t, so wohn plus t gives wohnt.", "The place goes at the end, after in."], "answer": "Er wohnt in Manchester."}, "keyfact": "Endings: ich -e, du -st, er, sie and es -t, wir -en, ihr -t, sie and Sie -en."}, "questions": [{"id": "de2-pronouns:q1", "level": "easy", "type": "mc", "q": "What does wir mean?", "options": ["I", "we", "they", "he"], "answer": "we", "hint": "It is the pronoun you use when you are talking about yourself and other people.", "explain": "The answer is we. Wir means we and takes the verb ending -en, so wir wohnen means we live. I is ich, they is sie and he is er.", "topic": "pronouns: meaning"}, {"id": "de2-pronouns:q2", "level": "easy", "type": "text", "q": "Fill the gap with the right form of wohnen: Ich ___ in Birmingham.", "answer": "wohne", "accept": ["wohne", "wohne."], "hint": "With ich the ending is -e.", "explain": "The answer is wohne. The stem of wohnen is wohn and ich takes the ending -e, so it becomes wohne. The full sentence is Ich wohne in Birmingham, meaning I live in Birmingham.", "topic": "pronouns: ich form of a regular verb"}, {"id": "de2-pronouns:q3", "level": "easy", "type": "mc", "q": "You are talking to a friend your own age. Which word for you do you use?", "options": ["du", "Sie", "ihr", "er"], "answer": "du", "hint": "There is a friendly one and a polite one. This is the friendly situation.", "explain": "The answer is du. Du is the friendly word for you when you are speaking to one person you know well. Sie is the polite form for adults you do not know, and ihr is for more than one friend.", "topic": "pronouns: du versus Sie"}, {"id": "de2-pronouns:q4", "level": "easy", "type": "text", "q": "Fill the gap with the right form of wohnen: Er ___ in Leeds.", "answer": "wohnt", "accept": ["wohnt", "wohnt."], "hint": "With er, sie and es the ending is -t.", "explain": "The answer is wohnt. The stem is wohn and er takes the ending -t, giving wohnt. The same ending works for sie meaning she and for es meaning it.", "topic": "pronouns: er form of a regular verb"}, {"id": "de2-pronouns:q5", "level": "medium", "type": "text", "q": "How do you ask a friend where he lives? Write the full question in German.", "answer": "Wo wohnst du?", "accept": ["wo wohnst du?", "wo wohnst du", "Wo wohnst du", "Wo wohnst du?"], "hint": "Start with the question word wo, then the verb, then du.", "explain": "The answer is Wo wohnst du. Wo means where, and in a question the verb comes straight after the question word. With du the ending is -st, so wohnen becomes wohnst.", "topic": "pronouns: question with du"}, {"id": "de2-pronouns:q6", "level": "medium", "type": "text", "q": "Fill the gap with the right form of kommen: Wir ___ aus Deutschland.", "answer": "kommen", "accept": ["kommen", "kommen."], "hint": "With wir the ending is the same as the whole verb.", "explain": "The answer is kommen. With wir the ending is -en, which happens to look exactly like the plain verb. The sentence means we come from Germany. Aus means from when you are talking about a country or town.", "topic": "pronouns: wir form of a regular verb"}, {"id": "de2-pronouns:q7", "level": "medium", "type": "mc", "q": "You are speaking to your friend's mother for the first time. Which question is correct?", "options": ["Wo wohnst du?", "Wo wohnen Sie?", "Wo wohnt ihr?", "Wo wohne ich?"], "answer": "Wo wohnen Sie?", "hint": "You do not know this adult, so use the polite form.", "explain": "The answer is Wo wohnen Sie. Sie with a capital S is the polite you and takes the ending -en. Wo wohnst du would be too familiar for an adult you have just met. Wo wohnt ihr is for more than one friend.", "topic": "pronouns: polite Sie"}, {"id": "de2-pronouns:q8", "level": "medium", "type": "text", "q": "Fill the gap with the right form of wohnen: Ihr ___ in Koeln.", "answer": "wohnt", "accept": ["wohnt", "wohnt."], "hint": "The ihr ending is the same as the er ending.", "explain": "The answer is wohnt. Ihr means you when you are speaking to more than one friend, and it takes the ending -t. So the sentence Ihr wohnt in Koeln means you all live in Cologne.", "topic": "pronouns: ihr form"}, {"id": "de2-pronouns:q9", "level": "stretch", "type": "text", "q": "Write in German: They live in Hamburg.", "answer": "Sie wohnen in Hamburg.", "accept": ["sie wohnen in hamburg.", "Sie wohnen in Hamburg", "sie wohnen in hamburg", "Sie wohnen in Hamburg."], "hint": "They is sie, and it takes the same ending as wir.", "explain": "The answer is Sie wohnen in Hamburg. Sie meaning they takes the ending -en, so wohnen stays as wohnen. This looks the same as the polite Sie, and only the meaning of the sentence tells you which one it is.", "topic": "pronouns: sie meaning they"}, {"id": "de2-pronouns:q10", "level": "stretch", "type": "text", "q": "Write in German: I come from England and I live in London.", "answer": "Ich komme aus England und ich wohne in London.", "accept": ["ich komme aus england und ich wohne in london", "ich komme aus england und ich wohne in london.", "Ich komme aus England und ich wohne in London.", "Ich komme aus England und ich wohne in London", "ich komme aus england und wohne in london", "Ich komme aus England und wohne in London", "ich komme aus england und wohne in london.", "Ich komme aus England und wohne in London."], "hint": "Use aus for the country you come from and in for the town you live in.", "explain": "The answer is Ich komme aus England und ich wohne in London. Kommen with ich gives komme, and wohnen with ich gives wohne. Aus means from and in means in. You may also drop the second ich and write Ich komme aus England und wohne in London, which is also correct.", "topic": "pronouns: kommen aus and wohnen in together"}]}, "de3-irregular": {"id": "de3-irregular", "day": "Wednesday", "subject": "German", "title": "Verbs that change in the middle", "minutes": 20, "objective": "Use the du and er forms of fahren, essen, lesen, sehen and sprechen, where the vowel changes.", "extract": null, "teach": {"intro": ["Most German verbs keep the same stem and only change the ending. A small group of very common verbs also change the vowel in the middle, and this happens only in the du form and the er, sie, es form.", "Fahren means to travel or to go by vehicle. You say ich fahre, but du faehrst and er faehrt, because the a picks up two dots.", "The five to learn now are fahren, essen, lesen, sehen and sprechen. In ich, wir, ihr and sie the vowel stays normal, so only two forms are ever affected."], "example": {"problem": "Put lesen, to read, into the du form.", "steps": ["The stem of lesen is les.", "du and er change the vowel. In lesen the e becomes ie, so the stem becomes lies.", "The du ending is -st, but the stem already ends in s, so you do not add a second s.", "That leaves lies plus t, which gives liest."], "answer": "du liest"}, "keyfact": "Only du and er, sie, es change the vowel. fahren gives faehrst and faehrt. essen gives isst and isst. lesen gives liest and liest. sehen gives siehst and sieht. sprechen gives sprichst and spricht."}, "questions": [{"id": "de3-irregular:q1", "level": "easy", "type": "text", "q": "Fill the gap with the right form of fahren: Ich ___ nach Berlin.", "answer": "fahre", "accept": ["fahre", "fahre."], "hint": "The ich form never changes its vowel.", "explain": "The answer is fahre. With ich the vowel stays as a normal a and the ending is -e, so it is fahre. Only du and er change the vowel in this verb.", "topic": "irregular verbs: ich form stays regular"}, {"id": "de3-irregular:q2", "level": "easy", "type": "mc", "q": "Which forms of an irregular verb change their vowel?", "options": ["ich and wir", "du and er, sie, es", "wir and ihr", "all six forms"], "answer": "du and er, sie, es", "hint": "It is only two of the six forms.", "explain": "The answer is du and er, sie, es. Those two forms change the vowel in the middle of the stem. The ich, wir, ihr and sie forms keep the normal vowel and only take their usual endings.", "topic": "irregular verbs: which forms change"}, {"id": "de3-irregular:q3", "level": "easy", "type": "text", "q": "Fill the gap with the right form of fahren: Er ___ nach Hamburg.", "answer": "faehrt", "accept": ["fährt.", "faehrt.", "fährt", "faehrt"], "hint": "The a gains two dots and the ending is -t.", "explain": "The answer is faehrt, written properly as fährt. The vowel a changes to ä in the er form, and the ending is -t. So Er faehrt nach Hamburg means he travels to Hamburg.", "topic": "irregular verbs: fahren er form"}, {"id": "de3-irregular:q4", "level": "easy", "type": "text", "q": "Fill the gap with the right form of essen: Wir ___ Pizza.", "answer": "essen", "accept": ["essen", "essen."], "hint": "wir takes the same ending as the plain verb.", "explain": "The answer is essen. The wir form never changes its vowel, and the ending -en makes it look exactly like the plain verb. So Wir essen Pizza means we eat pizza.", "topic": "irregular verbs: wir form stays regular"}, {"id": "de3-irregular:q5", "level": "medium", "type": "text", "q": "Fill the gap with the right form of fahren: Du ___ zu schnell.", "answer": "faehrst", "accept": ["faehrst", "fährst", "fährst.", "faehrst."], "hint": "Change the vowel first, then add the du ending.", "explain": "The answer is faehrst, written properly as fährst. The a becomes ä and the du ending -st is added to the stem. The sentence means you are driving too fast.", "topic": "irregular verbs: fahren du form"}, {"id": "de3-irregular:q6", "level": "medium", "type": "text", "q": "Fill the gap with the right form of lesen, where sie m
