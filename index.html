<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Study OS">
<title>Study OS - Week 3</title>
<style>
:root{--bg:#0f1215;--panel:#171b20;--panel2:#1e242b;--line:#2a323b;--ink:#e8edf2;--dim:#93a1b0;--faint:#5e6b78;
--accent:#4a9eff;--good:#3ecf8e;--bad:#ff6b6b;--warn:#f0b429;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:17px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:780px;margin:0 auto;padding:16px 16px 90px}
h1,h2,h3{line-height:1.25;margin:0}h1{font-size:23px;font-weight:650;letter-spacing:-.2px}
h2{font-size:19px;font-weight:620}h3{font-size:16px;font-weight:600}
.muted{color:var(--dim)}.faint{color:var(--faint);font-size:14px}.small{font-size:14px}
header{position:sticky;top:0;z-index:20;background:rgba(15,18,21,.94);backdrop-filter:saturate(160%) blur(12px);
border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.hd{max-width:780px;margin:0 auto;display:flex;align-items:center;gap:12px}
.hd .t{flex:1;min-width:0}.hd .t div:first-child{font-weight:650;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:5px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-top:9px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .35s ease}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
.card.tight{padding:13px 15px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.btn{display:block;width:100%;min-height:52px;padding:14px 16px;background:var(--accent);color:#06121f;
border-radius:12px;font-weight:650;font-size:17px;text-align:center;margin-top:12px}
.btn:disabled{opacity:.35}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:550}
.btn.warn{background:var(--warn);color:#1a1200}
.daylist{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.day{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);
border-radius:var(--r);padding:15px 16px;width:100%;text-align:left}
.day .n{width:44px;height:44px;flex:0 0 44px;border-radius:11px;background:var(--panel2);display:flex;
align-items:center;justify-content:center;font-weight:650;font-size:15px;color:var(--dim)}
.day.done .n{background:rgba(62,207,142,.14);color:var(--good)}
.day .g{flex:1;min-width:0}.chev{color:var(--faint);font-size:20px}
.blk{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
.blk .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.pill{display:inline-block;padding:4px 10px;border-radius:99px;font-size:12.5px;font-weight:620;
background:var(--panel2);color:var(--dim);white-space:nowrap}
.pill.good{background:rgba(62,207,142,.14);color:var(--good)}
.pill.bad{background:rgba(255,107,107,.14);color:var(--bad)}
.pill.warn{background:rgba(240,180,41,.14);color:var(--warn)}
.pill.acc{background:rgba(74,158,255,.14);color:var(--accent)}
.extract{background:var(--panel2);border-left:3px solid var(--accent);border-radius:8px;padding:14px 15px;margin:14px 0;font-size:16px;line-height:1.6}
details.extract{white-space:normal}
details.extract>summary{list-style:none;cursor:pointer;font-size:13px;letter-spacing:.6px;text-transform:uppercase;
color:var(--dim);font-weight:650;min-height:26px;display:flex;align-items:center;flex-wrap:wrap;gap:2px}
details.extract>summary::-webkit-details-marker{display:none}
details.extract>summary::after{content:'  show';margin-left:auto;color:var(--accent);text-transform:none;letter-spacing:0;font-size:14px}
details.extract[open]>summary::after{content:'  hide'}
details.extract>div{white-space:pre-wrap;margin-top:10px}
.teach{background:linear-gradient(180deg,rgba(74,158,255,.07),transparent);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:12px 0}
.teach p{margin:0 0 10px}
.eg{background:var(--panel2);border-radius:10px;padding:14px;margin-top:12px}
.eg .lb{font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--dim);font-weight:650;margin-bottom:8px}
.eg ol{margin:8px 0 0;padding-left:20px}.eg li{margin:5px 0}
.kf{border-left:3px solid var(--warn);background:rgba(240,180,41,.07);border-radius:8px;padding:12px 14px;margin-top:14px;font-size:15.5px}
.q{font-size:18.5px;line-height:1.5;margin:14px 0 4px;white-space:pre-wrap}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;min-height:52px;padding:13px 15px;
background:var(--panel2);border:1.5px solid transparent;border-radius:12px;line-height:1.45}
.opt .k{width:26px;height:26px;flex:0 0 26px;border-radius:7px;background:rgba(255,255,255,.06);display:flex;
align-items:center;justify-content:center;font-size:13px;font-weight:650;color:var(--dim);margin-top:1px}
.opt.sel{border-color:var(--accent);background:rgba(74,158,255,.1)}
.opt.sel .k{background:var(--accent);color:#06121f}
.opt.ok{border-color:var(--good);background:rgba(62,207,142,.12)}
.opt.ok .k{background:var(--good);color:#06121f}
.opt.no{border-color:var(--bad);background:rgba(255,107,107,.1)}
.opt.no .k{background:var(--bad);color:#1a0505}
.opt[disabled]{opacity:.85}
input[type=text]{width:100%;min-height:54px;padding:14px 15px;font-size:17px;background:var(--panel2);
border:1.5px solid var(--line);border-radius:12px;color:var(--ink);margin-top:14px;-webkit-appearance:none}
input[type=text]:focus{outline:0;border-color:var(--accent)}
input.ok{border-color:var(--good)}input.no{border-color:var(--bad)}
textarea{width:100%;min-height:200px;padding:14px 15px;font-size:17px;line-height:1.6;background:var(--panel2);
border:1.5px solid var(--line);border-radius:12px;color:var(--ink);margin-top:12px;resize:vertical;-webkit-appearance:none;font-family:inherit}
textarea:focus{outline:0;border-color:var(--accent)}
select{width:100%;min-height:50px;padding:12px 14px;font-size:16px;background:var(--panel2);border:1.5px solid var(--line);
border-radius:12px;color:var(--ink);margin-top:10px;-webkit-appearance:none}
.qmeta{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13.5px;color:var(--faint)}
.fb{border-radius:11px;padding:14px 15px;margin-top:14px;font-size:15.5px;line-height:1.55;white-space:pre-wrap}
.fb.ok{background:rgba(62,207,142,.1);border:1px solid rgba(62,207,142,.3)}
.fb.no{background:rgba(255,107,107,.09);border:1px solid rgba(255,107,107,.3)}
.fb b{display:block;margin-bottom:6px;font-size:15px}
.hint{background:rgba(240,180,41,.08);border:1px solid rgba(240,180,41,.28);border-radius:11px;padding:13px 15px;margin-top:12px;font-size:15.5px;line-height:1.5}
.band{text-align:center;padding:26px 18px}
.band .big{font-size:46px;font-weight:700;letter-spacing:-1.5px;line-height:1}
.band .lbl{color:var(--dim);margin-top:8px;font-size:15px}
.rev{border-top:1px solid var(--line);padding:15px 0}.rev:first-of-type{border-top:0}
.rev .qt{font-size:16px;margin-bottom:9px;white-space:pre-wrap}
.rev .ans{font-size:15px;margin:5px 0}.ok{color:var(--good)}.no{color:var(--bad)}
.exp{background:var(--panel2);border-radius:9px;padding:12px 13px;margin-top:9px;font-size:15px;line-height:1.55;color:var(--dim);white-space:pre-wrap}
.topics{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.tp{padding:5px 11px;border-radius:99px;font-size:13px;background:var(--panel2);color:var(--dim)}
.tp.ok{background:rgba(62,207,142,.12);color:var(--good)}
.tp.no{background:rgba(255,107,107,.12);color:var(--bad)}
pre.sum{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px;
font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;max-height:320px;overflow:auto;color:var(--dim);margin-top:12px}
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:15px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}
th{color:var(--dim);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.5px}
ul,ol{padding-left:20px;margin:10px 0}li{margin:6px 0}
.hr{height:1px;background:var(--line);margin:18px 0;border:0}
.nb{background:rgba(240,180,41,.08);border:1px solid rgba(240,180,41,.25);border-radius:11px;padding:13px 15px;margin:12px 0;font-size:15px;line-height:1.55}
.nb b{color:var(--warn)}
.shots{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.shots img{width:76px;height:76px;object-fit:cover;border-radius:9px;border:1px solid var(--line)}
.syncdot{width:9px;height:9px;border-radius:99px;background:var(--faint);flex:0 0 9px}
.syncdot.on{background:var(--good)}.syncdot.err{background:var(--bad)}.syncdot.busy{background:var(--warn)}
label.file{display:block;width:100%;min-height:52px;padding:14px 16px;background:transparent;border:1px dashed var(--line);
border-radius:12px;font-weight:550;text-align:center;margin-top:12px;color:var(--dim)}
input[type=file]{display:none}
</style></head>

  <button id="back" class="pill" style="display:none">Back</button>

<script>
let P = {"sessions": {"m7-frac-rebuild": {"id": "m7-frac-rebuild", "day": "Day 1", "subject": "Maths", "title": "What multiplying a fraction actually does", "minutes": 30, "objective": "Understand that multiplying by a fraction means taking a part of something, so it makes the amount smaller.", "extract": null, "teach": {"intro": ["In maths, the word \"of\" means multiply. Half of 8 is 4, and that is written 1/2 x 8 = 4. So when you see 1/2 x 8, read it out loud as \"half of 8\".", "That one idea changes everything. Multiplying by a fraction below 1 means taking a part of something, so the answer gets SMALLER. 1/2 x 8 = 4, and 4 is smaller than 8. Multiplying by 1/5 makes something five times smaller, not five times bigger.", "This is why 2/3 x 1/5 can never be 13/15. You are taking a part of 1/5, so the answer must be smaller than 1/5. 13/15 is bigger than both numbers you started with, so it cannot be right. 13/15 is what you get if you ADD them, and adding is a different job."], "example": {"problem": "Work out 1/2 x 8 using a chocolate bar with 8 squares.", "steps": ["Read it as \"half of 8\". The bar has 8 squares.", "Half means split into 2 equal groups. 8 squares split into 2 groups gives 4 squares in each group.", "You want 1 of those groups, so you take 4 squares.", "Check the size. 4 is smaller than 8, which is what should happen when you take half of something."], "answer": "4"}, "example2": {"problem": "Work out 2/3 x 1/5, and compare it with 2/3 + 1/5.", "steps": ["Picture a rope 1 metre long. Cut it into 5 equal pieces. One piece is 1/5 of a metre.", "Now 2/3 x 1/5 means \"two thirds OF that one piece\". You are cutting a piece that is already small.", "Cut that 1/5 piece into 3 equal bits and keep 2 of them. The whole metre is now in 15 bits, and you are holding 2 of them. That is 2/15.", "Now the adding version. 2/3 + 1/5 means \"lay a 2/3 length of rope next to a 1/5 length and measure the total\". That gives 10/15 + 3/15 = 13/15, which is nearly a whole metre.", "Same two numbers, two completely different jobs. Multiplying cuts a piece down to 2/15. Adding builds a longer rope, 13/15.", "The rule for multiplying is top times top, bottom times bottom. 2 x 1 = 2 on the top. 3 x 5 = 15 on the bottom. That gives 2/15, which matches the rope."], "answer": "2/15"}, "keyfact": "\"Of\" means multiply. Multiplying by a fraction below 1 always makes the answer smaller. Top times top, bottom times bottom."}, "questions": [{"id": "m7-frac-rebuild:q1", "level": "easy", "type": "mc", "q": "In maths, what does the word \"of\" tell you to do, as in \"a third of 12\"?", "options": ["Multiply", "Add", "Subtract", "Nothing, it is just a word"], "answer": "Multiply", "hint": "A third of 12 is 4. Which operation on 1/3 and 12 gives 4?", "explain": "The answer is multiply. \"A third of 12\" is written 1/3 x 12, and it equals 4. Every time you see \"of\" between a fraction and an amount, swap it for a multiply sign and the maths works.", "topic": "fractions: of means multiply"}, {"id": "m7-frac-rebuild:q2", "level": "easy", "type": "mc", "q": "1/2 x 10 means the same as which of these?", "options": ["Half of 10", "10 add a half", "10 take away 2", "Double 10"], "answer": "Half of 10", "hint": "Read the multiply sign as the word \"of\".", "explain": "The answer is \"half of 10\". The multiply sign is read as \"of\", so 1/2 x 10 is half of 10, which is 5. It is not adding a half, and it is not doubling. Doubling would make it bigger, and multiplying by 1/2 makes it smaller.", "topic": "fractions: of means multiply"}, {"id": "m7-frac-rebuild:q3", "level": "easy", "type": "text", "q": "Work out 1/2 x 6", "answer": "3", "accept": ["3", "3.0", "6/2", "3/1"], "hint": "Read it as half of 6. Split 6 into 2 equal groups.", "explain": "The answer is 3. Half of 6 means split 6 into 2 equal groups. Each group holds 3. You take 1 group, so the answer is 3. Notice 3 is smaller than 6, which is exactly what taking half should do.", "topic": "fractions: unit fraction of a whole number"}, {"id": "m7-frac-rebuild:q4", "level": "easy", "type": "text", "q": "Work out 1/3 x 9", "answer": "3", "accept": ["3", "3.0", "9/3", "3/1"], "hint": "Read it as a third of 9. Split 9 into 3 equal groups.", "explain": "The answer is 3. A third of 9 means split 9 into 3 equal groups. 9 divided by 3 is 3, so each group holds 3. You take 1 group, so the answer is 3.", "topic": "fractions: unit fraction of a whole number"}, {"id": "m7-frac-rebuild:q5", "level": "easy", "type": "mc", "q": "You multiply 20 by 1/4. Will the answer be bigger than 20, smaller than 20, or the same?", "options": ["Smaller than 20", "Bigger than 20", "Exactly 20", "You cannot tell"], "answer": "Smaller than 20", "hint": "1/4 x 20 means a quarter of 20. Is a quarter of something more or less than all of it?", "explain": "The answer is smaller than 20. 1/4 x 20 means a quarter of 20, which is 5. A quarter of something is only part of it, so it must be less. Any time you multiply by a fraction below 1 the answer shrinks.", "topic": "fractions: multiplying by less than 1 makes it smaller"}, {"id": "m7-frac-rebuild:q6", "level": "easy", "type": "mc", "q": "Here is someone's work. 2/3 x 1/5 = 13/15. The answer is wrong. What did they do?", "options": ["They added the two fractions instead of multiplying them", "They multiplied only the top numbers", "They flipped the second fraction over", "They forgot to write the answer in its simplest form"], "answer": "They added the two fractions instead of multiplying them", "hint": "Work out 2/3 + 1/5 and see what you get.", "explain": "The answer is that they added instead of multiplying. 2/3 + 1/5 = 10/15 + 3/15 = 13/15, which is exactly what they wrote. The correct multiply is top times top and bottom times bottom, so 2 x 1 = 2 and 3 x 5 = 15, giving 2/15. There is also a quick check. Multiplying by 1/5 must make the answer smaller than 2/3, and 13/15 is bigger than 2/3, so it was never going to be right.", "topic": "fractions: spotting adding instead of multiplying"}, {"id": "m7-frac-rebuild:q7", "level": "medium", "type": "text", "q": "Work out 2/3 x 1/5. Give your answer in its simplest form.", "answer": "2/15", "accept": ["2/15"], "hint": "Top times top on the top. Bottom times bottom on the bottom.", "explain": "The answer is 2/15. Multiply the tops: 2 x 1 = 2. Multiply the bottoms: 3 x 5 = 15. That gives 2/15. 2 and 15 share no factor other than 1, so it is already in its simplest form. Sense check: 2/15 is smaller than 1/5 and smaller than 2/3, which is right, because you took a part of a part.", "topic": "fractions: multiplying two fractions"}, {"id": "m7-frac-rebuild:q8", "level": "medium", "type": "text", "q": "Work out 3/4 x 2/5", "answer": "3/10", "accept": ["3/10", "6/20", "0.3", ".3", "0.30"], "hint": "Multiply the tops together, then the bottoms together.", "explain": "The answer is 3/10. Tops: 3 x 2 = 6. Bottoms: 4 x 5 = 20. That gives 6/20. Both 6 and 20 divide by 2, so 6/20 becomes 3/10. As a decimal that is 0.3. Both 6/20 and 3/10 are correct here, but 3/10 is the tidier way to write it.", "topic": "fractions: multiplying two fractions"}, {"id": "m7-frac-rebuild:q9", "level": "medium", "type": "mc", "q": "Without working any of them out, which one of these must give an answer SMALLER than 4/5?", "options": ["4/5 x 1/2", "4/5 + 1/2", "4/5 x 3", "4/5 x 2"], "answer": "4/5 x 1/2", "hint": "Which one is taking only a part of 4/5?", "explain": "The answer is 4/5 x 1/2. That means half of 4/5, and half of something is less than all of it. Multiplying by 3 or by 2 makes it bigger, because you are taking 3 lots or 2 lots. Adding 1/2 also makes it bigger. Only multiplying by a number below 1 shrinks it.", "topic": "fractions: multiplying by less than 1 makes it smaller"}, {"id": "m7-frac-rebuild:q10", "level": "medium", "type": "mc", "q": "Here is someone's work. 2/3 x 9 = 6/9. The 6 on the top is correct, but the answer is still wrong. What is the correct answer?", "options": ["6", "6/9", "2/9", "27"], "answer": "6", "hint": "The 9 on the bottom has already been used to get the 6. It should not appear again.", "explain": "The answer is 6. Two thirds of 9 means split 9 into 3 groups of 3, then take 2 groups, which is 6 whole units. Once you have divided the 9 into thirds, the 9 has done its job. Keeping it on the bottom as 6/9 changes the answer completely, because 6/9 is less than 1 and the real answer is 6.", "topic": "fractions: spotting a leftover denominator"}, {"id": "m7-frac-rebuild:q11", "level": "medium", "type": "text", "q": "Work out 3/5 x 2/7", "answer": "6/35", "accept": ["6/35", "0.171", "0.1714", "0.17"], "hint": "3 x 2 on the top, 5 x 7 on the bottom.", "explain": "The answer is 6/35. Tops: 3 x 2 = 6. Bottoms: 5 x 7 = 35. That gives 6/35. Nothing divides into both 6 and 35 except 1, so it stays as it is. Sense check: 6/35 is smaller than 3/5, which is correct because you took only 2/7 of it.", "topic": "fractions: multiplying two fractions"}, {"id": "m7-frac-rebuild:q12", "level": "medium", "type": "text", "q": "A climbing rope is 12 m long. You cut off 2/3 of it. How long is the piece you cut off, in metres?", "answer": "8", "accept": ["8", "8m", "8 m", "8 metres", "8.0", "24/3"], "hint": "2/3 of 12 means 2/3 x 12. Split 12 into 3 equal parts first.", "explain": "The answer is 8 m. \"2/3 of 12\" is 2/3 x 12. Split 12 into 3 equal parts: 12 divided by 3 is 4. That is one third. You want two of those parts, so 2 x 4 = 8. The cut piece is 8 m and the bit left is 4 m, and 8 + 4 = 12, which checks out.", "topic": "fractions: fraction of an amount in context"}, {"id": "m7-frac-rebuild:q13", "level": "stretch", "type": "text", "q": "A water tank holds 60 litres when completely full. It is 3/4 full. A hiker then uses 1/3 of the water that is in the tank. How many litres are left in the tank?", "answer": "30", "accept": ["30", "30 litres", "30l", "30 l", "30.0"], "hint": "Find how much water is in the tank first. Then work out a third of that amount, not a third of 60.", "explain": "The answer is 30 litres. Step 1: the water in the tank is 3/4 x 60. A quarter of 60 is 15, so three quarters is 45 litres. Step 2: he uses 1/3 of the water that is there, so 1/3 x 45 = 15 litres used. Step 3: 45 - 15 = 30 litres left. The trap is taking 1/3 of 60 instead of 1/3 of 45. The question says a third of the water in the tank, and there are only 45 litres in it.", "topic": "fractions: two-step fraction of an amount"}, {"id": "m7-frac-rebuild:q14", "level": "stretch", "type": "text", "q": "A soldier has a ration bag. On day 1 he eats 1/4 of the food. On day 2 he eats 1/3 of what is LEFT. What fraction of the whole bag has he eaten in total? Give your answer in its simplest form.", "answer": "1/2", "accept": ["1/2"], "hint": "After day 1, what fraction of the bag is still there? Take a third of that.", "explain": "The answer is 1/2. Day 1 he eats 1/4, so 3/4 of the bag is left. Day 2 he eats 1/3 of that 3/4, so that is 1/3 x 3/4 = 3/12 = 1/4 of the whole bag. Total eaten is 1/4 + 1/4 = 2/4 = 1/2. Note the two jobs in one question. Working out a third of what is left is multiplying. Putting the two days together is adding.", "topic": "fractions: fraction of a remainder"}, {"id": "m7-frac-rebuild:q15", "level": "stretch", "type": "mc", "q": "Sam says \"multiplying always makes a number bigger\". Which single example proves he is wrong?", "options": ["1/2 x 8 = 4", "2 x 8 = 16", "8 + 1/2 = 8.5", "8 - 1/2 = 7.5"], "answer": "1/2 x 8 = 4", "hint": "You need an example that is a multiplication AND ends up smaller than it started.", "explain": "The answer is 1/2 x 8 = 4. To prove Sam wrong you need a multiplication where the answer is smaller than the number you started with. Here you start with 8 and end with 4. The other options do not work: 2 x 8 = 16 actually agrees with Sam, and the last two are adding and subtracting, not multiplying, so they say nothing about his claim.", "topic": "fractions: reasoning about size of answer"}, {"id": "m7-frac-rebuild:q16", "level": "stretch", "type": "text", "q": "Someone says \"1/2 x 1/2 = 1, because half and half make one whole\". What is the correct answer to 1/2 x 1/2? Give your answer in its simplest form.", "answer": "1/4", "accept": ["1/4"], "hint": "Read it as half OF a half. Cut half a pizza in half again and see how much of the whole pizza you are holding.", "explain": "The answer is 1/4. 1/2 x 1/2 means half of a half. Take half a pizza and cut that in half again. You now hold a quarter of the whole pizza. The person was thinking about ADDING, because 1/2 + 1/2 = 1. Multiplying does the opposite job here: it cuts a piece down, so the answer must be smaller than 1/2, not bigger. By the rule, tops give 1 x 1 = 1 and bottoms give 2 x 2 = 4, so 1/4.", "topic": "fractions: spotting adding instead of multiplying"}]}, "m8-frac-whole": {"id": "m8-frac-whole", "day": "Day 2", "subject": "Maths", "title": "Fractions times whole numbers", "minutes": 25, "objective": "Multiply a fraction by a whole number by dividing by the bottom number and multiplying by the top number.", "extract": null, "teach": {"intro": ["Every whole number is secretly a fraction. 12 means 12 wholes, so 12 = 12/1. 7 = 7/1. Anything over 1 is just that number.", "That makes 1/4 x 12 easy. Write it as 1/4 x 12/1. Tops: 1 x 12 = 12. Bottoms: 4 x 1 = 4. So the answer is 12/4, which is 3. It is also \"a quarter of 12\", which is 3. Two routes, same answer.", "Watch the trap. The bottom number tells you how many parts to SPLIT into. It is not something you multiply by. 1/4 x 12 is not 4 x 12, it is 12 divided by 4."], "example": {"problem": "Work out 1/4 x 12 in two different ways.", "steps": ["Way 1, in words. Read it as \"a quarter of 12\". Split 12 into 4 equal groups. 12 divided by 4 is 3, so each group holds 3. You take 1 group, so the answer is 3.", "Way 2, with the rule. 12 = 12/1, so the calculation is 1/4 x 12/1.", "Tops: 1 x 12 = 12. Bottoms: 4 x 1 = 4. That gives 12/4.", "12/4 means 12 divided by 4, which is 3.", "Both ways give 3. Sense check: a quarter of 12 must be a lot less than 12, and 3 is."], "answer": "3"}, "example2": {"problem": "Work out 2/3 x 9", "steps": ["Read it as \"two thirds of 9\".", "First find one third. Divide by the bottom number: 9 divided by 3 = 3.", "Now take two of those. Multiply by the top number: 2 x 3 = 6.", "The answer is 6. It is a whole number, not a fraction.", "Do not write 6/9. The 9 has already been used when you divided by 3. Writing 6/9 would mean an answer less than 1, and two thirds of 9 is clearly more than 1."], "answer": "6"}, "keyfact": "Divide by the bottom number, then multiply by the top number. A whole number is that number over 1."}, "questions": [{"id": "m8-frac-whole:q1", "level": "easy", "type": "mc", "q": "Which of these is another way of writing the whole number 7?", "options": ["7/1", "1/7", "7/7", "0.7"], "answer": "7/1", "hint": "How many wholes is 7? Put that over 1.", "explain": "The answer is 7/1. A fraction means top divided by bottom, and 7 divided by 1 is 7. Check the others: 1/7 is a tiny bit less than a seventh of a whole, 7/7 equals 1, and 0.7 is less than one whole.", "topic": "fractions: whole numbers as fractions"}, {"id": "m8-frac-whole:q2", "level": "easy", "type": "mc", "q": "1/4 x 12 means which of these?", "options": ["12 split into 4 equal parts, then take 1 part", "12 lots of 4", "4 lots of 12", "12 split into 12 equal parts"], "answer": "12 split into 4 equal parts, then take 1 part", "hint": "The bottom number tells you how many parts to split into.", "explain": "The answer is 12 split into 4 equal parts, then take 1 part. The bottom number, 4, says how many equal parts to make. The top number, 1, says how many of those parts to take. 12 divided by 4 is 3, so the answer is 3. \"4 lots of 12\" would be 48, which is far bigger than 12, and a quarter of something can never be bigger than the thing itself.", "topic": "fractions: meaning of the denominator"}, {"id": "m8-frac-whole:q3", "level": "easy", "type": "text", "q": "Work out 1/4 x 12", "answer": "3", "accept": ["3", "3.0", "12/4", "3/1"], "hint": "A quarter of 12. Divide 12 by 4.", "explain": "The answer is 3. Divide by the bottom number: 12 divided by 4 = 3. Multiply by the top number: 1 x 3 = 3. You can also write it as 12/4, which is the same as 3.", "topic": "fractions: unit fraction times whole number"}, {"id": "m8-frac-whole:q4", "level": "easy", "type": "text", "q": "Work out 1/5 x 20", "answer": "4", "accept": ["4", "4.0", "20/5", "4/1"], "hint": "A fifth of 20. Divide 20 by 5.", "explain": "The answer is 4. Divide by the bottom number: 20 divided by 5 = 4. Then multiply by the top number: 1 x 4 = 4. Sense check: a fifth of 20 should be much smaller than 20, and 4 is.", "topic": "fractions: unit fraction times whole number"}, {"id": "m8-frac-whole:q5", "level": "easy", "type": "text", "q": "Work out 1/3 x 21", "answer": "7", "accept": ["7", "7.0", "21/3", "7/1"], "hint": "A third of 21. Divide 21 by 3.", "explain": "The answer is 7. Divide by the bottom number: 21 divided by 3 = 7. Multiply by the top number: 1 x 7 = 7. Check it backwards: 3 lots of 7 make 21, so 7 really is a third of 21.", "topic": "fractions: unit fraction times whole number"}, {"id": "m8-frac-whole:q6", "level": "easy", "type": "mc", "q": "Here is someone's work. 1/4 x 12 = 48. What have they done?", "options": ["They multiplied 4 x 12 instead of dividing 12 by 4", "They added 4 and 12 together", "They divided 12 by 12", "They wrote 12 upside down"], "answer": "They multiplied 4 x 12 instead of dividing 12 by 4", "hint": "What is 4 x 12? Compare it with the answer they wrote.", "explain": "The answer is that they multiplied 4 x 12, which is 48. The bottom number of a fraction is not a multiplier. It tells you how many parts to split into, so you divide by it. 12 divided by 4 is 3. There is also a quick check that kills 48 straight away: a quarter of 12 has to be smaller than 12, and 48 is four times bigger.", "topic": "fractions: spotting denominator used as multiplier"}, {"id": "m8-frac-whole:q7", "level": "medium", "type": "text", "q": "Work out 2/3 x 9", "answer": "6", "accept": ["6", "6.0", "18/3", "6/1"], "hint": "Divide 9 by 3 first, then multiply that by 2.", "explain": "The answer is 6. Divide by the bottom: 9 divided by 3 = 3. Multiply by the top: 2 x 3 = 6. The answer is a whole number. Writing 6/9 would be wrong, because the 9 was already used in the dividing step.", "topic": "fractions: fraction times whole number"}, {"id": "m8-frac-whole:q8", "level": "medium", "type": "text", "q": "Work out 3/4 x 20", "answer": "15", "accept": ["15", "15.0", "60/4", "15/1"], "hint": "Find a quarter of 20 first, then take three of them.", "explain": "The answer is 15. Divide by the bottom: 20 divided by 4 = 5. Multiply by the top: 3 x 5 = 15. Sense check: three quarters is most of the amount but not all of it, and 15 is close to 20 without reaching it.", "topic": "fractions: fraction times whole number"}, {"id": "m8-frac-whole:q9", "level": "medium", "type": "text", "q": "Work out 2/5 x 35", "answer": "14", "accept": ["14", "14.0", "70/5", "14/1"], "hint": "35 divided by 5 gives you one fifth. You want two of them.", "explain": "The answer is 14. Divide by the bottom: 35 divided by 5 = 7. Multiply by the top: 2 x 7 = 14. Check it: 5 lots of 7 make 35, so each fifth is 7, and two fifths is 14.", "topic": "fractions: fraction times whole number"}, {"id": "m8-frac-whole:q10", "level": "medium", "type": "mc", "q": "Here is someone's work. 2/3 x 9 = 6/9. The 6 came from correct working. What should the final answer be?", "options": ["6, because the 9 was already used when dividing by 3", "27, because you multiply 3 x 9", "2/9, because you keep the 2 and the 9", "6/9 is correct as it stands"], "answer": "6, because the 9 was already used when dividing by 3", "hint": "Once you have divided 9 into thirds, that 9 has done its job. Should it still be on the bottom?", "explain": "The answer is 6. The working is: 9 divided by 3 = 3, then 2 x 3 = 6. At that point the 9 has been fully used up. Leaving it on the bottom gives 6/9, which is less than one whole, and two thirds of 9 is clearly a lot more than one. Two thirds of 9 is 6.", "topic": "fractions: spotting a leftover denominator"}, {"id": "m8-frac-whole:q11", "level": "medium", "type": "text", "q": "Work out 3/8 x 24", "answer": "9", "accept": ["9", "9.0", "72/8", "9/1"], "hint": "24 divided by 8 gives one eighth. Then take three of them.", "explain": "The answer is 9. Divide by the bottom: 24 divided by 8 = 3. Multiply by the top: 3 x 3 = 9. Sense check: 3/8 is a bit less than half, and 9 is a bit less than half of 24.", "topic": "fractions: fraction times whole number"}, {"id": "m8-frac-whole:q12", "level": "medium", "type": "text", "q": "A box holds 45 nails. A builder uses 2/5 of them. How many nails does he use?", "answer": "18", "accept": ["18", "18.0", "18 nails", "90/5"], "hint": "Find one fifth of 45 first.", "explain": "The answer is 18 nails. Divide by the bottom: 45 divided by 5 = 9, so one fifth is 9 nails. Multiply by the top: 2 x 9 = 18. Check: he has 27 left, and 18 + 27 = 45.", "topic": "fractions: fraction of an amount in context"}, {"id": "m8-frac-whole:q13", "level": "stretch", "type": "text", "q": "A relay race is 36 km in total. Runner A runs 1/4 of the race. Runner B then runs 2/3 of the distance that is left. How many km does runner B run?", "answer": "18", "accept": ["18", "18km", "18 km", "18.0"], "hint": "Work out how far is left after runner A. Runner B's fraction is taken from that, not from 36.", "explain": "The answer is 18 km. Runner A: 1/4 x 36 = 9 km. Distance left: 36 - 9 = 27 km. Runner B: 2/3 x 27. Divide by 3 to get 9, multiply by 2 to get 18 km. The trap is doing 2/3 of 36, which gives 24 and is wrong, because the question says two thirds of what is LEFT.", "topic": "fractions: fraction of a remainder in context"}, {"id": "m8-frac-whole:q14", "level": "stretch", "type": "text", "q": "A shop has 60 bikes. 3/5 of them are mountain bikes. Of those mountain bikes, 1/4 are red. How many red mountain bikes are there?", "answer": "9", "accept": ["9", "9.0", "9 bikes"], "hint": "Two steps. Find the mountain bikes first, then take a quarter of just that group.", "explain": "The answer is 9. Step 1: mountain bikes are 3/5 x 60. 60 divided by 5 = 12, and 3 x 12 = 36 mountain bikes. Step 2: red ones are 1/4 x 36 = 9. The second fraction only applies to the 36 mountain bikes, not to all 60 bikes.", "topic": "fractions: two-step fraction of an amount"}, {"id": "m8-frac-whole:q15", "level": "stretch", "type": "mc", "q": "Which one of these gives the biggest answer?", "options": ["5/6 x 24", "3/4 x 24", "2/3 x 24", "1/2 x 24"], "answer": "5/6 x 24", "hint": "They all start from 24, so the biggest fraction wins. Which fraction is closest to a whole?", "explain": "The answer is 5/6 x 24. All four take a fraction of the same number, so the largest fraction gives the largest answer, and 5/6 is closest to 1. Working them out: 5/6 x 24 = 20, 3/4 x 24 = 18, 2/3 x 24 = 16, 1/2 x 24 = 12.", "topic": "fractions: comparing fractions of the same amount"}, {"id": "m8-frac-whole:q16", "level": "stretch", "type": "text", "q": "A tank holds 84 litres. On day 1, 5/7 of the water is used. On day 2, half of the water that remains is used. How many litres are left after day 2?", "answer": "12", "accept": ["12", "12 litres", "12l", "12 l", "12.0"], "hint": "Find how much is used on day 1, take it away, then halve what is left.", "explain": "The answer is 12 litres. Day 1: 84 divided by 7 = 12, and 5 x 12 = 60 litres used. Left: 84 - 60 = 24 litres. Day 2: half of 24 is 12 used, so 24 - 12 = 12 litres remain.", "topic": "fractions: multi-step fraction of an amount"}]}, "m9-frac-divide": {"id": "m9-frac-divide", "day": "Day 3", "subject": "Maths", "title": "Dividing by a fraction", "minutes": 25, "objective": "Divide by a fraction by asking how many of it fit in, then by flipping the second fraction and multiplying.", "extract": null, "teach": {"intro": ["Dividing asks a simple question: how many of THIS fit into THAT. 6 divided by 2 asks how many 2s fit into 6, and the answer is 3.", "Fractions work the same way. 3 divided by 1/2 asks how many halves fit into 3 whole pizzas. Each pizza gives 2 halves, so 3 pizzas give 6 halves. The answer is 6, and 6 is bigger than 3. That is normal. Small pieces fit in lots of times, so dividing by a number below 1 makes the answer BIGGER.", "Once that makes sense, here is the shortcut. To divide by a fraction, flip the second fraction upside down and multiply. Flipping 1/2 gives 2/1, and 3 x 2 = 6, which matches the pizzas."], "example": {"problem": "Work out 3 divided by 1/2", "steps": ["Read it as: how many halves fit into 3?", "Picture 3 pizzas. Cut each one in half. Each pizza gives 2 halves.", "3 pizzas x 2 halves each = 6 halves.", "Now the shortcut. Flip the second fraction: 1/2 becomes 2/1. Change the divide to a multiply. 3 x 2/1 = 6.", "Both routes give 6. The answer is bigger than 3 because halves are small, so many of them fit in."], "answer": "6"}, "example2": {"problem": "Work out 3/5 divided by 2/3", "steps": ["Keep the first fraction as it is: 3/5.", "Flip the second fraction: 2/3 becomes 3/2.", "Change the divide sign to a multiply sign: 3/5 x 3/2.", "Tops: 3 x 3 = 9. Bottoms: 5 x 2 = 10. The answer is 9/10.", "Sense check before you accept it. 3/5 is a bit more than a half, and 2/3 is a bit less than 1. Dividing by something just under 1 gives an answer just a bit bigger than what you started with. 9/10 fits that. An answer like 19 is nowhere near, so it would have to be wrong."], "answer": "9/10"}, "keyfact": "To divide by a fraction, flip the second fraction and multiply. Dividing by a number below 1 makes the answer bigger."}, "questions": [{"id": "m9-frac-divide:q1", "level": "easy", "type": "mc", "q": "How many halves fit into 3 whole pizzas?", "options": ["6", "3", "2", "1.5"], "answer": "6", "hint": "Cut each pizza in half. How many pieces do you have altogether?", "explain": "The answer is 6. Each pizza cut in half gives 2 pieces, and 3 pizzas give 3 x 2 = 6 pieces. In maths that is 3 divided by 1/2 = 6.", "topic": "division by fractions: how many fit in"}, {"id": "m9-frac-divide:q2", "level": "easy", "type": "text", "q": "Work out 4 divided by 1/2", "answer": "8", "accept": ["8", "8.0", "8/1"], "hint": "How many halves fit into 4 wholes?", "explain": "The answer is 8. Each whole contains 2 halves, so 4 wholes contain 4 x 2 = 8 halves. Using the shortcut: flip 1/2 to get 2/1, then 4 x 2 = 8.", "topic": "division by fractions: whole divided by unit fraction"}, {"id": "m9-frac-divide:q3", "level": "easy", "type": "text", "q": "Work out 5 divided by 1/3", "answer": "15", "accept": ["15", "15.0", "15/1"], "hint": "How many thirds are there in one whole? Now do that 5 times.", "explain": "The answer is 15. One whole holds 3 thirds, so 5 wholes hold 5 x 3 = 15 thirds. Using the shortcut: flip 1/3 to get 3/1, then 5 x 3 = 15.", "topic": "division by fractions: whole divided by unit fraction"}, {"id": "m9-frac-divide:q4", "level": "easy", "type": "mc", "q": "You divide 6 by 1/4. Is the answer bigger than 6 or smaller than 6?", "options": ["Bigger than 6", "Smaller than 6", "Exactly 6", "You cannot divide by a fraction"], "answer": "Bigger than 6", "hint": "Quarters are small pieces. Do lots of small pieces fit into 6, or only a few?", "explain": "The answer is bigger than 6. You are asking how many quarters fit into 6. Each whole holds 4 quarters, so 6 wholes hold 24. Dividing by a number below 1 always makes the answer bigger, because you are counting small pieces and small pieces fit in many times.", "topic": "division by fractions: dividing by less than 1 makes it bigger"}, {"id": "m9-frac-divide:q5", "level": "easy", "type": "mc", "q": "What do you get when you flip the fraction 2/3 upside down?", "options": ["3/2", "2/3", "1/6", "-2/3"], "answer": "3/2", "hint": "Swap the top number and the bottom number.", "explain": "The answer is 3/2. Flipping a fraction means swapping the top and the bottom, so 2/3 becomes 3/2. This flipped version is called the reciprocal, and it is what you multiply by when you divide by a fraction.", "topic": "division by fractions: reciprocal"}, {"id": "m9-frac-divide:q6", "level": "easy", "type": "text", "q": "Work out 1/2 divided by 1/4", "answer": "2", "accept": ["2", "2.0", "4/2", "2/1"], "hint": "How many quarters fit into a half?", "explain": "The answer is 2. Half a pizza can be cut into 2 quarters, so 2 quarters fit into a half. Using the shortcut: flip 1/4 to get 4/1, then 1/2 x 4/1 = 4/2 = 2.", "topic": "division by fractions: fraction divided by fraction"}, {"id": "m9-frac-divide:q7", "level": "medium", "type": "text", "q": "Work out 3/5 divided by 2/3", "answer": "9/10", "accept": ["9/10", "0.9", "18/20", ".9"], "hint": "Keep the first fraction, flip the second, change divide to multiply.", "explain": "The answer is 9/10. Keep 3/5. Flip 2/3 to get 3/2. Multiply: 3/5 x 3/2. Tops: 3 x 3 = 9. Bottoms: 5 x 2 = 10. So 9/10, which is 0.9 as a decimal. It is slightly bigger than 3/5, which is right, because you divided by a number just under 1.", "topic": "division by fractions: fraction divided by fraction"}, {"id": "m9-frac-divide:q8", "level": "medium", "type": "mc", "q": "Here is someone's work. 3/5 divided by 2/3 = 19. Which statement shows fastest that this cannot be right?", "options": ["3/5 is less than 1 and 2/3 is close to 1, so the answer must be close to 1, not close to 20", "The answer must be smaller than 3/5, and 19 is bigger", "You cannot divide one fraction by another fraction", "19 is an odd number, and fraction answers are always even"], "answer": "3/5 is less than 1 and 2/3 is close to 1, so the answer must be close to 1, not close to 20", "hint": "Think about roughly how big the answer should be before you check the working.", "explain": "The answer is the first option. Estimating first tells you the size to expect. You start with 3/5 and divide by 2/3, which is a bit less than 1, so the answer should be a bit bigger than 3/5, somewhere near 1. The real answer is 9/10. An answer of 19 is about twenty times too big, so it is wrong before you even check the steps. The second option is wrong because dividing by a number below 1 makes the answer bigger, not smaller.", "topic": "division by fractions: estimating to check an answer"}, {"id": "m9-frac-divide:q9", "level": "medium", "type": "text", "q": "Work out 4/5 divided by 2/5", "answer": "2", "accept": ["2", "2.0", "20/10", "2/1"], "hint": "How many lots of 2/5 fit into 4/5?", "explain": "The answer is 2. Two lots of 2/5 make 4/5, so 2 fit in. Using the shortcut: keep 4/5, flip 2/5 to get 5/2, then 4/5 x 5/2 = 20/10 = 2.", "topic": "division by fractions: fraction divided by fraction"}, {"id": "m9-frac-divide:q10", "level": "medium", "type": "mc", "q": "Here is someone's work. 2/3 divided by 4 = 2/3 x 4/1 = 8/3. Where did it go wrong?", "options": ["The 4 should have been flipped to 1/4, not left as 4/1", "The 2/3 should have been flipped instead", "They should have added the two numbers", "Nothing is wrong, 8/3 is correct"], "answer": "The 4 should have been flipped to 1/4, not left as 4/1", "hint": "It is the second number, the one you are dividing by, that gets flipped.", "explain": "The answer is that the 4 should have been flipped. 4 is the same as 4/1, and flipping it gives 1/4. So 2/3 divided by 4 = 2/3 x 1/4 = 2/12 = 1/6. Sense check: you are splitting 2/3 into 4 equal bits, so the answer must be much smaller than 2/3. 1/6 is smaller. 8/3 is bigger than 2, which is impossible here.", "topic": "division by fractions: spotting the wrong number flipped"}, {"id": "m9-frac-divide:q11", "level": "medium", "type": "text", "q": "Work out 3/4 divided by 1/8", "answer": "6", "accept": ["6", "6.0", "24/4", "6/1"], "hint": "How many eighths fit into three quarters?", "explain": "The answer is 6. Keep 3/4, flip 1/8 to get 8/1, then 3/4 x 8/1 = 24/4 = 6. In pictures, three quarters of a pizza contains 6 slices that are each an eighth, because a quarter is 2 eighths.", "topic": "division by fractions: fraction divided by unit fraction"}, {"id": "m9-frac-divide:q12", "level": "medium", "type": "text", "q": "A plank of wood is 6 m long. It is cut into pieces that are each 3/4 m long. How many pieces are there?", "answer": "8", "accept": ["8", "8.0", "8 pieces"], "hint": "This is asking how many 3/4s fit into 6, so it is a division.", "explain": "The answer is 8 pieces. The calculation is 6 divided by 3/4. Flip 3/4 to get 4/3, then 6 x 4/3 = 24/3 = 8. Check it: 8 pieces x 3/4 m = 24/4 = 6 m, which uses up the whole plank.", "topic": "division by fractions: in context"}, {"id": "m9-frac-divide:q13", "level": "stretch", "type": "text", "q": "A water bottle holds 2/3 of a litre. A team has 10 litres of water. How many bottles can they fill completely?", "answer": "15", "accept": ["15", "15.0", "15 bottles"], "hint": "How many lots of 2/3 fit into 10? Flip and multiply.", "explain": "The answer is 15 bottles. The calculation is 10 divided by 2/3. Flip 2/3 to get 3/2, then 10 x 3/2 = 30/2 = 15. Check it: 15 bottles x 2/3 litre = 30/3 = 10 litres exactly, so nothing is left over.", "topic": "division by fractions: in context"}, {"id": "m9-frac-divide:q14", "level": "stretch", "type": "text", "q": "A loaf of bread needs 3/4 of a cup of flour. You have 10 cups of flour. How many complete loaves can you make?", "answer": "13", "accept": ["13", "13.0", "13 loaves"], "hint": "Divide 10 by 3/4 first. Then think about whether a part of a loaf counts.", "explain": "The answer is 13 loaves. 10 divided by 3/4 means flip and multiply: 10 x 4/3 = 40/3, which is 13 and 1/3. You cannot bake a third of a loaf, so you round DOWN to 13 complete loaves. Check: 13 loaves use 13 x 3/4 = 39/4 = 9.75 cups, leaving 0.25 of a cup, which is not enough for another loaf.", "topic": "division by fractions: rounding down in context"}, {"id": "m9-frac-divide:q15", "level": "stretch", "type": "mc", "q": "Which one of these calculations gives the biggest answer?", "options": ["12 divided by 1/4", "12 divided by 1/2", "12 divided by 2", "12 x 1/4"], "answer": "12 divided by 1/4", "hint": "Dividing by the smallest piece lets the most pieces fit in.", "explain": "The answer is 12 divided by 1/4, which is 48. The others: 12 divided by 1/2 = 24, 12 divided by 2 = 6, and 12 x 1/4 = 3. The smaller the thing you divide by, the more of them fit in, so the bigger the answer.", "topic": "division by fractions: comparing size of answers"}, {"id": "m9-frac-divide:q16", "level": "stretch", "type": "text", "q": "An emergency ration pack weighs 5/8 of a kg. A helicopter can carry 15 kg of ration packs. How many packs can it carry?", "answer": "24", "accept": ["24", "24.0", "24 packs"], "hint": "How many lots of 5/8 fit into 15?", "explain": "The answer is 24 packs. The calculation is 15 divided by 5/8. Flip 5/8 to get 8/5, then 15 x 8/5 = 120/5 = 24. Check it: 24 packs x 5/8 kg = 120/8 = 15 kg exactly.", "topic": "division by fractions: in context"}]}, "m10-divide-decimals": {"id": "m10-divide-decimals", "day": "Day 4", "subject": "Maths", "title": "Division that does not come out whole", "minutes": 25, "objective": "Divide when there is a remainder, carry it into decimal places, and estimate first to check the decimal point is in the right place.", "extract": null, "teach": {"intro": ["Not every division lands on a whole number. 9 divided by 2 does not, because 2 does not go into 9 an exact number of times. The answer is 4.5.", "Estimate before you calculate. 2 x 4 = 8 and 2 x 5 = 10, so 9 divided by 2 must land between 4 and 5. That means the answer starts with a 4. An answer of 45 is ten times too big, so the decimal point is in the wrong place.", "The method is short division with a decimal point. When you have a remainder, put a decimal point in the answer, add a .0 to what you are dividing, and carry the remainder across."], "example": {"problem": "Work out 9 divided by 2", "steps": ["Estimate first. 2 x 4 = 8, 2 x 5 = 10. The answer is between 4 and 5.", "Divide: 2 into 9 goes 4 times, because 4 x 2 = 8. That leaves a remainder of 1.", "Write 4, then a decimal point after it. Treat the 9 as 9.0 and carry the remainder 1 across to the 0, making 10.", "Divide again: 2 into 10 goes 5 times exactly.", "The answer is 4.5. It sits between 4 and 5, which matches the estimate.", "Check backwards: 4.5 x 2 = 9. Correct."], "answer": "4.5"}, "example2": {"problem": "On a map, 2 cm represents 1 km in real life. A road measures 7.5 cm on the map. How far is it in real life?", "steps": ["Every 2 cm on the map is 1 km, so to get km you divide the map distance by 2.", "Estimate first. 7.5 is a bit less than 8, and 8 divided by 2 is 4, so the answer is a bit less than 4 km.", "Divide: 2 into 7 goes 3 times, because 3 x 2 = 6, remainder 1.", "Carry the 1 to the 5, making 15. 2 into 15 goes 7 times, because 7 x 2 = 14, remainder 1.", "Carry the 1 again, making 10. 2 into 10 goes 5 times exactly.", "The answer is 3.75 km. That matches the estimate of just under 4. An answer like 36.5 is nine times too big, so it could never be right."], "answer": "3.75 km"}, "keyfact": "Estimate first, then divide. If the answer should be about 4, then 45 has the decimal point in the wrong place."}, "questions": [{"id": "m10-divide-decimals:q1", "level": "easy", "type": "text", "q": "Work out 9 divided by 2", "answer": "4.5", "accept": ["4.5", "4.50", "9/2", "4 1/2"], "hint": "2 goes into 9 four times with 1 left over. Turn that 1 left over into a decimal.", "explain": "The answer is 4.5. 2 into 9 goes 4 times with 1 left over. Put a decimal point after the 4, carry the 1 across to a 0 to make 10, and 2 into 10 goes 5. So the answer is 4.5. Check: 4.5 x 2 = 9.", "topic": "decimals: dividing with a remainder"}, {"id": "m10-divide-decimals:q2", "level": "easy", "type": "mc", "q": "Before you work it out, 7 divided by 2 must land between which two numbers?", "options": ["3 and 4", "6 and 8", "0 and 1", "13 and 15"], "answer": "3 and 4", "hint": "2 x 3 = 6 and 2 x 4 = 8. Where does 7 sit?", "explain": "The answer is between 3 and 4. 2 x 3 = 6, which is under 7, and 2 x 4 = 8, which is over 7. So the answer sits between 3 and 4. It is 3.5. Doing this estimate first stops you writing 35 by mistake.", "topic": "decimals: estimating before dividing"}, {"id": "m10-divide-decimals:q3", "level": "easy", "type": "text", "q": "Work out 5 divided by 2", "answer": "2.5", "accept": ["2.5", "2.50", "5/2", "2 1/2"], "hint": "2 goes into 5 twice with 1 left over.", "explain": "The answer is 2.5. 2 into 5 goes 2 times with 1 left over. Add the decimal point, carry the 1 to make 10, and 2 into 10 goes 5. So 2.5. Check: 2.5 x 2 = 5.", "topic": "decimals: dividing with a remainder"}, {"id": "m10-divide-decimals:q4", "level": "easy", "type": "text", "q": "Work out 13 divided by 4", "answer": "3.25", "accept": ["3.25", "3.250", "13/4", "3 1/4"], "hint": "4 goes into 13 three times with 1 left over. Carry that 1 into the decimals.", "explain": "The answer is 3.25. 4 into 13 goes 3 times, because 3 x 4 = 12, leaving 1. Add a decimal point and carry the 1 to make 10. 4 into 10 goes 2, because 2 x 4 = 8, leaving 2. Carry the 2 to make 20. 4 into 20 goes 5 exactly. So 3.25. Check: 3.25 x 4 = 13.", "topic": "decimals: dividing to two decimal places"}, {"id": "m10-divide-decimals:q5", "level": "easy", "type": "mc", "q": "Here is someone's work. 9 divided by 2 = 45. What has gone wrong?", "options": ["The digits are right but the decimal point is missing, it should be 4.5", "They should have got 18", "They divided the wrong way round", "2 does not go into 9 at all"], "answer": "The digits are right but the decimal point is missing, it should be 4.5", "hint": "Can sharing 9 between 2 people ever give each person more than 9?", "explain": "The answer is that the decimal point is missing. Dividing 9 by 2 must give something smaller than 9, and roughly half of it, so about 4 or 5. The digits 4 and 5 are correct, but written as 45 they mean forty five, which is five times bigger than the 9 you started with. Written properly it is 4.5.", "topic": "decimals: spotting a misplaced decimal point"}, {"id": "m10-divide-decimals:q6", "level": "easy", "type": "text", "q": "Work out 6 divided by 4", "answer": "1.5", "accept": ["1.5", "1.50", "6/4", "3/2", "1 1/2"], "hint": "4 goes into 6 once with 2 left over.", "explain": "The answer is 1.5. 4 into 6 goes 1 time, leaving 2. Add a decimal point and carry the 2 to make 20. 4 into 20 goes 5 exactly. So 1.5. Check: 1.5 x 4 = 6.", "topic": "decimals: dividing with a remainder"}, {"id": "m10-divide-decimals:q7", "level": "medium", "type": "text", "q": "Work out 7 divided by 8", "answer": "0.875", "accept": ["0.875", ".875", "7/8"], "hint": "8 does not go into 7, so the answer starts with 0 point something.", "explain": "The answer is 0.875. 8 does not fit into 7, so write 0 and a decimal point, then carry the 7. 8 into 70 goes 8 times, because 8 x 8 = 64, leaving 6. Carry to make 60. 8 into 60 goes 7 times, because 7 x 8 = 56, leaving 4. Carry to make 40. 8 into 40 goes 5 exactly. So 0.875. Sense check: 7 is nearly 8, so the answer should be a bit under 1.", "topic": "decimals: dividing to three decimal places"}, {"id": "m10-divide-decimals:q8", "level": "medium", "type": "text", "q": "On a map, 2 cm represents 1 km in real life. A path measures 9 cm on the map. How far is the path in real life, in km?", "answer": "4.5", "accept": ["4.5", "4.5km", "4.5 km", "4.50", "9/2"], "hint": "Every 2 cm is 1 km, so divide the map length by 2. Estimate the size first.", "explain": "The answer is 4.5 km. Since 2 cm stands for 1 km, you divide the map distance by 2: 9 divided by 2. Estimate: it must be between 4 and 5 km, because 8 cm would be 4 km and 10 cm would be 5 km. Working it out gives 4.5 km. An answer of 45 km would mean the path was longer than 45 cm on the map, which it is not.", "topic": "scale: map distance to real distance"}, {"id": "m10-divide-decimals:q9", "level": "medium", "type": "text", "q": "On the same map, 2 cm represents 1 km. A road measures 7.5 cm on the map. How far is the road in real life, in km?", "answer": "3.75", "accept": ["3.75", "3.75km", "3.75 km", "3.750"], "hint": "Divide 7.5 by 2. It should come out a bit under 4, because 8 cm would be 4 km.", "explain": "The answer is 3.75 km. Divide the map distance by 2: 7.5 divided by 2. 2 into 7 goes 3, remainder 1. Carry the 1 to the 5 to make 15, and 2 into 15 goes 7, remainder 1. Carry again to make 10, and 2 into 10 goes 5. So 3.75 km. Estimate check: 7.5 cm is just under 8 cm, and 8 cm would be 4 km, so just under 4 km is right.", "topic": "scale: map distance to real distance"}, {"id": "m10-divide-decimals:q10", "level": "medium", "type": "mc", "q": "On a map 2 cm represents 1 km. Someone measures a road as 7.5 cm and writes 36.5 km. Why is that impossible?", "options": ["7.5 cm is under 8 cm, and 8 cm would be 4 km, so the answer must be under 4 km", "Because 36.5 has a decimal in it", "Because you should multiply the map distance by 2", "Because a road cannot be measured on a map"], "answer": "7.5 cm is under 8 cm, and 8 cm would be 4 km, so the answer must be under 4 km", "hint": "Work out what 8 cm would be, then compare.", "explain": "The answer is the first option. Estimating puts a fence around the answer. 8 cm on this map is 4 km, and 7.5 cm is less than 8 cm, so the real distance must be a bit under 4 km. It is 3.75 km. An answer of 36.5 is about nine times too big. Multiplying by 2 is the wrong operation, because the real distance in km is always smaller than the map distance in cm on this scale.", "topic": "scale: estimating to check a scale answer"}, {"id": "m10-divide-decimals:q11", "level": "medium", "type": "text", "q": "Work out 45 divided by 4", "answer": "11.25", "accept": ["11.25", "11.250", "45/4", "11 1/4"], "hint": "4 into 4 goes 1, then 4 into 5 goes 1 with 1 left over. Carry it into the decimals.", "explain": "The answer is 11.25. 4 into 4 goes 1. 4 into 5 goes 1, leaving 1. Add a decimal point and carry the 1 to make 10. 4 into 10 goes 2, leaving 2. Carry to make 20, and 4 into 20 goes 5. So 11.25. Estimate check: 4 x 11 = 44, so the answer is just over 11.", "topic": "decimals: dividing to two decimal places"}, {"id": "m10-divide-decimals:q12", "level": "medium", "type": "text", "q": "Four friends split a restaurant bill of 27 pounds equally. How much does each one pay, in pounds?", "answer": "6.75", "accept": ["6.75", "6.750", "£6.75", "6.75 pounds", "27/4"], "hint": "27 divided by 4. Estimate it first: 4 x 6 = 24 and 4 x 7 = 28.", "explain": "The answer is 6.75 pounds. 4 into 27 goes 6, because 6 x 4 = 24, leaving 3. Add a decimal point and carry the 3 to make 30. 4 into 30 goes 7, because 7 x 4 = 28, leaving 2. Carry to make 20, and 4 into 20 goes 5. So 6.75. Check: 6.75 x 4 = 27.", "topic": "decimals: dividing money in context"}, {"id": "m10-divide-decimals:q13", "level": "stretch", "type": "text", "q": "A different map uses a scale where 5 cm represents 2 km. A trail measures 9 cm on this map. How far is the trail in real life, in km?", "answer": "3.6", "accept": ["3.6", "3.6km", "3.6 km", "3.60", "18/5"], "hint": "Work out what 1 cm is worth first: 2 km shared over 5 cm.", "explain": "The answer is 3.6 km. First find what 1 cm represents: 2 divided by 5 = 0.4 km. Then 9 cm represents 9 x 0.4 = 3.6 km. Estimate check: 10 cm would be 4 km, and 9 cm is a bit less, so a bit under 4 km is right.", "topic": "scale: two-step map scale"}, {"id": "m10-divide-decimals:q14", "level": "stretch", "type": "text", "q": "A runner covers 17 km in 4 hours, running at a steady speed the whole way. How many km does she cover in 1 hour?", "answer": "4.25", "accept": ["4.25", "4.250", "4.25km", "4.25 km", "17/4"], "hint": "Steady speed means share the distance equally between the hours. Estimate: 4 x 4 = 16.", "explain": "The answer is 4.25 km. Divide 17 by 4. 4 into 17 goes 4, because 4 x 4 = 16, leaving 1. Add a decimal point, carry the 1 to make 10. 4 into 10 goes 2, leaving 2. Carry to make 20, and 4 into 20 goes 5. So 4.25 km per hour. Check: 4.25 x 4 = 17.", "topic": "decimals: dividing in a rate context"}, {"id": "m10-divide-decimals:q15", "level": "stretch", "type": "mc", "q": "Without dividing it out exactly, which is the best estimate for 61 divided by 8?", "options": ["About 7.6", "About 76", "About 0.76", "About 480"], "answer": "About 7.6", "hint": "8 x 7 = 56 and 8 x 8 = 64. Which of these is 61 closest to sitting between?", "explain": "The answer is about 7.6. 8 x 7 = 56 and 8 x 8 = 64, so 61 divided by 8 must be between 7 and 8. The exact answer is 7.625. 76 and 0.76 have the digits in roughly the right order but the decimal point in the wrong place, and 480 is what you get if you multiply instead of divide.", "topic": "decimals: estimating before dividing"}, {"id": "m10-divide-decimals:q16", "level": "stretch", "type": "text", "q": "A map has a scale where 2 cm represents 1 km. Two towns are 11 cm apart on the map. A car drives between them at a steady 22 km per hour. How many minutes does the journey take?", "answer": "15", "accept": ["15", "15 minutes", "15min", "15 min", "15.0"], "hint": "Find the real distance first. Then work out what fraction of an hour that takes at 22 km per hour.", "explain": "The answer is 15 minutes. Step 1: real distance is 11 divided by 2 = 5.5 km. Step 2: at 22 km per hour, the time is 5.5 divided by 22 hours. 5.5 is a quarter of 22, so it takes 0.25 of an hour. Step 3: 0.25 of 60 minutes is 15 minutes. Sense check: 5.5 km at 22 km per hour is a short trip, so an answer in minutes rather than hours makes sense.", "topic": "scale: multi-step scale and speed"}]}, "m11-ratio": {"id": "m11-ratio", "day": "Day 5", "subject": "Maths", "title": "Sharing in a ratio", "minutes": 25, "objective": "Share an amount in a given ratio by totalling the parts, finding one part, and multiplying back.", "extract": null, "teach": {"intro": ["A ratio says how shares are split up. 2:3 means for every 2 things one person gets, the other gets 3. It is written with a colon and read as \"2 to 3\".", "To share an amount, you always do the same three steps. Add the parts to find how many equal parts there are. Divide the amount by that number to find what one part is worth. Multiply back to get each share.", "Always check at the end. The shares must add up to the amount you started with. If they do not, something has gone wrong."], "example": {"problem": "Share 20 sweets between Tom and Ali in the ratio 2:3.", "steps": ["Add the parts: 2 + 3 = 5. So there are 5 equal parts in total.", "Find one part: 20 divided by 5 = 4. Each part is worth 4 sweets.", "Multiply back for Tom: 2 parts x 4 = 8 sweets.", "Multiply back for Ali: 3 parts x 4 = 12 sweets.", "Check: 8 + 12 = 20, which matches the total we started with."], "answer": "Tom gets 8, Ali gets 12"}, "example2": {"problem": "Share 45 pounds in the ratio 4:5.", "steps": ["Add the parts: 4 + 5 = 9 equal parts.", "Find one part: 45 divided by 9 = 5 pounds per part.", "First share: 4 x 5 = 20 pounds.", "Second share: 5 x 5 = 25 pounds.", "Check: 20 + 25 = 45. Correct."], "answer": "20 pounds and 25 pounds"}, "keyfact": "Add the parts, divide the total by that number, then multiply back. The shares must add up to the original total."}, "questions": [{"id": "m11-ratio:q1", "level": "easy", "type": "mc", "q": "An amount is shared in the ratio 3:1. How many equal parts is it split into altogether?", "options": ["4", "3", "2", "1"], "answer": "4", "hint": "Add the numbers in the ratio.", "explain": "The answer is 4. Add the parts: 3 + 1 = 4. One person gets 3 of those parts and the other gets 1 part. Finding the total number of parts is always the first step.", "topic": "ratio: total number of parts"}, {"id": "m11-ratio:q2", "level": "easy", "type": "text", "q": "Share 20 in the ratio 1:3. How much is the SMALLER share?", "answer": "5", "accept": ["5", "5.0"], "hint": "There are 4 parts in total. Find what one part is worth.", "explain": "The answer is 5. Add the parts: 1 + 3 = 4. One part is 20 divided by 4 = 5. The smaller share is 1 part, so it is 5. The larger share is 3 x 5 = 15. Check: 5 + 15 = 20.", "topic": "ratio: sharing an amount"}, {"id": "m11-ratio:q3", "level": "easy", "type": "text", "q": "Share 30 in the ratio 2:3. Write both amounts, smaller one first, in this style: 12 and 18", "answer": "12 and 18", "accept": ["12 and 18", "12 and 18.", "12,18", "12, 18", "12:18", "12 18", "18 and 12"], "hint": "There are 5 parts in total. What is one part worth?", "explain": "The answer is 12 and 18. Add the parts: 2 + 3 = 5. One part is 30 divided by 5 = 6. The first share is 2 x 6 = 12. The second share is 3 x 6 = 18. Check: 12 + 18 = 30.", "topic": "ratio: sharing an amount"}, {"id": "m11-ratio:q4", "level": "easy", "type": "mc", "q": "Sand and cement are mixed in the ratio 4:1. Which statement is true?", "options": ["There is 4 times as much sand as cement", "There is 4 times as much cement as sand", "There is the same amount of each", "There are exactly 4 buckets in total"], "answer": "There is 4 times as much sand as cement", "hint": "The order matters. Sand is named first, so the 4 belongs to the sand.", "explain": "The answer is that there is 4 times as much sand as cement. The order of the ratio matches the order the things are named, so sand gets 4 parts and cement gets 1 part. The last option is wrong because a ratio does not tell you the actual amount, only how the shares compare.", "topic": "ratio: reading a ratio"}, {"id": "m11-ratio:q5", "level": "medium", "type": "text", "q": "Share 84 in the ratio 3:4. Write both amounts, smaller one first, in this style: 12 and 18", "answer": "36 and 48", "accept": ["36 and 48", "36,48", "36, 48", "36:48", "36 48", "48 and 36"], "hint": "7 parts in total. 84 divided by 7 gives one part.", "explain": "The answer is 36 and 48. Add the parts: 3 + 4 = 7. One part is 84 divided by 7 = 12. First share: 3 x 12 = 36. Second share: 4 x 12 = 48. Check: 36 + 48 = 84.", "topic": "ratio: sharing an amount"}, {"id": "m11-ratio:q6", "level": "medium", "type": "text", "q": "Share 60 in the ratio 2:3:5. Write the three amounts, smallest first, in this style: 5, 10 and 15", "answer": "12, 18 and 30", "accept": ["12, 18 and 30", "12,18,30", "12, 18, 30", "12 18 30", "12:18:30", "12 18 and 30"], "hint": "Add all three numbers to find the total parts.", "explain": "The answer is 12, 18 and 30. Add the parts: 2 + 3 + 5 = 10. One part is 60 divided by 10 = 6. The shares are 2 x 6 = 12, 3 x 6 = 18, and 5 x 6 = 30. Check: 12 + 18 + 30 = 60. A three way ratio works exactly like a two way one.", "topic": "ratio: three part ratio"}, {"id": "m11-ratio:q7", "level": "medium", "type": "text", "q": "Two brothers share 45 pounds in the ratio 4:5. How much does the brother with the LARGER share get, in pounds?", "answer": "25", "accept": ["25", "25.0", "£25", "25 pounds"], "hint": "9 parts in total. Find one part, then take 5 of them.", "explain": "The answer is 25 pounds. Add the parts: 4 + 5 = 9. One part is 45 divided by 9 = 5 pounds. The larger share is 5 parts, so 5 x 5 = 25 pounds. The other brother gets 4 x 5 = 20. Check: 20 + 25 = 45.", "topic": "ratio: sharing an amount"}, {"id": "m11-ratio:q8", "level": "medium", "type": "text", "q": "A recipe mixes flour and butter in the ratio 5:2. A baker uses 350 g of flour. How many grams of butter does he need?", "answer": "140", "accept": ["140", "140g", "140 g", "140.0", "140 grams"], "hint": "The 350 g is 5 parts, not the total. Find what one part weighs first.", "explain": "The answer is 140 g. Here you are not given the total, you are given one side. The flour is 5 parts and weighs 350 g, so one part is 350 divided by 5 = 70 g. The butter is 2 parts, so 2 x 70 = 140 g. The common mistake is dividing 350 by 7, but 350 is only the flour, not the whole mixture.", "topic": "ratio: given one share not the total"}, {"id": "m11-ratio:q9", "level": "medium", "type": "mc", "q": "Money is shared between two people in the ratio 3:5. The smaller share is 21 pounds. What was the total amount of money?", "options": ["56 pounds", "35 pounds", "21 pounds", "40 pounds"], "answer": "56 pounds", "hint": "21 pounds is 3 parts. Work out one part, then find all 8 parts.", "explain": "The answer is 56 pounds. The smaller share is 3 parts and is worth 21 pounds, so one part is 21 divided by 3 = 7 pounds. There are 3 + 5 = 8 parts in total, so the total is 8 x 7 = 56 pounds. Check: the shares are 21 and 35, and 21 + 35 = 56.", "topic": "ratio: working back to the total"}, {"id": "m11-ratio:q10", "level": "stretch", "type": "text", "q": "A prize of 240 pounds is shared between three people in the ratio 1:2:5. How many pounds MORE does the largest share get than the smallest share?", "answer": "120", "accept": ["120", "120.0", "£120", "120 pounds"], "hint": "Find one part, work out the largest and smallest shares, then subtract.", "explain": "The answer is 120 pounds. Add the parts: 1 + 2 + 5 = 8. One part is 240 divided by 8 = 30 pounds. The largest share is 5 x 30 = 150 and the smallest is 1 x 30 = 30. The difference is 150 - 30 = 120 pounds. A faster route: the difference is 5 - 1 = 4 parts, and 4 x 30 = 120.", "topic": "ratio: difference between shares"}, {"id": "m11-ratio:q11", "level": "stretch", "type": "text", "q": "Concrete is mixed with cement, sand and gravel in the ratio 1:2:4. A builder has exactly 15 kg of cement and plenty of sand and gravel. How many kg of concrete can he make in total?", "answer": "105", "accept": ["105", "105kg", "105 kg", "105.0"], "hint": "The 15 kg of cement is 1 part. How many parts is the whole mix?", "explain": "The answer is 105 kg. The cement is 1 part and it weighs 15 kg, so one part is 15 kg. The whole mix is 1 + 2 + 4 = 7 parts. Total concrete is 7 x 15 = 105 kg. That is 15 kg cement, 30 kg sand and 60 kg gravel, and 15 + 30 + 60 = 105.", "topic": "ratio: scaling up from one share"}, {"id": "m11-ratio:q12", "level": "stretch", "type": "text", "q": "Two friends share a bag of sweets in the ratio 3:4. The one with the larger share gets 6 more sweets than the other. How many sweets were in the bag?", "answer": "42", "accept": ["42", "42.0", "42 sweets"], "hint": "The difference between the shares is 4 - 3 = 1 part. So what is one part worth?", "explain": "The answer is 42 sweets. The difference between the shares is 4 parts minus 3 parts, which is 1 part. That difference is 6 sweets, so one part is 6 sweets. The whole bag is 3 + 4 = 7 parts, so 7 x 6 = 42 sweets. Check: the shares are 18 and 24, the difference is 6, and 18 + 24 = 42.", "topic": "ratio: working from the difference"}]}, "m12-algebra-simplify": {"id": "m12-algebra-simplify", "day": "Day 6", "subject": "Maths", "title": "Simplifying expressions", "minutes": 25, "objective": "Collect like terms to write an expression in its shortest correct form.", "extract": null, "teach": {"intro": ["In algebra a letter stands for a number you do not know yet. If a bag holds an unknown number of marbles, call that number a.", "There is one writing rule to learn. You never write the multiply sign next to a letter. 3 x a is written 3a, and it means three lots of a.", "Terms that use the same letter can be joined together. 3a + 2a = 5a, in the same way that 3 bags plus 2 bags is 5 bags. But 3a + 2b cannot be joined, because a and b stand for different unknown numbers. Three bags plus two boxes is just three bags and two boxes."], "example": {"problem": "Simplify 4a + 3b + 2a - b", "steps": ["Go through and pick out the a terms: 4a and 2a.", "4a + 2a = 6a.", "Now pick out the b terms: 3b and -b. Remember that -b means -1b.", "3b - b = 2b.", "Put the collected terms together: 6a + 2b.", "You cannot go further. 6a and 2b use different letters, so they stay apart."], "answer": "6a + 2b"}, "example2": {"problem": "Simplify 5x + 2 + 3x - 6", "steps": ["Collect the x terms: 5x + 3x = 8x.", "Collect the plain numbers: 2 - 6 = -4.", "Write them together: 8x - 4.", "Plain numbers are like terms with each other, but they are never like terms with an x term."], "answer": "8x - 4"}, "keyfact": "Only collect terms that use exactly the same letter. Write 3 x a as 3a."}, "questions": [{"id": "m12-algebra-simplify:q1", "level": "easy", "type": "mc", "q": "How do you write 5 x n in algebra?", "options": ["5n", "n5", "5 + n", "n/5"], "answer": "5n", "hint": "The number goes first and the multiply sign is dropped.", "explain": "The answer is 5n. In algebra the multiply sign is left out, and the number is written before the letter. So 5 x n becomes 5n, meaning five lots of n.", "topic": "algebra: notation for multiplying"}, {"id": "m12-algebra-simplify:q2", "level": "easy", "type": "text", "q": "Simplify 3a + 2a", "answer": "5a", "accept": ["5a", "5 a", "5*a", "5 x a"], "hint": "Both terms use the letter a, so they can be joined.", "explain": "The answer is 5a. Both terms use the same letter, so add the numbers in front: 3 + 2 = 5. That gives 5a. Think of it as 3 bags plus 2 bags making 5 bags.", "topic": "algebra: collecting like terms"}, {"id": "m12-algebra-simplify:q3", "level": "easy", "type": "mc", "q": "Why can 3a + 2b not be simplified any further?", "options": ["a and b stand for different unknown numbers, so they cannot be joined", "Because b is always bigger than a", "Because you can only add numbers, never letters", "It can be simplified, it is 5ab"], "answer": "a and b stand for different unknown numbers, so they cannot be joined", "hint": "Could you add 3 bags and 2 boxes and call the result 5 of one thing?", "explain": "The answer is that a and b stand for different unknown numbers. Adding them into one term would say they are the same thing, and they are not. 3a + 2b is already as short as it can be. Writing 5ab is wrong, because ab means a x b, which is a completely different thing.", "topic": "algebra: why unlike terms stay apart"}, {"id": "m12-algebra-simplify:q4", "level": "easy", "type": "text", "q": "Simplify 7c - 3c", "answer": "4c", "accept": ["4c", "4 c", "4*c", "4 x c"], "hint": "Same letter, so subtract the numbers in front.", "explain": "The answer is 4c. Both terms use c, so 7 - 3 = 4, giving 4c. If c stood for 10, this would say 70 - 30 = 40, which is 4 lots of 10. That works whatever number c is.", "topic": "algebra: collecting like terms"}, {"id": "m12-algebra-simplify:q5", "level": "medium", "type": "text", "q": "Simplify 4x + 5y + 2x", "answer": "6x + 5y", "accept": ["6x + 5y", "6x+5y", "5y + 6x", "5y+6x"], "hint": "Only the x terms can be joined. The y term is on its own.", "explain": "The answer is 6x + 5y. Collect the x terms: 4x + 2x = 6x. There is only one y term, 5y, so it stays as it is. The answer is 6x + 5y, and the two parts cannot be joined because the letters are different.", "topic": "algebra: collecting like terms with two letters"}, {"id": "m12-algebra-simplify:q6", "level": "medium", "type": "text", "q": "Simplify 8m + 3 - 2m + 5", "answer": "6m + 8", "accept": ["6m + 8", "6m+8", "8 + 6m", "8+6m"], "hint": "Collect the m terms, then collect the plain numbers.", "explain": "The answer is 6m + 8. The m terms: 8m - 2m = 6m. The plain numbers: 3 + 5 = 8. Put them together to get 6m + 8. Plain numbers can be joined with each other, but never with an m term.", "topic": "algebra: collecting terms and numbers"}, {"id": "m12-algebra-simplify:q7", "level": "medium", "type": "text", "q": "Simplify 5p + 2q - 3p - 5q", "answer": "2p - 3q", "accept": ["2p - 3q", "2p-3q", "-3q + 2p", "-3q+2p"], "hint": "Take care with the minus signs. Each sign belongs to the term straight after it.", "explain": "The answer is 2p - 3q. The p terms: 5p - 3p = 2p. The q terms: 2q - 5q = -3q, because taking 5 away from 2 gives -3. Put them together to get 2p - 3q. The minus sign in front of a term always belongs to that term.", "topic": "algebra: collecting like terms with negatives"}, {"id": "m12-algebra-simplify:q8", "level": "medium", "type": "mc", "q": "Here is someone's work. 4a + 3b = 7ab. What is wrong with it?", "options": ["a and b are different unknowns, so the terms cannot be added together at all", "Nothing, 7ab is correct", "It should be 7a", "It should be 12ab"], "answer": "a and b are different unknowns, so the terms cannot be added together at all", "hint": "What does ab actually mean in algebra?", "explain": "The answer is that the terms cannot be added. 4a + 3b is already as simple as it gets. There is a second problem too. The letters ab mean a x b, so 7ab means 7 x a x b, which is a multiplying statement, not an adding one. Test it with numbers: if a = 2 and b = 1, then 4a + 3b = 8 + 3 = 11, but 7ab = 7 x 2 x 1 = 14. Different answers, so the working is wrong.", "topic": "algebra: spotting wrongly combined unlike terms"}, {"id": "m12-algebra-simplify:q9", "level": "medium", "type": "text", "q": "A rectangle has sides of length a, b, a and b. Write a simplified expression for the perimeter.", "answer": "2a + 2b", "accept": ["2a + 2b", "2a+2b", "2b + 2a", "2b+2a"], "hint": "Perimeter means add all four sides. Then collect the like terms.", "explain": "The answer is 2a + 2b. Add all four sides: a + b + a + b. Collect the a terms: a + a = 2a. Collect the b terms: b + b = 2b. So the perimeter is 2a + 2b. It cannot be shortened further, because a and b are different lengths.", "topic": "algebra: perimeter as an expression"}, {"id": "m12-algebra-simplify:q10", "level": "stretch", "type": "text", "q": "Simplify 3x + 4y - 5x + y + 2", "answer": "-2x + 5y + 2", "accept": ["-2x + 5y + 2", "-2x+5y+2", "5y - 2x + 2", "5y-2x+2", "2 + 5y - 2x", "-2x + 5y +2"], "hint": "Watch the x terms. Taking 5x from 3x goes below zero. Also remember y means 1y.", "explain": "The answer is -2x + 5y + 2. The x terms: 3x - 5x = -2x, because 3 - 5 = -2. The y terms: 4y + y = 5y, since y on its own means 1y. The plain number 2 has nothing to join with, so it stays. Writing it as 5y - 2x + 2 means exactly the same thing.", "topic": "algebra: collecting like terms with a negative result"}, {"id": "m12-algebra-simplify:q11", "level": "stretch", "type": "text", "q": "A triangle has sides of length 2x, 3x + 1 and x + 4. Write a simplified expression for its perimeter.", "answer": "6x + 5", "accept": ["6x + 5", "6x+5", "5 + 6x", "5+6x"], "hint": "Add all three sides, then collect the x terms and the numbers separately.", "explain": "The answer is 6x + 5. Add the sides: 2x + 3x + 1 + x + 4. Collect the x terms: 2x + 3x + x = 6x. Collect the numbers: 1 + 4 = 5. So the perimeter is 6x + 5.", "topic": "algebra: perimeter as an expression"}, {"id": "m12-algebra-simplify:q12", "level": "stretch", "type": "text", "q": "Ben has n pounds. Ali has 3 times as much as Ben. Cara has 5 pounds less than Ben. Write a simplified expression for the total amount of money the three of them have.", "answer": "5n - 5", "accept": ["5n - 5", "5n-5", "-5 + 5n", "5n -5"], "hint": "Write each person as an expression first, then add all three and collect.", "explain": "The answer is 5n - 5. Ben has n. Ali has 3 times as much, which is 3n. Cara has 5 less than Ben, which is n - 5. Add them: n + 3n + n - 5. Collect the n terms: n + 3n + n = 5n. The -5 has no other number to join with, so it stays. The total is 5n - 5. Test it: if n = 10, Ben has 10, Ali has 30 and Cara has 5, giving 45. The expression gives 5 x 10 - 5 = 45.", "topic": "algebra: forming and simplifying an expression"}]}, "m13-area-triangle": {"id": "m13-area-triangle", "day": "Day 7", "subject": "Maths", "title": "Area of a triangle", "minutes": 25, "objective": "Find the area of a triangle using base x height divided by 2, using the perpendicular height rather than a slanted side.", "extract": null, "teach": {"intro": ["Every triangle is exactly half of a rectangle. Draw a rectangle around a triangle so they share the same base and the same height, and the triangle covers half of it.", "That gives the rule: area = base x height, then divide by 2. A rectangle 8 cm by 5 cm has an area of 40 cm^2, so a triangle with the same base and height has an area of 20 cm^2.", "The height must be the PERPENDICULAR height. That means the straight up distance from the base, meeting it at 90 degrees. A slanted side is longer than the perpendicular height, so using it gives an answer that is too big."], "example": {"problem": "A triangle has a base of 8 cm and a perpendicular height of 5 cm. Find its area.", "steps": ["Picture the rectangle around it: 8 cm across and 5 cm up.", "Rectangle area: 8 x 5 = 40 cm^2.", "The triangle is half of that rectangle, so divide by 2: 40 divided by 2 = 20.", "The answer is 20 cm^2. Area is always in square units, so write cm^2, not cm."], "answer": "20 cm^2"}, "example2": {"problem": "A triangle has a base of 6 cm, a perpendicular height of 4 cm, and a slanted side of 5 cm. Find its area.", "steps": ["Pick the right two numbers. The base is 6 cm. The perpendicular height is 4 cm. The 5 cm slanted side is not used at all.", "Multiply base by height: 6 x 4 = 24.", "Divide by 2: 24 divided by 2 = 12.", "The answer is 12 cm^2. Using the 5 cm slanted side by mistake would give 15 cm^2, which is too big, because the slanted side is longer than the true height."], "answer": "12 cm^2"}, "keyfact": "Area of a triangle = base x height divided by 2. The height is the one that meets the base at 90 degrees."}, "questions": [{"id": "m13-area-triangle:q1", "level": "easy", "type": "mc", "q": "Why do you divide by 2 when finding the area of a triangle?", "options": ["A triangle is half of a rectangle with the same base and height", "Because a triangle has an odd number of sides", "Because area is always halved", "Because the base and the height are always the same length"], "answer": "A triangle is half of a rectangle with the same base and height", "hint": "Draw a rectangle around the triangle and see how much of it the triangle covers.", "explain": "The answer is that a triangle is half of a rectangle with the same base and height. Draw the rectangle around the triangle and the leftover space is exactly the same size as the triangle. So work out the rectangle, base x height, then halve it.", "topic": "area: why the triangle formula halves"}, {"id": "m13-area-triangle:q2", "level": "easy", "type": "text", "q": "A triangle has a base of 10 cm and a perpendicular height of 6 cm. What is its area, in cm^2?", "answer": "30", "accept": ["30", "30cm^2", "30 cm^2", "30cm2", "30 cm2", "30.0"], "hint": "Multiply base by height, then halve it.", "explain": "The answer is 30 cm^2. Base x height: 10 x 6 = 60. Divide by 2: 60 divided by 2 = 30. The rectangle around it would be 60 cm^2, and the triangle is half of that.", "topic": "area: triangle from base and height"}, {"id": "m13-area-triangle:q3", "level": "easy", "type": "text", "q": "A triangle has a base of 4 cm and a perpendicular height of 5 cm. What is its area, in cm^2?", "answer": "10", "accept": ["10", "10cm^2", "10 cm^2", "10cm2", "10 cm2", "10.0"], "hint": "4 x 5 first, then divide by 2.", "explain": "The answer is 10 cm^2. Base x height: 4 x 5 = 20. Divide by 2: 20 divided by 2 = 10.", "topic": "area: triangle from base and height"}, {"id": "m13-area-triangle:q4", "level": "easy", "type": "mc", "q": "A triangle has a base of 8 cm, a perpendicular height of 3 cm, and a slanted side of 5 cm. Which two numbers do you use to find the area?", "options": ["8 and 3", "8 and 5", "3 and 5", "All three"], "answer": "8 and 3", "hint": "The formula needs the base and the height that meets it at 90 degrees.", "explain": "The answer is 8 and 3. The formula uses the base and the perpendicular height only. The 5 cm s
