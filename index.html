"level": "medium", "type": "text", "q": "A cyclist rides at a steady 8 m/s for 45 s. How far does the cyclist travel, in m?", "answer": "360", "accept": ["360", "360 m", "360m", "360.0", "360 metres"], "hint": "Speed = distance / time. The distance is on top, so undo the divide by multiplying.", "explain": "The answer is 360 m. This is a working backwards question, the same move as the Day 1 maths session on working backwards, because the number you want is not on its own in the rule. Forward rule: speed = distance / time, so 8 = distance / 45. Undo the divide by 45 by multiplying both sides by 45: distance = 8 x 45 = 360 m. Self check, put it back into the forward version: 360 / 45 = 8 m/s, which is the speed you were given, so 360 m is right.", "topic": "working backwards: speed rule rearranged to find distance"}, {"id": "s10-forces-energy-recap:q6", "level": "medium", "type": "text", "q": "A runner covers 210 m at a steady speed of 7 m/s. How many seconds does it take?", "answer": "30", "accept": ["30", "30 s", "30s", "30.0", "thirty", "30 seconds"], "hint": "Speed = distance / time. The time is underneath, so it takes two undoing steps.", "explain": "The answer is 30 s. This is a working backwards question, the same move as the Day 1 maths session on working backwards. Forward rule: speed = distance / time, so 7 = 210 / time. Multiply both sides by time: 7 x time = 210. Divide both sides by 7: time = 210 / 7 = 30 s. Self check, put it back into the forward version: 210 / 30 = 7 m/s, which is the speed you were given, so 30 s is right. The wrong move here is multiplying to get 210 x 7 = 1470, and the self check catches it at once because 210 / 1470 is not 7.", "topic": "working backwards: speed rule rearranged to find time"}, {"id": "s10-forces-energy-recap:q7", "level": "medium", "type": "text", "q": "A crate has a weight of 450 N. Work out its mass in kg.", "answer": "45", "accept": ["45", "45 kg", "45kg", "45.0", "forty five", "forty-five"], "hint": "Weight = mass x 10. You are given the weight, so undo the times 10.", "explain": "The answer is 45 kg. This is a working backwards question, the same move as the Day 1 maths session on working backwards, because you have been handed the finished number and asked for the one that made it. Forward rule: weight = mass x 10, so 450 = mass x 10. Undo the times 10 by dividing both sides by 10: mass = 45 kg. Self check, put it back into the forward version: 45 x 10 = 450 N, which is the weight you were given, so 45 kg is right. Multiplying by 10 again to get 4500 is the trap, and the check kills it.", "topic": "working backwards: weight rule rearranged to find mass"}, {"id": "s10-forces-energy-recap:q8", "level": "medium", "type": "mc", "q": "A ball is dropped from a window and speeds up as it falls. Which transfer describes what is happening to its energy?", "options": ["From the gravitational potential store of the ball to its kinetic store", "From the kinetic store of the ball to its gravitational potential store", "From the chemical store of the ball to its thermal store", "From the elastic potential store of the ball to its kinetic store"], "answer": "From the gravitational potential store of the ball to its kinetic store", "hint": "It is getting lower, and it is getting faster. Which store empties and which one fills?", "explain": "Energy is transferred from the gravitational potential store to the kinetic store. Being high up fills the gravitational potential store, and as the ball falls that store empties while the kinetic store fills, which is why it speeds up. The second option is the same transfer written backwards, and that is what happens to a ball thrown upwards instead.", "topic": "energy: transfer between stores for a falling object"}, {"id": "s10-forces-energy-recap:q9", "level": "medium", "type": "text", "q": "A box presses down on the floor with a force of 600 N and creates a pressure of 300 N/m^2. Work out the area it is resting on, in m^2.", "answer": "2", "accept": ["2", "2 m^2", "2m^2", "2.0", "two", "2 square metres"], "hint": "Pressure = force / area. The area is underneath, so it takes two undoing steps.", "explain": "The answer is 2 m^2. This is a working backwards question, the same move as the Day 1 maths session on working backwards. Forward rule: pressure = force / area, so 300 = 600 / area. Multiply both sides by area: 300 x area = 600. Divide both sides by 300: area = 600 / 300 = 2 m^2. Self check, put it back into the forward version: 600 / 2 = 300 N/m^2, which is the pressure you were given, so 2 m^2 is right.", "topic": "working backwards: pressure rule rearranged to find area"}, {"id": "s10-forces-energy-recap:q10", "level": "medium", "type": "text", "q": "Look at the ramp investigation results at the top of this session. Ignore the anomaly and work out the mean distance in cm.", "answer": "64", "accept": ["64", "64 cm", "64cm", "64.0", "sixty four", "sixty-four"], "hint": "One run is nowhere near the others. Leave it out, then divide by how many readings you kept.", "explain": "The answer is 64 cm. Run 3 gave 30 cm while every other run is between 62 and 66 cm, and the note says the car clipped the ramp on that run, so 30 cm is the anomaly and you leave it out. Add the four you are keeping: 62 + 65 + 63 + 66 = 256. Divide by four, not five: 256 / 4 = 64 cm. Self check, 64 sits inside the 62 to 66 range of the readings you kept, so it is sensible. Read the numbers in front of you here. The numbers change in every single version of this question, so an answer you remember from a previous week will be wrong even though the method is identical.", "topic": "working scientifically: mean after ignoring an anomalous result"}, {"id": "s10-forces-energy-recap:q11", "level": "stretch", "type": "text", "q": "A lamp is supplied with 80 J of energy. It transfers 24 J usefully as light. What is its efficiency as a percentage?", "answer": "30", "accept": ["30", "30%", "30 %", "30.0", "thirty", "30 percent"], "hint": "Efficiency = useful energy / total energy x 100.", "explain": "The answer is 30%. Efficiency = useful energy / total energy x 100, so 24 / 80 x 100 = 30%. Self check: 30% of 80 is 24 J, which is the useful energy you were given. Dividing the wrong way round gives 80 / 24 x 100 = 333%, and efficiency can never be more than 100%, so anything above 100 means you flipped the fraction. The missing 70%, which is 80 - 24 = 56 J, has gone to the thermal store of the surroundings.", "topic": "energy: efficiency as a percentage from useful and total energy"}, {"id": "s10-forces-energy-recap:q12", "level": "stretch", "type": "text", "q": "A sack of sand rests on a flat board. The pressure under the board is 250 N/m^2 and the area of the board is 4 m^2. Work out the force pressing down, in N.", "answer": "1000", "accept": ["1000", "1000 N", "1000N", "1000.0", "1,000", "1,000 N", "one thousand"], "hint": "Pressure = force / area. The force is on top, so undo the divide by multiplying.", "explain": "The answer is 1000 N. This is a working backwards question, the same move as the Day 1 maths session on working backwards, and it is the fifth time this session that the number you want has not been on its own. Forward rule: pressure = force / area, so 250 = force / 4. Undo the divide by 4 by multiplying both sides by 4: force = 250 x 4 = 1000 N. Self check, put it back into the forward version: 1000 / 4 = 250 N/m^2, which is the pressure you were given, so 1000 N is right. Dividing instead, 250 / 4 = 62.5, fails the check immediately because 62.5 / 4 is 15.625 and not 250.", "topic": "working backwards: pressure rule rearranged to find force"}]}, "de11-core-words": {"id": "de11-core-words", "day": "Day 1", "subject": "German", "title": "Twenty words that do the work", "minutes": 10, "objective": "Know twenty everyday German nouns with the right der, die or das in front of each one, and write them as two words joined together.", "extract": null, "teach": {"intro": ["German nouns come with a small word in front of them. It is der, die or das. That small word is part of the noun, so you learn both words together as one thing.", "Say der Hund, not Hund. Say die Schule, not Schule. If you only learn Hund, you have learned half a word.", "Here are your twenty words. This is the whole list for the whole week, and nothing else gets added. The der words: der Bus, der Hund, der Bruder, der Film, der Freund, der Vater, der Tag, der Fussball.", "The die words: die Schule, die Schwester, die Stadt, die Mutter, die Musik, die Pizza.", "The das words: das Haus, das Buch, das Spiel, das Essen, das Zimmer, das Wasser.", "Eight der words, six die words, six das words. You will meet every single one of them again tomorrow, and on Wednesday, and on Friday. There is no trick to this. It is out loud, then covered up, then written down."], "example": {"problem": "Learn the German for the dog.", "steps": ["The noun is Hund.", "Hund is a der word, so the whole thing is der Hund.", "Say it out loud twice. der Hund, der Hund.", "Cover it up and write it. If you wrote Hund on its own, you missed the der, and that is the mark gone."], "answer": "der Hund"}, "example2": {"problem": "Learn the German for the school.", "steps": ["The noun is Schule.", "Schule is a die word, so the whole thing is die Schule.", "In a test in the summer you wrote der Schule. That is the right noun with the wrong small word stuck on the front, and it scores nothing.", "Say it out loud twice. die Schule, die Schule. Then cover it and write it."], "answer": "die Schule"}, "keyfact": "Every German noun carries der, die or das in front of it. Learn the two words as one word: der Hund, die Schule, das Buch."}, "questions": [{"id": "de11-core-words:q1", "level": "easy", "type": "mc", "q": "What does der Hund mean?", "options": ["the dog", "the house", "the bus", "the book"], "answer": "the dog", "hint": "You have just read this one in the example.", "explain": "der Hund means the dog. Hund is the noun and der is the small word that belongs with it, so the full answer is always der Hund and never Hund on its own.", "topic": "core vocabulary: recognising der Hund"}, {"id": "de11-core-words:q2", "level": "easy", "type": "mc", "q": "What does die Schule mean?", "options": ["the school", "the food", "the water", "the game"], "answer": "the school", "hint": "It is the place you go on Monday morning.", "explain": "die Schule means the school. Schule is a die word, so the pair of words you learn is die Schule.", "topic": "core vocabulary: recognising die Schule"}, {"id": "de11-core-words:q3", "level": "easy", "type": "mc", "q": "Which one of these means the bus?", "options": ["der Bus", "das Buch", "die Stadt", "der Hund"], "answer": "der Bus", "hint": "The German word looks almost the same as the English word.", "explain": "der Bus means the bus. das Buch is the book, die Stadt is the town and der Hund is the dog.", "topic": "core vocabulary: recognising der Bus"}, {"id": "de11-core-words:q4", "level": "easy", "type": "text", "q": "Write the German for the book. Include der, die or das.", "answer": "das Buch", "accept": ["das Buch", "das buch", "Das Buch"], "hint": "It is one of the six das words on the list.", "explain": "The answer is das Buch. Buch is a das word. Writing Buch on its own is only half the answer, and writing die Buch is the mistake you made in the summer.", "topic": "core vocabulary: producing das Buch with its gender"}, {"id": "de11-core-words:q5", "level": "medium", "type": "mc", "q": "Which small word goes in front of Schwester?", "options": ["der", "die", "das"], "answer": "die", "hint": "Schwester is on the die list with Schule, Stadt, Mutter, Musik and Pizza.", "explain": "It is die Schwester. Schwester is a die word, so the pair you learn is die Schwester, meaning the sister.", "topic": "core vocabulary: gender of die Schwester"}, {"id": "de11-core-words:q6", "level": "medium", "type": "text", "q": "Write the German for the football. Include der, die or das.", "answer": "der Fussball", "accept": ["der Fussball", "der Fußball", "der fussball", "der fußball", "Der Fussball", "Der Fußball"], "hint": "It is a der word. Write the double s as ss.", "explain": "The answer is der Fussball. You may also see it written with the special German letter that stands for a double s. Fussball is a der word, so der Fussball is the pair you learn.", "topic": "core vocabulary: producing der Fussball with its gender"}, {"id": "de11-core-words:q7", "level": "medium", "type": "mc", "q": "What does das Zimmer mean?", "options": ["the room", "the town", "the day", "the film"], "answer": "the room", "hint": "It is a part of a house.", "explain": "das Zimmer means the room. die Stadt is the town, der Tag is the day and der Film is the film.", "topic": "core vocabulary: recognising das Zimmer"}, {"id": "de11-core-words:q8", "level": "medium", "type": "text", "q": "Write the German for the dog. Include der, die or das.", "answer": "der Hund", "accept": ["der Hund", "der hund", "Der Hund"], "hint": "You met this one in the first example and in question 1.", "explain": "The answer is der Hund. Hund is a der word. This is the third time you have seen it today, which is the point.", "topic": "core vocabulary: producing der Hund with its gender"}, {"id": "de11-core-words:q9", "level": "stretch", "type": "mc", "q": "In a test in the summer you wrote die Buch. Which one is right?", "options": ["der Buch", "die Buch", "das Buch"], "answer": "das Buch", "hint": "Check the das list in the teaching part.", "explain": "It is das Buch. Buch is a das word, so die Buch and der Buch are both wrong. The noun was right in your test, the small word in front was not, and that is the habit this week is fixing.", "topic": "core vocabulary: correcting die Buch to das Buch"}, {"id": "de11-core-words:q10", "level": "stretch", "type": "text", "q": "In a test in the summer you wrote der Schule. Write the correct two words for the school.", "answer": "die Schule", "accept": ["die Schule", "die schule", "Die Schule"], "hint": "Schule is a die word.", "explain": "The answer is die Schule. You wrote der Schule, which is the right noun with the wrong small word. Schule is a die word, so die Schule is the only correct pair.", "topic": "core vocabulary: correcting der Schule to die Schule"}]}, "de12-verb-second": {"id": "de12-verb-second", "day": "Day 2", "subject": "German", "title": "The verb goes second", "minutes": 10, "objective": "Put the verb in second place in a simple German sentence and pick the right verb ending for ich, du and er or sie.", "extract": null, "teach": {"intro": ["German has one big rule, and this week you learn only this one. The verb is the second idea in the sentence.", "Second idea, not second word. In Ich spiele Fussball, idea one is Ich and idea two is spiele. The verb is exactly where it should be.", "The verb also swaps its ending depending on who is doing it. With ich the ending is e. With du the ending is st. With er or sie the ending is t.", "Here are your six verbs with those three endings. spielen: ich spiele, du spielst, er spielt. wohnen: ich wohne, du wohnst, er wohnt. lernen: ich lerne, du lernst, er lernt. trinken: ich trinke, du trinkst, er trinkt. machen: ich mache, du machst, er macht. hoeren: ich hoere, du hoerst, er hoert.", "Two more verbs refuse to follow that pattern, so you just learn them as they are. haben: ich habe, du hast, er hat. sein: ich bin, du bist, er ist.", "sein is how you say what something is like. Der Film ist gut. Das Spiel ist langweilig. The verb is still the second idea in both of those.", "In a test in the summer you wrote habent. There is no such word in German. It is ich habe."], "example": {"problem": "Build the German for I play football.", "steps": ["Who is doing it? Ich. That is idea one.", "The verb is spielen. The person is ich, so the ending is e, which gives spiele. That is idea two.", "Everything else goes after it. Here that is Fussball.", "Ich spiele Fussball.", "Now check the rule. Ich is first, spiele is second. The verb is the second idea, so it is right."], "answer": "Ich spiele Fussball."}, "example2": {"problem": "Build the German for you drink water.", "steps": ["Who is doing it? Du. Idea one.", "The verb is trinken. The person is du, so the ending is st, which gives trinkst. Idea two.", "The rest goes after: Wasser.", "Du trinkst Wasser.", "The wrong move here is Du trinke Wasser. The e ending belongs to ich, not to du, so with du it has to be trinkst."], "answer": "Du trinkst Wasser."}, "keyfact": "The verb is the second idea. ich takes e, du takes st, er and sie take t. Learn haben as ich habe, du hast, er hat, and sein as ich bin, du bist, er ist."}, "questions": [{"id": "de12-verb-second:q1", "level": "easy", "type": "mc", "q": "Fill the gap. Ich ___ Fussball.", "options": ["spiele", "spielst", "spielt"], "answer": "spiele", "hint": "With ich the verb ends in e.", "explain": "The answer is spiele. The person is ich, and with ich the ending is e, so Ich spiele Fussball. spielst belongs with du and spielt belongs with er or sie.", "topic": "verb second: ich ending with spielen"}, {"id": "de12-verb-second:q2", "level": "easy", "type": "mc", "q": "Fill the gap. Du ___ Fussball.", "options": ["spiele", "spielst", "spielt"], "answer": "spielst", "hint": "With du the verb ends in st.", "explain": "The answer is spielst. The person is du, and with du the ending is st, so Du spielst Fussball.", "topic": "verb second: du ending with spielen"}, {"id": "de12-verb-second:q3", "level": "easy", "type": "mc", "q": "Fill the gap. Er ___ Fussball.", "options": ["spiele", "spielst", "spielt"], "answer": "spielt", "hint": "With er the verb ends in t.", "explain": "The answer is spielt. The person is er, and with er or sie the ending is t, so Er spielt Fussball.", "topic": "verb second: er ending with spielen"}, {"id": "de12-verb-second:q4", "level": "easy", "type": "text", "q": "Fill the gap with one word. Ich ___ Wasser. The verb is trinken.", "answer": "trinke", "accept": ["trinke", "Trinke"], "hint": "Take trinken, drop the en, add the ich ending e.", "explain": "The answer is trinke. Start from trinken, take off the en to get trink, then add the ich ending e. That gives Ich trinke Wasser, with the verb as the second idea.", "topic": "verb second: ich ending with trinken"}, {"id": "de12-verb-second:q5", "level": "medium", "type": "mc", "q": "Which one is correct German?", "options": ["Ich habe", "Ich habent", "Ich hat", "Ich haben"], "answer": "Ich habe", "hint": "haben is one of the two verbs you learn by heart. Check the list.", "explain": "The answer is Ich habe. In a test in the summer you wrote habent, and there is no such word. The three forms are ich habe, du hast, er hat.", "topic": "verb second: correcting habent to ich habe"}, {"id": "de12-verb-second:q6", "level": "medium", "type": "text", "q": "Fill the gap with one word. Du ___ Deutsch. The verb is lernen.", "answer": "lernst", "accept": ["lernst", "Lernst"], "hint": "With du the ending is st.", "explain": "The answer is lernst. Take lernen, drop the en to get lern, then add the du ending st. That gives Du lernst Deutsch. Writing lerne would be the ich ending on the wrong person.", "topic": "verb second: du ending with lernen"}, {"id": "de12-verb-second:q7", "level": "medium", "type": "mc", "q": "Which sentence has the verb as the second idea?", "options": ["Ich spiele Fussball.", "Ich Fussball spiele.", "Fussball ich spiele.", "Spiele Fussball ich."], "answer": "Ich spiele Fussball.", "hint": "Count the ideas from the left and see where the verb lands.", "explain": "The answer is Ich spiele Fussball. Ich is idea one and spiele is idea two. In Ich Fussball spiele the verb has been pushed to third, and in Fussball ich spiele it is third again. That order is the single most common German mistake in English schools.", "topic": "verb second: choosing the correct word order"}, {"id": "de12-verb-second:q8", "level": "medium", "type": "text", "q": "Fill the gap with one word. Der Freund ___ in Wolverhampton. The verb is wohnen.", "answer": "wohnt", "accept": ["wohnt", "Wohnt"], "hint": "der Freund is one single person, so use the same ending as er.", "explain": "The answer is wohnt. der Freund is one single person, so it takes the same ending as er, which is t. Take wohnen, drop the en, add t. That gives Der Freund wohnt in Wolverhampton.", "topic": "verb second: t ending with a single noun subject"}, {"id": "de12-verb-second:q9", "level": "stretch", "type": "mc", "q": "Put these into a correct sentence: ich, Musik, hoere.", "options": ["Ich hoere Musik.", "Ich Musik hoere.", "Musik ich hoere.", "Hoere Musik ich."], "answer": "Ich hoere Musik.", "hint": "The person goes first and the verb must land in second place.", "explain": "The answer is Ich hoere Musik. Ich is idea one, hoere is idea two, Musik is the rest. Ich Musik hoere puts the verb third, which is the error to watch for.", "topic": "verb second: building a sentence with hoeren"}, {"id": "de12-verb-second:q10", "level": "stretch", "type": "text", "q": "Fill the gap with one word. Du ___ Pizza. The verb is machen.", "answer": "machst", "accept": ["machst", "Machst"], "hint": "With du the ending is st.", "explain": "The answer is machst. Take machen, drop the en to get mach, then add the du ending st. That gives Du machst Pizza. Writing macht would be the er ending put on du.", "topic": "verb second: du ending with machen"}]}, "de13-my-day": {"id": "de13-my-day", "day": "Day 3", "subject": "German", "title": "Saying what you do", "minutes": 10, "objective": "Write simple German statements in the order who, then verb, then the rest, including sentences that use ist to say what something is like.", "extract": null, "teach": {"intro": ["Today you say what you do. The order is who, then verb, then the rest. Nothing else changes.", "Ich wohne in Wolverhampton. Who is Ich, the verb is wohne, the rest is in Wolverhampton.", "You can also say what something is like. That uses sein, and for one single thing the form is ist. Die Schule ist langweilig. Der Hund ist klein.", "Useful words for the end of those sentences: gut, gross, klein, alt, neu, langweilig.", "More of exactly the same shape, all built from your twenty words. Der Film ist gut. Der Bus ist alt. Das Haus ist gross. Das Zimmer ist klein. Das Essen ist gut. Das Spiel ist langweilig. Die Stadt ist gross.", "When a noun is the one doing the action, it keeps the der, die or das it was born with. Der Hund ist klein, never Das Hund ist klein."], "example": {"problem": "Say I learn German.", "steps": ["Who: Ich.", "Verb: lernen. The person is ich, so the ending is e, giving lerne.", "The rest: Deutsch.", "Ich lerne Deutsch.", "Check the rule. Ich is first, lerne is second, so the verb is the second idea."], "answer": "Ich lerne Deutsch."}, "example2": {"problem": "Say the school is boring.", "steps": ["What is the sentence about? die Schule. Schule is a die word, so it starts Die Schule.", "Verb: sein. It is one single thing, so the form is ist.", "The rest: langweilig.", "Die Schule ist langweilig.", "The wrong move is Der Schule ist langweilig, which is the exact slip you made in the summer. Schule is a die word."], "answer": "Die Schule ist langweilig."}, "keyfact": "Who, then verb, then the rest. Use ist when you say what one single thing is like: Die Schule ist langweilig."}, "questions": [{"id": "de13-my-day:q1", "level": "easy", "type": "mc", "q": "Fill the gap. Ich ___ Suraj.", "options": ["bin", "bist", "ist"], "answer": "bin", "hint": "The three forms are ich bin, du bist, er ist.", "explain": "The answer is bin. With ich the form of sein is bin, so Ich bin Suraj.", "topic": "simple statements: ich bin"}, {"id": "de13-my-day:q2", "level": "easy", "type": "mc", "q": "Fill the gap. Der Hund ___ klein.", "options": ["bin", "bist", "ist"], "answer": "ist", "hint": "It is one single dog, not you and not me.", "explain": "The answer is ist. For one single thing like der Hund you use ist, so Der Hund ist klein.", "topic": "simple statements: ist with a single noun"}, {"id": "de13-my-day:q3", "level": "easy", "type": "mc", "q": "Fill the gap. Du ___ gut.", "options": ["bin", "bist", "ist"], "answer": "bist", "hint": "With du the form is bist.", "explain": "The answer is bist. With du the form of sein is bist, so Du bist gut.", "topic": "simple statements: du bist"}, {"id": "de13-my-day:q4", "level": "easy", "type": "text", "q": "Fill the gap with one word. Ich ___ in Wolverhampton. The verb is wohnen.", "answer": "wohne", "accept": ["wohne", "Wohne"], "hint": "With ich the ending is e.", "explain": "The answer is wohne. Take wohnen, drop the en, add the ich ending e. That gives Ich wohne in Wolverhampton, which is one of the five sentences you will own by Friday.", "topic": "simple statements: ich wohne in a place"}, {"id": "de13-my-day:q5", "level": "medium", "type": "mc", "q": "Which one means I play football?", "options": ["Ich spiele Fussball.", "Ich spielst Fussball.", "Ich Fussball spiele.", "Ich bin Fussball."], "answer": "Ich spiele Fussball.", "hint": "Check two things: the ending on the verb, and whether the verb is second.", "explain": "The answer is Ich spiele Fussball. Ich spielst has the du ending on ich. Ich Fussball spiele pushes the verb to third. Ich bin Fussball says I am football, which is not what you meant.", "topic": "simple statements: choosing a correct sentence with spielen"}, {"id": "de13-my-day:q6", "level": "medium", "type": "text", "q": "Fill the gap with one word. Die Schule ___ langweilig.", "answer": "ist", "accept": ["ist", "Ist"], "hint": "One single thing takes ist.", "explain": "The answer is ist. die Schule is one single thing, so the form of sein is ist, giving Die Schule ist langweilig.", "topic": "simple statements: ist with die Schule"}, {"id": "de13-my-day:q7", "level": "medium", "type": "mc", "q": "Which one means the house is big?", "options": ["Das Haus ist gross.", "Der Haus ist gross.", "Die Haus ist gross.", "Das Haus bist gross."], "answer": "Das Haus ist gross.", "hint": "Check the small word in front of Haus, then check the form of sein.", "explain": "The answer is Das Haus ist gross. Haus is a das word, so Der Haus and Die Haus are both wrong. bist belongs with du, never with das Haus.", "topic": "simple statements: gender of das Haus plus ist"}, {"id": "de13-my-day:q8", "level": "medium", "type": "text", "q": "Fill the gap with one word. Der Vater ___ Musik. The verb is hoeren.", "answer": "hoert", "accept": ["hoert", "hört", "Hoert", "Hört"], "hint": "der Vater is one single person, so use the same ending as er. Write the umlaut as oe.", "explain": "The answer is hoert. You may also see it written with two dots over the o. der Vater is one single person, so the ending is t. Take hoeren, drop the en, add t. That gives Der Vater hoert Musik.", "topic": "simple statements: t ending with a single noun subject and hoeren"}, {"id": "de13-my-day:q9", "level": "stretch", "type": "mc", "q": "Which one is correct German?", "options": ["Ich lerne Deutsch.", "Ich lernst Deutsch.", "Ich Deutsch lerne.", "Ich bin lerne Deutsch."], "answer": "Ich lerne Deutsch.", "hint": "The verb must have the ich ending and must be the second idea.", "explain": "The answer is Ich lerne Deutsch. lernst is the du ending on ich. Ich Deutsch lerne puts the verb third. Ich bin lerne Deutsch stacks two verbs together, which German does not do here.", "topic": "simple statements: choosing a correct sentence with lernen"}, {"id": "de13-my-day:q10", "level": "stretch", "type": "text", "q": "Fill the gap with one word. Die Schwester ___ Pizza. The verb is machen.", "answer": "macht", "accept": ["macht", "Macht"], "hint": "die Schwester is one single person, so use the same ending as er or sie.", "explain": "The answer is macht. die Schwester is one single person, so the ending is t, the same as er or sie. That gives Die Schwester macht Pizza.", "topic": "simple statements: t ending with a single noun subject"}]}, "de14-time-phrases": {"id": "de14-time-phrases", "day": "Day 4", "subject": "German", "title": "Starting with when", "minutes": 10, "objective": "Start a German sentence with a time phrase, keep the verb in second place, and move the person to third by boxing up each idea.", "extract": null, "teach": {"intro": ["Sometimes you want to start with when. Heute means today. Morgen means tomorrow. Am Montag means on Monday. Am Freitag, Am Samstag, and so on.", "The big rule does not change. The verb is still the second idea. So the when goes first, the verb goes second, and the person gets pushed along to third.", "The way to see it is to box up each idea. Am Montag is ONE box, even though it is two words. Then comes the verb box. Then comes the who box.", "Am Montag | habe | ich | Deutsch.", "The mistake nearly everyone makes is Am Montag ich habe Deutsch. Count the boxes there: Am Montag is one, ich is two, habe is three. The verb has slid to third, and it is wrong.", "So every time you start with when, stop and count your boxes before you write the verb.", "It works the same when the person is somebody else. Am Montag spielt der Bruder Fussball. Heute macht die Mutter Pizza. Am Freitag hoert der Vater Musik. Morgen lernt der Freund Deutsch. In every one of those the verb is still box two."], "example": {"problem": "Say on Monday I play football.", "steps": ["Box one is the when: Am Montag. Two words, but one single box.", "Box two has to be the verb. The verb is spielen and the person is ich, so it is spiele.", "Box three is who: ich.", "Then the rest: Fussball.", "Am Montag spiele ich Fussball.", "Count the boxes to check. Am Montag is one, spiele is two. The verb is in box two, so it is right."], "answer": "Am Montag spiele ich Fussball."}, "example2": {"problem": "Say today I listen to music.", "steps": ["Box one: Heute.", "Box two must be the verb: hoere.", "Box three: ich.", "Then the rest: Musik.", "Heute hoere ich Musik.", "The wrong move is Heute ich hoere Musik. Heute is one box and ich is another, so hoere has ended up in box three instead of box two."], "answer": "Heute hoere ich Musik."}, "keyfact": "Box up each idea. Am Montag is one box even though it is two words. Whatever starts the sentence, the verb is box two and the person moves to box three."}, "questions": [{"id": "de14-time-phrases:q1", "level": "easy", "type": "mc", "q": "How many boxes, or ideas, is Am Montag?", "options": ["one", "two", "three"], "answer": "one", "hint": "It is two words but it is a single idea, which is when.", "explain": "The answer is one. Am Montag is two words but one single idea, so it fills one box. That is why the verb comes straight after it.", "topic": "time phrases: boxing Am Montag as one idea"}, {"id": "de14-time-phrases:q2", "level": "easy", "type": "mc", "q": "Fill the gap. Heute ___ ich Fussball.", "options": ["spiele", "spielst", "spielt"], "answer": "spiele", "hint": "The person is still ich, so the ending is still e.", "explain": "The answer is spiele. Heute fills box one, the verb fills box two, and the person ich moves to box three. The person is ich, so the ending stays e, giving Heute spiele ich Fussball.", "topic": "time phrases: verb second after Heute"}, {"id": "de14-time-phrases:q3", "level": "easy", "type": "mc", "q": "In a German sentence that starts with a time phrase, what comes straight after that time phrase?", "options": ["the verb", "the person", "the rest of the sentence"], "answer": "the verb", "hint": "The verb is always the second idea, whatever goes first.", "explain": "The answer is the verb. The time phrase is box one, so box two is the verb, and only then does the person appear. Putting the person second is the mistake that has cost you marks before.", "topic": "time phrases: what follows a fronted time phrase"}, {"id": "de14-time-phrases:q4", "level": "easy", "type": "mc", "q": "Fill the gap. Am Montag ___ ich Deutsch.", "options": ["habe", "hast", "hat"], "answer": "habe", "hint": "The person is ich, and the three forms are ich habe, du hast, er hat.", "explain": "The answer is habe. The person is ich, so the form of haben is habe, giving Am Montag habe ich Deutsch. Note that habe sits in box two, straight after Am Montag.", "topic": "time phrases: haben with ich after a fronted time phrase"}, {"id": "de14-time-phrases:q5", "level": "medium", "type": "mc", "q": "Which one is correct German?", "options": ["Heute spiele ich Fussball.", "Heute ich spiele Fussball.", "Heute ich Fussball spiele.", "Spiele heute ich Fussball."], "answer": "Heute spiele ich Fussball.", "hint": "Count the boxes and find out where the verb lands.", "explain": "The answer is Heute spiele ich Fussball. Heute is box one and spiele is box two. In Heute ich spiele Fussball the verb has slid to box three, which is the error you have made repeatedly.", "topic": "time phrases: choosing correct order after Heute"}, {"id": "de14-time-phrases:q6", "level": "medium", "type": "text", "q": "Fill the gap with one word. Am Freitag ___ ich Musik. The verb is hoeren.", "answer": "hoere", "accept": ["hoere", "höre", "Hoere", "Höre"], "hint": "The person is ich, so the ending is e. Write the umlaut as oe.", "explain": "The answer is hoere. You may also see it written with two dots over the o. Am Freitag is box one, the verb is box two, ich is box three, so it is Am Freitag hoere ich Musik.", "topic": "time phrases: hoeren with ich after Am Freitag"}, {"id": "de14-time-phrases:q7", "level": "medium", "type": "mc", "q": "Which one is correct German?", "options": ["Morgen trinke ich Wasser.", "Morgen ich trinke Wasser.", "Morgen ich Wasser trinke.", "Trinke morgen ich Wasser."], "answer": "Morgen trinke ich Wasser.", "hint": "Morgen is box one, so the verb must be box two.", "explain": "The answer is Morgen trinke ich Wasser. Morgen fills box one, trinke fills box two and ich moves to box three. Morgen ich trinke Wasser puts the person in box two and the verb in box three.", "topic": "time phrases: choosing correct order after Morgen"}, {"id": "de14-time-phrases:q8", "level": "medium", "type": "text", "q": "Fill the gap with one word, the one that belongs in box two. Heute ___ ich Wasser. The verb is trinken.", "answer": "trinke", "accept": ["trinke", "Trinke"], "hint": "Box one is Heute, so box two is the verb with the ich ending.", "explain": "The answer is trinke. Heute is box one, so the verb goes in box two, and the ich ending is e. That gives Heute trinke ich Wasser.", "topic": "time phrases: trinken with ich after Heute"}, {"id": "de14-time-phrases:q9", "level": "stretch", "type": "mc", "q": "Put these into a correct sentence: ich, Am Montag, Deutsch, lerne.", "options": ["Am Montag lerne ich Deutsch.", "Am Montag ich lerne Deutsch.", "Am Montag Deutsch lerne ich.", "Lerne am Montag ich Deutsch."], "answer": "Am Montag lerne ich Deutsch.", "hint": "Am Montag is one box, so the verb has to come next.", "explain": "The answer is Am Montag lerne ich Deutsch. Am Montag is box one, lerne is box two, ich is box three and Deutsch is the rest. Am Montag ich lerne Deutsch is the version that keeps losing you marks.", "topic": "time phrases: building a sentence from Am Montag"}, {"id": "de14-time-phrases:q10", "level": "stretch", "type": "mc", "q": "Heute ich spiele Fussball. What is wrong with it?", "options": ["The verb is third and it has to be second.", "The verb is second and it has to be third.", "Fussball needs a der in front of it.", "Heute has to go at the end."], "answer": "The verb is third and it has to be second.", "hint": "Count the boxes: Heute, ich, spiele.", "explain": "The verb is third and it has to be second. Heute is box one and ich is box two, so spiele has been pushed into box three. The fix is to swap the verb and the person, giving Heute spiele ich Fussball.", "topic": "time phrases: spotting the verb third error"}]}, "de15-putting-together": {"id": "de15-putting-together", "day": "Day 5", "subject": "German", "title": "Five sentences you own", "minutes": 10, "objective": "Say and write five German sentences from memory, using only the twenty words, the eight verbs and the verb second rule from this week.", "extract": null, "teach": {"intro": ["Nothing new today. Five sentences, and by the end of ten minutes you can write all five without looking at anything.", "One. Ich spiele Fussball. Two. Ich wohne in Wolverhampton. Three. Die Schule ist langweilig. Four. Am Montag habe ich Deutsch. Five. Heute hoere ich Musik.", "Sentences one, two and three are the plain pattern: who, then verb, then the rest.", "Sentences four and five start with when, so the verb is still box two and ich gets pushed to box three. That is the only difference.", "Read all five out loud. Cover them up. Write them. Then check them letter by letter against the list. Five sentences you can produce beats eighty three per cent on a recognition test.", "Last job, and it is the same twenty words it has been all week: der Bus, der Hund, der Bruder, der Film, der Freund, der Vater, der Tag, der Fussball, die Schule, die Schwester, die Stadt, die Mutter, die Musik, die Pizza, das Haus, das Buch, das Spiel, das Essen, das Zimmer, das Wasser.", "Say all twenty out loud with the right small word in front of each. If you can do that and write the five sentences, this week has done its job."], "example": {"problem": "Write sentence four from memory: on Monday I have German.", "steps": ["Box one is the when: Am Montag.", "Box two is the verb. The person is ich and the verb is haben, so it is habe.", "Box three is the person: ich.", "Then the rest: Deutsch.", "Am Montag habe ich Deutsch.", "Check the boxes. Am Montag is one, habe is two. Correct."], "answer": "Am Montag habe ich Deutsch."}, "example2": {"problem": "Write sentence three from memory: the school is boring.", "steps": ["What it is about: die Schule. Schule is a die word, so it starts Die Schule.", "Verb: it is one single thing, so ist.", "The rest: langweilig.", "Die Schule ist langweilig.", "Check the small word. It is die Schule, not der Schule."], "answer": "Die Schule ist langweilig."}, "keyfact": "Five sentences, two patterns. Who, verb, rest. Or when, verb, who, rest."}, "questions": [{"id": "de15-putting-together:q1", "level": "easy", "type": "mc", "q": "Fill the gap in sentence one. Ich ___ Fussball.", "options": ["spiele", "spielst", "spielt"], "answer": "spiele", "hint": "With ich the ending is e.", "explain": "The answer is spiele. The person is ich, so the ending is e, giving Ich spiele Fussball.", "topic": "five sentences: ich spiele Fussball"}, {"id": "de15-putting-together:q2", "level": "easy", "type": "mc", "q": "Fill the gap in sentence two. Ich ___ in Wolverhampton.", "options": ["wohne", "wohnst", "wohnt"], "answer": "wohne", "hint": "With ich the ending is e.", "explain": "The answer is wohne. The person is ich, so the ending is e, giving Ich wohne in Wolverhampton.", "topic": "five sentences: ich wohne in Wolverhampton"}, {"id": "de15-putting-together:q3", "level": "easy", "type": "mc", "q": "Fill the gap in sentence three. Die Schule ___ langweilig.", "options": ["bin", "bist", "ist"], "answer": "ist", "hint": "One single thing takes ist.", "explain": "The answer is ist. die Schule is one single thing, so the form is ist, giving Die Schule ist langweilig.", "topic": "five sentences: Die Schule ist langweilig"}, {"id": "de15-putting-together:q4", "level": "easy", "type": "text", "q": "Fill the gap with one word. Am Montag ___ ich Deutsch. The verb is haben.", "answer": "habe", "accept": ["habe", "Habe"], "hint": "The person is ich, so it is habe. Not habent.", "explain": "The answer is habe. The person is ich, so the form of haben is habe. Am Montag is box one and habe is box two, giving Am Montag habe ich Deutsch.", "topic": "five sentences: Am Montag habe ich Deutsch"}, {"id": "de15-putting-together:q5", "level": "medium", "type": "text", "q": "Fill the gap with one word. Heute ___ ich Musik. The verb is hoeren.", "answer": "hoere", "accept": ["hoere", "höre", "Hoere", "Höre"], "hint": "The person is ich, so the ending is e. Write the umlaut as oe.", "explain": "The answer is hoere. You may also see it written with two dots over the o. Heute is box one, the verb is box two and ich moves to box three, giving Heute hoere ich Musik.", "topic": "five sentences: Heute hoere ich Musik"}, {"id": "de15-putting-together:q6", "level": "medium", "type": "mc", "q": "Which one is sentence four written correctly?", "options": ["Am Montag habe ich Deutsch.", "Am Montag ich habe Deutsch.", "Am Montag ich Deutsch habe.", "Habe am Montag ich Deutsch."], "answer": "Am Montag habe ich Deutsch.", "hint": "Am Montag is one box, so the verb comes next.", "explain": "The answer is Am Montag habe ich Deutsch. Am Montag is box one, habe is box two, ich is box three. Am Montag ich habe Deutsch puts the person in box two and the verb in box three.", "topic": "five sentences: correct order in Am Montag habe ich Deutsch"}, {"id": "de15-putting-together:q7", "level": "medium", "type": "mc", "q": "Which two words go together for the school?", "options": ["die Schule", "der Schule", "das Schule"], "answer": "die Schule", "hint": "Schule is a die word.", "explain": "The answer is die Schule. Schule is a die word. You wrote der Schule in the summer, and that is the one to keep checking.", "topic": "five sentences: gender of die Schule"}, {"id": "de15-putting-together:q8", "level": "medium", "type": "text", "q": "Write the German for the brother. Include der, die or das.", "answer": "der Bruder", "accept": ["der Bruder", "der bruder", "Der Bruder"], "hint": "Bruder is on the der list with Bus, Hund, Film, Freund, Vater and Tag.", "explain": "The answer is der Bruder. Bruder is a der word, so the pair you learn is der Bruder. You have seen it every day this week in the word list.", "topic": "five sentences: producing der Bruder with its gender"}, {"id": "de15-putting-together:q9", "level": "stretch", "type": "mc", "q": "Which one is sentence five written correctly?", "options": ["Heute hoere ich Musik.", "Heute ich hoere Musik.", "Heute hoere Musik ich.", "Heute Musik hoere ich."], "answer": "Heute hoere ich Musik.", "hint": "Heute is box one, the verb is box two, then the person.", "explain": "The answer is Heute hoere ich Musik. Heute is box one, hoere is box two, ich is box three, Musik is the rest. Heute ich hoere Musik is the version where the verb has slid to third.", "topic": "five sentences: correct order in Heute hoere ich Musik"}, {"id": "de15-putting-together:q10", "level": "stretch", "type": "text", "q": "In Am Montag habe ich Deutsch, write the one word that is the second idea.", "answer": "habe", "accept": ["habe", "Habe"], "hint": "Am Montag is the first idea, all on its own.", "explain": "The answer is habe. Am Montag is the first idea, so habe is the second, and that is exactly why it sits there. If you answered ich you counted Montag as its own idea, and Am Montag is one box.", "topic": "five sentences: identifying the second idea"}]}}, "tests": {"w5-test": {"bands": [{"label": "Warm up", "extract": null, "questions": [{"id": "w5-test:t1", "type": "text", "q": "A stand holds 90 seats. Work out 10% of 90 seats.", "answer": "9", "accept": ["9", "9.0", "nine", "9 seats"], "hint": "", "explain": "The answer is 9 seats. To find 10% you divide by 10, so 90 / 10 = 9. Check it. Ten lots of 9 is 90, which is the number you started with.", "topic": "maths: percentage of an amount, forwards"}, {"id": "w5-test:t2", "type": "text", "q": "A triangle has an area of 18 cm^2 and a base of 6 cm. Find the perpendicular height in cm.", "answer": "6", "accept": ["6", "6 cm", "6cm", "6.0", "six"], "hint": "", "explain": "The height is 6 cm. Forward rule: area = base x height / 2, so 18 = 6 x height / 2. Double both sides: 36 = 6 x height. Divide by 6: height = 6 cm. Check it forwards. 6 x 6 / 2 = 18, the area you were given. Stopping at 36 and calling that the height is the usual slip, because a height of 36 would give an area of 6 x 36 / 2 = 108, not 18.", "topic": "working backwards: triangle area to find a height"}, {"id": "w5-test:t3", "type": "text", "q": "Squash is mixed to water in the ratio 1:4. There are 3 ml of squash. How many ml is the whole drink?", "answer": "15", "accept": ["15", "15 ml", "15ml", "15.0", "fifteen"], "hint": "", "explain": "The answer is 15 ml. Squash is 1 part and it measures 3 ml, so one part is 3 ml. The drink is 1 + 4 = 5 parts, so the total is 5 x 3 = 15 ml. Check it forwards. Split 15 ml into 5 parts of 3 ml and the squash is 3 ml, which is what you were given. Treating the 3 ml as the total instead of as one share is the trap.", "topic": "working backwards: ratio to find a total from one share"}, {"id": "w5-test:t4", "type": "text", "q": "A 4 litre carrier is poured into bottles holding 1/2 a litre each. How many bottles does it fill?", "answer": "8", "accept": ["8", "8 bottles", "8.0", "eight"], "hint": "", "explain": "The answer is 8 bottles. The forward version is bottles x 1/2 = 4, so undo the multiply by dividing: 4 / (1/2) = 4 x 2 = 8. Check it forwards. 8 bottles of 1/2 a litre is 8 x 1/2 = 4 litres, which is the carrier you started with. Dividing by a number smaller than 1 makes the answer bigger, so 8 being larger than 4 is right, not a mistake.", "topic": "working backwards: division by a fraction to find how many pieces"}, {"id": "w5-test:t5", "type": "text", "q": "A rucksack has a mass of 4 kg. Using weight = mass x 10, what is its weight in N?", "answer": "40", "accept": ["40", "40 N", "40N", "40.0", "forty", "40 newtons"], "hint": "", "explain": "The answer is 40 N. Weight = mass x 10, so 4 x 10 = 40 N. This one goes forwards, so there is nothing to undo. Check it backwards. 40 / 10 = 4 kg, which is the mass you were given. Mass is in kg and weight is a force, so the unit has to be N.", "topic": "science: weight from mass using weight = mass x 10"}, {"id": "w5-test:t6", "type": "mc", "q": "A catapult band is pulled back and held. Which energy store is filling up?", "options": ["Elastic potential store", "Thermal store", "Chemical store", "Nuclear store"], "answer": "Elastic potential store", "hint": "", "explain": "It is the elastic potential store. Stretching or squashing anything springy fills its elastic potential store, and that store empties again when the band is released. Chemical is for fuel and food, thermal is about how hot something is, and nuclear is nowhere near a catapult.", "topic": "science: the energy store filled by stretching"}, {"id": "w5-test:t7", "type": "text", "q": "Write the German for the school, including der, die or das.", "answer": "die Schule", "accept": ["die Schule", "die schule", "Die Schule"], "hint": "", "explain": "The answer is die Schule. Schule is a die word, so die Schule is the only correct pair. der Schule is the right noun with the wrong small word in front, and it scores nothing.", "topic": "german: producing die Schule with its gender"}, {"id": "w5-test:t8", "type": "mc", "q": "In an analytical paragraph, which of these three parts comes first?", "options": ["The point", "The evidence", "The explanation"], "answer": "The point", "hint": "", "explain": "The point comes first. You cannot prove an idea you have not stated yet, so the point goes first, the short quotation second, and the explanation last. The explanation is where most of the marks sit.", "topic": "english: the order of point, evidence and explanation"}, {"id": "w5-test:t9", "type": "mc", "q": "Water vapour cools high in the air and turns back into tiny drops. Which step is that?", "options": ["Condensation", "Evaporation", "Precipitation", "Transpiration"], "answer": "Condensation", "hint": "", "explain": "It is condensation. Condensation is gas turning into liquid, which is what happens when water vapour cools and forms cloud droplets. Evaporation is the other way round, liquid turning into gas, and that is the step where the sun heats a lake. Precipitation is the water falling as rain.", "topic": "retrieval: naming condensation rather than evaporation"}, {"id": "w5-test:t10", "type": "text", "q": "A triangle has a base of 8 cm and a perpendicular height of 5 cm. Work out the area in cm^2.", "answer": "20", "accept": ["20", "20 cm2", "20 cm^2", "20cm2", "20.0", "twenty"], "hint": "", "explain": "The answer is 20 cm^2. Area = base x height / 2, so 8 x 5 = 40 and 40 / 2 = 20. This one goes forwards, because the missing number is the area and the area is the result of the rule. Check it. Halving is the last move, so the answer should be half of 40, and 20 is.", "topic": "maths: triangle area from base and height, forwards"}]}, {"label": "Harder", "extract": null, "questions": [{"id": "w5-test:t11", "type": "text", "q": "A coat is reduced by 25% in a sale. It now costs 45 pounds. What was the price before the sale, in pounds?", "answer": "60", "accept": ["60", "60 pounds", "60.00", "60.0", "sixty"], "hint": "", "explain": "The answer is 60 pounds. 25% came off, so 45 pounds is 100 - 25 = 75% of the old price. 1% is 45 / 75 = 0.6 pounds, so 100% is 100 x 0.6 = 60 pounds. Check it forwards. 25% of 60 is 15, and 60 - 15 = 45 pounds, which is the sale price you were given. Taking 25% off the 45 is the forward move done again on a number that was already the finished answer.", "topic": "working backwards: reverse percentage after a discount"}, {"id": "w5-test:t12", "type": "text", "q": "A cyclist rides 240 m at a steady speed of 6 m/s. How many seconds does it take?", "answer": "40", "accept": ["40", "40 s", "40s", "40.0", "forty", "40 seconds"], "hint": "", "explain": "The answer is 40 s. Forward rule: speed = distance / time, so 6 = 240 / time. The number you want is underneath, so undo it one step at a time. Multiply both sides by time: 6 x time = 240. Divide both sides by 6: time = 240 / 6 = 40 s. Check it forwards. 240 / 40 = 6 m/s, which is the speed you were given. Multiplying to get 240 x 6 = 1440 is the wrong move, and the check kills it because 240 / 1440 is nowhere near 6.", "topic": "working backwards: speed rule rearranged to find time"}, {"id": "w5-test:t13", "type": "mc", "q": "A sequence goes 6, 11, 16, 21 and keeps rising in 5s. Is 51 a term in it?", "options": ["Yes, it is the 10th term.", "No, because 51 is not in the 5 times table.", "Yes, it is the 51st term.", "No, because the sequence stops at 21."], "answer": "Yes, it is the 10th term.", "hint": "", "explain": "Yes, 51 is the 10th term. The terms rise in 5s from 6, so the rule is term = 5n + 1. You have been given the term and asked for its position, so undo the rule. 51 - 1 = 50, and 50 / 5 = 10, which is a whole number, so 51 is the 10th term. Check it forwards. 5 x 10 + 1 = 51, the number you were given. If that division had not given a whole number, 51 would not be in the sequence at all.", "topic": "working backwards: testing whether a number is a term in a sequence"}, {"id": "w5-test:t14", "type": "text", "q": "Porridge uses oats to water in the ratio 2:3. You use 6 cups of oats. How many cups of water do you need?", "answer": "9", "accept": ["9", "9 cups", "9.0", "nine"], "hint": "", "explain": "The answer is 9 cups of water. Oats are 2 parts and you used 6 cups, so one part is 6 / 2 = 3 cups. Water is 3 parts, so water is 3 x 3 = 9 cups. Check it. The mix is 6 cups of oats to 9 cups of water, and 6:9 cancels down to 2:3, which is the ratio you were given.", "topic": "maths: scaling a ratio to find the other share, forwards"}, {"id": "w5-test:t15", "type": "text", "q": "Simplify this expression: 6y - 2 - 4y + 7.", "answer": "2y + 5", "accept": ["2y + 5", "2y+5", "5 + 2y", "5+2y", "2y plus 5"], "hint": "", "explain": "The answer is 2y + 5. Mark the signs first: +6y, -2, -4y, +7. The y terms are like terms, so 6y - 4y = 2y. The plain numbers are like terms, so -2 + 7 = 5. That gives 2y + 5. You cannot go further, because 2y and 5 are not like terms.", "topic": "maths: signs when collecting like terms"}, {"id": "w5-test:t16", "type": "text", "q": "A crate presses down with a force of 900 N on an area of 3 m^2. Work out the pressure in N/m^2.", "answer": "300", "accept": ["300", "300 N/m^2", "300N/m^2", "300 N/m2", "300.0", "three hundred"], "hint": "", "explain": "The answer is 300 N/m^2. Pressure = force / area, so 900 / 3 = 300 N/m^2. This one goes forwards, because the pressure is the result of the rule and it is the missing number, so there is nothing to undo. Check it backwards. 900 / 300 = 3 m^2, which is the area you were given.", "topic": "science: pressure from force and area, forwards"}, {"id": "w5-test:t17", "type": "mc", "q": "Two pupils use the same quotation, 'Yeah'. Which sentence explains the writer's method?", "options": ["The writer gives the boy one word where a full answer belongs, so the silence carries the meaning.", "This shows the boy is tired and does not want to talk.", "After the question the boy looks out of the window and says nothing.", "The boy is upset because he was not picked for the team."], "answer": "The writer gives the boy one word where a full answer belongs, so the silence carries the meaning.", "hint": "", "explain": "The first sentence explains the method. It names the decision the writer made, which was to put one word where a sentence belongs, and then says what that decision does to the reader. The second sentence reports a mood, and a mood is not a method. The third retells what happens next. The fourth explains the plot. All three of those could be written by someone who had only been told the story, which is the test for retelling.", "topic": "english: writer's method rather than character mood"}, {"id": "w5-test:t18", "type": "mc", "q": "Fill the gap. Du ___ Wasser.", "options": ["trinke", "trinkst", "trinkt"], "answer": "trinkst", "hint": "", "explain": "The answer is trinkst. The person is du, and with du the ending is st, so Du trinkst Wasser. trinke is the ich ending and trinkt is the er ending.", "topic": "german: du ending with trinken"}, {"id": "w5-test:t19", "type": "mc", "q": "Which year was the Battle of Hastings?", "options": ["1066", "1215", "1485", "1666"], "answer": "1066", "hint": "", "explain": "It was 1066. That is the Norman conquest, when William of Normandy beat Harold. 1215 is Magna Carta, 1485 is Bosworth and the end of the Wars of the Roses, and 1666 is the Great Fire of London.", "topic": "retrieval: dating the Norman conquest"}, {"id": "w5-test:t20", "type": "mc", "q": "Fill the gap. Heute ___ ich Musik.", "options": ["hoere", "hoerst", "hoert"], "answer": "hoere", "hint": "", "explain": "The answer is hoere. Heute is box one, so the verb has to be box two, and ich moves to box three. The person is still ich, so the ending is still e. That gives Heute hoere ich Musik.", "topic": "german: verb second after Heute"}]}], "title": "Weekly test", "note": "Twenty questions, twenty minutes. Everything from this week. No hints, no notes, no phone in the room. One rule: never leave one blank. A wrong answer costs the same as a blank and tells us more."}}, "days": [{"key": "d1", "label": "Day 1", "date": "", "blocks": [{"id": "wu1-warmup", "kind": "lesson", "mins": 5}, {"id": "m21-backwards-context", "kind": "lesson", "mins": 20}, {"id": "de11-core-words", "kind": "lesson", "mins": 10}]}, {"key": "d2", "label": "Day 2", "date": "", "blocks": [{"id": "wu2-warmup", "kind": "lesson", "mins": 5}, {"id": "e13-analytical-para", "kind": "lesson", "mins": 20}, {"id": "de12-verb-second", "kind": "lesson", "mins": 10}]}, {"key": "d3", "label": "Day 3", "date": "", "blocks": [{"id": "wu3-warmup", "kind": "lesson", "mins": 5}, {"id": "m22-backwards-mixed", "kind": "lesson", "mins": 20}, {"id": "de13-my-day", "kind": "lesson", "mins": 10}]}, {"key": "d4", "label": "Day 4", "date": "", "blocks": [{"id": "wu4-warmup", "kind": "lesson", "mins": 5}, {"id": "s10-forces-energy-recap", "kind": "lesson", "mins": 20}, {"id": "de14-time-phrases", "kind": "lesson", "mins": 10}]}, {"key": "d5", "label": "Day 5", "date": "", "blocks": [{"id": "wu5-warmup", "kind": "lesson", "mins": 5}, {"id": "w5-test", "kind": "test", "mins": 20}, {"id": "de15-putting-together", "kind": "lesson", "mins": 10}, {"id": "review", "kind": "review", "mins": 15}]}], "books": ["Stormbreaker (Alex Rider) - Anthony Horowitz", "Percy Jackson: The Lightning Thief - Rick Riordan", "Holes - Louis Sachar", "Skulduggery Pleasant - Derek Landy", "Other"], "pools": {"m21-backwards-context": [{"id": "m21-backwards-context:r-m21-1", "level": "medium", "type": "text", "q": "A triangular sign has an area of 42 cm^2 and a base of 14 cm. Work out the perpendicular height in cm.", "answer": "6", "accept": ["6", "6 cm", "6cm", "6.0", "six"], "hint": "Write the forward rule first, then undo it one step at a time.", "explain": "The height is 6 cm. Forward rule: area = base x height / 2, so 42 = 14 x height / 2. Double both sides: 84 = 14 x height. Divide both sides by 14: height = 6 cm. The error to watch is stopping at 84 and calling it the height. 84 is base x height, not height. Check it forwards: 14 x 6 / 2 = 42, the area you were given.", "topic": "working backwards: triangle area to find a height"}, {"id": "m21-backwards-context:r-m21-2", "level": "medium", "type": "text", "q": "A fruit drink mixes juice to water in the ratio 3:7. There are 12 ml of juice. How many ml is the whole drink?", "answer": "40", "accept": ["40", "40 ml", "40ml", "40.0", "forty"], "hint": "The 12 ml is one share, not the total. Find one part first.", "explain": "The answer is 40 ml. Juice is 3 parts and it measures 12 ml, so one part is 12 / 3 = 4 ml. The drink is 3 + 7 = 10 parts, so the total is 10 x 4 = 40 ml. The misconception here is treating the 12 ml as the total. Check it forwards: juice is 3 x 4 = 12 ml and water is 7 x 4 = 28 ml, and 12 + 28 = 40 ml.", "topic": "working backwards: ratio to find a total from one share"}, {"id": "m21-backwards-context:r-m21-3", "level": "medium", "type": "text", "q": "A cable is 8 metres long. It is cut into pieces that are each 4/5 of a metre long. How many pieces are there?", "answer": "10", "accept": ["10", "10 pieces", "10.0", "ten"], "hint": "Dividing by 4/5 is the same as multiplying by 5/4.", "explain": "The answer is 10 pieces. The forward version is pieces x 4/5 = 8, so undo the multiply by dividing: 8 / (4/5) = 8 x 5/4 = 40/4 = 10. Dividing by a number smaller than 1 makes the answer bigger, so 10 being larger than 8 is correct and not a mistake. Check it forwards: 10 x 4/5 = 40/5 = 8 metres, the cable you were given.", "topic": "working backwards: division by a fraction to find how many pieces"}, {"id": "m21-backwards-context:r-m21-4", "level": "medium", "type": "text", "q": "12% of the tickets for a match are unsold. That is 36 tickets. How many tickets are there altogether?", "answer": "300", "accept": ["300", "300 tickets", "300.0", "three hundred"], "hint": "36 is 12%, so get to 1% first, then go up to 100%.", "explain": "The answer is 300 tickets. 36 tickets is 12%, so 1% is 36 / 12 = 3 tickets, and 100% is 100 x 3 = 300 tickets. The wrong move is 36 x 12 = 432, which treats the percentage as a multiplier. Check it forwards: 12% of 300 is 0.12 x 300 = 36, the number you were given.", "topic": "working backwards: reverse percentage to find the whole"}, {"id": "m21-backwards-context:r-m21-5", "level": "medium", "type": "text", "q": "A triangular flag has an area of 70 m^2 and a perpendicular height of 20 m. Work out the length of the base in m.", "answer": "7", "accept": ["7", "7 m", "7m", "7.0", "seven"], "hint": "Same rule, but this time the height is the number you already have.", "explain": "The base is 7 m. Forward rule: area = base x height / 2, so 70 = base x 20 / 2. Double both sides: 140 = base x 20. Divide both sides by 20: base = 7 m. Do not divide by the area, and do not stop at 140. Check it forwards: 7 x 20 / 2 = 70 m^2, the area you were given.", "topic": "working backwards: triangle area to find a base"}, {"id": "m21-backwards-context:r-m21-6", "level": "stretch", "type": "mc", "q": "Mark this answer. Question: a triangle has an area of 45 cm^2 and a base of 18 cm, work out the perpendicular height. Student: 45 x 2 = 90, so the height is 90 cm. What went wrong?", "options": ["Doubling to 90 was allowed, but they stopped there. 90 is base x height, so the height is 90 / 18 = 5 cm.", "They should never double the area. The height is 45 / 18 = 2.5 cm.", "Nothing went wrong, the height really is 90 cm.", "They should have halved instead, so the height is 45 / 2 = 22.5 cm."], "answer": "Doubling to 90 was allowed, but they stopped there. 90 is base x height, so the height is 90 / 18 = 5 cm.", "hint": "Write 45 = 18 x height / 2 and double both sides. What exactly does the 90 equal?", "explain": "The first move is fine. Area = base x height / 2, so 45 = 18 x height / 2, and doubling both sides gives 90 = 18 x height. The mistake is calling 90 the height when 90 is base x height. Divide by the base: height = 90 / 18 = 5 cm. This is the exact misconception you keep repeating, so use the check every time: if the height were 90, the area would be 18 x 90 / 2 = 810, not 45.", "topic": "working backwards: spotting the error of stopping after doubling the area"}], "m22-backwards-mixed": [{"id": "m22-backwards-mixed:r-m22-1", "level": "medium", "type": "text", "q": "A triangular window has an area of 63 cm^2 and a base of 21 cm. Work out the perpendicular height in cm.", "answer": "6", "accept": ["6", "6 cm", "6cm", "6.0", "six"], "hint": "The area is given and the height is missing, so this one goes backwards.", "explain": "The height is 6 cm. The missing number sits inside the rule, so go backwards. 63 = 21 x height / 2. Double both sides: 126 = 21 x height. Divide by 21: height = 6 cm. Stopping at 126 is the slip. Check it forwards: 21 x 6 / 2 = 63, the area you were given.", "topic": "backwards: triangle area to find a height"}, {"id": "m22-backwards-mixed:r-m22-2", "level": "easy", "type": "text", "q": "A triangle has a base of 14 cm and a perpendicular height of 5 cm. Work out the area in cm^2.", "answer": "35", "accept": ["35", "35 cm2", "35 cm^2", "35cm2", "35.0", "thirty five", "thirty-five"], "hint": "Multiply the base by the height, then halve it.", "explain": "The answer is 35 cm^2. The missing number is the area, and the area is the result of the rule, so this one goes forwards and there is nothing to undo. 14 x 5 = 70, then 70 / 2 = 35. Doubling instead of halving is the error, and it gives 140, which is four times too big.", "topic": "forwards: triangle area from base and height"}, {"id": "m22-backwards-mixed:r-m22-3", "level": "medium", "type": "text", "q": "60% of the seats on a coach are taken. That is 30 seats. How many seats are on the coach?", "answer": "50", "accept": ["50", "50 seats", "50.0", "fifty"], "hint": "30 is 60%, so find 10% first by dividing by 6.", "explain": "The answer is 50 seats. 30 seats is 60%, so 10% is 30 / 6 = 5 seats, and 100% is 10 x 5 = 50 seats. Finding 60% of 30 instead gives 18, and that is the forward move done a second time on a number that was already the finished answer. Check it forwards: 60% of 50 is 0.6 x 50 = 30, the number you were given.", "topic": "backwards: reverse percentage to find the whole"}, {"id": "m22-backwards-mixed:r-m22-4", "level": "medium", "type": "mc", "q": "A sequence goes 3, 10, 17, 24 and keeps rising in 7s. Is 60 a term in it?", "options": ["No. Take away the 3 you started from: 60 - 3 = 57, and 57 does not divide exactly by 7.", "Yes, it is the 9th term.", "Yes, because 60 is bigger than 24.", "No, because every term in the sequence is odd."], "answer": "No. Take away the 3 you started from: 60 - 3 = 57, and 57 does not divide exactly by 7.", "hint": "Undo the rule. Take away the first term, then divide by the step, and see whether you get a whole number.", "explain": "The answer is no. The terms rise in 7s from 3, so undo that: 60 - 3 = 57, and 57 / 7 = 8.142..., which is not a whole number, so 60 is not a term. Being bigger than the terms you can see is not a reason either way. The sequence is 3, 10, 17, 24, 31, 38, 45, 52, 59, 66, so it steps straight over 60, and the 9th term is 59, not 60. The terms are not all odd, because 10 is in the list.", "topic": "backwards: testing whether a number is a term in a sequence"}, {"id": "m22-backwards-mixed:r-m22-5", "level": "medium", "type": "mc", "q": "Do not work anything out. Which direction does this question go? A pair of boots costs 36 pounds after 40% was taken off. What was the price before?", "options": ["Backwards, because the finished price is given and the starting price is the missing number.", "Forwards, because you take 40% off the 36 pounds.", "Forwards, because there is a percentage in it.", "Backwards, because the answer has to be smaller than 36 pounds."], "answer": "Backwards, because the finished price is given and the starting price is the missing number.", "hint": "The 36 pounds is the answer to the forward question, not the start of it.", "explain": "This goes backwards. The forward rule is old price minus 40% of it = new price, and here the new price is handed to you while the old price is missing. Taking 40% off the 36 gives 21.60, which is the forward move done again on a number that is already finished. A reverse percentage answer after a discount is always bigger than the sale price, never smaller, so the last option picks the right direction for the wrong reason.", "topic": "direction check: classifying a reverse percentage question"}, {"id": "m22-backwards-mixed:r-m22-6", "level": "stretch", "type": "text", "q": "A rope is cut into pieces that are each 3/4 of a metre long. It makes exactly 12 pieces with none left over. How long was the rope in metres?", "answer": "9", "accept": ["9", "9 m", "9m", "9.0", "nine"], "hint": "You have the number of pieces and you want the total, so multiply this time.", "explain": "The answer is 9 metres. Here you are given the number of pieces and asked for the total, which is the division run backwards, so you multiply: 12 x 3/4 = 36/4 = 9 metres. Dividing 12 by 3/4 gives 16, and 16 metres of rope would make more than 12 pieces. Check it forwards: 9 / (3/4) = 9 x 4/3 = 12 pieces, the number you were given.", "topic": "backwards: undoing a division by a fraction to find the total"}], "e13-analytical-para": [{"id": "e13-analytical-para:r-e13-1", "level": "easy", "type": "mc", "q": "You have written your point and then your short quotation. What has to come next?", "options": ["An explanation of the writer's choice and its effect", "A second quotation", "A sentence saying what happens next in the story", "A summary of the whole extract"], "answer": "An explanation of the writer's choice and its effect", "hint": "Point, evidence, explanation. You have done two of the three.", "explain": "The explanation comes next. Point, then evidence, then explanation, and the explanation is where nearly all the marks sit. Saying what happens next in the story is retelling, which is the habit that keeps costing you marks even when everything you write is true.", "topic": "analytical paragraph: the order of point, evidence and explanation"}, {"id": "e13-analytical-para:r-e13-2", "level": "medium", "type": "mc", "q": "Which one of these is analysis rather than retelling?", "options": ["The writer has the goalkeeper check his gloves 'for the fourth time', so the repeated checking shows a boy filling time he cannot control.", "The goalkeeper stands on the line and checks his gloves before the penalty.", "After the whistle the goalkeeper dives the wrong way and the ball goes in.", "The goalkeeper is nervous because the penalty will decide the match."], "answer": "The writer has the goalkeeper check his gloves 'for the fourth time', so the repeated checking shows a boy filling time he cannot control.", "hint": "Three of them could be written by someone who had only been told the plot.", "explain": "The first one is the analysis, because it is the only one that says the writer has him do it, so the action is treated as somebody's decision rather than an event. The second and third report what happens in order. The fourth reports a feeling. All three of those are true and all three score nothing, and that is the trap.", "topic": "analysis versus retelling: identifying the analytical sentence"}, {"id": "e13-analytical-para:r-e13-3", "level": "easy", "type": "text", "q": "Name the technique in this line: 'the coach's voice was like a door slamming'. One word.", "answer": "simile", "accept": ["simile", "a simile", "Simile", "simile.", "similie", "it is a simile"], "hint": "The word like is comparing one thing to another.", "explain": "It is a simile. A simile compares two things using like or as, and here a voice is compared to a door slamming. Naming it is only the first mark. The mark that pays comes from saying what the comparison does, which is to make the voice sound final, as though the conversation is already shut.", "topic": "technique naming: simile in a line of the extract"}, {"id": "e13-analytical-para:r-e13-4", "level": "medium", "type": "text", "q": "In this line, 'the cold gnawed at his fingers', copy out the single verb that makes the cold sound like an animal.", "answer": "gnawed", "accept": ["gnawed", "'gnawed'", "gnawed.", "the verb gnawed", "Gnawed"], "hint": "Which one word in that line belongs to animals rather than to weather?", "explain": "The verb is 'gnawed'. Gnawing is something an animal does with its teeth, so the writer turns the cold into a living thing that is working on him rather than a temperature he happens to be in. Copying the whole line instead of the one verb is the usual slip, because a long quotation gives you too much to talk about.", "topic": "word level analysis: identifying the verb that carries the effect"}, {"id": "e13-analytical-para:r-e13-5", "level": "stretch", "type": "mc", "q": "A pupil writes: The writer shows the town is dying. The shops 'stood with their windows boarded up'. This is personification. What is missing?", "options": ["It names the technique but never says what the personification does to the reader", "Nothing is missing, because naming the technique is the analysis", "It needs a second quotation to support the first one", "It needs a sentence saying what happens next"], "answer": "It names the technique but never says what the personification does to the reader", "hint": "Naming a technique is a label. A label is not an explanation.", "explain": "The paragraph stops one sentence too early. It has a point, a short quotation and the right technique name, and then it stops, so the reader is never told what the personification does. The missing sentence is something like: giving the shops the power to stand makes them into people who have given up, so the street is emptied of life without one person being mentioned. Adding what happens next would make it worse, because that is retelling.", "topic": "explanation quality: naming a technique without explaining its effect"}, {"id": "e13-analytical-para:r-e13-6", "level": "medium", "type": "mc", "q": "Both sentences use the same quotation, 'Fine'. Which one explains the writer's method?", "options": ["The writer gives her one word where a full answer belongs, so the reader hears the gap instead of the truth.", "This quotation shows that she is angry and does not want to talk.", "She says 'Fine' and then walks out of the kitchen.", "She is upset because nobody asked her how the day went."], "answer": "The writer gives her one word where a full answer belongs, so the reader hears the gap instead of the truth.", "hint": "Look for the sentence that names a decision, not a mood.", "explain": "The first sentence explains the method. It names what the writer did, which was to put one word where a sentence belongs, then says what that does to the reader. The second names a mood, and a mood is not a method. The third retells. The fourth explains the plot. That difference between a mood and a method is the jump from a grade 6 to a grade 9, and it costs no extra writing time.", "topic": "analysis versus retelling: writer's method rather than character mood"}], "s10-forces-energy-recap": [{"id": "s10-forces-energy-recap:r-s10-1", "level": "medium", "type": "text", "q": "A swimmer covers 150 m at a steady speed of 3 m/s. How many seconds does it take?", "answer": "50", "accept": ["50", "50 s", "50s", "50.0", "fifty", "50 seconds"], "hint": "Speed = distance / time. The time is underneath, so it takes two undoing steps.", "explain": "The answer is 50 s. Forward rule: speed = distance / time, so 3 = 150 / time. Multiply both sides by time: 3 x time = 150. Divide both sides by 3: time = 150 / 3 = 50 s. Multiplying to get 150 x 3 = 450 is the wrong move here. Self check: 150 / 50 = 3 m/s, the speed you were given.", "topic": "working backwards: speed rule rearranged to find time"}, {"id": "s10-forces-energy-recap:r-s10-2", "level": "medium", "type": "text", "q": "A barrel has a weight of 720 N. Using weight = mass x 10, work out its mass in kg.", "answer": "72", "accept": ["72", "72 kg", "72kg", "72.0", "seventy two", "seventy-two"], "hint": "You are given the weight, so undo the times 10.", "explain": "The answer is 72 kg. Forward rule: weight = mass x 10, so 720 = mass x 10. Undo the times 10 by dividing both sides by 10: mass = 720 / 10 = 72 kg. Multiplying by 10 again to get 7200 is the trap, and it happens because you have been handed the finished number and treated it as a starting one. Self check: 72 x 10 = 720 N, the weight you were given.", "topic": "working backwards: weight rule rearranged to find mass"}, {"id": "s10-forces-energy-recap:r-s10-3", "level": "medium", "type": "text", "q": "A tank presses down with a force of 800 N and creates a pressure of 200 N/m^2. Work out the area it rests on, in m^2.", "answer": "4", "accept": ["4", "4 m^2", "4m^2", "4 m2", "4.0", "four", "4 square metres"], "hint": "Pressure = force / area. The area is underneath, so it takes two undoing steps.", "explain": "The answer is 4 m^2. Forward rule: pressure = force / area, so 200 = 800 / area. Multiply both sides by area: 200 x area = 800. Divide both sides by 200: area = 800 / 200 = 4 m^2. Multiplying 800 by 200 is the wrong move and gives a number far too large to be an area. Self check: 800 / 4 = 200 N/m^2, the pressure you were given.", "topic": "working backwards: pressure rule rearranged to find area"}, {"id": "s10-forces-energy-recap:r-s10-4", "level": "medium", "type": "text", "q": "Five readings of a spring's length in mm are 34, 36, 35, 9 and 35. Ignore the anomaly and work out the mean in mm.", "answer": "35", "accept": ["35", "35 mm", "35mm", "35.0", "thirty five", "thirty-five"], "hint": "One reading is nowhere near the others. Leave it out, then divide by how many you kept.", "explain": "The answer is 35 mm. Four readings sit between 34 and 36, and the 9 is nowhere near them, so the 9 is the anomaly and it is left out. Add the four you kept: 34 + 36 + 35 + 35 = 140. Divide by four, not five: 140 / 4 = 35 mm. Dividing by five gives 28, which is below every reading you kept, and that is the sign the anomaly was left in. Read the numbers in front of you every time, because they change in every version of this question.", "topic": "working scientifically: mean after ignoring an anomalous result"}, {"id": "s10-forces-energy-recap:r-s10-5", "level": "stretch", "type": "text", "q": "A motor is supplied with 250 J of energy and transfers 150 J of it usefully. What is its efficiency as a percentage?", "answer": "60", "accept": ["60", "60%", "60 %", "60.0", "sixty", "60 percent"], "hint": "Efficiency = useful energy / total energy x 100.", "explain": "The answer is 60%. Efficiency = useful energy / total energy x 100, so 150 / 250 x 100 = 60%. Flipping the fraction gives 250 / 150 x 100 = 167%, and efficiency can never be over 100%, so anything above 100 tells you the fraction went in upside down. Self check: 60% of 250 is 150 J, the useful energy you were given. The missing 40%, which is 100 J, has gone to the thermal store of the surroundings.", "topic": "energy: efficiency as a percentage from useful and total energy"}, {"id": "s10-forces-energy-recap:r-s10-6", "level": "easy", "type": "text", "q": "A crate is pushed forwards with a force of 23 N. Friction pushes back on it with 9 N. What is the size of the resultant force in N?", "answer": "14", "accept": ["14", "14 N", "14N", "14.0", "fourteen", "14 newtons", "14 N forwards"], "hint": "The two forces act in opposite directions, so take one away from the other.", "explain": "The answer is 14 N. The forces act in opposite directions, so you subtract: 23 - 9 = 14 N, acting forwards because the bigger force is forwards. Adding them to get 32 N is the usual wrong move, and adding only works when both forces pull the same way.", "topic": "forces: resultant of two forces in opposite directions"}], "de11-core-words": [{"id": "de11-core-words:r-de11-1", "level": "easy", "type": "text", "q": "Your teacher asks you for the German for the book. Write both words.", "answer": "das Buch", "accept": ["das Buch", "das buch", "Das Buch"], "hint": "It is one of the six das words on the list.", "explain": "The answer is das Buch. Buch is a das word. Writing Buch on its own is half a word, and die Buch is the slip you made in the summer: right noun, wrong small word, no mark.", "topic": "core vocabulary: producing das Buch with its gender"}, {"id": "de11-core-words:r-de11-2", "level": "medium", "type": "mc", "q": "Which small word belongs with Schwester?", "options": ["der", "die", "das"], "answer": "die", "hint": "Schwester is on the die list with Schule, Stadt, Mutter, Musik and Pizza.", "explain": "It is die Schwester. Schwester is a die word, so the pair you learn is die Schwester, meaning the sister. Guessing der because a sister is a person does not work, because the small word has nothing to do with whether something is male or female in English.", "topic": "core vocabulary: gender of die Schwester"}, {"id": "de11-core-words:r-de11-3", "level": "easy", "type": "mc", "q": "Which one of these means the room?", "options": ["das Zimmer", "das Haus", "die Stadt", "der Tag"], "answer": "das Zimmer", "hint": "It is a part of a house rather than the whole house.", "explain": "das Zimmer means the room. das Haus is the house, die Stadt is the town and der Tag is the day. The room sits inside the house, so mixing those two up is the mistake to watch for.", "topic": "core vocabulary: recognising das Zimmer"}, {"id": "de11-core-words:r-de11-4", "level": "medium", "type": "text", "q": "Write the German for the football, with der, die or das in front. Write the double s as ss.", "answer": "der Fussball", "accept": ["der Fussball", "der Fußball", "der fussball", "der fußball", "Der Fussball", "Der Fußball"], "hint": "It is on the der list with Bus, Hund, Bruder, Film, Freund, Vater and Tag.", "explain": "The answer is der Fussball. You may also see it written with the special German letter that stands for a double s. Fussball is a der word, so der Fussball is the pair you learn, and Fussball on its own is only half the answer.", "topic": "core vocabulary: producing der Fussball with its gender"}, {"id": "de11-core-words:r-de11-5", "level": "stretch", "type": "mc", "q": "A pupil has written die Buch in their exercise book. Which version is right?", "options": ["der Buch", "die Buch", "das Buch"], "answer": "das Buch", "hint": "Check the das list in the teaching part.", "explain": "It is das Buch. Buch is a das word, so der Buch and die Buch are both wrong. The noun was right and the small word in front was not, which is exactly the habit this week is built to fix.", "topic": "core vocabulary: correcting die Buch to das Buch"}, {"id": "de11-core-words:r-de11-6", "level": "easy"
