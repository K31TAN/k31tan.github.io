edium", "type": "text", "q": "Fill the gap with the right form of fahren: Du ___ nach Hause.", "answer": "faehrst", "accept": ["faehrst", "faehrst.", "fährst", "fährst."], "hint": "Change the vowel first, then add the du ending.", "explain": "The answer is faehrst, written properly as fährst. The a becomes ä and then the du ending -st is added to the stem. The sentence means you travel home. Do the vowel change first and the ending second, every time.", "topic": "irregular verbs: fahren du form"}, {"id": "r-de3-6", "level": "medium", "type": "text", "q": "Fill the gap with the right form of lesen: Er ___ die Karte.", "answer": "liest", "accept": ["liest", "liest.", "Liest"], "hint": "The e becomes ie. Watch out for the s that is already there.", "explain": "The answer is liest. In lesen the e changes to ie, giving the stem lies, and the ending -t is added to make liest. Because the stem already ends in s, the du form is also liest, so those two forms look identical. The sentence means he reads the map.", "topic": "irregular verbs: lesen er and sie form"}, {"id": "r-de3-7", "level": "medium", "type": "text", "q": "Fill the gap with the right form of sprechen: Du ___ mit dem Lehrer.", "answer": "sprichst", "accept": ["sprichst", "sprichst.", "Sprichst"], "hint": "The e becomes i, not ie, and then you add -st.", "explain": "The answer is sprichst. In sprechen the e changes to a short i, giving the stem sprich, and the du ending -st is added. Take care not to write spriechst, because this verb takes a plain i and not ie. The sentence means you speak to the teacher.", "topic": "irregular verbs: sprechen du form"}, {"id": "r-de3-8", "level": "stretch", "type": "mc", "q": "Which of these sentences uses the du form of essen correctly?", "options": ["Du isst einen Apfel.", "Du esst einen Apfel.", "Du essen einen Apfel.", "Du ist einen Apfel."], "answer": "Du isst einen Apfel.", "hint": "Change the vowel first, then look at what the stem already ends in.", "explain": "The answer is Du isst einen Apfel. In essen the e changes to i, which gives the stem iss, and because that already ends in s you only add -t, giving isst. Du esst forgets the vowel change and is the ihr form. Du essen uses the wir ending. Du ist is a different word altogether, because ist means is.", "topic": "irregular verbs: essen du form"}], "de4-together": [{"id": "r-de4-1", "level": "easy", "type": "text", "q": "Fill the gap with the right form of lesen: Heute ___ ich ein Buch.", "answer": "lese", "accept": ["lese", "lese.", "Lese"], "hint": "The ich form does not change its vowel, even when the time phrase comes first.", "explain": "The answer is lese. Heute is idea one, so the verb must be idea two and ich follows it. The ich form of lesen does not change the vowel, so it is simply lese. The sentence means today I am reading a book.", "topic": "combining: fronted time phrase with ich form"}, {"id": "r-de4-2", "level": "easy", "type": "mc", "q": "Only one of these is correct German. Which one?", "options": ["Am Wochenende isst er Pizza.", "Am Wochenende er isst Pizza.", "Am Wochenende essen er Pizza.", "Er am Wochenende isst Pizza."], "answer": "Am Wochenende isst er Pizza.", "hint": "Check two things. Is the verb second, and does it have the right form for er?", "explain": "The answer is Am Wochenende isst er Pizza. Am Wochenende is idea one, so the verb comes second and er goes third. The er form of essen changes the e to i and then adds only a -t, because the stem already ends in s, which gives isst. The second option puts the verb third, the third option uses the wir form essen, and the fourth also leaves the verb in third place.", "topic": "combining: fronted time phrase with an irregular verb"}, {"id": "r-de4-3", "level": "easy", "type": "text", "q": "Fill the gap with the right form of sehen: Heute ___ du einen Film.", "answer": "siehst", "accept": ["siehst", "siehst.", "Siehst"], "hint": "The du form of sehen changes the e to ie, then adds -st.", "explain": "The answer is siehst. Heute is idea one, the verb is idea two and du follows it. The du form of sehen changes the e to ie, giving the stem sieh, and then the ending -st is added.", "topic": "combining: fronted time phrase with du form"}, {"id": "r-de4-4", "level": "easy", "type": "mc", "q": "In the sentence Am Abend spielt mein Bruder Fussball, which word is the second idea?", "options": ["spielt", "Am", "Abend", "mein"], "answer": "spielt", "hint": "Am Abend is two words but only one idea.", "explain": "The answer is spielt. Am Abend is a single idea made of two words, so it fills position one. The verb spielt is therefore the second idea, even though it is the third word. Mein Bruder then follows in third place.", "topic": "word order: counting ideas not words"}, {"id": "r-de4-5", "level": "medium", "type": "text", "q": "Rewrite this sentence so it starts with Morgen: Sie liest die Zeitung.", "answer": "Morgen liest sie die Zeitung.", "accept": ["Morgen liest sie die Zeitung.", "Morgen liest sie die Zeitung", "morgen liest sie die zeitung.", "morgen liest sie die zeitung"], "hint": "Only the order changes. The verb form stays the same.", "explain": "The answer is Morgen liest sie die Zeitung. Morgen becomes idea one, so the verb liest stays in second place and sie moves behind it. The verb form does not change, because the person is still sie meaning she.", "topic": "combining: fronting with an irregular verb"}, {"id": "r-de4-6", "level": "medium", "type": "text", "q": "Rewrite this sentence so it starts with Am Sonntag: Wir essen Kuchen.", "answer": "Am Sonntag essen wir Kuchen.", "accept": ["Am Sonntag essen wir Kuchen.", "Am Sonntag essen wir Kuchen", "am sonntag essen wir kuchen.", "am sonntag essen wir kuchen"], "hint": "Am Sonntag is one idea, so the verb goes straight after it.", "explain": "The answer is Am Sonntag essen wir Kuchen. Am Sonntag means on Sunday and counts as one idea, so the verb essen takes position two and wir moves to third. The wir form does not change its vowel, so it stays as essen.", "topic": "combining: fronting with the wir form"}, {"id": "r-de4-7", "level": "medium", "type": "text", "q": "Correct this sentence: Am Montag ich fahre nach Bremen.", "answer": "Am Montag fahre ich nach Bremen.", "accept": ["Am Montag fahre ich nach Bremen.", "Am Montag fahre ich nach Bremen", "am montag fahre ich nach bremen.", "am montag fahre ich nach bremen"], "hint": "The verb form is already right. Only two words are in the wrong place.", "explain": "The answer is Am Montag fahre ich nach Bremen. Am Montag is idea one, so the verb fahre must be idea two and ich moves behind it. Fahre is the correct ich form and the vowel does not change for ich, so nothing else needed fixing.", "topic": "combining: correcting verb third"}, {"id": "r-de4-8", "level": "stretch", "type": "text", "q": "Write in German: On Sunday my brother speaks German. Start with Am Sonntag.", "answer": "Am Sonntag spricht mein Bruder Deutsch.", "accept": ["Am Sonntag spricht mein Bruder Deutsch.", "Am Sonntag spricht mein Bruder Deutsch", "am sonntag spricht mein bruder deutsch.", "am sonntag spricht mein bruder deutsch"], "hint": "My brother counts as he, so the verb changes its vowel from e to i.", "explain": "The answer is Am Sonntag spricht mein Bruder Deutsch. Bruder is a der word, so my brother is mein Bruder, and it counts as er meaning he. That makes sprechen change to spricht, with a short i and a -t ending. Am Sonntag is idea one, so spricht is idea two and mein Bruder follows in third place.", "topic": "combining: fronting with a noun subject and sprechen"}], "de5-speaking": [{"id": "r-de5-1", "level": "easy", "type": "mc", "q": "Read this short exchange. A: Wie heisst du? B: Ich heisse Anna. Ich wohne in Bonn. What is B called?", "options": ["Anna", "Bonn", "Wie", "Heisse"], "answer": "Anna", "hint": "Look at the line that begins Ich heisse.", "explain": "The answer is Anna. Ich heisse Anna means I am called Anna. Bonn is the town /* Extra practice, filtered to the topics he actually got wrong. His own idea. */
function poolFor(id){
  const pool=POOLS[id]||[]; if(!pool.length)return [];
  const qs=qsOf(id).filter(q=>q.type!=='long');
  const wrong=new Set(qs.filter(q=>S.ans[q.id]!==undefined&&isRight(q,S.ans[q.id])===false).map(q=>q.topic));
  const hit=pool.filter(q=>wrong.has(q.topic));
  const rest=pool.filter(q=>!wrong.has(q.topic));
  return (hit.length>=4?hit:hit.concat(rest)).slice(0,8);
}
function retryScore(id){
  const qs=poolFor(id);
  const a=qs.filter(q=>S.rans[q.id]!==undefined);
  return {right:a.filter(q=>isRight(q,S.rans[q.id])===true).length,answered:a.length,total:qs.length};
}

/* ---------- marking ---------- */
function norm(s){
  var t=String(s==null?'':s).toLowerCase().trim().replace(/[‘’]/g,"'").replace(/[“”]/g,'"')
    .replace(/[£$€]/g,'').replace(/\s+/g,' ').replace(/[.!;]+$/,'').trim();
  /* A wrapping pair of brackets is not a wrong answer. (2a + 2b) is 2a + 2b. */
  var m=t.match(/^\((.*)\)$/);
  if(m&&m[1].indexOf('(')===-1&&m[1].indexOf(')')===-1)t=m[1].trim();
  return t;
}
function squash(s){return norm(s).replace(/\s+/g,'').replace(/[−–—]/g,'-')}
function isRight(q,g){
  if(q.type==='mc')return g===q.answer;
  if(q.type==='text'){
    const acc=(q.accept||[q.answer]).map(norm), gg=norm(g);
    if(acc.includes(gg))return true;
    if(acc.map(a=>a.replace(/\s+/g,'').replace(/[−–—]/g,'-')).includes(squash(g)))return true;
    var an=parseNum(q.answer),gn=parseNum(g);
    if(an!==null&&gn!==null&&Math.abs(an-gn)<1e-9)return true;
    return false;
  }
  return null;
}
function numeric(q){return q.type==='text'&&/^-?[\d.,\/\s]+$/.test(String(q.answer||''))}
function parseNum(s){
  if(s==null)return null;
  var t=String(s).toLowerCase().trim().replace(/[\u2212\u2013\u2014]/g,'-').replace(/,/g,'').replace(/[£$€]/g,'')
    .replace(/\s*(kilometres|kilometers|metres|meters|degrees|degree|km|cm|mm|m|c)\b\.?/g,'').trim();
  if(!t)return null;
  var m=t.match(/^(-?\d+)\s+(\d+)\s*\/\s*(\d+)$/);
  if(m){var w=+m[1],nn=+m[2],d=+m[3];if(!d)return null;return w<0?w-nn/d:w+nn/d}
  m=t.match(/^(-?\d+)\s*\/\s*(-?\d+)$/);
  if(m){if(+m[2]===0)return null;return +m[1]/+m[2]}
  if(/^-?\d*\.?\d+$/.test(t))return parseFloat(t);
  return null;
}
function simplifyNote(q,g){
  if(!/simplest form/i.test(q.q||''))return '';
  var m=String(g||'').trim().match(/^(-?\d+)\s*\/\s*(\d+)$/);if(!m)return '';
  var a=Math.abs(+m[1]),b=Math.abs(+m[2]);if(!b)return '';
  var gcd=function(x,y){return y?gcd(y,x%y):x};
  if(gcd(a,b)<=1)return '';
  return '\n\nThat is the right value. The question asked for simplest form though, and '+m[1]+'/'+m[2]+' divides down to '+q.answer+'.';
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function isTest(id){return !!TESTS[id]}
function qsOf(id){
  if(isTest(id)){let o=[];TESTS[id].bands.forEach(b=>o=o.concat(b.questions.map(q=>({...q,_ex:b.extract||null,_bl:b.label}))));return o}
  const s=SESS[id];return s?s.questions.map(q=>({...q,_ex:s.extract||null})):[];
}
function titleOf(id){return isTest(id)?TESTS[id].title:(SESS[id]?SESS[id].subject+': '+SESS[id].title:id)}
function subjOf(id){return isTest(id)?(id==='s1-retest'?'Science':'Test'):(SESS[id]?SESS[id].subject:'')}
function scoreOf(id){
  const qs=qsOf(id).filter(q=>q.type!=='long');
  const a=qs.filter(q=>S.ans[q.id]!==undefined);
  return {right:a.filter(q=>isRight(q,S.ans[q.id])===true).length,answered:a.length,total:qs.length};
}

function overallPct(){
  let t=0,dn=0;DAYS.forEach(d=>d.blocks.forEach(b=>{t++;if(S.done[b.id])dn++}));
  return t?Math.round(dn/t*100):0;
}

    firstRight:first.right,firstTotal:first.total,
    retryRight:again.right,retryTotal:again.total,
    stillWrong:[...new Set(qs.map(q=>q.topic))].join('; ')});
}

      words:(S.long[q.id]||'').trim().split(/\s+/).length,checklist:q.explain||''}))});
}
function shrink(file){
  return new Promise(res=>{
    const r=new FileReader();
    r.onload=()=>{const img=new Image();img.onload=()=>{
      const m=1200,sc=Math.min(1,m/Math.max(img.width,img.height));
      const c=document.createElement('canvas');c.width=img.width*sc;c.height=img.height*sc;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      res(c.toDataURL('image/jpeg',0.7));
    };img.src=r.result};
    r.readAsDataURL(file);
  });
}

/* ---------- day ---------- */
function vDay(){

      const sc=scoreOf(b.id);
      st=dn?`<span class="pill ${sc.right/Math.max(1,sc.total)>=0.7?'good':'warn'}">${sc.right}/${sc.total}</span>`:`<span class="pill">${b.mins} min</span>`;
      tgt=dn?{name:'res',day:d.key,id:b.id}:(isTest(b.id)?{name:'q',day:d.key,id:b.id,i:0}:{name:'teach',day:d.key,id:b.id});

/* ---------- question ---------- */
function vQ(){
  const qs=qsOf(view.id),q=qs[view.i],test=isTest(view.id);
  document.getElementById('htitle').textContent=subjOf(view.id);
  const given=S.ans[q.id], marked=given!==undefined&&!test&&!view.retry;
  const right=marked?isRight(q,given):null;
  let h=`<div class="qmeta"><span>${test?esc(q._bl||'Test'):esc(q.level||'')}</span><span>Question ${view.i+1} of ${qs.length}</span></div>
    <div class="bar" style="margin:10px 0 4px"><i style="width:${view.i/qs.length*100}%"></i></div>`;
  if(q._ex)h+=`<details class="extract" ${view.i===0?'open':''}><summary><span>Reference</span><span class="faint" style="font-weight:400;text-transform:none;letter-spacing:0"> &middot; used by some questions here</span></summary><div>${esc(q._ex)}</div></details>`;
  h+=`<div class="q">${esc(q.q)}</div>`;
  if(q.type==='mc'){
    h+=`<div class="opts">`;
    q.options.forEach((o,i)=>{
      let cls='';
      if(marked){if(o===q.answer)cls='ok';else if(o===given)cls='no'}
      else if(given===o)cls='sel';
      h+=`<button class="opt ${cls}" data-pick="${esc(o)}" ${marked?'disabled':''}><span class="k">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`;
    });
    h+=`</div>`;
  }else if(q.type==='text'){
    h+=`<input type="text" id="ta" value="${esc(given||'')}" class="${marked?(right?'ok':'no'):''}" ${marked?'disabled':''} autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="${numeric(q)?'decimal':'text'}" placeholder="Your answer">`;
  }else{
    h+=`<textarea id="ta" placeholder="Write your answer...">${esc(S.long[q.id]||'')}</textarea>`;
    if(q.marks)h+=`<div class="faint" style="margin-top:8px">${q.marks} marks</div>`;
    h+=`<div class="faint" style="margin-top:6px">Keitan reads this one in full, and sees how long you took. Your own words, in your own head. Getting it wrong here is worth more than getting it right from somewhere else.</div>`;
  }
  if(view.hint&&!marked&&q.hint)h+=`<div class="hint"><b>Hint.</b> ${esc(q.hint)}</div>`;
  if(marked){
    h+=`<div class="fb ${right?'ok':'no'}"><b>${right?'Correct':'Not quite. The answer is '+esc(q.answer)}</b>${esc(q.explain)}${right?esc(simplifyNote(q,given)):''}</div>`;
    h+=`<button class="btn" id="next">${view.i+1<qs.length?'Next question':'Finish'}</button>`;
  }else if(q.type==='long'){
    h+=`<button class="btn" id="showmodel">Show the model answer</button>`;
    if(view.model)h+=`<div class="fb ok"><b>Model answer</b>${esc(q.answer)}

${esc(q.explain)}</div>`;
    h+=`<button class="btn ghost" id="next">${view.i+1<qs.length?'Next question':'Finish'}</button>`;
  }else{
    if(q.type!=='mc')h+=`<button class="btn" id="check">Check</button>`;
    if(!test&&q.hint&&!view.hint)h+=`<button class="btn ghost" id="hintbtn">Stuck? Get a hint</button>`;
    if(test)h+=`<button class="btn ${q.type==='mc'?'ghost':''}" id="next">${view.i+1<qs.length?'Next':'Finish'}</button>`;
  }
  return h;
}

function vRQ(){
  const qs=poolFor(view.id), q=qs[view.i];
  document.getElementById('htitle').textContent='More practice';
  const given=S.rans[q.id], marked=given!==undefined;
  const right=marked?isRight(q,given):null;
  let h=`<div class="qmeta"><span>Extra practice</span><span>Question ${view.i+1} of ${qs.length}</span></div>
    <div class="bar" style="margin:10px 0 4px"><i style="width:${view.i/qs.length*100}%"></i></div>
    <div class="q">${esc(q.q)}</div>`;
  if(q.type==='mc'){
    h+=`<div class="opts">`;
    q.options.forEach((o,i)=>{
      let cls=''; if(marked){if(o===q.answer)cls='ok'; else if(o===given)cls='no'} else if(given===o)cls='sel';
      h+=`<button class="opt ${cls}" data-rpick="${esc(o)}" ${marked?'disabled':''}><span class="k">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`;
    });
    h+=`</div>`;
  }else{
    h+=`<input type="text" id="ta" value="${esc(given||'')}" class="${marked?(right?'ok':'no'):''}" ${marked?'disabled':''} autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="${numeric(q)?'decimal':'text'}" placeholder="Your answer">`;
  }
  if(view.hint&&!marked&&q.hint)h+=`<div class="hint"><b>Hint.</b> ${esc(q.hint)}</div>`;
  if(marked){
    h+=`<div class="fb ${right?'ok':'no'}"><b>${right?'Correct':'Not quite. The answer is '+esc(q.answer)}</b>${esc(q.explain)}${right?esc(simplifyNote(q,given)):''}</div>
      <button class="btn" id="rnext">${view.i+1<qs.length?'Next question':'Finish'}</button>`;
  }else{
    if(q.type!=='mc')h+=`<button class="btn" id="rcheck">Check</button>`;
    if(q.hint&&!view.hint)h+=`<button class="btn ghost" id="hintbtn">Stuck? Get a hint</button>`;
  }
  return h;
}

function vRRes(){
  const id=view.id, first=scoreOf(id), again=retryScore(id);
  const fp=first.total?Math.round(first.right/first.total*100):0;
  const rp=again.total?Math.round(again.right/again.total*100):0;
  document.getElementById('htitle').textContent='More practice';
  const up=rp>=fp;
  let h=`<div class="card band"><div class="big ${up?'ok':''}">${again.right}<span style="color:var(--faint);font-size:26px">/${again.total}</span></div>
    <div class="lbl">Extra practice on what you got wrong</div>
    <div class="lbl" style="margin-top:14px">First time: ${fp}% &middot; This time: <b>${rp}%</b></div></div>`;
  h+=`<div class="card tight"><div class="small muted">${up
    ? 'That is the whole point. You got those wrong less than an hour ago and you have just got them right, which means it went in rather than passing through.'
    : 'Still not landing, and that is worth knowing rather than hiding. Tell Keitan which ones. This is the sort of thing that needs saying out loud, not another go on your own.'}</div></div>`;
  const qs=poolFor(id).filter(q=>S.rans[q.id]!==undefined&&isRight(q,S.rans[q.id])===false);
  if(qs.length){
    h+=`<div class="card"><h3>Still wrong</h3>`;
    qs.forEach(q=>{h+=`<div class="rev"><div class="qt">${esc(q.q)}</div>
      <div class="ans">You put: <b class="no">${esc(S.rans[q.id]||'(blank)')}</b></div>
      <div class="ans">Answer: <b class="ok">${esc(q.answer)}</b></div>
      <div class="exp">${esc(q.explain)}</div></div>`});
    h+=`</div>`;
  }
  h+=`<button class="btn" data-go='${JSON.stringify({name:'day',day:view.day})}'>Back to ${DAYS.find(d=>d.key===view.day).label}</button>`;
  return h;
}

function vRes(){
  const id=view.id,qs=qsOf(id).filter(q=>q.type!=='long'),sc=scoreOf(id);
  document.getElementById('htitle').textContent=subjOf(id);
  const pct=sc.total?Math.round(sc.right/sc.total*100):0;
  let h=`<div class="card band"><div class="big ${pct>=70?'ok':''}">${sc.right}<span style="color:var(--faint);font-size:26px">/${sc.total}</span></div>
    <div class="lbl">${esc(titleOf(id))}</div></div>`;
  if(id==='s1-retest'){
    let ceil=null;
    for(const b of TESTS[id].bands){
      const a=b.questions.filter(q=>S.ans[q.id]!==undefined);
      if(!a.length)break;
      if(a.filter(q=>isRight(q,S.ans[q.id])===true).length>=3)ceil=b.label; else break;
    }
    h+=`<div class="card tight"><div class="small muted">Highest band cleared: <b>${ceil?esc(ceil):'none'}</b>. This is the number that settles whether your 82% at school was real.</div></div>`;
  }
  const ok=new Set(),no=new Set();
  qs.forEach(q=>{if(S.ans[q.id]!==undefined)(isRight(q,S.ans[q.id])===true?ok:no).add(q.topic)});
  no.forEach(t=>ok.delete(t));
  if(no.size)h+=`<div class="card"><h3>Still to fix</h3><div class="topics">${[...no].map(t=>`<span class="tp no">${esc(t)}</span>`).join('')}</div></div>`;
  if(ok.size)h+=`<div class="card"><h3>Got it</h3><div class="topics">${[...ok].map(t=>`<span class="tp ok">${esc(t)}</span>`).join('')}</div></div>`;
  const wrong=qs.filter(q=>S.ans[q.id]!==undefined&&isRight(q,S.ans[q.id])===false);
  if(wrong.length){
    h+=`<div class="card"><h3>Go through these</h3>`;
    wrong.forEach(q=>{h+=`<div class="rev"><div class="qt">${esc(q.q)}</div>
      <div class="ans">You put: <b class="no">${esc(S.ans[q.id]||'(blank)')}</b></div>
      <div class="ans">Answer: <b class="ok">${esc(q.answer)}</b></div>
      <div class="exp">${esc(q.explain)}</div></div>`});
    h+=`</div>`;
  }
  const extra=poolFor(id);
  if(extra.length&&wrong.length){
    const doneR=S.rdone[id], rs=retryScore(id);
    h+=`<div class="card"><h3>${doneR?'You have already done the extra practice':'Want to prove you have got it?'}</h3>
      <p class="muted small" style="margin:8px 0 0">${doneR
        ? 'You scored '+rs.right+' out of '+rs.total+' on those.'
        : extra.length+' more questions, aimed at exactly the topics you just got wrong. Different questions, same ideas. This is the bit that tells you whether it went in.'}</p>
      <button class="btn ${doneR?'ghost':''}" data-go='${JSON.stringify({name:'rq',day:view.day,id:id,i:0})}'>${doneR?'Look again':'Give me more questions'}</button></div>`;
  }
  h+=`<button class="btn ghost" data-go='${JSON.stringify({name:'day',day:view.day})}'>Back to ${DAYS.find(d=>d.key===view.day).label}</button>`;
  return h;
}

function vReview(){
  document.getElementById('htitle').textContent='End of week review';
  let all=[];
  DAYS.forEach(d=>d.blocks.forEach(b=>{if(b.kind==='review')return;
    qsOf(b.id).forEach(q=>{if(q.type!=='long'&&S.ans[q.id]!==undefined&&isRight(q,S.ans[q.id])===false)all.push({q:q,s:subjOf(b.id)})})}));
  let h=`<h1>End of week review</h1>
  <div class="nb"><b>Out loud, with Keitan.</b> For each one: say what you did, then say what you should have done. If you cannot explain it, you have not got it yet.</div>`;
  if(!all.length)h+=`<div class="card"><p>Nothing wrong to review. Either a very good week or the sessions have not been done yet.</p></div>`;
  else{
    const by={};all.forEach(x=>{(by[x.s]=by[x.s]||[]).push(x.q)});
    Object.keys(by).forEach(s=>{
      h+=`<div class="card"><h3>${esc(s)} <span class="faint">${by[s].length}</span></h3>`;
      by[s].forEach(q=>{h+=`<div class="rev"><div class="qt">${esc(q.q)}</div>
        <div class="ans">You put: <b class="no">${esc(S.ans[q.id]||'(blank)')}</b></div>
        <div class="ans">Answer: <b class="ok">${esc(q.answer)}</b></div>
        <div class="exp">${esc(q.explain)}</div>
        <div class="faint" style="margin-top:8px">${esc(q.topic||'')}</div></div>`});
      h+=`</div>`;
    });
  }
  h+=`<button class="btn" id="revdone">Done, we have been through them</button>`;
  return h;
}

function summary(){
  let o='SURAJ OS - WEEK 2\n\n';
  DAYS.forEach(d=>{
    o+=d.label.toUpperCase()+'\n';
    d.blocks.forEach(b=>{
      if(b.kind==='review'){o+='  Review: '+(S.done[b.id]?'done':'not done')+'\n';return}
      const sc=scoreOf(b.id);
      if(!sc.answered){o+='  '+titleOf(b.id)+': not started\n';return}
      const qs=qsOf(b.id).filter(q=>q.type!=='long');
      const wrong=qs.filter(q=>S.ans[q.id]!==undefined&&isRight(q,S.ans[q.id])===false);
      o+='  '+titleOf(b.id)+': '+sc.right+'/'+sc.total;
      if(wrong.length)o+='  | still wrong: '+[...new Set(wrong.map(q=>q.topic))].join('; ');
      o+='\n';
    });
    o+='\n';
  });
  const H=S.hand||{};
  o+='HANDWRITING\n  Speed Up! done: '+DAYS.filter(d=>H[d.key]).length+'/5\n';
  o+='  3 min copy: '+(H.words||'-')+' words'+(H.words?' ('+Math.round(H.words/3)+' wpm)':'')+'\n';
  o+='  Readable: '+(H.legible||'-')+' | Ache: '+(H.ache||'-')+'\n\n';
  o+='READING\n  Book: '+(S.reading.book||'-')+'\n  Pages: '+DAYS.map(d=>d.label.slice(0,3)+' '+((S.reading[d.key]||{}).pages||'0')).join(', ')+'\n';
  if(S.reading.notes)o+='  His summary: '+S.reading.notes+'\n';
  o+='\nEXTENDED WRITING\n';
  Object.keys(S.long).forEach(k=>{const t=(S.long[k]||'').trim();if(t)o+='  ['+k+'] '+t.split(/\s+/).length+' words\n  ---\n'+t+'\n  ---\n'});
  return o;
}

/* ---------- events ---------- */
function wire(){
  document.querySelectorAll('[data-go]').forEach(el=>{el.onclick=()=>go(JSON.parse(el.getAttribute('data-go')))});
  document.querySelectorAll('[data-pick]').forEach(el=>{el.onclick=()=>{
    const q=qsOf(view.id)[view.i];S.ans[q.id]=el.getAttribute('data-pick');save();
    if(isTest(view.id))setTimeout(advance,130);else{view.hint=false;render()}
  }});
  const ck=document.getElementById('check');
  if(ck)ck.onclick=()=>{const q=qsOf(view.id)[view.i],ta=document.getElementById('ta');
    if(!ta.value.trim()){ta.focus();return}S.ans[q.id]=ta.value;save();view.hint=false;render()};
  bindHonesty();
  document.querySelectorAll('[data-rpick]').forEach(el=>{el.onclick=()=>{
    const q=poolFor(view.id)[view.i];S.rans[q.id]=el.getAttribute('data-rpick');save();view.hint=false;render()}});
  const rc=document.getElementById('rcheck');
  if(rc)rc.onclick=()=>{const q=poolFor(view.id)[view.i],ta=document.getElementById('ta');
    if(!ta.value.trim()){ta.focus();return}S.rans[q.id]=ta.value;save();view.hint=false;render()};
  const rn=document.getElementById('rnext');
  if(rn)rn.onclick=()=>{
    const qs=poolFor(view.id);
    if(view.i+1<qs.length)go({name:'rq',day:view.day,id:view.id,i:view.i+1,hint:false});
    else{S.rdone[view.id]=true;save();pushRetry(view.id);go({name:'rres',day:view.day,id:view.id})}
  };
  const hb=document.getElementById('hintbtn');
  if(hb)hb.onclick=()=>{view.hint=true;render()};
  const sm=document.getElementById('showmodel');
  if(sm)sm.onclick=()=>{const q=qsOf(view.id)[view.i],ta=document.getElementById('ta');
    const t=TRACK[view.id]; if(t){t.model++; if(!ta||ta.value.trim().length<40)t.modelEarly++}
    if(ta)S.long[q.id]=ta.value;save();view.model=true;render()};
  const nx=document.getElementById('next');
  if(nx)nx.onclick=()=>{
    const q=qsOf(view.id)[view.i],ta=document.getElementById('ta');
    if(ta){if(q.type==='long')S.long[q.id]=ta.value;else if(isTest(view.id))S.ans[q.id]=ta.value;save()}
    advance();
  };
  const rd=document.getElementById('revdone');
  if(rd)rd.onclick=()=>{const d=DAYS.find(x=>x.key===view.day);const b=d.blocks.find(x=>x.kind==='review');
    if(b){S.done[b.id]=true;save();push('review',{done:true})}go({name:'day',day:view.day})};
  document.querySelectorAll('[data-read]').forEach(el=>{el.onchange=el.oninput=()=>{
    const k=el.getAttribute('data-read'),f=el.getAttribute('data-f');
    if(f==='book')S.reading.book=el.value;else if(f==='notes')S.reading.notes=el.value;
    else{S.reading[k]=S.reading[k]||{};S.reading[k].pages=el.value}save();pushDaily()}});
  document.querySelectorAll('[data-hand]').forEach(el=>{el.onclick=()=>{
    const k=el.getAttribute('data-hand');S.hand[k]=!S.hand[k];save();pushDaily();render()}});
  document.querySelectorAll('[data-hand2]').forEach(el=>{el.onchange=el.oninput=()=>{
    S.hand[el.getAttribute('data-hand2')]=el.value;save();pushDaily()}});
  document.querySelectorAll('[data-cfg]').forEach(el=>{el.onchange=el.oninput=()=>{
    CFG[el.getAttribute('data-cfg')]=el.value;S.cfg=CFG;saveCfg();save()}});
  const cc=document.getElementById('checkc');
  if(cc)cc.onclick=()=>checkContent(true);
  const ts=document.getElementById('testsync');
  if(ts)ts.onclick=async()=>{ts.textContent='Sending...';
    const ok=await push('test',{message:'Hello from the Study OS'});
    ts.textContent=ok?'Sent, check the sheet':'Failed, check the URL'};
  const cp=document.getElementById('copy');
  if(cp)cp.onclick=()=>{const t=summary();
    if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>{cp.textContent='Copied';setTimeout(()=>cp.textContent='Copy summary',1500)})};
  document.querySelectorAll('[data-shotadd]').forEach(el=>{el.onchange=async()=>{
    const k=el.getAttribute('data-shotadd'),f=el.files&&el.files[0];if(!f)return;
    const b64=await shrink(f);
    PHOTOS[k]=PHOTOS[k]||[];PHOTOS[k].push(b64);render();
    const ok=await push('photo',{day:k,image:b64});
    if(ok){S.shots[k]=(S.shots[k]||0)+1;save()}
    else alert('That photo did not send. Check the sync setting, then try again.');
    render()}});
}
function advance(){
  const qs=qsOf(view.id);
  if(view.i+1<qs.length)go({name:'q',day:view.day,id:view.id,i:view.i+1,hint:false,model:false});
  else{S.done[view.id]=true;save();pushSession(view.id);go({name:'res',day:view.day,id:view.id})}
}
function bindContent(){SESS=P.sessions;TESTS=P.tests;DAYS=P.days;BOOKS=P.books;HAND=P.hand;
  VER=P.version||'w0';S=store.get()||{};
  S.ans=S.ans||{};S.done=S.done||{};S.reading=S.reading||{};S.hand=S.hand||{};
  S.shots=S.shots||{};S.long=S.long||{};S.rans=S.rans||{};S.rdone=S.rdone||{};S.cfg=CFG;}
let CFG={};
try{CFG=JSON.parse(localStorage.getItem('surajOS_cfg')||'{}')}catch(e){}
if(!CFG.sync&&S.cfg&&S.cfg.sync)CFG.sync=S.cfg.sync;           /* carry over the old location */
S.cfg=CFG;
function saveCfg(){try{localStorage.setItem('surajOS_cfg',JSON.stringify(CFG))}catch(e){}}

let CHECKING=false;
function checkContent(loud){
  const url=(CFG.sync||'').trim(); if(!url){if(loud)alert('Add the sync link in Settings first.');return}
  CHECKING=true;render();
  jsonp(url,'want=version&',8000,v=>{
    if(!v||!v.version){finish(loud?'Nothing released yet.':null);return}
    if(v.version===VER){finish(loud?'Already on the latest.':null);return}
    jsonp(url,'want=content&',45000,r=>{
      const c=r&&r.content;
      if(!c||c.error){finish(loud?('Could not read the new work. '+(c&&c.error?c.error:'')):null);return}
      P=c;try{localStorage.setItem('surajOS_content',JSON.stringify(c))}catch(e){}
      bindContent();view={name:'home'};
      finish(loud?('Updated to '+(c.weekLabel||c.version)+'.'):null);
    });
  });
  function finish(msg){CHECKING=false;if(loud&&msg)alert(msg);render()}
}
function jsonp(url,qs,ms,fn){
  const cb='__c'+Math.floor(Math.random()*1e9);
  const sc=document.createElement('script');
  let done=false;
  const end=(d)=>{if(done)return;done=true;try{delete window[cb]}catch(_){}sc.remove();clearTimeout(t);fn(d)};
  window[cb]=end;
  const t=setTimeout(()=>end(null),ms);
  sc.onerror=()=>end(null);
  sc.src=url+(url.indexOf('?')>-1?'&':'?')+qs+'callback='+cb+'&t='+Date.now();
  document.body.appendChild(sc);
}
bindContent();
if(S.cfg.sync)setDot('on');
render();
checkContent(false);
</script></body></html>
