measurement. Medieval writers regularly used large round figures the way we might say a million times, meaning a great many. That does not mean the event is doubted. Orderic Vitalis, who had an English mother and a Norman father and wrote in Normandy, condemned the Harrying strongly, and the Domesday waste entries for Yorkshire back up the scale of the damage. The historian's sentence here is: the event is well evidenced, the number is not. Being able to separate those two things is a top band skill.", "topic": "Norman control: judging a medieval death toll"}, {"id": "h7-norman-control:q13", "level": "stretch", "type": "mc", "q": "Some historians argue that we should be careful with the phrase 'the feudal system'. Why?", "options": ["Nobody in Norman England used the phrase. It was invented by later writers, and real arrangements over land and service were messier and more varied than a neat pyramid", "Because the pyramid actually had the peasants at the top", "Because there was no landholding at all in Norman England", "Because the phrase was banned by the Domesday commissioners"], "answer": "Nobody in Norman England used the phrase. It was invented by later writers, and real arrangements over land and service were messier and more varied than a neat pyramid", "hint": "Ask whether a Norman baron would have recognised the phrase if you said it to him.", "explain": "The answer is the first option. The word feudal comes from much later writers, not from anyone alive in 1086. Some historians, notably in work published in the 1990s, argued that the tidy pyramid is a model built afterwards and that the real deals over land and service varied enormously from place to place and changed over time. Most textbooks still teach the pyramid, and that is fine, because it is a useful summary of a real pattern. What you should know is that it is a model historians use rather than something someone wrote down at the time. Being able to write that sentence, and still use the model, is exactly the kind of thing that separates a strong answer from an average one.", "topic": "Norman control: the feudal system as a historians' model"}, {"id": "h7-norman-control:q14", "level": "stretch", "type": "long", "q": "Force, land, law and information. Which one of these was most important in helping the Normans control England? Give your judgement, support it with examples, and explain the strongest argument against your view.", "marks": 6, "answer": "In my judgement land was the most important tool, because it was the one that made all the others possible and the one that lasted. William took the land of the English lords and gave it to Normans, so that by 1086 almost every large landholder in England was Norman. That solved two problems at once. It removed the English lords who had the wealth and followers to lead a rebellion, and it meant the new Norman lords only kept their land by staying loyal, because land was held in return for service and could be taken back. It also paid for everything else, since it was the barons holding that land who built and manned the castles and who ran the local courts. The strongest argument against my view is force. In 1069 and 1070 there were serious rebellions in the north, and William answered with the Harrying of the North, destroying villages, animals and seed grain so that famine followed and much of Yorkshire was still recorded as waste in the Domesday survey of 1086, sixteen years later. That is a fair point, because in those first years William held England by terror, and if he had lost in 1069 there would have been no land left to grant to anybody. I would answer it like this. Force settles a crisis but it does not hold a country for twenty years, because you cannot burn the same region twice and it earns you nothing. Land quietly worked every single day without a soldier having to move. Law and information mattered too, with the murdrum fine making English neighbours police each other and the Domesday survey telling William exactly what everyone owed, but both of those only worked because Norman lords already held the ground. So force was decisive in the short term and land was decisive in the long term, and since the question is about controlling England rather than conquering it, I put land first.", "hint": "Pick one tool and commit to it. Then give your best two examples, then the strongest point on the other side, then answer that point.", "explain": "A full mark answer contains these six things, one mark each. One, it names one tool clearly as most important in the first sentence, instead of drifting through all four. Two, it supports that choice with specific evidence, meaning real names, real dates or real detail, not just the word castles. Three, it explains a second tool properly, showing it understands what that tool did. Four, it gives the strongest argument against its own choice, fairly, rather than a weak one that is easy to knock down. Five, it answers that counter argument instead of just mentioning it. Six, it ends with a clear judgement, ideally one that separates the short term from the long term, since that is what makes 'which was most important' answerable at all. Any of the four tools can score full marks. There is no right answer here, only a well argued one and a badly argued one.", "topic": "Norman control: judgement on which tool of control mattered most"}]}, "h8-medieval-life": {"id": "h8-medieval-life", "day": "Day 3", "subject": "History", "title": "Life in medieval England", "minutes": 25, "objective": "Describe village life, the church, towns and the Black Death, and use the concept of change and continuity to explain what altered and what carried on after 1348.", "extract": "AN ENGLISH VILLAGE, ABOUT 1300\n\nAbout ninety people in twenty families. No shop, no doctor, no school. Everyone knows everyone.\n\nThe land. Three big open fields divided into long thin strips. Each family farms strips scattered across all three fields, so nobody gets all the good soil and nobody gets all the bad. Two fields are sown each year. The third is left fallow, which means nothing is sown on it so the soil can recover, and the animals graze there instead.\n\nThe people. Most are villeins, also called serfs. A villein is not a slave, but he is not free either. He holds land from the lord of the manor and pays for it by working the lord's own fields, usually two or three days a week, plus extra days at harvest. He cannot leave the village, marry off his daughter or sell his ox without the lord's permission. A smaller number are freemen, who pay rent in money and can leave if they choose.\n\nThe church. The stone church is the biggest building for miles. Services are in Latin, which almost nobody in the village understands. Everyone pays a tithe, one tenth of everything they produce, to the church. On the wall above the arch is a painting of the Day of Judgement, showing heaven above and hell below in colour, because most people cannot read.\n\nThe town. A day's walk away there is a market town with a royal charter. It holds a market once a week and a fair once a year. Its main trade is wool, which was England's biggest export. There is a rule that a serf who lives in a chartered town for a year and a day becomes free.\n\nWAGES AND THE BLACK DEATH\n\nThese figures are rounded and simplified for this exercise. They show the pattern historians describe rather than exact national averages.\n\nA labourer's daily pay, before 1348    about 1.5 pence\nA labourer's daily pay, by the 1350s   about 3 pence\n\nIn 1351 Parliament passed the Statute of Labourers, which made it illegal to pay, or to accept, more than the wages that had been normal in 1346.", "teach": {"intro": ["For most people in medieval England, life was farming, church, and the same village their grandparents were born in. It was not a life anybody chose. It was the one they inherited, and for a villein the law made leaving it very hard.", "The concept for today is change and continuity. Change is what is different afterwards. Continuity is what carries straight on. A weak answer lists only the changes, because changes are more interesting. A strong answer names both and then says which mattered more.", "Then in 1348 the Black Death arrived and killed somewhere between a third and a half of everyone in England. That is the biggest single change in medieval English history, and even so, a surprising amount of ordinary life carried on exactly as before."], "example": {"problem": "Give one change and one continuity for a peasant family between 1340 and 1360.", "steps": ["Find the change. Before 1348 there were far more workers than there was work, so the lord set the wage and took it or leave it was the only offer. After 1348 there were far fewer workers, so a labourer could demand double, or walk to a village that would pay it.", "Find the continuity. They still farmed the same strips in the same three fields, still paid a tithe to the same church, still had a lord above them, and still could not read.", "Say which mattered more, and give a reason. The change in wages mattered more, because it shifted who had the power to say no.", "Test that with evidence. If it had not shifted, Parliament would not have passed a law in 1351 to try to shift it back."], "answer": "Change: wages roughly doubled and workers could bargain. Continuity: the fields, the church and the lord all stayed."}, "example2": {"problem": "Was the Peasants' Revolt of 1381 a success or a failure?", "steps": ["Look at the short term. The rebels reached London, killed the Archbishop of Canterbury and the Treasurer, and met the king twice. Then Wat Tyler was killed at Smithfield, Richard II cancelled the promises he had made, and the leaders were hunted down and executed. In the short term it failed.", "Look at the longer term. No English government risked a poll tax like that again for well over a century, and serfdom faded away across the next hundred years.", "Be honest about the link. Historians disagree about how much of that fading was caused by the revolt and how much by the shortage of workers after the Black Death, which was already pushing in the same direction.", "Write the honest version rather than the tidy one. Saying which parts are settled and which are argued over is worth more than picking a side and hiding the problem."], "answer": "It failed in the short term. Its longer term effects are real but disputed."}, "keyfact": "Change and continuity means naming what altered and what carried on. The Black Death changed who held the power over wages, but the fields, the church and the lord were all still there, and the best answers say both and then judge which mattered more."}, "questions": [{"id": "h8-medieval-life:q1", "level": "easy", "type": "mc", "q": "In about 1300, what did most people in England do?", "options": ["Farmed land in a village", "Worked in factories in cities", "Served as soldiers in the king's army", "Worked at sea as sailors"], "answer": "Farmed land in a village", "hint": "There are no machines yet. Everything anyone eats has to be grown by hand.", "explain": "The answer is farming in a village. Roughly nine people in ten lived in the countryside and grew food. Factories belong to the Industrial Revolution, which is around five hundred years later. England's population before 1348 was somewhere around four to six million, and even London, by far the biggest town, held only a few tens of thousands of people.", "topic": "Medieval life: how most people lived"}, {"id": "h8-medieval-life:q2", "level": "easy", "type": "mc", "q": "What was a tithe?", "options": ["One tenth of what you produced, paid to the church", "One half of your crop, paid to the king", "A fine for missing church on a Sunday", "A payment for using the lord's mill"], "answer": "One tenth of what you produced, paid to the church", "hint": "The word is related to the word tenth.", "explain": "The answer is one tenth of what you produced, paid to the church. It was usually paid in goods rather than money, in grain, eggs or animals, which is why some villages had a tithe barn to store it all. Paying to use the lord's mill was a real and much resented charge, but it was separate and went to the lord, not to the church.", "topic": "Medieval life: the tithe"}, {"id": "h8-medieval-life:q3", "level": "easy", "type": "text", "q": "In which year did the Black Death reach England? Write the year only.", "answer": "1348", "accept": ["1348", "AD 1348", "in 1348"], "hint": "It is in the 1340s, and it reached London later the same year.", "explain": "The answer is 1348. It is usually said to have arrived at Melcombe Regis in Dorset in June 1348, carried on a ship, and it had reached London by the autumn. The worst of that first wave was over in England by 1350, but plague came back again and again, including a serious return in 1361. So 1348 is the start of the story, not the whole of it.", "topic": "Medieval life: the date the Black Death reached England"}, {"id": "h8-medieval-life:q4", "level": "easy", "type": "mc", "q": "What was a villein?", "options": ["A peasant who held land from the lord and paid for it with work, and who could not leave the village without permission", "A soldier who guarded the lord's castle", "A farmer who paid rent in money and could move wherever he liked", "The priest in charge of a village church"], "answer": "A peasant who held land from the lord and paid for it with work, and who could not leave the village without permission", "hint": "He has land and a house of his own, but he cannot walk away.", "explain": "The answer is the first option. A villein, also called a serf, held land from the lord of the manor and paid for it in labour, usually two or three days a week on the lord's own fields plus extra at harvest. He was not a slave, because he had his own land and house, but he was not free either, since he needed the lord's permission to leave, to marry off a daughter, or even to sell an ox. The third option describes a freeman, who paid rent in money and could move. That difference between paying in work and paying in money matters a lot after 1348.", "topic": "Medieval life: what a villein was"}, {"id": "h8-medieval-life:q5", "level": "easy", "type": "mc", "q": "In the three field system, what happened to the third field each year?", "options": ["It was left fallow, meaning nothing was sown on it so the soil could recover", "It was sold to the church", "It was flooded on purpose", "It was given to the king"], "answer": "It was left fallow, meaning nothing was sown on it so the soil could recover", "hint": "There is no artificial fertiliser yet, so how else do you stop the soil wearing out?", "explain": "The answer is that it was left fallow. Growing crops takes goodness out of the soil, and with no artificial fertiliser the only way to put it back was rest and animal manure. So two fields were sown each year and the third rested, with the animals grazing on it and manuring it as they went, and the fields took turns. It means a third of your land grows nothing every year, which sounds wasteful until you realise the alternative is soil that stops producing anything at all.", "topic": "Medieval life: the three field system and fallow land"}, {"id": "h8-medieval-life:q6", "level": "medium", "type": "text", "q": "In which year was the Peasants' Revolt? Write the year only.", "answer": "1381", "accept": ["1381", "AD 1381", "in 1381"], "hint": "It is in the 1380s, about a generation after the Black Death.", "explain": "The answer is 1381, and the main events all happened in June of that year. Rebels came from Essex and Kent, led by Wat Tyler with the preacher John Ball among them. They entered London, killed Simon Sudbury, who was both Archbishop of Canterbury and the king's Chancellor, and Robert Hales, the Treasurer. They met King Richard II, who was fourteen years old at the time, at Mile End on 14 June and again at Smithfield on 15 June.", "topic": "Medieval life: the date of the Peasants' Revolt"}, {"id": "h8-medieval-life:q7", "level": "medium", "type": "mc", "q": "After the Black Death, why could an ordinary labourer suddenly demand more pay?", "options": ["So many workers had died that there was far more work than there were people to do it, so a labourer could bargain or walk away", "The king ordered every lord to pay more", "New machines meant each worker produced much more", "The church handed out money to every peasant"], "answer": "So many workers had died that there was far more work than there were people to do it, so a labourer could bargain or walk away", "hint": "The people died. The fields did not. So what happens to the value of a pair of hands?", "explain": "The answer is the first option. This is the key idea of the whole topic, so hold it: the plague killed people, but it did not kill land. Afterwards there was the same amount of ground to plough and harvest and far fewer people to do it, so a labourer's work became scarce and therefore worth more. A lord with a field of wheat ready and nobody to cut it either paid up or watched the crop rot. The words to use in an answer are labour shortage and bargaining power.", "topic": "Medieval life: why wages rose after the Black Death"}, {"id": "h8-medieval-life:q8", "level": "medium", "type": "mc", "q": "What was the point of the Statute of Labourers of 1351?", "options": ["To make it illegal to pay or accept wages higher than those normal in 1346, and so hold wages down after the Black Death", "To give every labourer a pay rise", "To set all villeins free", "To send labourers to fight in France"], "answer": "To make it illegal to pay or accept wages higher than those normal in 1346, and so hold wages down after the Black Death", "hint": "Who sat in Parliament, and what had just started happening to their wage bills?", "explain": "The answer is the first option. Parliament was made up of landowners, and landowners were the people now being asked to pay double, so they passed a law freezing wages at the levels of 1346, before the plague. Notice that it punished the worker for accepting as well as the employer for paying, which tells you how badly it was being broken. It was very hard to enforce, because both sides had reasons to ignore it, but it was enforced often enough to cause real anger, and it is one of the deeper causes of the revolt thirty years later.", "topic": "Medieval life: the Statute of Labourers 1351"}, {"id": "h8-medieval-life:q9", "level": "medium", "type": "text", "q": "The Black Death reached England in 1348. The Peasants' Revolt was in 1381. How many years apart were they? Write the number only.", "answer": "33", "accept": ["33", "33 years", "thirty three", "thirty-three", "thirty three years"], "hint": "Both are AD dates, so subtract.", "explain": "The answer is 33, because 1381 minus 1348 is 33. That gap is worth noticing, because it is more than a generation. Most of the rebels of 1381 were not old enough to remember 1348 themselves. They had grown up in the world the plague left behind, one where they knew their work was worth more and where the law kept telling them it was not.", "topic": "Medieval life: calculating the gap from the Black Death to 1381"}, {"id": "h8-medieval-life:q10", "level": "medium", "type": "mc", "q": "What was the immediate trigger of the Peasants' Revolt in 1381?", "options": ["The poll tax of 1381, the third in five years, and the officials sent out to collect it from people who had avoided paying", "The Black Death arriving in the villages", "The king banning all church services", "The Statute of Labourers being cancelled"], "answer": "The poll tax of 1381, the third in five years, and the officials sent out to collect it from people who had avoided paying", "hint": "Same skill as 1066. The trigger is the spark, not the pile of dry wood.", "explain": "The answer is the poll tax of 1381. A poll tax is charged per head, the same amount from everybody, which means it takes a far bigger share of a poor family's income than a rich one's. There had been three of them in five years, in 1377, 1379 and 1381, and when large numbers of people simply did not pay the last one, officials were sent out to chase them. That is the spark. It is not the deepest reason. The deeper causes are the labour shortage after the Black Death, the Statute of Labourers holding wages down, the cost of the long war with France, and preachers such as John Ball asking why some men were lords and others were not. Naming the trigger and the deeper causes separately is exactly the same skill you used on 1066.", "topic": "Medieval life: the trigger of the Peasants' Revolt"}, {"id": "h8-medieval-life:q11", "level": "stretch", "type": "mc", "q": "Which of these is the best example of continuity across the Black Death, rather than change?", "options": ["Villagers still farmed strips in open fields, still paid a tithe, and still had a lord above them", "Wages for labourers roughly doubled", "Some villages were abandoned completely", "Parliament passed a law to hold wages down"], "answer": "Villagers still farmed strips in open fields, still paid a tithe, and still had a lord above them", "hint": "Continuity means the things that carried straight on as if nothing had happened.", "explain": "The answer is the first option, because those are things that carried straight on. The other three are all change, or reactions to change. Wages doubling is change. Villages being abandoned is change. Parliament legislating in 1351 is a response to change. This question is here because continuity is the half everybody forgets. The plague was the worst thing that ever happened to England, and the following spring people still walked out to the same strips, still handed over a tenth to the same church, and still needed the lord's permission to leave. Naming that alongside the changes is what turns a list into an argument.", "topic": "Medieval life: identifying continuity across the Black Death"}, {"id": "h8-medieval-life:q12", "level": "stretch", "type": "mc", "q": "How did the Black Death spread? What is the honest answer?", "options": ["Most researchers point to a bacterium called Yersinia pestis, which DNA taken from medieval burial pits has confirmed, but they still argue about how it travelled, whether mainly by fleas on rats or from person to person by human fleas and lice", "It is completely unknown, because no evidence of any kind survives", "Everyone agrees it was spread only by rats, and there is no debate at all", "It was caused by bad air, exactly as people at the time believed"], "answer": "Most researchers point to a bacterium called Yersinia pestis, which DNA taken from medieval burial pits has confirmed, but they still argue about how it travelled, whether mainly by fleas on rats or from person to person by human fleas and lice", "hint": "Split the question in two. What caused it, and how did it get from person to person? One of those is settled and one is not.", "explain": "The answer is the first option, and the trick is to split the question. What caused it is close to settled, because DNA recovered from medieval plague burials in London identified Yersinia pestis. How it travelled is still argued over. The classic story is fleas living on black rats, but that struggles to explain how fast the disease moved through cold English winters, so some researchers argue the main route was person to person, through human fleas and lice. People at the time had none of this and blamed God's punishment, bad air, or the position of the planets. In parts of continental Europe Jewish communities were attacked and murdered on false accusations of poisoning wells, though not in England, since Edward I had expelled England's Jews in 1290. Saying clearly what is agreed and what is still argued is a historian's move, and it earns marks.", "topic": "Medieval life: what is settled and what is disputed about how the plague spread"}, {"id": "h8-medieval-life:q13", "level": "stretch", "type": "mc", "q": "Did the Peasants' Revolt of 1381 work?", "options": ["Not immediately. Wat Tyler was killed, Richard II cancelled the promises he had made, and the leaders were executed. Serfdom did fade over the following century, but historians argue about how much of that the revolt caused", "Yes. Serfdom was abolished by law within a month", "Yes. The king was overthrown and Wat Tyler ruled in his place", "No. The rebels never got out of Kent"], "answer": "Not immediately. Wat Tyler was killed, Richard II cancelled the promises he had made, and the leaders were executed. Serfdom did fade over the following century, but historians argue about how much of that the revolt caused", "hint": "Judge it twice. Once by what happened that summer, and once by what England looked like a hundred years later.", "explain": "The answer is the first option. In the short term it clearly failed. The rebels entered London on 13 June 1381, met Richard II at Mile End on 14 June, and met him again at Smithfield on 15 June, where Wat Tyler was killed by William Walworth, the Mayor of London. Richard then revoked the charters of freedom he had granted, the rising was put down, and John Ball was executed in July. In the longer term serfdom did fade, and by around 1500 it had largely gone in England, and no government risked a poll tax like that one for well over a century. The honest complication is that the labour shortage after the Black Death was already pushing serfdom towards collapse before 1381, so historians disagree about how much weight to give the revolt itself. Give both timescales and name the disagreement.", "topic": "Medieval life: judging the success of the Peasants' Revolt"}, {"id": "h8-medieval-life:q14", "level": "stretch", "type": "long", "q": "How much did life in an English village change between 1340 and 1400? Name at least two changes and at least two things that stayed the same, and end with a judgement about which mattered more.", "marks": 6, "answer": "A great deal changed for the people of an English village between 1340 and 1400, but a great deal also carried straight on. The biggest change was the Black Death, which reached England in 1348 and killed somewhere between a third and a half of the population, so that a village of ninety people in 1340 might hold half that number a few years later, and some villages were abandoned altogether. The second change followed from the first. Because so many workers had died and the land still needed working, a labourer's work became scarce and therefore valuable, and wages for ordinary labourers roughly doubled. Parliament tried to stop that with the Statute of Labourers in 1351, freezing wages at their 1346 levels, and the fact that a law was needed at all shows how far the balance of power had shifted. Anger at that law, along with three poll taxes in five years, helped produce the Peasants' Revolt of 1381. Against that, the continuities are striking. Villagers still farmed long thin strips in the same open fields, with one field left fallow each year, exactly as their grandparents had. They still paid a tithe of one tenth of everything they produced to the same church, still heard services in Latin they did not understand, and still had a lord of the manor above them who could demand work and permission fees. The king, the lords and the church were all still in place in 1400, and the revolt of 1381 had been crushed rather than won. In my judgement the changes mattered more, because the change was in who held the power to say no. Before 1348 a labourer took whatever the lord offered, because there were more workers than jobs. After 1348 he could refuse and walk to the next village, and no law could stop that for long. The things that stayed the same were the scenery of village life, the fields, the church and the manor. What changed was the bargaining position of the people standing in it, and over the next hundred years that is what killed serfdom.", "hint": "Two changes, two continuities, then a judgement. Write it in that order and put a date in every paragraph.", "explain": "A full mark answer contains these six things, one mark each. One, a first change, correctly dated, such as the Black Death of 1348 and the scale of the deaths. Two, a second change, such as wages roughly doubling, the Statute of Labourers of 1351, or the Peasants' Revolt of 1381. Three, a first continuity, such as the open fields, the strips or the fallow year. Four, a second continuity, such as the tithe, the church and its Latin services, or the lord of the manor still being in place. Five, precise supporting detail, meaning real dates and real terms rather than vague phrases like things got better. Six, a judgement at the end that says which mattered more and gives a reason, rather than finishing with the words some things changed and some stayed the same, which is a description and not an argument. Either judgement can score, as long as it is reasoned.", "topic": "Medieval life: change and continuity across the fourteenth century"}]}, "h9-sources": {"id": "h9-sources", "day": "Day 4", "subject": "History", "title": "How we know", "minutes": 25, "objective": "Work out the provenance of a source, keep reliability and usefulness apart, tell primary from secondary, and cross reference two sources that disagree.", "extract": "IMPORTANT, READ THIS FIRST\n\nThe three sources below were written for this exercise. They are not real historical documents, they are not quotations from any real person, and you will not find them in any book. They have been written in the style of the period so that you can practise source skills on them. The events they describe are real, and the debate described in Source C is a real debate among historians.\n\nSOURCE A\nWritten for this exercise, in the style of a Norman churchman writing in about 1075. He came to England with William and holds his position because of him.\n\n\"The duke came with a just cause and God granted him the victory. The English had broken their oaths and set a perjurer upon the throne, and so the Lord gave them into our hands in a single day. Since then the land has known order. Robbers are hanged, churches are rebuilt in good stone, and a man may ride from one coast to the other with gold in his hand and not be touched. Those who submitted have kept their lands. Only the obstinate have suffered, and they brought it upon themselves.\"\n\nSOURCE B\nWritten for this exercise, in the style of an English monk in a northern monastery, writing in about 1080. His monastery lost land during the fighting in the north.\n\n\"In the winter after the rising, the soldiers came down the valleys and left nothing behind them. They burned the corn in the barns and killed the oxen in the byres, and what they could not carry away they spoiled. It was not the fighting men who died afterwards but the children and the old. I have ridden a whole day between York and Durham and seen no smoke rising from any roof. They call this peace. The land is quiet because there is no one left in it.\"\n\nSOURCE C\nWritten for this exercise, in the style of a modern school textbook.\n\n\"After rebellions in 1069, William ordered a campaign of destruction across northern England in the winter of 1069 to 1070, now known as the Harrying of the North. Villages, crops, livestock and seed grain were destroyed, and famine followed. The Domesday survey of 1086 still records large amounts of land in Yorkshire as waste. Writers at the time gave death tolls as high as 100,000, but historians treat such figures as unreliable, since no count was ever made. Historians agree the damage was severe and long lasting. They disagree about how far William intended famine as the outcome, and about how much of the land recorded as waste was made waste by the Harrying rather than by other causes.\"", "teach": {"intro": ["Every source was written by somebody, at some time, for some reason. Those three things together are called the provenance, and that is where most of the marks in a source question actually are. Get into the habit of reading the little note above a source before you read the source itself.", "Reliability and usefulness are not the same thing, and mixing them up throws marks away. Reliable means you can trust what it says happened. Useful means it tells you something worth knowing for the question you are asking. A source can be completely one sided and still be extremely useful.", "Cross referencing means holding two sources side by side and asking three things: where do they agree, where do they clash, and what would explain the clash. The explanation almost always comes back to the provenance."], "example": {"problem": "Work out the provenance of Source A and say what it means for how you read it.", "steps": ["Who. A Norman churchman who came over with William and owes his position to him.", "When. About 1075, which is nine years after the conquest. Close enough to be within living memory, but late enough that the outcome is already settled.", "Why. To justify the conquest and to argue that the new order is a good one. It is written to persuade somebody.", "So what. Expect the good side of Norman rule, and expect any violence to be played down or blamed on the people it happened to.", "Then take one step further, because this is where the marks are. The fact that he feels the need to argue that William had a just cause tells you that people were still arguing about it in 1075. That is useful information all by itself."], "answer": "Norman, close to William, writing about nine years afterwards to justify the conquest, so it is one sided in a direction you can predict"}, "example2": {"problem": "Cross reference Source A and Source B on what Norman rule was like.", "steps": ["Find the agreement. Both agree that England after 1066 was quiet, and both agree that force was used to make it so.", "Find the clash. Source A calls that quiet order, and says only the obstinate suffered. Source B says the quiet is emptiness, and that the people who died were children and the old.", "Explain the clash using provenance. A is a Norman writing to justify what his side did. B is an Englishman in the region that was destroyed, whose own monastery lost land.", "Do not stop at the word biased. Say what each writer is well placed to know. A is close to the Norman leadership and knows how they explained themselves. B has ridden through the valleys and knows what they look like.", "Then test both against something else. Source C, and the Domesday waste entries it describes, supports Source B on the scale of the damage."], "answer": "They agree England was quiet and that force was used, and they disagree completely about what that quiet cost. Source C supports Source B on the scale of the damage."}, "keyfact": "Ask three questions of every source: who wrote it, when, and why. Then keep reliability and usefulness apart, because a one sided source is still first class evidence of what one side wanted people to believe."}, "questions": [{"id": "h9-sources:q1", "level": "easy", "type": "mc", "q": "What does provenance mean?", "options": ["Who made a source, when they made it, and why", "How long a source is", "Whether a source is written in English", "Whether a source has been printed in a book"], "answer": "Who made a source, when they made it, and why", "hint": "Three questions, and none of them is about what the source says.", "explain": "The answer is who made it, when, and why. Provenance is everything about where a source came from, rather than what it says. It is the first thing to look at, because it tells you what to expect before you read a word. In an exam the provenance is normally printed in small type above or below the source, and students who skip it lose marks they were being handed for free.", "topic": "Sources: what provenance means"}, {"id": "h9-sources:q2", "level": "easy", "type": "mc", "q": "What is a primary source?", "options": ["Something made at the time, by someone who was there or close to the events", "Any source that is very reliable", "A book written by a historian today", "The first source you happen to read"], "answer": "Something made at the time, by someone who was there or close to the events", "hint": "It is about when it was made, not about how good it is.", "explain": "The answer is something made at the time by someone there or close to it. Primary sources are not only writing. A coin, a castle, a skeleton, the Bayeux Tapestry and the Domesday Book are all primary sources. A secondary source is made later by somebody studying the period, such as a modern textbook. Note that primary does not mean reliable. A primary source can be a straight lie, told by somebody who was in the room. Note also that the line can blur, because a monk writing sixty years later using older accounts sits somewhere in between, and pointing that out is a strength rather than a dodge.", "topic": "Sources: primary and secondary"}, {"id": "h9-sources:q3", "level": "easy", "type": "text", "q": "Is Source C a primary source or a secondary source? Write primary or secondary.", "answer": "secondary", "accept": ["secondary", "Secondary", "a secondary source", "secondary source", "it is secondary"], "hint": "Look at the note above it. When was it written, compared with the events?", "explain": "The answer is secondary. Source C is written in the style of a modern textbook, which means it was produced hundreds of years after the events by somebody studying them rather than living through them. That gives it two advantages the others do not have. It can use evidence from many different places, including the Domesday records, and it can tell you what historians today argue about. It also has a disadvantage, which is that nobody who wrote it was ever there.", "topic": "Sources: identifying a secondary source"}, {"id": "h9-sources:q4", "level": "easy", "type": "mc", "q": "According to the note above Source A, who wrote it?", "options": ["A Norman churchman who came over with William and owes his position to him", "An English peasant from Yorkshire", "A modern historian", "A Norwegian soldier"], "answer": "A Norman churchman who came over with William and owes his position to him", "hint": "The answer is in the small print above the source, not in the source itself.", "explain": "The answer is a Norman churchman who came over with William and owes his position to him. The last part of that is the part that matters. It is not simply that he is Norman, it is that his job, his status and his security all depend on William's rule continuing. That gives him a direct interest in the conquest being seen as just, and it tells you which way any one sidedness will point before you read the first line.", "topic": "Sources: reading the provenance note"}, {"id": "h9-sources:q5", "level": "easy", "type": "mc", "q": "Complete this rule. A source that is one sided and unreliable about the facts can still be...", "options": ["very useful, because it is strong evidence of what its writer wanted people to believe", "ignored, because bias makes a source worthless", "treated as completely true", "turned into a primary source"], "answer": "very useful, because it is strong evidence of what its writer wanted people to believe", "hint": "Ask what a one sided source is definitely good evidence of, even if it is bad evidence of what happened.", "explain": "The answer is that it can still be very useful. This is the single most important sentence in the whole topic, so learn it: a source that is unreliable about what happened is still reliable evidence of what its writer thought, wanted, or wanted others to think. Source A may be a poor guide to how much people suffered in the north. It is an excellent guide to how the Normans explained themselves, and that is a real historical question.", "topic": "Sources: reliability against usefulness"}, {"id": "h9-sources:q6", "level": "medium", "type": "mc", "q": "Source A says that only the obstinate suffered. What in its provenance best explains that?", "options": ["It was written by a Norman who owes his position to William, about nine years after the conquest, in order to justify what William had done", "It was written by someone who had never heard of the conquest", "It was written three hundred years later", "It was written by an English monk in the north"], "answer": "It was written by a Norman who owes his position to William, about nine years after the conquest, in order to justify what William had done", "hint": "Who benefits if readers believe that sentence?", "explain": "The answer is the first option. Blaming the victims is a very efficient move for a writer in his position, because it lets him admit the violence happened without admitting it was wrong. Notice what that means, though, and this is the clever bit. He does not deny that people suffered. So Sources A and B actually agree that suffering took place, and disagree about whose fault it was and what it should be called. Spotting an agreement hidden inside a disagreement is exactly the kind of thing that lifts an answer into the top band.", "topic": "Sources: using provenance to explain what a source says"}, {"id": "h9-sources:q7", "level": "medium", "type": "text", "q": "Was Source B written from the Norman side or the English side? Write one word.", "answer": "English", "accept": ["English", "english", "the English side", "English side", "the english"], "hint": "Look at the note above it. Where is his monastery, and what happened to it?", "explain": "The answer is English. Source B is written in the style of an English monk in a northern monastery, in the region that was destroyed, and his own monastery lost land in the fighting. That gives him a clear point of view, and it also gives him something Source A does not have, which is direct local knowledge of what the north actually looked like afterwards. Both things are true at once, and a good answer says both.", "topic": "Sources: identifying whose side a source is on"}, {"id": "h9-sources:q8", "level": "medium", "type": "mc", "q": "A student writes: 'Source A is not useful because it is biased.' What is wrong with that sentence?", "options": ["It confuses reliability with usefulness. Source A is one sided, so it is not reliable about how much people suffered, but it is very useful evidence of how the Normans justified the conquest", "Nothing is wrong with it, it is a strong point", "Source A is not biased at all", "Bias means a source cannot be primary"], "answer": "It confuses reliability with usefulness. Source A is one sided, so it is not reliable about how much people suffered, but it is very useful evidence of how the Normans justified the conquest", "hint": "Two different words are being treated as if they mean the same thing.", "explain": "The answer is that it confuses reliability with usefulness. This is the most commonly wasted sentence in source questions anywhere. Bias is not a reason to throw a source away, it is a thing to identify, explain and then use. Rewrite the student's sentence like this: Source A is one sided, because its writer is a Norman churchman who owes his position to William, so it cannot be trusted on how much the English suffered. That same one sidedness makes it very useful evidence of how the Normans justified what they had done. Same observation, twice the marks.", "topic": "Sources: why biased does not mean useless"}, {"id": "h9-sources:q9", "level": "medium", "type": "mc", "q": "Sources A and B disagree about what Norman rule was like. What is the best thing to do next?", "options": ["Look at the provenance of each, work out what each one is well placed to know, and then test both against other evidence such as Source C and the Domesday records", "Pick the longer source and believe that one", "Decide they are both useless because they disagree", "Believe whichever one was written first"], "answer": "Look at the provenance of each, work out what each one is well placed to know, and then test both against other evidence such as Source C and the Domesday records", "hint": "Disagreement is not a dead end. It is the start of the actual work.", "explain": "The answer is the first option, and that is cross referencing. Two sources disagreeing is not a problem to be tidied away, it is information. Ask why each writer would say what he says, ask what each is genuinely in a position to know, and then bring in a third thing to test them against. Here that third thing is Source C, which points to the Domesday waste entries for Yorkshire in 1086. Length proves nothing, being written first proves nothing, and giving up because they disagree throws away the whole question.", "topic": "Sources: how to cross reference two sources that disagree"}, {"id": "h9-sources:q10", "level": "medium", "type": "text", "q": "Which of the three sources is the only secondary source? Write one letter.", "answer": "C", "accept": ["C", "c", "Source C", "source C", "source c"], "hint": "Two were written within about fifteen years of the events. One was not.", "explain": "The answer is C. Sources A and B are written in the style of men writing in about 1075 and about 1080, within living memory of the events, so they stand as primary sources. Source C is in the style of a modern textbook, written centuries later by someone studying the period, so it is secondary. Remember that this says nothing about which one is most trustworthy. Secondary sources can draw on far more evidence than any one person at the time could ever see, and primary sources can be flatly untrue.", "topic": "Sources: sorting a set into primary and secondary"}, {"id": "h9-sources:q11", "level": "stretch", "type": "mc", "q": "You are investigating how badly northern England was damaged in the winter of 1069 to 1070. Which source is most useful for that enquiry, and why?", "options": ["Source B, because its writer was in the north at the time and describes what he saw, and Source C supports him using the Domesday waste entries", "Source A, because it is the most confident", "Source C on its own, because modern writing is always the best", "None of them, because none of them is fully reliable"], "answer": "Source B, because its writer was in the north at the time and describes what he saw, and Source C supports him using the Domesday waste entries", "hint": "Usefulness always depends on the question being asked. Read the enquiry again before choosing.", "explain": "The answer is Source B, supported by Source C. Notice that the answer changes with the enquiry: for this question B is the most useful, but for a question about how the Normans justified themselves, A becomes the most useful of the three and B is close to useless. Usefulness is always usefulness for something. Two warnings go with picking B. It is not neutral, because his monastery lost land and he has every reason to describe the worst. And his line about riding a whole day and seeing no smoke may be a way of saying a very great deal rather than a literal measurement, in the same way that 100,000 is. Confidence, as in option two, is not evidence of anything.", "topic": "Sources: judging usefulness against a specific enquiry"}, {"id": "h9-sources:q12", "level": "stretch", "type": "mc", "q": "For which enquiry would Source A be the most useful of the three?", "options": ["How the Normans explained and justified the conquest, to themselves and to others", "How many people died in northern England", "What crops were grown in Yorkshire", "What historians today think about the Harrying"], "answer": "How the Normans explained and justified the conquest, to themselves and to others", "hint": "What is a one sided source guaranteed to be excellent evidence of?", "explain": "The answer is how the Normans justified the conquest. This is the flip side of the previous question, and together they make the point: the same source moves from nearly useless to the best of the three depending only on what you are asking. For the death toll, Source A is worthless, since it never gives one and has every reason to minimise it. For crops in Yorkshire, none of these sources helps, and you would want the Domesday entries themselves. For what historians think today, that is Source C. But for how the conquerors explained themselves, Source A is direct, first hand evidence and nothing else here comes close.", "topic": "Sources: matching the right source to the right enquiry"}, {"id": "h9-sources:q13", "level": "stretch", "type": "mc", "q": "Source C says historians agree the damage was severe but disagree about how much of the recorded waste the Harrying caused. Why is it worth writing that kind of sentence in an exam?", "options": ["Because it shows you know the difference between what the evidence settles and what it does not, which is exactly what the top marks are for", "Because examiners like long sentences", "Because it means you do not have to reach a judgement", "Because disagreement proves history cannot be known at all"], "answer": "Because it shows you know the difference between what the evidence settles and what it does not, which is exactly what the top marks are for", "hint": "Think about what it proves about you as a reader, not about the sources.", "explain": "The answer is the first option. Being able to say this bit is settled and this bit is argued over shows you are reading the evidence rather than repeating a story, and that is precisely what separates the top band from the middle. Watch out for the opposite mistake, though, which is the third and fourth options. Historians disagree, so nobody can ever know is a weak ending and it scores badly, because it uses uncertainty as an excuse to avoid deciding anything. The strong move is to say what is settled, say what is not, and then still give your own judgement with reasons, while being open about how confident you are.", "topic": "Sources: writing about genuine disagreement between historians"}, {"id": "h9-sources:q14", "level": "stretch", "type": "long", "q": "Sources A and B describe the same England and disagree completely about it. Use provenance to explain why they disagree, then explain what each source is genuinely useful for, and finish with a judgement about how a historian should use the two together.", "marks": 6, "answer": "The two sources disagree because of who wrote them, when and why. Source A is written in the style of a Norman churchman writing in about 1075, who came over with William and holds his position because of him. His security depends on Norman rule lasting, and he is writing to justify the conquest, so he describes order, rebuilt churches and safe roads, and says that only the obstinate suffered. Source B is written in the style of an English monk in a northern monastery in about 1080, in exactly the region William destroyed, whose own house lost land. He describes burned corn, killed oxen, a full day's ride between York and Durham with no smoke from any roof, and children and old people dying afterwards rather than fighting men. Each man is describing the part of England he can see, in the words that suit his position. What each is useful for is different. Source A is not reliable about suffering, because its writer has every reason to play it down, but it is very useful evidence of how the Normans explained and justified the conquest, and the fact that he still felt the need to argue that William had a just cause in about 1075 suggests people were still disputing it then. Source B is not neutral either, since his monastery lost land and he has reason to describe the worst, and his day's ride with no smoke may mean a very great deal rather than being a literal measurement. But he was there, in the region concerned, and he is very useful evidence of what the Harrying did to ordinary people in the north. It is also worth noticing that the two sources are not in total opposition. Source A does not deny that people suffered, he simply says they deserved it, so both agree that force was used and that England afterwards was quiet. My judgement is that a historian should not choose between them but use them against each other and against a third kind of evidence. Cross referencing them shows where the real disagreement lies, which is not over whether there was destruction but over whether it was justified. Then the Domesday survey of 1086, which still records large amounts of Yorkshire as waste sixteen years later, tests the scale, and it supports Source B rather than Source A. The right conclusion is that Source B is closer to the truth about the damage while Source A remains the better guide to how the conquerors thought, and that neither should be thrown away.", "hint": "Four paragraphs: why they disagree, what A is useful for, what B is useful for, and how to use them together. Use the provenance note in every paragraph.", "explain": "A full mark answer contains these six things, one mark each. One, it uses the provenance of Source A, meaning the Norman churchman, about 1075, writing to justify, rather than just saying he is biased. Two, it uses the provenance of Source B in the same way, meaning the English monk, about 1080, in the region destroyed, whose monastery lost land. Three, it states what Source A is genuinely useful for, which is Norman justification, and keeps that separate from whether it is reliable. Four, it states what Source B is genuinely useful for, and is honest that B has its own reasons to exaggerate, which stops the answer becoming one sided in the other direction. Five, it cross references properly, either by finding the hidden agreement that both accept force was used, or by bringing in outside evidence such as the Domesday waste entries of 1086. Six, it reaches a judgement about how to use the two together, instead of ending with the words both sources are biased, which is a description and not a conclusion. An answer that only says A is Norman so it is biased and B is English so it is biased will sit in the middle of the mark range however neatly it is written.", "topic": "Sources: cross referencing two conflicting sources and judging their use"}]}, "s6-forces": {"id": "s6-forces", "day": "Day 1", "subject": "Science", "title": "Forces and what they do", "minutes": 25, "objective": "Work out the resultant of two forces, say whether forces are balanced or unbalanced and what that does to the motion, and tell mass and weight apart using weight = mass x 10.", "extract": "SEVEN SITUATIONS, described in words. There are no pictures anywhere in this session. Gravitational field strength on Earth is 10 N/kg throughout.\n\nSITUATION A: A sledge is being pulled along flat snow and is already moving. The rope pulls it forwards with 120 N. Friction between the runners and the snow pushes back with 120 N.\n\nSITUATION B: The same sledge on the same snow. The rope now pulls forwards with 200 N. Friction still pushes back with 120 N.\n\nSITUATION C: A skydiver is falling. Her weight pulls her down with 700 N. Air resistance pushes up with 700 N.\n\nSITUATION D: The same skydiver, a few seconds after she jumped out. Her weight still pulls her down with 700 N. Air resistance pushes up with only 200 N.\n\nSITUATION E: A climber of mass 60 kg hangs completely still on the end of a rope.\n\nSITUATION F: A motorboat crossing a lake. The engine pushes it forwards with 900 N. Water drag pushes it backwards with 350 N. Its weight pulls it down, and the upthrust from the water pushes it up, and those two are equal in size.\n\nSITUATION G: A tin of paint with a mass of 2 kg sits still on a shelf.", "teach": {"intro": ["A force is a push or a pull. It is measured in newtons, written N, using a newtonmeter. Every force has a size AND a direction, and the direction matters just as much as the size.", "Forces have names. WEIGHT is the pull of gravity on a mass and always acts straight down. FRICTION is the force between two solid surfaces sliding over each other and always acts against the movement. DRAG is friction from a fluid, meaning air or water, and it also acts against the movement. Air resistance is just the name for drag in air. UPTHRUST is the upward push a liquid gives to something floating in it.", "When two forces act along the same line, you combine them into one RESULTANT force. Same direction, add them. Opposite directions, take the smaller from the bigger and keep the direction of the bigger one. A sledge pulled forwards with 200 N against 120 N of friction has a resultant of 200 - 120 = 80 N forwards.", "BALANCED forces means the resultant is zero. Nothing about the motion changes. Something still stays still, and something already moving keeps moving at exactly the same speed in the same direction. Read that twice, because it is the idea most people get wrong: moving at a steady speed does not need a resultant force to keep it going.", "UNBALANCED forces means the resultant is not zero. The motion changes. It speeds up, slows down or changes direction, and the change always happens in the direction of the resultant force.", "MASS and WEIGHT are not the same thing. Mass is how much stuff there is, measured in kilograms, and it is the same everywhere in the universe. Weight is the force of gravity pulling on that mass, measured in newtons, and it changes if the gravity changes. The rule is weight = mass x gravitational field strength. On Earth the gravitational field strength is 10 N/kg, so a 3 kg bag has a weight of 3 x 10 = 30 N.", "A useful habit when a question gets messy: list every force on the object in words, with its direction, before you touch any numbers. For the motorboat that list is thrust forwards, drag backwards, weight down, upthrust up. Once the list is written the sums are easy."], "example": {"problem": "Situation D. A skydiver has a weight of 700 N pulling down and air resistance of 200 N pushing up. Work out the resultant force, say whether the forces are balanced, and say what happens to her motion. Then work out her mass.", "steps": ["The two forces are in opposite directions, so subtract the smaller from the bigger. 700 - 200 = 500.", "Keep the direction of the bigger force. Weight is the bigger one and it acts downwards, so the resultant is 500 N downwards.", "The resultant is not zero, so the forces are UNBALANCED.", "The motion changes in the direction of the resultant. The resultant is downwards and she is already moving downwards, so she speeds up as she falls.", "Now the mass. Weight = mass x gravitational field strength, so 700 = mass x 10.", "That is a working backwards question. To undo a multiply by 10, divide by 10. 700 divided by 10 = 70, so her mass is 70 kg.", "Check it forwards. 70 x 10 = 700 N, which is the weight given in the question, so 70 kg is right."], "answer": "A resultant of 500 N downwards, the forces are unbalanced, she speeds up, and her mass is 70 kg."}, "example2": {"problem": "Situation C. The same skydiver later on has a weight of 700 N down and air resistance of 700 N up. Work out the resultant and say what happens to her motion.", "steps": ["Opposite directions again, so subtract. 700 - 700 = 0.", "The resultant is 0 N, so the forces are BALANCED.", "Balanced forces change nothing about the motion. She does not stop, and she does not slow down.", "She was already falling, so she carries on falling at exactly the same steady speed. This speed has a name, terminal velocity.", "The trap here is thinking that balanced forces mean stopped. They do not. They mean no CHANGE. Still things stay still and moving things keep moving the same way."], "answer": "The resultant is 0 N, the forces are balanced, and she keeps falling at a steady speed."}, "keyfact": "Balanced forces change nothing about the motion, and only an unbalanced resultant can speed something up, slow it down or turn it. Mass is in kilograms and never changes, weight is a force in newtons and equals mass x 10 on Earth."}, "questions": [{"id": "s6-forces:q1", "level": "easy", "type": "mc", "q": "What unit is a force measured in?", "options": ["Newtons", "Kilograms", "Metres", "Amps"], "answer": "Newtons", "hint": "Its symbol is a capital N, and it is named after a scientist.", "explain": "Forces are measured in newtons, symbol N. Kilograms measure mass, not force, and that is the single most common mix up in this topic. Metres measure distance and amps measure electric current.", "topic": "forces: units of force"}, {"id": "s6-forces:q2", "level": "easy", "type": "text", "q": "Situation A. The rope pulls the sledge forwards with 120 N and friction pushes back with 120 N. What is the resultant force on the sledge, in newtons?", "answer": "0", "accept": ["0", "0 N", "0N", "zero", "nought", "0 newtons", "none"], "hint": "The two forces are the same size and point opposite ways. Take one from the other.", "explain": "The resultant is 0 N. The forces are the same size in opposite directions, so 120 - 120 = 0. When the resultant is zero the forces are called balanced. Adding them to get 240 would be wrong, because you only add forces that point the SAME way.", "topic": "forces: resultant of two equal opposite forces"}, {"id": "s6-forces:q3", "level": "easy", "type": "mc", "q": "Situation A. The forces on the moving sledge are balanced. What is the sledge doing?", "options": ["Moving forwards at a steady speed", "Slowing down and stopping", "Speeding up", "It must be completely still"], "answer": "Moving forwards at a steady speed", "hint": "Balanced forces do not change the motion. What was the sledge doing already?", "explain": "It keeps moving forwards at a steady speed. Balanced forces mean the resultant is zero, and a zero resultant changes nothing about the motion. The sledge was already moving, so it carries on at the same speed in the same direction. It does not need a leftover forward force to keep going. Thinking that balanced means stopped is the classic error here.", "topic": "forces: what balanced forces do to motion"}, {"id": "s6-forces:q4", "level": "easy", "type": "text", "q": "Situation G. A tin of paint has a mass of 2 kg. Gravitational field strength is 10 N/kg. Work out the weight of the tin, in newtons.", "answer": "20", "accept": ["20", "20 N", "20N", "20 newtons", "20.0"], "hint": "Weight = mass x gravitational field strength.", "explain": "The weight is 20 N. Weight = mass x gravitational field strength, so 2 x 10 = 20 N. Notice the units change: the mass was in kilograms and the weight is in newtons, because weight is a force. Writing 2 kg as the answer is the mistake to avoid, because that is the mass, not the weight.", "topic": "forces: calculating weight from mass"}, {"id": "s6-forces:q5", "level": "easy", "type": "mc", "q": "Which sentence about mass and weight is correct?", "options": ["Mass is measured in kilograms and stays the same everywhere, while weight is a force in newtons that depends on gravity", "Mass and weight are two words for the same thing", "Weight is measured in kilograms and mass is measured in newtons", "Mass changes when you go to the Moon but weight stays the same"], "answer": "Mass is measured in kilograms and stays the same everywhere, while weight is a force in newtons that depends on gravity", "hint": "One of them is an amount of stuff. The other one is a pull, so it is a force.", "explain": "Mass is the amount of stuff in an object, measured in kilograms, and it does not change no matter where you take it. Weight is the pull of gravity on that mass, so it is a force measured in newtons, and it gets smaller where gravity is weaker. The last option has it exactly backwards: it is the weight that changes on the Moon, not the mass.", "topic": "forces: mass against weight"}, {"id": "s6-forces:q6", "level": "medium", "type": "text", "q": "Situation B. The rope pulls the sledge forwards with 200 N and friction pushes back with 120 N. What is the resultant force, in newtons?", "answer": "80", "accept": ["80", "80 N", "80N", "80 newtons", "80 forwards", "80 N forwards", "80.0"], "hint": "Opposite directions means subtract. Then keep the direction of the bigger force.", "explain": "The resultant is 80 N forwards. The forces point opposite ways, so subtract: 200 - 120 = 80. The bigger force is the 200 N pull, which acts forwards, so the resultant acts forwards too. Adding to get 320 is the error to avoid, because you only add forces that point the same way.", "topic": "forces: resultant of two unequal opposite forces"}, {"id": "s6-forces:q7", "level": "medium", "type": "mc", "q": "Situation B has a resultant of 80 N forwards. What happens to the sledge?", "options": ["It speeds up", "It keeps going at a steady speed", "It slows down", "It stays still"], "answer": "It speeds up", "hint": "The resultant is not zero, so something about the motion must change. Which way does the resultant point compared with the movement?", "explain": "It speeds up. The resultant is not zero, so the forces are unbalanced and the motion has to change. The change always happens in the direction of the resultant, and the resultant is forwards, which is the way the sledge is already going, so it gets faster. If the resultant had pointed backwards it would have slowed down instead.", "topic": "forces: what unbalanced forces do to motion"}, {"id": "s6-forces:q8", "level": "medium", "type": "text", "q": "Situation E. The climber has a mass of 60 kg. Gravitational field strength is 10 N/kg. Work out the climber's weight, in newtons.", "answer": "600", "accept": ["600", "600 N", "600N", "600 newtons", "600.0"], "hint": "Weight = mass x gravitational field strength. Multiplying by 10 moves every digit one place to the left.", "explain": "The weight is 600 N. Weight = mass x gravitational field strength, so 60 x 10 = 600 N. Multiplying by 10 makes 60 into 600, not 70. This is a place value check worth doing out loud: 6 tens times 10 gives 6 hundreds.", "topic": "forces: calculating weight from mass"}, {"id": "s6-forces:q9", "level": "medium", "type": "mc", "q": "Situation E. The 60 kg climber hangs completely still on the rope, so the forces on her are balanced. What is the size and direction of the force the rope pulls on her with?", "options": ["600 N upwards", "600 N downwards", "60 N upwards", "0 N, because she is not moving"], "answer": "600 N upwards", "hint": "Balanced means the two forces cancel exactly. You already know her weight and which way it pulls.", "explain": "The rope pulls with 600 N upwards. Her weight is 60 x 10 = 600 N pulling down. She is completely still, so the forces are balanced and the resultant is zero. The only way to cancel 600 N down is 600 N up, so that is what the rope must pull with. The 0 N option confuses the RESULTANT force, which is zero, with the individual forces, which are definitely not zero.", "topic": "forces: using balanced forces to find a missing force"}, {"id": "s6-forces:q10", "level": "medium", "type": "mc", "q": "Situation F. Which list correctly names all four forces on the motorboat and the direction each one acts in?", "options": ["Thrust forwards, drag backwards, weight downwards, upthrust upwards", "Thrust forwards, friction upwards, weight backwards, upthrust downwards", "Drag forwards, thrust backwards, upthrust downwards, weight upwards", "Thrust forwards, weight forwards, drag downwards, upthrust backwards"], "answer": "Thrust forwards, drag backwards, weight downwards, upthrust upwards", "hint": "Weight is always straight down. Drag always acts against the way something is moving.", "explain": "The engine gives thrust forwards, the water gives drag backwards because drag always opposes the motion, weight acts straight downwards because gravity always pulls down, and upthrust from the water pushes upwards to hold the boat afloat. Listing the forces and their directions in words like this before you calculate anything is the habit that stops you subtracting two forces that were never in opposite directions.", "topic": "forces: naming the forces acting on an object"}, {"id": "s6-forces:q11", "level": "medium", "type": "text", "q": "Situation F. Thrust is 900 N forwards and water drag is 350 N backwards. What is the resultant force on the boat, in newtons?", "answer": "550", "accept": ["550", "550 N", "550N", "550 newtons", "550 forwards", "550 N forwards", "550.0"], "hint": "Only the forward and backward forces matter here, because the weight and the upthrust are equal and cancel out.", "explain": "The resultant is 550 N forwards. Thrust and drag are in opposite directions, so subtract: 900 - 350 = 550. The bigger force is the thrust, so the resultant points forwards and the boat speeds up. The weight and the upthrust are equal and opposite, so they cancel to zero and do not change the answer at all.", "topic": "forces: resultant when some forces cancel"}, {"id": "s6-forces:q12", "level": "stretch", "type": "text", "q": "A van has a weight of 18000 N on Earth, where the gravitational field strength is 10 N/kg. Work out the mass of the van, in kilograms.", "answer": "1800", "accept": ["1800", "1800 kg", "1800kg", "1800 kilograms", "1,800", "1800.0"], "hint": "Weight = mass x 10. You have been given the weight and you want the mass, so undo the multiply by 10.", "explain": "The mass is 1800 kg. Weight = mass x gravitational field strength, so 18000 = mass x 10. You have been given the answer and asked for the starting number, so run it backwards: the undo of multiply by 10 is divide by 10, giving 18000 divided by 10 = 1800 kg. Check it forwards, 1800 x 10 = 18000 N, which matches. The trap is multiplying by 10 again and writing 180000, which is doing the forward step a second time instead of undoing it.", "topic": "forces: working backwards from weight to mass"}, {"id": "s6-forces:q13", "level": "stretch", "type": "mc", "q": "The climber from situation E, mass 60 kg, is taken to the Moon, where the gravitational field strength is 1.6 N/kg. What are her mass and weight on the Moon?", "options": ["Mass 60 kg and weight 96 N", "Mass 96 kg and weight 60 N", "Mass 60 kg and weight 600 N", "Mass 37.5 kg and weight 60 N"], "answer": "Mass 60 kg and weight 96 N", "hint": "Mass never changes when you move somewhere else. Only the field strength in the weight formula changes.", "explain": "Her mass is still 60 kg and her weight is 96 N. Mass is the amount of stuff in her, so travelling to the Moon cannot change it. Weight = mass x gravitational field strength, so on the Moon it is 60 x 1.6 = 96 N, compared with 60 x 10 = 600 N on Earth. That is why astronauts can bounce around: the same mass, about six times less weight.", "topic": "forces: weight in a different gravitational field"}, {"id": "s6-forces:q14", "level": "stretch", "type": "long", "q": "A skydiver jumps from a plane. Describe how the forces on her change from the moment she jumps, to falling at a steady speed, to the moment just after she opens her parachute. Explain each stage in terms of the resultant force.", "marks": 5, "answer": "At the moment she jumps, her weight of about 700 N pulls her down and air resistance is almost zero because she is barely moving. The forces are very unbalanced, with a large resultant downwards, so she speeds up. As she falls faster, air resistance grows, because drag increases with speed. The resultant downwards gets smaller and smaller, so she is still speeding up but less and less quickly. Eventually air resistance grows until it is equal to her weight, 700 N up against 700 N down. The resultant is now zero, the forces are balanced, and she falls at a steady speed called terminal velocity. She does not stop and she does not slow down, because balanced forces change nothing about the motion. When she opens the parachute the surface area shoots up, so air resistance jumps to far more than her weight. The resultant is now upwards while she is still moving downwards, so she slows down sharply. As she slows, air resistance drops again, until it equals her weight once more. She then falls at a new, much slower steady speed all the way to the ground.", "hint": "Deal with three stages in order. For each one, say which force is bigger, what the resultant is, and what that does to her speed.", "explain": "A full answer needs five points. One, just after jumping the weight is much bigger than air resistance, so there is a large resultant downwards and she accelerates. Two, as her speed rises, air resistance rises with it, so the resultant shrinks and she gains speed more slowly. Three, when air resistance equals weight the resultant is zero, the forces are balanced and she falls at a steady speed, terminal velocity. Four, opening the parachute increases the area, so air resistance becomes bigger than weight, giving a resultant upwards while she moves down, which slows her sharply. Five, she slows until air resistance equals weight again, giving a new, slower steady speed. The two answers that lose marks are saying she stops when the forces balance, and saying the parachute makes her go upwards. Balanced forces mean no change, and a resultant upwards while moving downwards means slowing down, not reversing.", "topic": "forces: terminal velocity and changing resultants"}]}, "s7-forces-calc": {"id": "s7-forces-calc", "day": "Day 2", "subject": "Science", "title": "Forces you can calculate", "minutes": 25, "objective": "Use speed = distance / time and pressure = force / area in all three directions, including finding the quantity that is not on its own, and give every answer the right unit.", "extract": "TWO SETS OF DATA, described in words. There are no graphs or pictures.\n\nSET ONE, FIVE JOURNEYS.\n\nJourney 1: a cyclist covers 100 m in 20 s.\nJourney 2: a train covers 240 km in 3 hours.\nJourney 3: a runner keeps a steady speed of 5 m/s for 40 s. The distance is not given.\nJourney 4: a car covers 150 m at a steady speed of 25 m/s. The time is not given.\nJourney 5: a walker covers 3.6 km in 30 minutes. The speed is not given.\n\nSET TWO, SEVEN PRESSURE CASES. In every case the force acts straight down onto a flat surface.\n\nCase A: a wooden box pushes down with a force of 100 N onto an area of 2 m^2.\nCase B: a brick pushes down with a force of 24 N, resting on its large face, area 0.02 m^2.\nCase C: the same brick, same 24 N, stood up on its small end, area 0.008 m^2.\nCase D: a person with a weight of 600 N stands in boots. The two soles together cover 0.03 m^2.\nCase E: the same person, same 600 N, now wearing snowshoes. The two snowshoes together cover 0.6 m^2.\nCase F: a crate pushes down with a force of 900 N and produces a pressure of 3000 Pa on the floor. The area is not given.\nCase G: a flat hydraulic pad has an area of 0.4 m^2 and the pressure under it is 5000 Pa. The force is not given.", "teach": {"intro": ["Speed tells you how much distance is covered in each second. Speed = distance divided by time. A cyclist who covers 100 m in 20 s has a speed of 100 divided by 20 = 5 m/s.", "That formula runs in three directions, not one. Speed = distance / time. Distance = speed x time. Time = distance / speed. Same formula, three ways in, depending on which one is missing.", "This is exactly the move from your Day 1 maths session, m14-working-backwards. There you undid a rule to get from an answer back to the starting number. Here you undo a divide to get back to the distance or the time. It is the same move wearing a lab coat.", "Here is the safe way to decide. Write the formula out with the words in it: speed = distance / time. Cover up the one the question is asking for. What is left is what you do. Cover speed and you see distance over time, so divide. Cover distance and you see speed next to time, so multiply. Cover time and you see distance over speed, so divide.", "PRESSURE is how hard a force is pressed into each bit of area. Pressure = force divided by area. If force is in newtons and area is in m^2, the pressure comes out in N/m^2, which has its own name, the pascal, written Pa. So 1 Pa is exactly the same as 1 N/m^2.", "Pressure rearranges the same three ways. Pressure = force / area. Force = pressure x area. Area = force / pressure. That last one catches people out, because the thing they want was underneath in the original formula. It is still just undoing a divide, and it is still the top number divided by the other one.", "Two rules about units that cost easy marks. First, always write the unit on the answer: m/s, s, m, Pa, N or m^2. Second, convert before you calculate, not after. 3.6 km is 3600 m, because there are 1000 m in a km. 30 minutes is 1800 s, because there are 60 s in a minute."], "example": {"problem": "Journey 4. A car covers 150 m at a steady speed of 25 m/s. How long does it take?", "steps": ["Write down what you have and what you want. Distance = 150 m, speed = 25 m/s, time = the thing you want.", "Write the formula with words: speed = distance / time.", "Time is the thing you want, so cover it up. What is left reads distance over speed, so time = distance / speed.", "Put the numbers in: time = 150 divided by 25.", "150 divided by 25 = 6. There are four 25s in 100 and two more in 50, so six altogether.", "Write the unit. The time is 6 s.", "Check it forwards. If it goes 25 m every second for 6 s, that is 25 x 6 = 150 m, which is the distance given. Correct."], "answer": "6 s"}, "example2": {"problem": "Case F. A crate pushes down with a force of 900 N and the pressure on the floor is 3000 Pa. What is the area of the base of the crate?", "steps": ["What you have: force = 900 N and pressure = 3000 Pa. What you want: area.", "Write the formula with words: pressure = force / area.", "This is the awkward one, because area started underneath. Cover up area. What is left reads force over pressure, so area = force / pressure.", "Put the numbers in: area = 900 divided by 3000.", "900 divided by 3000 is less than 1, and that is fine. Cancel a zero from each: 90 divided by 300. Cancel again: 9 divided by 30 = 0.3.", "Write the unit. The area is 0.3 m^2.", "Check it forwards. Pressure = force / area = 900 divided by 0.3 = 3000 Pa, which matches the question. Correct.", "The wrong move here is multiplying, 900 x 3000 = 2700000, which is doing a forward step on a number that was already the answer. If the number you get is absurd for a crate, that is the check telling you to look again."], "answer": "0.3 m^2"}, "keyfact": "Speed = distance / time and pressure = force / area rearrange in exactly the same way. Cover up the thing you want: if what is left is one number over another, you divide, and if it is two numbers side by side, you multiply."}, "questions": [{"id": "s7-forces-calc:q1", "level": "easy", "type": "mc", "q": "Which of these is the formula for speed?", "options": ["Speed = distance divided by time", "Speed = time divided by distance", "Speed = distance x time", "Speed = distance + time"], "answer": "Speed = distance divided by time", "hint": "The unit m/s is a clue. The slash in m/s means divided by.", "explain": "Speed = distance divided by time. The unit gives it away: metres per second, written m/s, means metres divided by seconds, so the formula must be distance divided by time. Doing it the other way round, time divided by distance, gives you seconds per metre, which is not a speed.", "topic": "speed: the speed formula"}, {"id": "s7-forces-calc:q2", "level": "easy", "type": "text", "q": "Journey 1. A cyclist covers 100 m in 20 s. Work out the speed in m/s.", "answer": "5", "accept": ["5", "5 m/s", "5m/s", "5.0", "5 metres per second"], "hint": "Speed = distance divided by time. Put 100 on top and 20 underneath.", "explain": "The speed is 5 m/s. Speed = distance divided by time = 100 divided by 20 = 5. Check it forwards: 5 m every second for 20 s is 5 x 20 = 100 m, which matches. Always write the unit, because m/s is worth a mark on its own in most mark schemes.", "topic": "speed: calculating speed from d
