move, it is probably not doing anything."], "answer": "You have all walked past that building. I was seven when I learned to swim in it, and I could not even put my face in the water. Close this pool and you close the lessons, you close the club, and you close the only warm room some of these children sit in all week. Do not let them turn it into a car park."}, "example2": {"problem": "Somebody objects: the pool is falling apart and it costs a fortune to heat. Write a counter argument and a rebuttal.", "steps": ["Say their point back to them honestly, and do not shrink it. If you make their argument sound weak, everybody can see what you have done. The roof needs work, the heating bill is enormous, and the council has less money every year.", "Agree with the part that is true, in a short sentence, because short sounds honest. That is all true.", "Turn it with one word. But. Then go straight to your strongest point, not your second strongest.", "Make sure your answer is bigger than their objection. They are talking about money. You answer with something money cannot be weighed against: A pool is where a child learns the one skill that can keep them alive.", "Check that you actually rebutted. If you stop after That is all true, you have just agreed with them in public."], "answer": "Now, I understand the argument for closing it. The roof needs work, the heating bill is enormous, and the council has less money every year. That is all true. But a pool is not a luxury. A pool is where a child learns the one skill that can keep them alive."}, "keyfact": "Name your moves before you write: direct address, rule of three, rhetorical question, anecdote, and a counter argument you actually answer. Conceding the other side's best point first is the strongest move you have."}, "questions": [{"id": "e11-persuasive:q1", "level": "easy", "type": "mc", "q": "Which sentence in the speech uses direct address?", "options": ["[2] You have all walked past that building.", "[1] The council wants to close the pool on Mill Lane, and I am here to ask that it does not happen.", "[5] I was seven, I could not put my face in the water, and a woman called Pat stood in the shallow end with me for six weeks until I could.", "[7] The roof needs work, the heating bill is enormous, and the council has less money every year."], "answer": "[2] You have all walked past that building.", "hint": "Look for the word that points straight at the person listening.", "explain": "The answer is [2]. Direct address means speaking to the audience using you, so that they stop being a crowd and start being the person being spoken to. [1] is about the council, [5] is about the speaker, and [7] is about the building and the money. None of those three point at the listener at all.", "topic": "persuasion: identifying direct address"}, {"id": "e11-persuasive:q2", "level": "easy", "type": "mc", "q": "Which sentence in the speech is a rhetorical question?", "options": ["[9] Are we really going to tell the next seven year old that the sums did not add up?", "[6] Now, I understand the argument for closing it.", "[11] So write to the council, come to the meeting on the tenth, and tell them what that building is actually for.", "[2] You have all walked past that building."], "answer": "[9] Are we really going to tell the next seven year old that the sums did not add up?", "hint": "Only one of these is a question at all. Then ask whether the speaker wants an answer.", "explain": "The answer is [9]. It is the only question in the speech, and the speaker does not want a reply, because the answer is meant to be obviously no. That is what makes it rhetorical: the audience answers it in their own heads, which is far more persuasive than being told. [11] is a set of instructions, [6] is the start of a concession, and [2] is direct address.", "topic": "persuasion: identifying a rhetorical question"}, {"id": "e11-persuasive:q3", "level": "easy", "type": "text", "q": "Sentence [10] lists three things that closing the pool would close. What is that device called?", "answer": "rule of three", "accept": ["rule of three", "the rule of three", "rule of 3", "the rule of 3", "Rule of three", "triple", "tricolon"], "hint": "It is named after the number of items in the list.", "explain": "The answer is the rule of three. Three items give the sentence a rhythm that the ear expects and enjoys, and the third item is where the weight lands, which is why the warm room is placed last. Two items sound like a pair of facts and four or more starts to sound like a shopping list. Note that sentence [11] does it as well, with write, come and tell.", "topic": "persuasion: naming the rule of three"}, {"id": "e11-persuasive:q4", "level": "easy", "type": "mc", "q": "What is an anecdote?", "options": ["A short story about one real person, used to make a general point feel real.", "A question you ask without wanting an answer.", "A list of three things in one sentence.", "A fact or a statistic that proves your argument."], "answer": "A short story about one real person, used to make a general point feel real.", "hint": "Think about the difference between swimming matters and a woman called Pat.", "explain": "The answer is the first option. An anecdote is small and specific, and that is its power: a reader can picture one seven year old who cannot put his face in the water, but nobody can picture swimming is important. The second option describes a rhetorical question, the third describes the rule of three, and the fourth is evidence, which is useful but is not an anecdote.", "topic": "persuasion: what an anecdote is"}, {"id": "e11-persuasive:q5", "level": "easy", "type": "mc", "q": "Which sentences make up the anecdote in the speech?", "options": ["[4] and [5]", "[1] and [2]", "[6] and [7]", "[11] and [12]"], "answer": "[4] and [5]", "hint": "Find the part where the speaker talks about one particular person on one particular occasion.", "explain": "The answer is [4] and [5]. I did, followed by the story of being seven, being unable to put his face in the water, and a woman called Pat standing in the shallow end for six weeks. It is one person, one place and a specific length of time, which is what makes it an anecdote rather than a general claim. [1] and [2] set up the situation, [6] and [7] are the counter argument, and [11] and [12] are the call to action at the end.", "topic": "persuasion: locating the anecdote"}, {"id": "e11-persuasive:q6", "level": "medium", "type": "mc", "q": "What are sentences [6] and [7] doing in the speech?", "options": ["Admitting the other side's best argument before answering it.", "Listing three reasons to keep the pool open.", "Insulting the council for wanting to save money.", "Repeating the anecdote in different words."], "answer": "Admitting the other side's best argument before answering it.", "hint": "Whose argument is being put into words in sentence [7], and does the speaker agree with it?", "explain": "The answer is the first option. In [6] the speaker says I understand the argument for closing it, and in [7] he states that argument fairly and then says That is all true. That is a counter argument, sometimes called a concession. The speaker has not changed sides. He is clearing the strongest objection out of the way in his own words so that he can answer it in [8]. There is no insult anywhere in the speech, which is deliberate.", "topic": "persuasion: recognising a counter argument"}, {"id": "e11-persuasive:q7", "level": "medium", "type": "mc", "q": "Why is admitting the other side's point first such a strong move?", "options": ["It shows you have understood the other case, so the reader trusts you, and your answer lands harder.", "It makes your piece longer, which scores more marks.", "It gives the reader a rest from your argument.", "It means you do not have to prove your own point afterwards."], "answer": "It shows you have understood the other case, so the reader trusts you, and your answer lands harder.", "hint": "Think about how you react to somebody who clearly has not listened to a word you said.", "explain": "The answer is the first option. A reader who thinks you have ignored the obvious objection spends the whole piece arguing with you in their head instead of listening. Once you have said the objection out loud yourself, that argument is over, they trust you, and your answer arrives with nothing in its way. Length earns nothing on its own. And the concession makes your job harder, not easier, because now you have to answer the strongest thing the other side has.", "topic": "persuasion: why conceding first works"}, {"id": "e11-persuasive:q8", "level": "medium", "type": "text", "q": "Sentence [8] turns the speech away from the counter argument and back to the speaker's own case. Write the single word that does the turning.", "answer": "But", "accept": ["But", "but", "'But'", "But.", "but."], "hint": "It is the first word of sentence [8].", "explain": "The answer is But. That one word is the hinge of the whole speech. Everything before it is the other side's case, honestly stated, and everything after it is the answer. Without it, sentence [7] would leave the audience agreeing that the pool should close. However and yet do the same job if you want a change of tone, but do not use three of them in one piece, because the turn only feels powerful the first time.", "topic": "persuasion: the turn word after a concession"}, {"id": "e11-persuasive:q9", "level": "medium", "type": "mc", "q": "You are arguing that Friday afternoon sport should be kept. Which of these is the best rule of three?", "options": ["It keeps them fit, it keeps them together, and it keeps some of them in school.", "It keeps them fit, it is quite good for them, and the teachers seem to like it as well.", "It keeps them fit and it keeps them together.", "It keeps them fit, it keeps them fit, and it keeps them fit."], "answer": "It keeps them fit, it keeps them together, and it keeps some of them in school.", "hint": "A good three has the same shape each time, and the biggest idea last.", "explain": "The answer is the first option. All three parts have the same shape, it keeps them, which gives the sentence a beat, and the ideas build: fit, then together, then in school, which is the one that actually matters. The second option has three items but no rhythm and a weak third, so the sentence sags at the end. The third has only two items, so it is a pair, not a rule of three. The fourth repeats one idea, which is not a list at all.", "topic": "persuasion: building a rule of three that escalates"}, {"id": "e11-persuasive:q10", "level": "medium", "type": "mc", "q": "Which rewrite of The pool is important for children uses both direct address and a rhetorical question?", "options": ["You know what that pool did for your children. Do you really want to explain to the next lot why it is gone?", "The pool is very important indeed for all of the children in this town.", "Children need the pool, and the pool needs the children.", "I think the pool is important for children, and that is my opinion on the matter."], "answer": "You know what that pool did for your children. Do you really want to explain to the next lot why it is gone?", "hint": "Hunt for two things: the word you, and a question mark that does not want an answer.", "explain": "The answer is the first option. You know and your children are direct address, and the second sentence is a question the audience is meant to answer in their own head with no. The second option just adds very and indeed, which is intensity, not technique. The third is a neat sounding sentence with no device and no meaning behind it. The fourth weakens itself twice, because I think and in my opinion tell the reader that even you are not sure.", "topic": "persuasion: deploying two devices in one rewrite"}, {"id": "e11-persuasive:q11", "level": "stretch", "type": "mc", "q": "Which counter argument and rebuttal pair is the strongest?", "options": ["The heating bill is enormous and the council has less money every year. That is true. But the cost of a child who never learns to swim does not appear on anybody's spreadsheet.", "Some people say the pool should close. Those people have clearly never set foot in it and do not care about children.", "The heating bill is enormous and the council has less money every year. That is true. So perhaps closing it is fair enough after all.", "Some people say the pool is painted an ugly colour. That is true. But the colour of a building does not matter."], "answer": "The heating bill is enormous and the council has less money every year. That is true. But the cost of a child who never learns to swim does not appear on anybody's spreadsheet.", "hint": "Check two things in each one: is the objection real, and does the speaker actually answer it?", "explain": "The answer is the first option. It states the real objection fairly, agrees with the true part, and then answers it with something the objection cannot measure. The second option insults the other side instead of conceding, which tells the audience you have no answer. The third concedes and then never rebuts, so it argues the other side's case for them. The fourth concedes something nobody has actually argued, which is a straw argument, and knocking it down proves nothing. Concede the strongest objection, not the easiest one.", "topic": "persuasion: judging a counter argument and rebuttal"}, {"id": "e11-persuasive:q12", "level": "stretch", "type": "text", "q": "What is the name for the move where you admit the other side's point before you answer it?", "answer": "concession", "accept": ["concession", "a concession", "conceding", "concede", "counter argument", "counter-argument", "counterargument", "a counter argument", "the counter argument"], "hint": "It comes from the verb that means to admit that somebody has a point.", "explain": "The answer is a concession, also called a counter argument. Both names are accepted. The move has two halves, and the second half is the one people forget: the concession admits the point, and the rebuttal answers it. A concession with no rebuttal is not persuasive writing, it is surrender in writing.", "topic": "persuasion: naming the concession"}, {"id": "e11-persuasive:q13", "level": "stretch", "type": "mc", "q": "Sentence [11] lists three things to do and runs to over twenty words. Sentence [12] is nine words and is the last thing the audience hears. Why has the speaker built the ending that way?", "options": ["The long list builds up speed, and then the short command stops the audience on the single image the speaker wants them left with.", "The speaker ran out of things to say and stopped early.", "Short sentences are always more persuasive than long ones.", "It makes the speech shorter overall, which keeps the audience awake."], "answer": "The long list builds up speed, and then the short command stops the audience on the single image the speaker wants them left with.", "hint": "This is the same trick as Day 1. Ask what the short sentence is standing next to.", "explain": "The answer is the first option. This is sentence control used for persuasion. The three part instruction in [11] gets the audience moving, and then [12] cuts the rhythm and leaves one hard image in the room, a car park where the pool used to be. Cover up [11] and read [12] on its own and it is a fairly ordinary line. It only works because of what it follows. Short sentences are not always stronger, they are stronger in contrast, and length has nothing to do with keeping an audience awake.", "topic": "persuasion: sentence length as a persuasive device"}, {"id": "e11-persuasive:q14", "level": "stretch", "type": "long", "q": "Your school plans to cancel Friday afternoon sport in order to pay for extra maths lessons. Write a short speech to the head teacher arguing against it. You must use at least four of the devices from this lesson, and one of them must be a counter argument followed by a rebuttal. Name each device in brackets immediately after the sentence where you use it.", "marks": 8, "answer": "You have stood at the edge of that field on a Friday afternoon and seen what it does to them. (direct address) When Aaron started here he did not speak to anybody for a whole term, and the first time I ever heard his voice was when he shouted for the ball in a five a side game in November. (anecdote) Now, I understand the argument for cancelling it. (counter argument) The maths results have to come up, the inspection is in March, and Friday afternoon is the easiest hour on the whole timetable to take. That is all true. (counter argument) But you do not raise a maths grade by removing the one hour in the week that makes some of these students want to be in the building at all. (rebuttal) Cancel Friday sport and you lose the teams, you lose the fixtures, and you lose the only reason a few of them get out of bed on a Friday. (rule of three) Are we really going to teach them that the only thing worth doing is the thing that gets measured? (rhetorical question) Give us the field back. (short command for effect)", "hint": "Plan your moves before you write a sentence. Write the five names down the side of the page, decide the order, and only then write. Your concession has to be the objection the head teacher would actually make, not an easy one.", "explain": "Mark yourself out of eight. One mark for direct address that genuinely speaks to the head teacher using you. One mark for an anecdote about one named person on one occasion, short and specific, not a general claim about students. One mark for a rule of three with three parts of the same shape where the third is the heaviest. One mark for a rhetorical question whose answer is obvious and which you do not then answer yourself. Two marks for the counter argument and rebuttal: one for conceding a real objection stated fairly and at its strongest, one for a rebuttal that actually answers it rather than repeating your own case louder. One mark for naming each device correctly in brackets. One mark for finishing on a short sentence after a long one. Lose a mark if you concede something nobody would argue, and lose a mark if you insult the other side anywhere, because an insult tells the reader you have no answer.", "topic": "persuasion: deploying four devices in an original speech"}]}, "e12-write-full": {"id": "e12-write-full", "day": "Day 4", "subject": "English", "title": "The whole piece", "minutes": 30, "objective": "Build a five minute plan with a decided ending, then write and proofread a full marked piece to the clock.", "extract": "A FIVE MINUTE PLAN\nTask: write a narrative called The last one out. 30 minutes, marked out of 24.\n\nClock: 5 minutes planning, 21 minutes writing, 4 minutes proofreading. Pen down at 26 minutes, whatever state the piece is in.\n\nLine 1, the ending, decided before anything else: the coach turns the changing room lights off while I am still sitting there, says nothing, and that is worse than being shouted at.\nLine 2, the opening image: a wet concrete floor with one sock on it, and every other peg empty.\nLine 3, beat one: the last two minutes of the match, going round in my head while I untie one boot.\nLine 4, beat two: a phone going off inside a locked locker with nobody there to answer it.\nLine 5, beat three: the coach in the doorway with a bin bag of bibs over his shoulder, waiting.\nLine 6, the planned short sentence: Nobody had waited. It goes straight after the long sentence about the match.\nLine 7, proofread list: capital letters, full stops, past tense all the way through, no comma splices, every I a capital.\n\nTimeframe: about fifteen minutes of real time, one room, two people.", "teach": {"intro": ["In week three you built a two minute plan for a 25 minute description. This is the bigger version, for a piece that is actually marked out of twenty or more. Five minutes, seven lines, and the first line you write down is the last thing that happens in the story.", "The ending goes first for one reason. If you know where you are going, every sentence you write can point at it, and you never arrive at minute twenty six with no way to stop. Then line 2, the opening image, which is one thing the reader can see, not an announcement about what you are going to write. Then three beats. A beat is one moment with one concrete detail in it, such as a phone going off inside a locked locker. Things got worse is not a beat, because there is no moment in it and nothing to describe.", "Two lines that almost nobody writes are lines 6 and 7. Line 6 is one short sentence chosen in advance, with a note of where it goes, because a short sentence only lands next to long ones and you will not spot the right place while you are writing at speed. Line 7 is your proofread list. Last of all, keep the timeframe small: one place, two people, about fifteen or twenty minutes of story time. A piece that covers a whole year in 21 minutes of writing has to summarise, and summaries score badly at every level."], "example": {"problem": "You have 30 minutes and a narrative called The last one out. Build the seven line plan in five minutes.", "steps": ["Line 1 first, always. What is the last thing that happens? The coach turns the lights off while I am still sitting there and says nothing, which is worse than being shouted at. Now everything else has somewhere to aim.", "Line 2, the opening image. One thing the reader can see in the first sentence. A wet concrete floor with one sock on it, and every other peg empty.", "Lines 3, 4 and 5, three beats, each one a single moment with a detail in it. The last two minutes of the match replaying while I untie one boot. A phone going off inside a locked locker. The coach in the doorway with a bin bag of bibs.", "Line 6, the planned short sentence. Nobody had waited. Write down where it goes, which is straight after the long sentence about the match, so that it lands against something long.", "Line 7, the proofread list. Capitals, full stops, past tense, no comma splices, every I a capital.", "Check the timeframe before you start writing. One room, two people, about fifteen minutes of story time. Then start the clock: 21 minutes writing, pen down at 26."], "answer": "Seven lines in five minutes, with the ending written first, then 21 minutes of writing and 4 minutes of checking."}, "example2": {"problem": "A student hands in this plan: Write about a flood. Beginning, the flood starts. Middle, it gets worse. End, it finishes. What is wrong with it, and how do you fix it?", "steps": ["Test every line by asking whether you could photograph it. The flood starts cannot be photographed, because it is a summary. Swap it for one image: water coming under the front door and going dark across the carpet.", "It gets worse is not a beat, because there is no single moment in it. Swap it for one: my uncle carrying the dog up the stairs, and the dog fighting him the whole way.", "Add a second and third beat, still single moments. The fridge floating a few inches off the kitchen floor and turning slowly. A neighbour standing on his own wall in the dark, shouting a number of a house.", "It finishes is not a decided ending, it is the word end in disguise. Decide the actual event: the water drops a foot by morning, and my uncle goes to work as normal.", "Two lines are missing entirely. Add the planned short sentence and where it goes, and add the proofread list."], "answer": "Every line of a plan has to be something you could photograph, and the ending has to be a real event rather than the idea of finishing."}, "keyfact": "Five minutes, seven lines. Ending first, opening image, three beats, one planned short sentence with its position, proofread list. Then 21 minutes writing, pen down at 26, and 4 minutes checking."}, "questions": [{"id": "e12-write-full:q1", "level": "easy", "type": "mc", "q": "You have a 30 minute writing task that is marked out of 24. Roughly how long should the plan take?", "options": ["About 5 minutes", "About 1 minute", "About 12 minutes", "No time at all"], "answer": "About 5 minutes", "hint": "Long enough for seven lines, short enough to leave three quarters of the time for writing.", "explain": "The answer is about 5 minutes. That is enough to write seven short lines and no more. One minute is not enough to decide an ending and three beats, so you end up planning in your head while you write, which is the same as not planning. Twelve minutes eats the writing time, and a plan that long is the piece written twice. No plan at all is how you reach minute twenty six with no ending.", "topic": "whole piece: how long to plan"}, {"id": "e12-write-full:q2", "level": "easy", "type": "text", "q": "In the 30 minute clock in this lesson, how many minutes are kept back at the end for proofreading? Write the number.", "answer": "4", "accept": ["4", "four", "4 minutes", "four minutes", "4 mins"], "hint": "Add up the plan and the writing, then see what is left.", "explain": "The answer is 4. The clock is 5 plus 21 plus 4, which is 30, so the pen goes down at 26 minutes. You protect those four minutes even if the piece feels unfinished, because a slightly shorter piece that is clean scores higher than a finished piece full of dropped capitals and comma splices. Accuracy is worth a quarter of the marks here and it is the cheapest quarter to earn.", "topic": "whole piece: the 30 minute clock"}, {"id": "e12-write-full:q3", "level": "easy", "type": "mc", "q": "Which line of the five minute plan do you write first?", "options": ["The ending", "The opening image", "Beat one", "The proofread list"], "answer": "The ending", "hint": "You decide the destination before you decide the route.", "explain": "The answer is the ending. It is line 1 of the plan even though it is the last thing that happens in the piece. The opening image comes second, the three beats come next, and the proofread list is last. Writing the ending first is the single change that stops a piece drifting.", "topic": "whole piece: the order of the plan"}, {"id": "e12-write-full:q4", "level": "easy", "type": "mc", "q": "Why is the ending decided before you write a single sentence?", "options": ["Because if you know where the piece is going, every sentence can point at it and you never run out of road.", "Because the ending is the longest part of the piece.", "Because markers read the ending first.", "Because it saves you having to write a middle."], "answer": "Because if you know where the piece is going, every sentence can point at it and you never run out of road.", "hint": "Think about what happens at minute twenty five to somebody who does not know how their piece stops.", "explain": "The answer is the first option. A decided ending turns every choice you make into an easy one, because you can ask does this get me closer to that last image. Without one, you write until you are tired and then stop, and a marker can see that from across the room. The ending is usually one of the shortest parts, markers read from the start like anybody else, and you still have to write a middle, in fact three beats of one.", "topic": "whole piece: why the ending is decided first"}, {"id": "e12-write-full:q5", "level": "easy", "type": "mc", "q": "What is a beat?", "options": ["One moment with one concrete detail in it.", "A summary of everything that happens in the middle of the piece.", "A paragraph of exactly five sentences.", "The rhythm you get from varying sentence lengths."], "answer": "One moment with one concrete detail in it.", "hint": "Ask whether you could photograph it.", "explain": "The answer is the first option. A beat is small and specific, such as a phone going off inside a locked locker, and that is why it can grow into a paragraph. A summary cannot grow, because there is nothing in it to describe. Beats are not defined by paragraph length, and rhythm from sentence lengths is sentence control, which is a different tool.", "topic": "whole piece: what a beat is"}, {"id": "e12-write-full:q6", "level": "medium", "type": "mc", "q": "Which of these plan lines is a real beat rather than a summary?", "options": ["A phone going off inside a locked locker with nobody there to answer it.", "The changing room is a sad place after a defeat.", "Lots of things happen after the match finishes.", "The atmosphere gets worse and worse as the scene goes on."], "answer": "A phone going off inside a locked locker with nobody there to answer it.", "hint": "Three of these tell you about a mood. One of them is a thing happening at one moment.", "explain": "The answer is the first option. It is one moment, in one place, with a detail you can hear, and you could write six sentences about it without inventing anything new. The other three are all descriptions of a mood, and a mood cannot be developed, only repeated. If a plan line has no noun you could photograph and no verb you could watch, it is a summary and it will produce a thin paragraph.", "topic": "whole piece: beat versus summary"}, {"id": "e12-write-full:q7", "level": "medium", "type": "mc", "q": "You have 21 minutes of actual writing time. Which timeframe is most likely to produce a strong piece?", "options": ["About fifteen minutes of story time, in one room, with two people.", "A whole year in the life of a family.", "Three different countries over three different summers.", "A character's entire childhood, from four years old to sixteen."], "answer": "About fifteen minutes of story time, in one room, with two people.", "hint": "Ask how many sentences you can give each event in each of these.", "explain": "The answer is the first option. In 21 minutes you can write perhaps four hundred words, which is enough for three beats with real detail. Cover a year, three countries or a childhood in the same four hundred words and every event gets a sentence and a half, so the whole thing reads as a summary of a better piece. Small timeframe, few people, one place. Depth is what is marked, not distance covered.", "topic": "whole piece: keeping the timeframe small"}, {"id": "e12-write-full:q8", "level": "medium", "type": "text", "q": "How many lines does the five minute plan have? Write the number.", "answer": "7", "accept": ["7", "seven", "7 lines", "seven lines"], "hint": "Count them in the extract, from the ending down to the proofread list.", "explain": "The answer is 7. Line 1 the ending, line 2 the opening image, lines 3, 4 and 5 the three beats, line 6 the planned short sentence and where it goes, line 7 the proofread list. Seven short lines is the whole plan. If yours is running to fifteen lines, you are writing the piece twice and you will not have time to write it properly once.", "topic": "whole piece: the seven line plan"}, {"id": "e12-write-full:q9", "level": "medium", "type": "mc", "q": "The planned short sentence in the extract is Nobody had waited. Which placement gives it real effect?", "options": ["Straight after the long sentence replaying the last two minutes of the match.", "As the very first sentence of the whole piece.", "In the middle of six other short sentences.", "Repeated at the end of every paragraph."], "answer": "Straight after the long sentence replaying the last two minutes of the match.", "hint": "A short sentence needs something to be short against.", "explain": "The answer is the first option. The effect comes from the contrast, so the long sentence has to be sitting immediately in front of it. As an opening sentence it would have nothing to work against, because the reader has no speed yet. Dropped among other short sentences it disappears, because everything around it is the same length. Repeating it at the end of every paragraph turns a deliberate choice into a tic, and the third time the reader stops noticing.", "topic": "whole piece: placing the planned short sentence"}, {"id": "e12-write-full:q10", "level": "medium", "type": "mc", "q": "You are 20 minutes in. You have written the opening and two beats, and you are behind. What do you do?", "options": ["Cut beat three and go straight to the ending you planned.", "Keep writing and give up the four minutes of proofreading.", "Stop in the middle of beat two and hand it in as it is.", "Start again with a simpler idea."], "answer": "Cut beat three and go straight to the ending you planned.", "hint": "Which part of the piece would a marker miss most if it was not there?", "explain": "The answer is to cut beat three and go to your ending. Two developed beats and a proper ending is a complete piece. Three beats and no ending is an unfinished one, and unfinished costs far more than short. Giving up the proofread throws away the accuracy marks, which are the cheapest on the paper. Stopping mid beat leaves the reader nowhere. Starting again at minute twenty is how a decent piece becomes no piece. This is exactly why the ending is written down at minute one: when time goes wrong, you already know where to run to.", "topic": "whole piece: recovering when you are behind the clock"}, {"id": "e12-write-full:q11", "level": "stretch", "type": "mc", "q": "A student writes a plan with an opening image, three beats, a planned short sentence and a proofread list. What is missing?", "options": ["The ending, which should have been decided first.", "A title for the piece.", "A list of adjectives to use.", "The number of paragraphs."], "answer": "The ending, which should have been decided first.", "hint": "Count the seven lines and find which one is not there.", "explain": "The answer is the ending. That is line 1 of the plan, and it is the line this student has skipped, which means the piece has three beats and nowhere to go after them. A title is given in the task. A list of adjectives is not part of any plan, and detail should come from precise nouns and verbs rather than stacked adjectives. Counting paragraphs is not planning, because the three beats already tell you roughly how many you need.", "topic": "whole piece: auditing a plan"}, {"id": "e12-write-full:q12", "level": "stretch", "type": "mc", "q": "Which of these is the strongest opening for a narrative called The thing nobody said?", "options": ["The ice on the canal looked solid from the towpath. That is the thing about ice. It looks like a floor.", "In this story I am going to tell you about something that happened to me and my friend one winter.", "It was a normal Saturday morning and nothing much was happening at first.", "Ice is dangerous, and every year people fall through it, which is a very serious problem in this country."], "answer": "The ice on the canal looked solid from the towpath. That is the thing about ice. It looks like a floor.", "hint": "One of these puts you somewhere in the first six words. The others talk about the story instead of starting it.", "explain": "The answer is the first option. The reader is on the towpath immediately, there is a threat sitting under the surface, and the three sentences shorten as they go so the last one lands. The second option announces the piece instead of writing it, which wastes your best sentence. The third opens on nothing happening, which gives the reader no reason to continue. The fourth is a general statement about ice and belongs in a persuasive piece, not a narrative. Show something. Do not introduce it.", "topic": "whole piece: choosing an opening that shows"}, {"id": "e12-write-full:q13", "level": "stretch", "type": "long", "q": "This is the whole thing, to the clock. Write a narrative called The thing nobody said. Spend 5 minutes on the seven line plan, 21 minutes writing, and put the pen down at 26 minutes whatever state it is in, then spend the last 4 minutes proofreading. Aim for about 400 words. Write the plan first and the narrative underneath it. Use everything from this week: vary your sentence openers, place at least one short sentence deliberately, and let the reader work out how the people feel instead of telling them.", "marks": 24, "answer": "PLAN\nLine 1, the ending: we walk home, neither of us tells anybody, and that silence becomes an agreement we never discuss again.\nLine 2, opening image: the ice on the canal, which looks like a floor from the towpath.\nLine 3, beat one: Marcus walks out four steps with his arms up, turns round to say something, and goes through.\nLine 4, beat two: I lie flat on the bank and push a thin wet branch out to him, and it takes about forty seconds.\nLine 5, beat three: he stands up, wrings out one glove, and says four words about his mum.\nLine 6, planned short sentence: It felt like a school day. Straight after the long sentence about the forty seconds.\nLine 7, proofread list: capital letters, full stops, past tense, no comma splices, every I a capital.\n\nTHE THING NOBODY SAID\n\nThe ice on the canal looked solid from the towpath. That is the thing about ice. It looks like a floor.\n\nMarcus went first, because Marcus always went first. He walked out about four steps with his arms up like a man on a wire, and he turned round to say something to me, and I remember that his mouth was still open when the sound came. It was not a crack. It was a low, soft noise, like a door being pushed shut in another room, and then he was not standing on anything.\n\nHe went in up to his chest and stopped, because his coat filled with water and held him there for a second. His face changed. He did not shout, and that was the worst part, because Marcus shouts about everything, about the bus being late, about his sister eating his crisps, and now he had gone completely quiet.\n\nI did not go out to him. I want to say that I did. What I actually did was lie down flat on the bank, the way somebody had told me once, and push a branch out across the ice towards him, and it was a stupid branch, thin and wet and half rotten, and I hated it while I was holding it. He got one hand on it. The ice broke again under his elbow. I shuffled backwards and pulled, and my coat filled with mud, and I could hear my own breathing and absolutely nothing else.\n\nIt took about forty seconds. It felt like a school day.\n\nWhen he came out he lay on the towpath with his legs still in the water and steam coming off his shoulders. Then he stood up. He wrung out one glove, put it back on, and started walking.\n\n'Do not tell my mum,' he said.\n\nThat was all he said, the whole way back. We went past the lock and the bins and the boarded up pub, and his trainers made a noise like somebody chewing, and neither of us mentioned that he had nearly died two hundred metres from his own front door.\n\nI did not tell his mum. I did not tell mine either. He had a cold that week and everybody said it was going round, and at lunch on the Thursday he looked at me across the table and said nothing, and I said nothing, and that was the deal.\n\nSometimes I still walk that towpath. The water is always black and it is always moving under there, even when it looks like a floor.\n\nEspecially when it looks like a floor.", "hint": "Five minutes on the plan before a single sentence of the story, and the ending goes down first. When you start writing, keep the clock where you can see it, because the pen has to be down at twenty six minutes no matter where you have got to.", "explain": "Mark yourself out of 24, in four strands of six. STRUCTURE, 6 marks. One mark for a written seven line plan. One mark for the ending you actually wrote matching the ending in line 1. One mark for an opening that is an image rather than an announcement. One mark for three beats, or two if you had to cut one for time, each getting its own paragraph. One mark for a small timeframe, meaning one place and no jumping about in time. One mark for the piece finishing rather than stopping. DEVELOPMENT, 6 marks. Two marks for at least five specific concrete details you can point to, such as the wet branch, the coat filling, the steam off his shoulders, the trainers, the boarded up pub. Two marks for each beat staying on one thing and adding to it rather than moving on after a sentence. Two marks for showing feeling through action and speech instead of stating it, so no I was terrified and no he was really scared. SENTENCE CONTROL, 6 marks. Two marks for using a simple, a compound and a complex sentence on purpose. Two marks for at least two sentences opening with something other than the subject. Two marks for your planned short sentence appearing straight after a long one and carrying real weight. ACCURACY, 6 marks. One mark each for capital letters including every I, full stops in the right places, past tense held all the way through, no comma splices, correct spelling of the words you use most, and speech punctuated correctly with the comma inside the speech marks. Be honest about the clock as well. If you wrote for twenty six minutes and did nothing in the last four, the accuracy strand cannot score full marks even if the writing is good, because the habit is the thing being trained. Anything at 18 or above is a strong piece for the time available.", "topic": "whole piece: planning and writing a full timed narrative"}]}, "g8-rivers": {"id": "g8-rivers", "day": "Day 1", "subject": "Geography", "title": "How rivers shape the land", "minutes": 25, "objective": "Describe how a river changes from source to mouth, name the four erosion processes and the four transport processes, and say why each one takes over where it does.", "extract": "THE LONG PROFILE, described in words. There is no picture, so build it in your head as you read.\n\nPicture the whole river drawn as a side view on a page, going from left to right.\n\nOn the far left the line starts high on a mountain. That point is the SOURCE, where the river begins.\nOn the far right the line ends at sea level, where the river runs into the sea. That point is the MOUTH.\nIn between, the line drops very steeply at first, then less steeply, then it is almost flat. That curved line is called the LONG PROFILE.\n\nTHE THREE SECTIONS, marked along the drawing.\n\nUPPER COURSE, the left part, up on the mountain.\nLength 5 km. The land falls 400 m over that 5 km.\nThe channel is about 2 m wide and shallow, and the bed is covered with large angular boulders, some the size of a washing machine.\nThe valley around the channel is a steep sided V shape.\n\nMIDDLE COURSE, the middle part.\nLength 20 km. The land falls 60 m over that 20 km.\nThe channel is about 15 m wide and deeper, and the bed is covered with rounded pebbles the size of a fist.\nThe river swings from side to side in wide curves. The flat valley floor is about 500 m wide.\n\nLOWER COURSE, the right part, down at the sea.\nLength 30 km. The land falls 15 m over that 30 km.\nThe channel is about 80 m wide and deep, and the bed is covered with fine mud and sand.\nThe flat valley floor is about 3 km wide. At the very end the channel widens out into an estuary and meets the sea.\n\nTOTAL: the river is 55 km long and falls 475 m from source to mouth.\n\nFOUR ARROWS are drawn on the channel, each labelled with a letter.\nW: an arrow pointing straight down into the bed in the upper course.\nX: an arrow pointing sideways into the bank in the middle course.\nY: a boulder shown rolling along the bed in the upper course, touching the bed the whole time.\nZ: fine particles shown floating along inside the water in the lower course, never touching the bed.", "teach": {"intro": ["A river is the part of the water cycle you can stand next to. Rain falls, some of it soaks in and moves as groundwater flow, some of it runs over the surface, and all of it ends up in a channel heading downhill. Gravity does the moving, exactly as it does in the falling and downhill half of the water cycle.", "A river does three jobs on the way to the sea. It ERODES, which means it wears the land away. It TRANSPORTS, which means it carries the worn off bits along. It DEPOSITS, which means it drops those bits again. Which job it does most at any spot depends on how much energy the water has there.", "Draw the whole river from source to mouth as a side view and you get the LONG PROFILE. It is steep at the top and almost flat at the bottom, like the side of a skate ramp. Steep means fast falling water and a lot of energy going downwards, so near the source the river cuts DOWN into the bed. That is called vertical erosion, and it is what carves a V shaped valley.", "Lower down the gradient is gentle, so the river is no longer cutting down hard. Instead it swings from side to side and eats into its banks. That is called lateral erosion, which just means sideways. The valley floor gets wider and flatter the further down you go.", "FOUR EROSION PROCESSES. HYDRAULIC ACTION is the sheer force of moving water pushing air into cracks in the rock until the rock is blasted apart. ABRASION is the rocks the river is already carrying being scraped along the bed and banks, like sandpaper. ATTRITION is the carried rocks smashing into each other, so they get smaller and rounder as they travel. SOLUTION is river water slowly dissolving rock that is soluble, such as limestone or chalk, in the same way that water dissolves sugar.", "FOUR TRANSPORT PROCESSES, from heaviest to lightest. TRACTION is the biggest boulders being rolled along the bed. SALTATION is pebbles being bounced along in small hops. SUSPENSION is fine light particles being carried along inside the water without touching the bed, which is what makes a river look brown. SOLUTION here means dissolved minerals carried invisibly in the water. Solution is the one word that appears in both lists, so read the question carefully to see whether it is asking about wearing away or carrying.", "DEPOSITION happens when the river loses energy and can no longer hold its load up. The heaviest material is dropped first and the finest material is dropped last. A river loses energy when it slows down, when the gradient flattens, on the inside of a bend, and above all when it meets the sea."], "example": {"problem": "The upper course falls 400 m over 5 km. The lower course falls 15 m over 30 km. Work out the gradient of each in metres per km, then say what that tells you about where the river cuts downwards.", "steps": ["Gradient in metres per km means metres of fall for every one kilometre travelled, so divide the fall by the length.", "Upper course: 400 divided by 5. There are five lots of 80 in 400, so the gradient is 80 m per km.", "Lower course: 15 divided by 30. Half of 30 is 15, so 15 divided by 30 is 0.5. The gradient is 0.5 m per km.", "Compare them. 80 m per km against 0.5 m per km. The upper course is 160 times steeper.", "Steeper means the water is falling harder, so more of its energy is pointed downwards. That is why vertical erosion, cutting down into the bed, dominates in the upper course and hardly happens at all in the lower course."], "answer": "Upper course 80 m per km, lower course 0.5 m per km, so the river cuts downwards near the source."}, "example2": {"problem": "A boulder in the upper course is the size of a washing machine and has sharp corners. Twenty kilometres downstream the bed is covered with pebbles the size of a fist, and they are smooth and round. Name the processes that did this and explain each one.", "steps": ["Ask what has changed. The rocks are smaller and they are rounder. Both changes need explaining.", "Smaller and rounder together is ATTRITION. The rocks are knocked against each other as the river carries them, so corners are chipped off and each rock loses size every time it hits another one.", "The corners go first, because a sharp corner sticks out and takes the full force of every hit. That is why the survivors are round rather than just small.", "ABRASION is also happening, but that is the load wearing away the BED and the BANKS. Abrasion explains why the channel is deeper, not why the rocks are rounder.", "So the answer is attrition for the rocks, abrasion for the channel. Getting these two the wrong way round is the single most common mistake in this topic."], "answer": "Attrition makes the rocks smaller and rounder. Abrasion wears away the bed and banks."}, "keyfact": "Steep and narrow at the top, wide and flat at the bottom. Near the source the river cuts DOWN, near the mouth it swings SIDEWAYS and drops its load."}, "questions": [{"id": "g8-rivers:q1", "level": "easy", "type": "mc", "q": "What is the source of a river?", "options": ["The place where the river begins, usually on high ground", "The place where the river meets the sea", "The deepest part of the channel", "The rocks the river is carrying"], "answer": "The place where the river begins, usually on high ground", "hint": "Think about where a source of anything is. It is the start.", "explain": "The source is where the river starts, normally high up on a hill or a mountain. The place where it meets the sea is the mouth. Source at the top, mouth at the bottom, and the whole journey in between is the long profile.", "topic": "rivers: source and mouth"}, {"id": "g8-rivers:q2", "level": "easy", "type": "mc", "q": "Look at the long profile description. What happens to the gradient as you go from source to mouth?", "options": ["It gets gentler, from very steep to almost flat", "It gets steeper the whole way", "It stays exactly the same all the way", "It is steep, then flat, then steep again"], "answer": "It gets gentler, from very steep to almost flat", "hint": "The upper course falls 400 m in 5 km. The lower course falls only 15 m in 30 km.", "explain": "The gradient gets gentler. The upper course drops 400 m in just 5 km, while the lower course drops only 15 m across 30 km. That is why the long profile is drawn as a curve that is steep at the left and nearly flat at the right.", "topic": "rivers: shape of the long profile"}, {"id": "g8-rivers:q3", "level": "easy", "type": "mc", "q": "What is hydraulic action?", "options": ["The force of moving water pushing air into cracks until the rock breaks apart", "Rocks in the river smashing into each other and getting rounder", "The river dissolving limestone", "The load scraping along the bed like sandpaper"], "answer": "The force of moving water pushing air into cracks until the rock breaks apart", "hint": "Hydraulic means to do with water pressure. This one needs no rocks at all, just water.", "explain": "Hydraulic action is the raw force of the water itself. Water slams into a crack, traps air in there and squeezes it, and over time the rock is blasted apart. It is the only one of the four erosion processes that does not need the river to be carrying anything.", "topic": "rivers: hydraulic action"}, {"id": "g8-rivers:q4", "level": "easy", "type": "text", "q": "Rocks carried by a river bash into each other and slowly become smaller and rounder. What is that process called? One word.", "answer": "attrition", "accept": ["attrition", "Attrition", "atrition", "attricion"], "hint": "It starts with the letter a. It is not abrasion, which wears away the bed.", "explain": "The answer is attrition. The rocks hit each other, corners get chipped off first because they stick out, and the rocks end up smaller and rounder the further downstream they go. Abrasion is the other a word, and that is the load wearing away the bed and banks instead.", "topic": "rivers: attrition"}, {"id": "g8-rivers:q5", "level": "easy", "type": "mc", "q": "Recall from the water cycle. The sun heats the sea, liquid water turns into water vapour and rises into the air. What is that stage called?", "options": ["Evaporation", "Condensation", "Precipitation", "Infiltration"], "answer": "Evaporation", "hint": "Liquid turning into gas and going UP. The other one, condensation, is gas turning back into liquid.", "explain": "That is evaporation: liquid water becoming vapour and rising, powered by heat from the sun. Condensation is the opposite move, vapour cooling and turning back into liquid droplets to make a cloud. Evaporation goes up as a gas, condensation comes back as a liquid. If you can say which direction each one goes, you cannot mix them up.", "topic": "water cycle: evaporation versus condensation (recall)"}, {"id": "g8-rivers:q6", "level": "medium", "type": "mc", "q": "What is the difference between abrasion and attrition?", "options": ["Abrasion wears away the bed and banks, attrition wears away the rocks the river is carrying", "Abrasion wears away the rocks being carried, attrition wears away the bed", "They are two words for the same process", "Abrasion only happens in the lower course, attrition only in the upper course"], "answer": "Abrasion wears away the bed and banks, attrition wears away the rocks the river is carrying", "hint": "One of them damages the river's channel. The other damages the load.", "explain": "Abrasion is the load being dragged along and scraping the bed and banks, like sandpaper on wood, so it makes the channel deeper and wider. Attrition is the load hitting itself, so it makes the rocks smaller and rounder. Same rocks, but abrasion is what they do to the river and attrition is what they do to each other.", "topic": "rivers: abrasion versus attrition"}, {"id": "g8-rivers:q7", "level": "medium", "type": "mc", "q": "A river flows over limestone, which is a soluble rock. The water slowly dissolves the rock as it passes. Which erosion process is that?", "options": ["Solution", "Hydraulic action", "Traction", "Saltation"], "answer": "Solution", "hint": "Think about what happens to sugar stirred into a cup of tea.", "explain": "That is solution, a chemical process where the rock dissolves into the water, like sugar in tea. It only works on soluble rocks such as limestone and chalk, so it does almost nothing on granite. Traction and saltation are not erosion at all, they are ways of carrying the load.", "topic": "rivers: solution as erosion"}, {"id": "g8-rivers:q8", "level": "medium", "type": "text", "q": "A pebble is being bounced along the river bed in a series of small hops. What is that transport process called? One word.", "answer": "saltation", "accept": ["saltation", "Saltation", "salltation", "saltatian"], "hint": "It comes from a word meaning to jump. Bouncing, not rolling and not floating.", "explain": "The answer is saltation, which means bouncing or hopping along the bed. Traction is heavier material rolling and staying in contact with the bed the whole time. Suspension is lighter material floating along inside the water and never touching the bed at all.", "topic": "rivers: saltation"}, {"id": "g8-rivers:q9", "level": "medium", "type": "mc", "q": "On the long profile, arrow Z shows fine particles floating along inside the water in the lower course, never touching the bed. Which transport process is that?", "options": ["Suspension", "Traction", "Saltation", "Solution"], "answer": "Suspension", "hint": "The particles are held up inside the water. Which word means held up?", "explain": "That is suspension, where fine light particles such as silt and clay are carried along inside the moving water without touching the bed. It is why a river in flood looks brown. Solution would also be invisible, but in solution the material is dissolved, so you could not filter it out with a net.", "topic": "rivers: suspension"}, {"id": "g8-rivers:q10", "level": "medium", "type": "text", "q": "The upper course falls 400 m over 5 km. What is the gradient in metres per km? Write just the number.", "answer": "80", "accept": ["80", "80 m per km", "80m per km", "80 metres per km", "80 m/km"], "hint": "Metres per km means metres of fall for each single kilometre, so divide the fall by the length.", "explain": "The answer is 80 m per km. Divide the fall by the distance: 400 divided by 5 = 80. Check it forwards, which is the habit from the Day 1 maths session on working backwards: 80 x 5 = 400, so it fits. A gradient of 80 m per km is very steep, which is why the river cuts downwards here.", "topic": "rivers: calculating gradient"}, {"id": "g8-rivers:q11", "level": "medium", "type": "text", "q": "The lower course falls 15 m over 30 km. What is the gradient in metres per km? Write just the number.", "answer": "0.5", "accept": ["0.5", "0.5 m per km", "0.5m per km", "1/2", ".5", "0.5 metres per km"], "hint": "15 divided by 30. The answer must be less than 1, because the fall is smaller than the number of kilometres.", "explain": "The answer is 0.5 m per km. Divide 15 by 30. Half of 30 is 15, so 15 divided by 30 is 0.5. Do not flip it round to 2, which is what you get from 30 divided by 15. You are asked for metres for every one km, so metres go on top. The lower course is 160 times gentler than the upper course, which is why the river drops its load here instead of cutting down.", "topic": "rivers: calculating gradient"}, {"id": "g8-rivers:q12", "level": "medium", "type": "mc", "q": "What makes a river deposit the material it has been carrying?", "options": ["It loses energy, usually because it slows down or the land flattens out", "It gains energy as it speeds up", "It rains harder upstream", "The water gets colder"], "answer": "It loses energy, usually because it slows down or the land flattens out", "hint": "Carrying anything takes energy. What happens when you run out of it?", "explain": "Deposition happens when the river loses energy and can no longer hold its load. That happens when it slows down, when the gradient flattens, on the inside of a bend, and most of all when it meets the sea. Heaviest material is dropped first because it takes the most energy to carry, and the finest silt is carried furthest.", "topic": "rivers: why deposition happens"}, {"id": "g8-rivers:q13", "level": "stretch", "type": "mc", "q": "Arrow W points straight down into the bed in the upper course and arrow X points sideways into the bank in the middle course. Why does the direction of erosion change like that?", "options": ["Near the source the gradient is steep, so energy goes into cutting down, and lower down the gradient is gentle, so the river swings sideways instead", "Near the source there is more water, so it digs deeper", "The rock in the upper course is always softer than the rock lower down", "The river changes direction because the wind changes"], "answer": "Near the source the gradient is steep, so energy goes into cutting down, and lower down the gradient is gentle, so the river swings sideways instead", "hint": "Compare the two gradients you worked out, 80 m per km and 0.5 m per km. Which direction is the water mainly moving in each case?", "explain": "It is about gradient. In the upper course the land drops 80 m every km, so the water is falling steeply and most of its energy is pointed downwards, giving vertical erosion and a V shaped valley. In the lower course the drop is only 0.5 m per km, so almost none of the movement is downwards. The energy goes sideways instead, giving lateral erosion, wider bends and a broad flat valley floor. There is actually MORE water in the lower course, not less, so the amount of water is not the reason.", "topic": "rivers: vertical versus lateral erosion"}, {"id": "g8-rivers:q14", "level": "stretch", "type": "long", "q": "Describe how a river changes from source to mouth. Cover the channel, the load and the type of erosion, and explain where the water in the river came from in the first place using the water cycle.", "marks": 5, "hint": "Work down the river in order, source then middle then mouth, and for each one say what the channel is doing, what the load is doing and which way the erosion is pointing. Start by saying where the water came from.", "answer": "The water in a river comes from precipitation. Some of the rain flows over the ground as surface run off and some soaks in and arrives later as groundwater flow, and both feed the channel. Gravity then pulls that water downhill to the sea, where the sun evaporates it again and the cycle repeats. At the source the channel is narrow and shallow, about 2 m wide, and the gradient is very steep at 80 m per km, so erosion is mainly vertical and the river cuts down into the bed to make a V shaped valley. The load there is large and angular. Going downstream the channel gets wider and deeper, about 15 m wide in the middle course and about 80 m wide in the lower course, and the gradient falls to 0.5 m per km. Erosion becomes mainly lateral, so the river swings sideways and widens the valley floor. The load gets smaller and rounder because of attrition, changing from boulders to pebbles to fine mud, and near the mouth the river loses energy and deposits most of it.", "explain": "A full mark answer has five things in it. One, the water comes from precipitation and reaches the channel by surface run off and groundwater flow, and returns to the sea where evaporation starts the cycle again. Two, the channel gets wider and deeper going downstream, with figures if you have them. Three, the gradient gets gentler, ideally quoting 80 m per km against 0.5 m per km. Four, erosion changes from vertical at the source to lateral near the mouth. Five, the load gets smaller and rounder because of attrition, and is deposited when the river runs out of energy. Mark yourself one per point. Saying the river just gets bigger is worth one mark on its own, because it names no process.", "topic": "rivers: long profile linked to the water cycle"}]}, "g9-river-landforms": {"id": "g9-river-landforms", "day": "Day 2", "subject": "Geography", "title": "River landforms", "minutes": 25, "objective": "Explain how waterfalls and gorges, meanders and ox bow lakes, and flood plains and levees are formed, as a sequence of steps over time rather than a list of names.", "extract": "FOUR LANDFORMS, described in words. There are no pictures, so read each one slowly and build the picture in your head.\n\n1. THE WATERFALL AT BLACK FORCE, seen from the side.\nThe river runs along flat, then drops straight down 12 m into a pool, then carries on.\nLook at the cliff face under the drop. The top 3 m of it is a band of hard dark rock. Below that is 9 m of soft pale rock.\nThe soft rock has been cut back about 2 m further than the hard rock, so the hard rock sticks out over empty air like a shelf with nothing underneath it.\nAt the bottom is a pool about 4 m deep, which is deeper than the river anywhere else. The water in it churns round and round, and loose rocks sit in the bottom of it being swirled about.\nDownstream of the waterfall the valley is a narrow slot with almost vertical sides, about 20 m deep and 300 m long. The river fills the whole floor of the slot.\n\n2. THE MEANDER AT WILLOW BEND, seen from directly above, as if from a drone.\nThe river swings in a wide curve, like the top half of a letter S.\nOn the OUTSIDE of the curve the bank is a bare vertical wall of soil and rock about 3 m high, with tree roots hanging out of the top of it and no plants growing on it. The water against that bank is 4 m deep and is moving fast.\nOn the INSIDE of the same curve the bank slopes gently down to the water like a beach. It is covered with clean rounded pebbles and sand. The water there is only about 30 cm deep and is barely moving.\n\n3. THE OX BOW LAKE AT LONG MEADOW, seen from above.\nA curved lake shaped like a horseshoe sits on the flat valley floor about 40 m from the river. It is not joined to the river at either end. It is about 300 m long, only 1 m deep, and the water in it is still and green with weed.\nBetween the two ends of the horseshoe the river now runs almost straight.\nA few hundred metres upstream there is a place where the river loops round in a very tight curve, and the two arms of that loop come within about 15 m of each other.\n\n4. THE FLOOD PLAIN AND LEVEES AT MARSHFORD, seen as a cross section, so you are looking at a slice through the valley from left to right.\nThe valley floor is flat, about 2 km wide, with low hills at each edge.\nThe channel runs through the middle of that flat floor.\nRight at each edge of the channel the ground is raised into a bank about 1.5 m higher than the rest of the valley floor. Each raised bank is about 30 m wide and runs along the river for miles.\nDig into one of those raised banks and you find coarse sand and gravel.\nDig 200 m away from the channel, out on the flat ground, and you find fine mud and silt instead, in flat layers stacked on top of each other.", "teach": {"intro": ["A landform is not a thing to memorise, it is a process caught halfway through. Every one of these shapes is being made right now, slowly, by water that is going faster in some places than others.", "There is one question that unlocks almost all of them: where is the water fast and where is it slow? Fast water erodes and carries. Slow water deposits. That is it.", "WATERFALLS. A waterfall forms where a band of hard rock lies on top of softer rock. Hydraulic action and abrasion cut the soft rock back faster, so the hard rock is left sticking out as an overhang with nothing under it. At the bottom the falling water and the rocks it swirls around dig out a deep PLUNGE POOL. In the end the overhang gets too heavy to hold itself up and collapses into the pool. The waterfall is then in the same shape as before, but a few metres further upstream. Repeat that for thousands of years and the waterfall retreats up the valley, leaving a steep sided GORGE behind it, which is simply the track it has walked.", "MEANDERS. Water on the outside of a bend has further to travel, so it moves faster, and fast water erodes. That is why the outside of a bend is deep, with a bare vertical RIVER CLIFF. Water on the inside travels a shorter way, slows down and drops what it is carrying, which builds a gently sloping SLIP OFF SLOPE of pebbles and sand. So a bend is being cut on one side and filled in on the other, which means the whole bend slowly moves sideways and gets more curved.", "OX BOW LAKES. Keep that going and a loop becomes so tight that only a thin NECK of land separates the two arms. In a flood the river has the energy to cut straight through the neck. Water always takes the easier route, so it abandons the loop. Deposition then seals off both ends of the old loop with silt, and what is left is a horseshoe shaped OX BOW LAKE, cut off from the river and slowly filling with weed.", "FLOOD PLAINS AND LEVEES. A flood plain is the flat land either side of a river in its lower course. It is built by two things. First, meanders migrating sideways over thousands of years plane the valley floor flat. Second, every time the river floods it spreads a layer of fine silt, called alluvium, across that floor. LEVEES are the raised banks right at the channel edge. The instant flood water leaves the channel it slows down, so it drops the heaviest material first, right there at the edge. Do that hundreds of times and you build a natural wall of coarse sand and gravel along each bank, with the fine mud carried further out."], "example": {"problem": "Explain, step by step, how the waterfall at Black Force formed and why there is a narrow gorge downstream of it.", "steps": ["Start with the rock. A band of hard rock lies on top of softer rock, and the river runs across the join.", "The soft rock is worn back faster than the hard rock, by hydraulic action forcing air into cracks and by abrasion as the load scrapes it.", "The hard rock is left sticking out over nothing. That is the overhang, and at Black Force it sticks out about 2 m.", "The falling water hits the base and swirls loose rocks round and round, drilling out a deep plunge pool. At Black Force it is 4 m deep, deeper than the river anywhere else.", "The overhang loses its support and collapses into the plunge pool. The waterfall now sits a few metres further upstream than it did.", "Repeat for thousands of years. The waterfall retreats upstream, and the steep sided slot it leaves behind is the gorge. The gorge at Black Force is 300 m long, so the waterfall has retreated 300 m."], "answer": "Soft rock is cut back, the hard rock overhangs, the overhang collapses, the waterfall retreats upstream, and the slot it leaves behind is the gorge."}, "example2": {"problem": "Explain how the ox bow lake at Long Meadow formed, and say why the water in it is still and full of weed.", "steps": ["Start with a normal bend. Water on the outside travels further and moves faster, so it erodes a river cliff. Water on the inside is slower and deposits a slip off slope.", "Because one side is being cut and the other is being filled, the bend moves sideways and becomes more curved with every year that passes.", "Eventually the loop is so tight that the two arms are only a thin neck of land apart. At Long Meadow the tight loop upstream is down to about 15 m.", "During a flood the river has extra energy and cuts straight through the neck.", "The straight route is shorter and easier, so the river takes it and abandons the loop.", "Deposition seals both ends of the old loop with silt, leaving a horseshoe shaped lake cut off from the river.", "Nothing flows through it any more, so the water is still. Still shallow water warms up and lets weed grow, and over time the lake fills in and becomes a curved marshy scar on the flood plain."], "answer": "A bend becomes a tight loop, a flood cuts through the neck, the river takes the straight route, deposition seals the ends, and a horseshoe shaped lake is left behind."}, "keyfact": "Every river landform is one question answered: where is the water fast and where is it slow? Fast water cuts, slow water drops."}, "questions": [{"id": "g9-river-landforms:q1", "level": "easy", "type": "mc", "q": "A waterfall forms where the river crosses two bands of rock. What has to be true about them?", "options": ["A band of hard rock lies on top of softer rock", "Both bands are equally hard", "The soft rock lies on top of the hard rock", "Both bands are made of limestone"], "answer": "A band of hard rock lies on top of softer rock", "hint": "Something has to be left sticking out over the drop. Which one survives longer?", "explain": "A waterfall needs hard rock sitting on top of soft rock. The soft rock underneath is worn back faster, so the hard rock is left sticking out with nothing under it. If both bands were equally hard there would be no step, and if the soft rock were on top it would just be worn down flat instead.", "topic": "river landforms: rock conditions for a waterfall"}, {"id": "g9-river-landforms:q2", "level": "easy", "type": "mc", "q": "At Black Force there is a pool at the bottom of the drop that is 4 m deep, deeper than the river anywhere else. What is it called?", "options": ["A plunge pool", "An ox bow lake", "A river cliff", "A levee"], "answer": "A plunge pool", "hint": "It is named after what the water does when it arrives.", "explain": "That is a plunge pool. It is drilled out by the force of the falling water and, more importantly, by loose rocks being swirled round and round in it, which is abrasion working like a drill. That is why it is deeper than the rest of the channel.", "topic": "river landforms: plunge pool"}, {"id": "g9-river-landforms:q3", "level": "easy", "type": "text", "q": "A waterfall slowly retreats upstream over thousands of years. What is the steep sided narrow valley it leaves behind called? One word.", "answer": "gorge", "accept": ["gorge", "a gorge", "Gorge", "gorge valley"], "hint": "At Black Force it is the 20 m deep slot downstream, 300 m long.", "explain": "The answer is a gorge. A gorge is simply the track the waterfall has walked. Each time the overhang collapses the waterfall moves a few metres upstream, and the steep sided slot left behind it grows longer. At Black Force the gorge is 300 m long, so the waterfall has retreated 300 m from where it started.", "topic": "river landforms: gorge formation"}, {"id": "g9-river-landforms:q4", "level": "easy", "type": "mc", "q": "On a meander, where is the water moving fastest?", "options": ["On the outside of the bend", "On the inside of the bend", "Exactly in the middle", "It is the same speed everywhere"], "answer": "On the outside of the bend", "hint": "The outside of the curve is the longer way round. To keep up, the water there has to do what?", "explain": "The water on the outside of the bend is fastest, because it has further to travel round the longer curve. Fast water has more energy, so it erodes. That is why the outside of a bend is deep, 4 m at Willow Bend, and has a bare vertical bank.", "topic": "river landforms: fast and slow water on a bend"}, {"id": "g9-river-landforms:q5", "level": "medium", "type": "mc", "q": "At Willow Bend the outside of the curve is a bare vertical wall of soil and rock about 3 m high with tree roots hanging out of it. What is that landform called and why is it there?", "options": ["A river cliff, because fast water on the outside of the bend erodes the bank", "A slip off slope, because slow water drops its load there", "A levee, because flood water dropped gravel there", "A plunge pool, because falling water drilled it out"], "answer": "A river cliff, because fast water on the outside of the bend erodes the bank", "hint": "Bare and vertical with roots hanging out means the bank is being cut away, not built up.", "explain": "That is a river cliff. The fast water on the outside undercuts the bank, so the soil above it collapses and leaves a vertical face with roots exposed and no plants growing. Nothing is being deposited there, which is exactly why it stays bare.", "topic": "river landforms: river cliff"}, {"id": "g9-river-landforms:q6", "level": "medium", "type": "text", "q": "At Willow Bend the inside of the curve slopes gently down to the water and is covered with clean rounded pebbles and sand. What is that landform called? Three words.", "answer": "slip off slope", "accept": ["slip off slope", "slip-off slope", "a slip off slope", "slipoff slope", "point bar"], "hint": "It slips gently down to the water on the slow side of the bend.", "explain": "That is a slip off slope, sometimes called a point bar. Water on the inside of a bend travels a shorter distance and slows down, so it has less energy and deposits what it was carrying. The pebbles are rounded because attrition has been knocking their corners off all the way downstream, which is the Day 1 idea reappearing here.", "topic": "river landforms: slip off slope"}, {"id": "g9-river-landforms:q7", "level": "medium", "type": "mc", "q": "Put the stages of ox bow lake formation into the right order.", "options": ["Bend becomes a tight loop, flood cuts through the neck, river takes the straight route, deposition seals both ends", "Flood cuts through the neck, bend becomes a tight loop, deposition seals both ends, river takes the straight route", "Deposition seals both ends, bend becomes a tight loop, flood cuts through the neck, river takes the straight route", "River takes the straight route, deposition seals both ends, flood cuts through the neck, bend becomes a tight loop"], "answer": "Bend becomes a tight loop, flood cuts through the neck, river takes the straight route, deposition seals both ends", "hint": "You cannot cut through a neck until there is a neck. Work out which stage has to come first.", "explain": "The order is: the bend gets tighter until only a thin neck is left, a flood gives the river enough energy to cut straight through that neck, the river then takes the shorter straight route and abandons the loop, and finally deposition seals both ends of the loop with silt. The sealing has to be last, because you cannot seal the ends of a loop that has not been cut off yet.", "topic": "river landforms: order of ox bow lake formation"}, {"id": "g9-river-landforms:q8", "level": "medium", "type": "mc", "q": "Why is the water in the ox bow lake at Long Meadow still, shallow and full of weed?", "options": ["It is cut off from the river, so nothing flows through it any more", "It is fed by a fast underground stream", "It is deeper than the river", "The river floods into it every day"], "answer": "It is cut off from the river, so nothing flows through it any more", "hint": "Look at the description again. Is it joined to the river at either end?", "explain": "The lake is sealed off at both ends, so no water flows through it. Still water is warm and calm, which lets weed grow, and there is no current to carry sediment away, so the lake slowly fills in. In the end it becomes a curved damp mark on the flood plain called a meander scar.", "topic": "river landforms: why an ox bow lake is still water"}, {"id": "g9-river-landforms:q9", "level": "medium", "type": "mc", "q": "At Marshford the raised banks right at the channel edge are made of coarse sand and gravel, but 200 m away the ground is fine mud. Why?", "options": ["Flood water slows down the instant it leaves the channel, so it drops the heaviest material first, right at the edge", "Flood water speeds up as it leaves the channel, so it carries the gravel furthest", "Farmers put the gravel there to hold the river back", "The mud was dropped first and the gravel was dropped later"], "answer": "Flood water slows down the instant it leaves the channel, so it drops the heaviest material first, right at the edge", "hint": "Heaviest material needs the most energy to carry. Where does the water lose energy first?", "explain": "As soon as flood water spills out of the channel it spreads out and slows down, so it loses energy immediately. The heaviest material needs the most energy to carry, so the sand and gravel are dumped straight away at the edge. Only the fine light silt is still being carried by the time the water is 200 m out. Repeat that over hundreds of floods and you build natural raised banks, called levees.", "topic": "river landforms: how levees form"}, {"id": "g9-river-landforms:q10", "level": "medium", "type": "text", "q": "Recall from yesterday. Which erosion process is the sheer force of moving water forcing air into cracks in the rock until it breaks apart? Two words.", "answer": "hydraulic action", "accept": ["hydraulic action", "Hydraulic action", "hydralic action", "hydraulic"], "hint": "Hydraulic means to do with water pressure. No rocks are needed for this one.", "explain": "The answer is hydraulic action. It is one of the two processes cutting back the soft rock under a waterfall, working alongside abrasion. Do not confuse it with abrasion, which needs the river to be carrying rocks, or with solution, which needs the rock to be soluble.", "topic": "rivers: hydraulic action (recall)"}, {"id": "g9-river-landforms:q11", "level": "medium", "type": "mc", "q": "The flat valley floor at Marshford is about 2 km wide. What built it?", "options": ["Meanders moving sideways over thousands of years, plus layers of silt left by repeated floods", "A single very large flood in one year", "The wind blowing soil into the valley", "Water dissolving the whole valley floor away"], "answer": "Meanders moving sideways over thousands of years, plus layers of silt left by repeated floods", "hint": "Two things are at work: one wears the floor flat, the other builds it up.", "explain": "A flood plain is built by two processes working together. Meanders swing sideways across the valley over thousands of years, cutting the floor flat as they go. Then every flood spreads a fresh layer of fine silt, called alluvium, over that floor. That is why digging out on the flat ground gives flat stacked layers of mud, one layer per flood. It is also why flood plains are such good farmland.", "topic": "river landforms: how a flood plain is built"}, {"id": "g9-river-landforms:q12", "level": "stretch", "type": "mc", "q": "Why does a river usually cut through the neck of a meander during a FLOOD rather than in normal conditions?", "options": ["In a flood there is far more water moving faster, so the river has enough extra energy to erode straight through the land", "In a flood the water is colder, which makes rock weaker", "In a flood the river always runs backwards for a short time", "In a flood the neck of la
