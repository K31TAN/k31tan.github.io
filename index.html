", "explain": "\"Wir wohnen in Wolverhampton.\" The pronoun wir (we) takes the -en ending on the verb: ich wohne, du wohnst, er/sie/es wohnt, wir wohnen, ihr wohnt, sie/Sie wohnen. German does not use a helper verb like the English are living, so sind wohnen is never correct."}]}, {"level": 3, "label": "Year 7 into Year 8", "descriptor": "Present tense endings, common irregular verbs, verb second word order and negation", "extract": null, "questions": [{"id": "de9", "type": "text", "q": "Fill the gap with the correct form of spielen: \"Ihr ____ jeden Samstag Fussball.\"", "answer": "spielt", "accept": ["spielt", "Spielt"], "topic": "present tense: regular verb endings", "explain": "spielt. Take the stem spiel- and add the ending for the person: ich spiele, du spielst, er/sie/es spielt, wir spielen, ihr spielt, sie/Sie spielen. Ihr (you, more than one person you know) takes -t, so ihr spielt."}, {"id": "de10", "type": "mc", "q": "Which is the correct form of fahren? \"Du ____ mit dem Bus zur Schule.\"", "options": ["faehrst", "fahrst", "faehrt", "fahrest"], "answer": "faehrst", "topic": "present tense: irregular verbs, fahren essen lesen sehen", "explain": "faehrst (fährst). A group of strong verbs change their vowel in the du and er/sie/es forms only: fahren gives du faehrst, er faehrt; essen gives du isst, er isst; lesen gives du liest, er liest; sehen gives du siehst, er sieht. The wir and ihr forms keep the normal vowel: wir fahren, ihr fahrt."}, {"id": "de11", "type": "text", "q": "Put these words in the correct order to make one German sentence: essen / wir / am Wochenende / Pizza", "answer": "Am Wochenende essen wir Pizza.", "accept": ["Am Wochenende essen wir Pizza.", "Am Wochenende essen wir Pizza", "am Wochenende essen wir Pizza.", "am wochenende essen wir pizza", "Am Wochenende essen wir Pizza!", "Wir essen am Wochenende Pizza.", "Wir essen am Wochenende Pizza"], "topic": "word order: verb second", "explain": "\"Am Wochenende essen wir Pizza.\" In a German statement the verb must be the second idea in the sentence. If you start with a time phrase like am Wochenende, that counts as the first idea, so the verb essen comes next and the subject wir is pushed to third place. \"Wir essen am Wochenende Pizza\" is also correct because the verb is still second."}, {"id": "de12", "type": "mc", "q": "Which sentence correctly says \"I do not like Maths\"?", "options": ["Ich mag Mathe nicht.", "Ich mag nicht Mathe.", "Ich nicht mag Mathe.", "Ich mag kein Mathe."], "answer": "Ich mag Mathe nicht.", "topic": "negation: nicht and kein", "explain": "\"Ich mag Mathe nicht.\" Nicht usually goes at the end of a short sentence like this, after the thing being talked about. Nicht can never sit between the subject and the verb. You use kein instead of nicht only in front of a noun that has ein or no article at all, for example ich habe keine Hausaufgaben, but a subject name like Mathe takes nicht."}]}, {"level": 4, "label": "Year 8", "descriptor": "Accusative case, separable verbs, modal verbs, questions, comparatives and time manner place word order", "extract": "Ich heisse Amir und ich bin zwoelf Jahre alt. Ich wohne in Birmingham mit meiner Familie. Jeden Tag stehe ich um sieben Uhr auf und fahre mit dem Bus zur Schule. Mein Lieblingsfach ist Sport, denn ich liebe Fussball. Mathe finde ich langweilig. Am Samstag spiele ich mit meinen Freunden im Park. Danach essen wir Pizza.", "questions": [{"id": "de13", "type": "mc", "q": "Which sentence correctly says \"I have a bigger brother\"?", "options": ["Ich habe einen groesseren Bruder.", "Ich habe ein groesser Bruder.", "Ich habe einen gross Bruder.", "Ich habe eine groessere Bruder."], "answer": "Ich habe einen groesseren Bruder.", "topic": "accusative case and comparative adjectives", "explain": "\"Ich habe einen groesseren Bruder.\" Bruder is the object of habe, so it goes into the accusative case, and for masculine nouns the article changes: der becomes den and ein becomes einen. The comparative of gross is groesser (bigger), and because it sits in front of the noun it also needs an ending, giving groesseren after einen."}, {"id": "de14", "type": "mc", "q": "Which sentence correctly says \"I have to buy a new book\"?", "options": ["Ich muss ein neues Buch kaufen.", "Ich muss kaufen ein neues Buch.", "Ich musse ein neues Buch kaufen.", "Ich muss ein neues Buch kaufe."], "answer": "Ich muss ein neues Buch kaufen.", "topic": "modal verbs: muessen, koennen, wollen", "explain": "\"Ich muss ein neues Buch kaufen.\" Modal verbs have no ending in the ich and er forms: ich muss, ich kann, ich will. The second verb then stays as an infinitive and is sent right to the end of the sentence, so kaufen is the last word."}, {"id": "de15", "type": "text", "q": "In the extract above, Amir writes \"Jeden Tag stehe ich um sieben Uhr auf.\" Write the infinitive (the dictionary form) of the verb he is using.", "answer": "aufstehen", "accept": ["aufstehen", "Aufstehen", "aufstehen (to get up)"], "topic": "separable verbs", "explain": "aufstehen (to get up). It is a separable verb: in a normal sentence the main part stays in second place and the little prefix auf breaks off and goes to the very end, giving stehe ... auf. Other examples are fernsehen (ich sehe fern) and anfangen (die Schule faengt an)."}, {"id": "de16", "type": "text", "q": "Write this in German as a question, using du: \"Do you go to school by bus every day?\"", "answer": "Faehrst du jeden Tag mit dem Bus zur Schule?", "accept": ["Faehrst du jeden Tag mit dem Bus zur Schule?", "Fährst du jeden Tag mit dem Bus zur Schule?", "Faehrst du jeden Tag mit dem Bus zur Schule", "Fährst du jeden Tag mit dem Bus zur Schule", "Faehrst du jeden Tag mit dem Bus in die Schule?", "Fährst du jeden Tag mit dem Bus in die Schule?", "Gehst du jeden Tag mit dem Bus zur Schule?"], "topic": "forming questions and word order: time manner place", "explain": "\"Faehrst du jeden Tag mit dem Bus zur Schule?\" To ask a yes or no question you simply swap the verb and the subject, so du faehrst becomes faehrst du. The rest follows the time, manner, place order: jeden Tag is the time, mit dem Bus is the manner (how), zur Schule is the place. English puts them in the opposite order, which is the usual trap."}]}, {"level": 5, "label": "Grade 9 calibre", "descriptor": "Subordinate clauses with weil and dass, perfect tense, dative case, translation and reading for meaning", "extract": "Letztes Wochenende bin ich mit meiner Familie nach London gefahren. Wir haben ein Fussballspiel gesehen und danach haben wir in einem italienischen Restaurant gegessen. Ich habe Pizza bestellt, weil ich Pasta nicht mag. Am Abend waren wir sehr muede, aber ich glaube, dass es ein toller Tag war. Naechstes Jahr moechte ich wieder dorthin fahren.", "questions": [{"id": "de17", "type": "mc", "q": "Which sentence correctly says \"I think that Maths is hard\"?", "options": ["Ich denke, dass Mathe schwer ist.", "Ich denke, dass Mathe ist schwer.", "Ich denke, dass ist Mathe schwer.", "Ich denke, Mathe dass schwer ist."], "answer": "Ich denke, dass Mathe schwer ist.", "topic": "word order: dass clause, verb to the end", "explain": "\"Ich denke, dass Mathe schwer ist.\" Dass and weil are subordinating conjunctions: they kick the verb right to the end of their own clause. So ist, which would normally be in second place, ends up last. There is always a comma in front of dass and weil."}, {"id": "de18", "type": "mc", "q": "Which word completes this sentence? \"Ich wohne bei ____ Grossmutter.\" (I live at my grandmother's.)", "options": ["meiner", "meine", "meinem", "mein"], "answer": "meiner", "topic": "dative case after bei mit nach von zu", "explain": "meiner. The prepositions aus, bei, mit, nach, seit, von and zu are always followed by the dative case. Grossmutter is feminine, and in the dative feminine words change from die to der, so meine becomes meiner. Meinem would be right for a masculine or neuter noun, as in bei meinem Bruder."}, {"id": "de19", "type": "text", "q": "Read the German extract above. Why did the writer order pizza? Answer in English.", "answer": "Because he does not like pasta.", "accept": ["Because he does not like pasta.", "because he does not like pasta", "Because he doesn't like pasta.", "because he doesn't like pasta", "He doesn't like pasta.", "he does not like pasta", "Because they do not like pasta.", "because they don't like pasta", "He does not like pasta"], "topic": "reading comprehension: finding a reason in a weil clause", "explain": "Because he does not like pasta. The sentence is \"Ich habe Pizza bestellt, weil ich Pasta nicht mag.\" Weil means because, and the verb mag has been pushed to the end of the clause, which is why the reason reads back to front compared with English."}, {"id": "de20", "type": "text", "q": "Translate into German: \"Yesterday I played football because the weather was good.\"", "answer": "Gestern habe ich Fussball gespielt, weil das Wetter gut war.", "accept": ["Gestern habe ich Fussball gespielt, weil das Wetter gut war.", "Gestern habe ich Fußball gespielt, weil das Wetter gut war.", "Gestern habe ich Fussball gespielt, weil das Wetter gut war", "Gestern habe ich Fußball gespielt, weil das Wetter gut war", "Ich habe gestern Fussball gespielt, weil das Wetter gut war.", "Ich habe gestern Fußball gespielt, weil das Wetter gut war.", "Gestern habe ich Fussball gespielt weil das Wetter gut war."], "topic": "translation: perfect tense with haben and weil clause", "explain": "\"Gestern habe ich Fussball gespielt, weil das Wetter gut war.\" The perfect tense is built from haben or sein plus a past participle at the end: spielen gives gespielt, so habe ich ... gespielt. Movement verbs use sein instead, as in ich bin gefahren. Because gestern starts the sentence the verb habe stays second and ich moves after it, and weil then sends war to the end of the second clause."}]}], "guardianStart": {"label": "Keitan, absolute beginner self-check", "descriptor": "Eight questions to confirm the starting point for an adult beginner", "questions": [{"id": "g1", "type": "mc", "q": "Which German word means \"hello\"?", "options": ["Hallo", "Tschuess", "Danke", "Bitte"], "answer": "Hallo", "topic": "greetings", "explain": "Hallo means hello. Tschuess (tschüss) means bye, danke means thank you and bitte means please or you are welcome."}, {"id": "g2", "type": "mc", "q": "What does \"Guten Tag\" mean?", "options": ["Good day", "Good night", "Good luck", "Good idea"], "answer": "Good day", "topic": "greetings: times of day", "explain": "Good day, used as a polite hello during the daytime. The set is Guten Morgen (morning), Guten Tag (day), Guten Abend (evening) and Gute Nacht (said only when someone is going to bed)."}, {"id": "g3", "type": "text", "q": "Write the German word for the number 3.", "answer": "drei", "accept": ["drei", "Drei"], "topic": "numbers 1 to 10", "explain": "drei. The first five are eins, zwei, drei, vier, fuenf (fünf), then sechs, sieben, acht, neun, zehn."}, {"id": "g4", "type": "mc", "q": "What does \"Ich bin\" mean?", "options": ["I am", "I have", "You are", "He is"], "answer": "I am", "topic": "the verb sein: I am", "explain": "I am. Ich means I and bin is the I form of sein (to be). I have is ich habe, you are is du bist and he is is er ist."}, {"id": "g5", "type": "text", "q": "Complete this sentence to say \"My name is Keitan\", using the verb heissen: \"Ich ____ Keitan.\"", "answer": "heisse", "accept": ["heisse", "heiße", "Heisse", "Heiße"], "topic": "introducing yourself", "explain": "heisse (heiße). Literally this is I am called. The question that goes with it is \"Wie heissen Sie?\" to an adult you do not know, or \"Wie heisst du?\" to a child or a friend."}, {"id": "g6", "type": "mc", "q": "German has three different words for \"the\". Which set is correct?", "options": ["der, die, das", "der, dei, dos", "le, la, les", "ein, eine, einen"], "answer": "der, die, das", "topic": "articles: der die das", "explain": "der, die, das. Every noun is masculine (der), feminine (die) or neuter (das), and you have to learn the gender with the word. Ein and eine are the words for a, not the."}, {"id": "g7", "type": "text", "q": "Write the German words for \"yes\" and \"no\", separated by a comma.", "answer": "ja, nein", "accept": ["ja, nein", "ja nein", "Ja, nein", "Ja, Nein", "ja,nein", "Ja, Nein."], "topic": "yes and no", "explain": "ja, nein. There is also doch, a third word used to contradict a negative question, for example if someone says you have not done it and you reply doch, meaning yes I have."}, {"id": "g8", "type": "mc", "q": "Which sentence is written correctly in German?", "options": ["Ich habe einen Hund.", "ich habe einen hund.", "Ich habe einen hund.", "ich Habe einen Hund."], "answer": "Ich habe einen Hund.", "topic": "capital letters on German nouns", "explain": "\"Ich habe einen Hund.\" Every noun in German is written with a capital letter wherever it appears in the sentence, so Hund is always Hund. Verbs like habe stay lowercase, and ich is only capitalised when it starts a sentence."}]}}, "history": {"subject": "History", "bands": [{"level": 1, "label": "Chronology and basics", "descriptor": "Tests whether he can order events in time, use BC, AD and centuries, and knows the basic words historians use.", "extract": null, "questions": [{"id": "hi1", "type": "mc", "q": "The year 1485 is in which century?", "options": ["The 13th century", "The 14th century", "The 15th century", "The 16th century"], "answer": "The 15th century", "topic": "chronology: centuries", "explain": "A century is 100 years. The 1st century is the years 1 to 100. The 2nd century is 101 to 200. So the 15th century is the years 1401 to 1500. The year 1485 sits inside that, so it is in the 15th century. The quick rule is to take the first two digits of the year and add one. 1485 starts with 14, and 14 plus 1 is 15."}, {"id": "hi2", "type": "mc", "q": "Put these four periods in the order they happened. Which one came FIRST?", "options": ["The Normans in England", "The Romans in Britain", "The Tudors", "The Victorians"], "answer": "The Romans in Britain", "topic": "chronology: ordering periods", "explain": "The Romans invaded Britain in AD 43 and stayed until about AD 410. The Normans came much later, in 1066. The Tudors ruled from 1485 to 1603. The Victorians were in the 1800s, when Queen Victoria ruled from 1837 to 1901. So the correct order is Romans, then Normans, then Tudors, then Victorians. The Romans came first by around 1000 years."}, {"id": "hi3", "type": "text", "q": "Which is the earlier date, 500 BC or 200 BC? Write the date that came first.", "answer": "500 BC", "accept": ["500 bc", "500bc", "500 b.c.", "500 b.c", "500"], "topic": "chronology: BC and AD", "explain": "BC means Before Christ. BC years count backwards, so the bigger the BC number, the further back in time it is. 500 BC is 500 years before year 1, and 200 BC is only 200 years before year 1. That makes 500 BC the earlier date, by 300 years. AD years work the other way round and count forwards, so AD 500 is later than AD 200."}, {"id": "hi4", "type": "mc", "q": "Which word means the group of people who meet to make the laws of the country?", "options": ["Parliament", "Monarchy", "Empire", "Revolution"], "answer": "Parliament", "topic": "vocabulary: monarchy, parliament, empire, revolution", "explain": "Parliament is the group of people who meet to make and change the laws. A monarchy is a country that is ruled by a king or a queen. An empire is a group of countries or lands that are ruled by one country. A revolution is a big and often sudden change, usually when people overthrow the people in charge."}, {"id": "hi5", "type": "mc", "q": "In history lessons, what is a source?", "options": ["Any piece of evidence from the past that tells us about it, such as a letter, an object or a picture", "A story that a teacher makes up to help you remember a date", "A list of dates at the back of a textbook", "An opinion about the past that a modern writer has invented"], "answer": "Any piece of evidence from the past that tells us about it, such as a letter, an object or a picture", "topic": "sources: what a source is", "explain": "A source is any piece of evidence that has survived from the past and can tell us something about it. Sources can be written, such as letters, diaries and laws. They can also be objects, buildings, paintings, coins or photographs. Historians use sources as their evidence, in the same way a detective uses clues. A modern textbook or a modern historian writing about the past is called an interpretation, not a source from the time."}]}, {"level": 2, "label": "Year 7 knowledge", "descriptor": "Tests core Year 7 content: 1066 and the Normans, the feudal system, Magna Carta, the Black Death, and the Tudors and the Reformation.", "extract": "From the writing of a monk at a priory in Kent, 1349. In the autumn a sickness came off the ships into our port. First the sailors fell, then the townsfolk. Great swellings grew under the arms and at the neck, and most were dead within three days. We buried so many that the churchyard was full, and a new pit was dug in the field beyond the wall. Our fields lie uncut, for the reapers are dead or have run away. The lord still asks for his labour service, but there are few men left to give it.", "questions": [{"id": "hi6", "type": "mc", "q": "Who won the Battle of Hastings in 1066 and became King of England?", "options": ["Harold Godwinson", "William of Normandy", "Harald Hardrada", "Edward the Confessor"], "answer": "William of Normandy", "topic": "Norman Conquest: 1066", "explain": "William of Normandy won the Battle of Hastings on 14 October 1066 and was crowned king on Christmas Day 1066. He is usually called William the Conqueror. Harold Godwinson was the English king who was killed in the battle. Harald Hardrada was the Norwegian king, and he had already been beaten and killed by Harold at Stamford Bridge a few weeks earlier. Edward the Confessor was the king who died in January 1066, which started the whole argument over who should rule."}, {"id": "hi7", "type": "mc", "q": "In the feudal system, who was at the very top?", "options": ["The peasants", "The knights", "The barons", "The king"], "answer": "The king", "topic": "medieval life: feudal system", "explain": "The feudal system worked like a pyramid. The king was at the top and owned all the land. He gave large areas of land to the barons, and in return they promised to be loyal and to provide soldiers. The barons gave smaller pieces of land to the knights, who fought for them. At the bottom were the peasants, who worked the land and gave food and labour to their lord. The peasants were the largest group but had the least power."}, {"id": "hi8", "type": "text", "q": "In which year did King John put his seal on Magna Carta?", "answer": "1215", "accept": ["1215", "in 1215", "ad 1215", "1215 ad"], "topic": "Magna Carta: date and meaning", "explain": "Magna Carta was sealed by King John in 1215 at Runnymede, near the River Thames. Magna Carta is Latin for Great Charter. The barons were angry about heavy taxes and unfair punishments, so they forced John to agree to it. It said that even the king had to follow the law, and that a free man could not be locked up without a proper trial. It is remembered as an early step towards limiting the power of a ruler."}, {"id": "hi9", "type": "mc", "q": "Read the extract. The monk writes that the fields lie uncut because the reapers are dead or have run away. Which effect of the Black Death does this show?", "options": ["There were not enough workers left to bring in the harvest", "The weather had become too wet for farming", "The king had banned farming that year", "The peasants had been given their own land by the lord"], "answer": "There were not enough workers left to bring in the harvest", "topic": "Black Death: effects", "explain": "The Black Death reached England in 1348 and killed roughly a third to a half of the population. The monk is describing what that meant in his village. Reapers are the people who cut the corn at harvest time. If they are dead or have fled, the crops rot in the fields. Because workers were suddenly scarce, the peasants who survived could demand better pay and more freedom, and lords found it hard to force them to do free labour service. Nothing in the source mentions weather, a royal ban, or land being given away."}, {"id": "hi10", "type": "mc", "q": "Why did Henry VIII break away from the Catholic Church in Rome in the 1530s?", "options": ["The Pope would not let him end his marriage to Catherine of Aragon", "He wanted England to join France", "He had never been a Christian", "Parliament ordered him to close every church in England"], "answer": "The Pope would not let him end his marriage to Catherine of Aragon", "topic": "Tudors: the Reformation", "explain": "Henry VIII wanted a son to rule after him, and Catherine of Aragon had not given him one. He wanted his marriage cancelled so he could marry Anne Boleyn, but the Pope refused. So Henry broke with Rome and made himself Head of the Church in England through the Act of Supremacy in 1534. He then closed the monasteries and took their wealth. Henry stayed a Christian all his life. The change was about power, money and the succession, not about giving up religion."}]}, {"level": 3, "label": "Year 8 knowledge", "descriptor": "Tests core Year 8 content: the English Civil War, the transatlantic slave trade and abolition, the British Empire, the Industrial Revolution and the fight for the vote.", "extract": "Evidence given to a committee of Parliament in 1832 by a woman who had worked in a cotton mill in Lancashire. I began at the mill when I was nine years old. We started at five in the morning and worked until seven at night, with forty minutes for dinner and no other rest. The rooms were hot and thick with dust, and the noise was so great that we learned to speak by signs. If a child grew sleepy the overlooker used a strap. My sister's hand was caught in a machine that was never stopped for cleaning.", "questions": [{"id": "hi11", "type": "mc", "q": "Which king was put on trial and executed in 1649 at the end of the English Civil War?", "options": ["James I", "Charles I", "Charles II", "James II"], "answer": "Charles I", "topic": "English Civil War: outcome", "explain": "Charles I was defeated by Parliament's armies in the Civil War, put on trial for treason, and beheaded in London in January 1649. England then had no king for eleven years and was run as a republic, with Oliver Cromwell as Lord Protector for much of that time. James I was Charles I's father and died in 1625. Charles II was his son, who became king when the monarchy was brought back in 1660. James II was Charles II's brother, removed in 1688."}, {"id": "hi12", "type": "mc", "q": "William Wilberforce is best known for leading a long campaign in Parliament to end which thing?", "options": ["The British slave trade", "The taxes on tea", "The power of the monarchy", "The building of railways"], "answer": "The British slave trade", "topic": "transatlantic slave trade: abolition", "explain": "Wilberforce was an MP who put the case against the slave trade to Parliament again and again for about twenty years. He worked alongside many others, including Thomas Clarkson, Olaudah Equiano and Granville Sharp, and thousands of ordinary people who signed petitions and boycotted slave grown sugar. Parliament banned the British slave trade in 1807. Slavery itself in the British colonies was not abolished until the law of 1833, which came into force in 1834. The trade had shipped millions of enslaved Africans across the Atlantic on the terrible journey known as the Middle Passage."}, {"id": "hi13", "type": "text", "q": "Which large country in Asia was ruled by Britain and was often called the jewel in the crown of the British Empire?", "answer": "India", "accept": ["india", "british india", "the indian subcontinent", "indian subcontinent"], "topic": "British Empire: extent", "explain": "India was the largest and richest part of the British Empire and was often called the jewel in the crown. It was controlled first by the East India Company and then directly by the British government from 1858, after the rebellion of 1857. Queen Victoria was made Empress of India in 1876. At its height around 1900 the British Empire ruled roughly a quarter of the world's land and people, which is why people said the sun never set on it. India became independent in 1947."}, {"id": "hi14", "type": "mc", "q": "Read the extract. The woman says her sister's hand was caught in a machine that was never stopped for cleaning. What does this suggest about many mill owners at that time?", "options": ["Keeping the machines running mattered more to them than keeping workers safe", "They did not know how to build machines", "They paid for their workers to go to hospital", "They were forced by law to stop the machines every hour"], "answer": "Keeping the machines running mattered more to them than keeping workers safe", "topic": "Industrial Revolution: social effects", "explain": "Machines only made money while they were turning, so owners often kept them running while small children crawled underneath to clean or to tie broken threads. Accidents and lost fingers were common, and long hours in hot, dusty rooms damaged children's health and their growing bodies. Evidence like this, given to committees of Parliament in the 1830s, helped push through Factory Acts such as the 1833 Act, which limited the hours children could work and brought in inspectors."}, {"id": "hi15", "type": "mc", "q": "Which group campaigned for votes for women by using direct action, such as smashing windows and chaining themselves to railings?", "options": ["The Suffragettes", "The Suffragists", "The Chartists", "The Luddites"], "answer": "The Suffragettes", "topic": "fight for the vote: methods", "explain": "The Suffragettes were led by Emmeline Pankhurst and belonged to the Women's Social and Political Union, set up in 1903. Their motto was deeds not words, and they used militant methods. The Suffragists were the larger, older group led by Millicent Fawcett, and they used peaceful methods such as petitions and meetings. The Chartists were an earlier movement in the 1830s and 1840s who wanted the vote for working men. The Luddites smashed machines in the 1810s because they feared losing their jobs. Some women got the vote in 1918, and women got equal voting rights with men in 1928."}]}, {"level": 4, "label": "Grade 9 skills", "descriptor": "Tests the top skills: working out how reliable a source is, comparing two sources that disagree, giving more than one cause, and judging significance.", "extract": "Source A. From a letter by a reformer who stood in the crowd at St Peter's Field in Manchester, written in August 1819. We came in our Sunday clothes, with our wives and our children, to hear Mr Hunt speak for the right to vote. We carried no weapons. Then the yeomanry rode in with their swords drawn and cut at people who could not get out of the way. I saw a woman knocked down and trampled by a horse.\n\nSource B. From a report by a Manchester magistrate, written a few days after the meeting in August 1819. The crowd was very great and had marched in lines like soldiers, which made us fear a rising. The constables could not reach the speakers, so we sent in the yeomanry to arrest Mr Hunt. The people pressed against them and would not give way, and in the crush some were hurt.", "questions": [{"id": "hi16", "type": "mc", "q": "Source B was written by the magistrate who sent the yeomanry into the crowd. Why should a historian be careful when using Source B?", "options": ["He may want to make his own decision look right", "He was not in Manchester at the time", "He wrote it fifty years later, so he had forgotten", "Magistrates were not allowed to write about meetings"], "answer": "He may want to make his own decision look right", "topic": "source analysis: reliability and purpose", "explain": "Reliability is about who wrote a source and why. The magistrate is not a neutral bystander. He is one of the men who ordered the yeomanry in, and people died, so he has a strong reason to make the crowd sound dangerous and the deaths sound accidental. Notice his wording: some were hurt in the crush, rather than soldiers cut at people. This does not mean the source is useless. It is very useful for showing how the authorities wanted the day to be understood. The other options are wrong because the source says he was there and wrote it days later."}, {"id": "hi17", "type": "mc", "q": "What is the main thing that Source A and Source B disagree about?", "options": ["Whether the crowd was peaceful or a threat", "The year the meeting happened", "The name of the man who was going to speak", "The town where the meeting was held"], "answer": "Whether the crowd was peaceful or a threat", "topic": "source analysis: comparing two sources", "explain": "Both sources agree on the facts you can check easily. Both say it was August 1819, both name Mr Hunt, and both are about Manchester. The real disagreement is about the nature of the crowd. Source A says people came in their Sunday clothes with their families and carried no weapons. Source B says they had marched in lines like soldiers and made the magistrates fear a rising. When two sources agree on the details but disagree on the meaning, that is usually a clue that the writers had different reasons for writing."}, {"id": "hi18", "type": "text", "q": "Both sources were written in 1819 by people who were there at the time. What name do historians give to a source that was made at the time of an event by someone who was there?", "answer": "primary source", "accept": ["primary source", "a primary source", "primary", "primary sources", "primary evidence", "it is a primary source"], "topic": "source analysis: primary and secondary", "explain": "A primary source is made at the time of the event, usually by someone who was there or was involved. Letters, diaries, official reports, photographs and objects from the time are all primary sources. A secondary source is made later by someone who was not there, such as a modern textbook or a documentary. Being primary does not automatically make a source true. Both of these sources are primary, and they still contradict each other, because the people who wrote them wanted different things."}, {"id": "hi19", "type": "mc", "q": "Which answer best explains why people were hurt at St Peter's Field, by giving more than one cause?", "options": ["The crowd was very large and packed tightly, and armed yeomanry on horses were sent into the middle of it", "It was a warm day in August", "Mr Hunt was a very good public speaker", "The magistrate wrote a report a few days later"], "answer": "The crowd was very large and packed tightly, and armed yeomanry on horses were sent into the middle of it", "topic": "causation: more than one cause", "explain": "Strong causation answers link causes together instead of naming just one. Here two causes combine. A huge crowd stood packed into a field with almost no way out, and mounted men with drawn swords were ordered through it to make an arrest. Either one alone might not have been deadly. Put together they caused a crush and injuries, and around eighteen people died. The other options are true details, but none of them explains the injuries. Being a good speaker or writing a report afterwards did not hurt anyone."}, {"id": "hi20", "type": "long", "q": "Some historians say the meeting at St Peter's Field in 1819 was an important event in the fight for the vote. How far do you agree? Use both sources and your own knowledge.", "answer": "I agree that it was important, but mainly because of what happened afterwards rather than on the day itself. The meeting did not win anyone the vote, and Parliament responded by passing laws to restrict public meetings. However, both sources show ordinary working people organising in huge numbers to demand the vote, which shows how strong the demand had become. The killing of unarmed people, described in Source A, shocked many in the country, gave the reform movement a powerful story to tell, and helped build the pressure that led to the Reform Act of 1832 and later campaigns.", "marks": 4, "topic": "significance: judging and justifying", "explain": "A strong answer should include: (1) a clear judgement stated early, not just a description of what happened; (2) at least one reason it WAS significant, for example the size of the demand for the vote, the shock felt across the country, or the way it fed into later reform campaigns such as 1832 and the Chartists; (3) at least one reason to hold back, for example that no one got the vote in 1819 and the government answered with the repressive Six Acts; (4) use of both sources as evidence, ideally noting that they disagree and saying which is more useful and why; (5) a short conclusion that returns to the question and says how far he agrees. Marks come from the judgement and the reasons, not from the number of facts listed."}]}]}, "geography": {"subject": "Geography", "bands": [{"level": 1, "label": "Basics", "descriptor": "Tests the basics: continents and oceans, the UK and its capitals, compass directions, physical and human geography, and reading a key.", "extract": "A simple map of a village has a key. The key says:\na black cross means a church\na blue line means a river\na green block of trees means a wood\na red line means a main road\na blue triangle means a campsite\n\nOn the map, the black cross is just north of the blue line. The red line runs down the east side of the map. The green trees are in the south west corner. The blue triangle is next to the wood.", "questions": [{"id": "ge1", "type": "mc", "q": "Which ocean lies between the west coast of Africa and the east coast of South America?", "options": ["The Pacific Ocean", "The Atlantic Ocean", "The Indian Ocean", "The Arctic Ocean"], "answer": "The Atlantic Ocean", "topic": "continents and oceans: naming oceans", "explain": "The Atlantic Ocean sits between the Americas on one side and Europe and Africa on the other. The Pacific is the biggest ocean and lies between Asia and the Americas. The Indian Ocean is south of Asia, east of Africa and west of Australia. The Arctic Ocean is the small, icy one at the top of the world around the North Pole. The five oceans are the Pacific, Atlantic, Indian, Southern and Arctic."}, {"id": "ge2", "type": "text", "q": "What is the capital city of Scotland?", "answer": "Edinburgh", "accept": ["edinburgh", "edinburgh, scotland", "edinburgh scotland"], "topic": "UK: countries and capitals", "explain": "Edinburgh is the capital of Scotland. The four countries of the United Kingdom and their capitals are England with London, Scotland with Edinburgh, Wales with Cardiff and Northern Ireland with Belfast. Glasgow is the biggest city in Scotland by population, but it is not the capital."}, {"id": "ge3", "type": "mc", "q": "You are facing north. You make a quarter turn to your right. Which direction are you facing now?", "options": ["North", "East", "South", "West"], "answer": "East", "topic": "compass directions: turning", "explain": "Going clockwise, the four main compass points are North, East, South, West. A quarter turn is 90 degrees. Turning right from north takes you to east. Another quarter turn right takes you to south, then to west, then back to north. A useful way to remember the clockwise order is Never Eat Shredded Wheat."}, {"id": "ge4", "type": "mc", "q": "Which one of these is a human geography feature?", "options": ["A mountain", "A river", "A shopping centre", "A beach"], "answer": "A shopping centre", "topic": "physical and human geography: telling them apart", "explain": "Physical geography is about things made by nature, such as mountains, rivers, beaches, weather and volcanoes. Human geography is about things made or done by people, such as towns, roads, shops, factories, farms and population. A shopping centre was built by people, so it is human geography. The other three formed naturally, so they are physical geography."}, {"id": "ge5", "type": "text", "q": "Look at the key in the extract. What does a blue line on this map mean?", "answer": "a river", "accept": ["a river", "river", "rivers", "it means a river"], "topic": "map skills: reading a key", "explain": "A key tells you what each symbol or colour on a map stands for. On this map the key says a blue line means a river. Always check the key before answering a map question, because the same colour can mean different things on different maps. On this map blue is used twice, as a line for a river and as a triangle for a campsite, so the shape matters as well as the colour."}]}, {"level": 2, "label": "Year 7 skills and knowledge", "descriptor": "Tests map skills used in Year 7: four figure and six figure grid references, contour lines, scale and distance, and the water cycle.", "extract": "This is a written description of part of an Ordnance Survey map. There are no pictures, so read it carefully.\n\nThe numbers printed along the bottom of the map are called eastings. They are 24, 25, 26, 27, 28 and 29, going from the left of the map to the right.\nThe numbers printed up the side of the map are called northings. They are 43, 44, 45, 46 and 47, going from the bottom of the map to the top.\n\nA church with a tower stands in the middle of the square whose bottom left corner is the point where easting line 26 crosses northing line 45.\n\nHill Farm stands in the square whose bottom left corner is the point where easting line 28 crosses northing line 45. Inside that square, Hill Farm is exactly halfway across from left to right, and eight tenths of the way up from the bottom.\n\nA railway runs in a straight line from easting line 24 across to easting line 29, all the way along northing line 46.\n\nBeacon Top is a hill. The contour lines around it are drawn very close together on its west side, and much further apart on its east side.\n\nEach grid square on the map is one kilometre across.", "questions": [{"id": "ge6", "type": "text", "q": "What is the four figure grid reference of the square that the church with a tower is in?", "answer": "2645", "accept": ["2645", "26 45", "26,45"], "topic": "grid references: four figure", "explain": "For a four figure grid reference you give the numbers of the two lines that meet at the bottom left corner of the square. You always read the easting first, going across the bottom, then the northing, going up the side. The saying is along the corridor, then up the stairs. The church square has easting 26 along the bottom and northing 45 up the side, so the answer is 2645. Writing 4526 would be the common mistake of giving the numbers the wrong way round."}, {"id": "ge7", "type": "text", "q": "What is the six figure grid reference of Hill Farm?", "answer": "285458", "accept": ["285458", "285 458", "285,458"], "topic": "grid references: six figure", "explain": "A six figure reference splits each grid square into ten parts across and ten parts up, and adds one extra digit to each half. Start with the four figure square, which is 2845. Hill Farm is halfway across the square, and halfway is five tenths, so the easting becomes 285. Hill Farm is eight tenths of the way up, so the northing becomes 458. Put them together, easting first, and you get 285458."}, {"id": "ge8", "type": "mc", "q": "The contour lines on the west side of Beacon Top are very close together. What does that tell you about the land there?", "options": ["The land is very steep on that side", "The land is flat on that side", "The land is covered in trees on that side", "The land is under water on that side"], "answer": "The land is very steep on that side", "topic": "contours: reading relief", "explain": "Contour lines join up all the places that are at the same height above sea level. Each line is a set height apart, often 10 metres. If the lines are close together, the ground climbs that 10 metres in a very short distance, which means it is steep. If the lines are far apart, the ground rises slowly, which means it is a gentle slope or almost flat. So Beacon Top is steep on the west side and gentle on the east side. Contours tell you nothing about trees or water."}, {"id": "ge9", "type": "mc", "q": "The railway runs along northing line 46, from easting line 24 all the way across to easting line 29. Each grid square is one kilometre across. How long is this stretch of railway?", "options": ["3 km", "4 km", "5 km", "9 km"], "answer": "5 km", "topic": "scale: measuring distance", "explain": "Count the number of grid squares the railway crosses, not the number of lines. From line 24 to line 29 the railway crosses the squares 24 to 25, 25 to 26, 26 to 27, 27 to 28 and 28 to 29. That is five squares. Each square is one kilometre across, so the railway is 5 km long. A quicker way is to take 29 and subtract 24, which gives 5. Answering 9 would mean subtracting wrongly, and answering 6 would mean counting the lines instead of the gaps."}, {"id": "ge10", "type": "text", "q": "In the water cycle, what is the name of the process when the sun heats the sea and water turns into water vapour and rises into the air?", "answer": "evaporation", "accept": ["evaporation", "evaporates", "evaporating", "it evaporates", "evaporation from the sea"], "topic": "water cycle: processes", "explain": "Evaporation is when heat from the sun turns liquid water into an invisible gas called water vapour, which rises into the air. The main steps of the water cycle are evaporation from seas and lakes, then condensation as the vapour cools higher up and turns back into tiny droplets that form clouds, then precipitation when the water falls as rain, hail or snow, then surface runoff and rivers carrying the water back to the sea. Transpiration is the word for water vapour given off by plants."}]}, {"level": 3, "label": "Year 8 knowledge", "descriptor": "Tests core Year 8 content: rivers and their landforms, coasts, development and the gap between HICs and LICs, and tectonic hazards.", "extract": "A description of the River Aln, taken from a map and a field trip.\n\nThe river starts high on moorland, 400 metres above sea level. In its upper course the valley is narrow and steep sided, and the water rushes over large rocks.\n\nAt Fell Bridge the river drops 12 metres over a hard band of rock, and there is a deep pool at the bottom where the water lands.\n\nIn its middle course the river swings from side to side across a wide, flat valley floor. On the outside of each bend the bank is steep and the water is deep and fast. On the inside of each bend there is a gentle slope of sand and shingle, and the water there is shallow and slow.\n\nNear the sea the river spreads out and drops the load it has been carrying.", "questions": [{"id": "ge11", "type": "mc", "q": "Read the extract. At Fell Bridge the river drops 12 metres over a hard band of rock into a deep pool. What is this landform called?", "options": ["A meander", "A waterfall", "An ox bow lake", "An estuary"], "answer": "A waterfall", "topic": "river landforms: waterfalls", "explain": "A waterfall is where a river drops down a steep step of rock. It usually forms where a band of hard rock sits above softer rock. The soft rock is worn away faster, leaving the hard rock standing out, and the river falls over the edge. The deep pool at the bottom is called a plunge pool, and it is carved out by the force of the falling water and the stones it carries. A meander is a bend, an ox bow lake is a curved lake left behind when a meander is cut off, and an estuary is where a river meets the sea."}, {"id": "ge12", "type": "text", "q": "Read the extract. On the inside of each bend there is a gentle slope of sand and shingle where the water is shallow and slow. What is the name of the process that drops sand and shingle there?", "answer": "deposition", "accept": ["deposition", "depositing", "deposits", "it deposits it", "deposition of sand"], "topic": "river processes: deposition", "explain": "Deposition is when a river drops the material it has been carrying. A river can only carry material while it has enough energy. On the inside of a bend the water is shallow and slow, so the river loses energy and drops its sand and shingle, building a gentle slope called a slip off slope. On the outside of the bend the water is deep and fast, so it has lots of energy and wears the bank away instead. That is erosion, which is the opposite process, and it makes a steep river cliff."}, {"id": "ge13", "type": "mc", "q": "Waves keep hitting the bottom of a cliff and wear a hollow into it. What is that hollow called?", "options": ["A wave cut notch", "A spit", "A sand dune", "A groyne"], "answer": "A wave cut notch", "topic": "coasts: erosion landforms", "explain": "A wave cut notch is the dent that waves cut into the base of a cliff, because that is where the waves hit hardest. Over many years the notch gets deeper, until the rock hanging above it has nothing to hold it up and it collapses. The cliff then stands further back than before, and a flat area of rock called a wave cut platform is left behind at the bottom. A spit is a long finger of sand built by deposition, a sand dune is a hill of blown sand, and a groyne is a wooden or rock fence built by people to hold sand on a beach."}, {"id": "ge14", "type": "mc", "q": "Which of these is most likely to be true of a low income country (LIC) compared with a high income country (HIC)?", "options": ["A larger share of people work in farming", "Most people work in offices", "Almost every family owns two cars", "People live longer on average"], "answer": "A larger share of people work in farming", "topic": "development: HICs and LICs", "explain": "A high income country is a richer country such as the UK, Japan or the USA. A low income country is a poorer country, and many are in sub Saharan Africa. In LICs a much larger share of people work in farming, often growing food mainly for their own family. As a country develops, more people move into factory work and then into office and service jobs. HICs also tend to have higher life expectancy, better healthcare and schooling, and far more cars per family, so the other three options describe HICs."}, {"id": "ge15", "type": "mc", "q": "Earthquakes and volcanoes mostly happen in the same narrow bands around the world. Why?", "options": ["They happen where two tectonic plates meet", "They happen where the weather is hottest", "They happen where the most people live", "They happen only on islands"], "answer": "They happen where two tectonic plates meet", "topic": "tectonic hazards: plate boundaries", "explain": "The Earth's crust is cracked into large slabs called tectonic plates, which move slowly on the hot rock beneath. Nearly all earthquakes and volcanoes happen at the edges where plates meet. Where plates push together, one can be forced under the other, which melts and feeds volcanoes. Where plates slide past each other they can lock and then jolt free, which causes earthquakes. The best known example is the Ring of Fire around the Pacific Ocean. Weather and population have nothing to do with it, and many of these places, such as Chile and Japan, include mainland as well as islands."}]}, {"level": 4, "label": "Grade 9 skills", "descriptor": "Tests the top skills: pulling information out of data, explaining a process in ordered steps, weighing up impacts on people and the environment, and using knowledge in a new place.", "extract": "Table 1. Two towns in the same country, ten years apart.\n\nTOWN A, on the coast\nPopulation in 2015: 42,000\nPopulation in 2025: 71,000\nShare of people aged under 20 in 2025: 38 per cent\nMain jobs: tourism /* ---------- helpers ---------- */
function norm(s){
  return String(s==null?'':s).toLowerCase().trim()
    .replace(/[‘’]/g,"'").replace(/[“”]/g,'"')
    .replace(/\s+/g,' ').replace(/[.!;]+$/,'').trim();
}
function squash(s){ return norm(s).replace(/\s+/g,''); }
function isRight(q, given){
  if(q.type==='mc') return given === q.answer;
  if(q.type==='text'){
    const acc = (q.accept||[q.answer]).map(norm);
    const g = norm(given);
    if(acc.includes(g)) return true;
    const gs = squash(given);
    return acc.map(a=>a.replace(/\s+/g,'')).includes(gs);
  }
  return null;
}
function numeric(q){
  const a = String(q.answer||'');
  return q.type==='text' && /^-?[\d.,\/\s]+$/.test(a);
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* subject helpers */
const SUBJ = {maths:'Maths',english:'English',science:'Science',german:'German',history:'History',geography:'Geography'};
function bandsOf(id){ return (id==='german_guardian') ? [D.german.guardianStart] : (D[id]?D[id].bands:[]); }
function allQs(id){ let o=[]; bandsOf(id).forEach(b=>o=o.concat(b.questions.map(q=>({...q,_band:b.level||0,_bl:b.label,_ex:b.extract||null})))); return o; }

function bandScore(id, lvlIdx){
  const b = bandsOf(id)[lvlIdx]; if(!b) return null;
  let c=0,n=0;
  b.questions.forEach(q=>{ const a=S.ans[q.id]; if(a!==undefined){ n++; if(isRight(q,a)===true) c++; } });
  return {c,n,total:b.questions.length};
}
/* how far he reached: last band with any answers */
function reached(id){
  const bs = bandsOf(id); let last=-1;
  bs.forEach((b,i)=>{ if(b.questions.some(q=>S.ans[q.id]!==undefined)) last=i; });
  return last;
}
function ceiling(id){
  const bs=bandsOf(id); let ceil=null;
  for(let i=0;i<bs.length;i++){
    const s=bandScore(id,i);
    if(!s || s.n===0) break;
    if(s.c>=3) ceil=bs[i]; else { break; }
  }
  return ceil;
}
function subjDone(id){ return !!S.done[id]; }

function overallPct(){
  let done=0,tot=0;
  DAYS.forEach(d=>d.blocks.forEach(b=>{ if(b.optional) return; tot++; if(S.done[b.id]) done++; }));
  return tot? Math.round(done/tot*100):0;
}
function dayDone(d){ return d.blocks.filter(b=>!b.optional).every(b=>S.done[b.id]); }

    wrong.forEach(q=>{
      h+=`<div class="rev"><div class="qt">${esc(q.q)}</div>
        <div class="ans">You put: <b class="no">${esc(S.ans[q.id]||'(skipped)')}</b></div>
        <div class="ans">Answer: <b class="ok">${esc(q.answer)}</b></div>
        <div class="exp">${esc(q.explain)}</div>
        <div class="faint" style="margin-top:8px">${esc(q.topic)}</div></div>`;
    });
    h+=`</div>`;
  }
  h+=`<button class="btn" id="markdone">Done, we have been through them</button>`;
  return h;
}

/* ---------- friday writing ---------- */
function vWriting(){
  document.getElementById('htitle').textContent='Extended writing';
  const tasks=D.english.writing||[];
  let h=`<h1>Extended writing</h1><p class="muted small" style="margin:6px 0 0">Two pieces, about 20 minutes each. Plan for two minutes first.</p>`;
  tasks.forEach(t=>{
    h+=`<div class="card"><div class="top"><h3>${esc(t.title)}</h3><span class="pill">${t.minutes} min</span></div>
      <p style="margin:12px 0 0">${esc(t.prompt)}</p>
      <textarea data-write="${t.id}" placeholder="Start writing...">${esc(S.writing[t.id]||'')}</textarea>
      <div class="hr"></div>
      <h3 style="font-size:14px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim)">Mark it against this, with Keitan</h3>
      <ul class="small muted">${t.checklist.map(c=>`<li>${esc(c)}</li>`).join('')}</ul></div>`;
  });
  h+=`<button class="btn" id="markdone">Both written</button>`;
  return h;
}

/* ---------- friday report ---------- */
function vReport(){
  document.getElementById('htitle').textContent='The report';
  const ids=['maths','english','science','german','history','geography'];
  let rows='';
  ids.forEach(id=>{
    const c=ceiling(id), qs=allQs(id).filter(q=>S.ans[q.id]!==undefined && q.type!=='long');
    const r=qs.filter(q=>isRight(q,S.ans[q.id])===true).length;
    rows+=`<tr><td>${SUBJ[id]}</td><td>${c?esc(c.label):'<span class="faint">not done</span>'}</td><td class="r">${qs.length?r+'/'+qs.length:'-'}</td></tr>`;
  });
  let h=`<h1>Placement report</h1>
    <p class="muted small" style="margin:6px 0 0">Go through this with Keitan. The next three weeks get built from it.</p>
    <div class="card"><table><thead><tr><th>Subject</th><th>Working level</th><th class="r">Score</th></tr></thead><tbody>${rows}</tbody></table></div>`;

  ids.forEach(id=>{
    const qs=allQs(id).filter(q=>S.ans[q.id]!==undefined && q.type!=='long');
    if(!qs.length) return;
    const ok=new Set(), no=new Set();
    qs.forEach(q=>{ (isRight(q,S.ans[q.id])===true?ok:no).add(q.topic); });
    no.forEach(t=>ok.delete(t));
    h+=`<div class="card"><h3>${SUBJ[id]}</h3>
      ${no.size?`<div class="small muted" style="margin-top:10px">Gaps</div><div class="topics">${[...no].map(t=>`<span class="tp no">${esc(t)}</span>`).join('')}</div>`:''}
      ${ok.size?`<div class="small muted" style="margin-top:12px">Solid</div><div class="topics">${[...ok].map(t=>`<span class="tp ok">${esc(t)}</span>`).join('')}</div>`:''}
    </div>`;
  });

  h+=`<div class="card"><h3>For the Sunday review</h3>
    <p class="muted small">Copy this and paste it into the Claude project. That is how week 2 gets built.</p>
    <pre class="sum" id="sum">${esc(summary())}</pre>
    <button class="btn" id="copy">Copy summary</button></div>`;
  return h;
}

function summary(){
  const ids=['maths','english','science','german','history','geography'];
  let o='SURAJ OS - WEEK 1 PLACEMENT RESULTS\n';
  o+='Week of 10 to 14 August 2026\n\n';
  ids.forEach(id=>{
    const qs=allQs(id).filter(q=>S.ans[q.id]!==undefined && q.type!=='long');
    if(!qs.length){ o+=SUBJ[id].toUpperCase()+': not attempted\n\n'; return; }
    const c=ceiling(id);
    const r=qs.filter(q=>isRight(q,S.ans[q.id])===true).length;
    const ok=new Set(), no=new Set();
    qs.forEach(q=>{ (isRight(q,S.ans[q.id])===true?ok:no).add(q.topic); });
    no.forEach(t=>ok.delete(t));
    o+=SUBJ[id].toUpperCase()+'\n';
    o+='  Working level: '+(c?c.label:'below level 1')+'\n';
    o+='  Score: '+r+'/'+qs.length+'\n';
    o+='  Gaps: '+([...no].join('; ')||'none')+'\n';
    o+='  Solid: '+([...ok].join('; ')||'none')+'\n\n';
  });
  const gq=allQs('german_guardian').filter(q=>S.ans[q.id]!==undefined);
  if(gq.length){
    const r=gq.filter(q=>isRight(q,S.ans[q.id])===true).length;
    o+='KEITAN GERMAN SELF-CHECK: '+r+'/'+gq.length+'\n\n';
  }
  o+='READING\n  Book: '+(S.reading.book||'-')+'\n';
  o+='  Pages: '+DAYS.map(d=>d.label.slice(0,3)+' '+((S.reading[d.key]||{}).pages||'0')).join(', ')+'\n';
  if(S.reading.notes) o+='  His summary: '+S.reading.notes+'\n';
  o+='\nWRITING\n';
  (D.english.writing||[]).forEach(t=>{
    const w=(S.writing[t.id]||'').trim();
    o+='  '+t.title+': '+(w?w.split(/\s+/).length+' words':'not done')+'\n';
    if(w) o+='  ---\n'+w+'\n  ---\n';
  });
  return o;
}

/* ---------- events ---------- */
function wire(){
  document.querySelectorAll('[data-go]').forEach(el=>{
    el.onclick=()=>go(JSON.parse(el.getAttribute('data-go')));
  });
  document.querySelectorAll('[data-pick]').forEach(el=>{
    el.onclick=()=>{
      const bs=bandsOf(view.id), q=bs[view.bi].questions[view.qi];
      S.ans[q.id]=el.getAttribute('data-pick'); save();
      setTimeout(advance,140);
    };
  });
  const nx=document.getElementById('next');
  if(nx) nx.onclick=()=>{
    const bs=bandsOf(view.id), q=bs[view.bi].questions[view.qi];
    const ta=document.getElementById('ta');
    if(ta){ if(!ta.value.trim() && q.type!=='long'){ ta.focus(); return; } S.ans[q.id]=ta.value; save(); }
    else if(S.ans[q.id]===undefined){ return; }
    advance();
  };
  const sk=document.getElementById('skip');
  if(sk) sk.onclick=()=>{
    const q=bandsOf(view.id)[view.bi].questions[view.qi];
    S.ans[q.id]=''; save(); advance();
  };
  const fin=document.getElementById('fin');
  if(fin) fin.onclick=()=>{ S.done[view.id]=true; save(); go({name:'result',day:view.day,id:view.id}); };
  const md=document.getElementById('markdone');
  if(md) md.onclick=()=>{
    const d=DAYS.find(x=>x.key===view.day);
    const b=d.blocks.find(x=>(x.kind==='review'&&view.name==='review')||(x.kind==='writing'&&view.name==='writing'));
    if(b) S.done[b.id]=true;
    save(); go({name:'day',day:view.day});
  };
  const cp=document.getElementById('copy');
  if(cp) cp.onclick=()=>{
    const t=summary();
    if(navigator.clipboard) navigator.clipboard.writeText(t).then(()=>{cp.textContent='Copied';setTimeout(()=>cp.textContent='Copy summary',1600);});
    else { const r=document.createRange(); r.selectNode(document.getElementById('sum')); getSelection().removeAllRanges(); getSelection().addRange(r); }
    const d=DAYS.find(x=>x.key===view.day); const b=d.blocks.find(x=>x.kind==='report');
    if(b){ S.done[b.id]=true; save(); }
  };
  document.querySelectorAll('[data-read]').forEach(el=>{
    el.onchange=el.oninput=()=>{
      const k=el.getAttribute('data-read'), f=el.getAttribute('data-f');
      if(f==='book') S.reading.book=el.value;
      else if(f==='notes') S.reading.notes=el.value;
      else { S.reading[k]=S.reading[k]||{}; S.reading[k].pages=el.value; }
      save();
    };
  });
  document.querySelectorAll('[data-write]').forEach(el=>{
    el.oninput=()=>{ S.writing[el.getAttribute('data-write')]=el.value; save(); };
  });
}

function advance(){
  const bs=bandsOf(view.id), b=bs[view.bi];
  if(view.qi+1<b.questions.length) go({...view, qi:view.qi+1});
  else go({name:'bandres', day:view.day, id:view.id, bi:view.bi});
}

render();
</script>
