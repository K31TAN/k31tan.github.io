 is no anomaly here. All three readings are within one of each other, so every one of them counts: 30 + 32 + 31 = 93, and 93 divided by 3 = 31 cm. This is the trap that follows a run of anomaly questions, where you start striking out the highest or lowest reading out of habit. An anomaly has to be genuinely far from the rest, not just slightly different.", "topic": "working scientifically: mean when there is no anomaly"}], "e9-sentence-control": [{"id": "e9-sentence-control:r-e9-1", "level": "easy", "type": "mc", "q": "Which of these is a simple sentence?", "options": ["The floodlights failed.", "The floodlights failed, and the crowd went quiet.", "When the floodlights failed, the crowd went quiet.", "The floodlights failed, so the referee stopped the game."], "answer": "The floodlights failed.", "hint": "A simple sentence is one clause. Rule out anything with a joining word like and or so, and anything starting with when.", "explain": "The answer is The floodlights failed. It is one clause, one subject and one verb, with nothing joined on. The second and fourth options are compound, because two halves that could each stand alone are joined by and and by so. The third is complex, because When the floodlights failed cannot stand on its own. Length is not the test. A simple sentence can be long, and a short sentence can still be compound.", "topic": "sentences: identifying a simple sentence"}, {"id": "e9-sentence-control:r-e9-2", "level": "easy", "type": "mc", "q": "Which of these is a compound sentence?", "options": ["The tide turned, and the sandbank disappeared.", "The tide turned.", "Because the tide turned, the sandbank disappeared.", "Although the tide turned early, we stayed on the rocks."], "answer": "The tide turned, and the sandbank disappeared.", "hint": "Compound means two halves that could each be a sentence on their own, joined by and, but, so or or.", "explain": "The answer is The tide turned, and the sandbank disappeared. Split it at the and and both halves stand up alone: The tide turned. The sandbank disappeared. That is what makes it compound. The second option is one clause, so it is simple. The third and fourth start with because and although, so their first half cannot stand alone, which makes them complex.", "topic": "sentences: identifying a compound sentence"}, {"id": "e9-sentence-control:r-e9-3", "level": "easy", "type": "mc", "q": "Which of these is a complex sentence?", "options": ["Although the rope was frayed, we used it anyway.", "The rope was frayed.", "The rope was frayed, so we used the spare.", "The rope was frayed and the spare was missing."], "answer": "Although the rope was frayed, we used it anyway.", "hint": "Look for a half that hangs in the air when you say it on its own.", "explain": "The answer is Although the rope was frayed, we used it anyway. Say Although the rope was frayed on its own and it hangs, waiting, so it is a subordinate clause, and a main clause plus a subordinate clause is complex. The third and fourth are compound, joined by so and by and. The second is simple. The word at the front is what decides it, not how long the sentence is.", "topic": "sentences: identifying a complex sentence"}, {"id": "e9-sentence-control:r-e9-4", "level": "easy", "type": "mc", "q": "One of these groups of words leaves you hanging, waiting for the rest of it. Which one?", "options": ["After the whistle went", "The whistle went", "We walked off the pitch", "The coach said nothing"], "answer": "After the whistle went", "hint": "Say each one out loud. One of them leaves you waiting for the rest.", "explain": "The answer is After the whistle went. Say it on its own and it hangs in the air, because after makes you wait to hear what happened next. That hanging feeling is how you spot a subordinate clause. The other three each have a subject and a verb and stop cleanly, so each one is already a sentence.", "topic": "sentences: spotting a subordinate clause"}, {"id": "e9-sentence-control:r-e9-5", "level": "medium", "type": "text", "q": "Write the subordinate clause in this sentence: Because the ice was thin, we walked round the edge of the lake.", "answer": "Because the ice was thin", "accept": ["Because the ice was thin", "because the ice was thin", "Because the ice was thin,", "because the ice was thin,"], "hint": "It is the half that cannot stand on its own. Include the word at the front that makes it hang.", "explain": "The answer is Because the ice was thin. That half cannot stand alone, so it is the subordinate clause, and we walked round the edge of the lake is the main clause because it works as a sentence by itself. The usual slip is to drop the word because and write the ice was thin, but that half then stands on its own and stops being subordinate. The word that makes it hang belongs inside the clause.", "topic": "sentences: naming the subordinate clause"}, {"id": "e9-sentence-control:r-e9-6", "level": "medium", "type": "text", "q": "Rewrite this sentence so that it starts with the subordinate clause instead of the subject: We turned back because the mist came down.", "answer": "Because the mist came down, we turned back.", "accept": ["Because the mist came down, we turned back.", "Because the mist came down, we turned back", "because the mist came down, we turned back.", "Because the mist came down we turned back."], "hint": "Move the because half to the front, and remember the piece of punctuation that has to go in after it.", "explain": "The answer is Because the mist came down, we turned back. The two halves swap places and a comma goes in where the front half ends. No words are added and none are taken away. The most common slip is dropping the comma, and the comma is what tells the reader the opener has finished. Doing this to one sentence in a paragraph is the fastest way to stop every sentence starting with the subject.", "topic": "sentences: moving the subordinate clause to the front"}, {"id": "e9-sentence-control:r-e9-7", "level": "medium", "type": "text", "q": "Name the type of this sentence, using one word: simple, compound or complex. The engine coughed, but it never started.", "answer": "compound", "accept": ["compound", "Compound", "compound sentence", "a compound sentence"], "hint": "Split it at the joining word. Can both halves stand on their own?", "explain": "The answer is compound. Split it at but and you get The engine coughed and it never started, and both halves work as sentences on their own. It is not complex, because neither half hangs in the air waiting. Use this test: and, but, so and or join two equals, which gives compound, while when, because, although and after create a half that cannot stand alone, which gives complex.", "topic": "sentences: naming a sentence type"}, {"id": "e9-sentence-control:r-e9-8", "level": "stretch", "type": "mc", "q": "A paragraph runs three long sentences about searching a moor at night, the torch beam, the wet bracken, the shouting. Then it ends with three words: He was not there. Why does that short sentence hit so hard?", "options": ["Three long sentences come before it, so the sudden stop lands on the one fact that matters.", "Short sentences are always stronger than long ones.", "It uses simple words, and simple words are always more powerful.", "It comes at the end of a paragraph, and endings are always strong."], "answer": "Three long sentences come before it, so the sudden stop lands on the one fact that matters.", "hint": "Ask what the sentences around it are doing. A short sentence is only short compared with something else.", "explain": "The answer is that the length suddenly changes. Three long sentences build a rhythm, and the short one breaks it, so the reader stops dead on those three words. That is why you decide in the plan where the short sentence goes. Short sentences are not automatically stronger. Write a whole paragraph of them and the effect disappears, because there is nothing left for the short one to stand out against.", "topic": "sentences: why a short sentence lands"}], "e10-inference": [{"id": "e10-inference:r-e10-1", "level": "easy", "type": "mc", "q": "Read this passage. \"Mum put her coat on at half past four. She checked the back door twice, then went back and checked it again. 'I will not be long,' she said. She took the letter off the table and folded it into her pocket before I could read the front of it. The car did not start first time. When it did start, she sat in it on the drive for a while before she moved off.\" What time did Mum put her coat on?", "options": ["Half past four", "Four o'clock", "Half past five", "Five o'clock"], "answer": "Half past four", "hint": "This one is printed in the passage. Find it and copy it.", "explain": "The answer is half past four. It is written in the first sentence, so this is retrieval and not inference: you are finding something that is actually on the page. Retrieval questions are free marks, so read the opening line again rather than working anything out.", "topic": "inference: retrieval from the text"}, {"id": "e10-inference:r-e10-2", "level": "easy", "type": "mc", "q": "Read this passage. \"Mum put her coat on at half past four. She checked the back door twice, then went back and checked it again. 'I will not be long,' she said. She took the letter off the table and folded it into her pocket before I could read the front of it. The car did not start first time. When it did start, she sat in it on the drive for a while before she moved off.\" Which of these questions needs inference rather than retrieval?", "options": ["What does Mum's behaviour before she leaves suggest about how she is feeling?", "What time did Mum put her coat on?", "Where did Mum put the letter?", "What did Mum say before she left?"], "answer": "What does Mum's behaviour before she leaves suggest about how she is feeling?", "hint": "Three of these can be answered by pointing at a line. One cannot.", "explain": "The answer is the question about how she is feeling. Nowhere does the passage say she is worried, so you have to work it out from the checking, the folded letter and the wait on the drive. The other three are printed on the page: half past four, into her pocket, and I will not be long. Retrieval is finding, inference is working out. Mixing them up costs marks, because you end up guessing when the answer was sitting there to copy.", "topic": "inference: retrieval versus inference"}, {"id": "e10-inference:r-e10-3", "level": "easy", "type": "text", "q": "In a PEE paragraph, one of the three parts is the short quotation from the text. Which of the three is it? Write the word.", "answer": "evidence", "accept": ["evidence", "Evidence", "the evidence", "evidence.", "E"], "hint": "Point, evidence, explain. Which of the three is the proof?", "explain": "The answer is evidence. Point is your claim in one sentence, evidence is the short quotation that proves it, and explain is where you say what those exact words suggest and what they do to the reader. Keep the quotation short, a few words rather than half a paragraph, because a long quotation eats your time and proves less. Most of the marks sit in explain, and that is the part people rush.", "topic": "inference: the point evidence explain structure"}, {"id": "e10-inference:r-e10-4", "level": "easy", "type": "text", "q": "A narrator writes: He almost said thank you. Write the single word that tells you he did not actually say it.", "answer": "almost", "accept": ["almost", "Almost", "\"almost\"", "the word almost"], "hint": "One word in that sentence cancels the rest of it.", "explain": "The answer is almost. Take that word out and he said thank you, so the one word carries the whole meaning. That is what zooming in means. Instead of writing this shows he was upset, you point at one word and say what it does. Writers choose small words like almost, nearly and tried on purpose, and they are usually exactly where the marks are.", "topic": "inference: zooming in on one word"}, {"id": "e10-inference:r-e10-5", "level": "medium", "type": "mc", "q": "Read this passage. \"Mum put her coat on at half past four. She checked the back door twice, then went back and checked it again. 'I will not be long,' she said. She took the letter off the table and folded it into her pocket before I could read the front of it. The car did not start first time. When it did start, she sat in it on the drive for a while before she moved off.\" What does the detail about the back door suggest?", "options": ["She is anxious, and checking it three times shows her mind is not really on the door.", "She is careful about security and always checks doors.", "The door is broken and will not shut properly.", "She is in a hurry and wants to get away quickly."], "answer": "She is anxious, and checking it three times shows her mind is not really on the door.", "hint": "Ask why the writer bothered to tell you she checked it three times rather than once.", "explain": "The answer is that she is anxious. Checking once is normal and a writer would not mention it. Checking twice and then going back again shows somebody whose mind is somewhere else. A broken door is a guess with nothing under it, because the passage never says the door will not shut. Being in a hurry does not fit either, since she then sits in the car on the drive. An inference has evidence under it, a guess does not.", "topic": "inference: inferring from a small action"}, {"id": "e10-inference:r-e10-6", "level": "medium", "type": "mc", "q": "Read this passage. \"Mum put her coat on at half past four. She checked the back door twice, then went back and checked it again. 'I will not be long,' she said. She took the letter off the table and folded it into her pocket before I could read the front of it. The car did not start first time. When it did start, she sat in it on the drive for a while before she moved off.\" You want to prove the point that Mum does not want to be asked where she is going. Which quotation is the sharpest evidence?", "options": ["folded it into her pocket before I could read the front of it", "Mum put her coat on at half past four", "The car did not start first time", "she checked the back door twice"], "answer": "folded it into her pocket before I could read the front of it", "hint": "Which quotation is about keeping something from the narrator, and nothing else?", "explain": "The answer is folded it into her pocket before I could read the front of it. The words before I could read show she is deliberately keeping the letter from him, which proves that exact point. The coat and the car are just events and prove nothing about hiding. Checking the door proves she is anxious, which is a different point and would leave the examiner joining the dots for you. Pick the quotation that only fits your point, and keep it short.", "topic": "inference: choosing the sharpest evidence"}, {"id": "e10-inference:r-e10-7", "level": "medium", "type": "mc", "q": "Four students answer the same inference question about that passage. Which answer uses point, evidence and explain properly?", "options": ["Mum is hiding something. The writer says she folded the letter into her pocket 'before I could read the front of it'. The words before I could read show she is watching her son as she does it, which makes the reader feel he is being kept out of something.", "Mum is hiding something because she is worried about the letter and does not want him to know, which is obvious from the whole passage.", "The writer says she folded the letter into her pocket before he could read the front of it, and she also checked the back door twice and then sat in the car.", "Mum is hiding something. This is shown all the way through the passage and it makes the reader feel sorry for her."], "answer": "Mum is hiding something. The writer says she folded the letter into her pocket 'before I could read the front of it'. The words before I could read show she is watching her son as she does it, which makes the reader feel he is being kept out of something.", "hint": "Look for three things in order: a claim, a short quotation, then what those exact words do.", "explain": "The answer is the first one. It makes a point in one sentence, proves it with a short quotation, then zooms in on before I could read and says what that does to the reader. The second option has a point and no quotation. The third is all evidence and no point or explanation, so it is retelling the passage. The fourth has a point and a vague claim about the whole passage, which proves nothing because it points at nothing.", "topic": "inference: recognising a full PEE answer"}, {"id": "e10-inference:r-e10-8", "level": "stretch", "type": "mc", "q": "All four of these explain the same evidence, that Mum 'sat in it on the drive for a while before she moved off'. Which explanation is the strongest?", "options": ["Sitting still on the drive suggests she is not ready to face wherever she is going, and the delay makes the reader feel the journey matters more than she has admitted.", "This shows that she is sad.", "This quotation is effective and makes the reader want to read on.", "It shows that she sat in the car for a while, which is unusual behaviour for her."], "answer": "Sitting still on the drive suggests she is not ready to face wherever she is going, and the delay makes the reader feel the journey matters more than she has admitted.", "hint": "A strong explanation points at particular words and says what they do to the reader. Ask which one would still make sense under a completely different quotation.", "explain": "The answer is the first one. It picks out the delay, says what it suggests, and then says what it does to the reader. The second is a label with no working under it. The third could be written under any quotation in any text, which is the test of an empty sentence. The fourth just says the quotation again in different words, which is retelling and not explaining. If your sentence would fit any quotation at all, it is not an explanation yet.", "topic": "inference: writing a strong explanation"}], "e11-persuasive": [{"id": "e11-persuasive:r-e11-1", "level": "easy", "type": "mc", "q": "A speaker is arguing against closing a library. Which sentence uses direct address?", "options": ["You have all queued outside that library on a Saturday morning.", "The library is used by a lot of people in this town.", "It would be a shame if the library closed.", "Libraries have been part of this town for a hundred years."], "answer": "You have all queued outside that library on a Saturday morning.", "hint": "Direct address talks straight at the audience. Look for one particular word.", "explain": "The answer is You have all queued outside that library on a Saturday morning. The word you talks straight at the audience and puts them inside the argument. The other three are about the library rather than about the listener, so nobody in the room is being asked to do anything. Direct address is the cheapest device to add: swap people or everyone for you and the sentence changes job.", "topic": "persuasion: identifying direct address"}, {"id": "e11-persuasive:r-e11-2", "level": "easy", "type": "mc", "q": "Which of these is a rhetorical question?", "options": ["Are we really going to tell them that the sums did not add up?", "What time does the library close on a Saturday?", "The library closes at four on a Saturday.", "Please write to the council before the tenth."], "answer": "Are we really going to tell them that the sums did not add up?", "hint": "A rhetorical question is one the speaker already knows the audience will answer in their head.", "explain": "The answer is Are we really going to tell them that the sums did not add up? It is a question the speaker does not want answered out loud, because every listener supplies the same answer themselves, and an idea you supply yourself is harder to argue with. The second option is a real question with a real answer, so it persuades nobody. The third is a statement and the fourth is a command.", "topic": "persuasion: identifying a rhetorical question"}, {"id": "e11-persuasive:r-e11-3", "level": "easy", "type": "text", "q": "A speaker says: Close this library and you close the reading group, you close the homework club, and you close the only quiet room some of these children get all week. What is that device called? Write it in three words.", "answer": "rule of three", "accept": ["rule of three", "the rule of three", "Rule of three", "a rule of three"], "hint": "Count how many things are being listed.", "explain": "The answer is the rule of three. Three items have a rhythm that two does not, and four starts to feel like a list rather than a punch. Look at the order as well. The three items get heavier and finish on the only quiet room some of these children get all week, so the strongest one lands last. Three weak items in any old order is still a rule of three, but it does far less work.", "topic": "persuasion: naming the rule of three"}, {"id": "e11-persuasive:r-e11-4", "level": "easy", "type": "mc", "q": "A speaker says: I was nine, I could not read a page without stopping, and a woman called Mrs Doyle sat with me every Thursday for a year. What is that move called?", "options": ["An anecdote", "A rhetorical question", "A counter argument", "Direct address"], "answer": "An anecdote", "hint": "It is one short story about one named person, used to prove a bigger point.", "explain": "The answer is an anecdote. It is a short story about one real person, and it gives a general claim a face, which a statistic on its own cannot do. It is not a rhetorical question, because nothing is asked. It is not a counter argument, because the other side is never mentioned. Keep an anecdote short and specific, because the details, nine years old, Mrs Doyle, every Thursday, are what make it feel true.", "topic": "persuasion: what an anecdote is"}, {"id": "e11-persuasive:r-e11-5", "level": "medium", "type": "text", "q": "A speaker says: Now, I understand why the council wants to close it. The building is old, the heating bill is huge, and there is less money every year. That is all true. Then the speaker answers those points. What is the name for that move of admitting the other side's case first? Write the one word.", "answer": "concession", "accept": ["concession", "a concession", "Concession", "conceding", "concede"], "hint": "You are conceding a point. The name for the move comes from that verb.", "explain": "The answer is a concession. Admitting the other side's strongest point first shows you have understood the argument, so the audience trusts you when you answer it, and it stops them thinking of the objection themselves while you are still talking. The mistake is to concede and then stop, or to concede something so small that nobody was arguing about it in the first place.", "topic": "persuasion: naming the concession"}, {"id": "e11-persuasive:r-e11-6", "level": "medium", "type": "text", "q": "A speaker admits the other side's case: The building is old, the heating bill is huge, and there is less money every year. That is all true. The very next sentence is: But a library is not a luxury. Write the single word that turns the argument back to the speaker's own case.", "answer": "But", "accept": ["But", "but", "\"But\"", "the word but"], "hint": "It is the first word of the sentence.", "explain": "The answer is But. One word marks the turn, and everything after it belongs to the speaker again. However and Yet do the same job. Without a turn word the concession just sits there and the audience is left agreeing with the other side, which is the opposite of what you wanted. Concede, turn, then answer, in that order.", "topic": "persuasion: the turn word after a concession"}, {"id": "e11-persuasive:r-e11-7", "level": "medium", "type": "mc", "q": "You are arguing that the school bus should be kept. Which of these is the best rule of three?", "options": ["It gets them to school on time, it gets them there dry, and for some of them it is the only way they get there at all.", "It is useful, it is helpful, and it is good.", "It is cheap and it is reliable.", "It is useful, it is convenient, it is handy, and it is quite cheap."], "answer": "It gets them to school on time, it gets them there dry, and for some of them it is the only way they get there at all.", "hint": "Three items, and the last one should be the heaviest.", "explain": "The answer is the first option. It has exactly three items and they get bigger, finishing on the one that actually matters, so the audience is left holding the strongest idea. The second has three items that all mean roughly the same thing, so it goes nowhere. The third has only two, so there is no pattern. The fourth has four, and the extra item is the weakest, so the build collapses at the end.", "topic": "persuasion: building a rule of three that escalates"}, {"id": "e11-persuasive:r-e11-8", "level": "stretch", "type": "mc", "q": "You are defending the school bus. Which counter argument and rebuttal pair below is the strongest?", "options": ["The bus costs the school 12,000 pounds a year, and that is real money. But three families have already said their children would miss registration without it, and a child who cannot get to school costs more than a bus does.", "Some people say the bus is a waste of money, but those people have clearly never had to walk anywhere in the rain.", "The bus costs a lot of money, and that is a fair point, so perhaps the whole thing should be looked at again.", "Nobody has ever seriously argued against the bus, so there is nothing here to answer."], "answer": "The bus costs the school 12,000 pounds a year, and that is real money. But three families have already said their children would miss registration without it, and a child who cannot get to school costs more than a bus does.", "hint": "A strong pair names the other side's best point honestly, then answers it with something specific.", "explain": "The answer is the first option. It states the other side's best point, with a real figure, and then answers it with a specific consequence rather than an opinion. The second insults the other side instead of answering it, which loses the room. The third concedes and then gives up, so the speaker has argued the opposite case for them. The fourth pretends there is no argument, which nobody listening believes. Concede the real point, then beat it.", "topic": "persuasion: judging a counter argument and rebuttal"}], "e12-write-full": [{"id": "e12-write-full:r-e12-1", "level": "easy", "type": "text", "q": "You are writing the five minute plan. You have written down the ending, the opening image and three beats. How many lines of the plan are still missing? Write the number.", "answer": "2", "accept": ["2", "two", "2 lines", "two lines"], "hint": "The plan is seven lines. Count how many you have written.", "explain": "The answer is 2. The plan is seven lines: the ending, the opening image, three beats, the planned short sentence and the proofread list. You have written five, so the short sentence and the proofread list are the two still missing. Those are exactly the two people skip, and they are the two that make a piece read as controlled instead of just stopping.", "topic": "whole piece: the seven line plan"}, {"id": "e12-write-full:r-e12-2", "level": "easy", "type": "mc", "q": "A student writes their plan in this order: opening image, three beats, ending, planned short sentence, proofread list. What is wrong with the order?", "options": ["The ending should have been decided first, before anything else.", "The proofread list should have been written first.", "Nothing, the order does not matter.", "The beats should have come before the opening image."], "answer": "The ending should have been decided first, before anything else.", "hint": "One line has to be written before the rest, because it decides where the whole piece is going.", "explain": "The answer is that the ending goes first. Decide the ending before anything else and every beat can point at it, so you never reach minute twenty six with no idea how to stop. Writing the ending after the beats means the beats were chosen with no destination in mind. The proofread list can go last, because you only need it at the end, and the beats do belong after the opening image.", "topic": "whole piece: the order of the plan"}, {"id": "e12-write-full:r-e12-3", "level": "easy", "type": "text", "q": "You have a 30 minute task. You spend 5 minutes planning and keep 4 minutes back for proofreading. How many minutes are left for actually writing? Write the number.", "answer": "21", "accept": ["21", "21 minutes", "twenty one", "twenty one minutes"], "hint": "Add the two protected blocks together first, then take them off the 30.", "explain": "The answer is 21. Add the two protected blocks first, 5 plus 4 is 9, then take that off the total: 30 minus 9 is 21. That means the pen goes down at 26 minutes, whatever state the piece is in. Work this out before you start, because in the room you will not stop to do the arithmetic, you will just keep writing until the time goes.", "topic": "whole piece: the 30 minute clock"}, {"id": "e12-write-full:r-e12-4", "level": "easy", "type": "mc", "q": "What has to be in a beat?", "options": ["One moment, with one concrete detail in it.", "A summary of everything that happens in the middle of the piece.", "At least three adjectives.", "A whole paragraph, written out in full in the plan."], "answer": "One moment, with one concrete detail in it.", "hint": "Ask whether you could photograph it.", "explain": "The answer is one moment with one concrete detail in it. A beat is small on purpose, because a small moment gives you something to describe and a big summary does not. Things got worse is not a beat, since there is no moment in it. Adjectives are not the point, and writing a paragraph out in the plan means writing the piece twice, which you do not have the time for.", "topic": "whole piece: what a beat is"}, {"id": "e12-write-full:r-e12-5", "level": "medium", "type": "mc", "q": "Here are four lines taken from four different plans. Which one is a real beat rather than a summary?", "options": ["A dog barking behind a fence I cannot see over.", "The walk home was strange.", "Lots of things went wrong that afternoon.", "It was frightening from start to finish."], "answer": "A dog barking behind a fence I cannot see over.", "hint": "Ask which one you could write six sentences about.", "explain": "The answer is the dog barking behind a fence I cannot see over. It is one moment with something concrete in it, so you can write about the sound, the height of the fence, whether you cross the road. The other three are summaries. A summary tells the reader that something happened without showing any of it, and once you have written it there is nothing left to add, so it dies in one sentence.", "topic": "whole piece: beat versus summary"}, {"id": "e12-write-full:r-e12-6", "level": "medium", "type": "mc", "q": "Your planned short sentence is: The gate was locked. Where should it go for real effect?", "options": ["Straight after the long sentence describing running down the lane expecting to get through.", "As the very first sentence of the piece, before anything has been set up.", "At the end of every paragraph, so the reader notices it.", "Anywhere, as long as it is in there somewhere."], "answer": "Straight after the long sentence describing running down the lane expecting to get through.", "hint": "A short sentence only lands if something long comes immediately before it.", "explain": "The answer is straight after the long sentence about running down the lane. The long sentence builds the expectation and the short one stops it dead, and that contrast is where the whole effect comes from. Put it first and there is nothing for it to break, so it is just a short sentence. Repeating it at the end of every paragraph kills it, and anywhere means you never really planned it.", "topic": "whole piece: placing the planned short sentence"}, {"id": "e12-write-full:r-e12-7", "level": "medium", "type": "mc", "q": "You are 22 minutes into a 30 minute task. You have written the opening and two beats, and you have not started the third. What do you do?", "options": ["Cut beat three, write the ending you planned, and keep the last 4 minutes for proofreading.", "Keep writing all three beats and skip the proofreading.", "Stop where you are and hand it in unfinished.", "Start the piece again with a shorter plan."], "answer": "Cut beat three, write the ending you planned, and keep the last 4 minutes for proofreading.", "hint": "Something has to be dropped. Drop the thing that costs the fewest marks.", "explain": "The answer is to cut beat three and go to the ending. A piece with two beats and a proper ending reads as finished, and finished is worth more than long. Dropping the proofread window is the expensive choice, because a missing full stop takes four seconds to fix and costs more than an extra beat gains. Stopping dead leaves the piece with no ending, and starting again throws away 22 minutes of work.", "topic": "whole piece: recovering when you are behind the clock"}, {"id": "e12-write-full:r-e12-8", "level": "stretch", "type": "mc", "q": "Which of these is the strongest opening for a narrative called The last train?", "options": ["One glove on the platform bench, and the departure board already blank.", "In this story I am going to write about the last train and what happened on it.", "Trains are an important form of transport used by millions of people every day.", "It was a normal evening and nothing much was happening at the station."], "answer": "One glove on the platform bench, and the departure board already blank.", "hint": "An opening image is one thing the reader can actually see. Which one could you photograph?", "explain": "The answer is the glove on the bench with the board already blank. It is one specific thing the reader can see, and it puts them on the platform in the first line without explaining anything. The second option announces the piece instead of starting it. The third is general information about trains and shows nothing. The fourth opens by saying nothing is happening, which gives the reader no reason to carry on reading.", "topic": "whole piece: choosing an opening that shows"}], "h6-norman-conquest": [{"id": "h6-norman-conquest:r-h6-1", "level": "easy", "type": "mc", "q": "Three men claimed the English throne in 1066. Which of these was NOT one of the three main claimants?", "options": ["Edwin, Earl of Mercia", "Harold Godwinson", "William, Duke of Normandy", "Harald Hardrada, King of Norway"], "answer": "Edwin, Earl of Mercia", "hint": "Two of the claimants were foreign rulers and one was the most powerful noble in England. One name on this list was a northern earl who fought in 1066 but never claimed the crown.", "explain": "The answer is Edwin, Earl of Mercia. He was one of the northern earls beaten at Fulford in September 1066, so he is in the story, but he never claimed the throne. The three main claimants were Harold Godwinson, chosen by the Witan, William of Normandy, who said Edward had promised him the crown, and Harald Hardrada of Norway, who based his claim on an old agreement between earlier kings. Being in the events of 1066 is not the same as claiming the crown.", "topic": "Norman Conquest: identifying the three claimants"}, {"id": "h6-norman-conquest:r-h6-2", "level": "easy", "type": "mc", "q": "Why was there a crisis over who should be king when Edward the Confessor died in January 1066?", "options": ["Edward had no son, and England had no fixed rule that decided who inherited the throne.", "Edward had five sons and they all wanted the crown at once.", "England had a written law saying the throne went to the King of Norway.", "Nobody in England wanted to be king."], "answer": "Edward had no son, and England had no fixed rule that decided who inherited the throne.", "hint": "Ask two things: did Edward leave an heir, and was there a rule that settled it?", "explain": "The answer is that Edward had no son and there was no fixed rule of inheritance. There was no law saying the eldest son takes over, partly because there was no son to take over. That left a promise, an oath, an old agreement between earlier kings and the decision of the Witan all pulling in different directions, and three powerful men each able to argue that the throne was theirs.", "topic": "Norman Conquest: why the succession was disputed"}, {"id": "h6-norman-conquest:r-h6-3", "level": "easy", "type": "text", "q": "In late September 1066 Harold Godwinson marched his army north and destroyed a Norwegian army, killing Harald Hardrada and Tostig. Write the name of that battle.", "answer": "Stamford Bridge", "accept": ["Stamford Bridge", "stamford bridge", "the Battle of Stamford Bridge", "Battle of Stamford Bridge", "Stamford"], "hint": "It is named after a crossing over a river in Yorkshire.", "explain": "The answer is Stamford Bridge, fought on 25 September 1066. Harold won it outright, and both Hardrada and Harold's own brother Tostig were killed. Do not confuse it with Fulford five days earlier, which the northern earls lost. Stamford Bridge matters for what came next: three days later William landed at Pevensey, hundreds of miles to the south, with Harold's best troops standing in Yorkshire.", "topic": "Norman Conquest: the Battle of Stamford Bridge"}, {"id": "h6-norman-conquest:r-h6-4", "level": "easy", "type": "mc", "q": "A historian says that a new tax was the trigger of a rebellion, not its deepest cause. What does trigger mean here?", "options": ["The single event that set everything off, rather than the deepest reason underneath it.", "The reason that had been building up quietly for many years.", "The result that followed after the rebellion.", "The person who was blamed for the rebellion."], "answer": "The single event that set everything off, rather than the deepest reason underneath it.", "hint": "Think of a gun. The trigger is not the reason it was loaded.", "explain": "The answer is the single event that set everything off. A trigger is the spark, not the fuel. In 1066 the trigger was Edward the Confessor dying on 5 January, while the deepest reason, the long term cause, was that Edward had no child for over twenty years and England had no agreed rule about who inherited. Naming which kind of cause you mean lifts an answer on its own, because it shows you are thinking about time and not just listing facts.", "topic": "Norman Conquest: the difference between a cause and a trigger"}, {"id": "h6-norman-conquest:r-h6-5", "level": "medium", "type": "text", "q": "William landed at Pevensey on 28 September 1066. The Battle of Hastings was fought on 14 October 1066. How many days was William in England before the battle? Write the number only.", "answer": "16", "accept": ["16", "16 days", "sixteen", "sixteen days"], "hint": "September has 30 days. Count to the end of September first, then add the days in October.", "explain": "The answer is 16. Do it in two steps. From 28 September to 30 September is 2 days. Then from the end of September to 14 October is another 14 days. 2 plus 14 is 16. The common slip is to subtract 28 from 14 and get a negative or a nonsense number, which happens when you forget you have crossed into a new month. Sixteen days is long enough for William to build a base at Hastings and wait, which is exactly what he did.", "topic": "Norman Conquest: calculating the gap between Stamford Bridge and Hastings"}, {"id": "h6-norman-conquest:r-h6-6", "level": "medium", "type": "mc", "q": "On 14 October 1066 Harold's army had a problem that William's army did not have. Which of these describes it best?", "options": ["Harold's best troops had fought a hard battle at Stamford Bridge on 25 September and then marched hundreds of miles south in under three weeks, so they were exhausted and some men never arrived at all.", "Harold's men had never fought in a battle before.", "Harold's army had no weapons, because the king had sold them.", "Harold's army was made up entirely of Norman soldiers."], "answer": "Harold's best troops had fought a hard battle at Stamford Bridge on 25 September and then marched hundreds of miles south in under three weeks, so they were exhausted and some men never arrived at all.", "hint": "Look at what Harold's army had been doing in the three weeks before Hastings, and where they had been doing it.", "explain": "The answer is the first option. Harold won at Stamford Bridge in Yorkshire on 25 September, then marched the length of the country to meet William in Sussex by 14 October. His men fought Hastings tired, and stragglers were still coming in. That is a short term cause, because it happened in the weeks just before. William's army, by contrast, had landed on 28 September and spent those weeks resting and building a base. Harold's men were experienced soldiers and they were armed, so the other options are simply wrong.", "topic": "Norman Conquest: short term causes of Harold's defeat"}, {"id": "h6-norman-conquest:r-h6-7", "level": "medium", "type": "text", "q": "Sort this reason into long term cause, short term cause or trigger. In September 1066 the winds kept William's fleet in port for weeks, so he only landed after Harold had marched north to fight the Norwegians. Write long term, short term or trigger.", "answer": "short term", "accept": ["short term", "short-term", "short term cause", "short-term cause", "a short term cause", "short"], "hint": "Ask how long before Hastings this happened. Years, weeks, or was it the single spark that started the whole crisis?", "explain": "The answer is short term. It happened in the weeks just before the battle, so it is a short term cause. It is not long term, because it did not build up over years the way Edward having no heir did. It is not the trigger either, because the trigger of the whole crisis was Edward's death on 5 January 1066. Notice that this one cuts both ways: the delay was bad luck for William at the time, and then turned out to help him, because Harold's coast watch had run out of supplies and gone home.", "topic": "Norman Conquest: classifying a short term cause"}, {"id": "h6-norman-conquest:r-h6-8", "level": "stretch", "type": "mc", "q": "Which one of these is a consequence of the Battle of Hastings rather than a cause of it?", "options": ["William was crowned in Westminster Abbey on 25 December 1066.", "Edward the Confessor died with no son to succeed him.", "Harold's army marched south exhausted after Stamford Bridge.", "William claimed that Edward had promised him the throne back in 1051."], "answer": "William was crowned in Westminster Abbey on 25 December 1066.", "hint": "Put each one on a timeline against 14 October 1066. Anything after it cannot have caused it.", "explain": "The answer is the coronation on 25 December 1066. It happened after the battle, so it is a consequence, something the battle led to. The other three all happened before 14 October and helped bring the battle about, so they are causes. The quickest check is the date: if it happened after the event, it cannot possibly be a cause of it. That one test sorts most cause and consequence questions in seconds.", "topic": "Norman Conquest: telling a consequence from a cause"}], "h7-norman-control": [{"id": "h7-norman-control:r-h7-1", "level": "easy", "type": "mc", "q": "A Norman castle is described as standing on a steep mound of earth piled up by hand, with a wooden tower on top of it. What is the mound called?", "options": ["The motte", "The bailey", "The moat", "The keep"], "answer": "The motte", "hint": "Motte and bailey. One is the high bit and one is the yard at the bottom.", "explain": "The answer is the motte. It is the man made mound of earth, with a wooden tower on top so soldiers could see and be seen for miles. The bailey is the walled yard at the bottom holding the stores, stables and workshops. A moat is a ditch, often filled with water, and a keep is the strong stone tower that came later, once the Normans had time to build in stone.", "topic": "Norman control: what a motte is"}, {"id": "h7-norman-control:r-h7-2", "level": "easy", "type": "text", "q": "In a motte and bailey castle, what is the name of the walled yard at the bottom of the mound, where the stables, stores and workshops were kept? Write the one word.", "answer": "bailey", "accept": ["bailey", "the bailey", "Bailey", "bailey."], "hint": "It is the second half of the name motte and bailey.", "explain": "The answer is the bailey. It is the enclosed yard at the foot of the mound, protected by a wooden fence and a ditch, where the day to day work of the castle happened. The motte is the mound itself. Keeping the two apart matters, because a question about where soldiers kept their horses is asking about the bailey, and a question about where the lookout tower stood is asking about the motte.", "topic": "Norman control: what a bailey is"}, {"id": "h7-norman-control:r-h7-3", "level": "easy", "type": "mc", "q": "Under the feudal system, what did a baron owe the king in return for the land he was granted?", "options": ["Military service, a set number of fighting men for a set number of days each year.", "Nothing at all, because the land was an outright gift.", "One tenth of everything he grew, paid to the church.", "A yearly payment in gold sent to the Pope."], "answer": "Military service, a set number of fighting men for a set number of days each year.", "hint": "Land was not a present. Ask what the king actually needed from his barons.", "explain": "The answer is military service. Land was held in return for service, usually an agreed number of knights for an agreed number of days, and it could be taken back if the service was not given. That is what made the pyramid work: the king was at the top and everybody below held their land from somebody above. One tenth of what you grew was the tithe, which was paid to the church, not the king, so that option is a real thing in the wrong place.", "topic": "Norman control: the feudal pyramid"}, {"id": "h7-norman-control:r-h7-4", "level": "easy", "type": "text", "q": "William was crowned on 25 December 1066. He ordered the great survey of England at his Christmas court in 1085. How many years passed between the coronation and the order? Write the number only.", "answer": "19", "accept": ["19", "19 years", "nineteen", "nineteen years"], "hint": "Both dates are AD, so subtract the earlier year from the later one.", "explain": "The answer is 19. Both dates are AD, so you subtract: 1085 minus 1066. Take off 1000 to get 85, then take off the remaining 66 to get 19. Note the two different dates people mix up here. The survey was ordered in 1085 and carried out in 1086, so the gap from the coronation to the survey itself is 20 years, and the gap to the order is 19.", "topic": "Norman control: calculating the gap from 1066 to Domesday"}, {"id": "h7-norman-control:r-h7-5", "level": "medium", "type": "mc", "q": "In the winter of 1069 to 1070, William's soldiers burned villages, crops, tools and livestock across large parts of northern England. What is this called, and what was it meant to do?", "options": ["The Harrying of the North, meant to destroy the north's ability to rebel by destroying the means to live there.", "The Domesday survey, meant to record who owned what.", "The Harrying of the North, meant to find and punish one particular rebel leader.", "The murdrum fine, meant to make districts hand over killers."], "answer": "The Harrying of the North, meant to destroy the north's ability to rebel by destroying the means to live there.", "hint": "Two options give the right name. Look at what the burning of seed corn and oxen would actually achieve.", "explain": "The answer is the Harrying of the North, meant to break the north's ability to rebel. Burning the seed corn and killing the oxen does not just punish people, it removes the food and the ploughing animals needed for the next year, so an area cannot support an army again for a long time. It was not a hunt for one man, and it is not the Domesday survey, which was a written record made fifteen years later, or the murdrum fine, which was a law.", "topic": "Norman control: the Harrying of the North"}, {"id": "h7-norman-control:r-h7-6", "level": "medium", "type": "text", "q": "Which tool of control is a motte and bailey castle mainly an example of? Write one word from this list: force, land, law, information.", "answer": "force", "accept": ["force", "Force", "force.", "it is force"], "hint": "Four tools: force, land, law, information. Ask what a castle actually does to the people who can see it.", "explain": "The answer is force. A castle is something people can see and cannot get past, holding armed men inside a town that did not want them. It is not land, because land as a tool means who owns the ground and what they owe for it. It is not law, which is rules and courts, and it is not information, which is the Domesday survey. Sorting each method into its tool is what turns a list of facts into an argument.", "topic": "Norman control: classifying castles as force"}, {"id": "h7-norman-control:r-h7-7", "level": "medium", "type": "mc", "q": "The Normans brought in the murdrum fine. If a Norman was found murdered and the killer was not handed over, the whole local district had to pay a heavy fine. Why was that an effective tool of control?", "options": ["It made English neighbours watch and police each other, because everybody in the district paid for what one person had done.", "It made sure that only the guilty person was ever punished.", "It meant the Normans no longer needed any castles.", "It applied only in London, so most of the country was unaffected."], "answer": "It made English neighbours watch and police each other, because everybody in the district paid for what one person had done.", "hint": "Ask who ends up doing the work of catching the killer once everyone in the village has to pay.", "explain": "The answer is the first option. A fine on the whole district turns every neighbour into an enforcer, because staying silent costs everybody money. That is law used as control: the courts do work that would otherwise take soldiers. It is the opposite of punishing only the guilty, which is exactly why it worked. Castles were still needed, and the fine was not limited to London.", "topic": "Norman control: law as a tool, and the murdrum fine"}, {"id": "h7-norman-control:r-h7-8", "level": "stretch", "type": "mc", "q": "A question asks which tool of control mattered most: force, land, law or information. Which of these is the strongest way to answer it?", "options": ["Pick one tool, argue for it with named examples, then say honestly what the best case for a different tool would be.", "List all four tools with one fact about each, then stop.", "Say that all four were equally important, so that nobody can disagree with you.", "Pick one tool and leave out any evidence that does not support it."], "answer": "Pick one tool, argue for it with named examples, then say honestly what the best case for a different tool would be.", "hint": "The marks are not for knowing the four tools. They are for taking a position and testing it.", "explain": "The answer is the first option. A judgement question wants a decision, evidence for it, and proof that you know what the strongest argument against you is. Listing all four is description, not judgement. Saying they were all equal avoids the question, which is what the examiner is checking for. Ignoring inconvenient evidence is the weakest of all, because the best counter point is usually the thing the examiner is waiting to see you handle.", "topic": "Norman control: judgement on which tool of control mattered most"}], "h8-medieval-life": [{"id": "h8-medieval-life:r-h8-1", "level": "easy", "type": "mc", "q": "Which statement about a villein in about 1300 is correct?", "options": ["He held land from the lord and paid for it by working the lord's fields, and he could not leave the village without permission.", "He was a slave who owned nothing and could be bought and sold.", "He paid rent in money and could leave the village whenever he liked.", "He owned the manor and the fields around it."], "answer": "He held land from the lord and paid for it by working the lord's fields, and he could not leave the village without permission.", "hint": "A villein was not free, but he was not a slave either. Think about what he paid with, and what he needed permission for.", "explain": "The answer is the first option. A villein held land from the lord and paid for it in work, usually two or three days a week plus extra at harvest, and he needed the lord's permission to leave, to marry off his daughter or to sell an ox. He was not a slave, because he held land and could not be sold. The third option describes a freeman, who paid rent in money and could leave. The fourth describes the lord himself.", "topic": "Medieval life: what a villein was"}, {"id": "h8-medieval-life:r-h8-2", "level": "easy", "type": "text", "q": "Everybody in a medieval village paid one tenth of everything they produced to the church. What was that payment called? Write the one word.", "answer": "tithe", "accept": ["tithe", "the tithe", "Tithe", "tithes"], "hint": "The word comes from an old word for a tenth.", "explain": "The answer is the tithe. It was one tenth of everything you produced, and for most people it was paid in goods rather than money, so it meant handing over sheaves of corn, eggs or lambs. Some churches had a tithe barn just to store it. Do not confuse it with the payments owed to the lord, which were work in the lord's fields. The tithe went to the church, and everybody paid it.", "topic": "Medieval life: the tithe"}, {"id": "h8-medieval-life:r-h8-3", "level": "easy", "type": "mc", "q": "A village farms three big open fields. Two of them are sown with crops each year. What happens to the third, and why?", "options": ["It is left fallow, so nothing is sown on it and the soil can recover, and animals graze there instead.", "It is sown twice, to get two harvests out of it.", "It is sold to the neighbouring village each year.", "It is flooded on purpose to kill the weeds."], "answer": "It is left fallow, so nothing is sown on it and the soil can recover, and animals graze there instead.", "hint": "There was no artificial fertiliser. Ask how soil got its strength back.", "explain": "The answer is that it is left fallow. With no fertiliser available, resting one field in three was how the soil recovered, and grazing animals on it added manure at the same time. The fields took turns, so each one rested every third year. It also explains why families held thin strips scattered across all three fields: that way nobody got all the good soil and nobody got all the bad.", "topic": "Medieval life: the three field system and fallow land"}, {"id": "h8-medieval-life:r-h8-4", "level": "easy", "type": "text", "q": "The Black Death arrived in England in a year in the 1340s and killed between a third and a half of the population. Write that year.", "answer": "1348", "accept": ["1348", "in 1348", "1348.", "the year 1348"], "hint": "It is late in that decade, and it is the year most often written next to the words Black Death in England.", "explain": "The answer is 1348. It reached England through the south coast ports in the summer of 1348 and spread through the country over the following year. Hold it next to the two dates that follow it, because questions usually ask about the gap: the Statute of Labourers came in 1351, three years later, and the Peasants' Revolt in 1381, thirty three years after the plague arrived.", "topic": "Medieval life: the date the Black Death reached England"}, {"id": "h8-medieval-life:r-h8-5", "level": "medium", "type": "mc", "q": "After the Black Death, an ordinary labourer could suddenly demand higher pay. Why?", "options": ["So many workers had died that there was far more work than there were people to do it, so a worker could walk to the next village and be hired for more.", "The king passed a law ordering all wages to be raised.", "The church started paying people's wages for them.", "Lords decided to be more generous because they felt sorry for the survivors."], "answer": "So many workers had died that there was far more work than there were people to do it, so a worker could walk to the next village and be hired for more.", "hint": "The land did not disappear, only the people did. Ask what that does to the value of one worker.", "explain": "The answer is the first option. The fields were still there and still needed working, but between a third and a half of the workers were dead, so labour became scarce and its price went up. Lords were not being generous, they were losing an argument they could not win, which is exactly why they went to Parliament and got the Statute of Labourers in 1351 to try to hold wages down by law.", "topic": "Medieval life: why wages rose after the Black Death"}, {"id": "h8-medieval-life:r-h8-6", "level": "medium", "type": "mc", "q": "Parliament passed the Statute of Labourers in 1351. What did it do, and what does it tell you?", "options": ["It made it illegal to pay or accept wages higher than the levels normal before the plague, which shows the lords were losing the argument over wages.", "It ordered lords to double the wages of every labourer, which shows the lords had given in.", "It abolished the position of villein across England, which shows the plague had ended serfdom overnight.", "It banned people from travelling to the towns, which shows the towns were empty."], "answer": "It made it illegal to pay or accept wages higher than the levels normal before the plague, which shows the lords were losing the argument over wages.", "hint": "Governments do not pass a law to stop something that is not already happening.", "explain": "The answer is the first option. The Statute fixed wages at their pre plague levels and made it an offence to pay more or to accept more. The useful point for an exam answer is the second half: a law banning higher wages is proof that higher wages were being paid, so it is evidence that ordinary workers had gained real bargaining power. It did not abolish villeinage, which carried on for a long time afterwards.", "topic": "Medieval life: the Statute of Labourers 1351"}, {"id": "h8-medieval-life:r-h8-7", "level": "medium", "type": "text", "q": "The Statute of Labourers was passed in 1351. The Peasants' Revolt broke out in 1381. How many years apart were they? Write the number only.", "answer": "30", "accept": ["30", "30 years", "thirty", "thirty years"], "hint": "Both dates are AD, so subtract the earlier from the later.", "explain": "The answer is 30. Both dates are AD, so subtract: 1381 minus 1351 is 30. It is worth holding on to, because it shows the revolt was not a sudden reaction to the plague. Thirty years of wage laws, and then three poll taxes in five years, built up first, and the poll tax of 1381 was the trigger that set it off.", "topic": "Medieval life: calculating the gap from the Black Death to 1381"}, {"id": "h8-medieval-life:r-h8-8", "level": "stretch", "type": "mc", "q": "Which of these is the best example of CONTINUITY across the fourteenth century, rather than change?", "options": ["Villagers still farmed strips in open fields, still paid a tithe to the church and still had a lord above them.", "Wages for ordinary labourers rose sharply.", "Parliament passed new laws trying to hold wages down.", "Many villages were left half empty, and some were abandoned altogether."], "answer": "Villagers still farmed strips in open fields, still paid a tithe to the church and still had a lord above them.", "hint": "Continuity is what carried straight on. Look for the option with the word still in it.", "explain": "The answer is the first option. Continuity means what stayed the same, and the fields, the church payments and the lord were all still there in 1400 exactly as they had been in 1340. The other three are changes: wages rose, laws were passed to stop them rising, and villages emptied. A weak answer lists only changes because changes are more interesting. A strong one names both, then says which mattered more.", "topic": "Medieval life: identifying continuity across the Black Death"}], "h9-sources": [{"id": "h9-sources:r-h9-1", "level": "easy", "type": "mc", "q": "Before you read a source you read the short note printed above it. What three things does the provenance of a source tell you?", "options": ["Who made it, when they made it, and why they made it.", "How long it is, what language it is in, and where it is kept.", "Whether it is true, whether it is famous, and whether it is old.", "Who owns it now, how much it is worth, and who found it."], "answer": "Who made it, when they made it, and why they made it.", "hint": "Three questions, and the last one is the one people forget.", "explain": "The answer is who, when and why. Those three together are the provenance, and most of the marks in a source question come from using them. The why is the one people skip, and it is usually the most powerful: a man writing to justify his own side will describe the same events completely differently from a man who lost his land. Read the note before the source, every time.", "topic": "Sources: what provenance means"}, {"id": "h9-sources:r-h9-2", "level": "easy", "type": "mc", "q": "A letter written by a soldier in a trench in 1916, describing an attack he took part in that morning. Is it primary or secondary, and why?", "options": ["Primary, because it was made at the time by somebody who was there.", "Secondary, because it is only one man's opinion.", "Secondary, because letters are always secondary sources.", "Primary, because it is old."], "answer": "Primary, because it was made at the time by somebody who was there.", "hint": "Ask when it was made and how close the writer was to the event.", "explain": "The answer is primary, because it was made at the time by somebody present. Primary and secondary is about distance from the event, not about how fair or how detailed the source is. A one sided eyewitness letter is still primary. Age on its own does not settle it either: a book written in 1900 about the Normans is secondary, because its writer was eight hundred years too late to see anything.", "topic": "Sources: primary and secondary"}, {"id": "h9-sources:r-h9-3", "level": "easy", "type": "text", "q": "A history book published in 2019, written by a professor who spent years reading medieval documents about Norman England. Is that a primary source or a secondary source? Write one word.", "answer": "secondary", "accept": ["secondary", "Secondary", "a secondary source", "secondary source"], "hint": "Ask whether the writer was anywhere near the events.", "explain": "The answer is secondary. The professor was not there and did not see any of it. She has studied the primary sources and produced an account of them afterwards, which is exactly what a secondary source is. Notice that being written by an expert makes a source useful, but it does not make it primary. Distance from the event is the only thing that decides which one it is.", "topic": "Sources: identifying a secondary source"}, {"id": "h9-sources:r-h9-4", "level": "easy", "type": "mc", "q": "Here is a provenance note, written for this exercise: \"In the style of a Norman bishop writing in about 1090. He was given his position by William and holds his lands from him.\" What should you keep in mind as you read what he says about William's rule?", "options": ["He owes his position and his lands to William, so he has a strong reason to describe William's rule well.", "He was writing a thousand years later, so he cannot have known anything.", "He was English, so he will be hostile to the Normans.", "Nothing, because bishops always told the truth."], "answer": "He owes his position and his lands to William, so he has a strong reason to describe William's rule well.", "hint": "The note tells you who pays him. Ask what that does to what he writes.", "explain": "The answer is the first option. The note gives you the why, and the why is that his career depends on William. That does not mean everything he writes is false. It means you should expect the good side of Norman rule and expect the damage to be played down. He was writing in about 1090, close to the events, and he is Norman, not English, so the other options misread the note itself.", "topic": "Sources: reading the provenance note"}, {"id": "h9-sources:r-h9-5", "level": "medium", "type": "mc", "q": "Complete this rule. A source that is one sided, and unreliable about what actually happened, can still be...", "options": ["very useful, because it is strong evidence of what its writer wanted people to believe.", "completely useless, and should be thrown out of the answer.", "treated as reliable anyway, as long as it is old enough.", "used only if a second source says exactly the same thing."], "answer": "very useful, because it is strong evidence of what its writer wanted people to believe.", "hint": "Reliable and useful are two different words. One is about the facts, the other is about the question you are asking.", "explain": "The answer is that it is still very useful. Reliable means you can trust the facts in it. Useful means it tells you something worth knowing for your enquiry. A Norman account that exaggerates William's justice is poor evidence of how just he was, and first class evidence of how the Normans wanted the conquest to look. Mixing the two words up is one of the cheapest ways to lose marks in a source question.", "topic": "Sources: reliability against usefulness"}, {"id": "h9-sources:r-h9-6", "level": "medium", "type": "mc", "q": "A student writes about a one sided medieval chronicle: \"This source is biased, so we should ignore it.\" What is wrong with that sentence?", "options": ["Bias tells you where the writer stood, and that is itself evidence, so you weigh the source using its provenance instead of throwing it away.", "Nothing is wrong, because biased sources cannot be used in history.", "It is wrong because no medieval source is ever biased.", "It is wrong because bias only matters in secondary sources."], "answer": "Bias tells you where the writer stood, and that is itself evidence, so you weigh the source using its provenance instead of throwing it away.", "hint": "Ask what you would have left if you deleted every source written by somebody with a side.", "explain": "The answer is the first option. Nearly every source has a point of view, and if you discard all of them you have no history left. Bias is information: it tells you what one side wanted believed, and why. The right move is to say who wrote it, why that shapes what it says, and what it is therefore good evidence of. Writing the word biased and stopping is a description, not an argument.", "topic": "Sources: why biased does not mean useless"}, {"id": "h9-sources:r-h9-7", "level": "medium", "type": "mc", "q": "Two sources describe the north of England after the winter of 1069 to 1070. A Norman churchman writes that order was restored and only the obstinate suffered. An English monk from a northern monastery writes that the soldiers burned the corn and killed the oxen and left nothing behind. What is the best next step?", "options": ["Compare their provenance, work out what each writer was well placed to know, and look for anything they both agree on.", "Choose the longer source, because it contains more detail.", "Assume the truth is exactly halfway between the two.", "Pick the one that sounds more dramatic, because strong feeling means it is true."], "answer": "Compare their provenance, work out what each writer was well placed to know, and look for anything they both agree on.", "hint": "When two sources clash, the explanation for the clash is usually in the notes above them.", "explain": "The answer is the first option. Cross referencing means holding two sources side by side and asking three things: where do they agree, where do they clash, and what would explain the clash. Here the explanation is provenance. One man owes his position to William and is describing the country as a whole, the other lived in the north and lost land. Length proves nothing, splitting the difference is a guess dressed up as fairness, and drama is not evidence.", "topic": "Sources: how to cross reference two sources that disagree"}, {"id": "h9-sources:r-h9-8", "level": "stretch", "type": "mc", "q": "Your enquiry is: how did the Normans explain and justify the conquest to themselves and to others? Which of these sources would be most useful for that particular enquiry?", "options": ["An account by a Norman churchman written in about 1075, saying William came with a just cause and God granted him the victory.", "An account by an English monk in the north, describing the burning of the corn and the killing of the oxen.", "A chapter from a textbook published in 2020, summarising what modern historians think about Norman rule.", "A list of villages and their values, copied from the Domesday survey."], "answer": "An account by a Norman churchman written in about 1075, saying William came with a just cause and God granted him the victory.", "hint": "The enquiry is not asking what really happened. It is asking what the Normans said about it.", "explain": "The answer is the Norman churchman's account. The enquiry is about Norman justification, so a source written by a Norman making exactly that case is the best evidence there is, and the fact that it is one sided is the point rather than a problem. The English monk is the most useful source for damage in the north, but not for this question. The textbook is a modern summary, and the Domesday list gives values, not arguments. Usefulness always depends on the enquiry you are running.", "topic": "Sources: judging usefulness against a specific enquiry"}], "g8-rivers": [{"id": "g8-rivers:r-g8-1", "level": "easy", "type": "mc", "q": "What is the MOUTH of a river?", "options": ["The place where the river ends and runs into the sea or a lake.", "The place high on a mountain where the river begins.", "The widest bend anywhere along the river.", "The deepest pool in the river bed."], "answer": "The place where the river ends and runs into the sea or a lake.", "hint": "Source and mouth are the two ends. One is up on the hill, one is down at the sea.", "explain": "The answer is the place where the river ends and runs into the sea or a lake. The source is the other end, high on the hills, where it begins. A river runs from source to mouth, so the mouth is where the long profile finally reaches sea level. It is also where the channel is widest and deepest and where the load is finest, because the river has been dropping the heavy material all the way down.", "topic": "rivers: source and mouth"}, {"id": "g8-rivers:r-g8-2", "level": "easy", "type": "text", "q": "Two boulders are carried along by a river. They knock into each other again and again, and over the years they end up smaller and rounder. Name that process. One word.", "answer": "attrition", "accept": ["attrition", "Attrition", "attrition."], "hint": "It is the process where the load wears itself away rather than wearing away the bed.", "explain": "The answer is attrition. Attrition is the load wearing away the load: rocks knocking into rocks, getting smaller and rounder as the sharp edges break off. That is why boulders in the upper course are large and angular, while the pebbles further down are small and rounded. Do not mix it up with abrasion, which is the load being dragged along and scraping away the bed and banks.", "topic": "rivers: attrition"}, {"id": "g8-rivers:r-g8-3", "level": "easy", "type": "mc", "q": "Recall from the water cycle. Water vapour rises, cools high in the air, and turns back into tiny liquid droplets that form a cloud. What is that stage called?", "options": ["Condensation", "Evaporation", "Precipitation", "Surface runoff"], "answer": "Condensation", "hint": "Two of these are the pair that get swapped. One is liquid turning into vapour, the other is vapour turning back into liquid.", "explain": "The answer is condensation. Condensation is vapour turning back into liquid, which is what makes a cloud, and it is also what you see on a cold window. Evaporation is the opposite direction: the sun heats liquid water and turns it into vapour. This pair is the one that gets swapped most often, so fix it by direction rather than by name. Heat up and rise is evaporation, cool down and turn back to liquid is condensation. Precipitation is the water falling out of the cloud afterwards.", "topic": "water cycle: evaporation versus condensation (recall)"}, {"id": "g8-rivers:r-g8-4", "level": "easy", "type": "mc", "q": "Which erosion process is the force of the water on its own, with no rocks involved at all?", "options": ["Hydraulic action, where moving water forces air into cracks in the rock until the rock breaks apart.", "Abrasion, where the load is dragged along and scrapes the bed and banks.", "Attrition, where the rocks knock into each other and get smaller.", "Solution, where the water dissolves soluble rock."], "answer": "Hydraulic action, where moving water forces air into cracks in the rock until the rock breaks apart.", "hint": "Three of these need something other than water. One is water doing the damage by itself.", "explain": "The answer is hydraulic action. Water hits a crack, traps air inside it and compresses that air, and doing that thousands of times over widens the crack until a piece of rock breaks off. No load is needed, which is why it works hardest where the water is most powerful, such as under a waterfall. Abrasion and attrition both need rocks, and solution is a chemical process where the water dissolves rock such as limestone.", "topic": "rivers: hydraulic action"}, {"id": "g8-rivers:r-g8-5", "level": "medium", "type": "mc", "q": "A river bed is being scraped and ground away by the pebbles the river is dragging over it. Which process is that, and how is it different from attrition?", "options": ["Abrasion, because the load is wearing away the bed and banks. Attrition is the load wearing away itself.", "Attrition, because the load is wearing away the bed. Abrasion is the load wearing away itself.", "Hydraulic action, because the water is doing the wearing away on its own.", "Solution, because the pebbles slowly dissolve into the water."], "answer": "Abrasion, because the load is wearing away the bed and banks. Attrition is the load wearing away itself.", "hint": "Ask what is being worn away in each case. The channel, or the rocks being carried?", "explain": "The answer is abrasion. The test is what ends up smaller. In abrasion the bed and banks are worn away, because the load acts like sandpaper being dragged over them. In attrition the load itself is worn away, because the rocks are knocking into each other. Same rocks, two different victims. If the question mentions the channel getting deeper or wider, it is abrasion. If it mentions the pebbles getting rounder, it is attrition.", "topic": "rivers: abrasion versus attrition"}, {"id": "g8-rivers:r-g8-6", "level": "medium", "type": "text", "q": "In its middle course a river falls 60 m over 20 km. What is the gradient in metres per km? Write just the number.", "answer": "3", "accept": ["3", "3.0", "3 m per km", "3 metres per km"], "hint": "Metres per km means metres for each one kilometre, so the metres go on top and the kilometres underneath.", "explain": "The answer is 3. Gradient in metres per km is the drop divided by the distance, so 60 divided by 20 is 3. The units tell you which way round the division goes: metres PER km means metres for each single kilometre, so metres go on top. Doing it upside down gives 20 divided by 60, which is 0.33, and that would mean the river drops a third of a metre over its whole middle course, which is not what the figures say.", "topic": "rivers: calculating gradient"}, {"id": "g8-rivers:r-g8-7", "level": "medium", "type": "mc", "q": "A river reaches flat land near its mouth and slows right down. What happens to the sand and mud it has been carrying, and why?", "options": ["It is deposited, because slower water has less energy and can no longer carry the load.", "It is eroded faster, because slow water is more powerful.", "It dissolves into the water and disappears.", "It evaporates along with the water."], "answer": "It is deposited, because slower water has less energy and can no longer carry the load.", "hint": "Deposition is what happens when a river runs out of energy. Ask what makes a river slow down.", "explain": "The answer is that it is deposited. A river carries material only while it has enough energy to do so, and energy comes from speed and volume of water. On flat land near the mouth the gradient is almost nothing, so the water slows and the load is dropped, heaviest material first. That is why the lower course bed is fine mud and sand while the upper course is boulders. Slow water is weaker, not stronger, so it deposits rather than erodes.", "topic": "rivers: why deposition happens"}, {"id": "g8-rivers:r-g8-8", "level": "stretch", "type": "mc", "q": "Near its source a river cuts downwards into its bed. In its middle course it cuts sideways into its banks instead. Why does the direction change?", "options": ["Near the source the gradient is steep, so the energy goes into cutting down. Lower down the gradient is gentle, so the river swings from side to side and erodes its banks instead.", "Near the source the river is wider, so it can only cut down. Lower down it is narrower, so it cuts sideways.", "The rock near the source is always softer, so it can only be cut downwards.", "The river changes direction because the wind pushes the water sideways."], "answer": "Near the source the gradient is steep, so the energy goes into cutting down. Lower down the gradient is gentle, so the river swings from side to side and erodes its banks instead.", "hint": "Think about which way gravity is pulling the water in each section. Steep slope, or nearly flat?", "explain": "The answer is the first option. On a steep gradient the water is falling as much as flowing, so the energy points downwards and the river cuts into its bed. That is vertical erosion, and it is what carves a steep V shaped valley. On a gentle gradient the water is no longer being pulled down hard, so it swings from side to side and eats into its banks, which is lateral erosion and is what widens the valley floor. The channel is narrow at the top and wide at the bottom, which is the opposite of the second option.", "topic": "rivers: vertical versus lateral erosion"}], "g9-river-landforms": [{"id": "g9-river-landforms:r-g9-1", "level": "easy", "type": "mc", "q": "A waterfall forms where a river crosses two different bands of rock. What has to be true about them?", "options": ["A band of hard rock lies on top of softer rock.", "A band of soft rock lies on top of harder rock.", "Both bands are exactly the same hardness.", "The river bed is made of loose sand with no rock at all."], "answer": "A band of hard rock lies on top of softer rock.", "hint": "Which arrangement would leave a shelf sticking out over empty air?", "explain": "The answer is hard rock on top of softer rock. The soft rock underneath is cut back faster, so the hard rock is left sticking out as an overhang with nothing supporting it. Turn it the other way round, with soft on top, and the soft rock simply wears down into a slope, so you get rapids rather than a vertical drop. Two identical bands wear at the same rate and produce no step at all.", "topic": "river lan
