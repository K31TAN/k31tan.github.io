- 7f + 2, then use your simplified expression to work out its value when f = 3. Give the value.", "answer": "-16", "accept": ["-16", "-16.0", "minus 16", "- 16"], "hint": "Simplify first. The f terms give a negative coefficient, and both plain numbers matter.", "explain": "The answer is -16. Simplify first. The f terms are +4f and -7f, so 4 - 7 = -3, which is -3f. The plain numbers are -9 and +2, so -9 + 2 = -7. The simplified expression is -3f - 7. Now put f = 3 in: -3 x 3 = -9, and -9 - 7 = -16. Check it against the original with f = 3: 12 - 9 - 21 + 2 = -16, which matches, so the simplifying was right too.", "topic": "algebra: simplify then substitute a value"}, {"id": "m17-negatives-algebra:q15", "level": "stretch", "type": "long", "marks": 4, "q": "A student simplifies 9d - 4 - 3d - 6 and writes 12d + 10. Give the correct answer, name both signs that went missing, and show how to prove your answer is right without asking anyone.", "answer": "First I mark every term with its own sign: +9d, -4, -3d and -6. Then I collect. The d terms are +9d and -3d, so 9 - 3 = 6, which is 6d. The plain numbers are -4 and -6, and both are negative, so -4 - 6 = -10. The correct answer is 6d - 10. Two signs went missing in the student's work. The first is the minus in front of the 3d, which was dropped, so 9 + 3 = 12 was worked out instead of 9 - 3 = 6. The second is the minus in front of the 6, which was also dropped, so 4 + 6 = 10 was worked out instead of -4 - 6 = -10. I can prove my answer without asking anyone by putting a number in. Take d = 2. The original expression gives 18 - 4 - 6 - 6 = 2. My answer gives 6 x 2 - 10 = 2, which matches. The student's answer gives 12 x 2 + 10 = 34, which does not match, so it cannot be the same expression.", "hint": "Mark all four terms with their signs first. Then look carefully at what the student did to the 3d and to the 6.", "explain": "A full answer has four parts, one mark each. One, the correct answer is 6d - 10. Two, you name the first dropped sign: the term is -3d, so the d terms give 9 - 3 = 6, not 9 + 3 = 12. Three, you name the second dropped sign: the term is -6, so the numbers give -4 - 6 = -10, not +10. Four, you prove it by substituting, for example d = 2, showing that the original gives 2, your answer gives 2, and 12d + 10 gives 34. Writing 6d - 10 on its own with no explanation is one mark. The substitution check is the part that makes you independent, because it tells you the answer is right before anyone marks it.", "topic": "algebra: diagnosing two dropped signs and proving the correction"}]}, "m18-percentages": {"id": "m18-percentages", "day": "Day 4", "subject": "Maths", "title": "Percentages without a calculator", "minutes": 25, "objective": "Find a percentage of an amount, work out a percentage increase or decrease, and do one step of reverse percentage, all in your head by building from 10% and 1%.", "extract": null, "teach": {"intro": ["Per cent means out of 100. So 30% of something means 30 parts out of every 100 of it, which is why 30% of 100 people is 30 people.", "Two building blocks do nearly all the work. 10% is the amount divided by 10. 1% is the amount divided by 100. Every other percentage is made by adding, doubling or halving those two.", "Here it is on 60. 10% of 60 is 6. So 20% is 2 x 6 = 12, 5% is half of 6 which is 3, 30% is 3 x 6 = 18, and 35% is 18 + 3 = 21. No calculator is needed for any of that.", "Watch the difference between a percentage OF an amount and a percentage OFF it. 25% of 80 is 20. Taking 25% off 80 means 80 - 20 = 60. Read the question and give it the number it actually asked for."], "example": {"problem": "A football team took 240 shots in a season and 35% of them were on target. How many shots were on target?", "steps": ["Start with 10%. Divide by 10: 240 divided by 10 = 24.", "You need 35%, so build it out of pieces you already have. 30% is 3 x 24 = 72.", "5% is half of 10%, so 5% is 24 divided by 2 = 12.", "Add the pieces: 35% is 72 + 12 = 84 shots on target.", "Check it is sensible. 35% is a bit more than a third, and a third of 240 is 80, so an answer just above 80 is right. An answer like 8 or 800 would fail that check instantly."], "answer": "84 shots"}, "example2": {"problem": "A rucksack is reduced by 25% in a sale. It now costs 45 pounds. What was the price before the sale?", "steps": ["This is a working backwards question, the same move as the Working backwards session on Day 1. You are given the finished price and asked for the price you started with, so you undo instead of going forwards.", "Write down what the 45 pounds actually is as a percentage. The old price is 100%, and 25% was taken off, so what is left is 100 - 25 = 75%. The 45 pounds is 75% of the old price.", "Go down to 1% first, because 1% is easy to scale up. If 75% is 45 pounds, then 1% is 45 divided by 75 = 0.6 pounds.", "Now go up to 100%. That is 100 x 0.6 = 60 pounds, so the price before the sale was 60 pounds.", "Check it forwards, which is the habit from Day 1. 10% of 60 is 6, so 25% is 6 + 6 + 3 = 15 pounds off, and 60 - 15 = 45 pounds, which is the sale price you were given.", "The common wrong move is taking 25% off the 45. That gives 33.75, and it is the forward move done a second time on a number that is already the answer."], "answer": "60 pounds"}, "keyfact": "Build every percentage from 10% (divide by 10) and 1% (divide by 100). If you are given the amount AFTER a change and asked what it was before, you are working backwards, so find 1% first and then 100%."}, "questions": [{"id": "m18-percentages:q1", "level": "easy", "type": "mc", "q": "What is 10% of 80?", "options": ["8", "800", "0.8", "18"], "answer": "8", "hint": "10% means divide by 10.", "explain": "The answer is 8. To find 10% you divide by 10, and 80 divided by 10 = 8. Check it the other way: ten lots of 8 make 80.", "topic": "percentages: finding 10% of an amount"}, {"id": "m18-percentages:q2", "level": "easy", "type": "text", "q": "Find 10% of 350.", "answer": "35", "accept": ["35", "35.0"], "hint": "Divide by 10.", "explain": "The answer is 35. 10% is the amount divided by 10, so 350 divided by 10 = 35. Check it: 10 x 35 = 350.", "topic": "percentages: finding 10% of an amount"}, {"id": "m18-percentages:q3", "level": "easy", "type": "text", "q": "Find 1% of 400.", "answer": "4", "accept": ["4", "4.0"], "hint": "1% means divide by 100.", "explain": "The answer is 4. 1% is the amount divided by 100, so 400 divided by 100 = 4. Check it: 100 x 4 = 400. The 1% block is the one you reach for when a percentage is awkward.", "topic": "percentages: finding 1% of an amount"}, {"id": "m18-percentages:q4", "level": "easy", "type": "text", "q": "Find 20% of 60.", "answer": "12", "accept": ["12", "12.0"], "hint": "Find 10% first, then double it.", "explain": "The answer is 12. 10% of 60 is 6, and 20% is twice as much, so 2 x 6 = 12. Building from 10% is faster and safer than trying to do 20% in one go.", "topic": "percentages: building 20% from 10%"}, {"id": "m18-percentages:q5", "level": "easy", "type": "mc", "q": "What is the quickest way to find 5% of a number in your head?", "options": ["Find 10% by dividing by 10, then halve it", "Divide the number by 5", "Divide the number by 50", "Find 10% and then double it"], "answer": "Find 10% by dividing by 10, then halve it", "hint": "5% is half of 10%.", "explain": "The answer is to find 10% and then halve it, because 5 is half of 10. Try it on 40: 10% is 4, so 5% is 2. Dividing 40 by 5 gives 8, which is actually 20% and not 5%. Doubling 10% gives 20%.", "topic": "percentages: building 5% from 10%"}, {"id": "m18-percentages:q6", "level": "easy", "type": "text", "q": "Find 50% of 46.", "answer": "23", "accept": ["23", "23.0"], "hint": "50% is a half.", "explain": "The answer is 23. 50% means half, so 46 divided by 2 = 23. Three of these are worth knowing without thinking: 50% is a half, 25% is a quarter and 10% is a tenth.", "topic": "percentages: 50% as a half"}, {"id": "m18-percentages:q7", "level": "medium", "type": "text", "q": "Find 15% of 60.", "answer": "9", "accept": ["9", "9.0"], "hint": "15% is 10% plus 5%.", "explain": "The answer is 9. 10% of 60 is 6, and 5% is half of that, which is 3. So 15% is 6 + 3 = 9. Check it is sensible: 15% is less than a fifth, a fifth of 60 is 12, and 9 is below 12.", "topic": "percentages: building 15% from 10% and 5%"}, {"id": "m18-percentages:q8", "level": "medium", "type": "text", "q": "A striker takes 40 shots in a season and 35% of them are on target. How many of his shots are on target?", "answer": "14", "accept": ["14", "14.0", "14 shots"], "hint": "10% of 40 is 4. Build 35% out of that.", "explain": "The answer is 14 shots. 10% of 40 is 4, so 30% is 3 x 4 = 12. 5% is half of 4, which is 2. Then 35% is 12 + 2 = 14 shots. Check it is sensible: 35% is about a third, and a third of 40 is a bit over 13.", "topic": "percentages: percentage of an amount in a sport context"}, {"id": "m18-percentages:q9", "level": "medium", "type": "text", "q": "A train ticket costs 45 pounds. The price goes up by 20%. What is the new price, in pounds?", "answer": "54", "accept": ["54", "54.0", "£54", "54 pounds"], "hint": "Work out 20% of 45 first, then add it on. The question asks for the new price, not the size of the rise.", "explain": "The answer is 54 pounds. 10% of 45 is 4.50, so 20% is 2 x 4.50 = 9 pounds. That 9 pounds is the increase. The new price is 45 + 9 = 54 pounds. Answering 9 is a common slip, because 9 is only the rise and not the price you pay.", "topic": "percentages: percentage increase on a price"}, {"id": "m18-percentages:q10", "level": "medium", "type": "text", "q": "A climbing helmet costs 36 pounds. In a sale it is reduced by 25%. What is the sale price, in pounds?", "answer": "27", "accept": ["27", "27.0", "£27", "27 pounds"], "hint": "25% is a quarter. Work out the reduction, then take it off the original price.", "explain": "The answer is 27 pounds. 25% is a quarter, and a quarter of 36 is 36 divided by 4 = 9 pounds off. The sale price is 36 - 9 = 27 pounds. There is a one step route as well: taking 25% off leaves 75%, and 75% of 36 is 3 x 9 = 27 pounds.", "topic": "percentages: percentage decrease on a price"}, {"id": "m18-percentages:q11", "level": "medium", "type": "text", "q": "A village has 1200 people. Over ten years the population falls by 15%. How many people live there now?", "answer": "1020", "accept": ["1020", "1020.0", "1,020", "1020 people"], "hint": "10% of 1200 is 120. Build 15%, then take it off the 1200.", "explain": "The answer is 1020 people. 10% of 1200 is 120, and 5% is half of that, which is 60. So 15% is 120 + 60 = 180 people. A fall means you subtract: 1200 - 180 = 1020 people. Answering 180 gives the size of the fall instead of the population that is left.", "topic": "percentages: percentage decrease in a population"}, {"id": "m18-percentages:q12", "level": "medium", "type": "mc", "q": "A tent costs 90 pounds and a shop takes 30% off. Someone answers 27 pounds. What have they done wrong?", "options": ["27 pounds is the size of the discount, not the new price. The new price is 90 - 27 = 63 pounds", "They should have worked out 30% of 27", "30% of 90 is not 27", "Nothing, 27 pounds is correct"], "answer": "27 pounds is the size of the discount, not the new price. The new price is 90 - 27 = 63 pounds", "hint": "Read what the question asks for. Is it the money taken off, or the money you hand over?", "explain": "The answer is that 27 pounds is the discount, not the price. Their percentage was right: 10% of 90 is 9, so 30% is 3 x 9 = 27 pounds off. But the question asks what the tent costs now, which is 90 - 27 = 63 pounds. This is the most common percentage error in exams, and it throws away marks on a question you can already do.", "topic": "percentages: giving the discount instead of the new price"}, {"id": "m18-percentages:q13", "level": "stretch", "type": "text", "q": "A pair of walking boots is reduced by 20% in a sale. They now cost 68 pounds. What was the price before the sale, in pounds?", "answer": "85", "accept": ["85", "85.0", "£85", "85 pounds"], "hint": "The 68 pounds is not 100% of the old price. Taking 20% off leaves what percentage?", "explain": "The answer is 85 pounds. Taking 20% off leaves 100 - 20 = 80%, so 68 pounds is 80% of the old price. Find 1% first: 68 divided by 80 = 0.85 pounds. Then 100% is 100 x 0.85 = 85 pounds. Check it forwards, the habit from the Working backwards session: 10% of 85 is 8.50, so 20% is 17 pounds, and 85 - 17 = 68 pounds, which matches. Taking 20% off the 68 instead gives 54.40, and that is the forward move done again on a number that is already the answer.", "topic": "percentages: reverse percentage after a decrease"}, {"id": "m18-percentages:q14", "level": "stretch", "type": "text", "q": "Last season a goalkeeper faced 80 shots and saved 65% of them. This season he faced 60 shots and saved 70% of them. How many more saves did he make last season than this season?", "answer": "10", "accept": ["10", "10.0", "10 saves", "10 more"], "hint": "Work out each number of saves separately first. You cannot compare the percentages, because the number of shots is different.", "explain": "The answer is 10 more saves. Last season: 10% of 80 is 8, so 60% is 6 x 8 = 48, and 5% is half of 8, which is 4, so 65% is 48 + 4 = 52 saves. This season: 10% of 60 is 6, so 70% is 7 x 6 = 42 saves. The difference is 52 - 42 = 10 saves. Comparing only the percentages would say this season was better, and he did save a higher share of the shots, but the question asks about the number of saves, and 70% of a smaller number of shots is fewer saves.", "topic": "percentages: comparing two percentages of different amounts"}, {"id": "m18-percentages:q15", "level": "stretch", "type": "long", "marks": 5, "q": "A town's population rises by 12% over ten years and is now 5600. Work out the population ten years ago. Then explain why taking 12% off 5600 does not give the right answer.", "answer": "The 5600 is the population after the rise, so I am given the finish and asked for the start, which makes this a working backwards question like the Working backwards session on Day 1. The old population counts as 100%, and it rose by 12%, so the new population is 100 + 12 = 112% of the old one. That means 5600 is 112%. I find 1% first: 5600 divided by 112 = 50 people. Then 100% is 100 x 50 = 5000 people, so the population ten years ago was 5000. I check it forwards: 10% of 5000 is 500 and 1% is 50, so 12% is 500 + 100 = 600, and 5000 + 600 = 5600, which matches what I was given. Taking 12% off 5600 does not work because the 12% was a percentage of the OLD population of 5000, not of the new one. 12% of 5600 is 672, and 5600 - 672 = 4928, which is not 5000. A percentage is always a percentage of the number you started from, so to go back you have to undo the rise rather than do a fresh subtraction.", "hint": "The 5600 is not 100%. Work out what percentage it is, then find 1%, then 100%.", "explain": "A full answer has five parts, one mark each. One, you say the new population is 112% of the old one, because a rise of 12% is added on to the 100% you started with. Two, you find 1%: 5600 divided by 112 = 50. Three, you find 100%: 100 x 50 = 5000, and you state that as the population ten years ago. Four, you check it forwards: 12% of 5000 is 600, and 5000 + 600 = 5600. Five, you explain the trap: the 12% was a percentage of the old number, so taking 12% of the new number takes off too much and gives 4928 instead of 5000. An answer of 4928 with no working scores nothing, because it is the forward move done a second time instead of an undo.", "topic": "percentages: reverse percentage after an increase, with an explanation"}]}, "m19-sequences": {"id": "m19-sequences", "day": "Day 4", "subject": "Maths", "title": "Sequences and the nth term", "minutes": 25, "objective": "Continue a sequence using its term to term rule, find the nth term of a linear sequence, use it to jump straight to a distant term, and decide whether a given number appears in the sequence.", "extract": null, "teach": {"intro": ["A sequence is a list of numbers that follows a rule. Each number in the list is called a term, and where it sits in the list is called its position. In 5, 9, 13, 17 the first term is 5 and the term in position 3 is 13.", "The term to term rule tells you how to get from one term to the next. In that list each term is 4 more than the one before, so the rule is add 4. It is fine for finding the next term and useless for finding the 100th, because you would have to write out 99 terms first.", "The position to term rule, usually called the nth term, goes straight from the position number to the term. The letter n stands for the position. If the nth term is 4n + 1 then the 100th term is 4 x 100 + 1 = 401, done in one line.", "For a sequence that goes up in equal steps, the step size is the number in front of the n. Then you check what has to be added or subtracted to land on the real terms."], "example": {"problem": "A sequence starts 2, 7, 12, 17. Find the nth term, then use it to find the 20th term.", "steps": ["Find the step. 7 - 2 = 5 and 12 - 7 = 5, so the sequence goes up 5 each time. Check the gap in more than one place, because a rule that works once is not a rule.", "The step is the number that goes in front of the n, so the rule starts with 5n.", "Write out the 5n line for positions 1, 2, 3, 4: that is 5, 10, 15, 20.", "Compare it with the real terms, 2, 7, 12, 17. Every real term is 3 less than the 5n line, so the nth term is 5n - 3.", "Test it on a term you already have. Position 4 gives 5 x 4 - 3 = 20 - 3 = 17, which matches the fourth term. Always test before you use it.", "Now use it for position 20: 5 x 20 = 100, and 100 - 3 = 97. The 20th term is 97."], "answer": "The nth term is 5n - 3, and the 20th term is 97"}, "example2": {"problem": "A sequence starts 3, 10, 17, 24. Find the nth term, find the 30th term, then decide whether 101 is a term and whether 100 is a term.", "steps": ["Find the step: 10 - 3 = 7, so the rule starts with 7n.", "The 7n line is 7, 14, 21, 28. The real terms 3, 10, 17, 24 are each 4 less, so the nth term is 7n - 4.", "Test it: position 3 gives 7 x 3 - 4 = 21 - 4 = 17, which matches.", "The 30th term is 7 x 30 - 4 = 210 - 4 = 206.", "Now the last part, and it is a working backwards question exactly like the Working backwards session on Day 1. Forwards you put a position in and get a term out. Here you are handed a term and asked for the position, so you undo the steps in the opposite order.", "Is 101 a term? Set 7n - 4 = 101. Undo the subtract 4: 101 + 4 = 105. Undo the multiply by 7: 105 divided by 7 = 15. That is a whole number, so yes, 101 is a term, and it is the 15th one.", "Is 100 a term? Set 7n - 4 = 100. Undo the subtract 4: 100 + 4 = 104. Undo the multiply by 7: 104 divided by 7 = 14.857 and so on, which is not a whole number. Positions are counting numbers, so no, 100 is not a term. The sequence jumps from 94 in position 14 straight to 101 in position 15, stepping right over 100."], "answer": "The nth term is 7n - 4, the 30th term is 206, 101 is the 15th term, and 100 is not a term"}, "keyfact": "The nth term of a sequence with equal steps starts with the step size times n, then an adjustment. To decide whether a number is in the sequence, set the nth term equal to it and work backwards. A whole number position means yes, anything else means no."}, "questions": [{"id": "m19-sequences:q1", "level": "easy", "type": "mc", "q": "A sequence starts 4, 7, 10, 13. What is the term to term rule?", "options": ["Add 3", "Add 4", "Multiply by 3", "Subtract 3"], "answer": "Add 3", "hint": "Work out the gap between one term and the next.", "explain": "The answer is add 3. 7 - 4 = 3, 10 - 7 = 3 and 13 - 10 = 3, so every term is 3 more than the one before. Check the gap in more than one place, because a rule that only works once is not a rule.", "topic": "sequences: finding the term to term rule"}, {"id": "m19-sequences:q2", "level": "easy", "type": "text", "q": "A sequence starts 4, 7, 10, 13. What is the next term?", "answer": "16", "accept": ["16", "16.0"], "hint": "Use the term to term rule on the last term you have.", "explain": "The answer is 16. The rule is add 3, so the next term is 13 + 3 = 16.", "topic": "sequences: continuing an ascending sequence"}, {"id": "m19-sequences:q3", "level": "easy", "type": "text", "q": "A sequence starts 20, 17, 14, 11. What is the next term?", "answer": "8", "accept": ["8", "8.0"], "hint": "This sequence is going down. Work out the size of each drop.", "explain": "The answer is 8. Each term is 3 less than the one before, since 20 - 17 = 3, so the next term is 11 - 3 = 8. A sequence is allowed to go down, and here the term to term rule is subtract 3.", "topic": "sequences: continuing a descending sequence"}, {"id": "m19-sequences:q4", "level": "easy", "type": "mc", "q": "A sequence has the rule: the nth term is 6n + 1. What does the n stand for?", "options": ["The position of the term in the sequence", "The first term of the sequence", "The gap between one term and the next", "Any number you feel like choosing"], "answer": "The position of the term in the sequence", "hint": "What number would you put in to get the 5th term?", "explain": "The answer is the position of the term. To find the 5th term you put n = 5 in, giving 6 x 5 + 1 = 31. The gap between terms is the 6, the number in front of the n, and the first term is what you get when n = 1, which is 7.", "topic": "sequences: what n means in the nth term"}, {"id": "m19-sequences:q5", "level": "easy", "type": "text", "q": "The nth term of a sequence is 4n - 1. What is the first term?", "answer": "3", "accept": ["3", "3.0"], "hint": "The first term is position 1, so put n = 1 into the rule.", "explain": "The answer is 3. The first term sits in position 1, so put n = 1 into the rule: 4 x 1 - 1 = 4 - 1 = 3.", "topic": "sequences: using the nth term to find the first term"}, {"id": "m19-sequences:q6", "level": "easy", "type": "text", "q": "The nth term of a sequence is 4n - 1. What is the 10th term?", "answer": "39", "accept": ["39", "39.0"], "hint": "Put n = 10 into the rule. You do not need to write the sequence out.", "explain": "The answer is 39. Put n = 10 in: 4 x 10 = 40, then 40 - 1 = 39. This is the whole point of an nth term rule, since you land on the 10th term without listing the nine before it.", "topic": "sequences: using the nth term to find a term"}, {"id": "m19-sequences:q7", "level": "medium", "type": "text", "q": "A sequence starts 2, 7, 12, 17. Write down the nth term.", "answer": "5n - 3", "accept": ["5n - 3", "5n-3", "5n -3", "-3 + 5n"], "hint": "Find the step first. The step is the number that goes in front of the n.", "explain": "The answer is 5n - 3. The step is 7 - 2 = 5, so the rule starts with 5n. The 5n line is 5, 10, 15, 20 and the real terms 2, 7, 12, 17 are each 3 less, so the rule is 5n - 3. Test it: position 4 gives 5 x 4 - 3 = 17, which matches.", "topic": "sequences: finding the nth term of an ascending sequence"}, {"id": "m19-sequences:q8", "level": "medium", "type": "text", "q": "The nth term of a sequence is 5n - 3. What is the 20th term?", "answer": "97", "accept": ["97", "97.0"], "hint": "Put n = 20 in, and do the multiply before the subtract.", "explain": "The answer is 97. Put n = 20 in: 5 x 20 = 100, then 100 - 3 = 97. The multiply comes before the subtract, so working out 20 - 3 first and then multiplying would give 85, which is wrong.", "topic": "sequences: finding a distant term from the nth term"}, {"id": "m19-sequences:q9", "level": "medium", "type": "text", "q": "A sequence starts 8, 11, 14, 17. Write down the nth term.", "answer": "3n + 5", "accept": ["3n + 5", "3n+5", "5 + 3n", "3n +5"], "hint": "The step is 3, so start with 3n. What do you add to 3 to land on the first term?", "explain": "The answer is 3n + 5. The step is 11 - 8 = 3, so the rule starts with 3n. The 3n line is 3, 6, 9, 12 and the real terms 8, 11, 14, 17 are each 5 more, so the rule is 3n + 5. Test it: position 4 gives 3 x 4 + 5 = 17, which matches.", "topic": "sequences: finding the nth term of an ascending sequence"}, {"id": "m19-sequences:q10", "level": "medium", "type": "mc", "q": "A sequence starts 6, 10, 14, 18. Someone says the nth term is 4n. What is wrong with that?", "options": ["4n gives 4, 8, 12, 16, which is 2 short every time, so the rule is 4n + 2", "The step is not 4", "4n is right for the first term but wrong for the rest", "An nth term rule can never be just a number times n"], "answer": "4n gives 4, 8, 12, 16, which is 2 short every time, so the rule is 4n + 2", "hint": "Put n = 1 into 4n and see whether you land on the first term.", "explain": "The answer is that 4n is 2 short every time. The step of 4 is right, so starting with 4n is right, but the 4n line is 4, 8, 12, 16 while the sequence is 6, 10, 14, 18. Every real term is 2 more, so the rule is 4n + 2. Test it: position 3 gives 4 x 3 + 2 = 14, which matches. Getting the step right and then forgetting the adjustment is the usual mistake here.", "topic": "sequences: correcting an nth term that misses the adjustment"}, {"id": "m19-sequences:q11", "level": "medium", "type": "text", "q": "The nth term of a sequence is 6n - 5. What is the 100th term?", "answer": "595", "accept": ["595", "595.0"], "hint": "Put n = 100 in. Multiply first, then subtract.", "explain": "The answer is 595. Put n = 100 in: 6 x 100 = 600, then 600 - 5 = 595. Listing 100 terms would give the same answer and a hundred chances to slip, which is why the position to term rule exists.", "topic": "sequences: finding a distant term from the nth term"}, {"id": "m19-sequences:q12", "level": "medium", "type": "text", "q": "A sequence starts 9, 14, 19, 24. The number 54 is one of its terms. Which position is it in?", "answer": "10", "accept": ["10", "10.0", "10th", "the 10th", "position 10"], "hint": "Find the nth term first, then work backwards from 54 to the position.", "explain": "The answer is position 10. The step is 5, so the rule starts with 5n. The 5n line is 5, 10, 15, 20 and the real terms 9, 14, 19, 24 are each 4 more, so the nth term is 5n + 4. Now work backwards, the same move as the Working backwards session on Day 1. Set 5n + 4 = 54. Undo the add 4: 54 - 4 = 50. Undo the multiply by 5: 50 divided by 5 = 10. Check it forwards: 5 x 10 + 4 = 54, so 54 is the 10th term.", "topic": "sequences: working backwards from a term to its position"}, {"id": "m19-sequences:q13", "level": "stretch", "type": "mc", "q": "The sequence 2, 7, 12, 17 has the nth term 5n - 3. Is 90 ever a term of it? Pick the statement that is both true and gives the right reason.", "options": ["No, because 5n - 3 = 90 gives n = 18.6, and a position has to be a whole number", "Yes, because 90 is bigger than 17, so the sequence must reach it sooner or later", "Yes, because 90 divided by 5 is 18, which is a whole number", "No, because the sequence stops at 17"], "answer": "No, because 5n - 3 = 90 gives n = 18.6, and a position has to be a whole number", "hint": "Set 5n - 3 = 90 and work backwards to n. A position has to be a whole counting number.", "explain": "The answer is the first option. Work backwards: undo the subtract 3 to get 90 + 3 = 93, then undo the multiply by 5 to get 93 divided by 5 = 18.6. There is no 18.6th term, so 90 is not in the sequence. The terms either side are 87 in position 18 and 92 in position 19. There is a faster route as well, since every term ends in 2 or 7 and 90 ends in 0. Option 3 does correct arithmetic on the wrong number, because you have to undo the subtract 3 before you divide, and option 2 assumes a sequence hits every large number, which it does not.", "topic": "sequences: deciding whether a number is a term"}, {"id": "m19-sequences:q14", "level": "stretch", "type": "text", "q": "A sequence starts 100, 93, 86, 79 and carries on in the same way. What is the 15th term?", "answer": "2", "accept": ["2", "2.0"], "hint": "The sequence goes down 7 each time, so the rule contains -7n. Work out what to add to -7n to land on 100 when n = 1.", "explain": "The answer is 2. The step is 93 - 100 = -7, so the rule starts with -7n. The -7n line is -7, -14, -21, -28 and the real terms 100, 93, 86, 79 are each 107 more, so the nth term is 107 - 7n. Test it: position 4 gives 107 - 28 = 79, which matches. Now position 15: 7 x 15 = 105, and 107 - 105 = 2. Counting down in sevens from 100 gives the same answer, but that is 14 chances to slip.", "topic": "sequences: nth term of a descending sequence"}, {"id": "m19-sequences:q15", "level": "stretch", "type": "long", "marks": 5, "q": "A sequence starts 4, 11, 18, 25 and carries on in the same way. Work out the nth term, use it to find the 50th term, and decide whether 200 is a term and whether 150 is a term. Show how you decided.", "answer": "The step is 11 - 4 = 7, and 18 - 11 = 7 as well, so the rule starts with 7n. The 7n line is 7, 14, 21, 28 and the real terms are 4, 11, 18, 25, which are each 3 less, so the nth term is 7n - 3. I test it on a term I already have: position 4 gives 7 x 4 - 3 = 28 - 3 = 25, which matches. The 50th term is 7 x 50 - 3 = 350 - 3 = 347. For the last part I am given a term and asked for a position, so this is working backwards, the same move as the Working backwards session on Day 1. For 200: set 7n - 3 = 200, undo the subtract 3 to get 200 + 3 = 203, then undo the multiply by 7 to get 203 divided by 7 = 29. That is a whole number, so 200 is a term of the sequence and it sits in position 29. I check it forwards: 7 x 29 = 203, and 203 - 3 = 200. For 150: set 7n - 3 = 150, so 150 + 3 = 153, and 153 divided by 7 = 21.857 and so on, which is not a whole number. There is no such position, so 150 is not a term. The terms either side of it are 144 in position 21 and 151 in position 22.", "hint": "Find the step first, then the adjustment. For the last part, set the nth term equal to the number and undo the two steps in the opposite order.", "explain": "A full answer has five parts, one mark each. One, the nth term is 7n - 3, found from a step of 7 and the terms sitting 3 below the 7n line. Two, you test the rule on a term you already have, for example position 4 giving 25. Three, the 50th term is 7 x 50 - 3 = 347. Four, 200 is a term, shown by 200 + 3 = 203 and 203 divided by 7 = 29, a whole number, so it is the 29th term. Five, 150 is not a term, shown by 150 + 3 = 153 and 153 divided by 7 = 21.857, which is not whole. Answering yes or no with no working scores nothing on those last two parts, because there the working IS the answer.", "topic": "sequences: nth term, a distant term and testing two numbers for membership"}]}, "e9-sentence-control": {"id": "e9-sentence-control", "day": "Day 1", "subject": "English", "title": "Sentence control", "minutes": 25, "objective": "Name and build simple, compound and complex sentences, vary your openers, and place a short sentence on purpose so that it lands.", "extract": "PARAGRAPH A\nThe rescue boat left the harbour at six in the morning. The sea was rough and the wind came from the north. The crew searched the bay for the missing kayak for two hours. They found the kayak floating upside down near the rocks. The kayak had nobody in it. The crew searched the shoreline until the light went. They did not find the missing man. They came back into the harbour at ten at night.\n\nPARAGRAPH B\nAt six in the morning, the rescue boat left the harbour. The sea was rough, and the wind came hard out of the north. Because the kayak had last been seen drifting towards the rocks, the crew worked the open bay in slow lines for two hours before they turned that way. They found it in the end, floating upside down against the granite, rolling over with each swell. It was empty.\n\nSENTENCE BANK\n[1] The rope snapped.\n[2] The rope snapped, and the sledge went over the edge.\n[3] When the rope snapped, the sledge went over the edge.\n[4] Although the engine was dead, we kept steering.\n[5] Slowly, the water came up over the top step.", "teach": {"intro": ["There are three sentence types you have to be able to name and build. A simple sentence is one clause: The rope snapped. A compound sentence is two clauses that could each stand alone, joined by and, but, so or or: The rope snapped, and the sledge went over the edge. A complex sentence is a main clause plus a subordinate clause, which is a group of words that cannot stand alone: When the rope snapped, the sledge went over the edge. Say When the rope snapped on its own and it hangs in the air, waiting. That hanging feeling is how you spot a subordinate clause.", "Most writing goes flat for one reason, and it is not vocabulary. Every sentence starts with the subject. Look at Paragraph A: The boat, The sea, The crew, They, The kayak, The crew, They, They. Four other openers are available to you. Start with an adverb: Slowly, the water came up. Start with a subordinate clause: Because the tide was coming in, we ran. Start with a phrase saying where or when: Under the bridge, the current doubled. Start with an ing word: Gripping the rail, he counted the waves.", "Now the part that separates a grade 7 from a grade 9, which is length. A short sentence is not better than a long one. A short sentence is only powerful next to long ones. Write three long sentences of detail and then one of four words, and those four words shut like a door. Paragraph B does exactly that, and finishes on It was empty. You should be able to say why it works, not just that it works: the reader has built up speed through the long sentences, and the short one stops them dead on the thing that matters."], "example": {"problem": "Rewrite this so the important part lands: The thing about the room was that after he had finished speaking there was no sound in it at all.", "steps": ["Find the one idea underneath it. The idea is that the room went silent. Everything else is packing.", "Cut the packing. The thing about, after he had finished speaking, at all. None of those words are doing any work.", "Write the idea as a simple sentence, as short as you can get it. Nobody spoke.", "Now decide where it sits, because that is the whole trick. A short sentence only lands if long ones come first, so put the detail in front of it.", "Put the two parts together. He talked for a long time about the rota, about whose fault it was and about what would happen the next time somebody tried it. Nobody spoke."], "answer": "Nobody spoke. It works because the long sentence in front of it gives the reader speed, and the two word sentence stops them."}, "example2": {"problem": "Name the sentence type of each of these, and find the subordinate clause where there is one. (a) The tide turned. (b) The tide turned, but we kept fishing. (c) Because the tide turned, we kept fishing.", "steps": ["Start with (a). One clause, one verb, and it stands on its own. That is a simple sentence.", "Now (b). Split it at the joining word: The tide turned. We kept fishing. Both halves work alone, and they are joined by but. That is a compound sentence.", "Now (c). Try each half alone. We kept fishing works alone, so that is the main clause.", "Try the other half alone. Because the tide turned does not work alone, so that is the subordinate clause.", "A main clause plus a subordinate clause is a complex sentence."], "answer": "a is simple, b is compound, c is complex, and the subordinate clause in c is Because the tide turned."}, "keyfact": "Simple is one clause. Compound is two clauses joined by and, but, so or or. Complex is a main clause plus a subordinate clause that cannot stand alone. Vary your opener, and keep one short sentence back for the moment you want to land."}, "questions": [{"id": "e9-sentence-control:q1", "level": "easy", "type": "mc", "q": "Which sentence in the sentence bank is a simple sentence?", "options": ["[1] The rope snapped.", "[2] The rope snapped, and the sledge went over the edge.", "[3] When the rope snapped, the sledge went over the edge.", "[4] Although the engine was dead, we kept steering."], "answer": "[1] The rope snapped.", "hint": "A simple sentence has one clause only. Count the clauses.", "explain": "The answer is [1] The rope snapped. It has one subject, one verb, and it stands on its own, which is exactly what a simple sentence is. [2] has two clauses joined by and, so it is compound. [3] and [4] both start with a subordinate clause, When the rope snapped and Although the engine was dead, so they are complex.", "topic": "sentences: identifying a simple sentence"}, {"id": "e9-sentence-control:q2", "level": "easy", "type": "mc", "q": "Which sentence in the sentence bank is a compound sentence?", "options": ["[2] The rope snapped, and the sledge went over the edge.", "[1] The rope snapped.", "[3] When the rope snapped, the sledge went over the edge.", "[5] Slowly, the water came up over the top step."], "answer": "[2] The rope snapped, and the sledge went over the edge.", "hint": "Look for two halves that could each be a sentence on their own, joined by and, but, so or or.", "explain": "The answer is [2]. Split it at the joining word and you get The rope snapped and The sledge went over the edge. Both of those work alone, and they are joined by and, so the sentence is compound. [1] has only one clause. [3] starts with a subordinate clause, so it is complex. [5] is a simple sentence that happens to start with the adverb Slowly, and an opener does not change the type.", "topic": "sentences: identifying a compound sentence"}, {"id": "e9-sentence-control:q3", "level": "easy", "type": "mc", "q": "Which sentence in the sentence bank is a complex sentence?", "options": ["[4] Although the engine was dead, we kept steering.", "[1] The rope snapped.", "[2] The rope snapped, and the sledge went over the edge.", "[5] Slowly, the water came up over the top step."], "answer": "[4] Although the engine was dead, we kept steering.", "hint": "A complex sentence has a part that cannot stand on its own. Test each half.", "explain": "The answer is [4]. We kept steering works on its own, so that is the main clause. Although the engine was dead does not work on its own, so that is the subordinate clause, and a main clause plus a subordinate clause is a complex sentence. [1] is simple, [2] is compound, and [5] is simple with an adverb at the front.", "topic": "sentences: identifying a complex sentence"}, {"id": "e9-sentence-control:q4", "level": "easy", "type": "mc", "q": "Which of these groups of words cannot stand on its own as a sentence?", "options": ["Because the tide was coming in", "The tide was coming in", "We ran to the boat", "The engine was dead"], "answer": "Because the tide was coming in", "hint": "Say each one out loud and stop. Which one leaves you waiting for the rest?", "explain": "The answer is Because the tide was coming in. Say it and stop, and it hangs there, because the word Because promises something else is coming. That is a subordinate clause. The other three are complete on their own. Words like because, although, when, if, while, after and since are the usual signal that a subordinate clause has started.", "topic": "sentences: spotting a subordinate clause"}, {"id": "e9-sentence-control:q5", "level": "easy", "type": "text", "q": "Write the subordinate clause in sentence [4]: Although the engine was dead, we kept steering.", "answer": "Although the engine was dead", "accept": ["Although the engine was dead", "although the engine was dead", "Although the engine was dead,", "although the engine was dead,", "\"Although the engine was dead\"", "Although the engine was dead."], "hint": "It is the half that cannot survive on its own. Do not include the part that could be a sentence by itself.", "explain": "The answer is Although the engine was dead. Test both halves. We kept steering is a complete sentence, so it is the main clause. Although the engine was dead is not, because Although leaves you waiting, so it is the subordinate clause. A common slip here is to write out the whole sentence. The question asked for one clause, not both.", "topic": "sentences: naming the subordinate clause"}, {"id": "e9-sentence-control:q6", "level": "medium", "type": "mc", "q": "Every fact in Paragraph A is correct and every sentence is grammatically fine, but it reads flat. What is the main reason?", "options": ["Every sentence starts with the subject and every sentence is about the same length.", "It is written in the past tense.", "It does not use enough adjectives.", "The sentences are all too short."], "answer": "Every sentence starts with the subject and every sentence is about the same length.", "hint": "Read only the first two words of each sentence, one after the other.", "explain": "The answer is the first option. The openers run The boat, The sea, The crew, They, The kayak, The crew, They, They, and every sentence is between nine and thirteen words. The reader gets the same rhythm eight times, so nothing stands out. Past tense is correct and normal for this. Adding adjectives would not fix the rhythm. The sentences are not short, they are all the same medium length, which is the actual problem.", "topic": "sentences: diagnosing flat writing"}, {"id": "e9-sentence-control:q7", "level": "medium", "type": "text", "q": "Rewrite this sentence so that it starts with the subordinate clause instead of the subject: We ran to the boat because the tide was coming in.", "answer": "Because the tide was coming in, we ran to the boat.", "accept": ["Because the tide was coming in, we ran to the boat.", "Because the tide was coming in we ran to the boat.", "because the tide was coming in, we ran to the boat.", "Because the tide was coming in, we ran to the boat", "Because the tide was coming in we ran to the boat", "As the tide was coming in, we ran to the boat."], "hint": "Pick up the whole because part and move it to the front. A comma goes where the two clauses meet.", "explain": "The answer is Because the tide was coming in, we ran to the boat. The meaning has not changed at all, but the opener has, and now the sentence does not start with We. When a subordinate clause goes at the front, put a comma after it before the main clause. This single move is the fastest way to break a run of sentences that all start the same way.", "topic": "sentences: moving the subordinate clause to the front"}, {"id": "e9-sentence-control:q8", "level": "medium", "type": "mc", "q": "Which rewrite turns this flat sentence into a brief, controlled one? Flat sentence: It was the case that not one single person in the entire room made any sound whatsoever.", "options": ["Nobody spoke.", "Not one single person in the room made any sound at all.", "The room, which was full of people, was completely and utterly silent.", "There was no sound whatsoever from anybody who happened to be in the room."], "answer": "Nobody spoke.", "hint": "Find the one idea, then throw away every word that is not carrying it.", "explain": "The answer is Nobody spoke. Two words carry the whole idea. The second option is shorter than the original but still full of padding, with single, at all and in the room all doing nothing. The third adds a clause and two adverbs and gets longer. The fourth is the original with different padding. Cutting is not about sounding clever, it is about leaving only the words that carry meaning.", "topic": "sentences: cutting a flat sentence to a brief"}, {"id": "e9-sentence-control:q9", "level": "medium", "type": "text", "q": "Cut this to a simple sentence of three words or fewer, keeping the meaning: What happened next was that the whole of the engine simply stopped working.", "answer": "The engine died.", "accept": ["The engine died.", "The engine died", "the engine died", "The engine stopped.", "The engine stopped", "the engine stopped", "The engine failed.", "The engine failed", "the engine failed", "The engine cut out."], "hint": "Who or what is the sentence about, and what did it do? Everything else goes.", "explain": "The answer is The engine died, or The engine stopped, or The engine failed. Any of those is fine. The subject is the engine and the action is that it stopped, so those are the only two ideas you have to keep. What happened next was that, the whole of and simply are all padding. Note that the three word version is not just shorter, it is also faster, which is what makes it useful at a tense moment.", "topic": "sentences: cutting to a brief simple sentence"}, {"id": "e9-sentence-control:q10", "level": "medium", "type": "mc", "q": "Paragraph B ends with the three word sentence It was empty. Why does it hit so hard?", "options": ["Three long sentences come before it, so the sudden stop lands on the one fact that matters.", "It is the only sentence in the paragraph that has a verb in it.", "Short sentences are always stronger than long sentences.", "It has no adjectives in it."], "answer": "Three long sentences come before it, so the sudden stop lands on the one fact that matters.", "hint": "Cover up the three sentences before it and read it on its own. Does it still hit?", "explain": "The answer is the first option. On its own, It was empty is nothing much. It only works because the reader has just come through three long sentences full of movement, so the sudden stop feels like the boat cutting its engine. That is the whole point of sentence control: effect comes from contrast, not from the sentence itself. Every sentence in the paragraph has a verb, and short sentences are only strong when they are surrounded by long ones. Put eight short sentences in a row and you get a different kind of flat.", "topic": "sentences: why a short sentence lands"}, {"id": "e9-sentence-control:q11", "level": "stretch", "type": "mc", "q": "Paragraph B opens with At six in the morning, the rescue boat left the harbour. What kind of opener is that?", "options": ["A phrase saying when, placed in front of the subject.", "A subordinate clause.", "An ing word.", "The subject of the sentence."], "answer": "A phrase saying when, placed in front of the subject.", "hint": "Ask whether that opening group of words has a verb in it. If it has no verb, it is a phrase, not a clause.", "explain": "The answer is that it is a phrase saying when. At six in the morning has no verb in it, so it cannot be a clause of any kind, and it tells you the time, so it is a when phrase. A subordinate clause would need a verb, as in When the light went. An ing opener would look like Pushing off from the wall. The subject of the sentence is the rescue boat, and in Paragraph A that subject came first, which is exactly what Paragraph B has changed.", "topic": "sentences: naming the opener type"}, {"id": "e9-sentence-control:q12", "level": "stretch", "type": "mc", "q": "Here are four versions of the same moment. Which one shows real sentence control?", "options": ["He had been sitting in the same spot since four, watching the float and the flat brown water and the wasps going over it, thinking about nothing much at all. Then the line went tight, the reel started to scream, and he was on his feet before he knew he had stood up. It ran for thirty seconds. Then it stopped.", "He had been sitting in the same spot since four, and the float had not moved, and he was thinking about nothing much at all, and then the line went tight and the reel started to scream and he was on his feet before he knew he had stood up, and it ran for thirty seconds and then it stopped.", "He sat since four. The float did not move. The line went tight. The reel screamed. He stood up. It ran. It stopped.", "He sat in the same spot since four. He watched the float. He thought about nothing. He felt the line go tight. He heard the reel scream. He stood up. He waited. He lost it."], "answer": "He had been sitting in the same spot since four, watching the float and the flat brown water and the wasps going over it, thinking about nothing much at all. Then the line went tight, the reel started to scream, and he was on his feet before he knew he had stood up. It ran for thirty seconds. Then it stopped.", "hint": "Control means the lengths change on purpose. Check how long each sentence is, and check what each one starts with.", "explain": "The answer is the first option. It runs long, long, short, short, so the two short sentences at the end land against the two long ones in front of them, and the piece speeds up exactly where the fish does. The second option is one enormous sentence held together with five ands, so nothing stands out. The third is seven short sentences in a row, which is just as flat as seven long ones, only more out of breath. The fourth starts every single sentence with He, which is the Paragraph A problem again. Variety on its own is not the point. Variety that matches what is happening is the point.", "topic": "sentences: recognising deliberate variation"}, {"id": "e9-sentence-control:q13", "level": "stretch", "type": "text", "q": "Name the type of this sentence, using one word: simple, compound or complex. When the light went, the search stopped.", "answer": "complex", "accept": ["complex", "Complex", "a complex sentence", "complex sentence", "Complex sentence", "it is complex"], "hint": "Test both halves on their own. If one of them cannot stand alone, you have your answer.", "explain": "The answer is complex. The search stopped stands alone, so it is the main clause. When the light went does not stand alone, because When leaves you waiting, so it is a subordinate clause. Main clause plus subordinate clause equals complex. It is not compound, because a compound sentence needs both halves to be able to stand alone, joined by and, but, so or or.", "topic": "sentences: naming a sentence type"}, {"id": "e9-sentence-control:q14", "level": "stretch", "type": "long", "q": "Rewrite Paragraph A so that it shows real sentence control. Rules: include at least one simple sentence, one compound sentence and one complex sentence. At least two sentences must start with something other than the subject. Finish with a short sentence you have placed deliberately. Keep every fact from Paragraph A and invent nothing. Then, underneath, write one sentence explaining why you put your short sentence where you put it.", "marks": 8, "answer": "At six in the morning, the rescue boat left the harbour. The sea was rough, and the wind came hard out of the north. Because the kayak had last been seen drifting towards the rocks, the crew worked the open bay in slow lines for two hours before they turned that way. They found it in the end, floating upside down against the granite, rolling over with each swell. It was empty. Until the light went they walked the shoreline in pairs, shouting a name into the wind and getting nothing back, and it was ten at night before they came into the harbour with the deck lights on and nobody standing on the bow. They had found the kayak. They had not found him.\n\nI put They had not found him at the very end, straight after the longest sentence in the paragraph, because the reader has been moving through the whole search at speed and that is the exact moment I want them to stop.", "hint": "Do it in two passes. First fix the openers, one sentence at a time. Then decide which single fact deserves the short sentence, and build the long ones so that they run into it.", "explain": "A full mark answer has eight things in it. One mark for a correct simple sentence. One mark for a correct compound sentence, with two halves that could each stand alone, joined by and, but, so or or. One mark for a correct complex sentence with a real subordinate clause. One mark for at least two sentences opening with something other than the subject, such as a when phrase, a subordinate clause, an adverb or an ing word. Two marks for the short sentence: one for it genuinely being short, about six words or fewer, and one for it sitting straight after a long sentence rather than being buried in the middle of other short ones. One mark for keeping every fact from Paragraph A, with nothing dropped and nothing invented. One mark for the explanation sentence saying what the contrast does to the reader, not just that it sounds better. Take a mark off if you have written the whole thing in short sentences, because that is not control, that is just a different kind of flat.", "topic": "sentences: rewriting a flat paragraph with deliberate control"}]}, "e10-inference": {"id": "e10-inference", "day": "Day 2", "subject": "English", "title": "Reading between the lines", "minutes": 25, "objective": "Work out what a writer has left unsaid, prove it with a short quotation, and write it up as point, evidence, explain.", "extract": "THE VAN\n\nDad was home at eleven. He never used to be home at eleven.\n\nI heard the front door before I saw him, and I knew it was him from the way he shut it, slow, like he was trying not to wake somebody up. Nobody else was in the house. I came down and he was standing in the hall in his work boots, still in his coat, holding his flask in both hands like it was hot, which it could not have been.\n\n'You are back early,' I said.\n\n'Bit quiet,' he said. 'They sent a few of us home.'\n\nHe went into the kitchen and put the flask on the side. Then he picked it up again, put it in the sink, and ran the tap over it for longer than a flask needs.\n\nI looked out of the front window. The van was not on the drive.\n\n'Where is the van?'\n\n'Yard,' he said. 'Easier.'\n\nHe had never once left the van at the yard in six years. He used to say that a man who leaves his van at the yard is a man who has been told to.\n\nI did not say that.\n\nHe made two teas without asking whether I wanted one, and he got the milk out and put it back twice. Then he sat down at the table with his coat still on, and he looked at the sugar bowl for a while.\n\n'Have you got homework?' he said.\n\n'Done it.'\n\n'Good lad.'\n\nUpstairs I could hear the boiler ticking. Down there nobody said anything for about a minute, and I counted it, because counting was easier than looking at him.\n\nThen he said, 'Do not say anything to your mother tonight. Let her get in first. Let her have her tea.'\n\n'Say anything about what?'\n\nHe looked up at me then, and he almost smiled, the way you smile at somebody who has worked out something you were hoping they would not.\n\n'About me being home early,' he said.\n\nHe drank his tea with his coat on. I have never seen him do that before or since.", "teach": {"intro": ["There are two kinds of reading question and they need two different jobs. Retrieval means finding something that is actually printed on the page, like what time Dad got home. Inference means working out something the writer has deliberately not printed, using the evidence that is there. Nobody in this extract ever says that Dad has lost his job. Every reader knows he has.", "Inference is not guessing. A guess has nothing under it. An inference has evidence under it, and you have to be able to point at that evidence. So use point, evidence, explain, which people shorten to PEE. Point: answer the question in one sentence. Evidence: a short quotation, a few words, not half a paragraph. Explain: say what those exact words suggest, and what effect that has on the reader.", "The explain part is where the marks actually are, and it is the part everybody rushes. Zoom in on one word. Do not write this shows he was sad. Write the word longer suggests he is filling time so that he does not have to talk. Two habits get you to the top band. Always ask why the writer chose that word and not a plainer one, and always end by saying what it does to the reader."], "example": {"problem": "How does the writer show that Dad does not want to be noticed when he comes home? Answer using point, evidence, explain.", "steps": ["Point first. Answer the actual question in one sentence, with no quotation yet. The writer shows that Dad is trying to come home without being seen.", "Evidence next. Find the shortest piece of text that proves it. He shuts the door 'slow, like he was trying not to wake somebody up'.", "Check the evidence really does prove the point. It does, and there is a second detail sitting next to it that makes it stronger: nobody else is in the house, so there is nobody to wake.", "Explain, and start by zooming in on one word. The word slow suggests he is handling the door carefully so that it makes no sound at all.", "Finish the explain by saying what it does to the reader. Since there is nobody in the house to disturb, the only person he can be hiding from is his son, and that leaves the reader uneasy before a single fact has been given."], "answer": "The writer shows that Dad is trying to come home without being noticed. He shuts the front door 'slow, like he was trying not to wake somebody up'. The word slow suggests he is handling the door so that it makes no sound, and because nobody else is in the house, the only person he can be hiding from is his own son. That leaves the reader uneasy before anything has been explained."}, "example2": {"problem": "What does the detail of the coat suggest? Dad 'sat down at the table with his coat still on'.", "steps": ["Ask what normally happens. A man who comes home takes his coat off. That is the ordinary version of this action.", "Now look at what the writer has changed. He sits down, which means staying, but he keeps the coat on, which means leaving.", "Name the contradiction, because the contradiction is the point. The two halves of the action disagree with each other.", "Turn that into a suggestion about the character. It suggests he has not decided to be home, as though part of him is still at work and expects to be called back.", "Say what it does to the reader. The reader sees a man who does not know what to do with himself, which is far more uncomfortable than being told that he is upset."], "answer": "Sitting down but keeping his coat on suggests he has not accepted that he is home, as if part of him is still at work, and it makes the reader feel that he does not know what to do with himself."}, "keyfact": "Inference is a claim with evidence under it. Point in one sentence, a short quotation, then explain by zooming in on one word and saying what it does to the reader."}, "questions": [{"id": "e10-inference:q1", "level": "easy", "type": "mc", "q": "What time did Dad get home?", "options": ["Eleven", "Six", "Four", "Ten"], "answer": "Eleven", "hint": "This one is printed in the first line. You are not working anything out.", "explain": "The answer is eleven. The first sentence says it directly: Dad was home at eleven. This is a retrieval question, which means the answer is on the page and you just have to find it. Retrieval questions are quick marks, so never lose one by reading past the line that contains the answer.", "topic": "inference: retrieval from the text"}, {"id": "e10-inference:q2", "level": "easy", "type": "text", "q": "Dad says the van is at the yard. Write the single word he gives as his reason.", "answer": "Easier", "accept": ["Easier", "easier", "'Easier'", "Easier.", "easier."], "hint": "His whole answer about the van is three words long. The reason is the last one.", "explain": "The answer is Easier. His full reply is 'Yard,' he said. 'Easier.' One word is doing all the work of an explanation, which is worth noticing. A man who has a genuine, ordinary reason usually gives you a sentence. A man who does not want to be asked again gives you one word.", "topic": "inference: retrieval of a single word"}, {"id": "e10-inference:q3", "level": "easy", "type": "mc", "q": "What does inference mean?", "options": ["Working out something the writer has not said, using evidence from the text.", "Copying out the part of the text that answers the question.", "Guessing what might happen next in the story.", "Giving your own opinion about whether you liked the writing."], "answer": "Working out something the writer has not said, using evidence from the text.", "hint": "The important half is the second half. What has to be under it?", "explain": "The answer is the first option. Inference is a conclusion the writer has left for you to reach, and the evidence for it is on the page even though the conclusion is not. Copying out the text is retrieval, not inference. Guessing what happens next is prediction, and it usually has no evidence under it. Saying whether you liked it is opinion, and it earns nothing in a reading question.", "topic": "inference: what inference means"}, {"id": "e10-inference:q4", "level": "easy", "type": "mc", "q": "Which of these questions needs inference rather than retrieval?", "options": ["What does Dad's behaviour in the kitchen suggest about how he is feeling?", "What time did Dad get home?", "Where does Dad say the van is?", "What is Dad holding when the narrator comes downstairs?"], "answer": "What does Dad's behaviour in the kitchen suggest about how he is feeling?", "hint": "Three of these can be answered by pointing at a line. One cannot.", "explain": "The answer is the first option. Nowhere does the extract say how Dad feels, so you have to work it out from what he does, which is inference. The other three are all printed on the page: eleven, the yard, and his flask. The word suggest in a question is almost always the signal that inference is wanted.", "topic": "inference: retrieval versus inference"}, {"id": "e10-inference:q5", "level": "easy", "type": "mc", "q": "Dad shuts the front door 'slow, like he was trying not to wake somebody up', and the narrator tells you that nobody else is in the house. What does this suggest?", "options": ["He does not want to be noticed coming home.", "He is being careful because the door is broken.", "He is worried about waking the neighbours through the wall.", "He is tired after a long shift and moving slowly."], "answer": "He does not want to be noticed coming home.", "hint": "The detail that does the work is the one about nobody else being in the house. Ask who is left to hide from.", "explain": "The answer is that he does not want to be noticed. The writer puts the empty house right next to the careful door on purpose. If there is nobody to wake, then the care is not about noise, it is about not being seen. Nothing in the text says the door is broken or that anybody is next door, and a tired man does not usually shut a door more quietly, he shuts it harder. Always check whether the writer has placed two details side by side, because that is normally where the inference is.", "topic": "inference: inferring from a small action"}, {"id": "e10-inference:q6", "level": "medium", "type": "mc", "q": "Why does the detail about the van being left at the yard matter so much?", "options": ["Dad used to say that a man who leaves his van at the yard is a man who has been told to, so leaving it there suggests he has been laid off.", "It shows that Dad walked home, which is why he was tired.", "It shows that the van has broken down and is being repaired.", "It shows that Dad has been given a better van to use instead."], "answer": "Dad used to say that a man who leaves his van at the yard is a man who has been told to, so leaving it there suggests he has been laid off.", "hint": "The writer gives you Dad's own words about vans for a reason. Put them next to what he has just done.", "explain": "The answer is the first option. The writer hands you the rule in Dad's own voice, that a man who leaves his van at the yard has been told to, and then shows you Dad doing exactly that after six years of never doing it. You are meant to put the two together yourself. Nothing in the extract mentions a breakdown, a walk home or a new van, so those are guesses with nothing under them. This is the most important habit in inference: when a writer plants a rule, watch for the moment somebody breaks it.", "topic": "inference: inferring from what a character has said before"}, {"id": "e10-inference:q7", "level": "medium", "type": "mc", "q": "Straight after remembering what Dad used to say about vans, the narrator writes one short line: I did not say that. What does this tell you about the narrator?", "options": ["He has already worked out what the van means and is choosing not to make his dad admit it.", "He has not understood what leaving the van at the yard means.", "He is frightened of his dad and does not dare speak.", "He has forgotten what his dad used to say about vans."], "answer": "He has already worked out what the van means and is choosing not to make his dad admit it.", "hint": "You cannot decide not to say something unless you have already thought it.", "explain": "The answer is the first option. The sentence proves two things at once. First, the thought was there, because you cannot hold something back that you never thought. Second, he made a decision, which is kindness rather than confusion. He clearly has not forgotten the rule, because he has just repeated it to the reader. Nothing suggests fear, because he asks his dad direct questions elsewhere. The writer also gives the line a paragraph of its own, and putting four words alone on a line is how a writer tells you that something matters.", "topic": "inference: inferring from what a narrator holds back"}, {"id": "e10-inference:q8", "level": "medium", "type": "text", "q": "PEE is the structure you use for an inference answer. Write what the three letters stand for.", "answer": "point, evidence, explain", "accept": ["point, evidence, explain", "point evidence explain", "Point, evidence, explain", "Point, Evidence, Explain", "point, evidence, explanation", "point, evidence and explain", "point / evidence / explain"], "hint": "Three steps. Your answer, your proof, then what the proof suggests.", "explain": "The answer is point, evidence, explain. Point is your answer to the question in one sentence. Evidence is a short quotation from the text, a few words rather than a whole line. Explain is what those words suggest and what they do to the reader. Most students write a decent point, a decent quotation, and then stop, which is why they lose the marks that are all sitting in the third part.", "topic": "inference: the point evidence explain structure"}, {"id": "e10-inference:q9", "level": "medium", "type": "mc", "q": "You want to prove the point that Dad is not thinking clearly. Which quotation is the sharpest evidence?", "options": ["he got the milk out and put it back twice", "He made two teas", "Dad was home at eleven", "I came down and he was standing in the hall"], "answer": "he got the milk out and put it back twice", "hint": "Which one shows an ordinary action going wrong, rather than just an ordinary action?", "explain": "The answer is that he got the milk out and put it back twice. The word twice is what makes it evidence, because it turns a normal action into a repeated, pointless one, which is what a distracted mind looks like from the outside. Making two teas is just making tea. Coming home at eleven proves that something is unusual, but not that he is distracted. Standing in the hall proves nothing at all. Good evidence is short and it contains the exact word your explanation is going to talk about.", "topic": "inference: choosing the sharpest evidence"}, {"id": "e10-inference:q10", "level": "medium", "type": "mc", "q": "Which of these answers follows point, evidence, explain properly?", "options": ["Dad is trying to avoid talking. The writer says he ran the tap over the flask 'for longer than a flask needs'. The word longer suggests he is filling time so that he does not have to speak, which makes the reader feel the silence in that kitchen.", "Dad is trying to avoid talking, and you can tell that from the way he behaves in the kitchen throughout the whole scene.", "The writer says he ran the tap over the flask 'for longer than a flask needs'.", "'He went into the kitchen and put the flask on the side. Then he picked it up again, put it in the sink, and ran the tap over it for longer than a flask needs.' This shows what he is like."], "answer": "Dad is trying to avoid talking. The writer says he ran the tap over the flask 'for longer than a flask needs'. The word longer suggests he is filling time so that he does not have to speak, which makes the reader feel the silence in that kitchen.", "hint": "Count the three parts in each answer. Which one has all three?", "explain": "The answer is the first option. It gives a point, then a short quotation, then an explanation that names one word and says what it does to the reader. The second option is a point with no evidence at all, which is opinion. The third is evidence with no point and no explanation, which is copying. The fourth quotes two whole sentences and then adds this shows what he is like, which explains nothing. Long quotations are a warning sign, because they usually mean the writer of the answer has not decided which words actually matter.", "topic": "inference: recognising a full PEE answer"}, {"id": "e10-inference:q11", "level": "stretch", "type": "mc", "q": "The extract opens with two lines: Dad was home at eleven. He never used to be home at eleven. How does the writer make the reader uneasy straight away?", "options": ["The second sentence repeats the time and tells you it is not normal, so the reader knows something is wrong before they know what.", "The sentences are long and slow, which builds atmosphere.", "The writer uses several adjectives to describe the house.", "The writer explains immediately that Dad has lost his job."], "answer": "The second sentence repeats the time and tells you it is not normal, so the reader knows something is wrong before they know what.", "hint": "Ask what the second sentence adds. It has no new fact in it, so what is it for?", "explain": "The answer is the first option. The second sentence gives no new information at all. Its only job is to take the time from the first sentence and mark it as wrong, and repeating eleven is what forces the reader to stare at it. That gap between knowing something is wrong and knowing what it is holds tension for the rest of the extract. Both sentences are short, not long. There are almost no adjectives anywhere in the extract, which is deliberate. And the writer never explains the job at all, which is exactly why the reader keeps reading.", "topic": "inference: how the writer creates unease"}, {"id": "e10-inference:q12", "level": "stretch", "type": "text", "q": "Near the end, the narrator says his dad 'almost smiled'. Write the single word that tells you the smile was not a real one.", "answer": "almost", "accept": ["almost", "Almost", "'almost'", "almost.", "the word almost"], "hint": "One word in that phrase cancels the other.", "explain": "The answer is almost. Smiled on its own would mean the moment was fine. Almost takes it back and leaves you with the shape of a smile and none of the feeling. That is exactly the sort of word to build an explanation on, because it is the writer choosing a small qualifier instead of writing the plain word smiled. When you are hunting for evidence, look for the small words that cancel or soften what is next to them: almost, nearly, hardly, still, only, just.", "topic": "inference: zooming in on one word"}, {"id": "e10-inference:q13", "level": "stretch", "type": "mc", "q": "All four of these are explaining the same evidence, that Dad 'sat down at the table with his coat still on'. Which explanation is the strongest?", "options": ["Keeping the coat on while sitting down suggests he has not accepted being home, as if part of him is still at work, and it makes the reader feel that he does not know what to do with himself.", "This shows that Dad was cold in the house.", "This is a good piece of description because it feels realistic and true to life.", "The writer says he sat down at the table with his coat still on, which means that he did not take his coat off."], "answer": "Keeping the coat on while sitting down suggests he has not accepted being home, as if part of him is still at work, and it makes the reader feel that he does not know what to do with himself.", "hint": "One of these repeats the quotation, one praises the writing, one invents a fact. Only one says what the detail suggests and what it does.", "explain": "The answer is the first option. It names what the detail suggests, it uses the word suggests rather than pretending to be certain, and it ends on the effect on the reader. The second option invents a fact, because nothing in the extract says the house is cold. The third praises the writing instead of analysing it, which earns nothing. The fourth just says the quotation again in different words, which is the single most common way to write four lines and score zero.", "topic": "inference: writing a strong explanation"}, {"id": "e10-inference:q14", "level": "stretch", "type": "long", "q": "The writer never once says what has happened to Dad. Write three paragraphs explaining how the writer makes you feel that something has gone badly wrong for him. Use point, evidence, explain in every paragraph, use a different piece of evidence each time, and keep every quotation short.", "marks": 9, "answer": "The writer makes you feel that Dad is ashamed of being home. When he comes in, he shuts the door 'slow, like he was trying not to wake somebody up', even though the narrator tells us that nobody else is in the house. The word slow suggests he is handling the door so that it makes no sound, and since there is nobody to wake, the only person he can be avoiding is his own son. That leaves the reader uncomfortable before a single fact has been explained.\n\nThe writer also shows a man who cannot settle. In the kitchen he 'got the milk out and put it back twice', and he runs the tap over the flask 'for longer than a flask needs'. Twice is the word doing the work, because it turns an ordinary action into one he is repeating without noticing, and longer suggests he is filling time rather than washing anything. The reader is watching a man use up minutes so that he does not have to speak.\n\nMost of all, the writer uses what is not said. The narrator remembers that 'a man who leaves his van at the yard is a man who has been told to', and then adds only 'I did not say that.' The short sentence suggests he has already worked out that his dad has been laid off and has decided not to make him admit it out loud. The reader is left holding news that neither character will say, and that silence is what makes the last line, where Dad drinks his tea with his coat on, so uncomfortable.", "hint": "Pick your three pieces of evidence before you write a word, and make sure they are from three different parts of the extract. In each paragraph, decide which single word you are going to talk about.", "explain": "Mark yourself three marks per paragraph, nine in total. One mark for a point that answers the question in a sentence, without a quotation in it. One mark for a short quotation, roughly ten words or fewer, that genuinely proves the point. One mark for an explanation that names a specific word, says what it suggests, and finishes on the effect on the reader. Lose the third mark if the explanation only repeats the quotation in different words, or says this shows he is sad with nothing about the writer's choices. Lose a mark overall if two of your three paragraphs use evidence from the same moment, because the question asks you to show that the pattern runs through the whole extract. Strong evidence to choose from includes the repeated eleven in the opening, the door, the flask in both hands, the tap running too long, the milk put back twice, the one word answer 'Easier', the van at the yard against Dad's own rule, 'I did not say that', 'almost smiled', and drinking tea with his coat on. Do not retell the story. If a sentence of yours could be swapped for a sentence of the extract, it is retelling, not analysis.", "topic": "inference: writing three point evidence explain paragraphs"}]}, "e11-persuasive": {"id": "e11-persuasive", "day": "Day 3", "subject": "English", "title": "Writing to persuade", "minutes": 30, "objective": "Name and deploy direct address, the rule of three, the rhetorical question, the anecdote, and a counter argument answered by a rebuttal.", "extract": "SPEECH: THE POOL ON MILL LANE\nEvery sentence is numbered so that you can refer to it.\n\n[1] The council wants to close the pool on Mill Lane, and I am here to ask that it does not happen.\n[2] You have all walked past that building.\n[3] Some of you learned to swim in it.\n[4] I did.\n[5] I was seven, I could not put my face in the water, and a woman called Pat stood in the shallow end with me for six weeks until I could.\n[6] Now, I understand the argument for closing it.\n[7] The roof needs work, the heating bill is enormous, and the council has less money every year. That is all true.\n[8] But a pool is not a luxury. A pool is where a child learns the one skill that can keep them alive.\n[9] Are we really going to tell the next seven year old that the sums did not add up?\n[10] Close this pool and you close the lessons, you close the club, and you close the only warm room some of these children sit in all week.\n[11] So write to the council, come to the meeting on the tenth, and tell them what that building is actually for.\n[12] Do not let them turn it into a car park.", "teach": {"intro": ["Persuasive writing is not shouting and it is not a pile of adjectives. It is a small set of moves that you choose on purpose, and you should be able to name each one as you use it. Five moves do nearly all the work.", "Direct address means talking straight at the reader using the word you: You have all walked past that building. The rule of three means listing three things, because three has a rhythm that two does not and four loses: you close the lessons, you close the club, you close the only warm room some of these children sit in all week. A rhetorical question is a question you do not want answered, because the answer is obvious and the reader supplies it themselves: Are we really going to tell the next seven year old that the sums did not add up? An anecdote is one short story about one real person, used to give a general claim a face: a woman called Pat stood in the shallow end for six weeks.", "The fifth move is the strongest one, and it is the one almost everybody skips. Say the other side's best point out loud, agree that the true part of it is true, and then answer it. That is a counter argument followed by a rebuttal. It works because a reader who thinks you have not considered the other side stops trusting you, and once trust is gone nothing else you write can land. The shape is simple: I understand X. That is true. But Y. Two rules go with it. Concede something real, never something silly that nobody argued. And always answer it, because a concession you never come back from is just you agreeing with the other side."], "example": {"problem": "Turn this flat sentence into persuasive writing: The pool should stay open because it is useful.", "steps": ["Decide who you are talking to, then talk to them. Swap it is useful for something aimed straight at them: You have all walked past that building.", "Give the claim a face. Nobody is moved by useful, so use one short anecdote about one person: I was seven, and I could not put my face in the water.", "Now show the cost of losing it, using the rule of three, and build from smallest to biggest: Close this pool and you close the lessons, you close the club, and you close the only warm room some of these children sit in all week.", "Finish short. A long sentence cannot be a punch, so end on a command of a few words: Do not let them turn it into a car park.", "Read it back and name each move in your head. Direct address, anecdote, rule of three, short command. If you cannot name a
