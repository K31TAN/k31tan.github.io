<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Study OS">
<title>Study OS</title>
<style>
:root{--bg:#0f1215;--panel:#171b20;--panel2:#1e242b;--line:#2a323b;--ink:#e8edf2;--dim:#93a1b0;--faint:#5e6b78;
--accent:#4a9eff;--good:#3ecf8e;--bad:#ff6b6b;--warn:#f0b429;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* Question text cannot be selected, so it cannot be copied into a search box.
   Anything he has to type into stays fully selectable and editable. */
.q,.qmeta,.opts,.opt,.extract,details.extract,.hint,.fb,.rev,.tp{
  -webkit-user-select:none;-moz-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:17px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:780px;margin:0 auto;padding:16px 16px 90px}
h1,h2,h3{line-height:1.25;margin:0}h1{font-size:23px;font-weight:650;letter-spacing:-.2px}
h2{font-size:19px;font-weight:620}h3{font-size:16px;font-weight:600}
.muted{color:var(--dim)}.faint{color:var(--faint);font-size:14px}.small{font-size:14px}
header{position:sticky;top:0;z-index:20;background:rgba(15,18,21,.94);backdrop-filter:saturate(160%) blur(12px);
border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.hd{max-width:780px;margin:0 auto;display:flex;align-items:center;gap:12px}
.hd .t{flex:1;min-width:0}.hd .t div:first-child{font-weight:650;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:5px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-top:9px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .35s ease}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
.card.tight{padding:13px 15px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.btn{display:block;width:100%;min-height:52px;padding:14px 16px;background:var(--accent);color:#06121f;
border-radius:12px;font-weight:650;font-size:17px;text-align:center;margin-top:12px}
.btn:disabled{opacity:.35}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:550}
.btn.warn{background:var(--warn);color:#1a1200}
.daylist{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.day{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);
border-radius:var(--r);padding:15px 16px;width:100%;text-align:left}
.day .n{width:44px;height:44px;flex:0 0 44px;border-radius:11px;background:var(--panel2);display:flex;
align-items:center;justify-content:center;font-weight:650;font-size:15px;color:var(--dim)}
.day.done .n{background:rgba(62,207,142,.14);color:var(--good)}
.day .g{flex:1;min-width:0}.chev{color:var(--faint);font-size:20px}
.blk{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
.blk .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.pill{display:inline-block;padding:4px 10px;border-radius:99px;font-size:12.5px;font-weight:620;
background:var(--panel2);color:var(--dim);white-space:nowrap}
.pill.good{background:rgba(62,207,142,.14);color:var(--good)}
.pill.bad{background:rgba(255,107,107,.14);color:var(--bad)}
.pill.warn{background:rgba(240,180,41,.14);color:var(--warn)}
.pill.acc{background:rgba(74,158,255,.14);color:var(--accent)}
.extract{background:var(--panel2);border-left:3px solid var(--accent);border-radius:8px;padding:14px 15px;margin:14px 0;font-size:16px;line-height:1.6}
details.extract{white-space:normal}
details.extract>summary{list-style:none;cursor:pointer;font-size:13px;letter-spacing:.6px;text-transform:uppercase;
color:var(--dim);font-weight:650;min-height:26px;display:flex;align-items:center;flex-wrap:wrap;gap:2px}
details.extract>summary::-webkit-details-marker{display:none}
details.extract>summary::after{content:'  show';margin-left:auto;color:var(--accent);text-transform:none;letter-spacing:0;font-size:14px}
details.extract[open]>summary::after{content:'  hide'}
details.extract>div{white-space:pre-wrap;margin-top:10px}
.teach{background:linear-gradient(180deg,rgba(74,158,255,.07),transparent);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:12px 0}
.teach p{margin:0 0 10px}
.eg{background:var(--panel2);border-radius:10px;padding:14px;margin-top:12px}
.eg .lb{font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--dim);font-weight:650;margin-bottom:8px}
.eg ol{margin:8px 0 0;padding-left:20px}.eg li{margin:5px 0}
.kf{border-left:3px solid var(--warn);background:rgba(240,180,41,.07);border-radius:8px;padding:12px 14px;margin-top:14px;font-size:15.5px}
.q{font-size:18.5px;line-height:1.5;margin:14px 0 4px;white-space:pre-wrap}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;min-height:52px;padding:13px 15px;
background:var(--panel2);border:1.5px solid transparent;border-radius:12px;line-height:1.45}
.opt .k{width:26px;height:26px;flex:0 0 26px;border-radius:7px;background:rgba(255,255,255,.06);display:flex;
align-items:center;justify-content:center;font-size:13px;font-weight:650;color:var(--dim);margin-top:1px}
.opt.sel{border-color:var(--accent);background:rgba(74,158,255,.1)}
.opt.sel .k{background:var(--accent);color:#06121f}
.opt.ok{border-color:var(--good);background:rgba(62,207,142,.12)}
.opt.ok .k{background:var(--good);color:#06121f}
.opt.no{border-color:var(--bad);background:rgba(255,107,107,.1)}
.opt.no .k{background:var(--bad);color:#1a0505}
.opt[disabled]{opacity:.85}
input[type=text]{width:100%;min-height:54px;padding:14px 15px;font-size:17px;background:var(--panel2);
border:1.5px solid var(--line);border-radius:12px;color:var(--ink);margin-top:14px;-webkit-appearance:none}
input[type=text]:focus{outline:0;border-color:var(--accent)}
input.ok{border-color:var(--good)}input.no{border-color:var(--bad)}
textarea{width:100%;min-height:200px;padding:14px 15px;font-size:17px;line-height:1.6;background:var(--panel2);
border:1.5px solid var(--line);border-radius:12px;color:var(--ink);margin-top:12px;resize:vertical;-webkit-appearance:none;font-family:inherit}
textarea:focus{outline:0;border-color:var(--accent)}
select{width:100%;min-height:50px;padding:12px 14px;font-size:16px;background:var(--panel2);border:1.5px solid var(--line);
border-radius:12px;color:var(--ink);margin-top:10px;-webkit-appearance:none}
.qmeta{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13.5px;color:var(--faint)}
.fb{border-radius:11px;padding:14px 15px;margin-top:14px;font-size:15.5px;line-height:1.55;white-space:pre-wrap}
.fb.ok{background:rgba(62,207,142,.1);border:1px solid rgba(62,207,142,.3)}
.fb.no{background:rgba(255,107,107,.09);border:1px solid rgba(255,107,107,.3)}
.fb b{display:block;margin-bottom:6px;font-size:15px}
.hint{background:rgba(240,180,41,.08);border:1px solid rgba(240,180,41,.28);border-radius:11px;padding:13px 15px;margin-top:12px;font-size:15.5px;line-height:1.5}
.band{text-align:center;padding:26px 18px}
.band .big{font-size:46px;font-weight:700;letter-spacing:-1.5px;line-height:1}
.band .lbl{color:var(--dim);margin-top:8px;font-size:15px}
.rev{border-top:1px solid var(--line);padding:15px 0}.rev:first-of-type{border-top:0}
.rev .qt{font-size:16px;margin-bottom:9px;white-space:pre-wrap}
.rev .ans{font-size:15px;margin:5px 0}.ok{color:var(--good)}.no{color:var(--bad)}
.exp{background:var(--panel2);border-radius:9px;padding:12px 13px;margin-top:9px;font-size:15px;line-height:1.55;color:var(--dim);white-space:pre-wrap}
.topics{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.tp{padding:5px 11px;border-radius:99px;font-size:13px;background:var(--panel2);color:var(--dim)}
.tp.ok{background:rgba(62,207,142,.12);color:var(--good)}
.tp.no{background:rgba(255,107,107,.12);color:var(--bad)}
pre.sum{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px;
font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;max-height:320px;overflow:auto;color:var(--dim);margin-top:12px}
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:15px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}
th{color:var(--dim);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.5px}
ul,ol{padding-left:20px;margin:10px 0}li{margin:6px 0}
.hr{height:1px;background:var(--line);margin:18px 0;border:0}
.nb{background:rgba(240,180,41,.08);border:1px solid rgba(240,180,41,.25);border-radius:11px;padding:13px 15px;margin:12px 0;font-size:15px;line-height:1.55}
.nb b{color:var(--warn)}
.shots{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.shots img{width:76px;height:76px;object-fit:cover;border-radius:9px;border:1px solid var(--line)}
.syncdot{width:9px;height:9px;border-radius:99px;background:var(--faint);flex:0 0 9px}
.syncdot.on{background:var(--good)}.syncdot.err{background:var(--bad)}.syncdot.busy{background:var(--warn)}
label.file{display:block;width:100%;min-height:52px;padding:14px 16px;background:transparent;border:1px dashed var(--line);
border-radius:12px;font-weight:550;text-align:center;margin-top:12px;color:var(--dim)}
input[type=file]{display:none}
</style></head>
<body>
<header><div class="hd">
  <button id="back" class="pill" style="display:none">Back</button>
  <div class="t"><div id="htitle">Week 2</div><div class="bar"><i id="hbar" style="width:0%"></i></div></div>
  <span class="syncdot" id="sdot" title="sync"></span>
</div></header>
<div class="wrap" id="app"></div>
<script>
let P =  {"sessions":{"m23-backwards-marking":{"id":"m23-backwards-marking","day":"Day 1","subject":"Maths","title":"Finding the wrong line","minutes":20,"objective":"Find the first wrong line in somebody else's working backwards solution and say what it should have said.","extract":null,"teach":{"intro":["Working backwards has a shape. Write out the forward journey first, in order. Count the steps. Then undo them last one first. A two step journey needs two undos, so if you only do one you stop halfway and the answer is too big.","Today you are the marker. You get other people's working and you look for the first wrong line. Most of the time the working stops after one undo. Finish every question the same way: put your answer back into the forward version and check you land on the number you were given."],"example":{"problem":"A pupil wrote: a triangle has area 24 cm^2 and base 8 cm. Line 1: 24 x 2 = 48. Line 2: So the height is 48 cm. Find the first wrong line and correct it.","steps":["Write the forward journey. Start at the height. Times the base 8. Then divide by 2. That lands on the area 24.","Count the steps. Two steps, so two undos.","Undo the last step first. The last forward step was divide by 2, so times 2. 24 x 2 = 48. Line 1 is right.","Undo the first step. The first forward step was times 8, so divide by 8. 48 / 8 = 6.","Line 2 is the first wrong line. It should say the height is 6 cm, because the divide by 8 was never done.","Check. Put 6 back in the forward version. 6 x 8 = 48, then 48 / 2 = 24. That is the area we were given, so 6 is right."],"answer":"Line 2 is the first wrong line. It should say the height is 6 cm."},"keyfact":"Count the steps in the forward journey, undo that many, then put your answer back in and check."},"questions":[{"id":"m23-backwards-marking:q1","level":"easy","type":"mc","q":"A pupil is told: think of a number, multiply it by 4, then add 7. How many steps does the forward journey have?","options":["One","Two","Three","Four"],"answer":"Two","hint":"Count the instructions, not the numbers.","explain":"Multiply by 4 is one step. Add 7 is the second step. Two steps forward means two undos coming back.","topic":"working backwards: counting the steps in the forward journey"},{"id":"m23-backwards-marking:q2","level":"easy","type":"mc","q":"A pupil's work. Line 1: the number was multiplied by 6, then 5 was taken away. Line 2: the finishing answer is 31. Line 3: undo the take away 5, so 31 + 5 = 36. Line 4: so the number is 36. Which line is the first wrong one?","options":["Line 1","Line 2","Line 3","Line 4"],"answer":"Line 4","hint":"The forward journey has two steps. How many undos has the pupil done?","explain":"Line 3 is fine, 31 + 5 = 36. But the forward journey had two steps, times 6 and take away 5, so there are two undos. The pupil did one and stopped. 36 still has to be divided by 6, giving 6. Check: 6 x 6 = 36, then 36 - 5 = 31.","topic":"working backwards: marking a solution that stops after one undo"},{"id":"m23-backwards-marking:q3","level":"easy","type":"text","q":"A pupil's work. Line 1: the triangle has area 24 cm^2 and base 8 cm. Line 2: area = base x height / 2. Line 3: 24 x 2 = 48. Line 4: so the height is 48 cm. Line 4 is the first wrong one. Write the number the height should be, in cm.","answer":"6","accept":["6","6 cm","6cm","six"],"hint":"After doubling, one forward step is still left to undo.","explain":"Forward journey from the height: times 8, then divide by 2. Two steps. Undo the divide by 2 first, 24 x 2 = 48. Then undo the times 8, 48 / 8 = 6. The height is 6 cm. Check: 6 x 8 = 48, 48 / 2 = 24.","topic":"working backwards: area to find a height"},{"id":"m23-backwards-marking:q4","level":"easy","type":"mc","q":"A pupil's work. Line 1: sand and cement are mixed in the ratio 5:2. Line 2: there is 2.5 kg of cement. Line 3: one part is 2.5 / 2 = 1.25 kg. Line 4: so the whole mix is 1.25 x 5 = 6.25 kg. Which line is the first wrong one?","options":["Line 1","Line 2","Line 3","Line 4"],"answer":"Line 4","hint":"How many parts are there altogether in a 5:2 mix?","explain":"Line 3 is right, one part is 1.25 kg. Line 4 uses 5 parts, which is only the sand. The whole mix is 5 + 2 = 7 parts, so 1.25 x 7 = 8.75 kg. The pupil treated one share as the total. Check: 8.75 split 5:2 gives 6.25 kg sand and 2.5 kg cement.","topic":"working backwards: marking a ratio where one share is treated as the total"},{"id":"m23-backwards-marking:q5","level":"medium","type":"text","q":"A pupil's work. Line 1: a plank 6 m long is cut into pieces each 0.4 m long. Line 2: number of pieces = 6 / 0.4. Line 3: 6 / 0.4 = 1.5. Line 4: so there are 1.5 pieces. Line 3 is the first wrong one. Write the correct value of 6 / 0.4.","answer":"15","accept":["15","15.0","fifteen","15 pieces"],"hint":"The pieces are smaller than a metre, so there must be more of them than 6.","explain":"Dividing by a number smaller than 1 makes the answer bigger, not smaller. 0.4 goes into 1 m two and a half times, so into 6 m it goes 15 times. 6 / 0.4 = 15. Check: 15 x 0.4 = 6.","topic":"working backwards: marking a division by a number less than one"},{"id":"m23-backwards-marking:q6","level":"medium","type":"mc","q":"A pupil's work. Line 1: simplify 7x - 3 - 2x - 8. Line 2: 7x - 2x = 5x. Line 3: -3 - 8 = -5. Line 4: answer 5x - 5. Which line is the first wrong one?","options":["Line 1","Line 2","Line 3","Line 4"],"answer":"Line 3","hint":"Both of those numbers are being taken away. Does the total get smaller or bigger?","explain":"Line 2 is right, 7x - 2x = 5x. Line 3 drops a minus sign. You are taking away 3 and then taking away 8 more, so -3 - 8 = -11. The answer is 5x - 11.","topic":"working backwards: marking a dropped minus sign when collecting like terms"},{"id":"m23-backwards-marking:q7","level":"medium","type":"mc","q":"A pupil's work on this: a number is doubled, then 1.5 is added, giving 10.1. Line 1: undo the add 1.5, so 10.1 - 1.5 = 8.6. Line 2: so the number is 8.6. What went wrong?","options":["Line 1 should have added 1.5 instead of taking it away","The pupil undid one step and stopped, and still needs to halve 8.6","8.6 should be 11.6","Nothing went wrong, 8.6 is correct"],"answer":"The pupil undid one step and stopped, and still needs to halve 8.6","hint":"Write the forward journey out and count the steps.","explain":"The forward journey is times 2, then add 1.5. Two steps. Line 1 correctly undoes the add, 10.1 - 1.5 = 8.6. The doubling has not been undone. 8.6 / 2 = 4.3. Check: 4.3 x 2 = 8.6, then 8.6 + 1.5 = 10.1.","topic":"working backwards: naming the error in a solution that stops after one undo"},{"id":"m23-backwards-marking:q8","level":"medium","type":"text","q":"A pupil's work. Line 1: 7/8 of a number is 49. Line 2: one eighth is 49 / 7 = 7. Line 3: so the number is 7. Line 3 is the first wrong one. Write the number it should give.","answer":"56","accept":["56","56.0","fifty six","fifty-six"],"hint":"One eighth is 7. How many eighths make a whole?","explain":"Line 2 is right, one eighth is 7. A whole is eight eighths, so the number is 7 x 8 = 56. The pupil found one part and called it the total. Check: 56 / 8 = 7, then 7 x 7 = 49.","topic":"working backwards: fraction of an amount to find the whole"},{"id":"m23-backwards-marking:q9","level":"medium","type":"mc","q":"A pupil's work. Line 1: five readings have a mean of 12.4. Line 2: total = 12.4 x 4 = 49.6. Line 3: four of the readings are 9, 15, 11 and 13, which add to 48. Line 4: the missing reading is 49.6 - 48 = 1.6. Which line is the first wrong one?","options":["Line 1","Line 2","Line 3","Line 4"],"answer":"Line 2","hint":"The mean was made by dividing by how many readings?","explain":"The mean came from dividing the total by 5, so undoing it means multiplying by 5, not 4. Total = 12.4 x 5 = 62. Then the missing reading is 62 - 48 = 14. Check: 9 + 15 + 11 + 13 + 14 = 62, and 62 / 5 = 12.4.","topic":"working backwards: marking a mean reversed with the wrong number of values"},{"id":"m23-backwards-marking:q10","level":"stretch","type":"text","q":"A pupil's work. Line 1: a rectangle has area 58.5 cm^2 and width 4.5 cm. Line 2: length = 58.5 / 4.5 = 13 cm. Line 3: so the perimeter is 13 x 2 = 26 cm. Line 3 is the first wrong one. Write the correct perimeter, in cm.","answer":"35","accept":["35","35.0","35 cm","35cm","thirty five"],"hint":"The perimeter needs all four sides, not two.","explain":"Line 2 is right, the length is 13 cm. Line 3 only doubles the length and forgets the width. The perimeter is 2 x (13 + 4.5) = 2 x 17.5 = 35 cm. Check: 13 x 4.5 = 58.5, so the length is right, and the four sides are 13, 4.5, 13 and 4.5.","topic":"working backwards: area to a side then on to perimeter"},{"id":"m23-backwards-marking:q11","level":"stretch","type":"mc","q":"The journey was: take away 6, then multiply by 3, giving 51. Pupil A says divide 51 by 3 then add 6. Pupil B says add 6 to 51 then divide by 3. Who has the right order, and why?","options":["Pupil A, because you undo the last forward step first","Pupil B, because you undo the first forward step first","Both work, the order of the undos does not matter","Neither, you should divide 51 by 6"],"answer":"Pupil A, because you undo the last forward step first","hint":"Which step happened last on the way forward?","explain":"The last forward step was multiply by 3, so the first undo is divide by 3. 51 / 3 = 17, then 17 + 6 = 23. Pupil A is right. Pupil B's order gives 51 + 6 = 57, then 57 / 3 = 19, which fails the check: 19 - 6 = 13, and 13 x 3 = 39, not 51.","topic":"working backwards: why the undos must run in reverse order"},{"id":"m23-backwards-marking:q12","level":"stretch","type":"text","q":"A pupil's work. Line 1: a triangle has area 50.4 cm^2 and perpendicular height 11.2 cm. Line 2: 50.4 x 2 = 100.8. Line 3: so the base is 100.8 cm. Line 3 is the first wrong one. Write the correct base, in cm.","answer":"9","accept":["9","9.0","9 cm","9cm","nine"],"hint":"Two forward steps, so two undos. Only one has been done.","explain":"Forward journey from the base: times the height 11.2, then divide by 2. Two steps. Line 2 correctly undoes the divide by 2, 50.4 x 2 = 100.8. The times 11.2 is still to undo. 100.8 / 11.2 = 9, so the base is 9 cm. Check: 9 x 11.2 = 100.8, then 100.8 / 2 = 50.4.","topic":"working backwards: area to find a base"}]},"m24-backwards-apply":{"id":"m24-backwards-apply","day":"Day 3","subject":"Maths","title":"Forwards, backwards, and which is which","minutes":20,"objective":"Decide for yourself whether a question is forwards or backwards, then pick the first step before doing any arithmetic.","extract":null,"teach":{"intro":["Nothing here is labelled. Before you touch the numbers, ask one question: do I know the starting amount or the finishing amount? Knowing the start means a forward journey. Knowing the finish means a backward one.","If it is backwards, write out the forward journey, count the steps, then undo them last one first. The numbers today are deliberately awkward, so put your answer back into the forward version and check it lands on the number you were given."],"example":{"problem":"A load of 90 kg is split in the ratio 5:7:3. Later, a different load is split the same way and the 3 share is 18 kg. Work out the 7 share of the first load, and the total of the second load.","steps":["First one. I know the total, 90 kg, so it is forwards. Parts: 5 + 7 + 3 = 15. One part is 90 / 15 = 6 kg. The 7 share is 7 x 6 = 42 kg.","Second one. I know one share, not the total, so it is backwards.","Forward journey for the 3 share: start at one part, times 3. One step.","Undo it. 18 / 3 = 6 kg for one part.","Now go forwards to the total. 6 x 15 = 90 kg.","Check. 90 / 15 = 6, and 6 x 3 = 18, which is the share we were given."],"answer":"The 7 share of the first load is 42 kg. The second load totals 90 kg."},"keyfact":"Decide forwards or backwards first, by asking whether you were handed the start or the finish."},"questions":[{"id":"m24-backwards-apply:q1","level":"easy","type":"mc","q":"What is 7/8 of 56?","options":["48","49","50","64"],"answer":"49","hint":"Find one eighth of 56 first.","explain":"56 / 8 = 7, so one eighth is 7. Seven eighths is 7 x 7 = 49.","topic":"fractions: finding a fraction of an amount forwards"},{"id":"m24-backwards-apply:q2","level":"easy","type":"mc","q":"Read this but do not work it out: 7/8 of a number is 49. What is the question asking for?","options":["A forward journey, work out 7/8 of a number you already know","A backward journey, you are given the finished amount and need the starting number","A forward journey, you need to add 7/8 to 49","Neither, it is a ratio question"],"answer":"A backward journey, you are given the finished amount and need the starting number","hint":"Which do you know, the whole number or the part?","explain":"You are handed 49, which is what you end up with after taking 7/8. The starting whole is missing, so this is backwards.","topic":"working backwards: deciding the direction of a question without solving it"},{"id":"m24-backwards-apply:q3","level":"easy","type":"text","q":"A 90 kg load is split between three sledges in the ratio 5:7:3. How heavy is the 7 share, in kg?","answer":"42","accept":["42","42.0","42 kg","42kg","forty two"],"hint":"Add the parts of the ratio first.","explain":"5 + 7 + 3 = 15 parts. One part is 90 / 15 = 6 kg. The 7 share is 7 x 6 = 42 kg. Check: the three shares are 30, 42 and 18, which add to 90.","topic":"ratio: sharing a known total forwards"},{"id":"m24-backwards-apply:q4","level":"easy","type":"mc","q":"A load is split in the ratio 5:7:3. The 3 share is 18 kg. What is the very first step?","options":["Divide 18 by 3 to find one part","Divide 18 by 15 to find one part","Multiply 18 by 15 to find the total","Add 5, 7 and 3 then divide by 18"],"answer":"Divide 18 by 3 to find one part","hint":"The 18 kg is made of how many parts?","explain":"The 18 kg is the 3 share, so it is 3 parts. One part is 18 / 3 = 6 kg. Only once you have one part can you build anything else. Dividing 18 by 15 would be treating 18 as the total.","topic":"working backwards: choosing the first step from one ratio share"},{"id":"m24-backwards-apply:q5","level":"medium","type":"text","q":"A load is split in the ratio 5:7:3. The 3 share is 18 kg. How heavy is the whole load, in kg?","answer":"90","accept":["90","90.0","90 kg","90kg","ninety"],"hint":"Find one part, then count how many parts the whole load has.","explain":"18 / 3 = 6 kg for one part. The whole load is 5 + 7 + 3 = 15 parts, so 6 x 15 = 90 kg. Check: 90 / 15 = 6, and 6 x 3 = 18.","topic":"working backwards: one ratio share to the total"},{"id":"m24-backwards-apply:q6","level":"medium","type":"text","q":"A 2.35 m rope is cut into 5 equal pieces. How long is each piece, in m?","answer":"0.47","accept":["0.47","0.47 m","0.47m",".47","0.470"],"hint":"Sharing equally means dividing.","explain":"2.35 / 5 = 0.47 m. Check: 0.47 x 5 = 2.35.","topic":"decimals: dividing a length into equal pieces forwards"},{"id":"m24-backwards-apply:q7","level":"medium","type":"text","q":"A cord is cut into 15 pieces, each 0.47 m long, with nothing left over. How long was the cord, in m?","answer":"7.05","accept":["7.05","7.05 m","7.05m","7.050"],"hint":"You know the size of one piece and how many there are.","explain":"You are given the pieces and need the original, so rebuild it. 0.47 x 15 = 7.05 m. Check: 7.05 / 15 = 0.47.","topic":"working backwards: rebuilding a whole length from equal pieces"},{"id":"m24-backwards-apply:q8","level":"medium","type":"mc","q":"Read this but do not work it out: a full rucksack weighs 14.4 kg. Empty it weighs 3.6 kg. Twelve ration packs of equal weight make up the rest. The question asks for the weight of one pack. What is it asking for?","options":["A forward journey, multiply 12 by the pack weight","A backward journey, you are given the finished weight and need the weight of one pack","A forward journey, add 14.4 and 3.6","Neither, it is a mean question"],"answer":"A backward journey, you are given the finished weight and need the weight of one pack","hint":"Which number is the finished total here?","explain":"14.4 kg is where the packing ended up. The weight of one pack is the thing you started with, so this is backwards.","topic":"working backwards: deciding the direction of a question without solving it"},{"id":"m24-backwards-apply:q9","level":"medium","type":"mc","q":"A rucksack holding twelve equal ration packs weighs 14.4 kg. Empty, the rucksack weighs 3.6 kg. A pupil divides 14.4 by 12 and gets 1.2 kg per pack. Why does that fail?","options":["The empty bag's 3.6 kg has to come off first, so it should be 10.8 divided by 12","14.4 should be divided by 3.6 before anything else","You cannot divide a decimal by a whole number","It does not fail, 1.2 kg is correct"],"answer":"The empty bag's 3.6 kg has to come off first, so it should be 10.8 divided by 12","hint":"Write the forward journey. What happened to the packs before the scales read 14.4?","explain":"The forward journey is: 12 packs, then add the empty bag. Two steps. Undoing the last step first means 14.4 - 3.6 = 10.8, then 10.8 / 12 = 0.9 kg a pack. The pupil skipped an undo. Check: 12 x 0.9 = 10.8, then 10.8 + 3.6 = 14.4.","topic":"working backwards: why skipping an undo gives too large an answer"},{"id":"m24-backwards-apply:q10","level":"medium","type":"text","q":"Six engine temperature readings have a mean of 87.5 degrees. Five of them add up to 441. What is the sixth reading, in degrees?","answer":"84","accept":["84","84.0","84 degrees","eighty four"],"hint":"Undo the mean to get the total of all six.","explain":"The mean was the total divided by 6, so undo it with a times 6. 87.5 x 6 = 525. The sixth reading is 525 - 441 = 84. Check: 441 + 84 = 525, and 525 / 6 = 87.5.","topic":"working backwards: mean to a missing value"},{"id":"m24-backwards-apply:q11","level":"stretch","type":"text","q":"A triangle has area 37.8 cm^2 and base 10.5 cm. What is its perpendicular height, in cm?","answer":"7.2","accept":["7.2","7.2 cm","7.2cm","7.20"],"hint":"Two forward steps, so two undos.","explain":"Forward journey from the height: times 10.5, then divide by 2. Undo the divide by 2 first, 37.8 x 2 = 75.6. Then undo the times 10.5, 75.6 / 10.5 = 7.2 cm. Check: 10.5 x 7.2 = 75.6, then 75.6 / 2 = 37.8.","topic":"working backwards: area to find a perpendicular height"},{"id":"m24-backwards-apply:q12","level":"stretch","type":"mc","q":"A tank holds 2.35 litres of fuel when it is 5/8 full. Which method gives the full capacity?","options":["Divide 2.35 by 5, then multiply by 8","Multiply 2.35 by 5, then divide by 8","Divide 2.35 by 8, then multiply by 5","Multiply 2.35 by 5/8"],"answer":"Divide 2.35 by 5, then multiply by 8","hint":"What does 2.35 divided by 5 give you one of?","explain":"2.35 is five eighths, so dividing by 5 gives one eighth, 0.47 litres. A full tank is eight eighths, so 0.47 x 8 = 3.76 litres. Multiplying by 5/8 would make it smaller, which is the forward move, not the backward one.","topic":"working backwards: choosing the method to find a whole from a fraction"}]},"w6u1-warmup":{"id":"w6u1-warmup","day":"Day 1","subject":"Warm up","title":"Five to start","minutes":5,"objective":"Pull last week's maths and three older topics back out of memory in five minutes.","extract":null,"teach":{"intro":["Five questions, no reading first. Question 1 is somebody else's working with one wrong line in it."],"keyfact":"Count the steps forward, undo that many coming back."},"questions":[{"id":"w6u1-warmup:q1","level":"easy","type":"mc","q":"A pupil's work. Line 1: a number is multiplied by 7, then 4 is added, giving 46. Line 2: 46 - 4 = 42. Line 3: so the number is 42. Which line is the first wrong one?","options":["Line 1","Line 2","Line 3","No line is wrong"],"answer":"Line 3","hint":"Two steps forward means two undos.","explain":"Line 2 is right, 46 - 4 = 42. The times 7 has not been undone. 42 / 7 = 6. Check: 6 x 7 = 42, then 42 + 4 = 46.","topic":"working backwards: marking a solution that stops after one undo"},{"id":"w6u1-warmup:q2","level":"easy","type":"text","q":"Water on the surface of a lake is heated by the sun and turns into water vapour. What is this stage of the water cycle called?","answer":"evaporation","accept":["evaporation","evaporating","evaporate","evaporates","evaporated"],"hint":"Liquid going up into the air as a gas.","explain":"Evaporation is liquid water turning into water vapour. Condensation is the opposite, vapour turning back into liquid droplets higher up.","topic":"water cycle: naming evaporation"},{"id":"w6u1-warmup:q3","level":"medium","type":"mc","q":"Two versions: A says 'The ice cracked, the dogs bolted.' B says 'The ice cracked and the dogs bolted.' Which is joined correctly, and what is wrong with the other?","options":["B is correct, A needs a joining word or a semicolon instead of the comma","A is correct, B needs a comma before and","Both are correct as they stand","Neither, both need to be split into two sentences with full stops"],"answer":"B is correct, A needs a joining word or a semicolon instead of the comma","hint":"A comma on its own cannot hold two complete sentences together.","explain":"A has two complete sentences glued with only a comma. B fixes it with the joining word 'and'. A semicolon would also fix it.","topic":"English: joining two clauses correctly"},{"id":"w6u1-warmup:q4","level":"medium","type":"text","q":"A river drops 1.84 km from its source to the sea. How many metres is that?","answer":"1840","accept":["1840","1840 m","1840m","1,840","1840.0"],"hint":"There are 1000 m in 1 km.","explain":"1.84 x 1000 = 1840 m. Check: 1840 / 1000 = 1.84.","topic":"geography and measures: converting km to m"},{"id":"w6u1-warmup:q5","level":"medium","type":"text","q":"A sledge is pulled across snow at a steady speed. The forward pull is 120 N. What is the size of the total backwards force, in N?","answer":"120","accept":["120","120 N","120N","one hundred and twenty"],"hint":"Steady speed means the forces are balanced.","explain":"At a steady speed the forces balance exactly, so the backwards force is also 120 N. If it were less, the sledge would speed up.","topic":"forces: balanced forces at steady speed"}]},"w6u2-warmup":{"id":"w6u2-warmup","day":"Day 2","subject":"Warm up","title":"Five to start","minutes":5,"objective":"Pull last week's maths and three older topics back out of memory in five minutes.","extract":null,"teach":{"intro":["Five questions. Question 1 is somebody else's working with one wrong line in it."],"keyfact":"Dividing undoes multiplying. If the answer came out bigger than the area, something is wrong."},"questions":[{"id":"w6u2-warmup:q1","level":"easy","type":"mc","q":"A pupil's work. Line 1: a rectangle has area 7.2 m^2 and width 1.6 m. Line 2: length = 7.2 x 1.6 = 11.52 m. Line 3: so the length is 11.52 m. Which line is the first wrong one?","options":["Line 1","Line 2","Line 3","No line is wrong"],"answer":"Line 2","hint":"The forward journey multiplied to get the area. What undoes that?","explain":"The area was made by multiplying length by width, so to get back to the length you divide, not multiply. 7.2 / 1.6 = 4.5 m. Check: 4.5 x 1.6 = 7.2.","topic":"working backwards: marking a reverse step done as a multiply"},{"id":"w6u2-warmup:q2","level":"easy","type":"mc","q":"Simplify 4a - 9 - 7a + 2.","options":["-3a - 7","-3a + 7","3a - 7","-3a - 11"],"answer":"-3a - 7","hint":"Collect the a terms, then the plain numbers, keeping every sign with its own term.","explain":"4a - 7a = -3a. For the numbers, -9 + 2 = -7. So the answer is -3a - 7.","topic":"algebra: signs when collecting like terms"},{"id":"w6u2-warmup:q3","level":"medium","type":"text","q":"A Roman fort was built in 75 AD and abandoned in 410 AD. For how many years was it in use?","answer":"335","accept":["335","335 years","three hundred and thirty five"],"hint":"Both dates are AD, so take one from the other.","explain":"410 - 75 = 335 years. Check: 75 + 335 = 410.","topic":"history: calculating a span of AD years"},{"id":"w6u2-warmup:q4","level":"medium","type":"text","q":"In this sentence, write the one word that is the adverb: 'The guide checked the rope carefully before the climb.'","answer":"carefully","accept":["carefully","Carefully"],"hint":"Which word tells you how the checking was done?","explain":"Carefully tells you how he checked, so it is the adverb. Guide and rope are nouns, checked is the verb.","topic":"English: identifying an adverb in a given sentence"},{"id":"w6u2-warmup:q5","level":"medium","type":"text","q":"A weather station records rainfall of 6 mm on Monday, 0 mm on Tuesday, 11 mm on Wednesday and 3 mm on Thursday. What is the mean daily rainfall, in mm?","answer":"5","accept":["5","5 mm","5mm","5.0","five"],"hint":"Add all four, including the zero, then divide by how many days.","explain":"6 + 0 + 11 + 3 = 20, and 20 / 4 = 5 mm. The zero still counts as a day, so you divide by 4, not 3.","topic":"statistics: mean of a small data set including a zero"}]},"w6u3-warmup":{"id":"w6u3-warmup","day":"Day 3","subject":"Warm up","title":"Five to start","minutes":5,"objective":"Pull last week's maths and three older topics back out of memory in five minutes.","extract":null,"teach":{"intro":["Five questions. Question 1 is somebody else's working with one wrong line in it."],"keyfact":"One share of a ratio is never the total. Count all the parts."},"questions":[{"id":"w6u3-warmup:q1","level":"easy","type":"mc","q":"A pupil's work. Line 1: sand and gravel are mixed in the ratio 2:9. Line 2: there is 7.2 kg of sand. Line 3: one part is 7.2 / 2 = 3.6 kg. Line 4: so the whole mix is 3.6 x 9 = 32.4 kg. Which line is the first wrong one?","options":["Line 1","Line 2","Line 3","Line 4"],"answer":"Line 4","hint":"How many parts are in the whole mix, not just the gravel?","explain":"Line 3 is right, one part is 3.6 kg. Line 4 uses 9 parts, which is only the gravel. The whole mix is 2 + 9 = 11 parts, so 3.6 x 11 = 39.6 kg. Check: 39.6 split 2:9 gives 7.2 kg of sand and 32.4 kg of gravel.","topic":"working backwards: marking a ratio where one share is treated as the total"},{"id":"w6u3-warmup:q2","level":"easy","type":"text","q":"A hill top is at the six figure grid reference 384 726. Which four figure grid square is it in?","answer":"3872","accept":["3872","38 72","38,72"],"hint":"A four figure reference uses the first two digits of each half.","explain":"Drop the third digit of each half. The easting 384 becomes 38 and the northing 726 becomes 72, giving the square 3872.","topic":"geography: six figure to four figure grid references"},{"id":"w6u3-warmup:q3","level":"easy","type":"text","q":"Water vapour high in the air cools and turns back into tiny liquid droplets, forming a cloud. What is this stage of the water cycle called?","answer":"condensation","accept":["condensation","condensing","condense","condenses","condensed"],"hint":"Gas turning back into liquid.","explain":"Condensation is water vapour turning back into liquid. Evaporation is the other way round, liquid turning into vapour.","topic":"water cycle: naming condensation"},{"id":"w6u3-warmup:q4","level":"medium","type":"text","q":"A castle keep was finished in 1092. The outer wall was finished 38 years after that. In which year was the outer wall finished?","answer":"1130","accept":["1130","1130 AD","AD 1130"],"hint":"Add the gap to the earlier year.","explain":"1092 + 38 = 1130. Check: 1130 - 1092 = 38.","topic":"history: adding a gap of years to a date"},{"id":"w6u3-warmup:q5","level":"medium","type":"mc","q":"Which word completes this sentence correctly: 'The dogs followed ___ own trail back to camp.'","options":["their","there","they're","theirs"],"answer":"their","hint":"The missing word shows the trail belongs to the dogs.","explain":"Their shows belonging, so the trail is the dogs' own. There is about place, they're is short for they are, and theirs is never followed by a noun.","topic":"English: homophones their, there and they're"}]},"w6u4-warmup":{"id":"w6u4-warmup","day":"Day 4","subject":"Warm up","title":"Five to start","minutes":5,"objective":"Pull last week's maths and three older topics back out of memory in five minutes.","extract":null,"teach":{"intro":["Five questions. Question 1 is a working backwards question, so write the forward journey out before you start."],"keyfact":"Write the forward journey, count the steps, undo them last one first."},"questions":[{"id":"w6u4-warmup:q1","level":"easy","type":"text","q":"A number is divided by 4, then 2.5 is added, giving 9.75. What was the number?","answer":"29","accept":["29","29.0","twenty nine"],"hint":"Two steps forward means two undos, last one first.","explain":"Forward journey: divide by 4, then add 2.5. Undo the add first, 9.75 - 2.5 = 7.25. Then undo the divide by 4, so 7.25 x 4 = 29. Check: 29 / 4 = 7.25, then 7.25 + 2.5 = 9.75.","topic":"working backwards: two step number journey with decimals"},{"id":"w6u4-warmup:q2","level":"easy","type":"text","q":"Five sensor readings are 21, 19, 22, 20 and 158. The 158 is a fault and is thrown out. What is the mean of the four readings that are left?","answer":"20.5","accept":["20.5","20.50","twenty point five"],"hint":"Add the four you are keeping, then divide by 4.","explain":"21 + 19 + 22 + 20 = 82, and 82 / 4 = 20.5. Once the anomaly is removed you divide by 4, not 5.","topic":"statistics: mean with an anomaly removed"},{"id":"w6u4-warmup:q3","level":"medium","type":"mc","q":"Which one of these is a complete sentence?","options":["Although the fire went out.","The fire went out.","Going out in the night.","Because the wood was wet."],"answer":"The fire went out.","hint":"A complete sentence makes sense on its own and has a subject and a verb.","explain":"The fire went out has a subject and a verb and stands alone. The other three are fragments: they all leave you waiting for the rest.","topic":"English: complete sentences and fragments"},{"id":"w6u4-warmup:q4","level":"medium","type":"mc","q":"An expedition diary reads: 'Tenth day. The bread is gone. We burn the sledge to keep warm.' What does this tell you about their situation?","options":["They had run out of food and were burning equipment to survive","They had plenty of supplies left","They were close to home and travelling fast","They had lost the sledge in a storm"],"answer":"They had run out of food and were burning equipment to survive","hint":"Take the two facts in the entry and put them together.","explain":"The bread is gone means the food has run out. Burning the sledge means they were destroying the thing they travel with, which you only do if staying warm matters more than moving on.","topic":"history: drawing a conclusion from a written source"},{"id":"w6u4-warmup:q5","level":"medium","type":"text","q":"A parachutist falls at a steady speed. Her weight pulling down is 700 N. What is the size of the upward force on her, in N?","answer":"700","accept":["700","700 N","700N","seven hundred"],"hint":"Steady speed means the two forces are the same size.","explain":"At a steady speed the forces balance, so the upward force is also 700 N. If it were smaller she would speed up.","topic":"forces: balanced forces during steady descent"}]},"w6u5-warmup":{"id":"w6u5-warmup","day":"Day 5","subject":"Warm up","title":"Five to start","minutes":5,"objective":"Pull last week's maths and three older topics back out of memory in five minutes.","extract":null,"teach":{"intro":["Five questions before the test. Question 1 is somebody else's working with one wrong line in it."],"keyfact":"Finding one part is not finishing. Build back up to the whole."},"questions":[{"id":"w6u5-warmup:q1","level":"easy","type":"mc","q":"A pupil's work. Line 1: 5/6 of a number is 45. Line 2: one sixth is 45 / 5 = 9. Line 3: so the number is 9 x 5 = 45. Which line is the first wrong one?","options":["Line 1","Line 2","Line 3","No line is wrong"],"answer":"Line 3","hint":"How many sixths make a whole?","explain":"Line 2 is right, one sixth is 9. A whole is six sixths, so the number is 9 x 6 = 54, not 9 x 5. Check: 54 / 6 = 9, and 9 x 5 = 45.","topic":"working backwards: marking a fraction of an amount rebuilt with the wrong number of parts"},{"id":"w6u5-warmup:q2","level":"easy","type":"mc","q":"Put these three dates in order, earliest first: 300 BC, 50 BC, 200 AD.","options":["300 BC, 50 BC, 200 AD","50 BC, 300 BC, 200 AD","200 AD, 50 BC, 300 BC","300 BC, 200 AD, 50 BC"],"answer":"300 BC, 50 BC, 200 AD","hint":"BC years count down towards zero, AD years count up.","explain":"BC dates come before AD dates, and inside BC a bigger number is earlier, so 300 BC comes before 50 BC. Then 200 AD is last.","topic":"history: ordering BC and AD dates"},{"id":"w6u5-warmup:q3","level":"medium","type":"text","q":"A footpath climbs from 140 m above sea level to 392 m above sea level. How much height is gained, in m?","answer":"252","accept":["252","252 m","252m","two hundred and fifty two"],"hint":"Take the lower height from the higher one.","explain":"392 - 140 = 252 m. Check: 140 + 252 = 392.","topic":"geography: height gain from spot heights"},{"id":"w6u5-warmup:q4","level":"medium","type":"mc","q":"Which pair is the right way round?","options":["Evaporation turns liquid into gas, condensation turns gas into liquid","Condensation turns liquid into gas, evaporation turns gas into liquid","Both of them turn liquid into gas","Both of them turn gas into liquid"],"answer":"Evaporation turns liquid into gas, condensation turns gas into liquid","hint":"Think about a puddle drying up, then about a cold window misting over.","explain":"A puddle drying up is evaporation, liquid to gas. A cold window misting over is condensation, gas to liquid. They are opposites.","topic":"water cycle: telling evaporation and condensation apart"},{"id":"w6u5-warmup:q5","level":"medium","type":"mc","q":"Which sentence uses the apostrophe correctly?","options":["The climbers rope snapped.","The climber's rope snapped.","The climbers' rope snapped's.","The climber's rope's snapped's."],"answer":"The climber's rope snapped.","hint":"The apostrophe goes on the owner, not on the verb.","explain":"One climber owns the rope, so the apostrophe goes after climber and before the s: climber's. The other versions either leave it out or stick one onto a verb.","topic":"English: apostrophes for single possession"}]},"e14-evidence-proves-point":{"id":"e14-evidence-proves-point","day":"Day 2","subject":"English","title":"Making the evidence prove the point","minutes":20,"objective":"Pick a quote that contains the claim you made, and write an explanation that says what the words imply instead of repeating them.","extract":"The reservoir had been frozen for nine days. Marcus had counted them off on the kitchen calendar, and on the ninth morning he put the long rope in his bag.\n\nDev got there first and was already out on the white, sliding on his heels with his arms wide. He shouted something about the middle. Marcus stayed on the bank and looked at the ice the way you look at a dog you do not know.\n\n'Come on,' Dev called. 'It's solid.'\n\nMarcus stepped on. The ice took his weight without a sound, which was somehow worse. He walked out slowly, placing each foot flat, and he kept turning the rope over in his hands, winding it round his glove and unwinding it again.\n\nTwenty metres out, the ice spoke. It was not a crack. It was a long low note, like a door opening in an empty house, and it travelled under them both and away towards the dam.\n\nDev laughed. 'That's just it settling.'\n\nMarcus did not answer. He was looking back at the bank, measuring it, working out how many steps it would take. Then he crouched, pushed one end of the rope across the ice to his friend, and kept the other end wound twice around his fist.\n\n'Hold that,' he said. 'Don't argue.'","teach":{"intro":["Last week you built the shape. Point, evidence, explanation. The shape is the easy part. The hard part is picking a quote that actually proves the point, and then saying what it means.","First move. Does the quote contain the thing you claimed? If you claim a character is nervous, the quote has to contain nervousness. If it only contains the weather, it proves nothing, however good it sounds.","Second move. Says versus shows. \"The quote says he looked at the door\" is restating. \"Looking at the door shows he was planning to leave\" is explaining. Every explanation sentence starts from what the word choice makes the reader think."],"example":{"problem":"A pupil was asked how the writer shows that Marcus is worried about the ice. The pupil wrote: \"Marcus is worried. We know this because the reservoir had been frozen for nine days. This shows the reservoir was frozen.\" Mark it.","steps":["Check the point first. Worried about the ice. That answers the question asked, so the point stays.","Check the evidence. Does the quote contain worry? It contains nine days of frost, which is weather. There is no worry inside it, so the evidence fails.","Swap in a quote that does contain the worry. He \"kept turning the rope over in his hands, winding it round his glove and unwinding it again\". Hands that will not keep still contain worry.","Check the explanation. \"This shows the reservoir was frozen\" only says the quote again. That is restating, so it earns nothing.","Rewrite the explanation from what the reader thinks. Hands that cannot stay still show the reader that Marcus is frightened before anything has even gone wrong.","Read it back. Every sentence now does a different job."],"answer":"The evidence and the explanation both fail. Fixed: Marcus is worried about the ice. We know this because he \"kept turning the rope over in his hands\". Winding and unwinding shows the reader he is frightened before anything has gone wrong."},"example2":{"problem":"A pupil wrote. Point: Dev is careless. Evidence: \"Dev laughed\". Explanation: this shows that Dev laughed at the noise. Which part is wrong?","steps":["Check the point. Dev is careless. That is about a character and it can be proved, so the point stays.","Check the evidence. Does \"Dev laughed\" contain carelessness? Laughing at a warning noise does, so the evidence stays.","Check the explanation. It says Dev laughed at the noise, which is the quote again. Saying, not showing.","Fix it from the reader. Laughing at a noise that comes from under his own feet shows the reader that Dev has not understood the danger at all."],"answer":"The explanation is the wrong part. It restates the quote instead of saying what the laughing tells the reader about Dev."},"keyfact":"The quote has to contain the thing you claimed, and the explanation has to say what the words make the reader think, not what they say."},"questions":[{"id":"e14-evidence-proves-point:q1","level":"easy","type":"mc","q":"A pupil claims that Marcus is careful on the ice. Which quote from the extract contains carefulness?","options":["\"placing each foot flat\"","\"The reservoir had been frozen for nine days\"","\"Dev laughed\"","\"it travelled under them both and away towards the dam\""],"answer":"\"placing each foot flat\"","hint":"Three of these are not even about Marcus moving. Find the one that is.","explain":"The test is simple. Does the quote contain the thing you claimed? The claim is carefulness, so the quote has to contain carefulness. Placing each foot flat is a careful way to walk, so that quote contains it. The nine days of frost is weather. Dev laughing is Dev. The noise travelling to the dam is the ice. None of those three contain carefulness, so none of them proves the point.","topic":"english: choosing evidence that contains the claim"},{"id":"e14-evidence-proves-point:q2","level":"easy","type":"mc","q":"Point: Marcus was uneasy before anything went wrong. Evidence: he \"kept turning the rope over in his hands, winding it round his glove and unwinding it again\". Which of these sentences is explaining, and not just restating the quote?","options":["The quote says that Marcus turned the long rope over and over again in both of his hands.","Marcus was holding the rope, winding it round his glove and then unwinding it again as he walked.","Winding and unwinding the rope shows the reader that Marcus was uneasy before anything happened.","Marcus had put the long rope into his bag at home on the ninth morning."],"answer":"Winding and unwinding the rope shows the reader that Marcus was uneasy before anything happened.","hint":"Two of these just say the quote again in different words. One of them tells you what it makes the reader think.","explain":"Says versus shows. The answer about turning the rope over in both hands and the answer about holding it and winding it round his glove only say the quote again, which is restating, so they earn nothing. The answer about putting the rope in his bag at home is a different fact from somewhere else in the extract, not an explanation at all. The answer that says the winding and unwinding shows the reader he was uneasy starts from what the detail makes the reader think, which is what an explanation sentence has to do.","topic":"english: telling a restating sentence from an explaining sentence"},{"id":"e14-evidence-proves-point:q3","level":"easy","type":"text","q":"A pupil claims Dev did not take the noise under the ice seriously. Copy the single verb from the extract that says what Dev did straight after the ice made its noise.","answer":"laughed","accept":["laughed","laugh","laughs","dev laughed","Dev laughed","laughed."],"hint":"Look at the line that comes just after the long low note.","explain":"Straight after the noise the extract says \"Dev laughed\". That one verb contains the claim, because laughing at a warning is not taking it seriously. A quote only proves a point if the thing you claimed is inside it, and this one word carries it on its own.","topic":"english: finding the word in the extract that contains the claim"},{"id":"e14-evidence-proves-point:q4","level":"easy","type":"mc","q":"A pupil wrote. Point: Marcus is nervous about the ice. Evidence: the reservoir \"had been frozen for nine days\". What is wrong with it?","options":["The point is wrong, because Marcus is not nervous anywhere in this extract","The evidence does not contain the nervousness, it only contains the weather","The explanation is too long and should be cut down to one short sentence","The quote has been made up and those words are not in the extract"],"answer":"The evidence does not contain the nervousness, it only contains the weather","hint":"Read the quote on its own. Is there any nervousness inside it?","explain":"The point is fine, because the extract does show Marcus nervous. The quote is real, and there is no explanation yet to be too long. The problem is the evidence. Nine days of frost is a fact about the weather, and there is no nervousness inside it, so it proves nothing about how Marcus feels. A quote about his hands or about the strange dog would contain the claim.","topic":"english: marking evidence that does not contain the claim"},{"id":"e14-evidence-proves-point:q5","level":"medium","type":"mc","q":"Point: Marcus expected trouble before he even reached the reservoir. Quote A: \"on the ninth morning he put the long rope in his bag\". Quote B: \"The ice took his weight without a sound\". Which quote better proves the point, and why?","options":["Quote A, because he packed a rope before he had seen the ice that day","Quote A, because he borrowed the rope from Dev on the way to the reservoir","Quote B, because the ice stayed completely silent under his weight that day","Quote B, because it proves that he did go out onto the ice in the end"],"answer":"Quote A, because he packed a rope before he had seen the ice that day","hint":"The point says before he reached the reservoir. Which quote happens before he gets there?","explain":"The claim has two parts, expecting trouble and doing it early. Quote A contains both, because a rope is only any use if you think somebody might go through, and he packed it at home. Quote B happens once he is already out there, so it cannot prove what he expected beforehand. The answer about borrowing the rope from Dev picks the right quote, but that never happens in the extract, and the reason is where the marks are.","topic":"english: choosing which of two quotes better proves the point"},{"id":"e14-evidence-proves-point:q6","level":"medium","type":"mc","q":"Point: Marcus does not trust the ice. Evidence: he \"looked at the ice the way you look at a dog you do not know\". Which sentence says what the comparison makes the reader think, rather than restating it?","options":["This says that Marcus looked at the ice in the same way as a dog looks at a person it does not know.","Comparing the ice to a strange dog makes the reader expect it to turn on him with no warning.","Marcus looked at the ice for a long time and he did not know anything about it.","The writer has used a comparison in this sentence to describe how Marcus looked."],"answer":"Comparing the ice to a strange dog makes the reader expect it to turn on him with no warning.","hint":"What do you do near a dog you do not know, and why?","explain":"The answer about Marcus looking at the ice and not knowing it says the quote again, which is restating. The answer about the writer using a comparison only names the technique, and naming a technique is not explaining. The answer about a dog looking at a person has the comparison the wrong way round, because Marcus is the one doing the looking, not the dog. The answer about a strange dog starts from the reader. A dog you do not know might be fine or might bite, and you cannot tell which, so the comparison makes the reader expect the ice to go without warning. That is showing, not saying.","topic":"english: explaining what a comparison makes the reader think"},{"id":"e14-evidence-proves-point:q7","level":"medium","type":"mc","q":"A pupil wrote. Point: Marcus was planning how to get off the ice. Evidence: he was \"looking back at the bank, measuring it\". Explanation: this shows he looked at the bank. Which part is weak?","options":["The point, because it is not about anything that actually happens in this extract","The evidence, because there is no planning anywhere inside the words of the quote","The explanation, because it repeats the quote instead of saying what the measuring shows","Nothing is weak, the paragraph has all three parts and uses a real quote from the extract"],"answer":"The explanation, because it repeats the quote instead of saying what the measuring shows","hint":"Cover the quote and read the last sentence on its own. Does it add anything new?","explain":"The point answers a real question about Marcus. The evidence is good, because measuring the bank does contain planning. The failure is the last sentence. \"This shows he looked at the bank\" is the quote again in different words, which is saying, not showing. A working version would be: measuring the distance shows the reader he has already decided he may have to run for it.","topic":"english: marking an explanation that only restates the quote"},{"id":"e14-evidence-proves-point:q8","level":"medium","type":"text","q":"A pupil claims Dev treats the noise as normal. Copy the single word Dev himself uses in the extract for what the noise is.","answer":"settling","accept":["settling","settle","settling.","just settling","it settling","\"settling\""],"hint":"Look at what Dev says out loud after he laughs.","explain":"Dev says \"That's just it settling\". The word settling is the one that contains the claim, because settling is what safe, ordinary things do. That single word proves Dev has decided there is nothing to worry about, which is more than a quote about him sliding about on his heels would prove.","topic":"english: finding the word in the extract that contains the claim"},{"id":"e14-evidence-proves-point:q9","level":"medium","type":"mc","q":"Question: how does the writer show Marcus is more careful than Dev? A pupil wrote. Point: the ice is dangerous. Evidence: \"a long low note\". Explanation: it shows something moving under them. What is wrong?","options":["The point, because it is about the ice and not about Marcus","The evidence, because that quote is not anywhere in the extract","The explanation, because it only says the quote again in different words","Nothing is wrong, the ice really is dangerous in this extract"],"answer":"The point, because it is about the ice and not about Marcus","hint":"Read the question again, then read the pupil's first sentence. Are they about the same thing?","explain":"The quote is real, and the explanation does say what the words make the reader think, so those two parts work. The point is the problem. The question asked about Marcus being more careful than Dev, and the pupil wrote about the ice instead. A paragraph that proves something nobody asked about scores nothing, however well it is built.","topic":"english: marking a point that does not answer the question asked"},{"id":"e14-evidence-proves-point:q10","level":"medium","type":"mc","q":"Point: Dev is careless on the ice. Quote A: \"sliding on his heels with his arms wide\". Quote B: \"He shouted something about the middle\". Which quote better proves the point, and why?","options":["Quote A, because sliding on his heels with his arms wide contains the carelessness itself","Quote A, because he waited on the bank until Marcus had stepped onto the ice","Quote B, because shouting about something is always a careless thing to do","Quote B, because the middle of any frozen lake has the thinnest ice at this time of year"],"answer":"Quote A, because sliding on his heels with his arms wide contains the carelessness itself","hint":"One quote shows you what Dev is doing with his body. The other does not even tell you what he said.","explain":"Quote A contains the claim. Sliding about with your arms out is what you do when you are not worried about falling through, so the carelessness is inside the words. Quote B does not work, because the extract never says what he shouted, so you would be guessing. The answer about the middle of a frozen lake is true about real ice, but it is not in the extract, and you cannot prove a point with something the writer did not put there. The answer about waiting on the bank has it the wrong way round, because Dev was out on the ice first and Marcus was the one who stayed behind.","topic":"english: choosing which of two quotes better proves the point"},{"id":"e14-evidence-proves-point:q11","level":"stretch","type":"mc","q":"Evidence: Marcus \"kept the other end wound twice around his fist\". Which explanation sentence says what winding it twice makes the reader think, rather than restating it?","options":["This shows that Marcus was holding the rope tightly in his hand and would not let go.","Winding it twice shows the reader he expected to take Dev's whole weight when the ice gave way.","This shows that the rope was long enough to reach right across the ice to where Dev was standing.","The writer mentions his fist at the end of the paragraph, just before Marcus speaks."],"answer":"Winding it twice shows the reader he expected to take Dev's whole weight when the ice gave way.","hint":"Ask why twice and not once. What is he getting ready for?","explain":"The answer about holding the rope tightly is the quote again in easier words, which is restating. The answer about the rope being long enough adds nothing new, because the extract has already said he pushed one end across to Dev, so you knew it reached. The answer about his fist at the end of the paragraph only points at where the words are. The answer about winding it twice starts from the word twice and says what it makes the reader expect, which is that Marcus thinks he is about to be holding his friend up. That is showing.","topic":"english: writing an explanation that says what the detail implies"},{"id":"e14-evidence-proves-point:q12","level":"stretch","type":"long","marks":4,"q":"How does the writer show that Marcus does not trust the ice? Write one paragraph of about 45 to 55 words. One point, two short quotes that contain the mistrust, and an explanation sentence for each quote that says what the words make the reader think rather than what they say.","answer":"Marcus does not trust the ice. He looks at it like \"a dog you do not know\". A strange dog can turn with no warning, so the reader expects the ice to break. He winds the rope \"twice around his fist\". That tells the reader he already expects to be pulling Dev out.","explain":"Four marks is made of four things. One, a point that answers the question asked, about Marcus and the ice, not about Dev. Two, two short quotes, copied correctly, that each contain mistrust inside them, so the strange dog or the fist, not the nine days of frost. Three, an explanation sentence for each quote that says what the words make the reader think. Four, no sentence anywhere that only says the quote again. Read your paragraph back and cross out any sentence that would still be true if the quote were deleted.","topic":"english: writing one analytical paragraph with point, evidence and explanation"}]},"s11-particles-state-changes":{"id":"s11-particles-state-changes","day":"Day 4","subject":"Science","title":"Particles and changes of state","minutes":20,"objective":"Use a table of melting and boiling points to say what state a substance is in at any temperature, and name a change of state correctly by asking whether the substance is becoming a gas or stopping being one.","extract":"MELTING AND BOILING POINTS, ALL VALUES AT NORMAL AIR PRESSURE\n\nA table with five substances and three columns. The columns are: Substance, Melting point in degrees C, Boiling point in degrees C.\n\nOxygen: melting point minus 219, boiling point minus 183.\nEthanol: melting point minus 114, boiling point 78.\nWater: melting point 0, boiling point 100.\nMercury: melting point minus 39, boiling point 357.\nSulfur: melting point 115, boiling point 445.\n\nAll values are rounded to the nearest whole degree.\n\nHow to read it. Below its melting point a substance is solid. Between its melting point and its boiling point it is liquid. Above its boiling point it is a gas.","teach":{"intro":["Solid, liquid and gas are not three different things. They are the same particles arranged three different ways. In a solid the particles are touching and locked in a fixed pattern, vibrating on the spot. In a liquid they are still touching but they slide past each other. In a gas they are far apart and moving fast in all directions. A change of state never changes what the substance is, so ice, water and steam are all the same substance.","What moves a substance between those three is energy. Heating gives the particles energy, so they move more and eventually break away from each other. Cooling takes energy away, so they slow down and settle closer together. The two temperatures where that happens have names. The melting point is where solid and liquid swap over, and the boiling point is where liquid and gas swap over. So below the melting point a substance is solid, between the two it is liquid, and above the boiling point it is a gas.","Here are the six changes you need, and every one of them has a direction. Melting is solid to liquid. Freezing is liquid to solid. Evaporation and boiling are both liquid to gas. Condensation is gas to liquid. Sublimation is solid straight to gas, skipping the liquid altogether.","Evaporation and condensation are the pair that get swapped most, so hang them on a direction. Evaporation goes up and away. Condensation comes back and settles. Picture a cold can of drink on a warm day. The water on the outside of the can did not leak out of the can, it came back out of the air and settled on the cold metal, so that is condensation. Before you name any change, ask one question: is the substance becoming a gas, or stopping being one?"],"example":{"problem":"Using the table, sulfur is heated from 20 degrees C up to 200 degrees C. What state is it at the start, what state is it at the end, and what change of state happened?","steps":["Find the sulfur row. Melting point 115 degrees C, boiling point 445 degrees C.","Start at 20 degrees C. 20 is below the melting point of 115, so sulfur is solid at the start.","End at 200 degrees C. 200 is above 115 but below 445, so it sits between the two numbers, and between the two numbers a substance is liquid.","Solid to liquid is melting, so the change of state is melting.","Check which numbers the heating passed. It passed 115 on the way up, and 115 is the melting point. It never reached 445, so sulfur never boiled."],"answer":"Solid at 20 degrees C, liquid at 200 degrees C, and the change of state was melting."},"example2":{"problem":"A pupil's work. Line 1: a puddle on the yard dried up overnight, and the ground stayed at 12 degrees C. Line 2: the liquid water went into the air as a gas. Line 3: so the water condensed into the air. Find the first wrong line and correct it.","steps":["Check line 1. The facts are fine, a puddle dried up and the ground was nowhere near 100 degrees C.","Check line 2. Liquid water going into the air as a gas is correct, so line 2 stays.","Check line 3. Ask the test question: is the substance becoming a gas, or stopping being one?","It is becoming one, so the change is evaporation, which goes up and away. Condensation is the opposite, gas coming back to liquid and settling.","Line 3 is the first wrong line. It should say the water evaporated into the air.","It is not boiling either, because the ground stayed at 12 degrees C, far below the boiling point of water, and the water only left the surface of the puddle."],"answer":"Line 3 is the first wrong line. It should say the water evaporated into the air, not condensed."},"keyfact":"Before you name a change of state, ask whether the substance is becoming a gas or stopping being one, because evaporation goes up and away and condensation comes back and settles."},"questions":[{"id":"s11-particles-state-changes:q1","level":"easy","type":"mc","q":"In which one of these are the particles packed closely together in a fixed pattern, vibrating on the spot but not moving around?","options":["A solid","A liquid","A gas","None of them"],"answer":"A solid","hint":"Think about which one holds its own shape without needing a container.","explain":"In a solid the particles are touching, held in a fixed pattern, and all they can do is vibrate on the spot. That is why a solid keeps its own shape. In a liquid the particles are still touching but they slide past each other, so a liquid takes the shape of its container. In a gas the particles are far apart and moving fast in all directions, so a gas spreads out to fill whatever it is in.","topic":"science: solids, liquids and gases as particle arrangement"},{"id":"s11-particles-state-changes:q2","level":"easy","type":"mc","q":"A tray of ice is left out and melts into water. What has happened to the particles?","options":["They are the same particles, now sliding past each other instead of sitting in a fixed pattern","They have changed into brand new particles, because water is not the same substance as ice","Half of the particles have been destroyed","They have stopped moving altogether"],"answer":"They are the same particles, now sliding past each other instead of sitting in a fixed pattern","hint":"A change of state never changes what the substance is.","explain":"Ice and water are the same substance all the way through. Melting does not swap the particles for different ones and it does not get rid of any of them. Heating has given the particles energy, so they break out of the fixed pattern and start sliding past each other. That is all a change of state ever is, the same particles arranged differently and moving a different amount.","topic":"science: a change of state does not change the substance"},{"id":"s11-particles-state-changes:q3","level":"easy","type":"text","q":"Using the table, what state is mercury at 250 degrees C? Answer in one word.","answer":"liquid","accept":["liquid","a liquid","liquid.","it is liquid","Liquid"],"hint":"Find the mercury row. Is 250 below its melting point, between the two numbers, or above its boiling point?","explain":"Mercury melts at minus 39 degrees C and boils at 357 degrees C. 250 sits between those two numbers, and between the melting point and the boiling point a substance is liquid. So mercury is liquid at 250 degrees C. It has melted, because 250 is well past minus 39, but it is not a gas yet, because 250 has not reached 357.","topic":"science: reading a state off a melting and boiling point table"},{"id":"s11-particles-state-changes:q4","level":"easy","type":"mc","q":"On a warm day a cold can of drink gets covered in water droplets on the outside. Water vapour in the air touched the cold can and turned into liquid water. What is that change called?","options":["Condensation","Evaporation","Melting","Freezing"],"answer":"Condensation","hint":"Ask the test question. Is the substance becoming a gas, or stopping being one?","explain":"The water started as vapour, which is a gas, and ended as a liquid. Ask the test question: is the substance becoming a gas, or stopping being one? It is stopping being one, so this is condensation. The water did not leak out of the can. It came back out of the air and settled on the cold metal. Melting and freezing both involve a solid, and there is no solid here, so neither of those fits.","topic":"science: naming a change of state from its direction"},{"id":"s11-particles-state-changes:q5","level":"medium","type":"mc","q":"Using the table, which one of these substances is solid at 40 degrees C?","options":["Sulfur","Water","Ethanol","Mercury"],"answer":"Sulfur","hint":"A substance is solid when the temperature is below its melting point.","explain":"Sulfur has a melting point of 115 degrees C. 40 is below 115, so sulfur has not melted yet and it is still solid. The other three have all passed their melting points long before 40 degrees C. Water melts at 0, ethanol melts at minus 114 and mercury melts at minus 39, so at 40 degrees C all three of those are liquid.","topic":"science: reading a state off a melting and boiling point table"},{"id":"s11-particles-state-changes:q6","level":"medium","type":"text","q":"Using the table, which substance stays liquid over the widest range of temperatures? Write its name.","answer":"mercury","accept":["mercury","Mercury","mercury.","hg","Hg"],"hint":"For each substance, take its melting point away from its boiling point. The biggest gap wins.","explain":"A substance is liquid between its melting point and its boiling point, so the size of that gap is what you compare. Oxygen, minus 183 take away minus 219, is 36 degrees. Ethanol, 78 take away minus 114, is 192 degrees. Water, 100 take away 0, is 100 degrees. Mercury, 357 take away minus 39, is 396 degrees. Sulfur, 445 take away 115, is 330 degrees. Mercury has the biggest gap at 396 degrees, so mercury stays liquid over the widest range.","topic":"science: using the table to compare liquid ranges"},{"id":"s11-particles-state-changes:q7","level":"medium","type":"mc","q":"A pupil's work. Line 1: a puddle on the playground slowly dries up on a dry day, and the ground is at 18 degrees C, well below the boiling point of water. Line 2: the liquid water is turning into water vapour and going into the air. Line 3: so this is condensation. Which line is the first wrong one, and what should it say?","options":["Line 3, it should say this is evaporation","Line 3, it should say this is boiling","Line 2, it should say the water vapour is turning into liquid water","No line is wrong, condensation is correct"],"answer":"Line 3, it should say this is evaporation","hint":"Ask the test question. Is the substance becoming a gas, or stopping being one?","explain":"Line 2 is correct, the water really is going from liquid to gas. Line 3 is the first wrong line, because it names the change the wrong way round. Ask the test question: is the substance becoming a gas, or stopping being one? It is becoming one, so this is evaporation, which goes up and away. Condensation is the other direction, gas coming back to liquid and settling. It is not boiling either, because the ground is at 18 degrees C, far below the boiling point of water, and the water is only leaving the surface of the puddle.","topic":"science: marking the evaporation and condensation swap"},{"id":"s11-particles-state-changes:q8","level":"medium","type":"text","q":"A pupil wrote this about the cold can of drink: the water on the outside of the can has evaporated out of the air. One word is wrong. Write the word it should be.","answer":"condensed","accept":["condensed","condensation","condenses","condensing","Condensed","Condensation"],"hint":"Which direction did the water go, from gas to liquid, or from liquid to gas?","explain":"The water on the can started as water vapour, which is a gas, and ended as liquid water on the metal. Ask the test question: is the substance becoming a gas, or stopping being one? It is stopping being one, so the word evaporated points the wrong way. It should be condensed. Evaporation goes up and away, condensation comes back and settles, and this water has come back out of the air and settled on the can.","topic":"science: marking the evaporation and condensation swap"},{"id":"s11-particles-state-changes:q9","level":"medium","type":"mc","q":"A pupil's work using the table. Line 1: ethanol has a melting point of minus 114 degrees C. Line 2: minus 150 degrees C is colder than that. Line 3: so at minus 150 degrees C ethanol is liquid. What is wrong?","options":["Line 3 is wrong. Minus 150 is below the melting point, so ethanol is solid","Line 3 is wrong. Minus 150 is above the boiling point, so ethanol is a gas","Line 1 is wrong. The melting point of ethanol is 78 degrees C","Nothing is wrong. Ethanol is liquid at minus 150 degrees C"],"answer":"Line 3 is wrong. Minus 150 is below the melting point, so ethanol is solid","hint":"Below the melting point a substance has not melted yet.","explain":"Lines 1 and 2 are both correct, minus 150 really is colder than minus 114. Line 3 gets the direction backwards. Below the melting point the substance has not melted yet, so it is still solid. Ethanol is liquid between minus 114 and 78 degrees C, and minus 150 sits outside that range on the cold side, so ethanol is solid at minus 150 degrees C. The answer saying minus 150 is above the boiling point is wrong too, because minus 150 is nowhere near above 78, it is far below it. The answer saying the melting point of ethanol is 78 mixes the two columns up, because 78 is in the boiling point column.","topic":"science: marking a state read off the table with the direction backwards"},{"id":"s11-particles-state-changes:q10","level":"stretch","type":"text","q":"Using the table, one of the five substances changes state twice as it is heated from minus 50 degrees C up to 200 degrees C. Write its name.","answer":"water","accept":["water","Water","water.","h2o","H2O"],"hint":"For each substance, count how many of its two numbers the heating passes on the way up.","explain":"A substance changes state once for each of its own two numbers that the heating passes. Water melts at 0 and boils at 100, and both of those sit between minus 50 and 200, so water changes twice, solid to liquid and then liquid to gas. Oxygen is already a gas at minus 50, because it boils at minus 183, so it changes zero times. Ethanol is already liquid at minus 50, because it melts at minus 114, and it only passes its boiling point of 78, so it changes once. Mercury passes its melting point of minus 39 but never reaches its boiling point of 357,
