<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Suraj">
<title>Suraj - progress</title>
<style>
.viz-root, :root{
  color-scheme: dark;
  --surface-1:#0f1215; --panel:#171b20; --panel2:#1e242b; --line:#2a323b;
  --text-primary:#e8edf2; --text-secondary:#93a1b0; --muted:#898781;
  --grid:#2c2c2a; --baseline:#383835;
  --series-1:#3987e5;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--surface-1);color:var(--text-primary);
font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:960px;margin:0 auto;padding:16px 16px 80px}
h1{font-size:24px;font-weight:650;margin:0;letter-spacing:-.3px}
h2{font-size:18px;font-weight:620;margin:0}
h3{font-size:15px;font-weight:600;margin:0}
.sec{color:var(--text-secondary)}.muted{color:var(--muted);font-size:14px}
.small{font-size:14px}
header{position:sticky;top:0;z-index:20;background:rgba(15,18,21,.95);backdrop-filter:blur(12px);
border-bottom:1px solid var(--line);padding:calc(12px + env(safe-area-inset-top)) 16px 12px}
.hd{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hd h1{flex:1;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:14px 0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.btn{min-height:44px;padding:11px 16px;background:var(--series-1);color:#04121f;border-radius:11px;
font-weight:640;font-size:15px}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text-primary);font-weight:550}
.btn.wide{display:block;width:100%;text-align:center;margin-top:12px}
input[type=text]{width:100%;min-height:50px;padding:13px 15px;font-size:16px;background:var(--panel2);
border:1.5px solid var(--line);border-radius:11px;color:var(--text-primary);-webkit-appearance:none;margin-top:10px}
input:focus{outline:0;border-color:var(--series-1)}

/* stat tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.tile .v{font-size:34px;font-weight:680;line-height:1.05;letter-spacing:-1px}
.tile .l{color:var(--text-secondary);font-size:13.5px;margin-top:6px}
.tile .s{font-size:13px;margin-top:8px;display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:99px;flex:0 0 9px}

/* bar chart: one series, magnitude, single hue. no legend by design */
.chart{margin-top:14px}
.row{display:grid;grid-template-columns:112px 1fr 54px;gap:12px;align-items:center;margin:9px 0}
.row .nm{font-size:14px;color:var(--text-secondary);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{height:22px;background:var(--panel2);border-radius:4px;position:relative;overflow:hidden}
.fill{height:100%;background:var(--series-1);border-radius:0 4px 4px 0;transition:width .4s ease;min-width:2px}
.fill.low{background:var(--critical)}
.fill.mid{background:var(--warning)}
.row .vl{font-size:14px;font-variant-numeric:tabular-nums;color:var(--text-primary)}
.axis{display:grid;grid-template-columns:112px 1fr 54px;gap:12px;margin-top:6px}
.ticks{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;
border-top:1px solid var(--baseline);padding-top:4px}

table{width:100%;border-collapse:collapse;margin-top:12px;font-size:14.5px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--text-secondary);font-weight:600;font-size:12.5px;text-transform:uppercase;letter-spacing:.5px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:4px 10px;border-radius:99px;font-size:12.5px;font-weight:620;
background:var(--panel2);color:var(--text-secondary);white-space:nowrap}
.pill.good{background:rgba(12,163,12,.16);color:#5ede5e}
.pill.bad{background:rgba(208,59,59,.16);color:#f08a8a}
.pill.warn{background:rgba(250,178,25,.16);color:#f5c451}
details{border-top:1px solid var(--line);padding:12px 0}
details>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;min-height:32px}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:'show';margin-left:auto;color:var(--series-1);font-size:13.5px}
details[open]>summary::after{content:'hide'}
.qa{background:var(--panel2);border-radius:10px;padding:13px 14px;margin:9px 0;font-size:14.5px;line-height:1.55}
.qa .q{margin-bottom:8px;white-space:pre-wrap}
.qa .a{margin:4px 0}
.wrongv{color:#f08a8a}.rightv{color:#5ede5e}
.tag{display:inline-block;padding:4px 10px;border-radius:99px;font-size:12.5px;background:var(--panel2);
color:var(--text-secondary);margin:4px 5px 0 0}
.tag.no{background:rgba(208,59,59,.14);color:#f08a8a}
.tag.ok{background:rgba(12,163,12,.14);color:#5ede5e}
.shots{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.shots a{display:block}
.shots img{width:130px;height:130px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.empty{color:var(--muted);font-size:14.5px;padding:8px 0}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 0}
.tab{padding:9px 15px;border-radius:99px;font-size:14.5px;background:var(--panel);
border:1px solid var(--line);color:var(--text-secondary);min-height:40px}
.tab.on{background:var(--series-1);color:#04121f;border-color:var(--series-1);font-weight:620}
.tip{position:fixed;pointer-events:none;background:#000;border:1px solid var(--line);border-radius:9px;
padding:8px 11px;font-size:13.5px;z-index:60;opacity:0;transition:opacity .12s;max-width:260px}
.nb{background:rgba(250,178,25,.09);border:1px solid rgba(250,178,25,.28);border-radius:11px;
padding:13px 15px;margin:12px 0;font-size:14.5px;line-height:1.55}
</style></head>
<body>
<header><div class="hd">
  <h1>Suraj</h1><span class="pill" id="wk"></span>
  <span class="muted" id="stamp"></span>
  <button class="btn ghost" id="refresh">Refresh</button>
</div></header>
<div class="wrap" id="app"></div>
<div class="tip" id="tip"></div>
<script>
let P = {"sessions": {"m1-bidmas": {"id": "m1-bidmas", "day": "Monday", "subject": "Maths", "title": "Order of operations (BIDMAS)", "minutes": 25, "objective": "Work out a calculation in the agreed order so it gives one answer, not several.", "extract": null, "teach": {"intro": ["Written maths has to mean one thing only. If you read 3 + 4 x 2 left to right you get 14. If you multiply first you get 11. Two people, same writing, different answers. That cannot be allowed, so there is an agreed order.", "The order is not random. Multiplying is repeated adding, and an index is repeated multiplying, so each one is a stronger, faster operation than the one below it. The stronger operation gets done first. Brackets are you stepping in and overruling that by hand."], "example": {"problem": "Work out 4 + 2 x (7 - 4)^2", "steps": ["Brackets first. 7 - 4 = 3. The calculation is now 4 + 2 x 3^2.", "Indices next. 3^2 means 3 x 3 = 9. Now it is 4 + 2 x 9.", "Multiply next. 2 x 9 = 18. Now it is 4 + 18.", "Add last. 4 + 18 = 22."], "answer": "22"}, "keyfact": "BIDMAS: Brackets, Indices, Divide and Multiply left to right, Add and Subtract left to right."}, "questions": [{"id": "m1-bidmas:q1", "level": "easy", "type": "mc", "q": "In the calculation 6 + 2 x 5, which part do you work out first?", "options": ["6 + 2", "2 x 5", "6 + 5", "It does not matter"], "answer": "2 x 5", "hint": "Multiplying is a stronger operation than adding, so it goes first.", "explain": "The answer is 2 x 5. Multiply comes before add in BIDMAS, so you do 2 x 5 = 10 first, then 6 + 10 = 16. Reading it left to right and doing 6 + 2 = 8 first would give 8 x 5 = 40, which is wrong. The order is not about what is written first, it is about which operation is stronger.", "topic": "bidmas: multiplication before addition"}, {"id": "m1-bidmas:q2", "level": "easy", "type": "text", "q": "Work out 3 + 4 x 5", "answer": "23", "accept": ["23"], "hint": "There is no bracket here, so the multiplication does not wait its turn.", "explain": "The answer is 23. Multiply first: 4 x 5 = 20. Then add: 3 + 20 = 23. If you went left to right you would do 3 + 4 = 7 and then 7 x 5 = 35. That is a completely different answer, and it is the wrong one. This is exactly why the order exists.", "topic": "bidmas: multiplication before addition"}, {"id": "m1-bidmas:q3", "level": "easy", "type": "text", "q": "Work out (3 + 4) x 5", "answer": "35", "accept": ["35"], "hint": "The bracket tells you which part to finish first.", "explain": "The answer is 35. The bracket forces the addition to the front. 3 + 4 = 7, then 7 x 5 = 35. Compare this with the last question, which had the same numbers but no bracket and gave 23. The bracket is the tool you use when you want the weaker operation to go first.", "topic": "bidmas: brackets first"}, {"id": "m1-bidmas:q4", "level": "easy", "type": "mc", "q": "Work out 20 - 6 / 2", "options": ["7", "13", "17", "14"], "answer": "17", "hint": "Division is stronger than subtraction, so it does not queue behind it.", "explain": "The answer is 17. Divide first: 6 / 2 = 3. Then subtract: 20 - 3 = 17. Left to right would give 20 - 6 = 14 and then 14 / 2 = 7. Seven is there in the options on purpose. It is what you get by ignoring the order.", "topic": "bidmas: division before subtraction"}, {"id": "m1-bidmas:q5", "level": "medium", "type": "text", "q": "Work out 24 / (8 - 2) x 3", "answer": "12", "accept": ["12"], "hint": "Clear the bracket, then take the divide and the multiply strictly left to right.", "explain": "The answer is 12. Bracket first: 8 - 2 = 6, so the calculation is 24 / 6 x 3. Divide and multiply are equal in strength, so you go left to right. 24 / 6 = 4, then 4 x 3 = 12. If you had done the multiply first you would get 6 x 3 = 18 and then 24 / 18, which is not a whole number and is wrong. Equal strength means left to right, every time.", "topic": "bidmas: divide and multiply left to right"}, {"id": "m1-bidmas:q6", "level": "medium", "type": "text", "q": "Work out 5 x 3^2 - 10", "answer": "35", "accept": ["35"], "hint": "The index only applies to the 3, not to the 5.", "explain": "The answer is 35. Indices first: 3^2 = 3 x 3 = 9. Now it is 5 x 9 - 10. Multiply next: 5 x 9 = 45. Subtract last: 45 - 10 = 35. A common error is doing 5 x 3 = 15 first and then squaring to get 225. The power is attached to the 3 alone.", "topic": "bidmas: indices before multiplication"}, {"id": "m1-bidmas:q7", "level": "medium", "type": "mc", "q": "Work out 50 - 20 + 10", "options": ["40", "20", "80", "30"], "answer": "40", "hint": "Add and subtract are equally strong, so neither one jumps the queue.", "explain": "The answer is 40. Add and subtract have the same strength, so you work left to right. 50 - 20 = 30, then 30 + 10 = 40. The trap is reading the A of BIDMAS as meaning add before subtract. If you did 20 + 10 = 30 first you would get 50 - 30 = 20, which is wrong. The mnemonic lists them together because they are joint, not ranked.", "topic": "bidmas: add and subtract left to right"}, {"id": "m1-bidmas:q8", "level": "medium", "type": "text", "q": "Work out 2 + 3 x (10 - 4) / 2", "answer": "11", "accept": ["11"], "hint": "Bracket, then the multiply and divide left to right, then the add.", "explain": "The answer is 11. Bracket first: 10 - 4 = 6, so it becomes 2 + 3 x 6 / 2. Multiply and divide are joint, so left to right: 3 x 6 = 18, then 18 / 2 = 9. Now add: 2 + 9 = 11. Notice the addition sat there untouched until the very end, even though it is written first.", "topic": "bidmas: brackets then multiply and divide left to right"}, {"id": "m1-bidmas:q9", "level": "medium", "type": "text", "q": "Suraj buys 3 football shirts at 12 pounds each, then takes 9 pounds off with a voucher. Work out the total cost in pounds. Give just the number.", "answer": "27", "accept": ["27", "27.00", "£27", "27 pounds"], "hint": "Work out what the shirts cost before you take anything off.", "explain": "The answer is 27. Written as one calculation this is 3 x 12 - 9. The multiplication has to happen first, because the 3 x 12 is one single thing, the cost of the shirts. 3 x 12 = 36, then 36 - 9 = 27. Real life agrees with BIDMAS here. You cannot take the voucher off before you know the price.", "topic": "bidmas: multiplication before subtraction in context"}, {"id": "m1-bidmas:q10", "level": "stretch", "type": "mc", "q": "Where do the brackets go so that 6 + 6 / 3 x 2 gives an answer of 7?", "options": ["(6 + 6) / 3 x 2", "6 + 6 / (3 x 2)", "(6 + 6) / (3 x 2)", "6 + (6 / 3) x 2"], "answer": "6 + 6 / (3 x 2)", "hint": "Test all four. Each one has a different answer, and only one of them lands on 7.", "explain": "The answer is 6 + 6 / (3 x 2). Work through each option. (6 + 6) / 3 x 2 gives 12 / 3 = 4, then 4 x 2 = 8. Next, 6 + 6 / (3 x 2) gives 3 x 2 = 6, then 6 / 6 = 1, then 6 + 1 = 7. That is the one. (6 + 6) / (3 x 2) gives 12 / 6 = 2. And 6 + (6 / 3) x 2 gives 6 + 2 x 2 = 6 + 4 = 10, which is the same as the original with no brackets at all. Four placements, four different answers, same digits.", "topic": "bidmas: brackets change the answer"}, {"id": "m1-bidmas:q11", "level": "stretch", "type": "text", "q": "A climber loads a sled with 3 bags weighing 4 kg each and 2 bags weighing 7 kg each. He then throws off one of the 4 kg bags. Work out the mass on the sled in kg. Give just the number.", "answer": "22", "accept": ["22", "22kg", "22 kg"], "hint": "Two separate multiplications happen before anything is added or taken away.", "explain": "The answer is 22. As one calculation it is 3 x 4 + 2 x 7 - 4. Both multiplications go first because each one is a single total. 3 x 4 = 12 and 2 x 7 = 14. Now it is 12 + 14 - 4. Add and subtract left to right: 12 + 14 = 26, then 26 - 4 = 22. Two multiplications can be done in the same step because they do not affect each other.", "topic": "bidmas: two multiplications before adding"}, {"id": "m1-bidmas:q12", "level": "stretch", "type": "text", "q": "An old calculator has no BIDMAS and just works strictly left to right. Work out 7 + 3 x 4 - 2 the correct way, then work it out the calculator's way. What is the difference between the two answers? Give just the number.", "answer": "21", "accept": ["21"], "hint": "Get both answers first, then subtract the smaller from the larger.", "explain": "The answer is 21. The correct way: multiply first, 3 x 4 = 12, so 7 + 12 - 2, which gives 19 - 2 = 17. The calculator's way: 7 + 3 = 10, then 10 x 4 = 40, then 40 - 2 = 38. The difference is 38 - 17 = 21. One ignored rule moved the answer by 21 on a calculation with tiny numbers. On a bank balance or a bridge load, that is the whole problem.", "topic": "bidmas: comparing correct order with left to right"}]}, "m2-negatives": {"id": "m2-negatives", "day": "Tuesday", "subject": "Maths", "title": "Multiplying and dividing negative numbers", "minutes": 25, "objective": "Multiply and divide with negative numbers and know why the sign rules have to be what they are.", "extract": null, "teach": {"intro": ["You already work out 5 - (-3) = 8 correctly. Taking away a debt leaves you better off. Multiplying uses the same logic, so you are not starting from nothing here.", "Look at this pattern and keep it going. 3 x (-4) = -12, then 2 x (-4) = -8, then 1 x (-4) = -4, then 0 x (-4) = 0. Every time the left number drops by one, the answer climbs by 4. So the next line has to be -1 x (-4) = 4. Negative times negative is positive because that is the only answer that keeps the pattern unbroken.", "One thing carried over from yesterday. A power tells you how many times to multiply something by itself, and where the brackets sit changes everything. (-5)^2 means (-5) x (-5), which is 25, because the minus is inside the bracket and gets used twice. But -5^2 means take 5 x 5 and then make it negative, which is -25, because the minus is outside and is applied last."], "example": {"problem": "Work out (-6) x (-4) / (-8)", "steps": ["Do the multiply first, left to right. Ignore the signs for a moment: 6 x 4 = 24.", "Now the sign. There are two minus signs in that step, and two is even, so the answer is positive. That gives 24.", "Now the divide: 24 / (-8). Ignore signs: 24 / 8 = 3.", "One minus sign in that step, and one is odd, so the answer is negative. That gives -3."], "answer": "-3"}, "keyfact": "Count the minus signs. An even number of them gives a positive answer, an odd number gives a negative answer."}, "questions": [{"id": "m2-negatives:q1", "level": "easy", "type": "mc", "q": "Keep this pattern going: 3 x (-5) = -15, 2 x (-5) = -10, 1 x (-5) = -5. What is 0 x (-5)?", "options": ["0", "-5", "5", "-15"], "answer": "0", "hint": "Anything multiplied by zero is zero. Check that it fits the pattern too.", "explain": "The answer is 0. Zero lots of anything is nothing, so 0 x (-5) = 0. It also fits the pattern, because each answer is climbing by 5 each time: -15, then -10, then -5, then 0. Follow the same pattern one more step and you get -1 x (-5) = 5, which is the negative times negative rule appearing on its own.", "topic": "negatives: the pattern behind the sign rules"}, {"id": "m2-negatives:q2", "level": "easy", "type": "text", "q": "Work out 6 x (-3)", "answer": "-18", "accept": ["-18", "- 18", "−18", "–18", "minus 18", "neg 18"], "hint": "Six lots of a debt of 3.", "explain": "The answer is -18. Ignore the signs first: 6 x 3 = 18. Now count the minus signs. There is one, and one is odd, so the answer is negative. It gives -18. In plain terms, owing 3 pounds six times over means owing 18 pounds.", "topic": "negatives: positive times negative"}, {"id": "m2-negatives:q3", "level": "easy", "type": "mc", "q": "Work out (-4) x (-5)", "options": ["20", "-20", "-9", "9"], "answer": "20", "hint": "Count the minus signs, then decide if that count is odd or even.", "explain": "The answer is 20. Ignore the signs: 4 x 5 = 20. Now count the minus signs. There are two, and two is even, so the answer is positive. That gives 20. The options -9 and 9 come from adding instead of multiplying, so check which operation you are actually being asked for.", "topic": "negatives: negative times negative"}, {"id": "m2-negatives:q4", "level": "easy", "type": "text", "q": "Work out (-24) / 6", "answer": "-4", "accept": ["-4", "- 4", "−4", "–4", "minus 4", "neg 4"], "hint": "Dividing follows exactly the same sign rule as multiplying.", "explain": "The answer is -4. Ignore the signs: 24 / 6 = 4. There is one minus sign, and one is odd, so the answer is negative. It gives -4. Division and multiplication share the same sign rule because dividing is just multiplying by the flipped number.", "topic": "negatives: dividing a negative by a positive"}, {"id": "m2-negatives:q5", "level": "medium", "type": "text", "q": "Work out (-7) x (-8)", "answer": "56", "accept": ["56", "+56"], "hint": "Two minus signs. Two is an even number.", "explain": "The answer is 56. Ignore the signs: 7 x 8 = 56. There are two minus signs, and two is even, so the answer is positive. It stays as 56, with no minus in front. Writing -56 here is the most common slip, so always count the signs before you write anything down.", "topic": "negatives: negative times negative"}, {"id": "m2-negatives:q6", "level": "medium", "type": "text", "q": "Work out (-45) / (-9)", "answer": "5", "accept": ["5", "+5"], "hint": "How many lots of -9 fit into -45?", "explain": "The answer is 5. Ignore the signs: 45 / 9 = 5. There are two minus signs, and two is even, so the answer is positive, giving 5. Another way to see it: -9 x 5 = -45, so five lots of -9 make -45. That is what the division was asking.", "topic": "negatives: dividing a negative by a negative"}, {"id": "m2-negatives:q7", "level": "medium", "type": "mc", "q": "Work out (-2) x 3 x (-5)", "options": ["30", "-30", "10", "-10"], "answer": "30", "hint": "Work left to right, or just count every minus sign in the whole line.", "explain": "The answer is 30. Left to right: (-2) x 3 = -6, then -6 x (-5) = 30. Or count the signs across the whole calculation. There are two minus signs, and two is even, so the answer is positive. Either route gives 2 x 3 x 5 = 30 with a plus sign.", "topic": "negatives: multiplying three numbers"}, {"id": "m2-negatives:q8", "level": "medium", "type": "text", "q": "Work out (-5)^2", "answer": "25", "accept": ["25", "+25"], "hint": "The bracket means the whole of -5 is being squared.", "explain": "The answer is 25. The bracket means the minus is part of the number being squared, so (-5)^2 = (-5) x (-5). Two minus signs, which is even, so the answer is positive: 25. This is why squaring any number, positive or negative, never gives a negative answer.", "topic": "negatives: squaring a negative number"}, {"id": "m2-negatives:q9", "level": "medium", "type": "text", "q": "On a mountain the temperature drops by 3 degrees every hour for 6 hours. Write this as a multiplication and give the total change in degrees.", "answer": "-18", "accept": ["-18", "- 18", "−18", "–18", "minus 18", "-18 degrees", "neg 18", "6 x (-3) = -18", "6x(-3)=-18", "6 x -3 = -18"], "hint": "A drop is a negative change, and it happens six times.", "explain": "The answer is -18. Each hour the change is -3 degrees, and that happens 6 times, so the calculation is 6 x (-3). Ignore the signs: 6 x 3 = 18. One minus sign, which is odd, so the answer is negative: -18 degrees. If it started at 5 degrees, it would now be 5 - 18 = -13 degrees.", "topic": "negatives: multiplying a negative in context"}, {"id": "m2-negatives:q10", "level": "stretch", "type": "mc", "q": "Which statement is true?", "options": ["(-3)^2 = 9 and -3^2 = -9", "(-3)^2 = -9 and -3^2 = 9", "Both equal 9", "Both equal -9"], "answer": "(-3)^2 = 9 and -3^2 = -9", "hint": "Ask what exactly is being squared in each one. The bracket decides it.", "explain": "The answer is that (-3)^2 = 9 and -3^2 = -9. In (-3)^2 the bracket wraps the minus sign in, so you square the whole of -3: (-3) x (-3) = 9. In -3^2 there is no bracket, so BIDMAS says do the index first. You square only the 3 to get 9, and the minus sign is applied afterwards, giving -9. The two are genuinely different, and the bracket is the only thing separating them.", "topic": "negatives: (-3)^2 versus -3^2"}, {"id": "m2-negatives:q11", "level": "stretch", "type": "text", "q": "Work out (-3)^2 x (-2)^3 / (-6)", "answer": "12", "accept": ["12", "+12"], "hint": "Do both indices first, then take the multiply and divide left to right.", "explain": "The answer is 12. Indices first. (-3)^2 = (-3) x (-3) = 9, because two minus signs is even. (-2)^3 = (-2) x (-2) x (-2) = -8, because three minus signs is odd. The calculation is now 9 x (-8) / (-6). Left to right: 9 x (-8) = -72, one minus sign so it stays negative. Then -72 / (-6) = 12, because two minus signs make it positive. Odd powers of a negative stay negative, even powers turn positive.", "topic": "negatives: indices with signs and bidmas"}, {"id": "m2-negatives:q12", "level": "stretch", "type": "text", "q": "Seven negative numbers are multiplied together. None of them is zero. Is the answer positive or negative? Write one word.", "answer": "negative", "accept": ["negative", "neg", "minus", "a negative", "negative number", "it is negative"], "hint": "Every pair of minus signs cancels out to a plus. What happens to the sign left over?", "explain": "The answer is negative. Minus signs cancel in pairs, because each pair gives a positive. Seven signs make three complete pairs, which is six of them, and that leaves one minus sign with nothing to pair with. That single leftover sign makes the whole answer negative. The short version is that an odd count of minus signs always gives a negative answer, and seven is odd. The size of the numbers makes no difference at all.", "topic": "negatives: odd and even counts of minus signs"}]}, "m3-unlike": {"id": "m3-unlike", "day": "Wednesday", "subject": "Maths", "title": "Adding and subtracting fractions with unlike denominators", "minutes": 25, "objective": "Add and subtract fractions by first rewriting them so the pieces are the same size.", "extract": null, "teach": {"intro": ["You can already do 1/5 + 2/5 = 3/5. That works because the pieces are the same size, so you just count how many you have. With 1/2 + 1/3 you are stuck, because a half and a third are different sized pieces and counting them together means nothing.", "The fix is equivalence. 1/2 is exactly the same amount as 3/6, because cutting each piece into more pieces does not change how much you have, it only renames it. So you rename both fractions until the pieces match, and then you count.", "Two words that come up in the questions. Simplest form means divide the top and the bottom by the biggest number that goes into both, so 6/8 becomes 3/4. A mixed number is a whole number next to a fraction, like 1 5/6, and you get one by seeing how many whole times the bottom goes into the top. 11/6 is one whole six with 5 left over, so 1 5/6."], "example": {"problem": "Work out 2/3 + 1/4", "steps": ["The pieces do not match, so find a size that both can be cut into. The lowest common multiple of 3 and 4 is 12.", "Rename 2/3. Multiply top and bottom by 4, because 3 x 4 = 12. That gives 8/12.", "Rename 1/4. Multiply top and bottom by 3, because 4 x 3 = 12. That gives 3/12.", "Now the pieces match, so count them. 8 + 3 = 11, and the pieces are still twelfths."], "answer": "11/12"}, "keyfact": "Only the top numbers get added. The bottom number is not a number to add, it is a label saying how big the pieces are."}, "questions": [{"id": "m3-unlike:q1", "level": "easy", "type": "mc", "q": "Work out 3/7 + 2/7", "options": ["5/7", "5/14", "6/7", "5"], "answer": "5/7", "hint": "The pieces are already the same size, so just count them.", "explain": "The answer is 5/7. Both fractions are already in sevenths, so the pieces match and you simply count them: 3 sevenths plus 2 sevenths is 5 sevenths. The bottom stays as 7. It is a label telling you the pieces are sevenths, and adding the labels together to get 14 would be like saying 3 metres plus 2 metres equals 5 double metres.", "topic": "fractions: adding with the same denominator"}, {"id": "m3-unlike:q2", "level": "easy", "type": "mc", "q": "Which of these is the same amount as 1/2?", "options": ["3/6", "2/5", "1/3", "3/4"], "answer": "3/6", "hint": "Cut each half into three. How many small pieces do you have out of how many?", "explain": "The answer is 3/6. If you cut a cake into 6 pieces, then 3 of them is exactly half the cake. You get 3/6 from 1/2 by multiplying top and bottom by 3, and multiplying both by the same number never changes the value. That is the whole idea behind adding unlike fractions. You rename a fraction without changing what it is worth.", "topic": "fractions: equivalent fractions"}, {"id": "m3-unlike:q3", "level": "easy", "type": "text", "q": "Work out 1/2 + 1/4", "answer": "3/4", "accept": ["3/4", "0.75", ".75", "3 / 4"], "hint": "You only need to change one of the two fractions here.", "explain": "The answer is 3/4. Quarters are already smaller than halves, and 2 quarters make a half, so rewrite 1/2 as 2/4 by multiplying top and bottom by 2. Now both are quarters: 2/4 + 1/4 = 3/4. You did not have to touch the 1/4 at all, because 4 was already a multiple of 2.", "topic": "fractions: common denominator when one divides the other"}, {"id": "m3-unlike:q4", "level": "easy", "type": "text", "q": "Work out 1/2 + 1/3", "answer": "5/6", "accept": ["5/6", "5 / 6"], "hint": "Find a number that both 2 and 3 divide into.", "explain": "The answer is 5/6. Halves and thirds are different sizes, so find a size both can be cut into. Both 2 and 3 divide into 6. Rename 1/2 as 3/6 by multiplying top and bottom by 3. Rename 1/3 as 2/6 by multiplying top and bottom by 2. Now count: 3 + 2 = 5, so the answer is 5/6. Notice that 5/6 is a bit less than 1, which is a sensible size for a half plus a third.", "topic": "fractions: common denominator via LCM"}, {"id": "m3-unlike:q5", "level": "medium", "type": "text", "q": "Work out 2/5 + 1/3", "answer": "11/15", "accept": ["11/15", "11 / 15"], "hint": "5 and 3 share no factors, so multiply them together to get the common denominator.", "explain": "The answer is 11/15. The lowest common multiple of 5 and 3 is 15. Rename 2/5 by multiplying top and bottom by 3, which gives 6/15. Rename 1/3 by multiplying top and bottom by 5, which gives 5/15. Now the pieces match, so count: 6 + 5 = 11, giving 11/15. When two bottom numbers share no factors, multiplying them together always gives the lowest common multiple.", "topic": "fractions: common denominator via LCM"}, {"id": "m3-unlike:q6", "level": "medium", "type": "text", "q": "Work out 3/4 - 2/3", "answer": "1/12", "accept": ["1/12", "1 / 12"], "hint": "Subtracting needs matching pieces just as much as adding does.", "explain": "The answer is 1/12. The lowest common multiple of 4 and 3 is 12. Rename 3/4 by multiplying top and bottom by 3, which gives 9/12. Rename 2/3 by multiplying top and bottom by 4, which gives 8/12. Now subtract the tops: 9 - 8 = 1, so the answer is 1/12. The answer is tiny, which makes sense, because 3/4 and 2/3 are very close to each other.", "topic": "fractions: subtracting with unlike denominators"}, {"id": "m3-unlike:q7", "level": "medium", "type": "text", "q": "Work out 5/6 - 1/4", "answer": "7/12", "accept": ["7/12", "7 / 12"], "hint": "The lowest common multiple of 6 and 4 is not 24.", "explain": "The answer is 7/12. List the multiples: 6, 12, 18 and 4, 8, 12. The first one they share is 12, not 24. Rename 5/6 by multiplying top and bottom by 2, which gives 10/12. Rename 1/4 by multiplying top and bottom by 3, which gives 3/12. Subtract the tops: 10 - 3 = 7, so the answer is 7/12. Using 24 would also work, giving 14/24, but then you would have to simplify it back down to 7/12.", "topic": "fractions: common denominator via LCM"}, {"id": "m3-unlike:q8", "level": "medium", "type": "mc", "q": "What is the lowest common denominator for 3/8 and 5/12?", "options": ["24", "96", "20", "48"], "answer": "24", "hint": "Count up in eights and count up in twelves. Where do they first meet?", "explain": "The answer is 24. The multiples of 8 are 8, 16, 24, 32. The multiples of 12 are 12, 24, 36. The first number in both lists is 24. Multiplying 8 x 12 gives 96, which does work but is four times bigger than it needs to be and leaves you simplifying at the end. Adding 8 and 12 to get 20 does not work at all, because 20 is not a multiple of 8.", "topic": "fractions: finding the lowest common multiple"}, {"id": "m3-unlike:q9", "level": "medium", "type": "text", "q": "Suraj's phone is at 7/10 of a full battery. A game drains 1/4 of a full battery. What fraction of the battery is left?", "answer": "9/20", "accept": ["9/20", "9 / 20", "0.45"], "hint": "This is a subtraction. Find a size of piece that both tenths and quarters fit into.", "explain": "The answer is 9/20. The calculation is 7/10 - 1/4. The lowest common multiple of 10 and 4 is 20. Rename 7/10 by multiplying top and bottom by 2, which gives 14/20. Rename 1/4 by multiplying top and bottom by 5, which gives 5/20. Subtract the tops: 14 - 5 = 9, so 9/20 is left. That is just under half a battery, which fits, since it started at a bit over two thirds.", "topic": "fractions: subtracting unlike denominators in context"}, {"id": "m3-unlike:q10", "level": "stretch", "type": "text", "q": "Work out 5/6 - 1/10. Give your answer in its simplest form.", "answer": "11/15", "accept": ["11/15", "11 / 15"], "hint": "The lowest common multiple of 6 and 10 is smaller than 60, and the answer will still simplify.", "explain": "The answer is 11/15. The multiples of 6 are 6, 12, 18, 24, 30 and the multiples of 10 are 10, 20, 30, so the lowest common multiple is 30, not 60. Rename 5/6 by multiplying top and bottom by 5, which gives 25/30. Rename 1/10 by multiplying top and bottom by 3, which gives 3/30. Subtract the tops: 25 - 3 = 22, giving 22/30. That is not finished, because 22 and 30 are both even. Divide top and bottom by 2 to get 11/15.", "topic": "fractions: subtract then simplify"}, {"id": "m3-unlike:q11", "level": "stretch", "type": "text", "q": "Work out 2 1/3 + 1 1/2. Write your answer as a mixed number.", "answer": "3 5/6", "accept": ["3 5/6", "23/6", "3 and 5/6"], "hint": "Deal with the whole numbers on their own, then deal with the fraction parts.", "explain": "The answer is 3 5/6. Split the problem up. The whole numbers give 2 + 1 = 3. The fraction parts are 1/3 + 1/2, and the lowest common multiple of 3 and 2 is 6, so that becomes 2/6 + 3/6 = 5/6. Put the two halves of the work back together: 3 and 5/6, written as 3 5/6. You could also turn both into top heavy fractions, 7/3 + 3/2 = 14/6 + 9/6 = 23/6, which is the same amount.", "topic": "fractions: adding mixed numbers"}, {"id": "m3-unlike:q12", "level": "stretch", "type": "text", "q": "On a school day Suraj sleeps for 1/3 of the day, is in school for 1/4 of the day and travels for 1/12 of the day. What fraction of the day is left? Give your answer in its simplest form.", "answer": "1/3", "accept": ["1/3", "1 / 3"], "hint": "Add the three fractions first, then take that total away from one whole day.", "explain": "The answer is 1/3. First add the three fractions. The lowest common multiple of 3, 4 and 12 is 12. That gives 4/12 + 3/12 + 1/12 = 8/12. Now take that away from a whole day. A whole day is 1, and 1 written in twelfths is 12/12. So 12/12 - 8/12 = 4/12. Finally simplify by dividing top and bottom by 4, which gives 1/3. That is 8 hours of the day, which is a sensible check.", "topic": "fractions: subtracting from one whole and simplifying"}]}, "m4-multfrac": {"id": "m4-multfrac", "day": "Thursday", "subject": "Maths", "title": "Multiplying and dividing fractions", "minutes": 25, "objective": "Multiply and divide fractions, and understand why no common denominator is needed this time.", "extract": null, "teach": {"intro": ["Yesterday you could not add until the pieces were the same size. Today you do not need that at all, and it is going to feel like the rules just changed. They did not. Adding and multiplying are asking two different questions.", "Adding asks how many pieces there are altogether, so the pieces must match or the count is meaningless. Multiplying asks for a fraction of a fraction. 1/2 x 1/3 means take a third and cut it in half, which leaves a sixth. So you multiply the tops and multiply the bottoms, and matching pieces never comes into it.", "Dividing works the same way once you flip. To divide by a fraction, turn the second fraction upside down and multiply instead. That works because a fraction times its own upside down version always makes 1, so flipping exactly undoes the dividing."], "example": {"problem": "Work out 3/4 x 8/9", "steps": ["Look for common factors across the two fractions before multiplying. The 3 on top and the 9 on the bottom both divide by 3, so they become 1 and 3.", "The 8 on top and the 4 on the bottom both divide by 4, so they become 2 and 1.", "The calculation is now 1/1 x 2/3.", "Multiply the tops: 1 x 2 = 2. Multiply the bottoms: 1 x 3 = 3."], "answer": "2/3"}, "keyfact": "To multiply, do top times top and bottom times bottom. To divide, flip the second fraction and then multiply.", "example2": {"problem": "Work out 3/5 divided by 2/3", "steps": ["Leave the first fraction alone. 3/5 stays as 3/5.", "Flip the second one. 2/3 becomes 3/2.", "Change the divide sign to a multiply. Now it is 3/5 x 3/2.", "Multiply the tops. 3 x 3 = 9.", "Multiply the bottoms. 5 x 2 = 10."], "answer": "9/10"}}, "questions": [{"id": "m4-multfrac:q1", "level": "easy", "type": "mc", "q": "What is half of a half? In other words, work out 1/2 x 1/2", "options": ["1/4", "1/2", "1/3", "1"], "answer": "1/4", "hint": "Cut a half pizza in half again and look at the piece you end up with.", "explain": "The answer is 1/4. Half of a half is a quarter, which you already know from cutting things up. The written method agrees: multiply the tops, 1 x 1 = 1, and multiply the bottoms, 2 x 2 = 4, giving 1/4. Notice the answer is smaller than what you started with. Multiplying by a fraction below 1 always makes things smaller, which is the opposite of what multiplying usually does.", "topic": "fractions: multiplying top by top and bottom by bottom"}, {"id": "m4-multfrac:q2", "level": "easy", "type": "text", "q": "Work out 2/3 x 1/5", "answer": "2/15", "accept": ["2/15", "2 / 15"], "hint": "Tops together, bottoms together. No common denominator needed.", "explain": "The answer is 2/15. Multiply the tops: 2 x 1 = 2. Multiply the bottoms: 3 x 5 = 15. That gives 2/15, and it will not simplify because 2 and 15 share no factors. In words, you took one fifth of two thirds. The pieces got much smaller, which is why the bottom number got much bigger.", "topic": "fractions: multiplying two fractions"}, {"id": "m4-multfrac:q3", "level": "easy", "type": "text", "q": "Work out 3/4 x 1/2", "answer": "3/8", "accept": ["3/8", "3 / 8", "0.375"], "hint": "Half of three quarters.", "explain": "The answer is 3/8. Multiply the tops: 3 x 1 = 3. Multiply the bottoms: 4 x 2 = 8. That gives 3/8. Check it makes sense: half of 3/4 should be a bit under a half, and 3/8 is just under 4/8, so it fits.", "topic": "fractions: multiplying two fractions"}, {"id": "m4-multfrac:q4", "level": "easy", "type": "mc", "q": "Work out 1/4 x 12", "options": ["3", "48", "6", "1/3"], "answer": "3", "hint": "A quarter of 12 is something you can already do.", "explain": "The answer is 3. A quarter of 12 is 3, which is finding a fraction of an amount, something you already do well. The written method matches: write 12 as 12/1, then multiply the tops, 1 x 12 = 12, and the bottoms, 4 x 1 = 4, giving 12/4 = 3. Whole numbers are just fractions with a 1 underneath.", "topic": "fractions: multiplying a fraction by a whole number"}, {"id": "m4-multfrac:q5", "level": "medium", "type": "text", "q": "Work out 2/5 x 3/7", "answer": "6/35", "accept": ["6/35", "6 / 35"], "hint": "Straight across. Check at the end whether it simplifies.", "explain": "The answer is 6/35. Multiply the tops: 2 x 3 = 6. Multiply the bottoms: 5 x 7 = 35. That gives 6/35. It does not simplify, because the factors of 6 are 2 and 3 while 35 is made of 5 and 7, so they share nothing.", "topic": "fractions: multiplying two fractions"}, {"id": "m4-multfrac:q6", "level": "medium", "type": "text", "q": "Work out 3/8 x 4/9. Give your answer in its simplest form.", "answer": "1/6", "accept": ["1/6", "1 / 6"], "hint": "Look for numbers that cancel across the two fractions before you multiply anything.", "explain": "The answer is 1/6. Cancel first. The 3 on top and the 9 on the bottom both divide by 3, becoming 1 and 3. The 4 on top and the 8 on the bottom both divide by 4, becoming 1 and 2. You are left with 1/2 x 1/3, so top times top is 1 and bottom times bottom is 6, giving 1/6. If you multiply straight across instead you get 12/72, which is the same thing but needs dividing by 12 at the end. Cancelling first keeps the numbers small.", "topic": "fractions: simplifying before multiplying"}, {"id": "m4-multfrac:q7", "level": "medium", "type": "text", "q": "Work out 2/3 x 9", "answer": "6", "accept": ["6", "6/1"], "hint": "Two thirds of 9. Find one third first.", "explain": "The answer is 6. One third of 9 is 3, so two thirds is 6. The written method gives the same thing: 2/3 x 9/1, so the tops give 2 x 9 = 18 and the bottoms give 3 x 1 = 3, and 18/3 = 6. You could also cancel the 9 with the 3 first, turning them into 3 and 1, leaving 2 x 3 = 6.", "topic": "fractions: multiplying a fraction by a whole number"}, {"id": "m4-multfrac:q8", "level": "medium", "type": "text", "q": "Work out 1/2 divided by 1/4", "answer": "2", "accept": ["2", "2/1"], "hint": "How many quarters fit inside a half?", "explain": "The answer is 2. Think about it directly first. Two quarters fit inside a half, so the answer is 2. The method matches: flip the second fraction, so 1/4 becomes 4/1, then multiply. 1/2 x 4/1 gives 4/2, which is 2. This is also why dividing by a fraction below 1 makes the answer bigger. You are asking how many small pieces fit into something, and lots of them do.", "topic": "fractions: dividing by flipping the second fraction"}, {"id": "m4-multfrac:q9", "level": "medium", "type": "text", "q": "Work out 3/5 divided by 2/3", "answer": "9/10", "accept": ["9/10", "9 / 10", "0.9"], "hint": "Flip the second fraction, then multiply as normal.", "explain": "The answer is 9/10. Flip the second fraction so 2/3 becomes 3/2, then change the divide to a multiply. That gives 3/5 x 3/2. Multiply the tops: 3 x 3 = 9. Multiply the bottoms: 5 x 2 = 10. So the answer is 9/10. Flipping works because 2/3 x 3/2 = 1, so multiplying by the flipped fraction exactly undoes the original.", "topic": "fractions: dividing by flipping the second fraction"}, {"id": "m4-multfrac:q10", "level": "stretch", "type": "text", "q": "Work out 4/9 divided by 8/15. Give your answer in its simplest form.", "answer": "5/6", "accept": ["5/6", "5 / 6"], "hint": "Flip first, then hunt for numbers that cancel before multiplying.", "explain": "The answer is 5/6. Flip the second fraction so it becomes 15/8, then multiply: 4/9 x 15/8. Now cancel. The 4 and the 8 both divide by 4, becoming 1 and 2. The 15 and the 9 both divide by 3, becoming 5 and 3. That leaves 1/3 x 5/2, so the tops give 5 and the bottoms give 6, and the answer is 5/6. Multiplying straight across would give 60/72, which is the same but takes longer to tidy up.", "topic": "fractions: dividing then simplifying"}, {"id": "m4-multfrac:q11", "level": "stretch", "type": "text", "q": "A climbing rope is 3/4 of a metre long. It is cut into pieces that are each 1/8 of a metre long. How many pieces are there?", "answer": "6", "accept": ["6", "6 pieces"], "hint": "You are asking how many small lengths fit into the big one, so this is a division.", "explain": "The answer is 6. The question asks how many 1/8 metre pieces fit into 3/4 of a metre, so the calculation is 3/4 divided by 1/8. Flip the second fraction to get 8/1 and multiply: 3/4 x 8/1 gives 24/4, which is 6. Check it another way. Three quarters is the same as 6/8, and 6/8 is six lots of 1/8, so 6 pieces is right.", "topic": "fractions: dividing in a real context"}, {"id": "m4-multfrac:q12", "level": "stretch", "type": "text", "q": "A generator has 2/3 of a tank of fuel. Suraj runs it until 3/4 of that fuel has been burned. What fraction of a full tank is left? Give your answer in its simplest form.", "answer": "1/6", "accept": ["1/6", "1 / 6"], "hint": "The 3/4 is a fraction of the fuel in the tank, not of the whole tank. Work out how much was burned first.", "explain": "The answer is 1/6. The word to watch is 'of'. He burned 3/4 of the 2/3 that was there, so the fuel burned is 3/4 x 2/3. Multiply the tops to get 6 and the bottoms to get 12, giving 6/12, which simplifies to 1/2 of a full tank. Now take that away from what he started with: 2/3 - 1/2. The lowest common multiple of 3 and 2 is 6, so that is 4/6 - 3/6 = 1/6. There is one sixth of a tank left. The trap is subtracting 3/4 straight from 2/3, which would answer a question nobody asked.", "topic": "fractions: multiply then subtract in context"}]}, "e1-proofread": {"id": "e1-proofread", "day": "Monday", "subject": "English", "title": "Catching your own mistakes", "minutes": 25, "objective": "Build a repeatable proofreading routine and use it to find and fix the five mistakes that turn up most often in your own writing.", "extract": "PASSAGE A\nThe tunnel under the old mine had been shut for forty years. i went in with a torch and a rope. The air was cold, it tasted of rust. As I walk deeper the roof got lower and lower. I could hear water somewhere ahead. All I want was to get to the end and turn back.\n\nPASSAGE B\nStorm hit the coast at nine. Wind tore roof off the boathouse. Boats pulled against ropes. We watched from the wall until the rain came sideways and drove us back into the van.\n\nPASSAGE C\nThe dog came out of the fog first, the boy came after it. I was ready to run but then I see the badge on his coat. He was from the search team. i felt stupid for hiding. He asked me if I was hurt, I said no.\n\nPASSAGE D\ni had been walking since dawn. The path ran along ridge, it was narrow and wet. As I come round the last bend the valley opened out below me. All I want was somewhere dry to sit.", "teach": {"intro": ["You already know these rules. The placement test proved it. The trouble is that while you are writing, your head is busy making the story, and the rules go quiet. That is normal. It happens to everyone who writes at speed.", "So treat checking as a separate job with its own routine. One pass, one type of mistake. If you look for everything at once you will find nothing. Read it in your head at normal speaking speed, and check the last sentence of every paragraph twice, because that is where tired writing lives."], "example": {"problem": "Fix this: 'i climbed the fence, the yard was empty. As I cross it I hear a door open.'", "steps": ["Pass one, capitals. The first word is 'i'. It becomes 'I'.", "Pass two, joins. 'i climbed the fence' and 'the yard was empty' are both complete sentences. A comma cannot hold two complete sentences together. Use a full stop.", "Pass three, tense. The rest of it is past tense, so 'cross' becomes 'crossed' and 'hear' becomes 'heard'.", "Pass four, small words. Read it at normal speed and listen for a missing 'the', 'a', 'at' or 'to'.", "Read the finished version once more. It should still sound like you, only tighter."], "answer": "I climbed the fence. The yard was empty. As I crossed it I heard a door open."}, "keyfact": "One pass, one error type, and always read the last sentence of every paragraph twice."}, "questions": [{"id": "e1-proofread:q1", "level": "easy", "type": "mc", "q": "Passage A contains one comma splice, where a comma is holding together two complete sentences. Which sentence is it?", "options": ["The tunnel under the old mine had been shut for forty years.", "The air was cold, it tasted of rust.", "I could hear water somewhere ahead.", "As I walk deeper the roof got lower and lower."], "answer": "The air was cold, it tasted of rust.", "hint": "Cover the comma and read each half on its own. If both halves could stand alone as sentences, the comma is doing a job it cannot do.", "explain": "The answer is 'The air was cold, it tasted of rust.' Split it at the comma and you get 'The air was cold' and 'it tasted of rust'. Both are complete sentences with their own subject and verb, so a comma is too weak to join them. Fix it with a full stop, a semicolon, or a joining word: 'The air was cold. It tasted of rust.' The fourth option does have a fault, but it is a tense slip, not a comma splice.", "topic": "proofreading: comma splices"}, {"id": "e1-proofread:q2", "level": "easy", "type": "text", "q": "Passage A contains a word that should have a capital letter but does not. Write that word exactly as it appears in the passage.", "answer": "i", "accept": ["i", "I", "i ", " i"], "hint": "It is one letter long and it is standing at the start of a sentence.", "explain": "The word is 'i' in 'i went in with a torch and a rope'. The word 'I' is always a capital letter in English, wherever it appears in the sentence, and here it also starts the sentence, so it needs a capital twice over. This is the cheapest mark in any exam to lose, and the cheapest to get back. Make it its own proofreading pass: scan the page for lone 'i' letters and nothing else.", "topic": "proofreading: capital I"}, {"id": "e1-proofread:q3", "level": "easy", "type": "mc", "q": "Passage A is written in the past tense. Which version of this sentence fits the rest of the passage? 'As I walk deeper the roof got lower and lower.'", "options": ["As I walk deeper the roof got lower and lower.", "As I walked deeper the roof got lower and lower.", "As I walk deeper the roof gets lower and lower.", "As I walking deeper the roof got lower and lower."], "answer": "As I walked deeper the roof got lower and lower.", "hint": "Find the verb in the first half and the verb in the second half. They have to be in the same time.", "explain": "The answer is 'As I walked deeper the roof got lower and lower.' The sentence has two verbs, 'walk' and 'got'. 'Got' is past, so 'walk' has to be 'walked'. The third option is at least consistent inside itself, but it is present tense, and every other sentence in Passage A is past, so it clashes with the whole piece. The fourth option is not a working verb form at all.", "topic": "proofreading: tense consistency"}, {"id": "e1-proofread:q4", "level": "easy", "type": "text", "q": "Passage B has small words missing. Write the one word missing from the start of this sentence: 'Storm hit the coast at nine.'", "answer": "The", "accept": ["The", "the", "The ", "the "], "hint": "It is the little word you would say out loud without thinking if you were telling someone what happened.", "explain": "The missing word is 'The'. It should read 'The storm hit the coast at nine.' Words like 'the' and 'a' are called articles. They tell the reader whether you mean one particular thing or any old one. Dropping them makes writing read like a text message or a headline. Passage B drops three more of them: 'Wind tore roof off the boathouse' needs 'The wind tore the roof', and 'Boats pulled against ropes' needs 'The boats pulled against the ropes'.", "topic": "proofreading: missing articles"}, {"id": "e1-proofread:q5", "level": "medium", "type": "mc", "q": "Which version of this sentence from Passage B has all its small words in place? 'Wind tore roof off the boathouse.'", "options": ["Wind tore roof off the boathouse.", "The wind tore the roof off the boathouse.", "The wind tore roof off the boathouse.", "Wind tore the roof off boathouse."], "answer": "The wind tore the roof off the boathouse.", "hint": "There are two things missing, not one. Check in front of every noun.", "explain": "The answer is 'The wind tore the roof off the boathouse.' Two articles were missing: one before 'wind' and one before 'roof'. The other two options each put one back and leave the other out. When you are checking for this, do not read for meaning, because your brain fills the gaps in for you. Instead point at each noun in turn and ask whether it needs a 'the' or an 'a' in front of it.", "topic": "proofreading: missing articles"}, {"id": "e1-proofread:q6", "level": "medium", "type": "text", "q": "This sentence from Passage A slips out of the past tense: 'All I want was to get to the end and turn back.' Write the one word that should replace 'want'.", "answer": "wanted", "accept": ["wanted", "wanted.", "Wanted"], "hint": "The word 'was' later in the sentence tells you which time you are in. Match the first verb to it.", "explain": "The answer is 'wanted'. The sentence should read 'All I wanted was to get to the end and turn back.' The verb 'was' is past, so 'want' has to be past too. This slip happens because the feeling is still real to you as you write, so your hand types the present. The fix is mechanical: after you finish a paragraph, run one pass where you only look at verbs, and check every single one is in the same time.", "topic": "proofreading: tense consistency"}, {"id": "e1-proofread:q7", "level": "medium", "type": "mc", "q": "Which sentence in Passage C slips out of the past tense?", "options": ["The dog came out of the fog first, the boy came after it.", "I was ready to run but then I see the badge on his coat.", "He was from the search team.", "He asked me if I was hurt, I said no."], "answer": "I was ready to run but then I see the badge on his coat.", "hint": "Two of these sentences have a punctuation fault, not a tense fault. Ignore those and look only at the verbs.", "explain": "The answer is 'I was ready to run but then I see the badge on his coat.' The verb 'was' is past and 'see' is present, in the same sentence. It should be 'saw'. The first and last options are both comma splices, so they are faulty, but the fault is punctuation and not tense. This is why one pass per error type works: hunting for tense slips means deliberately walking past the punctuation problems until the next pass.", "topic": "proofreading: tense consistency"}, {"id": "e1-proofread:q8", "level": "medium", "type": "mc", "q": "Which proofreading method is most likely to catch the mistakes you actually make?", "options": ["Read the whole piece once, quickly, looking out for anything that seems odd.", "Read it through several times, hunting one type of mistake per pass.", "Check only the first paragraph, because that is the part the examiner reads most carefully.", "Use the spare time to add more detail to the ending."], "answer": "Read it through several times, hunting one type of mistake per pass.", "hint": "Think about what happens to your attention when you are told to look for five different things at the same time.", "explain": "The answer is to read it several times, hunting one type of mistake per pass. When you look for everything at once, your brain drops back into reading for meaning, and reading for meaning is exactly what hides errors, because you see what you meant to write instead of what is on the page. Give each pass one job: capitals, then joins, then tense, then small words. Adding more at the end is the worst option of the four, because new writing done in a rush is where the next batch of errors comes from.", "topic": "proofreading: routine"}, {"id": "e1-proofread:q9", "level": "stretch", "type": "text", "q": "One small word is missing from this sentence. Write it. 'The rope was tied a post at the top of the cliff.'", "answer": "to", "accept": ["to", "To", "to ", "'to'"], "hint": "Ask yourself where the rope was tied. The answer needs a word that shows the connection between the rope and the post.", "explain": "The missing word is 'to'. The sentence should read 'The rope was tied to a post at the top of the cliff.' Words like to, at, on, under, through and from are prepositions, and they show how one thing sits in relation to another. When you drop one, the sentence still half works, so your eye slides over it. The reliable test is to read at normal speaking speed in your head, because your ear catches a missing preposition faster than your eye does.", "topic": "proofreading: missing prepositions"}, {"id": "e1-proofread:q10", "level": "stretch", "type": "mc", "q": "Only one of these sentences is fully correct. Which one?", "options": ["The ice cracked under my boot, I froze where I stood.", "As the light faded I check the map one more time.", "We left the van at the gate and walked the last mile in silence.", "He pulled rope tight and knotted it round the post."], "answer": "We left the van at the gate and walked the last mile in silence.", "hint": "Each wrong option has exactly one fault, and each fault is a different type. Run your passes: joins, tense, small words.", "explain": "The answer is 'We left the van at the gate and walked the last mile in silence.' It has one subject, two past tense verbs joined properly by 'and', and every article in place. The first option is a comma splice, because 'The ice cracked under my boot' and 'I froze where I stood' are both complete sentences. The second slips tense, since 'faded' is past and 'check' is present. The fourth is missing an article: it should be 'He pulled the rope tight'.", "topic": "proofreading: mixed error types"}, {"id": "e1-proofread:q11", "level": "stretch", "type": "long", "q": "Rewrite the last two sentences of Passage C so they are fully correct: 'i felt stupid for hiding. He asked me if I was hurt, I said no.' Keep the meaning exactly as it is.", "answer": "I felt stupid for hiding. He asked me if I was hurt, and I said no.", "marks": 3, "hint": "There are two faults, and they are different types. One is a capital letter. One is a comma doing a job that is too big for it.", "explain": "A strong answer does all three of these. One, it capitalises 'I' at the start of 'I felt stupid for hiding'. Two, it removes the comma splice in the last sentence, either by adding a joining word ('and I said no'), by using a full stop ('I was hurt. I said no.'), or by using a semicolon. Three, it changes nothing else. The meaning, the order of events and the plain tone all stay the same. Rewriting extra bits you were not asked about is how you introduce new errors.", "topic": "proofreading: correcting mixed errors"}, {"id": "e1-proofread:q12", "level": "stretch", "type": "long", "q": "Rewrite the whole of Passage D so that every error is fixed. There are five. Change nothing else.", "answer": "I had been walking since dawn. The path ran along a ridge. It was narrow and wet. As I came round the last bend the valley opened out below me. All I wanted was somewhere dry to sit.", "marks": 5, "hint": "Run your passes in order and count as you go: capitals, small words, joins, tense. You should find five, and no two of them are the same type.", "explain": "A strong answer fixes all five. One, 'i had been walking' becomes 'I had been walking'. Two, 'along ridge' becomes 'along a ridge', because the article is missing. Three, 'The path ran along a ridge, it was narrow and wet' is a comma splice, so it needs a full stop, a semicolon, or a joining word such as 'and'. Four, 'As I come round' becomes 'As I came round', because the rest is past tense. Five, 'All I want was' becomes 'All I wanted was'. It also leaves the images and the word order alone. Fixing the errors is the whole task.", "topic": "proofreading: correcting mixed errors"}]}, "e2-apostrophes": {"id": "e2-apostrophes", "day": "Tuesday", "subject": "English", "title": "Apostrophes for plural possession, and spotting adverbs", "minutes": 25, "objective": "Punctuate singular and plural possession correctly, and identify adverbs including the ones that do not end in ly.", "extract": "The climbers moved slowly along the ridge. Below them the valley was completely hidden by cloud. Two of the team checked the ropes carefully, then tightened the knots. The guides' radios crackled once and went dead. The wind hit hard and drove snow straight into their faces. Nobody spoke. The leader looked back often, counting heads, and waited until everyone was up before he moved again.", "teach": {"intro": ["You already own the apostrophe that stands for missing letters, as in don't and it's. This is the apostrophe's other job. It shows that something belongs to someone.", "The rule is short. Find the owner word first, before you touch anything. If the owner does not already end in s, add an apostrophe and then an s. If the owner already ends in s because it is a plural, put the apostrophe after that s and stop. So one dog gives the dog's bowl. Six dogs give the dogs' bowls. Children is plural but does not end in s, so it behaves like a singular: the children's bowls.", "Second job today, adverbs. An adverb tells you more about a verb, usually how, when, where or how much something was done. He ran quickly. He often ran. He ran hard. Plenty of adverbs never end in ly, and that is what catches people out: often, hard, straight, again, well, fast, back. Compare them with adjectives, which describe nouns. A quick runner is an adjective. He ran quickly is an adverb."], "example": {"problem": "Punctuate these three: the bowl belonging to one dog, the bowls belonging to six dogs, the bowls belonging to the children.", "steps": ["Owner is dog. Singular, does not end in s, so add apostrophe then s. The dog's bowl.", "Owner is dogs. Plural and already ends in s, so the apostrophe goes straight after that s and nothing else is added. The dogs' bowls.", "Owner is children. Plural, but it does not end in s, so it takes apostrophe then s just like a singular. The children's bowls.", "Check the meaning out loud. The dogs' bowls says there is more than one dog. The dog's bowls says there is one dog with several bowls. The apostrophe is carrying information, not decoration."], "answer": "the dog's bowl, the dogs' bowls, the children's bowls"}, "keyfact": "Find the owner word and put the apostrophe straight after it, adding an s only if the owner does not already end in one. Adverbs tell you how, when, where or how much, and many of them never end in ly."}, "questions": [{"id": "e2-apostrophes:q1", "level": "easy", "type": "mc", "q": "One dog owns one bowl. Which is correct?", "options": ["the dogs bowl", "the dog's bowl", "the dogs' bowl", "the dog's' bowl"], "answer": "the dog's bowl", "hint": "The owner is one dog. Does the word 'dog' end in s already?", "explain": "The answer is 'the dog's bowl'. The owner word is 'dog'. It is singular and does not end in s, so you add an apostrophe and then an s. 'The dogs bowl' has no apostrophe at all, so it just looks like more than one dog. 'The dogs' bowl' says there is more than one dog. The last option puts in two apostrophes, which is never right.", "topic": "apostrophes: singular possession"}, {"id": "e2-apostrophes:q2", "level": "easy", "type": "mc", "q": "Six dogs share a set of bowls. Which is correct?", "options": ["the dogs bowls", "the dog's bowls", "the dogs' bowls", "the dogs's bowls"], "answer": "the dogs' bowls", "hint": "Write the owner word first, exactly as it is: dogs. Now the apostrophe has only one place it can go.", "explain": "The answer is 'the dogs' bowls'. The owner is 'dogs', which is plural and already ends in s, so the apostrophe goes straight after that s and you add nothing more. 'The dogs bowls' has no apostrophe, so it shows no ownership. 'The dog's bowls' means one dog with several bowls, which is a different fact. 'The dogs's bowls' doubles the s, which English does not do for plurals ending in s.", "topic": "apostrophes: plural possession"}, {"id": "e2-apostrophes:q3", "level": "easy", "type": "mc", "q": "The coats belong to the children. Which is correct?", "options": ["the childrens' coats", "the children's coats", "the childrens coats", "the children's' coats"], "answer": "the children's coats", "hint": "Write the plural of child. Look at the last letter of the word you have just written.", "explain": "The answer is 'the children's coats'. 'Children' is already the plural of child, and it does not end in s, so it takes an apostrophe and then an s, exactly like a singular word would. The same happens with men's, women's, people's and mice's. 'Childrens' is not a word, so the first and third options are wrong before you even get to the apostrophe.", "topic": "apostrophes: irregular plural possession"}, {"id": "e2-apostrophes:q4", "level": "easy", "type": "mc", "q": "Which word in this sentence is the adverb? 'The engine roared loudly as the truck pulled away.'", "options": ["engine", "roared", "loudly", "truck"], "answer": "loudly", "hint": "Find the verb first. Then ask which word tells you how that verb was done.", "explain": "The answer is 'loudly'. The verb is 'roared', and 'loudly' tells you how it roared, so it is an adverb. 'Engine' and 'truck' are nouns, which are things. 'Roared' is the verb itself, which is the action, not a word describing the action.", "topic": "adverbs: identifying"}, {"id": "e2-apostrophes:q5", "level": "medium", "type": "text", "q": "Write the correct form: the bikes belonging to the boys.", "answer": "the boys' bikes", "accept": ["the boys' bikes", "boys' bikes", "The boys' bikes", "the boys’ bikes", "boys’ bikes", "The boys’ bikes", "the  boys' bikes"], "hint": "Owner first. The owner is boys, plural, already ending in s.", "explain": "The answer is 'the boys' bikes'. The owner word is 'boys'. It is plural and it already ends in s, so the apostrophe goes after the s with nothing added. Writing 'the boy's bikes' would mean one boy with several bikes. Writing 'the boys bikes' shows no ownership at all.", "topic": "apostrophes: plural possession"}, {"id": "e2-apostrophes:q6", "level": "medium", "type": "text", "q": "Read the extract. Write the single word in the first sentence that tells you how the climbers moved.", "answer": "slowly", "accept": ["slowly", "Slowly", "slowly.", "'slowly'"], "hint": "The verb in that sentence is 'moved'. Which word is attached to it?", "explain": "The answer is 'slowly'. The first sentence is 'The climbers moved slowly along the ridge.' The verb is 'moved' and 'slowly' tells you how the moving was done, which makes it an adverb. 'Along the ridge' tells you where, so it is doing an adverb's job too, but it is a phrase of three words rather than the single word the question asked for.", "topic": "adverbs: identifying"}, {"id": "e2-apostrophes:q7", "level": "medium", "type": "mc", "q": "Which sentence is correct?", "options": ["The players' arrived late.", "The players arrived late.", "The player's arrived late.", "The players's arrived late."], "answer": "The players arrived late.", "hint": "Ask what the players own in this sentence. If the answer is nothing, you do not need an apostrophe at all.", "explain": "The answer is 'The players arrived late.' Here 'players' is just a plural, meaning more than one player. Nothing belongs to them, so there is no apostrophe. An apostrophe only appears for ownership or for missing letters, never simply because a word ends in s. This is the most common apostrophe error in the country, and it comes from over-applying a rule you have just learned, so watch for it in your own work.", "topic": "apostrophes: plural without possession"}, {"id": "e2-apostrophes:q8", "level": "medium", "type": "mc", "q": "Which of these words from the extract is an adverb, even though it does not end in ly?", "options": ["ridge", "often", "radios", "leader"], "answer": "often", "hint": "Three of these are things you could point at. One of them tells you how much something happened.", "explain": "The answer is 'often'. In 'The leader looked back often', the verb is 'looked' and 'often' tells you how frequently he did it, which makes it an adverb. 'Ridge', 'radios' and 'leader' are all nouns. The extract holds several more adverbs with no ly on the end: 'hard' in 'the wind hit hard', 'straight' in 'drove snow straight into their faces', 'back' in 'looked back', and 'again' in 'before he moved again'. Never decide by the ending. Decide by the job the word is doing.", "topic": "adverbs: not all end in ly"}, {"id": "e2-apostrophes:q9", "level": "stretch", "type": "mc", "q": "In the sentence 'He shut the door quietly', which word does 'quietly' tell you more about?", "options": ["He", "shut", "the", "door"], "answer": "shut", "hint": "An adverb almost always attaches itself to the action, not to the person doing it or the thing it is done to.", "explain": "The answer is 'shut'. 'Quietly' describes how the shutting was done, and 'shut' is the verb, so the adverb is modifying the verb. It is not describing 'he', because that would need an adjective such as 'quiet', and it is not describing 'door' for the same reason. Getting this right is what lets you tell an adverb from an adjective every time: adjectives attach to nouns, adverbs attach to verbs.", "topic": "adverbs: what they modify"}, {"id": "e2-apostrophes:q10", "level": "stretch", "type": "text", "q": "Write the correct form: the changing room used by the players.", "answer": "the players' changing room", "accept": ["the players' changing room", "players' changing room", "The players' changing room", "the players’ changing room", "players’ changing room", "The players’ changing room", "the  players' changing room"], "hint": "There is more than one player, and the room belongs to all of them. Write the owner word out before you place the apostrophe.", "explain": "The answer is 'the players' changing room'. The owner is 'players', which is plural and already ends in s, so the apostrophe goes after the s and nothing is added. Notice that the thing owned is singular here, one room, but that makes no difference at all. The apostrophe is decided entirely by the owner word, never by the thing being owned.", "topic": "apostrophes: plural possession"}, {"id": "e2-apostrophes:q11", "level": "stretch", "type": "mc", "q": "Which sentence gets both its apostrophe and its adverb right?", "options": ["The two teams' coaches spoke quiet to their players.", "The two teams coaches spoke quietly to their players.", "The two teams' coaches spoke quietly to their players.", "The two team's coaches spoke quietly to their players."], "answer": "The two teams' coaches spoke quietly to their players.", "hint": "Two checks, one after the other. First, how many teams are there? Then, is the word after 'spoke' describing a person or an action?", "explain": "The answer is 'The two teams' coaches spoke quietly to their players.' The owner is 'teams', plural and ending in s, so the apostrophe goes after the s. The word after 'spoke' must be the adverb 'quietly', because it tells you how the speaking was done, and 'quiet' is an adjective which can only describe a noun. The second option drops the apostrophe entirely. The fourth writes 'team's', which claims there is only one team and directly contradicts the word 'two' sitting in front of it.", "topic": "apostrophes and adverbs: combined accuracy"}, {"id": "e2-apostrophes:q12", "level": "stretch", "type": "long", "q": "Rewrite this paragraph with the apostrophes corrected. There are four to fix. Change nothing else. 'The players kit was still in the changing room. The two coaches whistles hung on a hook by the door. Someones boots had been left under the bench, and the girls team were due in ten minutes.'", "answer": "The players' kit was still in the changing room. The two coaches' whistles hung on a hook by the door. Someone's boots had been left under the bench, and the girls' team were due in ten minutes.", "marks": 4, "hint": "For each one, say the owner word out loud on its own before you decide where the apostrophe goes. One of the four owners is singular, and it is easy to miss.", "explain": "A strong answer fixes all four and touches nothing else. One, 'players kit' becomes 'players' kit', because the owner is plural and ends in s. Two, 'coaches whistles' becomes 'coaches' whistles', same reason, and the word 'two' in front confirms it is plural. Three, 'Someones boots' becomes 'Someone's boots'. 'Someone' is singular and does not end in s, so it takes apostrophe then s. Four, 'girls team' becomes 'girls' team', where the owner is plural even though the thing owned, the team, is singular. A strong answer also leaves 'changing room', 'hook' and 'bench' alone, because nothing there owns anything.", "topic": "apostrophes: singular and plural possession"}]}, "e3-production": {"id": "e3-production", "day": "Wednesday", "subject": "English", "title": "Writing it right the first time", "minutes": 25, "objective": "Plan in two minutes, hold one tense from first line to last, and vary sentence openers on purpose while composing.", "extract": "PARAGRAPH A\nThe lift stopped between floors at twenty past six. The lights held for a second, then dropped to a dull orange. Ravi pressed the alarm and heard nothing at all. He put his bag on the floor and listened to the cable creaking somewhere above him.\n\nPARAGRAPH B\nThe market ran the whole length of the street. Traders shouted over each other for space. Smoke came off a grill near the corner and hung under the awnings. Nobody moved quickly here, because there was nowhere quick to get to.", "teach": {"intro": ["Accuracy at the end of a piece is decided at the start. Spend two minutes planning and you spend the next twenty thinking about words, because the question of what happens next is already answered. Skip the plan and you spend the whole time inventing, which is when the tense slips and the sentences run on.", "There are two more things you can control while you compose. Choose your tense in the first sentence and hold it to the last. And decide, on purpose, that no two sentences in a row will start the same way. Both of these are decisions, not talents. You can simply make them."], "example": {"problem": "Improve this: 'I walked to the shop. I bought a drink. I walked home. It was raining and I was cold.'", "steps": ["Look at the openers. Three sentences out of four start with 'I'. That is the main fault, not the events.", "Change the openers and keep the events. Start one sentence with a time phrase, such as 'By the time'. Start one with an adverb, such as 'Slowly'.", "Join two sentences where the link between them is real, so the writing has some flow instead of four separate lumps.", "Keep one short sentence at the end. A short sentence after longer ones lands harder.", "Last check, tense. Every verb must still be past."], "answer": "I walked to the shop and bought a drink. By the time I turned for home the rain had started. Slowly, the cold worked its way through my jacket. I walked the last hundred metres without feeling my hands."}, "keyfact": "Two minutes of planning, one tense held to the end, and no two sentences in a row starting the same way."}, "questions": [{"id": "e3-production:q1", "level": "easy", "type": "mc", "q": "You have forty minutes to write a description. What should the first two minutes look like?", "options": ["Write the first paragraph slowly and carefully, then speed up.", "Five bullet points: the opening image, three things you will describe, and the last line.", "A full paragraph plan written in proper sentences.", "Nothing. Planning wastes writing time."], "answer": "Five bullet points: the opening image, three things you will describe, and the last line.", "hint": "Two minutes is not long. Whatever you write down has to be readable at a glance while you are writing.", "explain": "The answer is the five bullet points. A plan is a set of instructions to yourself, so it needs to be short enough to write in two minutes and short enough to glance at without stopping. Writing the plan in full sentences burns the time you were saving. Skipping the plan feels faster for about four minutes and then costs you the ending, because you arrive there with nothing left to say. Deciding the last line before you start is the single most useful bullet of the five.", "topic": "planning: two minute plan"}, {"id": "e3-production:q2", "level": "easy", "type": "mc", "q": "Read Paragraph A in the extract. Which tense is it written in?", "options": ["Past tense", "Present tense", "Future tense", "It changes halfway through"], "answer": "Past tense", "hint": "Look at the verbs on their own: stopped, held, pressed, heard.", "explain": "The answer is past tense. Every verb is past: stopped, held, dropped, pressed, heard, put, listened. Nothing switches. Before you continue somebody else's writing, or your own after a break, name the tense first. If you cannot say which tense you are in, you cannot hold it.", "topic": "tense: holding one tense"}, {"id": "e3-production:q3", "level": "easy", "type": "text", "q": "Write the one word that fixes the tense in this sentence: 'We waited by the gate until the bus comes.'", "answer": "came", "accept": ["came", "Came", "came.", "'came'"], "hint": "The first verb is 'waited'. Put the second verb into the same time.", "explain": "The answer is 'came'. The sentence should read 'We waited by the gate until the bus came.' 'Waited' is past, so 'comes' has to become 'came'. Slips like this usually happen at a joining word, which is where your attention moves from the sentence you are finishing to the idea you are adding. Words such as until, when, as and because are the danger points. Slow down for half a second when you write one.", "topic": "tense: holding one tense"}, {"id": "e3-production:q4", "level": "easy", "type": "mc", "q": "Which of these sentences starts with an adverb?", "options": ["The door swung back slowly.", "Slowly, the door swung back.", "He watched the door swing back.", "When the door swung back, he moved."], "answer": "Slowly, the door swung back.", "hint": "The adverb is the same word in two of these options. Only its position changes.", "explain": "The answer is 'Slowly, the door swung back.' The adverb 'slowly' has been moved to the front of the sentence, which is one of the easiest ways to vary an opener. The first option contains the same adverb but leaves it at the end, so it opens with 'The' like most sentences do. The fourth option is also a good variation, but it opens with a subordinate clause beginning with 'When', not with an adverb. Keep three openers in your head: an adverb, a time phrase, and a 'When' or 'As' clause.", "topic": "sentence openers: variety"}, {"id": "e3-production:q5", "level": "medium", "type": "mc", "q": "Which version of this sentence is strongest? 'The man was walking quite fast down the road because he was late.'", "options": ["The man was walking quite fast down the road because he was late and worried.", "The man half ran down the road, late again.", "The man, who was late, was walking quite fast down the road.", "The man was late so he was walking down the road quite fast."], "answer": "The man half ran down the road, late again.", "hint": "Count the words in each one. Then look at what the main verb is actually doing in each.", "explain": "The answer is 'The man half ran down the road, late again.' It replaces the weak verb phrase 'was walking quite fast' with one strong verb, 'half ran', which shows the speed instead of measuring it. It also cuts the explaining. 'Late again' does the job of 'because he was late' in half the words and adds something new, a hint that this happens often. The other three keep the weak verb and either add more words or move them around, which is rearranging rather than improving.", "topic": "improving sentences: verb choice"}, {"id": "e3-production:q6", "level": "medium", "type": "mc", "q": "Which sentence continues Paragraph A best, keeping the same tense and the same tone?", "options": ["Then he gets out his phone and there
