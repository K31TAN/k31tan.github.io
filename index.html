nd dries out and crumbles"], "answer": "In a flood there is far more water moving faster, so the river has enough extra energy to erode straight through the land", "hint": "Erosion needs energy. What does a flood give the river more of?", "explain": "A flood means much more water moving much faster, so the river has far more energy than usual. Cutting through solid land needs a lot of energy, more than the river has on a normal day, so the breakthrough almost always happens in a flood. That is also why ox bow lakes appear suddenly rather than gradually, even though the loop that made them took centuries to form.", "topic": "river landforms: why floods trigger the cut through"}, {"id": "g9-river-landforms:q13", "level": "stretch", "type": "mc", "q": "A town builds concrete walls on top of the natural levees to stop flooding. The river keeps depositing sediment on its own bed, so the bed slowly rises. What is the risk?", "options": ["The river ends up flowing higher than the town, so if the walls ever fail the flood is far worse", "The river will dry up completely", "The river will start flowing uphill", "Deposition will stop happening altogether"], "answer": "The river ends up flowing higher than the town, so if the walls ever fail the flood is far worse", "hint": "The bed is rising but the town is not. Picture where the water level sits after a hundred years of that.", "explain": "Walls stop the river spreading out, but they do not stop deposition, so the bed keeps rising inside them. Over time the whole river ends up sitting above the level of the land around it, held in only by the walls. If the walls fail, water pours downhill into the town and the flood is much deeper than it would have been without them. This has happened on the Mississippi and on the Huang He in China, and it is why engineers now also use flood plains as deliberate overflow areas.", "topic": "river landforms: risk of raising levees"}, {"id": "g9-river-landforms:q14", "level": "stretch", "type": "long", "q": "Explain how a waterfall forms and how it turns into a gorge. Write it as a sequence of steps over time, naming at least two erosion processes.", "marks": 5, "hint": "Go in time order. Start with the two bands of rock, finish with the gorge, and make sure something happens in every step in between.", "answer": "A waterfall forms where a band of hard rock lies on top of softer rock. The river wears the soft rock back faster than the hard rock, using hydraulic action, where the force of the water forces air into cracks until the rock breaks, and abrasion, where the rocks the river is carrying scrape the surface away. Because the soft rock is cut back further, the hard rock above is left sticking out over empty air as an overhang. At the bottom, the falling water swirls loose rocks round and round and drills out a deep plunge pool, which is 4 m deep at Black Force. Eventually the overhang has no support left and collapses into the plunge pool. The waterfall is now the same shape again but a few metres further upstream. This repeats for thousands of years, so the waterfall retreats upstream and leaves behind a narrow steep sided valley called a gorge, which at Black Force is 300 m long.", "explain": "A full mark answer has five stages, one mark each. One, hard rock lying over soft rock. Two, the soft rock being cut back faster, with at least two named processes such as hydraulic action and abrasion. Three, the hard rock left as an overhang. Four, the plunge pool drilled out by falling water and swirling rocks. Five, the overhang collapsing so the waterfall retreats upstream and leaves a gorge. Using the real figures from Black Force, the 4 m pool and the 300 m gorge, shows you read the description. Writing only that hard rock erodes slower than soft rock is worth one mark, because it stops before anything has actually formed.", "topic": "river landforms: waterfall and gorge formation over time"}]}, "g10-scale-again": {"id": "g10-scale-again", "day": "Day 3", "subject": "Geography", "title": "Scale, distance and getting it right", "minutes": 25, "objective": "Turn a map measurement into a real distance on any scale using one rule, sense check it against another measurement on the same map every time, and convert the answer into metres without losing the decimal point.", "extract": "TWO MAPS, described in words. There are no pictures, so work from the descriptions.\n\nMAP A: HOLLOW BROOK VALLEY.\nSCALE: 2 cm on the map stands for 1 km on the ground.\n\nThe visitor centre sits in the middle of the map. Three straight routes leave it.\nA straight road runs due EAST from the visitor centre. The weir is on that road, and the camp site is further along the same road past the weir.\nA straight track runs due NORTH from the visitor centre. The old mine is on that track, and the reservoir dam is further along the same track past the old mine.\nA straight track runs due SOUTH from the visitor centre. The old quarry is on that track, and the ruined chapel is further along the same track past the old quarry.\n\nRULER READINGS ON MAP A, all measured in a straight line with a ruler laid flat on the paper.\nVisitor centre to weir: 9 cm\nWeir to camp site: 3 cm\nVisitor centre to camp site: 12 cm\nVisitor centre to old mine: 7.5 cm\nOld mine to reservoir dam: 6.5 cm\nVisitor centre to reservoir dam: 14 cm\nVisitor centre to old quarry: 5 cm\nOld quarry to ruined chapel: 3.5 cm\nVisitor centre to ruined chapel: 8.5 cm\n\nMAP B: BRAMFORD TOWN CENTRE.\nSCALE: 4 cm on the map stands for 1 km on the ground. This is a different scale from Map A. Read it before you touch the ruler.\n\nThe High Street runs in a straight line. The station is at one end, the market square is along it, and the library is further along past the market square.\nMill Lane runs in a straight line. The school is at one end, the park is along it, and the swimming pool is further along past the park.\n\nRULER READINGS ON MAP B.\nStation to market square: 10 cm\nMarket square to library: 6 cm\nStation to library: 16 cm\nSchool to park: 3 cm\nPark to swimming pool: 5 cm\nSchool to swimming pool: 8 cm", "teach": {"intro": ["A scale tells you what a distance on the paper stands for on the ground. Map A says 2 cm stands for 1 km. Map B says 4 cm stands for 1 km. Same real world, different sized paper.", "THE ONE RULE. Take what you measured and divide it by the number of centimetres that stands for 1 km. Measurement on top, scale underneath, every single time. On Map A that is 9 divided by 2. On Map B it is 10 divided by 4. Never 2 divided by 9, and never 4 divided by 10.", "That is the whole method, and it works on any scale you are ever given. If you get an answer that is smaller than 1 when the measurement is bigger than the scale, you have flipped the division upside down. On Map B, 10 divided by 4 is 2.5, not 0.4. Notice that 0.4 is exactly 4 divided by 10, which is the sum done backwards.", "THE SENSE CHECK, and you do this every time, not just when you feel unsure. On the same map, a bigger measurement MUST give a bigger real distance. On Map A, 7.5 cm gives 3.75 km. So 9 cm, which is longer on the paper, has to give more than 3.75 km. An answer of 1.5 km cannot possibly be right, because 1.5 is smaller than 3.75 and 9 cm is bigger than 7.5 cm. Line the two answers up next to each other and the wrong one gives itself away in about two seconds.", "GOING BACK THE OTHER WAY. If you are given a real distance in km and asked for the map measurement, you multiply instead of divide, because each kilometre takes up that many centimetres on the paper. That is exactly the move from Day 1 maths, m14 working backwards: undo the step you would normally do, then run it forwards to check.", "KM INTO METRES. There are 1000 m in 1 km, so multiply by 1000 and the digits move three places, not two. 3.75 km is 3750 m. It is not 375 m, which is only about a third of a kilometre, and it is not 37500 m either. Break it up if that helps: 3 km is 3000 m, 0.5 km is 500 m, 0.25 km is 250 m, and 3000 + 500 + 250 = 3750. This is the same skill as Day 2 maths, m16 place value and measure."], "example": {"problem": "Map A, scale 2 cm to 1 km. Visitor centre to weir measures 9 cm. How far is that on the ground?", "steps": ["Write the rule down: measurement divided by scale. That is 9 divided by 2, not 2 divided by 9.", "Do the division. Half of 8 is 4, and half of the 1 left over is 0.5. So 9 divided by 2 = 4.5.", "The answer is 4.5 km.", "Now the sense check, using another reading on the same map. Visitor centre to old mine is 7.5 cm and that works out at 3.75 km. My reading of 9 cm is longer on the paper, so my answer must be bigger than 3.75 km.", "4.5 is bigger than 3.75, so it passes. An answer of 1.5 km would have failed the check instantly, because 1.5 is smaller than 3.75 even though 9 cm is longer than 7.5 cm."], "answer": "4.5 km"}, "example2": {"problem": "Map B, scale 4 cm to 1 km. Station to market square measures 10 cm. How far is that on the ground?", "steps": ["New map, so read the scale first. It is 4 cm to 1 km here, not 2 cm to 1 km.", "Apply the same rule: measurement divided by scale. That is 10 divided by 4.", "Do the division. 4 goes into 10 twice, which uses up 8 and leaves 2. Two out of four is a half. So 10 divided by 4 = 2.5.", "The answer is 2.5 km.", "Sense check against another reading on the same map. Market square to library is 6 cm, which gives 6 divided by 4 = 1.5 km. My 10 cm is longer on the paper, so my answer has to be bigger than 1.5 km. 2.5 is bigger, so it passes.", "Watch the trap here. If you had written 0.4 km, that is 4 divided by 10, the division flipped upside down. The sense check catches it, because 0.4 km would mean the longer measurement gave a shorter distance, which is impossible."], "answer": "2.5 km"}, "keyfact": "Divide the measurement by the scale, never the scale by the measurement. Then check it against another reading on the same map: a longer measurement must always give a longer real distance."}, "questions": [{"id": "g10-scale-again:q1", "level": "easy", "type": "mc", "q": "A map has a scale of 4 cm to 1 km. A street measures 12 cm. Which sum gives the real distance?", "options": ["12 divided by 4", "4 divided by 12", "12 multiplied by 4", "4 multiplied by 12"], "answer": "12 divided by 4", "hint": "Measurement on top, scale underneath. What you measured comes first.", "explain": "The sum is 12 divided by 4, which gives 3 km. The measurement always goes on top and the scale underneath. Doing 4 divided by 12 gives 0.33, which is the division flipped upside down and is the mistake to watch for. Multiplying by 4 would give 48 km, which is going the wrong way entirely.", "topic": "map scale: which way round the division goes"}, {"id": "g10-scale-again:q2", "level": "easy", "type": "text", "q": "Map A, scale 2 cm to 1 km. Weir to camp site measures 3 cm. How far is that in km? Write just the number.", "answer": "1.5", "accept": ["1.5", "1.5 km", "1.5km", "1 1/2", "one and a half"], "hint": "Divide the measurement by the scale: 3 divided by 2.", "explain": "The answer is 1.5 km. Divide 3 by 2. Half of 2 is 1 and half of the remaining 1 is 0.5, so 1 + 0.5 = 1.5. Any odd number of centimetres on this map gives an answer ending in point 5.", "topic": "map scale: converting a measurement on a 2 cm to 1 km map"}, {"id": "g10-scale-again:q3", "level": "easy", "type": "text", "q": "Map A, scale 2 cm to 1 km. Visitor centre to old quarry measures 5 cm. How far is that in km? Write just the number.", "answer": "2.5", "accept": ["2.5", "2.5 km", "2.5km", "2 1/2", "two and a half"], "hint": "5 divided by 2. It has to be smaller than 5, because two centimetres are needed for every kilometre.", "explain": "The answer is 2.5 km. Divide 5 by 2 to get 2.5. Sense check it: weir to camp site is 3 cm and gives 1.5 km, and 5 cm is longer than 3 cm, so the answer must be bigger than 1.5 km. 2.5 is bigger, so it passes.", "topic": "map scale: converting a measurement on a 2 cm to 1 km map"}, {"id": "g10-scale-again:q4", "level": "easy", "type": "mc", "q": "On Map A, a measurement of 7.5 cm works out at 3.75 km. Without doing any dividing, which of these could a measurement of 9 cm on the same map possibly give?", "options": ["4.5 km", "1.5 km", "0.9 km", "3.0 km"], "answer": "4.5 km", "hint": "9 cm is longer on the paper than 7.5 cm. So the real distance has to be longer than 3.75 km too.", "explain": "It has to be 4.5 km, because that is the only option bigger than 3.75 km. On one map, a longer measurement always means a longer real distance. 1.5 km, 0.9 km and 3.0 km are all smaller than 3.75 km, so all three are impossible before you do any working at all. This one check catches almost every scale mistake there is.", "topic": "map scale: sense checking against another reading"}, {"id": "g10-scale-again:q5", "level": "medium", "type": "text", "q": "Map A, scale 2 cm to 1 km. Visitor centre to weir measures 9 cm. How far is that in km? Write just the number.", "answer": "4.5", "accept": ["4.5", "4.5 km", "4.5km", "4 1/2", "four and a half"], "hint": "9 divided by 2. Half of 8 is 4, and half of the 1 left over is 0.5.", "explain": "The answer is 4.5 km. Divide 9 by 2: half of 8 is 4, half of the remaining 1 is 0.5, so 4 + 0.5 = 4.5. Now sense check it. Visitor centre to old mine is 7.5 cm and gives 3.75 km, and 9 cm is longer than 7.5 cm, so the answer must be more than 3.75 km. 4.5 passes. An answer of 1.5 km would fail, because it is smaller than 3.75 km even though the measurement is longer.", "topic": "map scale: converting a measurement on a 2 cm to 1 km map"}, {"id": "g10-scale-again:q6", "level": "medium", "type": "text", "q": "Map A, scale 2 cm to 1 km. Visitor centre to old mine measures 7.5 cm. How far is that in km? Write just the number.", "answer": "3.75", "accept": ["3.75", "3.75 km", "3.75km", "3 3/4"], "hint": "Split it. Half of 7 is 3.5, half of 0.5 is 0.25, then add them.", "explain": "The answer is 3.75 km. Divide 7.5 by 2 in two parts: half of 7 is 3.5 and half of 0.5 is 0.25, so 3.5 + 0.25 = 3.75. Sense check: 7.5 cm is shorter than the 9 cm to the weir, so the answer must be less than 4.5 km, and 3.75 is less than 4.5. An answer of 4 km would be wrong, because 4 is bigger than 3.75 but the working gives 3.75 exactly.", "topic": "map scale: converting a measurement on a 2 cm to 1 km map"}, {"id": "g10-scale-again:q7", "level": "medium", "type": "text", "q": "Map A, scale 2 cm to 1 km. Visitor centre to camp site measures 12 cm. How far is that in km? Write just the number.", "answer": "6", "accept": ["6", "6 km", "6km", "6.0"], "hint": "12 divided by 2. Six lots of 2 cm fit into 12 cm.", "explain": "The answer is 6 km. Divide 12 by 2 to get 6. Check it a second way using the two legs: visitor centre to weir is 9 cm, which is 4.5 km, and weir to camp site is 3 cm, which is 1.5 km. Add them, 4.5 + 1.5 = 6 km. Both routes agree, which is exactly what should happen when the two legs and the whole line are all on the same straight road.", "topic": "map scale: converting a measurement on a 2 cm to 1 km map"}, {"id": "g10-scale-again:q8", "level": "medium", "type": "text", "q": "Map A, scale 2 cm to 1 km. Old mine to reservoir dam measures 6.5 cm. How far is that in km? Write just the number.", "answer": "3.25", "accept": ["3.25", "3.25 km", "3.25km", "3 1/4"], "hint": "Half of 6 is 3, half of 0.5 is 0.25. Add them.", "explain": "The answer is 3.25 km. Split the division: half of 6 is 3 and half of 0.5 is 0.25, so 3 + 0.25 = 3.25. Sense check against the 7.5 cm reading, which gives 3.75 km. 6.5 cm is shorter than 7.5 cm, so the answer must be less than 3.75 km, and 3.25 is less. It passes.", "topic": "map scale: converting a measurement on a 2 cm to 1 km map"}, {"id": "g10-scale-again:q9", "level": "medium", "type": "text", "q": "Map A, scale 2 cm to 1 km. Visitor centre to ruined chapel measures 8.5 cm. How far is that in km? Write just the number.", "answer": "4.25", "accept": ["4.25", "4.25 km", "4.25km", "4 1/4"], "hint": "Half of 8 is 4, half of 0.5 is 0.25. Add them.", "explain": "The answer is 4.25 km. Half of 8 is 4 and half of 0.5 is 0.25, so 4 + 0.25 = 4.25. Check it with the two legs on the same track: visitor centre to old quarry is 5 cm, which is 2.5 km, and old quarry to ruined chapel is 3.5 cm, which is 1.75 km. Add them, 2.5 + 1.75 = 4.25 km. They agree.", "topic": "map scale: converting a measurement on a 2 cm to 1 km map"}, {"id": "g10-scale-again:q10", "level": "medium", "type": "mc", "q": "You worked out that the visitor centre to the old mine is 3.75 km. How is 3.75 km written in metres?", "options": ["3750 m", "375 m", "37500 m", "3.75 m"], "answer": "3750 m", "hint": "There are 1000 m in 1 km, so the digits move three places, not two.", "explain": "3.75 km is 3750 m. There are 1000 m in a kilometre, so 3.75 x 1000 = 3750. 375 m is the trap answer, and it comes from moving the digits only two places instead of three. Check it in your head: 375 m is not even half a kilometre, but 3.75 km is nearly four kilometres, so the two cannot be the same distance. Break it up if it helps: 3 km is 3000 m, 0.5 km is 500 m and 0.25 km is 250 m, and 3000 + 500 + 250 = 3750 m. Same skill as Day 2 maths, m16 place value and measure.", "topic": "map scale: converting km to metres"}, {"id": "g10-scale-again:q11", "level": "medium", "type": "text", "q": "Write 4.25 km in metres. Write just the number.", "answer": "4250", "accept": ["4250", "4250 m", "4250m", "4,250", "4250 metres"], "hint": "Multiply by 1000. The digits move three places to the left, so 4 becomes 4000.", "explain": "The answer is 4250 m. 4.25 x 1000 = 4250. Build it in pieces: 4 km is 4000 m, 0.25 km is 250 m, and 4000 + 250 = 4250 m. Writing 425 m would be moving the digits two places instead of three, which is the same slip as writing 3.75 km as 375 m. Day 2 maths, m16 place value and measure, is the drill for exactly this.", "topic": "map scale: converting km to metres"}, {"id": "g10-scale-again:q12", "level": "stretch", "type": "text", "q": "Map B now, and the scale is different: 4 cm stands for 1 km. Station to market square measures 10 cm. How far is that in km? Write just the number.", "answer": "2.5", "accept": ["2.5", "2.5 km", "2.5km", "2 1/2", "two and a half"], "hint": "Same rule, new scale. Measurement on top, so 10 divided by 4.", "explain": "The answer is 2.5 km. Divide 10 by 4. Four goes into 10 twice, using up 8 and leaving 2, and 2 out of 4 is a half, so the answer is 2.5 km. The trap answer here is 0.4 km, which is 4 divided by 10, the division upside down. Sense check it: market square to library is 6 cm, which gives 1.5 km, and 10 cm is longer than 6 cm, so the answer has to be bigger than 1.5 km. 0.4 km fails that test instantly.", "topic": "map scale: applying a different scale of 4 cm to 1 km"}, {"id": "g10-scale-again:q13", "level": "stretch", "type": "text", "q": "Map B, scale 4 cm to 1 km. School to park measures 3 cm. How far is that in km? Write just the number.", "answer": "0.75", "accept": ["0.75", "0.75 km", "0.75km", "3/4", ".75", "0.750"], "hint": "3 divided by 4. This time the measurement is smaller than the scale, so the answer really is less than 1 km.", "explain": "The answer is 0.75 km. Divide 3 by 4. Three quarters is 0.75, so the walk is three quarters of a kilometre. Here an answer below 1 is correct, because 3 cm is less than the 4 cm that stands for a whole kilometre. That is the test for whether an answer under 1 makes sense: it is only allowed when the measurement is smaller than the scale. In metres that is 0.75 x 1000 = 750 m.", "topic": "map scale: applying a different scale of 4 cm to 1 km"}, {"id": "g10-scale-again:q14", "level": "stretch", "type": "text", "q": "Map B, scale 4 cm to 1 km. Working backwards. A new cycle path will be 1.25 km long. How many cm will it measure on Map B? Write just the number.", "answer": "5", "accept": ["5", "5 cm", "5cm", "5.0"], "hint": "This one goes the other way. Every 1 km takes up 4 cm on the paper, so multiply instead of divide.", "explain": "The answer is 5 cm. Going from map to ground you divide by 4. Going from ground to map you undo that, so you multiply by 4: 1.25 x 4 = 5. Break it up if you need to: 1 km is 4 cm and 0.25 km is 1 cm, so 4 + 1 = 5 cm. Now run it forwards to check, which is the habit from Day 1 maths, m14 working backwards: 5 divided by 4 = 1.25 km, which is what was asked for. It matches the park to swimming pool reading on Map B, which is 5 cm.", "topic": "map scale: working backwards from km to cm"}, {"id": "g10-scale-again:q15", "level": "stretch", "type": "long", "q": "Map A, scale 2 cm to 1 km. A ranger walks from the visitor centre to the old mine (7.5 cm) and then from the old mine to the reservoir dam (6.5 cm). Work out the total distance in km and then in metres. Write down your estimate first, then your working, then your sense check.", "marks": 5, "hint": "Add the two centimetre readings before you divide anything, so you only have to divide once. Then check your total against the direct reading for the same straight track.", "answer": "Estimate first. The two readings add up to 14 cm, and 14 cm is a bit less than 20 cm, which would be 10 km, so the answer should be somewhere around 7 km. Working: 7.5 + 6.5 = 14 cm, then 14 divided by 2 = 7 km. In metres, 7 x 1000 = 7000 m. Sense check one: doing the legs separately gives 7.5 divided by 2 = 3.75 km and 6.5 divided by 2 = 3.25 km, and 3.75 + 3.25 = 7 km, which matches. Sense check two: the map also gives the visitor centre to the reservoir dam directly as 14 cm, and both places are on the same straight track, so the total has to be the same 7 km. It is.", "explain": "Five marks, one for each part. One, an estimate before any working, such as 20 cm would be 10 km so 14 cm should be around 7 km. Two, adding the centimetres correctly: 7.5 + 6.5 = 14 cm. Three, dividing by the scale the right way round: 14 divided by 2 = 7 km, not 2 divided by 14. Four, the metres conversion: 7 x 1000 = 7000 m, three places not two. Five, a sense check, either by doing the two legs separately and adding, 3.75 + 3.25 = 7, or by comparing with the direct 14 cm reading for the same straight track. An answer with no estimate and no check is worth three marks at most, even if the number is right, because the checks are the part that stops you handing in 0.5 km or 700 m.", "topic": "map scale: multi step total distance with a sense check"}]}, "g11-population": {"id": "g11-population", "day": "Day 4", "subject": "Geography", "title": "Where people live and why", "minutes": 25, "objective": "Explain the difference between population distribution and population density, calculate density in both directions, and use push and pull factors to explain migration and urbanisation.", "extract": "THE DATA, written out in words. There is no table on screen, so read the figures from here.\n\nA WARNING ABOUT THE NUMBERS. Every real world figure below is APPROXIMATE. Populations change every day and land areas are rounded here to keep the arithmetic clean, so treat each one as about that much, not exactly that much. The invented places at the bottom are exact, because they were made up to divide neatly.\n\nREAL PLACES, all figures approximate, mid 2020s.\nUnited Kingdom: population about 68 million, land area about 244,000 km2.\nBangladesh: population about 171 million, land area about 148,000 km2.\nAustralia: population about 26 million, land area about 7,700,000 km2.\nCanada: population about 40 million, land area about 10,000,000 km2.\nGreater London: population about 8.8 million, area about 1,570 km2.\nWolverhampton: population about 264,000, area about 69 km2.\n\nA SPECIAL CASE. Egypt has a population of roughly 105 million. Almost all of it, somewhere around 95 out of every 100 Egyptians, lives on the strip of land along the River Nile and its delta, which is only about 4 out of every 100 square kilometres of the country. The rest is desert and is nearly empty.\n\nURBANISATION, approximate figures.\nWorld population today: about 8 billion.\nIn 1950 about 30 out of every 100 people in the world lived in a town or city.\nToday it is about 57 out of every 100.\nThe largest urban area in the world is Tokyo in Japan, with roughly 37 million people.\n\nINVENTED PLACES, for practice. These figures are exact.\nHartwood village: population 480, area 6 km2.\nIsle of Marr: population 4,500, area 90 km2.\nRedbrook town: population 60,000, area 20 km2.\nNorthfell region: population 1,200,000, area 4,000 km2.", "teach": {"intro": ["People are not spread evenly over the Earth. Roughly speaking, huge numbers live in a few small areas and almost nobody lives across most of the land. Geography has two words for this and they are not the same word twice.", "POPULATION DISTRIBUTION means WHERE people live. It is a description, not a number. You would say the population of Egypt is unevenly distributed, packed along the Nile and almost absent from the desert.", "POPULATION DENSITY means HOW CROWDED a place is. It is a number: the average number of people in each square kilometre. Density is a divide question, every time. Population divided by area, people on top.", "Worked in your head: 480 people living in 6 km2 gives 480 divided by 6 = 80 people per km2. Notice the units tell you the sum. People PER square kilometre means people for each one square kilometre, so people go on top and the area goes underneath. Get that the wrong way round and you get 0.0125, which would mean less than one person per square kilometre in a village.", "WHY PEOPLE MOVE. A PUSH factor is something bad about where you are that pushes you to leave: no jobs, war, drought, flooding, no schools or hospitals. A PULL factor is something good about somewhere else that pulls you towards it: work, safety, better schools, better healthcare, family already there. Most real moves are a mix of both.", "URBANISATION means a growing share of the population living in towns and cities. In 1950 about 30 out of every 100 people in the world lived in a town or city. Today it is about 57 out of every 100. It is driven by rural to urban migration, people moving from the countryside to the city, and by natural increase, which is more births than deaths in cities that are already large.", "PHYSICAL FACTORS decide a lot of it. People crowd into places with flat land, reliable water, a mild climate, good soil and a coast or river for trade. People avoid deserts, high mountains, dense rainforest and frozen ground. That is why Egypt is a green ribbon of people in a country of sand."], "example": {"problem": "Redbrook town has a population of 60,000 and an area of 20 km2. Work out its population density.", "steps": ["Density is measured in people per square kilometre, so the sum is population divided by area. People on top.", "That is 60,000 divided by 20.", "Make it easier. 60 divided by 20 = 3, and 60,000 is 60 with three zeros after it, so the answer is 3 with those three zeros: 3,000.", "The answer is 3,000 people per km2.", "Check it forwards: 3,000 people in each of 20 square kilometres is 3,000 x 20 = 60,000 people, which is the population you started with. It fits."], "answer": "3,000 people per km2"}, "example2": {"problem": "A city district has a population density of 250 people per km2 and an area of 40 km2. How many people live there?", "steps": ["Read it carefully. You have been given the density, which is normally the answer, so this one runs backwards. That is the same move as Day 1 maths, m14 working backwards.", "Forwards the rule is population divided by area equals density. To undo a divide you multiply.", "So population = density x area = 250 x 40.", "Work it out: 25 x 4 = 100, so 250 x 40 = 10,000.", "The answer is 10,000 people.", "Check by running it forwards: 10,000 divided by 40 = 250 people per km2, which is the density you were given. It fits."], "answer": "10,000 people"}, "keyfact": "Distribution is where people are, density is how crowded it is. Density is population divided by area, people on top, every single time."}, "questions": [{"id": "g11-population:q1", "level": "easy", "type": "mc", "q": "What does population density tell you?", "options": ["The average number of people living in each square kilometre", "The total number of people in a country", "Which parts of a country people live in", "How fast the population is growing"], "answer": "The average number of people living in each square kilometre", "hint": "Density is about how crowded a place is, not how many people there are altogether.", "explain": "Population density is the average number of people per square kilometre, so it measures crowding. The total number of people is just the population. Which parts of a country people live in is the distribution. Two big countries can have the same population and completely different densities, because one of them is much larger.", "topic": "population: what density means"}, {"id": "g11-population:q2", "level": "easy", "type": "mc", "q": "Which sum works out population density?", "options": ["Population divided by area", "Area divided by population", "Population multiplied by area", "Area minus population"], "answer": "Population divided by area", "hint": "The units are people PER square kilometre. Whatever comes before the word per goes on top.", "explain": "Density is population divided by area. The units give it away: people per square kilometre means people for each single square kilometre, so people go on top and area underneath. Doing area divided by population gives you the number of square kilometres each person has, which is a real measure but not the one anyone asks for.", "topic": "population: the density formula"}, {"id": "g11-population:q3", "level": "easy", "type": "text", "q": "Hartwood village has 480 people and an area of 6 km2. What is its population density in people per km2? Write just the number.", "answer": "80", "accept": ["80", "80 people per km2", "80 per km2", "80 people/km2"], "hint": "480 divided by 6. How many sixes are in 48?", "explain": "The answer is 80 people per km2. Divide 480 by 6. There are 8 sixes in 48, so there are 80 sixes in 480. Check it forwards: 80 x 6 = 480, which is the population. It fits.", "topic": "population: calculating density"}, {"id": "g11-population:q4", "level": "easy", "type": "mc", "q": "Which one of these is a PUSH factor?", "options": ["There are no jobs in the village where you live", "There are good hospitals in the city", "Your cousins already live in the city", "The city has better schools"], "answer": "There are no jobs in the village where you live", "hint": "A push factor is something bad about where you are now.", "explain": "No jobs where you live is a push factor, because it is a bad thing about your current home that pushes you to leave. The other three are all good things about somewhere else, so they pull you towards it. The test is simple: ask whether the thing is about where you are or where you are going.", "topic": "population: identifying a push factor"}, {"id": "g11-population:q5", "level": "easy", "type": "mc", "q": "Which one of these is a PULL factor?", "options": ["A city has more work available and better pay", "A drought has ruined the harvest at home", "A war has broken out in your region", "The nearest school to your home has closed"], "answer": "A city has more work available and better pay", "hint": "A pull factor is something good about the place you are moving to.", "explain": "More work and better pay in the city is a pull factor, because it is an attraction at the destination. Drought, war and a closed school are all push factors, because they are problems where the person already lives. Most real migrations involve both at once, which is why people usually move from a place with problems to a specific place that offers something better.", "topic": "population: identifying a pull factor"}, {"id": "g11-population:q6", "level": "medium", "type": "text", "q": "The Isle of Marr has 4,500 people and an area of 90 km2. What is its population density in people per km2? Write just the number.", "answer": "50", "accept": ["50", "50 people per km2", "50 per km2", "50.0"], "hint": "4,500 divided by 90. Try 45 divided by 9 first, then deal with the zeros.", "explain": "The answer is 50 people per km2. Divide 4,500 by 90. Start with 45 divided by 9 = 5, then put back the zero that is left over after cancelling one zero from each number, giving 50. Check it forwards: 50 x 90 = 4,500. It fits.", "topic": "population: calculating density"}, {"id": "g11-population:q7", "level": "medium", "type": "text", "q": "Redbrook town has 60,000 people and an area of 20 km2. What is its population density in people per km2? Write just the number.", "answer": "3000", "accept": ["3000", "3,000", "3000 people per km2", "3,000 per km2"], "hint": "60,000 divided by 20. Do 60 divided by 20 first, then put the three zeros back.", "explain": "The answer is 3,000 people per km2. 60 divided by 20 = 3, and 60,000 is 60 with three extra zeros, so the answer is 3,000. Check it forwards: 3,000 x 20 = 60,000. That is roughly the same crowding as parts of inner London, so it is a genuinely built up town.", "topic": "population: calculating density"}, {"id": "g11-population:q8", "level": "medium", "type": "text", "q": "The Northfell region has 1,200,000 people and an area of 4,000 km2. What is its population density in people per km2? Write just the number.", "answer": "300", "accept": ["300", "300 people per km2", "300 per km2"], "hint": "Cancel three zeros from each number first, so it becomes 1,200 divided by 4.", "explain": "The answer is 300 people per km2. Knock three zeros off each number to make it 1,200 divided by 4, which is 300. Check it forwards: 300 x 4,000 = 1,200,000. It fits. Cancelling equal numbers of zeros from both sides is safe because it is the same as dividing both numbers by 1,000, and that does not change the answer to a division.", "topic": "population: calculating density with large numbers"}, {"id": "g11-population:q9", "level": "medium", "type": "mc", "q": "Canada has a population of about 40 million and a land area of about 10 million km2. Roughly what is its population density?", "options": ["About 4 people per km2", "About 40 people per km2", "About 400 people per km2", "About 0.25 people per km2"], "answer": "About 4 people per km2", "hint": "40 million divided by 10 million. Cancel the word million from both and it becomes 40 divided by 10.", "explain": "About 4 people per km2. Both numbers are in millions, so cancel that and the sum becomes 40 divided by 10 = 4. The figures are approximate, so the answer is about 4, not exactly 4. Compare that with the UK at about 280 people per km2, roughly 70 times more crowded. Canada is enormous and much of it is frozen or forested, which is why the average is so low.", "topic": "population: density of a real country"}, {"id": "g11-population:q10", "level": "medium", "type": "mc", "q": "What does urbanisation mean?", "options": ["A growing share of the population living in towns and cities", "The total world population getting larger", "People moving from cities back to the countryside", "Cities getting physically taller"], "answer": "A growing share of the population living in towns and cities", "hint": "Urban means town or city. The word is about the share of people, not the total number of people.", "explain": "Urbanisation is a rising share of people living in towns and cities. In 1950 about 30 out of every 100 people in the world were urban, and today it is about 57 out of every 100. It is caused by rural to urban migration and by natural increase in cities that are already large. People moving the other way, out of cities, is counter urbanisation.", "topic": "population: what urbanisation means"}, {"id": "g11-population:q11", "level": "medium", "type": "mc", "q": "Australia has about 26 million people and about 7,700,000 km2 of land, which works out at about 3.4 people per km2. Yet most Australians live in crowded cities on the coast. What does that show?", "options": ["An average density can hide a very uneven distribution", "Australia is evenly populated everywhere", "The population figure must be wrong", "Density and distribution are the same thing"], "answer": "An average density can hide a very uneven distribution", "hint": "An average spreads everybody out evenly on paper, even when they are not spread out evenly in real life.", "explain": "An average density spreads everyone evenly across the map on paper, which is almost never what really happens. Australia has huge empty deserts in the middle and dense cities on the coast, so the average of about 3.4 per km2 describes almost nowhere in the country. Egypt is the extreme version: roughly 95 out of every 100 Egyptians live on about 4 out of every 100 square kilometres, along the Nile. Always ask what the distribution looks like before you trust an average density.", "topic": "population: why an average density can mislead"}, {"id": "g11-population:q12", "level": "stretch", "type": "text", "q": "Working backwards. A district has a population density of 250 people per km2 and an area of 40 km2. How many people live there? Write just the number.", "answer": "10000", "accept": ["10000", "10,000", "10 000", "ten thousand"], "hint": "You have been given the answer to the usual divide, so undo it. To undo a divide you multiply.", "explain": "The answer is 10,000 people. Forwards the rule is population divided by area equals density, so backwards it is density multiplied by area: 250 x 40. Work it as 25 x 4 = 100, then put back the two zeros you took out, giving 10,000. Check it forwards: 10,000 divided by 40 = 250 people per km2, which is what you were given. This is exactly the Day 1 maths session, m14 working backwards, wearing a geography hat.", "topic": "population: working backwards to find population"}, {"id": "g11-population:q13", "level": "stretch", "type": "text", "q": "Working backwards again. A town has 90,000 people and a population density of 3,000 people per km2. What is its area in km2? Write just the number.", "answer": "30", "accept": ["30", "30 km2", "30km2", "30 square kilometres"], "hint": "Population divided by area gives density. This time you know the population and the density, so divide the population by the density.", "explain": "The answer is 30 km2. If population divided by area equals density, then population divided by density equals area. So 90,000 divided by 3,000. Cancel three zeros from each and it becomes 90 divided by 3 = 30. Check it forwards: 90,000 divided by 30 = 3,000 people per km2, which is the density you were given. Notice how the same three quantities can be rearranged in three ways, so what matters is spotting which one is missing before you pick a sum.", "topic": "population: working backwards to find area"}, {"id": "g11-population:q14", "level": "stretch", "type": "long", "q": "Explain why so many people move from the countryside into cities. Use at least two push factors and two pull factors, and use one figure from the data to show that this is really happening.", "marks": 5, "hint": "Sort your ideas into two lists before you write. Bad things about the place being left are pushes, good things about the place being moved to are pulls.", "answer": "People are pushed out of the countryside by problems where they live. Farm work is often the only work available, and machinery means fewer people are needed, so there are not enough jobs. Rural areas also tend to have fewer schools and hospitals, and a drought, a flood or a war can destroy a family's income in a single season. People are pulled towards cities by better prospects: there is far more paid work and it usually pays more, and cities have more schools, universities and hospitals. Many people also move to join family who went before them, which makes the move less risky. The figures show it is happening on a huge scale. In 1950 about 30 out of every 100 people in the world lived in a town or city, and today it is about 57 out of every 100. Those figures are approximate, but the direction of change is clear, and Tokyo alone is now home to roughly 37 million people.", "explain": "Five marks. One and two, two clear push factors, and they must be about the place people are leaving, such as too few jobs or poor services or a drought. Three and four, two clear pull factors, and they must be about the destination, such as better paid work or better healthcare or family already there. Five, a figure from the data used properly, such as the rise from about 30 in every 100 people being urban in 1950 to about 57 in every 100 today. Say the figures are approximate, because they are. Listing factors without labelling which are push and which are pull loses marks, because the examiner cannot see that you know the difference.", "topic": "population: push and pull factors driving urbanisation"}]}, "h6-norman-conquest": {"id": "h6-norman-conquest", "day": "Day 1", "subject": "History", "title": "1066 and why Harold lost", "minutes": 25, "objective": "Explain why the English throne was disputed in 1066, put the events of that year in order, and sort the reasons Harold lost into long term causes, short term causes and the trigger.", "extract": "1066, THE YEAR IN ORDER\n\n5 January 1066     Edward the Confessor dies at Westminster. He has no son.\n6 January 1066     Harold Godwinson is crowned king.\n8 September 1066   Harold sends the fyrd, his part time militia, home. They have watched the south coast all summer and the supplies have run out.\n20 September 1066  Battle of Fulford. Harald Hardrada of Norway and Tostig beat the northern earls Edwin and Morcar.\n25 September 1066  Battle of Stamford Bridge. Harold marches north and destroys the Norwegian army. Hardrada and Tostig are both killed.\n28 September 1066  William of Normandy lands at Pevensey on the south coast.\n14 October 1066    Battle of Hastings. Harold is killed and his army is destroyed.\n25 December 1066   William is crowned in Westminster Abbey.\n\nTHE THREE MAIN CLAIMANTS\n\nHarold Godwinson. Earl of Wessex and the most powerful noble in England. Said Edward promised him the throne on his deathbed. Chosen by the Witan, the council of leading English nobles and churchmen. He was in England, with an army, on the day Edward died.\n\nWilliam, Duke of Normandy. Said Edward had promised him the throne back in 1051, and that Harold had sworn an oath in about 1064 to support that claim. He was a distant relative by marriage, not by blood. Note that the promise and the oath are described mainly in Norman sources, written by men on William's side.\n\nHarald Hardrada, King of Norway. Based his claim on an old agreement between an earlier Norwegian king, Magnus, and Harthacnut, who had ruled England. Backed by Tostig, Harold Godwinson's own exiled brother.\n\nThere was a fourth man. Edgar the Aetheling was Edward's great nephew and the closest to him by blood, but he was about fourteen and had no army, so the Witan passed him over.", "teach": {"intro": ["England in 1066 had no fixed rule for who became king. There was no law saying the eldest son takes over. When Edward the Confessor died on 5 January 1066 he had no son at all, and three powerful men each said the throne was theirs.", "Historians sort reasons into two kinds. A long term cause builds up quietly over years. A short term cause happens in the weeks or months just before. Naming which kind you mean lifts an answer on its own, because it shows you are thinking about time and not just listing facts.", "A trigger is different again. The trigger is the single event that sets everything off. It is not the deepest reason, it is the spark. Edward having no child for over twenty years is a long term cause. Edward actually dying on 5 January 1066 is the trigger."], "example": {"problem": "Sort this reason into long term cause, short term cause or trigger: on 8 September 1066 Harold sent his militia home because the supplies had run out.", "steps": ["Ask when it happened compared with the battle. This is 8 September and Hastings is 14 October, so it is about five weeks before.", "Ask whether it built up over years. It did not. It was one decision taken in one autumn.", "Ask whether it was the spark that started the whole crisis. It was not. The crisis had already begun in January when Edward died.", "So it is not long term and it is not the trigger. It sits in the middle."], "answer": "Short term cause"}, "example2": {"problem": "Sort this one: for over twenty years Edward the Confessor had no child, and England had no agreed rule for choosing the next king.", "steps": ["Ask when. This is not one date. It is a situation that lasted more than twenty years.", "Ask whether it built up. Yes. Every year that passed without an heir made a fight more likely.", "Ask whether it was the spark. No. Nothing happened on any single day.", "So it is the background problem that made 1066 possible."], "answer": "Long term cause"}, "keyfact": "A long term cause builds up over years, a short term cause happens in the months just before, and the trigger is the single event that sets it off. Edward having no heir is the long term cause, Harold's forced march north and back is a short term cause, and Edward's death on 5 January 1066 is the trigger."}, "questions": [{"id": "h6-norman-conquest:q1", "level": "easy", "type": "mc", "q": "Who died on 5 January 1066, leaving the English throne empty?", "options": ["Edward the Confessor", "Harold Godwinson", "William, Duke of Normandy", "Harald Hardrada"], "answer": "Edward the Confessor", "hint": "He is the king the whole crisis starts with. He is buried in Westminster Abbey.", "explain": "The answer is Edward the Confessor. He died on 5 January 1066 with no son to follow him. Harold Godwinson was crowned the very next day, Harald Hardrada invaded in September and William invaded later that same month, but all three of those men were reacting to Edward's death rather than causing it.", "topic": "Norman Conquest: the succession crisis of 1066"}, {"id": "h6-norman-conquest:q2", "level": "easy", "type": "mc", "q": "Why was there a crisis over who should be king in 1066?", "options": ["Edward had no son, and England had no fixed rule saying who inherited the throne", "England had had no king at all for several years", "The law said the throne had to pass to a foreign prince", "Edward had ten sons and they all wanted it"], "answer": "Edward had no son, and England had no fixed rule saying who inherited the throne", "hint": "Think about what is missing, both in Edward's family and in the law.", "explain": "The answer is that Edward had no son and there was no fixed rule of inheritance. In England at that point the throne went to the man the Witan, a council of leading nobles and churchmen, accepted, and a dying king's wishes carried weight. That is a system that works fine when there is one obvious heir and falls apart when there is not. This is the long term cause of everything that follows.", "topic": "Norman Conquest: why the succession was disputed"}, {"id": "h6-norman-conquest:q3", "level": "easy", "type": "mc", "q": "Which of the claimants to the English throne in 1066 was the King of Norway?", "options": ["Harald Hardrada", "Harold Godwinson", "William, Duke of Normandy", "Edgar the Aetheling"], "answer": "Harald Hardrada", "hint": "Two of the names look almost the same. One of them ruled England for nine months and one ruled Norway.", "explain": "The answer is Harald Hardrada, King of Norway. The two similar names catch people out every year, so fix them now. Harold Godwinson was the English earl who was crowned in January. Harald Hardrada was the Norwegian king who invaded in September and was killed at Stamford Bridge. William was Duke of Normandy, in what is now northern France. Edgar the Aetheling was Edward's great nephew, closest by blood but only about fourteen.", "topic": "Norman Conquest: identifying the three claimants"}, {"id": "h6-norman-conquest:q4", "level": "easy", "type": "text", "q": "Which battle did Harold Godwinson win on 25 September 1066? Write the name of the battle.", "answer": "Stamford Bridge", "accept": ["Stamford Bridge", "stamford bridge", "Stamford bridge", "Battle of Stamford Bridge", "the Battle of Stamford Bridge", "battle of stamford bridge", "Stamford", "stamford"], "hint": "It was fought in Yorkshire, five days after the English defeat at Fulford.", "explain": "The answer is the Battle of Stamford Bridge, fought on 25 September 1066 in Yorkshire. Harold marched his army north at speed and destroyed the Norwegian army. Both Harald Hardrada and Tostig, Harold's own exiled brother, were killed there. Do not confuse it with Fulford on 20 September, which was fought near York five days earlier and which the English lost.", "topic": "Norman Conquest: the Battle of Stamford Bridge"}, {"id": "h6-norman-conquest:q5", "level": "easy", "type": "mc", "q": "On what date was the Battle of Hastings fought?", "options": ["14 October 1066", "25 September 1066", "28 September 1066", "25 December 1066"], "answer": "14 October 1066", "hint": "It is after both invasions have landed and before the coronation at Christmas.", "explain": "The answer is 14 October 1066. Each of the other dates is a real 1066 date, which is why they are here. 25 September is Stamford Bridge. 28 September is the day William landed at Pevensey. 25 December is the day William was crowned in Westminster Abbey. Learning the year is not enough at GCSE, because the order of the days inside 1066 is what the reasoning questions are built on.", "topic": "Norman Conquest: the date of the Battle of Hastings"}, {"id": "h6-norman-conquest:q6", "level": "medium", "type": "mc", "q": "Historians call the death of Edward the Confessor on 5 January 1066 the trigger of the crisis. What does trigger mean here?", "options": ["The single event that set everything off, rather than the deepest reason behind it", "The most important reason of all", "A reason that had built up slowly over many years", "Something that happened afterwards and was caused by the crisis"], "answer": "The single event that set everything off, rather than the deepest reason behind it", "hint": "Think about a spark and a pile of dry wood. Which one is the trigger?", "explain": "The answer is that a trigger is the single event that sets everything off. The common wrong move is to treat the trigger as the most important cause. It usually is not. The dry wood here is twenty years of no heir and no agreed rule, and Edward's death is only the spark that lands on it. If the pile had not been dry, the spark would have done nothing. A reason that builds up over years is a long term cause, and something that happens afterwards is a consequence.", "topic": "Norman Conquest: the difference between a cause and a trigger"}, {"id": "h6-norman-conquest:q7", "level": "medium", "type": "mc", "q": "Which of these is a long term cause of the crisis of 1066?", "options": ["For over twenty years Edward had no child, and there was no agreed rule for choosing the next king", "Harold marched his army from the south to Yorkshire and back in under three weeks", "William landed at Pevensey on 28 September", "Harold was killed late in the afternoon at Hastings"], "answer": "For over twenty years Edward had no child, and there was no agreed rule for choosing the next king", "hint": "Only one of these lasted for years rather than happening on a particular day.", "explain": "The answer is Edward having no child and England having no agreed rule, because that lasted for over twenty years and got more dangerous every year. Take the others in turn. Harold's march is a short term cause, since it happened weeks before the battle and left his army exhausted. William landing at Pevensey is also short term, and it is really the start of the campaign rather than a cause of it. Harold being killed at Hastings is not a cause at all, it is part of the defeat itself.", "topic": "Norman Conquest: identifying a long term cause"}, {"id": "h6-norman-conquest:q8", "level": "medium", "type": "text", "q": "The Battle of Stamford Bridge was on 25 September 1066. The Battle of Hastings was on 14 October 1066. How many days apart were they? Write the number only.", "answer": "19", "accept": ["19", "19 days", "nineteen", "nineteen days"], "hint": "Count the days left in September first, then add the days in October. September has 30 days.", "explain": "The answer is 19. September has 30 days, so from 25 September to 30 September is 5 days, and then 14 more days takes you to 14 October. 5 plus 14 is 19. Hold on to that number, because it is the whole argument. In under three weeks Harold's men fought a full battle in Yorkshire, marched roughly 250 miles back to the south coast, and then fought the best trained army in Europe. The usual slip is to try to subtract 14 from 25, or to forget that September has 30 days and not 31.", "topic": "Norman Conquest: calculating the gap between Stamford Bridge and Hastings"}, {"id": "h6-norman-conquest:q9", "level": "medium", "type": "mc", "q": "Which of these best explains why Harold's army at Hastings was weaker than it might have been?", "options": ["His best troops had just fought at Stamford Bridge and then marched hundreds of miles south, and much of his militia had already been sent home in September", "He had never commanded an army before", "He refused to let anyone fight for him", "England had almost no people living in it, so no army could be raised"], "answer": "His best troops had just fought at Stamford Bridge and then marched hundreds of miles south, and much of his militia had already been sent home in September", "hint": "Two separate things had already happened to his army before William even landed.", "explain": "The answer is the first option, and notice it contains two separate problems. First, Harold had kept the fyrd, his part time militia of ordinary free men, watching the south coast all summer. By 8 September the supplies had run out and the men were needed for the harvest, so he let them go. Second, the men who were left fought and won a hard battle at Stamford Bridge on 25 September and then marched about 250 miles back south. Harold was in fact an experienced commander, which is why the second option is wrong. Some historians argue his real mistake was a third thing, choosing to fight on 14 October instead of waiting in London for more men, and that argument is worth mentioning in an answer.", "topic": "Norman Conquest: short term causes of Harold's defeat"}, {"id": "h6-norman-conquest:q10", "level": "medium", "type": "mc", "q": "William's army had something at Hastings that Harold's army mostly did not. What was it?", "options": ["Large numbers of archers and mounted knights who fought from horseback", "Gunpowder weapons, which the English had never seen", "An army at least five times the size of Harold's", "Soldiers who had trained together for ten years"], "answer": "Large numbers of archers and mounted knights who fought from horseback", "hint": "Picture the two armies. One stands still in a wall of shields. The other moves.", "explain": "The answer is archers and mounted knights. The English fought on foot in a shield wall, a solid line of overlapping shields on a ridge, which is very hard to break from the front. William could shoot arrows into it and then send cavalry at it, and he could repeat that all day. Gunpowder weapons did not reach Europe until the fourteenth century, nearly three hundred years later. On numbers, historians estimate roughly seven to eight thousand men on each side, so the armies were probably close in size, and those figures are estimates rather than counts.", "topic": "Norman Conquest: why the Norman army had the advantage"}, {"id": "h6-norman-conquest:q11", "level": "stretch", "type": "mc", "q": "Which one of these is a consequence of Hastings rather than a cause of it?", "options": ["Norman lords replaced almost all the English lords over the following twenty years", "Edward the Confessor died without a son", "Harold swore an oath to William in about 1064", "Harold sent his militia home on 8 September 1066"], "answer": "Norman lords replaced almost all the English lords over the following twenty years", "hint": "A cause comes before. A consequence comes after and happens because of it.", "explain": "The answer is the replacement of the English lords, because that happened after the battle and only because William won it. The other three all come before 14 October 1066. Edward dying without a son is the long term cause, the oath of about 1064 is a long term cause of William's claim, and sending the militia home in September is a short term cause. One extra point worth making about the oath: it is described mainly by Norman writers on William's side, so historians treat the details of it with care.", "topic": "Norman Conquest: telling a consequence from a cause"}, {"id": "h6-norman-conquest:q12", "level": "stretch", "type": "mc", "q": "How did Harold die at Hastings?", "options": ["Historians are not certain. The Bayeux Tapestry seems to show a figure with an arrow in the eye, but other early accounts say he was cut down by knights", "Everyone agrees he was shot in the eye with an arrow", "He was captured alive and imprisoned in Normandy", "He drowned trying to cross the Channel"], "answer": "Historians are not certain. The Bayeux Tapestry seems to show a figure with an arrow in the eye, but other early accounts say he was cut down by knights", "hint": "Ask yourself how anyone today would actually know, and what the evidence for it is.", "explain": "The answer is that historians are not certain. The Bayeux Tapestry, an embroidery on linen made within about twenty years of the battle, shows one figure gripping an arrow near his eye and a second figure being cut down by a horseman, with a caption running across both saying that King Harold is killed. Historians argue about which of the two figures is meant to be Harold. One of the earliest written accounts of the battle instead describes Harold being hacked down by a group of knights. What is certain is that he died on the field and his army collapsed once he did. Writing that historians disagree, and explaining why, scores more than picking one version and presenting it as settled fact.", "topic": "Norman Conquest: where historians disagree about Harold's death"}, {"id": "h6-norman-conquest:q13", "level": "stretch", "type": "text", "q": "Sort this reason into long term cause, short term cause or trigger: on 8 September 1066 Harold sent his militia home because the supplies had run out. Write long term, short term or trigger.", "answer": "short term", "accept": ["short term", "short-term", "shortterm", "short term cause", "short-term cause", "a short term cause", "short", "Short term", "Short-term"], "hint": "Ask two questions. Did it build up over years? Was it the spark that started the crisis?", "explain": "The answer is short term cause. It happened about five weeks before Hastings, so it did not build up over years and it is not a long term cause. It was not the spark either, because the crisis had already started in January when Edward died, so it is not the trigger. That leaves the middle category. Harold had held the fyrd on the south coast all summer waiting for William. By early September the supplies were gone and the men were needed to bring in the harvest, so he let them go, and within weeks he was marching north instead. A decision like that, taken in the last few months and making the outcome worse, is exactly what a short term cause is.", "topic": "Norman Conquest: classifying a short term cause"}, {"id": "h6-norman-conquest:q14", "level": "stretch", "type": "long", "q": "Explain why Harold lost at Hastings. In your answer use at least one long term cause, at least two short term causes, and name the trigger.", "marks": 6, "answer": "The long term cause of the whole crisis was that Edward the Confessor had no child and England had no fixed rule for choosing a king. For over twenty years that meant more than one man could build a case for the throne, and by 1066 three of them had. The trigger was Edward's death on 5 January 1066, which turned that background problem into an immediate fight. Harold Godwinson was crowned the next day, but he now had to defend the crown against two invasions in the same autumn. The short term causes of his actual defeat follow from that. First, Harold had kept his part time militia, the fyrd, on the south coast all summer, and on 8 September he had to send them home because the supplies had run out and the harvest needed bringing in. That cost him men before the fighting started. Second, Harald Hardrada landed in the north, so Harold marched to Yorkshire, won at Stamford Bridge on 25 September, and then had to march roughly 250 miles back to meet William, who had landed at Pevensey on 28 September. His army fought at Hastings on 14 October, only nineteen days after a full battle at the other end of the country, and was exhausted. Third, William had archers and mounted knights while the English fought on foot in a shield wall, so William could keep attacking in different ways all day while Harold could only stand and hold. In my judgement the most important reason is the timing. Harold's army was good enough to beat one invasion and did, but no army could beat two invasions three weeks apart at opposite ends of England. That is why some historians argue Harold's real mistake was fighting on 14 October at all, rather than waiting in London for reinforcements, because time was the one thing that was against him and waiting would have given him more of it.", "hint": "Plan it in four boxes before you write: long term, trigger, short term, judgement. Then write one paragraph per box.", "explain": "A full mark answer contains these six things, one mark each. One, it names a long term cause, which is Edward having no heir and England having no fixed rule of succession, and says it lasted over twenty years. Two, it names the trigger correctly as Edward's death on 5 January 1066, and shows it understands that a trigger is a spark rather than the deepest reason. Three, it gives a first short term cause, such as the fyrd being sent home on 8 September, or Stamford Bridge on 25 September, with the date. Four, it gives a second short term cause, such as the march of about 250 miles, the exhaustion of the army, or the Norman advantage in archers and cavalry against a shield wall. Five, it uses accurate detail: real dates, real names, and the nineteen day gap between the two battles. Six, it reaches a judgement, meaning it says which reason mattered most and gives a reason for choosing it, rather than just stopping after the list. An answer that lists five reasons with no judgement caps out well below full marks, and so does an answer that gives a judgement with no dates to support it.", "topic": "Norman Conquest: explaining a defeat using long term causes, short term causes and a trigger"}]}, "h7-norman-control": {"id": "h7-norman-control", "day": "Day 2", "subject": "History", "title": "How the Normans held England", "minutes": 25, "objective": "Describe how the Normans controlled England using castles, land, law and the Domesday survey, sort each method into the tool of control it belongs to, and argue which tool mattered most.", "extract": "THE FOUR TOOLS OF CONTROL\n\nFORCE. Soldiers and castles. Something people can see, and something they cannot get past.\n  Motte and bailey castles, thrown up in weeks out of earth and wood, from 1066 onwards.\n  The Harrying of the North, in the winter of 1069 to 1070.\n\nLAND. Who owns the ground people live on, and what they owe for it.\n  English lords replaced by Norman lords. By 1086 almost every large landholder in England was Norman.\n  Land was not a gift. It was held in return for service, usually a set number of days of fighting each year, and it could be taken back.\n\nLAW. The rules, the courts and the punishments.\n  Forest law, which turned huge areas into royal hunting ground and banned ordinary people from taking wood or game there.\n  The murdrum fine, a heavy fine on a whole district if a Norman was found murdered and the killer was not handed over.\n\nINFORMATION. Knowing exactly what you own.\n  The Domesday survey, ordered at Christmas 1085 and carried out in 1086.\n  It recorded who held each piece of land, who had held it before 1066, what it was worth, and what was on it.\n\nA FEW DATES\n25 December 1066  William is crowned in Westminster Abbey.\n1067 to 1071      Rebellions in different parts of England, including the north, the west and the fens.\n1069 to 1070      The Harrying of the North.\n1085              William orders the survey at his Christmas court in Gloucester.\n1086              The survey is carried out. In August the great landholders swear loyalty to William directly, at Salisbury.\n9 September 1087  William dies.", "teach": {"intro": ["William won the crown in one afternoon at Hastings. Holding it took him the next twenty one years, and there were rebellions somewhere in England almost every year from 1067 to 1071. There were perhaps ten or twenty thousand Normans in a country of around two million English people, so he could never simply hold the place down by weight of numbers.", "It helps to sort what he did into four tools. Force is what you can see and cannot get past. Land is who owns the ground under your feet. Law is the rules and who enforces them. Information is knowing exactly what you have.", "At GCSE the marks are not for listing the four. They are for arguing which one mattered most, backing it with examples, and then admitting honestly what the strongest point on the other side is. That is what a judgement question is, and it is where the top grades live."], "example": {"problem": "Which tool is a motte and bailey castle mainly an example of, and why?", "steps": ["Ask what it actually does. A castle is a base for armed men and a strong point that is hard to attack.", "Ask what people living nearby experience. They see it from their fields every day and they know they cannot get past it.", "That is a threat backed by soldiers, so it belongs under force.", "Then add the honest complication. The castle stands on land the baron was given, and the baron also ran the local court, so a castle helped the land tool and the law tool work as well. Saying that is worth far more than a flat one word answer."], "answer": "Force, mainly, although a castle also supported the land and law tools"}, "example2": {"problem": "Which tool is the Domesday survey an example of, and why did it matter?", "steps": ["Ask what it does. It writes down who holds each piece of land, what it is worth, and who held it before 1066.", "It does not knock anybody down, so it is not force.", "It is knowledge written down, so it belongs under information.", "Then say why knowledge is power here. Once William knows what every manor is worth, he knows exactly how much tax to demand, nobody can lie to him about it, and he has a written record of who owes what. He can also settle arguments over who owns what by pointing at the book."], "answer": "Information"}, "keyfact": "The Normans held England with four tools, force, land, law and information, and no single one would have worked on its own. In a judgement question, pick one, argue for it with examples, and then say honestly what the best case against it is."}, "questions": [{"id": "h7-norman-control:q1", "level": "easy", "type": "mc", "q": "In a motte and bailey castle, what is the motte?", "options": ["A steep mound of earth with a tower on top", "The ditch dug around the outside", "The village that grew up nearby", "The stone wall around a cathedral"], "answer": "A steep mound of earth with a tower on top", "hint": "One of the two words means the high bit and one means the low bit.", "explain": "The answer is the mound of earth with a tower on top. The motte is the high part, and height is the whole point: you can see for miles and anyone attacking has to climb towards you. The bailey is the walled yard at the bottom. Keep the pair together in your head as high bit and low bit, and you will never mix them up.", "topic": "Norman control: what a motte is"}, {"id": "h7-norman-control:q2", "level": "easy", "type": "text", "q": "The first Norman castles could be built in a few weeks because they were made from earth and one other cheap material. What was that material? Write one word.", "answer": "wood", "accept": ["wood", "Wood", "timber", "Timber", "wooden", "trees"], "hint": "It grows, it is everywhere in England, and it burns.", "explain": "The answer is wood, also called timber. Speed was the point. A motte and bailey castle could be thrown up in weeks using local labour, local earth and local trees, which meant William could plant one in a town within days of taking it. The weakness is obvious, because wood burns and rots, so the important ones were later rebuilt in stone. The White Tower at the Tower of London, begun in the 1070s, is the famous example of that second stage.", "topic": "Norman control: why early castles went up so fast"}, {"id": "h7-norman-control:q3", "level": "easy", "type": "mc", "q": "What was the bailey?", "options": ["The walled yard at the bottom of the mound, holding the stores, stables and workshops", "The tower on top of the mound", "The lord's private chapel", "A tax paid to the king"], "answer": "The walled yard at the bottom of the mound, holding the stores, stables and workshops", "hint": "If the motte is where you fight from, the bailey is where you keep everything you need.", "explain": "The answer is the walled yard at the bottom. The bailey is where the ordinary work of the castle happened: horses, food stores, workshops, soldiers' quarters. The motte was the last place to fall back to if the bailey was overrun. So the castle has two lines: an outer yard you can lose, and a mound you defend to the end.", "topic": "Norman control: what a bailey is"}, {"id": "h7-norman-control:q4", "level": "easy", "type": "mc", "q": "Who was at the top of the feudal pyramid in Norman England?", "options": ["The king", "The barons", "The knights", "The peasants"], "answer": "The king", "hint": "Everything below holds its land from the level above. So who holds land from nobody?", "explain": "The answer is the king. In this model the king owns all the land in the country. He grants large blocks to barons and bishops, who are called tenants in chief, in return for service. They grant smaller blocks to knights in return for fighting for them. At the bottom, peasants work the land and are not free to leave. The rule that makes the whole thing work is that land is never a gift. It is held in return for service, and it can be taken away.", "topic": "Norman control: the feudal pyramid"}, {"id": "h7-norman-control:q5", "level": "easy", "type": "text", "q": "What is the name of the great survey of England carried out in 1086? Write the name.", "answer": "Domesday Book", "accept": ["Domesday Book", "domesday book", "Domesday", "domesday", "the Domesday Book", "Doomsday Book", "doomsday book", "Doomsday", "doomsday"], "hint": "It is a book, and its nickname comes from the Day of Judgement.", "explain": "The answer is the Domesday Book. Note the spelling: Domesday, not Doomsday, although the nickname does come from doomsday, meaning the Day of Judgement, because there was no appealing against what it said. William ordered it at his Christmas court in Gloucester in 1085 and the survey was carried out in 1086. It did not cover everywhere. London, Winchester and most of the far north were left out.", "topic": "Norman control: the Domesday survey"}, {"id": "h7-norman-control:q6", "level": "medium", "type": "mc", "q": "What was the Harrying of the North?", "options": ["A campaign in the winter of 1069 to 1070 in which William's soldiers destroyed villages, crops, animals and seed grain across northern England after repeated rebellions", "A tax collected from every household in the north", "A great meeting at which the northern lords swore loyalty to William", "The building of a wall across northern England"], "answer": "A campaign in the winter of 1069 to 1070 in which William's soldiers destroyed villages, crops, animals and seed grain across northern England after repeated rebellions", "hint": "It followed a rebellion, it happened in winter, and the worst of it was not the fighting.", "explain": "The answer is the campaign of destruction in the winter of 1069 to 1070. It followed rebellion in the north that had support from a Danish fleet. The cruellest part was the destruction of seed grain, because grain you have not eaten is next year's crop, so burning it causes famine months after the soldiers have gone. The effects were long lasting: the Domesday survey still recorded a great deal of land in Yorkshire as waste in 1086, sixteen years later. The wall across northern England is Hadrian's Wall, which the Romans began in AD 122, nearly a thousand years earlier.", "topic": "Norman control: the Harrying of the North"}, {"id": "h7-norman-control:q7", "level": "medium", "type": "mc", "q": "Which tool of control is castle building mainly an example of?", "options": ["Force", "Land", "Law", "Information"], "answer": "Force", "hint": "What does a castle do to somebody who is thinking about rebelling?", "explain": "The answer is force. A castle is a permanent, visible threat with armed men inside it, and it is designed to be impossible to get past. Two extra points are worth making in an answer. First, a castle is not only about winning battles, it is about stopping them from being started, because a rebellion that has to take a castle first usually does not begin. Second, a castle also propped up the other tools, since the baron who held it also held the land around it and ran the local court from it.", "topic": "Norman control: classifying castles as force"}, {"id": "h7-norman-control:q8", "level": "medium", "type": "text", "q": "Which tool of control is the Domesday survey an example of? Write one word from this list: force, land, law, information.", "answer": "information", "accept": ["information", "Information", "info", "Info"], "hint": "It does not knock anyone down and it does not put anyone in court. It writes things down.", "explain": "The answer is information. Domesday harmed nobody directly. What it did was tell William exactly what every manor in England was worth, who held it, and who had held it before 1066. That mattered for three reasons: he could set taxes accurately, nobody could lie to him about what they owed, and he could settle arguments over ownership by pointing at the record. Knowledge is a slow tool compared with a castle, but it lasts, and the book still exists today.", "topic": "Norman control: classifying Domesday as information"}, {"id": "h7-norman-control:q9", "level": "medium", "type": "text", "q": "William was crowned in 1066. The Domesday survey was carried out in 1086. How many years passed between the two? Write the number only.", "answer": "20", "accept": ["20", "20 years", "twenty", "twenty years"], "hint": "Both dates are AD, so subtract the smaller from the larger.", "explain": "The answer is 20. Both dates are on the same side of year 1, so you simply subtract: 1086 minus 1066 is 20. That gap is worth thinking about. It took William twenty years of castles, land grants, rebellions and a Harrying before he was secure enough to send officials into every shire and demand answers, and he died only a year after the survey, on 9 September 1087.", "topic": "Norman control: calculating the gap from 1066 to Domesday"}, {"id": "h7-norman-control:q10", "level": "medium", "type": "mc", "q": "Why did taking land from English lords and giving it to Normans help William control England?", "options": ["It removed the English lords who could have led rebellions, and it tied the new Norman lords to William, because they only kept their land by staying loyal", "It made English peasants richer, so they stopped complaining", "It meant fewer castles had to be built", "It was demanded by the Pope as a condition of the invasion"], "answer": "It removed the English lords who could have led rebellions, and it tied the new Norman lords to William, because they only kept their land by staying loyal", "hint": "It solves two problems at once. Think about who loses and who gains.", "explain": "The answer is the first option, and the key is that it does two jobs at once. A rebellion needs a leader with money, followers and land, so taking the land away from English lords removed the people who could have started one. At the same time, the Normans who received the land held it only in return for service, so their wealth depended entirely on William staying in power. By 1086 the Domesday record shows that almost all the large landholders in England were Norman. Be careful not to overstate it, though, because plenty of English people still held smaller amounts of land further down.", "topic": "Norman control: why redistributing land worked"}, {"id": "h7-norman-control:q11", "level": "stretch", "type": "mc", "q": "The Normans introduced the murdrum fine. If a Norman was found murdered and the killer was not handed over, the whole local district had to pay a heavy fine. Which tool of control does that show, and how did it work?", "options": ["Law. It used the courts to make English neighbours police each other, because handing over a killer was cheaper than everyone paying the fine", "Force. It meant soldiers were sent to burn the village down", "Land. It transferred the village to a Norman lord", "Information. It recorded the names of everyone in the district"], "answer": "Law. It used the courts to make English neighbours police each other, because handing over a killer was cheaper than everyone paying the fine", "hint": "Nobody needs to send an army for this one. Ask who ends up doing the work of enforcing it.", "explain": "The answer is law, and the clever, nasty part is that it costs the Normans almost nothing. By punishing the whole district rather than the killer, it gives every neighbour a direct financial reason to give the killer up or to stop the killing happening in the first place. That is enforcement done by the local people, for free. Forest law worked in a similar way, turning large areas into royal hunting ground with harsh punishments for taking wood or game. Law is the cheapest of the four tools, because unlike a castle it does not need soldiers standing in it.", "topic": "Norman control: law as a tool, and the murdrum fine"}, {"id": "h7-norman-control:q12", "level": "stretch", "type": "mc", "q": "A monk named Orderic Vitalis, writing roughly sixty years afterwards, said that 100,000 people died in the Harrying of the North. Why are historians careful with that figure?", "options": ["Nobody counted, medieval writers often used big round numbers to mean very many, and the population of the whole region was probably not many times larger than that", "Because Orderic Vitalis never wrote anything about the Harrying", "Because the Harrying of the North never actually happened", "Because the Domesday Book gives an exact death toll instead"], "answer": "Nobody counted, medieval writers often used big round numbers to mean very many, and the population of the whole region was probably not many times larger than that", "hint": "Ask the simplest possible question about the number. Who counted, and how?", "explain": "The answer is the first option. There was no census, no registrar and no way to count the dead across a devastated region, so the number cannot be a
