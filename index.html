lanted side is extra information put there to catch you out. The area is 8 x 3 = 24, divided by 2, which is 12 cm^2.", "topic": "area: identifying the perpendicular height"}, {"id": "m13-area-triangle:q5", "level": "medium", "type": "text", "q": "A triangle has a base of 7 m and a perpendicular height of 4 m. What is its area, in m^2?", "answer": "14", "accept": ["14", "14m^2", "14 m^2", "14m2", "14 m2", "14.0"], "hint": "7 x 4, then halve.", "explain": "The answer is 14 m^2. Base x height: 7 x 4 = 28. Divide by 2: 28 divided by 2 = 14.", "topic": "area: triangle from base and height"}, {"id": "m13-area-triangle:q6", "level": "medium", "type": "text", "q": "A triangle has a base of 9 cm and a perpendicular height of 5 cm. What is its area, in cm^2?", "answer": "22.5", "accept": ["22.5", "22.5cm^2", "22.5 cm^2", "22.5cm2", "22.5 cm2", "45/2", "22.50"], "hint": "9 x 5 = 45. Half of 45 is not a whole number, and that is fine.", "explain": "The answer is 22.5 cm^2. Base x height: 9 x 5 = 45. Divide by 2: 45 divided by 2 = 22.5. Areas do not have to be whole numbers, so do not round it to 22 or 23.", "topic": "area: triangle with a decimal answer"}, {"id": "m13-area-triangle:q7", "level": "medium", "type": "text", "q": "A triangular field has a base of 12 m and a perpendicular height of 7 m. What is its area, in m^2?", "answer": "42", "accept": ["42", "42m^2", "42 m^2", "42m2", "42 m2", "42.0"], "hint": "12 x 7 first, then divide by 2.", "explain": "The answer is 42 m^2. Base x height: 12 x 7 = 84. Divide by 2: 84 divided by 2 = 42.", "topic": "area: triangle in context"}, {"id": "m13-area-triangle:q8", "level": "medium", "type": "text", "q": "A triangle has an area of 24 cm^2 and a base of 8 cm. What is its perpendicular height, in cm?", "answer": "6", "accept": ["6", "6cm", "6 cm", "6.0"], "hint": "Work backwards. Undo the divide by 2 first, then undo the multiply by the base.", "explain": "The answer is 6 cm. Working backwards, undo the halving first: 24 x 2 = 48, which is base x height. Then undo the base: 48 divided by 8 = 6 cm. Check it forwards: 8 x 6 = 48, and 48 divided by 2 = 24 cm^2.", "topic": "area: working backwards to find a height"}, {"id": "m13-area-triangle:q9", "level": "medium", "type": "mc", "q": "Triangle A has a base of 6 cm and a perpendicular height of 8 cm. Triangle B has a base of 12 cm and a perpendicular height of 4 cm. Which has the bigger area?", "options": ["They are equal", "Triangle A", "Triangle B", "You cannot tell without the slanted sides"], "answer": "They are equal", "hint": "Work out both areas before deciding. Do not judge by the biggest single number.", "explain": "The answer is that they are equal. Triangle A: 6 x 8 = 48, divided by 2 = 24 cm^2. Triangle B: 12 x 4 = 48, divided by 2 = 24 cm^2. B has a longer base but is not as tall, and the two changes cancel out exactly. The slanted sides are not needed for area.", "topic": "area: comparing triangle areas"}, {"id": "m13-area-triangle:q10", "level": "stretch", "type": "text", "q": "The front of a tent is a triangle. Its base is 2.4 m and its perpendicular height is 1.5 m. What is the area of the front of the tent, in m^2?", "answer": "1.8", "accept": ["1.8", "1.8m^2", "1.8 m^2", "1.8m2", "1.8 m2", "1.80"], "hint": "2.4 x 1.5 = 3.6. Now halve it.", "explain": "The answer is 1.8 m^2. Base x height: 2.4 x 1.5 = 3.6. Divide by 2: 3.6 divided by 2 = 1.8 m^2. Estimate check: 2.4 is close to 2 and 1.5 is close to 2, so the rectangle is roughly 4 and the triangle roughly 2. 1.8 is about right.", "topic": "area: triangle with decimal measurements"}, {"id": "m13-area-triangle:q11", "level": "stretch", "type": "text", "q": "A house end wall is made of a rectangle with a triangle sitting on top of it. The rectangle is 8 m wide and 5 m tall. The triangle has a base of 8 m and a perpendicular height of 3 m. What is the total area of the wall, in m^2?", "answer": "52", "accept": ["52", "52m^2", "52 m^2", "52m2", "52 m2", "52.0"], "hint": "Work out the two shapes separately, then add them.", "explain": "The answer is 52 m^2. Rectangle: 8 x 5 = 40 m^2. Triangle: 8 x 3 = 24, divided by 2 = 12 m^2. Total: 40 + 12 = 52 m^2. Split any awkward shape into shapes you know, work out each one, then add.", "topic": "area: compound shape with a triangle"}, {"id": "m13-area-triangle:q12", "level": "stretch", "type": "text", "q": "A triangular sail has an area of 13.5 m^2 and a perpendicular height of 4.5 m. What is the length of its base, in m?", "answer": "6", "accept": ["6", "6m", "6 m", "6.0"], "hint": "Double the area first, then divide by the height.", "explain": "The answer is 6 m. Undo the halving: 13.5 x 2 = 27, which is base x height. Then divide by the height: 27 divided by 4.5 = 6 m. Check it forwards: 6 x 4.5 = 27, and 27 divided by 2 = 13.5 m^2.", "topic": "area: working backwards to find a base"}]}, "e5-fixit": {"id": "e5-fixit", "day": "Day 1", "subject": "English", "title": "Fixing, not spotting", "minutes": 30, "objective": "Produce a corrected version of a passage, fixing only the stated errors and leaving everything else untouched.", "extract": "PASSAGE A\nThe climb started at dawn. i packed rope, water and a spare torch. The first hour was easy, the second hour nearly finished me.\n\nPASSAGE B\nThe fire spread through the roof in minutes. Crew from the next station arrived and pulled the family out. Nobody knew how it starts.\n\nPASSAGE C\nWe reached the hut at dusk. The door was jammed, we forced it with a shoulder. Inside there was one dry blanket and a stove that does not work. i slept in my coat.\n\nPASSAGE D\nThe match was lost by half time. Our keeper had a broken finger, so the striker went in goal. He saved two shots and then let in four. Nobody blames him.\n\nPASSAGE E\nStorm took the fence down overnight. We found half of it in the field behind the house. Neighbour helped us drag the panels back.\n\nPASSAGE F\nThe boat left the harbour at four. i was the youngest on board by ten years. The sea was flat for an hour, and then the wind got up. Waves came over the rail, the skipper told us to sit low and hold on. By the time we turn back I could not feel my hands. It was best day I have ever had.\n\nPASSAGE G\nThe floodwater reached the top step by midnight. My uncle carried the dog upstairs, my cousin carried the radio. i sat on the landing and counted the minutes. Rain kept falling, nobody slept. In morning the water had dropped by a foot and we can see the road again.", "teach": {"intro": ["Spotting an error and fixing an error are two different jobs. You are good at spotting. This session is about the second job, which is handing in a version that is actually correct.", "Use the same routine every time. Read the passage once for sense, so you know what it is about. Then make one pass for each error type you are hunting. One pass for comma splices. One pass for tense. One pass for missing words. One pass for capital letters. Hunting one thing at a time beats hunting everything at once.", "The second rule matters just as much. Change only what is broken. If you are told there are three errors, you make three changes. You do not improve a word you were not asked to touch, and you do not add description. Every extra change is a new chance to be wrong, and markers count it against you."], "example": {"problem": "This short passage has two errors. Write the corrected version. \"The tide came in fast. i climbed the rocks, the water cut off the beach behind me.\"", "steps": ["Read once for sense. A boy climbs rocks because the tide cuts him off. Nothing confusing.", "Pass one, capital letters. The word i is a lower case i. It must be I. That is error one.", "Pass two, comma splices. Look at \"I climbed the rocks, the water cut off the beach behind me.\" Both halves could stand alone as sentences, and they are joined by only a comma. That is a comma splice. That is error two.", "Fix the splice with the smallest change that works. A full stop does it. So does the word \"and\" after the comma.", "Count your changes. Two changes for two errors. Now check you have not touched anything else. The words tide, fast, rocks and beach are all still there, exactly as they were."], "answer": "The tide came in fast. I climbed the rocks. The water cut off the beach behind me."}, "keyfact": "One pass per error type, and change only what is broken. If they say three errors, you make three changes and no more."}, "questions": [{"id": "e5-fixit:q1", "level": "easy", "type": "mc", "q": "Passage A contains a lower case i that should be a capital I. Which version fixes that error and changes nothing else?", "options": ["I packed rope, water and a spare torch.", "i packed rope, water and a spare torch.", "I packed a rope, some water and a spare torch.", "I packed rope, water and a spare torch that I had borrowed from my uncle."], "answer": "I packed rope, water and a spare torch.", "hint": "Find the version where the only difference from the original is the capital letter.", "explain": "The answer is \"I packed rope, water and a spare torch.\" The word I is always a capital when it means yourself. The second option changes nothing, so the error is still there. The third option adds \"a\" and \"some\", and the fourth adds a whole clause about an uncle. Both of those change material you were not asked to touch, which loses marks even though the capital letter is right.", "topic": "proofreading: capital I, minimal change"}, {"id": "e5-fixit:q2", "level": "easy", "type": "text", "q": "Passage B has one verb in the wrong tense. Write that single word exactly as it appears in the passage.", "answer": "starts", "accept": ["starts", "it starts", "\"starts\"", "how it starts"], "hint": "The rest of the passage is written in the past. Find the one verb that is not.", "explain": "The answer is starts. The passage is telling you about something that already happened, so it uses spread, arrived and pulled, which are all past tense. Then the last sentence says \"Nobody knew how it starts\", and starts is present tense. It should be started. A tense slip like this is easy to hear if you read the passage out loud.", "topic": "proofreading: spotting a tense slip"}, {"id": "e5-fixit:q3", "level": "easy", "type": "mc", "q": "Passage B is missing a small word before the word Crew. Which version fixes that and changes nothing else?", "options": ["A crew from the next station arrived and pulled the family out.", "Crew from the next station arrives and pulls the family out.", "A crew from the next station arrived and pulled the family out of the burning house.", "Crew from the next station arrived and pulled the family out."], "answer": "A crew from the next station arrived and pulled the family out.", "hint": "English usually needs a or the in front of a noun like crew. Then check that nothing else has moved.", "explain": "The answer is \"A crew from the next station arrived and pulled the family out.\" The noun crew needs an article in front of it, either a or the. The second option puts the verbs into the present tense, which is a new error, and it still has no article. The third option adds \"of the burning house\", which is material you were not asked to add. The fourth option is the original, unchanged.", "topic": "proofreading: missing article"}, {"id": "e5-fixit:q4", "level": "easy", "type": "mc", "q": "Passage D contains exactly one error, in the last sentence. Which version is correct?", "options": ["Nobody blamed him.", "Nobody blames him.", "Nobody blamed him for it, because it was not his fault.", "Nobody blame him."], "answer": "Nobody blamed him.", "hint": "The whole passage is in the past. Put that last verb into the past too, and stop there.", "explain": "The answer is \"Nobody blamed him.\" The passage uses was, had, went, saved and let, which are all past tense. Blames is present tense, so it slips out of line. Blamed fixes it with a one word change. The third option fixes the tense but bolts on a reason that was never in the passage, which is over-correcting. The fourth option, blame, does not agree with Nobody.", "topic": "proofreading: fixing a tense slip"}, {"id": "e5-fixit:q5", "level": "easy", "type": "mc", "q": "You are told a passage has three errors. You find all three and fix them. What should you do with the rest of the passage?", "options": ["Leave it exactly as it is.", "Improve any sentence that sounds a bit plain.", "Add more description so it reads better.", "Rewrite the ending so it is stronger."], "answer": "Leave it exactly as it is.", "hint": "Think about what the task actually asked you to do.", "explain": "The answer is to leave it exactly as it is. The task was to fix three errors, not to improve the writing. Every extra change you make is a fresh chance to introduce a mistake, and a marker comparing your version with the original will see changes that were not asked for. Three errors means three changes.", "topic": "proofreading: change only what is broken"}, {"id": "e5-fixit:q6", "level": "medium", "type": "mc", "q": "Passage A ends with a comma splice. Which version fixes it with the smallest change and leaves the rest alone?", "options": ["The first hour was easy. The second hour nearly finished me.", "The first hour was easy, the second hour nearly finished me.", "The first hour was easy, but the second hour, which was much steeper and much colder, nearly finished me.", "The first hour was easy the second hour nearly finished me."], "answer": "The first hour was easy. The second hour nearly finished me.", "hint": "Two complete sentences joined by only a comma need a full stop, a semicolon, or a joining word after the comma.", "explain": "The answer is \"The first hour was easy. The second hour nearly finished me.\" Both halves can stand alone, so a comma on its own is not strong enough to join them. A full stop is the smallest fix. The second option leaves the splice in place. The third option fixes the splice but also adds steeper and colder, which is material you were not asked to add. The fourth option removes the comma and creates a run-on, which is worse than the original.", "topic": "proofreading: fixing a comma splice"}, {"id": "e5-fixit:q7", "level": "medium", "type": "text", "q": "Passage C contains the phrase \"a stove that does not work\". It has a tense slip. Write the corrected phrase.", "answer": "a stove that did not work", "accept": ["a stove that did not work", "a stove that didn't work", "a stove that didnt work", "stove that did not work", "stove that didn't work", "a stove that did not work.", "that did not work"], "hint": "Everything else in the passage happened in the past. Match it.", "explain": "The answer is \"a stove that did not work\". The passage uses reached, was, jammed, forced and slept, which are all past tense. Does is present tense, so it does not match. Did fixes it. Note that only one word changes. The words stove, that, not and work all stay exactly as they were.", "topic": "proofreading: tense agreement across a passage"}, {"id": "e5-fixit:q8", "level": "medium", "type": "mc", "q": "Passage C says \"The door was jammed, we forced it with a shoulder.\" Which version fixes the error properly?", "options": ["The door was jammed, so we forced it with a shoulder.", "The door was jammed, we forced it with a shoulder.", "The door was jammed we forced it with a shoulder.", "The door was jammed, we forced it open with a shoulder and went straight inside."], "answer": "The door was jammed, so we forced it with a shoulder.", "hint": "A comma alone cannot join two complete sentences. A joining word after the comma can.", "explain": "The answer is \"The door was jammed, so we forced it with a shoulder.\" Adding the joining word so after the comma turns two separate sentences into one properly joined sentence. A full stop would also have worked. The second option is the original splice. The third deletes the comma and makes a run-on. The fourth still has the splice and also adds open and went straight inside, which is over-correcting.", "topic": "proofreading: joining word fix for a splice"}, {"id": "e5-fixit:q9", "level": "medium", "type": "mc", "q": "Passage E has two errors, both of them missing words. Which version fixes both and changes nothing else?", "options": ["The storm took the fence down overnight. We found half of it in the field behind the house. A neighbour helped us drag the panels back.", "Storm took the fence down overnight. We found half of it in the field behind the house. A neighbour helped us drag the panels back.", "The storm took the fence down overnight. We found half of it in the muddy field behind the house. A kind neighbour helped us drag the heavy panels back.", "The storm took the fence down overnight, we found half of it in the field behind the house. A neighbour helped us drag the panels back."], "answer": "The storm took the fence down overnight. We found half of it in the field behind the house. A neighbour helped us drag the panels back.", "hint": "Both errors are nouns sitting at the start of a sentence with no a or the in front of them.", "explain": "The answer is the first option. Storm needs The in front of it, and Neighbour needs A in front of it. That is two changes for two errors. The second option only fixes one of them. The third fixes both but also adds muddy, kind and heavy, so it changes material it was not asked to touch. The fourth fixes both but joins the first two sentences with a comma, which creates a comma splice you did not have before.", "topic": "proofreading: missing articles across a passage"}, {"id": "e5-fixit:q10", "level": "medium", "type": "text", "q": "Passage F ends with \"It was best day I have ever had.\" One small word is missing. Write that single missing word.", "answer": "the", "accept": ["the", "The", "\"the\""], "hint": "Say the sentence out loud. Something is missing just before best.", "explain": "The answer is the. The correct sentence is \"It was the best day I have ever had.\" When you use best, worst, first or last in front of a noun, you almost always need the in front of it, because there is only one of them. A missing article is easy to miss on the page but obvious when you read your work out loud.", "topic": "proofreading: article before a superlative"}, {"id": "e5-fixit:q11", "level": "medium", "type": "mc", "q": "A student was told to fix the two errors in Passage B. He handed in this: \"The fire spread through the roof in minutes. A crew from the next station arrived quickly and dragged the terrified family out. Nobody knew how it started.\" What is wrong with his version?", "options": ["He changed words he was not asked to change.", "He missed the tense slip.", "He missed the missing word.", "He created a comma splice."], "answer": "He changed words he was not asked to change.", "hint": "Put his version next to the original and list every single difference, not just the two fixes.", "explain": "The answer is that he changed words he was not asked to change. He did fix both errors: he added A in front of crew and changed starts to started. But he also added the word quickly, swapped pulled for dragged, and added terrified. That is three extra changes on top of the two he was asked for. In an exam or a marked piece, changes you were not asked to make are counted against you, because the task was correction, not rewriting.", "topic": "proofreading: recognising over-correction"}, {"id": "e5-fixit:q12", "level": "stretch", "type": "mc", "q": "Passage F has four errors. Which version fixes all four and changes nothing else?", "options": ["The boat left the harbour at four. I was the youngest on board by ten years. The sea was flat for an hour, and then the wind got up. Waves came over the rail. The skipper told us to sit low and hold on. By the time we turned back I could not feel my hands. It was the best day I have ever had.", "The boat left the harbour at four. I was the youngest on board by ten years. The sea was flat for an hour, and then the wind got up. Waves came over the rail. The skipper told us to sit low and hold on. By the time we turn back I could not feel my hands. It was the best day I have ever had.", "The boat left the harbour at four. I was the smallest and youngest on board by ten long years. The grey sea was flat for an hour, and then the wind got up. Huge waves came over the rail. The skipper shouted at us to sit low and hold on. By the time we turned back I could not feel my frozen hands. It was the best day I have ever had.", "The boat left the harbour at four. i was the youngest on board by ten years. The sea was flat for an hour, and then the wind got up. Waves came over the rail the skipper told us to sit low and hold on. By the time we turned back I could not feel my hands. It was the best day I have ever had."], "answer": "The boat left the harbour at four. I was the youngest on board by ten years. The sea was flat for an hour, and then the wind got up. Waves came over the rail. The skipper told us to sit low and hold on. By the time we turned back I could not feel my hands. It was the best day I have ever had.", "hint": "The four errors are a lower case i, a comma splice, a tense slip, and a missing word. Check all four, then check nothing else has moved.", "explain": "The answer is the first option. The four fixes are: i becomes I, the splice at \"Waves came over the rail, the skipper told us\" is cut into two sentences, turn becomes turned, and the is added before best day. The second option leaves the tense slip turn in place. The third option fixes all four but also adds smallest, long, grey, Huge and frozen, and swaps told for shouted, so it changes material it was not asked to touch. The fourth option leaves the lower case i and turns the splice into a run-on by deleting the comma.", "topic": "proofreading: multi-error correction with an over-correction trap"}, {"id": "e5-fixit:q13", "level": "stretch", "type": "mc", "q": "You have five minutes to correct a passage that you have been told contains four errors. Which way of working is most reliable?", "options": ["Read it once for sense, then make one pass for each error type, then read it once more to check nothing else has moved.", "Start at the first word and change anything that looks wrong as you go.", "Read the last sentence first and work backwards to the start.", "Rewrite the whole passage in your own words so that it is definitely correct."], "answer": "Read it once for sense, then make one pass for each error type, then read it once more to check nothing else has moved.", "hint": "Which method hunts one thing at a time, and which one hunts everything at once?", "explain": "The answer is the first option. Reading once for sense stops you fixing something that was never broken. Then hunting one error type at a time means your eye knows exactly what it is looking for, so you miss fewer. The final read is your over-correction check. Option two hunts everything at once, which is exactly how errors get missed. Option three is a spelling trick, not a grammar method. Option four throws away the original, which guarantees you have changed material you were not asked to change.", "topic": "proofreading: method and passes"}, {"id": "e5-fixit:q14", "level": "stretch", "type": "text", "q": "Passage G contains five errors. Two of them are the same error type. Write the name of that error type.", "answer": "comma splice", "accept": ["comma splice", "comma splices", "a comma splice", "two comma splices", "comma splicing", "splice", "splices"], "hint": "Look for a comma sitting between two halves that could each stand alone as a sentence. It happens twice.", "explain": "The answer is comma splice. It happens twice. First in \"My uncle carried the dog upstairs, my cousin carried the radio\", and again in \"Rain kept falling, nobody slept\". In both cases the comma is trying to do a full stop's job. The other three errors are a lower case i, a missing the before morning, and the tense slip can, which should be could.", "topic": "proofreading: identifying repeated error types"}, {"id": "e5-fixit:q15", "level": "stretch", "type": "long", "q": "Write out Passage F with all four errors corrected. Change nothing else. The four errors are: one lower case i, one comma splice, one tense slip, and one missing word.", "answer": "The boat left the harbour at four. I was the youngest on board by ten years. The sea was flat for an hour, and then the wind got up. Waves came over the rail. The skipper told us to sit low and hold on. By the time we turned back I could not feel my hands. It was the best day I have ever had.", "marks": 4, "hint": "Work in four passes. Capitals. Splices. Tense. Missing words. Then compare your version word by word with the original.", "explain": "A strong answer contains all four of these and nothing more. One, i becomes I in the second sentence. Two, the splice \"Waves came over the rail, the skipper told us to sit low and hold on\" is fixed, either with a full stop after rail, or with and after the comma, or with a semicolon. Three, \"By the time we turn back\" becomes \"By the time we turned back\". Four, \"It was best day\" becomes \"It was the best day\". Mark yourself down one mark for any word you changed that was not on this list, including added adjectives, swapped verbs, or a rewritten ending. Note that \"The sea was flat for an hour, and then the wind got up\" is already correct, because its two halves are properly joined by the word and, so leave it exactly as it is.", "topic": "proofreading: producing a corrected passage, four errors"}, {"id": "e5-fixit:q16", "level": "stretch", "type": "long", "q": "Write out Passage G with all five errors corrected. Change nothing else. The five errors are: two comma splices, one lower case i, one missing word, and one tense slip.", "answer": "The floodwater reached the top step by midnight. My uncle carried the dog upstairs. My cousin carried the radio. I sat on the landing and counted the minutes. Rain kept falling. Nobody slept. In the morning the water had dropped by a foot and we could see the road again.", "marks": 5, "hint": "Two of the five are the same type, so your comma splice pass has to find both. Do not stop after the first one.", "explain": "A strong answer contains all five of these and nothing more. One, the splice \"My uncle carried the dog upstairs, my cousin carried the radio\" is fixed with a full stop or with and after the comma. Two, the splice \"Rain kept falling, nobody slept\" is fixed the same way. Three, i becomes I. Four, \"In morning\" becomes \"In the morning\". Five, \"we can see the road again\" becomes \"we could see the road again\". Take a mark off for each error you missed, and take a mark off for any change you made that is not on this list. The sentences about the floodwater reaching the top step and the water dropping by a foot were already correct and should be untouched.", "topic": "proofreading: producing a corrected passage, five errors"}]}, "e6-apostrophes2": {"id": "e6-apostrophes2", "day": "Day 2", "subject": "English", "title": "Apostrophes, properly this time", "minutes": 25, "objective": "Place an apostrophe correctly for singular owners, plural owners ending in s, and irregular plurals, and tell all of those apart from contractions.", "extract": "PARAGRAPH H\nThe teams changing room was quiet. The players kit was still in the bags, and the coaches whistles were on the table. Someone had left the childrens shin pads by the door. The boys faces said everything. Nobody wanted to be first out.\n\nNote: there is one team, eleven players, several coaches, several children and several boys.", "teach": {"intro": ["An apostrophe has exactly two jobs. Job one is a contraction, where two words are squashed into one and the apostrophe marks the missing letters, as in do not becoming don't. Job two is ownership, where the apostrophe shows that something belongs to somebody. Nothing else. An apostrophe never makes a plural.", "For ownership, use this three step procedure every single time. Step one, write down the owner word on its own. Step two, ask whether that owner word already ends in the letter s. Step three, place the apostrophe. If the owner word does not end in s, add apostrophe then s. If the owner word already ends in s, add the apostrophe only, after the s.", "The trap is the owner word. The owner is whoever owns the thing, not the thing being owned. If several boys own bikes, the owner word is boys, which ends in s, so it is the boys' bikes. If several children own coats, the owner word is children, which does not end in s, so it is the children's coats. Children, men, women and people are plurals that do not end in s, so they take apostrophe s just like a single owner does."], "example": {"problem": "Write this using an apostrophe: the whistles belonging to the coaches.", "steps": ["Step one, find the owner word. Who owns the whistles? The coaches do. So the owner word is coaches.", "Write the owner word on its own: coaches. Do not touch the word whistles yet. The thing being owned never gets an apostrophe.", "Step two, does coaches end in s? Yes it does.", "Step three, because it already ends in s, add the apostrophe only, straight after the s. That gives coaches'.", "Now put the owned thing after it: coaches' whistles."], "answer": "the coaches' whistles"}, "keyfact": "Find the owner word first. No s on the end means add 's. An s already on the end means add ' only. Children, men, women and people do not end in s, so they take 's."}, "questions": [{"id": "e6-apostrophes2:q1", "level": "easy", "type": "mc", "q": "What are the two jobs an apostrophe does?", "options": ["It shows ownership, or it shows where letters have been removed.", "It shows that a word is plural.", "It shows the end of a sentence.", "It shows that somebody is speaking."], "answer": "It shows ownership, or it shows where letters have been removed.", "hint": "Think about don't on one side and Sam's bike on the other.", "explain": "The answer is ownership or missing letters. Those are the only two jobs. In don't, the apostrophe stands where the o of not was removed. In Sam's bike, it shows the bike belongs to Sam. An apostrophe never makes a plural, so two dogs has no apostrophe at all.", "topic": "apostrophes: the two jobs"}, {"id": "e6-apostrophes2:q2", "level": "easy", "type": "mc", "q": "Which of these uses an apostrophe for a contraction rather than for ownership?", "options": ["don't", "Sam's bike", "the dog's lead", "the man's coat"], "answer": "don't", "hint": "In one of these, the apostrophe is standing in for a letter that has been taken out.", "explain": "The answer is don't. It is do and not squashed together, and the apostrophe marks the missing o. The other three all show ownership: the bike belongs to Sam, the lead belongs to the dog, the coat belongs to the man.", "topic": "apostrophes: contraction versus possession"}, {"id": "e6-apostrophes2:q3", "level": "easy", "type": "text", "q": "A bike belongs to one boy. Write the phrase using an apostrophe. Start with the word the.", "answer": "the boy's bike", "accept": ["the boy's bike", "boy's bike", "the boy’s bike", "boy’s bike"], "hint": "Owner word is boy. Does boy end in s? No. So add apostrophe then s.", "explain": "The answer is the boy's bike. Step one, the owner word is boy. Step two, boy does not end in s. Step three, so add apostrophe then s, giving boy's. The word bike never gets an apostrophe, because it is the thing being owned, not the owner.", "topic": "apostrophes: singular possession"}, {"id": "e6-apostrophes2:q4", "level": "easy", "type": "mc", "q": "Several bikes belong to several boys. Which version is correct?", "options": ["the boys' bikes", "the boy's bikes", "the bikes' boys", "the bike's belonged to the boys"], "answer": "the boys' bikes", "hint": "The owner word is boys, plural. It already ends in s, so where does the apostrophe go?", "explain": "The answer is the boys' bikes. The owner word is boys, because more than one boy owns them. Boys already ends in s, so you add the apostrophe only, after the s. The option boy's bikes means one boy owning several bikes, which is not what was described. The word bikes never takes an apostrophe here, because the bikes do not own anything.", "topic": "apostrophes: plural possession, plural ends in s"}, {"id": "e6-apostrophes2:q5", "level": "easy", "type": "mc", "q": "The coats belong to the children. Which version is correct?", "options": ["the children's coats", "the childrens' coats", "the childrens coats", "the childrens's coats"], "answer": "the children's coats", "hint": "Write the owner word on its own first. It is children. Now check the last letter.", "explain": "The answer is the children's coats. The owner word is children, and children does not end in s, so you add apostrophe then s. The word childrens does not exist in English, so any option built on it is wrong before you even place the apostrophe. Children is already plural, which is why it never needs an extra s to make it plural.", "topic": "apostrophes: irregular plural possession"}, {"id": "e6-apostrophes2:q6", "level": "easy", "type": "text", "q": "One team owns one changing room. Complete this with an apostrophe: the ___ changing room. Write only the missing word.", "answer": "team's", "accept": ["team's", "the team's", "team’s", "the team’s"], "hint": "Owner word is team. Does team end in s? No.", "explain": "The answer is team's. The owner word is team, which does not end in s, so you add apostrophe then s. Be careful here. Teams with no apostrophe means more than one team, and teams' would mean several teams sharing one room. There is only one team, so it is team's.", "topic": "apostrophes: singular collective noun"}, {"id": "e6-apostrophes2:q7", "level": "medium", "type": "mc", "q": "A club has several coaches. The whistles belong to all of them. Which version is correct?", "options": ["the coaches' whistles", "the coache's whistles", "the coaches whistles", "the coachs' whistles"], "answer": "the coaches' whistles", "hint": "The plural of coach is coaches. That word already ends in s.", "explain": "The answer is the coaches' whistles. The owner word is coaches, the plural of coach. It already ends in s, so the apostrophe goes after the s and no extra s is added. Coache's is not a word. Coaches whistles has no apostrophe at all, so it shows no ownership. Coachs is a misspelling, because words ending in ch take es in the plural.", "topic": "apostrophes: plural possession with an es plural"}, {"id": "e6-apostrophes2:q8", "level": "medium", "type": "mc", "q": "A changing room is used by all the men in the squad. Which version is correct?", "options": ["the men's changing room", "the mens' changing room", "the mens changing room", "the men's' changing room"], "answer": "the men's changing room", "hint": "Men is already the plural of man. Does it end in s?", "explain": "The answer is the men's changing room. The owner word is men, which is already plural but does not end in s. That means it follows the same rule as a single owner: add apostrophe then s. Mens is not a word, so mens' and mens are both wrong. Men's' has two apostrophes, which is never correct.", "topic": "apostrophes: irregular plural, men"}, {"id": "e6-apostrophes2:q9", "level": "medium", "type": "text", "q": "The kit belongs to all eleven players. Complete this: the ___ kit. Write only the missing word.", "answer": "players'", "accept": ["players'", "the players'", "players’", "the players’"], "hint": "Eleven players, so the owner word is players. It ends in s already.", "explain": "The answer is players'. The owner word is players, plural, and it already ends in s, so you add the apostrophe only, after the s. Watch this one carefully. Player's kit would mean one single player's kit. The number of owners decides where the apostrophe sits, so count the owners before you write anything.", "topic": "apostrophes: plural possession, counting the owners"}, {"id": "e6-apostrophes2:q10", "level": "medium", "type": "mc", "q": "Your family has one dog. Which sentence uses every apostrophe correctly?", "options": ["It's been raining all day, and our dog's lead is still wet.", "Its been raining all day, and our dogs lead is still wet.", "It's been raining all day, and our dogs' lead is still wet.", "Its' been raining all day, and our dog's lead is still wet."], "answer": "It's been raining all day, and our dog's lead is still wet.", "hint": "One apostrophe here is doing the contraction job and one is doing the ownership job. Check both.", "explain": "The answer is the first option. It's is a contraction of it has, so it needs an apostrophe where the missing letters were. Dog's shows the lead belongs to one dog, and dog does not end in s, so it takes apostrophe then s. The second option has no apostrophes at all. The third option uses dogs', which would mean more than one dog, and you only have one. The fourth option writes Its', which is never a word.", "topic": "apostrophes: contraction and possession in one sentence"}, {"id": "e6-apostrophes2:q11", "level": "medium", "type": "text", "q": "Write this as a phrase with an apostrophe: the shin pads belonging to the children. Start with the word the.", "answer": "the children's shin pads", "accept": ["the children's shin pads", "children's shin pads", "the children’s shin pads", "children’s shin pads"], "hint": "Owner word is children. It does not end in s, so use the same rule you would use for one owner.", "explain": "The answer is the children's shin pads. Children is the owner word. It is plural but it does not end in s, so it takes apostrophe then s, exactly like boy's or team's. The common mistake is childrens', which tries to apply the plural rule to a word that never needed it. The test is simple: look at the last letter of the owner word, not at whether it feels plural.", "topic": "apostrophes: irregular plural possession in a phrase"}, {"id": "e6-apostrophes2:q12", "level": "medium", "type": "mc", "q": "You want to write about a bag owned by one woman. Follow the procedure. Which version is correct?", "options": ["the woman's bag", "the womans' bag", "the women's bag", "the womans bag"], "answer": "the woman's bag", "hint": "Woman is one person. Women is more than one. Read the question again before you choose.", "explain": "The answer is the woman's bag. Step one, the owner word is woman, singular. Step two, woman does not end in s. Step three, add apostrophe then s. The option women's bag would be correct only if several women owned it. Womans and womans' are not words, because the plural of woman is women, not womans.", "topic": "apostrophes: singular versus irregular plural owner"}, {"id": "e6-apostrophes2:q13", "level": "stretch", "type": "mc", "q": "Paragraph H says \"The boys faces said everything.\" There are several boys. Which correction is right?", "options": ["The boys' faces said everything.", "The boy's faces said everything.", "The boys's faces said everything.", "The boys faces' said everything."], "answer": "The boys' faces said everything.", "hint": "Several boys own the faces, so the owner word is the plural boys.", "explain": "The answer is \"The boys' faces said everything.\" The owner word is boys, plural, ending in s, so the apostrophe goes after the s with no extra s added. Boy's would mean one boy with several faces. Boys's doubles up the s and is not used for a plural like this. Faces' puts the apostrophe on the thing being owned, which is always wrong, because faces do not own anything here.", "topic": "apostrophes: correcting plural possession in context"}, {"id": "e6-apostrophes2:q14", "level": "stretch", "type": "mc", "q": "There is one team, eleven players and several children. Which sentence uses every apostrophe correctly?", "options": ["The team's bus was late, so the players' warm-up was cut short and the children's tickets were checked on board.", "The teams bus was late, so the player's warm-up was cut short and the childrens tickets were checked on board.", "The team's bus was late, so the players warm-up was cut short and the children's tickets were checked on board.", "The teams' bus was late, so the players' warm-up was cut short and the childrens' tickets were checked on board."], "answer": "The team's bus was late, so the players' warm-up was cut short and the children's tickets were checked on board.", "hint": "Do the three owners one at a time. Team, singular. Players, plural ending in s. Children, plural not ending in s.", "explain": "The answer is the first option. Team is one owner not ending in s, so team's. Players is a plural ending in s, so players'. Children is a plural not ending in s, so children's. The second option drops apostrophes and treats eleven players as one. The third option leaves players with no apostrophe at all. The fourth option uses teams' for a single team and childrens', which is not a word.", "topic": "apostrophes: three owner types in one sentence"}, {"id": "e6-apostrophes2:q15", "level": "stretch", "type": "text", "q": "Homes belong to a group of people. Complete this: the ___ homes. Write only the missing word.", "answer": "people's", "accept": ["people's", "the people's", "people’s", "the people’s"], "hint": "People is already plural. Check its last letter before you decide.", "explain": "The answer is people's. People is one of the plurals that does not end in s, along with children, men, women and mice. Because it does not end in s, it takes apostrophe then s, exactly like a single owner would. Peoples' would only be right if you were talking about several different peoples, meaning several nations, which is not what was asked.", "topic": "apostrophes: irregular plural, people"}, {"id": "e6-apostrophes2:q16", "level": "stretch", "type": "long", "q": "Paragraph H contains five apostrophe errors. Write out the whole paragraph with all five corrected. Change nothing else.", "answer": "The team's changing room was quiet. The players' kit was still in the bags, and the coaches' whistles were on the table. Someone had left the children's shin pads by the door. The boys' faces said everything. Nobody wanted to be first out.", "marks": 5, "hint": "For each one, write the owner word down on its own first, then check whether it ends in s, then place the apostrophe.", "explain": "A strong answer has these five and nothing else changed. One, team's, because there is one team and team does not end in s. Two, players', because eleven players own the kit and players ends in s. Three, coaches', because several coaches own the whistles and coaches ends in s. Four, children's, because children is plural but does not end in s. Five, boys', because several boys own the faces and boys ends in s. Take a mark off for each one missed. Also check that you have not added an apostrophe to bags, whistles, pads or minutes, because those words are just plurals and own nothing. The last sentence, Nobody wanted to be first out, has no apostrophe in it and must be left alone.", "topic": "apostrophes: correcting a full paragraph"}]}, "e7-wordclasses": {"id": "e7-wordclasses", "day": "Day 3", "subject": "English", "title": "Nouns, verbs, adjectives, adverbs", "minutes": 25, "objective": "Sort words into nouns, verbs, adjectives and adverbs by what they do in the sentence, using the remove test and the move test.", "extract": "PASSAGE J\nThe old lorry crawled slowly up the hill. Its engine coughed twice and then died completely. Two men jumped out and pushed hard against the tailgate. The heavy load shifted, and the brakes held. Nobody spoke.", "teach": {"intro": ["Do not try to memorise four definitions. Work out what the word is doing in that sentence. A noun names something. A verb is the doing or the being. An adjective changes a noun. An adverb changes a verb.", "Two tests do most of the work. The remove test: take the word out. If the sentence collapses, it was probably the verb, because a sentence cannot run without one. If the sentence still stands, it was probably an adverb or an adjective, because those are add-ons. The move test: an adverb can usually be shifted somewhere else in the sentence and it still works, as in \"Slowly the lorry crawled\" and \"The lorry crawled slowly\". A verb cannot be moved like that.", "There is a third test for verbs. A verb can change to show a different time. Roared can become roars or will roar. Try that on loudly and you get nothing, because loudly has no tenses. Adverbs often end in ly, but plenty do not: fast, hard, soon, often, never, well, twice and here are all adverbs with no ly on the end. So ly is a clue, not a rule."], "example": {"problem": "In the sentence \"The engine roared loudly as the truck pulled away\", which word is the adverb and which is the verb?", "steps": ["Try the tense test on roared. Can it change time? Yes: the engine roars, the engine will roar. So roared is a verb.", "Try the tense test on loudly. Can you say the engine loudlied? No. So loudly is not a verb.", "Try the remove test on loudly. Take it out and you get \"The engine roared as the truck pulled away\". That still works, so loudly is an add-on.", "Try the move test on loudly. \"The engine loudly roared as the truck pulled away\" still works. Adverbs move, verbs do not.", "Ask what loudly is telling you. It tells you how the engine roared, and roared is a verb. A word that changes a verb is an adverb."], "answer": "roared is the verb, loudly is the adverb"}, "keyfact": "Verbs can change tense and cannot be removed. Adverbs can be removed and moved, and they tell you how, when or where a verb happened."}, "questions": [{"id": "e7-wordclasses:q1", "level": "easy", "type": "mc", "q": "What job does a verb do in a sentence?", "options": ["It tells you what is happening, or what someone or something does or is.", "It names a person, place or thing.", "It describes a noun.", "It joins two sentences together."], "answer": "It tells you what is happening, or what someone or something does or is.", "hint": "Think about the word doing.", "explain": "The answer is that a verb tells you what is happening. Ran, shouted, fell, is and was are all verbs. Naming a person, place or thing is the noun's job. Describing a noun is the adjective's job. Joining two sentences is a conjunction's job.", "topic": "word classes: what a verb does"}, {"id": "e7-wordclasses:q2", "level": "easy", "type": "mc", "q": "In the sentence \"The engine roared loudly as the truck pulled away\", which word is the adverb?", "options": ["loudly", "roared", "engine", "truck"], "answer": "loudly", "hint": "Which word tells you how the roaring happened, and could be removed without breaking the sentence?", "explain": "The answer is loudly. It tells you how the engine roared, so it is changing a verb, and that is exactly what an adverb does. Roared is the verb, because it is the action and it can change tense to roars. Engine and truck are nouns, because they name things. Remove loudly and the sentence still stands, which confirms it is an add-on, not the verb.", "topic": "word classes: identifying the adverb"}, {"id": "e7-wordclasses:q3", "level": "easy", "type": "mc", "q": "In the same sentence, \"The engine roared loudly as the truck pulled away\", which word is a verb?", "options": ["roared", "loudly", "engine", "away"], "answer": "roared", "hint": "Which word can you put into a different tense?", "explain": "The answer is roared. Put it into a different time and it changes: the engine roars, the engine will roar. That only works on verbs. Loudly cannot be put into any tense, so it is not a verb. Engine is a noun. Away tells you the direction of pulling. Note that pulled is also a verb in this sentence, but it was not one of the options.", "topic": "word classes: identifying the verb"}, {"id": "e7-wordclasses:q4", "level": "easy", "type": "text", "q": "Write the noun in this sentence: The torch failed.", "answer": "torch", "accept": ["torch", "the torch", "\"torch\""], "hint": "Which word names a thing you could hold?", "explain": "The answer is torch. It names an object, so it is a noun. A quick check is whether you can put the or a in front of it, and the torch works fine. Failed is the verb, because it is what happened and it can change tense to fails.", "topic": "word classes: identifying the noun"}, {"id": "e7-wordclasses:q5", "level": "easy", "type": "mc", "q": "Which test proves that a word is a verb?", "options": ["You can change it to show a different time, so roared becomes roars.", "It ends in the letters ly.", "You can put the word the in front of it.", "It sits at the end of the sentence."], "answer": "You can change it to show a different time, so roared becomes roars.", "hint": "Only one class of word has tenses.", "explain": "The answer is the tense test. Only verbs change to show past, present and future. Ending in ly is a clue for adverbs, not verbs. Putting the in front of a word is a test for nouns. Position in the sentence proves nothing, because verbs turn up in all sorts of places.", "topic": "word classes: the tense test"}, {"id": "e7-wordclasses:q6", "level": "medium", "type": "mc", "q": "Which of these words is an adverb even though it does not end in ly?", "options": ["soon", "quiet", "runner", "broken"], "answer": "soon", "hint": "Which one tells you when something happens?", "explain": "The answer is soon. In \"He will leave soon\", the word soon tells you when the leaving happens, so it is changing a verb, which makes it an adverb. Quiet is an adjective, because it describes a noun, as in a quiet room. Runner is a noun, because it names a person. Broken describes a noun, as in a broken gate. Fast, hard, often, never and well are more adverbs with no ly.", "topic": "word classes: adverbs without ly"}, {"id": "e7-wordclasses:q7", "level": "medium", "type": "mc", "q": "In the sentence \"The heavy load shifted suddenly\", which word is the adjective?", "options": ["heavy", "load", "shifted", "suddenly"], "answer": "heavy", "hint": "Which word is describing a noun, rather than describing an action?", "explain": "The answer is heavy. It sits next to the noun load and tells you what the load is like, so it changes a noun, which is the adjective's job. Load is that noun. Shifted is the verb, because it is the action and it can change tense to shifts. Suddenly tells you how the shifting happened, so it changes a verb, making it an adverb.", "topic": "word classes: identifying the adjective"}, {"id": "e7-wordclasses:q8", "level": "medium", "type": "text", "q": "In the sentence \"Two men pushed hard against the tailgate\", write the adverb.", "answer": "hard", "accept": ["hard", "\"hard\""], "hint": "It has no ly on the end. Ask which word tells you how they pushed.", "explain": "The answer is hard. It tells you how they pushed, and pushed is the verb, so hard is changing a verb and is therefore an adverb. Remove it and \"Two men pushed against the tailgate\" still works, which proves it is an add-on. This one catches people out because there is no ly, but ly is only a clue, never a rule.", "topic": "word classes: adverb with no ly in context"}, {"id": "e7-wordclasses:q9", "level": "medium", "type": "mc", "q": "Take the sentence \"The dog barked wildly\" and delete the word wildly. What happens, and what does it prove?", "options": ["The sentence still works as The dog barked, which shows wildly was an add-on and not the verb.", "The sentence collapses, which shows wildly was the verb.", "The sentence turns into a question.", "The sentence loses its noun."], "answer": "The sentence still works as The dog barked, which shows wildly was an add-on and not the verb.", "hint": "Try deleting barked instead and compare what happens.", "explain": "The answer is the first option. The dog barked is a complete sentence, so wildly was not carrying the sentence. Now try deleting barked instead: The dog wildly is not a sentence at all, because the action has gone. That is the remove test. Whatever you cannot delete is doing the verb's job, and whatever you can delete is usually an adverb or an adjective.", "topic": "word classes: the remove test"}, {"id": "e7-wordclasses:q10", "level": "medium", "type": "mc", "q": "Look at this line from Passage J: \"Its engine coughed twice and then died completely.\" Which sorting is correct?", "options": ["coughed and died are verbs, twice and completely are adverbs", "coughed and completely are verbs, twice and died are adverbs", "engine and coughed are nouns, died is an adverb", "twice and completely are verbs, coughed and died are adverbs"], "answer": "coughed and died are verbs, twice and completely are adverbs", "hint": "Run the tense test on all four words and see which two can change time.", "explain": "The answer is the first option. Coughed becomes coughs, and died becomes dies, so both pass the tense test and are verbs. Twice tells you how many times the coughing happened, and completely tells you how thoroughly it died, so both are changing verbs and are adverbs. Notice that twice has no ly and is still an adverb. Engine is a noun, because it names a thing.", "topic": "word classes: sorting verbs from adverbs in a sentence"}, {"id": "e7-wordclasses:q11", "level": "stretch", "type": "mc", "q": "Which piece of evidence best proves that slowly in \"The old lorry crawled slowly up the hill\" is an adverb and not a verb?", "options": ["You can move it, and Slowly the old lorry crawled up the hill still works.", "You can put the word the in front of it.", "It comes after the noun.", "You can change it to past tense, so it becomes slowlied."], "answer": "You can move it, and Slowly the old lorry crawled up the hill still works.", "hint": "Verbs cannot be picked up and dropped somewhere else in the sentence. Adverbs usually can.", "explain": "The answer is the move test. Slowly can go to the front, the middle or the end and the sentence still works, which is typical adverb behaviour. Try that with crawled and the sentence falls apart, because verbs are anchored. Putting the in front is a noun test. Coming after a noun proves nothing. And slowlied is not a word, which is itself proof that slowly has no tenses and therefore is not a verb.", "topic": "word classes: the move test"}, {"id": "e7-wordclasses:q12", "level": "stretch", "type": "text", "q": "In the sentence \"Its engine coughed twice and then died completely\", one adverb ends in ly. Write that adverb.", "answer": "completely", "accept": ["completely", "\"completely\""], "hint": "Two words in this sentence are adverbs. You want the one with ly on the end.", "explain": "The answer is completely. It tells you how thoroughly the engine died, so it is changing the verb died. The other adverb in the sentence is twice, which tells you how many times the engine coughed, but twice has no ly. This is a good reminder that a sentence can contain adverbs with and without ly at the same time.", "topic": "word classes: adverbs with and without ly"}, {"id": "e7-wordclasses:q13", "level": "stretch", "type": "mc", "q": "In the sentence \"The fast car pulled away fast\", the word fast appears twice. Which statement is correct?", "options": ["The first fast is an adjective describing car, and the second fast is an adverb describing how it pulled away.", "Both are adjectives, because fast is always an adjective.", "Both are adverbs, because fast is always an adverb.", "The first is an adverb and the second is an adjective."], "answer": "The first fast is an adjective describing car, and the second fast is an adverb describing how it pulled away.", "hint": "Ask what each one is attached to. One sits next to a noun. One sits next to a verb.", "explain": "The answer is the first option. The first fast sits in front of the noun car and tells you what the car is like, so it is doing an adjective's job. The second fast sits after the verb pulled and tells you how the pulling happened, so it is doing an adverb's job. This is the whole point of working out what a word does rather than memorising a list. The same word can belong to different classes depending on the job it is doing in that sentence.", "topic": "word classes: same word, different class"}, {"id": "e7-wordclasses:q14", "level": "stretch", "type": "long", "q": "From Passage J, choose one noun, one verb, one adjective and one adverb. For each one, name the word, say its class, and say which test you used to prove it.", "answer": "Noun: lorry. It names a thing, and you can put the in front of it, giving the lorry. Verb: crawled. It is the action, and it passes the tense test because it can become crawls. Adjective: heavy. It sits in front of the noun load and tells you what the load is like. Adverb: slowly. It tells you how the lorry crawled, it passes the remove test because The old lorry crawled up the hill still works, and it passes the move test because Slowly the old lorry crawled up the hill also works.", "marks": 4, "hint": "Pick words from different sentences so you are not guessing from one line. Give the test, not just the label.", "explain": "A strong answer names four separate words and gives real evidence for each. One mark for a correct noun with a reason, such as lorry, engine, men, tailgate, load, brakes or hill, proved by putting the or a in front. One mark for a correct verb with a reason, such as crawled, coughed, died, jumped, pushed, shifted, held or spoke, proved by the tense test. One mark for a correct adjective with a reason, such as old or heavy, proved by showing it sits with a noun and describes it. One mark for a correct adverb with a reason, such as slowly, twice, completely or hard, proved by the remove test or the move test. Naming the word with no test given is worth half. Saying an adverb is right just because it ends in ly is not enough, because twice and hard are adverbs with no ly.", "topic": "word classes: applying all four classes with evidence"}]}, "e8-write-plan": {"id": "e8-write-plan", "day": "Day 4", "subject": "English", "title": "Planning beats winging it", "minutes": 30, "objective": "Build a two minute plan for a timed piece and keep three minutes back at the end to proofread it.", "extract": "A PLAN WRITTEN IN TWO MINUTES\n\nTitle: The night the power went out.\n\nOpening image: a whole street of black windows, and one torch beam moving along the pavement.\n\nMiddle 1: inside the flat, the fridge stops humming and the silence turns out to be the loudest thing in the room.\n\nMiddle 2: on the stairwell, meeting a neighbour who is holding a candle and cannot keep her hand still.\n\nEnding, decided before I start: the lights come back on at four in the morning and nobody cheers, they just go to bed.\n\nProofread list: capital letters, full stops, tense stays in the past, no comma splices.", "teach": {"intro": ["Starting to write with no plan feels faster. It is not. Without a plan you run out of ideas halfway down the page, so you repeat yourself, and you have no ending, so you stop dead or you rush one. Markers can see both of those from across the room.", "The plan takes two minutes and has four lines. An opening image, which is one thing the reader can see, not a summary. Middle one, a single moment you can develop. Middle two, a different single moment. Then the ending, decided before you write a word, so everything you write is heading somewhere. Under those four lines, write your proofread list.", "Two developed middles beat five undeveloped ones. Five ideas listed and dropped is a shopping list. Two ideas with real detail is writing. Then keep three minutes back at the end, put the pen down, and read what you have actually written rather than what you meant to write. In those three minutes you fix errors only. You do not start improving sentences that were never broken."], "example": {"problem": "You have 25 minutes to write a description called \"The last train\". Plan it in two minutes.", "steps": ["Opening image, one thing the reader can see. One platform light still on, and a man asleep on the bench underneath it.", "Middle 1, one moment to develop. The board flickers and every destination disappears except one.", "Middle 2, a different moment. The train arrives with every carriage empty and the doors open on nobody.", "Ending, decided now. I get on, the man on the bench does not, and the doors close between us.", "Proofread list, written under the plan. Capital letters. Full stops. Tense stays in the past. No comma splices.", "Now check the clock. Two minutes for the plan, twenty minutes writing, three minutes proofreading."], "answer": "A four line plan plus a proofread list, written in two minutes, leaving twenty minutes to write and three to check."}, "keyfact": "Two minutes plan, then write, then three minutes to proofread. Opening image, two developed middles, an ending you decided before you started."}, "questions": [{"id": "e8-write-plan:q1", "level": "easy", "type": "mc", "q": "You have 25 minutes to write a description. Roughly how long should you spend planning it?", "options": ["About 2 minutes", "No time at all", "About 10 minutes", "About 15 minutes"], "answer": "About 2 minutes", "hint": "Long enough to decide where you are going, short enough to leave real writing time.", "explain": "The answer is about 2 minutes. That is enough to fix an opening image, two middles and an ending, which is all you actually need. No planning at all leaves you with no ending. Ten or fifteen minutes eats the writing time, and a plan that long is just the piece written twice.", "topic": "timed writing: how long to plan"}, {"id": "e8-write-plan:q2", "level": "easy", "type": "mc", "q": "Which is the better approach to a timed writing task?", "options": ["Spend two minutes on a plan, then write, then save three minutes to check.", "Start writing and see where it goes.", "Write as fast as possible and hand it in early.", "Write the ending first and hope the rest fits around it."], "answer": "Spend two minutes on a plan, then write, then save three minutes to check.", "hint": "Which of these has a decided ending and a check at the end?", "explain": "The answer is the first option. Plan, write, check. Starting with no plan is the most common way to lose marks, because the piece drifts and the ending is rushed or missing. Writing fast and handing in early throws away the proofread, which is free marks. Writing the ending first and hoping is just a plan with three quarters of it missing.", "topic": "timed writing: plan versus no plan"}, {"id": "e8-write-plan:q3", "level": "easy", "type": "mc", "q": "What are the four parts of the two minute plan?", "options": ["Opening image, middle 1, middle 2, decided ending", "Title, characters, setting, moral", "Beginning, middle, middle, middle", "Introduction, three body paragraphs, conclusion, bibliography"], "answer": "Opening image, middle 1, middle 2, decided ending", "hint": "Two of the four parts are the middles.", "explain": "The answer is opening image, middle 1, middle 2, decided ending. Four lines, and under them your proofread list. The second option is a story planning sheet for a much longer piece. The third has no ending, which is the exact problem the plan exists to solve. The fourth is the shape of an essay, not a description or a narrative.", "topic": "timed writing: the four part plan"}, {"id": "e8-write-plan:q4", "level": "easy", "type": "text", "q": "In a 25 minute writing task, how many minutes should you keep back at the end for proofreading? Write the number.", "answer": "3", "accept": ["3", "three", "3 minutes", "three minutes", "3 mins"], "hint": "It is a small number, but you protect it no matter how much you still want to write.", "explain": "The answer is 3. Three minutes is enough to catch capital letters, full stops, tense slips and comma splices, which are the errors that cost the most and take the least time to fix. You protect that time even if the piece feels unfinished, because a finished piece full of errors scores lower than a slightly shorter piece that is clean.", "topic": "timed writing: protecting proofreading time"}, {"id": "e8-write-plan:q5", "level": "easy", "type": "mc", "q": "What does a decided ending mean?", "options": ["You know how the piece ends before you write the first sentence.", "The ending is a surprise even to you.", "You write two endings and pick the better one at the end.", "The ending is the longest part of the piece."], "answer": "You know how the piece ends before you write the first sentence.", "hint": "Think about why you would want to know the destination before you set off.", "explain": "The answer is that you know how it ends before you start. If you know the destination, every sentence can point at it, and you never hit the last two minutes with no idea how to stop. Surprising yourself sounds good but usually means running out of road. Writing two endings wastes time you do not have. The ending is usually short, not long.", "topic": "timed writing: why the ending is decided first"}, {"id": "e8-write-plan:q6", "level": "medium", "type": "mc", "q": "Which of these is a strong opening image for a description called The last train?", "options": ["One platform light still on, and a man asleep on the bench underneath it.", "Trains are interesting and there are many different types of train.", "I am going to describe the last train and how it made me feel.", "It was a normal day and nothing much happened at first."], "answer": "One platform light still on, and a man asleep on the bench underneath it.", "hint": "An image is something the reader can actually see. Which one could you draw?", "explain": "The answer is the first option. It is one specific thing a reader can see, and it puts them on the platform straight away. The second option is general information about trains and shows the reader nothing. The third announces what you are about to do instead of doing it. The fourth opens with nothing happening, which gives the reader no reason to keep reading.", "topic": "timed writing: choosing an opening image"}, {"id": "e8-write-plan:q7", "level": "medium", "type": "mc", "q": "Look at the plan in the extract. Why is \"the fridge stops humming and the silence turns out to be the loudest thing in the room\" a good middle?", "options": ["It is one specific detail that can be developed into a paragraph, rather than a summary of everything that happened.", "It is very long.", "It tells the reader what the ending will be.", "It contains three adjectives."], "answer": "It is one specific detail that can be developed into a paragraph, rather than a summary of everything that happened.", "hint": "Ask whether you could write a whole paragraph about just that one thing.", "explain": "The answer is the first option. One small concrete detail gives you somewhere to go: what else stops, what you can suddenly hear, how long you stand there. A middle that says \"the power went out and it was scary\" is a summary, and summaries cannot be developed. Length, hints about the ending and adjective counts have nothing to do with whether a middle will grow into a paragraph.", "topic": "timed writing: what makes a developed middle"}, {"id": "e8-write-plan:q8", "level": "medium", "type": "text", "q": "In the plan in the extract, what is written down last, after the ending?", "answer": "proofread list", "accept": ["proofread list", "the proofread list", "proofreading list", "a proofread list", "proofread checklist", "the proofreading list", "proof read list"], "hint": "It is the list of things you will hunt for in the last three minutes.", "explain": "The answer is the proofread list. Writing it during the plan matters, because at the end you will be tired and short of time, and a written list stops you drifting. In that plan the list is capital letters, full stops, tense stays in the past, and no comma splices. Those are the four errors most likely to cost you, so they go on the list before you write a word.", "topic": "timed writing: the proofread list"}, {"id": "e8-write-plan:q9", "level": "medium", "type": "mc", "q": "You have three minutes left and you find a comma splice in your second paragraph. What should you do?", "options": ["Fix that one sentence and carry on checking the rest.", "Rewrite the whole paragraph so it definitely reads better.", "Leave it, because there is not enough time.", "Cross out the ending and write a stronger one."], "answer": "Fix that one sentence and carry on checking the rest.", "hint": "The last three minutes are for fixing what is broken, not for improving what is not.", "explain": "The answer is to fix that one sentence and keep checking. A comma splice takes about four seconds to fix with a full stop. Rewriting the whole paragraph burns the rest of your time and risks introducing new errors into sentences that were already fine. Leaving it wastes a free mark. Replacing the ending in the last three minutes is how a decent piece turns into a mess.", "topic": "timed writing: what to do in the proofread window"}, {"id": "e8-write-plan:q10", "level": "medium", "type": "mc", "q": "Why do two developed middles beat five undeveloped ones?", "options": ["Because each idea gets enough detail to feel real, instead of being mentioned and dropped.", "Because markers count the number of paragraphs.", "Because five ideas take too long to spell.", "Because two is the correct number of paragraphs in all writing."], "answer": "Because each idea gets enough detail to feel real, instead of being mentioned and dropped.", "hint": "Think about what happens to an idea you only give one sentence to.", "explain": "The answer is the first option. An idea you give one sentence to is a list item. An idea you give six sentences to becomes something the reader can see, hear and believe. Five ideas in a 20 minute piece means about a sentence each, and the piece reads like a summary of a better piece. Markers are not counting paragraphs, and two is not a magic number, it is just what fits in the time.", "topic": "timed writing: depth over breadth"}, {"id": "e8-write-plan:q11", "level": "stretch", "type": "long", "q": "You have two minutes. Write a plan for a description called \"The morning after the storm\". Give an opening image, middle 1, middle 2, a decided ending, and a proofread list. Do not write the description itself.", "answer": "Opening image: a trampoline folded in half against the neighbour's wall, still rocking. Middle 1: the street covered in slate tiles, and people standing in doorways counting the gaps in their own roofs. Middle 2: the old tree at the end of the road on its side, with the whole root plate lifted out of the ground and a hole where it used to be. Ending, decided now: a man starts up a chainsaw, and the noise makes the street feel normal again. Proofread list: capital letters, full stops, tense stays in the past, no comma splices, no lower case i.", "marks": 5, "hint": "Every line should be something you could photograph. If a line could not be photographed, it is a summary, and summaries do not develop.", "explain": "A strong plan has five things. One mark for an opening image that is one concrete thing a reader can see, not a general statement about storms. One mark for a middle 1 that is a single moment with enough in it to grow into a paragraph. One mark for a middle 2 that is genuinely different from middle 1, in a different place or with different people, rather than the same idea again. One mark for an ending that is written down and decided, not left open. One mark for a proofread list naming at least three specific errors you personally make. Take a mark off if the whole plan is more than about six lines, because that is no longer a two minute plan.", "topic": "timed writing: producing a two minute plan"}, {"id": "e8-write-plan:q12", "level": "stretch", "type": "long", "q": "This is a 20 minute task. Write a description called \"The last house on the road\". Work to the clock: 2 minutes to plan, 15 minutes to write, 3 minutes to proofread. Write the plan first, then the description underneath it. Stop writing when 17 minutes have gone, whatever state the piece is in, and spend the last 3 minutes checking.", "answer": "Plan. Opening image: one house still standing at the end of the road, with the tarmac stopping about ten metres past its gate. Middle 1: the garden, where a washing line still has two pegs on it and the grass has gone up past the window sills. Middle 2: inside the porch, a stack of post going yellow and a coat still on the hook. Ending, decided now: a light comes on upstairs, and I walk back the way I came without running. Proofread list: capital letters, full stops, past tense, no comma splices.\n\nDescription. The road ran out about ten metres past the gate. After that there was hard mud, then grass, then nothing you could call a road at all. The house sat at the end of it with its back to the fields, and every other house on that road had been pulled down years before. Somebody had left this one.\n\nThe garden had gone up to my waist. A washing line ran from the corner of the house to a post, and two wooden pegs were still clipped to it, grey and soft with rain. The grass had climbed past the window sills, so the ground floor looked like it was sinking. I put my hand on the gate and the whole thing moved with me, because the bottom hinge had rusted through and there was nothing holding it but the catch.\n\nThe porch door was open a few inches. Inside, post had built up against the wall in a stack as high as my knee, and the paper at the bottom had gone yellow and stuck together. A coat still hung on the hook, a heavy one, the sort you wear to work outside. It had been there long enough for the shoulders to go pale where the light hit them. Everything in that porch was waiting for somebody who had stopped coming back.\n\nThen a light came on upstairs. It was not a torch and it was not a reflection. It was a proper yellow light, the kind you get from a lamp in a room somebody uses. I stood at the gate for a long time and watched it. Then I turned round and walked back down the road the way I had come, and I did not run, because running would have meant admitting what I already knew.", "marks": 20, "hint": "Two minutes on the plan before a single sentence of the description. When you start writing, keep an eye on the clock so you stop at seventeen minutes.", "explain": "Mark yourself against this checklist. Structure, 5 marks. There is a written plan. The opening is an image, not an announcement. There are exactly two middles and each gets a full paragraph or more. The ending is the one you decided in the plan, not one you found at the last minute. Development, 5 marks. Each middle stays on one thing and adds detail to it rather than moving on. You can point to at least three specific concrete details, such as the two pegs, the yellow post, the rusted hinge. Nothing is just listed and dropped. Language, 5 marks. Sentences vary in length. There is at least one short sentence used deliberately for effect. Detail comes from precise nouns and verbs, not from piling up adjectives. Nothing is repeated because you ran out of ideas. Accuracy, 5 marks. Capital letters throughout, including every I. Full stops in the right places. Tense stays in the past all the way through. No comma splices. Take a mark off for each one you find that you did not catch in your three minutes. Be honest about the clock as well. If you wrote for twenty minutes and did not proofread, the accuracy section cannot score full marks even if the writing is good, because the habit is the thing being trained here.", "topic": "timed writing: 20 minute extended description"}]}, "g5-sixfig": {"id": "g5-sixfig", "day": "Day 2", "subject": "Geography", "title": "Six figure grid references", "minutes": 25, "objective": "Give and read a six figure grid reference by splitting a grid square into tenths, eastings before northings.", "extract": "THE MAP: Ridgeway Forest.\n\nEach grid square on this map is 1 km by 1 km.\n\nEastings are the grid lines that run UP the map. You read them going left to right along the bottom. They are numbered 30, 31, 32, 33, 34, 35, 36.\n\nNorthings are the grid lines that run ACROSS the map. You read them going bottom to top up the side. They are numbered 50, 51, 52, 53, 54, 55, 56.\n\nA four figure reference names a whole square. You give the easting line on the left side of the square, then the northing line along the bottom of the square.\n\nA six figure reference names an exact point. Imagine every square split into 10 strips across and 10 strips up. You give the easting line, then the tenths east, then the northing line, then the tenths north.\n\nWHAT IS ON THE MAP, each with its six figure grid reference.\nThe church: 315 524\nThe youth hostel: 302 517\nThe stone bridge: 307 508\nThe car park: 334 553\nThe camp site: 345 536\nThe viewpoint: 318 545\nThe railway station: 356 512\n\nTwo other features.\nThe fishing lake fills most of square 3454.\nThe main forest road runs straight up the map along easting 33.\nThe River Ridd flows from west to east across the bottom of the map. It stays inside the row of squares between northing 50 and northing 51.", "teach": {"intro": ["A grid reference is a way of naming a place on a map using only numbers. The lines that run up the map are called eastings. You read them left to right. The lines that run across the map are called northings. You read them bottom to top.", "Eastings always come first. The saying is: along the corridor, then up the stairs. Go along the bottom of the map first, then go up the side. Swap that order and you land somewhere completely different.", "A four figure reference names a whole square. Each square is 1 km by 1 km, so a four figure reference covers a square kilometre. That is a big area to search.", "A six figure reference names an exact point. To get the extra two figures, imagine the square split into 10 strips across and 10 strips up. Count how many tenths east the place sits, then how many tenths north. One tenth of a kilometre is 100 metres, so six figures gets you to within 100 metres."], "example": {"problem": "A post box sits in square 3152. Inside that square it is 5 tenths east and 4 tenths north. Give its six figure grid reference.", "steps": ["Start with the eastings, because eastings always come first. The easting line on the left side of the square is 31.", "Add the tenths east. That is 5. So the first three figures are 315.", "Now the northings. The northing line along the bottom of the square is 52.", "Add the tenths north. That is 4. So the last three figures are 524.", "Write them together, eastings first: 315 524."], "answer": "315 524"}, "keyfact": "Eastings first, northings second, every single time. Along the corridor, then up the stairs."}, "questions": [{"id": "g5-sixfig:q1", "level": "easy", "type": "mc", "q": "In any grid reference, which part do you read first?", "options": ["The eastings, going along the bottom", "The northings, going up the side", "Whichever number is bigger", "It does not matter which way round"], "answer": "The eastings, going along the bottom", "hint": "Along the corridor, then up the stairs. Which one is the corridor?", "explain": "Eastings come first. The corridor is the flat part, so you go along the bottom of the map first, then up the side. If you read the northings first you name a totally different place, and in an exam that is a wasted mark for no reason.", "topic": "grid references: eastings before northings"}, {"id": "g5-sixfig:q2", "level": "easy", "type": "mc", "q": "How many figures are in a reference that names a whole grid square?", "options": ["Four", "Two", "Six", "Eight"], "answer": "Four", "hint": "One number for the easting line, one number for the northing line. Each of those numbers has two digits.", "explain": "Four figure
